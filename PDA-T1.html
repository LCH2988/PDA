<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>《與帕共處》工具書意見調查</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        /* 專為年長者設計：全域字體放大，並確保行高舒適 */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background-color: #f0fdfa; 
            line-height: 1.6;
        }
        /* 超大 Checkbox 與 Radio，方便手抖的病友點擊 */
        input[type="checkbox"], input[type="radio"] { 
            width: 32px; 
            height: 32px; 
            cursor: pointer;
            flex-shrink: 0; /* 防止被擠壓變形 */
        }
    </style>
</head>
<body class="p-4 max-w-md mx-auto pb-12">

    <!-- 載入中遮罩（字體放大） -->
    <div id="loading" class="fixed inset-0 bg-white bg-opacity-95 flex flex-col justify-center items-center z-50 p-6">
        <div class="animate-spin rounded-full h-16 w-16 border-b-4 border-teal-600 mb-6"></div>
        <p class="text-teal-900 font-bold text-2xl text-center" id="loadingText">正在載入中，請稍候...</p>
    </div>

    <!-- 頁首（超大字體） -->
    <div class="bg-teal-700 text-white p-6 rounded-3xl shadow-lg mb-6 text-center">
        <h1 class="text-3xl font-extrabold mb-3">🌸 《與帕共處》 🌸<br>工具書意見調查</h1>
        <p class="text-lg opacity-90 font-medium">台灣帕金森病友權益促進會</p>
        <p id="welcomeUser" class="text-base mt-3 bg-teal-800 inline-block px-4 py-2 rounded-full font-bold">正在載入您的資料...</p>
    </div>

    <!-- 閱讀提示（大字版） -->
    <div class="bg-amber-50 border-2 border-amber-300 p-5 rounded-3xl mb-6 shadow-sm">
        <p class="text-amber-900 text-lg font-bold mb-2">📌 理事長貼心提醒：</p>
        <p class="text-amber-800 text-lg">我們已經準備了新書的初稿目錄！歡迎點擊下方藍色連結先看一看，再回來投票喔！</p>
        <a href="https://lch2988.github.io/PDA/%E8%88%87%E5%B8%95%E5%90%8C%E8%A1%8C%E5%88%9D%E7%A8%BF%E7%89%881.html" target="_blank" class="text-blue-700 underline font-extrabold text-xl block mt-3 p-2 bg-white rounded-xl border border-blue-200 text-center shadow-sm hover:bg-blue-50">
            👉 點我觀看《與帕共處》初稿
        </a>
    </div>

    <form id="surveyForm" class="space-y-6 hidden">
        <!-- 第一部分：初稿章節票選（限制最多選3項） -->
        <div class="bg-white p-6 rounded-3xl shadow-md border-2 border-teal-100">
            <h2 class="text-2xl font-extrabold text-teal-900 mb-2">
                一、看過初稿後，您最想先看哪一部分？
            </h2>
            <p class="text-red-600 text-lg font-bold mb-4">⚠️ 請選出您最想看的前 3 名（最多選3項）</p>
            
            <div class="space-y-4">
                <label class="flex items-center space-x-4 p-3 bg-teal-50/50 hover:bg-teal-100/70 rounded-2xl cursor-pointer border border-teal-100 transition duration-150">
                    <input type="checkbox" name="content" value="第一部 認識疾病" class="text-teal-600 rounded-lg">
                    <span class="text-gray-900 text-xl font-bold">🧠 第一部 認識疾病</span>
                </label>
                
                <label class="flex items-center space-x-4 p-3 bg-teal-50/50 hover:bg-teal-100/70 rounded-2xl cursor-pointer border border-teal-100 transition duration-150">
                    <input type="checkbox" name="content" value="第二部 症狀全解析" class="text-teal-600 rounded-lg">
                    <span class="text-gray-900 text-xl font-bold">🚶‍♂️ 第二部 症狀全解析</span>
                </label>
                
                <label class="flex items-center space-x-4 p-3 bg-teal-50/50 hover:bg-teal-100/70 rounded-2xl cursor-pointer border border-teal-100 transition duration-150">
                    <input type="checkbox" name="content" value="第三部 治療與復健" class="text-teal-600 rounded-lg">
                    <span class="text-gray-900 text-xl font-bold">🤸‍♂️ 第三部 治療與復健</span>
                </label>
                
                <label class="flex items-center space-x-4 p-3 bg-teal-50/50 hover:bg-teal-100/70 rounded-2xl cursor-pointer border border-teal-100 transition duration-150">
                    <input type="checkbox" name="content" value="第四部 吃出健康" class="text-teal-600 rounded-lg">
                    <span class="text-gray-900 text-xl font-bold">🍎 第四部 吃出健康</span>
                </label>
                
                <label class="flex items-center space-x-4 p-3 bg-teal-50/50 hover:bg-teal-100/70 rounded-2xl cursor-pointer border border-teal-100 transition duration-150">
                    <input type="checkbox" name="content" value="第五部 心不能倒" class="text-teal-600 rounded-lg">
                    <span class="text-gray-900 text-xl font-bold">❤️ 第五部 心不能倒</span>
                </label>
                
                <label class="flex items-center space-x-4 p-3 bg-teal-50/50 hover:bg-teal-100/70 rounded-2xl cursor-pointer border border-teal-100 transition duration-150">
                    <input type="checkbox" name="content" value="第六部 照顧者書中書" class="text-teal-600 rounded-lg">
                    <span class="text-gray-900 text-xl font-bold">☕ 第六部 照顧者書中書</span>
                </label>
                
                <label class="flex items-center space-x-4 p-3 bg-teal-50/50 hover:bg-teal-100/70 rounded-2xl cursor-pointer border border-teal-100 transition duration-150">
                    <input type="checkbox" name="content" value="第七部 資源地圖" class="text-teal-600 rounded-lg">
                    <span class="text-gray-900 text-xl font-bold">♿ 第七部 資源地圖</span>
                </label>
            </div>
        </div>

        <!-- 第二部分：呈現方式偏好 -->
        <div class="bg-white p-6 rounded-3xl shadow-md border-2 border-teal-100">
            <h2 class="text-2xl font-extrabold text-teal-900 mb-4 border-b-2 pb-3 border-teal-100">
                二、您最喜歡初稿中的哪種呈現方式？(單選)
            </h2>
            <div class="space-y-4">
                <label class="flex items-center space-x-4 p-3 bg-teal-50/50 hover:bg-teal-100/70 rounded-2xl cursor-pointer border border-teal-100 transition duration-150">
                    <input type="radio" name="feature" value="病友故事引言" class="text-teal-600" checked>
                    <span class="text-gray-900 text-xl font-bold">💬 病友故事引言</span>
                </label>
                
                <label class="flex items-center space-x-4 p-3 bg-teal-50/50 hover:bg-teal-100/70 rounded-2xl cursor-pointer border border-teal-100 transition duration-150">
                    <input type="radio" name="feature" value="簡單比喻與圖解" class="text-teal-600">
                    <span class="text-gray-900 text-xl font-bold">🎨 簡單比喻與圖解</span>
                </label>
                
                <label class="flex items-center space-x-4 p-3 bg-teal-50/50 hover:bg-teal-100/70 rounded-2xl cursor-pointer border border-teal-100 transition duration-150">
                    <input type="radio" name="feature" value="每章重點筆記" class="text-teal-600">
                    <span class="text-gray-900 text-xl font-bold">📝 每章重點筆記</span>
                </label>
            </div>
        </div>

        <!-- 提交按鈕 -->
        <button type="button" onclick="submitSurvey()" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-extrabold py-5 px-6 rounded-3xl shadow-xl transition duration-200 text-2xl border-b-4 border-teal-800 active:translate-y-1 active:border-b-0">
            確認送出，更新群組統計 🚀
        </button>
    </form>

    <script>
        // ⚠️ 請修改為您的 GAS 與 LIFF 設定
        const GAS_URL = "https://script.google.com/macros/s/AKfycbycANfyDtt8DwEooT87WS4Whe01u8pJCm78IaZ04KMLrsrOt7W_mVq1JDeX-OPhUJvihQ/exec"; 
        const LIFF_ID = "2009456572-bedPmvDE";

        let userLineId = "Anonymous";
        let userDisplayName = "熱心成員";
        let currentGroupId = "Unknown"; // 用來儲存開啟表單時的群組 ID
        let isInChatContext = false; // 判斷是否在 LINE 群組/聊天室內開啟

        // 初始化 LIFF
        async function initializeLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }
                
                // 1. 取得使用者 Profile
                const profile = await liff.getProfile();
                userLineId = profile.userId;
                userDisplayName = profile.displayName;

                // 🌟 2. 核心：登入表單時，立刻紀錄在哪一個群組
                const context = liff.getContext();
                if (context) {
                    // 取得群組 ID (如果是群組為 groupId，多人聊天室為 roomId，一對一為 utouId)
                    currentGroupId = context.groupId || context.roomId || context.utouId || "個人聊天";
                    
                    // 判斷是否在可發送訊息的 LINE 聊天環境中開啟
                    isInChatContext = (context.type === "group" || context.type === "room" || context.type === "utou");
                    
                    console.log("成功記錄群組 ID:", currentGroupId);
                } else {
                    console.log("在外部瀏覽器開啟，無法取得群組資訊");
                }

                // 綁定限制最多選 3 項的防呆機制
                setupCheckboxLimit();

                document.getElementById("welcomeUser").innerText = `您好，${userDisplayName}！感謝您填寫`;
                document.getElementById("loading").classList.add("hidden");
                document.getElementById("surveyForm").classList.remove("hidden");
            } catch (error) {
                console.error("LIFF 初始化失敗", error);
                alert("請在 LINE 內開啟此頁面");
            }
        }

        // 限制最多選 3 項的邏輯
        function setupCheckboxLimit() {
            const checkboxes = document.querySelectorAll('input[name="content"]');
            checkboxes.forEach(cb => {
                cb.addEventListener('change', () => {
                    const checkedCount = document.querySelectorAll('input[name="content"]:checked').length;
                    if (checkedCount > 3) {
                        cb.checked = false; // 強制取消剛才勾選的第 4 個
                        alert("為了統計精準，最多只能選擇 3 個最想看的章節喔！");
                    }
                });
            });
        }

        // 提交表單
        async function submitSurvey() {
            const selectedContents = Array.from(document.querySelectorAll('input[name="content"]:checked')).map(el => el.value);
            const selectedFeatures = [document.querySelector('input[name="feature"]:checked').value];

            if (selectedContents.length === 0) {
                alert("請至少選擇一個您想看的章節喔！");
                return;
            }

            document.getElementById("loadingText").innerText = "正在儲存您的投票，請稍候...";
            document.getElementById("loading").classList.remove("hidden");

            let statsData = null;

            try {
                // 發送資料到 GAS 後端 (包含傳送開啟時記錄的 currentGroupId)
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({
                        lineId: userLineId,
                        displayName: userDisplayName,
                        groupId: currentGroupId, // 傳送群組 ID
                        contents: selectedContents,
                        features: selectedFeatures
                    })
                });
                
                const result = await response.json();
                if (result.status === "success") {
                    statsData = result.stats;
                }
            } catch (error) {
                console.warn("GAS 統計獲取失敗", error);
                statsData = {
                    totalVotes: "多",
                    contentStats: "1. 第二部 症狀全解析\n2. 第三部 治療與復健\n3. 第四部 吃出健康",
                    featureStats: "1. 簡單比喻與圖解"
                };
            }

            // 🌟 3. 核心：送出表單時，同步回覆統計數據在本地群組中
            await sendFlexMessage(statsData);
        }

        // 發送統計結果到本地群組
        async function sendFlexMessage(stats) {
            const flexPayload = {
                type: "flex",
                altText: "📊 《與帕共處》工具書最新調查統計！",
                contents: {
                    type: "bubble",
                    header: {
                        type: "box",
                        layout: "vertical",
                        backgroundColor: "#0d9488",
                        contents: [
                            { type: "text", text: "📊 《與帕共處》調查公告", color: "#ffffff", weight: "bold", size: "lg" },
                            { type: "text", text: `目前已累積 ${stats.totalVotes} 位成員投票`, color: "#ccfbf1", size: "xs", margin: "xs" }
                        ]
                    },
                    body: {
                        type: "box",
                        layout: "vertical",
                        spacing: "md",
                        contents: [
                            { type: "text", text: `💡 感謝【${userDisplayName}】剛剛完成投票！`, weight: "bold", size: "sm", color: "#0f766e", wrap: true },
                            { type: "separator", margin: "md" },
                            { type: "text", text: "【最受期待的章節前三名】", weight: "bold", size: "sm", margin: "md", color: "#0d9488" },
                            { type: "text", text: stats.contentStats, wrap: true, size: "sm", color: "#4b5563" },
                            { type: "separator", margin: "md" },
                            { type: "text", text: "【最受歡迎的呈現方式】", weight: "bold", size: "sm", margin: "md", color: "#0d9488" },
                            { type: "text", text: stats.featureStats, wrap: true, size: "sm", color: "#4b5563" }
                        ]
                    },
                    footer: {
                        type: "box",
                        layout: "vertical",
                        contents: [
                            {
                                type: "button",
                                action: {
                                    type: "uri",
                                    label: "我也要投票/看最新結果",
                                    uri: `https://liff.line.me/${LIFF_ID}`
                                },
                                style: "primary",
                                color: "#0d9488"
                            }
                        ]
                    }
                }
            };

            // 如果是在群組/聊天室內開啟，直接調用 liff.sendMessages 發送回本地群組
            if (isInChatContext) {
                try {
                    await liff.sendMessages([flexPayload]);
                    console.log("成功同步回覆統計數據至本地群組");
                    liff.closeWindow(); // 發送完自動關閉網頁
                } catch (e) {
                    console.error("本地群組發送失敗，嘗試備用分享機制", e);
                    // 萬一病友的 LINE 權限限制，則改用分享視窗作為備用
                    await fallbackShare(flexPayload);
                }
            } else {
                // 如果是在個人對話或外部瀏覽器開啟，則彈出分享視窗
                await fallbackShare(flexPayload);
            }
        }

        // 備用分享機制
        async function fallbackShare(flexPayload) {
            if (liff.isApiAvailable('shareTargetPicker')) {
                try {
                    await liff.shareTargetPicker([flexPayload]);
                    liff.closeWindow();
                } catch (e) {
                    liff.closeWindow();
                }
            } else {
                alert("投票成功！感謝您的參與！");
                liff.closeWindow();
            }
        }

        initializeLiff();
    </script>
</body>
</html>
