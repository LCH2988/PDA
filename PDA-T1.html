<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帕金森生活工具書調查</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background-color: #f0fdfa; }
        input[type="checkbox"] { width: 24px; height: 24px; cursor: pointer; }
    </style>
</head>
<body class="p-4 max-w-md mx-auto">

    <!-- 載入中遮罩 -->
    <div id="loading" class="fixed inset-0 bg-white bg-opacity-90 flex flex-col justify-center items-center z-50">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-teal-600 mb-4"></div>
        <p class="text-teal-800 font-bold" id="loadingText">載入中，請稍候...</p>
    </div>

    <!-- 頁首 -->
    <div class="bg-teal-600 text-white p-6 rounded-2xl shadow-lg mb-6 text-center">
        <h1 class="text-2xl font-bold mb-2">🌸 帕金森工具書調查 🌸</h1>
        <p class="text-sm opacity-90">台灣帕金森病友權益促進會 關心您</p>
        <p id="welcomeUser" class="text-xs mt-2 bg-teal-700 inline-block px-3 py-1 rounded-full">正在載入您的資料...</p>
    </div>

    <form id="surveyForm" class="space-y-6 hidden">
        <!-- 第一部分 -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-teal-100">
            <h2 class="text-lg font-bold text-teal-800 mb-3 border-b pb-2 border-teal-100">一、您最想在書中看到哪些內容？(可複選)</h2>
            <div class="space-y-3">
                <label class="flex items-start space-x-3 p-2 hover:bg-teal-50 rounded-lg cursor-pointer">
                    <input type="checkbox" name="content" value="藥物與症狀調適" class="mt-1 text-teal-600 rounded">
                    <span class="text-gray-700 text-base">💊 藥物與症狀調適 (開關現象、異動症)</span>
                </label>
                <label class="flex items-start space-x-3 p-2 hover:bg-teal-50 rounded-lg cursor-pointer">
                    <input type="checkbox" name="content" value="居家防跌與凍步" class="mt-1 text-teal-600 rounded">
                    <span class="text-gray-700 text-base">🚶‍♂️ 居家防跌倒與「凍步」解決方法</span>
                </label>
                <label class="flex items-start space-x-3 p-2 hover:bg-teal-50 rounded-lg cursor-pointer">
                    <input type="checkbox" name="content" value="居家復健運動" class="mt-1 text-teal-600 rounded">
                    <span class="text-gray-700 text-base">🤸‍♂️ 簡單易學的居家復健運動 (含發音)</span>
                </label>
                <label class="flex items-start space-x-3 p-2 hover:bg-teal-50 rounded-lg cursor-pointer">
                    <input type="checkbox" name="content" value="吞嚥與飲食營養" class="mt-1 text-teal-600 rounded">
                    <span class="text-gray-700 text-base">🍎 吞嚥困難應對與便秘、飲食建議</span>
                </label>
                <label class="flex items-start space-x-3 p-2 hover:bg-teal-50 rounded-lg cursor-pointer">
                    <input type="checkbox" name="content" value="政府長照與福利" class="mt-1 text-teal-600 rounded">
                    <span class="text-gray-700 text-base">♿ 身障鑑定、長照2.0與政府補助</span>
                </label>
            </div>
        </div>

        <!-- 第二部分 -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-teal-100">
            <h2 class="text-lg font-bold text-teal-800 mb-3 border-b pb-2 border-teal-100">二、您希望這本書具備什麼貼心功能？(可複選)</h2>
            <div class="space-y-3">
                <label class="flex items-start space-x-3 p-2 hover:bg-teal-50 rounded-lg cursor-pointer">
                    <input type="checkbox" name="feature" value="大字大圖" class="mt-1 text-teal-600 rounded">
                    <span class="text-gray-700 text-base">🔍 字體特大、多圖少字，閱讀不吃力</span>
                </label>
                <label class="flex items-start space-x-3 p-2 hover:bg-teal-50 rounded-lg cursor-pointer">
                    <input type="checkbox" name="feature" value="完全攤平" class="mt-1 text-teal-600 rounded">
                    <span class="text-gray-700 text-base">📖 書本可完全攤平，手抖也好翻閱</span>
                </label>
                <label class="flex items-start space-x-3 p-2 hover:bg-teal-50 rounded-lg cursor-pointer">
                    <input type="checkbox" name="feature" value="影音連結" class="mt-1 text-teal-600 rounded">
                    <span class="text-gray-700 text-base">🎥 掃 QR Code 看運動或照護示範影片</span>
                </label>
                <label class="flex items-start space-x-3 p-2 hover:bg-teal-50 rounded-lg cursor-pointer">
                    <input type="checkbox" name="feature" value="實用記錄表" class="mt-1 text-teal-600 rounded">
                    <span class="text-gray-700 text-base">📝 附帶用藥/症狀記錄表，方便看診</span>
                </label>
            </div>
        </div>

        <!-- 提交按鈕 -->
        <button type="button" onclick="submitSurvey()" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-4 px-6 rounded-2xl shadow-lg transition duration-200 text-lg">
            確認送出，並更新群組統計 🚀
        </button>
    </form>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyvCileRKrk_m7Jcy8l1rCSUT7k4vJ-HhnGXPJ0KIn5G_NQ0HBzFA5fUaqCXhIqC0GPCw/exec"; 
        const LIFF_ID = "2009456572-bedPmvDE";

        let userLineId = "Anonymous";
        let userDisplayName = "熱心成員";
        let currentGroupId = "Unknown"; // 用來記錄群組 ID
        let isInChatContext = false; // 判斷是否在聊天室內打開

        // 初始化 LIFF
        async function initializeLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }
                
                // 1. 取得使用者 Profile
                const profile = await liff.getProfile();
                userLineId = profile.userId;
                userDisplayName = profile.displayName;

                // 2. 取得開啟的上下文 (Context)
                const context = liff.getContext();
                if (context) {
                    // 記錄來源群組 ID (如果是群組 groupId，如果是多人聊天室 roomId，如果是一對一 utouId)
                    currentGroupId = context.groupId || context.roomId || context.utouId || "個人聊天";
                    isInChatContext = (context.type === "group" || context.type === "room" || context.type === "utou");
                }

                document.getElementById("welcomeUser").innerText = `您好，${userDisplayName}！感謝您填寫`;
                document.getElementById("loading").classList.add("hidden");
                document.getElementById("surveyForm").classList.remove("hidden");
            } catch (error) {
                console.error("LIFF 初始化失敗", error);
                alert("請在 LINE 內開啟此頁面");
            }
        }

        // 提交表單
        async function submitSurvey() {
            const selectedContents = Array.from(document.querySelectorAll('input[name="content"]:checked')).map(el => el.value);
            const selectedFeatures = Array.from(document.querySelectorAll('input[name="feature"]:checked')).map(el => el.value);

            if (selectedContents.length === 0 && selectedFeatures.length === 0) {
                alert("請至少選擇一個選項喔！");
                return;
            }

            document.getElementById("loadingText").innerText = "正在儲存您的投票，請稍候...";
            document.getElementById("loading").classList.remove("hidden");

            let statsData = null;

            try {
                // 發送資料到 GAS 後端 (包含傳送 currentGroupId)
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "text/plain"
                    },
                    body: JSON.stringify({
                        lineId: userLineId,
                        displayName: userDisplayName,
                        groupId: currentGroupId, // 傳送群組 ID
                        contents: selectedContents,
                        features: selectedFeatures
                    })
                });
                
                const result = await response.json();
                if (result.status === "success") {
                    statsData = result.stats;
                }
            } catch (error) {
                console.warn("GAS 統計獲取失敗", error);
                statsData = {
                    totalVotes: "多",
                    contentStats: "1. 藥物與症狀調適\n2. 居家防跌與凍步\n3. 居家復健運動",
                    featureStats: "1. 字體特大\n2. 書本可完全攤平\n3. 掃碼看影片"
                };
            }

            // 發送統計結果
            await sendFlexMessage(statsData);
        }

        // 發送統計結果
        async function sendFlexMessage(stats) {
            const flexPayload = {
                type: "flex",
                altText: "📊 帕金森工具書最新調查統計結果！",
                contents: {
                    type: "bubble",
                    header: {
                        type: "box",
                        layout: "vertical",
                        backgroundColor: "#0d9488",
                        contents: [
                            { type: "text", text: "📊 帕金森工具書調查公告", color: "#ffffff", weight: "bold", size: "lg" },
                            { type: "text", text: `目前已累積 ${stats.totalVotes} 位成員投票`, color: "#ccfbf1", size: "xs", margin: "xs" }
                        ]
                    },
                    body: {
                        type: "box",
                        layout: "vertical",
                        spacing: "md",
                        contents: [
                            { type: "text", text: `💡 感謝【${userDisplayName}】剛剛完成投票！`, weight: "bold", size: "sm", color: "#0f766e", wrap: true },
                            { type: "separator", margin: "md" },
                            { type: "text", text: "【最受關注內容前三名】", weight: "bold", size: "sm", margin: "md", color: "#0d9488" },
                            { type: "text", text: stats.contentStats, wrap: true, size: "sm", color: "#4b5563" },
                            { type: "separator", margin: "md" },
                            { type: "text", text: "【最希望具備的功能前三名】", weight: "bold", size: "sm", margin: "md", color: "#0d9488" },
                            { type: "text", text: stats.featureStats, wrap: true, size: "sm", color: "#4b5563" }
                        ]
                    },
                    footer: {
                        type: "box",
                        layout: "vertical",
                        contents: [
                            {
                                type: "button",
                                action: {
                                    type: "uri",
                                    label: "我也要投票/看最新結果",
                                    uri: `https://liff.line.me/${LIFF_ID}`
                                },
                                style: "primary",
                                color: "#0d9488"
                            }
                        ]
                    }
                }
            };

            // 🌟 核心邏輯：如果是在聊天室/群組內打開，直接「無感自動回覆」到該群組！
            if (isInChatContext) {
                try {
                    await liff.sendMessages([flexPayload]);
                    liff.closeWindow(); // 發送完自動關閉視窗
                } catch (e) {
                    console.error("自動發送失敗，嘗試備用分享機制", e);
                    // 萬一權限不足，改用分享視窗
                    await fallbackShare(flexPayload);
                }
            } else {
                // 如果是外部瀏覽器打開，使用分享視窗
                await fallbackShare(flexPayload);
            }
        }

        // 備用分享機制
        async function fallbackShare(flexPayload) {
            if (liff.isApiAvailable('shareTargetPicker')) {
                try {
                    await liff.shareTargetPicker([flexPayload]);
                    liff.closeWindow();
                } catch (e) {
                    console.log("使用者取消分享");
                    liff.closeWindow();
                }
            } else {
                alert("投票成功！感謝您的參與！");
                liff.closeWindow();
            }
        }

        // 啟動 LIFF
        initializeLiff();
    </script>
</body>
</html>
