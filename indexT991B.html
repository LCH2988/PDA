<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 治理助理 - 台灣帕金森病友權益促進會</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/2.1/sdk.js"></script>
  <style>
    body { touch-action: pan-y; -webkit-tap-highlight-color: transparent; }
    .card-btn { min-height: 72px; }
    textarea { min-height: 120px; font-size: 1rem; }
    .fade-in { animation: fadeIn 0.3s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
  <header class="bg-sky-800 text-white px-4 py-4 sticky top-0 z-10 shadow-md">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div>
        <h1 class="text-lg font-bold">🤖 AI 治理助理</h1>
        <p class="text-xs text-sky-200">台灣帕金森病友權益促進會</p>
      </div>
      <button onclick="showHelp()" class="bg-sky-700 px-3 py-2 rounded-lg text-sm font-bold">說明</button>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">
    <div id="authAlert" class="hidden rounded-xl p-3 text-sm font-bold"></div>
    <div class="flex flex-wrap gap-2" id="categoryTabs"></div>
    <div id="cardContainer" class="space-y-3"></div>

    <div id="workPanel" class="hidden bg-white rounded-2xl shadow-lg p-4 space-y-3 fade-in">
      <div class="flex items-center justify-between">
        <h2 id="panelTitle" class="text-lg font-bold text-sky-900"></h2>
        <button onclick="closePanel()" class="text-slate-400 text-2xl leading-none px-2">×</button>
      </div>
      <p id="panelDesc" class="text-sm text-slate-500"></p>
      <textarea id="userInput" placeholder="請在此貼上或輸入資料..."
                class="w-full p-3 rounded-xl border-2 border-slate-300 focus:border-sky-500 focus:outline-none"></textarea>
      <button id="runBtn" onclick="runAgent()"
              class="w-full bg-sky-700 hover:bg-sky-800 text-white font-bold py-4 rounded-xl text-lg">
        執行 AI 分析
      </button>
    </div>

    <div id="resultPanel" class="hidden bg-white rounded-2xl shadow-lg p-4 space-y-3 fade-in">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-bold text-emerald-800">📄 分析結果</h2>
        <button onclick="copyResult()" class="bg-emerald-600 text-white px-3 py-2 rounded-lg text-sm font-bold">複製</button>
      </div>
      <div id="resultContent" class="text-sm leading-relaxed whitespace-pre-wrap bg-slate-50 p-3 rounded-xl border border-slate-200"></div>
    </div>

    <div id="loading" class="hidden text-center py-8">
      <div class="inline-block w-10 h-10 border-4 border-sky-200 border-t-sky-700 rounded-full animate-spin"></div>
      <p class="text-sm text-slate-500 mt-3">AI 分析中，請稍候...</p>
    </div>
  </main>

  <script>
    const LIFF_ID = "2009452236-588gzru4";
    const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbzjwuLe0iSjZ6NT3gxqlpf9AnAZvXE9pHa38vjlp48VfVm4DP1_6poHcBfxuq1K5NV8/execㄅ";

    let currentUserUid = null;

    const MODULES = [
      { cat: "會員管理", key: "MEMBER_APPLICATION_REVIEW", icon: "📋", name: "會員入會審核", desc: "初步審核入會申請並產生審核摘要" },
      { cat: "會員管理", key: "MEMBER_ROSTER_CHECK", icon: "📇", name: "會員名冊檢查", desc: "檢查名冊是否適合大會與備查" },
      { cat: "會員管理", key: "MEMBER_NOTIFICATION_LETTER", icon: "✉️", name: "會員通知信", desc: "產生正式/親切/短版通知" },
      { cat: "捐款收據", key: "DONATION_DATA_CHECK", icon: "💰", name: "捐款資料檢查", desc: "檢查捐款資料與稅務內控風險" },
      { cat: "捐款收據", key: "RECEIPT_GENERATION", icon: "🧾", name: "收據開立草稿", desc: "產生收據內容與感謝信" },
      { cat: "捐款收據", key: "RECEIPT_VOID", icon: "🚫", name: "收據作廢", desc: "產生作廢紀錄與內控檢查" },
      { cat: "會計核銷", key: "EXPENSE_APPLICATION_REVIEW", icon: "💳", name: "支出申請審核", desc: "支出核銷初審與扣繳提醒" },
      { cat: "會計核銷", key: "MONTHLY_FINANCIAL_REPORT", icon: "📊", name: "財務月報", desc: "產生本月財務摘要報告" },
      { cat: "會計核銷", key: "WITHHOLDING_TAX_JUDGMENT", icon: "🏛️", name: "扣繳判斷", desc: "判斷是否涉及扣繳義務" },
      { cat: "會議會務", key: "MEETING_AGENDA", icon: "📅", name: "會議議程", desc: "產生會議議程與相關表單" },
      { cat: "會議會務", key: "MEETING_MINUTES", icon: "📝", name: "會議紀錄", desc: "整理正式會議紀錄草稿" },
      { cat: "會議會務", key: "GENERAL_ASSEMBLY_COMPLIANCE", icon: "⚖️", name: "大會法遵檢查", desc: "檢查會員大會程序完整性" },
      { cat: "活動專案", key: "EVENT_PLANNING", icon: "🎯", name: "活動企劃", desc: "規劃病友公益活動" },
      { cat: "活動專案", key: "EVENT_RESULT_REPORT", icon: "🏆", name: "活動成果報告", desc: "產生成果報告草稿" },
      { cat: "志工管理", key: "VOLUNTEER_REVIEW", icon: "🙋", name: "志工資料審核", desc: "志工報名資料初審" },
      { cat: "志工管理", key: "VOLUNTEER_HOURS_CERT", icon: "⏱️", name: "服務時數證明", desc: "產生志工時數證明" },
      { cat: "病友服務", key: "PATIENT_NEEDS_CLASSIFY", icon: "💙", name: "病友需求分類", desc: "分類需求並建議處理方向" },
      { cat: "病友服務", key: "PII_RISK_CHECK", icon: "🔒", name: "個資風險檢查", desc: "檢查表單與流程的個資風險" },
      { cat: "病友服務", key: "PII_CONSENT_TEXT", icon: "📜", name: "個資同意文字", desc: "產生個資告知與同意文字" },
      { cat: "文件法遵", key: "CLOUD_FOLDER_PLAN", icon: "🗂️", name: "雲端資料夾規劃", desc: "規劃雲端架構與權限分級" },
      { cat: "文件法遵", key: "DOCUMENT_RETENTION_CHECK", icon: "📦", name: "文件保存檢查", desc: "檢查文件保存完整性" },
      { cat: "文件法遵", key: "COMPLIANCE_CALENDAR", icon: "🗓️", name: "法遵行事曆", desc: "建立年度法遵行事曆" },
      { cat: "文件法遵", key: "INTERNAL_AUDIT", icon: "🔍", name: "內部稽核", desc: "進行內控與法遵稽核" },
      { cat: "文件法遵", key: "GOV_FILING_DOCUMENT", icon: "📤", name: "主管機關報備", desc: "產生報備公文草稿" },
      { cat: "補助報告", key: "GRANT_APPLICATION", icon: "📑", name: "補助案申請", desc: "撰寫補助計畫書草稿" },
      { cat: "補助報告", key: "GRANT_SETTLEMENT_CHECK", icon: "✅", name: "補助案核銷", desc: "檢查補助案核銷資料" },
      { cat: "補助報告", key: "ANNUAL_REPORT", icon: "📖", name: "年度工作報告", desc: "產生年度報告草稿" },
      { cat: "補助報告", key: "AUTO_NOTIFICATION", icon: "🔔", name: "自動通知文字", desc: "產生各類通知文字" }
    ];

    let activeCategory = "全部";
    let activeModule = null;

    window.onload = function() {
      renderTabs();
      renderCards();
      if (typeof liff !== "undefined" && LIFF_ID && LIFF_ID.indexOf("YOUR_") !== 0) {
        liff.init({ liffId: LIFF_ID })
          .then(() => {
            if (liff.isLoggedIn()) {
              liff.getProfile().then(profile => {
                currentUserUid = profile.userId;
                checkAuth();
              });
            } else if (liff.isInClient()) {
              liff.login();
            }
          })
          .catch(err => console.warn("LIFF init failed:", err));
      }
    };

    function checkAuth() {
      const alertBox = document.getElementById("authAlert");
      alertBox.classList.remove("hidden");
      alertBox.classList.add("bg-sky-100", "text-sky-900");
      alertBox.innerText = "ℹ️ 本系統僅限本會理監事與秘書處使用，所有操作皆會留存稽核紀錄。";
    }

    function renderTabs() {
      const cats = ["全部", ...new Set(MODULES.map(m => m.cat))];
      document.getElementById("categoryTabs").innerHTML = cats.map(c => `
        <button onclick="switchCategory('${c}')"
          class="px-3 py-2 rounded-full text-sm font-bold transition
          ${c === activeCategory ? 'bg-sky-700 text-white' : 'bg-white text-slate-600 border border-slate-300'}">
          ${c}
        </button>
      `).join("");
    }

    function switchCategory(cat) { activeCategory = cat; renderTabs(); renderCards(); }

    function renderCards() {
      const list = activeCategory === "全部" ? MODULES : MODULES.filter(m => m.cat === activeCategory);
      document.getElementById("cardContainer").innerHTML = list.map(m => `
        <button onclick="openPanel('${m.key}')"
          class="card-btn w-full bg-white rounded-2xl shadow border border-slate-200 p-4 flex items-center text-left active:bg-sky-50 transition">
          <span class="text-3xl mr-3">${m.icon}</span>
          <span class="flex-1">
            <span class="block font-bold text-slate-800">${m.name}</span>
            <span class="block text-xs text-slate-500 mt-0.5">${m.desc}</span>
          </span>
          <span class="text-slate-300 text-xl">›</span>
        </button>
      `).join("");
    }

    function openPanel(key) {
      activeModule = MODULES.find(m => m.key === key);
      document.getElementById("panelTitle").innerText = activeModule.icon + " " + activeModule.name;
      document.getElementById("panelDesc").innerText = activeModule.desc;
      document.getElementById("userInput").value = "";
      document.getElementById("workPanel").classList.remove("hidden");
      document.getElementById("resultPanel").classList.add("hidden");
      document.getElementById("workPanel").scrollIntoView({ behavior: 'smooth' });
    }

    function closePanel() { document.getElementById("workPanel").classList.add("hidden"); }

    async function runAgent() {
      const input = document.getElementById("userInput").value.trim();
      const btn = document.getElementById("runBtn");
      if (!input) { alert("請先輸入或貼上資料。"); return; }

      btn.disabled = true;
      btn.classList.add("opacity-50");
      btn.innerText = "分析中...";
      document.getElementById("loading").classList.remove("hidden");
      document.getElementById("resultPanel").classList.add("hidden");

      try {
        const payload = {
          action: "run_ai_agent",
          promptKey: activeModule.key,
          userInput: input,
          lineUid: currentUserUid || "DIRECT_WEB_USER"
        };

        const res = await fetch(GAS_WEBAPP_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        const result = await res.json();
        document.getElementById("loading").classList.add("hidden");

        if (result.success) {
          document.getElementById("resultContent").innerText = result.text;
          document.getElementById("resultPanel").classList.remove("hidden");
          document.getElementById("resultPanel").scrollIntoView({ behavior: 'smooth' });
        } else {
          alert("分析失敗：" + (result.message || "伺服器錯誤"));
        }
      } catch (err) {
        document.getElementById("loading").classList.add("hidden");
        alert("連線錯誤：" + err.message);
      } finally {
        btn.disabled = false;
        btn.classList.remove("opacity-50");
        btn.innerText = "執行 AI 分析";
      }
    }

    function copyResult() {
      const text = document.getElementById("resultContent").innerText;
      navigator.clipboard.writeText(text).then(() => alert("已複製到剪貼簿！")).catch(() => alert("複製失敗，請手動選取。"));
    }

    function showHelp() {
      alert("使用說明：\n\n1. 選擇上方分類標籤篩選功能\n2. 點選功能卡片\n3. 貼上您的資料\n4. 點選「執行 AI 分析」\n5. 結果可一鍵複製\n\n⚠️ 所有 AI 結果僅為行政初審建議，正式結果須由權責人員確認。");
    }
  </script>
</body>
</html>
