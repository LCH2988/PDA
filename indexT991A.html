<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社團法人台灣帕金森病友權益促進會 - 管理後台整合版</title>
  
  <!-- 1. 引入 Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 2. 引入 React 與 ReactDOM (CDN) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- 3. 引入 Babel (用於在瀏覽器中即時解析 JSX) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- 4. 引入 Lucide 圖標庫 -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800">

  <!-- React 渲染的根節點 -->
  <div id="root"></div>

  <!-- React 程式碼區塊 -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // 預設展示資料
    const initialFallbackData = {
      info: [
        { id: "info-1", category: "醫療衛教", title: "認識帕金森氏症的早期五大警訊", content: "手部顫抖、肢體僵硬、動作遲緩、步態不穩以及面部表情僵硬（面具臉）是常見的早期徵兆。若發現家人有類似症狀，建議盡早至神經內科門診檢查。", date: "2026-07-20" },
        { id: "info-2", category: "權益倡議", title: "爭取帕金森病友納入特定身心障礙補助公聽會", content: "本會將於下個月聯合立法委員召開公聽會，爭取放寬帕金森氏症中晚期患者的失能評估標準，讓更多家庭獲得實質長照補助。", date: "2026-07-25" }
      ],
      forum: [
        { id: "forum-1", author: "王大同 (病友家屬)", content: "爸爸最近剛診斷出帕金森，服用左多巴胺後有些輕微噁心，請問大家初期都怎麼適應藥物副作用呢？", timestamp: "2026-07-26 10:30" },
        { id: "forum-2", author: "李阿姨 (抗帕5年)", content: "回覆大同：初期可以嘗試在吃藥前吃一點小餅乾，但切記不要與高蛋白食物（如牛奶、肉類）一起吃，會影響藥效吸收喔！加油！", timestamp: "2026-07-26 11:15" }
      ],
      activities: [
        { id: "act-1", title: "「旋風球」動能復健體驗營", imageUrl: "https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?auto=format&fit=crop&w=600&q=80", description: "透過趣味的旋風球運動，訓練帕友的手眼協調與大肌肉群，現場歡笑聲不斷！", date: "2026-07-12" }
      ],
      stats: [
        { id: "1", label: "全台受影響家庭", value: "60,000", unit: "戶以上" },
        { id: "2", label: "本會服務會員", value: "1,250", unit: "人" },
        { id: "3", label: "年度舉辦復健活動", value: "48", unit: "場次" },
        { id: "4", label: "權益爭取倡議案", value: "5", unit: "案" }
      ]
    };

    // 簡易 Lucide 圖標組件
    function Icon({ name, className = "h-5 w-5", fill = "none" }) {
      useEffect(() => {
        lucide.createIcons();
      }, [name]);
      return <i data-lucide={name} class={className} style={{ fill: fill }}></i>;
    }

    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [gasUrl, setGasUrl] = useState('');
      const [data, setData] = useState(initialFallbackData);
      const [loading, setLoading] = useState(false);

      // 管理員狀態
      const [isAdmin, setIsAdmin] = useState(false);
      const [adminPassword, setAdminPassword] = useState('');
      const [showLoginModal, setShowLoginModal] = useState(false);

      // 編輯表單彈窗狀態
      const [activeModal, setActiveModal] = useState(null);
      const [infoForm, setInfoForm] = useState({ id: '', category: '醫療衛教', title: '', content: '', date: '' });
      const [activityForm, setActivityForm] = useState({ id: '', title: '', imageUrl: '', description: '', date: '' });
      const [statsForm, setStatsForm] = useState([
        { id: "1", label: "", value: "", unit: "" },
        { id: "2", label: "", value: "", unit: "" },
        { id: "3", label: "", value: "", unit: "" },
        { id: "4", label: "", value: "", unit: "" }
      ]);

      // 一般論壇貼文狀態
      const [newAuthor, setNewAuthor] = useState('');
      const [newContent, setNewContent] = useState('');

      // 1. 從 GAS 獲取最新資料
      const fetchData = async () => {
        if (!gasUrl) {
          alert("請在上方輸入您的 GAS Web App API 網址以進行同步。");
          return;
        }
        setLoading(true);
        try {
          const res = await fetch(`${gasUrl}?action=getData`);
          const result = await res.json();
          if (result.status === 'success') {
            setData(result.data);
          } else {
            alert("讀取失敗：" + result.message);
          }
        } catch (err) {
          alert("無法連線至 API，請確認您的 GAS 部署設定為「任何人」皆可存取，且網址正確。");
        } finally {
          setLoading(false);
        }
      };

      // 2. 一般病友/管理員 發布論壇貼文
      const handleAddPost = async (e) => {
        e.preventDefault();
        if (!newAuthor || !newContent) return;

        if (!gasUrl) {
          const newPost = { id: "forum-" + Date.now().toString(), author: newAuthor, content: newContent, timestamp: new Date().toLocaleString() };
          setData(prev => ({ ...prev, forum: [newPost, ...prev.forum] }));
          setNewAuthor('');
          setNewContent('');
          return;
        }

        setLoading(true);
        try {
          const res = await fetch(gasUrl, {
            method: 'POST',
            body: JSON.stringify({ action: 'addPost', author: newAuthor, content: newContent })
          });
          const result = await res.json();
          if (result.status === 'success') {
            setNewAuthor('');
            setNewContent('');
            fetchData();
          } else {
            alert("發布失敗：" + result.message);
          }
        } catch (err) {
          alert("發布貼文時發生連線錯誤。");
        } finally {
          setLoading(false);
        }
      };

      // 3. 管理員：儲存資訊 (新增/修改)
      const handleSaveInfo = async (e) => {
        e.preventDefault();
        if (!gasUrl) {
          const updatedList = [...data.info];
          const index = updatedList.findIndex(item => item.id === infoForm.id);
          const newItem = { ...infoForm, id: infoForm.id || "info-" + Date.now().toString(), date: infoForm.date || new Date().toISOString().split('T')[0] };
          if (index > -1) updatedList[index] = newItem;
          else updatedList.unshift(newItem); // 新增的排在最前面
          setData(prev => ({ ...prev, info: updatedList }));
          setActiveModal(null);
          return;
        }

        setLoading(true);
        try {
          const res = await fetch(gasUrl, {
            method: 'POST',
            body: JSON.stringify({ action: 'saveInfo', password: adminPassword, ...infoForm })
          });
          const result = await res.json();
          if (result.status === 'success') {
            setActiveModal(null);
            fetchData();
          } else {
            alert("儲存失敗：" + result.message);
          }
        } catch (err) {
          alert("連線錯誤。");
        } finally {
          setLoading(false);
        }
      };

      // 4. 管理員：儲存活動花絮 (新增/修改)
      const handleSaveActivity = async (e) => {
        e.preventDefault();
        if (!gasUrl) {
          const updatedList = [...data.activities];
          const index = updatedList.findIndex(item => item.id === activityForm.id);
          const newItem = { ...activityForm, id: activityForm.id || "act-" + Date.now().toString(), date: activityForm.date || new Date().toISOString().split('T')[0] };
          if (index > -1) updatedList[index] = newItem;
          else updatedList.unshift(newItem); // 新增的排在最前面
          setData(prev => ({ ...prev, activities: updatedList }));
          setActiveModal(null);
          return;
        }

        setLoading(true);
        try {
          const res = await fetch(gasUrl, {
            method: 'POST',
            body: JSON.stringify({ action: 'saveActivity', password: adminPassword, ...activityForm })
          });
          const result = await res.json();
          if (result.status === 'success') {
            setActiveModal(null);
            fetchData();
          } else {
            alert("儲存失敗：" + result.message);
          }
        } catch (err) {
          alert("連線錯誤。");
        } finally {
          setLoading(false);
        }
      };

      // 5. 管理員：儲存統計數據
      const handleSaveStats = async (e) => {
        e.preventDefault();
        if (!gasUrl) {
          setData(prev => ({ ...prev, stats: statsForm }));
          setActiveModal(null);
          return;
        }

        setLoading(true);
        try {
          const res = await fetch(gasUrl, {
            method: 'POST',
            body: JSON.stringify({ action: 'saveStats', password: adminPassword, statsList: statsForm })
          });
          const result = await res.json();
          if (result.status === 'success') {
            setActiveModal(null);
            fetchData();
          } else {
            alert("儲存失敗：" + result.message);
          }
        } catch (err) {
          alert("連線錯誤。");
        } finally {
          setLoading(false);
        }
      };

      // 6. 管理員：刪除資料 (通用)
      const handleDeleteRow = async (targetSheet, id) => {
        if (!window.confirm("確定要刪除這筆資料嗎？此動作無法復原。")) return;

        if (!gasUrl) {
          setData(prev => ({
            ...prev,
            [targetSheet]: prev[targetSheet].filter((item) => item.id !== id)
          }));
          return;
        }

        setLoading(true);
        try {
          const res = await fetch(gasUrl, {
            method: 'POST',
            body: JSON.stringify({ action: 'deleteRow', password: adminPassword, targetSheet, id })
          });
          const result = await res.json();
          if (result.status === 'success') {
            fetchData();
          } else {
            alert("刪除失敗：" + result.message);
          }
        } catch (err) {
          alert("連線錯誤。");
        } finally {
          setLoading(false);
        }
      };

      // 登入管理員
      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (adminPassword) {
          setIsAdmin(true);
          setShowLoginModal(false);
        }
      };

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 flex flex-col">
          {/* 頂部導覽 */}
          <header className="bg-emerald-600 text-white shadow-md sticky top-0 z-40">
            <div className="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
              <div className="flex items-center gap-3">
                <div className="bg-white p-2 rounded-full text-emerald-600">
                  <Icon name="heart" className="h-6 w-6 text-emerald-600" fill="currentColor" />
                </div>
                <div>
                  <h1 className="text-xl font-bold tracking-wide">社團法人台灣帕金森病友權益促進會</h1>
                  <p className="text-xs text-emerald-100">積極面對・走入人群・攜手抗帕</p>
                </div>
              </div>
              <div className="flex items-center gap-3">
                <nav className="flex gap-1 bg-emerald-700/50 p-1 rounded-lg">
                  <button onClick={() => setActiveTab('home')} className={`px-3 py-1.5 rounded text-sm font-medium transition ${activeTab === 'home' ? 'bg-white text-emerald-700 shadow' : 'hover:bg-emerald-600'}`}>首頁</button>
                  <button onClick={() => setActiveTab('info')} className={`px-3 py-1.5 rounded text-sm font-medium transition ${activeTab === 'info' ? 'bg-white text-emerald-700 shadow' : 'hover:bg-emerald-600'}`}>帕金森資訊</button>
                  <button onClick={() => setActiveTab('forum')} className={`px-3 py-1.5 rounded text-sm font-medium transition ${activeTab === 'forum' ? 'bg-white text-emerald-700 shadow' : 'hover:bg-emerald-600'}`}>病友論壇</button>
                  <button onClick={() => setActiveTab('activities')} className={`px-3 py-1.5 rounded text-sm font-medium transition ${activeTab === 'activities' ? 'bg-white text-emerald-700 shadow' : 'hover:bg-emerald-600'}`}>活動花絮</button>
                  {isAdmin && (
                    <button onClick={() => setActiveTab('admin')} className={`px-3 py-1.5 rounded text-sm font-bold text-amber-300 transition ${activeTab === 'admin' ? 'bg-amber-500 text-slate-900 shadow' : 'hover:bg-emerald-600'}`}>⚙️ 後台管理專區</button>
                  )}
                </nav>

                {/* 管理員登入按鈕 */}
                <button 
                  onClick={() => isAdmin ? setIsAdmin(false) : setShowLoginModal(true)}
                  className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold border transition ${isAdmin ? 'bg-amber-500 border-amber-400 text-white hover:bg-amber-600' : 'bg-emerald-700 border-emerald-500 text-emerald-100 hover:bg-emerald-800'}`}
                >
                  <Icon name={isAdmin ? "unlock" : "lock"} className="h-3.5 w-3.5" />
                  {isAdmin ? '登出後台' : '管理登入'}
                </button>
              </div>
            </div>
          </header>

          {/* GAS API 設定工具列 */}
          <div className="bg-amber-50 border-b border-amber-200 py-2 px-4">
            <div className="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-2 text-xs text-amber-800">
              <div className="flex items-center gap-2">
                <span className="font-bold bg-amber-200 px-2 py-0.5 rounded">GAS API 串接</span>
                <span>輸入您的 Web App URL 即可啟用真實資料庫同步：</span>
              </div>
              <div className="flex w-full md:w-auto gap-2">
                <input 
                  type="text" 
                  placeholder="https://script.google.com/macros/s/.../exec" 
                  value={gasUrl}
                  onChange={(e) => setGasUrl(e.target.value)}
                  className="flex-1 md:w-80 px-2 py-1 border border-amber-300 rounded text-slate-800 focus:outline-none focus:ring-1 focus:ring-amber-500"
                />
                <button 
                  onClick={fetchData} 
                  disabled={loading}
                  className="bg-amber-600 hover:bg-amber-700 text-white px-3 py-1 rounded font-medium flex items-center gap-1 transition disabled:opacity-50"
                >
                  <Icon name="refresh-cw" className={`h-3 w-3 ${loading ? 'animate-spin' : ''}`} />
                  同步資料
                </button>
              </div>
            </div>
          </div>

          {/* 主內容區 */}
          <main className="flex-1 max-w-6xl w-full mx-auto px-4 py-8">
            {activeTab === 'home' && (
              <div className="space-y-12">
                {/* 英雄宣傳區 */}
                <div className="bg-gradient-to-br from-emerald-50 to-teal-50 rounded-2xl p-8 md:p-12 border border-emerald-100 flex flex-col md:flex-row items-center gap-8">
                  <div className="flex-1 space-y-4">
                    <span className="bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-1 rounded-full">社團法人帕促會</span>
                    <h2 className="text-3xl md:text-4xl font-extrabold text-slate-900 leading-tight">
                      在震顫與僵硬的日子裡，<br/><span className="text-emerald-600">用溫慢與勇氣互相照亮。</span>
                    </h2>
                    <p className="text-slate-600 leading-relaxed">
                      我們致力於推動帕金森氏症病友的權益保障，協助病友獲得醫療照護與生活支持。透過多元復健活動與病友互助，陪伴大家積極面對、走入人群。
                    </p>
                    <div className="flex gap-4 pt-2">
                      <button onClick={() => setActiveTab('info')} className="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2.5 rounded-lg font-medium shadow transition">
                        瀏覽衛教資訊
                      </button>
                      <button onClick={() => setActiveTab('forum')} className="bg-white hover:bg-slate-50 text-emerald-700 border border-emerald-200 px-6 py-2.5 rounded-lg font-medium shadow-sm transition">
                        加入病友交流
                      </button>
                    </div>
                  </div>
                  <div className="w-full md:w-2/5 bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex flex-col gap-4">
                    <h3 className="font-bold text-lg text-slate-900 flex items-center gap-2">
                      <Icon name="activity" className="text-emerald-600" /> 核心使命
                    </h3>
                    <ul className="space-y-3 text-sm text-slate-600">
                      <li className="flex items-start gap-2">✓ <strong>爭取權益：</strong>推動政策立法與社會福利保障。</li>
                      <li className="flex items-start gap-2">✓ <strong>醫學推廣：</strong>提供最新醫療與生活照護衛教。</li>
                      <li className="flex items-start gap-2">✓ <strong>社群互助：</strong>建立溫暖的病友與家屬支持網絡。</li>
                      <li className="flex items-start gap-2">✓ <strong>動能復健：</strong>舉辦旋風球等延緩退化之特色運動。</li>
                    </ul>
                  </div>
                </div>

                {/* 統計數據區 */}
                <section className="space-y-6 relative">
                  <div className="text-center">
                    <h3 className="text-2xl font-bold text-slate-900 flex items-center justify-center gap-2">
                      <Icon name="bar-chart-3" className="text-emerald-600" /> 關懷數據與現況
                    </h3>
                    <p className="text-slate-500 text-sm mt-1">我們用行動與數據，為全台帕金森家庭發聲</p>
                    {isAdmin && (
                      <button 
                        onClick={() => { setStatsForm([...data.stats]); setActiveModal('stats'); }}
                        className="mt-2 inline-flex items-center gap-1 text-xs bg-amber-500 hover:bg-amber-600 text-white px-2.5 py-1 rounded font-medium"
                      >
                        <Icon name="edit-2" className="h-3 w-3 mr-1" /> 編輯統計數據
                      </button>
                    )}
                  </div>
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                    {data.stats.map((stat, idx) => (
                      <div key={idx} className="bg-white p-6 rounded-xl border border-slate-100 text-center shadow-sm hover:shadow-md transition">
                        <p className="text-sm text-slate-500 mb-1">{stat.label}</p>
                        <p className="text-3xl font-extrabold text-emerald-600">{stat.value}</p>
                        <p className="text-xs text-slate-400 mt-1">{stat.unit}</p>
                      </div>
                    ))}
                  </div>
                </section>

                {/* 最新動態預覽 */}
                <div className="grid md:grid-cols-2 gap-8">
                  {/* 資訊預覽 */}
                  <div className="space-y-4">
                    <div className="flex justify-between items-center">
                      <h4 className="font-bold text-lg text-slate-900 flex items-center gap-2">
                        <Icon name="book-open" className="text-emerald-600" /> 最新衛教與權益資訊
                      </h4>
                      <button onClick={() => setActiveTab('info')} className="text-xs text-emerald-600 hover:underline">查看更多</button>
                    </div>
                    <div className="space-y-3">
                      {data.info.slice(0, 2).map((item, idx) => (
                        <div key={idx} className="bg-white p-4 rounded-lg border border-slate-100 shadow-sm">
                          <span className="text-xs font-semibold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded">{item.category}</span>
                          <h5 className="font-bold text-slate-900 mt-2 mb-1">{item.title}</h5>
                          <p className="text-xs text-slate-500">{item.date}</p>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* 論壇預覽 */}
                  <div className="space-y-4">
                    <div className="flex justify-between items-center">
                      <h4 className="font-bold text-lg text-slate-900 flex items-center gap-2">
                        <Icon name="message-square" className="text-emerald-600" /> 社群熱烈討論
                      </h4>
                      <button onClick={() => setActiveTab('forum')} className="text-xs text-emerald-600 hover:underline">進入論壇</button>
                    </div>
                    <div className="space-y-3">
                      {data.forum.slice(0, 2).map((post, idx) => (
                        <div key={idx} className="bg-white p-4 rounded-lg border border-slate-100 shadow-sm">
                          <div className="flex justify-between text-xs text-slate-400 mb-1">
                            <span className="font-semibold text-slate-600">{post.author}</span>
                            <span>{post.timestamp}</span>
                          </div>
                          <p className="text-sm text-slate-700 line-clamp-2">{post.content}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* 帕金森資訊頁 */}
            {activeTab === 'info' && (
              <div className="space-y-6">
                <div className="flex justify-between items-center">
                  <div>
                    <h2 className="text-2xl font-bold text-slate-900 flex items-center gap-2">
                      <Icon name="book-open" className="text-emerald-600" /> 帕金森資訊專區
                    </h2>
                    <p className="text-slate-500 text-sm">提供最專業的醫療衛教、生活照護指引與最新權益倡議進度。</p>
                  </div>
                  {isAdmin && (
                    <button 
                      onClick={() => { setInfoForm({ id: '', category: '醫療衛教', title: '', content: '', date: '' }); setActiveModal('info'); }}
                      className="flex items-center gap-1 bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-lg text-sm font-semibold shadow"
                    >
                      <Icon name="plus" className="h-4 w-4" /> 新增資訊
                    </button>
                  )}
                </div>
                <div className="grid gap-6">
                  {data.info.map((item, idx) => (
                    <div key={idx} className="bg-white p-6 rounded-xl border border-slate-100 shadow-sm space-y-3 relative group">
                      {isAdmin && (
                        <div className="absolute top-4 right-4 flex gap-2">
                          <button

                  <div className="space-y-3">
                    {statsForm.map((stat, idx) => (
                      <div key={stat.id} className="grid grid-cols-3 gap-2 items-center border-b pb-2">
                        <input 
                          type="text" 
                          placeholder="項目名稱" 
                          value={stat.label}
                          onChange={(e) => {
                            const updated = [...statsForm];
                            updated[idx].label = e.target.value;
                            setStatsForm(updated);
                          }}
                          required
                          className="px-2 py-1 border rounded text-sm w-full"
                        />
                        <input 
                          type="text" 
                          placeholder="數值" 
                          value={stat.value}
                          onChange={(e) => {
                            const updated = [...statsForm];
                            updated[idx].value = e.target.value;
                            setStatsForm(updated);
                          }}
                          required
                          className="px-2 py-1 border rounded text-sm w-full"
                        />
                        <input 
                          type="text" 
                          placeholder="單位" 
                          value={stat.unit}
                          onChange={(e) => {
                            const updated = [...statsForm];
                            updated[idx].unit = e.target.value;
                            setStatsForm(updated);
                          }}
                          required
                          className="px-2 py-1 border rounded text-sm w-full"
                        />
                      </div>
                    ))}
                  </div>
                  <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-lg font-medium text-sm flex items-center justify-center gap-1">
                    <Icon name="save" className="h-4 w-4" /> 儲存變更並同步
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // 將 App 組件渲染到畫面上
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
