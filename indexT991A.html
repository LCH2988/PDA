<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title><?= systemName ?></title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root {
      --primary: #1f4e79;
      --primary-dark: #153957;
      --bg: #eef3f8;
      --card: #ffffff;
      --border: #d9e2ec;
      --text: #1f2937;
      --muted: #64748b;
      --danger: #c62828;
      --warning: #f9a825;
      --success: #2e7d32;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      min-height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 260px;
      background: var(--primary);
      color: #fff;
      padding: 18px;
      flex-shrink: 0;
    }

    .brand {
      border-bottom: 1px solid rgba(255,255,255,0.25);
      padding-bottom: 14px;
      margin-bottom: 16px;
    }

    .brand h1 {
      font-size: 19px;
      margin: 0 0 6px;
      line-height: 1.4;
    }

    .brand p {
      margin: 0;
      font-size: 13px;
      opacity: 0.85;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.12);
      padding: 10px;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .profile img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #fff;
      object-fit: cover;
    }

    .profile div {
      font-size: 13px;
      line-height: 1.5;
    }

    .nav button {
      width: 100%;
      border: 0;
      background: transparent;
      color: #fff;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 6px;
      text-align: left;
      cursor: pointer;
      font-size: 15px;
    }

    .nav button:hover,
    .nav button.active {
      background: rgba(255,255,255,0.18);
    }

    .main {
      flex: 1;
      padding: 22px;
      overflow-x: auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 16px;
    }

    .topbar h2 {
      margin: 0;
      font-size: 26px;
    }

    .topbar p {
      margin: 6px 0 0;
      color: var(--muted);
    }

    .notice {
      background: #fff8e1;
      border: 1px solid #f6d365;
      color: #6b4e00;
      padding: 14px;
      border-radius: 14px;
      margin-bottom: 16px;
      line-height: 1.6;
    }

    .danger-note {
      background: #fde8e8;
      border-color: #f3b0b0;
      color: #8a1f1f;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 6px 18px rgba(31,78,121,0.06);
    }

    .grid {
      display: grid;
      gap: 14px;
    }

    .grid-4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .grid-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .stat-title {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 8px;
    }

    .stat-number {
      color: var(--primary);
      font-weight: 700;
      font-size: 30px;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    button,
    .btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-secondary {
      background: #e6edf5;
      color: var(--primary);
    }

    .btn-danger {
      background: #fde8e8;
      color: var(--danger);
    }

    .btn-success {
      background: #e8f5e9;
      color: var(--success);
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      background: #fff;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    label {
      font-size: 13px;
      color: #475569;
      font-weight: 700;
      margin-bottom: 5px;
      display: block;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .full {
      grid-column: 1 / -1;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
    }

    .table-wrap {
      overflow-x: auto;
    }

    th,
    td {
      border-bottom: 1px solid var(--border);
      padding: 10px;
      text-align: left;
      font-size: 14px;
      vertical-align: top;
      white-space: nowrap;
    }

    th {
      background: #f1f5f9;
      color: #334155;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      overflow-x: auto;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .badge-success {
      background: #e8f5e9;
      color: var(--success);
    }

    .badge-warning {
      background: #fff8e1;
      color: #8a6400;
    }

    .badge-danger {
      background: #fde8e8;
      color: var(--danger);
    }

    .badge-muted {
      background: #f1f5f9;
      color: #64748b;
    }

    .hidden {
      display: none !important;
    }

    .loading {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.82);
      z-index: 99;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      font-size: 20px;
      font-weight: 700;
    }

    .login-block {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: min(480px, 96vw);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      text-align: center;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    @media (max-width: 900px) {
      .app {
        display: block;
      }

      .sidebar {
        width: 100%;
      }

      .grid-4,
      .grid-2,
      .form-grid {
        grid-template-columns: 1fr;
      }

      .topbar {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <div id="loading" class="loading">系統載入中...</div>

  <div id="loginBlock" class="login-block hidden">
    <div class="login-card">
      <h2><?= systemName ?></h2>
      <p>請使用 LINE LIFF 登入</p>
      <button class="btn-primary" onclick="loginWithLine()">使用 LINE 登入</button>
      <div class="notice" style="margin-top:16px; text-align:left;">
        若您第一次進入系統，請聯絡系統管理員將您的 LINE User ID 加入「24_系統使用者」。
      </div>
    </div>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand">
        <h1><?= systemName ?></h1>
        <p>GAS + LIFF 版本</p>
      </div>

      <div class="profile">
        <img id="profileImage" src="" alt="LINE profile image">
        <div>
          <div id="profileName">LINE User</div>
          <div id="profileRole">角色</div>
        </div>
      </div>

      <nav class="nav">
        <button data-page="dashboard" class="active">管理總覽</button>
        <button data-page="members" data-permission="canViewMembers">會員管理</button>
        <button data-page="donations" data-permission="canViewDonations">捐款管理</button>
        <button data-page="expenses" data-permission="canViewExpenses">支出申請</button>
        <button data-page="services" data-permission="canViewServices">病友服務</button>
        <button data-page="files" data-permission="canUploadFiles">檔案上傳</button>
        <button data-page="users" data-permission="canManageUsers">使用者管理</button>
      </nav>

      <button class="btn-secondary" style="width:100%; margin-top:12px;" onclick="logout()">登出</button>
    </aside>

    <main class="main">
      <div class="topbar">
        <div>
          <h2 id="pageTitle">管理總覽</h2>
          <p id="userInfo"></p>
        </div>

        <div>
          <button class="btn-secondary" onclick="refreshCurrentPage()">重新整理</button>
          <button id="initBtn" class="btn-primary hidden" onclick="initSystem()">初始化系統</button>
        </div>
      </div>

      <div class="notice">
        本系統透過 LINE LIFF ID Token 驗證使用者身分，並以 Google 試算表中的「24_系統使用者」判斷角色權限。敏感資料遮罩由 GAS 後端處理。
        <br>
        本系統僅供行政作業、資料整理與初步檢查使用；涉及法律、稅務、會計、醫療或主管機關事項，仍需權責人員或專業人士確認。
      </div>

      <section id="dashboard" class="section active"></section>
      <section id="members" class="section"></section>
      <section id="donations" class="section"></section>
      <section id="expenses" class="section"></section>
      <section id="services" class="section"></section>
      <section id="files" class="section"></section>
      <section id="users" class="section"></section>
    </main>
  </div>

  <script>
    /****************************************************
 * 系統設定
 ****************************************************/
    const LIFF_ID = "2009456572-588gzru4";
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwmCQvU8k4rjH8cXM6esIksZCIh_F3yyvYYnZ0oSX8JfKniCHgkOIP4ThXEmh5Vplvt/exec";
    const SYSTEM_NAME = "<?= systemName ?>";
    const MAX_FILE_SIZE = 8 * 1024 * 1024;

    let lineProfile = null;
    let idToken = null;
    let currentUser = null;
    let currentPage = "dashboard";


    const pageTitles = {
      dashboard: "管理總覽",
      members: "會員管理",
      donations: "捐款管理",
      expenses: "支出申請",
      services: "病友服務",
      files: "檔案上傳",
      users: "使用者管理"
    };

    async function main() {
      showLoading(true);

      try {
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          document.getElementById("loginBlock").classList.remove("hidden");
          showLoading(false);
          return;
        }

        idToken = liff.getIDToken();
        if (!idToken) {
          throw new Error("無法取得 LINE ID Token，請確認 LIFF scope 是否包含 openid。");
        }

        lineProfile = await liff.getProfile();

        await loadCurrentUser();

        if (!currentUser.user.enabled) {
          showUnregistered();
          return;
        }

        setupLayout();
        await loadDashboard();

        document.getElementById("app").classList.remove("hidden");
      } catch (err) {
        alert("初始化失敗：" + getErrorMessage(err));
        console.error(err);
      } finally {
        showLoading(false);
      }
    }

    function loginWithLine() {
      liff.login();
    }

    function logout() {
      if (liff.isLoggedIn()) {
        liff.logout();
      }
      location.reload();
    }

    function showUnregistered() {
      document.getElementById("loginBlock").classList.remove("hidden");
      document.getElementById("loginBlock").innerHTML = `
        <div class="login-card">
          <h2>尚未啟用帳號</h2>
          <p>您的 LINE 帳號尚未被加入系統使用者。</p>
          <div class="notice" style="text-align:left;">
            <p><strong>請提供以下 LINE User ID 給系統管理員：</strong></p>
            <p style="word-break:break-all;">${safe(lineProfile.userId)}</p>
            <p>LINE 名稱：${safe(lineProfile.displayName)}</p>
          </div>
          <button class="btn-secondary" onclick="logout()">登出</button>
          <button class="btn-primary" onclick="registerFirstAdminPrompt()">建立第一位管理員</button>
        </div>
      `;
    }

    function registerFirstAdminPrompt() {
      const email = prompt("若這是全新系統，可建立第一位系統管理員。請輸入 Email：");
      if (!email) return;

      const setupKey = prompt("請輸入初始化金鑰：");
      if (!setupKey) return;

      callGas("apiRegisterFirstAdminByToken", idToken, email, setupKey)
        .then(() => {
          alert("第一位管理員已建立，請重新整理");
          location.reload();
        })
        .catch(handleError);
    }

    function callGas(functionName, ...args) {
      showLoading(true);

      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(result => {
            showLoading(false);
            resolve(result);
          })
          .withFailureHandler(error => {
            showLoading(false);
            reject(error);
          })[functionName](...args);
      });
    }

    function handleError(err) {
      console.error(err);
      alert(getErrorMessage(err));
    }

    function getErrorMessage(err) {
      if (!err) return "未知錯誤";
      return err.message || String(err);
    }

    function showLoading(show) {
      document.getElementById("loading").style.display = show ? "flex" : "none";
    }

    async function loadCurrentUser() {
      currentUser = await callGas("apiGetCurrentUserByToken", idToken);
    }

    function setupLayout() {
      document.getElementById("profileImage").src = currentUser.user.pictureUrl || lineProfile.pictureUrl || "";
      document.getElementById("profileName").textContent = currentUser.user.displayName || lineProfile.displayName || "";
      document.getElementById("profileRole").textContent = currentUser.user.role || "訪客";
      document.getElementById("userInfo").textContent =
        `LINE：${currentUser.user.displayName || ""}｜角色：${currentUser.user.role || ""}`;

      document.querySelectorAll("[data-permission]").forEach(el => {
        const key = el.dataset.permission;
        if (!currentUser.permissions[key]) {
          el.classList.add("hidden");
        }
      });

      if (currentUser.permissions.canManageUsers) {
        document.getElementById("initBtn").classList.remove("hidden");
      }

      document.querySelectorAll(".nav button").forEach(btn => {
        btn.addEventListener("click", () => {
          setPage(btn.dataset.page);
        });
      });
    }

    function setPage(page) {
      currentPage = page;

      document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
      document.getElementById(page).classList.add("active");

      document.querySelectorAll(".nav button").forEach(b => {
        b.classList.toggle("active", b.dataset.page === page);
      });

      document.getElementById("pageTitle").textContent = pageTitles[page] || "管理系統";
      refreshCurrentPage();
    }

    function refreshCurrentPage() {
      if (currentPage === "dashboard") loadDashboard();
      if (currentPage === "members") loadMembers();
      if (currentPage === "donations") loadDonations();
      if (currentPage === "expenses") loadExpenses();
      if (currentPage === "services") loadServices();
      if (currentPage === "files") renderFileUpload();
      if (currentPage === "users") loadUsers();
    }

    async function initSystem() {
      if (!confirm("是否初始化系統分頁與 Drive 文件庫？")) return;

      try {
        const res = await callGas("apiInitSystemByToken", idToken);
        alert(res.message || "初始化完成");
      } catch (err) {
        handleError(err);
      }
    }

    function money(v) {
      const n = Number(v || 0);
      if (!isFinite(n)) return "NT$ 0";
      return "NT$ " + n.toLocaleString("zh-TW");
    }

    function badge(v) {
      const text = String(v || "");
      let cls = "badge-muted";

      if (["是", "有效會員", "初步通過", "初審通過", "已開立", "已寄送", "核准", "完成"].includes(text)) cls = "badge-success";
      if (["待確認", "需人工確認", "需主管或會計確認", "未開立", "草稿", "待處理", "申請中"].includes(text)) cls = "badge-warning";
      if (["否", "高風險", "需補件", "作廢", "停用"].includes(text)) cls = "badge-danger";

      return `<span class="badge ${cls}">${safe(text || "未填")}</span>`;
    }

    function table(columns, rows) {
      if (!rows || rows.length === 0) {
        return `<div class="card">目前沒有資料</div>`;
      }

      return `
        <div class="card table-wrap">
          <table>
            <thead>
              <tr>${columns.map(c => `<th>${safe(c.label)}</th>`).join("")}</tr>
            </thead>
            <tbody>
              ${rows.map(row => `
                <tr>
                  ${columns.map(c => `<td>${c.render ? c.render(row) : safe(row[c.key])}</td>`).join("")}
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function safe(v) {
      if (v === null || v === undefined) return "";
      return String(v)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function attrSafe(v) {
      return safe(v);
    }

    function formInput(label, id, type = "text", value = "") {
      return `
        <div>
          <label>${safe(label)}</label>
          <input id="${safe(id)}" type="${safe(type)}" value="${attrSafe(value)}">
        </div>
      `;
    }

    function formSelect(label, id, options) {
      return `
        <div>
          <label>${safe(label)}</label>
          <select id="${safe(id)}">
            ${options.map(o => `<option value="${attrSafe(o)}">${safe(o)}</option>`).join("")}
          </select>
        </div>
      `;
    }

    function formTextarea(label, id) {
      return `
        <div class="full">
          <label>${safe(label)}</label>
          <textarea id="${safe(id)}"></textarea>
        </div>
      `;
    }

    function today() {
      return new Date().toISOString().slice(0, 10);
    }

    async function loadDashboard() {
      try {
        const data = await callGas("apiGetDashboardByToken", idToken);

        document.getElementById("dashboard").innerHTML = `
          <div class="grid grid-4">
            ${stat("會員數", data.members)}
            ${stat("捐款總額", money(data.donationAmount))}
            ${stat("支出總額", money(data.expenseAmount))}
            ${stat("高風險服務", data.highRiskServices)}
          </div>

          <div class="card">
            <h3>目前權限</h3>
            <pre>${safe(JSON.stringify(currentUser.permissions, null, 2))}</pre>
          </div>
        `;
      } catch (err) {
        handleError(err);
      }
    }

    function stat(title, value) {
      return `
        <div class="card">
          <div class="stat-title">${safe(title)}</div>
          <div class="stat-number">${safe(value)}</div>
        </div>
      `;
    }

    async function loadMembers() {
      try {
        const rows = await callGas("apiListMembersByToken", idToken);

        document.getElementById("members").innerHTML = `
          ${currentUser.permissions.canEditMembers ? memberForm() : ""}
          ${table([
            { key: "會員編號", label: "會員編號" },
            { key: "姓名", label: "姓名" },
            { key: "會員類別", label: "會員類別" },
            { key: "身分別", label: "身分別" },
            { key: "電話", label: "電話" },
            { key: "Email", label: "Email" },
            { key: "會員狀態", label: "狀態", render: r => badge(r["會員狀態"]) },
            { key: "初審結果", label: "初審", render: r => badge(r["初審結果"]) },
            { key: "個資風險", label: "個資風險" }
          ], rows)}
        `;
      } catch (err) {
        handleError(err);
      }
    }

    function memberForm() {
      return `
        <div class="card">
          <h3>新增會員</h3>
          <div class="notice">
            會員正式入會結果須由本會權責人員依章程與內部規定確認。
          </div>
          <div class="form-grid">
            ${formInput("姓名", "m_name")}
            ${formSelect("會員類別", "m_type", ["個人會員", "團體會員", "贊助會員", "其他"])}
            ${formSelect("身分別", "m_identity", ["病友", "家屬", "照顧者", "一般民眾", "其他"])}
            ${formInput("電話", "m_phone")}
            ${formInput("Email", "m_email", "email")}
            ${formInput("地址", "m_address")}
            ${formSelect("是否同意個資", "m_privacy", ["是", "否"])}
            ${formSelect("是否同意健康資料", "m_health", ["不適用", "是", "否"])}
            ${formTextarea("備註", "m_note")}
          </div>
          <br>
          <button class="btn-primary" onclick="createMember()">新增會員</button>
        </div>
      `;
    }

    async function createMember() {
      const payload = {
        name: val("m_name"),
        memberType: val("m_type"),
        identity: val("m_identity"),
        phone: val("m_phone"),
        email: val("m_email"),
        address: val("m_address"),
        privacyConsent: val("m_privacy"),
        healthConsent: val("m_health"),
        note: val("m_note")
      };

      try {
        const res = await callGas("apiCreateMemberByToken", idToken, payload);
        alert(res.message);
        loadMembers();
      } catch (err) {
        handleError(err);
      }
    }

    async function loadDonations() {
      try {
        const rows = await callGas("apiListDonationsByToken", idToken);

        document.getElementById("donations").innerHTML = `

    async function uploadFile() {
      const fileInput = document.getElementById("f_file");
      const file = fileInput.files[0];

      if (!file) {
        alert("請選擇檔案");
        return;
      }

      if (file.size > MAX_FILE_SIZE) {
        alert("檔案過大，請上傳 8MB 以下檔案");
        return;
      }

      const base64 = await fileToBase64(file);

      const payload = {
        module: val("f_module"),
        relatedId: val("f_relatedId"),
        hasPersonalData: val("f_personal"),
        hasSensitiveData: val("f_sensitive"),
        note: val("f_note"),
        fileName: file.name,
        mimeType: file.type || "application/octet-stream",
        base64
      };

      try {
        const res = await callGas("apiUploadFileByToken", idToken, payload);
        alert("上傳完成：" + res.url);
      } catch (err) {
        handleError(err);
      }
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onload = () => {
          const result = reader.result;
          const base64 = result.split(",")[1];
          resolve(base64);
        };

        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }
