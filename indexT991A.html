<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>病友入會與服務建檔 - 台灣帕金森病友權益促進會</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/2.1/sdk.js"></script>
  <style>
    /* 友善無障礙點擊熱區與字級防呆 */
    input, select, button {
      min-height: 54px;
      font-size: 1.15rem !important;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 p-4 min-h-screen flex items-center justify-center">
  <div class="max-w-md w-full bg-white rounded-3xl shadow-xl border border-slate-200 p-6 space-y-6">
    
    <!-- 協會標誌與抬頭 -->
    <div class="text-center space-y-1">
      <span class="inline-block px-3 py-1 bg-sky-100 text-sky-800 text-xs font-bold rounded-full">社團法人立案輔導</span>
      <h1 class="text-2xl font-bold text-sky-900 tracking-wide mt-1">台灣帕金森病友權益促進會</h1>
      <p class="text-sm text-slate-500 font-medium">病友入會申請 暨 關懷健康建檔</p>
    </div>

    <form id="regForm" class="space-y-4" onsubmit="event.preventDefault(); submitRegistration();">
      <!-- 姓名 -->
      <div>
        <label class="block text-slate-700 font-semibold mb-1">姓名 / 稱呼 <span class="text-rose-500">*</span></label>
        <input type="text" id="pName" required placeholder="請輸入姓名"
               class="w-full px-4 rounded-xl border border-slate-300 focus:ring-2 focus:ring-sky-500 focus:outline-none">
      </div>

      <!-- 身分證號 -->
      <div>
        <label class="block text-slate-700 font-semibold mb-1">身分證字號 <span class="text-rose-500">*</span></label>
        <input type="text" id="pId" required maxlength="10" placeholder="例如：A123456789"
               class="w-full px-4 rounded-xl border border-slate-300 uppercase focus:ring-2 focus:ring-sky-500 focus:outline-none">
        <p class="text-xs text-slate-400 mt-1">依法受特種個資隔離保護，僅用於會員大會名冊與保險備查。</p>
      </div>

      <!-- 帕金森疾病分期 -->
      <div>
        <label class="block text-slate-700 font-semibold mb-1">疾病期數（Hoehn & Yahr 分期）</label>
        <select id="pStage" class="w-full px-4 rounded-xl border border-slate-300 bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none">
          <option value="1">第一期（單側症狀，輕微震顫或動作遲緩）</option>
          <option value="2">第二期（雙側症狀，但姿勢平衡仍正常）</option>
          <option value="3">第三期（出現步態不穩與平衡障礙，輕至中度失能）</option>
          <option value="4">第四期（嚴重障礙，需依賴輔具或專人攙扶）</option>
          <option value="5">第五期（需仰賴輪椅或完全臥床）</option>
          <option value="0">家屬 / 關懷支持者（非病友本人）</option>
        </select>
      </div>

      <!-- 聯絡電話 -->
      <div>
        <label class="block text-slate-700 font-semibold mb-1">聯絡手機</label>
        <input type="tel" id="pPhone" placeholder="例如：0912345678"
               class="w-full px-4 rounded-xl border border-slate-300 focus:ring-2 focus:ring-sky-500 focus:outline-none">
      </div>

      <!-- 個資法第6條特種個資同意聲明 (高對比醒目卡片) -->
      <div class="bg-amber-50 rounded-2xl p-4 border border-amber-300 text-xs text-amber-950 space-y-2">
        <p class="font-bold text-sm text-amber-900">【個資法第 6 條 特種健康個資法定告知】</p>
        <p class="leading-relaxed">
          本會為辦理病友權益爭取、長照與輔具諮詢、復健補助等公益目的，須蒐集並處理台端之健康狀態與醫療分期。本會恪遵內部控制制度，採獨立加密保險庫隔離存取，絕不移作其他商業用途。
        </p>
        <div class="flex items-center space-x-3 pt-2">
          <input type="checkbox" id="pConsent" required class="w-6 h-6 rounded text-sky-600 focus:ring-sky-500">
          <label for="pConsent" class="text-sm font-bold text-slate-800">本人已詳閱並完全同意上述特種個資處理條款</label>
        </div>
      </div>

      <!-- 提交按鈕 -->
      <button type="submit" id="submitBtn"
              class="w-full bg-sky-700 hover:bg-sky-800 text-white font-bold py-4 rounded-2xl shadow-lg transition duration-150 text-lg">
        同意條款並完成登記
      </button>
    </form>
  </div>

  <script>
    // 請替換為您的 LIFF ID 與 GAS 發布之 Web App URL
    const LIFF_ID = "2009456572-588gzru4";
    const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwJlYsD4Bym6ewbpoRI7-RR8Mh5v1HgHhn8hnwJy3DWiYpPYHrg2Vr7blDvmXjFydMM/exec";

    let currentUserProfile = null;

    window.onload = function() {
      if (typeof liff !== "undefined" && LIFF_ID !== "YOUR_LIFF_ID_HERE") {
        liff.init({ liffId: LIFF_ID })
          .then(() => {
            if (!liff.isLoggedIn()) {
              liff.login();
            } else {
              liff.getProfile().then(profile => {
                currentUserProfile = profile;
              });
            }
          })
          .catch(err => console.error("LIFF Init Failed:", err));
      }
    };

    function submitRegistration() {
      const consent = document.getElementById("pConsent").checked;
      const name = document.getElementById("pName").value.trim();
      const idNo = document.getElementById("pId").value.trim().toUpperCase();
      const stage = document.getElementById("pStage").value;
      const phone = document.getElementById("pPhone").value.trim();

      if (!consent) {
        alert("請詳閱並勾選特種個資處理法定同意書。");
        return;
      }

      const idRegex = /^[A-Z][12]\d{8}$/;
      if (!idRegex.test(idNo)) {
        alert("請輸入格式正確的中華民國身分證字號。");
        return;
      }

      const payload = {
        action: "register_patient",
        data: {
          lineUid: currentUserProfile ? currentUserProfile.userId : "DIRECT_WEB_USER",
          name: name,
          nationalId: idNo,
          stage: stage,
          phone: phone,
          consent: consent
        }
      };

      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.innerText = "資料加密傳輸中...";

      fetch(GAS_WEBAPP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(result => {
        if (result.success) {
          alert(`登記成功！您的專屬案號為【${result.caseNo}】。系統已同步推播通知至您的 LINE。`);
          if (typeof liff !== "undefined" && liff.isInClient()) {
            liff.closeWindow();
          }
        } else {
          alert("登記失敗：" + (result.message || "伺服器錯誤"));
          btn.disabled = false;
          btn.innerText = "重新提交";
        }
      })
      .catch(err => {
        alert("傳輸發生錯誤，請檢查網路連線或直接聯絡促進會秘書處。");
        btn.disabled = false;
        btn.innerText = "同意條款並完成登記";
      });
    }
  </script>
</body>
</html>
