<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>台灣帕金森病友權益促進會管理系統</title>
  <style>
    :root {
      --primary: #1f4e79;
      --primary-dark: #163a59;
      --secondary: #f4f7fb;
      --success: #2e7d32;
      --warning: #f9a825;
      --danger: #c62828;
      --muted: #6b7280;
      --border: #d9e2ec;
      --bg: #eef3f8;
      --card: #ffffff;
      --text: #1f2937;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 280px;
      background: var(--primary);
      color: #fff;
      padding: 20px 16px;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      overflow-y: auto;
    }

    .brand {
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .brand h1 {
      font-size: 20px;
      line-height: 1.4;
      margin: 0 0 8px;
    }

    .brand p {
      margin: 0;
      font-size: 13px;
      opacity: 0.85;
    }

    .nav button {
      width: 100%;
      background: transparent;
      border: 0;
      color: #fff;
      text-align: left;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      margin-bottom: 6px;
    }

    .nav button:hover,
    .nav button.active {
      background: rgba(255,255,255,0.16);
    }

    .main {
      margin-left: 280px;
      width: calc(100% - 280px);
      padding: 24px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .topbar h2 {
      margin: 0;
      font-size: 28px;
    }

    .user-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 14px;
      color: var(--muted);
      font-size: 14px;
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .grid-4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .grid-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 6px 18px rgba(31,78,121,0.06);
    }

    .stat-title {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 8px;
    }

    .stat-number {
      font-size: 32px;
      font-weight: 700;
      color: var(--primary);
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .toolbar-left,
    .toolbar-right {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    button,
    .btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-secondary {
      background: #e6edf5;
      color: var(--primary);
    }

    .btn-danger {
      background: #fde8e8;
      color: var(--danger);
    }

    .btn-success {
      background: #e8f5e9;
      color: var(--success);
    }

    .btn-warning {
      background: #fff8e1;
      color: #8a6400;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      background: #fff;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .search {
      min-width: 260px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
    }

    th,
    td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      vertical-align: top;
    }

    th {
      background: #f1f5f9;
      color: #334155;
      text-align: left;
      font-weight: 700;
    }

    tr:hover td {
      background: #f8fafc;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .badge-success {
      background: #e8f5e9;
      color: var(--success);
    }

    .badge-warning {
      background: #fff8e1;
      color: #8a6400;
    }

    .badge-danger {
      background: #fde8e8;
      color: var(--danger);
    }

    .badge-info {
      background: #e3f2fd;
      color: #1565c0;
    }

    .badge-muted {
      background: #f1f5f9;
      color: #64748b;
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal {
      background: #fff;
      width: min(860px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 18px;
      padding: 22px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 22px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 13px;
      font-weight: 700;
      color: #475569;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .notice {
      background: #fff8e1;
      border: 1px solid #f6d365;
      color: #6b4e00;
      padding: 14px 16px;
      border-radius: 14px;
      margin-bottom: 18px;
      line-height: 1.6;
    }

    .danger-note {
      background: #fde8e8;
      border: 1px solid #f7b4b4;
      color: #8a1f1f;
    }

    .empty {
      padding: 30px;
      text-align: center;
      color: var(--muted);
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .tab {
      background: #e6edf5;
      color: var(--primary);
    }

    .tab.active {
      background: var(--primary);
      color: #fff;
    }

    .footer-note {
      margin-top: 28px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 960px) {
      .sidebar {
        position: static;
        width: 100%;
        height: auto;
      }

      .app {
        display: block;
      }

      .main {
        margin-left: 0;
        width: 100%;
      }

      .grid-4,
      .grid-3,
      .form-grid {
        grid-template-columns: 1fr;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
        gap: 12px;
      }
    }
  </style>
</head>

    function loadState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return structuredClone(initialState);
      try {
        return { ...structuredClone(initialState), ...JSON.parse(raw) };
      } catch {
        return structuredClone(initialState);
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function generateId(prefix, collection) {
      const year = new Date().getFullYear();
      const next = collection.length + 1;
      return `${prefix}-${year}-${String(next).padStart(6, "0")}`;
    }

    function today() {
      return new Date().toISOString().slice(0, 10);
    }

    function money(value) {
      return `NT$ ${Number(value || 0).toLocaleString("zh-TW")}`;
    }

    function maskId(value) {
      if (!value) return "";
      const s = String(value);
      if (s.length <= 4) return "****";
      return `${s.slice(0, 2)}****${s.slice(-2)}`;
    }

    function containsAny(text, keywords) {
      if (!text) return false;
      return keywords.some(k => String(text).includes(k));
    }

    function badge(text, type = "muted") {
      return `<span class="badge badge-${type}">${text || "未填"}</span>`;
    }

    function statusBadge(text) {
      const danger = ["高風險", "需人工確認", "停權", "作廢", "否"];
      const warning = ["待補件", "待確認", "未開立", "補件", "送審", "申請中", "草稿", "處理中", "待處理"];
      const success = ["有效會員", "已開立", "已寄送", "核准", "已付款", "已入帳", "結案", "有效", "是"];
      if (danger.includes(text)) return badge(text, "danger");
      if (warning.includes(text)) return badge(text, "warning");
      if (success.includes(text)) return badge(text, "success");
      return badge(text, "muted");
    }

    function classifyService(content) {
      const categories = [];
      let medical = "否";
      let sensitive = "否";
      let highRisk = "否";

      if (containsAny(content, ["入會", "會費", "會員"])) categories.push("會員或會務問題");
      if (containsAny(content, ["報名", "活動", "講座"])) categories.push("活動報名");
      if (containsAny(content, ["衛教", "資訊", "資料", "手冊"])) categories.push("衛教資訊需求");
      if (containsAny(content, ["照顧", "照護", "家屬", "照顧者"])) categories.push("照顧者支持");
      if (containsAny(content, ["長照", "社福", "補助", "資源", "福利"])) categories.push("社福或長照資源");

      if (containsAny(content, ["用藥", "副作用", "治療", "診斷", "醫師", "藥物", "手術", "病情"])) {
        categories.push("就醫或醫療諮詢需求");
        medical = "是";
        sensitive = "是";
      }

      if (containsAny(content, ["自殺", "想死", "昏倒", "呼吸困難", "緊急", "危險", "傷害自己"])) {
        categories.push("緊急或高風險狀況");
        highRisk = "是";
        sensitive = "是";
      }

      if (categories.length === 0) categories.push("其他");

      return {
        category: categories.join("；"),
        medical,
        sensitive,
        highRisk,
        suggestion: highRisk === "是"
          ? "高風險，請立即人工處理。若為危急狀況，請提醒撥打 119 或前往急診。"
          : medical === "是"
            ? "涉及醫療建議，請提醒當事人諮詢主治醫師或合格醫療專業人員。"
            : "建議由承辦人依分類回覆。"
      };
    }

    function checkDonation(record) {
      const issues = [];
      const risks = [];
      if (!record.donationDate) issues.push("捐款日期缺漏");
      if (!record.donorName) issues.push("捐款人缺漏");
      if (!Number(record.amount)) issues.push("金額異常");
      if (!record.method) issues.push("收款方式缺漏");
      if (!record.purpose) issues.push("指定用途不明");
      if (record.needReceipt === "是" && !record.receiptNo) issues.push("需收據但尚未填入收據號碼");
      if (Number(record.amount) >= Number(state.settings.largeDonationThreshold)) risks.push("大額捐款需人工確認");

      return {
        result: risks.length ? "需人工確認" : issues.length ? "需補件" : "可送會計確認",
        issues: issues.join("；"),
        risks: risks.join("；")
      };
    }

    function checkExpense(record) {
      const issues = [];
      const risks = [];
      const withholdingItems = ["講師費", "稿費", "出席費", "薪資", "租金", "勞務費", "顧問費"];

      if (!record.applicant) issues.push("申請人缺漏");
      if (!record.expenseDate) issues.push("支出日期缺漏");
      if (!record.purpose) issues.push("支出用途缺漏");
      if (!record.subject) issues.push("支出科目缺漏");
      if (!Number(record.amount)) issues.push("金額異常");
      if (!record.voucherUrl) issues.push("憑證附件缺漏");

      if (withholdingItems.includes(record.subject)) risks.push("可能涉及扣繳");
      if (record.relatedParty === "是" || record.relatedParty === "待確認") risks.push("關係人交易需確認");
      if (Number(record.amount) >= Number(state.settings.largeExpenseThreshold)) risks.push("大額支出需雙重簽核");

      return {
        result: risks.length ? "需主管或會計確認" : issues.length ? "需補件" : "可送審",
        issues: issues.join("；"),
        risks: risks.join("；"),
        withholding: withholdingItems.includes(record.subject) ? "是" : "否"
      };
    }

    function tablePage({ type, title, addText, columns, rows }) {
      return `
        <div class="toolbar">
          <div class="toolbar-left">
            <h3>${title}</h3>
          </div>
          <div class="toolbar-right">
            <input class="search" placeholder="搜尋..." oninput="filterCurrentTable(this.value)">
            <button class="btn-primary" onclick="openModal('${type}')">${addText}</button>
          </div>
        </div>
        ${simpleTable({ columns, rows })}
      `;
    }

    function simpleTable({ columns, rows }) {
      if (!rows.length) {
        return `<div class="card empty">目前沒有資料</div>`;
      }

      return `
        <div class="card" style="overflow:auto;">
          <table id="currentTable">
            <thead>
              <tr>${columns.map(c => `<th>${c}</th>`).join("")}</tr>
            </thead>
            <tbody>
              ${rows.map(row => `<tr>${row.map(cell => `<td>${cell ?? ""}</td>`).join("")}</tr>`).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function actions(type, id) {
      return `
        <button class="btn-secondary" onclick="viewRecord('${type}','${id}')">檢視</button>
        <button class="btn-danger" onclick="removeRecord('${type}','${id}')">刪除</button>
      `;
    }

    function filterCurrentTable(keyword) {
      const table = document.getElementById("currentTable");
      if (!table) return;

      const rows = table.querySelectorAll("tbody tr");
      rows.forEach(row => {
        const text = row.textContent.toLowerCase();
        row.style.display = text.includes(keyword.toLowerCase()) ? "" : "none";
      });
    }

    function openModal(type) {
      currentFormType = type;
      const schema = schemas[type];

      document.getElementById("modalTitle").textContent = `新增${schema.title}`;
      const form = document.getElementById("modalForm");

      form.innerHTML = `
        <div class="form-grid">
          ${schema.fields.map(field => fieldHtml(field)).join("")}
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary" onclick="closeModal()">取消</button>
          <button type="submit" class="btn-primary">儲存</button>
        </div>
      `;

      form.onsubmit = handleSubmit;
      document.getElementById("modalBackdrop").classList.add("active");
    }

    function fieldHtml(field) {
      const required = field.required ? "required" : "";
      const full = field.type === "textarea" ? "full" : "";

      if (field.type === "select") {
        return `
          <div class="form-group ${full}">
            <label>${field.label}${field.required ? " *" : ""}</label>
            <select name="${field.name}" ${required}>
              <option value="">請選擇</option>
              ${field.options.map(o => `<option value="${o}">${o}</option>`).join("")}
            </select>
          </div>
        `;
      }

      if (field.type === "textarea") {
        return `
          <div class="form-group full">
            <label>${field.label}${field.required ? " *" : ""}</label>
            <textarea name="${field.name}" ${required}></textarea>
          </div>
        `;
      }

      const defaultValue = field.type === "date" ? today() : "";

      return `
        <div class="form-group ${full}">
          <label>${field.label}${field.required ? " *" : ""}</label>
          <input name="${field.name}" type="${field.type}" value="${defaultValue}" ${required}>
        </div>
      `;
    }

    function closeModal() {
      document.getElementById("modalBackdrop").classList.remove("active");
      currentFormType = null;
    }

    function handleSubmit(e) {
      e.preventDefault();

      const type = currentFormType;
      const schema = schemas[type];
      const data = Object.fromEntries(new FormData(e.target).entries());

      const idValue = generateId(schema.idPrefix, state[type]);

      if (schema.idField === "receiptNo") {
        data.receiptNo = idValue;
      } else {
        data.id = idValue;
      }

      data.createdAt = new Date().toISOString();

      if (type === "members") {
        if (!data.feeYear) data.feeYear = new Date().getFullYear();
        data.reviewResult = checkMember(data);
      }

      if (type === "donations") {
        const check = checkDonation(data);
        data.checkResult = check.result;
        data.issues = check.issues;
        data.risks = check.risks;
        if (!data.receiptStatus) data.receiptStatus = "未開立";
      }

      if (type === "expenses") {
        const check = checkExpense(data);
        data.checkResult = check.result;
        data.issues = check.issues;
        data.risks = check.risks;
        data.withholding = check.withholding;
      }

      if (type === "services") {
        const classified = classifyService(data.content);
        Object.assign(data, classified);
      }

      if (type === "volunteers") {
        data.totalHours = Number(data.totalHours || 0);
      }

      state[type].push(data);
      saveState();
      closeModal();
      render();
    }

    function checkMember(record) {
      const issues = [];
      if (!record.name) issues.push("姓名缺漏");
      if (!record.phone && !record.email) issues.push("聯絡方式缺漏");
      if (record.privacyConsent !== "是") issues.push("尚未取得個資同意");
      return issues.length ? "需補件" : "可送權責人員人工審核";
    }

    function findRecord(type, id) {
      const schema = schemas[type];
      const idField = schema.idField;
      return state[type].find(item => String(item[idField]) === String(id));
    }

    function viewRecord(type, id) {
      const record = findRecord(type, id);
      if (!record) return;

      const schema = schemas[type];
      document.getElementById("modalTitle").textContent = `檢視${schema.title}`;

      const rows = Object.entries(record).map(([key, value]) => `
        <tr>
          <th style="width:220px;">${key}</th>
          <td>${value ?? ""}</td>
        </tr>
      `).join("");

      document.getElementById("modalForm").innerHTML = `
        <div class="card" style="padding:0; overflow:auto;">
          <table>
            <tbody>${rows}</tbody>
          </table>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary" onclick="closeModal()">關閉</button>
        </div>
      `;

      document.getElementById("modalBackdrop").classList.add("active");
    }

    function removeRecord(type, id) {
      if (!confirm("確定要刪除此筆資料？此動作僅刪除前端 localStorage 資料。")) return;

      if (type === "reports") {
        state.reports = state.reports.filter(r => r.id !== id);
      } else {
        const schema = schemas[type];
        state[type] = state[type].filter(item => String(item[schema.idField]) !== String(id));
      }

      saveState();
      render();
    }

    function saveSettings() {
      state.settings.associationName = document.getElementById("settingAssociationName").value;
      state.settings.privacyVersion = document.getElementById("settingPrivacyVersion").value;
      state.settings.largeDonationThreshold = Number(document.getElementById("settingLargeDonationThreshold").value || 100000);
      state.settings.largeExpenseThreshold = Number(document.getElementById("settingLargeExpenseThreshold").value || 50000);
      saveState();
      alert("設定已儲存");
      render();
    }

    function generateMonthlyReport() {
      const now = new Date();
      const ym = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;

      const income = state.donations.reduce((sum, d) => sum + Number(d.amount || 0), 0);
      const expense = state.expenses.reduce((sum, e) => sum + Number(e.amount || 0), 0);
      const pendingReceipts = state.donations.filter(d => d.needReceipt === "是" && !d.receiptNo).length;
      const withholding = state.expenses.filter(e => e.withholding === "是").length;
      const missingVoucher = state.expenses.filter(e => !e.voucherUrl).length;
      const largeExpense = state.expenses.filter(e => Number(e.amount) >= Number(state.settings.largeExpenseThreshold)).length;

      const report = {
        id: generateId("RPT", state.reports),
        ym,
        income,
        expense,
        balance: income - expense,
        pendingReceipts,
        withholding,
        missingVoucher,
        largeExpense,
        summary: `本月收入 ${money(income)}，支出 ${money(expense)}，結餘 ${money(income - expense)}。待開收據 ${pendingReceipts} 筆，可能扣繳 ${withholding} 筆。`,
        createdAt: new Date().toISOString()
      };

      state.reports.push(report);
      saveState();
      setSection("reports");
      alert("已產生財務月報");
    }

      if (!confirm("是否建立示範資料？")) return;

      });

      const donation = {

      };
      Object.assign(donation, {
        checkResult: checkDonation(donation).result,

        risks: checkDonation(donation).risks
      });
      state.donations.push(donation);

      const expense = {
        id: generateId("EXP", state.expenses),

      };

        id: generateId("SR", state.services),

      render();

    }

    function resetSystem() {
      if (!confirm("確定清空所有前端資料？此動作無法復原。")) return;
      state = structuredClone(initialState);
      saveState();
      render();
    }

    function exportJson() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `tpa-management-export-${Date.now()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    render();
  </script>
</body>
