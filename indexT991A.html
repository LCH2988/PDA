<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社團法人台灣帕金森病友權益促進會</title>
  
  <!-- 1. 引入 Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 2. 引入 React 與 ReactDOM (CDN) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- 3. 引入 Babel (用於在瀏覽器中即時解析 JSX) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- 4. 引入 Lucide 圖標庫 -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800">

  <!-- React 渲染的根節點 -->
  <div id="root"></div>

  <!-- React 程式碼區塊 -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // 預設展示資料
    const initialFallbackData = {
      info: [
        { id: "info-1", category: "醫療衛教", title: "認識帕金森氏症的早期五大警訊", content: "手部顫抖、肢體僵硬、動作遲緩、步態不穩以及面部表情僵硬（面具臉）是常見的早期徵兆。若發現家人有類似症狀，建議盡早至神經內科門診檢查。", date: "2026-07-20" },
        { id: "info-2", category: "權益倡議", title: "爭取帕金森病友納入特定身心障礙補助公聽會", content: "本會將於下個月聯合立法委員召開公聽會，爭取放寬帕金森氏症中晚期患者的失能評估標準，讓更多家庭獲得實質長照補助。", date: "2026-07-25" }
      ],
      forum: [
        { id: "forum-1", author: "王大同", role: "member", content: "爸爸最近剛診斷出帕金森，服用左多巴胺後有些輕微噁心，請問大家初期都怎麼適應藥物副作用呢？", timestamp: "2026-07-26 10:30", likes: 12, likedBy: ["user-1"], isPinned: true },
        { id: "forum-2", author: "李阿姨", role: "member", content: "回覆大同：初期可以嘗試在吃藥前吃一點小餅乾，但切記不要與高蛋白食物（如牛奶、肉類）一起吃，會影響藥效吸收喔！加油！", timestamp: "2026-07-26 11:15", likes: 8, likedBy: [], isPinned: false }
      ],
      activities: [
        { 
          id: "act-1", 
          title: "「旋風球」動能復健體驗營", 
          images: [
            "https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1517838277536-f5f99be501cd?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?auto=format&fit=crop&w=800&q=80"
          ], 
          description: "透過趣味的旋風球運動，訓練帕友的手眼協調與大肌肉群，活化神經傳導，現場歡笑聲與汗水交織！", 
          date: "2026-07-12" 
        }
      ],
      stats: [
        { id: "1", label: "全台受影響家庭", value: "60,000", unit: "戶以上" },
        { id: "2", label: "本會服務會員", value: "1,250", unit: "人" },
        { id: "3", label: "年度舉辦復健活動", value: "48", unit: "場次" },
        { id: "4", label: "權益爭取倡議案", value: "5", unit: "案" }
      ],
      about: {
        intro: "社團法人台灣帕金森病友權益促進會（簡稱「帕促會」）成立於 2019 年，是由一群熱心的帕金森氏症病友、家屬及專業醫療人員共同發起的非營利組織。我們深知帕金森氏症對患者及家庭帶來的身心衝擊，因此致力於建立一個溫暖、互助且具備倡議力量的大家庭。",
        mission: [
          "保障權益：推動政策立法，爭取合理的社會福利與長照補助。",
          "衛教推廣：提供正確、即時的醫療資訊與生活照護指引，延緩病程。",
          "復健支持：推廣「旋風球」等特色動能復健運動，重建病友肢體協調與自信。",
          "深耕關懷：建立病友與家屬的互助網絡，提供心理諮商與喘息服務。"
        ],
        address: "新北市三重區中正北路518號8樓",
        phone: "02-2980-XXXX",
        email: "tpda20190121@gmail.com",
        donate: "合作金庫銀行 (006) 帳號：XXXX-XXX-XXXXXX / 戶名：社團法人台灣帕金森病友權益促進會"
      }
    };

    // 簡易 Lucide 圖標組件
    function Icon({ name, className = "h-5 w-5", fill = "none" }) {
      useEffect(() => {
        lucide.createIcons();
      }, [name]);
      return <i data-lucide={name} class={className} style={{ fill: fill }}></i>;
    }

    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [gasUrl, setGasUrl] = useState('');
      const [data, setData] = useState(initialFallbackData);
      const [loading, setLoading] = useState(false);

      // 會員模擬登入狀態 (預設一個模擬會員)
      const [currentUser, setCurrentUser] = useState({ id: "user-1", name: "王大同" });

      // 管理員狀態
      const [isAdmin, setIsAdmin] = useState(false);
      const [adminPassword, setAdminPassword] = useState('');
      const [showLoginModal, setShowLoginModal] = useState(false);

      // 燈箱 (Lightbox) 狀態
      const [lightbox, setLightbox] = useState({ isOpen: false, images: [], currentIndex: 0 });

      // 編輯表單彈窗狀態
      const [activeModal, setActiveModal] = useState(null);
      const [infoForm, setInfoForm] = useState({ id: '', category: '醫療衛教', title: '', content: '', date: '' });
      const [activityForm, setActivityForm] = useState({ id: '', title: '', images: ['', '', ''], description: '', date: '' });
      const [statsForm, setStatsForm] = useState([]);
      const [forumForm, setForumForm] = useState({ id: '', author: '', content: '', isPinned: false });
      const [aboutForm, setAboutForm] = useState({ intro: '', mission: [], address: '', phone: '', email: '', donate: '' });

      // 一般論壇貼文狀態
      const [newContent, setNewContent] = useState('');

      // 1. 從 GAS 獲取最新資料
      const fetchData = async () => {
        if (!gasUrl) {
          alert("請在上方輸入您的 GAS Web App API 網址以進行同步。");
          return;
        }
        setLoading(true);
        try {
          const res = await fetch(`${gasUrl}?action=getData`);
          const result = await res.json();
          if (result.status === 'success') {
            setData(result.data);
          } else {
            alert("讀取失敗：" + result.message);
          }
        } catch (err) {
          alert("無法連線至 API，請確認您的 GAS 部署設定為「任何人」皆可存取，且網址正確。");
        } finally {
          setLoading(false);
        }
      };

      // 2. 論壇：按讚與取消讚
      const handleLikePost = async (postId) => {
        const updatedForum = data.forum.map(post => {
          if (post.id === postId) {
            const likedBy = post.likedBy || [];
            const hasLiked = likedBy.includes(currentUser.id);
            const newLikedBy = hasLiked 
              ? likedBy.filter(id => id !== currentUser.id)
              : [...likedBy, currentUser.id];
            return {
              ...post,
              likes: hasLiked ? post.likes - 1 : post.likes + 1,
              likedBy: newLikedBy
            };
          }
          return post;
        });

        if (!gasUrl) {
          setData(prev => ({ ...prev, forum: updatedForum }));
          return;
        }

        // 如果有 GAS，則發送 POST 同步
        try {
          await fetch(gasUrl, {
            method: 'POST',
            body: JSON.stringify({ action: 'likePost', userId: currentUser.id, postId })
          });
          fetchData();
        } catch (err) {
          console.error("按讚同步失敗", err);
        }
      };

      // 3. 論壇：發表新貼文 (會員權限)
      const handleAddPost = async (e) => {
        e.preventDefault();
        if (!newContent) return;

        const newPost = { 
          id: "forum-" + Date.now().toString(), 
          author: currentUser.name, 
          role: "member",
          content: newContent, 
          timestamp: new Date().toLocaleString("zh-TW", { timeZone: "Asia/Taipei" }),
          likes: 0,
          likedBy: [],
          isPinned: false
        };

        if (!gasUrl) {
          setData(prev => ({ ...prev, forum: [newPost, ...prev.forum] }));
          setNewContent('');
          return;
        }

        setLoading(true);
        try {
          const res = await fetch(gasUrl, {
            method: 'POST',
            body: JSON.stringify({ action: 'addPost', ...newPost })
          });
          const result = await res.json();
          if (result.status === 'success') {
            setNewContent('');
            fetchData();
          } else {
            alert("發布失敗：" + result.message);
          }
        } catch (err) {
          alert("發布貼文時發生連線錯誤。");
        } finally {
          setLoading(false);
        }
      };

      // 4. 論壇：修改貼文 (會員維護自己/管理員維護全部)
      const handleSaveForumPost = async (e) => {
        e.preventDefault();
        const updatedForum = data.forum.map(post => {
          if (post.id === forumForm.id) {
            return { ...post, content: forumForm.content, isPinned: forumForm.isPinned };
          }
          return post;
        });

        if (!gasUrl) {
          setData(prev => ({ ...prev, forum: updatedForum }));
          setActiveModal(null);
          return;
        }

        setLoading(true);
        try {
          const res = await fetch(gasUrl, {
            method: 'POST',
            body: JSON.stringify({ action: 'saveForum', password: adminPassword, ...forumForm })
          });
          const result = await res.json();
          if (result.status === 'success') {
            setActiveModal(null);
            fetchData();
          } else {
            alert("儲存失敗：" + result.message);
          }
        } catch (err) {
          alert("連線錯誤。");
        } finally {
          setLoading(false);
        }
      };

      // 5. 管理員：儲存資訊 (新增/修改)
      const handleSaveInfo = async (e) => {
        e.preventDefault();
        if (!gasUrl) {
          const updatedList = [...data.info];
          const index = updatedList.findIndex(item => item.id === infoForm.id);
          const newItem = { ...infoForm, id: infoForm.id || "info-" + Date.now().toString(), date: infoForm.date || new Date().toISOString().split('T')[0] };
          if (index > -1) updatedList[index] = newItem;
          else updatedList.unshift(newItem);
          setData(prev => ({ ...prev, info: updatedList }));
          setActiveModal(null);
          return;
        }

        setLoading(true);
        try {
          const res = await fetch(gasUrl, {
            method: 'POST',
            body: JSON.stringify({ action: 'saveInfo', password: adminPassword, ...infoForm })
          });
          const result = await res.json();
          if (result.status === 'success') {
            setActiveModal(null);
            fetchData();
          } else {
            alert("儲存失敗：" + result.message);
          }
        } catch (err) {
          alert("連線錯誤。");
        } finally {
          setLoading(false);
        }
      };

      // 6. 管理員：儲存活動花絮 (新增/修改)
      const handleSaveActivity = async (e) => {
        e.preventDefault();
        // 過濾掉空網址
        const validImages = activityForm.images.filter(url => url.trim() !== '');
        const formattedForm = { ...activityForm, images: validImages };

        if (!gasUrl) {
          const updatedList = [...data.activities];
          const index = updatedList.findIndex(item => item.id === formattedForm.id);
          const newItem = { ...formattedForm, id: formattedForm.id || "act-" + Date.now().toString(), date: formattedForm.date || new Date().toISOString().split('T')[0] };
          if (index > -1) updatedList[index] = newItem;
          else updatedList.unshift(newItem);
          setData(prev => ({ ...prev, activities: updatedList }));
          setActiveModal(null);
          return;
        }

        setLoading(true);
        try {
          const res = await fetch(gasUrl, {
            method: 'POST',
            body: JSON.stringify({ action: 'saveActivity', password: adminPassword, ...formattedForm })
          });
          const result = await res.json();
          if (result.status === 'success') {
            setActiveModal(null);
            fetchData();
          } else {
            alert("儲存失敗：" + result.message);
          }
        } catch (err) {
          alert("連線錯誤。");
        } finally {
          setLoading(false);
        }
      };

      // 7. 管理員：儲存統計數據
      const handleSaveStats = async (e) => {
        e.preventDefault();
        if (!gasUrl) {
          setData(prev => ({ ...prev, stats: statsForm }));
          setActiveModal(null);
          return;
        }

        setLoading(true);
        try {
          const res = await fetch(gasUrl, {
            method: 'POST',
            body: JSON.stringify({ action: 'saveStats', password: adminPassword, statsList: statsForm })
          });
          const result = await res.json();
          if (result.status === 'success') {
            setActiveModal(null);
            fetchData();
          } else {
            alert("儲存失敗：" + result.message);
          }
        } catch (err) {
          alert("連線錯誤。");
        } finally {
          setLoading(false);
        }
      };

      // 8. 管理員：儲存關於本會資訊
      const handleSaveAbout = async (e) => {
        e.preventDefault();
        if (!gasUrl) {
          setData(prev => ({ ...prev, about: aboutForm }));
          setActiveModal(null);
          return;
        }

        setLoading(true);
        try {
          const res = await fetch(gasUrl, {
            method: 'POST',
            body: JSON.stringify({ action: 'saveAbout', password: adminPassword, ...aboutForm })
          });
          const result = await res.json();
          if (result.status === 'success') {
            setActiveModal(null);
            fetchData();
          } else {
            alert("儲存失敗：" + result.message);
          }
        } catch (err) {
          alert("連線錯誤。");
        } finally {
          setLoading(false);
        }
      };

      // 9. 管理員：刪除資料 (通用)
      const handleDeleteRow = async (targetSheet, id) => {
        if (!window.confirm("確定要刪除這筆資料嗎？此動作無法復原。")) return;

        if (!gasUrl) {
          setData(prev => ({
            ...prev,
            [targetSheet]: prev[targetSheet].filter((item) => item.id !== id)
          }));
          return;
        }

        setLoading(true);
        try {
          const res = await fetch(gasUrl, {
            method: 'POST',
            body: JSON.stringify({ action: 'deleteRow', password: adminPassword, targetSheet, id })
          });
          const result = await res.json();
          if (result.status === 'success') {
            fetchData();
          } else {
            alert("刪除失敗：" + result.message);
          }
        } catch (err) {
          alert("連線錯誤。");
        } finally {
          setLoading(false);
        }
      };

      // 登入管理員
      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (adminPassword) {
          setIsAdmin(true);
          setShowLoginModal(false);
        }
      };

      // 燈箱控制
      const openLightbox = (images, index) => {
        setLightbox({ isOpen: true, images, currentIndex: index });
      };

      const closeLightbox = () => {
        setLightbox({ isOpen: false, images: [], currentIndex: 0 });
      };

      const prevImage = (e) => {
        e.stopPropagation();
        setLightbox(prev => ({
          ...prev,
          currentIndex: (prev.currentIndex - 1 + prev.images.length) % prev.images.length
        }));
      };

      const nextImage = (e) => {
        e.stopPropagation();
        setLightbox(prev => ({
          ...prev,
          currentIndex: (prev.currentIndex + 1) % prev.images.length
        }));
      };

      // 排序論壇貼文：置頂 (isPinned) 優先，其餘按時間/ID倒序
      const sortedForumPosts = [...data.forum].sort((a, b) => {
        if (a.isPinned && !b.isPinned) return -1;
        if (!a.isPinned && b.isPinned) return 1;
        return b.id.localeCompare(a.id);
      });

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 flex flex-col">
          {/* 頂部導覽 */}
          <header className="bg-emerald-600 text-white shadow-md sticky top-0 z-40">
            <div className="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
              <div className="flex items-center gap-3">
                <div className="bg-white p-2 rounded-full text-emerald-600">
                  <Icon name="heart" className="h-6 w-6 text-emerald-600" fill="currentColor" />
                </div>
                <div>
                  <h1 className="text-xl font-bold tracking-wide">社團法人台灣帕金森病友權益促進會</h1>
                  <p className="text-xs text-emerald-100">積極面對・走入人群・攜手抗帕</p>
                </div>
              </div>
              <div className="flex items-center gap-3">
                <nav className="flex flex-wrap gap-1 bg-emerald-700/50 p-1 rounded-lg">
                  <button onClick={() => setActiveTab('home')} className={`px-3 py-1.5 rounded text-sm font-medium transition ${activeTab === 'home' ? 'bg-white text-emerald-700 shadow' : 'hover:bg-emerald-600'}`}>首頁</button>
                  <button onClick={() => setActiveTab('about')} className={`px-3 py-1.5 rounded text-sm font-medium transition ${activeTab === 'about' ? 'bg-white text-emerald-700 shadow' : 'hover:bg-emerald-600'}`}>認識帕促會</button>
                  <button onClick={() => setActiveTab('info')} className={`px-3 py-1.5 rounded text-sm font-medium transition ${activeTab === 'info' ? 'bg-white text-emerald-700 shadow' : 'hover:bg-emerald-600'}`}>帕金森資訊</button>
                  <button onClick={() => setActiveTab('forum')} className={`px-3 py-1.5 rounded text-sm font-medium transition ${activeTab === 'forum' ? 'bg-white text-emerald-700 shadow' : 'hover:bg-emerald-600'}`}>病友論壇</button>
                  <button onClick={() => setActiveTab('activities')} className={`px-3 py-1.5 rounded text-sm font-medium transition ${activeTab === 'activities' ? 'bg-white text-emerald-700 shadow' : 'hover:bg-emerald-600'}`}>活動花絮</button>
                  {isAdmin && (
                    <button onClick={() => setActiveTab('admin')} className={`px-3 py-1.5 rounded text-sm font-bold text-amber-300 transition ${activeTab === 'admin' ? 'bg-amber-500 text-slate-900 shadow' : 'hover:bg-emerald-600'}`}>⚙️ 後台管理</button>
                  )}
                </nav>

                {/* 管理員登入按鈕 */}
                <button 
                  onClick={() => isAdmin ? setIsAdmin(false) : setShowLoginModal(true)}
                  className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold border transition ${isAdmin ? 'bg-amber-500 border-amber-400 text-white hover:bg-amber-600' : 'bg-emerald-700 border-emerald-500 text-emerald-100 hover:bg-emerald-800'}`}
                >
                  <Icon name={isAdmin ? "unlock" : "lock"} className="h-3.5 w-3.5" />
                  {isAdmin ? '登出後台' : '管理登入'}
                </button>
              </div>
            </div>
          </header>

          {/* GAS API 設定工具列 */}
          <div className="bg-amber-50 border-b border-amber-200 py-2 px-4">
            <div className="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-2 text-xs text-amber-800">
              <div className="flex items-center gap-2">
                <span className="font-bold bg-amber-200 px-2 py-0.5 rounded">GAS API 串接</span>
                <span>輸入您的 Web App URL 即可啟用真實資料庫同步：</span>
              </div>
              <div className="flex w-full md:w-auto gap-2">
                <input 
                  type="text" 
                  placeholder="https://script.google.com/macros/s/.../exec" 
                  value={gasUrl}
                  onChange={(e) => setGasUrl(e.target.value)}
                  className="flex-1 md:w-80 px-2 py-1 border border-amber-300 rounded text-slate-800 focus:outline-none focus:ring-1 focus:ring-amber-500"
                />
                <button 
                  onClick={fetchData} 
                  disabled={loading}
                  className="bg-amber-600 hover:bg-amber-700 text-white px-3 py-1 rounded font-medium flex items-center gap-1 transition disabled:opacity-50"
                >
                  <Icon name="refresh-cw" className={`h-3 w-3 ${loading ? 'animate-spin' : ''}`} />
                  同步資料
                </button>
              </div>
            </div>
          </div>

          {/* 主內容區 */}
          <main className="flex-1 max-w-6xl w-full mx-auto px-4 py-8">
            
            {/* 1. 首頁 */}
            {activeTab === 'home' && (
              <div className="space-y-12">
                {/* 英雄宣傳區 */}
                <div className="bg-gradient-to-br from-emerald-50 to-teal-50 rounded-2xl p-8 md:p-12 border border-emerald-100 flex flex-col md:flex-row items-center gap-8">
                  <div className="flex-1 space-y-4">
                    <span className="bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-1 rounded-full">社團法人台灣帕金森病友權益促進會</span>
                    <h2 className="text-3xl md:text-4xl font-extrabold text-slate-900 leading-tight">
                      在震顫與僵硬的日子裡，<br/><span className="text-emerald-600">用溫暖與勇氣互相照亮。</span>

                              className="p-1 bg-amber-50 text-amber-600 hover:bg-amber-100 rounded border border-amber-200"
                              title="編輯/置頂"
                            >
                              <Icon name="edit-2" className="h-3 w-3" />
                            </button>
                            <button 
                              onClick={() => handleDeleteRow('forum', post.id)} 
                              className="p-1 bg-red-50 text-red-600 hover:bg-red-100 rounded border border-red-200"
                              title="刪除此貼文"
                            >
                              <Icon name="trash-2" className="h-3 w-3" />
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* 頁尾 */}
          <footer className="bg-slate-900 text-slate-400 py-8 mt-12 border-t border-slate-800">
            <div className="max-w-6xl mx-auto px-4 text-center space-y-3 text-sm">
              <p className="font-semibold text-white">社團法人台灣帕金森病友權益促進會</p>
              <p>會址：新北市三重區中正北路518號8樓 | 電子郵件：tpda20190121@gmail.com</p>
              <p className="text-xs text-slate-600">© 2026 社團法人帕促會. 本系統基於 GAS 與 React 開發提供。</p>
            </div>
          </footer>

          {/* ==================== 全螢幕圖片燈箱 (Lightbox) ==================== */}
          {lightbox.isOpen && (
            <div className="fixed inset-0 bg-black/95 flex items-center justify-center z-50 select-none" onClick={closeLightbox}>
              <button className="absolute top-4 right-4 text-white/70 hover:text-white bg-white/10 hover:bg-white/20 p-2 rounded-full transition">
                <Icon name="x" className="h-6 w-6" />
              </button>
              
              {lightbox.images.length > 1 && (
                <button onClick={prevImage} className="absolute left-4 text-white/70 hover:text-white bg-white/10 hover:bg-white/20 p-3 rounded-full transition">
                  <Icon name="chevron-left" className="h-8 w-8" />
                </button>
              )}

              <div className="max-w-4xl max-h-[85vh] px-4 flex flex-col items-center gap-2">
                <img src={lightbox.images[lightbox.currentIndex]} className="max-w-full max-h-[80vh] object-contain rounded shadow-2xl" />
                <p className="text-white/60 text-xs mt-2">第 {lightbox.currentIndex + 1} 張，共 {lightbox.images.length} 張</p>
              </div>

              {lightbox.images.length > 1 && (
                <button onClick={nextImage} className="absolute right-4 text-white/70 hover:text-white bg-white/10 hover:bg-white/20 p-3 rounded-full transition">
                  <Icon name="chevron-right" className="h-8 w-8" />
                </button>
              )}
            </div>
          )}

          {/* ==================== 彈出視窗 (Modals) ==================== */}

          {/* 1. 管理員登入 */}
          {showLoginModal && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-xl p-6 max-w-sm w-full space-y-4 shadow-xl">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-bold text-lg flex items-center gap-2 text-slate-900">
                    <Icon name="lock" className="text-emerald-600 h-5 w-5" /> 管理員安全登入
                  </h3>
                  <button onClick={() => setShowLoginModal(false)} className="text-slate-400 hover:text-slate-600">
                    <Icon name="x" className="h-5 w-5" />
                  </button>
                </div>
                <form onSubmit={handleAdminLogin} className="space-y-4">
                  <div>
                    <label className="block text-xs font-medium text-slate-500 mb-1">請輸入管理密碼</label>
                    <input 
                      type="password" 
                      placeholder="預設為 admin123" 
                      value={adminPassword}
                      onChange={(e) => setAdminPassword(e.target.value)}
                      required
                      className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20"
                    />
                  </div>
                  <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-lg font-medium text-sm">
                    登入驗證
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* 2. 編輯資訊 */}
          {activeModal === 'info' && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-xl p-6 max-w-lg w-full space-y-4 shadow-xl max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-bold text-lg text-slate-900">{infoForm.id ? '編輯資訊' : '新增資訊'}</h3>
                  <button onClick={() => setActiveModal(null)} className="text-slate-400 hover:text-slate-600">
                    <Icon name="x" className="h-5 w-5" />
                  </button>
                </div>
                <form onSubmit={handleSaveInfo} className="space-y-4">
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-medium text-slate-500 mb-1">分類</label>
                      <select 
                        value={infoForm.category}
                        onChange={(e) => setInfoForm({...infoForm, category: e.target.value})}
                        className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm"
                      >
                        <option value="醫療衛教">醫療衛教</option>
                        <option value="權益倡議">權益倡議</option>
                        <option value="生活照護">生活照護</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-medium text-slate-500 mb-1">發布日期</label>
                      <input 
                        type="date" 
                        value={infoForm.date}
                        onChange={(e) => setInfoForm({...infoForm, date: e.target.value})}
                        className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-slate-500 mb-1">標題</label>
                    <input 
                      type="text" 
                      value={infoForm.title}
                      onChange={(e) => setInfoForm({...infoForm, title: e.target.value})}
                      required
                      className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-slate-500 mb-1">內容</label>
                    <textarea 
                      rows={6}
                      value={infoForm.content}
                      onChange={(e) => setInfoForm({...infoForm, content: e.target.value})}
                      required
                      className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm"
                    />
                  </div>
                  <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-lg font-medium text-sm flex items-center justify-center gap-1">
                    <Icon name="save" className="h-4 w-4" /> 儲存變更並同步
                  </button>
                </form>
              </div>
            </div>
          )}

                      {/* 3. 編輯活動花絮彈窗 */}
            {activeModal === 'activity' && (
              <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                <div className="bg-white rounded-xl p-6 max-w-lg w-full space-y-4 shadow-xl max-h-[90vh] overflow-y-auto">
                  <div className="flex justify-between items-center border-b pb-2">
                    <h3 className="font-bold text-lg text-slate-900">{activityForm.id ? '編輯活動花絮' : '新增活動花絮'}</h3>
                    <button onClick={() => setActiveModal(null)} className="text-slate-400 hover:text-slate-600">
                      <Icon name="x" className="h-5 w-5" />
                    </button>
                  </div>
                  <form onSubmit={handleSaveActivity} className="space-y-4">
                    <div className="grid grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-medium text-slate-500 mb-1">活動名稱</label>
                        <input 
                          type="text" 
                          value={activityForm.title}
                          onChange={(e) => setActivityForm({...activityForm, title: e.target.value})}
                          required
                          className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-medium text-slate-500 mb-1">活動日期</label>
                        <input 
                          type="date" 
                          value={activityForm.date}
                          onChange={(e) => setActivityForm({...activityForm, date: e.target.value})}
                          className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm"
                        />
                      </div>
                    </div>
                    <div className="space-y-2">
                      <label className="block text-xs font-medium text-slate-500">活動照片網址 (最多3張)</label>
                      {[0, 1, 2].map((idx) => (
                        <input 
                          key={idx}
                          type="text" 
                          placeholder={`照片網址 ${idx + 1} (Unsplash 或公開連結)`}
                          value={activityForm.images[idx] || ''}
                          onChange={(e) => {
                            const newImgs = [...activityForm.images];
                            newImgs[idx] = e.target.value;
                            setActivityForm({...activityForm, images: newImgs});
                          }}
                          className="w-full px-3 py-1.5 border border-slate-200 rounded-lg text-xs"
                        />
                      ))}
                    </div>
                    <div>
                      <label className="block text-xs font-medium text-slate-500 mb-1">活動描述</label>
                      <textarea 
                        rows={4}
                        value={activityForm.description}
                        onChange={(e) => setActivityForm({...activityForm, description: e.target.value})}
                        required
                        className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm"
                      />
                    </div>
                    <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-lg font-medium text-sm flex items-center justify-center gap-1">
                      <Icon name="save" className="h-4 w-4" /> 儲存變更並同步
                    </button>
                  </form>
                </div>
              </div>
            )}

            {/* 4. 編輯統計數據彈窗 */}
            {activeModal === 'stats' && (
              <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                <div className="bg-white rounded-xl p-6 max-w-xl w-full space-y-4 shadow-xl">
                  <div className="flex justify-between items-center border-b pb-2">
                    <h3 className="font-bold text-lg text-slate-900">編輯首頁統計數據</h3>
                    <button onClick={() => setActiveModal(null)} className="text-slate-400 hover:text-slate-600">
                      <Icon name="x" className="h-5 w-5" />
                    </button>
                  </div>
                  <form onSubmit={handleSaveStats} className="space-y-4">
                    <div className="space-y-3">
                      {statsForm.map((stat, idx) => (
                        <div key={stat.id} className="grid grid-cols-3 gap-2 items-center border-b pb-2">
                          <input 
                            type="text" 
                            placeholder="項目名稱" 
                            value={stat.label}
                            onChange={(e) => {
                              const updated = [...statsForm];
                              updated[idx].label = e.target.value;
                              setStatsForm(updated);
                            }}
                            required
                            className="px-2 py-1 border rounded text-sm w-full"
                          />
                          <input 
                            type="text" 
                            placeholder="數值" 
                            value={stat.value}
                            onChange={(e) => {
                              const updated = [...statsForm];
                              updated[idx].value = e.target.value;
                              setStatsForm(updated);
                            }}
                            required
                            className="px-2 py-1 border rounded text-sm w-full"
                          />
                          <input 
                            type="text" 
                            placeholder="單位" 
                            value={stat.unit}
                            onChange={(e) => {
                              const updated = [...statsForm];
                              updated[idx].unit = e.target.value;
                              setStatsForm(updated);
                            }}
                            required
                            className="px-2 py-1 border rounded text-sm w-full"
                          />
                        </div>
                      ))}
                    </div>
                    <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-lg font-medium text-sm flex items-center justify-center gap-1">
                      <Icon name="save" className="h-4 w-4" /> 儲存變更並同步
                    </button>
                  </form>
                </div>
              </div>
            )}

            {/* 5. 編輯/置頂論壇貼文彈窗 */}
            {activeModal === 'forum' && (
              <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                <div className="bg-white rounded-xl p-6 max-w-lg w-full space-y-4 shadow-xl">
                  <div className="flex justify-between items-center border-b pb-2">
                    <h3 className="font-bold text-lg text-slate-900">編輯/維護論壇貼文</h3>
                    <button onClick={() => setActiveModal(null)} className="text-slate-400 hover:text-slate-600">
                      <Icon name="x" className="h-5 w-5" />
                    </button>
                  </div>
                  <form onSubmit={handleSaveForumPost} className="space-y-4">
                    <div>
                      <label className="block text-xs font-medium text-slate-500 mb-1">發言人</label>
                      <input 
                        type="text" 
                        value={forumForm.author}
                        disabled
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-500 font-semibold"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-medium text-slate-500 mb-1">發言內容</label>
                      <textarea 
                        rows={4}
                        value={forumForm.content}
                        onChange={(e) => setForumForm({...forumForm, content: e.target.value})}
                        required
                        className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20"
                      />
                    </div>
                    {isAdmin && (
                      <div className="flex items-center gap-2 pt-2">
                        <input 
                          type="checkbox" 
                          id="isPinned"
                          checked={forumForm.isPinned || false}
                          onChange={(e) => setForumForm({...forumForm, isPinned: e.target.checked})}
                          className="h-4 w-4 text-emerald-600 focus:ring-emerald-500 border-slate-300 rounded"
                        />
                        <label htmlFor="isPinned" className="text-sm font-medium text-slate-700 flex items-center gap-1">
                          <Icon name="pin" className="h-4 w-4 text-amber-500" /> 將此主題置頂 (僅管理員可操作)
                        </label>
                      </div>
                    )}
                    <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-lg font-medium text-sm flex items-center justify-center gap-1">
                      <Icon name="save" className="h-4 w-4" /> 儲存變更
                    </button>
                  </form>
                </div>
              </div>
            )}

            {/* 6. 編輯關於本會資訊彈窗 */}
            {activeModal === 'about' && (
              <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                <div className="bg-white rounded-xl p-6 max-w-xl w-full space-y-4 shadow-xl max-h-[90vh] overflow-y-auto">
                  <div className="flex justify-between items-center border-b pb-2">
                    <h3 className="font-bold text-lg text-slate-900">編輯關於本會資訊</h3>
                    <button onClick={() => setActiveModal(null)} className="text-slate-400 hover:text-slate-600">
                      <Icon name="x" className="h-5 w-5" />
                    </button>
                  </div>
                  <form onSubmit={handleSaveAbout} className="space-y-4">
                    <div>
                      <label className="block text-xs font-medium text-slate-500 mb-1">本會簡介</label>
                      <textarea 
                        rows={4}
                        value={aboutForm.intro}
                        onChange={(e) => setAboutForm({...aboutForm, intro: e.target.value})}
                        required
                        className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm"
                      />
                    </div>
                    <div className="space-y-2">
                      <label className="block text-xs font-medium text-slate-500">核心宗旨 (一行一條)</label>
                      {[0, 1, 2, 3].map((idx) => (
                        <input 
                          key={idx}
                          type="text" 
                          value={aboutForm.mission[idx] || ''}
                          onChange={(e) => {
                            const newMissions = [...aboutForm.mission];
                            newMissions[idx] = e.target.value;
                            setAboutForm({...aboutForm, mission: newMissions});
                          }}
                          required
                          className="w-full px-3 py-1.5 border border-slate-200 rounded-lg text-xs"
                        />
                      ))}
                    </div>
                    <div className="grid grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-medium text-slate-500 mb-1">會址</label>
                        <input 
                          type="text" 
                          value={aboutForm.address}
                          onChange={(e) => setAboutForm({...aboutForm, address: e.target.value})}
                          required
                          className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-medium text-slate-500 mb-1">電話</label>
                        <input 
                          type="text" 
                          value={aboutForm.phone}
                          onChange={(e) => setAboutForm({...aboutForm, phone: e.target.value})}
                          required
                          className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm"
                        />
                      </div>
                    </div>
                    <div className="grid grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-medium text-slate-500 mb-1">信箱</label>
                        <input 
                          type="email" 
                          value={aboutForm.email}
                          onChange={(e) => setAboutForm({...aboutForm, email: e.target.value})}
                          required
                          className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-medium text-slate-500 mb-1">捐款帳戶資訊</label>
                        <input 
                          type="text" 
                          value={aboutForm.donate}
                          onChange={(e) => setAboutForm({...aboutForm, donate: e.target.value})}
                          required
                          className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm"
                        />
                      </div>
                    </div>
                    <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-lg font-medium text-sm flex items-center justify-center gap-1">
                      <Icon name="save" className="h-4 w-4" /> 儲存變更並同步
                    </button>
                  </form>
                </div>
              </div>
            )}
            
          </div>
        );
      }

      // 將 App 組件渲染到畫面上
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
  </html>
