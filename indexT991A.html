<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>病友入會與服務建檔 - 台灣帕金森病友權益促進會</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/2.1/sdk.js"></script>
  <style>
    input, select, button { min-height: 54px; font-size: 1.15rem !important; }
    body { touch-action: pan-y; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 p-4 min-h-screen flex items-center justify-center">
  <div class="max-w-md w-full bg-white rounded-3xl shadow-xl border border-slate-200 p-6 space-y-6">
    <div class="text-center space-y-1">
      <span class="inline-block px-3 py-1 bg-sky-100 text-sky-800 text-xs font-bold rounded-full">社團法人立案輔導</span>
      <h1 class="text-2xl font-bold text-sky-900 tracking-wide mt-1">台灣帕金森病友權益促進會</h1>
      <p class="text-sm text-slate-500 font-medium">病友入會申請 暨 關懷健康建檔</p>
    </div>

    <div id="statusAlert" class="hidden rounded-xl p-4 text-base font-bold leading-relaxed"></div>

    <form id="regForm" class="space-y-4" onsubmit="event.preventDefault(); submitRegistration();">
      <div>
        <label class="block text-slate-700 font-semibold mb-1">姓名 / 稱呼 <span class="text-rose-500">*</span></label>
        <input type="text" id="pName" required placeholder="請輸入姓名"
               class="w-full px-4 rounded-xl border-2 border-slate-300 focus:border-sky-500 focus:outline-none">
      </div>

      <div>
        <label class="block text-slate-700 font-semibold mb-1">身分證字號 <span class="text-rose-500">*</span></label>
        <input type="text" id="pId" required maxlength="10" placeholder="例如：A123456789"
               class="w-full px-4 rounded-xl border-2 border-slate-300 uppercase focus:border-sky-500 focus:outline-none">
        <p class="text-xs text-slate-400 mt-1">依法受特種個資隔離保護，僅用於會員大會名冊與保險備查。</p>
      </div>

      <div>
        <label class="block text-slate-700 font-semibold mb-1">疾病期數（Hoehn & Yahr 分期）</label>
        <select id="pStage" class="w-full px-4 rounded-xl border-2 border-slate-300 bg-white focus:border-sky-500 focus:outline-none">
          <option value="1">第一期（單側症狀，輕微震顫或動作遲緩）</option>
          <option value="2">第二期（雙側症狀，但姿勢平衡仍正常）</option>
          <option value="3">第三期（出現步態不穩與平衡障礙，輕至中度失能）</option>
          <option value="4">第四期（嚴重障礙，需依賴輔具或專人攙扶）</option>
          <option value="5">第五期（需仰賴輪椅或完全臥床）</option>
          <option value="0">家屬 / 關懷支持者（非病友本人）</option>
        </select>
      </div>

      <div>
        <label class="block text-slate-700 font-semibold mb-1">聯絡手機</label>
        <input type="tel" id="pPhone" placeholder="例如：0912345678"
               class="w-full px-4 rounded-xl border-2 border-slate-300 focus:border-sky-500 focus:outline-none">
      </div>

      <div>
        <label class="block text-slate-700 font-semibold mb-1">緊急聯絡人姓名與電話</label>
        <input type="text" id="pEmergency" placeholder="例如：陳大華 (長子) 0988xxxxxx"
               class="w-full px-4 rounded-xl border-2 border-slate-300 focus:border-sky-500 focus:outline-none">
      </div>

      <div class="bg-amber-50 rounded-2xl p-4 border-2 border-amber-300 text-xs text-amber-950 space-y-2">
        <p class="font-bold text-sm text-amber-900">【個資法第 6 條 特種健康個資法定告知】</p>
        <p class="leading-relaxed">
          本會為辦理病友權益爭取、長照與輔具諮詢、復健補助等公益目的，須蒐集並處理台端之健康狀態與醫療分期。本會恪遵內部控制制度，採獨立加密保險庫隔離存取，絕不移作其他商業用途。
        </p>
        <div class="flex items-center space-x-3 pt-2">
          <input type="checkbox" id="pConsent" required class="w-6 h-6 rounded text-sky-600 focus:ring-sky-500">
          <label for="pConsent" class="text-sm font-bold text-slate-800">本人已詳閱並完全同意上述特種個資處理條款</label>
        </div>
      </div>

      <button type="submit" id="submitBtn"
              class="w-full bg-sky-700 hover:bg-sky-800 text-white font-bold py-4 rounded-2xl shadow-lg transition duration-150 text-lg">
        同意條款並完成登記
      </button>
    </form>
  </div>

  <script>
    const LIFF_ID = "2009456572-588gzru4";
    const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbzjwuLe0iSjZ6NT3gxqlpf9AnAZvXE9pHa38vjlp48VfVm4DP1_6poHcBfxuq1K5NV8/exec";
    const CLIENT_SALT = "PD_ASSOC_SECURE_SALT_2026";

    let currentUserProfile = null;

    window.onload = function() {
      if (typeof liff !== "undefined" && LIFF_ID && LIFF_ID.indexOf("YOUR_") !== 0) {
        liff.init({ liffId: LIFF_ID })
          .then(() => {
            if (!liff.isLoggedIn()) {
              liff.login();
            } else {
              liff.getProfile().then(profile => { currentUserProfile = profile; });
            }
          })
          .catch(err => console.error("LIFF Init Failed:", err));
      }
    };

    function isValidTWId(id) {
      if (!/^[A-Z][12]\d{8}$/.test(id)) return false;
      const letterMap = { A:10,B:11,C:12,D:13,E:14,F:15,G:16,H:17,I:34,J:18,K:19,L:20,M:21,N:22,O:35,P:23,Q:24,R:25,S:26,T:27,U:28,V:29,W:32,X:30,Y:31,Z:33 };
      const n = letterMap[id[0]];
      if (n === undefined) return false;
      const digits = [Math.floor(n / 10), n % 10, ...id.slice(1).split('').map(Number)];
      const weights = [1, 9, 8, 7, 6, 5, 4, 3, 2, 1, 1];
      const sum = digits.reduce((acc, d, i) => acc + d * weights[i], 0);
      return sum % 10 === 0;
    }

    async function generateSignature(dataStr, timestamp) {
      const msg = dataStr + timestamp + CLIENT_SALT;
      const msgBuffer = new TextEncoder().encode(msg);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function showAlert(msg, type) {
      const box = document.getElementById("statusAlert");
      box.classList.remove("hidden", "bg-rose-100", "text-rose-900", "bg-emerald-100", "text-emerald-900");
      if (type === "success") box.classList.add("bg-emerald-100", "text-emerald-900");
      else box.classList.add("bg-rose-100", "text-rose-900");
      box.innerText = msg;
      box.scrollIntoView({ behavior: 'smooth' });
    }

    function hideAlert() { document.getElementById("statusAlert").classList.add("hidden"); }

    async function submitRegistration() {
      const consent = document.getElementById("pConsent").checked;
      const name = document.getElementById("pName").value.trim();
      const idNo = document.getElementById("pId").value.trim().toUpperCase();
      const stage = document.getElementById("pStage").value;
      const phone = document.getElementById("pPhone").value.trim();
      const emergency = document.getElementById("pEmergency").value.trim();
      const btn = document.getElementById("submitBtn");

      if (!consent) { showAlert("請詳閱並勾選特種個資處理法定同意書。", "error"); return; }
      if (!isValidTWId(idNo)) { showAlert("身分證字號格式或檢查碼有誤，請重新確認。", "error"); return; }

      const dataObj = {
        lineUid: currentUserProfile ? currentUserProfile.userId : "DIRECT_WEB_USER",
        name: name, nationalId: idNo, stage: stage, phone: phone,
        emergencyContact: emergency, consent: consent
      };

      const timestamp = Date.now().toString();
      const dataStr = JSON.stringify(dataObj);

      btn.disabled = true;
      btn.classList.add("opacity-50", "cursor-not-allowed");
      btn.innerText = "資料加密傳輸中...";
      hideAlert();

      try {
        const signature = await generateSignature(dataStr, timestamp);
        const payload = { action: "register_patient", data: dataObj, timestamp: timestamp, signature: signature };

        const res = await fetch(GAS_WEBAPP_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        if (!res.ok) throw new Error(`網路通訊異常 (HTTP ${res.status})`);
        const result = await res.json();

        if (result.success) {
          showAlert(`✅ 登記成功！您的專屬案號為【${result.caseNo}】。系統已同步推播通知至您的 LINE。`, "success");
          btn.innerText = "登記完成";
          document.getElementById("regForm").reset();
          setTimeout(() => {
            if (typeof liff !== "undefined" && liff.isInClient()) liff.closeWindow();
          }, 3000);
        } else {
          showAlert(`❌ 登記失敗：${result.message || "伺服器錯誤"}`, "error");
          btn.disabled = false;
          btn.classList.remove("opacity-50", "cursor-not-allowed");
          btn.innerText = "重新提交";
        }
      } catch (err) {
        showAlert(`❌ 傳輸發生錯誤：${err.message}。請檢查網路連線或直接聯絡促進會秘書處。`, "error");
        btn.disabled = false;
        btn.classList.remove("opacity-50", "cursor-not-allowed");
        btn.innerText = "同意條款並完成登記";
      }
    }
  </script>
</body>
</html>
