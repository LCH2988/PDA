<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover">

  <meta
    name="description"
    content="帕友同行活動建立與管理平台">

  <meta name="theme-color" content="#0b4d49">

  <title>活動管理｜帕友同行</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root {
      --primary: #176b67;
      --primary-dark: #0b4d49;
      --primary-soft: #e2f2f0;
      --accent: #d85b35;
      --background: #f5f6f2;
      --surface: #ffffff;
      --text: #202624;
      --muted: #5f6b67;
      --border: #d2dcda;
      --success: #23753d;
      --success-soft: #e5f5ea;
      --warning: #875b00;
      --warning-soft: #fff2cf;
      --danger: #b3261e;
      --danger-soft: #fdebea;
      --radius: 17px;
      --shadow: 0 10px 30px rgba(10, 75, 70, 0.1);
      --page-width: 1180px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      font-size: 17px;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background: var(--background);
      font-family:
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        system-ui,
        sans-serif;
      line-height: 1.65;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.58;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible,
    a:focus-visible {
      outline: 4px solid #ffb000;
      outline-offset: 3px;
    }

    h1,
    h2,
    h3 {
      line-height: 1.35;
    }

    .skip-link {
      position: fixed;
      top: -100px;
      left: 16px;
      z-index: 500;
      padding: 10px 15px;
      color: white;
      border-radius: 10px;
      background: var(--primary-dark);
    }

    .skip-link:focus {
      top: 16px;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      color: white;
      background: linear-gradient(
        135deg,
        var(--primary-dark),
        var(--primary)
      );
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.15);
    }

    .header-inner {
      width: min(var(--page-width), calc(100% - 28px));
      min-height: 72px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand {
      color: white;
      text-decoration: none;
      font-size: 1.18rem;
      font-weight: 900;
    }

    .header-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .header-button {
      min-height: 43px;
      padding: 8px 13px;
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.12);
      font-weight: 800;
      text-decoration: none;
    }

    .header-button:hover {
      background: rgba(255, 255, 255, 0.24);
    }

    .main {
      width: min(var(--page-width), calc(100% - 28px));
      min-height: calc(100vh - 150px);
      margin: auto;
      padding: 30px 0 80px;
    }

    .hero {
      margin-bottom: 25px;
      padding: clamp(24px, 5vw, 46px);
      color: white;
      border-radius: 23px;
      background:
        radial-gradient(
          circle at 90% 10%,
          rgba(255, 255, 255, 0.18),
          transparent 28%
        ),
        linear-gradient(135deg, #0b4d49, #237f78);
      box-shadow: var(--shadow);
    }

    .hero h1 {
      margin: 0 0 9px;
      font-size: clamp(1.9rem, 5vw, 3rem);
    }

    .hero p {
      max-width: 780px;
      margin: 0;
      color: #e2f3f1;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(300px, 0.7fr);
      gap: 22px;
      align-items: start;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .panel {
      padding: clamp(19px, 4vw, 30px);
    }

    .panel h2 {
      margin-top: 0;
      color: var(--primary-dark);
    }

    .form-section {
      margin: 26px 0;
      padding-top: 22px;
      border-top: 1px solid var(--border);
    }

    .form-section:first-of-type {
      margin-top: 0;
      padding-top: 0;
      border-top: 0;
    }

    .form-section h3 {
      margin: 0 0 6px;
      color: var(--primary-dark);
    }

    .section-description {
      margin-top: 0;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px;
    }

    .grid-three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .field {
      margin-bottom: 16px;
    }

    .field-full {
      grid-column: 1 / -1;
    }

    .field label {
      margin-bottom: 5px;
      display: block;
      font-weight: 900;
    }

    .required {
      color: var(--danger);
    }

    .hint {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .input,
    .select,
    .textarea {
      width: 100%;
      min-height: 51px;
      padding: 10px 13px;
      color: var(--text);
      border: 2px solid var(--border);
      border-radius: 11px;
      background: white;
    }

    .input:focus,
    .select:focus,
    .textarea:focus {
      border-color: var(--primary);
    }

    .textarea {
      min-height: 115px;
      resize: vertical;
    }

    .button {
      min-height: 51px;
      padding: 10px 18px;
      border: 0;
      border-radius: 11px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
    }

    .button-primary {
      color: white;
      background: var(--primary);
    }

    .button-primary:hover {
      background: var(--primary-dark);
    }

    .button-secondary {
      color: var(--primary-dark);
      border: 2px solid var(--primary);
      background: white;
    }

    .button-full {
      width: 100%;
    }

    .actions {
      margin-top: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .notice {
      margin: 15px 0;
      padding: 14px 16px;
      border-left: 6px solid var(--primary);
      border-radius: 10px;
      background: var(--primary-soft);
    }

    .notice-success {
      border-color: var(--success);
      background: var(--success-soft);
    }

    .notice-warning {
      border-color: var(--warning);
      background: var(--warning-soft);
    }

    .notice-danger {
      border-color: var(--danger);
      background: var(--danger-soft);
    }

    .sticky {
      position: sticky;
      top: 95px;
    }

    .summary-list {
      padding: 0;
      list-style: none;
    }

    .summary-list li {
      margin: 10px 0;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .summary-list strong {
      display: block;
      color: var(--primary-dark);
    }

    .event-item {
      margin: 13px 0;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fbfcfc;
    }

    .event-item h3 {
      margin: 6px 0;
      font-size: 1rem;
    }

    .event-item p {
      margin: 4px 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .badge {
      padding: 3px 9px;
      border-radius: 999px;
      display: inline-block;
      color: var(--primary-dark);
      background: var(--primary-soft);
      font-size: 0.8rem;
      font-weight: 900;
    }

    .badge-draft {
      color: var(--warning);
      background: var(--warning-soft);
    }

    .badge-published {
      color: var(--success);
      background: var(--success-soft);
    }

    .loading {
      min-height: 280px;
      padding: 35px;
      border-radius: var(--radius);
      background: white;
      display: grid;
      place-items: center;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .spinner {
      width: 50px;
      height: 50px;
      margin: auto;
      border: 6px solid #d9eae8;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .toast {
      position: fixed;
      top: 87px;
      right: 16px;
      z-index: 300;
      width: min(410px, calc(100% - 32px));
      padding: 14px 17px;
      color: white;
      border-radius: 11px;
      background: var(--primary-dark);
      box-shadow: var(--shadow);
      display: none;
    }

    .toast.open {
      display: block;
    }

    .toast.error {
      background: var(--danger);
    }

    .footer {
      padding: 30px 20px;
      color: white;
      background: var(--primary-dark);
      text-align: center;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .sticky {
        position: static;
      }
    }

    @media (max-width: 650px) {
      html {
        font-size: 16px;
      }

      .header-inner {
        min-height: 64px;
      }

      .header-user {
        display: none;
      }

      .grid,
      .grid-three {
        grid-template-columns: 1fr;
      }

      .field-full {
        grid-column: auto;
      }

      .actions {
        flex-direction: column;
      }

      .button {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <a class="skip-link" href="#main">
    跳到主要內容
  </a>

  <header class="header">
    <div class="header-inner">
      <a class="brand" href="index.html">
        🤝 帕友同行｜活動管理
      </a>

      <div class="header-actions">
        <span id="header-user" class="header-user">
          驗證中
        </span>

        <a class="header-button" href="index.html">
          返回會員前台
        </a>
      </div>
    </div>
  </header>

  <main id="main" class="main">
    <div class="loading" role="status">
      <div>
        <div class="spinner" aria-hidden="true"></div>
        <p>正在驗證管理員權限……</p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <strong>帕友同行活動管理平台</strong>
    <p>只有授權管理員可以建立或公開活動。</p>
  </footer>

  <div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite">
  </div>

  <script>
    "use strict";

    /*
     * 必須與 index.html 使用相同設定。
     */
    const CONFIG = Object.freeze({
      LIFF_ID: "2009456572-Mz4E9GYP",

      GAS_API_URL:
        "https://script.google.com/macros/s/AKfycbx2SF9bCvWcKkhgJ-g7Ip5-S4lrnZvPWam06rEQ-SHaetdRvI0ZasXfrwl4ORDdagy_qw/exec",

      TIME_ZONE: "Asia/Taipei"
    });

    const TOKEN_KEY =
      "paryo-session-token";

    const EXPIRY_KEY =
      "paryo-session-expiry";

    const state = {
      user: null,
      events: []
    };

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function createId(prefix = "") {
      if (window.crypto?.randomUUID) {
        return prefix + window.crypto.randomUUID();
      }

      return (
        prefix +
        Date.now() +
        "-" +
        Math.random()
          .toString(16)
          .slice(2)
      );
    }

    function getToken() {
      const token =
        sessionStorage.getItem(TOKEN_KEY);

      const expiry =
        sessionStorage.getItem(EXPIRY_KEY);

      if (
        !token ||
        !expiry ||
        new Date(expiry).getTime() <=
          Date.now()
      ) {
        clearToken();
        return "";
      }

      return token;
    }

    function saveToken(token, expiry) {
      sessionStorage.setItem(
        TOKEN_KEY,
        token
      );

      sessionStorage.setItem(
        EXPIRY_KEY,
        expiry
      );
    }

    function clearToken() {
      sessionStorage.removeItem(TOKEN_KEY);
      sessionStorage.removeItem(EXPIRY_KEY);
    }

    async function apiCall(
      action,
      payload = {},
      authenticated = true
    ) {
      let response;

      try {
        response = await fetch(
          CONFIG.GAS_API_URL,
          {
            method: "POST",
            redirect: "follow",
            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },
            body: JSON.stringify({
              action,
              payload,
              requestId:
                createId("REQ-"),
              sessionToken:
                authenticated
                  ? getToken()
                  : ""
            })
          }
        );
      } catch (error) {
        throw new Error(
          "無法連線至後端服務，請檢查網路。"
        );
      }

      const text =
        await response.text();

      let result;

      try {
        result = JSON.parse(text);
      } catch (error) {
        throw new Error(
          "後端回應格式不正確。"
        );
      }

      if (!result.ok) {
        const apiError = new Error(
          result.error?.message ||
          "操作失敗。"
        );

        apiError.code =
          result.error?.code ||
          "API_ERROR";

        if (
          apiError.code ===
            "AUTH_REQUIRED" ||
          apiError.code ===
            "SESSION_EXPIRED"
        ) {
          clearToken();
        }

        throw apiError;
      }

      return result.data;
    }

    async function authenticate() {
      validateConfig();

      if (!window.liff) {
        throw new Error(
          "LIFF SDK 載入失敗。"
        );
      }

      await liff.init({
        liffId: CONFIG.LIFF_ID
      });

      let user = null;

      if (getToken()) {
        try {
          user = await apiCall(
            "users.me"
          );
        } catch (error) {
          clearToken();
        }
      }

      if (!user) {
        if (!liff.isLoggedIn()) {
          liff.login({
            redirectUri:
              location.href
          });

          return new Promise(
            () => {}
          );
        }

        const idToken =
          liff.getIDToken();

        if (!idToken) {
          throw new Error(
            "無法取得 LINE 登入憑證。"
          );
        }

        const loginResult =
          await apiCall(
            "auth.login",
            {
              idToken
            },
            false
          );

        saveToken(
          loginResult.sessionToken,
          loginResult.expiresAt
        );

        user =
          loginResult.user;
      }

      if (
        !["admin", "superadmin"]
          .includes(user.role)
      ) {
        throw new Error(
          "您的帳號沒有活動管理權限。"
        );
      }

      return user;
    }

    function validateConfig() {
      if (
        !CONFIG.LIFF_ID ||
        CONFIG.LIFF_ID.includes(
          "請替換"
        )
      ) {
        throw new Error(
          "請先設定 LIFF_ID。"
        );
      }

      if (
        !CONFIG.GAS_API_URL ||
        CONFIG.GAS_API_URL.includes(
          "請替換"
        )
      ) {
        throw new Error(
          "請先設定 GAS_API_URL。"
        );
      }
    }

    async function initialize() {
      try {
        state.user =
          await authenticate();

        document.getElementById(
          "header-user"
        ).textContent =
          state.user.displayName;

        await loadEvents();
        render();
      } catch (error) {
        renderAccessError(
          error.message
        );
      }
    }

    async function loadEvents() {
      const result =
        await apiCall(
          "admin.events.list"
        );

      state.events =
        result.items || [];
    }

    function defaultDateTime(
      daysFromNow,
      hour,
      minute = 0
    ) {
      const date = new Date();

      date.setDate(
        date.getDate() +
        daysFromNow
      );

      date.setHours(
        hour,
        minute,
        0,
        0
      );

      const local = new Date(
        date.getTime() -
        date.getTimezoneOffset() *
        60000
      );

      return local
        .toISOString()
        .slice(0, 16);
    }

    function render() {
      document.getElementById(
        "main"
      ).innerHTML = `
        <section class="hero">
          <h1>建立新活動</h1>

          <p>
            建立活動基本資料、場地條件、無障礙資訊、
            名額以及第一個活動場次。送出後仍可在
            Google 試算表進行資料維護。
          </p>
        </section>

        <div class="layout">
          <section class="card panel">
            <form
              id="event-form"
              onsubmit="Admin.createEvent(event)">

              <section class="form-section">
                <h3>一、活動基本資料</h3>

                <p class="section-description">
                  說明活動名稱、類型與參加者需要知道的內容。
                </p>

                <div class="grid">
                  <div class="field field-full">
                    <label for="title">
                      活動名稱
                      <span class="required">*</span>
                    </label>

                    <input
                      id="title"
                      class="input"
                      name="title"
                      maxlength="100"
                      required
                      placeholder="例如：板橋坐姿律動與伸展">
                  </div>

                  <div class="field">
                    <label for="category">
                      活動類型
                      <span class="required">*</span>
                    </label>

                    <select
                      id="category"
                      class="select"
                      name="category"
                      required>
                      <option value="">請選擇</option>
                      <option value="運動">運動</option>
                      <option value="交流">交流</option>
                      <option value="講座">講座</option>
                      <option value="旅遊">旅遊</option>
                      <option value="藝文">藝文</option>
                      <option value="其他">其他</option>
                    </select>
                  </div>

                  <div class="field">
                    <label for="language">
                      活動語言
                    </label>

                    <input
                      id="language"
                      class="input"
                      name="language"
                      maxlength="50"
                      value="國語"
                      placeholder="例如：國語、台語">
                  </div>

                  <div class="field field-full">
                    <label for="description">
                      活動介紹
                      <span class="required">*</span>
                    </label>

                    <textarea
                      id="description"
                      class="textarea"
                      name="description"
                      maxlength="2000"
                      required
                      placeholder="請說明活動內容、流程與注意事項"></textarea>
                  </div>
                </div>
              </section>

              <section class="form-section">
                <h3>二、場地與交通</h3>

                <div class="grid">
                  <div class="field">
                    <label for="city">
                      縣市
                      <span class="required">*</span>
                    </label>

                    <input
                      id="city"
                      class="input"
                      name="city"
                      maxlength="20"
                      required
                      placeholder="例如：新北市">
                  </div>

                  <div class="field">
                    <label for="district">
                      行政區
                    </label>

                    <input
                      id="district"
                      class="input"
                      name="district"
                      maxlength="20"
                      placeholder="例如：板橋區">
                  </div>

                  <div class="field field-full">
                    <label for="venueName">
                      場地名稱
                      <span class="required">*</span>
                    </label>

                    <input
                      id="venueName"
                      class="input"
                      name="venueName"
                      maxlength="100"
                      required
                      placeholder="例如：板橋社區關懷據點">
                  </div>

                  <div class="field field-full">
                    <label for="address">
                      活動地址
                      <span class="required">*</span>
                    </label>

                    <input
                      id="address"
                      class="input"
                      name="address"
                      maxlength="200"
                      required>
                  </div>

                  <div class="field field-full">
                    <label for="transit">
                      交通方式
                    </label>

                    <textarea
                      id="transit"
                      class="textarea"
                      name="transit"
                      maxlength="500"
                      placeholder="例如：捷運板橋站步行約 6 分鐘"></textarea>
                  </div>
                </div>
              </section>

              <section class="form-section">
                <h3>三、體力與友善條件</h3>

                <div class="grid">
                  <div class="field">
                    <label for="intensity">
                      體力程度
                      <span class="required">*</span>
                    </label>

                    <select
                      id="intensity"
                      class="select"
                      name="intensity"
                      required>
                      <option value="">請選擇</option>
                      <option value="低體力">低體力</option>
                      <option value="中體力">中體力</option>
                      <option value="高體力">高體力</option>
                    </select>
                  </div>

                  <div class="field">
                    <label for="walkingDescription">
                      步行需求
                    </label>

                    <input
                      id="walkingDescription"
                      class="input"
                      name="walkingDescription"
                      maxlength="300"
                      placeholder="例如：步行約 6 分鐘">
                  </div>

                  <div class="field field-full">
                    <label for="restDescription">
                      休息安排
                    </label>

                    <input
                      id="restDescription"
                      class="input"
                      name="restDescription"
                      maxlength="300"
                      placeholder="例如：每 30 分鐘安排休息">
                  </div>
                </div>

                <div class="grid grid-three">
                  ${accessibilitySelect(
                    "wheelchair",
                    "輪椅進入"
                  )}

                  ${accessibilitySelect(
                    "elevator",
                    "電梯或一樓"
                  )}

                  ${accessibilitySelect(
                    "accessibleToilet",
                    "無障礙廁所"
                  )}

                  ${accessibilitySelect(
                    "companionAllowed",
                    "允許陪同者"
                  )}

                  ${accessibilitySelect(
                    "volunteerAvailable",
                    "志工協助"
                  )}
                </div>
              </section>

              <section class="form-section">
                <h3>四、費用與名額</h3>

                <div class="grid grid-three">
                  <div class="field">
                    <label for="fee">
                      活動費用
                    </label>

                    <input
                      id="fee"
                      class="input"
                      name="fee"
                      type="number"
                      min="0"
                      max="1000000"
                      step="1"
                      value="0"
                      required>
                  </div>

                  <div class="field">
                    <label for="capacity">
                      正式名額
                      <span class="required">*</span>
                    </label>

                    <input
                      id="capacity"
                      class="input"
                      name="capacity"
                      type="number"
                      min="1"
                      max="10000"
                      step="1"
                      value="12"
                      required>
                  </div>

                  <div class="field">
                    <label for="waitlistCapacity">
                      候補名額
                    </label>

                    <input
                      id="waitlistCapacity"
                      class="input"
                      name="waitlistCapacity"
                      type="number"
                      min="0"
                      max="10000"
                      step="1"
                      value="10"
                      required>
                  </div>
                </div>
              </section>

              <section class="form-section">
                <h3>五、第一個活動場次</h3>

                <p class="section-description">
                  時間會依使用者裝置時區輸入，送出時轉成標準時間。
                </p>

                <div class="grid">
                  <div class="field">
                    <label for="startAt">
                      活動開始
                      <span class="required">*</span>
                    </label>

                    <input
                      id="startAt"
                      class="input"
                      name="startAt"
                      type="datetime-local"
                      value="${defaultDateTime(14, 10)}"
                      required>
                  </div>

                  <div class="field">
                    <label for="endAt">
                      活動結束
                      <span class="required">*</span>
                    </label>

                    <input
                      id="endAt"
                      class="input"
                      name="endAt"
                      type="datetime-local"
                      value="${defaultDateTime(14, 11, 30)}"
                      required>
                  </div>

                  <div class="field">
                    <label for="registrationStartAt">
                      報名開始
                      <span class="required">*</span>
                    </label>

                    <input
                      id="registrationStartAt"
                      class="input"
                      name="registrationStartAt"
                      type="datetime-local"
                      value="${defaultDateTime(0, 9)}"
                      required>
                  </div>

                  <div class="field">
                    <label for="registrationEndAt">
                      報名截止
                      <span class="required">*</span>
                    </label>

                    <input
                      id="registrationEndAt"
                      class="input"
                      name="registrationEndAt"
                      type="datetime-local"
                      value="${defaultDateTime(13, 18)}"
                      required>
                  </div>
                </div>
              </section>

              <section class="form-section">
                <h3>六、發布設定</h3>

                <div class="grid">
                  <div class="field">
                    <label for="eventStatus">
                      活動狀態
                    </label>

                    <select
                      id="eventStatus"
                      class="select"
                      name="eventStatus"
                      required>
                      <option value="draft">
                        儲存為草稿
                      </option>

                      <option value="published">
                        立即公開
                      </option>
                    </select>
                  </div>

                  <div class="field">
                    <label for="sessionStatus">
                      場次狀態
                    </label>

                    <select
                      id="sessionStatus"
                      class="select"
                      name="sessionStatus"
                      required>
                      <option value="open">
                        開放
                      </option>

                      <option value="closed">
                        關閉
                      </option>
                    </select>
                  </div>
                </div>

                <div class="notice notice-warning">
                  若選擇「立即公開」且場次為「開放」，
                  活動會出現在會員前台。請先確認日期、地址、
                  名額及無障礙資訊。
                </div>
              </section>

              <div class="actions">
                <button
                  id="submit-button"
                  class="button button-primary"
                  type="submit">
                  建立活動
                </button>

                <button
                  class="button button-secondary"
                  type="reset"
                  onclick="Admin.afterReset()">
                  清除表單
                </button>
              </div>
            </form>
          </section>

          <aside class="sticky">
            <section class="card panel">
              <h2>建立提醒</h2>

              <ul class="summary-list">
                <li>
                  <strong>活動 ID</strong>
                  由後端自動產生。
                </li>

                <li>
                  <strong>活動場次</strong>
                  每次建立活動會同時建立第一個場次。
                </li>

                <li>
                  <strong>草稿活動</strong>
                  不會出現在會員前台。
                </li>

                <li>
                  <strong>公開活動</strong>
                  活動必須為 published，場次必須為 open。
                </li>

                <li>
                  <strong>後續修改</strong>
                  目前請由 Google 試算表維護。
                </li>
              </ul>
            </section>

            <section class="card panel" style="margin-top: 18px">
              <h2>最近建立</h2>

              <div id="recent-events">
                ${renderRecentEvents()}
              </div>
            </section>
          </aside>
        </div>
      `;
    }

    function accessibilitySelect(
      name,
      label
    ) {
      return `
        <div class="field">
          <label for="${name}">
            ${label}
          </label>

          <select
            id="${name}"
            class="select"
            name="${name}">
            <option value="unknown">
              尚未確認
            </option>

            <option value="yes">
              有／可以
            </option>

            <option value="no">
              沒有／不可以
            </option>
          </select>
        </div>
      `;
    }

    function renderRecentEvents() {
      if (!state.events.length) {
        return `
          <p>目前沒有活動資料。</p>
        `;
      }

      return state.events
        .slice(0, 10)
        .map(item => `
          <article class="event-item">
            <span
              class="badge badge-${escapeHtml(
                item.eventStatus
              )}">
              ${
                item.eventStatus ===
                "published"
                  ? "已公開"
                  : "草稿"
              }
            </span>

            <h3>
              ${escapeHtml(item.title)}
            </h3>

            <p>
              ${escapeHtml(
                formatDateTime(
                  item.startAt
                )
              )}
            </p>

            <p>
              ${escapeHtml(item.city)}
              ${escapeHtml(item.district)}
              ｜正式 ${item.confirmedCount}
              ／${item.capacity}
            </p>
          </article>
        `)
        .join("");
    }

    function formatDateTime(value) {
      if (!value) {
        return "尚未設定";
      }

      return new Intl.DateTimeFormat(
        "zh-TW",
        {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          weekday: "short",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
          timeZone:
            CONFIG.TIME_ZONE
        }
      ).format(new Date(value));
    }

    function localDateToIso(value) {
      const date = new Date(value);

      if (
        !value ||
        Number.isNaN(date.getTime())
      ) {
        throw new Error(
          "日期或時間格式不正確。"
        );
      }

      return date.toISOString();
    }

    function formToPayload(form) {
      const data =
        new FormData(form);

      return {
        title:
          data.get("title"),

        category:
          data.get("category"),

        description:
          data.get("description"),

        city:
          data.get("city"),

        district:
          data.get("district"),

        venueName:
          data.get("venueName"),

        address:
          data.get("address"),

        transit:
          data.get("transit"),

        intensity:
          data.get("intensity"),

        walkingDescription:
          data.get(
            "walkingDescription"
          ),

        restDescription:
          data.get(
            "restDescription"
          ),

        language:
          data.get("language"),

        wheelchair:
          data.get("wheelchair"),

        elevator:
          data.get("elevator"),

        accessibleToilet:
          data.get(
            "accessibleToilet"
          ),

        companionAllowed:
          data.get(
            "companionAllowed"
          ),

        volunteerAvailable:
          data.get(
            "volunteerAvailable"
          ),

        fee:
          Number(data.get("fee")),

        capacity:
          Number(
            data.get("capacity")
          ),

        waitlistCapacity:
          Number(
            data.get(
              "waitlistCapacity"
            )
          ),

        eventStatus:
          data.get("eventStatus"),

        sessionStatus:
          data.get("sessionStatus"),

        startAt:
          localDateToIso(
            data.get("startAt")
          ),

        endAt:
          localDateToIso(
            data.get("endAt")
          ),

        registrationStartAt:
          localDateToIso(
            data.get(
              "registrationStartAt"
            )
          ),

        registrationEndAt:
          localDateToIso(
            data.get(
              "registrationEndAt"
            )
          )
      };
    }

    function validatePayload(payload) {
      const startAt =
        new Date(
          payload.startAt
        ).getTime();

      const endAt =
        new Date(
          payload.endAt
        ).getTime();

      const registrationStartAt =
        new Date(
          payload.registrationStartAt
        ).getTime();

      const registrationEndAt =
        new Date(
          payload.registrationEndAt
        ).getTime();

      if (endAt <= startAt) {
        throw new Error(
          "活動結束時間必須晚於開始時間。"
        );
      }

      if (
        registrationEndAt <=
        registrationStartAt
      ) {
        throw new Error(
          "報名截止時間必須晚於報名開始時間。"
        );
      }

      if (
        registrationEndAt >
        startAt
      ) {
        throw new Error(
          "報名截止時間不可晚於活動開始時間。"
        );
      }

      if (
        !Number.isInteger(
          payload.capacity
        ) ||
        payload.capacity < 1
      ) {
        throw new Error(
          "正式名額必須是大於 0 的整數。"
        );
      }

      if (
        !Number.isInteger(
          payload.waitlistCapacity
        ) ||
        payload.waitlistCapacity < 0
      ) {
        throw new Error(
          "候補名額必須是 0 或正整數。"
        );
      }
    }

    async function createEvent(event) {
      event.preventDefault();

      const form = event.target;

      if (!form.reportValidity()) {
        return;
      }

      const button =
        document.getElementById(
          "submit-button"
        );

      let payload;

      try {
        payload =
          formToPayload(form);

        validatePayload(payload);
      } catch (error) {
        toast(
          error.message,
          true
        );

        return;
      }

      const publicImmediately =
        payload.eventStatus ===
          "published" &&
        payload.sessionStatus ===
          "open";

      if (
        publicImmediately &&
        !window.confirm(
          "此活動將立即顯示於會員前台，確定建立嗎？"
        )
      ) {
        return;
      }

      button.disabled = true;
      button.textContent =
        "正在建立活動……";

      try {
        const result =
          await apiCall(
            "admin.events.create",
            payload
          );

        toast(result.message);

        form.reset();

        await loadEvents();
        render();

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });
      } catch (error) {
        toast(
          error.message,
          true
        );

        button.disabled = false;
        button.textContent =
          "重新送出";
      }
    }

    function afterReset() {
      window.setTimeout(
        () => {
          document
            .getElementById("title")
            ?.focus();
        },
        0
      );
    }

    function renderAccessError(
      message
    ) {
      document.getElementById(
        "main"
      ).innerHTML = `
        <section class="card panel">
          <div class="notice notice-danger">
            <h1>無法進入管理平台</h1>

            <p>
              ${escapeHtml(message)}
            </p>
          </div>

          <p>
            請先使用管理員 LINE 帳號登入會員前台，
            並確認 Users 工作表中的 role 已設定為
            <code>admin</code> 或
            <code>superadmin</code>。
          </p>

          <a
            class="button button-primary"
            href="index.html">
            返回會員前台
          </a>
        </section>
      `;
    }

    function toast(
      message,
      isError = false
    ) {
      const element =
        document.getElementById(
          "toast"
        );

      element.textContent =
        message;

      element.className =
        "toast open" +
        (isError ? " error" : "");

      window.clearTimeout(
        toast.timeoutId
      );

      toast.timeoutId =
        window.setTimeout(
          () => {
            element.classList.remove(
              "open"
            );
          },
          4800
        );
    }

    window.Admin = {
      createEvent,
      afterReset
    };

    window.addEventListener(
      "DOMContentLoaded",
      initialize
    );
  </script>
</body>
</html>
