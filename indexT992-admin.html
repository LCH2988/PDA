<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>三鐵飛翔｜活動報名系統網頁版</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(251,146,60,.18), transparent 35%),
        linear-gradient(180deg, #fff7ed 0%, #f8fafc 35%, #e2e8f0 100%);
    }

    input, select, textarea {
      min-height: 52px;
      font-size: 17px;
    }

    button {
      min-height: 48px;
    }

    .modal {
      display: none;
    }

    .modal.show {
      display: flex;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      scrollbar-width: none;
    }

    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom);
    }
  </style>
</head>

<body class="min-h-screen text-slate-900">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-orange-200 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-orange-600 to-amber-500 flex items-center justify-center text-2xl shadow">
          🚴‍♂️
        </div>
        <div>
          <h1 class="text-xl sm:text-2xl font-black text-slate-950 leading-tight">三鐵飛翔</h1>
          <p class="text-xs sm:text-sm font-bold text-orange-700">活動報名與接龍系統｜網頁版</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button id="btnMyRegs" onclick="openMyRegistrations()" class="hidden bg-orange-50 hover:bg-orange-100 text-orange-800 border border-orange-300 font-black px-3 py-2 rounded-xl text-sm">
          📋 我的報名
        </button>
        <button id="btnLogin" onclick="openModal('authModal')" class="bg-orange-600 hover:bg-orange-700 text-white font-black px-4 py-2 rounded-xl shadow text-sm">
          登入 / 註冊
        </button>
        <button id="btnLogout" onclick="logout()" class="hidden bg-slate-900 hover:bg-black text-white font-black px-4 py-2 rounded-xl text-sm">
          登出
        </button>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="max-w-6xl mx-auto px-4 py-6 space-y-6">

    <!-- Welcome -->
    <section class="grid lg:grid-cols-3 gap-4">
      <div class="lg:col-span-2 bg-white rounded-3xl border border-orange-200 shadow-sm p-5 sm:p-6">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
          <div>
            <p class="text-sm font-black text-orange-700">歡迎使用</p>
            <h2 class="text-2xl sm:text-3xl font-black text-slate-950 mt-1">
              <span id="displayUserName">訪客</span>
            </h2>
            <p id="displayUserRole" class="text-sm font-bold text-slate-500 mt-2">
              請先登入以使用完整報名功能
            </p>
          </div>
          <div class="flex flex-wrap gap-2">
            <button id="btnProfile" onclick="openProfile()" class="hidden bg-slate-100 hover:bg-slate-200 border border-slate-300 text-slate-800 font-black px-4 py-2 rounded-xl">
              👤 會員資料
            </button>
            <button onclick="reloadAll()" class="bg-white hover:bg-slate-50 border border-slate-300 text-slate-800 font-black px-4 py-2 rounded-xl">
              🔄 重新整理
            </button>
          </div>
        </div>
      </div>

      <div class="bg-gradient-to-br from-orange-600 to-amber-500 rounded-3xl text-white shadow-sm p-5 sm:p-6">
        <p class="font-black text-lg">快速說明</p>
        <ul class="text-sm font-bold mt-3 space-y-2 text-orange-50">
          <li>✅ 正式會員可自行報名</li>
          <li>✅ 可幫家人 / 朋友代報</li>
          <li>✅ 可查看報名名單</li>
          <li>✅ 可修改自己的報名紀錄</li>
        </ul>
      </div>
    </section>

    <!-- Filters -->
    <section class="bg-white rounded-3xl border border-slate-200 shadow-sm p-5">
      <div class="grid md:grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-black text-slate-700 mb-2">活動分類</label>
          <select id="categoryFilter" onchange="renderEvents()" class="w-full border-2 border-slate-300 rounded-2xl px-4 py-3 font-bold bg-white">
            <option value="all">全部活動</option>
          </select>
        </div>

        <div class="md:col-span-2">
          <label class="block text-sm font-black text-slate-700 mb-2">搜尋活動</label>
          <input id="keywordFilter" oninput="renderEvents()" type="search" class="w-full border-2 border-slate-300 rounded-2xl px-4 py-3 font-bold" placeholder="輸入活動名稱、地點或說明..." />
        </div>
      </div>
    </section>

    <!-- Events -->
    <section>
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-xl font-black text-slate-950">活動列表</h3>
        <span id="eventCount" class="text-sm font-black text-slate-500">載入中...</span>
      </div>
      <div id="eventList" class="grid md:grid-cols-2 xl:grid-cols-3 gap-5"></div>
    </section>

  </main>

  <!-- Bottom Guide -->
  <div class="fixed bottom-0 left-0 right-0 z-30 bg-white/90 backdrop-blur border-t border-slate-200 safe-bottom md:hidden">
    <div class="max-w-6xl mx-auto grid grid-cols-3 text-center text-xs font-black">
      <button onclick="window.scrollTo({top:0, behavior:'smooth'})" class="py-2 text-slate-700">🏠 首頁</button>
      <button onclick="focusSearch()" class="py-2 text-slate-700">🔍 搜尋</button>
      <button onclick="openMyRegistrations()" class="py-2 text-orange-700">📋 我的</button>
    </div>
  </div>

  <!-- Auth Modal -->
  <div id="authModal" class="modal fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-md shadow-2xl overflow-hidden">
      <div class="bg-orange-600 text-white p-5 flex items-center justify-between">
        <h3 class="text-xl font-black">登入 / 註冊</h3>
        <button onclick="closeModal('authModal')" class="text-white text-2xl font-black">×</button>
      </div>

      <div class="p-5 space-y-5">
        <button onclick="lineLogin()" class="w-full bg-[#06C755] hover:bg-[#05b84f] text-white font-black rounded-2xl py-4 text-lg">
          💬 LINE 快速登入
        </button>

        <div class="flex items-center gap-3">
          <div class="h-px bg-slate-200 flex-1"></div>
          <span class="text-xs font-black text-slate-400">或使用一般帳號</span>
          <div class="h-px bg-slate-200 flex-1"></div>
        </div>

        <div class="grid grid-cols-2 gap-2 bg-slate-100 rounded-2xl p-1">
          <button id="tabLogin" onclick="switchAuth('login')" class="rounded-xl bg-white text-orange-700 font-black">登入</button>
          <button id="tabRegister" onclick="switchAuth('register')" class="rounded-xl text-slate-500 font-black">註冊</button>
        </div>

        <form id="loginForm" onsubmit="normalLogin(event)" class="space-y-3">
          <div>
            <label class="block text-sm font-black mb-1">姓名</label>
            <input id="loginName" required class="w-full border-2 border-slate-300 rounded-2xl px-4 py-3 font-bold" placeholder="請輸入姓名" />
          </div>
          <div>
            <label class="block text-sm font-black mb-1">手機</label>
            <input id="loginPhone" required type="tel" class="w-full border-2 border-slate-300 rounded-2xl px-4 py-3 font-bold" placeholder="請輸入手機號碼" />
          </div>
          <button class="w-full bg-orange-600 hover:bg-orange-700 text-white rounded-2xl font-black py-4">
            登入
          </button>
        </form>

        <form id="registerForm" onsubmit="normalRegister(event)" class="hidden space-y-3">
          <div class="bg-orange-50 border border-orange-200 rounded-2xl p-3 text-xs font-bold text-orange-900 leading-relaxed">
            一般註冊為「遊客」，可瀏覽活動；若要自行報名，建議使用 LINE 登入並完成會員資料。
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-sm font-black mb-1">姓名 *</label>
              <input id="regName" required class="w-full border-2 border-slate-300 rounded-2xl px-4 py-3 font-bold" />
            </div>
            <div>
              <label class="block text-sm font-black mb-1">手機 *</label>
              <input id="regPhone" required type="tel" class="w-full border-2 border-slate-300 rounded-2xl px-4 py-3 font-bold" />
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-sm font-black mb-1">性別</label>
              <select id="regGender" class="w-full border-2 border-slate-300 rounded-2xl px-4 py-3 font-bold bg-white">
                <option value="">請選擇</option>
                <option value="男">男</option>
                <option value="女">女</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-black mb-1">生日</label>
              <input id="regBirthday" class="w-full border-2 border-slate-300 rounded-2xl px-4 py-3 font-bold" placeholder="75/10/25" />
            </div>
          </div>

          <div>
            <label class="block text-sm font-black mb-1">身分證字號</label>
            <input id="regIdCard" class="w-full border-2 border-slate-300 rounded-2xl px-4 py-3 font-bold uppercase" />
          </div>

          <button class="w-full bg-orange-600 hover:bg-orange-700 text-white rounded-2xl font-black py-4">
            建立帳號
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- Profile Modal -->
  <div id="profileModal" class="modal fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-lg shadow-2xl overflow-hidden">
      <div class="bg-orange-600 text-white p-5 flex justify-between items-center">
        <h3 class="text-xl font-black">會員資料</h3>
        <button onclick="closeModal('profileModal')" class="text-white text-2xl font-black">×</button>
      </div>

      <form onsubmit="saveProfile(event)" class="p-5 space-y-4">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-black mb-1">姓名 *</label>
            <input id="profileName" required class="w-full border-2 border-slate-300 rounded-2xl px-4 py-3 font-bold" />
          </div>
          <div>
            <label class="block text-sm font-black mb-1">電話 *</label>
            <input id="profilePhone" required type="tel" class="w-full border-2 border-slate-300 rounded-2xl px-4 py-3 font-bold" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-black mb-1">性別 *</label>
            <select id="profileGender" required class="w-full border-2 border-slate-300 rounded-2xl px-4 py-3 font-bold bg-white">
              <option value="">請選擇</option>
              <option value="男">男</option>
              <option value="女">女</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-black mb-1">生日 *</label>
            <input id="profileBirthday" required class="w-full border-2 border-slate-300 rounded-2xl px-4 py-3 font-bold" placeholder="75/10/25" />
          </div>
        </div>

        <div>
          <label class="block text-sm font-black mb-1">身分證字號 *</label>
          <input id="profileIdCard" required class="w-full border-2 border-slate-300 rounded-2xl px-4 py-3 font-bold uppercase" />
        </div>

        <div>
          <label class="block text-sm font-black mb-1">地址</label>
          <input id="profileAddress" class="w-full border-2 border-slate-300 rounded-2xl px-4 py-3 font-bold" />
        </div>

        <button class="w-full bg-orange-600 hover:bg-orange-700 text-white rounded-2xl font-black py-4">
          儲存會員資料
        </button>
      </form>
    </div>
  </div>

  <!-- Registration Modal -->
  <div id="registerModal" class="modal fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-3xl max-h-[92vh] shadow-2xl overflow-hidden flex flex-col">
      <div class="bg-orange-600 text-white p-5 flex justify-between items-center">
        <div>
          <p class="text-xs font-black text-orange-100">活動報名</p>
          <h3 id="regModalTitle" class="text-xl font-black leading-tight">活動名稱</h3>
        </div>
        <button onclick="closeModal('registerModal')" class="text-white text-2xl font-black">×</button>
      </div>

      <div class="bg-orange-50 border-b border-orange-200 p-4">
        <div class="grid sm:grid-cols-3 gap-2">
          <button onclick="addSelfAttendee()" class="bg-orange-600 hover:bg-orange-700 text-white rounded-2xl font-black py-3">
            👤 加入本人
          </button>
          <button onclick="openModal('searchUserModal')" class="bg-white hover:bg-orange-50 border border-orange-300 text-orange-800 rounded-2xl font-black py-3">
            🔍 搜尋同行人
          </button>
          <button onclick="openModal('newCompanionModal')" class="bg-white hover:bg-orange-50 border border-orange-300 text-orange-800 rounded-2xl font-black py-3">
            ➕ 新增同行人
          </button>
        </div>
      </div>

      <div class="p-5 overflow-y-auto space-y-4">
        <div class="bg-slate-50 rounded-2xl border border-slate-200 p-4">
          <p class="font-black text-slate-900">報名清單</p>
          <p class="text-sm font-bold text-slate-500 mt-1">請確認姓名與調查問題，送出後會寫入原後端資料。</p>
        </div>

        <div id="attendeesBox" class="space-y-4"></div>
      </div>

      <div class="p-4 border-t bg-white">
        <div class="grid sm:grid-cols-2 gap-3">
          <button onclick="closeModal('registerModal')" class="bg-slate-100 hover:bg-slate-200 text-slate-800 rounded-2xl font-black py-4">
            取消
          </button>
          <button onclick="submitRegistration()" class="bg-orange-600 hover:bg-orange-700 text-white rounded-2xl font-black py-4">
            確認送出報名
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Search User Modal -->
  <div id="searchUserModal" class="modal fixed inset-0 z-[60] bg-slate-950/70 backdrop-blur-sm items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-md shadow-2xl overflow-hidden">
      <div class="bg-slate-900 text-white p-5 flex justify-between items-center">
        <h3 class="text-lg font-black">搜尋已建檔同行人</h3>
        <button onclick="closeModal('searchUserModal')" class="text-white text-2xl font-black">×</button>
      </div>
      <div class="p-5 space-y-3">
        <input id="searchUserInput" oninput="renderUserSearch()" class="w-full border-2 border-slate-300 rounded-2xl px-4 py-3 font-bold" placeholder="輸入姓名搜尋..." />
        <div id="searchUserResult" class="max-h-80 overflow-y-auto divide-y border border-slate-200 rounded-2xl"></div>
      </div>
    </div>
  </div>

  <!-- New Companion Modal -->
  <div id="newCompanionModal" class="modal fixed inset-0 z-[60] bg-slate-950/70 backdrop-blur-sm items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-lg shadow-2xl overflow-hidden">
      <div class="bg-slate-900 text-white p-5 flex justify-between items-center">
        <h3 class="text-lg font-black">新增同行人</h3>
        <button onclick="closeModal('newCompanionModal')" class="text-white text-2xl font-black">×</button>
      </div>

      <form onsubmit="addNewCompanion(event)" class="p-5 space-y-3">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-black mb-1">姓名 *</label>
            <input id="newName" required class="w-full border-2 border-slate-300 rounded-2xl px-4 py-3 font-bold" />
          </div>
          <div>
            <label class="block text-sm font-black mb-1">手機 *</label>
            <input id="newPhone" required type="tel" class="w-full border-2 border-slate-300 rounded-2xl px-4 py-3 font-bold" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-black mb-1">性別 *</label>
            <select id="newGender" required class="w-full border-2 border-slate-300 rounded-2xl px-4 py-3 font-bold bg-white">
              <option value="">請選擇</option>
              <option value="男">男</option>
              <option value="女">女</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-black mb-1">關係 *</label>
            <select id="newRelation" required class="w-full border-2 border-slate-300 rounded-2xl px-4 py-3 font-bold bg-white">
              <option value="家人">家人</option>
              <option value="朋友">朋友</option>
              <option value="遊客">遊客</option>
              <option value="新會員">新會員</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-black mb-1">生日 *</label>
            <input id="newBirthday" required class="w-full border-2 border-slate-300 rounded-2xl px-4 py-3 font-bold" placeholder="75/10/25" />
          </div>
          <div>
            <label class="block text-sm font-black mb-1">身分證 *</label>
            <input id="newIdCard" required class="w-full border-2 border-slate-300 rounded-2xl px-4 py-3 font-bold uppercase" />
          </div>
        </div>

        <button class="w-full bg-orange-600 hover:bg-orange-700 text-white rounded-2xl font-black py-4">
          儲存並加入報名
        </button>
      </form>
    </div>
  </div>

  <!-- Participants Modal -->
  <div id="participantsModal" class="modal fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-2xl max-h-[90vh] shadow-2xl overflow-hidden flex flex-col">
      <div class="bg-orange-600 text-white p-5 flex justify-between items-center">
        <h3 id="participantsTitle" class="text-xl font-black">報名名單</h3>
        <button onclick="closeModal('participantsModal')" class="text-white text-2xl font-black">×</button>
      </div>
      <div id="participantsList" class="p-5 overflow-y-auto space-y-3"></div>
    </div>
  </div>

  <!-- My Registrations Modal -->
  <div id="myRegsModal" class="modal fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-2xl max-h-[90vh] shadow-2xl overflow-hidden flex flex-col">
      <div class="bg-orange-600 text-white p-5 flex justify-between items-center">
        <h3 class="text-xl font-black">我的報名紀錄</h3>
        <button onclick="closeModal('myRegsModal')" class="text-white text-2xl font-black">×</button>
      </div>
      <div id="myRegsList" class="p-5 overflow-y-auto space-y-3"></div>
    </div>
  </div>

  <!-- Loading -->
  <div id="loading" class="hidden fixed inset-0 z-[100] bg-slate-950/60 backdrop-blur-sm items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 shadow-2xl flex flex-col items-center gap-3 min-w-60">
      <div class="w-12 h-12 rounded-full border-4 border-orange-600 border-t-transparent animate-spin"></div>
      <p id="loadingText" class="font-black text-slate-900">載入中...</p>
    </div>
  </div>

  <script>
    const LIFF_ID = "2009456572-HOlrrokl";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbztR8gRJ8jteY-UZ0fRST6oOF0ud9UdLgOBESsw5iAJ97Y0YmxgoWpWsZRsvQRbepuXJQ/exec";

    let userLineId = "";
    let userDisplayName = "";
    let userProfile = null;
    let userRole = "guest";
    let isAdmin = false;

    let allEvents = [];
    let allCategories = [];
    let allUsers = [];

    let currentEvent = null;
    let currentEditRegId = "";
    let attendeeSeq = 0;

    document.addEventListener("DOMContentLoaded", init);

    async function init() {
      showLoading("系統初始化中...");
      try {
        await liff.init({ liffId: LIFF_ID });

        const cached = localStorage.getItem("santie_web_user");

        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          userLineId = profile.userId;
          userDisplayName = profile.displayName;

          const result = await postGAS({
            action: "initApp",
            lineId: userLineId,
            name: userDisplayName
          });

          if (result.status === "success") {
            allCategories = result.categories || [];
            allEvents = result.events || [];
            allUsers = result.allUsers || [];

            if (result.isBound) {
              userProfile = result.user;
              userRole = result.isAdmin ? "admin" : "member";
              isAdmin = !!result.isAdmin;
              updateUserUI();
            } else {
              updateUserUI();
              openModal("authModal");
              switchAuth("register");
              document.getElementById("regName").value = userDisplayName || "";
            }
          } else {
            await loadPublicData();
          }
        } else if (cached) {
          const obj = JSON.parse(cached);
          await silentNormalLogin(obj.name, obj.phone);
        } else {
          await loadPublicData();
        }

        renderCategories();
        renderEvents();

        const params = new URLSearchParams(location.search);
        if (params.get("action") === "viewlist" && params.get("eventId")) {
          openParticipants(params.get("eventId"));
        }
      } catch (err) {
        console.error(err);
        alert("初始化失敗，請確認網路或 LIFF 設定。");
        await loadPublicData();
      } finally {
        hideLoading();
      }
    }

    async function loadPublicData() {
      try {
        const [catRes, evRes, userRes] = await Promise.all([
          fetch(`${GAS_URL}?action=getCategories`).then(r => r.json()),
          fetch(`${GAS_URL}?action=getEvents`).then(r => r.json()),
          fetch(`${GAS_URL}?action=getUsersList`).then(r => r.json()).catch(() => ({ users: [] }))
        ]);

        if (catRes.status === "success") allCategories = catRes.categories || [];
        if (evRes.status === "success") allEvents = evRes.events || [];
        if (userRes.status === "success") allUsers = userRes.users || [];

        updateUserUI();
      } catch (err) {
        console.error(err);
      }
    }

    async function reloadAll() {
      showLoading("重新載入中...");
      await loadPublicData();
      renderCategories();
      renderEvents();
      hideLoading();

    function updateUserUI() {
      const nameEl = document.getElementById("displayUserName");

      if (!userProfile) {
        nameEl.textContent = "訪客";
        roleEl.textContent = "請先登入以使用完整報名功能";

        document.getElementById("btnLogout").classList.add("hidden");

        document.getElementById("btnMyRegs").classList.add("hidden");

      nameEl.textContent = userProfile.name || userDisplayName || "會員";

        roleEl.textContent = "👑 管理員帳號";
      } else if (userRole === "member") {

      } else {
        roleEl.textContent = "🔒 遊客帳號，可瀏覽活動，需正式會員代報";

    function addSelfAttendee() {
      if (!currentEvent || !userProfile) return;

      const exists = [...document.querySelectorAll(".attendee-card")].some(card => {
        return card.dataset.self === "1";
      });

      if (exists) {
        alert("本人已經在報名清單中。");
        return;
      }

      addAttendeeCard({
        name: userProfile.name || "",
        phone: userProfile.phone || "",
        gender: userProfile.gender || "",
        birthday: userProfile.birthday ? gregToRoc(formatDate(userProfile.birthday)) : "",
        idCard: userProfile.idCard || "",
        relation: "本人",
        self: true,
        answers: {}
      });

    function addAttendeeCard(data) {
      attendeeSeq += 1;
      const id = `att_${attendeeSeq}`;

      const questions = Array.isArray(currentEvent.questions) ? currentEvent.questions : [];
      const extraQuestions = questions.filter(q => !["姓名", "電話", "性別", "生日", "身分證字號", "關係"].includes(q.title));

      const card = document.createElement("div");
      card.className = "attendee-card bg-white border-2 border-slate-200 rounded-3xl p-4 space-y-4";
      card.dataset.self = data.self ? "1" : "0";

      let qHTML = extraQuestions.map(q => {
        const value = data.answers && data.answers[q.title] ? data.answers[q.title] : "";
        const required = q.required ? "required" : "";
        const mark = q.required ? `<span class="text-red-500">*</span>` : "";

        if (q.type === "select") {
          const opts = String(q.options || "").split(",").map(x => x.trim()).filter(Boolean);
          return `
            <div>
              <label class="block text-sm font-black mb-1">${escapeHTML(q.title)} ${mark}</label>
              <select data-q="${escapeAttr(q.title)}" ${required} class="q-input w-full border-2 border-slate-300 rounded-2xl px-4 py-3 font-bold bg-white">
                <option value="">請選擇</option>
                ${opts.map(o => `<option value="${escapeAttr(o)}" ${o === value ? "selected" : ""}>${escapeHTML(o)}</option>`).join("")}
              </select>
            </div>
          `;
        }

        return `
          <div>
            <label class="block text-sm font-black mb-1">${escapeHTML(q.title)} ${mark}</label>
            <input data-q="${escapeAttr(q.title)}" value="${escapeAttr(value)}" ${required} class="q-input w-full border-2 border-slate-300 rounded-2xl px-4 py-3 font-bold" placeholder="請輸入" />
          </div>
        `;
      }).join("");

      card.innerHTML = `
        <div class="flex justify-between items-center gap-3">
          <div>
            <p class="font-black text-lg text-slate-950">${data.self ? "👤 本人" : "👥 同行人"}</p>
            <p class="text-xs font-bold text-slate-500">${escapeHTML(data.relation || "同行人")}</p>
          </div>
          ${data.self ? "" : `
            <button onclick="this.closest('.attendee-card').remove()" class="bg-red-50 hover:bg-red-100 text-red-700 border border-red-200 rounded-xl px-3 py-1 font-black text-sm">
              移除
            </button>
          `}
        </div>

        <div class="grid sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-black mb-1">姓名 *</label>
            <input class="att-name w-full border-2 border-slate-300 rounded-2xl px-4 py-3 font-bold bg-slate-50" readonly value="${escapeAttr(data.name || "")}" />
          </div>
          <div>
            <label class="block text-sm font-black mb-1">電話</label>
            <input class="att-phone w-full border-2 border-slate-300 rounded-2xl px-4 py-3 font-bold bg-slate-50" readonly value="${escapeAttr(data.phone || "")}" />
          </div>
        </div>

        <input class="att-relation" type="hidden" value="${escapeAttr(data.relation || "同行人")}">
        <input class="att-gender" type="hidden" value="${escapeAttr(data.gender || "")}">
        <input class="att-birthday" type="hidden" value="${escapeAttr(data.birthday || "")}">
        <input class="att-idcard" type="hidden" value="${escapeAttr(data.idCard || "")}">

        ${qHTML || `
          <div class="bg-slate-50 rounded-2xl p-4 text-sm font-bold text-slate-500">
            此活動沒有額外調查問題。
          </div>
        `}
      `;

      document.getElementById("attendeesBox").appendChild(card);
    }

    async function submitRegistration() {
      const cards = [...document.querySelectorAll(".attendee-card")];

      if (!cards.length) {
        alert("請至少加入一位報名者。");
        return;
      }

      const attendees = [];
      let valid = true;

      cards.forEach(card => {
        const name = card.querySelector(".att-name").value.trim();
        const phone = card.querySelector(".att-phone").value.trim();
        const relation = card.querySelector(".att-relation").value.trim();
        const gender = card.querySelector(".att-gender").value.trim();
        const birthdayRoc = card.querySelector(".att-birthday").value.trim();
        const idCard = card.querySelector(".att-idcard").value.trim();

        const birthdayGreg = birthdayRoc ? rocToGreg(birthdayRoc) : "";

        const answers = {
          "姓名": name,
          "電話": phone,
          "關係": relation,
          "性別": gender,
          "生日": birthdayGreg,
          "身分證字號": idCard
        };

        card.querySelectorAll(".q-input").forEach(input => {
          const q = input.dataset.q;
          const val = input.value.trim();

          if (input.required && !val) {
            valid = false;
            input.classList.add("border-red-500");
          } else {
            input.classList.remove("border-red-500");
          }

          answers[q] = val;
        });

        attendees.push({
          name,
          phone,
          relation,
          gender,
          birthday: birthdayGreg,
          idCard,
          answers
        });
      });

      if (!valid) {
        alert("請完整填寫必填問題。");
        return;
      }

      showLoading(currentEditRegId ? "正在更新報名..." : "正在送出報名...");

      try {
        const payload = {
          action: "registerMulti",
          regId: currentEditRegId || undefined,
          eventId: currentEvent.id,
          lineId: userLineId,
          leaderName: userProfile ? userProfile.name : userDisplayName,
          leaderPhone: userProfile ? userProfile.phone : "",
          groupId: liff.getContext ? (liff.getContext()?.groupId || "") : "",
          attendees
        };

        const result = await postGAS(payload);

        if (result.status === "success") {
          alert(`${currentEditRegId ? "修改" : "報名"}成功！狀態：${result.queueStatus || "已送出"}`);
          closeModal("registerModal");
          currentEditRegId = "";
          await reloadAll();
        } else {
          alert("送出失敗：" + (result.message || "未知錯誤"));
        }
      } catch (err) {
        console.error(err);
        alert("連線失敗，請稍後再試。");
      } finally {
        hideLoading();
      }
    }

    async function addNewCompanion(event) {
      event.preventDefault();

      const name = document.getElementById("newName").value.trim();
      const phone = document.getElementById("newPhone").value.trim();
      const gender = document.getElementById("newGender").value;
      const relation = document.getElementById("newRelation").value;
      const birthdayRoc = document.getElementById("newBirthday").value.trim();
      const idCard = document.getElementById("newIdCard").value.trim().toUpperCase();

      const birthdayGreg = rocToGreg(birthdayRoc);
      if (!birthdayGreg) {
        alert("生日格式錯誤，請輸入例如：75/10/25");
        return;
      }

      if (!/^[A-Z][12]\d{8}$/.test(idCard)) {
        alert("身分證字號格式錯誤。");
        return;
      }

      showLoading("儲存同行人中...");

      try {
        const result = await postGAS({
          action: "bindUser",
          lineId: "",
          name,
          phone,
          gender,
          birthday: birthdayGreg,
          idCard
        });

        if (result.status === "success") {
          allUsers.push({ name, phone, gender, birthday: birthdayGreg, idCard });
          addAttendeeCard({
            name,
            phone,
            gender,
            birthday: birthdayRoc,
            idCard,
            relation,
            self: false,
            answers: {}
          });
          closeModal("newCompanionModal");
          event.target.reset();
        } else {
          alert("儲存失敗：" + (result.message || "未知錯誤"));
        }
      } catch (err) {
        console.error(err);
        alert("連線失敗。");
      } finally {
        hideLoading();
      }
    }

      document.getElementById("profilePhone").value = userProfile.phone || "";
      document.getElementById("profileGender").value = userProfile.gender || "";
      document.getElementById("profileBirthday").value = userProfile.birthday ? gregToRoc(formatDate(userProfile.birthday)) : "";
      document.getElementById("profileIdCard").value = userProfile.idCard || "";
      document.getElementById("profileAddress").value = userProfile.address || "";

      openModal("profileModal");
    }

    async function saveProfile(event) {
      event.preventDefault();

      const birthdayRoc = document.getElementById("profileBirthday").value.trim();
      const birthdayGreg = rocToGreg(birthdayRoc);
      const idCard = document.getElementById("profileIdCard").value.trim().toUpperCase();

      if (!birthdayGreg) {
        alert("生日格式錯誤，請輸入例如：75/10/25");
        return;
      }

      if (!/^[A-Z][12]\d{8}$/.test(idCard)) {
        alert("身分證字號格式錯誤。");
        return;
      }

      showLoading("儲存會員資料中...");

      try {
        const result = await postGAS({
          action: "saveProfile",
          lineId: userLineId,
          name: document.getElementById("profileName").value.trim(),
          phone: document.getElementById("profilePhone").value.trim(),
          gender: document.getElementById("profileGender").value,
          birthday: birthdayGreg,
          idCard,
          address: document.getElementById("profileAddress").value.trim()
        });

        if (result.status === "success") {
          userProfile = result.user;
          userRole = isAdmin ? "admin" : "member";
          updateUserUI();
          closeModal("profileModal");
          alert("會員資料已更新。");
        } else {
          alert("儲存失敗：" + (result.message || "未知錯誤"));
        }
      } catch (err) {
        console.error(err);
        alert("連線失敗。");
      } finally {
        hideLoading();
      }
    }

    function switchAuth(type) {
      const loginForm = document.getElementById("loginForm");
      const registerForm = document.getElementById("registerForm");
      const tabLogin = document.getElementById("tabLogin");
      const tabRegister = document.getElementById("tabRegister");

      if (type === "login") {
        loginForm.classList.remove("hidden");
        registerForm.classList.add("hidden");
        tabLogin.className = "rounded-xl bg-white text-orange-700 font-black";
        tabRegister.className = "rounded-xl text-slate-500 font-black";
      } else {
        loginForm.classList.add("hidden");
        registerForm.classList.remove("hidden");
        tabLogin.className = "rounded-xl text-slate-500 font-black";
        tabRegister.className = "rounded-xl bg-white text-orange-700 font-black";
      }
    }

    function lineLogin() {
      if (!liff.isLoggedIn()) {
        liff.login();
      }
    }

    async function normalLogin(event) {
      event.preventDefault();
      const name = document.getElementById("loginName").value.trim();
      const phone = document.getElementById("loginPhone").value.trim();
      await silentNormalLogin(name, phone, true);
    }

    async function silentNormalLogin(name, phone, showAlert = false) {
      showLoading("登入驗證中...");

      try {
        const result = await postGAS({
          action: "verifyNormalUser",
          name,
          phone
        });

        if (result.status === "success" && result.user) {
          userProfile = result.user;
          userRole = "guest";
          isAdmin = false;
          localStorage.setItem("santie_web_user", JSON.stringify({ name, phone }));
          updateUserUI();
          closeModal("authModal");
          await loadPublicData();
          renderEvents();

          if (showAlert) alert("登入成功，目前身分為遊客。");
        } else {
          if (showAlert) alert("登入失敗，找不到此姓名與電話。");
          localStorage.removeItem("santie_web_user");
        }
      } catch (err) {
        console.error(err);
        if (showAlert) alert("連線失敗。");
      } finally {
        hideLoading();
      }
    }

    async function normalRegister(event) {
      event.preventDefault();

      const name = document.getElementById("regName").value.trim();
      const phone = document.getElementById("regPhone").value.trim();
      const gender = document.getElementById("regGender").value;
      const birthdayRoc = document.getElementById("regBirthday").value.trim();
      const idCard = document.getElementById("regIdCard").value.trim().toUpperCase();

      let birthdayGreg = "";
      if (birthdayRoc) {
        birthdayGreg = rocToGreg(birthdayRoc);
        if (!birthdayGreg) {
          alert("生日格式錯誤，請輸入例如：75/10/25");
          return;
        }
      }

      if (idCard && !/^[A-Z][12]\d{8}$/.test(idCard)) {
        alert("身分證字號格式錯誤。");
        return;
      }

      showLoading("註冊中...");

      try {
        const result = await postGAS({
          action: "bindUser",
          lineId: userLineId || "",
          name,
          phone,
          gender,
          birthday: birthdayGreg,
          idCard
        });

        if (result.status === "success") {
          userProfile = { name, phone, gender, birthday: birthdayGreg, idCard, address: "" };
          userRole = userLineId ? "member" : "guest";
          localStorage.setItem("santie_web_user", JSON.stringify({ name, phone }));
          updateUserUI();
          closeModal("authModal");
          await reloadAll();
          alert("註冊成功。");
        } else {
          alert("註冊失敗：" + (result.message || "未知錯誤"));
        }
      } catch (err) {
        console.error(err);
        alert("連線失敗。");
      } finally {
        hideLoading();
      }
    }

    function logout() {
      if (!confirm("確定要登出嗎？")) return;

      if (liff.isLoggedIn()) {
        liff.logout();
      }

      localStorage.removeItem("santie_web_user");
      userLineId = "";
      userDisplayName = "";
      userProfile = null;
      userRole = "guest";
      isAdmin = false;
      updateUserUI();
      alert("已登出。");
    }

    function isProfileComplete() {
      return !!(
        userProfile &&
        userProfile.name &&
        userProfile.phone &&
        userProfile.gender &&
        userProfile.birthday &&
        userProfile.idCard
      );
    }

    async function postGAS(payload) {
      const res = await fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload)
      });
      return await res.json();
    }

    function openModal(id) {
      document.getElementById(id).classList.add("show");
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove("show");
    }

    function showLoading(text) {
      document.getElementById("loadingText").textContent = text || "載入中...";
      document.getElementById("loading").classList.remove("hidden");
      document.getElementById("loading").classList.add("flex");
    }

    function hideLoading() {
      document.getElementById("loading").classList.add("hidden");
      document.getElementById("loading").classList.remove("flex");
    }

    function focusSearch() {
      document.getElementById("keywordFilter").focus();
    }

    function formatTime(input) {
      if (!input) return "";
      const d = new Date(input);
      if (isNaN(d.getTime())) return String(input);
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function formatDate(input) {
      if (!input) return "";
      const d = new Date(input);
      if (isNaN(d.getTime())) return String(input).split("T")[0];
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    function gregToRoc(gregStr) {
      if (!gregStr) return "";
      const parts = String(gregStr).split("-");
      if (parts.length !== 3) return gregStr;
      return `${parseInt(parts[0], 10) - 1911}/${parseInt(parts[1], 10)}/${parseInt(parts[2], 10)}`;
    }

    function rocToGreg(rocStr) {
      if (!rocStr) return "";
      let clean = String(rocStr).trim().replace(/[.\-\s]/g, "/");

      if (/^\d{6,7}$/.test(clean)) {
        const len = clean.length;
        clean = `${clean.substring(0, len - 4)}/${clean.substring(len - 4, len - 2)}/${clean.substring(len - 2)}`;
      }

      const parts = clean.split("/");
      if (parts.length !== 3) return null;

      const y = parseInt(parts[0], 10);
      const m = parseInt(parts[1], 10);
      const d = parseInt(parts[2], 10);

      if (!y || !m || !d || m < 1 || m > 12 || d < 1 || d > 31) return null;

      return `${y + 1911}-${pad(m)}-${pad(d)}`;
    }

    function maskName(name) {
      if (!name) return "";
      if (name.length <= 2) return name[0] + "*";
      return name[0] + "*".repeat(name.length - 2) + name[name.length - 1];
    }

    function escapeHTML(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttr(str) {
      return escapeHTML(str);
    }
  </script>
