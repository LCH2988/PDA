    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }

        .slide-container {
            aspect-ratio: 16 / 9;
            max-height: 72vh;
        }

        .slide-shadow {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #0d9488;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #14b8a6;
        }

        .slide-enter {
            animation: fadeIn 0.3s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

        let currentSlideIndex = 0;
        let isScriptPanelOpen = false;

        // Font Size Scale Controller for Senior Accessibility
        const fontScaleLevels = [85, 100, 115, 130, 145, 160];
        let currentFontScaleIndex = 1; // Default 100%

        function adjustFontSize(direction) {
            currentFontScaleIndex = Math.max(0, Math.min(fontScaleLevels.length - 1, currentFontScaleIndex + direction));
            applyFontSize();
        }

        function resetFontSize() {
            currentFontScaleIndex = 1; // Reset to 100%
            applyFontSize();
        }

        function applyFontSize() {
            const currentScale = fontScaleLevels[currentFontScaleIndex];
            // Adjust root document font-size percentage to cleanly scale all Tailwind rem-based components
            document.documentElement.style.fontSize = `${(currentScale / 100) * 16}px`;
            
            const label = document.getElementById("font-scale-label");
            if (label) {
                label.innerText = `${currentScale}%`;
                if (currentScale > 100) {
                    label.classList.add("text-teal-400", "font-black");
                } else {
                    label.classList.remove("text-teal-400", "font-black");
                }
            }
        }

        function renderSlide() {
            const slide = slidesData[currentSlideIndex];
            const viewport = document.getElementById("slide-viewport");
            
            // Re-trigger CSS animation
            viewport.classList.remove("slide-enter");
            void viewport.offsetWidth; 
            viewport.classList.add("slide-enter");

            // Render HTML
            viewport.innerHTML = slide.render();

            // Update Counters & Progress
            document.getElementById("current-slide-badge").innerText = String(slide.id).padStart(2, '0');
            document.getElementById("total-slide-badge").innerText = String(slidesData.length).padStart(2, '0');
            
            const progressPercent = ((currentSlideIndex + 1) / slidesData.length) * 100;
            document.getElementById("progress-bar").style.width = `${progressPercent}%`;

            // Update Presenter Script Content
            document.getElementById("script-content").innerHTML = slide.script;
            document.getElementById("speaking-time").innerText = slide.time;

            renderDots();
        }

        function renderDots() {
            const container = document.getElementById("dots-container");
            container.innerHTML = "";
            slidesData.forEach((_, idx) => {
                const dot = document.createElement("button");
                dot.className = `h-2 rounded-full transition-all duration-300 ${idx === currentSlideIndex ? 'w-6 bg-teal-400' : 'w-2 bg-slate-700 hover:bg-slate-500'}`;
                dot.onclick = () => goToSlide(idx);
                container.appendChild(dot);
            });
        }

        function nextSlide() {
            if (currentSlideIndex < slidesData.length - 1) {
                currentSlideIndex++;
                renderSlide();
            }
        }

        function prevSlide() {
            if (currentSlideIndex > 0) {
                currentSlideIndex--;
                renderSlide();
            }
        }

        function goToSlide(index) {
            currentSlideIndex = index;
            renderSlide();
            closeOverviewModal();
        }

        function toggleScriptPanel() {
            const panel = document.getElementById("script-panel");
            const presentationCol = document.getElementById("presentation-column");
            const btn = document.getElementById("script-toggle-btn");

            isScriptPanelOpen = !isScriptPanelOpen;

            if (isScriptPanelOpen) {
                panel.classList.remove("hidden");
                presentationCol.classList.remove("lg:col-span-12");
                presentationCol.classList.add("lg:col-span-8");
                btn.classList.add("bg-teal-600", "text-white");
            } else {
                panel.classList.add("hidden");
                presentationCol.classList.remove("lg:col-span-8");
                presentationCol.classList.add("lg:col-span-12");
                btn.classList.remove("bg-teal-600", "text-white");
            }
        }

        function openOverviewModal() {
            const grid = document.getElementById("overview-grid");
            grid.innerHTML = "";
            slidesData.forEach((slide, idx) => {
                const item = document.createElement("div");
                item.className = `p-3 rounded-xl border text-left cursor-pointer transition flex flex-col justify-between ${idx === currentSlideIndex ? 'bg-teal-950/80 border-teal-500 text-teal-200' : 'bg-slate-800/80 border-slate-700 text-slate-300 hover:bg-slate-700'}`;
                item.onclick = () => goToSlide(idx);
                item.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xs font-bold px-2 py-0.5 rounded ${idx === currentSlideIndex ? 'bg-teal-500 text-slate-950' : 'bg-slate-700 text-slate-300'}">Slide ${slide.id}</span>
                        <span class="text-[10px] opacity-70">${slide.time}</span>
                    </div>
                    <strong class="text-xs font-semibold line-clamp-2 block mb-1">${slide.tag}</strong>
                `;
                grid.appendChild(item);
            });
            document.getElementById("overview-modal").classList.remove("hidden");
        }

        function closeOverviewModal() {
            document.getElementById("overview-modal").classList.add("hidden");
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Keyboard Navigation Support
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space') {
                nextSlide();
            } else if (e.key === 'ArrowLeft') {
                prevSlide();
            } else if (e.key === 'Escape') {
                closeOverviewModal();
            }
        });

        // Window Load Initialization
        window.onload = function() {
            renderSlide();
            applyFontSize();
        };
    </script>
