<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>帕金森日常照護日誌</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{--fs:22px;--ink:#1a1a1a;--bg:#fffdf5;--blue:#0b5394;--green:#1b7a3e;--red:#b71c1c;--amber:#b36b00;--gray:#555}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);
  line-height:1.55;padding-bottom:104px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font-family:inherit;cursor:pointer}
h2{font-size:1.25rem;margin:0 0 6px}
h3{font-size:1.05rem;margin:10px 0 4px}
.hint{font-size:.8rem;color:var(--gray);margin:0 0 10px}
.hidden{display:none!important}

/* 頂部 */
#top{position:sticky;top:0;z-index:20;background:#12304f;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:8px 12px}
#top .brand{font-weight:900;font-size:1rem}
#top button{background:#fff;color:#12304f;border:none;border-radius:12px;font-size:.9rem;font-weight:900;min-width:52px;min-height:44px;margin-left:6px}
#nextBar{background:#ffe9a8;border-bottom:3px solid #e0b000;padding:8px 12px;font-size:.85rem;font-weight:700}

main{max-width:760px;margin:0 auto;padding:12px}
.card{background:#fff;border:3px solid #cfd8e3;border-radius:22px;padding:14px;margin:0 0 14px}
.card.warn{border-color:#e0b000;background:#fff8dc}
.card.sos{border-color:var(--red);background:#fff1f0}

/* 大按鈕 */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:80px;margin:8px 0;
  border:none;border-radius:20px;font-size:1.1rem;font-weight:900;color:#fff;background:var(--blue);padding:10px 14px;text-align:center}
.btn:active{transform:scale(.97);filter:brightness(.9)}
.btn.green{background:var(--green)} .btn.red{background:var(--red)} .btn.gray{background:var(--gray)}
.btn.amber{background:var(--amber)} .btn.purple{background:#6a2c91}
.btn.small{min-height:56px;font-size:.9rem;width:auto;display:inline-flex;margin:4px 4px 4px 0}
.btn.line{background:#fff;color:var(--blue);border:3px solid var(--blue)}

/* 身體狀態按鈕:左圖示、右文字 */
.st{display:flex;align-items:center;gap:12px;width:100%;min-height:92px;margin:8px 0;padding:10px 14px;border-radius:20px;
  border:4px solid;text-align:left;font-size:1.05rem;font-weight:900}
.st:active{transform:scale(.97)}
.st .em{font-size:2.2rem;flex:none}
.st small{display:block;font-weight:500;font-size:.75rem;opacity:.9}

/* 時間選擇 chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.chip{min-height:54px;padding:6px 14px;border-radius:30px;border:3px solid var(--blue);background:#fff;color:var(--blue);font-size:.85rem;font-weight:900}
.chip.on{background:var(--blue);color:#fff}

/* 紀錄列 */
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;border-bottom:2px solid #e8edf3;font-size:.85rem}
.li b{font-size:.95rem}
.li .x{background:#eee;border:none;border-radius:12px;min-width:52px;min-height:52px;font-size:1rem}

/* 問卷卡 */
.q{margin:12px 0}
.q .opts{display:flex;gap:8px}
.q .opts button{flex:1;min-height:76px;border-radius:16px;border:3px solid #9aa7b5;background:#fff;font-size:.8rem;font-weight:700}
.q .opts button .em{display:block;font-size:1.7rem}
.q .opts button.on{border-color:var(--blue);background:#dbeafe}

/* 表單 */
input[type=text],input[type=time],input[type=tel],select,textarea{width:100%;font-size:1rem;padding:12px;border:3px solid #8a96a3;border-radius:14px;background:#fff;font-family:inherit}
label{display:block;font-weight:700;margin:10px 0 2px;font-size:.9rem}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}

/* 底部導覽 */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:#12304f;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
#tabs button{flex:1;min-height:76px;margin:0 3px;border:none;border-radius:16px;background:#1e4a75;color:#fff;font-size:.72rem;font-weight:700;line-height:1.25}
#tabs button .em{display:block;font-size:1.6rem}
#tabs button.on{background:#fff;color:#12304f}
#tabs button.sosTab{background:var(--red)}
#tabs button.sosTab.on{background:#fff;color:var(--red)}

/* 撤銷提示 */
#snack{position:fixed;left:8px;right:8px;bottom:96px;z-index:40;background:#222;color:#fff;border:3px solid #ffd54f;border-radius:18px;
  padding:10px 12px;display:none;align-items:center;justify-content:space-between;gap:8px;font-size:.9rem;font-weight:700}
#snack button{background:#ffd54f;border:none;border-radius:12px;min-height:56px;padding:0 16px;font-size:.95rem;font-weight:900}

/* 對話框 */
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:60;overflow:auto;padding:14px}
#dlg .box{background:#fff;max-width:620px;margin:auto;border-radius:22px;padding:16px;border:4px solid var(--blue)}

/* 遊戲 */
.big{font-size:2.4rem;font-weight:900;text-align:center;color:var(--red)}
.result{background:#e8f8f0;border-radius:14px;padding:10px;margin-top:10px;font-size:.9rem}
#tapBtn{width:100%;height:230px;font-size:2rem;font-weight:900;color:#fff;background:#e67e22;border:none;border-radius:26px}
#reactBox{height:260px;border-radius:22px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.6rem;font-weight:900;color:#fff;background:#c0392b;padding:10px}
#targetArea{position:relative;height:360px;background:#eef6fb;border:4px dashed var(--blue);border-radius:18px}
.dot{position:absolute;width:88px;height:88px;border-radius:50%;background:#e74c3c;border:6px solid #fff;box-shadow:0 0 0 3px #c0392b;padding:0}
#orderGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
#orderGrid button{height:100px;font-size:2.2rem;font-weight:900;background:#6a2c91;color:#fff;border:none;border-radius:18px}
#orderGrid button.done{background:var(--green)}
canvas.cv{background:#fff;border:3px solid var(--blue);border-radius:14px;touch-action:none;width:100%;max-width:420px;display:block;margin:auto}

/* 分析 */
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;min-height:60px;border-radius:14px;border:3px solid var(--blue);background:#fff;color:var(--blue);font-weight:900;font-size:.85rem}
.seg button.on{background:var(--blue);color:#fff}
.insight{border-left:8px solid var(--blue);background:#eef6fb;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:.9rem}
.insight.warn{border-color:var(--amber);background:#fff3e0}
.insight.bad{border-color:var(--red);background:#ffebee}
.insight.good{border-color:var(--green);background:#e8f5e9}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi div{background:#eef6fb;border-radius:14px;text-align:center;padding:8px;font-size:.75rem}
.kpi b{display:block;font-size:1.6rem;color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:.8rem}
td,th{border-bottom:1px solid #ccc;padding:6px;text-align:left}
.chartBox{position:relative;height:300px}

/* 列印 */
#printArea{display:none}
@media print{
  body.printing>*:not(#printArea){display:none!important}
  body.printing #printArea{display:block!important}
  body{background:#fff;font-size:12pt;padding:0}
}
</style>
</head>

<body>
<header id="top">
  <div class="brand">🧠 帕金森日常照護日誌</div>
  <div><button onclick="fontStep(-1)" aria-label="縮小字體">A−</button><button onclick="fontStep(1)" aria-label="放大字體">A＋</button></div>
</header>
<div id="nextBar">下一次吃藥:計算中…</div>

<main>
  <section id="pg-home"  class="pg"></section>
  <section id="pg-games" class="pg hidden"></section>
  <section id="pg-plan"  class="pg hidden"></section>
  <section id="pg-sos"   class="pg hidden"></section>
  <section id="pg-ana"   class="pg hidden"></section>
</main>

<nav id="tabs">
  <button data-pg="home"  onclick="go('home')"><span class="em">📝</span>記錄</button>
  <button data-pg="games" onclick="go('games')"><span class="em">🖐️</span>復健</button>
  <button data-pg="plan"  onclick="go('plan')"><span class="em">💊</span>用藥飲食</button>
  <button data-pg="sos"   class="sosTab" onclick="go('sos')"><span class="em">🚨</span>救援</button>
  <button data-pg="ana"   onclick="go('ana')"><span class="em">📊</span>分析報告</button>
</nav>

<div id="snack"><span id="snackMsg"></span><button onclick="undoLast()">↩ 撤銷</button></div>
<div id="dlg" class="hidden"><div class="box" id="dlgBox"></div></div>
<div id="printArea"></div>

<!-- 第 2 段的 <script> 從這裡開始 -->
<script>
/* =====================================================
   第 7 段:匿名統計分享(選配,使用者同意才啟用)
   ===================================================== */
const SY_URL='https://script.google.com/macros/s/AKfycbze_rqqzmku0Kdf-be3dMRmYEkr2v5hjsJZrQzZ8NSvr0n-cxEyqRPJlG-5j9u9LGTEOA/exec';
const SY_KEY='pd2_sync';
let SY=(()=>{try{return Object.assign({on:false,uid:'',q:[]},JSON.parse(localStorage.getItem(SY_KEY))||{});}catch(e){return{on:false,uid:'',q:[]};}})();
let syBusy=false;
const syReady=()=>/^https:\/\/script\.google\.com\//.test(SY_URL);
function sySave(){localStorage.setItem(SY_KEY,JSON.stringify(SY));}
function newUid(){
  const a=new Uint8Array(10);crypto.getRandomValues(a);
  return 'P'+Array.from(a,b=>(b%36).toString(36)).join('')+Date.now().toString(36);}

/* ---------- 排入佇列(實際內容在送出時才從本機讀,所以撤銷與修改都會反映) ---------- */
function syQ(item){
  const key=item.t+':'+(item.id||item.day);
  SY.q=SY.q.filter(x=>(x.t+':'+(x.id||x.day))!==key);
  item.at=Date.now();SY.q.push(item);sySave();}
const _addLog=addLog;
addLog=function(k,c,v,ts){
  const it=_addLog(k,c,v,ts);
  if(SY.on){k==='card'?syQ({t:'card',day:ymd(it.ts)}):syQ({t:'log',id:it.id});}
  return it;};
const _setCard=setCard;
setCard=function(k,i){_setCard(k,i);if(SY.on)syQ({t:'card',day:ymd(Date.now())});};

/* ---------- 把佇列項目轉成上傳列 ---------- */
function syRow(x){
  if(x.t==='log'){
    const l=DB.logs.find(z=>z.id===x.id);if(!l)return null;
    if(!['med','state','game'].includes(l.k))return null;
    return{rid:SY.uid+'-'+l.id,uid:SY.uid,kind:l.k,code:l.k==='med'?'MED':l.c,
      num:(l.k==='game'&&typeof l.num==='number')?l.num:'',ts:l.ts};}
  const c=DB.logs.filter(l=>l.k==='card'&&ymd(l.ts)===x.day).pop();if(!c)return null;
  const s=QS.map(q=>c.v&&c.v[q.k]!==undefined?String(c.v[q.k]):'-').join('');
  if(/^-+$/.test(s))return null;
  return{rid:SY.uid+'-card-'+x.day,uid:SY.uid,kind:'card',code:'CARD',extra:s,ts:c.ts};}

/* ---------- 送出(滿 10 秒才送,讓 8 秒撤銷有效) ---------- */
async function syFlush(){
  if(!SY.on||!syReady()||syBusy||!navigator.onLine)return;
  const ready=SY.q.filter(x=>Date.now()-x.at>=10000).slice(0,50);
  if(!ready.length)return;
  const pairs=ready.map(x=>({x,row:syRow(x)}));
  const rows=pairs.filter(p=>p.row).map(p=>p.row);
  const drop=pairs.filter(p=>!p.row).map(p=>p.x);          // 已被撤銷或空白的,直接丟掉
  syBusy=true;
  try{
    let done=[];
    if(rows.length){
      const r=await fetch(SY_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'records',rows})});
      const j=await r.json();
      if(!j.ok)throw new Error(j.err||'fail');
      done=j.done||[];}
    const okRid=new Set(done);
    const gone=new Set(drop.map(x=>x.t+':'+(x.id||x.day)));
    pairs.forEach(p=>{if(p.row&&okRid.has(p.row.rid))gone.add(p.x.t+':'+(p.x.id||p.x.day));});
    SY.q=SY.q.filter(x=>!gone.has(x.t+':'+(x.id||x.day)));sySave();
  }catch(e){/* 下次再試 */}
  syBusy=false;
  if(curPg==='ana'&&anaTab==='report')renderAna();}

/* ---------- 同意與停止 ---------- */
function syConsentDlg(){
  openDlg(`<h2>🤝 分享匿名統計給協會</h2>
    <div style="font-size:.9rem">
    <b>會上傳:</b>隨機匿名編號、吃藥的時間(沒有藥名)、身體狀態、小遊戲成績、問卷卡的選項。<br>
    <b>不會上傳:</b>姓名、電話、病名、藥名、醫院、想問醫師的問題,以及任何您打的字。<br>
    <b>開始之後</b>才記錄的資料會上傳,之前的不會。<br>
    <b>隨時可以退出</b>,並要求刪除雲端上的資料。<br>
    這是自願的,不分享也能完整使用所有功能。</div>
    <button class="btn green" onclick="syOn()">我同意,開始分享</button>
    <button class="btn gray" onclick="closeDlg()">不要</button>`);}
function syOn(){
  SY={on:true,uid:newUid(),q:[]};sySave();closeDlg();refresh();toast('已開始分享');}
function syOffAsk(){
  confirmBox('停止分享,並刪除雲端上屬於這台裝置的資料?刪除後無法復原。',syOff,'停止並刪除');}
async function syOff(){
  const uid=SY.uid;
  if(syReady()&&uid){
    try{
      const r=await fetch(SY_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'delete',uid})});
      const j=await r.json();
      if(!j.ok)throw new Error();
    }catch(e){msgBox('刪除失敗','目前連不上伺服器,尚未停止分享。請連上網路後再試一次。');return;}
  }
  SY={on:false,uid:'',q:[]};sySave();refresh();toast('已停止並刪除');}

/* ---------- 顯示在「回診報告」最下方 ---------- */
function syncCard(){
  if(!syReady())return '';
  return SY.on
   ?`<div class="card"><h2>🤝 匿名統計分享:已開啟</h2>
      <p class="hint">待上傳 ${SY.q.length} 筆。只傳匿名資料,不含姓名、電話、藥名。</p>
      <button class="btn line" onclick="syFlush().then(()=>toast('已嘗試上傳'))">⬆ 立即上傳</button>
      <button class="btn red" onclick="syOffAsk()">停止分享並刪除雲端資料</button></div>`
   :`<div class="card"><h2>🤝 分享匿名統計(選填)</h2>
      <p class="hint">自願協助協會了解病友整體狀況。不分享也能完整使用。</p>
      <button class="btn line" onclick="syConsentDlg()">了解並決定</button></div>`;}
const _reportCard2=reportCard;
reportCard=function(){return _reportCard2()+syncCard();};

/* ---------- 啟動 ---------- */
window.addEventListener('load',()=>{
  setInterval(syFlush,15000);
  window.addEventListener('online',syFlush);
  setTimeout(syFlush,3000);
});

/* =====================================================
   第 2 段:核心
   ===================================================== */
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const hm=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes());};
const ymd=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const dayLabel=ts=>{const d=new Date(ts);return (d.getMonth()+1)+'/'+d.getDate();};

/* ---------- 資料(只存本機) ---------- */
const KEY='pd2_data';
let DB=null;
function blank(){return{logs:[],meds:[],
  profile:{name:'',dx:'帕金森氏症',doctor:'',hospital:'',allergy:'',other:''},
  contacts:[{name:'',tel:''},{name:'',tel:''}],
  meals:{b:'08:00',l:'12:00',d:'18:30'},questions:[]};}
function load(){let d=null;try{d=JSON.parse(localStorage.getItem(KEY));}catch(e){}
  DB=Object.assign(blank(),d||{});DB.profile=Object.assign(blank().profile,DB.profile||{});}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){toast('儲存空間不足,請先匯出再清除舊紀錄');}}
function addLog(k,c,v,ts){
  const it={id:Date.now()+Math.floor(Math.random()*1000),ts:ts||Date.now(),k,c,v:(v===undefined?'':v)};
  DB.logs.push(it);
  DB.logs=DB.logs.sort((a,b)=>a.ts-b.ts).slice(-6000);
  save();return it;}
function delLog(id){DB.logs=DB.logs.filter(l=>l.id!==id);save();}

/* ---------- 狀態定義 ---------- */
const STATES=[
 {c:'ON',      em:'😀',t:'很順',            h:'藥效好,動作順暢',          fg:'#0b3d1e',bg:'#d8f3dc',bd:'#1b7a3e',lv:3},
 {c:'DYS',     em:'🌀',t:'身體會不自主亂動', h:'扭動、搖擺(異動)',        fg:'#5a3a00',bg:'#ffe8b0',bd:'#b36b00',lv:2},
 {c:'OFF',     em:'🧊',t:'僵硬、動作很慢',   h:'藥效退了(OFF)',           fg:'#5a0d0d',bg:'#ffd6d6',bd:'#b71c1c',lv:0},
 {c:'FREEZE',  em:'🦶',t:'腳黏住走不動',     h:'凍步',                   fg:'#3b1359',bg:'#ead6f7',bd:'#6a2c91',lv:1},
 {c:'FALL',    em:'⚠️',t:'跌倒了',           h:'請看「救援」分頁',         fg:'#fff',   bg:'#b71c1c',bd:'#7f0000',lv:0}
];
const stOf=c=>STATES.find(s=>s.c===c)||{em:'•',t:c,bd:'#888',lv:null};

/* ---------- 對話框、提示 ---------- */
function openDlg(html){$('dlgBox').innerHTML=html;$('dlg').classList.remove('hidden');}
function closeDlg(){$('dlg').classList.add('hidden');}
function msgBox(t,body){openDlg(`<h2>${esc(t)}</h2><div style="font-size:.95rem">${body}</div><button class="btn" onclick="closeDlg()">知道了</button>`);}
function confirmBox(msg,yes,yesLabel){
  window._yes=yes;
  openDlg(`<h2>請確認</h2><p style="font-size:1rem">${esc(msg)}</p>
    <button class="btn red" onclick="closeDlg();window._yes()">${esc(yesLabel||'確定')}</button>
    <button class="btn gray" onclick="closeDlg()">不要,取消</button>`);}
let _tt=null;
function toast(t){const e=$('snackMsg');$('snack').querySelector('button').style.display='none';e.textContent=t;
  $('snack').style.display='flex';clearTimeout(_tt);_tt=setTimeout(()=>$('snack').style.display='none',3000);}
let _undoId=null;
function snackUndo(t,id){_undoId=id;$('snack').querySelector('button').style.display='';$('snackMsg').textContent=t;
  $('snack').style.display='flex';clearTimeout(_tt);_tt=setTimeout(()=>{$('snack').style.display='none';_undoId=null;},8000);}
function undoLast(){if(_undoId){delLog(_undoId);_undoId=null;$('snack').style.display='none';refresh();toast('已撤銷');}}

/* ---------- 字體 ---------- */
let fs=parseInt(localStorage.getItem('pd2_fs'))||22;
function fontStep(d){fs=Math.min(30,Math.max(18,fs+d*2));document.documentElement.style.setProperty('--fs',fs+'px');localStorage.setItem('pd2_fs',fs);}
document.documentElement.style.setProperty('--fs',fs+'px');

/* ---------- 分頁(各頁在後面段落註冊 R.xxx) ---------- */
const R={};
let curPg='home';
function go(pg){
  curPg=pg;
  document.querySelectorAll('.pg').forEach(e=>e.classList.add('hidden'));
  $('pg-'+pg).classList.remove('hidden');
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.pg===pg));
  if(R[pg])R[pg]();
  window.scrollTo(0,0);}
function refresh(){if(R[curPg])R[curPg]();updateNext();}

/* ---------- 記錄頁:時間選擇 ---------- */
let whenOff=0,whenTs=null;
function setWhen(m){
  if(m===-1){
    openDlg(`<h2>幾點發生的?</h2><p class="hint">選今天的時間;選到未來會自動當成「現在」。</p>
      <input type="time" id="tmIn" value="${hm(Date.now())}">
      <button class="btn green" onclick="applyTime()">好</button>
      <button class="btn gray" onclick="closeDlg()">取消</button>`);return;}
  whenOff=m;whenTs=null;renderHome();}
function applyTime(){
  const v=$('tmIn').value;if(!v){closeDlg();return;}
  const [h,m]=v.split(':').map(Number),d=new Date();d.setHours(h,m,0,0);
  whenTs=Math.min(d.getTime(),Date.now());whenOff=-1;closeDlg();renderHome();}
function curTs(){return whenOff===-1&&whenTs?whenTs:Date.now()-whenOff*60000;}
function resetWhen(){whenOff=0;whenTs=null;}
function chipsHtml(){
  const o=[[0,'現在'],[30,'30分鐘前'],[60,'1小時前'],[120,'2小時前']];
  return '<div class="chips">'+o.map(([m,t])=>`<button class="chip ${whenOff===m?'on':''}" onclick="setWhen(${m})">${t}</button>`).join('')+
    `<button class="chip ${whenOff===-1?'on':''}" onclick="setWhen(-1)">${whenOff===-1&&whenTs?hm(whenTs):'選時間'}</button></div>`;}

function logMed(){
  const ts=curTs(),near=nearMeds(ts);
  const it=addLog('med','MED',near);resetWhen();refresh();
  snackUndo('已記錄:吃藥('+hm(ts)+')',it.id);}
function logState(c){
  const s=stOf(c),ts=curTs();
  const it=addLog('state',c,'',ts);resetWhen();refresh();
  snackUndo('已記錄:'+s.t+'('+hm(ts)+')',it.id);
  if(c==='FALL')setTimeout(()=>{closeSnack();go('sos');},900);}
function closeSnack(){$('snack').style.display='none';}
function nearMeds(ts){   // 找出這個時間點前後 90 分鐘內排定的藥名
  const d=new Date(ts),base=new Date(ts);base.setHours(0,0,0,0);const out=[];
  DB.meds.forEach(m=>(m.times||[]).forEach(t=>{const [h,mi]=t.split(':').map(Number);
    if(Math.abs(base.getTime()+(h*60+mi)*6e4-ts)<=90*6e4&&!out.includes(m.name))out.push(m.name);}));
  return out.join('、');}

function updateNext(){

  const times=[...new Set(DB.meds.flatMap(m=>m.times||[]))].sort();
  if(!times.length){el.textContent='💊 還沒設定用藥時間,請到「用藥飲食」新增。';return;}
  const now=Date.now(),b=new Date();b.setHours(0,0,0,0);
  const taken=DB.logs.filter(l=>l.k==='med').map(l=>l.ts),slots=[];
  [0,1].forEach(d=>times.forEach(t=>{const [h,m]=t.split(':').map(Number);slots.push(b.getTime()+d*864e5+(h*60+m)*6e4);}));
  const nx=slots.find(s=>s>=now-15*6e4&&!taken.some(x=>Math.abs(x-s)<=90*6e4));
  if(!nx){el.textContent='💊 今天的藥都記錄完了。';return;}
  const mn=Math.round((nx-now)/6e4);
  el.textContent=mn>=0?`💊 下一次吃藥:${hm(nx)}(還有 ${Math.floor(mn/60)?Math.floor(mn/60)+' 小時 ':''}${mn%60} 分鐘)`

function slotList(){   // 今日排定時間:[{t:'08:00', ts, names:[…]}]

  return Object.keys(map).sort().map(t=>{const [h,mi]=t.split(':').map(Number);
    return{t,ts:b.getTime()+(h*60+mi)*6e4,names:map[t]};});}
function slotTaken(ts){return DB.logs.some(l=>l.k==='med'&&Math.abs(l.ts-ts)<=90*6e4);}
function takeSlot(t){
  const s=slotList().find(x=>x.t===t);if(!s)return;
  const it=addLog('med','MED',s.names.join('、'));
  refresh();snackUndo('已記錄:吃藥('+hm(it.ts)+')',it.id);}

/* ---------- ① 快速點擊 ---------- */
const tp={on:false,fin:false,n:0,t0:0,ts:[],iv:null};
function tapInit(){
  Object.assign(tp,{on:false,fin:false,n:0,ts:[]});clearInterval(tp.iv);
  gameShell('👆 快速點擊',`<p class="hint">按下橘色大按鈕後開始算 10 秒。</p>
    <div class="big" id="tapInfo">0 次</div>
    <button id="tapBtn" onpointerdown="tapHit()">開始!點這裡</button>
    <div id="tapRes"></div>
    <button class="btn green" onclick="tapInit()">🔄 重玩</button>`);
}
function tapHit(){
  const now=Date.now();
  if(tp.fin)return;
  if(!tp.on){
    tp.on=true;tp.t0=now;tp.n=1;tp.ts=[now];
    $('tapBtn').textContent='點!點!點!';
    tp.iv=setInterval(()=>{
      const left=Math.max(0,10-(Date.now()-tp.t0)/1000);
      $('tapInfo').textContent='剩 '+Math.ceil(left)+' 秒|'+tp.n+' 次';
      if(left<=0)tapEnd();},100);
    return;}
  if(now-tp.t0>10000)return;
  tp.n++;tp.ts.push(now);
}
function tapEnd(){
  clearInterval(tp.iv);tp.on=false;tp.fin=true;
  const ts=tp.ts.filter(t=>t-tp.t0<=10000),n=ts.length;
  const a=ts.filter(t=>t-tp.t0<5000).length,b=n-a;
  $('tapInfo').textContent='共 '+n+' 次';
  $('tapBtn').textContent='已結束';
  $('tapRes').innerHTML=`<div class="result">10 秒共 <b>${n}</b> 次<br>前 5 秒 ${a} 次、後 5 秒 ${b} 次<br>${b<a*0.7?'後半段明顯變慢,可以留意是否容易越做越慢。':'前後速度差不多。'}</div>`;
  gameDone('快速點擊',n,n+' 次('+window._hand+',前'+a+'/後'+b+')');
}

/* ---------- ② 反應速度 ---------- */
const rc={state:'idle',timer:null,t0:0,res:[],n:0};
function reactInit(){
  clearTimeout(rc.timer);Object.assign(rc,{state:'idle',res:[],n:0});
  gameShell('⚡ 反應速度',`<p class="hint">方塊變綠色的瞬間,馬上點它。共 5 次。</p>
    <div id="reactBox" onpointerdown="reactClick()">點這裡開始</div>
    <div id="reactRes"></div>`);
}
function reactWait(){
  const b=$('reactBox');rc.state='wait';b.style.background='#c0392b';
  b.textContent='等它變綠…('+(rc.n+1)+'/5)';
  rc.timer=setTimeout(()=>{rc.state='go';rc.t0=performance.now();b.style.background='#27ae60';b.textContent='現在!';},1500+Math.random()*2500);
}
function reactClick(){
  const b=$('reactBox');
  if(rc.state==='idle'){reactWait();return;}
  if(rc.state==='done'){reactInit();return;}
  if(rc.state==='wait'){clearTimeout(rc.timer);b.textContent='太早了!再點一下重來';rc.state='early';return;}
  if(rc.state==='early'){reactWait();return;}
  if(rc.state==='go'){
    const ms=Math.round(performance.now()-rc.t0);rc.res.push(ms);rc.n++;
    if(rc.n>=5){
      rc.state='done';const avg=Math.round(rc.res.reduce((x,y)=>x+y)/5);
      b.style.background='#1b6ca8';b.textContent='完成!平均 '+avg+' 毫秒(再點一下重玩)';
      $('reactRes').innerHTML=`<div class="result">5 次:${rc.res.join('、')} 毫秒<br>平均 <b>${avg}</b> 毫秒</div>`;
      gameDone('反應速度',avg,'平均 '+avg+' 毫秒('+window._hand+')');
    }else{$('reactRes').innerHTML=`<div class="result">第 ${rc.n} 次:${ms} 毫秒</div>`;reactWait();}
  }
}

/* ---------- ⑤ 描繪螺旋 ---------- */
let sp={pts:[],drawing:false,t0:0,guide:[],last:null};
function spiralInit(){
  gameShell('🌀 描繪螺旋',`<p class="hint">用手指從中心沿灰線往外描,畫完按「完成」。</p>
    <canvas id="cv" class="cv" width="420" height="420"></canvas>
    <button class="btn green" onclick="spiralDone()">✔ 完成</button>
    <button class="btn gray" onclick="spiralInit()">🔄 重畫</button>
    <div id="spiralRes"></div>`);
  const c=$('cv'),x=c.getContext('2d');
  sp={pts:[],drawing:false,t0:0,guide:[],last:null};
  const cx=210,cy=210,turns=3,maxR=185;
  x.strokeStyle='#bbb';x.lineWidth=5;x.beginPath();
  for(let i=0;i<=360;i++){
    const th=i/360*turns*2*Math.PI,r=maxR*i/360,px=cx+r*Math.cos(th),py=cy+r*Math.sin(th);
    sp.guide.push([px,py]);i?x.lineTo(px,py):x.moveTo(px,py);}
  x.stroke();
  c.onpointerdown=e=>{e.preventDefault();c.setPointerCapture(e.pointerId);sp.drawing=true;
    if(!sp.pts.length)sp.t0=performance.now();sp.last=null;spPt(e);};
  c.onpointermove=e=>{if(sp.drawing){e.preventDefault();spPt(e);}};
  c.onpointerup=c.onpointercancel=()=>{sp.drawing=false;};
}
function spPt(e){
  const c=$('cv'),r=c.getBoundingClientRect(),k=c.width/r.width;
  const p=[(e.clientX-r.left)*k,(e.clientY-r.top)*k],x=c.getContext('2d');
  x.strokeStyle='#c0392b';x.lineWidth=5;x.lineCap='round';x.beginPath();
  if(sp.last){x.moveTo(sp.last[0],sp.last[1]);x.lineTo(p[0],p[1]);}else x.moveTo(p[0],p[1]);
  x.stroke();sp.last=p;sp.pts.push(p);
}
function spiralDone(){
  if(sp.pts.length<30){toast('請先畫一些再按完成');return;}
  let sum=0;
  sp.pts.forEach(p=>{let m=1e9;sp.guide.forEach(g=>{const d=Math.hypot(p[0]-g[0],p[1]-g[1]);if(d<m)m=d;});sum+=m;});
  const dev=Math.round(sum/sp.pts.length*10)/10;
  const sec=Math.round((performance.now()-sp.t0)/100)/10;
  $('spiralRes').innerHTML=`<div class="result">平均偏離螺旋線 <b>${dev}</b> 像素(越小越貼近);花了 ${sec} 秒</div>`;
  gameDone('螺旋',dev,'偏離 '+dev+' 像素,'+sec+' 秒('+window._hand+')');
}

/* =====================================================
   第 5 段:分析、曲線、回診報告
   ===================================================== */
let anaDays=7,anaTab='insight',anaGame='快速點擊',charts=[];
const GOOD_UP={'快速點擊':true,'反應速度':false,'點圓點':false,'數字順序':false,'螺旋':false};
const median=a=>{if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2;};
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const r1=n=>Math.round(n*10)/10;
function rangeLogs(days){const st=Date.now()-days*864e5;return DB.logs.filter(l=>l.ts>=st);}

/* ---------- 分析核心:回傳 {sec:[{h,tone,lines[]}]} 的資料 ---------- */
function analyze(days){
  const L=rangeLogs(days),now=Date.now(),out={};
  const st=L.filter(l=>l.k==='state'),meds=L.filter(l=>l.k==='med');
  out.n={all:L.length,state:st.length,med:meds.length};
  out.cnt={};STATES.forEach(s=>out.cnt[s.c]=st.filter(l=>l.c===s.c).length);

  /* 記錄天數 */
  const dset=new Set(L.filter(l=>l.k!=='card').map(l=>ymd(l.ts)));
  out.recDays=dset.size;

  /* OFF 與吃藥的關係 */
  const allMeds=DB.logs.filter(l=>l.k==='med');
  const gaps=[];
  st.filter(l=>l.c==='OFF').forEach(o=>{
    const prev=allMeds.filter(m=>m.ts<=o.ts&&o.ts-m.ts<=8*36e5).pop();
    if(prev)gaps.push(Math.round((o.ts-prev.ts)/6e4));});
  out.offGap=gaps.length?{n:gaps.length,med:Math.round(median(gaps))}:null;

  /* OFF 時段 */
  const blocks=[['清晨(5–11 點)',5,11],['中午(11–14 點)',11,14],['下午(14–18 點)',14,18],['晚上(18–23 點)',18,23]];
  const bc=blocks.map(b=>({t:b[0],n:0}));let night=0;
  st.filter(l=>l.c==='OFF').forEach(o=>{const h=new Date(o.ts).getHours();
    const i=blocks.findIndex(b=>h>=b[1]&&h<b[2]);if(i>=0)bc[i].n++;else night++;});
  bc.push({t:'深夜(23–5 點)',n:night});
  const top=bc.slice().sort((a,b)=>b.n-a.n)[0];
  out.offBlock=out.cnt.OFF>=3&&top.n/out.cnt.OFF>=.5?top:null;

  /* 漏記吃藥(只算有紀錄的日子,且已過 90 分鐘的時段) */
  let due=0,got=0;
  const allDays=[...dset];
  allDays.forEach(d=>{
    const [y,m,dd]=d.split('-').map(Number);const base=new Date(y,m-1,dd).getTime();
    const times=[...new Set(DB.meds.flatMap(x=>x.times||[]))];
    times.forEach(t=>{const [h,mi]=t.split(':').map(Number),ts=base+(h*60+mi)*6e4;
      if(ts>now-90*6e4)return;due++;
      if(allMeds.some(x=>Math.abs(x.ts-ts)<=90*6e4))got++;});});
  out.dose=due?{due,got,pct:Math.round(got/due*100)}:null;

  /* 問卷卡 */
  const cards=L.filter(l=>l.k==='card');out.cards={days:cards.length,flag:{}};
  QS.forEach(q=>{out.cards.flag[q.k]=cards.filter(c=>c.v&&c.v[q.k]===2).length;});

  /* 遊戲趨勢 */
  out.games={};
  Object.keys(GOOD_UP).forEach(g=>{
    const a=L.filter(l=>l.k==='game'&&l.c===g&&typeof l.num==='number').map(l=>l.num);
    if(a.length<4){out.games[g]={n:a.length};return;}
    const h=a.length>>1,f=avg(a.slice(0,h)),s=avg(a.slice(a.length-h));
    const ch=f?Math.round((s-f)/f*100):0;
    out.games[g]={n:a.length,first:r1(f),last:r1(s),ch,better:GOOD_UP[g]?ch>=10:ch<=-10,worse:GOOD_UP[g]?ch<=-10:ch>=10};});
  return out;
}

/* 把分析結果轉成白話段落:[{h,tone,lines}] */
function insights(days){
  const a=analyze(days),S=[];
  if(a.n.all<5)S.push({h:'📌 紀錄還不多',tone:'warn',lines:['這段時間只有 '+a.n.all+' 筆紀錄,分析參考價值有限。','想到就記,記越多越看得出規律。']});
  else S.push({h:'📌 記錄概況',tone:'',lines:['近 '+days+' 天有 '+a.recDays+' 天有記錄;吃藥 '+a.n.med+' 次、身體狀態 '+a.n.state+' 次。']});

  if(a.n.state){
    const c=a.cnt;
    S.push({h:'🧍 身體狀態',tone:c.OFF>=days?'warn':'',
      lines:['很順 '+c.ON+' 次、亂動 '+c.DYS+' 次、僵硬(OFF) '+c.OFF+' 次、凍步 '+c.FREEZE+' 次、跌倒 '+c.FALL+' 次。']
        .concat(c.ON+c.DYS+c.OFF+c.FREEZE>0?['「很順」佔 '+Math.round(c.ON/Math.max(1,c.ON+c.DYS+c.OFF+c.FREEZE)*100)+'%(只計你有記下的時刻,不等於一天中的實際比例)。']:[])});
    if(c.FALL>0)S.push({h:'⚠️ 跌倒',tone:'bad',lines:['這段期間記錄了 '+c.FALL+' 次跌倒。','建議回診時告訴醫師,並請家人一起檢視家中環境(地板、燈光、浴室防滑)。']});
  }
  if(a.offGap)S.push({h:'⏱️ 僵硬(OFF)與吃藥的關係',tone:'',
    lines:['有 '+a.offGap.n+' 次 OFF 能對應到前一次吃藥,多出現在吃藥後約 '+a.offGap.med+' 分鐘。','這可能是藥效的時間規律,請把這個數字帶給醫師參考,不要自己調藥。']});
  if(a.offBlock)S.push({h:'🕐 OFF 常出現的時段',tone:'',lines:['OFF 有一半以上集中在「'+a.offBlock.t+'」('+a.offBlock.n+' 次)。']});
  if(a.dose){
    S.push({h:'💊 吃藥記錄',tone:a.dose.pct<70?'warn':'good',
      lines:['在有記錄的日子裡,排定的 '+a.dose.due+' 次吃藥,有 '+a.dose.got+' 次留下紀錄('+a.dose.pct+'%)。',
        a.dose.pct<70?'沒記到不一定是沒吃,可能只是忘了按。想起來補記一下就好。':'記得很好,請繼續保持。']});
  }else if(!DB.meds.length)S.push({h:'💊 還沒設定藥物',tone:'warn',lines:['到「用藥飲食」新增藥物和時間,才能分析漏記與倒數。']});

  const cd=a.cards;
  if(cd.days){
    const fl=[];
    QS.forEach(q=>{if(cd.flag[q.k]>0)fl.push(q.t.replace('?','').replace('？','')+' → 有 '+cd.flag[q.k]+' 天選了最不舒服的選項');});
    if(fl.length)S.push({h:'📝 問卷卡提醒',tone:cd.flag.swallow>0?'bad':'warn',
      lines:fl.concat(cd.flag.swallow>0?['吃東西常嗆到是需要儘早跟醫師說的狀況。']:[])});
    else S.push({h:'📝 問卷卡',tone:'good',lines:['填了 '+cd.days+' 天,沒有選到最不舒服的選項。']});}

  const gl=[];
  Object.keys(a.games).forEach(g=>{const x=a.games[g];if(!x.n)return;
    if(x.n<4)gl.push(g+':只玩了 '+x.n+' 次,還看不出趨勢。');
    else gl.push(g+':前半 '+x.first+' → 後半 '+x.last+(x.better?'(進步 ✅)':x.worse?'(退步,留意是否與藥效或疲勞有關)':'(差不多)'));});
  if(gl.length)S.push({h:'🖐️ 小遊戲趨勢',tone:'',lines:gl.concat(['小遊戲成績受睏、累、藥效時間影響很大,只適合同一條件下比較。'])});
  return S;
}

function insightHtml(days){
  return insights(days).map(s=>`<div class="insight ${s.tone}"><b>${s.h}</b><br>${s.lines.map(esc).join('<br>')}</div>`).join('');
}

/* ---------- 切換 ---------- */
function setAnaDays(d){anaDays=d;renderAna();}
function setAnaTab(t){anaTab=t;renderAna();}
function renderAna(){
  charts.forEach(c=>{try{c.destroy();}catch(e){}});charts=[];
  const seg=(items,cur,fn)=>`<div class="seg">${items.map(([v,t])=>`<button class="${cur===v?'on':''}" onclick="${fn}('${v}')">${t}</button>`).join('')}</div>`;
  const dayBtn=`<div class="seg">${[7,30,90].map(d=>`<button class="${anaDays===d?'on':''}" onclick="setAnaDays(${d})">近 ${d} 天</button>`).join('')}</div>`;
  let body='';
  if(anaTab==='insight')body=`<div class="card"><h2>🔎 即時分析</h2>${insightHtml(anaDays)}
    <div class="insight warn">以上只是整理你記錄到的內容,<b>不是診斷</b>。有疑問請帶著這些數字問醫師。</div></div>`;
  else if(anaTab==='chart')body=chartHtml();
  else body=reportCard();
  $('pg-ana').innerHTML=`<div class="card">${seg([['insight','🔎 分析'],['chart','📈 曲線'],['report','📄 回診報告']],anaTab,'setAnaTab')}${dayBtn}</div>`+body;
  if(anaTab==='chart')drawCharts();
}
R.ana=renderAna;
function setAnaGame(g){anaGame=g;renderAna();}

/* ---------- 曲線圖 ---------- */
function chartHtml(){
  if(typeof Chart==='undefined')return '<div class="card warn">圖表需要網路才能顯示。連上網路後重新整理即可。文字分析與回診報告不受影響。</div>';
  const gOpt=Object.keys(GOOD_UP).map(g=>`<option ${g===anaGame?'selected':''}>${g}</option>`).join('');
  return `<div class="card"><h2>📈 狀態時間線</h2>
    <p class="hint">每個點是你記錄的一次狀態。最上方的 ▲ 是吃藥。</p>
    <div class="chartBox"><canvas id="chState"></canvas></div></div>
  <div class="card"><h2>📊 每天各狀態次數</h2><div class="chartBox"><canvas id="chDay"></canvas></div></div>
  <div class="card"><h2>🖐️ 小遊戲成績</h2>
    <select onchange="setAnaGame(this.value)">${gOpt}</select>
    <p class="hint">${GOOD_UP[anaGame]?'數字越大越好':'數字越小越好'}</p>
    <div class="chartBox"><canvas id="chGame"></canvas></div></div>`;
}
function drawCharts(){
  if(typeof Chart==='undefined')return;
  const now=Date.now(),start=now-anaDays*864e5,L=rangeLogs(anaDays);
  const col={ON:'#1b7a3e',DYS:'#b36b00',FREEZE:'#6a2c91',OFF:'#b71c1c',FALL:'#000'};
  const yMap={ON:3,DYS:2,FREEZE:1,OFF:0,FALL:-1};
  const sts=L.filter(l=>l.k==='state'),meds=L.filter(l=>l.k==='med');
  const fmt=v=>{const d=new Date(v);return anaDays<=7?(d.getMonth()+1)+'/'+d.getDate()+' '+pad(d.getHours())+'時':(d.getMonth()+1)+'/'+d.getDate();};
  const lineSts=sts.filter(l=>l.c!=='FALL');
  const c1=new Chart($('chState'),{type:'scatter',data:{datasets:[
    {label:'狀態',data:lineSts.map(l=>({x:l.ts,y:yMap[l.c]})),showLine:true,stepped:true,borderColor:'#9aa7b5',borderWidth:2,
      pointRadius:7,pointBackgroundColor:lineSts.map(l=>col[l.c])},
    {label:'跌倒',data:sts.filter(l=>l.c==='FALL').map(l=>({x:l.ts,y:-1})),pointStyle:'crossRot',pointRadius:10,borderColor:'#000',borderWidth:3},
    {label:'吃藥',data:meds.map(l=>({x:l.ts,y:4})),pointStyle:'triangle',pointRadius:9,backgroundColor:'#0b5394'}]},
   options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmt(c.parsed.x)+' '+hm(c.parsed.x)}}},
    scales:{x:{type:'linear',min:start,max:now,ticks:{maxTicksLimit:6,callback:fmt}},
      y:{min:-1.5,max:4.5,ticks:{stepSize:1,callback:v=>({4:'吃藥',3:'很順',2:'亂動',1:'凍步',0:'僵硬',[-1]:'跌倒'})[v]||''}}}}});
  charts.push(c1);

  const days=[];for(let i=anaDays-1;i>=0;i--)days.push(ymd(now-i*864e5));
  const ds=['ON','DYS','FREEZE','OFF','FALL'].map(c=>({label:stOf(c).t,backgroundColor:col[c],
    data:days.map(d=>sts.filter(l=>l.c===c&&ymd(l.ts)===d).length)}));
  charts.push(new Chart($('chDay'),{type:'bar',data:{labels:days.map(d=>d.slice(5)),datasets:ds},
    options:{maintainAspectRatio:false,scales:{x:{stacked:true,ticks:{maxTicksLimit:8}},y:{stacked:true,beginAtZero:true,ticks:{precision:0}}},
      plugins:{legend:{display:true,labels:{boxWidth:12,font:{size:11}}}}}}));

  const g=L.filter(l=>l.k==='game'&&l.c===anaGame&&typeof l.num==='number');
  charts.push(new Chart($('chGame'),{type:'line',data:{labels:g.map(l=>dayLabel(l.ts)+' '+hm(l.ts)),
    datasets:[{label:anaGame,data:g.map(l=>l.num),borderColor:'#0b5394',backgroundColor:'#0b5394',tension:.2,pointRadius:6}]},
    options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{maxTicksLimit:5}}}}}));
}

/* ---------- 回診報告 ---------- */
function buildReport(days){
  const p=DB.profile,a=analyze(days),end=Date.now(),sec=[];
  sec.push({h:'基本資料',lines:['姓名:'+(p.name||'(未填)'),'病名:'+p.dx,'主治醫師:'+(p.doctor||'(未填)')+(p.hospital?'('+p.hospital+')':''),
    '藥物過敏:'+(p.allergy||'未填寫'),'其他病史:'+(p.other||'未填寫'),
    '統計期間:'+ymd(end-days*864e5)+' 至 '+ymd(end)+'(近 '+days+' 天,有記錄 '+a.recDays+' 天)']});
  sec.push({h:'目前用藥',lines:DB.meds.length?DB.meds.map(m=>m.name+(m.dose?' '+m.dose:'')+':'+(m.times||[]).join('、')+(m.rule?'('+m.rule+')':'')):['(未填)']});
  const c=a.cnt;
  sec.push({h:'身體狀態次數(依病友自行記錄)',lines:['很順 '+c.ON+'、不自主亂動 '+c.DYS+'、僵硬/OFF '+c.OFF+'、凍步 '+c.FREEZE+'、跌倒 '+c.FALL]});
  const mid=[];
  if(a.offGap)mid.push('OFF 多出現在吃藥後約 '+a.offGap.med+' 分鐘(共 '+a.offGap.n+' 筆可對應)。');
  if(a.offBlock)mid.push('OFF 集中在:'+a.offBlock.t+'('+a.offBlock.n+' 次)。');
  if(a.dose)mid.push('吃藥記錄完整度:'+a.dose.got+'/'+a.dose.due+'('+a.dose.pct+'%,未記錄不等於未吃)。');
  if(c.FALL)mid.push('期間跌倒 '+c.FALL+' 次。');
  if(!mid.length)mid.push('資料不足,沒有明顯規律可整理。');
  sec.push({h:'觀察重點',lines:mid});
  const cd=[];
  QS.forEach(q=>{if(a.cards.flag[q.k]>0)cd.push(q.t.replace(/[?？]/g,'')+':'+a.cards.flag[q.k]+' 天選最不舒服的選項');});
  sec.push({h:'每日問卷卡(共填 '+a.cards.days+' 天)',lines:cd.length?cd:['沒有選到最不舒服的選項,或未填寫。']});
  const gl=[];Object.keys(a.games).forEach(g=>{const x=a.games[g];if(x.n>=4)gl.push(g+':前半 '+x.first+' → 後半 '+x.last+'('+x.n+' 次)');else if(x.n)gl.push(g+':'+x.n+' 次');});
  sec.push({h:'自我評量小遊戲(非診斷)',lines:gl.length?gl:['(無)']});
  sec.push({h:'想問醫師的問題',lines:DB.questions.length?DB.questions.map((q,i)=>(i+1)+'. '+q):['(未填)']});
  return sec;
}
function reportText(days){
  return '帕金森回診摘要\n'+buildReport(days).map(s=>'\n【'+s.h+'】\n'+s.lines.join('\n')).join('\n')+'\n\n※本摘要由病友自行記錄整理,非診斷,請以醫師判斷為準。';
}
function reportHtml(days){
  return buildReport(days).map(s=>`<h3 style="margin:12px 0 4px;border-bottom:2px solid #0b5394">${esc(s.h)}</h3>${s.lines.map(l=>`<div>${esc(l)}</div>`).join('')}`).join('');
}
function reportCard(){
  return `<div class="card"><h2>📄 回診摘要(近 ${anaDays} 天)</h2>
    <div style="font-size:.9rem">${reportHtml(anaDays)}</div>
    <p class="hint">本摘要由病友自行記錄整理,非診斷。</p></div>
  <div class="card"><h2>❓ 想問醫師的問題</h2>
    ${DB.questions.map((q,i)=>`<div class="li"><span>${i+1}. ${esc(q)}</span><button class="x" aria-label="刪除" onclick="delQ(${i})">🗑️</button></div>`).join('')||'<p class="hint">想到什麼先記下來,看診時就不會忘。</p>'}
    <input type="text" id="qIn" placeholder="例如:藥效退得很快怎麼辦?" style="margin-top:8px">
    <button class="btn" onclick="addQ()">＋ 加入問題</button></div>
  <div class="card">
    <button class="btn purple" onclick="printReport()">🖨️ 列印 / 存成 PDF</button>
    <button class="btn green" onclick="copyReport()">📋 複製文字(貼到 LINE 給家人)</button>
    <button class="btn line" onclick="exportCSV()">⬇ 匯出全部紀錄(CSV)</button>
  </div>`;
}
function addQ(){const v=$('qIn').value.trim();if(!v){toast('請先輸入問題');return;}
  DB.questions.push(v.slice(0,100));save();renderAna();}
function delQ(i){DB.questions.splice(i,1);save();renderAna();}
function printReport(){
  $('printArea').innerHTML=`<div style="padding:12px;font-family:'Noto Sans TC',sans-serif"><h1 style="font-size:20pt">帕金森回診摘要</h1>${reportHtml(anaDays)}
    <p style="font-size:10pt;color:#555;margin-top:14px">本摘要由病友自行記錄整理,非診斷,請以醫師判斷為準。</p></div>`;
  document.body.classList.add('printing');
  const off=()=>document.body.classList.remove('printing');
  window.addEventListener('afterprint',off,{once:true});
  setTimeout(()=>{window.print();setTimeout(off,1500);},100);
}
function copyReport(){
  const t=reportText(anaDays);
  if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('已複製'),()=>prompt('請手動複製:',t));
  else prompt('請手動複製:',t);
}
function exportCSV(){
  if(!DB.logs.length){toast('沒有紀錄');return;}
  const q=s=>'"'+String(s==null?'':typeof s==='object'?JSON.stringify(s):s).replace(/"/g,'""')+'"';
  const name={med:'吃藥',state:'身體狀態',game:'小遊戲',card:'問卷卡'};
  const csv='\ufeff時間,類別,項目,內容,數值\n'+DB.logs.map(l=>
    [q(new Date(l.ts).toLocaleString('zh-TW',{hour12:false})),q(name[l.k]||l.k),q(l.k==='state'?stOf(l.c).t:l.c),q(l.v),q(l.num)].join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='帕金森紀錄_'+ymd(Date.now())+'.csv';document.body.appendChild(a);a.click();a.remove();
}

/* =====================================================
   第 6 段:啟動與收尾
   ===================================================== */

/* ---------- 切換分頁時停止遊戲,並讓復健頁回到選單 ---------- */
const _goOrig=go;
go=function(pg){
  if(pg!=='games'||curPg!=='games'){stopGames();gameCur=null;}
  _goOrig(pg);
};

/* ---------- 備份與還原 ---------- */
function backupCard(){
  return `<div class="card">
    <h2>💾 備份與還原</h2>
    <p class="hint">資料只存在這台裝置。換手機、清除瀏覽器資料前,請先備份。備份檔含個人資料,請妥善保管。</p>
    <button class="btn green" onclick="backupData()">⬇ 備份全部資料</button>
    <button class="btn line" onclick="$('restoreFile').click()">⬆ 從備份檔還原</button>
    <input type="file" id="restoreFile" accept=".json,application/json" class="hidden" onchange="restoreData(this)">
    <button class="btn red" onclick="askWipe()">🗑️ 清除這台裝置上的全部資料</button>
  </div>`;
}
const _reportCardOrig=reportCard;
reportCard=function(){return _reportCardOrig()+backupCard();};

function backupData(){
  const blob=new Blob([JSON.stringify({app:'pd2',ver:1,saved:Date.now(),data:DB})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='帕金森日誌備份_'+ymd(Date.now())+'.json';
  document.body.appendChild(a);a.click();a.remove();
  toast('已下載備份檔');
}
function restoreData(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    let o;
    try{o=JSON.parse(rd.result);}catch(e){msgBox('無法還原','這不是正確的備份檔。');inp.value='';return;}
    const d=o&&o.app==='pd2'?o.data:null;
    if(!d||!Array.isArray(d.logs)){msgBox('無法還原','這不是正確的備份檔。');inp.value='';return;}
    const n=d.logs.filter(l=>l&&typeof l.ts==='number'&&typeof l.k==='string').length;
    confirmBox('備份檔內有 '+n+' 筆紀錄。還原會「取代」這台裝置目前的全部資料,確定嗎?',()=>{
      const clean=Object.assign(blank(),d);
      clean.logs=d.logs.filter(l=>l&&typeof l.ts==='number'&&typeof l.k==='string'&&typeof l.c==='string');
      clean.profile=Object.assign(blank().profile,d.profile||{});
      clean.meds=Array.isArray(d.meds)?d.meds:[];
      clean.questions=Array.isArray(d.questions)?d.questions:[];
      clean.contacts=Array.isArray(d.contacts)&&d.contacts.length>=2?d.contacts.slice(0,2):blank().contacts;
      clean.meals=Object.assign(blank().meals,d.meals||{});
      DB=clean;save();refresh();toast('已還原');
    },'取代並還原');
    inp.value='';
  };
  rd.readAsText(f);
}
function askWipe(){
  confirmBox('這會刪除這台裝置上所有紀錄、藥物與個人資料,而且無法復原。建議先備份。真的要清除嗎?',()=>{
    localStorage.removeItem(KEY);load();refresh();go('home');toast('已清除');
  },'清除全部');
}

/* ---------- 啟動 ---------- */
window.addEventListener('load',function(){
  load();
  go('home');
  updateNext();
  setInterval(()=>{updateNext();if(curPg==='plan')renderPlan();},60000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  if(!DB.logs.length&&!DB.meds.length)
    setTimeout(()=>msgBox('歡迎使用','想到再記就好,有記總比沒記好。<br><br>1. 先到「💊 用藥飲食」新增您的藥。<br>2. 到「🚨 救援」填緊急聯絡人。<br>3. 平常在「📝 記錄」按按鈕就好。<br><br>資料只存在這台裝置,記得定期備份。'),500);
});
