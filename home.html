<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>台灣帕金森病友權益促進會｜官方網站暨會員財務志工服務系統</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    /* ===== 1. 全域變數與青春活力感配色無障礙基礎 ===== */
    :root{
      /* 青春活力色彩系統：活力青綠、朝氣薄荷、暖陽金、熱情珊瑚紅、優雅紫羅蘭 */
      --main:#0d9488; --main-l:#ccfbf1; --main-d:#0f766e;
      --dark:#0f172a; --dark-l:#1e293b;
      --accent:#f59e0b; --accent-l:#fef3c7; --accent-d:#d97706;
      --bg:#f8fafc; --line:#e2e8f0; --line-dark:#cbd5e1;
      --ok:#10b981; --ok-l:#d1fae5;
      --bad:#ef4444; --danger:#dc2626; --danger-l:#fee2e2;
      --warn:#d97706; --warn-l:#fef3c7;
      --info:#2563eb; --info-l:#dbeafe;
      --primary:#0d9488; --primary-d:#0f766e; --primary-l:#ccfbf1;
      --coral:#f43f5e; --coral-l:#ffe4e6;
      --orange:#ea580c; --orange-l:#ffedd5;
      --purple:#7c3aed; --purple-d:#6d28d9; --purple-l:#ede9fe;
      --card:#ffffff; --ink:#0f172a; --muted:#64748b;
      --radius:16px; --radius-sm:10px; --shadow:0 4px 20px -2px rgba(15,23,42,.08),0 2px 6px -1px rgba(15,23,42,.04);
      --tap:52px; --dock:116px;

      /* 後台四大分區獨立色彩標記 */
      --z-web:#0d9488; --z-web-bg:#f0fdfa; --z-web-border:#99f6e4;
      --z-event:#ea580c; --z-event-bg:#fff7ed; --z-event-border:#fed7aa;
      --z-fin:#d97706; --z-fin-bg:#fefce8; --z-fin-border:#fde68a;
      --z-vol:#7c3aed; --z-vol-bg:#faf5ff; --z-vol-border:#ddd6fe;
    }
    *{box-sizing:border-box}
    html{font-size:20px;scroll-padding-top:90px;-webkit-text-size-adjust:100%}
    body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.75;padding-bottom:env(safe-area-inset-bottom)}
    a{color:var(--main);text-decoration:none}
    a:hover{color:var(--main-d)}
    img{max-width:100%}
    button,input,select,textarea{font:inherit}
    button,a,input,select,textarea,summary{touch-action:manipulation}
    button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
    button{cursor:pointer}
    button:disabled,.btn:disabled,.btn[aria-busy="true"]{opacity:.55;cursor:not-allowed}
    [hidden]{display:none!important}
    .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
    h1,h2,h3,h4{line-height:1.35;color:var(--dark)}
    h1{font-size:1.55rem;margin:6px 0 16px;font-weight:900}
    h2{font-size:1.38rem;margin:6px 0 14px;font-weight:900}
    h3{font-size:1.16rem;margin:18px 0 10px;font-weight:800}
    p{margin:0 0 .8rem}
    .muted{color:var(--muted);font-size:.88rem}
    .small{font-size:.88rem}
    .bold{font-weight:900}
    .center{text-align:center}
    .right{text-align:right}
    .pre{white-space:pre-wrap;overflow-wrap:anywhere}

    /* ===== 2. 卡片、格線與排版元件 ===== */
    .card{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;min-width:0;overflow-wrap:anywhere;box-shadow:var(--shadow)}
    .card.feat{border:3px solid var(--accent);background:linear-gradient(180deg,#ffffff 0%,#fffdfa 100%)}
    .card.pad-0{padding:0;overflow:hidden}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:16px;margin-bottom:16px}
    .cards .card{height:100%;margin:0;display:flex;flex-direction:column}
    .cards .card .card-grow{flex:1}
    .grid{display:grid;gap:12px}
    .grid.c2{grid-template-columns:repeat(2,1fr)}
    .grid.c3{grid-template-columns:repeat(3,1fr)}
    @media(max-width:620px){.grid.c2,.grid.c3{grid-template-columns:1fr}}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .row-between{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
    .spacer{flex:1}
    .cover{display:block;width:100%;height:190px;object-fit:cover;border-radius:12px;margin-bottom:12px;background:#e2e8f0}
    .detail-cover{width:100%;max-height:440px;object-fit:contain;border-radius:12px;margin-bottom:12px}
    .link{display:block;text-decoration:none;color:inherit;min-width:0}
    .link:hover .card{border-color:var(--main)}

    /* ===== 3. 按鈕與互動控制項 ===== */
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);padding:8px 20px;border:2px solid transparent;border-radius:12px;background:var(--main);color:#fff;font-weight:800;text-decoration:none;margin:4px 4px 4px 0;transition:all .15s}
    .btn:hover{background:var(--main-d);transform:translateY(-1px)}
    .btn.acc{background:var(--accent);color:#151515}
    .btn.sec{background:var(--main);color:#fff}
    .btn.gh,.btn-outline{background:#fff;border:2px solid var(--main);color:var(--main)}
    .btn.gh:hover,.btn-outline:hover{background:var(--main-l)}
    .btn.ok{background:var(--ok);color:#fff}
    .btn.bad,.btn-danger{background:var(--danger);color:#fff}
    .btn.bad:hover,.btn-danger:hover{background:#b91c1c}
    .btn.red{background:var(--coral);color:#fff}
    .btn-purple{background:var(--purple);color:#fff}
    .btn-purple:hover{background:var(--purple-d)}
    .btn-gray{background:#e2e8f0;color:var(--ink)}
    .btn-gray:hover{background:#cbd5e1}
    .btn-line{background:#06c755;color:#fff}
    .btn-line:hover{background:#05a647}
    .btn.sm,.btn-sm{min-height:42px;padding:4px 14px;font-size:.88rem;border-radius:10px}
    .btn-block{display:flex;width:100%;margin:6px 0}
    .big-btn{min-height:64px;font-size:1.15rem;width:100%;margin:6px 0}
    .cms-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}

    /* ===== 4. 表單與多媒體上傳器 ===== */
    label{display:block;font-weight:700;margin-top:12px}
    label.chk{font-weight:400;display:flex;gap:8px;align-items:flex-start;margin-top:12px;cursor:pointer;font-size:.92rem}
    label.chk input{margin-top:3px;flex:none}
    input,select,textarea,.input,select.input,textarea.input{width:100%;min-height:var(--tap);padding:10px 14px;border:2px solid #94a3b8;border-radius:12px;background:#fff;color:var(--ink);font-size:max(16px,1rem);margin-top:4px}
    input:focus,select:focus,textarea:focus{border-color:var(--main);box-shadow:0 0 0 3px rgba(13,148,136,.18)}
    textarea,textarea.input{min-height:110px;resize:vertical}
    input[type=checkbox]{width:24px;min-height:24px;margin:0 8px 0 0;vertical-align:middle;accent-color:var(--main)}
    .field{margin-bottom:14px}
    .field label{margin-top:0;margin-bottom:6px;font-weight:900}
    .field .req{color:var(--danger)}
    .field .hint{font-size:.86rem;color:var(--muted);margin-top:4px}
    .input[aria-invalid="true"]{border-color:var(--danger);background:#fff7f7}
    .field-error{color:var(--danger);font-weight:700;font-size:.9rem;margin-top:4px}
    .check{display:flex;gap:12px;align-items:flex-start;padding:12px;border:2px solid var(--line);border-radius:12px;cursor:pointer;font-weight:500}
    .check input{width:26px;height:26px;margin-top:2px;flex:none}
    .two{display:grid;grid-template-columns:1fr;gap:0 16px}
    .split{display:grid;grid-template-columns:1fr;gap:20px;align-items:start}
    .form{max-width:740px}

    /* 萬用多媒體附件上傳與展示樣式 */
    .media-box{border:2px dashed #94a3b8;border-radius:14px;padding:14px;background:#f8fafc;margin:14px 0}
    .media-box h4{margin:0 0 8px;color:var(--dark);font-size:1rem}
    .photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:10px;margin-top:10px}
    .photo-item{position:relative;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
    .photo-item img{width:100%;height:120px;object-fit:cover;display:block;cursor:pointer}
    .photo-item .rm{position:absolute;top:4px;right:4px;background:rgba(220,38,38,.9);color:#fff;border:0;border-radius:999px;width:30px;height:30px;font-weight:900;font-size:.85rem;line-height:1}
    .att-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
    .att-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;flex-wrap:wrap}
    .gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin:12px 0}
    .gallery-img{width:100%;height:160px;object-fit:cover;border-radius:10px;border:2px solid var(--line);cursor:pointer;transition:transform .15s}
    .gallery-img:hover{transform:scale(1.02);border-color:var(--main)}

    /* ===== 5. 標籤、狀態徽章與提示框 ===== */
    .tag,.badge{display:inline-block;background:#f1f5f9;color:var(--dark);padding:2px 10px;border-radius:999px;font-size:.82rem;font-weight:800;border:1px solid transparent}
    .tag.g,.b-ok{background:var(--ok-l);color:#065f46;border-color:#a7f3d0}
    .tag.r,.b-bad{background:var(--danger-l);color:#991b1b;border-color:#fecaca}
    .tag.y,.b-warn{background:var(--warn-l);color:#92400e;border-color:#fde68a}
    .b-info{background:var(--info-l);color:#1e40af;border-color:#bfdbfe}
    .b-gray{background:#e2e8f0;color:#334155;border-color:#cbd5e1}
    .badge.dot::before{content:"● ";font-size:.7em}

    .notice,.alert{padding:14px 18px;border-radius:14px;border:2px solid;margin-bottom:14px;font-weight:600}
    .notice,.alert.warn{background:var(--warn-l);border-color:#f59e0b;color:#92400e}
    .warn,.alert.err{background:var(--danger-l);border-color:#f87171;color:#991b1b;padding:14px 18px;border-radius:14px;margin:12px 0}
    .alert.ok{background:var(--ok-l);border-color:#34d399;color:#065f46}
    .alert.info{background:var(--info-l);border-color:#60a5fa;color:#1e40af}

    /* ===== 6. 分類膠囊、分頁鈕與統計卡 ===== */
    .chips,.seg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
    .chips a,.seg button{border:2px solid var(--line);border-radius:999px;padding:6px 18px;min-height:44px;text-decoration:none;background:#fff;color:var(--dark);font-weight:700;display:inline-flex;align-items:center}
    .chips a.on,.seg button[aria-pressed="true"]{background:var(--main);color:#fff;border-color:var(--main)}
    .hero{background:linear-gradient(135deg,#0d9488 0%,#0f172a 100%);color:#fff;padding:26px 18px;border-radius:20px;text-align:center;margin-bottom:20px;position:relative;box-shadow:var(--shadow)}
    .hero h1{color:#fff;font-size:1.55rem;margin:0}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:12px;margin-bottom:18px}
    .stat{background:#fff;border:2px solid var(--line);padding:16px 12px;border-radius:14px;font-size:.88rem;box-shadow:var(--shadow)}
    .stats .stat{text-align:center}
    .stat b{display:block;font-size:1.65rem;color:var(--main)}
    .stat .k{font-size:.88rem;color:var(--muted);font-weight:700}
    .stat .v{font-size:1.5rem;font-weight:900;color:var(--dark);font-variant-numeric:tabular-nums}
    .item{border:2px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;background:#fff;box-shadow:var(--shadow)}
    .item .title{font-weight:900;font-size:1.05rem}

    /* ===== 7. 頂部導覽列、頁尾與底部快捷列 ===== */
    .hd{display:flex;gap:10px;align-items:center;max-width:1180px;margin:auto;padding:12px 16px;flex-wrap:wrap}
    #pub header{background:var(--dark);color:#fff;position:sticky;top:0;z-index:40;box-shadow:var(--shadow)}
    .logo{color:#fff;text-decoration:none;font-weight:900;flex:1;line-height:1.35;min-width:160px;font-size:1.15rem}
    .tools{display:flex;gap:6px;flex-wrap:wrap}
    .tools button{min-width:44px;min-height:44px;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:rgba(255,255,255,.1);color:#fff;font-weight:800;padding:0 12px}
    .tools button.edit-on{background:var(--accent);color:#151515;border-color:#fff}
    #meBtn{max-width:11em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #nav{display:none;gap:6px;flex-wrap:wrap;width:100%;padding-top:4px}
    #nav a{color:#fff;text-decoration:none;font-weight:800;padding:6px 14px;border-radius:10px;font-size:.94rem}
    #nav a:hover{background:rgba(255,255,255,.15)}
    #nav a.on{background:var(--accent);color:#151515}
    #drawer{padding:8px 14px;background:#fff;border-bottom:2px solid var(--line);max-height:78vh;overflow:auto}
    #drawer a{display:block;padding:12px 8px;border-bottom:1px solid var(--line);text-decoration:none;font-weight:800;color:var(--dark)}
    #view{max-width:1120px;min-height:65vh;margin:auto;padding:22px 16px 30px;outline:none}
    #foot{background:var(--dark);color:#e2e8f0;text-align:center;padding:26px 16px calc(var(--dock) + 26px);font-size:.88rem}
    #foot p{margin:.4em 0}
    #foot a{color:var(--main-l)}
    #foot .muted{color:#94a3b8}
    #dock{position:fixed;left:0;right:0;bottom:0;z-index:30}
    #tabbar{background:#fff;border-top:2px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 12px rgba(15,23,42,.06)}
    #tabbar a{flex:1;text-align:center;text-decoration:none;padding:6px 2px;font-size:.78rem;line-height:1.3;font-weight:800;min-height:52px;color:var(--dark)}
    #tabbar a span{display:block;font-size:1.25rem}
    #tabbar a.on{background:var(--main-l);color:var(--main-d)}

    /* ===== 8. 專區頂部切換列（子導覽）===== */
    .mem-subnav{background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px 12px;margin-bottom:18px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;box-shadow:var(--shadow)}
    .mem-subnav a{text-decoration:none;padding:8px 16px;border-radius:10px;font-weight:800;color:var(--dark);border:2px solid transparent;display:inline-flex;align-items:center;gap:6px;min-height:42px;font-size:.94rem}
    .mem-subnav a:hover{background:var(--main-l);color:var(--main-d)}
    .mem-subnav a.on{background:var(--main);color:#fff}

    /* ===== 9. 管理後台版面與色彩分區 ===== */
    #adm{display:flex;min-height:100vh;align-items:flex-start}
    #aside{width:260px;flex:none;background:var(--dark);color:#fff;padding:16px 12px;min-height:100vh;position:sticky;top:0;max-height:100vh;overflow-y:auto}
    #aside h1{color:#fff;font-size:1.1rem;margin:4px 8px 12px}
    #aside .grp{font-size:.78rem;font-weight:900;color:#94a3b8;margin:16px 8px 4px;letter-spacing:.05em}
    #aside a,#aside .nav-btn{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;color:#fff;background:transparent;border:0;text-decoration:none;padding:9px 12px;border-radius:10px;font-weight:700;font-size:.9rem;text-align:left;cursor:pointer;min-height:44px}
    #aside a:hover,#aside .nav-btn:hover{background:rgba(255,255,255,.1)}
    #aside a.on,#aside .nav-btn[aria-current="page"]{background:var(--main);color:#fff}
    #aapp{flex:1;min-width:0;padding:24px 20px;max-width:1120px;margin:0 auto;width:100%}
    .side-close{display:none}
    .menu-fab{display:none}
    .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
    .bar input,.bar select{width:auto;flex:1;min-width:160px;margin:0}
    .bar .btn{margin:0}
    .acards{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}
    .gate{text-align:center;padding:50px 14px}

    /* ===== 9-2. 後台四大分區切換列與色彩系統 ===== */
    .adm-zone-bar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px;margin-bottom:20px;box-shadow:var(--shadow)}
    @media(max-width:960px){.adm-zone-bar{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:520px){.adm-zone-bar{grid-template-columns:1fr}}
    .adm-zone-btn{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:#f8fafc;color:var(--ink);text-align:left;cursor:pointer;transition:all .15s;text-decoration:none}
    .adm-zone-btn:hover{background:#fff;transform:translateY(-2px);box-shadow:var(--shadow)}
    .adm-zone-btn .z-top{display:flex;align-items:center;gap:8px;font-weight:900;font-size:1.02rem;width:100%}
    .adm-zone-btn .z-num{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:999px;color:#fff;font-size:.85rem;font-weight:900;flex-shrink:0}
    .adm-zone-btn .z-desc{font-size:.8rem;color:var(--muted);line-height:1.4}
    
    /* 四大分區個別色彩 */
    .adm-zone-btn[data-adm-zone="web"] .z-num{background:var(--z-web)}
    .adm-zone-btn[data-adm-zone="event"] .z-num{background:var(--z-event)}
    .adm-zone-btn[data-adm-zone="finance"] .z-num{background:var(--z-fin)}
    .adm-zone-btn[data-adm-zone="volunteer"] .z-num{background:var(--z-vol)}
    
    .adm-zone-btn[data-adm-zone="web"].on{background:var(--z-web-bg);border-color:var(--z-web);border-width:3px}
    .adm-zone-btn[data-adm-zone="event"].on{background:var(--z-event-bg);border-color:var(--z-event);border-width:3px}
    .adm-zone-btn[data-adm-zone="finance"].on{background:var(--z-fin-bg);border-color:var(--z-fin);border-width:3px}
    .adm-zone-btn[data-adm-zone="volunteer"].on{background:var(--z-vol-bg);border-color:var(--z-vol);border-width:3px}
    .adm-zone-btn.locked{opacity:.48;cursor:not-allowed}

    .side-zone-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;padding:6px 6px 12px;border-bottom:1px solid rgba(255,255,255,.15);margin-bottom:8px}
    .side-zone-btn{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:10px;border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#e2e8f0;font-size:.82rem;font-weight:800;cursor:pointer;text-align:left}
    .side-zone-btn:hover{background:rgba(255,255,255,.15);color:#fff}
    .side-zone-btn.on{background:var(--accent);color:#111827;border-color:var(--accent)}
    .side-zone-btn.locked{opacity:.45;cursor:not-allowed}

    /* 引導式精靈 Wizard Alert */
    .admin-guide-card{border-radius:16px;padding:14px 18px;margin-bottom:16px;font-size:.94rem;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
    .guide-web{background:var(--z-web-bg);border:2px solid var(--z-web-border);color:#0f766e}
    .guide-event{background:var(--z-event-bg);border:2px solid var(--z-event-border);color:#c2410c}
    .guide-finance{background:var(--z-fin-bg);border:2px solid var(--z-fin-border);color:#b45309}
    .guide-volunteer{background:var(--z-vol-bg);border:2px solid var(--z-vol-border);color:#6d28d9}

    /* ===== 9-3. 活動問卷調查設計與前台渲染樣式 ===== */
    .survey-box{background:#fff7ed;border:2px dashed #fb923c;border-radius:14px;padding:16px;margin:16px 0}
    .survey-box h4{color:#c2410c;margin:0 0 8px;font-weight:900}
    .survey-designer-item{background:#fff;border:1.5px solid #fed7aa;border-radius:12px;padding:12px;margin-bottom:10px}
    .survey-q-item{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
    .survey-q-title{font-weight:800;margin-bottom:8px;color:var(--dark);display:flex;align-items:center;gap:6px}
    .survey-q-title .q-num{background:#ea580c;color:#fff;border-radius:999px;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:.78rem}
    .survey-opts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:6px}
    .survey-opt-lbl{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:#f8fafc;cursor:pointer}
    .survey-opt-lbl input{width:20px;height:20px;margin:0}

    /* ===== 10. 表格 ===== */
    .tw,.table-wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
    table,table.tbl{border-collapse:collapse;width:100%;font-size:.9rem}
    th,td,.tbl th,.tbl td{padding:10px 12px;text-align:left;border-bottom:1px solid #e2e8f0;vertical-align:top}
    th,.tbl th{background:#f1f5f9;white-space:nowrap;font-weight:800;color:var(--dark)}
    .tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
    .tbl tfoot td{font-weight:900;background:#f8fafc}
    table.plain{font-size:1rem}
    table.plain th{white-space:normal;width:28%}
    td.act{min-width:180px}
    .clip{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    @media(max-width:620px){
      .tbl.stack thead{display:none}
      .tbl.stack tr{display:block;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:6px;background:#fff}
      .tbl.stack td{display:flex;justify-content:space-between;gap:12px;border:0;padding:6px 8px}
      .tbl.stack td::before{content:attr(data-label);font-weight:900;color:var(--muted);flex:none}
    }

    /* ===== 11. Modal、Toast、Loading 與登入區 ===== */
    .overlay{position:fixed;inset:0;background:rgba(15,23,42,.65);z-index:500;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:20px 12px}
    .modal{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:740px;margin:auto 0;max-height:92vh;overflow:auto;box-shadow:0 20px 40px rgba(0,0,0,.2)}
    .modal.wide{max-width:880px}
    .modal h3{margin:0 0 12px}
    .modal-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;border-bottom:1px solid var(--line);padding-bottom:10px}
    .modal-head h2{flex:1;margin:0}
    .modal-close{min-width:44px;min-height:44px;border:0;border-radius:12px;background:#f1f5f9;font-size:1.25rem;font-weight:900}
    .modal-foot,.modal-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:20px;padding-top:12px;border-top:1px solid var(--line)}
    .up-preview{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
    .up-preview img{height:70px;max-width:160px;object-fit:contain}
    #qrDialog .modal{text-align:center;max-width:360px}
    #qc{display:inline-block;padding:16px;background:#fff;margin:12px 0;max-width:100%}
    #qc img,#qc canvas{max-width:100%}

    #toast{position:fixed;bottom:calc(var(--dock) + 12px);left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 22px;border-radius:14px;z-index:900;width:max-content;max-width:92vw;font-size:.94rem;overflow-wrap:anywhere}
    #toastBox{position:fixed;left:12px;right:12px;bottom:calc(var(--dock) + 14px);z-index:910;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
    .toast{pointer-events:auto;max-width:520px;width:100%;padding:14px 18px;border-radius:14px;color:#fff;font-weight:700;box-shadow:var(--shadow);background:#0f172a}
    .toast.ok{background:#065f46}
    .toast.err{background:#991b1b}
    .toast.info{background:#1e3a8a}

    .spinner{width:32px;height:32px;border:4px solid #cbd5e1;border-top-color:var(--main);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading{padding:40px 0;text-align:center;color:var(--muted)}
    .empty{padding:36px 12px;text-align:center;color:var(--muted)}
    .empty .ic{font-size:2.4rem;display:block;margin-bottom:6px}
    #busy{position:fixed;inset:0;z-index:950;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center}

    .login-wrap{max-width:500px;margin:0 auto;padding:8px 0 24px}
    .login-hero{text-align:center;padding:14px 8px 10px}
    .login-hero .logo-circle{width:72px;height:72px;border-radius:50%;background:var(--main);color:#fff;display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 10px}
    .divider{display:flex;align-items:center;gap:10px;color:var(--muted);margin:16px 0;font-weight:700}
    .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

    /* ===== 12. 公告、收據、報表與簽到頁 ===== */
    .ann-pin{border-left:6px solid #f59e0b}
    .ann-content{white-space:pre-wrap;word-break:break-word}
    .report-head{text-align:center;margin-bottom:12px}
    .report-head h2{margin-bottom:2px}
    .report-note{font-size:.85rem;color:var(--muted);border-top:1px dashed var(--line);margin-top:12px;padding-top:8px}
    .receipt-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
    .receipt-actions .btn{flex:1;min-width:150px}
    .receipt-print-fallback{font-size:.9rem;min-height:46px;background:transparent;color:var(--muted);border:2px dashed var(--line)}
    .receipt-print-fallback:hover{background:#f1f5f9}
    .receipt-note{margin-top:14px;padding:10px 14px;border:1px dashed #64748b;background:#fafafa;font-size:.95rem;line-height:1.75}
    .receipt-sheet{position:relative}

    #ck header{background:var(--dark);color:#fff;padding:14px;display:flex;justify-content:space-between;gap:14px}
    #ck header a{color:#fff}
    #ck main{max-width:580px;margin:auto;padding:18px 14px}
    #ck .wide{display:flex;width:100%;min-height:56px}
    .prog{display:flex;justify-content:space-around;text-align:center}
    .prog b{display:block;font-size:2rem;color:var(--main)}
    #ckResult{padding:20px;text-align:center;border-radius:14px;color:#fff}
    #ckResult.ok{background:var(--ok)}
    #ckResult.dup{background:#9a650a}
    #ckResult.err{background:var(--bad)}
    #ckResult strong{display:block;font-size:1.7rem}
    #ckHistory div{border-bottom:1px solid var(--line);padding:8px 4px}
    .skip{position:absolute;top:-80px;left:10px;background:#000;color:#fff;padding:10px 16px;border-radius:8px;z-index:999}
    .skip:focus{top:10px}
    details.card summary{font-weight:800;cursor:pointer;min-height:44px;display:flex;align-items:center}
    .big{font-size:1.5rem;letter-spacing:.06em;font-weight:800;overflow-wrap:anywhere}
    .love{font-size:2.4rem;font-weight:800;letter-spacing:.3em;color:#b3122d}
    .lovecard{background:linear-gradient(135deg,#d81e3f,#a8480f);color:#fff;border-radius:16px;padding:16px;max-width:380px;text-align:center;margin:10px 0}
    .lovecard .in{background:#fff;color:#222;border-radius:10px;padding:8px;margin:8px 0}
    .lovecard .love{font-size:1.9rem}
    .pbar{background:var(--line);border-radius:20px;height:16px;overflow:hidden}
    .pbar div{background:var(--accent);height:100%;width:0;transition:width .3s}
    .week h3{margin-top:0}
    .letter p,.letter li{font-size:1.05rem}
    .tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:#fff;border:3px solid var(--main);border-radius:16px;padding:16px 8px;min-height:126px;font-size:1.15rem;font-weight:800;text-decoration:none;text-align:center;color:var(--dark);box-shadow:var(--shadow)}
    .tile span{font-size:2.4rem;line-height:1}
    .tile small{font-size:.8rem;font-weight:400;color:#566975;line-height:1.5}
    .tile:hover{background:var(--main-l);transform:translateY(-2px)}
    .picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px;margin:14px 0}
    .pick{display:flex;align-items:center;gap:14px;text-align:left;background:#fff;border:3px solid var(--main);border-radius:16px;padding:14px 16px;min-height:84px;color:var(--dark);width:100%}
    .pick:hover{background:var(--main-l)}
    .pick .pi{font-size:2.4rem;line-height:1;flex:none}
    .pick b{display:block;font-size:1.2rem}
    .pick small{display:block;font-size:.84rem;font-weight:400;color:#566975;line-height:1.5}
    .pick.on{background:var(--main-l);border-color:var(--accent)}
    .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;list-style:none;padding:0;margin:12px 0}
    .steps li{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center;font-weight:700}
    .steps li b{background:var(--main);color:#fff;border-radius:50%;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center}
    .steps li span{display:block;font-size:2.2rem;margin:4px 0}
    .give{background:linear-gradient(135deg,#fff3f4,#fff);border:4px solid #b3122d;text-align:center}
    .give h2{color:#b3122d;margin-top:0}

    /* ===== 13. 高對比模式 (.hc) ===== */
    body.hc{background:#000;color:#fff}
    body.hc a,body.hc h1,body.hc h2,body.hc h3,body.hc .media-box h4{color:#ffd400}
    body.hc .card,body.hc .item,body.hc .stat,body.hc .modal,body.hc #drawer,body.hc #tabbar,body.hc .tw,body.hc .table-wrap,body.hc .chips a,body.hc .seg button,body.hc .mem-subnav,body.hc .media-box,body.hc .att-row{background:#111;color:#fff;border-color:#ffd400}
    body.hc .chips a.on,body.hc .seg button[aria-pressed="true"],body.hc .mem-subnav a.on{background:#ffd400;color:#000}
    body.hc .mem-subnav a{color:#ffd400}
    body.hc .muted,body.hc .tile small,body.hc .pick small,body.hc .stat .k{color:#ddd}
    body.hc .stat .v{color:#ffd400}
    body.hc .btn,body.hc .btn.sec,body.hc .btn.red,body.hc .btn-purple{background:#ffd400;color:#000}
    body.hc .btn.gh,body.hc .btn-outline,body.hc .btn-gray{background:#000;color:#ffd400;border:2px solid #ffd400}
    body.hc .btn.ok{background:#7CFC9A;color:#000}
    body.hc .btn.bad,body.hc .btn-danger{background:#ff8a80;color:#000}
    body.hc input,body.hc select,body.hc textarea,body.hc .input{background:#000;color:#fff;border-color:#ffd400}
    body.hc .notice,body.hc .warn,body.hc .alert{background:#222;color:#fff;border-color:#ffd400}
    body.hc .tag,body.hc .badge{background:#333;color:#ffd400;border:1px solid #ffd400}
    body.hc .hero{background:#111;border:3px solid #ffd400}
    body.hc #pub header,body.hc #foot,body.hc #ck header{background:#000;border-bottom:3px solid #ffd400}
    body.hc .logo,body.hc #nav a,body.hc #foot a{color:#ffd400}
    body.hc .tools button{background:#222;color:#ffd400;border:1px solid #ffd400}
    body.hc #nav a.on,body.hc #aside a.on,body.hc #aside .nav-btn[aria-current="page"],body.hc #tabbar a.on{background:#333;color:#ffd400}
    body.hc #aside{background:#000;border-right:2px solid #ffd400}
    body.hc th,body.hc .tbl th{background:#222;color:#ffd400}
    body.hc td,body.hc th,body.hc .tbl td,body.hc .tbl th{border-color:#555}
    body.hc .love{color:#ffd400}
    body.hc .lovecard{background:#111;border:2px solid #ffd400}
    body.hc .lovecard .in{background:#000;color:#fff}
    body.hc #giveBar{background:#000;color:#ffd400;border-top:3px solid #ffd400}
    body.hc #giveBar a{background:#ffd400;color:#000}
    body.hc #giveBar a.m{background:#000;color:#ffd400;border-color:#ffd400}
    body.hc .tile,body.hc .steps li,body.hc .pick{background:#111;color:#ffd400;border-color:#ffd400}
    body.hc .give{background:#111;border-color:#ffd400}
    body.hc .give h2{color:#ffd400}

    /* ===== 14. 響應式版面 ===== */
    @media(min-width:900px){
      #nav{display:flex}
      #menuBtn{display:none}
      #drawer{display:none!important}
      #tabbar{display:none}
      #view{padding:26px 20px 28px}
      .two{grid-template-columns:1fr 1fr}
      .split{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
    }
    @media(max-width:899px){
      #pub header{position:static}
      .hd{padding:6px 10px;gap:6px}
      .tools button{min-width:40px;min-height:40px;padding:0 8px}
    }
    @media(max-width:820px){
      #adm{display:block}
      #aside{position:fixed;inset:0;z-index:450;transform:translateX(-100%);transition:transform .2s;overflow:auto;width:86%;max-width:330px;box-shadow:var(--shadow)}
      #aside.open{transform:none}
      .side-close{display:flex;width:100%;justify-content:center;margin-bottom:8px}
      .menu-fab{display:inline-flex;position:fixed;left:12px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:350;min-height:54px;padding:10px 20px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.28);background:var(--dark);color:#fff;border:2px solid #fff;font:inherit;font-weight:900;align-items:center}
      #aapp{padding-bottom:96px}
    }

    /* ===== 15. 認識帕金森指南（.pk 命名空間）===== */
    .pk{--pg:#1b7a43;--po:#c04a00;--ps:#e8f5e9}
    .pk h2{font-size:1.5rem;margin:4px 0 8px}
    .pk h3{color:var(--pg);font-size:1.25rem;margin:4px 0 10px}
    .pk .pk-sub{font-size:.85rem;color:#555;margin:0 0 8px}
    .pk .pk-card{background:#fff;border:2px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px}
    .pk .pk-btn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-height:72px;margin:10px 0;padding:12px 18px;background:var(--ps);border:3px solid var(--pg);border-radius:14px;color:#18232b;font-weight:700}
    .pk .pk-btn:hover{background:var(--pg);color:#fff}
    .pk .pk-btn .ic{font-size:1.7em}
    .pk .pk-btn small{display:block;font-weight:400;font-size:.75em;opacity:.85}
    .pk .pk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}
    .pk .pk-grid .pk-btn{margin:0}
    .pk .pk-search{display:flex;gap:10px;flex-wrap:wrap}
    .pk .pk-search input{flex:1;min-width:200px;min-height:56px;margin:0}
    .pk .pk-search button{min-height:56px;padding:0 24px;background:var(--dark);color:#fff;border:0;border-radius:12px;font-weight:700}
    .pk .pk-result{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 16px;margin:10px 0;color:#18232b}
    .pk .pk-result:hover{border-color:var(--pg);background:var(--ps)}
    .pk .pk-result b{color:var(--pg)}
    .pk mark{background:#ffe082;padding:0 2px}
    .pk .tel{display:flex;gap:12px;align-items:center;padding:12px 16px;border:2px solid var(--line);border-radius:12px;margin:8px 0;background:#fffaf0}
    .pk .tel .n{font-size:1.5em;font-weight:700;color:var(--po);min-width:90px}
    .pk .pk-nav{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}
    .pk .pk-nav button{flex:1;min-width:140px;min-height:60px;border-radius:14px;font-weight:700;border:3px solid var(--pg);background:#fff;color:var(--pg)}
    .pk .pk-nav button.primary{background:var(--pg);color:#fff}
    .pk .pk-nav button:disabled{opacity:.35;cursor:not-allowed}
    .pk .crumb{font-size:.8rem;color:#555;margin-bottom:8px}
    .pk .pk-prog{height:16px;background:#dfe8e3;border-radius:10px;overflow:hidden;margin:8px 0}
    .pk .pk-prog div{height:100%;background:var(--pg);transition:width .3s}
    .pk .pk-steps{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
    .pk .pk-steps button{min-height:48px;padding:0 14px;border:2px solid var(--pg);background:#fff;color:var(--pg);border-radius:10px;font-weight:700;font-size:.8rem}
    .pk .pk-steps button.on{background:var(--pg);color:#fff}
    .pk ul.icons{list-style:none;padding:0;margin:12px 0}
    .pk ul.icons li{display:flex;gap:14px;align-items:flex-start;background:#fafafa;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
    .pk ul.icons .i{font-size:1.5em;line-height:1.4}
    .pk .box{border-radius:14px;padding:14px 18px;margin:18px 0}
    .pk .box .t{font-weight:700;margin-bottom:4px}
    .pk .note{background:var(--ps);border:3px solid var(--pg)}
    .pk .warn{background:#fff3cd;border:3px solid #d99a00;border-radius:14px;margin:18px 0}
    .pk .tip{background:#e3f2fd;border:3px solid #1976d2}
    .pk .quote{background:#fffaf0;border-left:8px solid var(--po);padding:10px 16px;border-radius:0 10px 10px 0}
    .pk table{margin:14px 0;font-size:.95rem}
    .pk th,.pk td{border:2px solid var(--line);padding:10px 12px}
    .pk th{background:#e0ece8}
    .pk .pk-tw{overflow-x:auto}
    .pk .pill{display:inline-block;background:var(--po);color:#fff;border-radius:30px;padding:0 14px;font-weight:700;margin:2px}
    .pk .part{font-weight:700;margin:18px 0 4px;color:var(--dark)}
    body.hc .pk .pk-card,body.hc .pk .pk-result,body.hc .pk ul.icons li,body.hc .pk .tel,body.hc .pk .pk-nav button,body.hc .pk .pk-steps button,body.hc .pk .pk-btn,body.hc .pk .quote{background:#111;color:#fff;border-color:#ffd400}
    body.hc .pk .note,body.hc .pk .warn,body.hc .pk .tip{background:#222;color:#fff;border-color:#ffd400}
    body.hc .pk .pk-steps button.on,body.hc .pk .pk-nav button.primary,body.hc .pk .pk-search button{background:#ffd400;color:#000}
    body.hc .pk h3,body.hc .pk .part,body.hc .pk .tel .n,body.hc .pk .pk-result b{color:#ffd400}
    body.hc .pk th{background:#222;color:#ffd400}
    body.hc .pk .crumb,body.hc .pk .pk-sub{color:#ddd}

    /* ===== 15-2. 首頁置頂消息與支持協會專區 ===== */
    .home-news-top{background:linear-gradient(180deg,#ffffff 0%,#f0fdfa 100%);border:3px solid var(--main);border-radius:20px;padding:20px;margin-bottom:22px;box-shadow:var(--shadow)}
    .support-grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px;margin:16px 0 22px}
    .support-card-item{display:flex;flex-direction:column;justify-content:space-between;background:#fff;border:2px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
    .support-card-item:hover{border-color:var(--main);transform:translateY(-2px)}
    .support-card-item .sc-num{display:inline-block;padding:2px 12px;border-radius:999px;background:var(--main-l);color:var(--main-d);font-weight:900;font-size:.82rem;margin-bottom:8px}
    .perm-zone-grid{display:grid;grid-template-columns:repeat(2,minmax(130px,1fr));gap:8px}
    .perm-zone-lbl{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1.5px solid var(--line);border-radius:10px;background:#f8fafc;font-size:.84rem;font-weight:700;cursor:pointer}
    .perm-zone-lbl input{width:18px;height:18px;margin:0}
    .perm-zone-lbl.on{border-color:var(--main);background:var(--main-l);color:var(--main-d)}
    .perm-zone-lbl.disabled{opacity:.5;cursor:not-allowed}
    .nav-item-wrap{position:relative;display:inline-flex;align-items:center}
    .nav-dd{display:none;position:absolute;top:100%;left:0;min-width:220px;background:#0f172a;border:2px solid var(--accent);border-radius:14px;padding:8px;box-shadow:0 12px 30px rgba(0,0,0,.3);z-index:500;flex-direction:column;gap:4px}
    .nav-item-wrap:hover .nav-dd,.nav-item-wrap:focus-within .nav-dd{display:flex}
    .nav-dd a{display:flex!important;align-items:center;gap:8px;padding:9px 14px!important;border-radius:10px!important;color:#fff!important;font-size:.9rem!important;font-weight:700!important;white-space:nowrap;text-decoration:none}
    .nav-dd a:hover{background:var(--accent)!important;color:#111!important}

    /* ===== 16. 列印樣式 ===== */
    #printArea{display:none}
    @media print{
      @page{size:A4;margin:10mm}
      html{font-size:14px}
      body{background:#fff!important;color:#000!important;padding:0!important}
      #pub header,#dock,#foot,.noprint,.cms-bar,#toast,#toastBox,#busy,#modalRoot,#adminDialog,#qrDialog{display:none!important}
      body.print-doc > *:not(#printArea){display:none!important}
      body.print-doc #printArea{display:block!important}
      .no-print{display:none!important}
      .receipt-sheet{break-inside:avoid;page-break-inside:avoid}
      .report-print table{width:100%;border-collapse:collapse}
      .report-print th,.report-print td{border:1px solid #475569;padding:4px 6px}
      *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    }
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>

/* ---------- 全域狀態 ---------- */

}
function getMyZones() {
  if (Array.isArray(S.adminZones) && S.adminZones.length) return S.adminZones;
  if (ME && Array.isArray(ME.adminZones) && ME.adminZones.length) return ME.adminZones;

}

  return getMyZones().indexOf(z) !== -1;
}
function isSuper() { return S.role === '管理員' || (ME && ME.role === 'admin' && ME.status === '啟用' && (!S.role || S.role === '一般會員')); }

/* =========================================================================
   二、基礎工具函式
   ========================================================================= */
const $  = function (sel, root) { return (root || document).querySelector(sel); };
const $$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };

const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = v => encodeURIComponent(String(v ?? ''));
const fmtD = v => String(v || '').slice(0,10);
const fmtDate = s => s ? String(s).slice(0, 10) : '—';
const num = v => Number(v || 0).toLocaleString('zh-TW');
const yes = v => v === true || ['Y','TRUE','true'].includes(v);
const imageUrl = id => {
  if (!id) return '';
  if (/^(https?:|data:)/i.test(String(id))) return String(id);
  return 'https://drive.google.com/thumbnail?id=' + enc(id) + '&sz=w1000';
};

function fmtMoney(n) {
  const v = Math.round(Number(n) || 0);
  return (v < 0 ? '-' : '') + 'NT$' + String(Math.abs(v)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}
function fmtBytes(bytes) {
  const b = Number(bytes) || 0;
  if (!b) return '';
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
  return (b / 1048576).toFixed(1) + ' MB';
}
function todayTW() {
  const p = new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
  const o = {}; p.forEach(x => o[x.type] = x.value);
  return `${o.year}-${o.month}-${o.day}`;
}
function todayStr() { return todayTW(); }
function thisYear() { return Number(todayStr().slice(0, 4)); }

const org = () => ({
  name:CFG.orgName||ORG.name, reg:CFG.orgReg||ORG.reg, address:CFG.address||ORG.address,
  bankName:CFG.bankName||ORG.bankName, account:CFG.account||ORG.account,
  love:CFG.loveCode||ORG.love, review:CFG.review||ORG.review
});

function validUrl(v) {
  try {
    const raw = String(v || '').trim();
    if (!/^https?:\/\//i.test(raw)) return '';
    const u = new URL(raw);
    return (u.protocol === 'https:' || u.protocol === 'http:') && !u.username && !u.password ? u.href : '';
  } catch { return ''; }
}
const extUrl = () => validUrl(CFG.joinUrl) || EXT_URL;
function externalLink(url,label,cls='btn sec sm') {
  const u = validUrl(url);
  return u ? `<a class="${cls}" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>` : '';
}
function tag(v) {
  const t = Object.prototype.hasOwnProperty.call(STATE,v) ? STATE[v] : ['',String(v || '')];
  return `<span class="tag ${t[0]}">${esc(t[1])}</span>`;
}
function statusBadge(s) { return '<span class="badge dot ' + (STATUS_CLASS[s] || 'b-gray') + '">' + esc(s || '—') + '</span>'; }
function loadingHtml(msg) { return '<div class="loading"><div class="spinner" aria-hidden="true"></div><p>' + esc(msg || '載入中…') + '</p></div>'; }
function emptyHtml(msg, icon) { return '<div class="empty"><span class="ic" aria-hidden="true">' + (icon || '📭') + '</span>' + esc(msg || '目前沒有資料') + '</div>'; }
function alertHtml(msg, type) { return '<div class="alert ' + (type || 'err') + '" role="alert">' + esc(msg) + '</div>'; }

function btn(action,label,cls='btn',data={}) {
  return `<button type="button" class="${cls}" data-action="${action}" ${
    Object.entries(data).map(([k,v]) => `data-${k}="${esc(v)}"`).join(' ')
  }>${esc(label)}</button>`;
}
function options(values,selected) {
  return values.map(v => {
    const [value,label] = Array.isArray(v) ? v : [v,v];
    return `<option value="${esc(value)}"${String(value)===String(selected ?? '')?' selected':''}>${esc(label)}</option>`;
  }).join('');
}
function input(id,label,value='',type='text',extra='') {
  return `<label for="${id}">${esc(label)}</label><input id="${id}" type="${type}" value="${esc(value)}" ${extra}>`;
}
function fieldHtml(o) {
  const id = o.id, req = o.required ? ' <span class="req" aria-hidden="true">*</span><span class="sr-only">（必填）</span>' : '';
  let ctl;
  if (o.type === 'select') {
    ctl = '<select class="input" id="' + id + '"' + (o.required ? ' required' : '') + '>' +
      (o.options || []).map(function (op) {
        const v = typeof op === 'object' ? op.value : op, t = typeof op === 'object' ? op.label : op;
        return '<option value="' + esc(v) + '"' + (String(v) === String(o.value) ? ' selected' : '') + '>' + esc(t) + '</option>';
      }).join('') + '</select>';
  } else if (o.type === 'textarea') {
    ctl = '<textarea class="input" id="' + id + '"' + (o.required ? ' required' : '') + (o.maxlength ? ' maxlength="' + o.maxlength + '"' : '') +
      (o.placeholder ? ' placeholder="' + esc(o.placeholder) + '"' : '') + '>' + esc(o.value || '') + '</textarea>';
  } else {
    ctl = '<input class="input" id="' + id + '" type="' + (o.type || 'text') + '"' + (o.required ? ' required' : '') +
      (o.inputmode ? ' inputmode="' + o.inputmode + '"' : '') + (o.autocomplete ? ' autocomplete="' + o.autocomplete + '"' : '') +
      (o.maxlength ? ' maxlength="' + o.maxlength + '"' : '') + (o.min != null ? ' min="' + o.min + '"' : '') +
      (o.placeholder ? ' placeholder="' + esc(o.placeholder) + '"' : '') + (o.readonly ? ' readonly' : '') +
      (o.accept ? ' accept="' + o.accept + '"' : '') + (o.type === 'file' ? '' : ' value="' + esc(o.value == null ? '' : o.value) + '"') + '>';
  }
  return '<div class="field"><label for="' + id + '">' + esc(o.label) + req + '</label>' + ctl +
    (o.hint ? '<div class="hint" id="' + id + 'H">' + esc(o.hint) + '</div>' : '') + '</div>';
}
function val(id, root) { const el = $('#' + id, root); return el ? el.value.trim() : ''; }
function value(id) {
  const el = document.getElementById(id);
  if (!el) throw new Error('表單已變更，請重新操作');
  return el.value.trim();
}
function checked(id) {
  const el = document.getElementById(id);
  if (!el) throw new Error('表單已變更，請重新操作');
  return el.checked;
}

/* ---------- 提示與忙碌狀態 ---------- */
function toast(message, type) {
  if (type) {
    const box = $('#toastBox'), t = document.createElement('div');
    t.className = 'toast ' + type; t.textContent = String(message || ''); box.appendChild(t);
    setTimeout(function () { t.remove(); }, type === 'err' ? 7000 : 4000);
    return;
  }
  $('#toast').textContent = String(message || '發生錯誤');
  $('#toast').hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('#toast').hidden = true, 5000);
}
let busyCount = 0;
function busy(on) {
  busyCount = Math.max(0, busyCount + (on ? 1 : -1));
  $('#busy').hidden = busyCount === 0;
}
async function safely(fn) {
  try { await fn(); } catch(e) { console.error(e); toast(e.message, 'err'); }
}
async function once(key,element,fn) {
  if (busySet.has(key)) return;
  busySet.add(key);
  if (element) element.disabled = true;
  try { return await fn(); }
  finally {
    busySet.delete(key);
    if (element?.isConnected) element.disabled = false;
  }
}
async function run(btnEl, fn) {
  if (btnEl && btnEl.getAttribute('aria-busy') === 'true') return;
  if (btnEl) { btnEl.setAttribute('aria-busy', 'true'); btnEl.disabled = true; }
  try { return await fn(); }
  catch (e) { if (!(e instanceof ApiError && e.code === 'AUTH')) toast(e.message || '發生錯誤', 'err'); }
  finally { if (btnEl && btnEl.isConnected) { btnEl.removeAttribute('aria-busy'); btnEl.disabled = false; } }
}

/* =========================================================================
   三、統一 API 呼叫
   ========================================================================= */
class ApiError extends Error { constructor(msg, code) { super(msg); this.code = code || ''; } }

async function api(action, dataOrParams, opts) {
  opts = opts || {};
  const isFinAction = String(action).indexOf('.') !== -1;
  if (isFinAction && !opts.silent) busy(true);
  const ctrl = new AbortController();
  const timer = setTimeout(function () { ctrl.abort(); }, opts.timeout || 120000);
  try {
    if (isFinAction) {
      let res, j;
      try {
        res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: action, token: S.token, idToken: idToken, data: dataOrParams || {} }),
          signal: ctrl.signal
        });
        j = await res.json();
      } catch (e) {
        throw new ApiError(e && e.name === 'AbortError' ? '連線逾時，請稍後再試' : '網路連線失敗，請檢查網路後再試');
      }
      if (j && j.code === 'AUTH') {
        if (S.token) forceLogout('登入已逾期，請重新登入');
        throw new ApiError(j.message || '請重新登入', 'AUTH');
      }
      if (!j || !j.success) throw new ApiError((j && j.message) || '操作失敗', j && j.code);
      return j;
    } else {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: action, params: dataOrParams || {}, idToken: idToken, token: S.token }),
        signal: ctrl.signal
      });
      if (!response.ok) throw new Error('後端 HTTP 錯誤：' + response.status);
      let result;
      try { result = JSON.parse(await response.text()); }
      catch { throw new Error('後端未回傳 JSON，請確認 /exec 部署允許所有人存取'); }
      if (!result || typeof result.ok !== 'boolean') throw new Error('後端回應格式不正確');
      if (!result.ok) {
        if (result.code === 'AUTH_INVALID') {
          ME = null; idToken = null; drawNavigation();
          throw new Error('登入已過期，請重新登入');
        }
        throw new Error(result.message || '後端處理失敗');
      }
      return result.data;
    }
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('請求逾時。寫入可能已成功，請先更新紀錄確認，不要立即重複送出');
    throw e;
  } finally {
    clearTimeout(timer);
    if (isFinAction && !opts.silent) busy(false);
  }
}

/* =========================================================================
   四、萬用多媒體附件系統（支援無限張照片、不限格式大小檔案、無限組外部連結）
   ========================================================================= */
function normalizeAttachments(raw) {
  if (!raw) return { photos: [], files: [], links: [] };
  if (typeof raw === 'string') {
    try { raw = JSON.parse(raw); } catch (e) { return { photos: [], files: [], links: [] }; }
  }
  return {
    photos: Array.isArray(raw && raw.photos) ? raw.photos.map(p => ({ ...p })) : [],
    files: Array.isArray(raw && raw.files) ? raw.files.map(f => ({ ...f })) : [],
    links: Array.isArray(raw && raw.links) ? raw.links.map(l => ({ ...l })) : []
  };
}

async function prepareImageForUpload(file) {
  return new Promise(function (resolve) {
    if (!/^image\/(jpeg|png|webp|bmp)$/i.test(file.type)) {
      resolve(file);
      return;
    }
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = function () {
      const max = 1920, k = Math.min(1, max / Math.max(img.width || 1, img.height || 1));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * k));
      c.height = Math.max(1, Math.round(img.height * k));
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function (b) { resolve(b || file); }, 'image/jpeg', 0.86);
    };
    img.onerror = function () { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}

function bindMediaEditor(root, prefix, initialAtt, folderName) {
  const p = prefix || 'md';
  const state = normalizeAttachments(initialAtt);
  let uploadingCount = 0;

  const statusEl = $('#' + p + '_status', root);
  const photosEl = $('#' + p + '_photos', root);
  const filesEl  = $('#' + p + '_files', root);
  const linksEl  = $('#' + p + '_links', root);
  const photoIn  = $('#' + p + '_photoIn', root);
  const fileIn   = $('#' + p + '_fileIn', root);
  const linkTitle = $('#' + p + '_linkTitle', root);
  const linkUrl   = $('#' + p + '_linkUrl', root);
  const linkAdd   = $('#' + p + '_linkAdd', root);

  function render() {
    if (photosEl) {
      photosEl.innerHTML = state.photos.map(function (ph, idx) {
        const src = ph.thumbUrl || imageUrl(ph.id) || ph.url || '';
        return '<div class="photo-item">' +
          '<img src="' + esc(src) + '" alt="' + esc(ph.name || '照片') + '" data-lightbox-src="' + esc(src) + '">' +
          '<button type="button" class="rm" data-rm-photo="' + idx + '" aria-label="移除照片">✕</button>' +
        '</div>';
      }).join('');
    }
    if (filesEl) {
      filesEl.innerHTML = state.files.map(function (fl, idx) {
        return '<div class="att-row">' +
          '<span>📎 <b>' + esc(fl.name || '檔案') + '</b>' + (fl.size ? ' <span class="small muted">(' + esc(fmtBytes(fl.size)) + ')</span>' : '') + '</span>' +
          '<button type="button" class="btn btn-sm btn-danger" data-rm-file="' + idx + '">✕ 移除</button>' +
        '</div>';
      }).join('');
    }
    if (linksEl) {
      linksEl.innerHTML = state.links.map(function (lk, idx) {
        return '<div class="att-row">' +
          '<span>🔗 <b>' + esc(lk.title || lk.url) + '</b> <span class="small muted">' + esc(lk.url) + '</span></span>' +
          '<button type="button" class="btn btn-sm btn-danger" data-rm-link="' + idx + '">✕ 移除</button>' +
        '</div>';
      }).join('');
    }
  }

  async function handleFiles(fileList, asPhoto) {
    const arr = Array.prototype.slice.call(fileList || []);
    if (!arr.length) return;
    uploadingCount += arr.length;
    for (let i = 0; i < arr.length; i++) {
      const f = arr[i];
      if (statusEl) statusEl.textContent = '⏳ 正在上傳 (' + (i + 1) + '/' + arr.length + ')：' + f.name + '…';
      try {
        let blob = f, mime = f.type || (asPhoto ? 'image/jpeg' : 'application/octet-stream'), name = f.name || (asPhoto ? 'photo.jpg' : 'file');
        if (asPhoto || /^image\//i.test(mime)) {
          blob = await prepareImageForUpload(f);
          if (blob !== f) { mime = 'image/jpeg'; name = name.replace(/\.[^.]+$/, '') + '.jpg'; }
        }
        const dataUrl = await readAsDataURL(blob);
        const base64 = String(dataUrl).split(',')[1];
        const res = await api('uploadMediaFile', { folder: folderName || 'attachments', name: name, mime: mime, base64: base64 });
        if (asPhoto || res.isImage) {
          state.photos.push({ id: res.id, name: res.name, url: res.url, thumbUrl: res.thumbUrl || imageUrl(res.id) });
        } else {
          state.files.push({ id: res.id, name: res.name, mime: res.mime, size: res.size || blob.size, url: res.url, downloadUrl: res.downloadUrl });
        }
        render();
      } catch (e) {
        toast('上傳失敗（' + f.name + '）：' + e.message, 'err');
      } finally {
        uploadingCount = Math.max(0, uploadingCount - 1);
      }
    }
    if (statusEl) statusEl.textContent = '✅ 上傳完成！可繼續追加照片或檔案。';
  }

  if (photoIn) photoIn.addEventListener('change', function () { handleFiles(photoIn.files, true); photoIn.value = ''; });
  if (fileIn)  fileIn.addEventListener('change', function () { handleFiles(fileIn.files, false); fileIn.value = ''; });
  if (linkAdd) {
    linkAdd.addEventListener('click', function () {
      let u = (linkUrl && linkUrl.value.trim()) || '';
      const t = (linkTitle && linkTitle.value.trim()) || '';
      if (!u) { toast('請輸入連結網址', 'err'); linkUrl && linkUrl.focus(); return; }
      if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
      if (!validUrl(u)) { toast('網址格式不正確', 'err'); return; }
      state.links.push({ title: t || u, url: u });
      if (linkTitle) linkTitle.value = '';
      if (linkUrl) linkUrl.value = '';
      render();
    });
  }

  const box = $('#' + p + '_box', root);
  if (box) {
    box.addEventListener('click', function (ev) {
      const rp = ev.target.closest('[data-rm-photo]');
      if (rp) { state.photos.splice(Number(rp.getAttribute('data-rm-photo')), 1); render(); return; }
      const rf = ev.target.closest('[data-rm-file]');
      if (rf) { state.files.splice(Number(rf.getAttribute('data-rm-file')), 1); render(); return; }
      const rl = ev.target.closest('[data-rm-link]');
      if (rl) { state.links.splice(Number(rl.getAttribute('data-rm-link')), 1); render(); return; }
    });
  }

  render();
  return {
    getValue: function () {
      if (linkUrl && linkUrl.value.trim()) {
        let u = linkUrl.value.trim();
        if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
        if (validUrl(u)) {
          state.links.push({ title: (linkTitle && linkTitle.value.trim()) || u, url: u });
          linkUrl.value = '';
          if (linkTitle) linkTitle.value = '';
        }
      }
      return state;
    },
    isUploading: function () { return uploadingCount > 0; }
  };
}

/* =========================================================================
   五、Modal 彈窗、電子收據、印鑑繪製與列印
   ========================================================================= */
const modalStack = [];
function openModal(o) {
  const prev = document.activeElement, ov = document.createElement('div');
  const id = 'm' + Date.now() + Math.random().toString(36).slice(2, 5);
  ov.className = 'overlay';
  ov.innerHTML = '<div class="modal' + (o.wide ? ' wide' : '') + '" role="dialog" aria-modal="true" aria-labelledby="' + id + 't">' +
    '<div class="modal-head"><h2 id="' + id + 't">' + esc(o.title || '') + '</h2>' +
    '<button type="button" class="modal-close" aria-label="關閉視窗" data-close>✕</button></div>' +
    '<div class="modal-body">' + (o.body || '') + '</div>' +
    (o.footer ? '<div class="modal-foot">' + o.footer + '</div>' : '') + '</div>';
  $('#modalRoot').appendChild(ov);
  document.body.style.overflow = 'hidden';
  const api_ = {
    el: ov.firstChild, root: ov,
    $: function (s) { return $(s, ov); },
    close: function (result) {
      const i = modalStack.indexOf(api_); if (i === -1) return;
      modalStack.splice(i, 1); ov.remove();
      if (!modalStack.length) document.body.style.overflow = '';
      if (prev && prev.focus && prev.isConnected) try { prev.focus(); } catch (e) {}
      if (o.onClose) o.onClose(result);
    }
  };
  ov.addEventListener('click', function (ev) {
    if (ev.target.closest('[data-close]')) api_.close(false);
    else if (ev.target === ov && !o.static) api_.close(false);
  });
  modalStack.push(api_);
  const first = $('[autofocus],input:not([type=hidden]),select,textarea', ov.firstChild) || $('.modal-close', ov);
  setTimeout(function () { if (first) first.focus(); }, 30);
  return api_;
}

/* 輕量向量與動態紅泥印鑑繪製器（完全免除大體積 Base64） */
function applySealInkTexture_(ctx, w, h, seed) {
  let s = seed || 12345;
  function rand() { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }
  ctx.save();
  ctx.globalCompositeOperation = 'destination-out';
  const dots = Math.round((w * h) / 48);
  for (let i = 0; i < dots; i++) {
    ctx.fillStyle = 'rgba(0,0,0,' + (rand() * 0.25).toFixed(2) + ')';
    ctx.beginPath();
    ctx.arc(rand() * w, rand() * h, rand() * 1.3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function renderWatermarkSealCanvas_() {
  const size = 180, c = document.createElement('canvas');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d'), red = '#c82323';
  ctx.save();
  ctx.strokeStyle = red; ctx.lineWidth = 6;
  ctx.strokeRect(10, 10, size - 20, size - 20);
  ctx.lineWidth = 2; ctx.strokeRect(16, 16, size - 32, size - 32);
  ctx.fillStyle = red; ctx.font = '900 24px "Noto Serif TC","DFKai-SB",serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('台灣帕金森', size/2, size*0.35);
  ctx.fillText('病友權益促進會', size/2, size*0.65);
  applySealInkTexture_(ctx, size, size, 99999);
  ctx.restore();
  return c.toDataURL('image/png');
}

function renderOvalSealCanvas_() {
  const w = 220, h = 164, c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d'), red = '#c41e1e';
  const font = '"Noto Serif TC","DFKai-SB","BiauKai","Kaiti TC",serif';
  ctx.save();
  const cx = w / 2, cy = h / 2, rx = w / 2 - 10, ry = h / 2 - 10;
  ctx.strokeStyle = red; ctx.fillStyle = red; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 6; ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.lineWidth = 1.8; ctx.beginPath(); ctx.ellipse(cx, cy, rx - 6, ry - 6, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.lineWidth = 1.5; ctx.beginPath();
  ctx.moveTo(cx - rx + 22, cy - 18); ctx.lineTo(cx + rx - 22, cy - 18);
  ctx.moveTo(cx - rx + 22, cy + 18); ctx.lineTo(cx + rx - 22, cy + 18);
  ctx.stroke();
  ctx.font = '900 18px ' + font; ctx.fillText('台灣帕金森病友', cx, cy - 35);
  ctx.font = '900 21px ' + font; ctx.fillText('權益促進會', cx, cy);
  ctx.font = '900 16px ' + font; ctx.fillText('收據專用章', cx, cy + 34);
  applySealInkTexture_(ctx, w, h, 88888);
  ctx.restore();
  return c.toDataURL('image/png');
}

function renderStaffSealCanvas_(name) {
  const clean = String(name || '').replace(/\s+/g, '').slice(0, 4);
  if (!clean) return '';
  let chars = Array.from(clean);
  if (chars.length === 2) chars = [chars[0], chars[1], '之', '印'];
  else if (chars.length === 3) {
    const suf = (clean.indexOf('處') !== -1 || clean.indexOf('組') !== -1) ? '章' : '印';
    chars = [chars[0], chars[1], chars[2], suf];
  }
  const size = 140, c = document.createElement('canvas');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d'), red = '#c5221f';
  ctx.save();
  ctx.strokeStyle = red; ctx.lineWidth = 6; ctx.lineJoin = 'round';
  ctx.strokeRect(14, 14, size - 28, size - 28);
  ctx.lineWidth = 1.5; ctx.strokeRect(20, 20, size - 40, size - 40);
  ctx.fillStyle = red; ctx.font = '900 36px "Noto Serif TC","DFKai-SB","BiauKai","Kaiti TC",serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(chars[0] || '', size * 0.65, size * 0.36);
  ctx.fillText(chars[1] || '', size * 0.65, size * 0.66);
  ctx.fillText(chars[2] || '', size * 0.35, size * 0.36);
  ctx.fillText(chars[3] || '', size * 0.35, size * 0.66);
  applySealInkTexture_(ctx, size, size, clean.charCodeAt(0) * 97);
  ctx.restore();
  return c.toDataURL('image/png');
}

function enhanceReceiptSeals_(root) {
  if (!root) return;
  const wmUri = renderWatermarkSealCanvas_();
  const ovalUri = renderOvalSealCanvas_();
  $$('[data-seal-kind]', root).forEach(function (img) {
    const kind = img.getAttribute('data-seal-kind');
    if (kind === 'watermark') img.src = wmUri;
    else if (kind === 'oval') img.src = ovalUri;
    else if (kind === 'staff') {
      const nm = img.getAttribute('data-seal-name');
      if (nm) img.src = renderStaffSealCanvas_(nm);
    }
  });
}

}
function b64ToBlob(b64, mime) {
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime || 'application/octet-stream' });
}
function saveFile(r) {
  const url = URL.createObjectURL(b64ToBlob(r.base64, r.mimeType));
  const inLine = (typeof liff !== 'undefined' && liffReady && liff.isInClient && liff.isInClient());
  if (inLine) {
    window.open(url, '_blank');

    a.href = url; a.download = r.filename || 'download'; document.body.appendChild(a); a.click(); a.remove();
  }
  setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
}

function readAsDataURL(file) {
  return new Promise(function (res, rej) { const r = new FileReader(); r.onload = function () { res(r.result); }; r.onerror = rej; r.readAsDataURL(file); });
}
async function filePayload(inputEl) {
  const f = inputEl && inputEl.files && inputEl.files[0];
  if (!f) return null;
  let blob = f, mime = f.type || 'application/octet-stream', name = f.name || 'file';
  if (mime.indexOf('image/') === 0 && mime !== 'image/heic' && f.size > 1.2 * 1024 * 1024) {
    blob = await prepareImageForUpload(f); mime = blob.type || 'image/jpeg'; name = name.replace(/\.\w+$/, '') + '.jpg';
  }
  const dataUrl = await readAsDataURL(blob);
  return { filename: name, mimeType: mime, base64: String(dataUrl).split(',')[1] };
}
async function viewFile(url) {
  if (!url) { toast('沒有附件', 'info'); return; }
  const r = await api('file.get', { url: url });
  const href = URL.createObjectURL(b64ToBlob(r.base64, r.mimeType));

}

function storeToken(tok, persist) {
  try { (persist ? localStorage : sessionStorage).setItem(TOKEN_KEY, tok); (persist ? sessionStorage : localStorage).removeItem(TOKEN_KEY); } catch (e) {}
}
function loadToken() { try { return localStorage.getItem(TOKEN_KEY) || sessionStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } }
function clearToken() { try { localStorage.removeItem(TOKEN_KEY); sessionStorage.removeItem(TOKEN_KEY); } catch (e) {} }

function setMember(m, webProf) {
  if (m) {
    S.member = m;
    S.role = m.type || (webProf && webProf.financeRole) || '一般會員';
    const zones = (webProf && Array.isArray(webProf.adminZones) && webProf.adminZones.length)
      ? webProf.adminZones
      : (Array.isArray(m.adminZones) ? m.adminZones : []);
    S.adminZones = zones;
    S.lineBound = Boolean(m.lineBound || (webProf && webProf.lineBound) || m.lineId || (webProf && webProf.lineId));
    S.isAdmin = ADMIN_TYPES.indexOf(S.role) !== -1 || zones.length > 0 || Boolean(webProf && webProf.role === 'admin');
    ME = webProf || {
      userId: m.lineId || m.memberId,
      memberId: m.memberId,
      lineId: m.lineId || '',
      lineBound: S.lineBound,
      displayName: m.lineName || m.name,
      name: m.name,
      nickname: m.nickname || '',
      phone: m.phone || m.mobile || '',
      email: m.email || '',
      city: m.city || (ME && ME.city) || '',
      identity: m.identity || (ME && ME.identity) || '',
      expireDate: m.expiryDate || '',
      role: S.isAdmin ? 'admin' : 'member',
      financeRole: S.role,
      adminZones: zones,
      status: m.isActive || S.isAdmin ? '啟用' : '待審'
    };
    if (zones.length && zones.indexOf(S.adminZone) === -1) {
      S.adminZone = zones[0];
    }
  }
}

function onLoginSuccess(res, persist) {
  if (res.token) {
    S.token = res.token;
    storeToken(res.token, persist !== false);
  }
  S.pendingBind = null;
  setMember(res.member, res.webProfile);
  drawNavigation();
  route();
}

function forceLogout(msg) {
  S.token = ''; S.member = null; S.role = ''; S.isAdmin = false; S.lineBound = false; S.adminZones = []; S.pendingBind = null;

}

async function lineLogin() {
  try { sessionStorage.removeItem(NOAUTO_KEY); } catch (e) {}
  if (!liffReady || !window.liff) throw new Error('LINE 登入目前無法使用，請改用下方「姓名與手機號碼」登入');
  if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
  idToken = liff.getIDToken();
  if (!idToken) { liff.logout(); liff.login({ redirectUri: location.href }); return; }
  let res;
  try { res = await api('auth.loginByLine', { idToken: idToken }); }
  catch (e) { if (e.message.indexOf('LINE') !== -1) { try { liff.logout(); } catch (x) {} } throw e; }
  if (res.isFirstLogin) {
    S.pendingBind = { ticket: res.ticket, lineName: res.lineName };
    openLineBindModal(res.ticket, res.lineName);

    onLoginSuccess(res, true);
    toast('已成功登入', 'ok');
  }
}

function parseCustomQuestions(raw) {
  if (!raw) return [];
  if (Array.isArray(raw)) return raw;
  try {
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) {
    return [];
  }
}

function parseAnswers(raw) {
  if (!raw) return {};
  if (typeof raw === 'object') return raw;
  try {
    return JSON.parse(raw) || {};
  } catch (e) {
    return {};
  }
}

/* 1. 活動前台報名表單：動態問卷題目渲染器 */
function renderFrontSurveyHtml(questions) {
  const qs = parseCustomQuestions(questions);

  return '<div class="survey-box">' +
    '<h4>📋 本場活動專屬問卷調查</h4>' +
    '<p class="small muted" style="margin-top:-4px">為利活動籌備、保險、餐飲及無障礙動線安排，請協助填寫以下專屬問題：</p>' +
    qs.map(function (q, idx) {
      const qid = q.id || ('sq_' + idx);
      const reqMark = q.required ? '<span class="req" style="color:var(--danger)">*</span>' : '';
      const opts = Array.isArray(q.options) ? q.options : (q.options ? String(q.options).split(/[,，\n]/).map(s=>s.trim()).filter(Boolean) : []);
      let inputControl = '';

      if (q.type === 'radio') {
        inputControl = '<div class="survey-opts-grid">' +
          opts.map(function (opt, oIdx) {
            return '<label class="survey-opt-lbl">' +

              '<span>' + esc(opt) + '</span>' +
            '</label>';
          }).join('') + '</div>';
      } else if (q.type === 'checkbox') {
        inputControl = '<div class="survey-opts-grid">' +
          opts.map(function (opt) {
            return '<label class="survey-opt-lbl">' +
              '<input type="checkbox" name="surv_' + esc(qid) + '" value="' + esc(opt) + '">' +
              '<span>' + esc(opt) + '</span>' +
            '</label>';
          }).join('') + '</div>';
      } else if (q.type === 'select') {
        inputControl = '<select class="input" name="surv_' + esc(qid) + '"' + (q.required ? ' required' : '') + '>' +
          '<option value="">-- 請選擇 --</option>' +
          opts.map(function (opt) { return '<option value="' + esc(opt) + '">' + esc(opt) + '</option>'; }).join('') +
          '</select>';
      } else {
        inputControl = '<input class="input" type="text" name="surv_' + esc(qid) + '" placeholder="' + esc(q.placeholder || '請輸入您的回答...') + '"' + (q.required ? ' required' : '') + '>';

        '<div class="survey-q-title"><span class="q-num">' + (idx + 1) + '</span> ' + esc(q.title || '問題') + ' ' + reqMark + '</div>' +
        (q.hint ? '<div class="small muted" style="margin-bottom:6px">' + esc(q.hint) + '</div>' : '') +
        inputControl +
      '</div>';
    }).join('') +
  '</div>';

/* 2. 收集前台報名表填寫之問卷答案 */
function collectFrontSurveyAnswers(container) {
  const items = $$('[data-survey-qid]', container);
  if (!items.length) return {};
  const ans = {};
  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    const qid = it.getAttribute('data-survey-qid');
    const type = it.getAttribute('data-survey-type');
    const req = it.getAttribute('data-survey-req') === '1';
    let val = '';

    if (type === 'radio') {
      const checked = $('input[name="surv_' + qid + '"]:checked', it);
      val = checked ? checked.value : '';
    } else if (type === 'checkbox') {
      val = $$('input[name="surv_' + qid + '"]:checked', it).map(c => c.value);
    } else if (type === 'select') {
      const sel = $('select[name="surv_' + qid + '"]', it);
      val = sel ? sel.value : '';
    } else {
      const inp = $('input[name="surv_' + qid + '"]', it);
      val = inp ? inp.value.trim() : '';
    }

    if (req) {
      if (!val || (Array.isArray(val) && !val.length)) {
        const title = $('.survey-q-title', it)?.textContent.trim() || '必填問卷題目';
        throw new Error('請填寫問卷必填項目：「' + title + '」');
      }
    }
    ans[qid] = val;
  }
  return ans;
}

let CURRENT_SURVEY_CONFIG = [];

function surveyBuilderHtml(initialQuestions) {
  CURRENT_SURVEY_CONFIG = parseCustomQuestions(initialQuestions);
  return '<div class="survey-box" id="sb_outerBox">' +
    '<div class="row-between" style="align-items:center;margin-bottom:8px">' +
      '<h4>📋 本活動專屬問卷調查設計（每一場活動皆可量身規劃）</h4>' +
      '<button type="button" class="btn btn-sm acc" id="btnSbAddQ">＋ 新增問卷題目</button>' +
    '</div>' +
    '<div class="small muted" style="margin-bottom:10px">可自由設定單選題、多選題、下拉選單或簡答題（例：用餐葷素、接駁交通、是否需輪椅協助、同行親友關係等）。</div>' +
    '<div id="sb_questionsList"></div>' +
  '</div>';
}

function bindSurveyBuilder(root) {
  const container = $('#sb_questionsList', root);
  const addBtn = $('#btnSbAddQ', root);
  if (!container) return { getQuestions: () => [] };

  function renderList() {
    if (!CURRENT_SURVEY_CONFIG.length) {
      container.innerHTML = '<div class="muted small" style="background:#fff;padding:12px;border-radius:10px;text-align:center">目前尚未設定專屬問卷，本活動將僅收集姓名、電話、同行人數與備註。若需調查餐點、交通或健康需求，請點擊上方「＋ 新增問卷題目」。</div>';
      return;
    }
    container.innerHTML = CURRENT_SURVEY_CONFIG.map(function (q, idx) {
      const isChoice = q.type === 'radio' || q.type === 'checkbox' || q.type === 'select';
      const optStr = Array.isArray(q.options) ? q.options.join(', ') : (q.options || '');
      return '<div class="survey-designer-item" data-sb-idx="' + idx + '">' +
        '<div class="row-between" style="margin-bottom:6px">' +
          '<div style="font-weight:900;color:#ea580c">題目 #' + (idx + 1) + '</div>' +
          '<button type="button" class="btn btn-sm btn-danger" data-sb-del="' + idx + '">🗑️ 移除題目</button>' +
        '</div>' +
        '<div class="grid c2">' +
          '<div><label class="small bold">題目名稱</label><input class="input" type="text" data-sb-field="title" value="' + esc(q.title || '') + '" placeholder="例：活動用餐需求 / 交通抵達方式"></div>' +
          '<div><label class="small bold">題型選擇</label><select class="input" data-sb-field="type">' +
            '<option value="radio"' + (q.type === 'radio' ? ' selected' : '') + '>🔘 單選題 (Radio)</option>' +
            '<option value="checkbox"' + (q.type === 'checkbox' ? ' selected' : '') + '>☑️ 多選題 (Checkbox)</option>' +
            '<option value="select"' + (q.type === 'select' ? ' selected' : '') + '>🔽 下拉選單 (Dropdown)</option>' +
            '<option value="text"' + (q.type === 'text' ? ' selected' : '') + '>✏️ 簡答題 (Text)</option>' +
          '</select></div>' +
        '</div>' +
        (isChoice ? '<div style="margin-top:8px"><label class="small bold">選項清單（以逗號分隔）</label><input class="input" type="text" data-sb-field="options" value="' + esc(optStr) + '" placeholder="例：葷食, 素食, 不用餐"></div>' : '') +
        '<div class="row" style="margin-top:8px">' +
          '<label class="chk" style="margin:0"><input type="checkbox" data-sb-field="required"' + (q.required ? ' checked' : '') + '><span class="bold">設為必填題目</span></label>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  if (addBtn) {
    addBtn.addEventListener('click', function () {
      CURRENT_SURVEY_CONFIG.push({
        id: 'q_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
        title: '',
        type: 'radio',
        options: ['選項一', '選項二'],
        required: true
      });
      renderList();
    });
  }

  container.addEventListener('click', function (e) {
    const delBtn = e.target.closest('[data-sb-del]');
    if (delBtn) {
      const idx = Number(delBtn.getAttribute('data-sb-del'));
      CURRENT_SURVEY_CONFIG.splice(idx, 1);
      renderList();
    }
  });

  container.addEventListener('change', function (e) {
    const item = e.target.closest('[data-sb-idx]');
    if (!item) return;
    const idx = Number(item.getAttribute('data-sb-idx'));
    const field = e.target.getAttribute('data-sb-field');
    if (!CURRENT_SURVEY_CONFIG[idx]) return;

    if (field === 'title') CURRENT_SURVEY_CONFIG[idx].title = e.target.value.trim();
    else if (field === 'type') {
      CURRENT_SURVEY_CONFIG[idx].type = e.target.value;
      renderList();
    } else if (field === 'options') {
      CURRENT_SURVEY_CONFIG[idx].options = e.target.value.split(/[,，\n]/).map(s=>s.trim()).filter(Boolean);
    } else if (field === 'required') {
      CURRENT_SURVEY_CONFIG[idx].required = e.target.checked;
    }
  });

  renderList();
  return {
    getQuestions: function () {
      return CURRENT_SURVEY_CONFIG.filter(q => q.title.trim());
    }
  };
}

    body:
      '<div class="row-between" style="align-items:center;margin-bottom:12px">' +

        '<button type="button" class="btn btn-sm btn-outline" id="btnExportSurveyCsv">📥 匯出完整問卷名冊 CSV</button>' +
      '</div>' +
      '<div id="evStatsContent">' + loadingHtml('正在彙整活動問卷填答統計…') + '</div>',
    footer: '<button type="button" class="btn btn-gray" data-close>關閉</button>'
  });

  try {
    const res = await api('getEventSurveyStats', { eventId });
    const { stats, totalRegistrations, rawRows } = res;
    const content = m.$('#evStatsContent');
    if (!stats || !stats.length) {
      content.innerHTML = '<div class="alert info">此活動目前尚未配置專屬問卷調查題目，或尚無人報名填答。</div>';
      return;
    }

    let html = '<div class="grid c2" style="margin-bottom:14px">' +
      '<div class="stat"><div class="k">有效報名總人次</div><div class="v" style="color:var(--orange)">' + totalRegistrations + ' 人</div></div>' +
      '<div class="stat"><div class="k">問卷調查題目數</div><div class="v">' + stats.length + ' 題</div></div>' +
    '</div>';

    stats.forEach(function (st, idx) {
      const typeLabel = st.type === 'radio' ? '單選' : (st.type === 'checkbox' ? '多選' : (st.type === 'select' ? '下拉' : '簡答'));
      html += '<div class="card" style="margin-bottom:14px">' +
        '<div class="row-between" style="margin-bottom:8px">' +
          '<div class="bold" style="font-size:1.05rem;color:var(--dark)"><span class="badge" style="background:#ea580c;color:#fff">第 ' + (idx + 1) + ' 題</span> ' + esc(st.title) + ' <span class="tag">' + typeLabel + '</span></div>' +
          '<div class="small muted">填答人數：<b>' + st.answeredCount + '</b> 人</div>' +
        '</div>';

      if (st.type === 'radio' || st.type === 'checkbox' || st.type === 'select') {
        const opts = Object.keys(st.optionsCount || {});
        html += '<div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">';
        opts.forEach(function (opt) {
          const cnt = st.optionsCount[opt] || 0;
          const pct = st.answeredCount > 0 ? ((cnt / st.answeredCount) * 100).toFixed(1) : 0;
          html += '<div style="background:#f8fafc;padding:8px 12px;border-radius:10px;border:1px solid var(--line)">' +
            '<div class="row-between" style="margin-bottom:4px">' +
              '<span><b>' + esc(opt) + '</b></span>' +
              '<span class="bold" style="color:#ea580c">' + cnt + ' 票 (' + pct + '%)</span>' +
            '</div>' +
            '<div style="height:10px;background:#e2e8f0;border-radius:999px;overflow:hidden">' +
              '<div style="height:100%;width:' + pct + '%;background:linear-gradient(90deg, #ea580c, #f59e0b);border-radius:999px"></div>' +
            '</div>' +
          '</div>';
        });
        html += '</div>';
      } else {
        html += '<div class="small muted" style="margin-bottom:6px">最新填答摘要（共 ' + (st.textAnswers ? st.textAnswers.length : 0) + ' 則）：</div>' +
          '<div style="max-height:160px;overflow-y:auto;background:#f8fafc;padding:10px;border-radius:10px;border:1px solid var(--line)">' +
            (st.textAnswers && st.textAnswers.length ? st.textAnswers.slice(0, 30).map(t => '<div style="padding:4px 0;border-bottom:1px dashed var(--line);font-size:.9rem">• ' + esc(t) + '</div>').join('') : '<div class="muted small">尚無填答內容</div>') +
          '</div>';
      }

      html += '</div>';
    });

    content.innerHTML = html;

    m.$('#btnExportSurveyCsv').addEventListener('click', function () {
      if (!rawRows || !rawRows.length) { toast('目前無填答資料可匯出', 'info'); return; }
      const headers = ['報名編號','活動編號','報名時間','姓名','電話','同行人數','簽到狀態','問卷回答JSON'];
      const rows = [headers].concat(rawRows.map(function (r) {
        return [r.id, r.eventId, r.createdAt, r.name, r.phone, r.companions || 0, r.checkedAt ? '已出席' : '已報名', typeof r.answers === 'object' ? JSON.stringify(r.answers) : (r.answers || '')];
      }));
      const csv = '﻿' + rows.map(r => r.map(c => '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(',')).join('
');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = '活動問卷填答名冊_' + eventId + '_' + todayTW() + '.csv';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      toast('✅ 已匯出活動問卷報名名冊 CSV', 'ok');
    });
  } catch (err) {
    m.$('#evStatsContent').innerHTML = alertHtml('載入問卷統計失敗：' + err.message);
  }
}

  return `<a class="tile" href="${esc(href)}"${ext?' target="_blank" rel="noopener noreferrer" data-ext':''}><span>${i}</span>${esc(l)}${d?`<small>${esc(d)}</small>`:''}</a>`;
