      $('#exList', el).innerHTML = list.length ? list.map(card).join('') : emptyHtml('沒有符合的支出', '🧾');
    }
    draw();
    $('#exSeg', el).addEventListener('click', function (e) { const b = e.target.closest('[data-f]'); if (b) { flt = b.getAttribute('data-f'); draw(); } });
    if (canApply) $('#exAdd', el).addEventListener('click', openExpenseApply);

    el.addEventListener('click', function (e) {
      const v = e.target.closest('[data-vdoc]'), a = e.target.closest('[data-app]'), r = e.target.closest('[data-rej]'), p = e.target.closest('[data-pay]');
      const find = function (id) { return items.filter(function (x) { return x.id === id; })[0]; };
      if (v) run(v, function () { return showExpenseVoucher(v.getAttribute('data-vdoc')); });
      if (a) run(a, async function () {
        const x = find(a.getAttribute('data-app')); if (!x) return;
        if (!(await confirmDialog('核准 ' + x.payee + ' 的支出 ' + fmtMoney(x.amount) + '？\n' + x.description, { okText: '核准' }))) return;
        await api('expense.approve', { id: x.id }); toast('已核准', 'ok'); reloadAdmin();
      });
      if (r) run(r, async function () {
        const reason = await askReason('退回支出申請', '退回原因', '確定退回'); if (!reason) return;
        await api('expense.reject', { id: r.getAttribute('data-rej'), reason: reason }); toast('已退回', 'ok'); reloadAdmin();
      });
      if (p) run(p, async function () {
        const x = find(p.getAttribute('data-pay')); if (!x) return;
        if (!(await confirmDialog('確認從「' + x.account + '」撥款 ' + fmtMoney(x.amount) + ' 給 ' + x.payee + '？\n撥款後會扣除帳戶餘額並產生傳票，無法復原。', { okText: '確認撥款', danger: true }))) return;
        const res = await api('expense.confirmPaid', { id: x.id });
        toast('已撥款，傳票 ' + res.voucherNo, 'ok'); await reloadAdmin();
        if (await confirmDialog('是否現在列印支出憑證單？', { okText: '列印' })) showExpenseVoucher(x.id);
      });
    });
  }
});

async function openExpenseApply() {

  if (!ref.accounts.length) { toast('請先到「資金帳戶」建立帳戶', 'err'); return; }

      fieldHtml({ id: 'exAcc', label: '付款帳戶', type: 'select', required: true, options: accountOptions(ref.accounts) }) +
      fieldHtml({ id: 'exPayee', label: '受款人／單位', required: true, maxlength: 80 }) +
      fieldHtml({ id: 'exPAcc', label: '受款銀行與帳號', required: true, maxlength: 120, hint: '現金請寫「現金」。' }) +
      '</div>' + fieldHtml({ id: 'exDesc', label: '用途說明', type: 'textarea', required: true, maxlength: 200 }) +
      fieldHtml({ id: 'exProj', label: '專案（選填）', type: 'select', options: projectOptions(ref.projects) }) +
      fieldHtml({ id: 'exFile', label: '發票或單據（選填，支援任意圖片或檔案格式）', type: 'file', accept: '*/*' }),
    onSubmit: async function (m) {

      const file = await filePayload($('#exFile', m.el));
      const r = await api('finance.addExpense', { subjectCode: val('exSub', m.el), date: val('exDate', m.el), amount: amt,
        account: val('exAcc', m.el), payee: val('exPayee', m.el), payeeAccount: val('exPAcc', m.el),
        description: val('exDesc', m.el), projectName: val('exProj', m.el), file: file });
      toast('已送出申請 ' + r.id, 'ok');
      if (r.budgetWarning) toast('⚠️ ' + r.budgetWarning, 'info');
      reloadAdmin();
    }
  });

const REPORTS = [
  ['incomeExpenseStatement', '收支餘絀表'], ['ledger', '分類帳'], ['journal', '日記簿'], ['budgetComparison', '預算與決算比較表'],
  ['fundraising', '勸募活動收支報告'], ['bankReconciliation', '銀行存款調節表'], ['balanceSheet', '資產負債表（現金基礎）'],
  ['netAssetChanges', '淨資產變動表'], ['cashFlow', '現金流量表']
];
function periodText(y, m) { return '中華民國 ' + (y - 1911) + ' 年' + (m ? ' ' + m + ' 月' : '度'); }
function rptTbl(cols, rows, foot) {
  return '<table style="width:100%;border-collapse:collapse;font-size:.92rem"><thead><tr>' + cols.map(function (c) {
    return '<th style="background:#f1f5f9;border:1px solid #94a3b8;padding:6px 8px;text-align:' + (c.num ? 'right' : 'left') + '">' + esc(c.h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
    (rows.length ? rows.map(function (r) { return '<tr>' + cols.map(function (c) {
      const v = c.f(r); return '<td style="border:1px solid #cbd5e1;padding:6px 8px;text-align:' + (c.num ? 'right' : 'left') + (c.bold ? ';font-weight:900' : '') + '">' + esc(v) + '</td>'; }).join('') + '</tr>'; }).join('')
      : '<tr><td colspan="' + cols.length + '" style="border:1px solid #cbd5e1;padding:8px;text-align:center;color:#64748b">本期無資料</td></tr>') +
    '</tbody>' + (foot || '') + '</table>';
}
function rptFoot(cells) { return '<tfoot><tr>' + cells.map(function (c, i) { return '<td style="border:1px solid #94a3b8;padding:6px 8px;font-weight:900;background:#f8fafc;text-align:' + (i ? 'right' : 'left') + '">' + esc(c) + '</td>'; }).join('') + '</tr></tfoot>'; }
const M = fmtMoney;

function buildReportHtml(type, r, meta) {
  const name = REPORTS.filter(function (x) { return x[0] === type; })[0][1];
  let body = '';
  if (type === 'incomeExpenseStatement') {
    const cs = [{ h: '科目', f: function (x) { return x.subjectCode + ' ' + x.subjectName; } }, { h: '金額', num: true, f: function (x) { return M(x.amount); } }];
    body = '<h3>收入</h3>' + rptTbl(cs, r.income, rptFoot(['收入合計', M(r.totalIncome)])) + '<h3 style="margin-top:14px">支出</h3>' + rptTbl(cs, r.expense, rptFoot(['支出合計', M(r.totalExpense)])) +
      '<h3 style="margin-top:14px">本期' + (r.surplus >= 0 ? '賸餘' : '短絀') + '：' + esc(M(r.surplus)) + '</h3>';
  } else if (type === 'ledger') {
    body = '<p>期初餘額：<b>' + esc(M(r.openingBalance)) + '</b></p>' + rptTbl([{ h: '日期', f: function (x) { return x.date; } }, { h: '科目', f: function (x) { return x.subjectCode + ' ' + x.subjectName; } },
      { h: '摘要', f: function (x) { return x.description; } }, { h: '收入', num: true, f: function (x) { return x.debit ? M(x.debit) : ''; } }, { h: '支出', num: true, f: function (x) { return x.credit ? M(x.credit) : ''; } },
      { h: '餘額', num: true, f: function (x) { return M(x.balance); } }], r.items, rptFoot(['期末餘額', '', '', '', '', M(r.endingBalance)]));
  } else if (type === 'journal') {
    body = rptTbl([{ h: '日期', f: function (x) { return x.date; } }, { h: '單號', f: function (x) { return x.refNo; } }, { h: '科目', f: function (x) { return x.subjectCode + ' ' + x.subjectName; } },
      { h: '摘要', f: function (x) { return x.description; } }, { h: '借方', num: true, f: function (x) { return x.debit ? M(x.debit) : ''; } }, { h: '貸方', num: true, f: function (x) { return x.credit ? M(x.credit) : ''; } }], r.items);
  } else if (type === 'budgetComparison') {
    body = rptTbl([{ h: '科目', f: function (x) { return x.subjectName; } }, { h: '預算', num: true, f: function (x) { return M(x.budgetAmt); } }, { h: '決算（年度累計）', num: true, f: function (x) { return M(x.usedAmt); } },
      { h: '執行率', num: true, f: function (x) { return x.rate + '%'; } }, { h: '差異', num: true, f: function (x) { return M(x.remainAmt); } }], r.items);
  } else if (type === 'fundraising') {
    body = rptTbl([{ h: '日期', f: function (x) { return x.date; } }, { h: '捐款人', f: function (x) { return x.name; } }, { h: '用途', f: function (x) { return x.purpose; } },
      { h: '收據編號', f: function (x) { return x.receiptNo; } }, { h: '金額', num: true, f: function (x) { return M(x.amount); } }], r.items, rptFoot(['合計', '', '', '', M(r.totalAmount)]));
  } else if (type === 'bankReconciliation') {
    const line = function (k, v) { return '<tr><td style="border:1px solid #cbd5e1;padding:7px 8px">' + esc(k) + '</td><td style="border:1px solid #cbd5e1;padding:7px 8px;text-align:right">' + esc(v) + '</td></tr>'; };
    body = r.provided
      ? '<table style="width:100%;border-collapse:collapse"><tbody>' + line('銀行對帳單餘額', M(r.bankBalance)) + line('加：在途存款', M(r.depositsInTransit)) + line('減：未兌現支票／在途付款', M(r.outstandingChecks)) +
        line('調整後銀行餘額', M(r.adjustedBank)) + line('帳面餘額（系統流水帳）', M(r.bookBalance)) + line('差異（應為 0）', M(r.diff)) + '</tbody></table>' +
        (r.diff === 0 ? '<div class="alert ok" style="margin-top:10px">✅ 調節後相符。</div>' : '<div class="alert err" style="margin-top:10px">⚠️ 尚有差異 ' + esc(M(r.diff)) + '，請檢查未記錄的收支或手續費。</div>')
      : '<div class="alert warn">請在上方輸入「銀行對帳單餘額」後再查詢，才能進行調節。</div>' + rptTbl([{ h: '帳面餘額（系統）', f: function () { return M(r.bookBalance); } }], [1]);
    body += '<h3 style="margin-top:14px">各帳戶帳面餘額</h3>' + rptTbl([{ h: '帳戶', f: function (x) { return x.name; } }, { h: '帳面餘額', num: true, f: function (x) { return M(x.bookBalance); } }], r.accounts) +
      (r.systemConsistent === false ? '<div class="alert err" style="margin-top:10px">⚠️ 「資金帳戶」記錄的目前餘額（' + esc(M(r.systemBalance)) + '）與流水帳計算不一致，請管理員檢查。</div>' : '');
  } else if (type === 'balanceSheet') {
    const cs = [{ h: '項目', f: function (x) { return x.name; } }, { h: '金額', num: true, f: function (x) { return M(x.amount); } }];
    body = '<h3>資產</h3>' + rptTbl(cs, r.assets, rptFoot(['資產總計', M(r.totalAssets)])) + '<h3 style="margin-top:14px">負債</h3>' + rptTbl(cs, r.liabilities, rptFoot(['負債總計', M(r.totalLiabilities)])) +
      '<h3 style="margin-top:14px">淨資產</h3>' + rptTbl(cs, r.netAssets, rptFoot(['淨資產總計', M(r.totalNetAssets)])) + '<div class="report-note">' + esc(r.note) + '</div>';
  } else if (type === 'netAssetChanges') {
    body = rptTbl([{ h: '項目', f: function (x) { return x.name; } }, { h: '期初', num: true, f: function (x) { return M(x.initAmt); } }, { h: '本期增加', num: true, f: function (x) { return M(x.addAmt); } },
      { h: '本期減少', num: true, f: function (x) { return M(x.decAmt); } }, { h: '期末', num: true, f: function (x) { return M(x.endAmt); } }], r.items) +
      '<div class="report-note">現金基礎：期初含帳戶初始餘額與之前累計收支。</div>';
  } else if (type === 'cashFlow') {
    body = rptTbl([{ h: '項目', f: function (x) { return (x.level ? '　　' : '') + x.name; } }, { h: '金額', num: true, f: function (x) { return x.amount === undefined ? '' : M(x.amount); } }], r.items);
  }
  const maker = (S.member && S.member.name) || (ME && ME.name) || '管理員';
  return '<div class="report-print" style="background:#fff;padding:14px;color:#14202b">' +
    '<div class="report-head"><h2>' + esc(ORG_TITLE) + '</h2><h2>' + esc(name) + '</h2><div class="small">' + esc(periodText(meta.year, meta.month)) +
      (meta.project ? '｜專案：' + esc(meta.project) : '') + '</div></div>' + body +
    '<div class="report-note">列印時間：' + esc(todayStr()) + '　製表：' + esc(maker) + '。本表為系統依流水帳自動產生，供內部參考；正式申報請經會計人員核對。</div></div>';
}

    body:

        '<div class="grid c2">' +
          fieldHtml({ id: 'vtVolId', label: '選擇志工', type: 'select', required: true, options: volOpts, value: t.volunteerId || (volOpts[0] && volOpts[0].value) || '' }) +
          fieldHtml({ id: 'vtCat', label: '訓練／考核類別', type: 'select', options: ['基礎訓練','特殊訓練','在職進修','年度考核'], value: t.category || '在職進修' }) +
        '</div>' +

          fieldHtml({ id: 'vtCourse', label: '課程或考核名稱', required: true, value: t.courseName || '', maxlength: 100, placeholder: '例：115年度志工特殊教育訓練' }) +
          fieldHtml({ id: 'vtIssuer', label: '主辦／發證單位', value: t.issuer || ORG_TITLE, maxlength: 80 }) +
        '</div>' +
        '<div class="grid c3">' +
          fieldHtml({ id: 'vtDate', label: '訓練／考核日期', type: 'date', required: true, value: t.date || todayTW() }) +
          fieldHtml({ id: 'vtHours', label: '認證時數（小時）', type: 'number', value: t.hours !== undefined ? t.hours : 6, min: 0, step: '0.5' }) +
          fieldHtml({ id: 'vtResult', label: '考核結果', type: 'select', options: ['合格','優等','完成','待補訓'], value: t.result || '合格' }) +
        '</div>' +
        fieldHtml({ id: 'vtNote', label: '備註或評語', type: 'textarea', value: t.note || '', maxlength: 300 }) +
        '<div class="field"><label class="label">📎 結業證書或考核附件（不限張數與格式）</label><div id="vtAttachBox"></div></div>' +
        '<div id="vtErr"></div>' +
      '</form>',
    footer:
      '<button type="button" class="btn btn-gray" data-close>取消</button>' +
      '<button type="button" class="btn" id="vtSaveBtn">💾 儲存訓練紀錄</button>'
  });
  const picker = createAttachmentPicker(m.$('#vtAttachBox'), t.attachments || []);
  m.$('#vtSaveBtn').addEventListener('click', function (e) {
    run(e.currentTarget, async function () {
      const err = m.$('#vtErr'); err.innerHTML = '';
      try {
        const atts = await picker.uploadAll();
        const res = await api('volunteer.saveTraining', {
          trainingId: t.trainingId || '',
          volunteerId: val('vtVolId', m.el),
          category: val('vtCat', m.el),
          courseName: val('vtCourse', m.el),
          issuer: val('vtIssuer', m.el),
          date: val('vtDate', m.el),
          hours: Number(val('vtHours', m.el)) || 0,
          result: val('vtResult', m.el),
          note: val('vtNote', m.el),
          attachments: atts
        });
        toast(res.message || '已儲存教育訓練紀錄', 'ok');
        m.close(true);
        if (onDone) onDone();
      } catch (ex) {
        err.innerHTML = alertHtml(ex.message);
      }
    });
  });
}

          '<div class="small" style="margin-bottom:12px"><b>包含工作表（共 ' + (d.sheets ? d.sheets.length : 0) + ' 張）：</b><div style="margin-top:4px">' + (sheetsHtml || '<span class="muted">尚無工作表</span>') + '</div></div>' +

                '<button type="button" class="btn btn-sm btn-purple" data-create-ss="' + it.key + '">🆕 自動新建獨立試算表</button>' +
                (it.canMigrate ? '<button type="button" class="btn btn-sm btn-outline" id="btnMigrateFin">🔄 從官網舊表遷移既有財務資料</button>' : '') +
              '</div>'
            : '') +
        '</div>';
      }).join('');

    $$('[data-bind-ss]', el).forEach(function (b) {
      b.addEventListener('click', function (e) {
        const target = e.currentTarget.getAttribute('data-bind-ss');
        const valStr = val('bindInput_' + target, el);
        if (!valStr) { toast('請先貼上 Google 試算表網址或 ID', 'info'); return; }
        run(e.currentTarget, async function () {
          const res = await api('system.bindSpreadsheet', { target: target, mode: 'bind', spreadsheetId: valStr });
          toast(res.message || '已綁定試算表', 'ok');
          reloadAdmin();
        });
      });
    });

    $$('[data-create-ss]', el).forEach(function (b) {
      b.addEventListener('click', async function (e) {
        const target = e.currentTarget.getAttribute('data-create-ss');
        if (!(await confirmDialog('確定要在您的 Google 雲端硬碟自動新建一個全新的獨立試算表並綁定嗎？', { okText: '立即新建' }))) return;
        run(e.currentTarget, async function () {
          const res = await api('system.bindSpreadsheet', { target: target, mode: 'create' });
          toast(res.message || '已新建並綁定獨立試算表', 'ok');
          reloadAdmin();
        });
      });
    });

    const migBtn = $('#btnMigrateFin', el);
    if (migBtn) {
      migBtn.addEventListener('click', function (e) {
        run(e.currentTarget, async function () {
          const res = await api('system.migrateFinance', {});
          toast(res.message, 'ok');
          reloadAdmin();
        });
      });
    }
  }
});

const NEWS_CATS = ['公告','活動','權益','衛教','新聞'];
const HIGHLIGHT_CATS = ['活動回顧','講座課程','病友聯誼','運動復健','年度大會'];
const DOC_CATS = ['會務與入會表格','衛教手冊與講義','補助與權益申請','財報與會議紀錄','其他檔案'];
const RES_CATS = ['疾病認識','運動復健','權益','照顧者','藥物','飲食'];
const RES_TYPES = [['pdf','PDF 文件'],['video','影片'],['article','文章'],['link','連結']];
const STATUS_PUB = [['published','已發布（公開顯示）'],['draft','草稿（暫不公開）']];

async function openFrontCmsModal(sheetName, itemId, defaultValues) {
  let row = Object.assign({ status: 'published', publishDate: todayTW(), date: todayTW(), order: 10 }, defaultValues || {});
  if (itemId) {
    if (sheetName === 'News') row = await api('getNewsDetail', { id: itemId });
    else if (sheetName === 'Highlights') row = await api('getHighlightDetail', { id: itemId });
    else if (sheetName === 'Events') row = await api('getEventDetail', { id: itemId });
    else if (sheetName === 'Docs') {
      const all = await api('getDocs');
      row = all.find(x => x.id === itemId) || row;
    } else if (sheetName === 'Resources') {
      const all = await api('getResources');
      row = all.find(x => x.id === itemId) || row;
    } else if (sheetName === 'FAQ') {
      const all = await api('getFaq');
      row = all.find(x => x.id === itemId) || row;
    } else if (sheetName === 'Board') {
      const ab = await api('getAbout');
      row = (ab.board || []).find(x => x.id === itemId) || row;
    }
  }

  const isNew = !itemId;
  const titles = {
    News: isNew ? '＋ 新增最新消息' : '✏️ 編輯最新消息',
    Highlights: isNew ? '＋ 新增活動花絮' : '✏️ 編輯活動花絮',
    Events: isNew ? '＋ 新增活動' : '✏️ 編輯活動',
    Docs: isNew ? '＋ 新增下載檔案' : '✏️ 編輯下載檔案',
    Resources: isNew ? '＋ 新增衛教資源' : '✏️ 編輯衛教資源',
    FAQ: isNew ? '＋ 新增常見問題' : '✏️ 編輯常見問題',
    Board: isNew ? '＋ 新增理監事' : '✏️ 編輯理監事'
  };

  let fieldsHtml = '';
  if (sheetName === 'News') {
    fieldsHtml =
      fieldHtml({ id: 'fcTitle', label: '標題', required: true, value: row.title, maxlength: 200 }) +
      '<div class="grid c3">' +
        fieldHtml({ id: 'fcCat', label: '分類', type: 'select', options: NEWS_CATS, value: row.category || '公告' }) +
        fieldHtml({ id: 'fcDate', label: '發布日期', type: 'date', required: true, value: fmtD(row.publishDate) || todayTW() }) +
        fieldHtml({ id: 'fcStatus', label: '狀態', type: 'select', options: STATUS_PUB.map(x => ({ value: x[0], label: x[1] })), value: row.status || 'published' }) +
      '</div>' +
      '<label class="check" style="margin-bottom:12px"><input type="checkbox" id="fcPin"' + (yes(row.pinned) ? ' checked' : '') + '><span>📌 置頂這則消息</span></label>' +
      fieldHtml({ id: 'fcContent', label: '內容（空一行＝新段落；「- 」開頭＝項目符號；「## 」開頭＝小標題）', type: 'textarea', value: row.content, maxlength: 30000 });
  } else if (sheetName === 'Highlights') {
    fieldsHtml =
      fieldHtml({ id: 'fcTitle', label: '活動花絮標題', required: true, value: row.title, maxlength: 200 }) +
      '<div class="grid c3">' +
        fieldHtml({ id: 'fcCat', label: '分類', type: 'select', options: HIGHLIGHT_CATS, value: row.category || '活動回顧' }) +
        fieldHtml({ id: 'fcDate', label: '活動日期', type: 'date', required: true, value: fmtD(row.date) || todayTW() }) +
        fieldHtml({ id: 'fcStatus', label: '狀態', type: 'select', options: STATUS_PUB.map(x => ({ value: x[0], label: x[1] })), value: row.status || 'published' }) +
      '</div>' +
      '<label class="check" style="margin-bottom:12px"><input type="checkbox" id="fcPin"' + (yes(row.pinned) ? ' checked' : '') + '><span>📌 置頂這則活動花絮</span></label>' +
      fieldHtml({ id: 'fcContent', label: '活動回顧與心得內容', type: 'textarea', value: row.content, maxlength: 30000 });
  } else if (sheetName === 'Events') {
    fieldsHtml =
      fieldHtml({ id: 'fcTitle', label: '活動名稱', required: true, value: row.title, maxlength: 200 }) +
      '<div class="grid c2">' +
        fieldHtml({ id: 'fcDate', label: '活動日期', type: 'date', required: true, value: fmtD(row.date) || todayTW() }) +
        fieldHtml({ id: 'fcDeadline', label: '報名截止日（選填）', type: 'date', value: fmtD(row.deadline) }) +
        fieldHtml({ id: 'fcLocation', label: '活動地點', required: true, value: row.location, maxlength: 200 }) +
        fieldHtml({ id: 'fcCap', label: '總名額（含同行者）', type: 'number', required: true, value: row.capacity || 50, min: 1 }) +
      '</div>' +
      fieldHtml({ id: 'fcStatus', label: '狀態', type: 'select', options: STATUS_PUB.map(x => ({ value: x[0], label: x[1] })), value: row.status || 'published' }) +
      fieldHtml({ id: 'fcContent', label: '活動詳細說明', type: 'textarea', value: row.description, maxlength: 30000 }) +
      surveyBuilderHtml();
  } else if (sheetName === 'Docs') {
    fieldsHtml =
      fieldHtml({ id: 'fcTitle', label: '檔案或表單名稱', required: true, value: row.title, maxlength: 150 }) +
      '<div class="grid c3">' +
        fieldHtml({ id: 'fcCat', label: '檔案分類', type: 'select', options: DOC_CATS, value: row.category || '會務與入會表格' }) +
        fieldHtml({ id: 'fcDate', label: '發布日期', type: 'date', value: fmtD(row.publishDate) || todayTW() }) +
        fieldHtml({ id: 'fcOrder', label: '排序（數字小在前）', type: 'number', value: row.order || 10, min: 1 }) +
      '</div>' +
      fieldHtml({ id: 'fcUrl', label: '直接下載網址（選填，亦可直接於下方上傳任意格式檔案）', type: 'url', value: row.url || '', placeholder: 'https://...' }) +
      fieldHtml({ id: 'fcContent', label: '檔案說明（選填）', type: 'textarea', value: row.description || '', maxlength: 5000 });
  } else if (sheetName === 'Resources') {
    fieldsHtml =
      fieldHtml({ id: 'fcTitle', label: '衛教資源標題', required: true, value: row.title, maxlength: 200 }) +
      '<div class="grid c3">' +
        fieldHtml({ id: 'fcCat', label: '主題分類', type: 'select', options: RES_CATS, value: row.category || '疾病認識' }) +
        fieldHtml({ id: 'fcType', label: '資源形式', type: 'select', options: RES_TYPES.map(x => ({ value: x[0], label: x[1] })), value: row.type || 'article' }) +
        fieldHtml({ id: 'fcDate', label: '發布日期', type: 'date', value: fmtD(row.publishDate) || todayTW() }) +
      '</div>' +
      fieldHtml({ id: 'fcUrl', label: '外部連結網址（選填，亦可於下方上傳照片與檔案）', type: 'url', value: row.url || '', placeholder: 'https://...' }) +
      fieldHtml({ id: 'fcContent', label: '衛教內容與說明', type: 'textarea', value: row.description || '', maxlength: 20000 });
  } else if (sheetName === 'FAQ') {
    fieldsHtml =
      fieldHtml({ id: 'fcTitle', label: '常見問題（Question）', required: true, value: row.question, maxlength: 200 }) +
      fieldHtml({ id: 'fcContent', label: '解答內容（Answer）', type: 'textarea', required: true, value: row.answer, maxlength: 10000 }) +
      fieldHtml({ id: 'fcOrder', label: '排序（數字小在前）', type: 'number', value: row.order || 10, min: 1 });
  } else if (sheetName === 'Board') {
    fieldsHtml =
      '<div class="grid c3">' +
        fieldHtml({ id: 'fcTitle', label: '姓名', required: true, value: row.name, maxlength: 40 }) +
        fieldHtml({ id: 'fcCat', label: '職稱（例：理事長、常務理事、監事）', required: true, value: row.title, maxlength: 40 }) +
        fieldHtml({ id: 'fcOrder', label: '排序（數字小在前）', type: 'number', value: row.order || 10, min: 1 }) +
      '</div>';
  }

  const m = openModal({
    title: titles[sheetName] || '編輯內容', static: true, wide: true,
    body: '<form id="adminEditForm" novalidate>' + fieldsHtml + mediaEditorHtml('fcMedia') + '<div id="fcErr" style="margin-top:10px"></div></form>',
    footer: '<button type="button" class="btn btn-gray" data-close>取消</button><button type="button" class="btn sec" data-ok>💾 儲存並發布</button>'
  });

  const mediaCtl = bindMediaEditor(m.el, 'fcMedia', row.attachments, sheetName.toLowerCase());
  const surveyCtl = sheetName === 'Events' ? bindSurveyBuilder(m.el, row.customQuestions) : null;
  const fmEl = m.$('form'); if (fmEl) fmEl.addEventListener('submit', function (ev) { ev.preventDefault(); ev.stopPropagation(); m.$('[data-ok]').click(); });

  m.$('[data-ok]').addEventListener('click', function (e) {
    run(e.currentTarget, async function () {
      const err = function (s) { m.$('#fcErr').innerHTML = alertHtml(s); };
      if (mediaCtl.isUploading()) return err('照片或檔案正在上傳中，請稍候完成再儲存');
      const att = mediaCtl.getValue();
      const payload = { id: itemId || '', attachments: att, coverId: (att.photos[0] && att.photos[0].id) || row.coverId || '' };

      if (sheetName === 'News') {
        payload.title = val('fcTitle', m.el);
        payload.category = val('fcCat', m.el);
        payload.publishDate = val('fcDate', m.el);
        payload.status = val('fcStatus', m.el) || 'published';
        payload.pinned = m.$('#fcPin').checked ? 'Y' : '';
        payload.content = val('fcContent', m.el);
        payload.attachUrl = (att.files[0] && att.files[0].url) || row.attachUrl || '';
      } else if (sheetName === 'Highlights') {
        payload.title = val('fcTitle', m.el);
        payload.category = val('fcCat', m.el);
        payload.date = val('fcDate', m.el);
        payload.status = val('fcStatus', m.el) || 'published';
        payload.pinned = m.$('#fcPin').checked ? 'Y' : '';
        payload.content = val('fcContent', m.el);
      } else if (sheetName === 'Events') {
        payload.title = val('fcTitle', m.el);
        payload.date = val('fcDate', m.el);
        payload.deadline = val('fcDeadline', m.el);
        payload.location = val('fcLocation', m.el);
        payload.capacity = Number(val('fcCap', m.el)) || 50;
        payload.status = val('fcStatus', m.el) || 'published';
        payload.description = val('fcContent', m.el);
        payload.customQuestions = surveyCtl ? surveyCtl.getValue() : [];
      } else if (sheetName === 'Docs') {
        payload.title = val('fcTitle', m.el);
        payload.category = val('fcCat', m.el);
        payload.publishDate = val('fcDate', m.el);
        payload.order = Number(val('fcOrder', m.el)) || 10;
        payload.url = val('fcUrl', m.el) || (att.files[0] && (att.files[0].downloadUrl || att.files[0].url)) || (att.links[0] && att.links[0].url) || '';
        payload.description = val('fcContent', m.el);
        payload.status = 'published';
      } else if (sheetName === 'Resources') {
        payload.title = val('fcTitle', m.el);
        payload.category = val('fcCat', m.el);
        payload.type = val('fcType', m.el);
        payload.publishDate = val('fcDate', m.el);
        payload.url = val('fcUrl', m.el) || (att.files[0] && att.files[0].url) || (att.links[0] && att.links[0].url) || '';
        payload.description = val('fcContent', m.el);
        payload.status = 'published';
      } else if (sheetName === 'FAQ') {
        payload.question = val('fcTitle', m.el);
        payload.answer = val('fcContent', m.el);
        payload.order = Number(val('fcOrder', m.el)) || 10;
        payload.status = 'published';
      } else if (sheetName === 'Board') {
        payload.name = val('fcTitle', m.el);
        payload.title = val('fcCat', m.el);
        payload.order = Number(val('fcOrder', m.el)) || 10;
      }

      try {
        await api('admin_save', { sheet: sheetName, row: payload });
      } catch (x) { return err(x.message); }
      m.close(true);
      toast('✅ 已儲存並更新頁面', 'ok');
      route();
    });
  });
}

async function deleteFrontCmsItem(sheetName, itemId) {
  if (!(await confirmDialog('確定要永久刪除此項目嗎？', { danger: true, okText: '確定刪除' }))) return;
  await api('admin_delete', { sheet: sheetName, id: itemId });
  toast('🗑️ 已刪除', 'ok');
  if (location.hash.split('/').length > 2) {
    const base = { News: '#/news', Highlights: '#/highlights', Events: '#/events' }[sheetName];
    if (base) { location.hash = base; return; }
  }
  route();
}

function openForumPostModal(post, defaultBoard) {

    title: isNew ? '✏️ 發表論壇文章' : '✏️ 編輯論壇文章', static: true, wide: true,

  });
  const mediaCtl = bindMediaEditor(m.el, 'fpMedia', post.attachments, 'forum');
  const fmEl = m.$('form'); if (fmEl) fmEl.addEventListener('submit', function (ev) { ev.preventDefault(); ev.stopPropagation(); m.$('[data-ok]').click(); });
  m.$('[data-ok]').addEventListener('click', function (e) {
    run(e.currentTarget, async function () {
      const err = function (s) { m.$('#fpErr').innerHTML = alertHtml(s); };
      if (mediaCtl.isUploading()) return err('照片或檔案正在上傳中，請稍候');
      const title = val('fTitle', m.el), content = val('fContent', m.el), board = val('fBoard', m.el);
      if (!title) return err('請填寫文章標題');
      if (!content) return err('請填寫文章內容');
      try {
        if (isNew) {
          const r = await api('createPost', { board: board, title: title, content: content, attachments: mediaCtl.getValue(), consent: true });
          m.close(true);
          toast('✅ 文章已發表！', 'ok');
          location.hash = '#/forum/' + encodeURIComponent(r.id);
        } else {
          await api('savePost', { id: post.id, board: board, title: title, content: content, attachments: mediaCtl.getValue() });
          m.close(true);
          toast('✅ 文章已更新！', 'ok');
          route();
        }
      } catch (x) { return err(x.message); }
    });
  });
}

async function cmsPage(key, title, navPrefixHtml) {
  const p = await cms(key);
  const finalTitle = (p && p.title) || title;
  const rawBody = (p && p.content) ? p.content : (TXT[key] || '');
  const bodyHtml = rich(rawBody);
  const attHtml = p && p.attachments ? renderAttachmentsHtml(p.attachments) : '';
  const editBtn = canManageContent()
    ? `<button type="button" class="btn sm gh noprint" data-page-edit="${esc(key)}" data-default-title="${esc(finalTitle)}">✏️ 直接編輯本頁內容與附件</button>`
    : '';
  return `${navPrefixHtml || ''}<article class="card letter">
    <div class="row-between" style="align-items:center"><h2>${esc(finalTitle)}</h2>${editBtn}</div>
    ${['family','questions','emergency'].includes(key)?medicalNotice():''}
    ${bodyHtml}
    ${attHtml}
  </article>`;
}

async function renderMemberRoute(pageKey, container) {
  if (pageKey === 'announcements') {
    container.innerHTML = toolBar('announcements') + newsSubNavHtml('announcements') + '<div id="memSubView"></div>';
    await MEMBER_PAGES['news'].render($('#memSubView', container));
    return;
  }

  if (pageKey === 'donate') {
    const introPg = await cms('donate_intro').catch(function () { return null; });
    const introHtml = '<div class="card">' +
      '<div class="row-between" style="align-items:center"><h2 style="margin:0">' + esc((introPg && introPg.title) || '💝 2. 捐款支持協會') + '</h2>' +
      (canManageWeb() ? '<button type="button" class="btn sm gh" data-page-edit="donate_intro" data-default-title="捐款支持說明">✏️ 直接編輯捐款說明與附件</button>' : '') +
      '</div>' +
      rich((introPg && introPg.content) || TXT.donate_intro) +
      (introPg && introPg.attachments ? renderAttachmentsHtml(introPg.attachments) : '') +
    '</div>';

    if (S.member || S.token) {
      container.innerHTML = supportSubNavHtml('donate') + introHtml + '<div id="memSubView"></div>';
      await MEMBER_PAGES['donate'].render($('#memSubView', container));
    } else {
      container.innerHTML = supportSubNavHtml('donate') +
        introHtml +
        receiptPolicyHtml() +
        bankInfoHtml() +
        '<div class="card feat">' +
          '<h2>線上登錄捐款與領取正式電子收據</h2>' +
          '<p>請先登入會員（支援 LINE 登入或姓名＋手機登入），即可直接於線上登錄匯款憑證、查詢入帳狀態，並下載或寄送正式電子收據。</p>' +
          '<div id="donateLoginBox"></div>' +
        '</div>';
      renderAuthBox($('#donateLoginBox', container), '登入以登錄捐款與查看電子收據');
    }
    return;
  }

  if (pageKey === 'fee') {
    const introPg = await cms('fee_intro').catch(function () { return null; });
    const introHtml = '<div class="card">' +
      '<div class="row-between" style="align-items:center"><h2 style="margin:0">' + esc((introPg && introPg.title) || '💳 1. 加入會員（常年會費）') + '</h2>' +
      (canManageWeb() ? '<button type="button" class="btn sm gh" data-page-edit="fee_intro" data-default-title="加入會員與常年會費說明">✏️ 直接編輯入會說明與附件</button>' : '') +
      '</div>' +
      rich((introPg && introPg.content) || TXT.fee_intro) +
      (introPg && introPg.attachments ? renderAttachmentsHtml(introPg.attachments) : '') +
    '</div>';

    if (S.member || S.token) {
      container.innerHTML = supportSubNavHtml('fee') + introHtml + '<div id="memSubView"></div>';
      await MEMBER_PAGES['fee'].render($('#memSubView', container));
    } else {
      container.innerHTML = supportSubNavHtml('fee') +
        introHtml +
        '<div class="card"><h2>常年會費：' + fmtMoney(MEMBER_FEE) + ' 元／年</h2>' + bankInfoHtml() +
        '<p class="muted">請先登入會員（若尚未入會，可點下方「申請加入會員」），即可線上登錄繳費資料與匯款證明，經秘書處核對後即開立電子收據並啟用會籍。</p></div>' +
        '<div id="feeLoginBox"></div>';
      renderAuthBox($('#feeLoginBox', container), '登入或申請加入會員');
    }
    return;
  }

  if (pageKey === 'volunteer') {
    container.innerHTML = '<div id="memSubView"></div>';
    await MEMBER_PAGES['volunteer'].render($('#memSubView', container));
    return;
  }

  if (pageKey === 'profile') {
    if (!S.member && !S.token) {
      container.innerHTML = memberSubNavHtml('profile') + '<div id="profLoginBox"></div>';
      renderAuthBox($('#profLoginBox', container), '請先登入以管理個人與健康資料');
      return;
    }
    container.innerHTML = toolBar('profile') + memberSubNavHtml('profile') + '<div id="memSubView"></div>';
    await MEMBER_PAGES['profile'].render($('#memSubView', container));
    return;
  }

  if (!S.member && !S.token) {
    container.innerHTML = memberSubNavHtml('home') + '<div id="meLoginBox"></div>';
    renderAuthBox($('#meLoginBox', container), '歡迎使用會員服務系統');
    return;
  }
  container.innerHTML = toolBar('me') + memberSubNavHtml('home') + '<div id="memSubView"></div><div id="meEventRegs" style="margin-top:20px"></div>';
  await MEMBER_PAGES['home'].render($('#memSubView', container));

  try {
    const myWeb = await api('getMyData');
    if (myWeb && myWeb.profile) ME = myWeb.profile;
    const regs = (myWeb && myWeb.registrations) || [];
    const regsHtml = regs.map(r => `<div class="card"><div class="row-between"><div><strong>${esc(r.eventTitle||'（活動已移除）')}</strong><div class="muted">📅 ${esc(r.eventDate)}　共 ${r.companions+1} 人</div></div>${tag(r.status)}</div>
      <div style="margin-top:8px">${['已報名','已出席'].includes(r.status)?btn('show-qr','📲 簽到 QR Code','btn sec sm',{id:r.id}):''}${r.status==='已報名'?btn('cancel-registration','取消報名','btn bad sm',{id:r.id}):''}</div></div>`).join('');
    const regBox = $('#meEventRegs', container);
    if (regBox) {
      regBox.innerHTML = '<h2>📅 我的活動報名紀錄</h2>' + (regsHtml || '<div class="card muted">目前還沒有活動報名紀錄。<a href="#/events">前往查看近期活動 →</a></div>');
    }
  } catch (e) {}
}

async function loadPermissionItemsWithFallback_() {
  try {
    const res = await api('permission.list', {}, { silent: true });
    if (res && Array.isArray(res.items)) return res.items;
  } catch (e) {}
  const [fRes, wRows, zPage] = await Promise.all([
    api('member.listAll', {}, { silent: true }).catch(function () { return { items: [] }; }),
    api('admin_list', { sheet: 'Members' }).catch(function () { return []; }),
    api('getPage', { key: 'admin_zone_map' }).catch(function () { return null; })
  ]);
  let zoneMap = {};
  try { if (zPage && zPage.content) zoneMap = JSON.parse(zPage.content) || {}; } catch (e) {}
  const fItems = (fRes && fRes.items) || [];
  const items = [];
  const seenLine = {};
  fItems.forEach(function (r) {
    const lid = r.lineId || '';
    const mid = r.memberId || '';
    const w = (wRows || []).find(function (x) { return (lid && x.userId === lid) || x.userId === mid; }) || null;
    if (lid) seenLine[lid] = true;
    const bound = Boolean(lid && !/^M\d+/i.test(lid) && lid.length >= 10) || Boolean(w && w.userId && !/^M\d+/i.test(w.userId) && String(w.userId).length >= 10);
    const savedZ = zoneMap[mid] || (lid && zoneMap[lid]) || r.adminZones;
    const defaultZ = (r.type === '管理員' || (w && w.role === 'admin') || ['理事長','總幹事','行政秘書長'].indexOf(r.type) !== -1)
      ? ['web','event','finance','volunteer']
      : (['會計','出納','理監事','理事','監事'].indexOf(r.type) !== -1 ? ['finance'] : []);
    items.push({
      memberId: mid,
      userId: lid || (w ? w.userId : ''),
      lineId: lid || (w && bound ? w.userId : ''),
      lineName: r.lineName || (w ? w.displayName : ''),
      lineBound: bound,
      name: r.name || (w ? w.name : ''),
      phone: r.phone || (w ? w.phone : ''),
      email: r.email || (w ? w.email : ''),
      type: r.type || '一般會員',
      webRole: (w && w.role === 'admin') || ADMIN_TYPES.indexOf(r.type) !== -1 ? 'admin' : 'member',
      status: '啟用',
      adminZones: Array.isArray(savedZ) ? savedZ : defaultZ
    });
  });
  (wRows || []).forEach(function (w) {
    const uid = String(w.userId || '');
    if (!uid || seenLine[uid] || /^M\d+/i.test(uid)) return;
    const bound = uid.length >= 10;
    const savedZ = zoneMap[uid];
    items.push({
      memberId: '',
      userId: uid,
      lineId: bound ? uid : '',
      lineName: w.displayName || '',
      lineBound: bound,
      name: w.name || w.displayName || '',
      phone: w.phone || '',
      email: w.email || '',
      type: w.role === 'admin' ? '管理員' : '一般會員',
      webRole: w.role || 'member',
      status: w.status || '啟用',
      adminZones: Array.isArray(savedZ) ? savedZ : (w.role === 'admin' ? ['web','event','finance','volunteer'] : [])
    });
  });
  return items;
}

async function savePermissionItemWithFallback_(payload) {
  if ((payload.adminZones && payload.adminZones.length > 0) && !payload.lineBound) {
    throw new Error('⚠️ 此人員尚未綁定 LINE 帳號！必須先請該人員以 LINE 登入完成綁定後，才能分別設定後台四大區權限。');
  }
  try {
    return await api('permission.save', payload, { silent: true });
  } catch (e) {
    if (e.message && e.message.indexOf('未知的操作') === -1) throw e;
    const zPage = await api('getPage', { key: 'admin_zone_map' }).catch(function () { return null; });
    let zoneMap = {};
    try { if (zPage && zPage.content) zoneMap = JSON.parse(zPage.content) || {}; } catch (err) {}
    if (payload.memberId) zoneMap[payload.memberId] = payload.adminZones || [];
    if (payload.userId) zoneMap[payload.userId] = payload.adminZones || [];
    await api('admin_savePage', { key: 'admin_zone_map', title: '後台四大區權限設定表', content: JSON.stringify(zoneMap) });
    if (payload.userId) {
      try {
        await api('admin_patch', {
          sheet: 'Members',
          id: payload.userId,
          patch: { role: (payload.adminZones && payload.adminZones.length > 0) ? 'admin' : 'member', status: '啟用' }
        });
      } catch (err2) {}
    }
    return { success: true, adminZones: payload.adminZones || [], type: payload.type || '管理員' };
  }
}

            '<option value="admin">已擁有後台權限人員</option>' +
            '<option value="bound">✅ 已綁定 LINE 人員</option>' +
            '<option value="unbound">⚠️ 尚未綁定 LINE 人員</option>' +
          '</select>' +
        '</div>' +
        '<div id="pmTableWrap"></div>' +
      '</div>';

    function drawPermTable() {
      const shown = allItems.filter(function (it) {
        if (filterMode === 'admin' && (!it.adminZones || !it.adminZones.length)) return false;
        if (filterMode === 'bound' && !it.lineBound) return false;
        if (filterMode === 'unbound' && it.lineBound) return false;
        if (qText) {
          const hay = (it.name + ' ' + it.phone + ' ' + it.lineName + ' ' + it.type).toLowerCase();
          if (hay.indexOf(qText.toLowerCase()) === -1) return false;
        }
        return true;
      });

      $('#pmTableWrap', el).innerHTML = tableHtml(
        ['姓名／聯絡電話','LINE 綁定狀態','職務／角色設定','後台四大專區權限（須綁定 LINE 始可勾選）','儲存操作'],
        shown.map(function (it, idx) {
          const rowKey = it.memberId || it.userId || ('idx_' + idx);
          const disabledAttr = (!it.lineBound || !canEditPerm) ? ' disabled' : '';
          const roleOpts = ['一般會員','永久會員'].concat(ADMIN_TYPES).map(function (rName) {
            return '<option value="' + esc(rName) + '"' + (it.type === rName ? ' selected' : '') + '>' + esc(rName) + '</option>';
          }).join('');
          const zChecks = ADMIN_ZONE_LIST.map(function ([zKey, zLabel]) {
            const checked = Array.isArray(it.adminZones) && it.adminZones.indexOf(zKey) !== -1;
            return '<label class="perm-zone-lbl' + (checked ? ' on' : '') + (!it.lineBound ? ' disabled' : '') + '">' +
              '<input type="checkbox" data-pm-zone="' + esc(zKey) + '" data-pm-row="' + esc(rowKey) + '"' + (checked ? ' checked' : '') + disabledAttr + '>' +
              '<span>' + esc(zLabel) + '</span>' +
            '</label>';
          }).join('');

          return [
            '<div><b>' + esc(it.name || '（未填姓名）') + '</b></div><div class="small muted">' + esc(it.phone || '—') + '</div>',
            it.lineBound
              ? '<span class="badge b-ok">✅ 已綁定 LINE</span><div class="small muted" style="margin-top:4px">LINE：' + esc(it.lineName || it.lineId.slice(0, 10) + '…') + '</div>'
              : '<span class="badge b-warn">⚠️ 未綁定 LINE</span><div class="small" style="color:var(--danger);margin-top:4px">須先請該員以 LINE 登入綁定，始可設定權限</div>',
            '<select id="pmRole_' + esc(rowKey) + '" style="min-width:130px"' + disabledAttr + '>' + roleOpts + '</select>',
            '<div class="perm-zone-grid" id="pmZones_' + esc(rowKey) + '">' + zChecks + '</div>',
            it.lineBound && canEditPerm
              ? '<div class="row">' +
                  '<button type="button" class="btn sm sec" data-pm-save="' + esc(rowKey) + '">💾 儲存權限</button>' +
                  '<button type="button" class="btn sm gh" data-pm-all="' + esc(rowKey) + '">全選四區</button>' +
                  '<button type="button" class="btn sm gh" data-pm-clear="' + esc(rowKey) + '">清除</button>' +
                '</div>'
              : '<span class="small muted">' + (!it.lineBound ? '🔒 待綁定 LINE' : '僅檢視') + '</span>'
          ];
        }),
        '找不到符合條件的人員'
      );

      $$('[data-pm-zone]', el).forEach(function (cb) {
        cb.addEventListener('change', function () {
          cb.closest('.perm-zone-lbl')?.classList.toggle('on', cb.checked);
        });
      });

      $$('[data-pm-all]', el).forEach(function (b) {
        b.addEventListener('click', function () {
          const rk = b.getAttribute('data-pm-all');
          $$('[data-pm-row="' + rk + '"]', el).forEach(function (cb) { cb.checked = true; cb.closest('.perm-zone-lbl')?.classList.add('on'); });
          const sel = $('#pmRole_' + rk, el);
          if (sel && (sel.value === '一般會員' || sel.value === '永久會員')) sel.value = '管理員';
        });
      });

      $$('[data-pm-clear]', el).forEach(function (b) {
        b.addEventListener('click', function () {
          const rk = b.getAttribute('data-pm-clear');
          $$('[data-pm-row="' + rk + '"]', el).forEach(function (cb) { cb.checked = false; cb.closest('.perm-zone-lbl')?.classList.remove('on'); });
          const sel = $('#pmRole_' + rk, el);
          if (sel) sel.value = '一般會員';
        });
      });

      $$('[data-pm-save]', el).forEach(function (b) {
        b.addEventListener('click', function () {
          const rk = b.getAttribute('data-pm-save');
          const item = allItems.find(function (x, i) { return (x.memberId || x.userId || ('idx_' + i)) === rk; });
          if (!item) return;
          const zones = $$('[data-pm-row="' + rk + '"]:checked', el).map(function (cb) { return cb.getAttribute('data-pm-zone'); });
          const roleVal = $('#pmRole_' + rk, el)?.value || '一般會員';
          run(b, async function () {
            const saved = await savePermissionItemWithFallback_({
              memberId: item.memberId,
              userId: item.userId,
              lineBound: item.lineBound,
              type: roleVal,
              adminZones: zones
            });
            item.adminZones = saved.adminZones || zones;
            item.type = saved.type || roleVal;
            if ((S.member && S.member.memberId === item.memberId) || (ME && ME.userId === item.userId)) {
              S.adminZones = item.adminZones;
              if (ME) ME.adminZones = item.adminZones;
              drawAside();
            }
            toast('✅ 已儲存「' + item.name + '」的後台四大區權限！', 'ok');
            drawPermTable();
          });
        });
      });
    }

    $('#pmSearch', el).addEventListener('input', function (e) { qText = e.target.value.trim(); drawPermTable(); });
    $('#pmFilter', el).addEventListener('change', function (e) { filterMode = e.target.value; drawPermTable(); });
    drawPermTable();
  }
});

function zoneForPage_(pageKey) {
  if (['eventHub','Events','Registrations','Highlights'].indexOf(pageKey) !== -1) return 'event';
  if (['volunteers'].indexOf(pageKey) !== -1) return 'volunteer';
  if (['dashboard','members','payReview','donReview','income','expenses','receipts','vouchers','budget','projects','subjects','accounts','reports','staff','settings','Donations'].indexOf(pageKey) !== -1) return 'finance';
  if (['News','announce','Resources','pages','ForumPosts','ForumReplies','Board','Docs','FAQ','config','Members'].indexOf(pageKey) !== -1) return 'web';
  return S.adminZone || getMyZones()[0] || 'web';
}

function renderAdminZoneBar_() {
  const curZ = S.adminZone || zoneForPage_(adminPage);
  return '<div class="adm-zone-bar noprint" role="navigation" aria-label="後台四大管理專區切換">' +
    ADMIN_ZONES.map(function (z) {
      const allowed = hasZone(z.key);
      const isOn = curZ === z.key;
      return '<button type="button" class="adm-zone-btn' + (isOn ? ' on' : '') + (!allowed ? ' locked' : '') + '" data-adm-zone="' + esc(z.key) + '"' + (isOn ? ' aria-current="true"' : '') + '>' +
        '<div class="z-top"><span class="z-num">' + esc(z.num) + '</span><span>' + z.icon + ' ' + esc(z.title) + '</span>' + (!allowed ? '<span style="margin-left:auto;font-size:.78rem">🔒</span>' : '') + '</div>' +
        '<div class="z-desc">' + esc(z.desc) + '</div>' +
      '</button>';
    }).join('') +
  '</div>';
}

function drawAside() {
  const helloName = (S.member && S.member.name) || (ME && (ME.name || ME.displayName)) || '管理員';
  const roleLabel = S.role || (ME && ME.financeRole) || '管理員';
  const curZ = S.adminZone || zoneForPage_(adminPage);
  const zoneObj = ADMIN_ZONES.find(function (z) { return z.key === curZ; }) || ADMIN_ZONES[0];
  const lineTag = hasLineBound()
    ? '<span class="badge b-ok" style="font-size:.72rem">✅ 已綁定 LINE</span>'
    : '<span class="badge b-warn" style="font-size:.72rem">⚠️ 未綁定 LINE</span>';

  let html = '<button type="button" class="btn btn-gray side-close" data-sideclose>✕ 關閉選單</button>' +
    '<h1>⚙️ 後台管理系統</h1>' +
    '<div class="small" style="color:#cfe0ea;padding:0 8px 6px">' + esc(helloName) + '（' + esc(roleLabel) + '）<div style="margin-top:4px">' + lineTag + '</div></div>' +
    '<div class="side-zone-grid" role="group" aria-label="四大分區切換">' +
      ADMIN_ZONES.map(function (z) {
        const allowed = hasZone(z.key);
        return '<button type="button" class="side-zone-btn' + (curZ === z.key ? ' on' : '') + (!allowed ? ' locked' : '') + '" data-adm-zone="' + esc(z.key) + '">' +

        '</button>';
      }).join('') +
    '</div>';

  let lastGroup = null;
  zoneObj.items.forEach(function (it) {
    if (it.grp !== lastGroup) {
      html += '<div class="grp">' + esc(it.grp) + '</div>';
      lastGroup = it.grp;
    }
    const isCurrent = it.key === adminPage;
    const href = it.href || ('#/admin/' + esc(it.key));
    const wCount = it.wbadge && counts[it.wbadge === 'ForumPosts' ? 'pendingPosts' : it.wbadge === 'ForumReplies' ? 'pendingReplies' : 'pendingMembers'] || 0;
    html += '<a href="' + href + '" class="' + (isCurrent ? 'on' : '') + '"' + (isCurrent ? ' aria-current="page"' : '') + '>' +
      '<span>' + (it.icon || '•') + ' ' + esc(it.title) + '</span>' +
      (it.badge ? '<span class="badge b-bad" data-badge="' + esc(it.badge) + '" hidden></span>' : '') +
      (it.wbadge ? '<span class="badge b-bad" data-wbadge="' + esc(it.wbadge) + '"' + (wCount ? '' : ' hidden') + '>' + (wCount || '') + '</span>' : '') +
      '</a>';
  });

  html += '<div class="grp">快速跳轉</div>';
  html += '<a href="#/admin/permissions" class="' + (adminPage === 'permissions' ? 'on' : '') + '"><span>🔐 LINE 綁定與四大區權限</span></a>';
  html += '<a href="#/"><span>🏠 回前台官網（直接編輯內容）</span></a>';

  $('#aside').innerHTML = html;
}

async function openAdmin(page) {
  const seq = ++adminSeq;
  const myZones = getMyZones();
  if (!page || page === 'dash') {
    const defZone = ADMIN_ZONES.find(function (z) { return myZones.indexOf(z.key) !== -1; }) || ADMIN_ZONES[0];
    S.adminZone = defZone.key;
    page = defZone.defaultPage;
  } else {
    S.adminZone = zoneForPage_(page);
  }
  adminPage = page;
  S.adminPage = page;
  if (page !== 'Registrations') filter = {q:'',status:'',eventId:''};
  setSidebar(false);

  if (!isAdmin() || (!hasLineBound() && !isSuper())) {
    $('#aside').innerHTML = '';
    const msg = !isLoggedIn()
      ? '<div id="admLoginGate"></div>'
      : (!hasLineBound()
          ? '<div class="alert warn">⚠️ <b>後台管理必須綁定 LINE 帳號</b><br>一般管理人員必須先完成 LINE 帳號綁定，並由總管理員分別設定「1. 前台官網管理 / 2. 活動管理 / 3. 財務管理 / 4. 志工管理」權限後始可進入後台。</div>' +
            '<div style="margin-top:12px">' + btn('login','💚 使用 LINE 登入並綁定帳號','btn btn-line') + ' <a class="btn sec" href="#/">回官網首頁</a></div>'
          : '<p>您的 LINE 帳號目前尚未被指派後台四大區管理權限，請聯絡總管理員於「🔐 LINE 綁定與四大區權限」開啟權限。</p><a class="btn sec" href="#/">回官網首頁</a>');
    $('#aapp').innerHTML = '<div class="gate"><h2>⚙️ 後台管理系統（四大分區權限管制）</h2>' + msg + '</div>';
    const gate = $('#admLoginGate');
    if (gate) renderAuthBox(gate, '管理後台登入（請使用已綁定之 LINE 帳號登入）');
    return;
  }

  const reqZone = zoneForPage_(page);
  if (['permissions','spreadsheets'].indexOf(page) === -1 && !hasZone(reqZone)) {
    drawAside();
    $('#aapp').innerHTML = renderAdminZoneBar_() +
      alertHtml('⚠️ 您的 LINE 帳號尚未開通「' + (ADMIN_ZONES.find(z => z.key === reqZone)?.title || reqZone) + '」分區權限。請切換至您有權限的管理專區，或請總管理員於「🔐 LINE 綁定與四大區權限設定」為您勾選開通。', 'warn');
    return;
  }

  drawAside();
  refreshBadges();

  const finDef = ADMIN_PAGES.find(function (p) { return p.key === page; });
  if (finDef) {
    if (!roleAllowed(finDef.roles)) {
      $('#aapp').innerHTML = renderAdminZoneBar_() + alertHtml('您的角色（' + S.role + '）沒有此頁面的操作權限');
      return;
    }
    const container = $('#aapp');
    container.innerHTML = renderAdminZoneBar_() + loadingHtml();
    try {
      const topBarWrap = document.createElement('div');
      topBarWrap.innerHTML = renderAdminZoneBar_();
      const pageWrap = document.createElement('div');
      container.replaceChildren(topBarWrap, pageWrap);
      await finDef.render(pageWrap);
    } catch (e) {
      if (seq !== adminSeq || (e instanceof ApiError && e.code === 'AUTH')) return;
      container.innerHTML = renderAdminZoneBar_() + alertHtml(e.message || '載入失敗') +
        '<button type="button" class="btn btn-outline" data-action="admin-refresh">重新載入</button>';
    }
    if (seq === adminSeq) { window.scrollTo(0, 0); try { container.focus({ preventScroll: true }); } catch (e) {} }
    return;
  }

  $('#aapp').innerHTML = renderAdminZoneBar_() + loadingHtml();
  try {
    if (page==='config') return renderConfigPage(seq);
    if (page==='pages') return renderPagesAdmin(seq);
    if (!ADMIN_CONFIG[page]) return openAdmin('News');
    const rows = await api('admin_list',{sheet:page});
    if (seq !== adminSeq) return;
    tableData = rows;
    renderTable();
  } catch(e) {
    if (seq !== adminSeq) return;
    $('#aapp').innerHTML = renderAdminZoneBar_() + `<div class="card"><h2>載入失敗</h2><p>${esc(e.message)}</p>${btn('admin-refresh','重新載入','btn gh')}</div>`;
  }
}

function filteredRows() {

function adminCell(key,r) {

  if(key==='amount')return 'NT$ '+num(v);

function editFieldHtml(f,row) {

  if(f.type==='select')return `<label for="${id}">${esc(f.label)}</label><select id="${id}" data-field="${f.key}">${options(f.choices,v)}</select>`;
  if(f.type==='checkbox')return `<label><input id="${id}" data-field="${f.key}" type="checkbox" ${yes(v)?'checked':''}>${esc(f.label)}</label>`;
  if(['image','pdf','urlpdf'].includes(f.type)){
    const accept=f.type==='image'?'image/*':'*/*';
    return `<label for="${id}">${esc(f.label)}</label>${
      f.type==='urlpdf'?`<input id="${id}" data-field="${f.key}" type="url" value="${esc(v)}" placeholder="https://…">`:''
    }<input id="file_${f.key}" type="file" accept="${accept}" data-upload="${f.key}">

  }
  const extra=f.key===cfgFirstKey()?'required maxlength="200"':f.type==='number'?'min="1" step="1"':'';
  return `<label for="${id}">${esc(f.label)}</label><input id="${id}" data-field="${f.key}" type="${f.type}" value="${esc(f.type==='date'?fmtD(v):v)}" ${extra}>`;

async function readFile(file,isImage) {
  if(!isImage)return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve({base64:String(r.result).split(',')[1],mime:file.type||'application/octet-stream',name:file.name});
    r.onerror=()=>reject(new Error('無法讀取檔案'));
    r.readAsDataURL(file);
  });
  const blob = await prepareImageForUpload(file);
  const dataUrl = await readAsDataURL(blob);
  return {base64:String(dataUrl).split(',')[1],mime:blob.type||'image/jpeg',name:file.name.replace(/\.[^.]+$/,'')+'.jpg'};
}
async function uploadFile(el) {

function exportCsv() {
  const rows=filteredRows().map(x=>x.r);
  const cell=(v,text=false)=>{
    let s=String(v??'');
    if(text||/^[\s\u0000-\u001f]*[=+\-@]/.test(s))s="'"+s;
    return '"'+s.replace(/"/g,'""')+'"';
  };
  const head=['報名時間','活動','姓名','電話','同行人數','問卷回答','備註','狀態'];
  const lines=[head.map(x=>cell(x)).join(','),...rows.map(r=>[
    cell(r.createdAt),cell(r.eventTitle),cell(r.name),cell(r.phone,true),cell(r.companions),cell(formatRegAnswersSummary(r.answers)),cell(r.note),cell(r.status)
  ].join(','))];
  const url=URL.createObjectURL(new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a');a.href=url;a.download='報名名單_'+todayTW()+'.csv';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);

let ckEvent='',scanner=null,scannerRunning=false,cameraQueue=Promise.resolve(),qrLibPromise=null;
let ckBusy=false,ckSeq=0,lastCode='',lastAt=0,audioContext=null;
function queueCamera(fn) {
  cameraQueue=cameraQueue.catch(()=>{}).then(fn);
  return cameraQueue;
}
function loadScannerLib() {
  if(window.Html5Qrcode)return Promise.resolve();
  if(qrLibPromise)return qrLibPromise;
  qrLibPromise=new Promise((resolve,reject)=>{
    const script=document.createElement('script');
    script.src='https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
    script.crossOrigin='anonymous';
    script.onload=()=>window.Html5Qrcode?resolve():reject(new Error('掃描元件無法初始化'));
    script.onerror=()=>reject(new Error('掃描元件載入失敗'));
    document.head.appendChild(script);
  }).catch(e=>{qrLibPromise=null;throw e;});
  return qrLibPromise;
}
async function stopCameraNow() {
  const current=scanner;scanner=null;
  if(current){
    try {if(scannerRunning)await current.stop();}
    catch(e){console.warn(e);}
    finally {try {current.clear();} catch {}}
  }
  scannerRunning=false;
  $('#cameraBtn').textContent='📷 開啟相機掃描';
}
function stopCamera(){return queueCamera(stopCameraNow);}
function toggleCamera() {
  return queueCamera(async()=>{
    if(scanner)return stopCameraNow();
    if($('#ck').hidden||!ckEvent)throw new Error('請先選擇活動');
    if(!window.isSecureContext)throw new Error('相機需要 HTTPS');
    await loadScannerLib();
    if($('#ck').hidden)return;
    const current=new Html5Qrcode('ckReader');
    scanner=current;
    try {
      await current.start({facingMode:'environment'},{
        fps:8,qrbox:(w,h)=>({width:Math.min(230,w-30,h-30),height:Math.min(230,w-30,h-30)})
      },code=>safely(()=>submitCheckin(code)));
      scannerRunning=true;
      if($('#ck').hidden){await stopCameraNow();return;}
      $('#cameraBtn').textContent='⏹ 關閉相機';
    } catch(e) {
      await stopCameraNow();
      throw new Error('無法開啟相機，請確認瀏覽器相機權限；也可使用手動報到碼');
    }
  });
}
function beep(ok) {
  try {
    const C=window.AudioContext||window.webkitAudioContext;
    if(!C)return;
    audioContext ||= new C();
    const o=audioContext.createOscillator(),g=audioContext.createGain();
    g.gain.value=.06;o.frequency.value=ok?880:220;
    o.connect(g);g.connect(audioContext.destination);o.start();
    o.stop(audioContext.currentTime+(ok?.12:.28));
    o.onended=()=>{o.disconnect();g.disconnect();};
    audioContext.resume().catch(()=>{});
  } catch {}
  try {navigator.vibrate?.(ok?80:[160,80,160]);}catch{}
}
async function refreshCheckin() {
  const seq=++ckSeq,list=await api('admin_checkinEvents');
  if(seq!==ckSeq||$('#ck').hidden)return;
  if(!list.some(e=>e.id===ckEvent))ckEvent=list[0]?.id||'';
  const sel=$('#ckEvent');sel.replaceChildren();
  if(!list.length)sel.add(new Option('目前沒有可簽到活動（活動日前後 1 天內才可簽到）',''));
  list.forEach(e=>sel.add(new Option(fmtD(e.date)+'　'+e.title,e.id)));
  sel.value=ckEvent;sel.disabled=!list.length||ckBusy;
  const e=list.find(x=>x.id===ckEvent);
  $('#ckArrived').textContent=e?.arrived??0;$('#ckTotal').textContent=e?.total??0;
  $('#cameraBtn').disabled=!list.length||busySet.has('camera');
}
async function submitCheckin(raw) {
  const code=String(raw||'').trim();
  if(!code||ckBusy||$('#ck').hidden)return;
  if(!ckEvent)throw new Error('請先選擇活動');
  if(code===lastCode&&Date.now()-lastAt<4000)return;
  const eventId=ckEvent;
  ckBusy=true;$('#ckEvent').disabled=true;lastCode=code;lastAt=Date.now();
  try {
    const d=await api('admin_checkin',{code,eventId});
    if($('#ck').hidden)return;
    beep(!d.already);
    const box=$('#ckResult');box.hidden=false;box.className=d.already?'dup':'ok';
    box.innerHTML=`<div>${d.already?'⚠️ 已經簽到':'✅ 簽到成功'}</div><strong>${esc(d.name)}</strong><div>共 ${num(d.people)} 人</div>${d.note?'<div class="pre">'+esc(d.note)+'</div>':''}`;
    if(!d.already){
      const history=$('#ckHistory');if(history.textContent==='尚無')history.replaceChildren();
      const row=document.createElement('div');
      row.textContent=new Intl.DateTimeFormat('zh-TW',{hour:'2-digit',minute:'2-digit'}).format(new Date())+'　'+d.name+'（'+d.people+' 人）';
      history.prepend(row);
      while(history.children.length>30)history.lastElementChild.remove();
    }
    await refreshCheckin();
  } catch(e) {
    lastCode='';beep(false);
    if(!$('#ck').hidden){
      $('#ckResult').hidden=false;$('#ckResult').className='err';$('#ckResult').textContent='❌ '+e.message;
    }
  } finally {
    ckBusy=false;
    $('#ckEvent').disabled=!ckEvent;
  }
}

function copyTextFallback(text, label) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () {
      toast('已複製' + (label || '') + '：' + text, 'ok');
    }).catch(function () {
      fallbackExecCopy(text, label);
    });
  } else {
    fallbackExecCopy(text, label);
  }
}
function fallbackExecCopy(text, label) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    toast('已複製' + (label || '') + '：' + text, 'ok');
  } catch (e) {
    toast('請手動複製：' + text, 'info');
  }
}

    try{liff.openWindow({url:ext.href,external:true});}catch{window.open(ext.href,'_blank','noopener');}
    return;
  }

  const el=event.target.closest('[data-action]');
  if(!el)return;
  const action=el.dataset.action;
  safely(async()=>{
    if(action==='font-down')return changeFont(-1);
    if(action==='font-up')return changeFont(1);
    if(action==='contrast')return setContrast(!document.body.classList.contains('hc'));
    if(action==='toggle-edit')return toggleEditMode();
    if(action==='site-config-edit')return openSiteConfigQuickModal();
    if(action==='cms-new')return openFrontCmsModal(el.dataset.sheet, '', el.dataset.cat ? { category: el.dataset.cat } : {});
    if(action==='front-ann-new')return openAnnForm(null, function () { route(); });
    if(action==='ev-reg-add')return openEventRegModal(el.dataset.eventid, null);
    if(action==='print')return window.print();
    if(action==='speak')return speak();
    if(action==='copy'){
      copyTextFallback(el.dataset.text||'', el.dataset.label||'');
      return;
    }
    if(action==='my-page'){location.hash='#/me';return;}
    if(action==='drawer'){
      $('#drawer').hidden=!$('#drawer').hidden;
      $('#menuBtn').setAttribute('aria-expanded',String(!$('#drawer').hidden));return;
    }
    if(action==='persona'){
      if(!PERSONAS[el.dataset.k])return;
      setPersona(el.dataset.k);
      const target='#/for/'+el.dataset.k;
      if(location.hash===target)return route();
      location.hash=target;return;
    }
    if(action==='persona-reset'){
      setPersona('');
      if(location.hash===''||location.hash==='#/'||location.hash==='#')return route();
      location.hash='#/';return;
    }
    if(action==='fav-toggle'){
      const f=getFavs(),i=f.findIndex(x=>x.h===location.hash);
      if(i>=0)f.splice(i,1);
      else{
        const t=($('#view h2,#view h1')?.textContent||'頁面').replace(/^[^\w\u4e00-\u9fff]+/,'').trim().slice(0,20)||'頁面';
        f.unshift({h:location.hash,t});
      }
      saveFavs(f);toast(i>=0?'已移除捷徑':'✅ 已加入我的捷徑','ok');return route();
    }
    if(action==='fav-del'){const f=getFavs();f.splice(Number(el.dataset.i),1);saveFavs(f);return route();}
    if(action==='login'){await lineLogin();return;}
    if(action==='logout'){await doLogout();return;}
    if(action==='modal-close')return closeModal();
    if(action==='qr-close'){$('#qrDialog').hidden=true;return;}
    if(action==='route-refresh')return route();
    if(action==='admin-refresh')return openAdmin(adminPage);
    if(action==='admin-new')return openEdit();
    if(action==='admin-edit')return openEdit(Number(el.dataset.index));
    if(action==='member-edit')return openMember(Number(el.dataset.index));
    if(action==='export-csv')return exportCsv();
    if(action==='remove-upload'){
      if(!modalState||modalState.uploading||modalState.saving)throw new Error('請等待目前操作完成');
      const k=el.dataset.field;modalState.row[k]='';
      const text=document.getElementById('edit_'+k);if(text)text.value='';
      $('#preview_'+k).replaceChildren();$('#uploadStatus_'+k).textContent='已移除，儲存後生效';return;
    }
    return once(action+':'+(el.dataset.id||el.dataset.index||''),el,async()=>{
      if(action==='admin-detail')return openDetail(Number(el.dataset.index));
      if(action==='show-qr')return showQR(el.dataset.id);
      if(action==='cancel-registration'){
        if(!(await confirmDialog('確定取消報名？',{danger:true,okText:'確定取消'})))return;
        await api('cancelRegistration',{id:el.dataset.id});toast('已取消','ok');return route();
      }
      if(action==='admin-status'){
        const sheet=adminPage,r=tableData[Number(el.dataset.index)],cfg=ADMIN_CONFIG[sheet];
        if(!r)throw new Error('資料已變更，請重新整理');
        if(!(await confirmDialog('確定更新為「'+el.dataset.status+'」？',{okText:'確定更新'})))return;
        await api('admin_patch',{sheet,id:r[cfg.key],patch:{status:el.dataset.status}});
        toast('✅ 已更新','ok');return route();
      }
      if(action==='admin-delete'){
        const sheet=adminPage,r=tableData[Number(el.dataset.index)];
        if(!r||!(await confirmDialog('確定永久刪除「'+(r.title||r.name||r.question||r.id)+'」？',{danger:true,okText:'永久刪除'})))return;
        await api('admin_delete',{sheet,id:r.id});toast('已刪除','ok');return route();
      }
      if(action==='camera')return toggleCamera();
      if(action==='checkin-refresh')return refreshCheckin();
      if(action==='checkin-manual'){
        const code=value('ckManual');if(!code)throw new Error('請輸入報到碼');
        $('#ckManual').value='';return submitCheckin(code);
      }
    });
  });
});

document.addEventListener('input',event=>{
  if(event.target.id==='adminSearch'){filter.q=event.target.value;renderRows();}
});
document.addEventListener('change',event=>{
  const el=event.target;
  if(el.dataset.chk!==undefined)chkChanged(el);
  if(el.id==='adminStatus'){filter.status=el.value;renderRows();}
  if(el.id==='adminEventFilter'){filter.eventId=el.value;renderRows();}
  if(el.id==='pgKey')safely(()=>renderPagesAdmin(adminSeq,el.value));
  if(el.dataset.upload)safely(()=>uploadFile(el));
  if(el.id==='ckEvent'){
    ckEvent=el.value;lastCode='';lastAt=0;
    $('#ckResult').hidden=true;$('#ckHistory').textContent='尚無';
    safely(refreshCheckin);
  }
});

document.addEventListener('keydown',event=>{
  const topModal = modalStack[modalStack.length - 1];
  if (topModal) {
    if (event.key === 'Escape') { event.preventDefault(); topModal.close(false); return; }
    if (event.key === 'Tab') {
      const f = $$('a[href],button:not(:disabled),input:not(:disabled):not([type=hidden]),select:not(:disabled),textarea:not(:disabled),[tabindex]:not([tabindex="-1"])', topModal.el)
        .filter(function (e) { return e.offsetParent !== null; });
      if (!f.length) return;
      const a = f[0], z = f[f.length - 1];
      if (event.shiftKey && document.activeElement === a) { event.preventDefault(); z.focus(); }
      else if (!event.shiftKey && document.activeElement === z) { event.preventDefault(); a.focus(); }
    }
    return;
  }
  const overlay=!$('#qrDialog').hidden?$('#qrDialog'):!$('#adminDialog').hidden?$('#adminDialog'):null;
  if(event.key==='Escape'){
    if(!$('#qrDialog').hidden)$('#qrDialog').hidden=true;
    else closeModal();
  }
  if(event.key==='Tab'&&overlay){
    const items=[...overlay.querySelectorAll('button,input,select,textarea,a[href]')].filter(x=>!x.disabled&&x.getClientRects().length);
    if(!items.length)return;
    const first=items[0],last=items[items.length-1];
    if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
    else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
  }
});

$('#btnAdmMenu').addEventListener('click', function () {
  setSidebar(!$('#aside').classList.contains('open'));
});
document.addEventListener('click', function (e) {
  const sb = $('#aside');
  if (sb && sb.classList.contains('open') && !e.target.closest('#aside') && !e.target.closest('#btnAdmMenu')) {
    setSidebar(false);
  }
});

const NAV_GROUP_MAP = {
  home:'home', start:'home', for:'home', my:'home', news:'home', announcements:'home',
  events:'events', highlights:'events',
  learn:'learn', newcomer:'learn', family:'learn', resources:'learn', faq:'learn',
  forum:'forum',
  support:'support', fee:'support', donate:'support', invoice:'support',
  volunteer:'volunteer',
  about:'about', downloads:'about',
  me:'me', profile:'me'
};

async function route() {
  const seq=++routeSeq;++adminSeq;++ckSeq;
  try{window.speechSynthesis&&speechSynthesis.cancel();}catch{}
  const segments=location.hash.replace(/^#\/?/,'').split('/').map(v=>{try{return decodeURIComponent(v);}catch{return v;}});
  const page=segments[0]||'home';
  $('#drawer').hidden=true;$('#menuBtn').setAttribute('aria-expanded','false');
  $('#qrDialog').hidden=true;closeModal(true);
  $('#pub').hidden=['admin','checkin'].includes(page);
  $('#adm').hidden=page!=='admin';
  $('#ck').hidden=page!=='checkin';
  if(page!=='checkin')safely(stopCamera);
  window.scrollTo(0,0);

  if(page==='admin')return openAdmin(segments[1]||'dashboard');
  if(page==='checkin'){
    if(!isAdmin()){
      $('#ck').hidden=true;$('#pub').hidden=false;
      $('#view').innerHTML='<h2>簽到權限不足</h2>'+(isLoggedIn()?'<p>此功能僅限啟用中的管理員。</p><a href="#/">回首頁</a>':loginCard());
      measureDock();
      return;
    }
    return safely(refreshCheckin);
  }

  curPage = NAV_GROUP_MAP[page] || page;
  markNav();
  measureDock();
  $('#view').innerHTML=loadingHtml();
  try {
    if (['me','announcements','fee','donate','volunteer','profile'].includes(page)) {
      await renderMemberRoute(page, $('#view'));
      if(seq!==routeSeq)return;
      const h=$('#view h1,#view h2');
      document.title=(h?h.textContent.trim()+'｜':'')+'台灣帕金森病友權益促進會';
      $('#view').focus({preventScroll:true});
      return;
    }
    let html;
    if(page==='forum')html=await PAGES.forum(segments[1],segments[1]==='b'?segments[2]:null);
    else if(Object.hasOwn(PAGES,page))html=await PAGES[page](segments[1],segments[2]);
    else html='<h2>找不到頁面</h2><a href="#/">回首頁</a>';
    if(seq!==routeSeq)return;
    $('#view').innerHTML=toolBar(page)+html;
    applyChecklist(true);
    const h=$('#view h2,#view h1');
    document.title=(h&&page!=='home'?h.textContent.trim()+'｜':'')+'台灣帕金森病友權益促進會';
    $('#view').focus({preventScroll:true});
  }catch(e){
    if(seq!==routeSeq)return;
    $('#view').innerHTML=`<div class="card"><h2>載入失敗</h2><p>${esc(e.message)}</p>${btn('route-refresh','重新載入','btn gh')}</div>`;
  }
}

window.addEventListener('hashchange',()=>safely(route));
window.addEventListener('visibilitychange',()=>{
  if(document.hidden)safely(stopCamera);
});
window.addEventListener('pagehide',()=>{safely(stopCamera);});

(async()=>{
  drawNavigation();
  syncEditModeBtn();
  drawFooter();drawGive();
  await initLiff();

  const tok = loadToken();
  if (tok) {
    S.token = tok;
    try {
      const r = await api('auth.me', {}, { silent: true });
      setMember(r.member, r.webProfile);
    } catch (e) {
      S.token = ''; clearToken();
    }
  }

  let noauto = false;
  try { noauto = !!sessionStorage.getItem(NOAUTO_KEY); } catch (e) {}
  if (!S.member && liffReady && window.liff && !noauto && liff.isLoggedIn()) {
    try {
      idToken = liff.getIDToken();
      if (idToken) {
        const res = await api('login');
        ME = res;
        if (res.token && res.member) {
          S.token = res.token;
          storeToken(res.token, true);
          setMember(res.member, res);
        } else if (res.needsBinding && res.ticket) {
          S.pendingBind = { ticket: res.ticket, lineName: res.lineName };
        }
      }
    } catch (e) {
      console.warn(e);
    }
  }

  drawNavigation();
  try { CFG = await api('getConfig'); } catch (e) { console.error(e); }
  drawFooter();drawGive();
  await route();
})().catch(e=>{console.error(e);toast(e.message,'err');});
</script>
