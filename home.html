function applyLayoutMode() {
  const prefMode = prefs.layout || "auto";
  const effective = prefMode === "auto" ? (window.innerWidth >= 768 ? "desktop" : "mobile") : prefMode;
  document.documentElement.classList.toggle("is-desktop", effective === "desktop");
  document.documentElement.classList.toggle("is-mobile", effective === "mobile");
  document.querySelectorAll("[data-layout-opt]").forEach(btn => {
    btn.setAttribute("aria-pressed", String(btn.dataset.layoutOpt === prefMode));
  });
  const statusEl = $("#drawerLayoutStatus");
  if (statusEl) {
    statusEl.textContent = prefMode === "auto"
      ? `自動偵測（目前：${effective === "desktop" ? "網頁版" : "手機版"}）`
      : prefMode === "desktop" ? "已強制鎖定網頁版" : "已強制鎖定手機版";
  }
  const indEl = $("#layoutModeIndicator");
  if (indEl) indEl.textContent = effective === "desktop" ? "🖥️ 網頁版視圖" : "📱 手機版視圖";
}

function setLayoutMode(mode) {
  prefs.layout = mode; savePrefs(); applyLayoutMode(); renderCurrentView();
  toast(`已切換為：${mode === "auto" ? "自動偵測" : mode === "desktop" ? "強制網頁寬版" : "強制手機單手版"}`);
}

window.addEventListener("resize", () => {
  if ((prefs.layout || "auto") === "auto") {
    const wasDesktop = document.documentElement.classList.contains("is-desktop");
    const nowDesktop = window.innerWidth >= 768;
    if (wasDesktop !== nowDesktop) applyLayoutMode();
  }
});

let lastScrollY = window.scrollY;
window.addEventListener("scroll", () => {
  const bar = $("#topBar"); if (!bar) return;
  const curY = window.scrollY;
  if (curY > 90 && curY > lastScrollY + 10) bar.classList.add("nav-hidden");
  else if (curY < lastScrollY - 6 || curY <= 50) bar.classList.remove("nav-hidden");
  lastScrollY = curY;
}, { passive: true });

function applyFontSize(px) {
  const clamped = Math.max(16, Math.min(30, Number(px) || 18));
  document.documentElement.style.fontSize = clamped + "px";
  prefs.size = clamped; savePrefs();
  document.querySelectorAll(".fontSizeBadge").forEach(el => { el.textContent = clamped + "px"; });
}
function adjustFontSize(delta) {
  const cur = Number(prefs.size) || 18, next = Math.max(16, Math.min(30, cur + delta));
  if (next === cur) return toast(delta > 0 ? "已達最大字體（30px）" : "已達最小字體（16px）");
  applyFontSize(next); toast(`字體大小已調整為 ${next}px`);
}
function resetFontSize() { applyFontSize(18); toast("字體大小已重設為標準 18px"); }

let cachedZhVoice = null;
if ("speechSynthesis" in window) {
  const loadVoices = () => { cachedZhVoice = (speechSynthesis.getVoices() || []).find(v => /zh[-_]TW/i.test(v.lang)) || null; };
  loadVoices(); speechSynthesis.onvoiceschanged = loadVoices;
}
function speakUtterance(text, rate = 0.95, pitch = 1.05, onEndCallback = null) {
  if (!("speechSynthesis" in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = "zh-TW"; u.rate = rate; u.pitch = pitch;
    if (cachedZhVoice) u.voice = cachedZhVoice;
    if (onEndCallback) u.onend = onEndCallback;
    speechSynthesis.speak(u);
  } catch (e) {}
}

  updateLsvtWidgetUI();
}
function getTodayDoneCount() {

  return (readJSON(K.lsvtStat) || {})[todayKey] || 0;
}
function incrementTodayDoneCount() {
  const todayKey = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Taipei" }).format(new Date());
  const rec = readJSON(K.lsvtStat) || {}; rec[todayKey] = (rec[todayKey] || 0) + 1;
  try { localStorage.setItem(K.lsvtStat, JSON.stringify(rec)); } catch(e) {}
}
function startLsvtRound() {

  lsvtTimer.running = true; if (lsvtTimer.count >= 10) lsvtTimer.count = 0; updateLsvtWidgetUI();
  const beginCounting = () => {
    if (!lsvtTimer.running) return;
    const tick = () => {
      if (!lsvtTimer.running) return;
      lsvtTimer.count += 1; updateLsvtWidgetUI();
      if (lsvtTimer.voiceOn) speakUtterance(lsvtTimer.count === 10 ? "十！非常棒！" : String(lsvtTimer.count), 1.05, 1.12);
      if (lsvtTimer.count >= 10) { clearInterval(lsvtTimer.timerId); lsvtTimer.timerId = null; lsvtTimer.running = false; incrementTodayDoneCount(); updateLsvtWidgetUI(); toast(`太棒了！完成第 ${ex.step} 招！`); }
    };
    tick(); lsvtTimer.timerId = setInterval(tick, 1250);
  };
  if (lsvtTimer.count === 0 && lsvtTimer.voiceOn && ("speechSynthesis" in window)) { speakUtterance(ex.voiceIntro, 0.95, 1.05); lsvtTimer.timerId = setTimeout(beginCounting, 4800); }

}

  if (!me || me.status !== "已核准") return wrap.replaceChildren(h("div", { class: "card p-5", style: "--c:#5B4B7A" }, h("p", { class: "font-bold" }, "為守護病友隱私，匿名論壇僅開放已核准之會員與家屬交流。"), h("button", { type: "button", class: "btn btn-line mt-3 w-full", onclick: () => goPage("member") }, "前往會員中心登入")));
  try {
    const r = await api({ action: "moduleData", accessToken: lineToken, module: "FORUM" });
    const ta = h("textarea", { class: "fld", rows: "3", placeholder: "寫下今天的心情或照顧心得（自動以匿名代號發布）" });
    const btn = h("button", { type: "button", class: "btn mt-2.5 w-full text-white", style: "background:#5B4B7A", onclick: async () => { if (!ta.value.trim()) return toast("請先輸入內容"); const res = await api({ action: "forumPost", accessToken: lineToken, text: ta.value.trim() }); toast(res.message || "已發布"); if (res.ok) renderForumPage(root); } }, "溫暖發布匿名貼文");
    const posts = (r.posts || []).map(p => h("article", { class: "card p-4", style: "--c:#5B4B7A" }, h("p", { class: "text-xs font-bold text-slate-600" }, `${p.alias}・${p.time}`), h("p", { class: "mt-1.5 whitespace-pre-line text-slate-800" }, p.text)));
    wrap.replaceChildren(ta, btn, h("div", { class: "mt-4 dual-grid-2" }, ...posts));
  } catch (e) { wrap.replaceChildren(h("p", {}, "載入失敗")); }
}

function renderAboutPage(root) {
  root.replaceChildren(
    h("div", { class: "rounded-3xl p-5 text-white shadow-md", style: "background:#1B365D" }, h("p", { class: "eyebrow" }, "認識與責信・深海藍專區"), h("h1", { class: "mt-1 text-2xl sm:text-3xl font-black" }, "🏛️ 認識台灣帕金森病友權益促進會")),
    h("div", { class: "mt-4 card p-5", style: "--c:#1B365D" }, h("p", { class: "text-slate-800 whitespace-pre-line leading-relaxed", "data-editable": "", "data-key": "aboutText" }, state.texts.aboutText), h("div", { class: "mt-4 grid sm:grid-cols-2 gap-2.5" }, h("button", { type: "button", class: "btn btn-line", onclick: sharePromoToLine }, "🟢 分享協會給親友"), h("button", { type: "button", class: "btn btn-light", onclick: () => navigateSystem(CONFIG.MANUAL_URL) }, "📘 理監事與財務手冊")))
  );
  applyEditable();
}

async function copyLoveCode() {
  const code = state.texts.loveCode || "8730";
  try { await navigator.clipboard.writeText(code); } catch (e) {}
  toast(`已複製愛心碼 ${code}，結帳時說出即可！`);
}
function setContrast(on) { document.documentElement.classList.toggle("hc", on); $("#btnContrast").setAttribute("aria-pressed", String(on)); prefs.hc = on; savePrefs(); }
$("#btnContrast").onclick = () => { const on = !document.documentElement.classList.contains("hc"); setContrast(on); toast(on ? "已開啟高對比模式" : "已關閉高對比模式"); };
const btnSpeak = $("#btnSpeak");
btnSpeak.onclick = () => {
  if (!("speechSynthesis" in window)) return toast("瀏覽器不支援語音朗讀");
  if (btnSpeak.getAttribute("aria-pressed") === "true") { speechSynthesis.cancel(); btnSpeak.setAttribute("aria-pressed", "false"); return toast("已停止朗讀"); }
  const text = $("#appRoot").innerText.replace(/\s+/g, "，").trim();
  btnSpeak.setAttribute("aria-pressed", "true"); $("#quickDrawer").close(); toast("🔊 開始朗讀本頁內容");
  speakUtterance(text, 0.92, 1.0, () => btnSpeak.setAttribute("aria-pressed", "false"));
};

async function api(payload) {
  const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), 12000);
  try { const r = await fetch(CONFIG.GAS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload), signal: ctrl.signal }); return await r.json(); }
  finally { clearTimeout(timer); }
}
async function authenticate() {
  try {
    const r = await api({ action: "authUser", accessToken: lineToken });
    if (r.volunteerUrl) CONFIG.VOLUNTEER_URL = r.volunteerUrl;
    if (r.ok && r.registered) { me = r.user; if (Array.isArray(r.favorites) && r.favorites.length) { favorites = r.favorites; try { localStorage.setItem(K.favs, JSON.stringify(favorites)); } catch(e) {} } }
    else me = null;
    renderCurrentView();
  } catch (e) {}
}

function getTestIdentity() { if (!CONFIG.TEST_MODE) return "LINE"; try { return localStorage.getItem("tpda_test_identity") || "DEV_ADMIN"; } catch (e) { return "DEV_ADMIN"; } }
function renderTestRoleBar() { const bar = $("#testRoleBar"); if (!bar || !CONFIG.TEST_MODE) return; bar.classList.remove("hidden"); const id = getTestIdentity(); $("#testRoleBadge").textContent = id === "DEV_ADMIN" ? "管理員（總管家）" : id === "DEV_MEMBER" ? "一般會員" : "真實 LINE"; }
document.addEventListener("click", e => { const sw = e.target.closest("[data-switch-role]"); if (!sw || !CONFIG.TEST_MODE) return; const next = sw.dataset.switchRole; try { localStorage.setItem("tpda_test_identity", next); } catch (err) {} renderTestRoleBar(); if (next === "LINE") { lineToken = null; me = null; renderCurrentView(); } else { lineToken = next; authenticate(); toast("已切換測試身分"); } });

function applyEditable() { document.querySelectorAll("[data-editable]").forEach(el => { el.contentEditable = (editing && isAdmin()) ? "plaintext-only" : "false"; }); }
document.addEventListener("input", e => { if (!isAdmin()) return; const el = e.target.closest("[data-editable]"); if (el && el.dataset.key) { state.texts[el.dataset.key] = el.innerText.trim(); try { localStorage.setItem(K.draft, JSON.stringify(state)); } catch(err) {} } });
async function enterEditByLine() { try { const r = await api({ action: "adminByLine", accessToken: lineToken }); if (r.ok && r.token) { sessionStorage.setItem(K.token, r.token); document.body.classList.add("admin"); toast("已進入管理員編輯模式"); } } catch (e) {} }
$("#btnEdit").onclick = function () { editing = !editing; document.body.classList.toggle("editing", editing); this.setAttribute("aria-pressed", String(editing)); this.textContent = editing ? "✅ 完成編輯" : "✏️ 編輯文字"; applyEditable(); };
$("#btnPush").onclick = async () => { try { const r = await api({ action: "saveCms", token: sessionStorage.getItem(K.token), data: state }); if (r.ok) { localStorage.setItem(K.pub, JSON.stringify(state)); toast("☁️ 已同步到雲端"); } } catch (e) { toast("同步失敗"); } };
$("#btnLogout").onclick = () => { editing = false; document.body.classList.remove("admin", "editing"); sessionStorage.removeItem(K.token); toast("已登出管理員模式"); };

applyFontSize(prefs.size || 18);
if (prefs.hc) setContrast(true);
applyLayoutMode();
renderCurrentView();

window.addEventListener("load", async () => {
  renderTestRoleBar(); const testId = getTestIdentity();
  if (CONFIG.TEST_MODE && testId !== "LINE") { lineToken = testId; await authenticate(); }
  else if (CONFIG.LIFF_ID && window.liff) { try { await liff.init({ liffId: CONFIG.LIFF_ID }); if (liff.isLoggedIn()) { lineToken = liff.getAccessToken(); await authenticate(); } } catch (e) {} }
  fetch(CONFIG.GAS_URL + "?action=loadCms").then(r => r.json()).then(j => { if (j.data) { state = Object.assign({}, DEFAULTS, j.data); if (!state.columns) state.columns = DEFAULTS.columns; try { localStorage.setItem(K.pub, JSON.stringify(state)); } catch(e) {} if (!isAdmin()) renderCurrentView(); } }).catch(() => {});
});
</script>
</body>
</html>
