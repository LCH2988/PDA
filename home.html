const REPORTS = [
  ['incomeExpenseStatement', '收支餘絀表'], ['ledger', '分類帳'], ['journal', '日記簿'], ['budgetComparison', '預算與決算比較表'],
  ['fundraising', '勸募活動收支報告'], ['bankReconciliation', '銀行存款調節表'], ['balanceSheet', '資產負債表（現金基礎）'],
  ['netAssetChanges', '淨資產變動表'], ['cashFlow', '現金流量表']
];
function periodText(y, m) { return '中華民國 ' + (y - 1911) + ' 年' + (m ? ' ' + m + ' 月' : '度'); }
function rptTbl(cols, rows, foot) {
  return '<table style="width:100%;border-collapse:collapse;font-size:.92rem"><thead><tr>' + cols.map(function (c) {
    return '<th style="background:#f1f5f9;border:1px solid #94a3b8;padding:6px 8px;text-align:' + (c.num ? 'right' : 'left') + '">' + esc(c.h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
    (rows.length ? rows.map(function (r) { return '<tr>' + cols.map(function (c) {
      const v = c.f(r); return '<td style="border:1px solid #cbd5e1;padding:6px 8px;text-align:' + (c.num ? 'right' : 'left') + (c.bold ? ';font-weight:900' : '') + '">' + esc(v) + '</td>'; }).join('') + '</tr>'; }).join('')
      : '<tr><td colspan="' + cols.length + '" style="border:1px solid #cbd5e1;padding:8px;text-align:center;color:#64748b">本期無資料</td></tr>') +
    '</tbody>' + (foot || '') + '</table>';
}
function rptFoot(cells) { return '<tfoot><tr>' + cells.map(function (c, i) { return '<td style="border:1px solid #94a3b8;padding:6px 8px;font-weight:900;background:#f8fafc;text-align:' + (i ? 'right' : 'left') + '">' + esc(c) + '</td>'; }).join('') + '</tr></tfoot>'; }
const M = fmtMoney;

function buildReportHtml(type, r, meta) {
  const name = REPORTS.filter(function (x) { return x[0] === type; })[0][1];
  let body = '';
  if (type === 'incomeExpenseStatement') {
    const cs = [{ h: '科目', f: function (x) { return x.subjectCode + ' ' + x.subjectName; } }, { h: '金額', num: true, f: function (x) { return M(x.amount); } }];
    body = '<h3 class="font-bold my-2">收入</h3>' + rptTbl(cs, r.income, rptFoot(['收入合計', M(r.totalIncome)])) + '<h3 class="font-bold my-2" style="margin-top:14px">支出</h3>' + rptTbl(cs, r.expense, rptFoot(['支出合計', M(r.totalExpense)])) +
      '<h3 class="font-black text-lg my-3" style="color:#0f3d54">本期' + (r.surplus >= 0 ? '賸餘' : '短絀') + '：' + esc(M(r.surplus)) + '</h3>';
  } else if (type === 'ledger') {
    body = '<p class="font-bold my-2">期初餘額：<b>' + esc(M(r.openingBalance)) + '</b></p>' + rptTbl([{ h: '日期', f: function (x) { return x.date; } }, { h: '科目', f: function (x) { return x.subjectCode + ' ' + x.subjectName; } },
      { h: '摘要', f: function (x) { return x.description; } }, { h: '收入', num: true, f: function (x) { return x.debit ? M(x.debit) : ''; } }, { h: '支出', num: true, f: function (x) { return x.credit ? M(x.credit) : ''; } },
      { h: '餘額', num: true, f: function (x) { return M(x.balance); } }], r.items, rptFoot(['期末餘額', '', '', '', '', M(r.endingBalance)]));
  } else if (type === 'journal') {
    body = rptTbl([{ h: '日期', f: function (x) { return x.date; } }, { h: '單號', f: function (x) { return x.refNo; } }, { h: '科目', f: function (x) { return x.subjectCode + ' ' + x.subjectName; } },
      { h: '摘要', f: function (x) { return x.description; } }, { h: '借方', num: true, f: function (x) { return x.debit ? M(x.debit) : ''; } }, { h: '貸方', num: true, f: function (x) { return x.credit ? M(x.credit) : ''; } }], r.items);
  } else if (type === 'budgetComparison') {
    body = rptTbl([{ h: '科目', f: function (x) { return x.subjectName; } }, { h: '預算', num: true, f: function (x) { return M(x.budgetAmt); } }, { h: '決算（年度累計）', num: true, f: function (x) { return M(x.usedAmt); } },
      { h: '執行率', num: true, f: function (x) { return x.rate + '%'; } }, { h: '差異', num: true, f: function (x) { return M(x.remainAmt); } }], r.items);
  } else if (type === 'fundraising') {
    body = rptTbl([{ h: '日期', f: function (x) { return x.date; } }, { h: '捐款人', f: function (x) { return x.name; } }, { h: '用途', f: function (x) { return x.purpose; } },
      { h: '收據編號', f: function (x) { return x.receiptNo; } }, { h: '金額', num: true, f: function (x) { return M(x.amount); } }], r.items, rptFoot(['合計', '', '', '', M(r.totalAmount)]));
  } else if (type === 'bankReconciliation') {
    const line = function (k, v) { return '<tr><td style="border:1px solid #cbd5e1;padding:7px 8px">' + esc(k) + '</td><td style="border:1px solid #cbd5e1;padding:7px 8px;text-align:right">' + esc(v) + '</td></tr>'; };
    body = r.provided
      ? '<table style="width:100%;border-collapse:collapse"><tbody>' + line('銀行對帳單餘額', M(r.bankBalance)) + line('加：在途存款', M(r.depositsInTransit)) + line('減：未兌現支票／在途付款', M(r.outstandingChecks)) +
        line('調整後銀行餘額', M(r.adjustedBank)) + line('帳面餘額（系統流水帳）', M(r.bookBalance)) + line('差異（應為 0）', M(r.diff)) + '</tbody></table>' +
        (r.diff === 0 ? '<div class="alert ok mt-3">✅ 調節後相符。</div>' : '<div class="alert err mt-3">⚠️ 尚有差異 ' + esc(M(r.diff)) + '，請檢查未記錄的收支或手續費。</div>')
      : '<div class="alert warn">請在上方輸入「銀行對帳單餘額」後再查詢，才能進行調節。</div>' + rptTbl([{ h: '帳面餘額（系統）', f: function () { return M(r.bookBalance); } }], [1]);
    body += '<h3 class="font-bold my-2" style="margin-top:14px">各帳戶帳面餘額</h3>' + rptTbl([{ h: '帳戶', f: function (x) { return x.name; } }, { h: '帳面餘額', num: true, f: function (x) { return M(x.bookBalance); } }], r.accounts) +
      (r.systemConsistent === false ? '<div class="alert err mt-2">⚠️ 「資金帳戶」記錄的目前餘額與流水帳計算不一致，請檢查。</div>' : '');
  } else if (type === 'balanceSheet') {
    const cs = [{ h: '項目', f: function (x) { return x.name; } }, { h: '金額', num: true, f: function (x) { return M(x.amount); } }];
    body = '<h3 class="font-bold my-2">資產</h3>' + rptTbl(cs, r.assets, rptFoot(['資產總計', M(r.totalAssets)])) + '<h3 class="font-bold my-2" style="margin-top:14px">負債</h3>' + rptTbl(cs, r.liabilities, rptFoot(['負債總計', M(r.totalLiabilities)])) +
      '<h3 class="font-bold my-2" style="margin-top:14px">淨資產</h3>' + rptTbl(cs, r.netAssets, rptFoot(['淨資產總計', M(r.totalNetAssets)])) + '<div class="text-xs text-slate-500 mt-2">' + esc(r.note) + '</div>';
  } else if (type === 'netAssetChanges') {
    body = rptTbl([{ h: '項目', f: function (x) { return x.name; } }, { h: '期初', num: true, f: function (x) { return M(x.initAmt); } }, { h: '本期增加', num: true, f: function (x) { return M(x.addAmt); } },
      { h: '本期減少', num: true, f: function (x) { return M(x.decAmt); } }, { h: '期末', num: true, f: function (x) { return M(x.endAmt); } }], r.items) +
      '<div class="text-xs text-slate-500 mt-2">現金基礎：期初含帳戶初始餘額與之前累計收支。</div>';
  } else if (type === 'cashFlow') {
    body = rptTbl([{ h: '項目', f: function (x) { return (x.level ? '　　' : '') + x.name; } }, { h: '金額', num: true, f: function (x) { return x.amount === undefined ? '' : M(x.amount); } }], r.items);
  }
  const maker = (S.member && S.member.name) || (ME && ME.name) || '管理員';
  return '<div class="report-print bg-white p-6 rounded-2xl text-slate-800">' +
    '<div class="text-center pb-4 mb-4 border-b border-slate-300"><h2 class="text-xl font-bold">' + esc(ORG_TITLE) + '</h2><h3 class="text-lg font-black text-slate-900 mt-1">' + esc(name) + '</h3><div class="text-xs text-slate-500 mt-1">' + esc(periodText(meta.year, meta.month)) +
      (meta.project ? '｜專案：' + esc(meta.project) : '') + '</div></div>' + body +
    '<div class="text-xs text-slate-400 mt-4 pt-3 border-t border-slate-200">列印時間：' + esc(todayStr()) + '　製表：' + esc(maker) + '。本表為系統依流水帳自動產生，供內部參考；正式申報請經會計人員核對。</div></div>';
}

const NEWS_CATS = ['公告','活動','權益','衛教','新聞'];
const HIGHLIGHT_CATS = ['活動回顧','講座課程','病友聯誼','運動復健','年度大會'];
const DOC_CATS = ['會務與入會表格','衛教手冊與講義','補助與權益申請','財報與會議紀錄','其他檔案'];
const RES_CATS = ['疾病認識','運動復健','權益','照顧者','藥物','飲食'];
const RES_TYPES = [['pdf','PDF 文件'],['video','影片'],['article','文章'],['link','連結']];
const STATUS_PUB = [['published','已發布（公開顯示）'],['draft','草稿（暫不公開）']];

async function openFrontCmsModal(sheetName, itemId, defaultValues) {
  let row = Object.assign({ status: 'published', publishDate: todayTW(), date: todayTW(), order: 10 }, defaultValues || {});
  if (itemId) {
    if (sheetName === 'News') row = await api('getNewsDetail', { id: itemId });
    else if (sheetName === 'Highlights') row = await api('getHighlightDetail', { id: itemId });
    else if (sheetName === 'Events') row = await api('getEventDetail', { id: itemId });
    else if (sheetName === 'Docs') {
      const all = await api('getDocs');
      row = all.find(x => x.id === itemId) || row;
    } else if (sheetName === 'Resources') {
      const all = await api('getResources');
      row = all.find(x => x.id === itemId) || row;
    } else if (sheetName === 'FAQ') {
      const all = await api('getFaq');
      row = all.find(x => x.id === itemId) || row;
    } else if (sheetName === 'Board') {
      const ab = await api('getAbout');
      row = (ab.board || []).find(x => x.id === itemId) || row;
    }
  }

  const isNew = !itemId;
  const titles = {
    News: isNew ? '＋ 新增最新消息' : '✏️ 編輯最新消息',
    Highlights: isNew ? '＋ 新增活動花絮' : '✏️ 編輯活動花絮',
    Events: isNew ? '＋ 新增活動' : '✏️ 編輯活動',
    Docs: isNew ? '＋ 新增下載檔案' : '✏️ 編輯下載檔案',
    Resources: isNew ? '＋ 新增衛教資源' : '✏️ 編輯衛教資源',
    FAQ: isNew ? '＋ 新增常見問題' : '✏️ 編輯常見問題',
    Board: isNew ? '＋ 新增理監事' : '✏️ 編輯理監事'
  };

  let fieldsHtml = '';
  if (sheetName === 'News') {
    fieldsHtml =
      fieldHtml({ id: 'fcTitle', label: '標題', required: true, value: row.title, maxlength: 200 }) +
      '<div class="grid c3">' +
        fieldHtml({ id: 'fcCat', label: '分類', type: 'select', options: NEWS_CATS, value: row.category || '公告' }) +
        fieldHtml({ id: 'fcDate', label: '發布日期', type: 'date', required: true, value: fmtD(row.publishDate) || todayTW() }) +
        fieldHtml({ id: 'fcStatus', label: '狀態', type: 'select', options: STATUS_PUB.map(x => ({ value: x[0], label: x[1] })), value: row.status || 'published' }) +
      '</div>' +
      '<label class="check mb-3"><input type="checkbox" id="fcPin"' + (yes(row.pinned) ? ' checked' : '') + '><span>📌 置頂這則消息</span></label>' +
      fieldHtml({ id: 'fcContent', label: '內容', type: 'textarea', value: row.content, maxlength: 30000 });
  } else if (sheetName === 'Highlights') {
    fieldsHtml =
      fieldHtml({ id: 'fcTitle', label: '活動花絮標題', required: true, value: row.title, maxlength: 200 }) +
      '<div class="grid c3">' +
        fieldHtml({ id: 'fcCat', label: '分類', type: 'select', options: HIGHLIGHT_CATS, value: row.category || '活動回顧' }) +
        fieldHtml({ id: 'fcDate', label: '活動日期', type: 'date', required: true, value: fmtD(row.date) || todayTW() }) +
        fieldHtml({ id: 'fcStatus', label: '狀態', type: 'select', options: STATUS_PUB.map(x => ({ value: x[0], label: x[1] })), value: row.status || 'published' }) +
      '</div>' +
      '<label class="check mb-3"><input type="checkbox" id="fcPin"' + (yes(row.pinned) ? ' checked' : '') + '><span>📌 置頂這則活動花絮</span></label>' +
      fieldHtml({ id: 'fcContent', label: '活動回顧與心得內容', type: 'textarea', value: row.content, maxlength: 30000 });
  } else if (sheetName === 'Events') {
    fieldsHtml =
      fieldHtml({ id: 'fcTitle', label: '活動名稱', required: true, value: row.title, maxlength: 200 }) +
      '<div class="grid c2">' +
        fieldHtml({ id: 'fcDate', label: '活動日期', type: 'date', required: true, value: fmtD(row.date) || todayTW() }) +
        fieldHtml({ id: 'fcDeadline', label: '報名截止日（選填）', type: 'date', value: fmtD(row.deadline) }) +
        fieldHtml({ id: 'fcLocation', label: '活動地點', required: true, value: row.location, maxlength: 200 }) +
        fieldHtml({ id: 'fcCap', label: '總名額（含同行者）', type: 'number', required: true, value: row.capacity || 50, min: 1 }) +
      '</div>' +
      fieldHtml({ id: 'fcStatus', label: '狀態', type: 'select', options: STATUS_PUB.map(x => ({ value: x[0], label: x[1] })), value: row.status || 'published' }) +
      fieldHtml({ id: 'fcContent', label: '活動詳細說明', type: 'textarea', value: row.description, maxlength: 30000 }) +
      surveyBuilderHtml();
  } else if (sheetName === 'Docs') {
    fieldsHtml =
      fieldHtml({ id: 'fcTitle', label: '檔案或表單名稱', required: true, value: row.title, maxlength: 150 }) +
      '<div class="grid c3">' +
        fieldHtml({ id: 'fcCat', label: '檔案分類', type: 'select', options: DOC_CATS, value: row.category || '會務與入會表格' }) +
        fieldHtml({ id: 'fcDate', label: '發布日期', type: 'date', value: fmtD(row.publishDate) || todayTW() }) +
        fieldHtml({ id: 'fcOrder', label: '排序（數字小在前）', type: 'number', value: row.order || 10, min: 1 }) +
      '</div>' +
      fieldHtml({ id: 'fcUrl', label: '直接下載網址（選填，亦可於下方上傳任意格式檔案）', type: 'url', value: row.url || '', placeholder: 'https://...' }) +
      fieldHtml({ id: 'fcContent', label: '檔案說明（選填）', type: 'textarea', value: row.description || '', maxlength: 5000 });
  } else if (sheetName === 'Resources') {
    fieldsHtml =
      fieldHtml({ id: 'fcTitle', label: '衛教資源標題', required: true, value: row.title, maxlength: 200 }) +
      '<div class="grid c3">' +
        fieldHtml({ id: 'fcCat', label: '主題分類', type: 'select', options: RES_CATS, value: row.category || '疾病認識' }) +
        fieldHtml({ id: 'fcType', label: '資源形式', type: 'select', options: RES_TYPES.map(x => ({ value: x[0], label: x[1] })), value: row.type || 'article' }) +
        fieldHtml({ id: 'fcDate', label: '發布日期', type: 'date', value: fmtD(row.publishDate) || todayTW() }) +
      '</div>' +
      fieldHtml({ id: 'fcUrl', label: '外部連結網址（選填，亦可於下方上傳附件）', type: 'url', value: row.url || '', placeholder: 'https://...' }) +
      fieldHtml({ id: 'fcContent', label: '衛教內容與說明', type: 'textarea', value: row.description || '', maxlength: 20000 });
  } else if (sheetName === 'FAQ') {
    fieldsHtml =
      fieldHtml({ id: 'fcTitle', label: '常見問題（Question）', required: true, value: row.question, maxlength: 200 }) +
      fieldHtml({ id: 'fcContent', label: '解答內容（Answer）', type: 'textarea', required: true, value: row.answer, maxlength: 10000 }) +
      fieldHtml({ id: 'fcOrder', label: '排序（數字小在前）', type: 'number', value: row.order || 10, min: 1 });
  } else if (sheetName === 'Board') {
    fieldsHtml =
      '<div class="grid c3">' +
        fieldHtml({ id: 'fcTitle', label: '姓名', required: true, value: row.name, maxlength: 40 }) +
        fieldHtml({ id: 'fcCat', label: '職稱（例：理事長、常務理事、監事）', required: true, value: row.title, maxlength: 40 }) +
        fieldHtml({ id: 'fcOrder', label: '排序（數字小在前）', type: 'number', value: row.order || 10, min: 1 }) +
      '</div>';
  }

  const m = openModal({
    title: titles[sheetName] || '編輯內容', static: true, wide: true,
    body: '<form id="adminEditForm" novalidate>' + fieldsHtml + mediaEditorHtml('fcMedia') + '<div id="fcErr" class="mt-2"></div></form>',
    footer: '<button type="button" class="btn btn-gray" data-close>取消</button><button type="button" class="btn sec" data-ok>💾 儲存並發布</button>'
  });

  const mediaCtl = bindMediaEditor(m.el, 'fcMedia', row.attachments, sheetName.toLowerCase());
  const surveyCtl = sheetName === 'Events' ? bindSurveyBuilder(m.el, row.customQuestions) : null;
  const fmEl = m.$('form'); if (fmEl) fmEl.addEventListener('submit', function (ev) { ev.preventDefault(); ev.stopPropagation(); m.$('[data-ok]').click(); });

  m.$('[data-ok]').addEventListener('click', function (e) {
    run(e.currentTarget, async function () {
      const err = function (s) { m.$('#fcErr').innerHTML = alertHtml(s); };
      if (mediaCtl.isUploading()) return err('照片或檔案正在上傳中，請稍候完成再儲存');
      const att = mediaCtl.getValue();
      const payload = { id: itemId || '', attachments: att, coverId: (att.photos[0] && att.photos[0].id) || row.coverId || '' };

      if (sheetName === 'News') {
        payload.title = val('fcTitle', m.el);
        payload.category = val('fcCat', m.el);
        payload.publishDate = val('fcDate', m.el);
        payload.status = val('fcStatus', m.el) || 'published';
        payload.pinned = m.$('#fcPin').checked ? 'Y' : '';
        payload.content = val('fcContent', m.el);
        payload.attachUrl = (att.files[0] && att.files[0].url) || row.attachUrl || '';
      } else if (sheetName === 'Highlights') {
        payload.title = val('fcTitle', m.el);
        payload.category = val('fcCat', m.el);
        payload.date = val('fcDate', m.el);
        payload.status = val('fcStatus', m.el) || 'published';
        payload.pinned = m.$('#fcPin').checked ? 'Y' : '';
        payload.content = val('fcContent', m.el);
      } else if (sheetName === 'Events') {
        payload.title = val('fcTitle', m.el);
        payload.date = val('fcDate', m.el);
        payload.deadline = val('fcDeadline', m.el);
        payload.location = val('fcLocation', m.el);
        payload.capacity = Number(val('fcCap', m.el)) || 50;
        payload.status = val('fcStatus', m.el) || 'published';
        payload.description = val('fcContent', m.el);
        payload.customQuestions = surveyCtl ? surveyCtl.getValue() : [];
      } else if (sheetName === 'Docs') {
        payload.title = val('fcTitle', m.el);

async function cmsPage(key, title, navPrefixHtml) {
  const p = await cms(key);
  const finalTitle = (p && p.title) || title;
  const rawBody = (p && p.content) ? p.content : (TXT[key] || '');
  const bodyHtml = rich(rawBody);
  const attHtml = p && p.attachments ? renderAttachmentsHtml(p.attachments) : '';
  const editBtn = canManageContent()
    ? `<button type="button" class="btn sm gh noprint" data-page-edit="${esc(key)}" data-default-title="${esc(finalTitle)}">✏️ 直接編輯本頁內容與附件</button>`
    : '';
  return `${navPrefixHtml || ''}<article class="card letter">
    <div class="row-between mb-3"><h2 class="text-2xl font-black text-slate-900">${esc(finalTitle)}</h2>${editBtn}</div>
    ${['family','questions','emergency'].includes(key)?medicalNotice():''}
    ${bodyHtml}
    ${attHtml}
  </article>`;
}

let ckEvent='',scanner=null,scannerRunning=false,cameraQueue=Promise.resolve();
let ckBusy=false,ckSeq=0,lastCode='',lastAt=0,audioContext=null;
function queueCamera(fn) {
  cameraQueue=cameraQueue.catch(()=>{}).then(fn);
  return cameraQueue;
}
async function stopCameraNow() {
  const current=scanner;scanner=null;
  if(current){
    try {if(scannerRunning)await current.stop();}
    catch(e){console.warn(e);}
    finally {try {current.clear();} catch {}}
  }
  scannerRunning=false;
  const b = $('#cameraBtn');
  if (b) b.textContent='📷 開啟相機鏡頭掃描';
}
function stopCamera(){return queueCamera(stopCameraNow);}
function toggleCamera() {
  return queueCamera(async()=>{
    if(scanner)return stopCameraNow();
    if($('#ck').hidden||!ckEvent)throw new Error('請先選擇活動');
    if(!window.isSecureContext)throw new Error('相機需要 HTTPS 安全連線環境');
    if(!window.Html5Qrcode)throw new Error('掃描元件載入失敗');
    const current=new Html5Qrcode('ckReader');
    scanner=current;
    try {
      await current.start({facingMode:'environment'},{
        fps:10,qrbox:(w,h)=>({width:Math.min(220,w-30,h-30),height:Math.min(220,w-30,h-30)})
      },code=>safely(()=>submitCheckin(code)));
      scannerRunning=true;
      if($('#ck').hidden){await stopCameraNow();return;}
      $('#cameraBtn').textContent='⏹ 關閉相機鏡頭';
    } catch(e) {
      await stopCameraNow();
      throw new Error('無法開啟相機鏡頭，請確認瀏覽器相機權限；亦可使用手動報到碼簽到');
    }
  });
}
function beep(ok) {
  try {
    const C=window.AudioContext||window.webkitAudioContext;
    if(!C)return;
    audioContext ||= new C();
    const o=audioContext.createOscillator(),g=audioContext.createGain();
    g.gain.value=0.06;o.frequency.value=ok?880:220;
    o.connect(g);g.connect(audioContext.destination);o.start();
    o.stop(audioContext.currentTime+(ok?0.12:0.28));
    o.onended=()=>{o.disconnect();g.disconnect();};
    audioContext.resume().catch(()=>{});
  } catch {}
  try {navigator.vibrate?.(ok?80:[160,80,160]);}catch{}
}
async function refreshCheckin() {
  const seq=++ckSeq,list=await api('admin_checkinEvents');
  if(seq!==ckSeq||$('#ck').hidden)return;
  if(!list.some(e=>e.id===ckEvent))ckEvent=list[0]?.id||'';
  const sel=$('#ckEvent');sel.replaceChildren();
  if(!list.length)sel.add(new Option('目前沒有可簽到活動（活動日前後 1 天內才可簽到）',''));
  list.forEach(e=>sel.add(new Option(fmtD(e.date)+'　'+e.title,e.id)));
  sel.value=ckEvent;sel.disabled=!list.length||ckBusy;
  const e=list.find(x=>x.id===ckEvent);
  $('#ckArrived').textContent=e?.arrived??0;$('#ckTotal').textContent=e?.total??0;
  $('#cameraBtn').disabled=!list.length||busySet.has('camera');
}
async function submitCheckin(raw) {
  const code=String(raw||'').trim();
  if(!code||ckBusy||$('#ck').hidden)return;
  if(!ckEvent)throw new Error('請先選擇活動');
  if(code===lastCode&&Date.now()-lastAt<4000)return;
  const eventId=ckEvent;
  ckBusy=true;$('#ckEvent').disabled=true;lastCode=code;lastAt=Date.now();
  try {
    const d=await api('admin_checkin',{code,eventId});
    if($('#ck').hidden)return;
    beep(!d.already);
    const box=$('#ckResult');box.hidden=false;
    box.className=d.already?'bg-amber-600 text-white p-4 rounded-2xl my-3 text-center font-bold text-sm':'bg-emerald-600 text-white p-4 rounded-2xl my-3 text-center font-bold text-sm';
    box.innerHTML=`<div>${d.already?'⚠️ 已經完成簽到過':'✅ 簽到成功'}</div><strong class="text-xl block my-1">${esc(d.name)}</strong><div>共 ${num(d.people)} 人</div>${d.note?'<div class="pre text-xs text-white/90 mt-1">'+esc(d.note)+'</div>':''}`;
    if(!d.already){
      const history=$('#ckHistory');if(history.textContent==='尚無')history.replaceChildren();
      const row=document.createElement('div');
      row.textContent=new Intl.DateTimeFormat('zh-TW',{hour:'2-digit',minute:'2-digit'}).format(new Date())+'　'+d.name+'（'+d.people+' 人）';
      history.prepend(row);
      while(history.children.length>30)history.lastElementChild.remove();
    }
    await refreshCheckin();
  } catch(e) {
    lastCode='';beep(false);
    if(!$('#ck').hidden){
      $('#ckResult').hidden=false;$('#ckResult').className='bg-rose-700 text-white p-4 rounded-2xl my-3 text-center font-bold text-sm';$('#ckResult').textContent='❌ '+e.message;
    }
  } finally {
    ckBusy=false;
    $('#ckEvent').disabled=!ckEvent;
  }
}

/* =========================================================================
   十二、全域事件委派、鍵盤與路由引擎
   ========================================================================= */
function copyTextFallback(text, label) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () {
      toast('已複製' + (label || '') + '：' + text, 'ok');
    }).catch(function () {
      fallbackExecCopy(text, label);
    });
  } else {
    fallbackExecCopy(text, label);
  }
}
function fallbackExecCopy(text, label) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    toast('已複製' + (label || '') + '：' + text, 'ok');
  } catch (e) {
    toast('請手動複製：' + text, 'info');
  }
}

document.addEventListener('submit',event=>{
  const form=event.target;
  if(!(form instanceof HTMLFormElement))return;
  if(!['registerForm','profileForm','postForm','replyForm','adminEditForm','memberEditForm','configForm','pageForm'].includes(form.id))return;
  event.preventDefault();
  if(!form.reportValidity())return;
  const button=form.querySelector('button[type=submit]');
  safely(()=>once(form.id,button,async()=>{
    if(form.id==='registerForm'){
      if(!requireLogin())return;
      const companions=Number(value('rComp'));
      if(!Number.isInteger(companions)||companions<0||companions>10)throw new Error('同行人數需為 0 到 10 的整數');
      if(!checked('rConsent'))throw new Error('請勾選同意蒐集個人資料');
      const answers = readCustomQuestionsAnswers(form);
      await api('registerEvent',{eventId:form.dataset.id,name:value('rName'),phone:value('rPhone'),companions,note:value('rNote'),answers:Object.keys(answers).length?answers:undefined,consent:true});
      toast('✅ 報名成功','ok');location.hash='#/me';
    } else if(form.id==='postForm'){
      if(!checked('fConsent'))throw new Error('請勾選確認事項');
      await api('createPost',{board:value('fBoard'),title:value('fTitle'),content:value('fContent'),consent:true});
      toast('✅ 已發表','ok');location.hash='#/forum';
    } else if(form.id==='replyForm'){
      await api('createReply',{postId:form.dataset.id,content:value('replyContent')});
      toast('✅ 已送出回覆','ok');await route();
    } else if(form.id==='adminEditForm'){
      const state=modalState;if(!state)throw new Error('表單已失效');
      if(state.uploading)throw new Error('請等待檔案上傳完成');
      const cfg=ADMIN_CONFIG[state.sheet],row={...state.row};
      cfg.fields.forEach(f=>{
        const el=document.getElementById('edit_'+f.key);
        if(el)row[f.key]=f.type==='checkbox'?(el.checked?'Y':''):el.value.trim();
      });
      if(!row[cfg.fields[0].key])throw new Error('請填寫「'+cfg.fields[0].label+'」');
      state.saving=true;
      try {
        await api('admin_save',{sheet:state.sheet,row});
        if(modalState===state)closeModal(true);
        toast('✅ 已儲存','ok');await route();
      } finally {state.saving=false;}
    } else if(form.id==='memberEditForm'){
      const state=modalState;if(!state)throw new Error('表單已失效');
      const zones = $$('[data-me-zone]:checked', form).map(cb => cb.getAttribute('data-me-zone'));
      const finalRole = zones.length > 0 ? 'admin' : value('memberRole');
      const patch={status:value('memberStatus'),role:finalRole,expireDate:value('memberExpiry'),identity:value('memberIdentity'),adminZones:zones};
      if(patch.role==='admin'&&state.row.role!=='admin'&&!(await confirmDialog('確定授予後台管理權限？',{okText:'確定授予'})))return;
      state.saving=true;
      try{
        await api('admin_patch',{sheet:'Members',id:state.row.userId,patch});
        closeModal(true);toast('✅ 已更新會員與四大區權限','ok');await route();
      }finally{state.saving=false;}
    } else if(form.id==='configForm'){
      const values={};
      form.querySelectorAll('[id^=cfg_]').forEach(el=>values[el.id.slice(4)]=el.value.trim());
      await api('admin_setConfig',{values});
      try{CFG=await api('getConfig');}catch(e){console.error(e);}
      drawFooter();drawGive();toast('✅ 已儲存，請到前台核對','ok');
    } else if(form.id==='pageForm'){
      await api('admin_savePage',{key:value('pgKey'),title:value('pgTitle'),content:value('pgContent')});
      toast('✅ 已儲存','ok');
    }
  }));
});

    if(action==='my-page'){location.hash='#/me';return;}
    if(action==='drawer'){
      $('#drawer').hidden=!$('#drawer').hidden;
      $('#menuBtn').setAttribute('aria-expanded',String(!$('#drawer').hidden));return;
    }
    if(action==='persona'){
      if(!PERSONAS[el.dataset.k])return;
      setPersona(el.dataset.k);
      const target='#/for/'+el.dataset.k;
      if(location.hash===target)return route();
      location.hash=target;return;
    }
    if(action==='persona-reset'){
      setPersona('');
      if(location.hash===''||location.hash==='#/'||location.hash==='#')return route();
      location.hash='#/';return;
    }
    if(action==='fav-toggle'){
      const f=getFavs(),i=f.findIndex(x=>x.h===location.hash);
      if(i>=0)f.splice(i,1);
      else{
        const t=($('#view h2,#view h1')?.textContent||'頁面').replace(/^[^\w\u4e00-\u9fff]+/,'').trim().slice(0,20)||'頁面';
        f.unshift({h:location.hash,t});
      }
      saveFavs(f);toast(i>=0?'已移除捷徑':'✅ 已加入我的捷徑','ok');return route();
    }
    if(action==='fav-del'){const f=getFavs();f.splice(Number(el.dataset.i),1);saveFavs(f);return route();}
    if(action==='login'){await lineLogin();return;}
    if(action==='logout'){await doLogout();return;}
    if(action==='modal-close')return closeModal();
    if(action==='qr-close'){$('#qrDialog').hidden=true;return;}
    if(action==='route-refresh')return route();
    if(action==='admin-refresh')return openAdmin(adminPage);
    if(action==='admin-new')return openEdit();
    if(action==='admin-edit')return openEdit(Number(el.dataset.index));
    if(action==='member-edit')return openMember(Number(el.dataset.index));
    if(action==='export-csv')return exportCsv();
    return once(action+':'+(el.dataset.id||el.dataset.index||''),el,async()=>{
      if(action==='admin-detail')return openDetail(Number(el.dataset.index));
      if(action==='show-qr')return showQR(el.dataset.id);
      if(action==='cancel-registration'){
        if(!(await confirmDialog('確定取消報名？',{danger:true,okText:'確定取消'})))return;
        await api('cancelRegistration',{id:el.dataset.id});toast('已取消','ok');return route();
      }
      if(action==='admin-status'){
        const sheet=adminPage,r=tableData[Number(el.dataset.index)],cfg=ADMIN_CONFIG[sheet];
        if(!r)throw new Error('資料已變更，請重新整理');
        if(!(await confirmDialog('確定更新為「'+el.dataset.status+'」？',{okText:'確定更新'})))return;
        await api('admin_patch',{sheet,id:r[cfg.key],patch:{status:el.dataset.status}});
        toast('✅ 已更新','ok');return route();
      }
      if(action==='admin-delete'){
        const sheet=adminPage,r=tableData[Number(el.dataset.index)];
        if(!r||!(await confirmDialog('確定永久刪除「'+(r.title||r.name||r.question||r.id)+'」？',{danger:true,okText:'永久刪除'})))return;
        await api('admin_delete',{sheet,id:r.id});toast('已刪除','ok');return route();
      }
      if(action==='camera')return toggleCamera();
      if(action==='checkin-refresh')return refreshCheckin();
      if(action==='checkin-manual'){
        const code=value('ckManual');if(!code)throw new Error('請輸入報到碼');
        $('#ckManual').value='';return submitCheckin(code);
      }
    });
  });
});

document.addEventListener('input',event=>{
  if(event.target.id==='adminSearch'){filter.q=event.target.value;renderRows();}
});
document.addEventListener('change',event=>{
  const el=event.target;
  if(el.dataset.chk!==undefined)chkChanged(el);
  if(el.id==='adminStatus'){filter.status=el.value;renderRows();}
  if(el.id==='adminEventFilter'){filter.eventId=el.value;renderRows();}
  if(el.id==='pgKey')safely(()=>renderPagesAdmin(adminSeq,el.value));
  if(el.id==='ckEvent'){
    ckEvent=el.value;lastCode='';lastAt=0;
    $('#ckResult').hidden=true;$('#ckHistory').textContent='尚無';
    safely(refreshCheckin);
  }
});

document.addEventListener('keydown',event=>{
  const topModal = modalStack[modalStack.length - 1];
  if (topModal) {
    if (event.key === 'Escape') { event.preventDefault(); topModal.close(false); return; }
    if (event.key === 'Tab') {
      const f = $$('a[href],button:not(:disabled),input:not(:disabled):not([type=hidden]),select:not(:disabled),textarea:not(:disabled),[tabindex]:not([tabindex="-1"])', topModal.el)
        .filter(function (e) { return e.offsetParent !== null; });
      if (!f.length) return;
      const a = f[0], z = f[f.length - 1];
      if (event.shiftKey && document.activeElement === a) { event.preventDefault(); z.focus(); }
      else if (!event.shiftKey && document.activeElement === z) { event.preventDefault(); a.focus(); }
    }
    return;
  }
  const overlay=!$('#qrDialog').hidden?$('#qrDialog'):!$('#adminDialog').hidden?$('#adminDialog'):null;
  if(event.key==='Escape'){
    if(!$('#qrDialog').hidden)$('#qrDialog').hidden=true;
    else closeModal();
  }
});

$('#btnAdmMenu').addEventListener('click', function () {
  setSidebar(!$('#aside').classList.contains('hidden'));
});

const NAV_GROUP_MAP = {
  home:'home', start:'home', for:'home', my:'home', news:'home', announcements:'home',
  events:'events', highlights:'events',
  learn:'learn', newcomer:'learn', family:'learn', resources:'learn', faq:'learn',
  forum:'forum',
  support:'support', fee:'support', donate:'support', invoice:'support',
  volunteer:'volunteer',
  about:'about', downloads:'about',
  me:'me', profile:'me'
};

async function route() {
  const seq=++routeSeq;++adminSeq;++ckSeq;
  try{window.speechSynthesis&&speechSynthesis.cancel();$('#btn-tts-stop')?.classList.add('hidden');}catch{}
  const segments=location.hash.replace(/^#\/?/,'').split('/').map(v=>{try{return decodeURIComponent(v);}catch{return v;}});
  const page=segments[0]||'home';
  $('#drawer').hidden=true;$('#menuBtn').setAttribute('aria-expanded','false');
  $('#qrDialog').hidden=true;closeModal(true);
  $('#pub').hidden=['admin','checkin'].includes(page);
  $('#adm').hidden=page!=='admin';
  $('#ck').hidden=page!=='checkin';
  if(page!=='checkin')safely(stopCamera);
  window.scrollTo(0,0);

  if(page==='admin')return openAdmin(segments[1]||'dashboard');
  if(page==='checkin'){
    if(!isAdmin()){
      $('#ck').hidden=true;$('#pub').hidden=false;
      $('#view').innerHTML='<h2 class="text-2xl font-bold mb-3">簽到權限不足</h2>'+(isLoggedIn()?'<p class="text-slate-600 mb-4">此功能僅限啟用中的管理員。</p><a class="btn sec" href="#/">回首頁</a>':loginCard());
      measureDock();
      return;
    }
    return safely(refreshCheckin);
  }

  curPage = NAV_GROUP_MAP[page] || page;
  markNav();
  measureDock();
  $('#view').innerHTML=loadingHtml();
  try {
    if (['me','announcements','fee','donate','volunteer','profile'].includes(page)) {
      await renderMemberRoute(page, $('#view'));
      if(seq!==routeSeq)return;
      const h=$('#view h1,#view h2');
      document.title=(h?h.textContent.trim()+'｜':'')+'台灣帕金森病友權益促進會';
      $('#view').focus({preventScroll:true});
      if (window.lucide && lucide.createIcons) lucide.createIcons();
      return;
    }
    let html;
    if(page==='forum')html=await PAGES.forum(segments[1],segments[1]==='b'?segments[2]:null);
    else if(Object.hasOwn(PAGES,page))html=await PAGES[page](segments[1],segments[2]);
    else html='<div class="card text-center py-12"><h2 class="text-2xl font-bold mb-3">找不到頁面</h2><a class="btn sec" href="#/">回首頁</a></div>';
    if(seq!==routeSeq)return;
    $('#view').innerHTML=toolBar(page)+html;
    applyChecklist(true);
    const h=$('#view h2,#view h1');
    document.title=(h&&page!=='home'?h.textContent.trim()+'｜':'')+'台灣帕金森病友權益促進會';
    $('#view').focus({preventScroll:true});
    if (window.lucide && lucide.createIcons) lucide.createIcons();
  }catch(e){
    if(seq!==routeSeq)return;
    $('#view').innerHTML=`<div class="card text-center py-12"><h2 class="text-xl font-bold mb-2 text-rose-700">載入失敗</h2><p class="text-xs text-slate-500 mb-4">${esc(e.message)}</p>${btn('route-refresh','重新載入','btn gh')}</div>`;
  }
}

window.addEventListener('hashchange',()=>safely(route));
window.addEventListener('visibilitychange',()=>{
  if(document.hidden)safely(stopCamera);
});
window.addEventListener('pagehide',()=>{safely(stopCamera);});

// 登入按鈕快捷綁定
$('#meBtn')?.addEventListener('click', () => { location.hash = '#/me'; });

(async()=>{
  drawNavigation();
  syncEditModeBtn();
  drawFooter();drawGive();
  await initLiff();

  const tok = loadToken();
  if (tok) {
    S.token = tok;
    try {
      const r = await api('auth.me', {}, { silent: true });
      setMember(r.member, r.webProfile);
    } catch (e) {
      S.token = ''; clearToken();
    }
  }

  let noauto = false;
  try { noauto = !!sessionStorage.getItem(NOAUTO_KEY); } catch (e) {}
  if (!S.member && liffReady && window.liff && !noauto && liff.isLoggedIn()) {
    try {
      idToken = liff.getIDToken();
      if (idToken) {
        const res = await api('login');
        ME = res;
        if (res.token && res.member) {
          S.token = res.token;
          storeToken(res.token, true);
          setMember(res.member, res);
        } else if (res.needsBinding && res.ticket) {
          S.pendingBind = { ticket: res.ticket, lineName: res.lineName };
        }
      }
    } catch (e) {
      console.warn(e);
    }
  }

  drawNavigation();
  try { CFG = await api('getConfig'); } catch (e) { console.error(e); }
  drawFooter();drawGive();
  await route();
  if (window.lucide && lucide.createIcons) lucide.createIcons();
})().catch(e=>{console.error(e);toast(e.message,'err');});
</script>
