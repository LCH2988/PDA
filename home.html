async function withBusy(btn, busyText, asyncFn) {
  if (!btn) return await asyncFn();
  if (btn.dataset.busy === "1") return;
  btn.dataset.busy = "1";
  const orig = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = `⏳ ${busyText || "處理中…"}`;
  try { return await asyncFn(); }
  finally { btn.dataset.busy = ""; btn.disabled = false; btn.innerHTML = orig; }
}

}

function applyFontSize(px) {
  const clamped = Math.max(16, Math.min(30, Number(px) || 18));
  document.documentElement.style.fontSize = clamped + "px";
  prefs.size = clamped; savePrefs();
  document.querySelectorAll(".fontSizeBadge").forEach(el => { el.textContent = clamped + "px"; });
}
function adjustFontSize(d) {

let cachedZhVoice = null;
if ("speechSynthesis" in window) {
  const loadV = () => { cachedZhVoice = (speechSynthesis.getVoices() || []).find(v => /zh[-_]TW/i.test(v.lang)) || null; };
  loadV(); speechSynthesis.onvoiceschanged = loadV;
}
function speakUtterance(text, rate = 0.95, pitch = 1.05, onEnd = null) {
  if (!("speechSynthesis" in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = "zh-TW"; u.rate = rate; u.pitch = pitch;
    if (cachedZhVoice) u.voice = cachedZhVoice;
    if (onEnd) u.onend = onEnd;
    speechSynthesis.speak(u);
  } catch (e) {}
}
$("#btnSpeak").onclick = function () {
  if (!("speechSynthesis" in window)) return toast("瀏覽器不支援語音朗讀");
  if (this.getAttribute("aria-pressed") === "true") { speechSynthesis.cancel(); this.setAttribute("aria-pressed", "false"); return toast("已停止朗讀"); }
  const text = $("#appRoot").innerText.replace(/\s+/g, "，").trim();
  this.setAttribute("aria-pressed", "true"); $("#quickDrawer").close(); toast("🔊 開始朗讀本頁內容");
  speakUtterance(text, 0.92, 1.0, () => this.setAttribute("aria-pressed", "false"));
};

}

  if (pageHistory.length > 1) { pageHistory.pop(); goPage(pageHistory[pageHistory.length - 1], false); }
  else goPage("home", false);
}

/* ---------- API 連線與資料同步 ---------- */
async function api(payload) {
  const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), 15000);
  try {
    const r = await fetch(CONFIG.GAS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload), signal: ctrl.signal });
    return await r.json();
  } finally { clearTimeout(timer); }
}

async function loadPublicPortal() {
  try {
    const j = await fetch(CONFIG.GAS_URL + "?action=publicPortal").then(r => r.json());
    if (j && j.ok) {
      portal.maintenance = j.maintenance || { enabled: false, message: "" };
      if (j.cms) { state = Object.assign({}, DEFAULTS, j.cms); writeJSON(K.pub, state); }
      portal.impact = j.impact || portal.impact;
      portal.events = j.events || [];
      portal.gallery = j.gallery || [];
      portal.pdInfo = j.pdInfo || [];
      portal.newsRights = j.newsRights || [];
      portal.columns = j.columns || [];
      portal.forumTopics = j.forumTopics || [];
      applyMaintenanceGuard();
    }
  } catch (e) {
  } finally {
    isPortalLoading = false;
    renderCurrentView();
  }

async function authenticate() {
  if (!lineToken) return;
  try {
    const r = await api({ action: "authUser", accessToken: lineToken });
    if (r.volunteerUrl) CONFIG.VOLUNTEER_URL = r.volunteerUrl;
    if (r.ok && r.registered) {
      me = r.user;
      if (Array.isArray(r.favorites) && r.favorites.length) {
        favorites = r.favorites; writeJSON(K.favs, favorites);

      if (me.status === "已核准") {

        if (isAnyAdmin()) loadAdminSummary();

    } else me = null;
    updateAdminNavVisibility();
    applyMaintenanceGuard();
    renderCurrentView();
  } catch (e) {}
}

/* ---------- 愛心碼 8730 條碼 (Code 39 *8730*) 與 LINE 轉傳 ---------- */
function renderLoveCode8730BarcodeSvg() {
  /* 標準 Code 39 編碼：* 8 7 3 0 * */
  const c39 = {
    '*': '010010100', '8': '100100010', '7': '000100110', '3': '110000001', '0': '000110100'
  };
  const seq = ['*', '8', '7', '3', '0', '*'];
  let x = 10, bars = "";
  seq.forEach(ch => {
    const pat = c39[ch];
    for (let i = 0; i < pat.length; i++) {
      const w = pat[i] === '1' ? 6 : 2.2;
      if (i % 2 === 0) bars += `<rect x="${x.toFixed(1)}" y="8" width="${w}" height="64" fill="#111827"/>`;
      x += w;
    }
    x += 3;
  });
  return `<svg viewBox="0 0 ${Math.ceil(x + 10)} 94" class="w-full max-w-xs mx-auto bg-white p-2 rounded-xl border-2 border-navy" role="img" aria-label="電子發票愛心碼 8730 條碼">${bars}<text x="${(x + 10) / 2}" y="88" text-anchor="middle" font-size="14" font-weight="900" fill="#1B365D" letter-spacing="4">* 8 7 3 0 *</text></svg>`;
}

/* ---------- LSVT BIG 語音帶練計時器 ---------- */
const lsvtTimer = { idx: 0, count: 0, running: false, voiceOn: true, timerId: null };
function stopLsvtTimer(reset = false) {
  lsvtTimer.running = false;
  if (lsvtTimer.timerId) { clearInterval(lsvtTimer.timerId); clearTimeout(lsvtTimer.timerId); lsvtTimer.timerId = null; }
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  if (reset) lsvtTimer.count = 0;
  updateLsvtWidgetUI();
}
function getTodayDoneCount() {
  const k = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Taipei" }).format(new Date());
  return (readJSON(K.lsvtStat) || {})[k] || 0;
}
function incTodayDoneCount() {
  const k = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Taipei" }).format(new Date());
  const rec = readJSON(K.lsvtStat) || {}; rec[k] = (rec[k] || 0) + 1; writeJSON(K.lsvtStat, rec);
}
function startLsvtRound() {
  if (lsvtTimer.running) return;
  const ex = LSVT_EXERCISES[lsvtTimer.idx];
  lsvtTimer.running = true; if (lsvtTimer.count >= 10) lsvtTimer.count = 0; updateLsvtWidgetUI();
  const begin = () => {
    if (!lsvtTimer.running) return;
    const tick = () => {
      if (!lsvtTimer.running) return;
      lsvtTimer.count += 1; updateLsvtWidgetUI();
      if (lsvtTimer.voiceOn) speakUtterance(lsvtTimer.count === 10 ? "十！非常棒！" : String(lsvtTimer.count), 1.05, 1.12);
      if (lsvtTimer.count >= 10) { clearInterval(lsvtTimer.timerId); lsvtTimer.timerId = null; lsvtTimer.running = false; incTodayDoneCount(); updateLsvtWidgetUI(); toast(`完成第 ${ex.step} 招！`); }
    };
    tick(); lsvtTimer.timerId = setInterval(tick, 1250);
  };
  if (lsvtTimer.count === 0 && lsvtTimer.voiceOn && ("speechSynthesis" in window)) { speakUtterance(ex.voiceIntro, 0.95, 1.05); lsvtTimer.timerId = setTimeout(begin, 4800); }
  else begin();
}
function updateLsvtWidgetUI() {
  const box = $("#lsvtTrainerBox"); if (!box) return;
  const ex = LSVT_EXERCISES[lsvtTimer.idx], done = getTodayDoneCount(), pct = Math.min(100, Math.round((lsvtTimer.count / 10) * 100));
  box.innerHTML = `
    <div class="rounded-3xl border-4 border-pine bg-white p-5 shadow-lg">
      <div class="flex flex-wrap items-center justify-between gap-2 border-b-2 border-slate-200 pb-3">
        <span class="pill" style="--pbg:#EAF4F0;--pfg:#2F6F5E">🏋️ LSVT BIG 帶練（第 ${ex.step} / ${LSVT_EXERCISES.length} 招）</span>
        <span class="text-sm font-black text-pine">🏆 今日完成：${done} 次</span>
      </div>
      <div class="mt-3 flex gap-1.5 overflow-x-auto pb-1.5">${LSVT_EXERCISES.map((it, i) => `<button type="button" onclick="selectLsvtStep(${i})" class="px-3.5 py-2 rounded-full text-sm font-black border-2 shrink-0 cursor-pointer ${i === lsvtTimer.idx ? 'bg-pine text-white border-pine' : 'bg-cream text-pine border-pine/40'}">${it.step}. ${it.icon}</button>`).join("")}</div>
      <div class="mt-3 rounded-2xl p-4 border-2 border-pine/30" style="background:#EAF4F0"><h3 class="text-xl font-black text-navy">${ex.icon} ${ex.name}</h3><p class="mt-1.5 text-base text-ink">${ex.cue}</p></div>
      <div class="mt-5 flex flex-col items-center justify-center">
        <div class="w-36 h-36 rounded-full border-8 ${lsvtTimer.running ? 'border-sundeep bg-amber-50 big-pulse' : 'border-pine bg-cream'} flex flex-col items-center justify-center">
          <span class="text-xs font-black ${lsvtTimer.running ? 'text-sundeep' : 'text-pine'}">${lsvtTimer.count === 0 ? "準備大聲數數" : lsvtTimer.count >= 10 ? "完成！" : "跟著大聲喊"}</span>
          <span class="text-5xl font-black leading-none mt-1 text-navy">${lsvtTimer.count === 0 ? "GO" : lsvtTimer.count}</span>
        </div>
        <div class="w-full max-w-md h-4 bg-slate-200 rounded-full overflow-hidden mt-4"><div class="h-full bg-pine transition-all duration-300" style="width:${pct}%"></div></div>
      </div>
      <div class="mt-5 grid grid-cols-2 gap-3">
        ${!lsvtTimer.running ? `<button type="button" onclick="startLsvtRound()" class="btn btn-sun col-span-2 text-lg">▶️ 開始帶練（語音數 1 到 10）</button>` : `<button type="button" onclick="stopLsvtTimer(false)" class="btn btn-danger col-span-2 text-lg">⏸️ 暫停計時</button>`}
        <button type="button" onclick="selectLsvtStep((lsvtTimer.idx - 1 + LSVT_EXERCISES.length) % LSVT_EXERCISES.length)" class="btn btn-light">⬅️ 上一招</button>
        <button type="button" onclick="selectLsvtStep((lsvtTimer.idx + 1) % LSVT_EXERCISES.length)" class="btn btn-pine">⏭️ 下一招</button>
      </div>
    </div>`;
}
function selectLsvtStep(i) { stopLsvtTimer(true); lsvtTimer.idx = i; updateLsvtWidgetUI(); }

  box.innerHTML = list.length ? list.map(a => `

function selectPdCategory(cat) {
  pdCat = cat;
  document.querySelectorAll("#pdCatBar .tab").forEach(btn => {
    btn.setAttribute("aria-selected", String(btn.dataset.cat === cat));
  });
  updatePdListOnly();
}

function renderPdInfoPage(root) {
  const cats = ["ALL", ...new Set(portal.pdInfo.map(a => a.category).filter(Boolean))];
  root.innerHTML = `
    <div class="rounded-3xl p-5 text-white shadow-md" style="background:#0369A1">
      <p class="eyebrow" style="color:#BAE6FD">公開知識庫・免登入閱讀</p>

    </div>

    <div id="pdCatBar" class="mt-3 flex gap-2 overflow-x-auto pb-1.5">
      ${cats.map(c => `<button type="button" class="tab shrink-0" style="--tc:#0369A1" data-cat="${esc(c)}" aria-selected="${pdCat === c}" onclick="selectPdCategory(this.dataset.cat)">${c === "ALL" ? "✨ 全部分類" : esc(c)}</button>`).join("")}
    </div>
    <div id="pdListContainer" class="mt-4 dual-grid-2"></div>`;

  let isComposing = false;
  const inp = $("#pdSearchInput");
  if (inp) {
    inp.addEventListener("compositionstart", () => { isComposing = true; });
    inp.addEventListener("compositionend", e => {
      isComposing = false;
      pdKw = e.target.value.trim();
      updatePdListOnly();
    });
    inp.addEventListener("input", e => {
      if (!isComposing) {
        pdKw = e.target.value.trim();
        updatePdListOnly();
      }
    });
  }
  updatePdListOnly();
}

    if (r && r.ok) await loadPublicPortal();
  });
}

function compressImageToBase64(file, maxSide = 1400, quality = 0.8) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (Math.max(w, h) > maxSide) {
          const r = maxSide / Math.max(w, h); w = Math.round(w * r); h = Math.round(h * r);
        }
        const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(cv.toDataURL("image/jpeg", quality));
      };
      img.onerror = () => resolve(reader.result);
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

    const r = await api({ action: "reviewForumTopic", accessToken: lineToken, topicId, status, reviewNote });
    toast((r && r.message) || "已更新");
    if (r && r.ok) {
      await Promise.all([loadMyDashboard(true), loadAdminSummary(true)]);
      renderCurrentView();
    }
  });
}

    masterUsersCache = r.users || [];
    const pending = masterUsersCache.filter(u => u.status === "待總管審查");
    const list = pending.length ? pending : masterUsersCache.slice(0, 12);
    panel.innerHTML = `
      <section class="card p-5" style="--c:#1B365D">
        <h2 class="text-xl font-black text-navy">🪪 總管會員審查與授權（待審 ${pending.length} 人／總計 ${masterUsersCache.length} 人）</h2>

async function saveUserReview(uid, btn) {

    const r = await api({ action: "reviewUser", accessToken: lineToken, targetUid: uid, role: rl, status: st, modules: (u && u.modules) || ["FORUM","PD_INFO","EVENT","FINANCE"] });

async function enterEditByLine() {

}

};
