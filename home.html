function rich(t) {
  const out = []; let p = [], l = [];
  const fp = () => { if (p.length) { out.push('<p>' + p.map(esc).join('<br>') + '</p>'); p = []; } };
  const fl = () => { if (l.length) { out.push('<ul>' + l.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>'); l = []; } };
  String(t || '').split(/\r?\n/).forEach(line => {
    if (!line.trim()) { fp(); fl(); return; }
    if (/^## /.test(line)) { fp(); fl(); out.push('<h3>' + esc(line.slice(3)) + '</h3>'); return; }
    if (/^- /.test(line)) { fp(); l.push(line.slice(2)); return; }
    fl(); p.push(line);
  });
  fp(); fl();
  return out.join('');
}

function chkState() { try { return JSON.parse(localStorage.getItem('pd_chk')||'{}')||{}; } catch { return {}; } }
function applyChecklist(init) {
  const boxes = document.querySelectorAll('[data-chk]');
  if (!boxes.length) return;
  const st = chkState();
  let n = 0;
  boxes.forEach(b => { if (init) b.checked = !!st[b.dataset.chk]; if (b.checked) n++; });
  const bar = $('#pbarIn'), txt = $('#pbarTxt');
  if (bar) bar.style.width = (n/boxes.length*100)+'%';
  if (txt) txt.textContent = `已完成 ${n} / ${boxes.length} 項`;
}
function chkChanged(el) {
  const st = chkState();
  st[el.dataset.chk] = el.checked;
  try { localStorage.setItem('pd_chk',JSON.stringify(st)); } catch {}
  applyChecklist(false);
}

   {h:'居家安全警告',b:BOX('warn','⚠️','嗅覺退化的致命危機','<p>許多病友確診前就失去嗅覺，聞不到瓦斯外洩或電線走火的焦味。</p><p>家中有帕金森患者，<strong>廚房與臥室務必安裝瓦斯外洩警報器與煙霧偵測器（住警器）</strong>。</p>')},
   {h:'家人請這樣看待',b:'<p>「冷漠」常被誤會成「懶惰」或「不想理人」，其實是疾病造成的。家人請用<strong>理解取代責備</strong>，溫和地邀請對方一起做事。</p>'}
  ],notes:['嗅覺差、便秘、睡眠行為異常，可能早於動作症狀數年出現。','冷漠是疾病表現，不是懶惰。','安裝瓦斯與煙霧警報器，保護安全。']},
  {id:5,part:1,ic:'💊',title:'藥物治療',sub:'左旋多巴與它的夥伴們',secs:[
   {h:'三大類藥物',b:'<div class="pk-tw"><table><tr><th>藥物</th><th>作用</th><th>備註</th></tr><tr><td><strong>左旋多巴</strong></td><td>直接補充多巴胺的前驅物</td><td>療效最好，是治療基石</td></tr><tr><td><strong>多巴胺受體促效劑</strong></td><td>模擬多巴胺作用</td><td>早期或輔助使用</td></tr><tr><td><strong>COMT／MAO-B 抑制劑</strong></td><td>延緩多巴胺被分解</td><td>與左旋多巴併用，延長藥效</td></tr></table></div>'},
   {h:'需要特別留意的副作用',b:BOX('warn','⚠️','衝動控制障礙','<p>使用「多巴胺受體促效劑」的病友，少數人可能出現<strong>無法控制的購物、賭博、暴食</strong>等行為。</p><p>家人如發現異常，請立即告知醫師，不要責罵，這是藥物的副作用。</p>')+L([['🤢','噁心、頭暈、姿勢性低血壓（站起來會暈）。'],['😵','幻覺或意識混亂（尤其是高齡者）。'],['🔄','長期使用後可能出現不自主的扭動（異動症）。']])+'<p>有任何不舒服，請先回診討論，<strong>不要自行停藥或調整劑量</strong>。</p>'}
  ],notes:['左旋多巴仍是最有效的基石藥物。','用藥組合與劑量需由醫師量身調整。','出現衝動行為或幻覺，請立即告知醫師。']},
  {id:6,part:1,ic:'⏰',title:'用藥實戰智慧',sub:'時間、飲食與副作用管理',secs:[
   {h:'蛋白質會搶走藥效',b:'<p>左旋多巴和食物中的蛋白質，在腸道與血腦屏障要走同一條「胺基酸通道」。蛋白質太多，藥就吸收不好。</p>'+L([['🌙','<strong>建議：</strong>白天少量蛋白質、晚餐再補足。'],['🍚','服藥盡量與正餐間隔 30-60 分鐘。'],['⚠️','若需要特別限制蛋白質，請與醫師或營養師討論，避免營養不良。']])},
   {h:'「開關現象」與「藥效減退」',b:L([['🎚️','<strong>開關現象（On-Off）：</strong>藥效突然消失或突然恢復，症狀忽好忽壞。'],['📉','<strong>藥效減退（Wearing-off）：</strong>下一顆藥還沒到時間，症狀就提早出現。']])+'<p>這兩種情形在中、長期使用藥物時很常見，<strong>不是您做錯了什麼</strong>，醫師可以調整藥物來改善。</p>'},
   {h:'做好「開關日誌」',b:BOX('tip','💡','怎麼記錄？','<p>每天記下：<strong>吃藥時間、症狀好的時段、症狀差的時段、特別事件</strong>（如跌倒、吃了什麼）。</p><p>回診時給醫師看，是精準調藥的重要依據。</p>')+L([['⏰','設定手機鬧鐘或使用藥盒，避免漏藥。'],['📒','用紙本表格也可以，簡單最重要。']])+'<p><a href="#/newcomer/diary">👉 前往「症狀日誌」列印表格</a></p>'}
  ],notes:['蛋白質會與左旋多巴競爭吸收。','白天低蛋白、晚餐補足，並與服藥錯開。','「開關日誌」是回診最有用的工具。']},
  {id:7,part:2,ic:'🏃',title:'動起來',sub:'運動處方全解析',secs:[
   {h:'運動是良藥',b:'<p>規律運動，是帕金森病治療中「良藥」等級的方法。就算再忙、再累，也請每天動一動。</p>'+L([['🥋','<strong>太極拳：</strong>改善平衡與姿勢穩定，降低跌倒風險。'],['🔠','<strong>LSVT-BIG（大動作訓練）：</strong>刻意放大動作幅度，讓日常動作更流暢。'],['📢','<strong>LSVT-LOUD（大聲說話訓練）：</strong>改善聲音太小、口齒不清。'],['🚶','<strong>雙杖健走：</strong>提供視覺與節奏提示，自然放大步伐。']])},
   {h:'運動小提醒',b:L([['👫','盡量有人陪伴，或在安全的環境下進行。'],['🪑','平衡不好時，扶著穩固的桌椅練習。'],['⏱️','從每天 10-15 分鐘開始，慢慢增加。'],['💊','最好在藥效較好的時段運動。']])},
   {h:'凍結步態怎麼辦？',b:'<p>「凍結步態」是走到一半或剛要起步時，腳像黏在地上。以下「提示技巧」很有用：</p>'+L([['👀','<strong>視覺提示：</strong>在地上貼橫向膠帶，當成要跨越的線。'],['🎵','<strong>聽覺提示：</strong>跟著口令「1、2、1、2」或固定節拍的音樂走。'],['⚖️','先把重心移到一腳，再大步跨出。'],['🛑','不要急著拉扯或催促，給對方幾秒鐘。']])},
   {h:'居家防跌',b:L([['💡','走道與廁所裝夜燈。'],['🚿','浴室鋪防滑墊，並裝扶手。'],['🧶','移除地毯、電線等絆腳物。'],['👟','穿防滑、合腳的鞋子，不穿拖鞋。']])+NOTE(['每天規律運動。','善用視覺、聽覺提示對抗凍結步態。','居家環境整理是最便宜的防跌方法。'])}
  ],notes:['規律運動是治療的重要一環。','提示技巧可改善凍結步態。']},
  {id:8,part:2,ic:'⚡',title:'手術治療選項',sub:'當藥物不再夠用',secs:[
   {h:'DBS 是什麼？',b:'<p>「深腦刺激術（DBS）」是在大腦特定位置植入細小電極，以電流訊號調節異常的神經迴路，改善顫抖、僵硬等症狀。</p><p>它<strong>不是根治</strong>，也不會停止疾病進展，但可以讓藥量減少、症狀波動減輕。</p>'},
   {h:'誰適合？',b:L([['✅','藥物效果有限，或副作用難以忍受。'],['✅','對左旋多巴仍有良好反應。'],['✅','沒有嚴重失智或精神問題。'],['🩺','是否適合，需由神經內科與神經外科團隊評估。']])},
   {h:'健保給付',b:'<p>台灣健保自<strong>民國 111 年 6 月</strong>起，已將 DBS 整套醫材（含立體定位套組）完整納入給付範圍，大幅減輕經濟負擔。</p><p>詳細條件請向醫院的個案管理師詢問。</p>'}
  ],notes:['DBS 適合藥物效果受限或副作用大的病友。','健保自 111 年 6 月起完整給付。','是否適合由醫療團隊評估。']},
  {id:9,part:2,ic:'🥗',title:'吃出穩定',sub:'營養與飲食管理指南',secs:[
   {h:'便秘管理三大原則',b:L([['🥦','<strong>多吃纖維：</strong>每天 5 份以上蔬菜水果。'],['💧','<strong>多喝水：</strong>每天 1500-2000cc（腎臟或心臟疾病者請先問醫師）。'],['🥛','<strong>吃發酵食品：</strong>如優格、味噌，補充益生菌。']])},
   {h:'吞嚥與進食安全',b:L([['🪑','坐直吃飯，頭微微向前低。'],['🥄','小口慢慢吃，吃完再吃下一口。'],['🍲','食物切小、煮軟，必要時使用增稠劑。'],['⚠️','常嗆咳、吃飯很久，請告訴醫師，安排吞嚥評估。']])},
   {h:'飲食與用藥配合',b:'<p>飲食不要和服藥分開計畫。建議與醫師、營養師一起安排「何時吃藥、何時吃蛋白質、何時補水」。</p>'+NOTE(['便秘要靠水分、纖維與運動一起處理。','吞嚥困難要及早評估。','飲食與服藥時間要互相配合。'])}
  ],notes:['便秘是常見的自律神經症狀。','吞嚥困難不要拖。']},
  {id:10,part:3,ic:'💙',title:'走過診斷後的哀傷期',sub:'情緒是需要被照顧的',secs:[
   {h:'哀傷的五個階段',b:'<p>確診後，很多人會經歷：</p><p><span class="pill">1 否認</span><span class="pill">2 憤怒</span><span class="pill">3 討價還價</span><span class="pill">4 憂鬱</span><span class="pill">5 接受</span></p><p>順序不一定，也可能來回。<strong>允許自己悲傷，是療癒的第一步。</strong></p>'},
   {h:'憂鬱是疾病的一部分',b:'<p>帕金森病的憂鬱有神經生理的基礎，確診前後約 2 年是高風險期。這<strong>不是意志力薄弱</strong>。</p>'+L([['💬','常用且與帕金森藥物交互作用較低的抗憂鬱藥有 SSRI、Mirtazapine、Bupropion 等，實際用藥請由醫師評估。'],['🧘','運動、曬太陽、固定作息、與朋友往來，都有幫助。']])},
   {h:'需要立刻求助的情況',b:BOX('warn','🆘','請馬上告訴醫師或家人','<p>若持續情緒低落、失眠、不想吃東西，或有<strong>傷害自己的念頭</strong>，請立即求助。</p><p>安心專線：<strong>1925</strong>（24 小時免付費）。</p>')}
  ],notes:['憂鬱是疾病常見的一部分，可以治療。','不要獨自承受，勇敢求助。']},
  {id:11,part:3,ic:'👨👩👧',title:'與家人重新對話',sub:'好好說話，就是最好的支持',secs:[
   {h:'用「我訊息」說話',b:L([['✅','<strong>我訊息：</strong>「我需要感覺自己還能做一些事。」'],['❌','<strong>你訊息：</strong>「你每次都不讓我做事！」']])+'<p>「我訊息」說的是自己的感受與需要，比較不會讓對方感到被指責。</p>'},
   {h:'溝通小技巧',b:L([['🐢','放慢速度，給病友多一點回應時間。'],['📌','一次只講一件事，指令簡單明確。'],['👀','面對面、看著眼睛說話。'],['🔊','病友聲音小時，請溫和地請對方再說一次，不要不耐煩。']])},
   {h:'家庭會議',b:'<p>每週或每月開一次家庭會議，一起討論照顧分工、下次回診、遇到的困難。</p>'+L([['📅','固定時間，例如每週日晚餐後。'],['🗒️','輪流發言、記錄決議。'],['💬','先說感謝，再說困難。']])}
  ],notes:['說話放慢、簡化、面對面。','定期家庭會議可分散照顧責任、預防衝突。']},
  {id:12,part:4,ic:'🌸',title:'照顧者的自我照顧',sub:'照顧別人，也要照顧自己',secs:[
   {h:'照顧是一場馬拉松',b:'<p>照顧帕金森病友是長期的路，累了就要休息。您照顧好自己，才有力氣照顧家人。</p>'+L([['😮💨','覺得累、煩、生氣，都是正常的，不是不愛對方。'],['😴','維持自己的睡眠、飲食與健康檢查。'],['☕','每天為自己留一點屬於自己的時間。']])},
   {h:'申請喘息服務',b:'<p>撥打長照專線 <span class="pill">1966</span>，可申請居家或機構的「喘息服務」，讓您暫時休息。</p>'},
   {h:'給自己「足夠好」的許可',b:'<p>不需要完美。「足夠好」的照顧者，就是最好的照顧者。</p>'+NOTE(['長照專線 1966 是喘息服務的入口。','允許自己「足夠好」而不是「完美」。'])}
  ],notes:['照顧者的健康同樣重要。','善用喘息服務與各種資源。']},
  {id:13,part:4,ic:'🕊️',title:'放手的藝術',sub:'尊重、尊嚴與自主',secs:[
   {h:'照顧不等於代勞',b:'<p>在安全的前提下，鼓勵病友自己完成力所能及的事，能保有尊嚴與自信，也減輕照顧者的負擔。</p>'},
   {h:'實際做法',b:L([['⏱️','多給一點時間，讓病友自己慢慢穿衣、吃飯。'],['🛠️','善用輔具：防滑墊、扶手、加粗握把餐具、穿鞋輔助器。'],['🙋','主動請家人、朋友與專業人員幫忙，不必獨自承擔。']])},
   {h:'平衡安全與自主',b:NOTE(['「適度放手」是尊重，不是不關心。','在安全與自主之間取得平衡，是長期照顧的核心。','遇到不確定的情況，請與醫療團隊討論。'])}
  ],notes:['適度放手是一種愛。']},
  {id:14,part:5,ic:'📍',title:'台灣在地資源總整理',sub:'需要時，知道可以找誰',secs:[
   {h:'常用電話',b:'<div class="tel"><span class="n">1966</span>長照專線：居家照顧、日間照顧、喘息服務、輔具</div><div class="tel"><span class="n">1925</span>安心專線：24 小時心理支持</div><div class="tel"><span class="n">119</span>緊急救護：跌倒受傷、嚴重嗆咳、意識不清</div>'},
   {h:'醫療與病友資源',b:L([['🏥','<strong>動作障礙門診：</strong>建議到有神經內科動作障礙專科的醫學中心或區域醫院。'],['👫','<strong>病友團體：</strong>各地醫院與病友協會常舉辦聯誼、運動與衛教活動，可向就診醫院洽詢。'],['🧑⚕️','<strong>個案管理師：</strong>可協助 DBS、衛教與資源轉介。']])+'<p><a href="#/events">👉 看本會近期活動</a>　<a href="#/forum">👉 病友論壇</a></p>'},
   {h:'溫馨聲明',b:BOX('warn','⚠️','請注意','<p>本指南僅供衛教參考，<strong>不能取代醫師的診斷與治療</strong>。用藥或飲食調整前，請先與您的醫療團隊討論。</p>')}
  ],notes:['長照 1966、安心 1925、緊急 119。','本指南不能取代醫師建議。']}
  ];

  };
  var PROBLEMS=[['🤲','手抖、走路不穩、容易跌倒',7],['🚽','便秘、吞嚥不順',9],['⏰','吃藥時間、藥效忽好忽壞',6],['😔','心情不好、不想做事',10],['😮💨','照顧得好累',12],['💊','想知道藥物與副作用',5],['⚡','聽說可以開刀（DBS）',8],['📞','需要電話與資源',14]];

    h+='</div></div><div class="pk-card"><h3>📞 常用電話</h3><div class="tel"><span class="n">1966</span>長照專線（喘息、居家照顧）</div><div class="tel"><span class="n">1925</span>安心專線（24 小時心理支持）</div><div class="tel"><span class="n">119</span>緊急救護</div></div>';
    h+='<div class="pk-card"><h3>📚 全部章節</h3>';
    PARTS.forEach(function(p,i){h+='<div class="part">'+p+'</div>';C.filter(function(c){return c.part===i}).forEach(function(c){h+='<button type="button" class="pk-btn" onclick="pkGo(\'c'+c.id+'/0\')"><span class="ic">'+c.ic+'</span><span>'+cname(c)+'<small>'+c.sub+'</small></span></button>'})});
    return h+'</div></div>';
  }
  function path(k){
    var g=GUIDE[k];if(!g)return home();
    var h='<div class="pk"><div class="pk-card"><div class="crumb"><a href="#/learn">認識帕金森</a> › 閱讀建議</div><h2>'+g.ic+' '+g.t+'</h2><p>建議您依照順序閱讀，每章只要幾分鐘。</p>';
    g.p.forEach(function(id,i){var c=C[id-1];h+='<button type="button" class="pk-btn" onclick="pkGo(\'c'+id+'/0\')"><span class="ic">'+(i+1)+'</span><span>'+cname(c)+'<small>'+c.sub+'</small></span></button>'});
    return h+homeBtn+'</div></div>';
  }
  function chapter(id,i){
    var c=C[id-1];if(!c)return home();
    var n=c.secs.length+1;
    i=Math.max(0,Math.min(n-1,i||0));
    var h='<div class="pk"><div class="pk-card"><div class="crumb"><a href="#/learn">認識帕金森</a> › '+PARTS[c.part]+' › 第'+c.id+'章</div>';
    h+='<h2>'+c.ic+' '+cname(c)+'</h2><p class="pk-sub">'+c.sub+'</p>';
    h+='<p><strong>第 '+(i+1)+' 段／共 '+n+' 段</strong></p><div class="pk-prog" aria-hidden="true"><div style="width:'+((i+1)/n*100)+'%"></div></div><div class="pk-steps">';
    c.secs.forEach(function(s,j){h+='<button type="button" class="'+(j===i?'on':'')+'" onclick="pkGo(\'c'+id+'/'+j+'\')">'+(j+1)+'. '+s.h+'</button>'});
    h+='<button type="button" class="'+(i===n-1?'on':'')+'" onclick="pkGo(\'c'+id+'/'+(n-1)+'\')">📝 重點整理</button></div></div><div class="pk-card">';
    if(i<c.secs.length)h+='<h3>'+(i+1)+'. '+c.secs[i].h+'</h3>'+c.secs[i].b;
    else h+='<h3>📝 本章重點整理</h3>'+NOTE(c.notes)+'<p>讀完了！您可以繼續看下一章，或回指南首頁選其他主題。</p>';
    h+='<div class="pk-nav"><button type="button" '+(i===0?'disabled':'')+' onclick="pkGo(\'c'+id+'/'+(i-1)+'\')">⬅️ 上一段</button>';
    if(i<n-1)h+='<button type="button" class="primary" onclick="pkGo(\'c'+id+'/'+(i+1)+'\')">下一段 ➡️</button>';
    else if(id<C.length)h+='<button type="button" class="primary" onclick="pkGo(\'c'+(id+1)+'/0\')">下一章 ➡️</button>';
    else h+='<button type="button" class="primary" onclick="pkGo(\'home\')">🏠 回指南首頁</button>';
    return h+'</div><div class="pk-nav"><button type="button" onclick="pkGo(\'home\')">🏠 指南首頁</button><button type="button" onclick="pkGo(\'c'+id+'/0\')">↩️ 本章重頭看</button></div></div></div>';
  }
  function search(q){
    q=String(q||'').trim();
    if(!q)return home();
    var re=new RegExp(rx(q),'gi'),res=[];
    C.forEach(function(c){c.secs.forEach(function(s,j){
      var all=s.h+' '+txt(s.b),m=all.search(re);
      if(m>=0){
        var st=Math.max(0,m-25),sn=esc(all.substr(st,90)).replace(new RegExp(rx(esc(q)),'gi'),function(x){return '<mark>'+x+'</mark>'});
        res.push('<button type="button" class="pk-result" onclick="pkGo(\'c'+c.id+'/'+j+'\')"><b>'+c.ic+' '+cname(c)+' › '+s.h+'</b><br>'+(st>0?'…':'')+sn+'…</button>');
      }
    })});
    return '<div class="pk"><div class="pk-card"><div class="crumb"><a href="#/learn">認識帕金森</a> › 搜尋</div><h2>🔎 搜尋結果</h2><div class="pk-search"><input id="pkq" type="search" aria-label="搜尋指南" value="'+esc(q)+'" onkeydown="if(event.key===\'Enter\')pkSearch()"><button type="button" onclick="pkSearch()">搜尋</button></div><p>找到 <strong>'+res.length+'</strong> 個與「'+esc(q)+'」相關的段落：</p>'+(res.join('')||'<p>找不到相關內容，請換個說法，例如「藥」「運動」「便秘」。</p>')+homeBtn+'</div></div>';
  }
  return function(a,b){
    if(!a)return home();
    var m=a.match(/^c(\d+)$/);
    if(m)return chapter(+m[1],parseInt(b,10)||0);
    if(a==='path')return path(b);
    if(a==='s')return search(b);
    return home();
  };
})();

window.pkSearch=function(){var q=(document.getElementById('pkq')||{}).value;q=String(q||'').trim();if(q)location.hash='#/learn/s/'+encodeURIComponent(q);};

function daysUntil(dateStr) {
  if (!dateStr) return null;
  return Math.round((new Date(dateStr + 'T00:00:00') - new Date(todayStr() + 'T00:00:00')) / 86400000);
}

        };
        if (withHealth) Object.assign(payload, {
          diagnosisYear: val('pfDx', el), doctor: val('pfDoc', el), hospital: val('pfHos', el),
          medication: val('pfMed', el), surgery: val('pfSur', el), specialNeeds: val('pfNeed', el)
        });
        try {
          const r = await api('member.updateProfile', payload);
          setMember(r.member, r.webProfile);
        } catch (x) { err.innerHTML = alertHtml(x.message); return; }
        drawNavigation();
        toast('資料已儲存', 'ok'); goMember('profile');
      });
    });
  }
});

const VOL_GROUPS_LIST = ['活動支援組','病友關懷組','復健陪伴組','行政庶務組','宣導攝影組','專案志工組'];

function statusTag(st) {
  return statusBadge(st);

function tableHtml(headers, rows, emptyMsg) {
  if (!rows || !rows.length) return emptyHtml(emptyMsg || '目前沒有資料', '📭');
  return '<div class="table-wrap"><table class="tbl stack"><thead><tr>' +
    headers.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') +
    '</tr></thead><tbody>' +
    rows.map(function (r) {
      return '<tr>' + r.map(function (cell, idx) {
        return '<td data-label="' + esc(headers[idx] || '') + '">' + (cell == null ? '' : cell) + '</td>';
      }).join('') + '</tr>';
    }).join('') +
    '</tbody></table></div>';
}
function createAttachmentPicker(container, initialAtt, folderName) {
  if (!container) return { uploadAll: async function () { return { photos: [], files: [], links: [] }; } };
  const p = 'vp_' + Math.random().toString(36).slice(2, 7);
  container.innerHTML = mediaEditorHtml(p);
  const ctl = bindMediaEditor(container, p, initialAtt, folderName || 'volunteer');
  return {
    uploadAll: async function () {
      if (ctl.isUploading()) throw new Error('照片或檔案正在上傳中，請稍候完成再送出');
      return ctl.getValue();
    }
  };
}

function openHoursFormModal(opts, onDone) {

          fieldHtml({ id: 'vhGroup', label: '服務組別', type: 'select', options: VOL_GROUPS_LIST, value: o.defaultGroup || '活動支援組' }) +
          fieldHtml({ id: 'vhDate', label: '服務日期', type: 'date', required: true, value: todayTW() }) +
        '</div>' +

          fieldHtml({ id: 'vhHours', label: '服務時數（小時）', type: 'number', required: true, value: 3, min: 0.5, step: '0.5' }) +

        '</div>' +

      '</form>',
    footer:
      '<button type="button" class="btn btn-gray" data-close>取消</button>' +
      '<button type="button" class="btn" id="vhSaveBtn">' + (isAdminAdd ? '✅ 直接登錄並核定時數' : '📤 送出時數申報') + '</button>'
  });

  const picker = createAttachmentPicker(m.$('#vhAttachBox'), []);

  if (shiftSel) {
    shiftSel.addEventListener('change', function () {
      const sid = shiftSel.value;
      const found = (o.shifts || []).find(function (x) { return x.shiftId === sid; });
      if (found) {
        m.$('#vhTitle').value = found.title;
        m.$('#vhDate').value = found.date;
        m.$('#vhHours').value = found.hours;
        m.$('#vhGroup').value = found.group || '活動支援組';
      }

}

  const curZ = zoneKey || S.adminZone || 'web';

function zoneForPage_(pageKey) {
  if (['eventHub','Events','Registrations','Highlights'].indexOf(pageKey) !== -1) return 'event';
  if (['volunteers'].indexOf(pageKey) !== -1) return 'volunteer';
  if (['dashboard','members','payReview','donReview','income','expenses','receipts','vouchers','budget','projects','subjects','accounts','reports','staff','settings','Donations'].indexOf(pageKey) !== -1) return 'finance';
  if (['News','announce','Resources','pages','ForumPosts','ForumReplies','Board','Docs','FAQ','config','Members'].indexOf(pageKey) !== -1) return 'web';
  return S.adminZone || getMyZones()[0] || 'web';
}

function drawAside() {
  const helloName = (S.member && S.member.name) || (ME && (ME.name || ME.displayName)) || '管理員';
  const roleLabel = S.role || (ME && ME.financeRole) || '管理員';
  const curZ = S.adminZone || zoneForPage_(adminPage);
  const zoneObj = ADMIN_ZONES.find(function (z) { return z.key === curZ; }) || ADMIN_ZONES[0];
  const lineTag = hasLineBound()
    ? '<span class="badge b-ok" style="font-size:.72rem">✅ 已綁定 LINE</span>'
    : '<span class="badge b-warn" style="font-size:.72rem">⚠️ 未綁定 LINE</span>';

  let html = '<button type="button" class="btn btn-gray side-close" data-sideclose>✕ 關閉選單</button>' +
    '<h1>⚙️ 後台管理系統</h1>' +
    '<div class="small" style="color:#cfe0ea;padding:0 8px 6px">' + esc(helloName) + '（' + esc(roleLabel) + '）<div style="margin-top:4px">' + lineTag + '</div></div>' +
    '<div class="side-zone-grid" role="group" aria-label="四大分區切換">' +
      ADMIN_ZONES.map(function (z) {
        const allowed = hasZone(z.key);
        return '<button type="button" class="side-zone-btn' + (curZ === z.key ? ' on' : '') + (!allowed ? ' locked' : '') + '" data-adm-zone="' + esc(z.key) + '">' +
          '<span>' + z.num + '. ' + esc(z.title.replace('前台','').replace('［獨立專區］','').replace('專區','')) + (allowed ? '' : '🔒') + '</span>' +
        '</button>';
      }).join('') +
    '</div>';

  let lastGroup = null;
  zoneObj.items.forEach(function (it) {
    if (it.grp !== lastGroup) {
      html += '<div class="grp">' + esc(it.grp) + '</div>';
      lastGroup = it.grp;
    }
    const isCurrent = it.key === adminPage;
    const href = it.href || (it.action ? 'javascript:void(0);' : ('#/admin/' + esc(it.key)));
    const actionAttr = it.action ? (' data-action="' + esc(it.action) + '"') : '';
    const wCount = it.wbadge && counts[it.wbadge === 'ForumPosts' ? 'pendingPosts' : it.wbadge === 'ForumReplies' ? 'pendingReplies' : 'pendingMembers'] || 0;
    html += '<a href="' + href + '" class="' + (isCurrent ? 'on' : '') + '"' + (isCurrent ? ' aria-current="page"' : '') + actionAttr + '>' +
      '<span>' + (it.icon || '•') + ' ' + esc(it.title) + '</span>' +
      (it.badge ? '<span class="badge b-bad" data-badge="' + esc(it.badge) + '" hidden></span>' : '') +
      (it.wbadge ? '<span class="badge b-bad" data-wbadge="' + esc(it.wbadge) + '"' + (wCount ? '' : ' hidden') + '>' + (wCount || '') + '</span>' : '') +
      '</a>';
  });

  html += '<div class="grp">快速跳轉</div>';
  html += '<a href="#/admin/permissions" class="' + (adminPage === 'permissions' ? 'on' : '') + '"><span>🔐 LINE 綁定與四大區權限</span></a>';
  html += '<a href="#/"><span>🏠 回前台官網（直接編輯內容）</span></a>';

  $('#aside').innerHTML = html;
}

      '<div class="seg" id="mbSeg" role="group" aria-label="會員篩選"></div>' +
      '<p class="muted small" id="mbCount" aria-live="polite"></p>' +

        '<tbody id="mbBody"></tbody></table></div></div>';

    function draw() {
      const segs = [['all', '全部'], ['active', '有效'], ['inactive', '未生效／過期'], ['admin', '管理角色']];
      $('#mbSeg', el).innerHTML = segs.map(function (s) {
        return '<button type="button" data-f="' + s[0] + '" aria-pressed="' + (flt === s[0]) + '">' + s[1] + '</button>';
      }).join('');
      const items = all.filter(function (m) {
        if (flt === 'active' && !m.isActive) return false;
        if (flt === 'inactive' && m.isActive) return false;
        if (flt === 'admin' && ADMIN_TYPES.indexOf(m.type) === -1) return false;
        return !kw || (m.name + m.phone + m.memberId + m.nickname).toLowerCase().indexOf(kw) !== -1;
      });
      $('#mbCount', el).textContent = '共 ' + items.length + ' 位';
      $('#mbBody', el).innerHTML = items.length ? items.map(function (m) {
        return '<tr><td data-label="編號">' + esc(m.memberId) + '</td><td data-label="姓名"><b>' + esc(m.name) + '</b></td>' +
          '<td data-label="手機">' + esc(m.phone) + '</td><td data-label="類型">' + esc(m.type) + '</td>' +
          '<td data-label="會籍">' + (m.isActive ? '<span class="badge dot b-ok">有效</span>' : '<span class="badge dot b-gray">未生效</span>') + '</td>' +

          '<td><button type="button" class="btn btn-sm btn-outline" data-mid="' + esc(m.memberId) + '">查看</button></td></tr>';
      }).join('') : '<tr><td colspan="7">' + emptyHtml('沒有符合的會員', '🔍') + '</td></tr>';
    }
    $('#mbKw', el).addEventListener('input', function (e) { kw = e.target.value.trim().toLowerCase(); draw(); });
    $('#mbSeg', el).addEventListener('click', function (e) { const b = e.target.closest('[data-f]'); if (b) { flt = b.getAttribute('data-f'); draw(); } });
    $('#mbBody', el).addEventListener('click', function (e) {
      const b = e.target.closest('[data-mid]');
      if (b) run(b, function () { return openMemberDetail(b.getAttribute('data-mid'), canEdit); });
    });
    if (canEdit) $('#mbAdd', el).addEventListener('click', openMemberAdd);
    draw();
  }
});

function reviewPage(o) {

      '<div class="alert info" style="margin-top:12px">確認入帳後，系統會自動開立電子收據、記入流水帳並更新帳戶餘額。<br>請先核對憑證與銀行入帳，再按「確認入帳」。</div>' +

      (items.length ? items.map(function (r) { return reviewCardHtml(r, o.kind); }).join('') : emptyHtml('目前沒有待處理的申請', '✅'));

    $('#rvAdd', el).addEventListener('click', function () { o.kind === 'fee' ? openPaymentAdd(null) : openDonationAdd(); });
    el.addEventListener('click', function (e) {
      const c = e.target.closest('[data-confirm]'), j = e.target.closest('[data-reject]');
      if (c) run(c, async function () {
        const id = c.getAttribute('data-confirm'), r = items.filter(function (x) { return x.id === id; })[0]; if (!r) return;
        if (!(await confirmDialog('確認收到 ' + r.name + ' 的 ' + fmtMoney(r.amount) + '？\n按下後會立即入帳並開立收據。', { okText: '確認入帳' }))) return;
        const res = await api(o.confirmAction, { id: id });
        toast('已入帳，收據編號 ' + res.receiptNo, 'ok'); reloadAdmin();
      });
      if (j) run(j, async function () {
        const reason = await askReason('退回申請', '退回原因（會顯示給會員）', '確定退回');
        if (!reason) return;

      });
    });
  };
}

function subjectOptions(subjects, type) {

function intAmount(txt) {
  const t = String(txt).replace(/,/g, '').trim();
  if (!/^\d+$/.test(t) || Number(t) <= 0) throw new Error('請輸入大於 0 的整數金額');

}

    (rows.length ? rows.map(function (r) {
      return '<tr>' + cols.map(function (c) {
        const v = c.f ? c.f(r) : r[c.k];
        return '<td' + (c.num ? ' class="num"' : '') + '>' + (c.raw ? v : esc(v == null ? '' : v)) + '</td>';
      }).join('') + '</tr>';
    }).join('') : '<tr><td colspan="' + cols.length + '" class="muted center">沒有資料</td></tr>') +
    '</tbody>' + (foot ? '<tfoot>' + foot + '</tfoot>' : '') + '</table></div>';
}

  m.$('[data-ok]').addEventListener('click', function (e) {

      try { await o.onSubmit(m); } catch (x) { m.$('#fmErr').innerHTML = alertHtml(x.message); return; }

  });

}

registerAdminPage({
  key: 'expenses', title: '支出管理', icon: '🧾', group: '財務', roles: null,
  badge: function (d) { return d.pending.expenses + d.pending.toPay; },
  render: async function (el) {
    const items = (await api('expense.list', {})).items;
    let flt = '待處理';
    const canApply = can('EXP_APPLY');
    const filters = ['待處理', '待核准', '已核准', '已撥款', '已退回', '全部'];

    el.innerHTML =
      '<div class="row"><h1 style="margin:0">支出管理與憑證單</h1><span class="spacer"></span>' +
      (canApply ? '<button type="button" class="btn" id="exAdd">＋ 申請支出</button>' : '') + '</div>' +
      '<div class="alert info" style="margin-top:12px">流程：<b>申請 → 核准 → 撥款</b>。' +
        (ADMIN_BYPASS_SOD && isSuper() ? '您是管理員，可自行完成整個流程。' : '內部控制：三個步驟必須由不同人執行。') + '<br>' +
        '每筆支出都可列印「支出憑證單」，黏貼發票後交會計歸檔。</div>' +
      '<div class="seg" id="exSeg" role="group" aria-label="支出狀態篩選"></div>' +
      '<div id="exList" aria-live="polite"></div>';

    function card(e) {
      const me = S.member.memberId;
      const showApprove = e.status === '待核准' && can('EXP_APPROVE') && sodOk(e.applicantId === me);
      const showPay = e.status === '已核准' && can('EXP_PAY') && sodOk(e.applicantId === me || e.approvedById === me);
      const showReject = (e.status === '待核准' || e.status === '已核准') && can('EXP_REJECT_UI');
      return '<div class="item"><div class="row"><span class="title">' + esc(e.payee) + '</span>' + statusBadge(e.status) +
        '<span class="spacer"></span><span class="bold" style="font-size:1.15rem">' + fmtMoney(e.amount) + '</span></div>' +
        '<div class="small">' + esc(e.description) + '</div>' +
        '<div class="small muted">' + esc(e.id) + '｜' + esc(fmtDate(e.date)) + '｜' + esc(e.subjectCode + ' ' + e.subjectName) +
          (e.projectName ? '｜專案：' + esc(e.projectName) : '') + '</div>' +
        '<div class="small muted">付款帳戶：' + esc(e.account) + '｜受款帳號：' + esc(e.payeeAccount) + '</div>' +
        '<div class="small muted">申請：' + esc(e.applicant) + (e.approvedBy ? '｜核准：' + esc(e.approvedBy) : '') +
          (e.paidBy ? '｜撥款：' + esc(e.paidBy) : '') + (e.voucherNo !== '--' ? '｜傳票：' + esc(e.voucherNo) : '') + '</div>' +
        (e.rejectReason ? '<div class="alert err" style="margin:8px 0 0">退回原因：' + esc(e.rejectReason) + '</div>' : '') +
        '<div class="row" style="margin-top:10px">' +
          '<button type="button" class="btn btn-sm btn-purple" data-vdoc="' + esc(e.id) + '">🖨️ 支出憑證單</button>' +
          (e.fileUrl ? '<button type="button" class="btn btn-sm btn-outline" data-viewfile="' + esc(e.fileUrl) + '">📎 附件</button>' : '') +
          '<span class="spacer"></span>' +
          (showReject ? '<button type="button" class="btn btn-sm btn-danger" data-rej="' + esc(e.id) + '">退回</button>' : '') +
          (showApprove ? '<button type="button" class="btn btn-sm" data-app="' + esc(e.id) + '">核准</button>' : '') +
          (showPay ? '<button type="button" class="btn btn-sm" data-pay="' + esc(e.id) + '">確認撥款</button>' : '') +
        '</div></div>';
    }
    function draw() {
      $('#exSeg', el).innerHTML = filters.map(function (f) { return '<button type="button" data-f="' + f + '" aria-pressed="' + (f === flt) + '">' + f + '</button>'; }).join('');
      const list = items.filter(function (e) {
        return flt === '全部' || (flt === '待處理' ? (e.status === '待核准' || e.status === '已核准') : e.status === flt);
      });
      $('#exList', el).innerHTML = list.length ? list.map(card).join('') : emptyHtml('沒有符合的支出', '🧾');
    }
    draw();
    $('#exSeg', el).addEventListener('click', function (e) { const b = e.target.closest('[data-f]'); if (b) { flt = b.getAttribute('data-f'); draw(); } });
    if (canApply) $('#exAdd', el).addEventListener('click', openExpenseApply);

    el.addEventListener('click', function (e) {
      const v = e.target.closest('[data-vdoc]'), a = e.target.closest('[data-app]'), r = e.target.closest('[data-rej]'), p = e.target.closest('[data-pay]');
      const find = function (id) { return items.filter(function (x) { return x.id === id; })[0]; };
      if (v) run(v, function () { return showExpenseVoucher(v.getAttribute('data-vdoc')); });
      if (a) run(a, async function () {
        const x = find(a.getAttribute('data-app')); if (!x) return;
        if (!(await confirmDialog('核准 ' + x.payee + ' 的支出 ' + fmtMoney(x.amount) + '？\n' + x.description, { okText: '核准' }))) return;
        await api('expense.approve', { id: x.id }); toast('已核准', 'ok'); reloadAdmin();
      });
      if (r) run(r, async function () {
        const reason = await askReason('退回支出申請', '退回原因', '確定退回'); if (!reason) return;
        await api('expense.reject', { id: r.getAttribute('data-rej'), reason: reason }); toast('已退回', 'ok'); reloadAdmin();
      });
      if (p) run(p, async function () {
        const x = find(p.getAttribute('data-pay')); if (!x) return;
        if (!(await confirmDialog('確認從「' + x.account + '」撥款 ' + fmtMoney(x.amount) + ' 給 ' + x.payee + '？\n撥款後會扣除帳戶餘額並產生傳票，無法復原。', { okText: '確認撥款', danger: true }))) return;
        const res = await api('expense.confirmPaid', { id: x.id });
        toast('已撥款，傳票 ' + res.voucherNo, 'ok'); await reloadAdmin();
        if (await confirmDialog('是否現在列印支出憑證單？', { okText: '列印' })) showExpenseVoucher(x.id);
      });
    });
  }
});

async function openExpenseApply() {
  const ref = await loadRefs();
  if (!ref.accounts.length) { toast('請先到「資金帳戶」建立帳戶', 'err'); return; }
  const subs = subjectOptions(ref.subjects, '支出');
  if (!subs.length) { toast('請先到「會計科目」建立支出科目', 'err'); return; }
  openForm({
    title: '申請支出', okText: '送出申請', wide: true,
    body: '<p class="small muted">申請人：<b>' + esc(S.member.name) + '</b>（由登入身分自動帶入）</p><div class="grid c2">' +
      fieldHtml({ id: 'exSub', label: '會計科目', type: 'select', required: true, options: subs }) +
      fieldHtml({ id: 'exDate', label: '支出日期', type: 'date', required: true, value: todayStr() }) +
      fieldHtml({ id: 'exAmt', label: '金額（元）', required: true, inputmode: 'numeric', maxlength: 9 }) +
      fieldHtml({ id: 'exAcc', label: '付款帳戶', type: 'select', required: true, options: accountOptions(ref.accounts) }) +
      fieldHtml({ id: 'exPayee', label: '受款人／單位', required: true, maxlength: 80 }) +
      fieldHtml({ id: 'exPAcc', label: '受款銀行與帳號', required: true, maxlength: 120, hint: '現金請寫「現金」。' }) +
      '</div>' + fieldHtml({ id: 'exDesc', label: '用途說明', type: 'textarea', required: true, maxlength: 200 }) +
      fieldHtml({ id: 'exProj', label: '專案（選填）', type: 'select', options: projectOptions(ref.projects) }) +
      fieldHtml({ id: 'exFile', label: '發票或單據（選填，支援任意圖片或檔案格式）', type: 'file', accept: '*/*' }),
    onSubmit: async function (m) {
      const amt = intAmount(val('exAmt', m.el));
      if (!val('exPayee', m.el) || !val('exPAcc', m.el) || !val('exDesc', m.el)) throw new Error('請完整填寫受款人、帳號與用途');
      const file = await filePayload($('#exFile', m.el));
      const r = await api('finance.addExpense', { subjectCode: val('exSub', m.el), date: val('exDate', m.el), amount: amt,
        account: val('exAcc', m.el), payee: val('exPayee', m.el), payeeAccount: val('exPAcc', m.el),
        description: val('exDesc', m.el), projectName: val('exProj', m.el), file: file });
      toast('已送出申請 ' + r.id, 'ok');
      if (r.budgetWarning) toast('⚠️ ' + r.budgetWarning, 'info');
      reloadAdmin();
    }
  });
}

/* =========================================================================
   十五、財務報表、前台內容彈窗、後台專案/頁面/權限與全域路由初始化
   ========================================================================= */

const REPORTS = [
  ['incomeExpenseStatement', '收支餘絀表'], ['ledger', '分類帳'], ['journal', '日記簿'], ['budgetComparison', '預算與決算比較表'],
  ['fundraising', '勸募活動收支報告'], ['bankReconciliation', '銀行存款調節表'], ['balanceSheet', '資產負債表（現金基礎）'],
  ['netAssetChanges', '淨資產變動表'], ['cashFlow', '現金流量表']
];
function periodText(y, m) { return '中華民國 ' + (y - 1911) + ' 年' + (m ? ' ' + m + ' 月' : '度'); }
function rptTbl(cols, rows, foot) {
  return '<table style="width:100%;border-collapse:collapse;font-size:.92rem"><thead><tr>' + cols.map(function (c) {
    return '<th style="background:#f1f5f9;border:1px solid #94a3b8;padding:6px 8px;text-align:' + (c.num ? 'right' : 'left') + '">' + esc(c.h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
    (rows.length ? rows.map(function (r) { return '<tr>' + cols.map(function (c) {
      const v = c.f(r); return '<td style="border:1px solid #cbd5e1;padding:6px 8px;text-align:' + (c.num ? 'right' : 'left') + (c.bold ? ';font-weight:900' : '') + '">' + esc(v) + '</td>'; }).join('') + '</tr>'; }).join('')
      : '<tr><td colspan="' + cols.length + '" style="border:1px solid #cbd5e1;padding:8px;text-align:center;color:#64748b">本期無資料</td></tr>') +
    '</tbody>' + (foot || '') + '</table>';
}
function rptFoot(cells) { return '<tfoot><tr>' + cells.map(function (c, i) { return '<td style="border:1px solid #94a3b8;padding:6px 8px;font-weight:900;background:#f8fafc;text-align:' + (i ? 'right' : 'left') + '">' + esc(c) + '</td>'; }).join('') + '</tr></tfoot>'; }
const M = fmtMoney;

function buildReportHtml(type, r, meta) {
  const name = REPORTS.filter(function (x) { return x[0] === type; })[0][1];
  let body = '';
  if (type === 'incomeExpenseStatement') {
    const cs = [{ h: '科目', f: function (x) { return x.subjectCode + ' ' + x.subjectName; } }, { h: '金額', num: true, f: function (x) { return M(x.amount); } }];
    body = '<h3>收入</h3>' + rptTbl(cs, r.income, rptFoot(['收入合計', M(r.totalIncome)])) + '<h3 style="margin-top:14px">支出</h3>' + rptTbl(cs, r.expense, rptFoot(['支出合計', M(r.totalExpense)])) +
      '<h3 style="margin-top:14px">本期' + (r.surplus >= 0 ? '賸餘' : '短絀') + '：' + esc(M(r.surplus)) + '</h3>';
  } else if (type === 'ledger') {
    body = '<p>期初餘額：<b>' + esc(M(r.openingBalance)) + '</b></p>' + rptTbl([{ h: '日期', f: function (x) { return x.date; } }, { h: '科目', f: function (x) { return x.subjectCode + ' ' + x.subjectName; } },
      { h: '摘要', f: function (x) { return x.description; } }, { h: '收入', num: true, f: function (x) { return x.debit ? M(x.debit) : ''; } }, { h: '支出', num: true, f: function (x) { return x.credit ? M(x.credit) : ''; } },
      { h: '餘額', num: true, f: function (x) { return M(x.balance); } }], r.items, rptFoot(['期末餘額', '', '', '', '', M(r.endingBalance)]));
  } else if (type === 'journal') {
    body = rptTbl([{ h: '日期', f: function (x) { return x.date; } }, { h: '單號', f: function (x) { return x.refNo; } }, { h: '科目', f: function (x) { return x.subjectCode + ' ' + x.subjectName; } },
      { h: '摘要', f: function (x) { return x.description; } }, { h: '借方', num: true, f: function (x) { return x.debit ? M(x.debit) : ''; } }, { h: '貸方', num: true, f: function (x) { return x.credit ? M(x.credit) : ''; } }], r.items);
  } else if (type === 'budgetComparison') {
    body = rptTbl([{ h: '科目', f: function (x) { return x.subjectName; } }, { h: '預算', num: true, f: function (x) { return M(x.budgetAmt); } }, { h: '決算（年度累計）', num: true, f: function (x) { return M(x.usedAmt); } },
      { h: '執行率', num: true, f: function (x) { return x.rate + '%'; } }, { h: '差異', num: true, f: function (x) { return M(x.remainAmt); } }], r.items);
  } else if (type === 'fundraising') {
    body = rptTbl([{ h: '日期', f: function (x) { return x.date; } }, { h: '捐款人', f: function (x) { return x.name; } }, { h: '用途', f: function (x) { return x.purpose; } },
      { h: '收據編號', f: function (x) { return x.receiptNo; } }, { h: '金額', num: true, f: function (x) { return M(x.amount); } }], r.items, rptFoot(['合計', '', '', '', M(r.totalAmount)]));
  } else if (type === 'bankReconciliation') {
    const line = function (k, v) { return '<tr><td style="border:1px solid #cbd5e1;padding:7px 8px">' + esc(k) + '</td><td style="border:1px solid #cbd5e1;padding:7px 8px;text-align:right">' + esc(v) + '</td></tr>'; };
    body = r.provided
      ? '<table style="width:100%;border-collapse:collapse"><tbody>' + line('銀行對帳單餘額', M(r.bankBalance)) + line('加：在途存款', M(r.depositsInTransit)) + line('減：未兌現支票／在途付款', M(r.outstandingChecks)) +
        line('調整後銀行餘額', M(r.adjustedBank)) + line('帳面餘額（系統流水帳）', M(r.bookBalance)) + line('差異（應為 0）', M(r.diff)) + '</tbody></table>' +
        (r.diff === 0 ? '<div class="alert ok" style="margin-top:10px">✅ 調節後相符。</div>' : '<div class="alert err" style="margin-top:10px">⚠️ 尚有差異 ' + esc(M(r.diff)) + '，請檢查未記錄的收支或手續費。</div>')
      : '<div class="alert warn">請在上方輸入「銀行對帳單餘額」後再查詢，才能進行調節。</div>' + rptTbl([{ h: '帳面餘額（系統）', f: function () { return M(r.bookBalance); } }], [1]);
    body += '<h3 style="margin-top:14px">各帳戶帳面餘額</h3>' + rptTbl([{ h: '帳戶', f: function (x) { return x.name; } }, { h: '帳面餘額', num: true, f: function (x) { return M(x.bookBalance); } }], r.accounts) +
      (r.systemConsistent === false ? '<div class="alert err" style="margin-top:10px">⚠️ 「資金帳戶」記錄的目前餘額（' + esc(M(r.systemBalance)) + '）與流水帳計算不一致，請管理員檢查。</div>' : '');
  } else if (type === 'balanceSheet') {
    const cs = [{ h: '項目', f: function (x) { return x.name; } }, { h: '金額', num: true, f: function (x) { return M(x.amount); } }];
    body = '<h3>資產</h3>' + rptTbl(cs, r.assets, rptFoot(['資產總計', M(r.totalAssets)])) + '<h3 style="margin-top:14px">負債</h3>' + rptTbl(cs, r.liabilities, rptFoot(['負債總計', M(r.totalLiabilities)])) +
      '<h3 style="margin-top:14px">淨資產</h3>' + rptTbl(cs, r.netAssets, rptFoot(['淨資產總計', M(r.totalNetAssets)])) + '<div class="report-note">' + esc(r.note) + '</div>';
  } else if (type === 'netAssetChanges') {
    body = rptTbl([{ h: '項目', f: function (x) { return x.name; } }, { h: '期初', num: true, f: function (x) { return M(x.initAmt); } }, { h: '本期增加', num: true, f: function (x) { return M(x.addAmt); } },
      { h: '本期減少', num: true, f: function (x) { return M(x.decAmt); } }, { h: '期末', num: true, f: function (x) { return M(x.endAmt); } }], r.items) +
      '<div class="report-note">現金基礎：期初含帳戶初始餘額與之前累計收支。</div>';
  } else if (type === 'cashFlow') {
    body = rptTbl([{ h: '項目', f: function (x) { return (x.level ? '　　' : '') + x.name; } }, { h: '金額', num: true, f: function (x) { return x.amount === undefined ? '' : M(x.amount); } }], r.items);
  }
  return '<div class="report-print" style="background:#fff;padding:14px;color:#14202b">' +
    '<div class="report-head"><h2>' + esc(ORG_TITLE) + '</h2><h2>' + esc(name) + '</h2><div class="small">' + esc(periodText(meta.year, meta.month)) +
      (meta.project ? '｜專案：' + esc(meta.project) : '') + '</div></div>' + body +
    '<div class="report-note">列印時間：' + esc(todayStr()) + '　製表：' + esc(S.member.name) + '。本表為系統依流水帳自動產生，供內部參考；正式申報請經會計人員核對。</div></div>';
}

          p.bankBalance = num('rpBal'); p.depositsInTransit = num('rpDep') || 0; p.outstandingChecks = num('rpChk') || 0;

});

   十六、後台與前台內容維護（整合自訂問卷設計器於 Events 編輯）

async function openFrontCmsModal(sheetName, itemId, defaultValues) {
  let row = Object.assign({ status: 'published', publishDate: todayTW(), date: todayTW(), order: 10 }, defaultValues || {});
  if (itemId) {
    if (sheetName === 'News') row = await api('getNewsDetail', { id: itemId });
    else if (sheetName === 'Highlights') row = await api('getHighlightDetail', { id: itemId });
    else if (sheetName === 'Events') row = await api('getEventDetail', { id: itemId });
    else if (sheetName === 'Docs') {
      const all = await api('getDocs');
      row = all.find(x => x.id === itemId) || row;
    } else if (sheetName === 'Resources') {
      const all = await api('getResources');
      row = all.find(x => x.id === itemId) || row;
    } else if (sheetName === 'FAQ') {
      const all = await api('getFaq');
      row = all.find(x => x.id === itemId) || row;
    } else if (sheetName === 'Board') {
      const ab = await api('getAbout');
      row = (ab.board || []).find(x => x.id === itemId) || row;
    }
  }

  const isNew = !itemId;
  const titles = {
    News: isNew ? '＋ 新增最新消息' : '✏️ 編輯最新消息',
    Highlights: isNew ? '＋ 新增活動花絮' : '✏️ 編輯活動花絮',
    Events: isNew ? '＋ 新增活動（可規劃專屬問卷）' : '✏️ 編輯活動與問卷',
    Docs: isNew ? '＋ 新增下載檔案' : '✏️ 編輯下載檔案',
    Resources: isNew ? '＋ 新增衛教資源' : '✏️ 編輯衛教資源',
    FAQ: isNew ? '＋ 新增常見問題' : '✏️ 編輯常見問題',

    fieldsHtml =

        fieldHtml({ id: 'fcCat', label: '分類', type: 'select', options: NEWS_CATS, value: row.category || '公告' }) +
        fieldHtml({ id: 'fcDate', label: '發布日期', type: 'date', required: true, value: fmtD(row.publishDate) || todayTW() }) +
        fieldHtml({ id: 'fcStatus', label: '狀態', type: 'select', options: STATUS_PUB.map(x => ({ value: x[0], label: x[1] })), value: row.status || 'published' }) +
      '</div>' +

      fieldHtml({ id: 'fcContent', label: '內容（空一行＝新段落；「- 」開頭＝項目符號；「## 」開頭＝小標題）', type: 'textarea', value: row.content, maxlength: 30000 });
  } else if (sheetName === 'Highlights') {
    fieldsHtml =
      fieldHtml({ id: 'fcTitle', label: '活動花絮標題', required: true, value: row.title, maxlength: 200 }) +
      '<div class="grid c3">' +
        fieldHtml({ id: 'fcCat', label: '分類', type: 'select', options: HIGHLIGHT_CATS, value: row.category || '活動回顧' }) +
        fieldHtml({ id: 'fcDate', label: '活動日期', type: 'date', required: true, value: fmtD(row.date) || todayTW() }) +

      fieldHtml({ id: 'fcContent', label: '活動回顧與心得內容', type: 'textarea', value: row.content, maxlength: 30000 });

    fieldsHtml =

function copyTextFallback(text, label) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () {
      toast('已複製' + (label || '') + '：' + text, 'ok');
    }).catch(function () {
      fallbackExecCopy(text, label);
    });
  } else {
    fallbackExecCopy(text, label);
  }
}
function fallbackExecCopy(text, label) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    toast('已複製' + (label || '') + '：' + text, 'ok');
  } catch (e) {
    toast('請手動複製：' + text, 'info');
  }
}

document.addEventListener('submit',event=>{
  const form=event.target;
  if(!(form instanceof HTMLFormElement))return;
  if(!['registerForm','profileForm','postForm','replyForm','adminEditForm','memberEditForm','configForm','pageForm'].includes(form.id))return;
  event.preventDefault();
  if(!form.reportValidity())return;
  const button=form.querySelector('button[type=submit]');
  safely(()=>once(form.id,button,async()=>{
    if(form.id==='registerForm'){
      if(!requireLogin())return;
      const companions=Number(value('rComp'));
      if(!Number.isInteger(companions)||companions<0||companions>10)throw new Error('同行人數需為 0 到 10 的整數');
      if(!checked('rConsent'))throw new Error('請勾選同意蒐集個人資料');
      let answers = {};
      try {
        answers = collectFrontSurveyAnswers(form);
      } catch (err) {
        throw err;
      }
      await api('registerEvent',{eventId:form.dataset.id,name:value('rName'),phone:value('rPhone'),companions,note:value('rNote'),consent:true,answers:JSON.stringify(answers)});
      toast('✅ 報名成功','ok');location.hash='#/me';
    } else if(form.id==='profileForm'){
      ME=await api('updateProfile',{name:value('pName'),nickname:value('pNick'),phone:value('pPhone'),email:value('pEmail'),city:value('pCity'),identity:value('pIdentity')});
      drawNavigation();toast('✅ 已儲存','ok');
    } else if(form.id==='postForm'){
      if(!checked('fConsent'))throw new Error('請勾選確認事項');
      await api('createPost',{board:value('fBoard'),title:value('fTitle'),content:value('fContent'),consent:true});
      toast('✅ 已發表','ok');location.hash='#/forum';
    } else if(form.id==='replyForm'){
      await api('createReply',{postId:form.dataset.id,content:value('replyContent')});
      toast('✅ 已送出回覆','ok');await route();
    } else if(form.id==='adminEditForm'){
      const state=modalState;if(!state)throw new Error('表單已失效');
      if(state.uploading)throw new Error('請等待檔案上傳完成');
      const cfg=ADMIN_CONFIG[state.sheet],row={...state.row};
      cfg.fields.forEach(f=>{
        const el=document.getElementById('edit_'+f.key);
        if(el)row[f.key]=f.type==='checkbox'?(el.checked?'Y':''):el.value.trim();
      });
      if(!row[cfg.fields[0].key])throw new Error('請填寫「'+cfg.fields[0].label+'」');
      state.saving=true;
      try {
        await api('admin_save',{sheet:state.sheet,row});
        if(modalState===state)closeModal(true);
        toast('✅ 已儲存','ok');await route();
      } finally {state.saving=false;}
    } else if(form.id==='memberEditForm'){
      const state=modalState;if(!state)throw new Error('表單已失效');
      const zones = $$('[data-me-zone]:checked', form).map(cb => cb.getAttribute('data-me-zone'));
      const finalRole = zones.length > 0 ? 'admin' : value('memberRole');
      const patch={status:value('memberStatus'),role:finalRole,expireDate:value('memberExpiry'),identity:value('memberIdentity'),adminZones:zones};
      if(patch.role==='admin'&&state.row.role!=='admin'&&!(await confirmDialog('確定授予後台管理權限？',{okText:'確定授予'})))return;
      state.saving=true;
      try{
        await api('admin_patch',{sheet:'Members',id:state.row.userId,patch});
        closeModal(true);toast('✅ 已更新會員與四大區權限','ok');await route();
      }finally{state.saving=false;}
    } else if(form.id==='configForm'){
      const values={};
      form.querySelectorAll('[id^=cfg_]').forEach(el=>values[el.id.slice(4)]=el.value.trim());
      await api('admin_setConfig',{values});
      try{CFG=await api('getConfig');}catch(e){console.error(e);}
      drawFooter();drawGive();toast('✅ 已儲存，請到前台核對','ok');
    } else if(form.id==='pageForm'){
      await api('admin_savePage',{key:value('pgKey'),title:value('pgTitle'),content:value('pgContent')});
      toast('✅ 已儲存','ok');
    }
  }));
});

  const cmsDel = event.target.closest('[data-cms-del]');

    safely(() => deleteFrontCmsItem(cmsDel.getAttribute('data-cms-del'), cmsDel.getAttribute('data-id')));
    return;
  }
  const pgEdit = event.target.closest('[data-page-edit]');
  if (pgEdit) {
    const k = pgEdit.getAttribute('data-page-edit');
    safely(() => openPageEditModal(k, pgEdit.getAttribute('data-default-title'), TXT[k] || ''));
    return;
  }

  const fpNew = event.target.closest('[data-forum-post-new]');

  const fpEdit = event.target.closest('[data-forum-post-edit]');
  if (fpEdit && window._curForumPost) { openForumPostModal(window._curForumPost); return; }
  const flEdit = event.target.closest('[data-forum-list-edit]');
  if (flEdit && window._curForumList) {
    const p = window._curForumList.find(x => x.id === flEdit.getAttribute('data-forum-list-edit'));
    if (p) openForumPostModal(p);
    return;
  }
  const fpDel = event.target.closest('[data-forum-post-del]');
  if (fpDel) {
    safely(async () => {
      if (!(await confirmDialog('確定要刪除這篇文章嗎？', { danger: true, okText: '確定刪除' }))) return;
      await api('deletePost', { id: fpDel.getAttribute('data-forum-post-del') });
      toast('🗑️ 文章已刪除', 'ok');
      location.hash = '#/forum';
      route();
    });

  }
  const frNew = event.target.closest('[data-forum-reply-new]');
  if (frNew) { if (!requireLogin()) return; openForumReplyModal(null, frNew.getAttribute('data-forum-reply-new')); return; }
  const frEdit = event.target.closest('[data-forum-reply-edit]');
  if (frEdit && window._curForumReplies) {
    const rep = window._curForumReplies.find(x => x.id === frEdit.getAttribute('data-forum-reply-edit'));
    if (rep) openForumReplyModal(rep, frEdit.getAttribute('data-postid'));
    return;
  }
  const frDel = event.target.closest('[data-forum-reply-del]');
  if (frDel) {
    safely(async () => {
      if (!(await confirmDialog('確定要刪除這則回覆嗎？', { danger: true, okText: '確定刪除' }))) return;
      await api('deleteReply', { id: frDel.getAttribute('data-forum-reply-del') });
      toast('🗑️ 回覆已刪除', 'ok');
      route();
    });
    return;
  }

  const erEdit = event.target.closest('[data-ev-reg-edit]');
  if (erEdit && window._curEvRegs) {
    const reg = window._curEvRegs.find(x => x.id === erEdit.getAttribute('data-ev-reg-edit'));
    if (reg) openEventRegModal(erEdit.getAttribute('data-eventid'), reg);
    return;
  }
  const erDel = event.target.closest('[data-ev-reg-del]');
  if (erDel) {
    safely(async () => {
      if (!(await confirmDialog('確定刪除此筆報名紀錄？', { danger: true, okText: '刪除' }))) return;
      await api('admin_deleteRegistration', { id: erDel.getAttribute('data-ev-reg-del') });
      toast('🗑️ 已刪除報名紀錄', 'ok');
      route();
    });
    return;
  }

  const rcBtn = event.target.closest('[data-receipt]');
  if (rcBtn) { run(rcBtn, function () { return viewReceipt(rcBtn.getAttribute('data-receipt')); }); return; }
  const vfBtn = event.target.closest('[data-viewfile]');
  if (vfBtn) { run(vfBtn, function () { return viewFile(vfBtn.getAttribute('data-viewfile')); }); return; }
  if (event.target.closest('[data-act="logout"]')) { doLogout(); return; }
  if (event.target.closest('[data-sideclose]')) { setSidebar(false); $('#btnAdmMenu')?.focus(); return; }

  const ext=event.target.closest('a[data-ext]');
  if(ext&&window.liff&&liffReady&&liff.isInClient()){
    event.preventDefault();
    try{liff.openWindow({url:ext.href,external:true});}catch{window.open(ext.href,'_blank','noopener');}
    return;
  }

  const el=event.target.closest('[data-action]');
  if(!el)return;
  const action=el.dataset.action;
  safely(async()=>{
    if(action==='font-down')return changeFont(-1);
    if(action==='font-up')return changeFont(1);
    if(action==='contrast')return setContrast(!document.body.classList.contains('hc'));
    if(action==='toggle-edit')return toggleEditMode();
    if(action==='site-config-edit')return openSiteConfigQuickModal();
    if(action==='cms-new')return openFrontCmsModal(el.dataset.sheet, '', el.dataset.cat ? { category: el.dataset.cat } : {});
    if(action==='front-ann-new')return openAnnForm(null, function () { route(); });
    if(action==='ev-reg-add')return openEventRegModal(el.dataset.eventid, null);
    if(action==='ev-stats-view')return openEventSurveyStatsModal(el.dataset.eventid, el.dataset.eventtitle);
    if(action==='vol-report-export')return openVolunteerReportExportModal();
    if(action==='print')return window.print();
    if(action==='speak')return speak();
    if(action==='copy'){
      copyTextFallback(el.dataset.text||'', el.dataset.label||'');
      return;
    }
    if(action==='my-page'){location.hash='#/me';return;}
    if(action==='drawer'){
      $('#drawer').hidden=!$('#drawer').hidden;
      $('#menuBtn').setAttribute('aria-expanded',String(!$('#drawer').hidden));return;
    }
    if(action==='persona'){
      if(!PERSONAS[el.dataset.k])return;
      setPersona(el.dataset.k);
      const target='#/for/'+el.dataset.k;
      if(location.hash===target)return route();
      location.hash=target;return;
    }
    if(action==='persona-reset'){
      setPersona('');
      if(location.hash===''||location.hash==='#/'||location.hash==='#')return route();
      location.hash='#/';return;
    }
    if(action==='fav-toggle'){
      const f=getFavs(),i=f.findIndex(x=>x.h===location.hash);
      if(i>=0)f.splice(i,1);
      else{
        const t=($('#view h2,#view h1')?.textContent||'頁面').replace(/^[^\w一-鿿]+/,'').trim().slice(0,20)||'頁面';
        f.unshift({h:location.hash,t});
      }
      saveFavs(f);toast(i>=0?'已移除捷徑':'✅ 已加入我的捷徑','ok');return route();
    }
    if(action==='fav-del'){const f=getFavs();f.splice(Number(el.dataset.i),1);saveFavs(f);return route();}
    if(action==='login'){await lineLogin();return;}
    if(action==='logout'){await doLogout();return;}
    if(action==='modal-close')return closeModal();
    if(action==='qr-close'){$('#qrDialog').hidden=true;return;}
    if(action==='route-refresh')return route();
    if(action==='admin-refresh')return openAdmin(adminPage);
    if(action==='admin-new')return openEdit();
    if(action==='admin-edit')return openEdit(Number(el.dataset.index));
    if(action==='member-edit')return openMember(Number(el.dataset.index));
    if(action==='export-csv')return exportCsv();
    if(action==='remove-upload'){
      if(!modalState||modalState.uploading||modalState.saving)throw new Error('請等待目前操作完成');
      const k=el.dataset.field;modalState.row[k]='';
      const text=document.getElementById('edit_'+k);if(text)text.value='';
      $('#preview_'+k).replaceChildren();$('#uploadStatus_'+k).textContent='已移除，儲存後生效';return;
    }
    return once(action+':'+(el.dataset.id||el.dataset.index||''),el,async()=>{
      if(action==='admin-detail')return openDetail(Number(el.dataset.index));
      if(action==='show-qr')return showQR(el.dataset.id);
      if(action==='cancel-registration'){
        if(!(await confirmDialog('確定取消報名？',{danger:true,okText:'確定取消'})))return;
        await api('cancelRegistration',{id:el.dataset.id});toast('已取消','ok');return route();
      }
      if(action==='admin-status'){
        const sheet=adminPage,r=tableData[Number(el.dataset.index)],cfg=ADMIN_CONFIG[sheet];
        if(!r)throw new Error('資料已變更，請重新整理');
        if(!(await confirmDialog('確定更新為「'+el.dataset.status+'」？',{okText:'確定更新'})))return;
        await api('admin_patch',{sheet,id:r[cfg.key],patch:{status:el.dataset.status}});
        toast('✅ 已更新','ok');return route();
      }
      if(action==='admin-delete'){
        const sheet=adminPage,r=tableData[Number(el.dataset.index)];
        if(!r||!(await confirmDialog('確定永久刪除「'+(r.title||r.name||r.question||r.id)+'」？',{danger:true,okText:'永久刪除'})))return;
        await api('admin_delete',{sheet,id:r.id});toast('已刪除','ok');return route();
      }
      if(action==='camera')return toggleCamera();
      if(action==='checkin-refresh')return refreshCheckin();
      if(action==='checkin-manual'){
        const code=value('ckManual');if(!code)throw new Error('請輸入報到碼');
        $('#ckManual').value='';return submitCheckin(code);
      }
    });
  });
});

document.addEventListener('keydown',event=>{
  const topModal = modalStack[modalStack.length - 1];
  if (topModal) {
    if (event.key === 'Escape') { event.preventDefault(); topModal.close(false); return; }
    if (event.key === 'Tab') {
      const f = $$('a[href],button:not(:disabled),input:not(:disabled):not([type=hidden]),select:not(:disabled),textarea:not(:disabled),[tabindex]:not([tabindex="-1"])', topModal.el)
        .filter(function (e) { return e.offsetParent !== null; });
      if (!f.length) return;
      const a = f[0], z = f[f.length - 1];
      if (event.shiftKey && document.activeElement === a) { event.preventDefault(); z.focus(); }
      else if (!event.shiftKey && document.activeElement === z) { event.preventDefault(); a.focus(); }
    }
    return;
  }
  const overlay=!$('#qrDialog').hidden?$('#qrDialog'):!$('#adminDialog').hidden?$('#adminDialog'):null;
  if(event.key==='Escape'){
    if(!$('#qrDialog').hidden)$('#qrDialog').hidden=true;
    else closeModal();
  }
  if(event.key==='Tab'&&overlay){
    const items=[...overlay.querySelectorAll('button,input,select,textarea,a[href]')].filter(x=>!x.disabled&&x.getClientRects().length);
    if(!items.length)return;
    const first=items[0],last=items[items.length-1];
    if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
    else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
  }
});

/* ===== 路由主函式 ===== */
const NAV_GROUP_MAP = {
  home:'home', start:'home', for:'home', my:'home', news:'home', announcements:'home',
  events:'events', highlights:'events',
  learn:'learn', newcomer:'learn', family:'learn', resources:'learn', faq:'learn',
  forum:'forum',
  support:'support', fee:'support', donate:'support', invoice:'support',
  volunteer:'volunteer',
  about:'about', downloads:'about',
  me:'me', profile:'me'
};

async function route() {
  const seq=++routeSeq;++adminSeq;++ckSeq;
  try{window.speechSynthesis&&speechSynthesis.cancel();}catch{}
  const segments=location.hash.replace(/^#\/?/,'').split('/').map(v=>{try{return decodeURIComponent(v);}catch{return v;}});
  const page=segments[0]||'home';
  $('#drawer').hidden=true;$('#menuBtn').setAttribute('aria-expanded','false');
  $('#qrDialog').hidden=true;closeModal(true);
  $('#pub').hidden=['admin','checkin'].includes(page);
  $('#adm').hidden=page!=='admin';
  $('#ck').hidden=page!=='checkin';
  if(page!=='checkin')safely(stopCamera);
  window.scrollTo(0,0);

  if(page==='admin')return openAdmin(segments[1]||'dashboard');
  if(page==='checkin'){
    if(!isAdmin()){
      $('#ck').hidden=true;$('#pub').hidden=false;
      $('#view').innerHTML='<h2>簽到權限不足</h2>'+(isLoggedIn()?'<p>此功能僅限啟用中的管理員。</p><a href="#/">回首頁</a>':loginCard());
      measureDock();
      return;
    }
    return safely(refreshCheckin);
  }

  curPage = NAV_GROUP_MAP[page] || page;
  markNav();
  measureDock();
  $('#view').innerHTML=loadingHtml();
  try {
    if (['me','announcements','fee','donate','volunteer','profile'].includes(page)) {
      await renderMemberRoute(page, $('#view'));
      if(seq!==routeSeq)return;
      const h=$('#view h1,#view h2');
      document.title=(h?h.textContent.trim()+'｜':'')+'台灣帕金森病友權益促進會';
      $('#view').focus({preventScroll:true});
      return;
    }
    let html;
    if(page==='forum')html=await PAGES.forum(segments[1],segments[1]==='b'?segments[2]:null);
    else if(Object.hasOwn(PAGES,page))html=await PAGES[page](segments[1],segments[2]);
    else html='<h2>找不到頁面</h2><a href="#/">回首頁</a>';
    if(seq!==routeSeq)return;
    $('#view').innerHTML=toolBar(page)+html;
    applyChecklist(true);
    const h=$('#view h2,#view h1');
    document.title=(h&&page!=='home'?h.textContent.trim()+'｜':'')+'台灣帕金森病友權益促進會';
    $('#view').focus({preventScroll:true});
  }catch(e){
    if(seq!==routeSeq)return;
    $('#view').innerHTML=`<div class="card"><h2>載入失敗</h2><p>${esc(e.message)}</p>${btn('route-refresh','重新載入','btn gh')}</div>`;
  }
}

window.addEventListener('hashchange',()=>safely(route));
window.addEventListener('visibilitychange',()=>{
  if(document.hidden)safely(stopCamera);
});
window.addEventListener('pagehide',()=>{safely(stopCamera);});

(async()=>{
  drawNavigation();
  syncEditModeBtn();
  drawFooter();drawGive();
  await initLiff();

  const tok = loadToken();
  if (tok) {
    S.token = tok;
    try {
      const r = await api('auth.me', {}, { silent: true });
      setMember(r.member, r.webProfile);
    } catch (e) {
      S.token = ''; clearToken();
    }
  }

  let noauto = false;
  try { noauto = !!sessionStorage.getItem(NOAUTO_KEY); } catch (e) {}
  if (!S.member && liffReady && window.liff && !noauto && liff.isLoggedIn()) {
    try {
      idToken = liff.getIDToken();
      if (idToken) {
        const res = await api('login');
        ME = res;
        if (res.token && res.member) {
          S.token = res.token;
          storeToken(res.token, true);
          setMember(res.member, res);
        } else if (res.needsBinding && res.ticket) {
          S.pendingBind = { ticket: res.ticket, lineName: res.lineName };
        }
      }
    } catch (e) {
      console.warn(e);
    }
  }

  drawNavigation();
  try { CFG = await api('getConfig'); } catch (e) { console.error(e); }
  drawFooter();drawGive();
  await route();
})().catch(e=>{console.error(e);toast(e.message,'err');});
</script>
