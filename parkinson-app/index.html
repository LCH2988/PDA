<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>帕金森溫馨交流園地</title>
  
  <!-- PWA 支援 -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#143e24">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            parkinson: {
              darkBg: '#091a0f', // 極深綠（降低眼部疲勞）
              primary: '#0f2f14', // 深綠（AAA對比色）
              secondary: '#164e23', // 中綠
              accent: '#facc15', // 亮黃（視覺焦點）
              btn: '#1b733a', // 顯眼按鈕綠
              btnHover: '#0f2f14',
              contrastText: '#ffffff'
            }
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --base-font-size: 22px; /* 適合長者的預設大字體 */
    }
    body {
      font-size: var(--base-font-size);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      touch-action: manipulation; /* 消除手機雙擊延遲 */
    }
    .accessible-touch-target {
      min-height: 60px;
      padding: 12px 20px;
    }
    .accessible-focus:focus {
      outline: 6px solid #facc15 !important;
      outline-offset: 4px;
    }
  </style>
  <script>
    // 註冊 Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log(err));
      });
    }
  </script>
</head>
<body class="text-slate-900 pb-32">

  <!-- 頂部高對比標頭 -->
  <header class="bg-parkinson-primary text-white shadow-lg sticky top-0 z-40 border-b-4 border-parkinson-accent">
    <div class="px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-heart-pulse text-4xl text-parkinson-accent"></i>
        <div>
          <h1 class="text-2xl font-black tracking-wide">帕金森溫馨園地</h1>
          <p class="text-emerald-300 text-sm font-bold">復健陪伴 ‧ 每日打卡</p>
        </div>
      </div>
      <button onclick="switchTab('settings-tab')" class="accessible-touch-target bg-parkinson-secondary text-white rounded-2xl border-2 border-emerald-500 flex items-center justify-center accessible-focus">
        <i class="fa-solid fa-gear text-2xl"></i>
      </button>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="max-w-md mx-auto px-3 py-4 space-y-4">

    <!-- 1. 交流動態牆分頁 -->
    <section id="wall-tab" class="tab-content space-y-4">
      <!-- 每日健康打卡快速入口 (長者最愛) -->
      <div class="bg-amber-50 p-4 rounded-3xl border-4 border-parkinson-accent shadow-md space-y-3">
        <h3 class="text-xl font-black text-slate-900 flex items-center gap-2">
          <i class="fa-solid fa-calendar-check text-amber-600 text-2xl"></i>
          <span>今日健康打卡</span>
        </h3>
        
        <!-- 藥物打卡 -->
        <div class="space-y-2">
          <p class="text-base font-black text-slate-700">💊 藥物定時打卡：</p>
          <div class="grid grid-cols-4 gap-1.5">
            <button onclick="toggleTracker('med_morning')" id="btn-med_morning" class="accessible-touch-target rounded-xl font-black text-sm border-2 border-slate-300 bg-white">早</button>
            <button onclick="toggleTracker('med_noon')" id="btn-med_morning" class="accessible-touch-target rounded-xl font-black text-sm border-2 border-slate-300 bg-white">中</button>
            <button onclick="toggleTracker('med_evening')" id="btn-med_morning" class="accessible-touch-target rounded-xl font-black text-sm border-2 border-slate-300 bg-white">晚</button>
            <button onclick="toggleTracker('med_bedtime')" id="btn-med_morning" class="accessible-touch-target rounded-xl font-black text-sm border-2 border-slate-300 bg-white">睡前</button>
          </div>
        </div>

        <!-- 運動打卡 -->
        <div class="space-y-2 pt-1">
          <p class="text-base font-black text-slate-700">🏃 復健運動打卡：</p>
          <div class="grid grid-cols-2 gap-2">
            <button onclick="toggleTracker('exe_run')" id="btn-exe_run" class="accessible-touch-target rounded-xl font-black text-base border-2 border-slate-300 bg-white flex items-center justify-center gap-1">
              <span>🏃 超慢跑</span>
            </button>
            <button onclick="toggleTracker('exe_balance')" id="btn-exe_balance" class="accessible-touch-target rounded-xl font-black text-base border-2 border-slate-300 bg-white flex items-center justify-center gap-1">
              <span>🙌 平衡操</span>
            </button>
          </div>
        </div>
      </div>

      <!-- 篩選分類 -->
      <div class="bg-white p-3 rounded-3xl shadow-md border-2 border-slate-200">
        <div class="grid grid-cols-2 gap-2">
          <button onclick="filterCategory('全部')" class="cat-btn active accessible-touch-target rounded-2xl font-black text-lg bg-parkinson-primary text-white border-2 border-parkinson-primary" data-cat="全部">全部文章</button>
          <button onclick="filterCategory('用藥與復健')" class="cat-btn accessible-touch-target rounded-2xl font-black text-lg bg-slate-100 text-slate-800 border-2 border-slate-300" data-cat="用藥與復健">💊 用藥復健</button>
          <button onclick="filterCategory('經驗分享')" class="cat-btn accessible-touch-target rounded-2xl font-black text-lg bg-slate-100 text-slate-800 border-2 border-slate-300" data-cat="經驗分享">💡 經驗分享</button>
          <button onclick="filterCategory('我的收藏')" class="cat-btn accessible-touch-target rounded-2xl font-black text-lg bg-amber-100 text-amber-900 border-2 border-amber-400" data-cat="我的收藏">⭐ 我的收藏</button>
        </div>
      </div>

      <div id="postsList" class="space-y-4"></div>
    </section>

    <!-- 2. 我要發文分頁 -->
    <section id="post-tab" class="tab-content hidden space-y-4">
      <div class="bg-white p-5 rounded-3xl shadow-md border-2 border-emerald-600 space-y-4">
        <h2 class="text-2xl font-black text-parkinson-primary border-b-2 border-slate-100 pb-2 flex items-center gap-2">
          <i class="fa-solid fa-pen-to-square"></i>
          <span>發表新貼文</span>
        </h2>

        <div>
          <label class="block font-black mb-1 text-slate-800">1. 選擇主題分類</label>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" onclick="selectFormCategory('經驗分享', this)" class="form-cat-btn active accessible-touch-target rounded-2xl font-black text-base border-2 border-parkinson-primary bg-parkinson-primary text-white">💡 經驗分享</button>
            <button type="button" onclick="selectFormCategory('用藥與復健', this)" class="form-cat-btn accessible-touch-target rounded-2xl font-black text-base border-2 border-slate-300 bg-slate-50 text-slate-800">💊 用藥復健</button>
            <button type="button" onclick="selectFormCategory('照護心得', this)" class="form-cat-btn accessible-touch-target rounded-2xl font-black text-base border-2 border-slate-300 bg-slate-50 text-slate-800">🤝 照護心得</button>
            <button type="button" onclick="selectFormCategory('門診諮詢', this)" class="form-cat-btn accessible-touch-target rounded-2xl font-black text-base border-2 border-slate-300 bg-slate-50 text-slate-800">🩺 門診備忘</button>
          </div>
          <input type="hidden" id="postCategory" value="經驗分享">
        </div>

        <div class="space-y-1">
          <label class="block font-black text-slate-800" for="postTitle">2. 填寫標題</label>
          <input type="text" id="postTitle" placeholder="例如：今天散步走了20分鐘" class="accessible-touch-target w-full border-2 border-slate-300 rounded-2xl px-4 text-lg font-bold accessible-focus">
          <button type="button" onclick="startSpeechRecognition('postTitle', this)" class="accessible-touch-target w-full bg-red-100 hover:bg-red-200 text-red-700 font-black rounded-2xl border-2 border-red-400 flex items-center justify-center gap-2">
            <i class="fa-solid fa-microphone text-2xl"></i>
            <span>按我用語音輸入標題</span>
          </button>
        </div>

        <div class="space-y-1">
          <label class="block font-black text-slate-800" for="postContent">3. 填寫詳細內容</label>
          <textarea id="postContent" rows="4" placeholder="寫下今天的身體狀況..." class="w-full border-2 border-slate-300 rounded-2xl p-4 text-lg font-bold accessible-focus"></textarea>
          <button type="button" onclick="startSpeechRecognition('postContent', this)" class="accessible-touch-target w-full bg-red-100 hover:bg-red-200 text-red-700 font-black rounded-2xl border-2 border-red-400 flex items-center justify-center gap-2">
            <i class="fa-solid fa-microphone text-2xl"></i>
            <span>按我用語音輸入內容</span>
          </button>
        </div>

        <button onclick="handleCreatePost()" class="accessible-touch-target w-full bg-parkinson-btn hover:bg-parkinson-btnHover text-white text-xl font-black rounded-2xl shadow-lg border-2 border-emerald-700 flex items-center justify-center gap-2">
          <i class="fa-solid fa-paper-plane"></i>
          <span>確認送出貼文</span>
        </button>
      </div>
    </section>

    <!-- 3. 門診諮詢卡分頁 (功能大幅擴充) -->
    <section id="doctor-tab" class="tab-content hidden space-y-4">
      <div class="bg-white p-5 rounded-3xl shadow-md border-2 border-sky-600 space-y-4" id="printableArea">
        <h2 class="text-2xl font-black text-sky-900 border-b-2 border-slate-100 pb-2 flex items-center gap-2">
          <i class="fa-solid fa-notes-medical text-sky-600"></i>
          <span>門診復健諮詢卡</span>
        </h2>

        <!-- 每日打卡統計區 (提供給醫師的重要參考指標) -->
        <div class="bg-sky-50 p-4 rounded-2xl border-2 border-sky-200 space-y-2">
          <h3 class="font-black text-sky-950 text-lg"><i class="fa-solid fa-chart-line mr-1"></i>近期遵醫囑與復健統計</h3>
          <div class="grid grid-cols-2 gap-2 text-base font-bold text-slate-700">
            <div class="bg-white p-2.5 rounded-xl border border-sky-100">
              <p class="text-xs text-slate-400">💊 服藥達成率</p>
              <p class="text-xl font-black text-sky-700" id="medRateDisplay">100%</p>
            </div>
            <div class="bg-white p-2.5 rounded-xl border border-sky-100">
              <p class="text-xs text-slate-400">🏃 復健運動次數</p>
              <p class="text-xl font-black text-emerald-700" id="exeCountDisplay">0 次</p>
            </div>
          </div>
        </div>

        <div id="doctorReportContent" class="space-y-3"></div>

        <button onclick="window.print()" class="accessible-touch-target w-full bg-sky-700 hover:bg-sky-800 text-white font-black rounded-2xl shadow-lg flex items-center justify-center gap-2 print:hidden">
          <i class="fa-solid fa-print text-xl"></i>
          <span>列印或儲存諮詢卡</span>
        </button>
      </div>
    </section>

    <!-- 4. 設定分頁 -->
    <section id="settings-tab" class="tab-content hidden space-y-4">
      <!-- 字體調整 -->
      <div class="bg-white p-5 rounded-3xl shadow-md border-2 border-slate-200 space-y-3">
        <h3 class="text-xl font-black text-slate-800"><i class="fa-solid fa-font text-parkinson-secondary mr-1"></i>調整字體大小</h3>
        <div class="grid grid-cols-3 gap-2">
          <button onclick="setFontSize(20)" class="font-btn accessible-touch-target rounded-2xl font-black text-lg bg-slate-100 border-2 border-slate-300" data-size="20">標準 (20)</button>
          <button onclick="setFontSize(24)" class="font-btn accessible-touch-target rounded-2xl font-black text-xl bg-slate-100 border-2 border-slate-300" data-size="24">放大 (24)</button>
          <button onclick="setFontSize(28)" class="font-btn accessible-touch-target rounded-2xl font-black text-2xl bg-slate-100 border-2 border-slate-300" data-size="28">特大 (28)</button>
        </div>
      </div>

      <!-- 角色切換 -->
      <div class="bg-white p-5 rounded-3xl shadow-md border-2 border-slate-200 space-y-3">
        <h3 class="text-xl font-black text-slate-800"><i class="fa-solid fa-user-gear text-parkinson-secondary mr-1"></i>切換使用者身分</h3>
        <div class="space-y-2">
          <button onclick="changeCurrentUser('u1')" class="user-btn w-full accessible-touch-target rounded-2xl font-black text-left flex items-center justify-between border-2 border-parkinson-primary bg-emerald-50 text-slate-900" id="user-btn-u1">
            <span>👴 台中老王 (一般病友)</span>
            <i class="fa-solid fa-circle-check text-parkinson-primary"></i>
          </button>
          <button onclick="changeCurrentUser('u2')" class="user-btn w-full accessible-touch-target rounded-2xl font-black text-left flex items-center justify-between border-2 border-slate-300 bg-white text-slate-800" id="user-btn-u2">
            <span>👩 照護者阿美 (照護會員)</span>
            <i class="fa-solid fa-circle-check text-slate-200"></i>
          </button>
        </div>
      </div>
    </section>

  </main>

  <!-- ♿ 超大手機底部導航欄 -->
  <nav class="fixed bottom-0 left-0 right-0 bg-parkinson-primary border-t-4 border-parkinson-accent shadow-2xl z-50">
    <div class="max-w-md mx-auto grid grid-cols-4 text-center">
      <button onclick="switchTab('wall-tab')" id="nav-wall-tab" class="nav-btn py-3 text-white flex flex-col items-center justify-center gap-1 border-r border-emerald-900 bg-parkinson-secondary">
        <i class="fa-solid fa-comments text-2xl"></i>
        <span class="text-xs font-black">交流動態</span>
      </button>
      <button onclick="switchTab('post-tab')" id="nav-post-tab" class="nav-btn py-3 text-white flex flex-col items-center justify-center gap-1 border-r border-emerald-900">
        <i class="fa-solid fa-pen-to-square text-2xl"></i>
        <span class="text-xs font-black">我要發文</span>
      </button>
      <button onclick="switchTab('doctor-tab')" id="nav-doctor-tab" class="nav-btn py-3 text-white flex flex-col items-center justify-center gap-1 border-r border-emerald-900">
        <i class="fa-solid fa-notes-medical text-2xl"></i>
        <span class="text-xs font-black">門診卡</span>
      </button>
      <button onclick="switchTab('settings-tab')" id="nav-settings-tab" class="nav-btn py-3 text-white flex flex-col items-center justify-center gap-1">
        <i class="fa-solid fa-gear text-2xl"></i>
        <span class="text-xs font-black">設定</span>
      </button>
    </div>
  </nav>

  <!-- Toast 提示 -->
  <div id="toastModal" class="fixed bottom-24 left-4 right-4 z-50 transform translate-y-32 transition-transform duration-300 pointer-events-none">
    <div id="toastContent" class="bg-slate-900 text-white px-6 py-4 rounded-2xl shadow-2xl flex items-center justify-center gap-3 font-black text-lg border-2 border-slate-700">
      <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400 text-2xl"></i>
      <span id="toastMessage">訊息已更新</span>
    </div>
  </div>

  <script>
    const USERS = {
      'u1': { id: 'u1', name: '台中老王', role: 'member', roleLabel: '一般病友' },
      'u2': { id: 'u2', name: '照護者阿美', role: 'member', roleLabel: '照護會員' }
    };

    let currentUser = USERS['u1'];
    let currentCategory = '全部';
    let searchQuery = '';
    let bookmarkedPostIds = JSON.parse(localStorage.getItem('PARKINSON_BOOKMARKS') || '[]');

    // 每日打卡資料庫 (存於 localStorage 方便長者使用)
    let dailyTracker = JSON.parse(localStorage.getItem('DAILY_TRACKER') || '{}');
    const todayStr = new Date().toLocaleDateString('zh-TW');

    if (!dailyTracker[todayStr]) {
      dailyTracker[todayStr] = {
        med_morning: false, med_noon: false, med_evening: false, med_bedtime: false,
        exe_run: false, exe_balance: false
      };
    }

    let mockPosts = [
      {
        postId: 'P_1001',
        category: '用藥與復健',
        title: '每日定時超慢跑與防震餐具體驗分享',
        content: '確診第三年，每天在家嘗試 20 分鐘超慢跑，發現肢體僵硬顯著改善。另外最近換了加重防震湯匙，吃稀飯不再工作弄髒衣服了！',
        author: '台中老王',
        authorId: 'u1',
        authorRole: 'member',
        imageUrl: '',
        isPinned: false,
        likes: ['u2'],
        createdAt: '2026-08-02 14:15',
        replies: []
      }
    ];

    window.onload = function() {
      const savedFontSize = localStorage.getItem('PARKINSON_FONT_SIZE') || 22;
      setFontSize(parseInt(savedFontSize));
      updateUserUI();
      renderTrackerUI();
      renderPosts(mockPosts);
    };

    // 切換分頁
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(tabId).classList.remove('hidden');

      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('bg-parkinson-secondary'));
      document.getElementById('nav-' + tabId).classList.add('bg-parkinson-secondary');

      if (tabId === 'doctor-tab') {
        generateDoctorReport();
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 每日打卡邏輯
    function toggleTracker(key) {
      dailyTracker[todayStr][key] = !dailyTracker[todayStr][key];
      localStorage.setItem('DAILY_TRACKER', JSON.stringify(dailyTracker));
      renderTrackerUI();
      showToast('打卡成功！已記錄至門診諮詢卡', 'success');
    }

    function renderTrackerUI() {
      const todayData = dailyTracker[todayStr];
      const keys = ['med_morning', 'med_noon', 'med_evening', 'med_bedtime', 'exe_run', 'exe_balance'];
      
      keys.forEach(key => {
        const btn = document.getElementById(`btn-${key}`);
        if (!btn) return;
        if (todayData[key]) {
          btn.className = "accessible-touch-target rounded-xl font-black text-base border-2 border-parkinson-accent bg-parkinson-primary text-white flex items-center justify-center gap-1 shadow-inner";
          if (key.startsWith('med')) {
            btn.innerHTML = `<i class="fa-solid fa-check text-parkinson-accent"></i> 已服`;
          } else {
            btn.innerHTML = `<i class="fa-solid fa-circle-check text-parkinson-accent"></i> 已做`;
          }
        } else {
          btn.className = "accessible-touch-target rounded-xl font-black text-base border-2 border-slate-300 bg-white text-slate-700 flex items-center justify-center gap-1";
          if (key === 'med_morning') btn.innerText = '早';
          if (key === 'med_noon') btn.innerText = '中';
          if (key === 'med_evening') btn.innerText = '晚';
          if (key === 'med_bedtime') btn.innerText = '睡前';
          if (key === 'exe_run') btn.innerHTML = '🏃 超慢跑';
          if (key === 'exe_balance') btn.innerHTML = '🙌 平衡操';
        }
      });
    }

    // 產生擴充版門診諮詢卡
    function generateDoctorReport() {
      const container = document.getElementById('doctorReportContent');
      const userPosts = mockPosts.filter(p => p.authorId === currentUser.id);

      // 計算服藥率與運動次數
      const todayData = dailyTracker[todayStr];
      const medKeys = ['med_morning', 'med_noon', 'med_evening', 'med_bedtime'];
      const medTaken = medKeys.filter(k => todayData[k]).length;
      const medRate = Math.round((medTaken / 4) * 100);
      
      const exeKeys = ['exe_run', 'exe_balance'];
      const exeCount = exeKeys.filter(k => todayData[k]).length;

      document.getElementById('medRateDisplay').innerText = `${medRate}%`;
      document.getElementById('exeCountDisplay').innerText = `${exeCount} 項已完成`;

      let html = `
        <div class="border-b-2 pb-2 mb-2 font-black text-slate-800 text-lg">
          患者：${currentUser.name} ｜ 統計日期：${todayStr}
        </div>
        <div class="bg-amber-50 p-4 rounded-2xl border-2 border-amber-300 space-y-1 text-base font-bold text-amber-900">
          <p class="font-black">📋 今日醫囑執行明細：</p>
          <p>• 早上服藥：${todayData.med_morning ? '✅ 已服藥' : '❌ 未記錄'}</p>
          <p>• 中午服藥：${todayData.med_noon ? '✅ 已服藥' : '❌ 未記錄'}</p>
          <p>• 晚上服藥：${todayData.med_evening ? '✅ 已服藥' : '❌ 未記錄'}</p>
          <p>• 睡前服藥：${todayData.med_bedtime ? '✅ 已服藥' : '❌ 未記錄'}</p>
          <p>• 復健運動：${exeCount > 0 ? `🏃 已完成 ${exeCount} 項運動` : '❌ 今日尚未進行復健運動'}</p>
        </div>
      `;

      if (userPosts.length > 0) {
        html += `<p class="font-black text-slate-800 mt-4 mb-2">📝 近期手寫症狀與日記：</p>` + userPosts.map((p, idx) => `
          <div class="bg-emerald-50/50 p-4 rounded-2xl border-2 border-emerald-200 space-y-1">
            <div class="font-black text-lg text-parkinson-primary">${idx + 1}. [${p.category}] ${p.title}</div>
            <p class="text-slate-800 text-base leading-relaxed whitespace-pre-line font-bold">${p.content}</p>
          </div>
        `).join('');
      }

      container.innerHTML = html;
    }

    // 語音辨識
    function startSpeechRecognition(inputId, btnElement) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        showToast('您的手機不支援語音辨識', 'warning');
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = 'zh-TW';
      recognition.interimResults = false;

      const originalHtml = btnElement.innerHTML;
      btnElement.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-2xl mr-2"></i><span>正在聆聽中，請說話...</span>`;

      recognition.start();

      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        const targetInput = document.getElementById(inputId);
        if (targetInput) {
          targetInput.value = targetInput.value ? (targetInput.value + ' ' + transcript) : transcript;
        }
        showToast('語音辨識成功！', 'success');
      };

      recognition.onerror = function() {
        showToast('沒聽清楚，請再試一次', 'warning');
      };

      recognition.onend = function() {
        btnElement.innerHTML = originalHtml;
      };
    }

    // 以下為基礎功能函數（與手機版對接）
    function setFontSize(size) {
      document.documentElement.style.setProperty('--base-font-size', size + 'px');
      localStorage.setItem('PARKINSON_FONT_SIZE', size);
      document.querySelectorAll('.font-btn').forEach(btn => {
        if (parseInt(btn.dataset.size) === size) {
          btn.className = 'font-btn accessible-touch-target rounded-2xl font-black text-lg bg-parkinson-primary text-white border-2 border-parkinson-primary shadow';
        } else {
          btn.className = 'font-btn accessible-touch-target rounded-2xl font-black text-lg bg-slate-100 text-slate-800 border-2 border-slate-300';
        }
      });
    }

    function changeCurrentUser(userId) {
      if (USERS[userId]) {
        currentUser = USERS[userId];
        updateUserUI();
        renderPosts(mockPosts);
        showToast(`已切換為：${currentUser.name}`, 'info');
      }
    }

    function updateUserUI() {
      document.querySelectorAll('.user-btn').forEach(btn => {
        btn.className = 'user-btn w-full accessible-touch-target rounded-2xl font-black text-left flex items-center justify-between border-2 border-slate-300 bg-white text-slate-800';
        btn.querySelector('i').className = 'fa-solid fa-circle-check text-slate-200';
      });
      const activeBtn = document.getElementById(`user-btn-${currentUser.id}`);
      if (activeBtn) {
        activeBtn.className = 'user-btn w-full accessible-touch-target rounded-2xl font-black text-left flex items-center justify-between border-2 border-parkinson-primary bg-emerald-50 text-slate-900';
        activeBtn.querySelector('i').className = 'fa-solid fa-circle-check text-parkinson-primary';
      }
    }

    function renderPosts(posts) {
      const container = document.getElementById('postsList');
      let filtered = posts.filter(p => {
        let matchCat = (currentCategory === '全部') || (p.category === currentCategory);
        if (currentCategory === '我的收藏') matchCat = bookmarkedPostIds.includes(p.postId);
        return matchCat;
      });

      container.innerHTML = filtered.map(post => `
        <div class="bg-white p-5 rounded-3xl shadow-md border-2 border-slate-200 space-y-3">
          <div class="flex justify-between items-center border-b-2 border-slate-100 pb-2 text-sm font-bold text-slate-500">
            <span>👴 ${post.author} (${post.category})</span>
            <span>${post.createdAt}</span>
          </div>
          <h3 class="text-xl font-black text-slate-900">${post.title}</h3>
          <p class="text-slate-800 text-lg leading-relaxed font-bold">${post.content}</p>
        </div>
      `).join('');
    }

    function showToast(message, type = 'success') {
      const toast = document.getElementById('toastModal');
      document.getElementById('toastMessage').innerText = message;
      toast.classList.remove('translate-y-32');
      setTimeout(() => toast.classList.add('translate-y-32'), 2500);
    }
  </script>
</body>
