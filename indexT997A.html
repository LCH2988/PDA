<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>TPDA 營運管理後台</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #f1f5f9;
      color: #1e293b;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
    }

    .container {
      max-width: 1280px;
      margin: auto;
      padding: 24px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    h1 {
      color: #0f766e;
    }

    .hidden {
      display: none !important;
    }

    .toolbar,
    .tabs {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin: 18px 0;
    }

    button,
    input,
    select {
      box-sizing: border-box;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
    }

    button {
      border: 0;
      background: #0f766e;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary {
      background: #475569;
    }

    button.danger {
      background: #be123c;
    }

    .tabs button {
      background: #e2e8f0;
      color: #334155;
    }

    .tabs button.active {
      background: #0f766e;
      color: white;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin: 20px 0;
    }

    .metric {
      padding: 20px;
      background: #f0fdfa;
      border: 1px solid #ccfbf1;
      border-radius: 16px;
      text-align: center;
    }

    .metric strong {
      display: block;
      margin-top: 8px;
      color: #0f766e;
      font-size: 26px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
      font-size: 14px;
    }

    th,
    td {
      padding: 11px;
      border: 1px solid #e2e8f0;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #0f766e;
      color: white;
      white-space: nowrap;
    }

    tr:nth-child(even) {
      background: #f8fafc;
    }

    .badge {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 999px;
      background: #e2e8f0;
      font-weight: bold;
      white-space: nowrap;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .warn {
      background: #fef3c7;
      color: #92400e;
    }

    .error {
      background: #ffe4e6;
      color: #9f1239;
    }

    @media (max-width: 850px) {
      .metrics {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 520px) {
      body {
        padding: 8px;
      }

      .container {
        padding: 14px;
      }

      .metrics {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>TPDA 秘書處營運管理中心</h1>

    <section id="login-box">
      <h2>管理員登入</h2>

      <p>
        請輸入營運後台密碼。登入後使用短效工作階段，
        不會在每次查詢時重新傳送密碼。
      </p>

      <div class="toolbar">
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="管理密碼"
        >

        <button type="button" onclick="login()">
          登入
        </button>
      </div>

      <p id="login-message" style="color:#be123c"></p>
    </section>

    <section id="admin-panel" class="hidden">
      <div class="toolbar">
        <button type="button" onclick="loadData()">
          重新整理
        </button>

        <button
          type="button"
          class="secondary"
          onclick="logout()"
        >
          登出
        </button>

        <input
          id="search"
          type="search"
          placeholder="搜尋會員姓名、編號、電話或信箱"
          oninput="renderMembers()"
        >

        <span id="updated-at"></span>
      </div>

      <div class="metrics">
        <div class="metric">
          累計成功捐款
          <strong id="metric-donation">NT$ 0</strong>
        </div>

        <div class="metric">
          成功捐款筆數
          <strong id="metric-donation-count">0</strong>
        </div>

        <div class="metric">
          會員人數
          <strong id="metric-member-count">0</strong>
        </div>

        <div class="metric">
          待審核會員
          <strong id="metric-pending-count">0</strong>
        </div>
      </div>

      <nav class="tabs">
        <button
          type="button"
          class="active"
          onclick="switchTab(event, 'members')"
        >
          會員審核
        </button>

        <button
          type="button"
          onclick="switchTab(event, 'donations')"
        >
          捐款紀錄
        </button>

        <button
          type="button"
          onclick="switchTab(event, 'volunteers')"
        >
          志工資料
        </button>

        <button
          type="button"
          onclick="switchTab(event, 'subscribers')"
        >
          電子報訂閱
        </button>
      </nav>

      <section id="tab-members">
        <h2>會員資料與審核</h2>
        <div id="members-table" class="table-wrap"></div>
      </section>

      <section id="tab-donations" class="hidden">
        <h2>捐款紀錄</h2>
        <div id="donations-table" class="table-wrap"></div>
      </section>

      <section id="tab-volunteers" class="hidden">
        <h2>志工資料</h2>
        <div id="volunteers-table" class="table-wrap"></div>
      </section>

      <section id="tab-subscribers" class="hidden">
        <h2>電子報訂閱</h2>
        <div id="subscribers-table" class="table-wrap"></div>
      </section>
    </section>
  </main>

  <script>
    const GAS_URL =
      "https://script.google.com/macros/s/AKfycbz-z49f8MSomQJaxVbl-XMLi5xyz21QHKdZoY5lwAYyQ-fXz-AiJcvSbJoTOeUBNWZW1Q/exec";

    let sessionToken = "";
    let dataCache = {
      members: [],
      donations: [],
      volunteers: [],
      subscribers: []
    };

    async function apiPost(payload) {
      const response = await fetch(GAS_URL, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(payload)
      });

      const text = await response.text();

      try {
        return JSON.parse(text);
      } catch (error) {
        throw new Error("伺服器回應格式錯誤");
      }
    }

    async function login() {
      const password =
        document.getElementById("password").value;

      const message =
        document.getElementById("login-message");

      if (!password) {
        message.innerText = "請輸入密碼";
        return;
      }

      message.innerText = "驗證中……";

      try {
        const result = await apiPost({
          action: "adminLogin",
          password
        });

        if (!result.success) {
          message.innerText =
            result.message || "登入失敗";
          return;
        }

        sessionToken = result.session;
        document.getElementById("password").value = "";
        document.getElementById("login-box").classList.add("hidden");
        document.getElementById("admin-panel").classList.remove("hidden");

        message.innerText = "";
        await loadData();
      } catch (error) {
        message.innerText =
          error.message || "連線失敗";
      }
    }

    function logout() {
      sessionToken = "";
      dataCache = {
        members: [],
        donations: [],
        volunteers: [],
        subscribers: []
      };

      document.getElementById("admin-panel").classList.add("hidden");
      document.getElementById("login-box").classList.remove("hidden");
    }

    async function loadData() {
      if (!sessionToken) {
        logout();
        return;
      }

      try {
        const result = await apiPost({
          action: "adminGetData",
          session: sessionToken
        });

        if (!result.success) {
          alert(result.message || "讀取失敗");
          logout();
          return;
        }

        dataCache.members = normalizeRows(result.members);
        dataCache.donations = normalizeRows(result.donations);
        dataCache.volunteers = normalizeRows(result.volunteers);
        dataCache.subscribers = normalizeRows(result.subscribers);

        renderMetrics();
        renderMembers();
        renderDonations();
        renderVolunteers();
        renderSubscribers();

        document.getElementById("updated-at").innerText =
          "最後更新：" +
          new Date().toLocaleString("zh-TW");
      } catch (error) {
        alert(error.message || "連線失敗");
      }
    }

    function normalizeRows(values) {
      if (!Array.isArray(values) || values.length < 2) {
        return [];
      }

      const headers = values[0].map(String);

      return values.slice(1)
        .filter(row => row.some(value => value !== ""))
        .map(row => {
          const object = {};

          headers.forEach((header, index) => {
            object[header] = row[index];
          });

          return object;
        });
    }

    function renderMetrics() {
      const successDonations =
        dataCache.donations.filter(row => {
          return String(row["狀態"] || "").toLowerCase() ===
            "success";
        });

      const total = successDonations.reduce(
        (sum, row) => {
          return sum + Number(row["金額"] || 0);
        },
        0
      );

      const pending = dataCache.members.filter(row => {
        return String(row["審核狀態"] || "待審核") ===
          "待審核";
      }).length;

      document.getElementById("metric-donation").innerText =
        "NT$ " + total.toLocaleString();

      document.getElementById("metric-donation-count").innerText =
        successDonations.length + " 筆";

      document.getElementById("metric-member-count").innerText =
        dataCache.members.length + " 人";

      document.getElementById("metric-pending-count").innerText =
        pending + " 人";
    }

    function renderMembers() {
      const keyword =
        document
          .getElementById("search")
          .value
          .trim()
          .toLowerCase();

      const rows = dataCache.members
        .filter(row => {
          if (!keyword) return true;

          return [
            row["會員編號"],
            row["姓名"],
            row["電話"],
            row["電子信箱"]
          ].some(value => {
            return String(value || "")
              .toLowerCase()
              .includes(keyword);
          });
        })
        .reverse();

      const html = `
        <table>
          <thead>
            <tr>
              <th>會員編號</th>
              <th>申請時間</th>
              <th>姓名</th>
              <th>類別</th>
              <th>聯絡方式</th>
              <th>證明文件</th>
              <th>審核狀態</th>
              <th>會費狀態</th>
              <th>操作</th>
            </tr>
          </thead>

          <tbody>
            ${
              rows.length
                ? rows.map(memberRow).join("")
                : `<tr><td colspan="9">沒有符合資料。</td></tr>`
            }
          </tbody>
        </table>
      `;

      document.getElementById("members-table").innerHTML =
        html;
    }

    function memberRow(row) {
      const memberNo =
        String(row["會員編號"] || "");

      const proofUrl =
        String(row["證明文件網址"] || "");

      const proof = isSafeUrl(proofUrl)
        ? `
          <a
            href="${escapeAttr(proofUrl)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            檢視文件
          </a>
        `
        : "未附";

      const status =
        String(row["審核狀態"] || "待審核");

      const fee =
        String(row["會費狀態"] || "未繳");

      return `
        <tr>
          <td>${escapeHtml(memberNo)}</td>

          <td>
            ${escapeHtml(formatDate(row["申請時間"]))}
          </td>

          <td>
            <strong>${escapeHtml(row["姓名"] || "")}</strong>
          </td>

          <td>${escapeHtml(row["會員類別"] || "")}</td>

          <td>
            ${escapeHtml(row["電話"] || "")}<br>
            ${escapeHtml(row["電子信箱"] || "")}<br>
            ${escapeHtml(row["地址"] || "")}
          </td>

          <td>${proof}</td>

          <td>
            <select id="status-${escapeAttr(memberNo)}">
              ${statusOptions(status)}
            </select>
          </td>

          <td>
            <select id="fee-${escapeAttr(memberNo)}">
              ${feeOptions(fee)}
            </select>
          </td>

          <td>
            <button
              type="button"
              onclick="updateMember('${escapeJs(memberNo)}')"
            >
              儲存
            </button>
          </td>
        </tr>
      `;
    }

    function statusOptions(current) {
      return [
        "待審核",
        "已核准",
        "補件",
        "停權"
      ].map(value => `
        <option
          value="${value}"
          ${value === current ? "selected" : ""}
        >
          ${value}
        </option>
      `).join("");
    }

    function feeOptions(current) {
      return [
        "未繳",
        "已繳",
        "免繳"
      ].map(value => `
        <option
          value="${value}"
          ${value === current ? "selected" : ""}
        >
          ${value}
        </option>
      `).join("");
    }

    async function updateMember(memberNo) {
      const status =
        document
          .getElementById("status-" + memberNo)
          .value;

      const feeStatus =
        document
          .getElementById("fee-" + memberNo)
          .value;

      const result = await apiPost({
        action: "adminUpdateMember",
        session: sessionToken,
        memberNo,
        status,
        feeStatus
      });

      if (!result.success) {
        alert(result.message || "更新失敗");

        if (
          String(result.message || "")
            .includes("過期")
        ) {
          logout();
        }

        return;
      }

      alert("會員資料已更新");
      await loadData();
    }

    function renderDonations() {
      const rows = dataCache.donations
        .slice()
        .reverse();

      document.getElementById("donations-table").innerHTML = `
        <table>
          <thead>
            <tr>
              <th>訂單號</th>
              <th>時間</th>
              <th>姓名</th>
              <th>金額</th>
              <th>模式</th>
              <th>付款方式</th>
              <th>狀態</th>
              <th>項目</th>
            </tr>
          </thead>

          <tbody>
            ${rows.map(row => `
              <tr>
                <td>${escapeHtml(row["訂單號"] || "")}</td>
                <td>${escapeHtml(formatDate(row["時間"]))}</td>
                <td>${escapeHtml(row["姓名"] || "")}</td>
                <td>
                  NT$
                  ${Number(row["金額"] || 0).toLocaleString()}
                </td>
                <td>${escapeHtml(row["捐款模式"] || "")}</td>
                <td>${escapeHtml(row["付款方式"] || "")}</td>
                <td>${escapeHtml(row["狀態"] || "")}</td>
                <td>${escapeHtml(row["捐款項目"] || "")}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    function renderVolunteers() {
      const rows = dataCache.volunteers
        .slice()
        .reverse();

      document.getElementById("volunteers-table").innerHTML = `
        <table>
          <thead>
            <tr>
              <th>時間</th>
              <th>姓名</th>
              <th>電話</th>
              <th>信箱</th>
              <th>專長</th>
              <th>偏好</th>
              <th>狀態</th>
            </tr>
          </thead>

          <tbody>
            ${rows.map(row => `
              <tr>
                <td>${escapeHtml(formatDate(row["登記時間"]))}</td>
                <td>${escapeHtml(row["姓名"] || "")}</td>
                <td>${escapeHtml(row["電話"] || "")}</td>
                <td>${escapeHtml(row["電子信箱"] || "")}</td>
                <td>${escapeHtml(row["服務專長"] || "")}</td>
                <td>
                  ${escapeHtml(row["偏好時段"] || "")}
                  /
                  ${escapeHtml(row["服務地區"] || "")}
                </td>
                <td>${escapeHtml(row["狀態"] || "")}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    function renderSubscribers() {
      const rows = dataCache.subscribers
        .slice()
        .reverse();

      document.getElementById("subscribers-table").innerHTML = `
        <table>
          <thead>
            <tr>
              <th>時間</th>
              <th>電子信箱</th>
              <th>關注標籤</th>
              <th>狀態</th>
            </tr>
          </thead>

          <tbody>
            ${rows.map(row => `
              <tr>
                <td>${escapeHtml(formatDate(row["訂閱時間"]))}</td>
                <td>${escapeHtml(row["電子信箱"] || "")}</td>
                <td>${escapeHtml(row["關注標籤"] || "")}</td>
                <td>${escapeHtml(row["狀態"] || "")}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    function switchTab(event, name) {
      [
        "members",
        "donations",
        "volunteers",
        "subscribers"
      ].forEach(tabName => {
        document
          .getElementById("tab-" + tabName)
          .classList.toggle(
            "hidden",
            tabName !== name
          );
      });

      document
        .querySelectorAll(".tabs button")
        .forEach(button => {
          button.classList.remove("active");
        });

      event.currentTarget.classList.add("active");
    }

    function formatDate(value) {
      if (!value) return "";

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return String(value || "");
      }

      return date.toLocaleString("zh-TW");
    }

    function isSafeUrl(value) {
      if (!value) return false;

      try {
        const url = new URL(value);

        return [
          "http:",
          "https:"
        ].includes(url.protocol);
      } catch (error) {
        return false;
      }
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttr(value) {
      return escapeHtml(value);
    }

    function escapeJs(value) {
      return String(value ?? "")
        .replaceAll("\\", "\\\\")
        .replaceAll("'", "\\'");
    }

    document
      .getElementById("password")
      .addEventListener("keydown", event => {
        if (event.key === "Enter") {
          login();
        }
      });
  </script>
</body>
</html>
