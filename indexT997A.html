<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="robots"
    content="noindex, nofollow"
  >

  <title>TPDA 營運管理後台</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: "#f0fdfa",
              100: "#ccfbf1",
              600: "#0d9488",
              700: "#0f766e",
              800: "#115e59",
              900: "#134e4a",
              950: "#042f2e"
            }
          }
        }
      }
    };
  </script>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>
    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Noto Sans TC",
        sans-serif;
    }

    .metric-card {
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .metric-card:hover {
      transform: translateY(-3px);
      box-shadow:
        0 16px 35px rgba(15, 23, 42, 0.12);
    }

    .tab-button.active {
      background: #0f766e;
      color: #ffffff;
    }

    .table-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      border-collapse: collapse;
      min-width: 900px;
      width: 100%;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #e2e8f0;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #115e59;
      color: #ffffff;
      font-weight: 800;
      white-space: nowrap;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    tbody tr:nth-child(even) {
      background: #f8fafc;
    }

    tbody tr:hover {
      background: #f0fdfa;
    }

    .status-badge {
      display: inline-block;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }
  </style>
</head>

<body class="min-h-screen bg-slate-100 text-slate-800">

  <!-- 通知 -->
  <div
    id="toast"
    class="hidden fixed right-4 top-4 z-50
           max-w-sm rounded-2xl bg-slate-950
           px-5 py-4 text-white shadow-2xl"
    role="status"
    aria-live="polite"
  >
    <i
      id="toast-icon"
      class="fa-solid fa-circle-notch fa-spin text-teal-400"
    ></i>

    <span
      id="toast-message"
      class="ml-2"
    ></span>
  </div>

  <!-- 登入頁 -->
  <main
    id="login-view"
    class="grid min-h-screen place-items-center p-4"
  >
    <section
      class="w-full max-w-md overflow-hidden
             rounded-3xl bg-white shadow-2xl"
    >
      <header
        class="bg-gradient-to-br from-teal-950
               to-teal-700 p-8 text-center text-white"
      >
        <div
          class="mx-auto grid h-16 w-16
                 place-items-center rounded-2xl
                 bg-white/15 text-3xl font-black"
        >
          帕
        </div>

        <h1 class="mt-4 text-2xl font-black">
          TPDA 營運管理中心
        </h1>

        <p class="mt-2 text-sm text-teal-100">
          會員、內容、論壇、活動及統計管理
        </p>
      </header>

      <form
        id="login-form"
        onsubmit="adminLogin(event)"
        class="space-y-5 p-7"
      >
        <label class="block font-bold">
          後台管理密碼

          <div class="relative mt-2">
            <i
              class="fa-solid fa-lock
                     absolute left-4 top-1/2
                     -translate-y-1/2 text-slate-400"
            ></i>

            <input
              id="admin-password"
              type="password"
              required
              autocomplete="current-password"
              placeholder="請輸入管理密碼"
              class="w-full rounded-xl border
                     py-3 pl-11 pr-4 font-normal"
            >
          </div>
        </label>

        <button
          id="login-button"
          type="submit"
          class="w-full rounded-xl bg-teal-700
                 p-3 font-black text-white
                 hover:bg-teal-800"
        >
          <i class="fa-solid fa-right-to-bracket"></i>
          登入後台
        </button>

        <p
          id="login-message"
          class="text-center text-sm text-rose-600"
        ></p>

        <p class="text-center text-xs text-slate-400">
          登入工作階段最長六小時，過期後需重新登入。
        </p>
      </form>
    </section>
  </main>

  <!-- 後台主畫面 -->
  <div
    id="dashboard-view"
    class="hidden min-h-screen"
  >
    <header
      class="sticky top-0 z-30
             border-b bg-white/95 shadow-sm
             backdrop-blur"
    >
      <div
        class="mx-auto flex max-w-screen-2xl
               flex-wrap items-center justify-between
               gap-3 px-4 py-4 md:px-8"
      >
        <div>
          <h1
            class="text-xl font-black text-teal-950 md:text-2xl"
          >
            TPDA 營運管理中心
          </h1>

          <p
            id="last-updated"
            class="mt-1 text-xs text-slate-500"
          >
            尚未載入資料
          </p>
        </div>

        <div class="flex flex-wrap gap-2">
          <button
            type="button"
            onclick="loadDashboard()"
            class="rounded-xl bg-teal-700
                   px-4 py-2 font-bold text-white"
          >
            <i class="fa-solid fa-rotate"></i>
            重新整理
          </button>

          <button
            type="button"
            onclick="exportCurrentTable()"
            class="rounded-xl bg-indigo-700
                   px-4 py-2 font-bold text-white"
          >
            <i class="fa-solid fa-file-csv"></i>
            匯出 CSV
          </button>

          <button
            type="button"
            onclick="adminLogout()"
            class="rounded-xl bg-slate-700
                   px-4 py-2 font-bold text-white"
          >
            <i class="fa-solid fa-right-from-bracket"></i>
            登出
          </button>
        </div>
      </div>
    </header>

    <main
      class="mx-auto max-w-screen-2xl p-4 md:p-8"
    >
      <!-- 指標 -->
      <section>
        <div
          id="metric-cards"
          class="grid grid-cols-2 gap-3
                 md:grid-cols-3 xl:grid-cols-6"
        ></div>
      </section>

      <!-- 搜尋 -->
      <section
        class="mt-7 rounded-2xl bg-white
               p-4 shadow-sm"
      >
        <div
          class="flex flex-col gap-3
                 md:flex-row md:items-center"
        >
          <div class="relative flex-1">
            <i
              class="fa-solid fa-magnifying-glass
                     absolute left-4 top-1/2
                     -translate-y-1/2 text-slate-400"
            ></i>

            <input
              id="global-search"
              type="search"
              placeholder="搜尋目前頁籤的資料"
              oninput="renderCurrentTab()"
              class="w-full rounded-xl border
                     py-3 pl-11 pr-4"
            >
          </div>

          <div
            id="record-count"
            class="text-sm font-bold text-slate-500"
          >
            0 筆資料
          </div>
        </div>
      </section>

      <!-- 頁籤 -->
      <nav
        id="tab-list"
        class="mt-5 flex gap-2 overflow-x-auto pb-2"
        aria-label="後台資料分類"
      ></nav>

      <!-- 資料表 -->
      <section
        class="mt-3 overflow-hidden
               rounded-2xl bg-white shadow-sm"
      >
        <header
          class="flex flex-wrap items-center
                 justify-between gap-3 border-b p-5"
        >
          <div>
            <h2
              id="table-title"
              class="text-xl font-black"
            ></h2>

            <p
              id="table-description"
              class="mt-1 text-sm text-slate-500"
            ></p>
          </div>
        </header>

        <div
          id="data-table"
          class="table-scroll max-h-[70vh]"
        ></div>
      </section>
    </main>
  </div>

  <script>
    /**********************************************
     * 必填設定
     **********************************************/

    const CONFIG = {
      API_URL:
        "https://script.google.com/macros/s/AKfycbxiGU9cZDWxw-hHCOAgeEoUL75pfrXqx93rANtBTzNy53EVIQ6fslPwrKmbosavDkA_cw/exec"
    };


    /**********************************************
     * 後台狀態
     **********************************************/

    const state = {
      session: "",
      activeTab: "members",
      dashboard: {
        metrics: {},
        members: [],
        items: [],
        forum: [],
        visits: [],
        volunteers: [],
        donations: [],
        logs: []
      }
    };


    const TAB_DEFINITIONS = {
      members: {
        label: "會員審核",
        icon: "fa-users",
        description:
          "審核會員資格及管理會費狀態。"
      },

      items: {
        label: "網站內容",
        icon: "fa-newspaper",
        description:
          "檢視衛教、宣導、下載及活動內容。內容編輯請從前台管理模式操作。"
      },

      forum: {
        label: "論壇文章",
        icon: "fa-comments",
        description:
          "檢視會員及管理員發表的論壇內容。審核與下架可從前台管理模式操作。"
      },

      volunteers: {
        label: "志工資料",
        icon: "fa-hand-holding-heart",
        description:
          "檢視志工登記及服務資料。"
      },

      donations: {
        label: "捐款紀錄",
        icon: "fa-circle-dollar-to-slot",
        description:
          "檢視捐款交易及處理狀態。"
      },

      visits: {
        label: "瀏覽紀錄",
        icon: "fa-chart-line",
        description:
          "瀏覽器、頁面及日期的近似去重紀錄。"
      },

      logs: {
        label: "操作紀錄",
        icon: "fa-clipboard-list",
        description:
          "檢視管理員及會員的重要操作紀錄。"
      }
    };


    /**********************************************
     * API
     **********************************************/

    async function apiPost(payload) {
      if (
        !CONFIG.API_URL ||
        CONFIG.API_URL.indexOf("請填入") !== -1
      ) {
        throw new Error(
          "尚未設定 GAS Web App 網址"
        );
      }

      const controller =
        new AbortController();

      const timeout =
        setTimeout(
          function() {
            controller.abort();
          },
          30000
        );

      try {
        const response =
          await fetch(
            CONFIG.API_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "text/plain;charset=utf-8"
              },

              body:
                JSON.stringify(
                  payload
                ),

              signal:
                controller.signal
            }
          );

        const text =
          await response.text();

        try {
          return JSON.parse(text);
        } catch (error) {
          throw new Error(
            "伺服器回應格式錯誤"
          );
        }
      } catch (error) {
        if (
          error &&
          error.name === "AbortError"
        ) {
          throw new Error(
            "伺服器回應逾時"
          );
        }

        throw error;
      } finally {
        clearTimeout(timeout);
      }
    }


    /**********************************************
     * 登入及登出
     **********************************************/

    async function adminLogin(event) {
      event.preventDefault();

      const password =
        document
          .getElementById(
            "admin-password"
          )
          .value;

      const message =
        document.getElementById(
          "login-message"
        );

      const button =
        document.getElementById(
          "login-button"
        );

      if (!password) {
        message.innerText =
          "請輸入管理密碼";

        return;
      }

      button.disabled = true;
      message.innerText =
        "正在驗證……";

      try {
        const result =
          await apiPost({
            action: "adminLogin",
            password: password
          });

        if (!result.success) {
          throw new Error(
            result.message ||
            "登入失敗"
          );
        }

        state.session =
          result.session;

        /*
         * Session 只存放於 sessionStorage，
         * 關閉分頁或瀏覽器後即移除。
         */
        try {
          sessionStorage.setItem(
            "tpdaAdminSession",
            state.session
          );
        } catch (error) {
          console.warn(error);
        }

        document
          .getElementById(
            "admin-password"
          )
          .value = "";

        message.innerText = "";

        showDashboard();

        await loadDashboard();
      } catch (error) {
        message.innerText =
          error.message ||
          "登入失敗";
      } finally {
        button.disabled = false;
      }
    }


    function adminLogout() {
      state.session = "";

      try {
        sessionStorage.removeItem(
          "tpdaAdminSession"
        );
      } catch (error) {
        console.warn(error);
      }

      document
        .getElementById(
          "dashboard-view"
        )
        .classList.add("hidden");

      document
        .getElementById(
          "login-view"
        )
        .classList.remove("hidden");

      document
        .getElementById(
          "login-message"
        )
        .innerText = "";

      state.dashboard = {
        metrics: {},
        members: [],
        items: [],
        forum: [],
        visits: [],
        volunteers: [],
        donations: [],
        logs: []
      };
    }


    function showDashboard() {
      document
        .getElementById(
          "login-view"
        )
        .classList.add("hidden");

      document
        .getElementById(
          "dashboard-view"
        )
        .classList.remove("hidden");
    }


    /**********************************************
     * 載入儀表板
     **********************************************/

    async function loadDashboard() {
      if (!state.session) {
        adminLogout();
        return;
      }

      showToast(
        "正在載入後台資料",
        "loading"
      );

      try {
        const result =
          await apiPost({
            action:
              "adminDashboard",

            session:
              state.session
          });

        if (!result.success) {
          throw new Error(
            result.message ||
            "後台資料讀取失敗"
          );
        }

        state.dashboard.metrics =
          result.metrics || {};

        state.dashboard.members =
          normalizeRows(
            result.members
          );

        state.dashboard.items =
          normalizeRows(
            result.items
          );

        state.dashboard.forum =
          normalizeRows(
            result.forum
          );

        state.dashboard.visits =
          normalizeRows(
            result.visits
          );

        state.dashboard.volunteers =
          normalizeRows(
            result.volunteers
          );

        state.dashboard.donations =
          normalizeRows(
            result.donations
          );

        state.dashboard.logs =
          normalizeRows(
            result.logs
          );

        renderMetrics();
        renderTabs();
        renderCurrentTab();

        document
          .getElementById(
            "last-updated"
          )
          .innerText =
            "最後更新：" +
            new Date()
              .toLocaleString(
                "zh-TW"
              );

        showToast(
          "後台資料已更新",
          "success"
        );
      } catch (error) {
        showToast(
          error.message ||
          "後台資料讀取失敗",
          "error"
        );

        if (
          String(
            error.message || ""
          ).indexOf("過期") !== -1
        ) {
          setTimeout(
            adminLogout,
            1200
          );
        }
      }
    }


    function normalizeRows(values) {
      if (
        !Array.isArray(values) ||
        values.length < 2
      ) {
        return [];
      }

      const headers =
        values[0].map(String);

      return values
        .slice(1)
        .filter(function(row) {
          return row.some(
            function(cell) {
              return cell !== "";
            }
          );
        })
        .map(function(row) {
          const object = {};

          headers.forEach(
            function(header, index) {
              object[header] =
                row[index];
            }
          );

          return object;
        });
    }


    /**********************************************
     * 統計卡片
     **********************************************/

    function renderMetrics() {
      const metrics =
        state.dashboard.metrics || {};

      const definitions = [
        {
          key: "views",
          label: "瀏覽總人次",
          icon: "fa-eye",
          color: "text-cyan-700"
        },
        {
          key: "health",
          label: "健康運動",
          icon: "fa-person-walking",
          color: "text-teal-700"
        },
        {
          key: "love",
          label: "愛心指數",
          icon: "fa-heart",
          color: "text-rose-600"
        },
        {
          key: "volunteers",
          label: "志工人數",
          icon: "fa-hand-holding-heart",
          color: "text-indigo-700"
        },
        {
          key: "events",
          label: "活動總場次",
          icon: "fa-calendar-check",
          color: "text-amber-700"
        },
        {
          key: "participants",
          label: "活動參與人數",
          icon: "fa-people-group",
          color: "text-violet-700"
        }
      ];

      document
        .getElementById(
          "metric-cards"
        )
        .innerHTML =
          definitions
            .map(function(item) {
              const value =
                Math.max(
                  0,
                  Number(
                    metrics[item.key] || 0
                  )
                );

              return `
                <article
                  class="metric-card rounded-2xl
                         border bg-white p-5 shadow-sm"
                >
                  <i
                    class="fa-solid ${item.icon}
                           ${item.color} text-2xl"
                  ></i>

                  <strong
                    class="mt-3 block text-2xl font-black"
                  >
                    ${value.toLocaleString("zh-TW")}
                  </strong>

                  <span class="text-sm text-slate-500">
                    ${escapeHtml(item.label)}
                  </span>
                </article>
              `;
            })
            .join("");
    }


    /**********************************************
     * 頁籤
     **********************************************/

    function renderTabs() {
      document
        .getElementById(
          "tab-list"
        )
        .innerHTML =
          Object.keys(
            TAB_DEFINITIONS
          )
            .map(function(key) {
              const tab =
                TAB_DEFINITIONS[key];

              return `
                <button
                  type="button"
                  onclick="switchTab('${escapeJavaScript(key)}')"
                  class="tab-button
                         ${
                           state.activeTab === key
                             ? "active"
                             : "bg-white text-slate-700"
                         }
                         shrink-0 rounded-xl
                         px-4 py-3 font-bold shadow-sm"
                >
                  <i class="fa-solid ${tab.icon} mr-1"></i>
                  ${escapeHtml(tab.label)}
                </button>
              `;
            })
            .join("");
    }


    function switchTab(tabName) {
      if (
        !TAB_DEFINITIONS[tabName]
      ) {
        return;
      }

      state.activeTab =
        tabName;

      document
        .getElementById(
          "global-search"
        )
        .value = "";

      renderTabs();
      renderCurrentTab();
    }


    /**********************************************
     * 表格總入口
     **********************************************/

    function renderCurrentTab() {
      const definition =
        TAB_DEFINITIONS[
          state.activeTab
        ];

      document
        .getElementById(
          "table-title"
        )
        .innerText =
          definition.label;

      document
        .getElementById(
          "table-description"
        )
        .innerText =
          definition.description;

      switch (state.activeTab) {
        case "members":
          renderMembers();
          break;

        case "items":
          renderItems();
          break;

        case "forum":
          renderForum();
          break;

        case "volunteers":
          renderVolunteers();
          break;

        case "donations":
          renderDonations();
          break;

        case "visits":
          renderVisits();
          break;

        case "logs":
          renderLogs();
          break;
      }
    }


    function getSearchKeyword() {
      return String(
        document
          .getElementById(
            "global-search"
          )
          .value || ""
      )
        .trim()
        .toLowerCase();
    }


    function matchesKeyword(
      row,
      fields,
      keyword
    ) {
      if (!keyword) {
        return true;
      }

      return fields.some(
        function(field) {
          return String(
            row[field] == null
              ? ""
              : row[field]
          )
            .toLowerCase()
            .includes(keyword);
        }
      );
    }


    function updateRecordCount(count) {
      document
        .getElementById(
          "record-count"
        )
        .innerText =
          Number(count)
            .toLocaleString("zh-TW") +
          " 筆資料";
    }


    function renderEmptyRow(
      columnCount
    ) {
      return `
        <tr>
          <td
            colspan="${columnCount}"
            class="p-8 text-center text-slate-500"
          >
            沒有符合條件的資料。
          </td>
        </tr>
      `;
    }


    /**********************************************
     * 會員審核
     **********************************************/

    function renderMembers() {
      const keyword =
        getSearchKeyword();

      const rows =
        state.dashboard.members
          .filter(function(row) {
            return matchesKeyword(
              row,
              [
                "會員編號",
                "姓名",
                "會員類別",
                "電話",
                "電子信箱",
                "地址",
                "審核狀態",
                "會費狀態"
              ],
              keyword
            );
          })
          .slice()
          .reverse();

      updateRecordCount(
        rows.length
      );

      document
        .getElementById(
          "data-table"
        )
        .innerHTML = `
          <table>
            <thead>
              <tr>
                <th>會員編號</th>
                <th>申請時間</th>
                <th>姓名／類別</th>
                <th>聯絡方式</th>
                <th>地址</th>
                <th>審核狀態</th>
                <th>會費狀態</th>
                <th>操作</th>
              </tr>
            </thead>

            <tbody>
              ${
                rows.length
                  ? rows
                      .map(
                        function(row, index) {
                          return renderMemberRow(
                            row,
                            index
                          );
                        }
                      )
                      .join("")
                  : renderEmptyRow(8)
              }

    async function reviewMember(
      memberNumber,
      rowIndex
    ) {
      const status =
        document
          .getElementById(
            "member-status-" +
            rowIndex
          )
          .value;

      const feeStatus =
        document
          .getElementById(
            "member-fee-" +
            rowIndex
          )
          .value;

      showToast(
        "正在更新會員資料",
        "loading"
      );

      try {
        const result =
          await apiPost({
            action:
              "adminReviewMember",

            session:
              state.session,

            memberNo:
              memberNumber,

            status:
              status,

            feeStatus:
              feeStatus
          });

        if (!result.success) {
          throw new Error(
            result.message ||
            "會員資料更新失敗"
          );
        }

        await loadDashboard();

        showToast(
          "會員審核資料已更新",
          "success"
        );
      } catch (error) {
        showToast(
          error.message ||
          "會員資料更新失敗",
          "error"
        );
      }
    }

    /**********************************************
     * CSV 匯出
     **********************************************/

    function exportCurrentTable() {
      const rows =
        state.dashboard[
          state.activeTab
        ] || [];

      if (!rows.length) {
        showToast(
          "目前沒有可匯出的資料",
          "error"
        );

        return;
      }

      const headers =
        Object.keys(rows[0]);

      const csvRows = [
        headers.map(csvEscape).join(",")
      ];

      rows.forEach(function(row) {
        csvRows.push(
          headers
            .map(function(header) {
              return csvEscape(
                row[header]
              );
            })
            .join(",")
        );
      });

      const blob =
        new Blob(
          [
            "\uFEFF" +
            csvRows.join("\r\n")
          ],
          {
            type:
              "text/csv;charset=utf-8"
          }
        );

      const url =
        URL.createObjectURL(blob);

      const link =
        document.createElement("a");

      link.href = url;

      link.download =
        "TPDA_" +
        state.activeTab +
        "_" +
        new Date()
          .toISOString()
          .slice(0, 10) +
        ".csv";

      document.body.appendChild(link);
      link.click();
      link.remove();

      URL.revokeObjectURL(url);

      showToast(
        "CSV 已匯出",
        "success"
      );
    }


    function csvEscape(value) {
      const text =
        String(
          value == null
            ? ""
            : value
        );

      return (
        '"' +
        text.replaceAll(
          '"',
          '""'
        ) +
        '"'
      );
    }


    /**********************************************
     * 顯示工具
     **********************************************/

    function booleanBadge(value) {
      const enabled =
        value === true ||
        [
          "true",
          "1",
          "是",
          "顯示",
          "啟用"
        ].includes(
          String(value || "")
            .toLowerCase()
        );

      return enabled
        ? `
          <span
            class="status-badge
                   bg-emerald-100 text-emerald-800"
          >
            是
          </span>
        `
        : `
          <span
            class="status-badge
                   bg-slate-200 text-slate-700"
          >
            否
          </span>
        `;
    }


    function truncateText(
      value,
      maximumLength
    ) {
      const text =
        String(
          value == null
            ? ""
            : value
        );

      if (
        text.length <= maximumLength
      ) {
        return text;
      }

      return (
        text.substring(
          0,
          maximumLength
        ) +
        "…"
      );
    }


    function formatDate(value) {
      if (!value) {
        return "";
      }

      const date =
        new Date(value);

      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return String(value);
      }

      return date.toLocaleDateString(
        "zh-TW"
      );
    }


    function formatDateTime(value) {
      if (!value) {
        return "";
      }

      const date =
        new Date(value);

      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return String(value);
      }

      return date.toLocaleString(
        "zh-TW"
      );
    }


    function escapeHtml(value) {
      return String(
        value == null
          ? ""
          : value
      )
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    function escapeAttribute(value) {
      return escapeHtml(value);
    }


    function escapeJavaScript(value) {
      return String(
        value == null
          ? ""
          : value
      )
        .replaceAll("\\", "\\\\")
        .replaceAll("'", "\\'")
        .replaceAll("\r", "")
        .replaceAll("\n", "\\n");
    }


    /**********************************************
     * Toast
     **********************************************/

    let toastTimer = null;


    function showToast(
      message,
      type
    ) {
      const toast =
        document.getElementById(
          "toast"
        );

      const icon =
        document.getElementById(
          "toast-icon"
        );

      clearTimeout(
        toastTimer
      );

      document
        .getElementById(
          "toast-message"
        )
        .innerText =
          message || "";

      if (type === "loading") {
        icon.className =
          "fa-solid fa-circle-notch " +
          "fa-spin text-teal-400";
      } else if (type === "error") {
        icon.className =
          "fa-solid fa-triangle-exclamation " +
          "text-rose-400";
      } else {
        icon.className =
          "fa-solid fa-check " +
          "text-emerald-400";
      }

      toast.classList.remove(
        "hidden"
      );

      if (type !== "loading") {
        toastTimer =
          setTimeout(
            function() {
              toast.classList.add(
                "hidden"
              );
            },
            2800
          );
      }
    }
