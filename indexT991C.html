<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>帕金森溫馨交流園地</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            parkinson: {
              darkBg: '#091e11', 
              primary: '#113c20', 
              secondary: '#16522d', 
              accent: '#facc15', // 亮黃高對比
              btn: '#15803d', 
              btnHover: '#166534',
              bgLight: '#f8fafc',
              cardBg: '#ffffff'
            }
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --base-font-size: 22px; /* 長者友善超大字體 */
    }
    body {
      font-size: var(--base-font-size);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f1f5f9;
      touch-action: manipulation; /* 消除雙擊延遲 */
    }
    /* 超大防手震點擊熱區 */
    .accessible-touch-target {
      min-height: 64px;
      padding: 14px 24px;
    }
    .accessible-focus:focus {
      outline: 6px solid #facc15 !important;
      outline-offset: 4px;
    }
  </style>
</head>
<body class="text-slate-900 pb-36">

  <!-- 主內容區 (無上方固定標頭，畫面乾淨俐落) -->
  <main class="max-w-md mx-auto px-4 py-6 space-y-6">

    <!-- 歡迎與身分提示區 (非固定，隨螢幕滾動) -->
    <div class="bg-gradient-to-br from-parkinson-primary to-parkinson-secondary text-white p-5 rounded-3xl shadow-md border-b-4 border-parkinson-accent">
      <div class="flex justify-between items-center">
        <div>
          <span class="text-xs bg-parkinson-accent text-slate-950 px-3 py-1 rounded-full font-black" id="roleBadge">👴 一般病友</span>
          <h1 class="text-2xl font-black tracking-wide mt-1" id="welcomeUser">您好，台中老王</h1>
        </div>
        <button onclick="switchTab('settings-tab')" class="w-12 h-12 bg-white/10 hover:bg-white/20 rounded-full flex items-center justify-center border border-white/20 accessible-focus" title="切換身分/設定">
          <i class="fa-solid fa-user-gear text-xl"></i>
        </button>
      </div>
    </div>

    <!-- ================= 1. 交流動態分頁 ================= -->
    <section id="wall-tab" class="tab-content space-y-4">
      <!-- 篩選器 (大按鈕平鋪) -->
      <div class="bg-white p-4 rounded-3xl shadow-md border-2 border-slate-200">
        <p class="font-black text-slate-700 mb-3 text-center text-lg"><i class="fa-solid fa-filter text-parkinson-secondary mr-1"></i>請選擇想看的內容：</p>
        <div class="grid grid-cols-2 gap-3">
          <button onclick="filterCategory('全部')" class="cat-btn active accessible-touch-target rounded-2xl font-black text-lg transition bg-parkinson-primary text-white border-2 border-parkinson-primary" data-cat="全部">全部文章</button>
          <button onclick="filterCategory('用藥與復健')" class="cat-btn accessible-touch-target rounded-2xl font-black text-lg transition bg-slate-100 text-slate-800 border-2 border-slate-300" data-cat="用藥與復健">💊 用藥復健</button>
          <button onclick="filterCategory('經驗分享')" class="cat-btn accessible-touch-target rounded-2xl font-black text-lg transition bg-slate-100 text-slate-800 border-2 border-slate-300" data-cat="經驗分享">💡 經驗分享</button>
          <button onclick="filterCategory('我的收藏')" class="cat-btn accessible-touch-target rounded-2xl font-black text-lg transition bg-amber-100 text-amber-950 border-2 border-amber-400" data-cat="我的收藏">⭐ 我的收藏</button>
        </div>
      </div>

      <!-- 搜尋與重新整理 -->
      <div class="bg-white p-3 rounded-3xl shadow-md border-2 border-slate-200 flex gap-3">
        <input type="text" id="searchInput" oninput="handleSearch()" placeholder="🔍 輸入關鍵字搜尋..." class="accessible-touch-target flex-1 border-2 border-slate-300 rounded-2xl px-4 text-lg font-bold accessible-focus">
        <button onclick="loadPostsFromApi()" class="accessible-touch-target px-5 bg-emerald-100 text-parkinson-primary font-black rounded-2xl border-2 border-emerald-300" title="重新整理">
          <i class="fa-solid fa-rotate-right text-xl"></i>
        </button>
      </div>

      <!-- 貼文數量 -->
      <div class="px-2 flex justify-between items-center">
        <span id="postCountDisplay" class="text-sm font-black text-slate-500 bg-slate-200 px-3 py-1 rounded-full">共 0 篇貼文</span>
        <!-- 管理員專屬：快速發文按鈕 -->
        <button id="adminQuickPostBtn" onclick="switchTab('post-tab')" class="hidden bg-parkinson-accent text-slate-950 text-sm font-black px-4 py-2 rounded-full border-2 border-yellow-500 shadow-md">
          <i class="fa-solid fa-plus mr-1"></i>建立主題
        </button>
      </div>

      <!-- 文章列表 -->
      <div id="postsList" class="space-y-5">
        <!-- 動態載入 -->
      </div>
    </section>

    <!-- ================= 2. 建立主題分頁 (僅管理員可見/操作) ================= -->
    <section id="post-tab" class="tab-content hidden space-y-4">
      <div class="bg-white p-5 rounded-3xl shadow-md border-2 border-emerald-600 space-y-5">
        <div class="flex justify-between items-center border-b-2 border-slate-100 pb-3">
          <h2 class="text-2xl font-black text-parkinson-primary flex items-center gap-2">
            <i class="fa-solid fa-pen-to-square"></i>
            <span id="formTitle">發表新貼文</span>
          </h2>
          <button onclick="resetPostForm(); switchTab('wall-tab');" class="text-slate-400 hover:text-slate-600 font-black text-2xl p-2">✕</button>
        </div>

        <!-- 隱藏欄位，用於編輯模式 -->
        <input type="hidden" id="editPostId" value="">

        <!-- 1. 分類 -->
        <div>
          <label class="block font-black mb-2 text-slate-800">1. 選擇主題分類</label>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" onclick="selectFormCategory('經驗分享', this)" class="form-cat-btn active accessible-touch-target rounded-2xl font-black text-base border-2 border-parkinson-primary bg-parkinson-primary text-white">💡 經驗分享</button>
            <button type="button" onclick="selectFormCategory('用藥與復健', this)" class="form-cat-btn accessible-touch-target rounded-2xl font-black text-base border-2 border-slate-300 bg-slate-50 text-slate-800">💊 用藥復健</button>
            <button type="button" onclick="selectFormCategory('照護心得', this)" class="form-cat-btn accessible-touch-target rounded-2xl font-black text-base border-2 border-slate-300 bg-slate-50 text-slate-800">🤝 照護心得</button>
            <button type="button" onclick="selectFormCategory('門診諮詢', this)" class="form-cat-btn accessible-touch-target rounded-2xl font-black text-base border-2 border-slate-300 bg-slate-50 text-slate-800">🩺 門診備忘</button>
          </div>
          <input type="hidden" id="postCategory" value="經驗分享">
        </div>

        <!-- 2. 標題 -->
        <div class="space-y-1">
          <label class="block font-black text-slate-800" for="postTitle">2. 填寫標題</label>
          <div class="flex flex-col gap-2">
            <input type="text" id="postTitle" placeholder="例如：今天散步走了20分鐘" class="accessible-touch-target w-full border-2 border-slate-300 rounded-2xl px-4 text-lg font-bold accessible-focus">
            <button type="button" onclick="startSpeechRecognition('postTitle', this)" class="accessible-touch-target w-full bg-red-50 hover:bg-red-100 text-red-700 font-black rounded-2xl border-2 border-red-300 flex items-center justify-center gap-2">
              <i class="fa-solid fa-microphone text-2xl"></i>
              <span>按我用語音輸入標題</span>
            </button>
          </div>
        </div>

        <!-- 3. 詳細內容 -->
        <div class="space-y-1">
          <label class="block font-black text-slate-800" for="postContent">3. 填寫詳細內容</label>
          <div class="flex flex-col gap-2">
            <textarea id="postContent" rows="4" placeholder="可以寫下今天的身體狀況、用藥後的反應..." class="w-full border-2 border-slate-300 rounded-2xl p-4 text-lg font-bold accessible-focus"></textarea>
            <button type="button" onclick="startSpeechRecognition('postContent', this)" class="accessible-touch-target w-full bg-red-50 hover:bg-red-100 text-red-700 font-black rounded-2xl border-2 border-red-300 flex items-center justify-center gap-2">
              <i class="fa-solid fa-microphone text-2xl"></i>
              <span>按我用語音輸入內容</span>
            </button>
          </div>
        </div>

        <!-- 4. 附加照片 (最多3張，小圖顯示，點擊放大) -->
        <div class="space-y-2">
          <label class="block font-black text-slate-800">4. 附上照片 (最多3張，選填)</label>
          <input type="file" id="postImageFiles" accept="image/*" multiple onchange="handleMultipleImages(event)" class="hidden">
          <button type="button" onclick="document.getElementById('postImageFiles').click()" class="accessible-touch-target w-full bg-slate-100 hover:bg-slate-200 text-slate-800 font-black rounded-2xl border-2 border-slate-400 flex items-center justify-center gap-2">
            <i class="fa-solid fa-camera text-2xl text-emerald-700"></i>
            <span>點此拍照或選取照片 (可多選)</span>
          </button>
          <!-- 預覽區 -->
          <div id="imagePreviews" class="grid grid-cols-3 gap-2 pt-2"></div>
        </div>

        <!-- 5. 附加檔案連結 (可一次建立多筆) -->
        <div class="space-y-2">
          <label class="block font-black text-slate-800">5. 附加檔案連結 (選填)</label>
          <div id="linkInputsContainer" class="space-y-2">
            <!-- 動態新增連結輸入框 -->
          </div>
          <button type="button" onclick="addLinkInputField()" class="accessible-touch-target w-full bg-sky-50 hover:bg-sky-100 text-sky-800 font-black rounded-2xl border-2 border-sky-300 flex items-center justify-center gap-2">
            <i class="fa-solid fa-plus text-xl"></i>
            <span>新增一筆檔案/網頁連結</span>
          </button>
        </div>

        <!-- 送出按鈕 -->
        <button onclick="handleCreatePost()" class="accessible-touch-target w-full bg-parkinson-btn hover:bg-parkinson-btnHover text-white text-xl font-black rounded-2xl shadow-lg border-2 border-emerald-700 flex items-center justify-center gap-2">
          <i class="fa-solid fa-paper-plane"></i>
          <span id="submitBtnText">確認送出貼文</span>
        </button>
      </div>
    </section>

    <!-- ================= 3. 門診諮詢卡分頁 ================= -->
    <section id="doctor-tab" class="tab-content hidden space-y-4">
      <div class="bg-white p-5 rounded-3xl shadow-md border-2 border-sky-600 space-y-4">
        <h2 class="text-2xl font-black text-sky-950 border-b-2 border-slate-100 pb-2 flex items-center gap-2">
          <i class="fa-solid fa-notes-medical text-sky-600"></i>
          <span>門診復健諮詢卡</span>
        </h2>
        <p class="text-base text-slate-600 font-bold leading-relaxed">
          系統會自動整理您發表的紀錄，看診時直接展示給醫生看，溝通更輕鬆！
        </p>

        <div id="doctorReportContent" class="space-y-3">
          <!-- 動態產生 -->
        </div>

        <button onclick="window.print()" class="accessible-touch-target w-full bg-sky-700 hover:bg-sky-800 text-white font-black rounded-2xl shadow-lg flex items-center justify-center gap-2">
          <i class="fa-solid fa-print text-xl"></i>
          <span>列印或儲存諮詢卡</span>
        </button>
      </div>
    </section>

    <!-- ================= 4. 設定與角色分頁 ================= -->
    <section id="settings-tab" class="tab-content hidden space-y-4">
      <!-- 字體調整 -->
      <div class="bg-white p-5 rounded-3xl shadow-md border-2 border-slate-200 space-y-3">
        <h3 class="text-xl font-black text-slate-800"><i class="fa-solid fa-font text-parkinson-secondary mr-1"></i>調整字體大小</h3>
        <div class="grid grid-cols-3 gap-2">
          <button onclick="setFontSize(20)" class="font-btn accessible-touch-target rounded-2xl font-black text-lg bg-slate-100 border-2 border-slate-300" data-size="20">標準 (20)</button>
          <button onclick="setFontSize(24)" class="font-btn accessible-touch-target rounded-2xl font-black text-xl bg-slate-100 border-2 border-slate-300" data-size="24">放大 (24)</button>
          <button onclick="setFontSize(28)" class="font-btn accessible-touch-target rounded-2xl font-black text-2xl bg-slate-100 border-2 border-slate-300" data-size="28">特大 (28)</button>
        </div>
      </div>

      <!-- 角色切換 -->
      <div class="bg-white p-5 rounded-3xl shadow-md border-2 border-slate-200 space-y-3">
        <h3 class="text-xl font-black text-slate-800"><i class="fa-solid fa-user-gear text-parkinson-secondary mr-1"></i>切換使用者身分</h3>
        <div class="space-y-2">
          <button onclick="changeCurrentUser('u1')" class="user-btn w-full accessible-touch-target rounded-2xl font-black text-left flex items-center justify-between border-2 border-slate-300 bg-white text-slate-800" id="user-btn-u1">
            <span>👴 台中老王 (一般病友)</span>
            <i class="fa-solid fa-circle-check text-slate-200"></i>
          </button>
          <button onclick="changeCurrentUser('u2')" class="user-btn w-full accessible-touch-target rounded-2xl font-black text-left flex items-center justify-between border-2 border-slate-300 bg-white text-slate-800" id="user-btn-u2">
            <span>👩 照護者阿美 (照護會員)</span>
            <i class="fa-solid fa-circle-check text-slate-200"></i>
          </button>
          <button onclick="changeCurrentUser('admin1')" class="user-btn w-full accessible-touch-target rounded-2xl font-black text-left flex items-center justify-between border-2 border-slate-300 bg-white text-slate-800" id="user-btn-admin1">
            <span>👑 站長小林 (系統管理員)</span>
            <i class="fa-solid fa-circle-check text-slate-200"></i>
          </button>
        </div>
      </div>

      <!-- API 連線 -->
      <div class="bg-white p-5 rounded-3xl shadow-md border-2 border-slate-200 space-y-3">
        <h3 class="text-xl font-black text-slate-800"><i class="fa-solid fa-link text-parkinson-secondary mr-1"></i>雲端同步設定</h3>
        <input type="text" id="gasApiUrl" placeholder="請貼上 GAS API 網址..." class="accessible-touch-target w-full border-2 border-slate-300 rounded-2xl px-4 text-base font-bold accessible-focus">
        <div class="grid grid-cols-2 gap-2">
          <button onclick="saveApiUrl()" class="accessible-touch-target bg-parkinson-primary text-white font-black rounded-2xl border-2 border-parkinson-primary">儲存並連線</button>
          <button onclick="useMockDataMode()" class="accessible-touch-target bg-slate-200 text-slate-800 font-black rounded-2xl border-2 border-slate-300">模擬模式</button>
        </div>
      </div>
    </section>

  </main>

  <!-- ♿ 超大手機底部導航欄 (LINE 風格，單手輕鬆操作) -->
  <nav class="fixed bottom-0 left-0 right-0 bg-parkinson-primary border-t-4 border-parkinson-accent shadow-2xl z-50">
    <div class="max-w-md mx-auto grid grid-cols-4 text-center" id="bottomNavBar">
      <button onclick="switchTab('wall-tab')" id="nav-wall-tab" class="nav-btn py-4 text-white flex flex-col items-center justify-center gap-1 border-r border-emerald-900 bg-parkinson-secondary">
        <i class="fa-solid fa-comments text-2xl"></i>
        <span class="text-xs font-black">交流動態</span>
      </button>
      <!-- 發文按鈕 (將動態根據管理員身分顯示/隱藏) -->
      <button onclick="switchTab('post-tab')" id="nav-post-tab" class="nav-btn py-4 text-white flex flex-col items-center justify-center gap-1 border-r border-emerald-900 hidden">
        <i class="fa-solid fa-pen-to-square text-2xl"></i>
        <span class="text-xs font-black">建立主題</span>
      </button>
      <button onclick="switchTab('doctor-tab')" id="nav-doctor-tab" class="nav-btn py-4 text-white flex flex-col items-center justify-center gap-1 border-r border-emerald-900">
        <i class="fa-solid fa-notes-medical text-2xl"></i>
        <span class="text-xs font-black">門診卡</span>
      </button>
      <button onclick="switchTab('settings-tab')" id="nav-settings-tab" class="nav-btn py-4 text-white flex flex-col items-center justify-center gap-1">
        <i class="fa-solid fa-gear text-2xl"></i>
        <span class="text-xs font-black">設定</span>
      </button>
    </div>
  </nav>

  <!-- 🖼️ 圖片放大 Lightbox 燈箱 (點擊圖片放大，防誤觸超大關閉按鈕) -->
  <div id="lightboxModal" class="fixed inset-0 bg-black/95 z-50 flex flex-col items-center justify-center p-4 hidden" onclick="closeLightbox()">
    <div class="relative max-w-full max-h-[80vh] flex items-center justify-center">
      <img id="lightboxImage" src="" alt="放大圖片" class="max-w-full max-h-[75vh] rounded-xl object-contain border-2 border-white/20">
    </div>
    <button onclick="closeLightbox()" class="mt-6 accessible-touch-target bg-white text-slate-950 font-black rounded-full px-8 text-lg shadow-2xl border-4 border-parkinson-accent">
      ✕ 關閉視窗
    </button>
  </div>

  <!-- 自訂刪除確認 Modal -->
  <div id="confirmModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white max-w-sm w-full rounded-3xl p-6 shadow-2xl space-y-4 text-center border-4 border-red-500">
      <div class="w-20 h-20 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto text-4xl font-black">⚠️</div>
      <h3 class="text-2xl font-black text-slate-900" id="confirmTitle">確定要刪除嗎？</h3>
      <p class="text-slate-600 text-lg font-bold" id="confirmMessage">刪除後將無法恢復此紀錄。</p>
      <div class="flex flex-col gap-2 pt-2">
        <button id="confirmYesBtn" class="accessible-touch-target w-full bg-red-600 hover:bg-red-700 text-white font-black rounded-2xl shadow text-lg">確定刪除</button>
        <button onclick="closeConfirmModal()" class="accessible-touch-target w-full bg-slate-200 hover:bg-slate-300 text-slate-800 font-black rounded-2xl text-lg">取消</button>
      </div>
    </div>
  </div>

  <!-- Toast 提示 -->
  <div id="toastModal" class="fixed bottom-28 left-4 right-4 z-50 transform translate-y-32 transition-transform duration-300 pointer-events-none">
    <div id="toastContent" class="bg-slate-900 text-white px-6 py-4 rounded-2xl shadow-2xl flex items-center justify-center gap-3 font-black text-lg border-2 border-slate-700">
      <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400 text-2xl"></i>
      <span id="toastMessage">訊息已更新</span>
    </div>
  </div>

  <script>
    // 全域使用者身分
    const USERS = {
      'u1': { id: 'u1', name: '台中老王', role: 'member', roleLabel: '👴 一般病友' },
      'u2': { id: 'u2', name: '照護者阿美', role: 'member', roleLabel: '👩 照護會員' },
      'admin1': { id: 'admin1', name: '站長小林', role: 'admin', roleLabel: '👑 系統管理員' }
    };

    let currentUser = USERS['u1'];
    const DEFAULT_GAS_API_URL = 'https://script.google.com/macros/s/AKfycbzxv7-EUbcbi7n29zKIEqLyEhsaYH67O0pYsBfgMVKzwucmWGDIo8kjzrnHZQ1f78ti/exec';

    let GAS_API_URL = localStorage.getItem('PARKINSON_FORUM_API') || DEFAULT_GAS_API_URL;
    let isMockMode = !GAS_API_URL || GAS_API_URL.includes('YOUR_DEPLOYMENT_ID_HERE');
    let currentCategory = '全部';
    let searchQuery = '';
    let selectedImages = []; // 儲存最多3張 Base64 圖片
    let bookmarkedPostIds = JSON.parse(localStorage.getItem('PARKINSON_BOOKMARKS') || '[]');

    // 預設模擬資料
    let mockPosts = [
      {
        postId: 'P_1001',
        category: '門診諮詢',
        title: '📌 站長提醒：如何為回診準備症狀備忘？',
        content: '各位病友大家好的，建議平時可在論壇記錄每日用藥後的肢體反應，並點選「產生門診諮詢卡」列印出來，回診時能幫助醫師更準確調整藥物劑量！',
        author: '站長小林',
        authorId: 'admin1',
        authorRole: 'admin',
        images: ['https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?w=800&auto=format&fit=crop&q=80'],
        links: [{ name: '帕金森自我檢測手冊', url: 'https://example.com/pdf' }],
        isPinned: true,
        likes: ['u1', 'u2'],
        createdAt: '2026-08-03 09:00',
        replies: []
      },
      {
        postId: 'P_1002',
        category: '用藥與復健',
        title: '每日定時超慢跑與防震餐具體驗分享',
        content: '確診第三年，每天在家嘗試 20 分鐘超慢跑，發現肢體僵硬顯著改善。另外最近換了加重防震湯匙，吃稀飯不再弄髒衣服了！',
        author: '台中老王',
        authorId: 'u1',
        authorRole: 'member',

    // 發表文章分類選擇

      document.getElementById('postCategory').value = cat;
      document.querySelectorAll('.form-cat-btn').forEach(b => {

      });

    // 處理多張圖片上傳 (最多3張)
    function handleMultipleImages(event) {
      const files = Array.from(event.target.files);
      if (selectedImages.length + files.length > 3) {
        showToast('最多只能附加 3 張照片喔！', 'warning');
        return;
      }

      files.forEach(file => {
        if (file.size > 2 * 1024 * 1024) {
          showToast('單張圖片請勿超過 2MB', 'warning');
          return;
        }
        const reader = new FileReader();
        reader.onload = function(e) {
          selectedImages.push(e.target.result);
          renderSelectedImages();
        };
        reader.readAsDataURL(file);
      });
    }

    function renderSelectedImages() {
      const container = document.getElementById('imagePreviews');
      container.innerHTML = selectedImages.map((img, idx) => `
        <div class="relative">
          <img src="${img}" class="w-full h-24 object-cover rounded-xl border-2 border-emerald-500">
          <button type="button" onclick="removeSelectedImage(${idx})" class="absolute -top-2 -right-2 bg-red-600 text-white rounded-full w-8 h-8 flex items-center justify-center font-black text-sm shadow-md">✕</button>
        </div>
      `).join('');
    }

    function removeSelectedImage(idx) {
      selectedImages.splice(idx, 1);
      renderSelectedImages();

    // 處理多筆附加連結
    function addLinkInputField(name = '', url = '') {
      const container = document.getElementById('linkInputsContainer');
      const div = document.createElement('div');
      div.className = 'flex gap-2 items-center bg-slate-50 p-3 rounded-2xl border-2 border-slate-200';
      div.innerHTML = `
        <div class="flex-1 space-y-1">
          <input type="text" placeholder="連結名稱 (如: 復健教學影片)" value="${name}" class="link-name-input w-full border border-slate-300 rounded-xl px-3 py-1.5 text-base font-bold">

        </div>
        <button type="button" onclick="this.parentElement.remove()" class="bg-red-100 text-red-600 w-12 h-12 rounded-xl flex items-center justify-center border border-red-300"><i class="fa-solid fa-trash"></i></button>

    function getFormLinks() {
      const links = [];
      const names = document.querySelectorAll('.link-name-input');
      const urls = document.querySelectorAll('.link-url-input');
      names.forEach((el, idx) => {
        const name = el.value.trim();
        const url = urls[idx].value.trim();
        if (name && url) {
          links.push({ name, url });
        }
      });
      return links;
    }

    // 燈箱放大功能
    function openLightbox(src) {
      document.getElementById('lightboxImage').src = src;
      document.getElementById('lightboxModal').classList.remove('hidden');
    }

    function closeLightbox() {
      document.getElementById('lightboxModal').classList.add('hidden');
    }

    // 語音辨識
    function startSpeechRecognition(inputId, btnElement) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        showToast('您的手機不支援語音辨識', 'warning');
        return;
      }
      const recognition = new SpeechRecognition();
      recognition.lang = 'zh-TW';
      recognition.interimResults = false;

      const originalHtml = btnElement.innerHTML;
      btnElement.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-2xl mr-2"></i><span>正在聆聽中...</span>`;
      recognition.start();

      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        const targetInput = document.getElementById(inputId);
        if (targetInput) {
          targetInput.value = targetInput.value ? (targetInput.value + ' ' + transcript) : transcript;
        }
        showToast('語音辨識成功！', 'success');
      };
      recognition.onerror = function() { showToast('沒聽清楚，請再試一次', 'warning'); };
      recognition.onend = function() { btnElement.innerHTML = originalHtml; };
    }

    // 從 API 載入
    async function loadPostsFromApi() {
      const container = document.getElementById('postsList');
      container.innerHTML = `
        <div class="bg-white p-8 rounded-3xl text-center text-slate-500 shadow-sm border-2 border-slate-200">
          <i class="fa-solid fa-circle-notch fa-spin text-4xl text-parkinson-primary mb-3"></i>
          <p class="font-black">最新資料讀取中...</p>
        </div>
      `;
      if (isMockMode) {
        setTimeout(() => renderPosts(mockPosts), 200);
        return;
      }
      try {
        const res = await fetch(`${GAS_API_URL}?action=getPosts`);
        const json = await res.json();
        if (json.status === 'success') {
          mockPosts = json.data;
          renderPosts(mockPosts);
        } else {
          renderPosts(mockPosts);
        }
      } catch (err) {
        renderPosts(mockPosts);
      }
    }

    // 渲染文章
    function renderPosts(posts) {
      const container = document.getElementById('postsList');
      const isAdmin = currentUser.role === 'admin';

      let filtered = posts.filter(p => {
        let matchCat = (currentCategory === '全部') || (p.category === currentCategory);
        if (currentCategory === '我的收藏') {
          matchCat = bookmarkedPostIds.includes(p.postId);
        }
        const matchSearch = !searchQuery || 
          p.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
          p.content.toLowerCase().includes(searchQuery.toLowerCase()) ||
          p.author.toLowerCase().includes(searchQuery.toLowerCase());
        return matchCat && matchSearch;
      });

      filtered.sort((a, b) => {
        if (a.isPinned && !b.isPinned) return -1;
        if (!a.isPinned && b.isPinned) return 1;
        return new Date(b.createdAt.replace(' ', 'T')) - new Date(a.createdAt.replace(' ', 'T'));
      });

      document.getElementById('postCountDisplay').innerText = `共 ${filtered.length} 篇貼文`;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="bg-white p-12 rounded-3xl text-center text-slate-500 shadow-md border-2 border-slate-200">
            <i class="fa-regular fa-comments text-6xl text-slate-300 mb-2"></i>
            <p class="text-xl font-black">目前沒有文章</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(post => {
        const hasLiked = (post.likes || []).includes(currentUser.id);
        const isBookmarked = bookmarkedPostIds.includes(post.postId);
        const images = post.images || (post.imageUrl ? [post.imageUrl] : []);
        const links = post.links || [];

        return `
          <article class="bg-white p-5 rounded-3xl shadow-md border-2 ${post.isPinned ? 'border-amber-400 bg-amber-50/20' : 'border-slate-200'} space-y-4">
            
            <!-- 頂部資訊 -->
            <div class="flex flex-wrap justify-between items-center gap-2 border-b-2 border-slate-100 pb-2">
              <div class="flex items-center gap-2 flex-wrap">
                ${post.isPinned ? `<span class="bg-amber-500 text-white text-xs font-black px-2.5 py-1 rounded-full"><i class="fa-solid fa-thumbtack"></i> 置頂</span>` : ''}
                <span class="bg-emerald-100 text-parkinson-primary text-sm font-black px-2.5 py-1 rounded-full">${post.category}</span>
                <span class="font-black text-slate-800 text-base"><i class="fa-regular fa-user text-parkinson-secondary mr-1"></i>${post.author}</span>
              </div>
              <span class="text-xs text-slate-400 font-bold">${post.createdAt}</span>
            </div>

            <!-- 內容 -->
            <div class="space-y-2">
              <h3 class="text-xl font-black text-slate-900 leading-snug">${post.title}</h3>
              <p class="text-slate-800 text-lg leading-relaxed whitespace-pre-line">${post.content}</p>
              
              <!-- 圖片預覽區 (點擊放大) -->
              ${images.length > 0 ? `
                <div class="grid grid-cols-3 gap-2 mt-2">
                  ${images.map(img => `
                    <img src="${img}" onclick="openLightbox('${img}')" class="h-20 w-full rounded-xl object-cover border-2 border-slate-200 cursor-zoom-in hover:opacity-90 transition">
                  `).join('')}
                </div>
              ` : ''}

              <!-- 附加檔案連結 -->
              ${links.length > 0 ? `
                <div class="mt-3 space-y-2">
                  <p class="text-xs font-black text-slate-500"><i class="fa-solid fa-paperclip mr-1"></i>附加檔案與連結：</p>
                  <div class="flex flex-wrap gap-2">
                    ${links.map(link => `
                      <a href="${link.url}" target="_blank" class="inline-flex items-center gap-1 bg-sky-50 hover:bg-sky-100 text-sky-800 text-sm font-black px-3 py-2 rounded-xl border border-sky-300">
                        <i class="fa-solid fa-arrow-up-right-from-square"></i>
                        <span>${link.name}</span>
                      </a>
                    `).join('')}
                  </div>
                </div>
              ` : ''}
            </div>

            <!-- 互動按鈕 -->
            <div class="grid grid-cols-3 gap-2 pt-2 border-t-2 border-slate-100">
              <button onclick="handleToggleLike('${post.postId}')" class="accessible-touch-target rounded-2xl font-black text-base flex items-center justify-center gap-1 border-2 ${hasLiked ? 'bg-red-100 text-red-600 border-red-300' : 'bg-slate-50 text-slate-600 border-slate-300'}">
                <i class="${hasLiked ? 'fa-solid text-red-500' : 'fa-regular'} fa-heart text-xl"></i>
                <span>讚 (${(post.likes || []).length})</span>
              </button>
              <button onclick="toggleBookmark('${post.postId}')" class="accessible-touch-target rounded-2xl font-black text-base flex items-center justify-center gap-1 border-2 ${isBookmarked ? 'bg-amber-100 text-amber-800 border-amber-300' : 'bg-slate-50 text-slate-600 border-slate-300'}">
                <i class="${isBookmarked ? 'fa-solid text-amber-600' : 'fa-regular'} fa-bookmark text-xl"></i>
                <span>收藏</span>
              </button>
              
              <!-- 管理員專屬功能選單 (置頂、編輯、刪除) -->
              ${isAdmin ? `
                <div class="flex gap-1">
                  <button onclick="handleTogglePin('${post.postId}')" class="flex-1 accessible-touch-target rounded-2xl font-black text-base bg-amber-50 text-amber-700 border-2 border-amber-200 flex items-center justify-center" title="置頂">
                    <i class="fa-solid fa-thumbtack"></i>
                  </button>
                  <button onclick="startEditPost('${post.postId}')" class="flex-1 accessible-touch-target rounded-2xl font-black text-base bg-blue-50 text-blue-700 border-2 border-blue-200 flex items-center justify-center" title="編輯">
                    <i class="fa-solid fa-pen"></i>
                  </button>
                  <button onclick="promptDeletePost('${post.postId}')" class="flex-1 accessible-touch-target rounded-2xl font-black text-base bg-red-50 text-red-600 border-2 border-red-200 flex items-center justify-center" title="刪除">
                    <i class="fa-solid fa-trash"></i>
                  </button>
                </div>
              ` : `<div class="bg-transparent"></div>`}
            </div>

            <!-- 留言區 -->
            <div class="bg-slate-50 p-3 rounded-2xl space-y-2 border-2 border-slate-100">
              <div class="space-y-2">
                ${(post.replies && post.replies.length > 0) ? post.replies.map(r => `
                  <div class="bg-white p-3 rounded-xl border-2 border-slate-100 text-sm space-y-1">
                    <div class="flex justify-between items-center font-black text-slate-700">
                      <span>👴 ${r.author}</span>
                      <span class="text-xs text-slate-400 font-normal">${r.createdAt}</span>
                    </div>
                    <p class="text-slate-800 text-base font-bold">${r.content}</p>
                  </div>
                `).join('') : '<p class="text-xs text-slate-400 italic py-1 text-center">歡迎留言給予鼓勵！</p>'}
              </div>
              <div class="flex gap-2 pt-1">
                <input type="text" id="replyText-${post.postId}" placeholder="寫下溫馨回覆..." class="accessible-touch-target flex-1 border-2 border-slate-300 rounded-2xl px-3 text-base font-bold accessible-focus">
                <button onclick="handleCreateReply('${post.postId}')" class="accessible-touch-target px-4 bg-parkinson-secondary text-white font-black rounded-2xl border-2 border-emerald-700">留言</button>
              </div>
            </div>

          </article>
        `;
      }).join('');
    }

    // 編輯貼文初始化
    function startEditPost(postId) {
      const post = mockPosts.find(p => p.postId === postId);
      if (!post) return;

      document.getElementById('editPostId').value = post.postId;
      document.getElementById('postTitle').value = post.title;
      document.getElementById('postContent').value = post.content;
      document.getElementById('postCategory').value = post.category;
      
      // 分類按鈕選取
      document.querySelectorAll('.form-cat-btn').forEach(btn => {
        if (btn.innerText.includes(post.category)) {
          btn.classList.add('active', 'bg-parkinson-primary', 'text-white');
        } else {
          btn.classList.remove('active', 'bg-parkinson-primary', 'text-white');
        }
      });

      // 圖片載入
      selectedImages = [...(post.images || [])];
      renderSelectedImages();

      // 連結載入
      const container = document.getElementById('linkInputsContainer');
      container.innerHTML = '';
      if (post.links && post.links.length > 0) {
        post.links.forEach(link => addLinkInputField(link.name, link.url));
      } else {
        addLinkInputField();
      }

      document.getElementById('formTitle').innerText = '編輯貼文';
      document.getElementById('submitBtnText').innerText = '儲存修改';
      switchTab('post-tab');
    }

    // 送出/修改文章
    async function handleCreatePost() {
      const editPostId = document.getElementById('editPostId').value;
      const category = document.getElementById('postCategory').value;
      const title = document.getElementById('postTitle').value.trim();
      const content = document.getElementById('postContent').value.trim();
      const links = getFormLinks();

      if (!title || !content) {
        showToast('請填寫標題與內容喔！', 'warning');
        return;
      }

      if (editPostId) {
        // 編輯模式
        const post = mockPosts.find(p => p.postId === editPostId);
        if (post) {
          post.category = category;
          post.title = title;
          post.content = content;
          post.images = [...selectedImages];
          post.links = links;
        }
        showToast('修改成功！', 'success');
      } else {
        // 新增模式
        const newPost = {
          postId: 'P_' + Date.now(),
          category,
          title,
          content,
          author: currentUser.name,
          authorId: currentUser.id,
          authorRole: currentUser.role,
          images: [...selectedImages],
          links: links,
          isPinned: false,
          likes: [],
          createdAt: getFormattedDateTime(),
          replies: []
        };
        mockPosts.unshift(newPost);
        showToast('發表成功！', 'success');
      }

      resetPostForm();
      renderPosts(mockPosts);
      switchTab('wall-tab');
    }

    // 管理員置頂控制
    async function handleTogglePin(postId) {
      const post = mockPosts.find(p => p.postId === postId);
      if (post) {
        post.isPinned = !post.isPinned;
        showToast(post.isPinned ? '已置頂貼文' : '已取消置頂', 'success');
        renderPosts(mockPosts);
      }
    }

    // 按讚
    function handleToggleLike(postId) {
      const post = mockPosts.find(p => p.postId === postId);
      if (!post) return;
      if (!post.likes) post.likes = [];
      const idx = post.likes.indexOf(currentUser.id);
      if (idx > -1) {
        post.likes.splice(idx, 1);
      } else {
        post.likes.push(currentUser.id);
        showToast('感謝您的按讚！', 'success');
      }
      renderPosts(mockPosts);
    }

    // 收藏
    function toggleBookmark(postId) {
      const idx = bookmarkedPostIds.indexOf(postId);
      if (idx > -1) {
        bookmarkedPostIds.splice(idx, 1);
        showToast('已移出收藏', 'info');
      } else {
        bookmarkedPostIds.push(postId);
        showToast('已加入收藏！', 'success');
      }
      localStorage.setItem('PARKINSON_BOOKMARKS', JSON.stringify(bookmarkedPostIds));
      renderPosts(mockPosts);
    }

    // 刪除
    let pendingDeleteAction = null;
    function promptDeletePost(postId) {
      pendingDeleteAction = () => {
        mockPosts = mockPosts.filter(p => p.postId !== postId);
        renderPosts(mockPosts);
        showToast('貼文已刪除', 'success');
      };
      document.getElementById('confirmModal').classList.remove('hidden');
    }

    document.getElementById('confirmYesBtn').onclick = function() {
      if (pendingDeleteAction) pendingDeleteAction();
      closeConfirmModal();
    };

    function closeConfirmModal() {
      document.getElementById('confirmModal').classList.add('hidden');
      pendingDeleteAction = null;
    }

    // 快速留言
    function handleCreateReply(postId) {
      const input = document.getElementById(`replyText-${postId}`);
      const content = input.value.trim();
      if (!content) return;

      const post = mockPosts.find(p => p.postId === postId);
      if (post) {
        if (!post.replies) post.replies = [];
        post.replies.push({
          replyId: 'R_' + Date.now(),
          author: currentUser.name,
          authorId: currentUser.id,
          content,
          createdAt: getFormattedDateTime()
        });
        input.value = '';
        renderPosts(mockPosts);
        showToast('留言成功！', 'success');
      }
    }

    // 產生門診卡
    function generateDoctorReport() {
      const container = document.getElementById('doctorReportContent');
      const userPosts = mockPosts.filter(p => p.authorId === currentUser.id);

      if (userPosts.length === 0) {
        container.innerHTML = `<p class="text-center text-slate-400 py-6">尚無發表紀錄。</p>`;
      } else {
        container.innerHTML = `
          <div class="border-b pb-2 text-slate-800 text-lg font-black">
            患者：${currentUser.name} | 產生時間：${new Date().toLocaleDateString('zh-TW')}
          </div>
        ` + userPosts.map((p, idx) => `
          <div class="bg-emerald-50/50 p-4 rounded-2xl border border-emerald-200">
            <div class="font-black text-parkinson-primary">${idx + 1}. [${p.category}] ${p.title}</div>
            <p class="text-slate-700 text-base mt-1 font-bold">${p.content}</p>
          </div>
        `).join('');
      }
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        if (btn.dataset.cat === cat) {
          btn.className = 'cat-btn active accessible-touch-target rounded-2xl font-black text-lg transition bg-parkinson-primary text-white border-2 border-parkinson-primary';
        } else if (btn.dataset.cat === '我的收藏') {
          btn.className = 'cat-btn accessible-touch-target rounded-2xl font-black text-lg transition bg-amber-100 text-amber-950 border-2 border-amber-400';
        } else {
          btn.className = 'cat-btn accessible-touch-target rounded-2xl font-black text-lg transition bg-slate-100 text-slate-800 border-2 border-slate-300';
        }
      });
      renderPosts(mockPosts);
    }

    function handleSearch() {
      searchQuery = document.getElementById('searchInput').value.trim();
      renderPosts(mockPosts);
    }

    function resetPostForm() {
      document.getElementById('editPostId').value = '';
      document.getElementById('postTitle').value = '';
      document.getElementById('postContent').value = '';
      selectedImages = [];
      document.getElementById('imagePreviews').innerHTML = '';
      document.getElementById('linkInputsContainer').innerHTML = '';
      addLinkInputField();
      document.getElementById('formTitle').innerText = '發表新貼文';
      document.getElementById('submitBtnText').innerText = '確認送出貼文';
    }

    function getFormattedDateTime() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    }

    function showToast(message, type = 'success') {
      const toast = document.getElementById('toastModal');
      const toastMsg = document.getElementById('toastMessage');
      const toastIcon = document.getElementById('toastIcon');
      toastMsg.innerText = message;
      toastIcon.className = type === 'warning' ? 'fa-solid fa-triangle-exclamation text-amber-400 text-2xl' : 'fa-solid fa-circle-check text-emerald-400 text-2xl';
      toast.classList.remove('translate-y-32');
      setTimeout(() => toast.classList.add('translate-y-32'), 2500);
    }
  </script>
</body>
</html>
