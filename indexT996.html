<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>活動通 EventHub</title>
<style>
  :root { --g:#06C755; --b:#1E6FD9; --o:#F57C00; --bd:#e5e7eb; --tx:#1f2937; --mu:#6b7280; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Noto Sans TC","PingFang TC",sans-serif; background:#f3f4f6; color:var(--tx); }
  header { background:#fff; border-bottom:1px solid var(--bd); position:sticky; top:0; z-index:10; }
  .bar { max-width:1080px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
  .logo { font-weight:700; color:var(--g); font-size:18px; }
  nav { display:flex; gap:4px; }
  nav button { border:0; background:none; padding:8px 14px; border-radius:8px; font-size:14px; cursor:pointer; color:var(--tx); }
  nav button.on { background:var(--g); color:#fff; }
  main { max-width:1080px; margin:0 auto; padding:16px; }
  .panel { background:#fff; border:1px solid var(--bd); border-radius:12px; padding:14px; }
  .filters { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; margin-bottom:14px; }
  input, select, textarea { width:100%; padding:9px 10px; border:1px solid #d1d5db; border-radius:8px; font:inherit; font-size:14px; background:#fff; }
  input[type=checkbox] { width:auto; }
  input:focus, select:focus, textarea:focus { outline:2px solid #86efac; border-color:var(--g); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; }
  .card { background:#fff; border:1px solid var(--bd); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; cursor:pointer; transition:box-shadow .15s; }
  .card:hover { box-shadow:0 4px 14px rgba(0,0,0,.08); }
  .cover { width:100%; aspect-ratio:20/13; object-fit:cover; background:#e5e7eb; display:block; }
  .cbody { padding:12px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .tags { display:flex; gap:4px; flex-wrap:wrap; font-size:12px; }
  .tag { padding:2px 8px; border-radius:99px; background:#f3f4f6; }
  .tag.官方 { background:#dbeafe; color:#1d4ed8; }
  .tag.揪團 { background:#ffedd5; color:#c2410c; }
  .muted { color:var(--mu); font-size:13px; }
  h3 { margin:0; font-size:16px; }
  .btn { border:0; background:var(--g); color:#fff; padding:9px 16px; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; }
  .btn:hover { filter:brightness(.95); }
  .btn.ghost { background:#fff; color:var(--tx); border:1px solid #d1d5db; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:20; display:flex; align-items:center; justify-content:center; padding:12px; }
  .modal { background:#fff; border-radius:14px; width:100%; max-width:480px; max-height:100%; overflow:auto; }
  .modal .mb { padding:16px; display:flex; flex-direction:column; gap:10px; }
  .field label { font-size:13px; display:block; margin-bottom:3px; }
  .req { color:#dc2626; }
  .err { color:#dc2626; font-size:13px; min-height:18px; }
  #toast { position:fixed; top:64px; left:50%; transform:translateX(-50%); background:#111827; color:#fff; padding:10px 16px; border-radius:10px; font-size:14px; z-index:40; display:none; max-width:90%; }
  #toast.ok { background:var(--g); } #toast.bad { background:#dc2626; }
  .empty { text-align:center; color:var(--mu); padding:40px 0; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo">📅 活動通 EventHub</div>
    <nav id="nav">
      <button data-page="explore">探索活動</button>
      <button data-page="create">建立活動</button>
      <button data-page="manage">統計管理</button>
    </nav>
  </div>
</header>
<main id="view"><div class="empty">載入中…</div></main>
<div id="toast"></div>
<div id="modal-root"></div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script>
import React, { useState, useMemo } from 'react';
import { BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer, PieChart, Pie, Cell } from 'recharts';
import { Calendar, Users, Plus, Search, BarChart3, Send, Trash2 } from 'lucide-react';

const REGIONS = ['台北市', '新北市', '桃園市', '台中市', '台南市', '高雄市', '其他'];
const COLORS = ['#06C755', '#3b82f6', '#f59e0b', '#ef4444', '#8b5cf6', '#14b8a6', '#ec4899'];

const baseFields = () => [
  { id: 'name', label: '姓名', type: 'text', required: true },
  { id: 'phone', label: '聯絡電話', type: 'tel', required: true },
  { id: 'email', label: '電子郵件', type: 'email', required: true },
  { id: 'region', label: '居住地區', type: 'select', required: true, options: REGIONS },
];

const defaultTpl = '🎉 {姓名} 報名成功！\n活動：{活動名稱}\n時間：{日期}\n地點：{地點}\n目前報名：{目前人數}/{名額}';

const seed = [
  {
    id: 1, title: '淡水河岸單車巡禮', organizer: '新北市運動局', region: '新北市', type: '室外', kind: '官方',
    date: '2026-11-08', location: '淡水捷運站', desc: '沿河岸騎乘 20 公里，全程有領隊。', capacity: 40,
    fields: [...baseFields(), { id: 'meal', label: '餐點偏好', type: 'select', required: false, options: ['葷', '素'] }],
    lineGroup: '新北運動同好群', lineTemplate: defaultTpl, statsSel: ['total', 'region', 'feedback', 'meal'],
    regs: [
      { answers: { name: '王小明', region: '新北市', meal: '葷' }, rating: 5, feedback: '路線很棒！' },
      { answers: { name: '李美玲', region: '台北市', meal: '素' }, rating: 4, feedback: '希望增加補給站' },
      { answers: { name: '陳大文', region: '新北市', meal: '葷' }, rating: 5, feedback: '' },
      { answers: { name: '林小芬', region: '桃園市', meal: '葷' }, rating: 3, feedback: '集合時間太早' },
    ],
  },
  {
    id: 2, title: '親子手作陶藝工作坊', organizer: '台中文化中心', region: '台中市', type: '室內', kind: '官方',
    date: '2026-11-15', location: '台中文化創意園區 2F', desc: '適合 5 歲以上親子，材料全包。', capacity: 20,
    fields: baseFields(), lineGroup: '台中親子活動群', lineTemplate: defaultTpl, statsSel: ['total', 'region'],
    regs: [{ answers: { name: '張雅婷', region: '台中市' }, rating: 5, feedback: '孩子很開心' }],
  },
  {
    id: 3, title: '【揪團】週六象山夜爬', organizer: '阿凱（個人）', region: '台北市', type: '室外', kind: '揪團',
    date: '2026-10-31', location: '象山捷運站 2 號出口', desc: '輕鬆夜爬看夜景，自備頭燈與水。', capacity: 10,
    fields: [...baseFields(), { id: 'lamp', label: '是否有頭燈？', type: 'select', required: true, options: ['有', '沒有'] }],
    lineGroup: '夜爬揪團群', lineTemplate: defaultTpl, statsSel: ['total', 'lamp'], regs: [],
  },
];

const input = 'w-full border rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-green-400';
const btn = 'px-4 py-2 rounded-lg text-sm font-medium transition';
const primary = btn + ' bg-green-600 text-white hover:bg-green-700';
const ghost = btn + ' border hover:bg-gray-50';

const fillTpl = (t, ev, name, count) =>
  t.split('{姓名}').join(name).split('{活動名稱}').join(ev.title).split('{日期}').join(ev.date)
    .split('{地點}').join(ev.location).split('{目前人數}').join(count).split('{名額}').join(ev.capacity);

const countBy = (regs, key) => {
  const m = {};
  regs.forEach((r) => { const v = r.answers[key]; if (v) m[v] = (m[v] || 0) + 1; });
  return Object.entries(m).map(([name, value]) => ({ name, value }));
};

export default function App() {
  const [events, setEvents] = useState(seed);
  const [tab, setTab] = useState('explore');
  const [filters, setFilters] = useState({ q: '', organizer: '', region: '', type: '', kind: '' });
  const [regEvent, setRegEvent] = useState(null);
  const [manageId, setManageId] = useState(1);
  const [lineLog, setLineLog] = useState([]);
  const [toast, setToast] = useState(null);

  const organizers = [...new Set(events.map((e) => e.organizer))];
  const list = useMemo(() => events.filter((e) =>
    (!filters.q || (e.title + e.desc).includes(filters.q)) &&
    (!filters.organizer || e.organizer === filters.organizer) &&
    (!filters.region || e.region === filters.region) &&
    (!filters.type || e.type === filters.type) &&
    (!filters.kind || e.kind === filters.kind)), [events, filters]);

  const submitReg = (ev, answers) => {
    const count = ev.regs.length + 1;
    const msg = fillTpl(ev.lineTemplate, ev, answers.name, count);
    setEvents((es) => es.map((e) => e.id === ev.id ? { ...e, regs: [...e.regs, { answers, rating: null, feedback: '' }] } : e));
    setLineLog((l) => [{ group: ev.lineGroup, msg, time: new Date().toLocaleTimeString() }, ...l]);
    setToast(`報名成功！已推送訊息至「${ev.lineGroup}」`);
    setRegEvent(null);
    setTimeout(() => setToast(null), 3500);
  };

  return (
    <div className="min-h-screen bg-gray-50 text-gray-800">
      <header className="bg-white border-b sticky top-0 z-10">
        <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between flex-wrap gap-2">
          <h1 className="text-lg font-bold text-green-600 flex items-center gap-2"><Calendar size={20} />活動通 EventHub</h1>
          <nav className="flex gap-1 flex-wrap">
            {[['explore', '探索活動', Search], ['create', '建立活動', Plus], ['manage', '統計管理', BarChart3], ['line', 'LINE 訊息紀錄', Send]].map(([k, l, I]) => (
              <button key={k} onClick={() => setTab(k)} className={`${btn} flex items-center gap-1 ${tab === k ? 'bg-green-600 text-white' : 'hover:bg-gray-100'}`}>
                <I size={14} />{l}
              </button>
            ))}
          </nav>
        </div>
      </header>

      {toast && <div className="fixed top-16 right-4 bg-green-600 text-white px-4 py-2 rounded-lg shadow-lg z-30 text-sm">{toast}</div>}

      <main className="max-w-6xl mx-auto p-4">
        {tab === 'explore' && <Explore {...{ list, filters, setFilters, organizers, setRegEvent }} />}
        {tab === 'create' && <Create onCreate={(e) => { setEvents((es) => [...es, { ...e, id: Date.now(), regs: [] }]); setTab('explore'); }} />}
        {tab === 'manage' && <Manage events={events} setEvents={setEvents} id={manageId} setId={setManageId} />}
        {tab === 'line' && (
          <div className="space-y-3 max-w-xl">
            <p className="text-sm text-gray-500">模擬 LIFF / Messaging API 推送至 LINE 群組的內容：</p>
            {lineLog.length === 0 && <p className="text-gray-400">尚無訊息，請先報名一個活動。</p>}
            {lineLog.map((l, i) => (
              <div key={i} className="bg-white rounded-xl p-3 border">
                <div className="text-xs text-gray-400 mb-1">→ {l.group}　{l.time}</div>
                <div className="bg-green-100 rounded-lg p-3 whitespace-pre-wrap text-sm">{l.msg}</div>
              </div>
            ))}
          </div>
        )}
      </main>

      {regEvent && <RegModal ev={regEvent} onClose={() => setRegEvent(null)} onSubmit={submitReg} />}
    </div>
  );
}

function Explore({ list, filters, setFilters, organizers, setRegEvent }) {
  const set = (k) => (e) => setFilters({ ...filters, [k]: e.target.value });
  return (
    <div className="space-y-4">
      <div className="bg-white p-4 rounded-xl border grid grid-cols-2 md:grid-cols-5 gap-2">
        <input className={input + ' col-span-2 md:col-span-1'} placeholder="搜尋關鍵字" value={filters.q} onChange={set('q')} />
        <select className={input} value={filters.organizer} onChange={set('organizer')}>
          <option value="">全部主辦單位</option>{organizers.map((o) => <option key={o}>{o}</option>)}
        </select>
        <select className={input} value={filters.region} onChange={set('region')}>
          <option value="">全部地區</option>{REGIONS.map((o) => <option key={o}>{o}</option>)}
        </select>
        <select className={input} value={filters.type} onChange={set('type')}>
          <option value="">室內＋室外</option><option>室內</option><option>室外</option>
        </select>
        <select className={input} value={filters.kind} onChange={set('kind')}>
          <option value="">官方＋個人揪團</option><option>官方</option><option>揪團</option>
        </select>
      </div>
      {list.length === 0 && <p className="text-center text-gray-400 py-10">沒有符合條件的活動</p>}
      <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
        {list.map((e) => {
          const full = e.regs.length >= e.capacity;
          return (
            <div key={e.id} className="bg-white rounded-xl border p-4 flex flex-col gap-2">
              <div className="flex gap-1 flex-wrap text-xs">
                <span className={`px-2 py-0.5 rounded-full ${e.kind === '揪團' ? 'bg-orange-100 text-orange-700' : 'bg-blue-100 text-blue-700'}`}>{e.kind}</span>
                <span className="px-2 py-0.5 rounded-full bg-gray-100">{e.type}</span>
                <span className="px-2 py-0.5 rounded-full bg-gray-100">{e.region}</span>
              </div>
              <h3 className="font-bold">{e.title}</h3>
              <p className="text-xs text-gray-500">主辦：{e.organizer}</p>
              <p className="text-sm text-gray-600 flex-1">{e.desc}</p>
              <p className="text-xs text-gray-500">📅 {e.date}　📍 {e.location}</p>
              <div className="flex items-center justify-between mt-1">
                <span className="text-xs flex items-center gap-1"><Users size={14} />{e.regs.length}/{e.capacity}</span>
                <button disabled={full} onClick={() => setRegEvent(e)} className={primary + (full ? ' opacity-40 cursor-not-allowed' : '')}>{full ? '已額滿' : '立即報名'}</button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function RegModal({ ev, onClose, onSubmit }) {
  const [a, setA] = useState({});
  const [err, setErr] = useState('');
  const go = () => {
    const miss = ev.fields.find((f) => f.required && !a[f.id]);
    if (miss) return setErr(`請填寫「${miss.label}」`);
    onSubmit(ev, a);
  };
  return (
    <div className="fixed inset-0 bg-black/40 z-20 flex items-center justify-center p-4">
      <div className="bg-white rounded-2xl p-5 w-full max-w-md max-h-full overflow-auto space-y-3">
        <h2 className="font-bold">報名：{ev.title}</h2>
        {ev.fields.map((f) => (
          <div key={f.id}>
            <label className="text-sm">{f.label}{f.required && <span className="text-red-500"> *</span>}</label>
            {f.type === 'select' ? (
              <select className={input} value={a[f.id] || ''} onChange={(e) => setA({ ...a, [f.id]: e.target.value })}>
                <option value="">請選擇</option>{f.options.map((o) => <option key={o}>{o}</option>)}
              </select>
            ) : (
              <input type={f.type} className={input} value={a[f.id] || ''} onChange={(e) => setA({ ...a, [f.id]: e.target.value })} />
            )}
          </div>
        ))}
        {err && <p className="text-red-500 text-sm">{err}</p>}
        <div className="flex justify-end gap-2">
          <button className={ghost} onClick={onClose}>取消</button>
          <button className={primary} onClick={go}>送出報名</button>
        </div>
      </div>
    </div>
  );
}

function Create({ onCreate }) {
  const [f, setF] = useState({
    title: '', organizer: '', region: '台北市', type: '室內', kind: '官方', date: '', location: '', desc: '', capacity: 30,
    lineGroup: '', lineTemplate: defaultTpl,
  });
  const [custom, setCustom] = useState([]);
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  const addQ = () => setCustom([...custom, { id: 'q' + Date.now(), label: '', type: 'text', required: false, options: '' }]);
  const updQ = (i, k, v) => setCustom(custom.map((q, j) => j === i ? { ...q, [k]: v } : q));
  const valid = f.title && f.organizer && f.date && f.location;

  const submit = () => {
    const extra = custom.filter((q) => q.label).map((q) => ({
      ...q, options: q.type === 'select' ? q.options.split(',').map((s) => s.trim()).filter(Boolean) : undefined,
    }));
    onCreate({
      ...f, capacity: Number(f.capacity) || 1, fields: [...baseFields(), ...extra],
      statsSel: ['total', 'region', 'feedback', ...extra.filter((q) => q.type === 'select').map((q) => q.id)],
    });
  };

  return (
    <div className="bg-white rounded-xl border p-5 max-w-2xl space-y-3">
      <h2 className="font-bold text-lg">建立活動／發起揪團</h2>
      <div className="grid grid-cols-2 gap-2">
        <input className={input + ' col-span-2'} placeholder="活動名稱 *" value={f.title} onChange={set('title')} />
        <input className={input} placeholder="主辦單位／發起人 *" value={f.organizer} onChange={set('organizer')} />
        <input className={input} type="date" value={f.date} onChange={set('date')} />
        <select className={input} value={f.region} onChange={set('region')}>{REGIONS.map((r) => <option key={r}>{r}</option>)}</select>
        <select className={input} value={f.type} onChange={set('type')}><option>室內</option><option>室外</option></select>
        <select className={input} value={f.kind} onChange={set('kind')}><option value="官方">單位活動</option><option value="揪團">個人揪團</option></select>
        <input className={input} type="number" min="1" placeholder="名額" value={f.capacity} onChange={set('capacity')} />
        <input className={input + ' col-span-2'} placeholder="地點 *" value={f.location} onChange={set('location')} />
        <textarea className={input + ' col-span-2'} rows={2} placeholder="活動說明" value={f.desc} onChange={set('desc')} />
      </div>

      <div className="border-t pt-3">
        <h3 className="font-semibold text-sm mb-1">報名表單</h3>
        <p className="text-xs text-gray-500 mb-2">固定欄位：姓名、聯絡電話、電子郵件、居住地區。可新增其他需求問題：</p>
        {custom.map((q, i) => (
          <div key={q.id} className="flex gap-2 mb-2 flex-wrap items-center">
            <input className={input + ' flex-1 min-w-32'} placeholder="問題" value={q.label} onChange={(e) => updQ(i, 'label', e.target.value)} />
            <select className={input + ' w-24'} value={q.type} onChange={(e) => updQ(i, 'type', e.target.value)}><option value="text">文字</option><option value="select">選項</option></select>
            {q.type === 'select' && <input className={input + ' flex-1 min-w-32'} placeholder="選項，以逗號分隔" value={q.options} onChange={(e) => updQ(i, 'options', e.target.value)} />}
            <label className="text-xs flex items-center gap-1"><input type="checkbox" checked={q.required} onChange={(e) => updQ(i, 'required', e.target.checked)} />必填</label>
            <button onClick={() => setCustom(custom.filter((_, j) => j !== i))}><Trash2 size={16} className="text-red-500" /></button>
          </div>
        ))}
        <button className={ghost} onClick={addQ}>＋ 新增問題</button>
      </div>

      <div className="border-t pt-3 space-y-2">
        <h3 className="font-semibold text-sm">LINE 報名成功推播</h3>
        <input className={input} placeholder="LINE 群組名稱（或群組 ID）" value={f.lineGroup} onChange={set('lineGroup')} />
        <textarea className={input} rows={5} value={f.lineTemplate} onChange={set('lineTemplate')} />
        <p className="text-xs text-gray-500">可用變數：{'{姓名} {活動名稱} {日期} {地點} {目前人數} {名額}'}</p>
      </div>

      <button disabled={!valid} className={primary + (valid ? '' : ' opacity-40')} onClick={submit}>發佈活動</button>
    </div>
  );
}

function Manage({ events, setEvents, id, setId }) {
  const ev = events.find((e) => e.id === id) || events[0];
  const upd = (fn) => setEvents((es) => es.map((e) => e.id === ev.id ? fn(e) : e));
  const toggle = (k) => upd((e) => ({ ...e, statsSel: e.statsSel.includes(k) ? e.statsSel.filter((x) => x !== k) : [...e.statsSel, k] }));
  const customFields = ev.fields.filter((f) => !['name', 'phone', 'email', 'region'].includes(f.id));
  const rated = ev.regs.filter((r) => r.rating);
  const avg = rated.length ? (rated.reduce((s, r) => s + r.rating, 0) / rated.length).toFixed(1) : '-';
  const sel = (k) => ev.statsSel.includes(k);

  return (
    <div className="space-y-4">
      <select className={input + ' max-w-sm'} value={ev.id} onChange={(e) => setId(Number(e.target.value))}>
        {events.map((e) => <option key={e.id} value={e.id}>{e.title}</option>)}
      </select>

      <div className="bg-white rounded-xl border p-4">
        <h3 className="font-semibold text-sm mb-2">選擇統計項目</h3>
        <div className="flex flex-wrap gap-3 text-sm">
          {[['total', '總報名人數'], ['region', '地區分布'], ['feedback', '參加者反饋'], ...customFields.map((f) => [f.id, `自定義：${f.label}`])].map(([k, l]) => (
            <label key={k} className="flex items-center gap-1"><input type="checkbox" checked={sel(k)} onChange={() => toggle(k)} />{l}</label>
          ))}
        </div>
      </div>

      <div className="grid md:grid-cols-2 gap-4">
        {sel('total') && (
          <div className="bg-white rounded-xl border p-4">
            <p className="text-sm text-gray-500">總報名人數</p>
            <p className="text-4xl font-bold text-green-600">{ev.regs.length}<span className="text-base text-gray-400"> / {ev.capacity}</span></p>
            <div className="h-2 bg-gray-100 rounded mt-2"><div className="h-2 bg-green-500 rounded" style={{ width: `${Math.min(100, (ev.regs.length / ev.capacity) * 100)}%` }} /></div>
          </div>
        )}
        {sel('region') && (
          <div className="bg-white rounded-xl border p-4">
            <p className="text-sm text-gray-500 mb-1">地區分布</p>
            <div className="h-52">
              <ResponsiveContainer>
                <PieChart>
                  <Pie data={countBy(ev.regs, 'region')} dataKey="value" nameKey="name" outerRadius={70} label>
                    {countBy(ev.regs, 'region').map((_, i) => <Cell key={i} fill={COLORS[i % COLORS.length]} />)}
                  </Pie>
                  <Tooltip />
                </PieChart>
              </ResponsiveContainer>
            </div>
          </div>
        )}
        {customFields.filter((f) => sel(f.id)).map((f) => (
          <div key={f.id} className="bg-white rounded-xl border p-4">
            <p className="text-sm text-gray-500 mb-1">{f.label}</p>
            <div className="h-44">
              <ResponsiveContainer>
                <BarChart data={countBy(ev.regs, f.id)}>
                  <XAxis dataKey="name" fontSize={12} /><YAxis allowDecimals={false} fontSize={12} /><Tooltip />
                  <Bar dataKey="value" fill="#06C755" />
                </BarChart>
              </ResponsiveContainer>
            </div>
          </div>
        ))}
        {sel('feedback') && (
          <div className="bg-white rounded-xl border p-4 md:col-span-2">
            <p className="text-sm text-gray-500">參加者反饋　平均評分：<b className="text-amber-500">{avg} ⭐</b>（{rated.length} 則）</p>
            <ul className="mt-2 space-y-1 text-sm">
              {ev.regs.map((r, i) => (
                <li key={i} className="flex items-center gap-2 flex-wrap border-b py-1">
                  <span className="font-medium w-20">{r.answers.name}</span>
                  {r.rating ? <><span>{'⭐'.repeat(r.rating)}</span><span className="text-gray-600">{r.feedback}</span></> : (
                    <FeedbackForm onSave={(rating, feedback) => upd((e) => ({ ...e, regs: e.regs.map((x, j) => j === i ? { ...x, rating, feedback } : x) }))} />
                  )}
                </li>
              ))}
              {ev.regs.length === 0 && <li className="text-gray-400">尚無報名</li>}
            </ul>
          </div>
        )}
      </div>

      <div className="bg-white rounded-xl border p-4 overflow-auto">
        <p className="text-sm font-semibold mb-2">報名名單</p>
        <table className="text-sm w-full">
          <thead><tr className="text-left text-gray-500">{ev.fields.map((f) => <th key={f.id} className="pr-4 py-1">{f.label}</th>)}</tr></thead>
          <tbody>{ev.regs.map((r, i) => <tr key={i} className="border-t">{ev.fields.map((f) => <td key={f.id} className="pr-4 py-1">{r.answers[f.id] || '-'}</td>)}</tr>)}</tbody>
        </table>
      </div>
    </div>
  );
}

function FeedbackForm({ onSave }) {
  const [r, setR] = useState(5);
  const [t, setT] = useState('');
  return (
    <span className="flex gap-1 items-center">
      <select className="border rounded px-1 text-xs" value={r} onChange={(e) => setR(Number(e.target.value))}>{[5, 4, 3, 2, 1].map((n) => <option key={n}>{n}</option>)}</select>
      <input className="border rounded px-2 text-xs py-1" placeholder="模擬反饋" value={t} onChange={(e) => setT(e.target.value)} />
      <button className="text-xs text-green-600" onClick={() => onSave(r, t)}>送出</button>
    </span>
  );
}

/* 建立活動／發起揪團：基本資料、封面上傳、自訂報名表單、LINE 推播設定 */
Pages.create = {
  custom: [],      // 自訂問題 [{id,label,type,required,optionsText}]
  coverUrl: '',

  render(el) {
    const opt = (arr) => arr.map((x) => `<option>${esc(x)}</option>`).join('');
    el.innerHTML = `
    <div class="panel" style="max-width:720px;margin:auto;display:flex;flex-direction:column;gap:12px">
      <h3>建立活動／發起揪團</h3>

      <div class="field"><label>活動名稱 <span class="req">*</span></label><input id="c-title" maxlength="60"></div>
      <div class="filters" style="margin:0">
        <div class="field"><label>類型</label>
          <select id="c-kind"><option value="官方">單位活動（官方）</option><option value="揪團">個人揪團</option></select></div>
        <div class="field"><label>主辦單位／發起人</label>
          <input id="c-organizer" maxlength="40" value="${esc(App.profile ? App.profile.displayName : '')}"></div>
        <div class="field"><label>地區</label><select id="c-region">${opt(REGIONS)}</select></div>
        <div class="field"><label>室內／室外</label><select id="c-type">${opt(['室內', '室外'])}</select></div>
        <div class="field"><label>日期 <span class="req">*</span></label><input id="c-date" type="date" min="${today()}"></div>
        <div class="field"><label>時間</label><input id="c-time" type="time"></div>
        <div class="field"><label>名額</label><input id="c-cap" type="number" min="1" value="30"></div>
      </div>
      <div class="field"><label>地點 <span class="req">*</span></label><input id="c-loc" maxlength="80"></div>
      <div class="field"><label>活動說明</label><textarea id="c-desc" rows="3" maxlength="1000"></textarea></div>

      <div class="field"><label>封面圖片（JPEG／PNG，會自動壓縮到 1MB 內）</label>
        <input id="c-file" type="file" accept="image/jpeg,image/png">
        <div class="muted" id="c-up"></div>
        <img id="c-prev" class="cover" style="display:none;max-width:320px;border-radius:8px;margin-top:6px" alt="封面預覽">
      </div>

      <hr style="width:100%;border:0;border-top:1px solid #e5e7eb">
      <b>報名表單</b>
      <div class="muted">固定欄位：姓名、聯絡電話、電子郵件、居住地區（皆必填）。可再新增其他需求問題：</div>
      <div id="c-qs" style="display:flex;flex-direction:column;gap:8px"></div>
      <div><button class="btn ghost" id="c-addq" type="button">＋ 新增問題</button></div>

      <hr style="width:100%;border:0;border-top:1px solid #e5e7eb">
      <b>LINE 報名成功推播</b>
      <div class="field"><label>LINE 群組 ID（把 Bot 拉進群組，Bot 會回覆；留空則不推播）</label>
        <input id="c-group" placeholder="Cxxxxxxxxxxxxxxxx"></div>
      <div class="filters" style="margin:0">
        <div class="field"><label>推播頻率</label>
          <select id="c-mode">
            <option value="every">每人報名都推</option>
            <option value="everyN">每滿 N 人推一次</option>
            <option value="full_only">只在額滿時推</option>
            <option value="off">完全不推（含提醒）</option>
          </select></div>
        <div class="field" id="c-n-wrap" style="display:none"><label>N =</label>
          <input id="c-n" type="number" min="1" value="5"></div>
      </div>
      <div class="field"><label>卡片頂部文字（可用 {姓名} {活動名稱} {日期} {地點} {目前人數} {名額}）</label>
        <textarea id="c-tpl" rows="2" maxlength="200">🎉 {姓名} 報名成功！</textarea></div>
      <div class="muted">額滿時系統會另發一張紅色「名額已滿」卡片；活動前一天 09:00 左右會自動發提醒卡片。</div>

      <div class="err" id="c-err"></div>
      <button class="btn" id="c-submit">發佈活動</button>
    </div>`;

    $('#c-mode').onchange = (e) => ($('#c-n-wrap').style.display = e.target.value === 'everyN' ? 'block' : 'none');
    $('#c-addq').onclick = () => {
      this.custom.push({ id: 'q' + Date.now().toString(36) + this.custom.length, label: '', type: 'text', required: false, optionsText: '' });
      this.paintQs();
    };
    $('#c-file').onchange = (e) => this.upload(e.target.files[0]);
    $('#c-submit').onclick = (e) => this.submit(e.target);
    this.paintQs();
    if (this.coverUrl) this.showCover(this.coverUrl);
  },

  paintQs() {
    const box = $('#c-qs');
    box.innerHTML = this.custom.map((q, i) => `
      <div class="panel" style="padding:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center" data-i="${i}">
        <input data-k="label" placeholder="問題，例如：餐點偏好" value="${esc(q.label)}" style="flex:2;min-width:140px" maxlength="40">
        <select data-k="type" style="flex:1;min-width:90px">
          <option value="text" ${q.type === 'text' ? 'selected' : ''}>文字</option>
          <option value="select" ${q.type === 'select' ? 'selected' : ''}>選項</option></select>
        ${q.type === 'select' ? `<input data-k="optionsText" placeholder="選項，用逗號分隔：葷,素" value="${esc(q.optionsText)}" style="flex:2;min-width:140px">` : ''}
        <label class="muted"><input type="checkbox" data-k="required" ${q.required ? 'checked' : ''}> 必填</label>
        <button class="btn ghost" data-del type="button">刪除</button>
      </div>`).join('');

    // 輸入時只更新資料，不重繪，避免失去焦點
    box.oninput = box.onchange = (e) => {
      const row = e.target.closest('[data-i]'); if (!row || !e.target.dataset.k) return;
      const q = this.custom[+row.dataset.i], k = e.target.dataset.k;
      q[k] = k === 'required' ? e.target.checked : e.target.value;
      if (k === 'type') this.paintQs();           // 切換類型才需要重繪
    };
    box.onclick = (e) => {
      if (!e.target.matches('[data-del]')) return;
      this.custom.splice(+e.target.closest('[data-i]').dataset.i, 1);
      this.paintQs();
    };
  },

  showCover(url) {
    const p = $('#c-prev'); p.src = url; p.style.display = 'block';
  },

  async upload(file) {
    if (!file) return;
    const st = $('#c-up');
    st.textContent = '壓縮並上傳中…';
    try {
      this.coverUrl = await uploadCover(file);
      st.textContent = '上傳完成';
      this.showCover(this.coverUrl);
    } catch (e) { st.textContent = '上傳失敗：' + e.message; }
  },

  collect() {
    const v = (id) => $(id).value.trim();
    const d = {
      title: v('#c-title'), kind: v('#c-kind'), organizer: v('#c-organizer'),
      region: v('#c-region'), type: v('#c-type'), date: v('#c-date'), time: v('#c-time'),
      capacity: Number(v('#c-cap')), location: v('#c-loc'), description: v('#c-desc'),
      coverUrl: this.coverUrl, lineGroupId: v('#c-group'), notifyMode: v('#c-mode'),
      notifyN: Number(v('#c-n')) || 5, template: v('#c-tpl'),
    };
    if (!d.title) throw new Error('請填寫活動名稱');
    if (!d.date) throw new Error('請選擇日期');
    if (d.date < today()) throw new Error('日期不能早於今天');
    if (!d.location) throw new Error('請填寫地點');
    if (!(d.capacity >= 1)) throw new Error('名額至少 1 人');
    if (d.lineGroupId && !/^C[0-9a-f]{32}$/i.test(d.lineGroupId)) throw new Error('LINE 群組 ID 格式不正確（應為 C 開頭共 33 碼）');

    // 固定欄位 + 自訂問題
    const fields = [
      { id: 'name', label: '姓名', type: 'text', required: true },
      { id: 'phone', label: '聯絡電話', type: 'tel', required: true },
      { id: 'email', label: '電子郵件', type: 'email', required: true },
      { id: 'region', label: '居住地區', type: 'select', required: true, options: REGIONS },
    ];
    const selIds = [];
    this.custom.forEach((q, i) => {
      const label = q.label.trim();
      if (!label) throw new Error(`第 ${i + 1} 題尚未填寫問題內容`);
      const f = { id: q.id, label, type: q.type, required: q.required };
      if (q.type === 'select') {
        f.options = q.optionsText.split(/[,，、]/).map((s) => s.trim()).filter(Boolean);
        if (!f.options.length) throw new Error(`「${label}」至少要有一個選項`);
        selIds.push(q.id);
      }
      fields.push(f);
    });
    d.fields = fields;
    d.statsSel = ['total', 'region', 'feedback', ...selIds];
    return d;
  },

  submit(btn) {
    const err = $('#c-err'); err.textContent = '';
    let d;
    try { d = this.collect(); } catch (e) { err.textContent = e.message; return; }
    withBusy(btn, async () => {
      try {
        await api('createEvent', { event: d });
        this.custom = []; this.coverUrl = '';
        toast('活動已發佈！');
        App.go('manage');
      } catch (e) { err.textContent = e.message; }
    });
  },
};

/* 統計管理：我的活動、統計項目選擇、圖表、報名名單、匯出 CSV */
Pages.manage = {
  events: [], cur: null, charts: [],
  BASE_IDS: ['name', 'phone', 'email', 'region'],

  async render(el) {
    el.innerHTML = '<div class="empty">載入中…</div>';
    try { this.events = await api('myEvents'); }
    catch (e) { el.innerHTML = `<div class="empty">載入失敗：${esc(e.message)}</div>`; return; }
    if (!this.events.length) { el.innerHTML = '<div class="empty">你還沒有建立任何活動</div>'; return; }

    if (!this.cur || !this.events.some((x) => String(x.id) === String(this.cur))) this.cur = this.events[0].id;
    el.innerHTML = `
      <div class="panel" style="margin-bottom:12px">
        <select id="m-ev">${this.events.map((e) =>
          `<option value="${esc(e.id)}" ${String(e.id) === String(this.cur) ? 'selected' : ''}>${esc(e.date)}｜${esc(e.title)}</option>`).join('')}</select>
      </div>
      <div id="m-body"></div>`;
    $('#m-ev').onchange = (e) => { this.cur = e.target.value; this.show(); };
    this.show();
  },

  async show() {
    const ev = this.events.find((x) => String(x.id) === String(this.cur));
    const body = $('#m-body');
    body.innerHTML = '<div class="empty">載入統計中…</div>';
    this.charts.forEach((c) => c.destroy()); this.charts = [];

    let stats, regs;
    try { [stats, regs] = await Promise.all([api('stats', { eventId: ev.id }), api('regList', { eventId: ev.id })]); }
    catch (e) { body.innerHTML = `<div class="empty">載入失敗：${esc(e.message)}</div>`; return; }

    // 可選的統計項目：固定三項 + 自訂的選項題
    const customSel = (ev.fields || []).filter((f) => f.type === 'select' && !this.BASE_IDS.includes(f.id));
    const choices = [['total', '總報名人數'], ['region', '地區分布'], ['feedback', '參加者反饋'],
      ...customSel.map((f) => [f.id, '自定義：' + f.label])];
    const modeTxt = { every: '每人都推', everyN: `每滿 ${ev.notifyN} 人推一次`, full_only: '只在額滿推', off: '不推播' }[ev.notifyMode] || ev.notifyMode;

    let h = `
      <div class="panel" style="margin-bottom:12px">
        <div class="muted">LINE 群組：${ev.lineGroupId ? esc(ev.lineGroupId) : '未設定'}　推播：${esc(modeTxt)}</div>
        <b>選擇統計項目</b>
        <div style="display:flex;gap:14px;flex-wrap:wrap;margin:8px 0">
          ${choices.map(([k, l]) => `<label><input type="checkbox" data-sel="${esc(k)}" ${(ev.statsSel || []).includes(k) ? 'checked' : ''}> ${esc(l)}</label>`).join('')}
        </div>
        <button class="btn" id="m-save">套用並儲存</button>
      </div>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">`;

    if (stats.total) {
      const pct = Math.min(100, Math.round(stats.total.count / stats.total.capacity * 100));
      h += `<div class="panel"><div class="muted">總報名人數</div>
        <div style="font-size:40px;font-weight:700;color:var(--g)">${stats.total.count}<span class="muted"> / ${stats.total.capacity}</span></div>
        <div style="height:8px;background:#e5e7eb;border-radius:4px"><div style="height:8px;width:${pct}%;background:var(--g);border-radius:4px"></div></div></div>`;
    }
    if (stats.region) h += `<div class="panel"><div class="muted">地區分布</div><div style="height:220px"><canvas id="ch-region"></canvas></div></div>`;
    customSel.filter((f) => stats[f.id]).forEach((f) => {
      h += `<div class="panel"><div class="muted">${esc(f.label)}</div><div style="height:220px"><canvas id="ch-${esc(f.id)}"></canvas></div></div>`;
    });
    if (stats.feedback) {
      const fb = stats.feedback;
      h += `<div class="panel" style="grid-column:1/-1"><div class="muted">參加者反饋　平均評分：
        <b>${fb.avg == null ? '-' : fb.avg.toFixed(1)} ⭐</b>（${fb.items.length} 則）</div>
        ${fb.items.length ? fb.items.map((i) => `<div style="border-top:1px solid #eee;padding:6px 0;font-size:14px">
          <b>${esc(i.name || '匿名')}</b> ${'⭐'.repeat(Number(i.rating) || 0)}<br>${esc(i.feedback)}</div>`).join('')
          : '<div class="muted">尚無反饋（活動結束後，參加者可在活動頁留言）</div>'}</div>`;
    }
    h += '</div>';

    // 報名名單
    h += `<div class="panel" style="margin-top:12px;overflow:auto">
      <div class="row" style="margin-bottom:8px"><b>報名名單（${regs.length}）</b>
        <button class="btn ghost" id="m-csv" ${regs.length ? '' : 'disabled'}>匯出 CSV</button></div>
      <table style="border-collapse:collapse;font-size:14px;width:100%"><thead><tr>
        ${ev.fields.map((f) => `<th style="text-align:left;padding:6px 10px 6px 0;color:#6b7280">${esc(f.label)}</th>`).join('')}
        <th style="text-align:left;color:#6b7280">報名時間</th></tr></thead><tbody>
        ${regs.map((r) => `<tr style="border-top:1px solid #eee">
          ${ev.fields.map((f) => `<td style="padding:6px 10px 6px 0">${esc(r.answers[f.id] || '-')}</td>`).join('')}
          <td>${esc(r.createdAt)}</td></tr>`).join('')}
      </tbody></table></div>`;
    body.innerHTML = h;

    // 圖表（Chart.js 若載入失敗就略過，不影響其他內容）
    if (window.Chart) {
      const COL = ['#06C755', '#1E6FD9', '#F57C00', '#8b5cf6', '#14b8a6', '#ef4444', '#ec4899'];
      const draw = (id, data, type) => {
        const cv = $('#' + id); if (!cv) return;
        this.charts.push(new Chart(cv, {
          type, data: { labels: data.map((d) => d.name), datasets: [{ data: data.map((d) => d.value), backgroundColor: COL }] },
          options: { maintainAspectRatio: false,
            plugins: { legend: { display: type === 'doughnut' } },
            scales: type === 'bar' ? { y: { beginAtZero: true, ticks: { precision: 0 } } } : {} },
        }));
      };
      if (stats.region) draw('ch-region', stats.region, 'doughnut');
      customSel.forEach((f) => { if (stats[f.id]) draw('ch-' + f.id, stats[f.id], 'bar'); });
    }

    $('#m-save', body).onclick = (e) => withBusy(e.target, async () => {
      const sel = $$('[data-sel]', body).filter((x) => x.checked).map((x) => x.dataset.sel);
      try {
        await api('saveStatsConfig', { eventId: ev.id, statsSel: sel });
        ev.statsSel = sel; toast('已儲存統計設定'); this.show();
      } catch (er) { toast(er.message, 'bad'); }
    });
    const csv = $('#m-csv', body);
    if (csv) csv.onclick = () => this.exportCsv(ev, regs);
  },

  exportCsv(ev, regs) {
    // 防 CSV 公式注入：以 = + - @ 開頭的內容前面補單引號；電話前補 Tab 保留開頭的 0
    const cell = (v, type) => {
      let s = String(v ?? '');
      if (type === 'tel' && s) s = '\t' + s;
      else if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
      return '"' + s.replace(/"/g, '""') + '"';
    };
    const head = [...ev.fields.map((f) => f.label), '評分', '反饋', '報名時間'].map((x) => cell(x)).join(',');
    const lines = regs.map((r) => [
      ...ev.fields.map((f) => cell(r.answers[f.id], f.type)),
      cell(r.rating), cell(r.feedback), cell(r.createdAt)].join(','));
    // 開頭加 BOM，Excel 才會正確顯示中文
    const blob = new Blob(['\uFEFF' + [head, ...lines].join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${ev.title}_報名名單.csv`.replace(/[\\/:*?"<>|]/g, '_');
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  },
};
