<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>志工打卡系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style> button { -webkit-tap-highlight-color: transparent; } </style>
</head>
<body class="bg-gray-100 flex flex-col min-h-screen">
  <header class="bg-blue-700 text-white text-center py-5 shadow-lg">
    <h1 class="text-3xl font-extrabold tracking-widest">志工服務打卡</h1>
  </header>

  <main class="flex-1 flex flex-col items-center justify-center p-4 space-y-10 w-full max-w-md mx-auto">
    <!-- 現在時間區塊 -->
    <div class="text-center bg-white w-full rounded-2xl shadow-sm py-6 border-b-4 border-gray-200">
      <p class="text-gray-500 text-xl font-bold mb-2">🕒 系統現在時間</p>
      <div id="clock" class="text-6xl font-black text-gray-800 tabular-nums">--:--:--</div>
    </div>

    <!-- 狀態顯示區 -->
    <div class="text-center w-full">
      <p id="userName" class="text-2xl font-bold text-gray-800 mb-3">載入身分中...</p>
      <div id="statusBadge" class="inline-block px-6 py-2 rounded-full bg-gray-200 text-gray-700 text-xl font-bold border-2 border-gray-300">
        ⚪ 讀取狀態中
      </div>
    </div>

    <!-- 超大主按鈕 -->
    <button id="actionBtn" disabled 
      class="w-full py-8 rounded-3xl text-4xl font-extrabold text-white shadow-2xl transition-all transform active:scale-95 bg-gray-400 border-4 border-gray-500">
      請稍候...
    </button>
  </main>

  <script>
    const LIFF_ID = "2009456572-mxeoY8wg"; 
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyWuRG_34ENxcKRJUpUsZL8oTng8im00Wm_6wDTQ-sJO0cc0nPOsUIWlWfwjLvMYl3EQw/exec"; 
    let userProfile = null;
    let currentStatus = "unknown"; 

    // 時鐘自動更新
    setInterval(() => {
      document.getElementById("clock").innerText = new Date().toLocaleTimeString('zh-TW', { hour12: false });
    }, 1000);

    // 初始化 LIFF 與取得狀態
    async function initSystem() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) { liff.login(); return; }
        
        userProfile = await liff.getProfile();
        document.getElementById("userName").innerText = `您好，${userProfile.displayName}`;
        
        const res = await fetch(`${GAS_URL}?action=getStatus&uid=${userProfile.userId}`);
        const result = await res.json();
        
        if (result.success) {
          currentStatus = result.status;
          updateUI();
        }
      } catch (err) {
        alert("系統連線異常，請重新開啟。");
      }
    }

    // 更新長輩友善 UI
    function updateUI() {
      const btn = document.getElementById("actionBtn");
      const badge = document.getElementById("statusBadge");
      btn.disabled = false;

      if (currentStatus === "clocked_out") {
        badge.innerHTML = "🔴 目前狀態：尚未簽到";
        badge.className = "inline-block px-6 py-2 rounded-full bg-red-100 text-red-700 text-2xl font-bold border-2 border-red-300";
        btn.innerText = "🟩 上班簽到";
        btn.className = "w-full py-8 rounded-3xl text-4xl font-extrabold text-white shadow-2xl transition-all transform active:scale-95 bg-green-600 border-4 border-green-800 hover:bg-green-500";
      } else {
        badge.innerHTML = "🟢 目前狀態：服勤中";
        badge.className = "inline-block px-6 py-2 rounded-full bg-green-100 text-green-700 text-2xl font-bold border-2 border-green-300";
        btn.innerText = "🟥 下班簽退";
        btn.className = "w-full py-8 rounded-3xl text-4xl font-extrabold text-white shadow-2xl transition-all transform active:scale-95 bg-red-600 border-4 border-red-800 hover:bg-red-500";
      }
    }

    // 打卡送出
    document.getElementById("actionBtn").addEventListener("click", async () => {
      const btn = document.getElementById("actionBtn");
      btn.disabled = true;
      btn.innerText = "⏳ 處理中請稍候...";
      btn.className = "w-full py-8 rounded-3xl text-4xl font-extrabold text-white shadow-md bg-gray-500 border-4 border-gray-600";

      const action = currentStatus === "clocked_out" ? "clockIn" : "clockOut";
      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: action, uid: userProfile.userId, name: userProfile.displayName })
        });
        const result = await res.json();
        
        if (result.success) {
          alert(result.message);
          btn.innerText = "✅ 打卡成功！";
          btn.className = "w-full py-8 rounded-3xl text-4xl font-extrabold text-white bg-blue-600 border-4 border-blue-800";
          setTimeout(() => liff.closeWindow(), 1500); // 延遲讓長輩看清楚再關閉
        } else {
          alert("錯誤：" + result.message);
          updateUI();
        }
      } catch (err) {
        alert("網路異常，請重試！");
        updateUI();
      }
    });

    window.onload = initSystem;
  </script>
</body>
</html>
