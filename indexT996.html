<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>帕金森促進會-志工貼心助手</title>
  <!-- 引入 Tailwind CSS 用於美化介面 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    /* 專為年長者設計的超大字體與按鈕樣式 */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
      font-size: 20px; /* 整體字體放大 */
    }
    .btn-large {
      padding: 18px 24px;
      font-size: 22px;
      font-weight: bold;
      border-radius: 16px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    /* 隱藏滾動條，專注於畫面切換 */
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- 頂部溫馨導覽列 -->
  <header class="bg-teal-600 text-white p-4 text-center shadow-md sticky top-0 z-50">
    <h1 class="text-2xl font-bold tracking-wider">🌸 志工貼心助手 🌸</h1>
    <p id="user-welcome" class="text-sm mt-1 text-teal-100">正在連線中，請稍候...</p>
  </header>

  <!-- 載入中動畫 -->
  <div id="loading-spinner" class="flex-1 flex flex-col items-center justify-center p-6">
    <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-teal-600 mb-4"></div>
    <p class="text-lg text-slate-600 font-medium">正在為您準備畫面，請放鬆心情...</p>
  </div>

  <!-- 主內容區 (預設隱藏，載入完成後顯示) -->
  <main id="main-content" class="flex-1 p-4 max-w-md mx-auto w-full hidden pb-24">
    
    <!-- ================= 畫面 A：未註冊引導畫面 ================= -->
    <section id="view-unregistered" class="hidden space-y-6">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-teal-100 text-center">
        <span class="text-5xl">👋</span>
        <h2 class="text-2xl font-bold text-teal-700 mt-3">歡迎新夥伴！</h2>
        <p class="text-slate-600 mt-4 leading-relaxed">
          我們在志工名冊中還沒有看到您的名字。<br>
          <strong>別擔心！</strong> 請按下方的按鈕，跟著引導花一分鐘填寫資料，就能加入我們囉！
        </p>
      </div>
      <button onclick="switchView('view-register-form')" class="w-full btn-large bg-teal-500 hover:bg-teal-600 text-white transition-all">
        📝 開始填寫基本資料
      </button>
    </section>

    <!-- ================= 畫面 B：註冊表單畫面 ================= -->
    <section id="view-register-form" class="hidden space-y-4">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
        <h2 class="text-xl font-bold text-slate-700 mb-4 border-b pb-2">✍️ 填寫基本資料</h2>
        
        <div class="space-y-4">
          <div>
            <label class="block text-slate-600 mb-1 font-medium">1. 您的真實姓名</label>
            <input type="text" id="reg-name" placeholder="例如：王小明" class="w-full p-3 border-2 border-slate-300 rounded-xl text-lg focus:border-teal-500 outline-none">
          </div>
          <div>
            <label class="block text-slate-600 mb-1 font-medium">2. 身分證字號 (保險與申報用)</label>
            <input type="text" id="reg-id" placeholder="例如：A123456789" class="w-full p-3 border-2 border-slate-300 rounded-xl text-lg focus:border-teal-500 outline-none">
          </div>
          <div>
            <label class="block text-slate-600 mb-1 font-medium">3. 手機號碼</label>
            <input type="tel" id="reg-phone" placeholder="例如：0912345678" class="w-full p-3 border-2 border-slate-300 rounded-xl text-lg focus:border-teal-500 outline-none">
          </div>
          <div>
            <label class="block text-slate-600 mb-1 font-medium">4. 緊急聯絡人姓名與電話</label>
            <input type="text" id="reg-emergency" placeholder="例如：陳美美 (妻) 0922111222" class="w-full p-3 border-2 border-slate-300 rounded-xl text-lg focus:border-teal-500 outline-none">
          </div>
        </div>
      </div>

      <div class="flex space-x-3">
        <button onclick="switchView('view-unregistered')" class="w-1/3 btn-large bg-slate-300 text-slate-700">返回</button>
        <button onclick="submitRegistration()" class="w-2/3 btn-large bg-teal-500 text-white">確認送出 ➔</button>
      </div>
    </section>

    <!-- ================= 畫面 C：主功能選單 (已註冊志工) ================= -->
    <section id="view-dashboard" class="hidden space-y-6">
      <!-- 個人時數與榮譽卡提示 -->
      <div class="bg-gradient-to-br from-teal-500 to-emerald-600 text-white p-6 rounded-2xl shadow-lg">
        <p class="text-sm opacity-90">您目前累計服務時數</p>
        <div class="flex items-baseline space-x-2 mt-1">
          <span id="dash-hours" class="text-5xl font-black">0</span>
          <span class="text-lg font-medium">小時</span>
        </div>
        <!-- 貼心榮譽卡預警提示 -->
        <div id="honor-card-alert" class="mt-4 bg-white/20 p-3 rounded-xl text-sm hidden">
          🎉 您的時數即將達到榮譽卡門檻！社工會主動協助您申請喔！
        </div>
      </div>

      <!-- 貼心引導大按鈕 -->
      <div class="grid grid-cols-1 gap-4">
        <button onclick="loadAvailableJobs()" class="btn-large bg-white border-2 border-teal-500 text-teal-700 hover:bg-teal-50 flex items-center justify-center space-x-3">
          <span class="text-3xl">🙋‍♂️</span>
          <span>我要接單 (找服務)</span>
        </button>

        <button onclick="loadMyActiveJobs()" class="btn-large bg-teal-500 text-white hover:bg-teal-600 flex items-center justify-center space-x-3">
          <span class="text-3xl">📍</span>
          <span>我要簽到 / 簽退</span>
        </button>
      </div>
    </section>

    <!-- ================= 畫面 D：可承接服務列表 (搶單) ================= -->
    <section id="view-job-list" class="hidden space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-xl font-bold text-slate-700">📋 目前有空缺的服務</h2>
        <button onclick="switchView('view-dashboard')" class="text-teal-600 font-bold text-lg">返回主選單</button>
      </div>
      
      <div id="job-list-container" class="space-y-4">
        <!-- 動態插入服務項目 -->
      </div>
    </section>

    <!-- ================= 畫面 E：簽到退與關懷日誌畫面 ================= -->
    <section id="view-attendance" class="hidden space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-xl font-bold text-slate-700">📍 今日服務簽到退</h2>
        <button onclick="switchView('view-dashboard')" class="text-teal-600 font-bold text-lg">返回主選單</button>
      </div>

      <div id="active-job-container" class="space-y-4">
        <!-- 動態插入今日待簽到退的服務 -->
      </div>
    </section>

    <!-- ================= 畫面 F：填寫關懷日誌 (簽退專用) ================= -->
    <section id="view-checkout-form" class="hidden space-y-4">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
        <h2 class="text-xl font-bold text-slate-700 border-b pb-2">📝 填寫今日關懷日誌</h2>
        <p class="text-sm text-slate-500">請用手指點選最符合病友今日狀況的選項（免打字）：</p>
        
        <!-- 貼心多選單 (免打字) -->
        <div>
          <label class="block text-slate-600 mb-2 font-medium">1. 病友精神狀況</label>
          <div class="grid grid-cols-2 gap-2" id="status-mental-group">
            <button type="button" onclick="selectStatus('mental', '精神很好，笑容滿面')" class="status-btn p-3 border-2 border-slate-200 rounded-xl text-base bg-white hover:border-teal-500">😊 精神很好</button>
            <button type="button" onclick="selectStatus('mental', '精神普通，有些疲倦')" class="status-btn p-3 border-2 border-slate-200 rounded-xl text-base bg-white hover:border-teal-500">😐 精神普通</button>
            <button type="button" onclick="selectStatus('mental', '心情低落，不愛說話')" class="status-btn p-3 border-2 border-slate-200 rounded-xl text-base bg-white hover:border-teal-500">😢 心情低落</button>
            <button type="button" onclick="selectStatus('mental', '意識有些模糊/嗜睡')" class="status-btn p-3 border-2 border-slate-200 rounded-xl text-base bg-white hover:border-teal-500">⚠️ 意識模糊</button>
          </div>
        </div>

        <div>
          <label class="block text-slate-600 mb-2 font-medium">2. 病友活動/行走狀況</label>
          <div class="grid grid-cols-2 gap-2" id="status-walk-group">
            <button type="button" onclick="selectStatus('walk', '走路平穩，防跌良好')" class="status-btn p-3 border-2 border-slate-200 rounded-xl text-base bg-white hover:border-teal-500">🚶‍♂️ 走路平穩</button>
            <button type="button" onclick="selectStatus('walk', '開步有些困難(凍結)')" class="status-btn p-3 border-2 border-slate-200 rounded-xl text-base bg-white hover:border-teal-500">🐢 開步困難</button>
            <button type="button" onclick="selectStatus('walk', '全程需輪椅協助')" class="status-btn p-3 border-2 border-slate-200 rounded-xl text-base bg-white hover:border-teal-500">♿ 輪椅協助</button>
            <button type="button" onclick="selectStatus('walk', '身體無力，無法站立')" class="status-btn p-3 border-2 border-slate-200 rounded-xl text-base bg-white hover:border-teal-500">⚠️ 無法站立</button>
          </div>
        </div>

        <!-- 緊急通報大紅鈕 -->
        <div class="border-t pt-4">
          <label class="block text-red-600 mb-2 font-bold text-center text-lg">🚨 現場是否有緊急突發狀況？</label>
          <p class="text-sm text-slate-500 text-center mb-3">（如：病友跌倒受傷、突然昏倒、家中無人應門等）</p>
          <button type="button" id="btn-emergency" onclick="toggleEmergency()" class="w-full p-4 border-4 border-red-200 rounded-2xl bg-red-50 text-red-700 font-bold text-xl hover:bg-red-100 transition-all">
            ⚠️ 沒有狀況 (安全無虞)
          </button>
        </div>
      </div>

      <div class="flex space-x-3">
        <button onclick="switchView('view-attendance')" class="w-1/3 btn-large bg-slate-300 text-slate-700">返回</button>
        <button onclick="submitCheckOut()" class="w-2/3 btn-large bg-emerald-500 text-white">確認簽退 ➔</button>
      </div>
    </section>

  </main>

  <!-- 貼心底部導覽列 (固定在最下方，方便隨時切換) -->
  <nav id="bottom-nav" class="bg-white border-t border-slate-200 fixed bottom-0 left-0 right-0 h-20 flex justify-around items-center z-40 shadow-lg hidden">
    <button onclick="switchView('view-dashboard')" class="flex flex-col items-center justify-center text-slate-500 hover:text-teal-600 focus:text-teal-600">
      <span class="text-2xl">🏠</span>
      <span class="text-sm font-bold mt-1">首頁</span>
    </button>
    <button onclick="loadAvailableJobs()" class="flex flex-col items-center justify-center text-slate-500 hover:text-teal-600 focus:text-teal-600">
      <span class="text-2xl">🙋‍♂️</span>
      <span class="text-sm font-bold mt-1">找服務</span>
    </button>
    <button onclick="loadMyActiveJobs()" class="flex flex-col items-center justify-center text-slate-500 hover:text-teal-600 focus:text-teal-600">
      <span class="text-2xl">📍</span>
      <span class="text-sm font-bold mt-1">簽到退</span>
    </button>
  </nav>

  <!-- 系統核心 JavaScript 邏輯 -->
  <script>
    // 請在此處填入您的 Google Apps Script 部署為 Web App 的網址
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyG9HvYs-vL3kr5Ki804PCtN5aUnKWopIJE3y8OGU_0AfQ2vVnRvvOVDEphVALzdtQR/exec"; 
    
    let userLineUid = "";
    let userDisplayName = "";
    let selectedMental = "";
    let selectedWalk = "";
    let isEmergencyActive = false;
    let currentActiveJobId = "";

    // 1. 初始化 LINE LIFF
    window.onload = function() {
      liff.init({ liffId: "2009456572-mxeoY8wg" }) // 請在此處填入您的 LIFF ID
        .then(() => {
          if (!liff.isLoggedIn()) {
            liff.login();
          } else {
            liff.getProfile()
              .then(profile => {
                userLineUid = profile.userId;
                userDisplayName = profile.displayName;
                document.getElementById("user-welcome").innerText = `您好，親愛的 ${userDisplayName} 夥伴`;
                checkUserRegistration();
              })
              .catch(err => alert("讀取個人資料失敗，請重新開啟 LINE。"));
          }
        })
        .catch(err => {
          console.log("LIFF 初始化失敗", err);
          // 測試環境模擬 (若在瀏覽器直接打開)
          userLineUid = "TEST_USER_123";
          userDisplayName = "測試志工";
          document.getElementById("user-welcome").innerText = `您好，親愛的 ${userDisplayName} 夥伴 (測試中)`;
          checkUserRegistration();
        });
    };

    // 2. 向後端檢查志工註冊狀態
    function checkUserRegistration() {
      callBackend("getVolunteerStatus", [userLineUid], function(res) {
        document.getElementById("loading-spinner").classList.add("hidden");
        document.getElementById("main-content").classList.remove("hidden");
        
        if (res.isRegistered) {
          document.getElementById("bottom-nav").classList.remove("hidden");
          document.getElementById("dash-hours").innerText = res.totalHours;
          if (res.totalHours >= 280) {
            document.getElementById("honor-card-alert").classList.remove("hidden");
          }
          switchView("view-dashboard");
        } else {
          switchView("view-unregistered");
        }
      });
    }

    // 3. 畫面切換控制 (貼心設計：切換時自動滾動到最上方)
    function switchView(viewId) {
      const views = ["view-unregistered", "view-register-form", "view-dashboard", "view-job-list", "view-attendance", "view-checkout-form"];
      views.forEach(v => {
        document.getElementById(v).classList.add("hidden");
      });
      document.getElementById(viewId).classList.remove("hidden");
      window.scrollTo(0, 0);
    }

    // 4. 註冊表單送出
    function submitRegistration() {
      const name = document.getElementById("reg-name").value.trim();
      const idCard = document.getElementById("reg-id").value.trim();
      const phone = document.getElementById("reg-phone").value.trim();
      const emergency = document.getElementById("reg-emergency").value.trim();

      if (!name || !idCard || !phone || !emergency) {
        alert("💡 貼心提醒：請把所有欄位都填寫完整，我們才能為您辦理保險喔！");
        return;
      }

      document.getElementById("main-content").classList.add("hidden");
      document.getElementById("loading-spinner").classList.remove("hidden");

      callBackend("registerVolunteer", [userLineUid, name, idCard, phone, emergency], function(res) {
        alert(res.message);
        checkUserRegistration();
      });
    }

    // 5. 載入可承接服務列表 (找服務)
    function loadAvailableJobs() {
      document.getElementById("main-content").classList.add("hidden");
      document.getElementById("loading-spinner").classList.remove("hidden");

      callBackend("getAvailableJobs", [userLineUid], function(jobs) {
        document.getElementById("loading-spinner").classList.add("hidden");
        document.getElementById("main-content").classList.remove("hidden");
        switchView("view-job-list");

        const container = document.getElementById("job-list-container");
        container.innerHTML = "";

        if (jobs.length === 0) {
          container.innerHTML = `
            <div class="bg-white p-6 rounded-2xl text-center border border-slate-200">
              <p class="text-slate-500">🎉 目前沒有等待媒合的服務需求，感謝您的熱心！可以先休息一下喔。</p>
            </div>`;
          return;
        }

        jobs.forEach(job => {
          let typeName = "";
          let typeColor = "";
          if (job.type === "A") { typeName = "A類：居家陪伴 (需雙軌訓練)"; typeColor = "bg-amber-100 text-amber-800 border-amber-300"; }
          else if (job.type === "B") { typeName = "B類：就醫接送 (需駕照與訓練)"; typeColor = "bg-blue-100 text-blue-800 border-blue-300"; }
          else if (job.type === "C") { typeName = "C類：電話問安 (適合初階)"; typeColor = "bg-green-100 text-green-800 border-green-300"; }
          else { typeName = "D類：活動與行政協助"; typeColor = "bg-purple-100 text-purple-800 border-purple-300"; }

          const card = document.createElement("div");
          card.className = "bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-3";
          card.innerHTML = `
            <span class="inline-block px-3 py-1 rounded-full text-sm font-bold border ${typeColor}">${typeName}</span>
            <h3 class="text-xl font-bold text-slate-800">病友：${job.patientName}</h3>
            <p class="text-slate-600">📅 日期：${job.date}</p>
            <p class="text-slate-600">⏰ 時間：${job.time}</p>
            <button onclick="claimSingleJob('${job.jobId}')" class="w-full py-3 bg-teal-500 hover:bg-teal-600 text-white font-bold rounded-xl text-lg mt-2">
              🤝 我要接這單
            </button>
          `;
          container.appendChild(card);
        });
      });
    }

    // 6. 搶單動作
    function claimSingleJob(jobId) {
      if (!confirm("您確定要承接這項服務嗎？請確認當天時間方便喔！")) return;
      
      document.getElementById("main-content").classList.add("hidden");
      document.getElementById("loading-spinner").classList.remove("hidden");

      callBackend("claimJob", [userLineUid, jobId], function(res) {
        alert(res.message);
        loadAvailableJobs();
      });
    }

    // 7. 載入今日已接單服務 (簽到退畫面)
    function loadMyActiveJobs() {
      document.getElementById("main-content").classList.add("hidden");
      document.getElementById("loading-spinner").classList.remove("hidden");

      callBackend("getMyActiveJobs", [userLineUid], function(jobs) {
        document.getElementById("loading-spinner").classList.add("hidden");
        document.getElementById("main-content").classList.remove("hidden");
        switchView("view-attendance");

        const container = document.getElementById("active-job-container");
        container.innerHTML = "";

        if (jobs.length === 0) {
          container.innerHTML = `
            <div class="bg-white p-6 rounded-2xl text-center border border-slate-200">
              <p class="text-slate-500">📅 您今天目前沒有排定的服務喔。<br>如果有接單，請於服務當天在此進行簽到。</p>
            </div>`;
          return;
        }

        jobs.forEach(job => {
          const card = document.createElement("div");
          card.className = "bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4";
          card.innerHTML = `
            <h3 class="text-xl font-bold text-slate-800">今日服務：${job.patientName}</h3>
            <p class="text-slate-600">⏰ 預計時間：${job.time}</p>
            <div class="grid grid-cols-2 gap-3">
              <button onclick="performCheckIn('${job.jobId}')" class="py-4 bg-teal-500 text-white font-bold rounded-xl text-lg">
                📍 點我簽到
              </button>
              <button onclick="openCheckOutForm('${job.jobId}')" class="py-4 bg-emerald-500 text-white font-bold rounded-xl text-lg">
                🏁 點我簽退
              </button>
            </div>
          `;
          container.appendChild(card);
        });
      });
    }

    // 8. 執行 GPS 簽到
    function performCheckIn(jobId) {
      if (!navigator.geolocation) {
        alert("您的手機不支援 GPS 定位，請聯繫社工協助簽到。");
        return;
      }
      
      alert("正在讀取您的位置，請保持原地不動約 3 秒鐘...");
      
      navigator.geolocation.getCurrentPosition(function(position) {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        
        document.getElementById("main-content").classList.add("hidden");
        document.getElementById("loading-spinner").classList.remove("hidden");

        callBackend("checkInService", [userLineUid, jobId, lat, lng], function(res) {
          alert(res.message);
          loadMyActiveJobs();
        });
      }, function(err) {
        alert("定位失敗，請確認手機已開啟「定位服務(GPS)」並允許 LINE 存取位置。");
      }, { enableHighAccuracy: true, timeout: 10000 });
    }

    // 9. 開啟簽退日誌畫面
    function openCheckOutForm(jobId) {
      currentActiveJobId = jobId;
      selectedMental = "";
      selectedWalk = "";
      isEmergencyActive = false;
      
      // 重置按鈕樣式
      const btns = document.querySelectorAll(".status-btn");
      btns.forEach(b => b.className = "status-btn p-3 border-2 border-slate-200 rounded-xl text-base bg-white hover:border-teal-500");
      
      const emergBtn = document.getElementById("btn-emergency");
      emergBtn.className = "w-full p-4 border-4 border-red-200 rounded-2xl bg-red-50 text-red-700 font-bold text-xl hover:bg-red-100 transition-all";
      emergBtn.innerText = "⚠️ 沒有狀況 (安全無虞)";

      switchView("view-checkout-form");
    }

    // 10. 選擇日誌選項 (免打字)
    function selectStatus(type, value) {
      if (type === 'mental') {
        selectedMental = value;
        updateButtonGroupStyle("status-mental-group", value);
      } else if (type === 'walk') {
        selectedWalk = value;
        updateButtonGroupStyle("status-walk-group", value);
      }
    }

    function updateButtonGroupStyle(groupId, selectedValue) {
      const container = document.getElementById(groupId);
      const buttons = container.getElementsByTagName("button");
      for (let btn of buttons) {
        if (btn.innerText.includes(selectedValue.substring(0,4))) {
          btn.className = "status-btn p-3 border-2 border-teal-500 bg-teal-50 text-teal-700 rounded-xl text-base font-bold";
        } else {
          btn.className = "status-btn p-3 border-2 border-slate-200 rounded-xl text-base bg-white hover:border-teal-500";
        }
      }
    }

    // 11. 切換緊急通報狀態
    function toggleEmergency() {
      isEmergencyActive = !isEmergencyActive;
      const emergBtn = document.getElementById("btn-emergency");
      if (isEmergencyActive) {
        emergBtn.className = "w-full p-4 border-4 border-red-600 rounded-2xl bg-red-600 text-white font-bold text-xl animate-pulse";
        emergBtn.innerText = "🚨 發生緊急狀況！(簽退後將立即通報社工)";
      } else {
        emergBtn.className = "w-full p-4 border-4 border-red-200 rounded-2xl bg-red-50 text-red-700 font-bold text-xl hover:bg-red-100 transition-all";
        emergBtn.innerText = "⚠️ 沒有狀況 (安全無虞)";
      }
    }

    // 12. 執行 GPS 簽退與送出日誌
    function submitCheckOut() {
      if (!selectedMental || !selectedWalk) {
        alert("💡 貼心提醒：請幫忙點選病友的精神與行走狀況，讓我們掌握病友的安全喔！");
        return;
      }

      if (!navigator.geolocation) {
        alert("您的手機不支援 GPS 定位，請聯繫社工協助簽退。");
        return;
      }

      const patientStatus = `【精神】${selectedMental}；【行動】${selectedWalk}`;
      
      alert("正在讀取您的位置，請保持原地不動約 3 秒鐘...");

      navigator.geolocation.getCurrentPosition(function(position) {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        
        document.getElementById("main-content").classList.add("hidden");
        document.getElementById("loading-spinner").classList.remove("hidden");

        callBackend("checkOutService", [userLineUid, currentActiveJobId, lat, lng, patientStatus, isEmergencyActive], function(res) {
          alert(res.message);
          loadMyActiveJobs();
        });
      }, function(err) {
        alert("定位失敗，請確認手機已開啟「定位服務(GPS)」並允許 LINE 存取位置。");
      }, { enableHighAccuracy: true, timeout: 10000 });
    }

    // 13. 呼叫 GAS 後端 API 的封裝函式 (使用 JSONP 解決跨網域問題)
    function callBackend(functionName, parameters, callback) {
      const callbackName = "gas_cb_" + Math.floor(Math.random() * 1000000);
      window[callbackName] = function(response) {
        callback(response);
        document.body.removeChild(script);
        delete window[callbackName];
      };

      const script = document.createElement("script");
      // 將參數序列化並附加到網址
      const encodedParams = encodeURIComponent(JSON.stringify(parameters));
      script.src = `${GAS_URL}?callback=${callbackName}&function=${functionName}&params=${encodedParams}`;
      document.body.appendChild(script);
    }
  </script>
</body>
