<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>台灣帕金森病友權益促進會 志工平台</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{--g:#2e7d32;--b:#1565c0;--o:#e65100;--r:#c62828;--bg:#f6f3ea}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:22px;background:var(--bg);color:#222;line-height:1.6}
header{background:#1b5e20;color:#fff;padding:12px 14px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px}
header h1{font-size:24px;margin:0;flex:1}
#back{display:none;background:#fff;color:#1b5e20;border:0;border-radius:14px;font-size:22px;font-weight:700;padding:10px 16px}
main{padding:12px 14px 60px;max-width:640px;margin:auto}
h2{font-size:26px;margin:6px 0}
.btn{display:block;width:100%;min-height:76px;font-size:26px;font-weight:700;border:0;border-radius:18px;color:#fff;background:var(--b);margin:12px 0;padding:12px;cursor:pointer}
.btn.g{background:var(--g)}.btn.o{background:var(--o)}.btn.r{background:var(--r)}.btn.gray{background:#666}
.btn.s{min-height:60px;font-size:22px;margin:8px 0}
.row{display:flex;gap:10px}.row .btn{flex:1}
.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.tag{display:inline-block;padding:2px 12px;border-radius:20px;color:#fff;font-size:20px;background:#666;margin:2px 4px 2px 0}
.tag.g{background:var(--g)}.tag.o{background:var(--o)}.tag.r{background:var(--r)}.tag.b{background:var(--b)}
label{font-weight:700;display:block}
input,select,textarea{width:100%;font-size:24px;padding:14px;border:2px solid #888;border-radius:12px;margin:6px 0 16px;background:#fff}
.chk{display:flex;gap:12px;align-items:flex-start;margin:12px 0;font-weight:400}
.chk input{width:38px;height:38px;margin:0;flex:none}
.big{font-size:40px;font-weight:800;color:var(--g)}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0}
.bar i{display:block;height:26px;background:var(--g);border-radius:6px;min-width:2px}
.bar span:first-child{width:90px;flex:none}
small,.sub{color:#555;font-size:19px}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;align-items:center;justify-content:center;padding:20px}
#modal .box{background:#fff;border-radius:20px;padding:22px;width:100%;max-width:480px;max-height:85vh;overflow:auto}
#modal pre{white-space:pre-wrap;font-family:inherit;font-size:24px;margin:0 0 10px}
#load{display:none;position:fixed;inset:0;background:rgba(255,255,255,.7);z-index:30;align-items:center;justify-content:center;font-size:30px;font-weight:700}
.lead{background:#fff8e1;border:2px dashed #f9a825}
</style>
</head>
<body>
<header><button id="back" onclick="home()">← 回首頁</button><h1 id="ttl">志工平台</h1></header>
<main id="app"><p style="text-align:center;margin-top:60px">載入中,請稍候…</p></main>
<div id="modal"><div class="box"><pre id="mtxt"></pre><div id="mbtn"></div></div></div>
<div id="load">請稍候…</div>

<script>
const CONFIG = {
  LIFF_ID: "2009456572-mxeoY8wg",
  GAS_API_URL: "https://script.google.com/macros/s/AKfycbyORGeZxve4GzguqBAZ3nmkauG6G7_AlLHJ8O-LkvvMH3w8wiyfRPfEpRIxH9x9_SI0Dg/exec"
};
const LIFF_URL = () => 'https://liff.line.me/' + CONFIG.LIFF_ID;
let ME = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wk = d => '日一二三四五六'[new Date(d + 'T00:00:00').getDay()];
const isLeader = () => ME.volunteer && ['隊長','管理員'].includes(ME.volunteer.角色);
const isAdmin = () => ME.volunteer && ME.volunteer.角色 === '管理員';
const isMember = () => ME.volunteer && ME.volunteer.狀態 === '在籍';

/* ---------- 基礎 ---------- */
async function api(action, data = {}) {
  $('load').style.display = 'flex';
  try {
    const r = await fetch(CONFIG.GAS_API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ ...data, action, token: liff.getAccessToken() }) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.msg);
    return j.data;
  } finally { $('load').style.display = 'none'; }
}
const act = fn => Promise.resolve().then(fn).catch(e => say('⚠️ ' + (e.message || e)));
function modal(text, buttons) {
  return new Promise(res => {
    $('mtxt').textContent = text;
    $('mbtn').innerHTML = '';
    buttons.forEach(([label, val, cls]) => {
      const b = document.createElement('button');
      b.className = 'btn s ' + (cls || ''); b.textContent = label;
      b.onclick = () => { $('modal').style.display = 'none'; res(val); };
      $('mbtn').appendChild(b);
    });
    $('modal').style.display = 'flex';
  });
}
const say = t => modal(t, [['我知道了', true, 'g']]);
const ask = t => modal(t, [['確定', true, 'g'], ['取消', false, 'gray']]);
function view(title, html, showBack = true) {
  $('ttl').textContent = title; $('back').style.display = showBack ? 'block' : 'none';
  $('app').innerHTML = html; window.scrollTo(0, 0);
}
async function sendChat(text) { // 在聊天室開啟時,傳一則訊息,觸發 LINE 自動回覆
  try { if (liff.isInClient()) await liff.sendMessages([{ type: 'text', text }]); } catch (e) {}
}
async function shareTask(t) {
  const uri = LIFF_URL();
  try {
    if (liff.isApiAvailable('shareTargetPicker')) {
      await liff.shareTargetPicker([{ type: 'flex', altText: '志工招募:' + t.名稱, contents: { type: 'bubble',
        body: { type: 'box', layout: 'vertical', spacing: 'md', contents: [
          { type: 'text', text: '🙋 志工招募', weight: 'bold', size: 'xl', color: '#2e7d32' },
          { type: 'text', text: t.名稱, weight: 'bold', size: 'lg', wrap: true },
          { type: 'text', text: '📅 ' + t.日期 + ' ' + t.開始 + '-' + t.結束 + '\n📍 ' + t.地點, wrap: true }] },
        footer: { type: 'box', layout: 'vertical', contents: [
          { type: 'button', style: 'primary', color: '#2e7d32', action: { type: 'uri', label: '我要報名', uri } }] } } }]);
      return;
    }
  } catch (e) { if (e && e.message) return say('分享失敗:' + e.message); }
  await say('請複製下面的連結,貼給朋友:\n\n' + uri);
}
const getPos = () => new Promise(res => {
  if (!navigator.geolocation) return res({});
  navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lng: p.coords.longitude }), () => res({}), { timeout: 8000, maximumAge: 60000 });
});
const taskCard = (t, extra = '') => `<div class="card"><h2>${esc(t.名稱)}</h2>
  <div>📅 ${esc(t.日期)}(星期${wk(t.日期)})</div><div>⏰ ${esc(t.開始)} ~ ${esc(t.結束)}</div><div>📍 ${esc(t.地點)}</div>
  ${t.說明 ? `<div>📝 ${esc(t.說明)}</div>` : ''}${extra}</div>`;

/* ---------- 首頁 ---------- */
async function home() {
  ME = await api('me');
  if (!isMember()) {
    const a = ME.application;
    let st = '';
    if (a && a.狀態 === '待審核') st = `<div class="card lead"><h2>⏳ 申請審核中</h2>協會收到您的申請了,審核通過後會用 LINE 通知您。</div>`;
    else if (a && a.狀態 === '未通過') st = `<div class="card"><h2>申請未通過</h2>${esc(a.備註 || '')}<br>如有疑問請聯絡協會。</div>`;
    view('志工平台', `<div class="card"><h2>${esc(ME.name)} 您好 👋</h2>歡迎來到<br><b>台灣帕金森病友權益促進會</b><br>志工服務平台</div>${st}
      ${a && a.狀態 === '待審核' ? '' : `<button class="btn g" onclick="act(applyView)">📝 我要成為志工</button>`}`, false);
    return;
  }
  const v = ME.volunteer;
  view('志工平台', `<div class="card"><h2>${esc(v.姓名)} 您好 👋</h2><span class="tag b">${esc(v.角色)}</span> <small>紀錄冊編號:${esc(v.紀錄冊編號)}</small></div>
    <button class="btn g" onclick="act(checkinView)">📍 今日打卡</button>
    <button class="btn" onclick="act(tasksView)">🙋 我要報名任務</button>
    <button class="btn" onclick="act(myTasksView)">📋 我的任務</button>
    <button class="btn o" onclick="act(()=>statsView('me'))">📊 我的服務時數</button>
    <button class="btn gray" onclick="act(profileView)">👤 我的資料</button>
    ${isLeader() ? `<button class="btn" style="background:#6a1b9a" onclick="act(leaderView)">🧑‍✈️ 隊長工作台</button>` : ''}
    ${isAdmin() ? `<button class="btn" style="background:#37474f" onclick="adminView()">🛠 管理工作台</button>` : ''}`, false);
}

/* ---------- 申請志工 ---------- */
function applyView() {
  view('申請成為志工', `<div class="card">
    <label>姓名 *</label><input id="a_n" value="${esc(ME.name)}">
    <label>性別</label><select id="a_s"><option>男</option><option>女</option><option>不願透露</option></select>
    <label>出生日期 *</label><input id="a_b" type="date">
    <label>手機電話 *</label><input id="a_t" type="tel" inputmode="tel">
    <label>Email</label><input id="a_e" type="email">
    <label>聯絡地址</label><input id="a_a">
    <label>緊急聯絡人</label><input id="a_c">
    <label>緊急聯絡人電話</label><input id="a_ct" type="tel">
    <label>我可以幫忙的事(專長)</label><input id="a_sk" placeholder="例如:接待、攝影、開車、文書">
    <label>法定代理人姓名 <small>(未滿18歲才需填寫)</small></label><input id="a_g">
    <div class="card lead"><b>【個人資料蒐集告知】</b><br><small>本會蒐集您的資料,用於志願服務人員管理、服務時數登錄、志願服務保險投保及活動聯繫,僅限本會使用,不會提供給無關的第三人。依個資法,您可隨時查詢、更正或請求刪除。</small></div>
    <label class="chk"><input type="checkbox" id="a_p">我已閱讀並同意個人資料蒐集告知</label>
    <div class="card lead"><b>【志工公約】</b><br><small>我願意尊重病友與家屬、保守服務中得知的隱私、依排定時間服務、無法出席提前通知,並遵守志願服務法及本會規定。</small></div>
    <label class="chk"><input type="checkbox" id="a_c2">我同意遵守志工公約</label>
    <button class="btn g" onclick="act(submitApply)">✅ 送出申請</button></div>`);
}
async function submitApply() {
  const g = id => $(id).value.trim();
  const f = { 姓名: g('a_n'), 性別: g('a_s'), 出生日期: g('a_b'), 電話: g('a_t'), Email: g('a_e'), 地址: g('a_a'), 緊急聯絡人: g('a_c'),
    緊急聯絡電話: g('a_ct'), 專長: g('a_sk'), 法定代理人: g('a_g'), 同意個資: $('a_p').checked ? 'Y' : 'N', 同意志工公約: $('a_c2').checked ? 'Y' : 'N' };
  if (!f.姓名 || !f.出生日期 || !f.電話) return say('請填寫有 * 的欄位');
  if (!await ask('確定要送出申請嗎?')) return;
  await api('apply', { form: f });
  await say('✅ 申請已送出!\n審核通過後,會用 LINE 通知您。');
  sendChat('我已申請志工');
  home();
}

/* ---------- 報名任務 ---------- */
async function tasksView() {
  const list = await api('listTasks');
  view('我要報名任務', list.length ? list.map(t => {
    const full = t.已報名 >= Number(t.需求人數);
    const btn = t.我已報名 ? `<span class="tag g">✔ 您已報名</span><button class="btn gray s" onclick="act(()=>cancelJoin('${t.任務編號}'))">取消報名</button>`
      : full ? `<span class="tag r">名額已滿</span>` : `<button class="btn g" onclick="act(()=>joinTask('${t.任務編號}'))">🙋 我要報名</button>`;
    return taskCard(t, `<div>👥 已報名 ${t.已報名} / 需 ${esc(t.需求人數)} 人</div>${btn}
      <button class="btn s" onclick='act(()=>shareTask(${JSON.stringify(t).replace(/'/g, "&#39;")}))'>📤 分享給朋友</button>`);
  }).join('') : '<div class="card">目前沒有可報名的任務。</div>');
}
async function joinTask(id) {
  if (!await ask('確定要報名這個任務嗎?')) return;
  const r = await api('join', { taskId: id });
  await say('✅ 報名成功!\n' + r.title + '\n' + r.日期 + ' ' + r.開始 + '\n前一天晚上會提醒您。');
  sendChat('我已報名任務:' + r.title);
  tasksView();
}
async function cancelJoin(id, userId) {
  if (!await ask('確定要取消嗎?')) return;
  await api('cancelJoin', { taskId: id, userId });
  await say('已取消'); userId ? roster(id) : tasksView();
}
async function myTasksView() {
    const list = await api('myTasks');
    view('我的任務', list.length ? list.map(t => taskCard(t,
      `<span class="tag b">${esc(t.方式)}</span>` +
      (t.簽退 ? `<span class="tag g">已完成 ${esc(t.時數)} 小時</span>` : t.簽到 ? `<span class="tag o">服務中</span>` : `<span class="tag">尚未服務</span>`)
    )).join('') : '<div class="card">您目前還沒有任務。</div>');
  }

  /* ---------- 今日打卡 ---------- */
  async function checkinView() {
    const list = await api('todayTasks');
    view('今日打卡', list.length ? list.map(t => {
      let btn;
      if (t.簽退) btn = `<span class="tag g">✔ 今日已完成,共 ${esc(t.時數)} 小時</span>`;
      else if (t.簽到) btn = `<div>簽到時間:${esc(t.簽到.slice(11, 16))}</div><button class="btn r" onclick="act(()=>doCheck('${t.任務編號}','out'))">🏁 服務結束・簽退</button>`;
      else btn = `<button class="btn g" onclick="act(()=>doCheck('${t.任務編號}','in'))">✅ 我到了・簽到</button>`;
      return taskCard(t, btn);
    }).join('') : '<div class="card">今天沒有您的任務。<br><small>若忘記打卡,請告訴隊長補登。</small></div>');
  }
  async function doCheck(id, type) {
    if (!await ask(type === 'in' ? '確定要簽到嗎?' : '確定要簽退嗎?')) return;
    const pos = await getPos();
    const msg = await api('checkin', { taskId: id, type, ...pos });
    await say('✅ ' + msg);
    sendChat(type === 'in' ? '我已簽到' : '我已簽退');
    checkinView();
  }

  /* ---------- 統計與分析 ---------- */
  function bars(obj, unit = '小時') {
    const keys = Object.keys(obj), mx = Math.max(1, ...keys.map(k => obj[k]));
    return keys.length ? keys.map(k => `<div class="bar"><span>${esc(k)}</span><i style="width:${Math.round(obj[k] / mx * 55)}%"></i><span>${obj[k]}${unit === '小時' ? '' : unit}</span></div>`).join('') : '<small>尚無資料</small>';
  }
  async function statsView(scope, year) {
    const s = await api('stats', { scope, year });
    const y = Number(s.year);
    const mon = {}; Object.keys(s.byMonth).forEach(m => mon[m + '月'] = s.byMonth[m]);
    view(scope === 'all' ? '全會統計' : '我的服務時數', `
      <div class="row"><button class="btn gray s" onclick="act(()=>statsView('${scope}','${y - 1}'))">◀ ${y - 1}</button>
      <button class="btn gray s" onclick="act(()=>statsView('${scope}','${y + 1}'))">${y + 1} ▶</button></div>
      <div class="card"><h2>${y} 年</h2>
        <div>服務時數</div><div class="big">${s.hours} 小時</div>
        <div>服務次數:<b>${s.count}</b> 次${scope === 'all' ? `<br>服務人數:<b>${s.people}</b> 人<br>在籍志工:<b>${s.volunteers}</b> 人<br>辦理任務:<b>${s.tasks}</b> 場` : `<br>累計總時數:<b>${s.lifetime}</b> 小時`}</div></div>
      <div class="card"><h2>每月時數</h2>${bars(mon)}</div>
      <div class="card"><h2>服務類別</h2>${bars(s.byCat)}</div>
      ${s.rank ? `<div class="card"><h2>🏆 時數前十名</h2>${s.rank.map((r, i) => `<div>${i + 1}. ${esc(r.姓名)}:${r.時數} 小時</div>`).join('') || '<small>尚無資料</small>'}</div>` : ''}`);
  }

  /* ---------- 我的資料 ---------- */
  function profileView() {
    const v = ME.volunteer;
    view('我的資料', `<div class="card">
      <label>姓名</label><div style="margin:6px 0 16px">${esc(v.姓名)}</div>
      <label>紀錄冊編號</label><div style="margin:6px 0 16px">${esc(v.紀錄冊編號)}</div>
      <label>基礎訓練時數 / 特殊訓練時數</label><div style="margin:6px 0 16px">${esc(v.基礎訓練時數)} / ${esc(v.特殊訓練時數)} 小時</div>
      <label>志願服務保險</label><div style="margin:6px 0 16px">${esc(v.志願服務保險)}</div>
      <label>手機電話</label><input id="p_t" type="tel" value="${esc(v.電話)}">
      <label>Email</label><input id="p_e" value="${esc(v.Email)}">
      <label>聯絡地址</label><input id="p_a" value="${esc(v.地址)}">
      <label>緊急聯絡人</label><input id="p_c" value="${esc(v.緊急聯絡人)}">
      <label>緊急聯絡人電話</label><input id="p_ct" type="tel" value="${esc(v.緊急聯絡電話)}">
      <label>專長</label><input id="p_s" value="${esc(v.專長)}">
      <button class="btn g" onclick="act(saveProfile)">💾 儲存</button></div>`);
  }
  async function saveProfile() {
    const g = id => $(id).value.trim();
    await api('saveMyProfile', { form: { 電話: g('p_t'), Email: g('p_e'), 地址: g('p_a'), 緊急聯絡人: g('p_c'), 緊急聯絡電話: g('p_ct'), 專長: g('p_s') } });
    await say('✅ 已儲存'); home();
  }

  /* ---------- 隊長工作台 ---------- */
  async function leaderView() {
    const list = await api('leaderTasks');
    view('隊長工作台', `
      <button class="btn g" onclick="createTaskView()">➕ 建立新任務</button>
      <button class="btn o" onclick="act(()=>statsView('all'))">📊 全會統計</button>
      <h2>任務列表</h2>` +
      (list.map(t => taskCard(t, `<div>👥 ${t.已報名} / ${esc(t.需求人數)} 人 <span class="tag ${t.狀態 === '招募中' ? 'g' : ''}">${esc(t.狀態)}</span></div>
        <button class="btn s" onclick="act(()=>roster('${t.任務編號}'))">👥 名單・指定志工</button>`)).join('') || '<div class="card">還沒有任務。</div>'));
  }
  function createTaskView() {
    const d = new Date(Date.now() + 8 * 3600000 + 86400000).toISOString().slice(0, 10);
    view('建立新任務', `<div class="card">
      <label>任務名稱 *</label><input id="k_n" placeholder="例如:病友聚會接待">
      <label>類別</label><select id="k_c"><option>活動協助</option><option>病友關懷</option><option>行政文書</option><option>宣導倡議</option><option>募款義賣</option><option>其他</option></select>
      <label>日期 *</label><input id="k_d" type="date" value="${d}">
      <label>開始時間 *</label><input id="k_s" type="time" value="09:00">
      <label>結束時間 *</label><input id="k_e" type="time" value="12:00">
      <label>地點 *</label><input id="k_l">
      <label>需要幾位志工 *</label><input id="k_p" type="number" inputmode="numeric" value="5" min="1">
      <label>說明</label><textarea id="k_x" rows="3"></textarea>
      <button class="btn g" onclick="act(submitTask)">✅ 建立任務</button></div>`);
  }
  async function submitTask() {
    const g = id => $(id).value.trim();
    const f = { 名稱: g('k_n'), 類別: g('k_c'), 日期: g('k_d'), 開始: g('k_s'), 結束: g('k_e'), 地點: g('k_l'), 需求人數: g('k_p'), 說明: g('k_x') };
    if (!await ask('確定要建立這個任務嗎?')) return;
    await api('createTask', { form: f });
    await say('✅ 任務已建立!\n您可以在列表中「指定志工」,或請志工自行報名。');
    leaderView();
  }
  async function roster(id) {
    const r = await api('roster', { taskId: id }), t = r.task;
    view('任務名單', taskCard(t, `
      <button class="btn s" onclick='act(()=>shareTask(${JSON.stringify(t).replace(/'/g, "&#39;")}))'>📤 分享招募訊息</button>
      <button class="btn g s" onclick="act(()=>assignView('${id}'))">🧑‍✈️ 指定志工參加</button>
      <button class="btn r s" onclick="act(()=>cancelTask('${id}'))">🗑 取消整個任務</button>`) +
      `<h2>已報名 ${r.list.length} 人</h2>` +
      (r.list.map(p => `<div class="card"><b>${esc(p.姓名)}</b> <span class="tag b">${esc(p.方式)}</span><br>
        ${p.簽退 ? `<span class="tag g">已完成 ${esc(p.時數)} 小時</span>` : p.簽到 ? '<span class="tag o">服務中</span>' : '<span class="tag">未打卡</span>'}
        <button class="btn s" onclick="act(()=>manual('${id}','${p.userId}'))">補登打卡(依任務時間)</button>
        <button class="btn gray s" onclick="act(()=>cancelJoin('${id}','${p.userId}'))">移除此人</button></div>`).join('') || '<div class="card">還沒有人。</div>'));
  }
  async function manual(id, u) {
    if (!await ask('這位志工當天有到場,要依任務時間補登時數嗎?')) return;
    await say('✅ ' + await api('manualCheckin', { taskId: id, userId: u })); roster(id);
  }
  async function cancelTask(id) {
    if (!await ask('取消後會通知所有報名的志工,確定嗎?')) return;
    await say('✅ ' + await api('cancelTask', { taskId: id })); leaderView();
  }
  async function assignView(id) {
    const vs = await api('volunteers');
    view('指定志工', `<div class="card">${vs.map(v => `<label class="chk"><input type="checkbox" class="as" value="${esc(v.userId)}">
      <span>${esc(v.姓名)} <small>${esc(v.專長 || '')}</small></span></label>`).join('')}</div>
      <button class="btn g" onclick="act(()=>doAssign('${id}'))">✅ 確定指定,並通知他們</button>`);
  }
  async function doAssign(id) {
    const ids = [...document.querySelectorAll('.as:checked')].map(x => x.value);
    if (!ids.length) return say('請先勾選志工');
    if (!await ask('確定指定 ' + ids.length + ' 位志工嗎?')) return;
    await say('✅ ' + await api('assign', { taskId: id, userIds: ids })); roster(id);
  }

  /* ---------- 管理工作台 ---------- */
  function adminView() {
    view('管理工作台', `
      <button class="btn g" onclick="act(appsView)">📝 審核志工申請</button>
      <button class="btn" onclick="act(volsView)">📒 志工名冊管理</button>
      <button class="btn o" onclick="act(()=>statsView('all'))">📊 全會統計</button>
      <button class="btn gray" onclick="act(exportReport)">📁 匯出年度報表到雲端硬碟</button>`);
  }
  async function appsView() {
    const l = await api('applications');
    view('待審核申請', l.map(a => `<div class="card"><h2>${esc(a.姓名)}</h2>
      <div>${esc(a.性別)}・${esc(a.出生日期)}</div><div>📞 ${esc(a.電話)}</div><div>專長:${esc(a.專長) || '-'}</div>
      ${a.法定代理人 ? `<div>法定代理人:${esc(a.法定代理人)}</div>` : ''}
      <div class="row"><button class="btn g s" onclick="act(()=>review('${a.申請編號}',true))">通過</button>
      <button class="btn r s" onclick="act(()=>review('${a.申請編號}',false))">不通過</button></div></div>`).join('') || '<div class="card">目前沒有待審核的申請。</div>');
  }
  async function review(id, pass) {
    if (!await ask(pass ? '確定通過嗎?' : '確定不通過嗎?')) return;
    let reason = '';
    if (!pass) reason = prompt('請輸入原因(可空白)') || '';
    await api('review', { id, pass, reason });
    await say('✅ 已處理並通知申請人'); appsView();
  }
  async function volsView() {
    const l = await api('volunteers');
    view('志工名冊', l.map(v => `<div class="card"><h2>${esc(v.姓名)}</h2>
      <span class="tag b">${esc(v.角色)}</span> <small>${esc(v.紀錄冊編號)}</small>
      <div>📞 ${esc(v.電話)}</div><div>訓練:基礎 ${esc(v.基礎訓練時數)} 小時 / 特殊 ${esc(v.特殊訓練時數)} 小時</div>
      <div>保險:${esc(v.志願服務保險)}</div>
      <button class="btn s" onclick='act(()=>editVol(${JSON.stringify(v).replace(/'/g, "&#39;")}))'>✏️ 修改</button></div>`).join(''));
  }
  function editVol(v) {
    view('修改志工資料', `<div class="card"><h2>${esc(v.姓名)}</h2>
      <label>角色</label><select id="e_r">${['志工', '隊長', '管理員'].map(x => `<option ${x === v.角色 ? 'selected' : ''}>${x}</option>`).join('')}</select>
      <label>狀態</label><select id="e_s">${['在籍', '退出'].map(x => `<option ${x === v.狀態 ? 'selected' : ''}>${x}</option>`).join('')}</select>
      <label>基礎訓練時數(法定 12 小時)</label><input id="e_b" type="number" value="${esc(v.基礎訓練時數)}">
      <label>特殊訓練時數</label><input id="e_t" type="number" value="${esc(v.特殊訓練時數)}">
      <label>志願服務保險</label><select id="e_i">${['待投保', '已投保'].map(x => `<option ${x === v.志願服務保險 ? 'selected' : ''}>${x}</option>`).join('')}</select>
      <button class="btn g" onclick="act(()=>saveVol('${v.userId}'))">💾 儲存</button></div>`);
  }
  async function saveVol(u) {
    await api('updateVolunteer', { userId: u, form: { 角色: $('e_r').value, 狀態: $('e_s').value, 基礎訓練時數: $('e_b').value, 特殊訓練時數: $('e_t').value, 志願服務保險: $('e_i').value } });
    await say('✅ 已儲存'); volsView();
  }
  async function exportReport() {
    const r = await api('exportReport');
    await say('✅ 已匯出到 Google 雲端硬碟資料夾「帕金森志工平台報表」\n檔案:' + r.file);
  }

  /* ---------- 啟動 ---------- */
  (async () => {
    try {
      await liff.init({ liffId: CONFIG.LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login(); return; }
      await home();
    } catch (e) {
      $('app').innerHTML = '<div class="card"><h2>⚠️ 無法開啟</h2>' + esc(e.message || e) + '<br><br>請關閉後,從 LINE 重新開啟。</div>';
    }
  })();
  </script>
  </body>
  </html>
