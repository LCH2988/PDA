/* ---------- 提示（不自動消失，最多同時 3 則） ---------- */
function toast(message, type) {
  const region = $('#toast-region');
  while (region.children.length >= 3) region.firstChild.remove();
  const box = document.createElement('div');
  box.className = 'toast ' + (type || 'info');
  const icon = { ok: '✅ ', error: '⚠️ ', info: 'ℹ️ ' }[type || 'info'];
  box.innerHTML = '<span>' + icon + esc(message) + '</span>';
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'btn'; b.textContent = '我知道了';
  b.onclick = () => box.remove();
  box.appendChild(b);
  region.appendChild(box);
  if (type === 'error') b.focus();
}

/* ---------- 對話框


  /* ---------- 對話框（開啟時背景 inert，支援疊加） ---------- */
  const modalStack = [];
  const BG_SEL = ['#app-header', '#main', '#app-footer', '#bottom-nav'];
  function setBgInert(on) { BG_SEL.forEach((s) => { const el = $(s); if (el) el.inert = on; }); }

  function openModal(html, opts) {
    opts = opts || {};
    const prev = document.activeElement;
    const back = document.createElement('div'); back.className = 'modal-back';
    const m = document.createElement('div'); m.className = 'modal';
    m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true'); m.setAttribute('aria-label', opts.label || '對話框');
    m.innerHTML = html; back.appendChild(m);
    if (modalStack.length) modalStack[modalStack.length - 1].inert = true; else setBgInert(true);
    modalStack.push(back);
    $('#modal-root').appendChild(back);
    let closed = false;
    const focusables = () => $$('button,a[href],input,select,textarea,[tabindex]:not([tabindex="-1"])', m)
      .filter((x) => !x.disabled && x.offsetParent !== null);
    function close(result) {
      if (closed) return; closed = true;
      document.removeEventListener('keydown', onKey, true);
      back.remove();
      modalStack.splice(modalStack.indexOf(back), 1);
      if (modalStack.length) modalStack[modalStack.length - 1].inert = false; else setBgInert(false);
      if (prev && prev.focus) prev.focus();
      if (opts.onClose) opts.onClose(result);
    }
    function onKey(e) {
      if (modalStack[modalStack.length - 1] !== back) return;
      if (e.key === 'Escape' && opts.dismissable !== false) { e.preventDefault(); close(null); }
      if (e.key === 'Tab') {
        const f = focusables(); if (!f.length) return;
        const first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    }
    document.addEventListener('keydown', onKey, true);
    const f = focusables(); if (f.length) f[0].focus();
    return { el: m, close: close };
  }

  function confirmBox(title, text, okLabel) {
    return new Promise((resolve) => {
      const dlg = openModal(
        '<h2>' + esc(title) + '</h2><p>' + esc(text) + '</p>' +

        '<button type="button" class="btn primary" data-r="1">' + esc(okLabel || '確定') + '</button></div>',
        { label: title, onClose: (r) => resolve(r === true) });

    });
  }

  function confirmDanger(title, text, okLabel) {
    return new Promise((resolve) => {
      const dlg = openModal(
        '<h2>⚠️ ' + esc(title) + '</h2><div class="banner danger">' + esc(text) + '</div>' +
        '<div class="check"><input type="checkbox" id="cd-ok"><label for="cd-ok">我了解，這個動作無法復原</label></div>' +
        '<div class="btn-row"><button type="button" class="btn" data-r="0">先不要</button>' +
        '<button type="button" class="btn danger primary" data-r="1" disabled>' + esc(okLabel || '確定執行') + '</button></div>',
        { label: title, onClose: (r) => resolve(r === true) });

  /* ---------- API ---------- */
  class ApiError extends Error {
    constructor(code, message) { super(message); this.code = code; }
  }

  async function rawPost(action, data, token) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), CONFIG.API_TIMEOUT_MS);
    try {
      const res = await fetch(CONFIG.API_BASE, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: action, sessionToken: token || '', data: data || {} }),
        signal: ctrl.signal, redirect: 'follow'
      });
      if (!res.ok) throw new ApiError('HTTP', '伺服器暫時無法回應（' + res.status + '）');
      try { return await res.json(); }
      catch (e) { throw new ApiError('BAD_RESPONSE', '伺服器回應格式不正確'); }
    } catch (e) {
      if (e instanceof ApiError) throw e;
      if (e.name === 'AbortError') throw new ApiError('TIMEOUT', '連線逾時，請檢查網路後再試一次');
      throw new ApiError('NETWORK', '無法連線，請檢查網路');
    } finally { clearTimeout(timer); }
  }

  /**
   * opts.loading / opts.loadingMsg 顯示遮罩
   * opts.retry   失敗自動重試一次（只給讀取類；寫入絕不重試）
   * opts.silent  錯誤不彈提示，也不強制跳登入頁
   */
  async function api(action, data, opts) {
    opts = opts || {};
    const needAuth = API_CONTRACT.publicActions.indexOf(action) === -1;
    if (needAuth && !State.token) {
      if (!opts.silent) go('#/login');
      throw new ApiError('NO_SESSION', '請先登入');
    }
    if (opts.loading) showLoading(opts.loadingMsg);
    try {
      let json;
      try { json = await rawPost(action, data, State.token); }
      catch (e) {
        if (opts.retry && (e.code === 'NETWORK' || e.code === 'TIMEOUT' || e.code === 'HTTP')) {
          await wait(1200);
          json = await rawPost(action, data, State.token);
        } else throw e;
      }
      if (!json || json.success !== true) {
        const code = (json && json.code) || 'UNKNOWN';
        const msg = (json && json.message) || '發生未知錯誤';
        if (needAuth && SESSION_FAIL_CODES.indexOf(code) !== -1) {
          clearSession();
          if (!opts.silent) { toast('登入已逾時，請重新登入', 'error'); go('#/login'); }
        }
        throw new ApiError(code, msg);
      }
      return json.data;
    } catch (e) {
      const quiet = ['NO_SESSION'].indexOf(e.code) !== -1 || (needAuth && SESSION_FAIL_CODES.indexOf(e.code) !== -1);
      if (!opts.silent && !quiet) toast(e.message || '發生錯誤', 'error');
      throw e;
    } finally { if (opts.loading) hideLoading(); }
  }

  /* ---------- 閱讀輔助 ---------- */
  const SIZE_STEPS = [['normal', '標準'], ['large', '大'], ['xl', '特大']];
  function applySize(v) {

    const found = SIZE_STEPS.find((s) => s[0] === v) || SIZE_STEPS[0];

  /* ---------- 檔案與圖片壓縮 ---------- */
  function readAsDataURL(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result); r.onerror = () => rej(new Error('讀取檔案失敗'));
      r.readAsDataURL(file);
    });
  }
  /** 回傳 { dataUrl, name, mime, size }；PDF 不壓縮但限制 3MB */
  async function prepareFile(file, maxBytes) {
    maxBytes = maxBytes || 1000000;
    if (!file) throw new Error('請選擇檔案');
    if (file.type === 'application/pdf') {
      if (file.size > 3000000) throw new Error('PDF 檔案請小於 3MB');
      return { dataUrl: await readAsDataURL(file), name: file.name, mime: file.type, size: file.size };
    }
    if (!/^image\/(jpeg|png|webp|heic|heif)$/i.test(file.type)) throw new Error('只能上傳照片或 PDF');
    const src = await readAsDataURL(file);
    const img = await new Promise((res, rej) => {
      const i = new Image(); i.onload = () => res(i);
      i.onerror = () => rej(new Error('無法讀取這張照片（若是 HEIC 請改用相機的「最相容」格式）'));
      i.src = src;
    });
    let w = img.naturalWidth, h = img.naturalHeight;
    const MAX_SIDE = 1600;
    if (Math.max(w, h) > MAX_SIDE) { const k = MAX_SIDE / Math.max(w, h); w = Math.round(w * k); h = Math.round(h * k); }
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
    let q = 0.85, out = cv.toDataURL('image/jpeg', q);
    while (out.length * 0.75 > maxBytes && q > 0.4) { q -= 0.1; out = cv.toDataURL('image/jpeg', q); }
    while (out.length * 0.75 > maxBytes && cv.width > 600) {
      cv.width = Math.round(cv.width * 0.8); cv.height = Math.round(cv.height * 0.8);
      const c2 = cv.getContext('2d'); c2.fillStyle = '#fff'; c2.fillRect(0, 0, cv.width, cv.height);
      c2.drawImage(img, 0, 0, cv.width, cv.height); out = cv.toDataURL('image/jpeg', 0.7);
    }
    return { dataUrl: out, name: file.name.replace(/\.\w+$/, '') + '.jpg', mime: 'image/jpeg', size: Math.round(out.length * 0.75) };
  }
  /** 後端 FileModule 需要 { name, mime, base64 } */
  function toUpload(f) {
    return { name: f.name, mime: f.mime, base64: String(f.dataUrl).split(',')[1] || '' };
  }

  /* ---------- 表單輔助 ---------- */
  function formData(form) {
    const o = {};
    new FormData(form).forEach((v, k) => { if (typeof v === 'string') o[k] = v.trim(); });
    return o;
  }
  function markInvalid(form, name, message) {
    const f = form.elements[name]; if (!f) return;
    const box = (f.closest ? f.closest('.field') : null) || (f[0] && f[0].closest('.field')); if (!box) return;
    box.classList.add('invalid');
    let e = $('.err', box);
    if (!e) { e = document.createElement('div'); e.className = 'err'; e.setAttribute('role', 'alert'); box.appendChild(e); }
    e.textContent = message;
    if (f.focus) f.focus();
  }
  function clearInvalid(form) {
    $$('.field.invalid', form).forEach((b) => b.classList.remove('invalid'));
    $$('.field .err', form).forEach((e) => e.remove());
  }
  function once(btn, fn) {
    return async function () {
      if (btn.disabled) return;
      btn.disabled = true;
      try { return await fn.apply(this, arguments); } finally { btn.disabled = false; }
    };
  }

  /* ---------- 草稿（排除指定欄位；登出時全部清除） ---------- */
  function bindDraft(form, key, exclude) {
    exclude = exclude || [];
    const k = CONFIG.DRAFT_PREFIX + key;
    try {
      const saved = JSON.parse(store.get(k) || 'null');
      if (saved) Object.keys(saved).forEach((n) => {
        if (exclude.indexOf(n) !== -1) return;
        const el = form.elements[n];
        if (!el || el.type === 'file') return;
        if (el.length !== undefined && el.type === undefined) {
          Array.from(el).forEach((r) => { r.checked = (r.value === saved[n]); });
        } else el.value = saved[n];
      });
    } catch (e) {}
    form.addEventListener('input', () => {
      const d = {};
      new FormData(form).forEach((v, n) => { if (typeof v === 'string' && exclude.indexOf(n) === -1) d[n] = v; });
      store.set(k, JSON.stringify(d));
    });
    return { clear: () => store.del(k) };
  }
  function clearAllDrafts() {
    try {
      Object.keys(localStorage).filter((k) => k.indexOf(CONFIG.DRAFT_PREFIX) === 0)
        .forEach((k) => localStorage.removeItem(k));
    } catch (e) {}
  }

  /* ---------- 工作階段 ---------- */
  function saveSession(token, user) {
    State.token = token; State.user = user;
    store.set(CONFIG.SESSION_TOKEN_KEY, token);
    store.set(CONFIG.SESSION_USER_KEY, JSON.stringify({
      name: user.name, memberType: user.memberType, isAdmin: !!user.isAdmin, isFinanceAdmin: !!user.isFinanceAdmin
    }));
  }
  function clearSession() {
    State.token = ''; State.user = null;
    store.del(CONFIG.SESSION_TOKEN_KEY); store.del(CONFIG.SESSION_USER_KEY);
    temp.del('bindToken');
    clearAllDrafts();
  }
  async function logout() {

    try { await api(API_CONTRACT.logout, {}, { silent: true, loading: true }); } catch (e) {}
    clearSession();
    go('#/login');
  }

  /* ---------- LINE LIFF 登入與綁定 ---------- */
  let liffReady = false;
  async function initLiff() {
    if (liffReady) return true;
    if (typeof liff === 'undefined') return false;
    try { await liff.init({ liffId: CONFIG.LIFF_ID }); liffReady = true; return true; }
    catch (e) { return false; }
  }
  /** 回傳 ID Token；尚未登入 LINE 時會導向登入並回傳 null */
  async function lineIdToken() {
    if (!(await initLiff())) throw new ApiError('LIFF', '無法啟動 LINE，請在 LINE 內開啟本頁');
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href.split('#')[0] }); return null; }
    const t = liff.getIDToken();
    if (!t) throw new ApiError('LIFF', '取不到 LINE 身分，請確認 LIFF 已開啟 openid 權限');
    return t;
  }

  /** 回傳 'ok' | 'bind' | 'login' | 'redirect' */
  async function autoLogin() {
    if (State.token) {
      try {
        const r = await api(API_CONTRACT.me, {}, { silent: true, retry: true });
        State.user = r.user || r; return 'ok';
      } catch (e) {
        if (SESSION_FAIL_CODES.indexOf(e.code) !== -1) clearSession();
        else if (State.user) return 'ok';   // 只是網路問題：保留登入
      }
    }
    let t = null;
    try { t = await lineIdToken(); } catch (e) { toast(e.message, 'error'); return 'login'; }
    if (!t) return 'redirect';
    try {
      const r = await api(API_CONTRACT.login, { idToken: t, ua: navigator.userAgent.slice(0, 100) }, { silent: true, loading: true });
      if (r && r.needBind) { temp.set('bindToken', r.bindToken || ''); return 'bind'; }
      if (!r || !r.sessionToken || !r.user) { toast('登入回應格式不正確', 'error'); return 'login'; }
      saveSession(r.sessionToken, r.user);
      return 'ok';
    } catch (e) {
      toast(e.message, 'error');
      return 'login';
    }
  }

  function renderLogin() {

      '<form id="bind-form" class="card" novalidate autocomplete="off">' +

      '<div class="field"><label for="b-phone">手機號碼 <span class="req">*</span></label><input id="b-phone" name="phone" type="tel" inputmode="numeric" maxlength="12" placeholder="例如 0912345678" autocomplete="off"></div>' +
      '<div class="field"><label for="b-id">身分證字號後四碼 <span class="req">*</span></label><input id="b-id" name="idLast4" type="text" maxlength="4" placeholder="例如 5678" autocomplete="off">' +
      '<div class="hint">只需要後四碼，不需要完整字號。</div></div>' +

    const form = $('#bind-form');   // 個資不存草稿

  /* ---------- 路由 ---------- */
  const Routes = { table: {} };
  Routes.add = function (path, def) { Routes.table[path] = def; };
  function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }

  function setMain(html, title) {
    $('#main').innerHTML = html;
    document.title = (title ? title + '｜' : '') + '台灣帕金森病友權益促進會';
    const h = $('#main h1'); if (h) h.setAttribute('tabindex', '-1');

    (h || $('#main')).focus({ preventScroll: true });
  }
  function setNav(name) {
    $$('#bottom-nav a').forEach((a) => {
      if (a.dataset.nav === name) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
  }
  function parseHash() {
    const raw = (location.hash || '#/home').slice(1);
    const i = raw.indexOf('?');
    const p = i === -1 ? raw : raw.slice(0, i);
    const q = i === -1 ? '' : raw.slice(i + 1);
    const params = {}; new URLSearchParams(q).forEach((v, k) => { params[k] = v; });
    return { path: p || '/home', params: params };
  }
  function allowed(level) {
    if (!level || level === 'public') return true;
    if (!State.user) return false;
    if (level === 'member') return true;
    if (level === 'admin') return isAdmin();
    if (level === 'finance') return isFinance();
    return false;
  }

  async function route() {
    runCleanups();
    const myToken = ++State.lastRouteToken;
    const parsed = parseHash(), path = parsed.path, params = parsed.params;

    if (path === '/login') { if (State.user) return go('#/home'); setNav(''); return renderLogin(); }
    if (path === '/bind')  { setNav(''); return renderBind(); }

    const def = Routes.table[path];
    if (!def) {
      setNav('home');
      return setMain('<div class="empty"><span class="ic" aria-hidden="true">🔍</span><h1>找不到這個頁面</h1>' +
        '<a class="btn primary" href="#/home">回首頁</a></div>', '找不到頁面');
    }
    if (def.auth !== 'public' && !State.user) {
      const r = await autoLogin();
      if (myToken !== State.lastRouteToken) return;
      if (r === 'redirect') return;
      if (r === 'bind') return go('#/bind');
      if (r !== 'ok') return go('#/login');
    }
    if (!allowed(def.auth)) {
      setNav('');
      return setMain('<h1>沒有權限</h1><div class="banner danger">您沒有權限使用這個功能。</div><a class="btn primary" href="#/home">回首頁</a>', '沒有權限');

  function todayLocal() {
    const d = new Date(), p = (n) => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  /** 以本地時區計算到期日剩餘天數（到期日當天 23:59 前都算有效） */
  function daysLeft(dateStr) {
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(dateStr || ''));
    if (!m) return NaN;
    const end = new Date(+m[1], +m[2] - 1, +m[3], 23, 59, 59);
    return Math.ceil((end - new Date()) / 86400000);
  }
  function statusBadge(s) {
    s = String(s || '');
    let cls = 'info', icon = '•';
    if (/確認|有效|已發布|正常|啟用|已撥款/.test(s)) { cls = 'ok'; icon = '✔'; }
    else if (/待/.test(s)) { cls = 'warn'; icon = '⏳'; }
    else if (/退回|作廢|停用|失敗/.test(s)) { cls = 'danger'; icon = '✖'; }
    return '<span class="badge ' + cls + '">' + icon + ' ' + esc(s) + '</span>';
  }
  function pagerHtml(r) {
    if (!r || (r.page <= 1 && !r.hasMore)) return '';
    return '<div class="pager">' +
      '<button type="button" class="btn" data-pg="' + (r.page - 1) + '"' + (r.page <= 1 ? ' disabled' : '') + '>← 上一頁</button>' +
      '<span>第 ' + r.page + ' 頁</span>' +
      '<button type="button" class="btn" data-pg="' + (r.page + 1) + '"' + (!r.hasMore ? ' disabled' : '') + '>下一頁 →</button></div>';
  }
  function bindFilePick(root, inputSel, previewSel) {
    let prepared = null;
    const input = $(inputSel, root), prev = $(previewSel, root);
    input.onchange = async () => {
      prepared = null; prev.innerHTML = '';
      const f = input.files && input.files[0]; if (!f) return;
      showLoading('正在處理照片…');
      try {
        prepared = await prepareFile(f);
        prev.innerHTML = prepared.mime === 'application/pdf'
          ? '<p>📄 已選擇：' + esc(prepared.name) + '</p>'
          : '<img alt="已選擇的憑證預覽" src="' + prepared.dataUrl + '">';
      } catch (e) { toast(e.message, 'error'); input.value = ''; }
      finally { hideLoading(); }
    };
    return () => prepared;
  }

  function bindPaymentForm(kind) {
    const form = $('#pay-form');
    const getFile = bindFilePick(form, '#f-file', '#f-prev');
    const draft = bindDraft(form, kind, ['year', 'payDate']);   // 年度與日期不還原舊值
    if (form.elements.year) form.elements.year.value = new Date().getFullYear();
    $$('input[name=preset]', form).forEach((r) => { r.checked = false; r.onchange = () => { form.elements.amount.value = r.value; }; });
    form.elements.amount.addEventListener('input', () => { $$('input[name=preset]', form).forEach((r) => { r.checked = false; }); });

    form.onsubmit = async (e) => {
      e.preventDefault(); clearInvalid(form);
      const d = formData(form);
      const amt = Number(d.amount);
      if (!amt || amt <= 0 || amt !== Math.floor(amt)) return markInvalid(form, 'amount', '請輸入正確金額（整數）');
      if (!d.payDate) return markInvalid(form, 'payDate', '請選擇日期');
      if (d.payDate > todayLocal()) return markInvalid(form, 'payDate', '日期不能是未來');
      const f = getFile();
      if (!f) { toast('請先上傳付款憑證', 'error'); return $('#f-file').focus(); }
      if (!(await confirmBox('確認送出', '金額 ' + money(amt) + '，日期 ' + d.payDate + '。送出後等待協會確認。', '確認送出'))) return;

      const body = { amount: amt, payDate: d.payDate, method: d.method, note: d.note, proof: toUpload(f) };
      if (kind === 'payment') body.year = Number(d.year); else { body.donorName = d.donorName; body.purpose = d.purpose; }
      const btn = $('button[type=submit]', form); btn.disabled = true;
      try {
        await api(kind === 'payment' ? ACT.paySubmit : ACT.donSubmit, body, { loading: true, loadingMsg: '正在上傳，請勿離開…' });   // 寫入不重試
        draft.clear();
        toast('已送出，協會確認後會開立電子收據。', 'ok');
        go('#/my-payments');
      } catch (err) { /* api 已提示 */ } finally { btn.disabled = false; }
    };
  }

  /* ==================== 憑證預覽（Blob URL） ==================== */
  function b64ToBlobUrl(b64, mime) {
    const bin = atob(b64), arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return URL.createObjectURL(new Blob([arr], { type: mime }));
  }
  async function showProof(fileId) {
    try {
      const r = await api(ACT.filePreview, { fileId: fileId }, { loading: true });
      if (!r || !r.base64) return toast('無法顯示此檔案', 'error');
      const mime = r.mime || 'image/jpeg';
      const url = b64ToBlobUrl(r.base64, mime);
      const isPdf = /pdf/i.test(mime);
      const body = isPdf
        ? '<p>這是 PDF 檔案，請點下方按鈕開啟。</p><a class="btn block" href="' + url + '" target="_blank" rel="noopener">📄 開啟 PDF</a>'
        : '<img alt="付款憑證" src="' + url + '">';
      const dlg = openModal('<h2>付款憑證</h2>' + body +
        '<div class="btn-row"><button type="button" class="btn primary" id="pv-x">關閉</button></div>',
        { label: '付款憑證', onClose: () => setTimeout(() => URL.revokeObjectURL(url), 60000) });
      $('#pv-x', dlg.el).onclick = () => dlg.close();
    } catch (e) {}
  }

        numInput('h-tap', 'tapScore', '敲擊分數（0–100）', 0, 100, '沒有測量可以不填') +
        numInput('h-voc', 'vocalScore', '發聲分數（0–100）', 0, 100, '沒有測量可以不填') +
        '<div class="field"><label for="h-med">今天服藥情形</label><textarea id="h-med" name="medication" maxlength="300" placeholder="例如：早午晚都有按時吃"></textarea></div>' +
        '<div class="field"><label for="h-sym">症狀（顫抖、僵硬、跌倒…）</label><textarea id="h-sym" name="symptoms" maxlength="500"></textarea></div>' +
        '<div class="field"><label for="h-note">其他想記下的事</label><textarea id="h-note" name="note" maxlength="1000"></textarea></div>' +
        '<div class="field"><label for="h-dq">想請教醫師的問題</label><textarea id="h-dq" name="doctorQuestion" maxlength="500"></textarea></div>' +
        '<div class="btn-row"><button type="submit" class="btn primary">儲存今天的記錄</button></div></form>' +
        '<div class="btn-row"><a class="btn" href="#/health-summary">給醫師看的摘要</a></div>' +
        '<h2 style="margin-top:1.4rem">最近記錄</h2><div id="hl"><div class="empty">載入中…</div></div>', '健康記錄');

      const form = $('#hf');
      const numOrEmpty = (v) => (v === '' || v === undefined ? '' : Number(v));

      // 選到已有記錄的日期時，帶入該天內容（同一天只會有一筆）
      let logsByDate = {};
      function fillForm(log) {
        form.elements.mood.forEach ? Array.from(form.elements.mood).forEach((r) => { r.checked = String(r.value) === String(log ? log.mood : ''); }) : null;
        Array.from(form.elements.state).forEach((r) => { r.checked = r.value === (log ? (log.state || '') : ''); });
        ['exerciseMin', 'sleepHours', 'tapScore', 'vocalScore', 'medication', 'symptoms', 'note', 'doctorQuestion'].forEach((k) => {
          form.elements[k].value = log && log[k] !== undefined && log[k] !== null ? log[k] : '';
        });
      }
      form.elements.logDate.onchange = () => fillForm(logsByDate[form.elements.logDate.value]);

      form.onsubmit = async (e) => {
        e.preventDefault(); clearInvalid(form);
        const d = formData(form);
        if (!d.logDate) return markInvalid(form, 'logDate', '請選擇日期');
        if (d.logDate > todayLocal()) return markInvalid(form, 'logDate', '日期不能是未來');
        const rng = [['exerciseMin', 0, 600, '運動分鐘'], ['sleepHours', 0, 24, '睡眠時數'], ['tapScore', 0, 100, '敲擊分數'], ['vocalScore', 0, 100, '發聲分數']];
        for (const [k, lo, hi, label] of rng) {
          if (d[k] !== '' && d[k] !== undefined) {
            const n = Number(d[k]);
            if (!isFinite(n) || n < lo || n > hi) return markInvalid(form, k, label + '需介於 ' + lo + ' 到 ' + hi);
          }
        }
        const body = {
          logDate: d.logDate, mood: numOrEmpty(d.mood), state: d.state || '',
          exerciseMin: numOrEmpty(d.exerciseMin), sleepHours: numOrEmpty(d.sleepHours),
          tapScore: numOrEmpty(d.tapScore), vocalScore: numOrEmpty(d.vocalScore),
          medication: d.medication || '', symptoms: d.symptoms || '',
          note: d.note || '', doctorQuestion: d.doctorQuestion || ''
        };
        const btn = $('button[type=submit]', form); btn.disabled = true;
        try {
          const r = await api('health.saveLog', body, { loading: true });
          toast(r && r.updated ? '已更新當天記錄' : '已儲存', 'ok');
          route();
        } catch (err) {} finally { btn.disabled = false; }
      };

      try {
        const r = normList(await api('health.listLogs', { days: 30 }, { retry: true }));
        if (c.stale()) return;
        r.items.forEach((x) => { logsByDate[x.logDate] = x; });
        if (logsByDate[todayLocal()]) fillForm(logsByDate[todayLocal()]);
        const rows = (x) => [
          ['心情', x.mood !== '' && x.mood != null ? (MOOD_OPTS.find((m) => m[0] === Number(x.mood)) || [0, '', x.mood])[1] + ' ' + x.mood + ' 分' : ''],
          ['藥效狀態', STATE_TEXT[x.state] || ''],
          ['運動', x.exerciseMin !== '' && x.exerciseMin != null ? x.exerciseMin + ' 分鐘' : ''],
          ['睡眠', x.sleepHours !== '' && x.sleepHours != null ? x.sleepHours + ' 小時' : ''],
          ['敲擊分數', x.tapScore], ['發聲分數', x.vocalScore],
          ['服藥', x.medication], ['症狀', x.symptoms], ['備註', x.note], ['想問醫師', x.doctorQuestion]
        ].filter((kv) => kv[1] !== '' && kv[1] != null);
        $('#hl').innerHTML = r.items.length ? '<ul class="list">' + r.items.map((x) =>
          '<li class="card"><h3>' + esc(x.logDate || '') + '</h3><dl class="kv">' +
          rows(x).map((kv) => '<dt>' + esc(kv[0]) + '</dt><dd>' + esc(kv[1]) + '</dd>').join('') +
          '</dl>' + (x.aiSummary ? '<div class="banner info" style="margin-top:12px;white-space:pre-wrap">' + esc(x.aiSummary) + '</div>' : '') +
          '<button type="button" class="btn small danger" style="margin-top:12px" data-dl="' + esc(x.id) + '">刪除</button></li>').join('') + '</ul>'
          : '<div class="empty"><span class="ic" aria-hidden="true">📝</span>還沒有記錄</div>';
        $$('[data-dl]').forEach((b) => { b.onclick = async () => {
          if (!(await confirmDanger('刪除記錄', '這筆健康記錄刪除後無法復原。', '刪除'))) return;
          try { await api('health.deleteLog', { id: b.dataset.dl }, { loading: true }); toast('已刪除', 'ok'); route(); } catch (e) {}
        }; });
      } catch (e) { if (!c.stale()) $('#hl').innerHTML = '<div class="banner warn">記錄暫時讀不到。</div>'; }
    }
  });

  /* ==================== 給醫師的摘要 ==================== */
  Routes.add('/health-summary', {
    title: '給醫師的摘要', auth: 'member', nav: 'health',
    async render(p, c) {
      const days = [7, 14, 30].indexOf(Number(p.days)) !== -1 ? Number(p.days) : 14;
      setMain('<a class="btn small" href="#/health">← 回記錄</a><h1 style="margin-top:12px">給醫師看的摘要</h1>' +
        '<div class="banner warn">這是依您的記錄整理的文字，僅供看診時溝通，不是診斷。</div>' +
        '<div class="tabs" role="group" aria-label="統計期間">' +
        [7, 14, 30].map((n) => '<button type="button" class="btn" data-days="' + n + '" aria-pressed="' + (n === days ? 'true' : 'false') + '">最近 ' + n + ' 天</button>').join('') + '</div>' +
        '<div id="sm"><div class="empty">整理中，可能需要幾秒…</div></div>' +
        '<div class="btn-row no-print"><button type="button" class="btn primary" id="sm-print" disabled>列印 / 存成 PDF</button></div>', '看診摘要');
      $$('[data-days]').forEach((b) => { b.onclick = () => go('#/health-summary?days=' + b.dataset.days); });
      const r = await api('health.clinicSummary', { days: days }, { loading: true, retry: true });
      if (c.stale()) return;
      const out = typeof r === 'string' ? r : ((r && (r.html || r.text || r.summary)) || '');
      if (/^\s*</.test(out)) {
        const fr = document.createElement('iframe');
        fr.setAttribute('sandbox', 'allow-same-origin allow-modals');
        fr.title = '看診摘要'; fr.srcdoc = out;
        fr.style.cssText = 'width:100%;height:65vh;border:3px solid var(--line);border-radius:16px;background:#fff';
        $('#sm').innerHTML = ''; $('#sm').appendChild(fr);
        const pb = $('#sm-print'); pb.disabled = false;
        pb.onclick = () => { try { fr.contentWindow.focus(); fr.contentWindow.print(); } catch (e) { toast('此瀏覽器無法列印，請截圖保存', 'info'); } };
      } else {
        $('#sm').innerHTML = '<div class="card" style="white-space:pre-wrap">' + esc(out || '目前沒有足夠的記錄可以整理') + '</div>';
      }
    }
  });

  /* ==================================================================
   * 啟動（必須放在所有 Routes.add 之後）
   * ================================================================== */
  window.addEventListener('hashchange', route);
  window.addEventListener('pageshow', (e) => { if (e.persisted) route(); });
  window.addEventListener('unhandledrejection', (e) => { if (!(e.reason instanceof ApiError)) console.error(e.reason); });

  async function boot() {
    initAccessibility();
    const cached = store.get(CONFIG.SESSION_USER_KEY);
    if (cached && State.token) { try { State.user = JSON.parse(cached); } catch (e) {} }
    if (State.token) {
      try {
        const r = await api(API_CONTRACT.me, {}, { silent: true, retry: true });
        State.user = r.user || r;
      } catch (e) {
        // 登入過期時 api() 已清除；只是網路問題則保留快取的登入資料
        if (!State.token) State.user = null;
      }
    }
    if (!location.hash) location.hash = State.user ? '#/home' : '#/login';
    route();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
  </script>
  </body>
  </html>
