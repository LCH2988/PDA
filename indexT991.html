<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>台灣帕金森病友權益促進會 - 系統</title>
  <style>
    :root {
      --color-primary: #155e75;
      --color-primary-hover: #0e7490;
      --color-bg: #f8fafc;
      --color-surface: #ffffff;
      --color-text: #0f172a;
      --color-text-muted: #334155;
      --color-border: #94a3b8;
      --color-success: #166534;
      --color-danger: #991b1b;
      --font-base: 18px; /* 高齡與視力退化友善主要文字 */
      --font-heading: 24px;
      --btn-min-height: 52px; /* 帕金森震顫防誤觸大按鈕 >= 48px */
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
      font-size: var(--font-base);
      line-height: 1.6;
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      padding-bottom: 40px;
    }
    header {
      background: var(--color-primary);
      color: #fff;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header h1 { font-size: var(--font-heading); }
    .container { max-width: 960px; margin: 20px auto; padding: 0 16px; }
    .card {
      background: var(--color-surface);
      border: 2px solid var(--color-border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .card h2 { font-size: 22px; margin-bottom: 16px; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }
    .btn {
      min-height: var(--btn-min-height);
      padding: 10px 20px;
      font-size: var(--font-base);
      font-weight: 700;
      border-radius: 8px;
      border: 2px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      touch-action: manipulation;
    }
    .btn:focus-visible { outline: 3px solid #f59e0b; outline-offset: 2px; }
    .btn-primary { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
    .btn-primary:hover { background: var(--color-primary-hover); }
    .btn-secondary { background: #f1f5f9; color: #1e293b; border-color: #64748b; }
    .btn-danger { background: var(--color-danger); color: #fff; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-weight: 700; margin-bottom: 6px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      min-height: 48px;
      padding: 8px 12px;
      font-size: var(--font-base);
      border: 2px solid var(--color-border);
      border-radius: 6px;
      background: #fff;
    }
    .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .table-responsive { width: 100%; overflow-x: auto; margin-top: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: var(--font-base); }
    th, td { border: 1px solid var(--color-border); padding: 10px 12px; text-align: left; }
    th { background: #e2e8f0; font-weight: 700; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 4px; font-weight: 700; font-size: 15px; }
    .badge-success { background: #dcfce7; color: var(--color-success); }
    .badge-danger { background: #fee2e2; color: var(--color-danger); }
    .alert { padding: 14px 18px; border-radius: 8px; margin-bottom: 16px; font-weight: 600; }
    .alert-info { background: #e0f2fe; color: #0369a1; border: 1px solid #7dd3fc; }
    .alert-danger { background: #fef2f2; color: var(--color-danger); border: 1px solid #fecaca; }
  </style>
</head>
<body>
  <header>
    <h1>TPDA 協會管理</h1>
    <div id="user-info">連線中...</div>
  </header>

  <main class="container">
    <!-- 導覽標籤 -->
    <nav class="nav-tabs" aria-label="系統主分頁">
      <button class="btn btn-primary" onclick="showTab('tab-receipt')">收據開立與管理</button>
      <button class="btn btn-secondary" onclick="showTab('tab-claim')">支出憑證黏貼單</button>
      <button class="btn btn-secondary" onclick="showTab('tab-public')">大眾公開徵信</button>
    </nav>

    <!-- 訊息提示 -->
    <div id="alert-box" class="alert alert-info" role="status">請確認您的操作。系統文字均採高對比大字體。</div>

    <!-- 1. 收據管理分頁 -->
    <section id="tab-receipt" class="card">
      <h2>開立電子收據 (法規分流)</h2>
      <form id="form-receipt" onsubmit="handleCreateReceipt(event)">
        <div class="form-group">
          <label for="rec-type">收據類別 (依規定分流，不可混淆)：</label>
          <select id="rec-type" required onchange="handleReceiptTypeChange()">
            <option value="捐款收據">捐款收據 (符合所得稅法第17條列舉扣除)</option>
            <option value="會費收據">會費收據 (入會費/常年會費，不可扣抵所得稅)</option>
            <option value="一般收入">一般收入收據 (活動工本費/雜項收入)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="rec-payer">繳款/捐贈人全名：</label>
          <input type="text" id="rec-payer" required placeholder="例：王小明 或 某某股份有限公司">
        </div>
        <div class="form-group">
          <label for="rec-taxid">身分證字號 / 統一編號 (報稅扣除用)：</label>
          <input type="text" id="rec-taxid" placeholder="選填，開立捐款收據建議填寫">
        </div>
        <div class="form-group">
          <label for="rec-amount">實收金額 (新臺幣整數)：</label>
          <input type="number" id="rec-amount" min="1" step="1" required placeholder="例：1000">
        </div>
        <div class="form-group">
          <label for="rec-purpose">款項用途 / 專案說明：</label>
          <input type="text" id="rec-purpose" required placeholder="例：115年度病友物理治療專案捐款">
        </div>
        <div class="form-group" id="div-tax-upload">
          <label>
            <input type="checkbox" id="rec-tax-upload" checked style="width:24px; min-height:24px;">
            同意授權本會將捐贈資料上傳國稅局 (次年申報綜所稅可免附收據證明聯)
          </label>
        </div>
        <button type="submit" class="btn btn-primary" id="btn-submit-receipt">確認開立收據</button>
      </form>
    </section>

    <!-- 2. 支出憑證黏貼單分頁 -->
    <section id="tab-claim" class="card" style="display:none;">
      <h2>支出憑證黏貼單 (核銷與列印)</h2>
      <form id="form-claim" onsubmit="handleCreateClaim(event)">
        <div class="form-group">
          <label for="claim-purpose">支出用途整體摘要：</label>
          <input type="text" id="claim-purpose" required placeholder="例：召開第10屆第2次理監事聯席會議之餐點與場地費">
        </div>
        <div class="form-group">
          <label for="claim-inspector">驗收或證明人姓名：</label>
          <input type="text" id="claim-inspector" required placeholder="例：李四 (理事)">
        </div>

        <div class="card" style="border-style:dashed; margin-top:10px;">
          <h3>原始發票 / 單據明細</h3>
          <div class="form-group">
            <label for="item-amount">單據金額 (NT$)：</label>
            <input type="number" id="item-amount" min="1" step="1" placeholder="例：1500">
          </div>
          <div class="form-group">
            <label for="item-invoiceno">發票號碼 / 收據號：</label>
            <input type="text" id="item-invoiceno" placeholder="例：AB-12345678">
          </div>
          <div class="form-group">
            <label for="item-merchant">店家/開立對象：</label>
            <input type="text" id="item-merchant" placeholder="例：大同會議文具有限公司">
          </div>
          <div class="form-group">
            <label for="item-file">上傳發票/收據照片 (私密存儲)：</label>
            <input type="file" id="item-file" accept="image/*,application/pdf">
          </div>
        </div>

        <button type="submit" class="btn btn-primary">送出並產製支出憑證黏貼單 PDF</button>
      </form>
    </section>

    <!-- 3. 大眾公開徵信分頁 (去識別化) -->
    <section id="tab-public" class="card" style="display:none;">
      <h2>大眾公開徵信名冊 (依法遮蔽個資)</h2>
      <p style="margin-bottom:12px;">符合《個資法》與《公益勸募條例》，保障病友隱私：</p>
      <div class="table-responsive">
        <table id="table-public-donations">
          <thead>
            <tr>
              <th>捐款日期</th>
              <th>捐款人姓名</th>
              <th>捐款金額</th>
              <th>指定用途</th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="4" style="text-align:center;">載入中...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    // 嚴格保留前端設定規格
    const CONFIG = {
      LIFF_ID: "2009456572-588gzru4",
      GAS_API_URL: "https://script.google.com/macros/s/AKfycbylNCuCQheL6QqU61ZksxjEX6UMiFWzjgg7h1IeBYaXw6mh9AnTO4p6A2w1JSE6_pY/exec"
    };

    let sessionToken = '';

    window.addEventListener('load', async () => {
      // 模擬或連線初始化
      document.getElementById('user-info').innerText = '身分：系統管理員 (王大明)';
      loadPublicDonations();
    });

    function showTab(tabId) {
      ['tab-receipt', 'tab-claim', 'tab-public'].forEach(id => {
        document.getElementById(id).style.display = (id === tabId ? 'block' : 'none');
      });
      document.querySelectorAll('.nav-tabs .btn').forEach(btn => {
        btn.className = 'btn btn-secondary';
      });
      event.target.className = 'btn btn-primary';
    }

    function handleReceiptTypeChange() {
      const type = document.getElementById('rec-type').value;
      const taxBox = document.getElementById('div-tax-upload');
      if (type === '會費收據') {
        taxBox.style.display = 'none';
        document.getElementById('rec-tax-upload').checked = false;
      } else {
        taxBox.style.display = 'block';
      }
    }

    async function callApi(action, payload) {
      // 支援雙軌連線：優先使用 google.script.run，次選 fetch POST (text/plain)
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        return new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler(res => res.success ? resolve(res) : reject(res))
            .withFailureHandler(err => reject(err))
            .apiRequest(action, payload, sessionToken);
        });
      } else {
        const response = await fetch(CONFIG.GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: action, payload: payload, sessionToken: sessionToken })
        });
        const json = await response.json();
        if (!json.success) throw json;
        return json;
      }
    }

    async function handleCreateReceipt(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-submit-receipt');
      btn.disabled = true;
      btn.innerText = '開立中...';

      const payload = {
        receiptType: document.getElementById('rec-type').value,
        payerName: document.getElementById('rec-payer').value,
        payerTaxId: document.getElementById('rec-taxid').value,
        amount: Number(document.getElementById('rec-amount').value),
        purpose: document.getElementById('rec-purpose').value,
        uploadToTaxBureau: document.getElementById('rec-tax-upload').checked
      };

      try {
        const res = await callApi('receipt.create', payload);
        alert(`收據開立成功！單號：${res.data.ReceiptNo}`);

        // 自動觸發產製 PDF
        const pdfRes = await callApi('receipt.renderPdf', { receiptId: res.data.ReceiptId });
        window.open(pdfRes.data.pdfUrl, '_blank');
        document.getElementById('form-receipt').reset();
      } catch (err) {
        alert(`錯誤：${err.message || '開立失敗'}`);
      } finally {
        btn.disabled = false;
        btn.innerText = '確認開立收據';
      }
    }

    async function handleCreateClaim(e) {
      e.preventDefault();
      const amt = Number(document.getElementById('item-amount').value);
      if (!amt || amt <= 0) {
        alert('請填寫有效的支出明細金額');
        return;
      }

      const payload = {
        purpose: document.getElementById('claim-purpose').value,
        inspectorName: document.getElementById('claim-inspector').value,
        items: [{
          expenseDate: new Date().toISOString().slice(0, 10),
          amount: amt,
          invoiceNo: document.getElementById('item-invoiceno').value,
          merchantName: document.getElementById('item-merchant').value,
          summary: document.getElementById('claim-purpose').value
        }]
      };

      try {
        const res = await callApi('claim.create', payload);
        alert(`支出憑證黏貼單已建立！單號：${res.data.ClaimNo}。正在產製 PDF...`);
        const pdfRes = await callApi('claim.renderPdf', { claimId: res.data.ClaimId });
        window.open(pdfRes.data.pdfUrl, '_blank');
        document.getElementById('form-claim').reset();
      } catch (err) {
        alert(`錯誤：${err.message || '建立失敗'}`);
      }
    }

    async function loadPublicDonations() {
      try {
        const res = await callApi('public.donationList', {});
        const tbody = document.querySelector('#table-public-donations tbody');
        if (res.data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">目前無公開捐款紀錄</td></tr>';
          return;
        }
        tbody.innerHTML = res.data.map(d => `
          <tr>
            <td>${d.date}</td>
            <td><strong>${d.nameMasked}</strong></td>
            <td>NT$ ${Number(d.amount).toLocaleString('zh-TW')}</td>
            <td>${d.purpose}</td>
          </tr>
        `).join('');
      } catch (err) {
        console.error('載入徵信失敗', err);
      }
    }
  </script>
</body>
</html>
