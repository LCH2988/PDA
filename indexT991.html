<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#176b67">
  <meta
    name="description"
    content="帕友同行活動資訊與報名平台"
  >
  <title>帕友同行｜活動資訊與報名</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root {
      --primary: #176b67;
      --primary-dark: #0b4d49;
      --primary-light: #e3f3f1;
      --accent: #ffb000;
      --background: #f5f7f4;
      --surface: #ffffff;
      --text: #202725;
      --muted: #5c6966;
      --border: #ccd9d6;
      --success: #236f3e;
      --success-bg: #e7f5eb;
      --warning: #7c5600;
      --warning-bg: #fff4d6;
      --danger: #a92720;
      --danger-bg: #fdebea;
      --info: #155a87;
      --info-bg: #e8f3fa;
      --shadow: 0 12px 32px rgba(13, 70, 65, 0.12);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      font-size: 17px;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: var(--background);
      font-family:
        "Noto Sans TC",
        "Microsoft JhengHei",
        system-ui,
        -apple-system,
        sans-serif;
      line-height: 1.65;
    }

    body.modal-open {
      overflow: hidden;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    :focus-visible {
      outline: 4px solid var(--accent);
      outline-offset: 3px;
    }

    .skip-link {
      position: fixed;
      top: 8px;
      left: 8px;
      z-index: 1000;
      padding: 10px 16px;
      color: #fff;
      background: #000;
      border-radius: 8px;
      transform: translateY(-150%);
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 30;
      color: #fff;
      background:
        linear-gradient(
          135deg,
          var(--primary-dark),
          var(--primary)
        );
      box-shadow: 0 3px 14px rgba(0, 0, 0, 0.18);
    }

    .header-inner {
      width: min(1180px, calc(100% - 24px));
      min-height: 72px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: #fff;
      text-decoration: none;
      font-size: 1.2rem;
      font-weight: 900;
      white-space: nowrap;
    }

    .main-nav {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }

    .nav-button {
      min-height: 46px;
      padding: 8px 13px;
      color: #fff;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 10px;
      font-weight: 800;
    }

    .nav-button:hover,
    .nav-button[aria-current="page"] {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.32);
    }

    .member-area {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .member-name {
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 800;
    }

    .menu-button {
      display: none;
      min-width: 48px;
      min-height: 48px;
      color: #fff;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 10px;
      font-size: 1.35rem;
    }

    main {
      width: min(1180px, calc(100% - 24px));
      min-height: 75vh;
      margin: auto;
      padding: 28px 0 72px;
    }

    .hero {
      padding: clamp(26px, 5vw, 62px);
      color: #fff;
      background:
        radial-gradient(
          circle at top right,
          rgba(255, 255, 255, 0.23),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          var(--primary-dark),
          #25857d
        );
      border-radius: 24px;
      box-shadow: var(--shadow);
    }

    .hero h1 {
      max-width: 750px;
      margin: 0 0 12px;
      font-size: clamp(2rem, 6vw, 3.7rem);
      line-height: 1.2;
    }

    .hero p {
      max-width: 760px;
      margin: 0;
      font-size: 1.12rem;
    }

    .hero-actions,
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }

    .section-heading {
      margin: 34px 0 16px;
    }

    .section-heading h1,
    .section-heading h2 {
      margin: 0 0 6px;
      line-height: 1.3;
    }

    .section-heading p {
      margin: 0;
      color: var(--muted);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .panel {
      padding: clamp(18px, 4vw, 28px);
    }

    .feature-grid,
    .activity-grid {
      display: grid;
      grid-template-columns:
        repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .feature-card {
      padding: 24px;
    }

    .feature-card h3 {
      margin: 7px 0;
    }

    .feature-icon {
      font-size: 2rem;
    }

    .filter-panel {
      margin-bottom: 20px;
      padding: 20px;
    }

    .filter-grid {
      display: grid;
      grid-template-columns:
        minmax(200px, 2fr)
        repeat(3, minmax(130px, 1fr));
      gap: 12px;
      align-items: end;
    }

    .field {
      min-width: 0;
      margin-bottom: 14px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    .field label,
    .field legend {
      display: block;
      margin-bottom: 6px;
      font-weight: 900;
    }

    .required {
      color: var(--danger);
    }

    .input,
    .select,
    .textarea {
      width: 100%;
      min-height: 50px;
      padding: 10px 12px;
      color: var(--text);
      background: #fff;
      border: 2px solid var(--border);
      border-radius: 10px;
    }

    .textarea {
      min-height: 110px;
      resize: vertical;
    }

    .input:focus,
    .select:focus,
    .textarea:focus {
      border-color: var(--primary);
    }

    .checkbox-row {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      min-height: 48px;
      padding: 10px 0;
    }

    .checkbox-row input {
      width: 24px;
      height: 24px;
      flex: 0 0 auto;
      margin-top: 2px;
    }

    .help {
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .button {
      min-height: 48px;
      padding: 10px 18px;
      border: 0;
      border-radius: 10px;
      font-weight: 900;
      text-decoration: none;
      text-align: center;
    }

    .button-primary {
      color: #fff;
      background: var(--primary);
    }

    .button-primary:hover {
      background: var(--primary-dark);
    }

    .button-secondary {
      color: var(--primary-dark);
      background: #fff;
      border: 2px solid var(--primary);
    }

    .button-danger {
      color: #fff;
      background: var(--danger);
    }

    .button-light {
      color: var(--primary-dark);
      background: #fff;
    }

    .button-block {
      width: 100%;
    }

    .activity-card {
      display: flex;
      min-width: 0;
      flex-direction: column;
      overflow: hidden;
    }

    .activity-card-body {
      display: flex;
      flex: 1;
      flex-direction: column;
      padding: 21px;
    }

    .activity-card h3 {
      margin: 8px 0;
      line-height: 1.35;
    }

    .activity-card p {
      margin: 4px 0;
    }

    .activity-card .actions {
      margin-top: auto;
      padding-top: 14px;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 3px 9px;
      border-radius: 999px;
      color: var(--primary-dark);
      background: var(--primary-light);
      font-size: 0.86rem;
      font-weight: 900;
    }

    .badge-success {
      color: var(--success);
      background: var(--success-bg);
    }

    .badge-warning {
      color: var(--warning);
      background: var(--warning-bg);
    }

    .badge-danger {
      color: var(--danger);
      background: var(--danger-bg);
    }

    .badge-info {
      color: var(--info);
      background: var(--info-bg);
    }

    .meta-list {
      margin: 12px 0;
      padding: 0;
      list-style: none;
    }

    .meta-list li {
      margin: 6px 0;
    }

    .status-box {
      margin: 16px 0;
      padding: 14px 16px;
      border-left: 6px solid var(--primary);
      border-radius: 9px;
      background: var(--primary-light);
    }

    .status-box.success {
      border-color: var(--success);
      background: var(--success-bg);
    }

    .status-box.warning {
      border-color: var(--warning);
      background: var(--warning-bg);
    }

    .status-box.danger {
      border-color: var(--danger);
      background: var(--danger-bg);
    }

    .empty-state,
    .loading-state {
      padding: 46px 22px;
      text-align: center;
    }

    .loading-state {
      color: var(--muted);
    }

    .spinner {
      display: inline-block;
      width: 35px;
      height: 35px;
      margin-bottom: 10px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1.4fr 0.8fr;
      gap: 20px;
      align-items: start;
    }

    .detail-section {
      padding-top: 18px;
      margin-top: 18px;
      border-top: 1px solid var(--border);
    }

    .detail-section:first-child {
      padding-top: 0;
      margin-top: 0;
      border-top: 0;
    }

    .detail-section h3 {
      margin: 0 0 9px;
    }

    .definition-grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .definition-item {
      padding: 12px;
      background: #f7faf8;
      border-radius: 10px;
    }

    .definition-item strong {
      display: block;
      margin-bottom: 3px;
    }

    .mine-list {
      display: grid;
      gap: 15px;
    }

    .mine-card {
      padding: 21px;
    }

    .mine-card h3 {
      margin: 7px 0;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      place-items: center;
      padding: 16px;
      background: rgba(0, 0, 0, 0.58);
    }

    .modal-overlay.open {
      display: grid;
    }

    .modal {
      width: min(680px, 100%);
      max-height: calc(100vh - 32px);
      overflow: auto;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.35);
    }

    .modal-header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 17px 20px;
      background: #fff;
      border-bottom: 1px solid var(--border);
    }

    .modal-header h2 {
      margin: 0;
      line-height: 1.35;
    }

    .modal-close {
      width: 48px;
      height: 48px;
      margin-left: auto;
      color: var(--text);
      background: #f1f4f3;
      border: 0;
      border-radius: 50%;
      font-size: 1.4rem;
    }

    .modal-body {
      padding: 22px;
    }

    .toast {
      position: fixed;
      top: 86px;
      right: 15px;
      z-index: 200;
      display: none;
      width: min(420px, calc(100% - 30px));
      padding: 14px 17px;
      color: #fff;
      background: var(--primary-dark);
      border-radius: 11px;
      box-shadow: var(--shadow);
      font-weight: 800;
    }

    .toast.open {
      display: block;
    }

    .toast.error {
      background: var(--danger);
    }

    .site-footer {
      padding: 28px 16px;
      color: #fff;
      background: var(--primary-dark);
      text-align: center;
    }

    .site-footer p {
      margin: 4px 0;
    }

    .visually-hidden {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 900px) {
      .feature-grid,
      .activity-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .filter-grid,
      .detail-grid {
        grid-template-columns: 1fr;
      }

      .main-nav {
        position: absolute;
        top: 72px;
        right: 12px;
        left: 12px;
        display: none;
        align-items: stretch;
        flex-direction: column;
        padding: 12px;
        background: var(--primary-dark);
        border-radius: 0 0 14px 14px;
        box-shadow: var(--shadow);
      }

      .main-nav.open {
        display: flex;
      }

      .nav-button {
        width: 100%;
        text-align: left;
      }

      .menu-button {
        display: inline-block;
        margin-left: auto;
      }

      .member-area {
        display: none;
      }
    }

    @media (max-width: 640px) {
      html {
        font-size: 17px;
      }

      main {
        width: min(100% - 18px, 1180px);
        padding-top: 18px;
      }

      .header-inner {
        width: min(100% - 18px, 1180px);
      }

      .feature-grid,
      .activity-grid,
      .definition-grid {
        grid-template-columns: 1fr;
      }

      .hero {
        border-radius: 17px;
      }

      .hero-actions,
      .actions {
        flex-direction: column;
      }

      .actions .button,
      .hero-actions .button {
        width: 100%;
      }

      .modal-overlay {
        padding: 0;
        align-items: end;
      }

      .modal {
        width: 100%;
        max-height: 94vh;
        border-radius: 18px 18px 0 0;
      }

      .toast {
        top: 78px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <a class="skip-link" href="#main-content">
    跳到主要內容
  </a>

  <header class="site-header">
    <div class="header-inner">
      <a
        class="brand"
        href="#home"
        data-view-link="home"
        aria-label="帕友同行首頁"
      >
        <span aria-hidden="true">🤝</span>
        <span>帕友同行</span>
      </a>

      <button
        id="menu-button"
        class="menu-button"
        type="button"
        aria-expanded="false"
        aria-controls="main-nav"
        aria-label="開啟導覽選單"
      >
        ☰
      </button>

      <nav
        id="main-nav"
        class="main-nav"
        aria-label="主要導覽"
      >
        <button
          class="nav-button"
          type="button"
          data-view="home"
        >
          首頁
        </button>

        <button
          class="nav-button"
          type="button"
          data-view="events"
        >
          找活動
        </button>

        <button
          class="nav-button"
          type="button"
          data-view="mine"
        >
          我的活動
        </button>

        <a
          id="admin-link"
          class="nav-button"
          href="#"
          hidden
        >
          活動管理
        </a>

        <button
          id="nav-login-button"
          class="nav-button"
          type="button"
        >
          LINE 登入
        </button>

        <button
          id="nav-logout-button"
          class="nav-button"
          type="button"
          hidden
        >
          登出
        </button>
      </nav>

      <div class="member-area" aria-live="polite">
        <span id="member-name" class="member-name">
          尚未登入
        </span>
      </div>
    </div>
  </header>

  <main id="main-content" tabindex="-1">
    <div class="loading-state card">
      <span class="spinner" aria-hidden="true"></span>
      <p>正在載入帕友同行……</p>
    </div>
  </main>

  <footer class="site-footer">
    <p><strong>帕友同行</strong></p>
    <p>讓每一次參與，都更安心、更友善。</p>
  </footer>

  <div
    id="modal-overlay"
    class="modal-overlay"
    role="presentation"
    aria-hidden="true"
  >
    <section
      id="modal"
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
    >
      <header class="modal-header">
        <h2 id="modal-title">視窗</h2>

        <button
          id="modal-close"
          class="modal-close"
          type="button"
          aria-label="關閉視窗"
        >
          ×
        </button>
      </header>

      <div id="modal-body" class="modal-body"></div>
    </section>
  </div>

  <div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
    aria-atomic="true"
  ></div>

  <script>
    "use strict";

    const CONFIG = Object.freeze({
      LIFF_ID: "2009456572-ZBfM2edk",
      GAS_API_URL:
        "https://script.google.com/macros/s/AKfycbz2ALbOlXTNZfB1eqK4jzHN5tAX3I9dcHmGl5xfIY8EQAmGEEDV_V3w7-nhCL4cSCON2Q/exec",
      ADMIN_URL: "./admin.html",
      TIME_ZONE: "Asia/Taipei",
      APP_NAME: "帕友同行",
      REQUEST_TIMEOUT_MS: 30000
    });

    const STORAGE_KEYS = Object.freeze({
      SESSION_TOKEN: "paryo.sessionToken",
      SESSION_EXPIRES_AT: "paryo.sessionExpiresAt",
      IDEMPOTENCY_PREFIX: "paryo.registrationKey."
    });

    const STATE = {
      initialized: false,
      liffReady: false,
      currentView: "home",
      user: null,
      events: [],
      selectedDetail: null,
      myRegistrations: [],
      loading: false,
      modalReturnFocus: null
    };

    const REGISTRATION_LABELS = Object.freeze({
      confirmed: "正式報名",
      waitlist: "候補",
      cancelled: "已取消"
    });

    const ACCESSIBILITY_LABELS = Object.freeze({
      yes: "有／可以",
      no: "沒有／不可以",
      unknown: "尚未確認"
    });

    const REGISTRATION_STATE_LABELS = Object.freeze({
      open: "開放報名",
      waitlist_only: "僅剩候補",
      full: "正式與候補皆額滿",
      not_started: "報名尚未開始",
      closed: "報名已截止或關閉",
      ended: "活動已結束",
      cancelled: "場次已取消"
    });

    const mainElement =
      document.getElementById("main-content");

    const modalOverlay =
      document.getElementById("modal-overlay");

    const modalElement =
      document.getElementById("modal");

    const modalTitle =
      document.getElementById("modal-title");

    const modalBody =
      document.getElementById("modal-body");

    const toastElement =
      document.getElementById("toast");

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function createRequestId() {
      if (
        window.crypto &&
        typeof window.crypto.randomUUID === "function"
      ) {
        return "REQ-" + window.crypto.randomUUID();
      }

      return (
        "REQ-" +
        Date.now().toString(36) +
        "-" +
        Math.random().toString(36).slice(2)
      );
    }

    function createIdempotencyKey() {
      if (
        window.crypto &&
        typeof window.crypto.randomUUID === "function"
      ) {
        return (
          "REG-" +
          window.crypto.randomUUID()
        );
      }

      return (
        "REG-" +
        Date.now().toString(36) +
        "-" +
        Math.random().toString(36).slice(2) +
        "-" +
        Math.random().toString(36).slice(2)
      );
    }

    function getSessionToken() {
      const token =
        sessionStorage.getItem(
          STORAGE_KEYS.SESSION_TOKEN
        );

      const expiresAt =
        sessionStorage.getItem(
          STORAGE_KEYS.SESSION_EXPIRES_AT
        );

      if (
        !token ||
        !expiresAt ||
        !Number.isFinite(Date.parse(expiresAt)) ||
        Date.parse(expiresAt) <= Date.now()
      ) {
        clearLocalSession();
        return "";
      }

      return token;
    }

    function saveLocalSession(data) {
      sessionStorage.setItem(
        STORAGE_KEYS.SESSION_TOKEN,
        data.sessionToken
      );

      sessionStorage.setItem(
        STORAGE_KEYS.SESSION_EXPIRES_AT,
        data.expiresAt
      );
    }

    function clearLocalSession() {
      sessionStorage.removeItem(
        STORAGE_KEYS.SESSION_TOKEN
      );

      sessionStorage.removeItem(
        STORAGE_KEYS.SESSION_EXPIRES_AT
      );

      STATE.user = null;
    }

    function assertConfiguration() {
      if (
        !CONFIG.LIFF_ID ||
        CONFIG.LIFF_ID.includes("請替換")
      ) {
        throw new Error(
          "請先在 index.html 設定 LIFF_ID。"
        );
      }

      if (
        !CONFIG.GAS_API_URL ||
        CONFIG.GAS_API_URL.includes("請替換")
      ) {
        throw new Error(
          "請先在 index.html 設定 GAS_API_URL。"
        );
      }
    }

    async function api(
      action,
      payload = {},
      options = {}
    ) {
      const requiresAuth =
        options.requiresAuth !== false;

      const sessionToken =
        requiresAuth ? getSessionToken() : "";

      if (requiresAuth && !sessionToken) {
        const error = new Error(
          "請先登入後再繼續。"
        );

        error.code = "AUTH_REQUIRED";
        throw error;
      }

      const controller =
        new AbortController();

      const timeoutId = window.setTimeout(
        function () {
          controller.abort();
        },
        CONFIG.REQUEST_TIMEOUT_MS
      );

      try {
        const response = await fetch(
          CONFIG.GAS_API_URL,
          {
            method: "POST",
            redirect: "follow",
            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },
            body: JSON.stringify({
              action: action,
              payload: payload,
              requestId: createRequestId(),
              sessionToken: sessionToken
            }),
            signal: controller.signal
          }
        );

        const responseText =
          await response.text();

        let result;

        try {
          result = JSON.parse(responseText);
        } catch (error) {
          throw new Error(
            "後端回應格式不正確，請確認 GAS_API_URL 與部署權限。"
          );
        }

        if (!result.ok) {
          const error = new Error(
            result.error?.message ||
            "系統暫時無法處理要求。"
          );

          error.code =
            result.error?.code ||
            "INTERNAL_ERROR";

          error.requestId =
            result.requestId || "";

          if (
            error.code === "SESSION_EXPIRED" ||
            error.code === "AUTH_REQUIRED"
          ) {
            clearLocalSession();
            updateHeader();
          }

          throw error;
        }

        return result.data;
      } catch (error) {
        if (error.name === "AbortError") {
          throw new Error(
            "連線逾時，請確認網路後再試一次。"
          );
        }

        throw error;
      } finally {
        window.clearTimeout(timeoutId);
      }
    }

    async function initializeLiff() {
      assertConfiguration();

      await liff.init({
        liffId: CONFIG.LIFF_ID
      });

      STATE.liffReady = true;
    }

    async function restorePlatformSession() {
      if (!getSessionToken()) {
        return false;
      }

      try {
        STATE.user = await api(
          "users.me",
          {}
        );

        return true;
      } catch (error) {
        clearLocalSession();
        return false;
      }
    }

    async function login() {
      try {
        showToast("正在準備 LINE 登入……");

        if (!STATE.liffReady) {
          await initializeLiff();
        }

        if (!liff.isLoggedIn()) {
          liff.login({
            redirectUri:
              window.location.href.split("#")[0]
          });

          return;
        }

        const idToken = liff.getIDToken();

        if (!idToken) {
          throw new Error(
            "無法取得 LINE 登入憑證，請重新登入。"
          );
        }

        const data = await api(
          "auth.login",
          {
            idToken: idToken
          },
          {
            requiresAuth: false
          }
        );

        saveLocalSession(data);
        STATE.user = data.user;

        updateHeader();

        showToast(
          "登入成功，歡迎 " +
          STATE.user.displayName +
          "。"
        );

        if (STATE.currentView === "mine") {
          await renderMyActivities();
        } else {
          renderCurrentView();
        }
      } catch (error) {
        showToast(
          error.message ||
          "登入失敗。",
          true
        );
      }
    }

    async function logout() {
      const button =
        document.getElementById(
          "nav-logout-button"
        );

      if (button) {
        button.disabled = true;
      }

      try {
        if (getSessionToken()) {
          await api("auth.logout", {});
        }
      } catch (error) {
        console.warn(
          "Backend logout failed:",
          error
        );
      } finally {
        clearLocalSession();

        if (
          STATE.liffReady &&
          liff.isLoggedIn()
        ) {
          liff.logout();
        }

        updateHeader();
        showToast("您已登出。");
        navigateTo("home");
      }
    }

    function updateHeader() {
      const memberName =
        document.getElementById(
          "member-name"
        );

      const loginButton =
        document.getElementById(
          "nav-login-button"
        );

      const logoutButton =
        document.getElementById(
          "nav-logout-button"
        );

      const adminLink =
        document.getElementById(
          "admin-link"
        );

      if (STATE.user) {
        memberName.textContent =
          STATE.user.displayName;

        loginButton.hidden = true;
        logoutButton.hidden = false;

        adminLink.hidden =
          !["admin", "superadmin"].includes(
            STATE.user.role
          );

        adminLink.href = CONFIG.ADMIN_URL;
      } else {
        memberName.textContent =
          "尚未登入";

        loginButton.hidden = false;
        logoutButton.hidden = true;
        adminLink.hidden = true;
      }
    }

    function navigateTo(view) {
      const allowedViews = [
        "home",
        "events",
        "mine"
      ];

      STATE.currentView =
        allowedViews.includes(view)
          ? view
          : "home";

      window.history.replaceState(
        null,
        "",
        "#" + STATE.currentView
      );

      closeMobileMenu();
      updateCurrentNav();
      renderCurrentView();

      mainElement.focus({
        preventScroll: true
      });

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    function updateCurrentNav() {
      document
        .querySelectorAll("[data-view]")
        .forEach(function (button) {
          if (
            button.dataset.view ===
            STATE.currentView
          ) {
            button.setAttribute(
              "aria-current",
              "page"
            );
          } else {
            button.removeAttribute(
              "aria-current"
            );
          }
        });
    }

                name="seatRequired"
              >
              <span>
                我需要座位休息
              </span>
            </label>

            <label class="checkbox-row">
              <input
                type="checkbox"
                name="wheelchair"
              >
              <span>
                我會使用輪椅
              </span>
            </label>

            <label class="checkbox-row">
              <input
                type="checkbox"
                name="volunteerGuide"
              >
              <span>
                我需要志工引導
              </span>
            </label>
          </div>

          <div class="field">
            <label for="registration-note">
              備註
            </label>

            <textarea
              id="registration-note"
              class="textarea"
              name="note"
              maxlength="300"
              placeholder="最多 300 字，請勿填寫不必要的敏感醫療資訊"
            ></textarea>
          </div>

          <label class="checkbox-row">
            <input
              type="checkbox"
              name="agreement"
              required
            >
            <span>
              我已閱讀活動時間、地點、體力需求、
              無障礙資訊及取消規則。
              <span class="required">*</span>
            </span>
          </label>

          <div class="actions">
            <button
              id="registration-submit"
              class="button button-primary"
              type="submit"
            >
              確認送出
            </button>

            <button
              class="button button-secondary"
              type="button"
              data-action="back-to-detail"
            >
              返回活動詳情
            </button>
          </div>
        </form>
      `;

      document
        .getElementById("participant-name")
        ?.focus();
    }

    async function submitRegistration(form) {
      const detail = STATE.selectedDetail;

      if (!detail || !STATE.user) {
        showToast(
          "報名資料已失效，請重新操作。",
          true
        );
        return;
      }

      const submitButton =
        document.getElementById(
          "registration-submit"
        );

      const formData =
        new FormData(form);

      const storageKey =
        STORAGE_KEYS.IDEMPOTENCY_PREFIX +
        detail.session.sessionId;

      let idempotencyKey =
        sessionStorage.getItem(storageKey);

      if (!idempotencyKey) {
        idempotencyKey =
          createIdempotencyKey();

        sessionStorage.setItem(
          storageKey,
          idempotencyKey
        );
      }

      const payload = {
        eventId: detail.event.eventId,
        sessionId:
          detail.session.sessionId,
        participantName:
          formData.get("participantName"),
        companionCount:
          Number(
            formData.get("companionCount") || 0
          ),
        seatRequired:
          formData.get("seatRequired") === "on",
        wheelchair:
          formData.get("wheelchair") === "on",
        volunteerGuide:
          formData.get("volunteerGuide") === "on",
        note:
          formData.get("note") || "",
        idempotencyKey:
          idempotencyKey
      };

      submitButton.disabled = true;
      submitButton.textContent =
        "正在送出……";

      try {
        const result = await api(
          "registrations.create",
          payload
        );

        sessionStorage.removeItem(
          storageKey
        );

        closeModal();

        showToast(result.message);

        await refreshPublicEvents();

        if (
          STATE.currentView === "mine"
        ) {
          await renderMyActivities();
        }
      } catch (error) {
        /**
         * 失敗時保留同一個 idempotencyKey。
         * 使用者再次按送出會安全重試同一請求。
         */
        showToast(error.message, true);

        submitButton.disabled = false;
        submitButton.textContent =
          "重新送出";
      }
    }

    async function renderMyActivities() {
      STATE.currentView = "mine";
      updateCurrentNav();

      if (!STATE.user) {
        mainElement.innerHTML = `
          <section class="section-heading">
            <h1>我的活動</h1>
          </section>

          <div class="card empty-state">
            <h2>請先登入</h2>
            <p>
              登入後可查看正式報名、候補順位及取消紀錄。
            </p>

            <button
              class="button button-primary"
              type="button"
              data-action="login"
            >
              使用 LINE 登入
            </button>
          </div>
        `;

        return;
      }

      mainElement.innerHTML = `
        <section class="section-heading">
          <h1>我的活動</h1>
          <p>
            查看報名狀態、候補順位及活動資訊。
          </p>
        </section>

        <div class="card loading-state">
          <span
            class="spinner"
            aria-hidden="true"
          ></span>
          <p>正在讀取您的活動……</p>
        </div>
      `;

      try {
        const result = await api(
          "registrations.mine",
          {
            offset: 0,
            limit: 100
          }
        );

        STATE.myRegistrations =
          result.items || [];

        mainElement.innerHTML = `
          <section class="section-heading">
            <h1>我的活動</h1>
            <p>
              共 ${STATE.myRegistrations.length}
              筆報名紀錄。
            </p>
          </section>

          ${
            STATE.myRegistrations.length
              ? `
                <div class="mine-list">
                  ${STATE.myRegistrations
                    .map(renderMyRegistrationCard)
                    .join("")}
                </div>
              `
              : renderEmptyState(
                  "您目前沒有活動紀錄。",
                  "前往活動列表尋找適合的活動。"
                )
          }
        `;
      } catch (error) {
        if (
          error.code === "AUTH_REQUIRED" ||
          error.code === "SESSION_EXPIRED"
        ) {
          STATE.user = null;
          updateHeader();
        }

        mainElement.innerHTML =
          renderErrorState(error.message);
      }
    }

    function renderMyRegistrationCard(item) {
      const statusClass =
        item.status === "confirmed"
          ? "badge-success"
          : item.status === "waitlist"
            ? "badge-warning"
            : "badge-danger";

      const waitlistText =
        item.status === "waitlist"
          ? `
            <p>
              <strong>目前候補順位：</strong>
              第 ${escapeHtml(
                item.waitlistPosition || "—"
              )} 位
            </p>
          `
          : "";

      const cancellationText =
        item.session.status === "cancelled"
          ? `
            <div class="status-box danger">
              <strong>此場次已取消</strong>
              <p>
                ${escapeHtml(
                  item.session.cancellationReason ||
                  "請留意主辦單位後續通知。"
                )}
              </p>
            </div>
          `
          : "";

      return `
        <article class="card mine-card">
          <div class="badges">
            <span class="badge ${statusClass}">
              ${escapeHtml(
                REGISTRATION_LABELS[item.status] ||
                item.status
              )}
            </span>

            ${
              item.session.status === "cancelled"
                ? `
                  <span class="badge badge-danger">
                    場次已取消
                  </span>
                `
                : ""
            }
          </div>

          <h3>
            ${escapeHtml(item.event.title)}
          </h3>

          <p>
            <strong>日期：</strong>
            ${escapeHtml(
              formatDateRange(
                item.session.startAt,
                item.session.endAt
              )
            )}
          </p>

          <p>
            <strong>場地：</strong>
            ${escapeHtml(
              [
                item.event.city,
                item.event.district,
                item.event.venueName
              ]
                .filter(Boolean)
                .join(" ")
            )}
          </p>

          <p>
            <strong>參加人數：</strong>
            本人 1 位、陪同者
            ${escapeHtml(item.companionCount)}
            位
          </p>

          ${waitlistText}
          ${cancellationText}

          <div class="actions">
            ${
              item.session.status !== "cancelled"
                ? `
                  <button
                    class="button button-secondary"
                    type="button"
                    data-action="view-detail"
                    data-event-id="${escapeHtml(
                      item.eventId
                    )}"
                    data-session-id="${escapeHtml(
                      item.sessionId
                    )}"
                  >
                    查看活動
                  </button>
                `
                : ""
            }

            ${
              item.canCancel
                ? `
                  <button
                    class="button button-danger"
                    type="button"
                    data-action="cancel-registration"
                    data-registration-id="${escapeHtml(
                      item.registrationId
                    )}"
                  >
                    ${
                      item.status === "waitlist"
                        ? "退出候補"
                        : "取消報名"
                    }
                  </button>
                `
                : ""
            }
          </div>
        </article>
      `;
    }

    async function cancelRegistration(
      registrationId,
      button
    ) {
      const registration =
        STATE.myRegistrations.find(
          function (item) {
            return (
              item.registrationId ===
              registrationId
            );
          }
        );

      if (!registration) {
        showToast(
          "找不到報名紀錄。",
          true
        );
        return;
      }

      const actionText =
        registration.status === "waitlist"
          ? "退出候補"
          : "取消報名";

      if (
        !window.confirm(
          "確定要" +
          actionText +
          "「" +
          registration.event.title +
          "」嗎？"
        )
      ) {
        return;
      }

      button.disabled = true;
      button.textContent = "處理中……";

      try {
        const result = await api(
          "registrations.cancel",
          {
            registrationId:
              registrationId
          }
        );

        showToast(result.message);

        await Promise.all([
          refreshPublicEvents(),
          renderMyActivities()
        ]);
      } catch (error) {
        showToast(error.message, true);
        button.disabled = false;
        button.textContent = actionText;
      }
    }

    async function refreshPublicEvents() {
      try {
        const result = await api(
          "events.list",
          {
            offset: 0,
            limit: 100
          },
          {
            requiresAuth: false
          }
        );

        STATE.events = result.items || [];
      } catch (error) {
        console.warn(
          "Refresh events failed:",
          error
        );
      }
    }

    function definitionItem(label, value) {
      return `
        <div class="definition-item">
          <strong>${escapeHtml(label)}</strong>
          <span>${nl2br(value)}</span>
        </div>
      `;
    }

    function accessibilityLabel(value) {
      return (
        ACCESSIBILITY_LABELS[value] ||
        ACCESSIBILITY_LABELS.unknown
      );
    }

    function renderEmptyState(
      title,
      description
    ) {
      return `
        <div class="card empty-state">
          <h2>${escapeHtml(title)}</h2>
          <p>${escapeHtml(description)}</p>

          <button
            class="button button-primary"
            type="button"
            data-action="go-events"
          >
            查看活動
          </button>
        </div>
      `;
    }

    function renderErrorState(message) {
      return `
        <div class="card empty-state">
          <h2>無法完成載入</h2>
          <p>${escapeHtml(message)}</p>

          <button
            class="button button-primary"
            type="button"
            data-action="reload"
          >
            重新載入
          </button>
        </div>
      `;
    }

    function formatDateTime(value) {
      const date = new Date(value);

      if (
        !value ||
        Number.isNaN(date.getTime())
      ) {
        return "時間未確認";
      }

      return new Intl.DateTimeFormat(
        "zh-TW",
        {
          timeZone: CONFIG.TIME_ZONE,
          year: "numeric",
          month: "long",
          day: "numeric",
          weekday: "short",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false
        }
      ).format(date);
    }

    function formatDateRange(start, end) {
      return (
        formatDateTime(start) +
        " 至 " +
        formatDateTime(end)
      );
    }

    function formatMoney(value) {
      return new Intl.NumberFormat(
        "zh-TW",
        {
          maximumFractionDigits: 2
        }
      ).format(Number(value || 0));
    }

    function nl2br(value) {
      return escapeHtml(value || "")
        .replace(/\n/g, "<br>");
    }

    function openModal(title, content) {
      modalTitle.textContent = title;
      modalBody.innerHTML = content;

      modalOverlay.classList.add("open");
      modalOverlay.setAttribute(
        "aria-hidden",
        "false"
      );

      document.body.classList.add(
        "modal-open"
      );

      window.setTimeout(function () {
        document
          .getElementById("modal-close")
          .focus();
      }, 0);
    }

    function closeModal() {
      modalOverlay.classList.remove("open");
      modalOverlay.setAttribute(
        "aria-hidden",
        "true"
      );

      document.body.classList.remove(
        "modal-open"
      );

      modalBody.innerHTML = "";
      STATE.selectedDetail = null;

      if (
        STATE.modalReturnFocus &&
        typeof STATE.modalReturnFocus.focus ===
          "function"
      ) {
        STATE.modalReturnFocus.focus();
      }

      STATE.modalReturnFocus = null;
    }

    function trapModalFocus(event) {
      if (
        event.key !== "Tab" ||
        !modalOverlay.classList.contains(
          "open"
        )
      ) {
        return;
      }

      const focusable =
        modalElement.querySelectorAll(
          [
            "button:not([disabled])",
            "a[href]",
            "input:not([disabled])",
            "select:not([disabled])",
            "textarea:not([disabled])",
            "[tabindex]:not([tabindex='-1'])"
          ].join(",")
        );

      if (!focusable.length) {
        return;
      }

      const first = focusable[0];
      const last =
        focusable[focusable.length - 1];

      if (
        event.shiftKey &&
        document.activeElement === first
      ) {
        event.preventDefault();
        last.focus();
      } else if (
        !event.shiftKey &&
        document.activeElement === last
      ) {
        event.preventDefault();
        first.focus();
      }
    }

    function showToast(message, isError = false) {
      toastElement.textContent =
        message || "操作完成。";

      toastElement.className =
        "toast open" +
        (isError ? " error" : "");

      window.clearTimeout(
        showToast.timeoutId
      );

      showToast.timeoutId =
        window.setTimeout(
          function () {
            toastElement.classList.remove(
              "open"
            );
          },
          4800
        );
    }

    async function initializeApplication() {
      try {
        assertConfiguration();

        await initializeLiff();
        await restorePlatformSession();
        await refreshPublicEvents();

        STATE.initialized = true;
        updateHeader();

        const requestedView =
          window.location.hash.replace(
            "#",
            ""
          );

        navigateTo(
          ["home", "events", "mine"].includes(
            requestedView
          )
            ? requestedView
            : "home"
        );
      } catch (error) {
        mainElement.innerHTML =
          renderErrorState(
            error.message ||
            "系統初始化失敗。"
          );

        showToast(error.message, true);
      }
    }

    document.addEventListener(
      "click",
      async function (event) {
        const viewButton =
          event.target.closest(
            "[data-view]"
          );

        if (viewButton) {
          navigateTo(
            viewButton.dataset.view
          );
          return;
        }

        const viewLink =
          event.target.closest(
            "[data-view-link]"
          );

        if (viewLink) {
          event.preventDefault();
          navigateTo(
            viewLink.dataset.viewLink
          );
          return;
        }

        const actionElement =
          event.target.closest(
            "[data-action]"
          );

        if (!actionElement) {
          return;
        }

        const action =
          actionElement.dataset.action;

        if (action === "go-events") {
          navigateTo("events");
        } else if (action === "go-mine") {
          navigateTo("mine");
        } else if (action === "login") {
          await login();
        } else if (
          action === "view-detail"
        ) {
          await showEventDetail(
            actionElement.dataset.eventId,
            actionElement.dataset.sessionId,
            actionElement
          );
        } else if (
          action === "open-registration"
        ) {
          showRegistrationForm();
        } else if (
          action === "back-to-detail"
        ) {
          if (STATE.selectedDetail) {
            modalTitle.textContent =
              STATE.selectedDetail.event.title;

            modalBody.innerHTML =
              renderEventDetail(
                STATE.selectedDetail
              );
          }
        } else if (
          action === "cancel-registration"
        ) {
          await cancelRegistration(
            actionElement.dataset.registrationId,
            actionElement
          );
        } else if (
          action === "reload"
        ) {
          window.location.reload();
        } else if (
          action === "reset-filters"
        ) {
          window.setTimeout(
            function () {
              loadEvents({});
            },
            0
          );
        }
      }
    );

    document.addEventListener(
      "submit",
      async function (event) {
        if (
          event.target.id ===
          "event-filter-form"
        ) {
          event.preventDefault();

          const formData =
            new FormData(event.target);

          await loadEvents({
            keyword:
              formData.get("keyword") || "",
            city:
              formData.get("city") || "",
            category:
              formData.get("category") || "",
            intensity:
              formData.get("intensity") || ""
          });
        }

        if (
          event.target.id ===
          "registration-form"
        ) {
          event.preventDefault();
          await submitRegistration(
            event.target
          );
        }
      }
    );

    document
      .getElementById("menu-button")
      .addEventListener(
        "click",
        function () {
          const nav =
            document.getElementById(
              "main-nav"
            );

          const isOpen =
            nav.classList.toggle("open");

          this.setAttribute(
            "aria-expanded",
            String(isOpen)
          );
        }
      );

    document
      .getElementById(
        "nav-login-button"
      )
      .addEventListener(
        "click",
        login
      );

    document
      .getElementById(
        "nav-logout-button"
      )
      .addEventListener(
        "click",
        logout
      );

    document
      .getElementById("modal-close")
      .addEventListener(
        "click",
        closeModal
      );

    modalOverlay.addEventListener(
      "click",
      function (event) {
        if (event.target === modalOverlay) {
          closeModal();
        }
      }
    );

    document.addEventListener(
      "keydown",
      function (event) {
        if (
          event.key === "Escape" &&
          modalOverlay.classList.contains(
            "open"
          )
        ) {
          closeModal();
          return;
        }

        trapModalFocus(event);
      }
    );

    window.addEventListener(
      "hashchange",
      function () {
        const view =
          window.location.hash.replace(
            "#",
            ""
          );

        if ([
            "home",
            "events",
            "mine"
          ].includes(view) &&
          view !== STATE.currentView
        ) {
          STATE.currentView = view;
          updateCurrentNav();
          renderCurrentView();

          mainElement.focus({
            preventScroll: true
          });
        }
      }
    );

    /**
     * 頁面載入後啟動應用程式。
     */
    initializeApplication();
  </script>
</body>
</html>
