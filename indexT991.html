<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1.0,user-scalable=no"/>
  <title>台灣帕金森病友權益促進會 - 全方位管理平台</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;900&display=swap');

  :root {
    --fs-base: 20px;
    --fs-sm: 18px;
    --fs-xs: 16px;
    --fs-lg: 24px;
    --fs-xl: 30px;
    --fs-title: 28px;
    --btn-h: 68px;
    --input-h: 64px;
    --nav-h: 90px;

    --bg: #f8fafc;
    --card: #ffffff;
    --primary: #0f766e;
    --primary-dark: #115e59;
    --primary-light: #f0fdfa;
    --success: #166534;
    --warn: #b45309;
    --danger: #b91c1c;
    --text: #0f172a;
    --muted: #475569;
    --border: #cbd5e1;
    --radius: 18px;
    --shadow: 0 10px 25px -5px rgba(0,0,0,0.06);
    --safe-b: env(safe-area-inset-bottom);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; min-height: 100%;
    font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", sans-serif;
    background: var(--bg); color: var(--text);
    font-size: var(--fs-base); line-height: 1.7;
    touch-action: manipulation;
  }
  body {
    padding-top: 10px;
    padding-bottom: calc(var(--nav-h) + var(--safe-b) + 30px);
  }
  button, input, select, textarea { font-family: inherit; font-size: var(--fs-base); }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .wrap { width: 100%; max-width: 860px; margin: 0 auto; padding: 14px; }
  .card {
    background: var(--card); border-radius: var(--radius);
    padding: 24px; box-shadow: var(--shadow);
    border: 2px solid var(--border); margin-bottom: 20px;
  }
  .card-title {
    font-size: var(--fs-title); font-weight: 900; display: flex;
    align-items: center; gap: 10px; margin-bottom: 16px;
    border-left: 8px solid var(--primary); padding-left: 12px;
  }
  .hero {
    background: linear-gradient(135deg, #0f766e, #115e59, #0d9488);
    border-radius: var(--radius); padding: 26px 18px; color: #fff;
    margin-bottom: 20px; text-align: center;
  }
  .hero h1 { font-size: var(--fs-xl); font-weight: 900; }
  .hero .tagline { font-size: var(--fs-lg); opacity: .95; margin-top: 6px; }

  .btn {
    width: 100%; min-height: var(--btn-h); border-radius: 16px;
    font-weight: 900; font-size: var(--fs-base); display: flex;
    align-items: center; justify-content: center; gap: 10px;
    padding: 12px 18px; margin: 10px 0; border: 2px solid transparent;
    transition: transform .1s;
  }
  .btn:active { transform: scale(.98); }
  .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; }
  .btn-success { background: linear-gradient(135deg, #15803d, #166534); color: #fff; }
  .btn-warn { background: linear-gradient(135deg, #c2410c, var(--warn)); color: #fff; }
  .btn-danger { background: linear-gradient(135deg, #b91c1c, var(--danger)); color: #fff; }
  .btn-line { background: linear-gradient(135deg, #00b300, #008000); color: #fff; }
  .btn-outline { background: #fff; color: var(--primary); border: 2.5px solid var(--primary); }
  .btn-ghost { background: #f1f5f9; color: #334155; border: 2px solid var(--border); }
  .btn-sm { min-height: 52px; font-size: var(--fs-sm); border-radius: 14px; padding: 8px 14px; width: auto; margin: 4px; }
  .btn-xs { min-height: 44px; font-size: var(--fs-xs); border-radius: 12px; padding: 6px 10px; width: auto; margin: 4px; }

  .fg { margin-bottom: 18px; }
  .flabel { display: block; font-weight: 900; font-size: var(--fs-base); margin-bottom: 6px; }
  .req { color: var(--danger); margin-left: 4px; }
  .fc {
    width: 100%; border: 2px solid var(--border); border-radius: 14px;
    padding: 12px 16px; background: #fff; color: var(--text);
    font-size: var(--fs-base); min-height: var(--input-h); outline: none;
  }
  .fc:focus { border-color: var(--primary); ring: 3px rgba(15,118,110,0.2); }
  textarea.fc { min-height: 120px; }

  .module-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media(min-width: 640px) { .module-grid { grid-template-columns: 1fr 1fr; } }
  .module-btn {
    background: #fff; border: 2px solid var(--border); border-radius: 16px;
    padding: 16px; display: flex; align-items: center; gap: 14px;
    font-weight: 900; font-size: var(--fs-base); color: var(--text); text-align: left;
  }
  .module-btn .m-icon { font-size: 32px; }
  .module-btn .m-sub { font-size: var(--fs-xs); color: var(--muted); font-weight: 700; display: block; }
  .module-btn.blue { border-color: #bae6fd; background: #f0f9ff; }
  .module-btn.green { border-color: #bbf7d0; background: #f0fdf4; }
  .module-btn.orange { border-color: #fef08a; background: #fffbeb; }
  .module-btn.purple { border-color: #e9d5ff; background: #faf5ff; }

  .badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 4px 12px; font-size: var(--fs-xs); font-weight: 900; border: 1.5px solid currentColor; }
  .bs { background: #f0fdf4; color: #14532d; }
  .bd { background: #fef2f2; color: #7f1d1d; }
  .bw { background: #fffbeb; color: #7c2d12; }

  .notice { border-radius: 14px; padding: 14px 18px; font-size: var(--fs-sm); margin-bottom: 16px; border-left: 6px solid; }
  .notice.info { background: #f0f9ff; border-color: var(--primary); color: #0369a1; }
  .notice.success { background: #f0fdf4; border-color: var(--success); color: #14532d; }
  .notice.warn { background: #fffbeb; border-color: var(--warn); color: #7c2d12; }

  .bottom-nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
    background: rgba(255,255,255,0.98); backdrop-filter: blur(8px);
    border-top: 2px solid var(--border); height: calc(var(--nav-h) + var(--safe-b));
    display: flex; justify-content: center; padding-bottom: var(--safe-b);
  }
  .nav-inner { width: 100%; max-width: 600px; display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; padding: 6px 10px; }
  .nitem {
    background: transparent; border: none; color: #475569; border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; font-size: var(--fs-xs); font-weight: 900;
  }
  .nitem.active { background: #f0fdfa; color: var(--primary); }
  .nitem.disabled { opacity: 0.3; pointer-events: none; }

  .modal-mask { position: fixed; inset: 0; z-index: 100; background: rgba(15,23,42,0.6); display: none; align-items: flex-end; justify-content: center; padding: 10px; }
  .modal-mask.show { display: flex; }
  .modal { width: 100%; max-width: 680px; max-height: 86vh; overflow-y: auto; background: #fff; border-radius: 24px 24px 0 0; padding: 22px; }
  @media(min-width: 640px) { .modal { border-radius: 20px; margin-bottom: 20px; } .modal-mask { align-items: center; } }
  .modal-title { font-size: var(--fs-lg); font-weight: 900; margin-bottom: 16px; border-left: 6px solid var(--primary); padding-left: 10px; }

  .toast {
    position: fixed; left: 50%; bottom: calc(var(--nav-h) + var(--safe-b) + 16px);
    transform: translateX(-50%); z-index: 120; background: #0f172a; color: #fff;
    border-radius: 999px; padding: 12px 24px; font-weight: 900; font-size: var(--fs-sm); display: none;
  }
  .toast.show { display: block; }
  .toast.s { background: #166534; }
  .toast.e { background: #991b1b; }
  .toast.w { background: #92400e; }

  .loader { position: fixed; inset: 0; z-index: 110; display: none; align-items: center; justify-content: center; background: rgba(255,255,255,0.8); }
  .loader.show { display: flex; }
  .spinner { width: 50px; height: 50px; border-radius: 50%; border: 5px solid #cbd5e1; border-top-color: var(--primary); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; }
  .tab { white-space: nowrap; border: 2px solid var(--border); background: #fff; color: #0f172a; border-radius: 999px; padding: 8px 16px; font-weight: 900; font-size: var(--fs-xs); }
  .tab.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  .empty { text-align: center; padding: 30px 14px; color: var(--muted); border: 2px dashed var(--border); border-radius: 16px; font-weight: 800; }
  .hide { display: none !important; }

  body.elder-large-text { font-size: 24px !important; }
  body.elder-high-contrast { background: #fff !important; color: #000 !important; }
  body.elder-high-contrast .card { border: 3px solid #000 !important; }
  </style>
</head>

<body>
<div id="printArea" class="hide"></div>

<div class="app">
  <main id="main" class="wrap" tabindex="-1"></main>

  <nav class="bottom-nav">
    <div class="nav-inner">
      <button id="navBack" class="nitem disabled" onclick="goBack()">
        <i class="fa-solid fa-arrow-left text-xl"></i><span>返回</span>
      </button>
      <button id="navHome" class="nitem active" onclick="go('home')">
        <i class="fa-solid fa-house text-xl"></i><span>首頁</span>
      </button>
      <button id="navAdmin" class="nitem hide" onclick="go('adminHome')">
        <i class="fa-solid fa-gear text-xl"></i><span>管理</span>
      </button>
      <button id="navAuth" class="nitem" onclick="openLogin()">
        <i class="fa-solid fa-key text-xl" id="authIco"></i><span id="authText">登入</span>
      </button>
    </div>
  </nav>
</div>

<div id="modalMask" class="modal-mask" onclick="if(event.target.id==='modalMask') closeModal()">
  <div id="modal" class="modal"></div>
</div>
<div id="toast" class="toast"></div>
<div id="loader" class="loader"><div class="spinner"></div></div>

<script>
// ==============================================================================
// 核心參數與全域狀態
// ==============================================================================
const API_BASE = 'https://script.google.com/macros/s/AKfycbzKJL53ZSN5xmCLuHSgKPZMbF99bCiYpwbxRJ15WOWsYSGCrSoJil0xJVCNdR5OuDkj/exec';
const LIFF_ID = '2009456572-588gzru4';
const ORG_NAME = '社團法人台灣帕金森病友權益促進會';
const ADMIN_TYPES = ['管理員','理事長','理監事','理事','監事','會計','出納','總幹事','行政秘書長'];

const APP = {
  user: null, page: 'home', history: [], _params: {},
  liffReady: false, liffProfile: null
};

const WARM_TIPS = [
  "☀️ 每天早晨喝一杯溫開水，幫助腸胃蠕動與藥物吸收喔！",
  "🌸 藥效順暢（On期）是做伸展與散步的最佳黃金時間！",
  "💧 服用美多芭前，盡量避免高蛋白濃稠大餐，藥效更順暢！",
  "🎈 感到腳步卡卡凍結時，打開「解凍節拍器」跟著節奏邁開大步！",
  "🗣️ 每天堅持大聲發聲練習 5 秒鐘，能鍛鍊聲帶與呼吸肌力！"
];
let currentTipIndex = 0;
let selectedMood = '😊';
let currentHealthState = 'ON';
let exerciseMinutes = 30;
let bpm = 90;
let metronomeActive = false;
let metronomeInterval = null;
let audioCtxInstance = null;
let tapTestActive = false, tapCount = 0, tapTimer = null, lastTapHand = null;
let vocalTesting = false, vocalTimer = null, vocalScore = 0;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function jsStr(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n').replace(/\r/g,''); }
function fmtDate(d){ if(!d)return'--'; const dt=new Date(d); return isNaN(dt.getTime())?String(d):`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`; }
function today(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function isAdminUser(u){ return !!(u && ADMIN_TYPES.includes(String(u.type||''))); }

function showLoad(){ $('loader').classList.add('show'); }
function hideLoad(){ $('loader').classList.remove('show'); }
function toast(msg, type){
  const el=$('toast'); el.textContent=msg||''; el.className='toast show '+(type||'');
  clearTimeout(window.__tt); window.__tt=setTimeout(()=>{ el.className='toast'; }, 3000);
}
function setMain(html){ $('main').innerHTML=html; window.scrollTo(0,0); $('main').focus(); }
function openModal(html){ $('modal').innerHTML=html; $('modalMask').classList.add('show'); }
function closeModal(){ $('modalMask').classList.remove('show'); $('modal').innerHTML=''; }

// ==============================================================================
// API 通訊函式庫
// ==============================================================================
async function api(action, data = {}) {
  const payload = {
    action,
    data: {
      ...data,
      operatorLineId: APP.user?.lineId || APP.liffProfile?.userId || '',
      operator: APP.user?.name || '',
      operatorId: APP.user?.memberId || ''
    }
  };
  const res = await fetch(API_BASE, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  if(!res.ok) throw new Error('伺服器連線異常 (' + res.status + ')');
  return JSON.parse(await res.text());
}

async function runApi(action, data={}, onSuccess){
  showLoad();
  try {
    const res = await api(action, data);
    hideLoad();
    if(res.success) { if(onSuccess) onSuccess(res); }
    else { toast(res.message || '操作失敗', 'e'); }
    return res;
  } catch(e) {
    hideLoad();
    toast('連線失敗：' + e.message, 'e');
    return { success: false };
  }
}

async function getFileData(fileInputId){
  const input = document.getElementById(fileInputId);
  if(!input || !input.files || input.files.length === 0) return null;
  const file = input.files[0];
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => resolve({
      base64: e.target.result.split(',')[1],
      filename: file.name,
      mimeType: file.type
    });
    reader.readAsDataURL(file);
  });
}

// ==============================================================================
// 路由系統
// ==============================================================================
const ROUTES = {
  home: renderHome,
  healthCenter: renderHealthCenter,
  forumHome: renderForumHome,
  forumCreatePost: renderForumCreatePost,
  myPayments: renderMyPayments,
  myDonations: renderMyDonations,
  memberCenter: renderMemberCenter,
  adminHome: renderAdminHome,
  memberManage: renderMemberManage,
  pendingPayments: renderPendingPayments,
  pendingDonations: renderPendingDonations,
  financeIncome: renderFinanceIncome,
  financeExpense: renderFinanceExpense,
  expenseList: renderExpenseList,
  receiptList: renderReceiptList,
  voucherList: renderVoucherList,
  budgetManage: renderBudgetManage,
  projectManage: renderProjectManage,
  subjectManage: renderSubjectManage,
  accountManage: renderAccountManage,
  reportCenter: renderReportCenter,
  announceManage: renderAnnounceManage,
  systemSetting: renderSystemSetting
};

function go(page, params={}, push=true){
  if(push && APP.page && APP.page !== page) APP.history.push({ page: APP.page, params: APP._params||{} });
  APP.page = page; APP._params = params || {};
  document.querySelectorAll('.nitem').forEach(el => el.classList.remove('active'));
  if(page === 'home') $('navHome').classList.add('active');
  else if(page.startsWith('admin') || page.startsWith('finance') || page.startsWith('memberManage')) {
    $('navAdmin')?.classList.remove('hide');
    $('navAdmin')?.classList.add('active');
  }
  const backBtn = $('navBack');
  if(backBtn) {
    if(APP.history.length > 0) backBtn.classList.remove('disabled');
    else backBtn.classList.add('disabled');
  }
  if(ROUTES[page]) ROUTES[page](params);
}

function goBack(){
  if(!APP.history.length) return;
  const prev = APP.history.pop();
  go(prev.page, prev.params, false);
}

function updateLoginButton(){
  const authText = $('authText'), authIco = $('authIco'), navAuth = $('navAuth'), navAdmin = $('navAdmin');
  if(APP.user) {
    authText.textContent = '登出';
    authIco.className = 'fa-solid fa-door-open text-xl';
    navAuth?.setAttribute('onclick', 'logout()');
    if(isAdminUser(APP.user)) navAdmin?.classList.remove('hide');
    else navAdmin?.classList.add('hide');
  } else {
    authText.textContent = '登入';
    authIco.className = 'fa-solid fa-key text-xl';
    navAuth?.setAttribute('onclick', 'openLogin()');
    navAdmin?.classList.add('hide');
  }
}

function logout(){
  if(!confirm('確定登出？')) return;
  APP.user = null;
  localStorage.removeItem('parkUser');
  updateLoginButton();
  toast('已安全登出', 's');
  go('home', {}, false);
}

function requireLogin(){
  if(!APP.user) { openLogin(); return false; }
  return true;
}

function requireAdmin(){
  if(!requireLogin()) return false;
  if(!isAdminUser(APP.user)){
    toast('⚠️ 您沒有管理員存取權限', 'e');
    go('home');
    return false;
  }
  return true;
}

// ==============================================================================
// 畫面實作：首頁 (Home)
// ==============================================================================
function renderHome(){
  if(APP.user) renderLoggedInHome();
  else renderLoggedOutHome();
}

function renderLoggedOutHome(){
  setMain(`
    <div class="hero">
      <h1>${esc(ORG_NAME)}</h1>
      <div class="tagline">陪伴病友・守護權益・共創希望</div>
    </div>

    <div class="card">
      <div class="card-title"><i class="fa-solid fa-bullhorn text-teal-700"></i> 最新公告</div>
      <div id="homeAnnList"><div class="empty">公告載入中...</div></div>
    </div>

    <div class="card" style="border-color:var(--primary);background:var(--primary-light);">
      <div class="card-title"><i class="fa-solid fa-right-to-bracket text-teal-700"></i> 病友登入與服務</div>
      <div class="notice info" style="background:#fff;">登入後可記錄每日健康日記、使用解凍節拍器、線上申報會費與參與社群交流。</div>
      <button class="btn btn-primary" onclick="openPhoneLogin()"><i class="fa-solid fa-mobile-screen"></i> 手機號碼免密碼登入</button>
      <button class="btn btn-line" onclick="doLineLogin()"><i class="fa-brands fa-line text-2xl"></i> LINE 快速登入</button>
      <button class="btn btn-outline" onclick="openRegister()"><i class="fa-solid fa-user-plus"></i> 申請加入會員</button>
    </div>
  `);
  loadHomeAnnouncements();
}

async function loadHomeAnnouncements(){
  try {
    const res = await api('announcement.list', { target: '全部' });
    const area = $('homeAnnList');
    if(!area) return;
    if(!res.success || !res.items || !res.items.length) {
      area.innerHTML = `<div class="empty">目前沒有公告</div>`; return;
    }
    area.innerHTML = res.items.slice(0, 3).map(r => `
      <div style="padding:12px;border-bottom:1px solid var(--border);">
        <div style="font-weight:900;color:var(--text);">${r.pinned?'📌 ':''}${esc(r.title)}</div>
        <div style="font-size:14px;color:var(--muted);">${esc(fmtDate(r.date))} ｜ ${esc(r.category)}</div>
        <div style="font-size:16px;margin-top:6px;white-space:pre-wrap;">${esc(r.content)}</div>
      </div>
    `).join('');
  } catch(e) {}
}

function renderLoggedInHome(){
  const u = APP.user || {};
  const isAdmin = isAdminUser(u);
  setMain(`
    <div class="hero">
      <h1>🌸 歡迎，${esc(u.name)} 🌸</h1>
      <div class="tagline">今天也要保持好心情，讓我們一起邁步向前！</div>
    </div>

    <div style="background:#1e293b;border-radius:18px;padding:16px;margin-bottom:18px;color:#fff;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
      <div style="flex:1;"><span style="color:#5eead4;font-weight:900;">每日叮嚀：</span><span id="warmTipText">${esc(WARM_TIPS[currentTipIndex])}</span></div>
      <button onclick="nextTip()" class="btn btn-xs btn-outline" style="background:#334155;color:#5eead4;border-color:#5eead4;margin:0;">換一張 🔄</button>
    </div>

    <div class="card">
      <div class="card-title"><i class="fa-solid fa-shapes text-teal-700"></i> 功能專區</div>
      <div class="module-grid">
        <button class="module-btn purple" onclick="go('healthCenter')">
          <span class="m-icon">♿</span>
          <div><span>健康與復健中心</span><span class="m-sub">每日日記/節拍/發聲</span></div>
        </button>
        <button class="module-btn orange" onclick="go('forumHome')">
          <span class="m-icon">🍵</span>
          <div><span>溫馨病友社群</span><span class="m-sub">互助問安與照護交流</span></div>
        </button>

function doLineLogin(){
  if(!APP.liffReady) return toast('LINE 環境載入中，請稍後...', 'w');

}

function setHState(s, el){

}

function toggleMed(el){
  if(el.innerText.includes('✅')) {
    el.innerText = el.innerText.replace('✅ 已服', '');
    el.className = 'btn btn-sm btn-ghost';
    el.style.background = ''; el.style.color = '';
  } else {
    el.innerText = '✅ 已服' + el.innerText;
    el.className = 'btn btn-sm';
    el.style.background = '#8b5cf6'; el.style.color = '#fff';
  }
}

function getAudioCtx(){
  if(!audioCtxInstance) {
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtxInstance = new AC();
  }
  if(audioCtxInstance.state === 'suspended') audioCtxInstance.resume();
  return audioCtxInstance;
}

function playTone(freq, dur){
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.1, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + dur);
    osc.start(); osc.stop(ctx.currentTime + dur);
  } catch(e) {}
}

function adjustBpm(diff){
  bpm = Math.max(40, Math.min(200, bpm + diff));
  if($('bpmVal')) $('bpmVal').innerText = bpm;
  if(metronomeActive) { toggleMetro(); toggleMetro(); }
}

function toggleMetro(){
  const btn = $('mBtn');
  if(metronomeActive) {
    clearInterval(metronomeInterval);
    metronomeActive = false;
    btn.innerHTML = `<i class="fa-solid fa-play mr-2"></i> 啟動節拍器`;
    btn.className = 'btn btn-primary';
  } else {
    getAudioCtx();
    metronomeActive = true;
    btn.innerHTML = `<i class="fa-solid fa-pause mr-2"></i> 停止節拍器`;
    btn.className = 'btn btn-danger';
    const ms = (60 / bpm) * 1000;
    metronomeInterval = setInterval(() => {
      const vb = $('vBeat');
      if(vb) vb.style.background = '#8b5cf6';
      playTone(880, 0.08);
      setTimeout(() => { if(vb) vb.style.background = '#e2e8f0'; }, 80);
    }, ms);
  }
}

function startTap(){
  if(tapTestActive) return;
  tapTestActive = true; tapCount = 0; let tLeft = 10; lastTapHand = null;
  $('tapArea')?.classList.remove('hide');
  $('tStartBtn')?.classList.add('hide');
  $('tCount').innerText = '0'; $('tTime').innerText = '10';

  tapTimer = setInterval(() => {
    tLeft--;
    if($('tTime')) $('tTime').innerText = tLeft;
    if(tLeft <= 0) {
      clearInterval(tapTimer);
      tapTestActive = false;
      $('tapArea')?.classList.add('hide');
      $('tStartBtn')?.classList.remove('hide');
      window.__lastTapScore = tapCount;
      toast('🎉 測試完成！總次數：' + tapCount, 's');
    }
  }, 1000);
}

function tap(hand){
  if(!tapTestActive || hand === lastTapHand) return;
  tapCount++;
  lastTapHand = hand;
  if($('tCount')) $('tCount').innerText = tapCount;
  playTone(600, 0.04);
}

function startVoiceInput(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return toast('瀏覽器不支援語音輸入，請使用 Chrome', 'e');
  const rec = new SR();
  rec.lang = 'zh-TW';
  const btn = $('vBtn');
  btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> 聆聽中...`;
  rec.start();

  rec.onresult = async e => {
    const text = e.results[0][0].transcript;
    btn.innerHTML = `<i class="fa-solid fa-robot fa-bounce mr-2"></i> AI 分析中...`;
    try {
      const res = await api('health.processAI', { text });
      if(res.success && res.parsed) {
        $('docQ').value = res.parsed.note || text;
        toast('🤖 已完成備忘摘要整理', 's');
      } else { $('docQ').value = text; }
    } catch(err) { $('docQ').value = text; }
  };
  rec.onerror = () => toast('未辨識清楚，請重試', 'w');
  rec.onend = () => { btn.innerHTML = `<i class="fa-solid fa-microphone text-xl"></i> 點我開始語音記錄`; };
}

function submitDailyLog(){
  const meds = [];
  document.querySelectorAll('[onclick^="toggleMed"]').forEach(b => {

  });
  const payload = {
    memberId: APP.user.memberId, name: APP.user.name, date: today(),
    mood: selectedMood, state: currentHealthState, meds: meds.join(', '),
    exerciseMins: exerciseMinutes, doctorQuestion: $('docQ')?.value || '',
    tapScore: window.__lastTapScore || 0, vocalScore: 0
  };
  runApi('health.saveDailyRecord', payload, () => {
    toast('🎉 今日日記已安全儲存！', 's');
    go('home');

}

let chart1 = null, chart2 = null;
async function loadStats(){
  try {
    const res = await api('health.getStats', { memberId: APP.user.memberId });
    if(!res.success) return;
    const c1 = $('chartOnOff')?.getContext('2d');
    const c2 = $('chartTrend')?.getContext('2d');
    if(!c1 || !c2) return;

    if(chart1) chart1.destroy();
    if(chart2) chart2.destroy();

    chart1 = new Chart(c1, {
      type: 'doughnut',
      data: {
        labels: ['ON 順暢', 'OFF 僵硬', '異動症'],
        datasets: [{

          backgroundColor: ['#10b981', '#f43f5e', '#f59e0b']
        }]
      },
      options: { responsive: true, maintainAspectRatio: false }
    });

    chart2 = new Chart(c2, {
      type: 'line',
      data: {
        labels: res.trend.dates,
        datasets: [
          { label: '運動分鐘', data: res.trend.exercises, borderColor: '#8b5cf6', tension: 0.3 },
          { label: '敲擊得分', data: res.trend.taps, borderColor: '#15803d', tension: 0.3 }

async function submitPayment() {
  const amount = Number($('pAmount')?.value || 0);
  if (amount <= 0) return toast('金額必須大於 0', 'e');

  const fileObj = await getFileData('pProof');

  const payload = {
    memberId: APP.user.memberId,
    name: APP.user.name,
    phone: APP.user.mobile || APP.user.phone || '',
    year: $('pYear')?.value || new Date().getFullYear(),
    amount: amount,
    method: $('pMethod')?.value || '銀行匯款',
    date: today(),
    note: $('pNote')?.value || '',
    file: fileObj
  };

  runApi('payment.apply', payload, () => {
    toast('🎉 會費申報已送出，待秘書處對帳確認！', 's');
    renderMyPayments();
  });
}

async function loadMyPayments() {
  try {
    const res = await api('payment.myList', { memberId: APP.user.memberId });
    const area = $('myPayList');
    if (!area) return;

    if (!res.success || !res.items || !res.items.length) {
      area.innerHTML = `<div class="empty">查無繳費申報紀錄</div>`;
      return;
    }

    area.innerHTML = res.items.map(p => `
      <div style="border:2px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;background:#fff;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <strong>${esc(p.year)} 年度常年會費</strong>
          <span class="badge ${p.status === '已確認' ? 'bs' : (p.status === '已退回' ? 'bd' : 'bw')}">
            ${esc(p.status)}
          </span>
        </div>
        <div style="font-size:16px;color:var(--muted);margin-top:6px;">
          金額：<strong class="text-green-700">NT$ ${Number(p.amount).toLocaleString('zh-TW')}</strong> ｜ 方式：${esc(p.method)}
        </div>
        ${p.receiptNo ? `
          <div style="margin-top:8px;">
            <button class="btn btn-xs btn-outline" onclick="viewReceipt('${esc(p.receiptNo)}')">
              <i class="fa-solid fa-file-invoice mr-1"></i> 查看電子收據 (${esc(p.receiptNo)})
            </button>
          </div>
        ` : ''}
        ${p.rejectReason ? `
          <div style="color:#b91c1c;font-size:14px;margin-top:4px;">
            退回原因：${esc(p.rejectReason)}
          </div>
        ` : ''}
      </div>
    `).join('');
  } catch (e) {
    const area = $('myPayList');
    if (area) area.innerHTML = `<div class="empty text-red-600">載入失敗，請稍後重試</div>`;
  }
}

async function renderFinanceExpense(){
  if(!requireAdmin()) return;
  showLoad();
  const opts = await api('finance.options');
  hideLoad();

  const subOptions = (opts.subjects || []).filter(s => s.type === '支出').map(s => `
    <option value="${esc(s.code)}">${esc(s.code)} ${esc(s.name)}</option>
  `).join('');

  const accOptions = (opts.accounts || []).map(a => `
    <option value="${esc(a.name)}">${esc(a.name)} (餘額 NT$ ${Number(a.balance).toLocaleString('zh-TW')})</option>
  `).join('');

  setMain(`
    <div class="card">
      <div class="card-title">📤 支出核銷申請單</div>
      <div class="fg"><label class="flabel">支出日期</label><input type="date" id="eDate" class="fc" value="${today()}"></div>
      <div class="fg"><label class="flabel">會計科目<span class="req">*</span></label><select id="eSub" class="fc">${subOptions}</select></div>
      <div class="fg"><label class="flabel">支出金額 (新臺幣)<span class="req">*</span></label><input type="number" id="eAmount" class="fc" placeholder="例：3500"></div>
      <div class="fg"><label class="flabel">預計付款帳戶</label><select id="eAcc" class="fc">${accOptions}</select></div>
      <div class="fg"><label class="flabel">受款人 / 廠商名稱<span class="req">*</span></label><input type="text" id="ePayee" class="fc"></div>
      <div class="fg"><label class="flabel">用途說明<span class="req">*</span></label><textarea id="eDesc" class="fc" placeholder="例：購買會員衛教手冊印刷費"></textarea></div>
      <div class="fg"><label class="flabel">上傳發票 / 收據憑證 (選填)</label><input type="file" id="eFile" class="fc" accept="image/*"></div>
      <button class="btn btn-primary" onclick="submitExpense()">送出支出申請</button>
    </div>
  `);
}

async function submitExpense(){
  const amount = Number($('eAmount')?.value || 0);
  const payee = $('ePayee')?.value.trim();
  const desc = $('eDesc')?.value.trim();
  if(amount <= 0 || !payee || !desc) return toast('請完整填寫支出金額、受款人與用途', 'e');

  const fileObj = await getFileData('eFile');
  const payload = {
    date: $('eDate')?.value || today(),
    subjectCode: $('eSub')?.value,
    amount: amount,
    account: $('eAcc')?.value,
    payee: payee,
    description: desc,
    file: fileObj
  };

  runApi('expense.apply', payload, () => {
    toast('🎉 支出申請已建立，請待主管核准與出納撥款！', 's');
    go('expenseList');
  });
}

function renderExpenseList(){
  if(!requireAdmin()) return;
  setMain(`
    <div class="card">
      <div class="card-title">📋 支出核銷與撥款進度</div>
      <div id="expList"><div class="empty">載入中...</div></div>
    </div>
  `);
  loadExpenseList();
}

async function loadExpenseList(){
  try {
    const res = await api('expense.list');
    const area = $('expList');
    if(!area) return;
    if(!res.success || !res.items || !res.items.length) {
      area.innerHTML = `<div class="empty">查無支出紀錄</div>`; return;
    }
    area.innerHTML = res.items.map(e => `
      <div style="border:2px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;background:#fff;">
        <div style="display:flex;justify-content:space-between;font-weight:900;">
          <span>${esc(e.subjectName)} - ${esc(e.payee)}</span>
          <span class="text-red-700">NT$ ${Number(e.amount).toLocaleString('zh-TW')}</span>
        </div>
        <div style="font-size:15px;color:var(--muted);margin-top:4px;">
          日期：${esc(e.date)} ｜ 帳戶：${esc(e.account)} ｜ 狀態：<span class="badge ${e.status==='已撥款'?'bs':(e.status==='已退回'?'bd':'bw')}">${esc(e.status)}</span>
        </div>
        <div style="font-size:15px;margin-top:4px;">用途：${esc(e.description)}</div>
        <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
          ${e.status === '待審核' ? `
            <button class="btn btn-xs btn-success" onclick="approveExpense('${esc(e.id)}')">主管核准</button>
            <button class="btn btn-xs btn-danger" onclick="rejectExpense('${esc(e.id)}')">退回</button>
          ` : ''}
          ${e.status === '已核准' ? `
            <button class="btn btn-xs btn-primary" onclick="confirmPaidExpense('${esc(e.id)}')">出納確認撥款扣帳</button>

        </div>
      </div>
    `).join('');
  } catch(e) {}
}

function approveExpense(id){
  if(!confirm('確認核准此筆支出？')) return;
  runApi('expense.approve', { id }, () => { toast('已核准', 's'); loadExpenseList(); });
}

function rejectExpense(id){
  const reason = prompt('退回原因：');
  if(!reason) return;
  runApi('expense.reject', { id, reason }, () => { toast('已退回', 's'); loadExpenseList(); });
}

function confirmPaidExpense(id){
  if(!confirm('確認已完成撥款？將自動產生支出傳票並扣減帳戶餘額。')) return;
  runApi('expense.confirmPaid', { id }, res => {

async function viewExpenseSlip(id){
  showLoad();
  try {
    const res = await api('expense.getSlipHtml', { id });
    hideLoad();
    if(res.success && res.html) {
      openModal(`
        <div class="modal-title">📄 支出憑證單</div>
        ${res.html}
        <button class="btn btn-primary" onclick="window.print()" style="margin-top:16px;">列印支出單</button>
        <button class="btn btn-ghost" onclick="closeModal()">關閉</button>

    }
  } catch(e) { hideLoad(); }
}

async function loadReceipts(){
  try {
    const res = await api('receipt.list');

    if(!res.success || !res.items || !res.items.length) {
      area.innerHTML = `<div class="empty">目前無收據記錄</div>`; return;
    }
    area.innerHTML = res.items.map(r => `
      <div style="border:2px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;background:#fff;">
        <div style="display:flex;justify-content:space-between;font-weight:900;">
          <span>${esc(r.receiptNo)} - ${esc(r.name)}</span>
          <span class="badge ${r.status==='作廢'?'bd':'bs'}">${esc(r.status)}</span>
        </div>
        <div style="font-size:15px;color:var(--muted);margin-top:4px;">
          金額：NT$ ${Number(r.amount).toLocaleString('zh-TW')} ｜ 項目：${esc(r.item)} ｜ 日期：${esc(r.date)}

function voidReceipt(receiptNo){

  runApi('receipt.void', { receiptNo, reason }, () => {

    loadReceipts();
  });
