  <style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;900&display=swap');

:root {
  --fs-base: 20px;
  --fs-sm: 18px;
  --fs-xs: 16px;
  --fs-lg: 24px;
  --fs-xl: 28px;

.index-card {

.index-icon {

/* 底部導覽 */
.bottom-nav {

/* Modal / Toast / Loader */
.modal-mask {
  position:fixed;
  inset:0;

  background:rgba(15,23,42,0.6);

  align-items:flex-end;
  justify-content:center;

.modal-mask.show {

.modal {

.modal-handle {

.modal-title {

.toast {
  position:fixed;
  left:50%;
  bottom:calc(var(--nav-h) + var(--safe-b) + 20px);
  transform:translateX(-50%);

  background:#0f172a;
  color:#fff;
  border-radius:999px;

  font-weight:900;
  font-size:var(--fs-sm);

.toast.show {

}

.toast.s {

.toast.e {

.toast.w {

.loader {
  position:fixed;
  inset:0;

  display:none;

.spinner {

<script>
// =======================================================
// 基礎設定
// =======================================================
const API_BASE = '請改成你的 Google Apps Script Web App URL';
const LIFF_ID = '請填入你的 LIFF ID';
const ORG_NAME = '社團法人台灣帕金森病友權益促進會';

const ADMIN_TYPES = [
  '管理員',
  '理事長',
  '理監事',
  '理事',
  '監事',
  '會計',
  '出納',
  '總幹事',
  '行政秘書長'
];

const WARM_TIPS = [
  "☀️ 每天早晨喝一杯溫開水，幫助腸胃蠕動與藥物吸收喔！",
  "🌸 藥效順暢時，是做肌肉伸展與散步的好時機！",
  "💧 服藥前後請依照醫師建議安排飲食與時間。",
  "🎈 感到腳步卡卡時，可試著跟著節奏 1-2-1-2 跨出去。",
  "❤️ 紀錄不是為了擔心病情，而是為了幫助醫師了解生活狀況。",
  "🗣️ 每天大聲發聲練習，有助維持說話自信。"
];

const APP = {
  user:null,
  page:'home',
  history:[],
  _params:{},
  liffReady:false,
  liffProfile:null,
  homeIndex:null
};

let currentTipIndex = 0;
let isSpeakingTip = false;
let isTremorMode = false;

// =======================================================
// 工具函式
// =======================================================
function $(id){
  return document.getElementById(id);
}

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function jsStr(s){
  return String(s == null ? '' : s)
    .replace(/\\/g,'\\\\')
    .replace(/'/g,"\\'")
    .replace(/\n/g,'\\n')
    .replace(/\r/g,'');
}

function fmtDate(d){
  if(!d) return '--';

  try{
    const dt = new Date(d);
    if(isNaN(dt.getTime())) return String(d);

    return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
  }catch(e){
    return String(d);
  }
}

function today(){
  const d = new Date();

  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function setMain(html){
  $('main').innerHTML = html;
  window.scrollTo(0,0);
  $('main').focus();
}

function openModal(html){
  $('modal').innerHTML = '<div class="modal-handle"></div>' + html;
  $('modalMask').classList.add('show');
}

function closeModal(){
  $('modalMask').classList.remove('show');
  $('modal').innerHTML = '';
}

function maskClose(e){
  if(e.target.id === 'modalMask') closeModal();
}

function toast(msg,type){
  const el = $('toast');
  el.textContent = msg || '';
  el.className = 'toast show ' + (type || '');

  clearTimeout(window.__tt);
  window.__tt = setTimeout(()=>{
    el.className = 'toast';
  },3000);
}

function showLoad(){
  $('loader').style.display = 'flex';
}

function hideLoad(){
  $('loader').style.display = 'none';
}

function requireInput(id,label){
  const el = $(id);
  const v = el ? el.value.trim() : '';

  if(!v){
    toast('請填寫：' + label,'e');
    el?.focus();

// API
// =======================================================
async function api(action,data = {}){
  const payload = {
    action,
    data:{
      ...data,
      operatorLineId: APP.user?.lineId || APP.liffProfile?.userId || '',
      operator: APP.user?.name || '',
      operatorId: APP.user?.memberId || ''
    }
  };

  const res = await fetch(API_BASE,{
    method:'POST',
    mode:'cors',
    redirect:'follow',
    headers:{
      'Content-Type':'text/plain;charset=utf-8'
    },
    body:JSON.stringify(payload)
  });

  if(!res.ok) throw new Error('API 錯誤 ' + res.status);

  return JSON.parse(await res.text());
}

async function runApi(action,data = {},onSuccess){
  showLoad();

  try{
    const res = await api(action,data);
    hideLoad();

    if(res.success){
      if(onSuccess) onSuccess(res);
    }else{
      toast(res.message || '操作失敗','e');
    }

    return res;
  }catch(e){
    hideLoad();
    toast('連線失敗：' + e.message,'e');
    return {success:false};
  }
}

const ROUTES = {
  home:renderHome,
  healthCenter:renderHealthCenter,
  forumHome:renderForumHome,
  memberCenter:renderMemberCenter,
  myPayments:renderMyPayments,
  myDonations:renderMyDonations,
  adminHome:renderAdminHome
};

function go(page,params = {},push = true){
  if(push && APP.page && APP.page !== page){
    APP.history.push({
      page:APP.page,
      params:APP._params || {}
    });
  }

  APP.page = page;
  APP._params = params || {};

  document.querySelectorAll('.nitem').forEach(el=>el.classList.remove('active'));

  if(page === 'home'){
    $('navHome').classList.add('active');
  }

  if(page === 'adminHome'){
    $('navAdmin')?.classList.remove('hide');
    $('navAdmin')?.classList.add('active');
  }

  showBack(APP.history.length > 0);

  const fn = ROUTES[page];
  if(fn) fn(params || {});
}

function goBack(){
  if(!APP.history.length) return;

  const prev = APP.history.pop();

  APP.page = prev.page;
  APP._params = prev.params || {};

  document.querySelectorAll('.nitem').forEach(el=>el.classList.remove('active'));

  if(prev.page === 'home'){
    $('navHome').classList.add('active');
  }

  showBack(APP.history.length > 0);

  const fn = ROUTES[prev.page];
  if(fn) fn(prev.params || {});
}

function showBack(show){
  const backBtn = $('navBack');

  if(backBtn){
    if(show) backBtn.classList.remove('disabled');
    else backBtn.classList.add('disabled');
  }
}

async function initLiff(){
  try{
    if(typeof liff === 'undefined') return;

    await liff.init({liffId:LIFF_ID});

    APP.liffReady = true;

    if(liff.isLoggedIn()){
      const profile = await liff.getProfile();
      APP.liffProfile = profile;
      autoLineLogin(profile.userId);
    }
  }catch(e){
    APP.liffReady = false;
  }
}

function doLineLogin(){
  if(!APP.liffReady){
    toast('LINE 模組尚未準備就緒，請稍後再試','w');
    return;
  }

  if(!liff.isLoggedIn()){
    liff.login();
  }else{
    liff.getProfile().then(p=>{
      APP.liffProfile = p;
      autoLineLogin(p.userId);
    });
  }
}

async function autoLineLogin(lineId){
  showLoad();

  try{

    hideLoad();

      if(res.isFirstLogin){
        openLineBindForm(lineId);
      }else{
        APP.user = res.member;
        localStorage.setItem('parkUser',JSON.stringify(APP.user));
        updateLoginButton();
        toast('LINE 登入成功','s');
        go('home');
      }
    }else{
      toast(res.message || 'LINE 登入失敗','e');
    }
  }catch(e){
    hideLoad();
    toast('LINE 登入連線失敗','e');

async function loadHomeAnnouncements(){
  try{
    const res = await api('announcement.list',{target:'全部'});
    const area = $('homeAnnList');

    if(!area) return;

    if(!res.success || !res.items || !res.items.length){
      area.innerHTML = `<div class="empty">目前沒有公告</div>`;
      return;
    }

    area.innerHTML = res.items.slice(0,3).map(r=>`
      <div style="padding:14px;border:2px solid var(--border);border-radius:16px;margin-bottom:10px;background:#fff;">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;">
          ${String(r.pinned)==='Y' ? '<span class="badge bw">📌 置頂</span>' : ''}
          <span class="badge bb">${esc(r.category || '公告')}</span>
          <span style="font-size:var(--fs-xs);color:var(--muted);font-weight:800;">${esc(fmtDate(r.date))}</span>
        </div>

        <div style="font-weight:950;font-size:var(--fs-base);line-height:1.45;">
          ${esc(r.title)}
        </div>

        <div style="font-size:var(--fs-sm);margin-top:6px;white-space:pre-wrap;color:#334155;">
          ${esc(r.content)}
        </div>
      </div>
    `).join('');
  }catch(e){
    const area = $('homeAnnList');

    if(area){
      area.innerHTML = `<div class="empty">公告暫時無法載入，請稍後再試</div>`;
    }
  }

  loadHomeNews();
}

// 小舒提示朗讀
// =======================================================
function speakTip(){
  if(isSpeakingTip){
    window.speechSynthesis.cancel();
    isSpeakingTip = false;

    if($('speakTipBtn')){
      $('speakTipBtn').innerHTML = `<i class="fa-solid fa-volume-high"></i> <span>朗讀</span>`;
    }

    return;
  }

  const text = WARM_TIPS[currentTipIndex];
  const u = new SpeechSynthesisUtterance(text);

  u.lang = 'zh-TW';
  u.rate = 0.9;

  u.onend = ()=>{
    isSpeakingTip = false;

    if($('speakTipBtn')){
      $('speakTipBtn').innerHTML = `<i class="fa-solid fa-volume-high"></i> <span>朗讀</span>`;
    }
  };

  isSpeakingTip = true;

  if($('speakTipBtn')){
    $('speakTipBtn').innerHTML = `<i class="fa-solid fa-circle-stop"></i> <span>停止</span>`;
  }

  window.speechSynthesis.speak(u);
}

function nextTip(){
  window.speechSynthesis.cancel();

  isSpeakingTip = false;

  if($('speakTipBtn')){
    $('speakTipBtn').innerHTML = `<i class="fa-solid fa-volume-high"></i> <span>朗讀</span>`;
  }

  currentTipIndex = (currentTipIndex + 1) % WARM_TIPS.length;

  if($('warmTipText')){
    $('warmTipText').innerText = WARM_TIPS[currentTipIndex];
  }
}

function saveHealthRecord(){
  const payload = {
    memberId:APP.user.memberId,
    name:APP.user.name,
    date:today(),
    mood:$('healthMood').value,
    state:$('healthState').value,
    exerciseMins:Number($('healthExercise').value || 0),
    note:$('healthNote').value.trim()
  };

  runApi('health.save',payload,res=>{
    toast('健康日誌已儲存','s');
    go('home');
  });
}

function loadDoctorSummary(){
  runApi('health.getDoctorReport',{memberId:APP.user.memberId},res=>{
    const area = $('doctorSummaryArea');

    if(area){
      area.innerHTML = res.html || `<div class="empty">目前尚無足夠資料產生摘要</div>`;
    }
  });
}

async function loadForumPosts(){
  try{
    const res = await api('forum.getPosts');
    const area = $('forumPostList');

    if(!area) return;

    if(!res.success || !res.items || !res.items.length){
      area.innerHTML = `<div class="empty">目前尚無貼文，歡迎第一個分享</div>`;
      return;
    }

    area.innerHTML = res.items.map(p=>`
      <div class="news-card">
        <div class="news-tag">${esc(p.category || '經驗分享')}</div>
        <div class="news-title">${esc(p.title)}</div>
        <div class="news-desc">
          ${esc(p.author || '病友')} ｜ ${esc(fmtDate(p.createdAt))}
        </div>
        <div style="margin-top:8px;white-space:pre-wrap;font-size:var(--fs-sm);">
          ${esc(p.content)}
        </div>
      </div>
    `).join('');
  }catch(e){
    const area = $('forumPostList');
    if(area) area.innerHTML = `<div class="empty">貼文載入失敗</div>`;
  }

  loadPublicPosts();
}

async function loadPublicPosts(){
  try{
    const res = await api('forum.getPublicPosts');
    const area = $('forumPublicList');

    if(!area) return;

    if(!res.success || !res.items || !res.items.length){
      area.innerHTML = `<div class="empty">目前尚無公益活動資訊</div>`;
      return;
    }

    area.innerHTML = res.items.map(p=>`
      <div class="news-card">
        <div class="news-tag">公益</div>
        <div class="news-title">${esc(p.title)}</div>
        <div class="news-desc">${esc(p.content)}</div>

    `).join('');
  }catch(e){
    const area = $('forumPublicList');
    if(area) area.innerHTML = `<div class="empty">公益資訊載入失敗</div>`;
  }
}

function submitForumPost(){
  const title = requireInput('postTitle','分享標題');
  const content = requireInput('postContent','分享內容');

  if(!title || !content) return;

  runApi('forum.addPost',{
    category:'經驗分享',
    title,
    content
  },res=>{
    toast('貼文已發表','s');
    renderForumHome();
  });
}
