<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  if (q.get('view')) { try { localStorage.setItem('view', q.get('view')); } catch (e) {} }
  if (/liff\.state|[?&]code=|access_token|id_token/.test(location.search + location.hash)) return;
  var pref = null; try { pref = localStorage.getItem('view'); } catch (e) {}
  var want = pref || (innerWidth >= 900 ? 'd' : 'm');
  if (want === 'm') location.replace('index.html' + location.hash);
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台灣帕金森病友權益促進會</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
:root{--main:#1d5f80;--dark:#0f3d54;--accent:#ffb02e;--bg:#f4f7f9;--line:#c9d6de;--text:#1a1a1a;--fs:18px}
body.hc{--main:#003a5c;--dark:#000;--bg:#fff;--text:#000;--line:#000;--accent:#ffd400}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--text);background:var(--bg);line-height:1.7}
a{color:var(--main)}
header{background:var(--dark);color:#fff;position:sticky;top:0;z-index:20}
.nav{max-width:1180px;margin:auto;display:flex;align-items:center;gap:4px;padding:0 16px;min-height:60px;flex-wrap:wrap}
.nav .logo{font-weight:800;font-size:1.05rem;margin-right:auto;color:#fff;text-decoration:none}
.nav a.l{color:#fff;text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:700;font-size:.9rem}
.nav a.l:hover,.nav a.l.on{background:#fff3}
.nav button{background:none;border:1px solid #fff8;color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-family:inherit;font-size:.85rem}
main{max-width:1180px;margin:auto;padding:20px 16px 40px;min-height:70vh}
h1{font-size:1.7rem;color:var(--dark);margin:6px 0 14px}
h2{font-size:1.25rem;color:var(--dark);margin:26px 0 10px}
.card{background:#fff;border:2px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.split{display:grid;grid-template-columns:2fr 1fr;gap:20px}
@media(max-width:900px){.g3,.g4,.split{grid-template-columns:1fr 1fr}}
.muted{color:#556;font-size:.85rem}body.hc .muted{color:#000}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:8px 20px;background:var(--accent);color:#000;border:2px solid #0002;border-radius:12px;font-weight:800;font-size:.95rem;cursor:pointer;text-decoration:none;font-family:inherit}
.btn.sec{background:var(--main);color:#fff}.btn.line{background:#06c755;color:#fff}.btn.ghost{background:#fff;color:var(--dark);border-color:var(--main)}
.btn.block{display:flex;width:100%;margin-top:8px}
.hero{background:linear-gradient(135deg,var(--main),var(--dark));color:#fff;border-radius:18px;padding:36px 32px;margin-bottom:20px}
.hero h1{color:#fff;font-size:2rem;margin:0 0 6px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:110px;background:#fff;border:2px solid var(--main);border-radius:16px;text-decoration:none;color:var(--dark);font-weight:800;text-align:center;padding:10px}
.tile span{font-size:2.2rem}.tile small{font-weight:400;color:#556;font-size:.8rem}
.tile:hover{background:var(--main);color:#fff}.tile:hover small{color:#fff}
.stat{background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px;text-align:center;font-size:.85rem}
.stat b{display:block;font-size:1.7rem;color:var(--main)}body.hc .stat b{color:#000}
.tag{display:inline-block;background:#e3f0f6;color:var(--dark);border-radius:20px;padding:0 10px;font-size:.78rem;font-weight:700;margin-right:6px}
body.hc .tag{background:#000;color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chips button{min-height:40px;padding:0 16px;border-radius:22px;border:2px solid var(--main);background:#fff;font-weight:700;cursor:pointer;font-family:inherit}
.chips button.on{background:var(--main);color:#fff}
.row{display:block;text-decoration:none;color:var(--text);background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;font-weight:700}
.row:hover{border-color:var(--main)}
label{display:block;font-weight:800;margin-top:12px}
input,select,textarea{width:100%;min-height:46px;padding:8px 12px;font-size:1rem;border:2px solid var(--main);border-radius:10px;margin:4px 0;font-family:inherit;background:#fff;color:#000}
input[type=checkbox]{width:22px;min-height:22px;margin:0 8px 0 0;vertical-align:middle}
.sum{background:#fff8e6;border:2px dashed var(--accent);border-radius:12px;padding:12px}
.readbox{white-space:pre-wrap;line-height:1.9}
img.cover{width:100%;max-height:340px;object-fit:cover;border-radius:12px;display:block;margin-bottom:10px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts label{display:flex;align-items:center;margin:0;font-weight:700;border:2px solid var(--main);border-radius:10px;padding:8px 14px;cursor:pointer}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:12px 24px;border-radius:12px;display:none;z-index:99;font-weight:700}
footer{background:var(--dark);color:#cfe;padding:24px 16px;text-align:center;font-size:.85rem}
footer a{color:#fff}
</style>
</head>
<body>
<header><div class="nav" id="nav"></div></header>
<main id="app">載入中…</main>
<footer id="foot"></footer>
<div id="toast"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxzl3ScUnfUSAqkfSNXLdGlhTWEcsAjsgOWZgsBqSKgEWm0UNSSmDfFAWixCbkWgnIf/exec';   // ← 請改成您最新部署的網址
const LIFF_ID = '2009456572-588gzru4';
const OA_ID = '@你的官方帳號ID';   // ← LINE 官方帳號 Basic ID

let idToken = null, me = null, CFG = {}, isFriend = null;

/* ========== API ========== */
async function api(action, params = {}) {
  if (!API_URL) return demo(action, params);
  const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, params, idToken }) });
  const j = await res.json();
  if (!j.ok) {
    if (/過期|請先登入/.test(j.message || '') && LIFF_ID && liff.isLoggedIn()) {
      toast('登入已過期，重新登入中…'); setTimeout(() => { liff.logout(); liff.login({ redirectUri: location.href }); }, 1200);
    }
    throw new Error(j.message || '發生錯誤，請稍後再試');
  }
  return j.data;
}

/* ========== LIFF ========== */
async function initLiff() {
  if (!LIFF_ID) return;
  try {
    await liff.init({ liffId: LIFF_ID });
    if (liff.isLoggedIn()) {
      idToken = liff.getIDToken();
      const p = await liff.getProfile();
      me = await api('login', { displayName: p.displayName, pictureUrl: p.pictureUrl });
      try { isFriend = (await liff.getFriendship()).friendFlag; } catch (e) {}
    }
  } catch (e) { console.error(e); }
}
function login() {
  if (!LIFF_ID) { me = {userId:'demo',displayName:'示範會員',name:'王小明',phone:'0912345678',email:'',city:'台北市',identity:'病友',status:'啟用'}; toast('示範模式：已登入'); route(); return; }
  liff.login({ redirectUri: location.href });
}
function logout() { if (LIFF_ID) liff.logout(); me = null; location.hash = '#/home'; location.reload(); }
function needLogin() { if (me) return false; toast('請先用 LINE 登入'); go('member'); return true; }

/* ========== 工具 ========== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtD = d => d ? String(d).slice(0, 10) : '';
const enc = encodeURIComponent;
const driveImg = id => id ? `https://drive.google.com/thumbnail?id=${id}&sz=w1200` : '';
const telNo = () => (CFG.phone || '').replace(/[^\d+]/g, '');
let tt; function toast(m) { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(tt); tt = setTimeout(() => t.style.display = 'none', 3000); }
async function safe(fn) { try { await fn(); } catch (e) { toast(e.message); } }
function go(p) { location.hash = '#/' + p; }
const LS = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const SIZES = [16, 18, 21];
function setFs(i) { LS.set('fs', i); document.documentElement.style.setProperty('--fs', SIZES[i] + 'px'); }
function cycleFs() { const i = (Number(LS.get('fs', 1)) + 1) % 3; setFs(i); toast('字級：' + ['標準', '大', '特大'][i]); }
function toggleHC() { const on = !document.body.classList.contains('hc'); document.body.classList.toggle('hc', on); LS.set('hc', on ? 1 : 0); }
setFs(Number(LS.get('fs', 1))); if (LS.get('hc', 0) == 1) document.body.classList.add('hc');

function speak(text) {
  if (!('speechSynthesis' in window)) return toast('此瀏覽器不支援朗讀');
  speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'zh-TW'; u.rate = .9; speechSynthesis.speak(u);
}
window.speakEl = id => speak($('#' + id).innerText);
window.stopSpeak = () => { try { speechSynthesis.cancel(); } catch (e) {} };
const readBtns = id => `<p><button class="btn ghost" onclick="speakEl('${id}')">🔊 朗讀</button> <button class="btn ghost" onclick="stopSpeak()">⏹ 停止</button></p>`;

/* ========== 報到 QR（會員出示） ========== */
window.showQR = id => safe(async () => {
  const d = await api('getCheckinCode', { id });
  const o = document.createElement('div');
  o.id = 'qrov';
  o.style.cssText = 'position:fixed;inset:0;background:#000d;z-index:200;display:flex;align-items:center;justify-content:center;padding:16px';
  o.innerHTML = `<div style="background:#fff;border-radius:20px;padding:24px;text-align:center;max-width:360px;width:100%;color:#000">
    <h3 style="margin:0 0 4px">${esc(d.title)}</h3><div style="margin-bottom:10px">${esc(d.name)}　共 ${d.people} 人</div>
    <div id="qrbox" style="display:inline-block;padding:10px;background:#fff"></div>
    <p style="font-weight:700">${d.status === '已出席' ? '✅ 已完成簽到' : '請出示給工作人員掃描'}</p>
    <button class="btn block" onclick="document.getElementById('qrov').remove()">關閉</button></div>`;
  document.body.appendChild(o);
  new QRCode($('#qrbox'), { text: d.code, width: 240, height: 240, correctLevel: QRCode.CorrectLevel.M });
});

/* ========== 版面與路由 ========== */
const MENU = [['home','首頁'],['news','最新消息'],['edu','衛教權益'],['events','活動報名'],['forum','病友論壇'],['donate','捐款支持'],['about','關於協會'],['member','會員中心']];
const GROUP = { newsdetail:'news', eventdetail:'events', reg:'events', post:'forum', newpost:'forum' };
function drawChrome(active) {
  $('#nav').innerHTML = `<a class="logo" href="#/home">🎗️ 台灣帕金森病友權益促進會</a>
    ${MENU.map(([k, n]) => `<a class="l ${k === active ? 'on' : ''}" href="#/${k}">${n}</a>`).join('')}
    <button onclick="cycleFs()" title="調整字級">🔠 字級</button><button onclick="toggleHC();route()">◐ 對比</button>
    <button onclick="LS.set('view','m');location.href='index.html?view=m'">📱 手機版</button>`;
  $('#foot').innerHTML = `${esc(CFG.slogan || '')}<br>📞 ${esc(CFG.phone || '')}　✉️ ${esc(CFG.email || '')}　📍 ${esc(CFG.address || '')}<br>
    <span style="opacity:.8">您的個人資料僅用於協會服務，不會提供給第三方。</span>`;
}
async function route() {
  const parts = (location.hash.slice(2) || 'home').split('/');
  const p = parts[0] || 'home', arg = parts[1] ? decodeURIComponent(parts[1]) : undefined;
  drawChrome(GROUP[p] || p);
  $('#app').innerHTML = '<p>載入中…</p>'; scrollTo(0, 0); stopSpeak();
  await safe(async () => { await (PAGES[p] || PAGES.home)(arg); });
}

/* ========== 頁面 ========== */
const PAGES = {};
const newsRow = n => `<a class="row" href="#/newsdetail/${enc(n.id)}"><span class="tag">${esc(n.category)}</span><span class="muted">${fmtD(n.publishDate)}</span><div>${esc(n.title)}</div></a>`;
const eventCard = e => `<div class="card">${e.coverId ? `<img class="cover" src="${driveImg(e.coverId)}" alt="">` : ''}
  <h3 style="margin:0">${esc(e.title)}</h3><div class="muted">📅 ${fmtD(e.date)}　📍 ${esc(e.location)}　剩餘名額 <b>${e.remaining ?? '-'}</b></div>
  <a class="btn sec" style="margin-top:8px" href="#/eventdetail/${enc(e.id)}">詳情與報名</a></div>`;

PAGES.home = async () => {
  const d = await api('getHome'), s = d.stats || {};
  $('#app').innerHTML = `
  <div class="hero"><h1>${esc(CFG.slogan || '陪伴每一位帕友，守護尊嚴與權益')}</h1><p style="margin:0 0 14px">資訊・互助・倡議，我們一起走。</p>
    <a class="btn" href="#/events">📅 看活動</a> <a class="btn ghost" href="#/donate">❤️ 捐款支持</a></div>
  <h2 style="margin-top:0">您是哪一種身分？</h2>
  <div class="g4">
    <a class="tile" href="#/edu/${enc('疾病認識')}"><span>🆕</span>剛確診<small>認識疾病，從這開始</small></a>
    <a class="tile" href="#/edu/${enc('權益')}"><span>🧑‍🦳</span>病友本人<small>權益與補助</small></a>
    <a class="tile" href="#/edu/${enc('照顧者')}"><span>👨‍👩‍👧</span>家屬照顧者<small>照顧與喘息</small></a>
    <a class="tile" href="#/donate"><span>🤝</span>想幫忙<small>捐款・志工</small></a>
  </div>
  <div class="split"><div>
    <h2>📰 最新消息</h2>${(d.news || []).map(newsRow).join('') || '<p class="muted">尚無消息</p>'}
    <h2>📅 近期活動</h2><div class="g2">${(d.events || []).slice(0, 2).map(eventCard).join('') || '<p class="muted">近期沒有活動</p>'}</div>
  </div><div>
    <h2>📊 協會努力成果</h2>
    <div class="g2">
      <div class="stat"><b>${s.members ?? 0}</b>會員人數</div><div class="stat"><b>${s.events ?? 0}</b>舉辦活動</div>
      <div class="stat"><b>${s.participants ?? 0}</b>參與人次</div><div class="stat"><b>${s.groups ?? 0}</b>全台據點</div>
      <div class="stat"><b>${s.resources ?? 0}</b>衛教資源</div><div class="stat"><b>${s.posts ?? 0}</b>論壇討論</div>
      <div class="stat"><b>${s.volunteers ?? 0}</b>志工夥伴</div><div class="stat"><b>${Number(s.donation ?? 0).toLocaleString()}</b>累計善款(元)</div>
    </div></div></div>`;
};

let newsCat = '全部';
PAGES.news = async () => {
  const list = await api('getNews', {});
  const cats = ['全部', ...new Set(list.map(n => n.category))];
  window._nr = () => {
    $('#app').innerHTML = `<h1>最新消息</h1><div class="chips">${cats.map(c => `<button class="${c === newsCat ? 'on' : ''}" onclick="newsCat='${esc(c)}';_nr()">${esc(c)}</button>`).join('')}</div>
    ${list.filter(n => newsCat === '全部' || n.category === newsCat).map(newsRow).join('') || '<p>目前沒有消息</p>'}`;
  }; _nr();
};
PAGES.newsdetail = async id => {
  const n = await api('getNewsDetail', { id });
  $('#app').innerHTML = `<p><a href="#/news">← 回消息列表</a></p><h1>${esc(n.title)}</h1><p><span class="tag">${esc(n.category)}</span><span class="muted">${fmtD(n.publishDate)}</span></p>
  ${n.coverId ? `<img class="cover" src="${driveImg(n.coverId)}" alt="">` : ''}
  <div class="card readbox" id="nc">${esc(n.content)}</div>${readBtns('nc')}
  ${n.attachUrl ? `<a class="btn sec" href="${esc(n.attachUrl)}" target="_blank" rel="noopener">📎 下載附件</a>` : ''}`;
};

const CAT_ICON = { '疾病認識': '🧠', '運動復健': '🏃', '權益': '⚖️', '照顧者': '🤝', '藥物': '💊', '飲食': '🍚' };
PAGES.edu = async cat => {
  const list = await api('getResources', {});
  const cats = ['全部', ...new Set(list.map(r => r.category))];
  cat = cat || '全部';
  const ico = { pdf: '📄', video: '🎬', article: '📰', link: '🔗' };
  $('#app').innerHTML = `<h1>衛教與權益資源</h1>
  <div class="chips">${cats.map(c => `<button class="${c === cat ? 'on' : ''}" onclick="go('edu/${enc(c)}')">${CAT_ICON[c] || ''} ${esc(c)}</button>`).join('')}</div>
  <div class="g3">${list.filter(r => cat === '全部' || r.category === cat).map(r => `<div class="card"><span class="tag">${ico[r.type] || ''} ${esc(r.type)}</span><span class="tag">${esc(r.category)}</span>
    <h3 style="margin:8px 0 4px">${esc(r.title)}</h3><p class="muted">${esc(r.description)}</p><a class="btn sec" href="${esc(r.url)}" target="_blank" rel="noopener">開啟閱讀</a></div>`).join('') || '<p>此分類尚無資料</p>'}</div>`;
};

PAGES.forum = async () => {
  const list = await api('getForumPosts', {});
  $('#app').innerHTML = `<h1>病友論壇</h1><div class="card" style="background:#fff8e6">請互相尊重，勿張貼個人隱私與醫療廣告。<b>本論壇不提供醫療診斷或用藥建議，請諮詢您的醫師。</b>文章經審核後顯示。</div>
  <a class="btn" href="#/newpost">✏️ 我要發問／分享</a><div style="margin-top:14px">
  ${list.map(p => `<a class="row" href="#/post/${enc(p.id)}"><span class="tag">${esc(p.board)}</span><span class="muted">${esc(p.authorName)}・${fmtD(p.createdAt)}・💬${p.replyCount || 0}</span><div>${esc(p.title)}</div></a>`).join('') || '<p>尚無討論</p>'}</div>`;
};
PAGES.newpost = async () => {
  if (needLogin()) return;
  $('#app').innerHTML = `<p><a href="#/forum">← 回論壇</a></p><h1>我要發問／分享</h1><div class="card" style="max-width:720px">
    <label>討論區</label><select id="pb">${['新病友提問', '藥物與治療', '運動復健', '照顧者交流', '生活分享'].map(b => `<option>${b}</option>`).join('')}</select>
    <label>標題</label><input id="pt"><label>內容</label><textarea id="pc" rows="8"></textarea>
    <p class="muted">送出後由管理員審核，通過才會顯示。</p>
    <button class="btn" onclick="submitPost()">✅ 送出</button></div>`;
};
window.submitPost = () => safe(async () => {
  const t = $('#pt').value.trim(), c = $('#pc').value.trim(); if (!t || !c) throw new Error('請填寫標題與內容');
  await api('createPost', { board: $('#pb').value, title: t, content: c }); toast('已送出，審核通過後顯示'); go('forum');
});
PAGES.post = async id => {
  const d = await api('getForumPost', { id });
  $('#app').innerHTML = `<p><a href="#/forum">← 回論壇</a></p><h1>${esc(d.post.title)}</h1><p><span class="tag">${esc(d.post.board)}</span><span class="muted">${esc(d.post.authorName)}・${fmtD(d.post.createdAt)}</span></p>
  <div class="card readbox" id="pcn">${esc(d.post.content)}</div>${readBtns('pcn')}
  <h2>回覆（${d.replies.length}）</h2>
  ${d.replies.map(r => `<div class="card"><b>${esc(r.authorName)}</b> <span class="muted">${fmtD(r.createdAt)}</span><br>${esc(r.content)}</div>`).join('')}
  <div class="card"><textarea id="rc" rows="3" placeholder="寫下您的回覆…"></textarea><button class="btn" onclick="sendReply('${esc(id)}')">送出回覆</button></div>`;
};
window.sendReply = id => safe(async () => { if (needLogin()) return; await api('createReply', { postId: id, content: $('#rc').value }); toast('已回覆'); route(); });

PAGES.events = async () => {
  const list = await api('getEvents', {});
  $('#app').innerHTML = `<h1>活動報名</h1><div class="g2">${list.map(eventCard).join('') || '<p>目前沒有活動</p>'}</div>`;
};
PAGES.eventdetail = async id => {
  const e = await api('getEventDetail', { id });
  $('#app').innerHTML = `<p><a href="#/events">← 回活動列表</a></p><div class="split"><div>${e.coverId ? `<img class="cover" src="${driveImg(e.coverId)}" alt="">` : ''}
    <h1>${esc(e.title)}</h1><div class="card readbox" id="ed">${esc(e.description)}</div>${readBtns('ed')}</div>
    <div><div class="card">📅 <b>${fmtD(e.date)}</b><br>📍 ${esc(e.location)}<br>👥 名額 ${e.capacity}，<b>剩餘 ${e.remaining}</b><br>⏰ 報名截止：${fmtD(e.deadline)}
    ${e.remaining > 0 ? `<a class="btn block" href="#/reg/${enc(e.id)}">✅ 我要報名</a>` : '<p><b>名額已滿</b></p>'}</div></div></div>`;
};
PAGES.reg = async id => {
  if (!me) { $('#app').innerHTML = `<h1>報名需先登入</h1><button class="btn line" onclick="login()">使用 LINE 登入</button>`; return; }
  const e = await api('getEventDetail', { id });
  $('#app').innerHTML = `<p><a href="#/eventdetail/${enc(id)}">← 回活動</a></p><h1>活動報名</h1><div class="card" style="max-width:640px">
    <div class="sum"><b>${esc(e.title)}</b><br>${fmtD(e.date)}・${esc(e.location)}</div>
    <label>姓名</label><input id="rn" value="${esc(me.name || me.displayName || '')}">
    <label>電話</label><input id="rp" type="tel" value="${esc(me.phone || '')}">
    <label>同行人數（不含本人）</label><select id="rc">${[0, 1, 2, 3, 4, 5].map(n => `<option value="${n}">${n}</option>`).join('')}</select>
    <label>特殊需求（輪椅、飲食等，可不填）</label><textarea id="rm" rows="3"></textarea>
    <button class="btn block" onclick="submitReg('${esc(id)}')">✅ 確認報名</button></div>`;
};
window.submitReg = id => safe(async () => {
  const name = $('#rn').value.trim(), phone = $('#rp').value.trim(); if (!name || !phone) throw new Error('請填姓名與電話');
  await api('registerEvent', { eventId: id, name, phone, companions: $('#rc').value, note: $('#rm').value }); toast('報名成功！'); go('member');
});

PAGES.donate = async () => {
  if (needLogin()) return;
  $('#app').innerHTML = `<h1>❤️ 捐款支持</h1><div class="split"><div class="card">
    <label>捐款金額（NT$）</label><div class="opts" id="amts">${[300, 500, 1000, 3000].map(a => `<label><input type="radio" name="am" value="${a}" ${a === 500 ? 'checked' : ''} onchange="$('#ca').value=''">${a}</label>`).join('')}</div>
    <input id="ca" type="number" placeholder="或自行輸入金額">
    <label>捐款方式</label><select id="dm"><option>銀行轉帳／ATM</option><option>郵政劃撥</option><option>信用卡（另行提供連結）</option></select>
    <label>您的姓名</label><input id="dn" value="${esc(me?.name || '')}"><label>Email</label><input id="de" type="email" value="${esc(me?.email || '')}">
    <label><input type="checkbox" id="dr" onchange="$('#rbox').style.display=this.checked?'block':'none'">需要開立收據</label>
    <div id="rbox" style="display:none"><label>收據抬頭</label><input id="rt"><label>身分證字號／統編</label><input id="tx"><label>寄送地址</label><input id="ad"></div>
    <label><input type="checkbox" id="dp">我同意協會依個資法使用以上資料</label>
    <button class="btn block" onclick="submitDonate()">✅ 送出登記</button></div>
    <div class="card"><h3 style="margin-top:0">匯款資訊</h3>${esc(CFG.bankInfo || '')}<p class="muted">送出登記後，請依帳號匯款。協會確認收款後會以 LINE 通知您。</p></div></div>`;
};
window.submitDonate = () => safe(async () => {
  const amount = Number($('#ca').value) || Number((document.querySelector('input[name=am]:checked') || {}).value);
  if (!(amount > 0)) throw new Error('請選擇或輸入金額');
  if (!$('#dn').value.trim()) throw new Error('請填姓名');
  if (!$('#dp').checked) throw new Error('請勾選同意個資使用');
  const need = $('#dr').checked; if (need && (!$('#rt').value || !$('#ad').value)) throw new Error('請填寫收據抬頭與地址');
  const r = await api('createDonation', { amount, method: $('#dm').value, name: $('#dn').value, email: $('#de').value,
    receiptNeeded: need, receiptTitle: $('#rt').value, taxId: $('#tx').value, address: $('#ad').value });
  $('#app').innerHTML = `<h1>❤️ 感謝您！</h1><div class="card">登記編號：<b>${esc(r.id || '')}</b><br><br>請依下列帳號完成匯款：<br><b>${esc(CFG.bankInfo || '')}</b></div><a class="btn" href="#/home">回首頁</a>`;
});

    <h2>宗旨與願景</h2><div class="card readbox">${esc(a.mission)}</div>
    <h2>理監事</h2><div class="g3">${(a.board || []).map(b => `<div class="stat"><b style="font-size:1.1rem">${esc(b.name)}</b>${esc(b.title)}</div>`).join('')}</div></div>
    <div><h2 style="margin-top:0">文件下載</h2>${(a.docs || []).map(d => `<a class="row" href="${esc(d.url)}" target="_blank" rel="noopener">📄 ${esc(d.title)}</a>`).join('') || '<p class="muted">尚無文件</p>'}
    <h2>聯絡我們</h2><div class="card">📞 ${esc(CFG.phone || '')}<br>✉️ ${esc(CFG.email || '')}<br>📍 ${esc(CFG.address || '')}</div></div></div>`;
};

PAGES.member = async () => {
  if (!me) {
    $('#app').innerHTML = `<h1>會員中心</h1><div class="card" style="max-width:520px">用 LINE 登入，就能報名活動、查看紀錄、修改資料。不用另外記帳號密碼。<button class="btn line block" onclick="login()">💚 使用 LINE 登入</button></div>`; return;
  }
  const d = await api('getMyData'), m = d.profile || me;
  $('#app').innerHTML = `<h1>會員中心</h1>
  <div class="card" style="display:flex;gap:14px;align-items:center">${m.pictureUrl ? `<img src="${esc(m.pictureUrl)}" width="64" height="64" style="border-radius:50%" alt="">` : '<span style="font-size:2.5rem">👤</span>'}
    <div><b>${esc(m.displayName)}</b><br><span class="tag">${esc(m.status || '待審')}</span><span class="tag">${esc(m.identity || '')}</span><span class="muted">會籍到期：${fmtD(m.expireDate) || '—'}</span></div>
    <button class="btn ghost" style="margin-left:auto" onclick="logout()">登出</button></div>
  ${isFriend === false ? `<div class="card" style="border-color:#06c755"><b>📩 想收到報名與活動提醒嗎？</b> 請加入協會 LINE 官方帳號為好友。
    <a class="btn line" href="https://line.me/R/ti/p/${enc(OA_ID)}" target="_blank" rel="noopener">加入好友</a></div>` : ''}
  <div class="split"><div>
    <h2 style="margin-top:0">📅 我的活動</h2>${(d.registrations || []).map(r => `<div class="card"><b>${esc(r.eventTitle)}</b>　${fmtD(r.eventDate)} <span class="tag">${esc(r.status)}</span><br>
      ${r.status === '已報名' || r.status === '已出席' ? `<button class="btn sec" onclick="showQR('${esc(r.id)}')">📲 報到 QR</button> ` : ''}
      ${r.status === '已報名' ? `<button class="btn ghost" onclick="cancelReg('${esc(r.id)}')">取消報名</button>` : ''}</div>`).join('') || '<p class="muted">尚無報名紀錄</p>'}
    <h2>❤️ 我的捐款</h2>${(d.donations || []).map(r => `<div class="card">${fmtD(r.createdAt)}　NT$ ${r.amount} <span class="tag">${esc(r.status)}</span></div>`).join('') || '<p class="muted">尚無紀錄</p>'}
  </div><div><h2 style="margin-top:0">📝 個人資料</h2><div class="card">
    <label>姓名</label><input id="pn" value="${esc(m.name || '')}"><label>電話</label><input id="pp" type="tel" value="${esc(m.phone || '')}">
    <label>Email</label><input id="pe" type="email" value="${esc(m.email || '')}"><label>居住縣市</label><input id="pc" value="${esc(m.city || '')}">
    <label>身分</label><select id="pi">${['病友', '家屬／照顧者', '志工', '醫護人員', '一般民眾'].map(i => `<option ${m.identity === i ? 'selected' : ''}>${i}</option>`).join('')}</select>
    <button class="btn block" onclick="saveProfile()">💾 儲存資料</button></div></div></div>`;
};
window.saveProfile = () => safe(async () => { me = await api('updateProfile', { name: $('#pn').value, phone: $('#pp').value, email: $('#pe').value, city: $('#pc').value, identity: $('#pi').value }); toast('✅ 已儲存'); });
window.cancelReg = id => safe(async () => { if (!confirm('確定要取消報名嗎？')) return; await api('cancelRegistration', { id }); toast('已取消'); route(); });
