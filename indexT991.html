<script>
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function jsStr(s){return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n').replace(/\r/g,'');}

function fmtMoney(n){
  const val = Number(n||0);
  if (val < 0) return '-NT$' + Math.abs(val).toLocaleString('zh-TW');
  return 'NT$'+val.toLocaleString('zh-TW');
}
function fmtDate(d){
  if(!d)return'--';
  try{
    const dt=new Date(d);
    if(isNaN(dt.getTime()))return String(d);
    return`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
  }catch(e){return String(d);}
}
function today(){
  const d=new Date();
  return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function yearOptions(sel){
  const y=new Date().getFullYear();
  const s=Number(sel||y);
  return[y+1,y,y-1,y-2].map(v=>`<option value="${v}"${v===s?' selected':''}>${v} 年</option>`).join('');
}
function monthOptions(sel){
  const s=sel?Number(sel):'';
  return`<option value="">全年</option>${Array.from({length:12}).map((_,i)=>{const v=i+1;return`<option value="${v}"${v===s?' selected':''}>${v} 月</option>`;}).join('')}`;
}
function showLoad(){$('loader').classList.add('show');}

function cleanupAudioAndTimers() {
  try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch(e) {}
  isSpeakingTip = false;

  try {
    if (speechRecognitionInstance) {
      speechRecognitionInstance.onstart = null;
      speechRecognitionInstance.onend = null;
      speechRecognitionInstance.onerror = null;
      speechRecognitionInstance.onresult = null;
      speechRecognitionInstance.stop();
    }
  } catch(e) {}
  speechRecognitionInstance = null;
  isListening = false;

  if (tapTimer) {
    clearInterval(tapTimer);
    tapTimer = null;
  }
  tapTestActive = false;

  if (metronomeInterval) {
    clearInterval(metronomeInterval);
    metronomeInterval = null;
  }
  metronomeActive = false;
  if (metronomeAudioCtx) {
    try { metronomeAudioCtx.close(); } catch(e) {}
    metronomeAudioCtx = null;
  }

  if (vocalTimer) {
    clearInterval(vocalTimer);
    vocalTimer = null;
  }
  if (vocalAudioCtx) {
    try {
      vocalAudioCtx.stream?.getTracks?.().forEach(t => t.stop());
      vocalAudioCtx.audioCtx?.close?.();
    } catch(e) {}
    vocalAudioCtx = null;
  }
  vocalTesting = false;
}

async function getFileData(fileInputId) {
  const input = $(fileInputId);
  if (!input || !input.files || input.files.length === 0) return null;
  const file = input.files[0];
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = function(e) {
      resolve({
        base64: e.target.result.split(',')[1],
        filename: file.name,
        mimeType: file.type
      });
    };
    reader.readAsDataURL(file);
  });
}

    body:JSON.stringify(payload)
  });
  if(!res.ok) throw new Error('API 錯誤 ' + res.status);
  return JSON.parse(await res.text());
}

    page==='adminHome' || page.startsWith('member') || page.startsWith('finance') ||

function go(page,params={},push=true){
  closePrint();
  closeModal();
  cleanupAudioAndTimers();

  if(push && APP.page && APP.page !== page){
    APP.history.push({page:APP.page,params:APP._params||{}});
  }
  APP.page = page;
  APP._params = params || {};
  updateNavActive(page);
  showBack(APP.history.length > 0);

  const fn = ROUTES[page];
  if (typeof fn === 'function') {
    fn(params || {});
  } else {
    toast('找不到頁面：' + page, 'e');
    APP.page = 'home';
    APP._params = {};
    updateNavActive('home');
    renderHome();
  }
}

function goBack(){
  closePrint();
  closeModal();
  cleanupAudioAndTimers();

  if(!APP.history.length) return;
  const prev = APP.history.pop();
  APP.page = prev.page;
  APP._params = prev.params || {};
  updateNavActive(prev.page);
  showBack(APP.history.length > 0);

  const fn = ROUTES[prev.page];
  if (typeof fn === 'function') fn(prev.params || {});
  else renderHome();
}

function setFontSize(size){

  body.classList.remove('fs-medium', 'fs-large', 'fs-xlarge');

  else if (size === 'large') body.classList.add('fs-large');
  else if (size === 'xlarge') body.classList.add('fs-xlarge');
  localStorage.setItem('parkFontSize', size);
}
function loadFontSize(){

async function loadHomeAnnouncements(){
  const area = $('homeAnnList');

function nextTip() {

function speakTip() {
  if (!('speechSynthesis' in window)) {
    toast('⚠️ 您的瀏覽器不支援語音合成朗讀', 'e');
    return;
  }
  const btn = $('speakTipBtn');
  if (isSpeakingTip) {
    window.speechSynthesis.cancel();
    isSpeakingTip = false;
    if (btn) btn.innerHTML = '<i class="fa-solid fa-volume-high"></i> <span>朗讀</span>';
    return;
  }

  const text = WARM_TIPS[currentTipIndex].replace(/[\u{1F300}-\u{1FAFF}]/gu, '');
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'zh-TW';
  utterance.rate = 0.85;
  utterance.onend = utterance.onerror = () => {
    isSpeakingTip = false;
    if (btn) btn.innerHTML = '<i class="fa-solid fa-volume-high"></i> <span>朗讀</span>';
  };

  isSpeakingTip = true;
  if (btn) btn.innerHTML = '<i class="fa-solid fa-circle-stop text-red-500"></i> <span>停止</span>';
  window.speechSynthesis.speak(utterance);
}

async function processVoiceAI() {
  const input = $('voiceInputText');

  const text = input ? input.value.trim() : '';

  if (!text) {
    toast('請先說話或輸入文字描述喔！', 'e');

  }

  isProcessingAI = true;

    statusEl.textContent = "🤖 小舒正在認真聽懂您的話語並整理中...";
    statusEl.classList.remove('hidden');
  }

  try {

function registerTap(hand) {
  if (!tapTestActive) return;
  if (hand !== lastTapHand) {
    tapCount++;
    lastTapHand = hand;
    $('tapCountVal') && ($('tapCountVal').textContent = tapCount);

    const activeBtn = hand === 'L' ? $('tapL') : $('tapR');
    const inactiveBtn = hand === 'L' ? $('tapR') : $('tapL');

    if (activeBtn) activeBtn.className = "py-8 rounded-2xl font-black text-xl bg-slate-800 text-slate-600 border-4 border-slate-700 scale-95";
    if (inactiveBtn) {
      inactiveBtn.className = hand === 'L'

        : "py-8 rounded-2xl font-black text-xl bg-teal-500 text-slate-950 border-4 border-teal-300 shadow-md";
    }

    if (navigator.vibrate) navigator.vibrate(25);
  }
}

function toggleMetronome() {
  const btn = $('metronomeBtn');
  const b1 = $('beat1');
  const b2 = $('beat2');

  if (metronomeActive) {
    if (metronomeInterval) clearInterval(metronomeInterval);
    metronomeInterval = null;
    metronomeActive = false;
    if (metronomeAudioCtx) {
      try { metronomeAudioCtx.close(); } catch(e) {}
      metronomeAudioCtx = null;
    }

    if (btn) {
      btn.className = "px-6 py-3 rounded-xl font-black bg-teal-500 text-slate-950 flex items-center gap-2 shadow";
      btn.innerHTML = '<i class="fa-solid fa-volume-high"></i> <span>啟動解凍節拍聲響</span>';
    }
    if (b1) b1.className = "w-16 h-16 rounded-full flex items-center justify-center text-lg font-black border-4 bg-slate-800 border-slate-700 text-slate-500 transition-all";
    if (b2) b2.className = "w-16 h-16 rounded-full flex items-center justify-center text-lg font-black border-4 bg-slate-800 border-slate-700 text-slate-500 transition-all";
    return;
  }

  metronomeActive = true;
  metronomeBeat = 2;
  if (btn) {
    btn.className = "px-6 py-3 rounded-xl font-black bg-rose-600 text-white flex items-center gap-2 shadow animate-pulse";
    btn.innerHTML = '<i class="fa-solid fa-circle-stop"></i> <span>停止節拍器</span>';
  }

  try {
    metronomeAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch(e) {
    metronomeAudioCtx = null;
  }

  const intervalMs = (60 / bpm) * 1000;
  metronomeInterval = setInterval(() => {
    metronomeBeat = (metronomeBeat === 1) ? 2 : 1;

    if (metronomeBeat === 1) {
      if (b1) b1.className = "w-16 h-16 rounded-full flex items-center justify-center text-lg font-black border-4 bg-rose-500 border-rose-300 text-white scale-110 shadow-lg transition-all";
      if (b2) b2.className = "w-16 h-16 rounded-full flex items-center justify-center text-lg font-black border-4 bg-slate-800 border-slate-700 text-slate-500 transition-all";
    } else {
      if (b1) b1.className = "w-16 h-16 rounded-full flex items-center justify-center text-lg font-black border-4 bg-slate-800 border-slate-700 text-slate-500 transition-all";
      if (b2) b2.className = "w-16 h-16 rounded-full flex items-center justify-center text-lg font-black border-4 bg-amber-500 border-amber-300 text-slate-950 scale-110 shadow-lg transition-all";
    }

    if (metronomeAudioCtx) {
      try {
        const osc = metronomeAudioCtx.createOscillator();
        const gain = metronomeAudioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(metronomeBeat === 1 ? 800 : 600, metronomeAudioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, metronomeAudioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, metronomeAudioCtx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(metronomeAudioCtx.destination);
        osc.start();
        osc.stop(metronomeAudioCtx.currentTime + 0.1);
      } catch (e) {}
    }

    if (navigator.vibrate) navigator.vibrate(30);
  }, intervalMs);
}

async function startVocalTest() {
  try {
    if (vocalTimer) clearInterval(vocalTimer);
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const analyser = audioCtx.createAnalyser();
    const source = audioCtx.createMediaStreamSource(stream);
    source.connect(analyser);
    analyser.fftSize = 256;

    vocalAudioCtx = { audioCtx, stream };
    vocalTesting = true;
    vocalTimeLeft = 5;
    vocalScore = 0;

    const area = $('vocalTestArea');
    area.innerHTML = `
      <div class="w-full text-center space-y-2">
        <span class="text-xs text-rose-400 font-bold">保持大聲「啊——」倒數：</span>
        <div class="text-3xl font-black text-rose-400 font-mono" id="vocalTimerVal">5 秒</div>
        <div class="w-full bg-slate-800 h-4 rounded-full overflow-hidden border border-slate-700">
          <div id="vocalVolBar" class="bg-gradient-to-r from-emerald-400 via-amber-400 to-rose-500 h-full transition-all duration-75" style="width: 0%"></div>
        </div>
        <span class="text-xs text-slate-400 font-bold">當前音量強度：<span id="vocalVolVal">0</span> %</span>
      </div>
    `;

    const dataArray = new Uint8Array(analyser.frequencyBinCount);
    let totalVol = 0;
    let count = 0;

    const checkVolume = () => {
      if (!vocalTesting) return;
      analyser.getByteFrequencyData(dataArray);
      let sum = 0;
      for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
      const average = sum / dataArray.length;
      const volPercent = Math.min(100, Math.round((average / 128) * 100));
      $('vocalVolBar') && ($('vocalVolBar').style.width = volPercent + '%');
      $('vocalVolVal') && ($('vocalVolVal').textContent = volPercent);
      totalVol += average;
      count++;
      requestAnimationFrame(checkVolume);
    };
    requestAnimationFrame(checkVolume);

    vocalTimer = setInterval(() => {
      vocalTimeLeft--;
      $('vocalTimerVal') && ($('vocalTimerVal').textContent = vocalTimeLeft + ' 秒');
      if (vocalTimeLeft <= 0) {
        clearInterval(vocalTimer);
        vocalTimer = null;
        stopVocalTest(totalVol / (count || 1));
      }
    }, 1000);

  } catch (err) {
    toast('⚠️ 請允許麥克風權限以進行發聲測試', 'e');
  }
}

function stopVocalTest(avgVol) {
  vocalTesting = false;
  if (vocalAudioCtx) {
    try {
      vocalAudioCtx.stream.getTracks().forEach(t => t.stop());
      vocalAudioCtx.audioCtx.close();
    } catch(e) {}
    vocalAudioCtx = null;
  }
  const score = Math.max(0, Math.min(100, Math.round((avgVol / 128) * 100)));
  vocalScore = score;
  window.__lastVocalScore = score;

  const area = $('vocalTestArea');
  area.innerHTML = `
    <div class="p-3 bg-amber-100 text-amber-900 font-bold rounded-xl text-center text-sm mb-2">
      🎉 發聲測驗完成！獲得 <strong>${score}</strong> 分響亮指數！
    </div>
    <button onclick="startVocalTest()" class="px-6 py-3 bg-amber-400 text-slate-950 font-black rounded-xl text-sm flex items-center gap-2 shadow mx-auto">
      <i class="fa-solid fa-microphone"></i> <span>重新測試</span>
    </button>
  `;
  toast(`發聲練習完成！獲得 ${score} 分！`, 's');
}

/* ===== 健康圖表 / 醫師摘要 ===== */
function switchHealthTab(tabId) {
  document.querySelectorAll('.health-tab-content').forEach(el => el.classList.add('hidden'));
  $(tabId)?.classList.remove('hidden');

  document.querySelectorAll('[id^="nav-tab-"]').forEach(btn => {
    btn.className = "px-2 py-3 rounded-xl font-extrabold text-sm border-2 border-slate-200 bg-white text-slate-700 text-center";
  });

  const activeBtn = $('nav-tab-' + tabId);
  if (activeBtn) {
    activeBtn.className = "px-2 py-3 rounded-xl font-extrabold text-sm border-2 border-purple-800 bg-purple-700 text-white shadow text-center";
  }

  if (tabId === 'tab-stats') initHealthCharts();
  else if (tabId === 'tab-doctor') loadDoctorReport();
}

async function initHealthCharts() {
  if (!requireLogin()) return;
  try {
    const res = await api('health.getStats', { memberId: APP.user.memberId });
    if (!res.success) return;

    const c1 = $('onOffChart');
    const c2 = $('exerciseChart');
    if (!c1 || !c2) return;

    const ctx1 = c1.getContext('2d');
    const ctx2 = c2.getContext('2d');

    destroyHealthCharts();

    healthChart1 = new Chart(ctx1, {
      type: 'doughnut',
      data: {
        labels: ['🟢 ON (活動順暢)', '🔴 OFF (僵硬無力)', '🟡 異動症'],
        datasets: [{
          data: [res.stats.onCount, res.stats.offCount, res.stats.dysCount],
          backgroundColor: ['#10b981', '#f43f5e', '#f59e0b']
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom', labels: { font: { size: 12, weight: 'bold' } } } }
      }
    });

    healthChart2 = new Chart(ctx2, {
      type: 'line',
      data: {
        labels: res.trend.dates,
        datasets: [
          {
            label: '運動時間 (分鐘)',
            data: res.trend.exercises,
            borderColor: '#8b5cf6',
            backgroundColor: 'rgba(139, 92, 246, 0.1)',
            yAxisID: 'y',
            tension: 0.3
          },
          {
            label: '手指敲擊次數',
            data: res.trend.taps,
            borderColor: '#06b6d4',
            backgroundColor: 'rgba(6, 182, 212, 0.1)',
            yAxisID: 'y1',
            tension: 0.3
          }
        ]
      },
      options: {
        responsive: true,

async function saveDailyRecord() {
  if (!requireLogin()) return;

  const meds = [];
  document.querySelectorAll('[onclick^="toggleMed"]').forEach(b => {
    if (b.innerText.includes('✅')) meds.push(b.innerText.replace('✅ 已服', ''));
  });

  const exercises = [];
  document.querySelectorAll('.exercise-tag.bg-purple-100').forEach(b => exercises.push(b.innerText));

  const symptoms = [];
  document.querySelectorAll('.symptom-btn.border-rose-500').forEach(b => {
    const t = b.innerText.trim();
    symptoms.push(t.length > 2 ? t.substring(2) : t);
  });

  const payload = {
    memberId: APP.user.memberId,
    name: APP.user.name,
    date: today(),
    mood: selectedMood,
    state: currentHealthState,
    meds: meds.join(','),
    exerciseMins: exerciseMinutes,
    exercises: exercises.join(','),
    symptoms: symptoms.join(','),
    doctorQuestion: $('doctorQuestion')?.value.trim() || '',
    tapScore: window.__lastTapScore || 0,
    vocalScore: window.__lastVocalScore || 0
  };

  showLoad();
  try {
    const res = await api('health.save', payload);
    hideLoad();
    if (res.success) {
      toast('🎉 今日健康日誌已成功同步至雲端！', 's');
      window.__lastTapScore = 0;
      window.__lastVocalScore = 0;
      go('home');
    } else {
      toast(res.message || '儲存失敗', 'e');
    }
  } catch (e) {
    hideLoad();
    toast('同步雲端失敗：' + e.message, 'e');
  }
}

async function submitExpense() {
  const date = requireInput('exDate', '支出日期');
  const subjectCode = requireInput('exSubject', '科目代碼');
  const amount = requireAmount('exAmount', '支出金額');
  const account = requireInput('exAccount', '扣款帳戶');
  const applicant = requireInput('exApplicant', '申請人');
  const payee = requireInput('exPayee', '受款人');
  const description = requireInput('exDesc', '用途說明');
  if (!date || !subjectCode || !amount || !account || !applicant || !payee || !description) return;

  showLoad();
  let fileObj = null;
  try { fileObj = await getFileData('exFile'); } catch(e) {}

  try {
    const res = await api('expense.add', {
      date,
      subjectCode,
      amount,
      account,
      projectName: $('exProject').value.trim(),
      applicant,

      payeeAccount: $('exPayeeAccount').value.trim(),
      description,

    });

      if (res.budgetWarning) alert(res.budgetWarning);

function switchExpenseFilter(status, btn) {
  document.querySelectorAll('.tabs .tab').forEach(t => t.classList.remove('active'));

  renderExpenseListByStatus(status);
}

async function renderExpenseListByStatus(status) {
  const area = $('expenseListArea');
  try {
    const res = await api('expense.list');
    if (!res.success) throw new Error(res.message || '載入失敗');
    const items = (res.items || []).filter(x => x.status === status);
    if (!items.length) {
      area.innerHTML = `<div class="empty">目前沒有「${esc(status)}」資料</div>`;
      return;
    }

    area.innerHTML = `<div class="list">` + items.map(e => `
      <div class="item">
        <div class="item-title">${esc(e.description)}</div>
        <div class="item-meta">
          核銷單號：<strong>${esc(e.id)}</strong><br>
          日期：${fmtDate(e.date)}<br>
          科目：${esc(e.subjectCode)}<br>
          金額：<strong class="money">${fmtMoney(e.amount)}</strong><br>
          付款帳戶：${esc(e.account)}<br>
          申請人：${esc(e.applicant)}<br>
          受款人：${esc(e.payee)}<br>
          憑證：${e.fileUrl ? `<a href="${esc(e.fileUrl)}" target="_blank" rel="noopener">查看憑證</a>` : '未上傳'}
          ${e.rejectReason ? `<br><span class="text-rose-600 font-bold">退回原因：${esc(e.rejectReason)}</span>` : ''}
          ${e.voucherNo ? `<br>傳票號碼：<strong>${esc(e.voucherNo)}</strong>` : ''}
        </div>
        <div class="item-actions">
          ${status === '待核准' ? `
            <button class="btn btn-success btn-sm" onclick="approveExpense('${jsStr(e.id)}')">核准</button>
            <button class="btn btn-danger btn-sm" onclick="rejectExpense('${jsStr(e.id)}')">退回</button>
          ` : ''}
          ${status === '待撥款' ? `
            <button class="btn btn-primary btn-sm" onclick="confirmPaidExpense('${jsStr(e.id)}')">確認撥款</button>
            <button class="btn btn-danger btn-sm" onclick="rejectExpense('${jsStr(e.id)}')">退回</button>
          ` : ''}
        </div>
      </div>
    `).join('') + `</div>`;
  } catch (e) {
    area.innerHTML = `<div class="empty text-red-500">載入失敗</div>`;
  }
}

async function previewReceipt(receiptNo) {

        </div>
      </div>
    `).join('') + `</div>`;
  } catch (e) {
    area.innerHTML = `<div class="empty text-red-500">載入失敗</div>`;
  }
}

/* ===== 報表中心 ===== */
function renderReportCenter() {
  if (!requireLogin() || !isAdminUser(APP.user)) return;
  setMain(`
    <div class="card">
      <div class="card-title">🖨️ 報表中心</div>
      <div class="fg">
        <label class="flabel">報表類型</label>
        <select id="reportType" class="fc">
          <option value="1">1. 收支決算表</option>
          <option value="2">2. 現金出納表</option>
          <option value="3">3. 日記帳</option>
          <option value="4">4. 總分類帳</option>
          <option value="6">6. 資金帳戶餘額表</option>
          <option value="7">7. 預算執行對照表</option>
          <option value="8">8. 專案收支明細表</option>
          <option value="9">9. 資產負債表</option>
        </select>
      </div>
      <div class="row">
        <div class="fg"><label class="flabel">年度</label><select id="reportYear" class="fc">${yearOptions()}</select></div>
        <div class="fg"><label class="flabel">月份</label><select id="reportMonth" class="fc">${monthOptions()}</select></div>
        <div class="fg"><label class="flabel">科目代碼</label><input id="reportSubject" class="fc" placeholder="總分類帳可填"></div>
      </div>
      <button class="btn btn-primary" onclick="generateReport()">產生報表</button>
    </div>
    <div class="card">
      <div class="card-title">📄 報表結果</div>
      <div id="reportPrintContainer"><div class="empty">請先選擇條件並產生報表</div></div>
    </div>
  `);
}

async function generateReport() {
  showLoad();
  try {
    const res = await api('report.generate', {
      type: $('reportType').value,
      year: $('reportYear').value,
      month: $('reportMonth').value,
      subjectCode: $('reportSubject').value.trim()
    });
    hideLoad();
    if (res.success) {
      $('reportPrintContainer').innerHTML = `
        <div style="margin-bottom:16px;">
          <button class="btn btn-outline btn-sm" onclick="printReportResult()" style="margin:0;">🖨️ 列印 / 另存 PDF</button>
        </div>
        ${res.html || '<div class="empty">無報表內容</div>'}
      `;
    } else {
      $('reportPrintContainer').innerHTML = `<div class="empty text-red-500">${esc(res.message || '產生失敗')}</div>`;
    }
  } catch (e) {
    hideLoad();
    $('reportPrintContainer').innerHTML = `<div class="empty text-red-500">產生報表失敗：${esc(e.message)}</div>`;
  }
}

function printReportResult() {
  const content = $('reportPrintContainer')?.innerHTML || '<div>無內容</div>';
  const printArea = $('printArea');
  printArea.innerHTML = `
    <div class="no-print" style="padding: 15px; text-align: center; background: #e2e8f0; border-bottom: 2px solid #cbd5e1; display:flex; justify-content:center; gap:10px; margin-bottom: 20px;">
      <button class="btn btn-primary btn-sm" onclick="window.print()" style="margin:0;">🖨️ 確定列印 / 另存 PDF</button>
      <button class="btn btn-ghost btn-sm" onclick="closePrint()" style="margin:0;">關閉預覽</button>
    </div>
    <div style="padding:20px; background:#fff;">
      ${content}
    </div>
  `;
  printArea.classList.remove('hide');
  document.body.style.overflow = 'hidden';
}

/* ===== 工作人員 / 系統設定 / 公告 ===== */
function renderStaffManage() {
  if (!requireLogin() || !isAdminUser(APP.user)) return;
  setMain(`
    <div class="card">
      <div class="card-title">👔 工作人員名單</div>
      <div id="staffListArea"><div class="empty">載入中...</div></div>
    </div>
  `);
  loadStaffList();
}

async function loadStaffList() {
  const area = $('staffListArea');
  try {
    const res = await api('staff.list');
    if (!res.success || !res.items?.length) {
      area.innerHTML = `<div class="empty">目前沒有工作人員資料</div>`;
      return;
    }
    area.innerHTML = `<div class="list">` + res.items.map(s => `
      <div class="item">
        <div class="item-title">${esc(s.name)}</div>
        <div class="item-meta">
          角色：${esc(s.type || '')}<br>
          手機：${esc(s.mobile || '')}<br>
          會員編號：${esc(s.memberId || '')}
        </div>
      </div>
    `).join('') + `</div>`;
  } catch (e) {
    area.innerHTML = `<div class="empty text-red-500">載入失敗</div>`;
  }
}

function renderSystemSetting() {
  if (!requireLogin() || !isAdminUser(APP.user)) return;
  setMain(`
    <div class="card">
      <div class="card-title">⚙️ 系統設定</div>
      <div id="systemSettingArea"><div class="empty">載入中...</div></div>
    </div>
  `);
  loadSystemSettings();
}

async function loadSystemSettings() {
  const area = $('systemSettingArea');
  try {
    const res = await api('system.getSettings');
    if (!res.success) throw new Error(res.message || '載入失敗');
    const map = {};
    (res.settings || []).forEach(s => map[s.key] = s.value || '');

    area.innerHTML = `
      <div class="fg"><label class="flabel">組織全銜</label><input id="setOrgName" class="fc" value="${esc(map.org_name || '')}"></div>
      <div class="fg"><label class="flabel">統一編號</label><input id="setTaxId" class="fc" value="${esc(map.tax_id || '')}"></div>
      <div class="fg"><label class="flabel">電子印章網址 / Base64</label><textarea id="setSealUrl" class="fc">${esc(map.seal_url || '')}</textarea></div>
      <div class="fg"><label class="flabel">Gemini API Key</label><input id="setGemini" class="fc" value="${esc(map.gemini_api_key || '')}"></div>
      <button class="btn btn-success" onclick="saveSystemSettings()">儲存系統設定</button>
    `;
  } catch (e) {
    area.innerHTML = `<div class="empty text-red-500">載入失敗</div>`;
  }
}

async function saveSystemSettings() {
  showLoad();
  try {
    const settings = [
      { key: 'org_name', value: $('setOrgName').value.trim(), description: '組織全銜' },
      { key: 'tax_id', value: $('setTaxId').value.trim(), description: '統一編號' },
      { key: 'seal_url', value: $('setSealUrl').value.trim(), description: '電子印信印章 Base64 或網址' },
      { key: 'gemini_api_key', value: $('setGemini').value.trim(), description: 'Google Gemini API 金鑰' }
    ];
    const res = await api('system.saveSettings', { settings });
    hideLoad();
    if (res.success) {
      toast('系統設定已儲存', 's');
    } else {
      toast(res.message || '儲存失敗', 'e');
    }
  } catch (e) {
    hideLoad();
    toast('儲存失敗：' + e.message, 'e');
  }
}

function renderAnnounceManage() {
  if (!requireLogin() || !isAdminUser(APP.user)) return;
  setMain(`
    <div class="card">
      <div class="card-title">📢 公告管理</div>
      <div class="fg"><label class="flabel">發布日期</label><input id="annDate" type="date" class="fc" value="${today()}"></div>
      <div class="fg"><label class="flabel">公告類別</label><input id="annCategory" class="fc" placeholder="例如 一般公告 / 活動 / 會務"></div>
      <div class="fg"><label class="flabel">目標對象</label><input id="annTarget" class="fc" value="全部"></div>
      <div class="fg"><label class="flabel">公告標題</label><input id="annTitle" class="fc"></div>
      <div class="fg"><label class="flabel">公告內容</label><textarea id="annContent" class="fc"></textarea></div>
      <div class="fg"><label class="flabel">是否置頂</label><select id="annPinned" class="fc"><option value="N">否</option><option value="Y">是</option></select></div>
      <button class="btn btn-success" onclick="addAnnouncement()">發布公告</button>
      <div class="divider"></div>
      <div id="announceListArea"><div class="empty">載入中...</div></div>
    </div>
  `);
  loadAnnouncementListForAdmin();
}

async function addAnnouncement() {
  showLoad();
  try {
    const res = await api('announcement.add', {
      date: $('annDate').value,
      category: $('annCategory').value.trim(),
      target: $('annTarget').value.trim() || '全部',
      title: $('annTitle').value.trim(),
      content: $('annContent').value.trim(),
      pinned: $('annPinned').value
    });
    hideLoad();
    if (res.success) {
      toast('公告發布成功', 's');
      loadAnnouncementListForAdmin();
    } else {
      toast(res.message || '發布失敗', 'e');
    }
  } catch (e) {
    hideLoad();
    toast('發布失敗：' + e.message, 'e');
  }
}

async function loadAnnouncementListForAdmin() {
  const area = $('announceListArea');
  try {
    const res = await api('announcement.list', { target: '全部' });
    if (!res.success || !res.items?.length) {
      area.innerHTML = `<div class="empty">目前沒有公告</div>`;
      return;
    }
    area.innerHTML = `<div class="list">` + res.items.map(a => `
      <div class="item">
        <div class="item-title">${String(a.pinned)==='Y' ? '📌 ' : ''}${esc(a.title)}</div>
        <div class="item-meta">
          日期：${esc(a.date)}<br>
          類別：${esc(a.category)}<br>
          對象：${esc(a.target)}<br>
          內容：${esc(a.content)}
        </div>
        <div class="item-actions">
          <button class="btn btn-danger btn-sm" onclick="deleteAnnouncement('${jsStr(a.id)}')">刪除</button>
        </div>
      </div>
    `).join('') + `</div>`;
  } catch (e) {
    area.innerHTML = `<div class="empty text-red-500">載入失敗</div>`;
  }
}

async function deleteAnnouncement(id) {
  if (!confirm('確定刪除此公告？')) return;
  showLoad();
  try {
    const res = await api('announcement.delete', { id });
    hideLoad();
    if (res.success) {
      toast('公告已刪除', 's');
      loadAnnouncementListForAdmin();
    } else {
      toast(res.message || '刪除失敗', 'e');
    }
  } catch (e) {
    hideLoad();
    toast('刪除失敗：' + e.message, 'e');
  }
}

/* ===== 啟動 ===== */
window.addEventListener('DOMContentLoaded', async () => {
  loadFontSize();

  const cached = localStorage.getItem('parkUser');
  if (cached) {
    try {
      APP.user = JSON.parse(cached);
      updateLoginButton();
    } catch (e) {}
  }

  await initLiff();
  go('home');
});
</script>
</body>
