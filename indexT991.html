<!doctype html>
<html lang="zh-TW">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>PDA 管理系統</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root {
      --primary: #047857;
      --primary-dark: #064e3b;
      --navy: #0f172a;
      --muted: #64748b;
      --border: #dbe3ea;
      --background: #f1f5f9;
      --danger: #be123c;
      --warning: #b45309;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--background);
      color: var(--navy);
      font-family: "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
    }

    button, input, select, textarea { font: inherit; }
    button, a.button { cursor: pointer; }
    button:disabled, input:disabled, select:disabled, textarea:disabled { cursor: not-allowed; opacity: 0.65; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible {
      outline: 3px solid #5eead4;
      outline-offset: 2px;
    }

    .hidden { display: none !important; }

    .header {
      position: sticky;
      top: 0;
      z-index: 30;
      color: white;
      background: var(--navy);
      padding: max(12px, env(safe-area-inset-top)) 16px 12px;
    }

    .header-inner {
      max-width: 1280px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      padding: 10px;
      border-radius: 14px;
      background: #10b981;
      font-weight: 900;
    }

    .header-title { flex: 1; min-width: 0; }
    .header-title h1 { margin: 0; font-size: 17px; overflow-wrap: anywhere; }
    .header-title small { color: #cbd5e1; }
    .session { color: #6ee7b7; font-weight: 800; white-space: nowrap; }

    .nav {
      position: sticky;
      top: 72px;
      z-index: 20;
      overflow-x: auto;
      background: white;
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      max-width: 1280px;
      margin: auto;
      padding: 10px 14px;
      display: flex;
      gap: 8px;
    }

    .nav button {
      border: 0;
      border-radius: 12px;
      padding: 10px 14px;
      background: #e2e8f0;
      white-space: nowrap;
      font-weight: 800;
    }

    .nav button.active { color: white; background: var(--primary); }

    main {
      max-width: 1280px;
      margin: auto;
      padding: 18px 14px 110px;
    }

    .hero {
      border-radius: 24px;
      padding: 28px;
      color: white;
      background: linear-gradient(135deg, var(--navy), var(--primary));
    }

    .hero h2 { margin-top: 0; }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-top: 20px;
    }

    .stat {
      padding: 16px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.14);
    }

    .stat strong { display: block; margin-top: 5px; font-size: 26px; }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 15px;
    }

    .toolbar h2 { margin: 0; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .button {
      display: inline-block;
      border: 0;
      border-radius: 12px;
      padding: 11px 15px;
      color: white;
      background: var(--navy);
      font-weight: 800;
      text-align: center;
      text-decoration: none;
    }

    .button.primary { background: var(--primary); }
    .button.danger { background: var(--danger); }
    .button.light { color: var(--navy); background: #e2e8f0; }

    .table-wrap {
      overflow-x: auto;
      border-radius: 18px;
      background: white;
      box-shadow: 0 8px 30px rgba(15, 23, 42, 0.06);
    }

    table {
      width: 100%;
      min-width: 900px;
      border-collapse: collapse;
      font-size: 14px;
    }

    th {
      position: sticky;
      top: 0;
      padding: 13px;
      color: white;
      background: var(--navy);
      text-align: left;
      white-space: nowrap;
    }

    td {
      max-width: 320px;
      padding: 13px;
      border-bottom: 1px solid #eef2f7;
      vertical-align: top;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    tr:hover td { background: #f8fafc; }

    .empty {
      border-radius: 18px;
      padding: 50px 20px;
      background: white;
      text-align: center;
      color: var(--muted);
    }

    .badge {
      display: inline-block;
      border-radius: 999px;
      padding: 4px 9px;
      background: #e2e8f0;
      font-size: 12px;
      font-weight: 800;
    }

    .badge.high { color: #9f1239; background: #ffe4e6; }
    .badge.medium { color: #92400e; background: #fef3c7; }
    .badge.low { color: #065f46; background: #d1fae5; }

    .modal-layer {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(15, 23, 42, 0.7);
    }

    .modal {
      position: relative;
      width: min(720px, 100%);
      max-height: 92vh;
      overflow-y: auto;
      border-radius: 24px;
      padding: 24px;
      background: white;
    }

    .close {
      position: absolute;
      right: 14px;
      top: 14px;
      border: 0;
      background: transparent;
      font-size: 22px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .field { display: block; font-weight: 800; }
    .field.full { grid-column: 1 / -1; }

    .field input, .field select, .field textarea {
      width: 100%;
      margin-top: 7px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px;
      background: white;
    }

    .field textarea { min-height: 100px; resize: vertical; }

    .check {
      display: flex;
      align-items: center;
      gap: 9px;
      padding-top: 27px;
    }

    .check input { width: 20px; height: 20px; }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .loading-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 20px;
      color: white;
      background: var(--navy);
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #d1fae5;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .busy {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: inherit;
      background: rgba(255, 255, 255, 0.94);
      text-align: center;
    }

    .busy .spinner { margin: auto; }

    .toast {
      position: fixed;
      z-index: 100;
      top: max(18px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      max-width: calc(100% - 32px);
      border-radius: 13px;
      padding: 13px 18px;
      color: white;
      background: var(--navy);
      font-weight: 800;
      box-shadow: 0 12px 35px rgba(15, 23, 42, 0.3);
    }

    .toast.error { background: var(--danger); }

    .footer {
      position: fixed;
      z-index: 25;
      bottom: 0;
      width: 100%;
      max-height: 72px;
      overflow-y: auto;
      padding: 10px 16px max(10px, env(safe-area-inset-bottom));
      color: #cbd5e1;
      background: var(--navy);
      text-align: center;
      font-size: 11px;
    }

    .notice {
      margin-bottom: 16px;
      border-left: 5px solid var(--warning);
      border-radius: 12px;
      padding: 13px;
      background: #fffbeb;
      line-height: 1.7;
    }

    .login-card {
      width: min(520px, calc(100% - 32px));
      padding: 28px;
      border-radius: 24px;
      color: var(--navy);
      background: white;
      text-align: center;
    }

    .login-card p {
      margin: 16px 0 24px;
      color: var(--muted);
      line-height: 1.7;
    }

    @media (max-width: 720px) {
      .header { padding-left: 12px; padding-right: 12px; }
      .nav { top: 70px; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .toolbar { align-items: flex-start; flex-direction: column; }
      .actions { justify-content: flex-start; }
      .form-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .modal-layer { align-items: flex-end; padding: 0; }
      .modal { width: 100%; max-height: 94vh; border-radius: 24px 24px 0 0; }
      .form-actions .button { flex: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 1.8s; }
    }
  </style>
</head>

    window.addEventListener('load', initializeApp, { once: true });

    async function initializeApp() {
      renderLoading('正在初始化系統');
      try {
        ensureAppsScriptEnvironment();
        state.config = await callServer('getPublicConfig', undefined, 30000);

        if (!state.config || !state.config.liffId) {
          throw new Error('尚未設定 LIFF_ID，請在後端指令碼屬性設定');
        }

        if (isEmbeddedByExternalWebsite()) {
          renderStandaloneRequired();
          return;
        }

        if (typeof window.liff === 'undefined') {
          throw new Error('LINE LIFF SDK 載入失敗，請檢查網路連線');
        }

        await liff.init({
          liffId: state.config.liffId,
          withLoginOnExternalBrowser: true
        });

        if (!liff.isLoggedIn()) {
          renderLineLoginButton();
          return;
        }

        state.idToken = String(liff.getIDToken() || '');
        if (!state.idToken) {
          throw new Error('無法取得 LINE ID Token，請確認 LIFF Scope 已啟用 openid');
        }

        const decoded = liff.getDecodedIDToken();
        if (!decoded || !decoded.sub) {
          throw new Error('LINE 登入資訊不完整，請重新登入');
        }

        const bootstrap = await callApi('bootstrap');
        if (!bootstrap || !bootstrap.user) {
          throw new Error('系統未回傳使用者資訊');
        }

        state.user = bootstrap.user;
        state.counts = bootstrap.counts || {};
        state.sessionSeconds = Number(state.config.sessionTimeout) || 1800;

        installSessionControl();
        renderApp();
      } catch (error) {
        console.error('系統初始化失敗：', error);
        renderFatalError(getErrorMessage(error, '系統初始化失敗'));
      }
    }

    /* ==========================================================================
       支援外部 fetch 與內部 google.script.run 的雙模通信器
       ========================================================================== */
    async function callServer(functionName, argument, timeoutMilliseconds) {
      const staticUrl = String(STATIC_WEB_APP_URL || '').trim();
      const timeout = Number(timeoutMilliseconds || 60000);

      if (staticUrl && !staticUrl.includes('XXXXXXXXXXXXXX')) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeout);

        try {
          const requestBody = functionName === 'getPublicConfig'
            ? { action: 'getPublicConfig' }
            : argument;

          // 使用 text/plain 避免觸發無效的 CORS OPTIONS 預檢
          const response = await fetch(staticUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(requestBody),
            signal: controller.signal
          });

          clearTimeout(timer);

          if (!response.ok) {
            throw new Error('伺服器連線異常 HTTP ' + response.status);
          }

          return await response.json();
        } catch (err) {
          clearTimeout(timer);
          if (err.name === 'AbortError') {
            throw new Error('伺服器回應逾時，請稍後再試');
          }
          throw err;
        }
      }

      // 回退至 Google Apps Script 容器內部原生調用
      return new Promise(function (resolve, reject) {
        let settled = false;
        const timer = setTimeout(function () {
          if (settled) return;
          settled = true;
          reject(new Error('伺服器回應逾時，請稍後再試'));
        }, timeout);

        function finish(callback, value) {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          callback(value);
        }

        try {
          const runner = google.script.run
            .withSuccessHandler(function (result) { finish(resolve, result); })
            .withFailureHandler(function (error) { finish(reject, new Error(getErrorMessage(error, '後端函式執行失敗'))); });

          if (argument === undefined) {
            runner[functionName]();
          } else {
            runner[functionName](argument);
          }
        } catch (error) {
          finish(reject, error);
        }
      });
    }

    async function callApi(action, payload, requestId) {
      if (!state.idToken) {
        throw new Error('LINE 登入資訊不存在，請重新登入');
      }

      resetSession();
      const response = await callServer(
        'api',
        {
          action: action,
          payload: payload || {},
          idToken: state.idToken,
          requestId: requestId || createRequestId()
        },
        action === 'uploadTemporaryFile' ? 120000 : 60000
      );

      if (!response || !response.ok) {
        const message = response && response.error && response.error.message ? response.error.message : '操作失敗';
        throw new Error(message);
      }

      return response.data;
    }

    function createRequestId() {
      if (window.crypto && typeof window.crypto.randomUUID === 'function') {
        return window.crypto.randomUUID();
      }
      return Date.now() + '-' + Math.random().toString(36).slice(2) + '-' + Math.random().toString(36).slice(2);
    }

      if (!state.user || !Array.isArray(state.user.permissions)) {
        return false;

      return state.user.permissions.includes('*') || state.user.permissions.includes(permission);
    }

    function hasAnyPermission(permissions) {
      return Array.isArray(permissions) && permissions.some(hasPermission);
    }

    async function openModule(moduleId) {
      const module = MODULES.find(function (item) { return item.id === moduleId; });
      if (!module || !hasAnyPermission(module.permissions)) {
        showToast('您沒有開啟此功能的權限', true);
        return;
      }

      const loadSequence = ++state.moduleLoadSequence;
      state.module = moduleId;
      state.rows = [];
      renderApp();

      if (!module.action || (module.readPermissions && !hasAnyPermission(module.readPermissions))) {
        return;
      }

      showMainLoading();
      try {
        const rows = await callApi(
          module.action,
          moduleId === 'tasks' ? { status: 'PENDING', limit: 300 } : { limit: 300 }
        );

        if (loadSequence !== state.moduleLoadSequence || state.module !== moduleId) {
          return;
        }

        state.rows = Array.isArray(rows) ? rows : [];
        renderApp();
      } catch (error) {
        if (loadSequence !== state.moduleLoadSequence) return;
        state.rows = [];
        renderApp();
        showToast(getErrorMessage(error, '資料載入失敗'), true);
      }
    }

      const requiredText = required ? ' required' : '';
      const requiredMark = required ? ' <span aria-hidden="true">*</span>' : '';

              options.map(function (option) {
                return '<option value="' + escapeAttribute(option) + '">' + escapeHtml(option) + '</option>';
              }).join('') +
            '</select>' +

        );
      }

      if (type === 'checkbox') {
        return (
          '<label class="check">' +
            '<input type="checkbox" name="' + escapeAttribute(name) + '"' + requiredText + '>' +
            '<strong>' + escapeHtml(label) + requiredMark + '</strong>' +
          '</label>'
        );
      }

      if (type === 'file') {
        return (
          '<label class="field full">' +
            escapeHtml(label) + requiredMark +
            '<input type="file" name="' + escapeAttribute(name) + '" accept=".jpg,.jpeg,.png,.pdf,image/jpeg,image/png,application/pdf"' + requiredText + '>' +
          '</label>'
        );

      if (type === 'number') {
        numberRules = ' min="0" step="0.01"';
      }

      return (
        '<label class="field">' +

        '</label>'
      );

    async function submitDataForm(event, definition) {
      event.preventDefault();
      if (state.modalBusy) return;

      const form = event.currentTarget;
      if (!form.reportValidity()) return;

      const payload = {};
      const requestId = createRequestId();

      setModalBusy(true);

      try {
        for (const field of definition.fields) {
          const name = field[0];
          const type = field[2];
          const element = form.elements[name];

          if (!element) continue;

          if (type === 'checkbox') {
            payload[name] = Boolean(element.checked);
            continue;
          }

          if (type === 'file') {
            const file = element.files && element.files[0];
            if (file) {
              const uploaded = await uploadFile(file, requestId + '-FILE-' + name);
              payload[name] = uploaded.fileRecordId;
            }
            continue;
          }

          payload[name] = String(element.value || '').trim();
        }

        const result = await callApi(definition.action, payload, requestId);

        setModalBusy(false);
        closeModal();

        showToast('完成：' + (result && result.recordId ? result.recordId : '操作成功'));
        await openModule(state.module);
      } catch (error) {
        setModalBusy(false);
        showToast(getErrorMessage(error, '操作失敗'), true);
      }
    }

    function detectFileMimeType(file) {
      const browserType = String(file.type || '').toLowerCase();
      if (['image/jpeg', 'image/png', 'application/pdf'].includes(browserType)) {
        return browserType;
      }

      const fileName = String(file.name || '').toLowerCase();
      if (fileName.endsWith('.jpg') || fileName.endsWith('.jpeg')) return 'image/jpeg';
      if (fileName.endsWith('.png')) return 'image/png';
      if (fileName.endsWith('.pdf')) return 'application/pdf';

      return '';
    }

    async function uploadFile(file, requestId) {
      const maximumSize = Number(state.config && state.config.maxFileSize) || 5 * 1024 * 1024;

      if (!file || file.size <= 0) {
        throw new Error('檔案內容為空');
      }

      if (file.size > maximumSize) {
        throw new Error('檔案超過系統上限');
      }

      const mimeType = detectFileMimeType(file);
      if (!mimeType) {
        throw new Error('只允許 JPG、PNG 或 PDF');
      }

      const base64 = await readFileAsBase64(file);

      return callApi(
        'uploadTemporaryFile',
        { fileName: file.name, mimeType: mimeType, base64: base64 },
        requestId
      );
    }

    function readFileAsBase64(file) {
      return new Promise(function (resolve, reject) {
        const reader = new FileReader();
        reader.onload = function () {
          const result = String(reader.result || '');
          const commaIndex = result.indexOf(',');
          resolve(commaIndex >= 0 ? result.slice(commaIndex + 1) : result);
        };
        reader.onerror = function () { reject(new Error('讀取檔案失敗')); };
        reader.onabort = function () { reject(new Error('檔案讀取已取消')); };
        reader.readAsDataURL(file);
      });
    }

    }

    async function submitReviewForm(event, task) {
      event.preventDefault();
      if (state.modalBusy) return;

      const submitter = event.submitter;
      const decision = submitter && submitter.dataset ? submitter.dataset.decision : '';

      if (!['APPROVED', 'RETURNED'].includes(decision)) {
        showToast('無法判斷審核決定', true);
        return;
      }

      const form = event.currentTarget;
      const comment = String(form.elements.comment.value || '').trim();

      if (!comment) {
        showToast('請填寫審核意見', true);
        form.elements.comment.focus();
        return;
      }

      const taskType = String(task['任務類型'] || '');
      const requestId = createRequestId();
      const payload = {
        taskId: task['任務編號'],
        decision: decision,
        comment: comment,
        version: Number(task['版本號'] || 1)
      };

      if (decision === 'APPROVED' && taskType === 'DONATION_DEPOSIT') {
        const depositDate = form.elements.depositDate ? String(form.elements.depositDate.value || '').trim() : '';
        if (!depositDate) {
          showToast('核准入帳時必須填寫入帳日期', true);
          return;
        }
        payload.depositDate = depositDate;
      }

      if (decision === 'APPROVED' && taskType === 'VOLUNTEER_APPROVAL') {
        const approvedHours = form.elements.approvedHours ? String(form.elements.approvedHours.value || '').trim() : '';
        if (approvedHours === '') {
          showToast('核准志工紀錄時必須填寫核定時數', true);
          return;
        }
        payload.approvedHours = approvedHours;
      }

      if (taskType === 'EXPENSE_PAYMENT') {
        payload.paymentNote = form.elements.paymentNote ? String(form.elements.paymentNote.value || '').trim() : '';
      }

      setModalBusy(true);

      try {
        if (decision === 'APPROVED' && taskType === 'DONATION_RECEIPT') {
          const fileElement = form.elements.receiptFileRecordId;
          const file = fileElement && fileElement.files ? fileElement.files[0] : null;
          if (file) {
            const uploaded = await uploadFile(file, requestId + '-RECEIPT');
            payload.receiptFileRecordId = uploaded.fileRecordId;
          }
        }

        await callApi('reviewTask', payload, requestId);

        setModalBusy(false);
        closeModal();

        showToast(decision === 'APPROVED' ? '案件已核准' : '案件已退回');
        await openModule('tasks');
      } catch (error) {
        setModalBusy(false);
        showToast(getErrorMessage(error, '審核失敗'), true);
      }
    }

    function openAccountEditForm(account) {
      if (!account) {
        showToast('找不到帳號資料', true);
        return;
      }

      showModal(
        '<form id="accountEditForm">' +
          '<h2>編輯系統帳號</h2>' +
          '<div class="notice">LINE UID：' + escapeHtml(account['LINE_UID'] || '') + '</div>' +
          '<div class="form-grid">' +
            '<label class="field">' +
              '姓名 *' +
              '<input type="text" name="name" required maxlength="100" value="' + escapeAttribute(account['姓名'] || '') + '">' +
            '</label>' +
            '<label class="field">' +
              '角色 *' +
              '<select name="role" required>' +
                renderOptions(['ADMIN', 'CHAIR', 'SECRETARY', 'ACCOUNTING', 'CASHIER', 'STAFF', 'VOLUNTEER', 'MEMBER'], account['角色']) +
              '</select>' +
            '</label>' +
            '<label class="field">' +
              '帳號狀態 *' +
              '<select name="status" required>' +
                renderOptions(['ACTIVE', 'DISABLED'], account['帳號狀態']) +
              '</select>' +
            '</label>' +
            '<label class="field full">' +
              '備註' +
              '<textarea name="note" maxlength="500">' + escapeHtml(account['備註'] || '') + '</textarea>' +
            '</label>' +
          '</div>' +
          '<div class="form-actions">' +
            '<button type="button" class="button light" data-close-modal>取消</button>' +
            '<button type="submit" class="button primary">儲存</button>' +
          '</div>' +
        '</form>'
      );

      document.getElementById('accountEditForm').addEventListener('submit', function (event) {
        submitAccountEdit(event, account);
      });
    }

    async function submitAccountEdit(event, account) {
      event.preventDefault();
      if (state.modalBusy) return;

      const form = event.currentTarget;
      if (!form.reportValidity()) return;

      setModalBusy(true);

      try {
        await callApi('updateAccount', {
          accountId: account['ID'],
          name: String(form.elements.name.value || '').trim(),
          role: String(form.elements.role.value || '').trim(),
          status: String(form.elements.status.value || '').trim(),
          note: String(form.elements.note.value || '').trim()
        });

        setModalBusy(false);
        closeModal();
        showToast('帳號已更新');
        await openModule('accounts');
      } catch (error) {
        setModalBusy(false);
        showToast(getErrorMessage(error, '帳號更新失敗'), true);
      }
    }

    function openSettingForm(setting) {
      if (!setting) {
        showToast('找不到設定資料', true);
        return;
      }

      showModal(
        '<form id="settingForm">' +
          '<h2>修改系統設定</h2>' +
          '<div class="notice">' +
            '<strong>' + escapeHtml(setting['設定鍵'] || '') + '</strong><br>' +
            escapeHtml(setting['說明'] || '') +
          '</div>' +
          '<div class="form-grid">' +
            '<label class="field full">' +
              '設定值 *' +
              '<input type="text" name="value" required maxlength="100" value="' + escapeAttribute(setting['設定值'] || '') + '">' +
            '</label>' +
            '<label class="field full">' +
              '說明' +
              '<textarea name="description" maxlength="500">' + escapeHtml(setting['說明'] || '') + '</textarea>' +
            '</label>' +
          '</div>' +
          '<div class="form-actions">' +
            '<button type="button" class="button light" data-close-modal>取消</button>' +
            '<button type="submit" class="button primary">儲存設定</button>' +
          '</div>' +
        '</form>'
      );

      document.getElementById('settingForm').addEventListener('submit', function (event) {
        submitSettingForm(event, setting);
      });
    }

    async function submitSettingForm(event, setting) {
      event.preventDefault();
      if (state.modalBusy) return;

      const form = event.currentTarget;
      if (!form.reportValidity()) return;

      setModalBusy(true);

      try {
        await callApi('updateSystemSetting', {
          key: setting['設定鍵'],
          value: String(form.elements.value.value || '').trim(),
          description: String(form.elements.description.value || '').trim()
        });

        setModalBusy(false);
        closeModal();
        showToast('系統設定已更新');
        await openModule('settings');
      } catch (error) {
        setModalBusy(false);
        showToast(getErrorMessage(error, '系統設定更新失敗'), true);
      }
    }

    async function openControlledFile(fileRecordId) {
      if (!fileRecordId) {
        showToast('缺少檔案紀錄 ID', true);
        return;
      }

      const previewWindow = window.open('about:blank', '_blank');
      if (previewWindow) {
        try {
          previewWindow.opener = null;
          previewWindow.document.write(
            '<!doctype html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>載入檔案中</title><style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;color:#0f172a;background:#f1f5f9}</style></head><body>正在載入受控檔案…</body></html>'
          );
          previewWindow.document.close();
        } catch (error) {
          console.warn('無法建立檔案預覽頁面：', error);
        }
      }

      try {
        const result = await callApi('getControlledFileUrl', { fileRecordId: String(fileRecordId) });
        if (!result || !result.dataUrl) {
          throw new Error('系統未回傳檔案內容');
        }

        const fileName = String(result.fileName || '受控檔案');
        const mimeType = String(result.mimeType || '').toLowerCase();
        const dataUrl = String(result.dataUrl || '');

        if (!dataUrl.startsWith('data:')) {
          throw new Error('系統回傳的檔案格式錯誤');
        }

        if (!previewWindow) {
          downloadDataUrl(dataUrl, fileName);
          return;
        }

        if (mimeType.startsWith('image/')) {
          const safeName = escapeHtml(fileName);
          const safeDataUrl = escapeAttribute(dataUrl);

          previewWindow.document.open();
          previewWindow.document.write(
            '<!doctype html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>' + safeName + '</title><style>html,body{margin:0;min-height:100%;background:#0f172a}body{display:flex;align-items:center;justify-content:center}img{display:block;max-width:100%;max-height:100vh;object-fit:contain}</style></head><body><img alt="' + escapeAttribute(fileName) + '" src="' + safeDataUrl + '"></body></html>'
          );
          previewWindow.document.close();
          return;
        }

        if (mimeType === 'application/pdf') {
          try {
            previewWindow.location.replace(dataUrl);
          } catch (error) {
            previewWindow.close();
            downloadDataUrl(dataUrl, fileName);
          }
          return;
        }

        previewWindow.close();
        downloadDataUrl(dataUrl, fileName);
      } catch (error) {
        if (previewWindow && !previewWindow.closed) {
          previewWindow.close();
        }
        showToast(getErrorMessage(error, '檔案開啟失敗'), true);
      }
    }

    function downloadDataUrl(dataUrl, fileName) {
      const anchor = document.createElement('a');
      anchor.href = String(dataUrl);
      anchor.download = String(fileName || 'download');
      anchor.style.display = 'none';
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
    }

    function showModal(content) {
      if (state.modalBusy) return;

      const root = document.getElementById('modalRoot');
      root.innerHTML =
        '<div class="modal-layer">' +
          '<section class="modal" role="dialog" aria-modal="true" aria-label="系統表單">' +
            '<button type="button" class="close" data-close-modal aria-label="關閉視窗">×</button>' +
            content +
            '<div id="modalBusy" class="busy hidden" role="status" aria-live="polite">' +
              '<div>' +
                '<div class="spinner"></div>' +
                '<p>系統處理中，請勿重複送出</p>' +
              '</div>' +
            '</div>' +
          '</section>' +
        '</div>';

      state.modalBusy = false;
      root.querySelectorAll('[data-close-modal]').forEach(function (button) {
        button.addEventListener('click', closeModal);
      });

      const layer = root.querySelector('.modal-layer');
      if (layer) {
        layer.addEventListener('click', function (event) {
          if (event.target === layer) closeModal();
        });
        layer.addEventListener('keydown', function (event) {
          if (event.key === 'Escape') closeModal();
        });
      }

      const firstFocusable = root.querySelector('input:not([disabled]), select:not([disabled]), textarea:not([disabled]), button:not([disabled])');
      if (firstFocusable) {
        window.setTimeout(function () {
          try { firstFocusable.focus(); } catch (error) { console.warn(error); }
        }, 0);
      }
    }

    function closeModal() {
      if (state.modalBusy) return;
      document.getElementById('modalRoot').innerHTML = '';
    }

    function setModalBusy(isBusy) {
      state.modalBusy = Boolean(isBusy);
      const root = document.getElementById('modalRoot');
      const busy = document.getElementById('modalBusy');

      if (busy) {
        busy.classList.toggle('hidden', !state.modalBusy);
      }

      root.querySelectorAll('button, input, select, textarea').forEach(function (element) {
        element.disabled = state.modalBusy;
      });
    }

    function setDefaultDates() {
      const today = getLocalDateString();
      document.querySelectorAll('.modal input[type="date"]').forEach(function (input) {
        if (!input.value) input.value = today;
      });
    }

    function getLocalDateString() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const date = String(now.getDate()).padStart(2, '0');
      return year + '-' + month + '-' + date;
    }

    function renderOptions(options, selected) {
      return options.map(function (option) {
        const isSelected = String(option) === String(selected);
        return '<option value="' + escapeAttribute(option) + '"' + (isSelected ? ' selected' : '') + '>' + escapeHtml(option) + '</option>';
      }).join('');
    }

    function installSessionControl() {
      if (state.sessionTimer) {
        clearInterval(state.sessionTimer);
      }

      state.sessionTimer = setInterval(function () {
        state.sessionSeconds = Math.max(0, Number(state.sessionSeconds || 0) - 1);
        const clock = document.getElementById('sessionClock');
        if (clock) {
          clock.textContent = formatSession(state.sessionSeconds);
        }

        if (state.sessionSeconds <= 0) {
          clearInterval(state.sessionTimer);
          state.sessionTimer = null;
          handleSessionExpired();
        }
      }, 1000);

      if (state.sessionEventsInstalled) return;

      ['click', 'touchstart', 'keydown'].forEach(function (eventName) {
        document.addEventListener(eventName, resetSession, { passive: true });
      });

      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible' && state.idToken) {
          resetSession();
        }
      });

      state.sessionEventsInstalled = true;
    }

    function resetSession() {
      if (!state.config || !state.idToken) return;
      const timeout = Number(state.config.sessionTimeout);
      state.sessionSeconds = Number.isFinite(timeout) && timeout > 0 ? timeout : 1800;
    }

    function formatSession(seconds) {
      const safeSeconds = Math.max(0, Math.floor(Number(seconds || 0)));
      const minutes = Math.floor(safeSeconds / 60);
      const remainingSeconds = safeSeconds % 60;
      return String(minutes).padStart(2, '0') + ':' + String(remainingSeconds).padStart(2, '0');
    }

    function handleSessionExpired() {
      state.idToken = '';
      state.user = null;
      state.rows = [];
      state.counts = {};
      state.moduleLoadSequence += 1;
      state.modalBusy = false;

      document.getElementById('modalRoot').innerHTML = '';

      try {
        if (window.liff && liff.isLoggedIn()) {
          liff.logout();
        }
      } catch (error) {
        console.warn('LINE 登出失敗：', error);
      }

      renderFatalError('工作階段已逾時，請重新登入');
    }

    function renderLoading(message) {
      document.getElementById('app').innerHTML =
        '<div class="loading-page">' +
          '<div class="spinner" aria-hidden="true"></div>' +
          '<strong role="status">' + escapeHtml(message) + '</strong>' +
        '</div>';
    }

    function renderFatalError(message) {
      state.moduleLoadSequence += 1;
      if (state.sessionTimer) {
        clearInterval(state.sessionTimer);
        state.sessionTimer = null;
      }

      document.getElementById('modalRoot').innerHTML = '';
      document.getElementById('app').innerHTML =
        '<div class="loading-page">' +
          '<section class="login-card">' +
            '<h2>無法開啟系統</h2>' +
            '<p>' + escapeHtml(message || '系統發生錯誤') + '</p>' +
            '<button id="reloadButton" type="button" class="button primary">重新載入</button>' +
          '</section>' +
        '</div>';

      const reloadButton = document.getElementById('reloadButton');
      if (reloadButton) {
        reloadButton.addEventListener('click', function () {
          window.location.reload();
        });
      }
    }

    function showToast(message, isError) {
      const toast = document.getElementById('toast');
      if (!toast) return;

      toast.textContent = String(message || '');
      toast.className = 'toast' + (isError ? ' error' : '');
      toast.setAttribute('role', isError ? 'alert' : 'status');

      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(function () {
        toast.classList.add('hidden');
      }, 4000);
    }

    function getErrorMessage(error, fallbackMessage) {
      if (!error) return fallbackMessage || '系統處理失敗';
      if (typeof error === 'string') return error;
      if (error.message) return String(error.message);
      return fallbackMessage || '系統處理失敗';
    }

    function escapeHtml(value) {
      return String(value === undefined || value === null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function escapeAttribute(value) {
      return escapeHtml(value)
        .replace(/`/g, '&#096;')
        .replace(/\r/g, '&#013;')
        .replace(/\n/g, '&#010;');
    }
  </script>
</body>
