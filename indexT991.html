<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>台灣帕金森病友權益促進會</title>

  
    若使用 LINE LIFF，請取消下一行註解，並填入 LIFF_ID
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
 

  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #0f766e;
      --primary2: #0d9488;
      --green: #16a34a;
      --blue: #2563eb;
      --purple: #7c3aed;
      --orange: #ea580c;
      --red: #dc2626;
      --yellow: #ca8a04;
      --border: #e2e8f0;
      --shadow: 0 12px 34px rgba(15, 23, 42, .10);
      --radius: 22px;
      --fs-sm: 14px;
      --fs-base: 17px;
      --fs-lg: 20px;
      --fs-xl: 25px;
      --fs-2xl: 32px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: var(--fs-base);
      line-height: 1.65;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: var(--primary);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, .94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-weight: 900;
      font-size: 18px;
      text-align: center;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .icon-btn {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 999px;
      padding: 8px 12px;
      min-width: 48px;
      font-weight: 900;
    }

    .icon-btn.disabled {
      opacity: .35;
      pointer-events: none;
    }

    main {
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 16px 14px 90px;
      outline: none;
    }

    .hero {
      background: linear-gradient(135deg, #0f766e, #0369a1);
      color: #fff;
      border-radius: 28px;
      padding: 26px 22px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .hero h1 {
      margin: 0;
      font-size: var(--fs-2xl);
      line-height: 1.25;
    }

    .tagline {
      margin-top: 8px;
      opacity: .94;
      font-weight: 700;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
      margin: 14px 0;
    }

    .card-title {
      font-size: var(--fs-xl);
      font-weight: 900;
      margin-bottom: 14px;
    }

    .module-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    @media (max-width: 620px) {
      .module-grid {
        grid-template-columns: 1fr;
      }
    }

    .module-btn {
      border: 0;
      border-radius: 22px;
      padding: 18px;
      color: #fff;
      display: flex;
      gap: 14px;
      align-items: center;
      text-align: left;
      min-height: 94px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, .12);
    }

    .module-btn.green {
      background: linear-gradient(135deg, #16a34a, #047857);
    }

    .module-btn.blue {
      background: linear-gradient(135deg, #2563eb, #1e40af);
    }

    .module-btn.purple {
      background: linear-gradient(135deg, #7c3aed, #5b21b6);
    }

    .module-btn.orange {
      background: linear-gradient(135deg, #ea580c, #c2410c);
    }

    .module-btn.red {
      background: linear-gradient(135deg, #dc2626, #991b1b);
    }

    .module-btn.teal {
      background: linear-gradient(135deg, #0d9488, #0f766e);
    }

    .module-btn.gray {
      background: linear-gradient(135deg, #475569, #1e293b);
    }

    .m-icon {
      font-size: 34px;
      width: 42px;
      text-align: center;
      flex-shrink: 0;
    }

    .m-label-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .m-label-group > span:first-child {
      font-weight: 900;
      font-size: 20px;
    }

    .m-sub {
      font-size: 14px;
      opacity: .92;
    }

    .fg {
      margin: 12px 0;
    }

    .flabel {
      display: block;
      font-weight: 900;
      margin-bottom: 6px;
    }

    .fc {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 13px 14px;
      background: #fff;
      color: var(--text);
    }

    textarea.fc {
      min-height: 120px;
      resize: vertical;
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 18px;
      padding: 13px 16px;
      font-weight: 900;
      margin: 8px 0;
      text-align: center;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-success {
      background: var(--green);
      color: #fff;
    }

    .btn-danger {
      background: var(--red);
      color: #fff;
    }

    .btn-warning {
      background: var(--yellow);
      color: #fff;
    }

    .btn-ghost {
      background: #f1f5f9;
      color: var(--text);
    }

    .btn-outline {
      background: #fff;
      color: var(--primary);
      border: 1px solid var(--primary);
    }

    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-row .btn {
      flex: 1;
      min-width: 130px;
    }

    .item {
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
      margin: 10px 0;
      background: #fff;
    }

    .item-title {
      font-weight: 900;
      font-size: 19px;
    }

    .item-meta {
      color: var(--muted);
      margin-top: 6px;
    }

    .item-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .item-actions .btn {
      width: auto;
      min-width: 110px;
      margin: 0;
    }

    .money {
      color: #047857;
      font-weight: 900;
    }

    .pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 900;
      background: #e0f2fe;
      color: #075985;
      vertical-align: middle;
    }

    .pill.ok {
      background: #dcfce7;
      color: #166534;
    }

    .pill.warn {
      background: #fef3c7;
      color: #92400e;
    }

    .pill.bad {
      background: #fee2e2;
      color: #991b1b;
    }

    .hide {
      display: none !important;
    }

    .divider {
      border: 0;
      border-top: 1px solid var(--border);
      margin: 18px 0;
    }

    .loader {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.28);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .loader.show {
      display: flex;
    }

    .loader-box {
      background: #fff;
      color: #0f172a;
      padding: 18px 24px;
      border-radius: 18px;
      font-weight: 900;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .22);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%) translateY(20px);
      background: #0f172a;
      color: #fff;
      padding: 14px 18px;
      border-radius: 999px;
      font-weight: 900;
      opacity: 0;
      pointer-events: none;
      transition: .2s ease;
      z-index: 10000;
      max-width: min(92vw, 520px);
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast.s {
      background: #047857;
    }

    .toast.w {
      background: #b45309;
    }

    .toast.e {
      background: #b91c1c;
    }

    .modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, .45);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 9000;
    }

    .modal-mask.show {
      display: flex;
    }

    .modal {
      width: min(720px, 100%);
      max-height: 88vh;
      overflow: auto;
      background: #fff;
      border-radius: 24px 24px 0 0;
      padding: 18px;
      box-shadow: 0 -20px 60px rgba(0, 0, 0, .24);
    }

    .modal-handle {
      width: 54px;
      height: 6px;
      background: #cbd5e1;
      border-radius: 999px;
      margin: 0 auto 14px;
    }

    .modal-title {
      font-size: var(--fs-xl);
      font-weight: 900;
      margin-bottom: 14px;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .86);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9500;
      padding: 18px;
    }

    .lightbox.hidden {
      display: none;
    }

    .lightbox img {
      max-width: 96vw;
      max-height: 88vh;
      border-radius: 16px;
      background: #fff;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table.simple {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
    }

    table.simple th,
    table.simple td {
      border: 1px solid var(--border);
      padding: 8px;
      text-align: left;
      vertical-align: top;
    }

    table.simple th {
      background: #f1f5f9;
      font-weight: 900;
    }

    .mini-note {
      font-size: var(--fs-sm);
      color: var(--muted);
      margin-top: 6px;
    }

    .image-thumb-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .image-thumb {
      width: 92px;
      height: 92px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #f8fafc;
      cursor: pointer;
    }

    @media print {
      body * {
        visibility: hidden;
      }

      #printArea,
      #printArea * {
        visibility: visible;
      }

      #printArea {
        display: block !important;
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        background: #fff;
      }
    }
  </style>
</head>

<body>
  <div id="loader" class="loader">
    <div class="loader-box">處理中...</div>
  </div>

  <div id="toast" class="toast"></div>

  <div id="printArea" class="hide"></div>

  <div id="lightboxModal" class="lightbox hidden" onclick="closeLightbox()">
    <img id="lightboxImage" alt="圖片預覽">
  </div>

  <div id="modalMask" class="modal-mask" onclick="maskClose(event)">
    <div id="modal" class="modal">
      <div class="modal-handle"></div>
    </div>
  </div>

  <header class="topbar">
    <button id="navBack" class="icon-btn disabled" onclick="historyBack()" aria-label="返回">←</button>
    <div class="brand">台灣帕金森病友權益促進會</div>
    <button id="loginBtn" class="icon-btn" onclick="go('login')" aria-label="登入">登入</button>
  </header>

  <main id="main" tabindex="-1"></main>

  <script>
    // =======================================================
    // 01. 全域設定
    // =======================================================

    const ORG_NAME = '台灣帕金森病友權益促進會';

    // TODO：請改成你的 GAS Web App URL
    const API_BASE = 'https://script.google.com/macros/s/AKfycbyNMeWAaSL2EqjJfon3jCSrsf_dnNuy6w5KW2p00sta97pZRGZbDAozZKK06gGg1LGo/exec';

    // 若不用 LINE LIFF，留空即可
    const LIFF_ID = '2009456572-588gzru4';

    const APP = {
      user: null,
      subjects: [],
      accounts: [],
      projects: [],
      members: []
    };

    let routeStack = [];

    let currentTipIndex = 0;
    let isSpeakingTip = false;

    let forumPosts = [];
    let selectedForumImages = [];

    const WARM_TIPS = [
      '☀️ 今天也辛苦了，記得慢慢來，每一步都算數。',
      '🌸 規律服藥與復健，是照顧自己的溫柔方式。',
      '💧 喝點水、伸展一下，讓身體有重新啟動的機會。',
      '🎈 如果今天狀態不好，也不是你的錯，請給自己一點時間。',
      '❤️ 你不是一個人，我們都在這裡陪你。',
      '🗣️ 發聲練習可以幫助說話更清楚，每天一點點就很好。'
    ];

    // =======================================================
    // 02. 基礎工具
    // =======================================================

    function $(id) {
      return document.getElementById(id);
    }

    function esc(s) {
      return String(s ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function jsStr(s) {
      return String(s ?? '')
        .replaceAll('\\', '\\\\')
        .replaceAll('`', '\\`')
        .replaceAll('${', '\\${')
        .replaceAll("'", "\\'")
        .replaceAll('"', '&quot;')
        .replaceAll('\n', '\\n')
        .replaceAll('\r', '');
    }

    function safeUrl(url) {
      url = String(url || '').trim();

      if (!url) return '#';

      if (/^https?:\/\//i.test(url)) return url;

      if (/^data:image\/(png|jpeg|jpg|gif|webp);base64,/i.test(url)) return url;

      return '#';
    }

    function today() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');

      return `${y}-${m}-${day}`;
    }

    function fmtMoney(n) {
      return 'NT$ ' + Number(n || 0).toLocaleString('zh-TW');
    }

    function textVal(id) {
      return $(id)?.value.trim() || '';
    }

    function numberVal(id, fallback = 0) {
      return Number($(id)?.value || fallback);
    }

    function checkedVal(id) {
      return $(id)?.checked ? 'Y' : 'N';
    }

    function yearOptions(selected) {
      const y = new Date().getFullYear();
      const s = selected || y;
      let html = '';

      for (let i = y - 3; i <= y + 2; i++) {
        html += `<option value="${i}"${Number(s) === i ? ' selected' : ''}>${i}</option>`;
      }

      return html;
    }

    function monthOptions(selected) {
      const s = String(selected || '');
      let html = '<option value="">全年</option>';

      for (let i = 1; i <= 12; i++) {
        const m = String(i).padStart(2, '0');
        html += `<option value="${m}"${s === m ? ' selected' : ''}>${m} 月</option>`;
      }

      return html;
    }

    function statusPill(status) {
      const s = String(status || '');
      let cls = 'pill';

      if (['有效會員', '有效', '已確認', '已付款', '已核准'].includes(s)) {
        cls += ' ok';
      } else if (['待審核'].includes(s)) {
        cls += ' warn';
      } else if (['已退回', '作廢', '已停用'].includes(s)) {
        cls += ' bad';
      }

      return `<span class="${cls}">${esc(s || '未設定')}</span>`;
    }

    // =======================================================
    // 03. API
    // =======================================================

    async function api(action, data = {}) {
      const payload = {
        action,
        _ua: navigator.userAgent || '',
        ...data
      };

      const token = localStorage.getItem('parkSessionToken') || '';

      if (token) {
        payload.sessionToken = token;
      }

      showLoad();

      try {
        const res = await fetch(API_BASE, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify(payload)
        });

        const text = await res.text();

        let json;

        try {
          json = JSON.parse(text);
        } catch(e) {
          console.error('API 非 JSON 回應：', text);
          throw new Error('API 非 JSON 回應，請檢查 GAS 部署與錯誤紀錄');
        }

        console.log('API', action, json);

        return json;

      } finally {
        hideLoad();
      }
    }

    async function runApi(action, data = {}, onSuccess) {
      try {
        const res = await api(action, data);

        if (!res.success) {
          const msg = res.message || '操作失敗';

          if (msg.includes('登入') || msg.includes('Session') || msg.includes('逾期')) {
            APP.user = null;
            localStorage.removeItem('parkUser');
            localStorage.removeItem('parkSessionToken');
            updateLoginButton();
          }

          toast(msg, 'e');
          return null;
        }

        if (typeof onSuccess === 'function') {
          onSuccess(res);
        }

        return res;

      } catch(e) {
        toast('連線失敗：' + e.message, 'e');
        return null;
      }
    }

    async function checkApiHealth() {
      try {
        const res = await fetch(API_BASE + '?action=ping');
        const data = await res.json();

        if (data.success) {
          toast('API 連線正常', 's');
          return true;
        }

        toast('API 回應異常', 'w');
        return false;

      } catch(e) {
        toast('API 無法連線：' + e.message, 'e');
        return false;
      }
    }

    // =======================================================
    // 04. UI
    // =======================================================

    function setMain(html) {
      const main = $('main');

      if (!main) return;

      main.innerHTML = html;

      try {
        main.focus();
      } catch(e) {}

      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
    }

    function showBack(show) {
      const b = $('navBack');

      if (!b) return;

      if (show) {
        b.classList.remove('disabled');
      } else {
        b.classList.add('disabled');
      }
    }

    function showLoad() {
      $('loader')?.classList.add('show');
    }

    function hideLoad() {
      $('loader')?.classList.remove('show');
    }

    function toast(msg, type = '') {
      const t = $('toast');

      if (!t) {
        alert(msg);
        return;
      }

      t.textContent = msg;
      t.className = 'toast show ' + type;

      clearTimeout(t._timer);

      t._timer = setTimeout(() => {
        t.className = 'toast';
      }, 2600);
    }

    function openModal(html) {
      const mask = $('modalMask');
      const modal = $('modal');

      if (!mask || !modal) return;

      modal.innerHTML = `
        <div class="modal-handle"></div>
        ${html}
      `;

      mask.classList.add('show');
    }

    function closeModal() {
      const mask = $('modalMask');
      const modal = $('modal');

      if (!mask || !modal) return;

      mask.classList.remove('show');
      modal.innerHTML = `<div class="modal-handle"></div>`;
    }

    function maskClose(event) {
      if (event.target && event.target.id === 'modalMask') {
        closeModal();
      }
    }

    function openProofImage(url) {
      url = safeUrl(url);

      if (!url || url === '#') {
        toast('沒有可預覽的圖片', 'w');
        return;
      }

      $('lightboxImage').src = url;
      $('lightboxModal').classList.remove('hidden');
    }

    function closeLightbox() {
      $('lightboxImage').src = '';
      $('lightboxModal').classList.add('hidden');
    }

    function printHtml(html) {
      const area = $('printArea');

      if (!area) {
        toast('找不到列印區域', 'e');
        return;
      }

      area.innerHTML = html;
      area.classList.remove('hide');

      setTimeout(() => {
        window.print();

        setTimeout(() => {
          area.innerHTML = '';
          area.classList.add('hide');
        }, 500);
      }, 100);
    }

    // =======================================================
    // 05. 權限與登入狀態
    // =======================================================

    function isAdminUser(user) {
      if (!user) return false;

      return [
        '管理員',
        '理事長',
        '理事',
        '監事',
        '會計',
        '出納',
        '總幹事',
        '行政秘書長'
      ].includes(user.type);
    }

    function requireLogin() {
      if (!APP.user) {
        toast('請先登入', 'w');
        go('login');
        return false;
      }

      return true;
    }

    function requireAdmin() {
      if (!requireLogin()) return false;

      if (!isAdminUser(APP.user)) {
        toast('權限不足，僅管理員可進入', 'e');
        go('home');
        return false;
      }

      return true;
    }

    function updateLoginButton() {
      const btn = $('loginBtn');

      if (!btn) return;

      if (APP.user) {
        btn.textContent = '登出';
        btn.onclick = logout;
        btn.setAttribute('aria-label', '登出');
      } else {
        btn.textContent = '登入';
        btn.onclick = function() {
          go('login');
        };
        btn.setAttribute('aria-label', '登入');
      }
    }

    async function logout() {
      if (!confirm('確定登出？')) return;

      try {
        await api('auth.logout', {
          sessionToken: localStorage.getItem('parkSessionToken') || ''
        });
      } catch(e) {

    // =======================================================
    // 06. 圖片壓縮與讀取
    // =======================================================

    async function compressImageFile(file, maxWidth = 960, quality = 0.68) {
      return new Promise((resolve) => {
        if (!file || !file.type || !file.type.startsWith('image/')) {
          resolve(null);
          return;
        }

        const reader = new FileReader();

        reader.onload = function(e) {
          const img = new Image();

          img.onload = function() {
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round(height * maxWidth / width);
              width = maxWidth;
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const mime = 'image/jpeg';
            const dataUrl = canvas.toDataURL(mime, quality);

            resolve({
              base64: dataUrl.split(',')[1],
              filename: String(file.name || 'upload.jpg').replace(/\.[^.]+$/, '') + '.jpg',
              mimeType: mime,
              dataUrl
            });
          };

          img.onerror = function() {
            resolve(null);
          };

          img.src = e.target.result;
        };

        reader.onerror = function() {
          resolve(null);
        };

        reader.readAsDataURL(file);
      });
    }

    async function getFileData(fileInputId) {
      const input = $(fileInputId);

      if (!input || !input.files || input.files.length === 0) return null;

      const file = input.files[0];

      if (!file.type.startsWith('image/')) {
        toast('只能上傳圖片檔案', 'w');
        return null;
      }

      const compressed = await compressImageFile(file, 960, 0.68);

      if (!compressed) {
        toast('圖片處理失敗，請換一張照片', 'e');
        return null;
      }

      return {
        base64: compressed.base64,
        filename: compressed.filename,
        mimeType: compressed.mimeType
      };
    }

    async function getMultipleImageData(fileInputId, maxCount) {
      const input = $(fileInputId);

      if (!input || !input.files || input.files.length === 0) return [];

      const files = Array.from(input.files).slice(0, maxCount || 4);
      const result = [];

      for (const file of files) {
        if (!file.type.startsWith('image/')) continue;

        const compressed = await compressImageFile(file, 960, 0.68);

        if (compressed) {
          result.push({
            base64: compressed.base64,
            filename: compressed.filename,
            mimeType: compressed.mimeType
          });
        }
      }

      return result;
    }

    function go(route, params = {}, push = true) {
      if (push) {
        routeStack.push({
          route,
          params
        });
      }

      showBack(routeStack.length > 1);

      switch(route) {
        case 'home':
          return renderHome();

        case 'login':
          return renderLogin();

        case 'register':
          return renderRegister();

        case 'memberCenter':
          return renderMemberCenter();

        case 'adminHome':
          return renderAdminHome();

        case 'memberManage':
          return renderMemberManage();

        case 'pendingPayments':
          return renderPendingPayments();

        case 'pendingDonations':
          return renderPendingDonations();

        case 'receiptList':
          return renderReceiptList();

        case 'voucherList':
          return renderVoucherList();

        case 'reportCenter':
          return renderReportCenter();

        case 'healthCenter':
          return renderHealthCenter();

        case 'forumHome':
          return renderForumHome();

        case 'forumCreatePost':
          return renderForumCreatePost();

        case 'financeIncome':
          return renderFinanceIncome();

        case 'expenseList':
          return renderExpenseList();

        case 'subjectManage':
          return renderSubjectManage();

        case 'accountManage':
          return renderAccountManage();

        case 'projectManage':
          return renderProjectManage();

        case 'budgetManage':
          return renderBudgetManage();

        case 'announcementManage':
          return renderAnnouncementManage();

        case 'systemSetting':
          return renderSystemSetting();

        default:
          return renderHome();
      }
    }

    function historyBack() {
      if (routeStack.length <= 1) {
        go('home', {}, false);
        return;
      }

      routeStack.pop();

      const last = routeStack[routeStack.length - 1];

      go(last.route, last.params, false);
    }

        subjectCode: textVal('expSubjectCode'),
        subjectName: textVal('expSubjectName'),
        account: textVal('expAccount'),
        project: textVal('expProject'),
        file
      }, () => {
        closeModal();
        toast('支出申請已建立', 's');
        renderExpenseList();
      });
    }

    async function approveExpense(id) {
      if (!confirm('確定核准此支出？')) return;

      await runApi('expense.approve', {
        id
      }, () => {
        toast('已核准', 's');
        renderExpenseList();
      });
    }

    async function rejectExpense(id) {
      const reason = prompt('請輸入退回原因') || '';

      if (!reason) return;

      await runApi('expense.reject', {
        id,
        reason
      }, () => {
        toast('已退回', 's');
        renderExpenseList();
      });
    }

    async function payExpense(id) {
      if (!confirm('確定已付款？')) return;

      await runApi('expense.confirmPaid', {
        id
      }, () => {
        toast('已付款', 's');
        renderExpenseList();
      });
    }

    async function printExpenseSlip(id) {
      const res = await runApi('expense.getSlipHtml', {
        id
      });

      if (res && res.html) {
        printHtml(res.html);
      }
    }

    // =======================================================
    // 17. 健康中心
    // =======================================================

    function renderHealthCenter() {
      if (!requireLogin()) return;

      setMain(`
        <div class="hero" style="background:linear-gradient(135deg,#7c3aed,#0f766e);">
          <h1>健康中心</h1>
          <div class="tagline">記錄每日狀態，協助自己與醫師追蹤變化</div>
        </div>

        <div class="card">
          <div class="card-title">今日健康紀錄</div>

          <div class="fg">
            <label class="flabel">日期</label>
            <input id="healthDate" class="fc" type="date" value="${today()}">
          </div>

          <div class="fg">
            <label class="flabel">今日心情</label>
            <select id="healthMood" class="fc">
              <option>😊</option>
              <option>🙂</option>
              <option>😐</option>
              <option>😟</option>
              <option>😣</option>
            </select>
          </div>

          <div class="fg">
            <label class="flabel">藥效狀態</label>
            <select id="healthState" class="fc">
              <option value="ON">ON，藥效佳</option>
              <option value="OFF">OFF，藥效差</option>
              <option value="波動">波動</option>
              <option value="未記錄">未記錄</option>
            </select>
          </div>

          <div class="fg">
            <label class="flabel">是否按時服藥</label>
            <select id="healthMedicine" class="fc">
              <option value="已按時">已按時</option>
              <option value="部分延遲">部分延遲</option>
              <option value="忘記">忘記</option>
              <option value="未記錄">未記錄</option>
            </select>
          </div>

          <div class="fg">
            <label class="flabel">今日運動分鐘</label>
            <input id="healthExercise" class="fc" type="number" value="0">
          </div>

          <div class="fg">
            <label class="flabel">運動類型</label>
            <input id="healthExerciseType" class="fc" placeholder="例如：散步、伸展、太極、復健">
          </div>

          <div class="fg">
            <label class="flabel">症狀</label>
            <textarea id="healthSymptoms" class="fc" placeholder="例如：手抖、僵硬、步態不穩、吞嚥困難等"></textarea>
          </div>

          <div class="fg">
            <label class="flabel">備註</label>
            <textarea id="healthNote" class="fc" placeholder="例如：早上手抖較明顯、下午走路較順..."></textarea>
          </div>

          <div class="btn-row">
            <button class="btn btn-primary" onclick="saveHealth()">儲存健康紀錄</button>
            <button class="btn btn-outline" onclick="loadHealthStats()">查看紀錄</button>
          </div>

          <button class="btn btn-outline" onclick="doctorReport()">產生醫師摘要</button>
          <button class="btn btn-ghost" onclick="healthAIHelp()">產生照護提醒</button>
        </div>

        <div id="healthStatsBox" class="card hide">
          <div class="card-title">健康紀錄</div>
          <div id="healthStatsContent"></div>
        </div>
      `);
    }

    async function saveHealth() {
      await runApi('health.save', {
        date: textVal('healthDate'),
        mood: textVal('healthMood'),
        state: textVal('healthState'),
        medicine: textVal('healthMedicine'),
        exerciseMins: numberVal('healthExercise'),
        exerciseType: textVal('healthExerciseType'),
        symptoms: textVal('healthSymptoms'),
        note: textVal('healthNote')
      }, () => {
        toast('健康紀錄已儲存', 's');
      });
    }

    async function loadHealthStats() {
      const res = await runApi('health.getStats');

      if (!res) return;

      $('healthStatsBox').classList.remove('hide');

      const items = res.items || [];

      $('healthStatsContent').innerHTML = items.slice().reverse().slice(0, 30).map(x => `
        <div class="item">
          <div class="item-title">${esc(x.date)}｜${esc(x.mood)}｜${esc(x.state)}</div>
          <div class="item-meta">
            服藥：${esc(x.medicine || '')}<br>
            運動：${Number(x.exerciseMins || 0)} 分｜${esc(x.exerciseType || '')}<br>
            症狀：${esc(x.symptoms || '')}<br>
            備註：${esc(x.note || '')}
          </div>
        </div>
      `).join('') || '<div class="item">尚無紀錄</div>';
    }

    async function doctorReport() {
      const res = await runApi('health.getDoctorReport');

      if (res && res.html) {
        printHtml(res.html);
      }
    }

    async function healthAIHelp() {
      const text = [
        textVal('healthSymptoms'),
        textVal('healthNote')
      ].join('\n');

      const res = await runApi('health.processAI', {
        text
      });

      if (res && res.result) {
        openModal(`
          <div class="modal-title">照護提醒</div>
          <div style="white-space:pre-wrap;line-height:1.8;">${esc(res.result)}</div>
          <button class="btn btn-ghost" onclick="closeModal()">關閉</button>
        `);
      }
    }

    // =======================================================
    // 18. 論壇交流區
    // =======================================================

    async function renderForumHome() {
      setMain(`
        <div class="hero" style="background:linear-gradient(135deg,#ea580c,#0f766e);">
          <h1>溫馨交流區</h1>
          <div class="tagline">病友、照顧者與家屬互相支持</div>
        </div>

        <div class="card">
          ${APP.user ? `
            <button class="btn btn-primary" onclick="go('forumCreatePost')">發布新貼文</button>
          ` : `
            <button class="btn btn-primary" onclick="go('login')">登入後發布貼文</button>
          `}
        </div>

        <div id="forumBox" class="card">
          <div class="card-title">最新貼文</div>
          <div>載入中...</div>
        </div>
      `);

      const res = await runApi('forum.getPosts');

      if (!res) return;

      forumPosts = res.items || [];

      $('forumBox').innerHTML = `
        <div class="card-title">最新貼文</div>
        ${forumPosts.map(p => `
          <div class="item">
            <div class="item-title">${p.pinned ? '📌 ' : ''}${esc(p.title)}</div>
            <div class="item-meta">
              ${esc(p.authorName)}｜${esc(p.category)}｜${esc(p.createdAt)}
            </div>

            <div style="margin-top:10px;">
              ${esc(p.content).replaceAll('\n', '<br>')}
            </div>

            ${(p.images || []).length ? `
              <div class="image-thumb-row">
                ${(p.images || []).map(img => `
                  <img src="${safeUrl(img)}" class="image-thumb" onclick="openProofImage('${jsStr(img)}')">
                `).join('')}
              </div>
            ` : ''}

            ${(p.links || []).length ? `
              <div style="margin-top:10px;">
                ${(p.links || []).map(link => `
                  <div>
                    🔗 <a href="${safeUrl(link.url)}" target="_blank" rel="noopener">${esc(link.title || link.url)}</a>
                  </div>
                `).join('')}
              </div>
            ` : ''}

            <div class="item-actions">
              ${APP.user ? `
                <button class="btn btn-outline" onclick="likePost('${jsStr(p.postId)}')">👍 ${Array.isArray(p.likes) ? p.likes.length : 0}</button>
                <button class="btn btn-outline" onclick="replyPost('${jsStr(p.postId)}')">回覆</button>
              ` : `
                <button class="btn btn-outline" onclick="go('login')">登入後互動</button>
              `}

              ${isAdminUser(APP.user) ? `
                <button class="btn btn-outline" onclick="pinPost('${jsStr(p.postId)}')">置頂 / 取消</button>
                <button class="btn btn-danger" onclick="deletePost('${jsStr(p.postId)}')">刪除</button>
              ` : ''}
            </div>

            ${(p.replies || []).length ? `
              <div style="margin-top:12px;border-top:1px solid var(--border);padding-top:10px;">
                ${(p.replies || []).map(r => `
                  <div style="margin:8px 0;">
                    <b>${esc(r.authorName)}</b>：${esc(r.content)}
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>
        `).join('') || '<div class="item">目前尚無貼文</div>'}
      `;
    }

    function renderForumCreatePost() {
      if (!requireLogin()) return;

      selectedForumImages = [];

      setMain(`
        <div class="hero">
          <h1>發布貼文</h1>
          <div class="tagline">分享經驗、心情或照護資訊</div>
        </div>

        <div class="card">
          <div class="fg">
            <label class="flabel">分類</label>
            <select id="postCategory" class="fc">
              <option>生活分享</option>
              <option>復健經驗</option>
              <option>用藥討論</option>
              <option>照顧者交流</option>
              <option>活動資訊</option>
            </select>
          </div>

          <div class="fg">
            <label class="flabel">標題</label>
            <input id="postTitle" class="fc">
          </div>

          <div class="fg">
            <label class="flabel">內容</label>
            <textarea id="postContent" class="fc"></textarea>
          </div>

          <div class="fg">
            <label class="flabel">圖片，最多 4 張，選填</label>
            <input id="postImages" class="fc" type="file" accept="image/*" multiple onchange="previewForumImages()">
            <div id="postImagePreview" class="image-thumb-row"></div>
          </div>

          <div class="fg">
            <label class="flabel">連結 URL，選填</label>
            <input id="postLinkUrl" class="fc" placeholder="https://...">
          </div>

          <div class="fg">
            <label class="flabel">連結標題，選填</label>
            <input id="postLinkTitle" class="fc">
          </div>

          <button class="btn btn-primary" onclick="submitPost()">發布</button>
          <button class="btn btn-ghost" onclick="go('forumHome')">取消</button>
        </div>
      `);
    }

    async function previewForumImages() {
      selectedForumImages = await getMultipleImageData('postImages', 4);

      const input = $('postImages');
      const box = $('postImagePreview');

      if (!box || !input) return;

      const files = Array.from(input.files || []).slice(0, 4);

      const previews = [];

      for (const file of files) {
        const compressed = await compressImageFile(file, 360, 0.65);

        if (compressed && compressed.dataUrl) {
          previews.push(compressed.dataUrl);
        }
      }

      box.innerHTML = previews.map(url => `
        <img src="${url}" class="image-thumb">
      `).join('');
    }

    async function submitPost() {
      const links = [];

      if (textVal('postLinkUrl')) {
        links.push({
          url: textVal('postLinkUrl'),
          title: textVal('postLinkTitle') || textVal('postLinkUrl')
        });
      }

      await runApi('forum.addPost', {
        category: textVal('postCategory'),
        title: textVal('postTitle'),
        content: textVal('postContent'),
        images: selectedForumImages,
        links
      }, () => {
        toast('貼文已發布', 's');
        go('forumHome');
      });
    }

    async function likePost(postId) {
      await runApi('forum.toggleLike', {
        postId
      }, () => {
        renderForumHome();
      });
    }

    async function replyPost(postId) {
      const content = prompt('請輸入回覆內容') || '';

      if (!content) return;

      await runApi('forum.addReply', {
        postId,
        content
      }, () => {
        toast('已回覆', 's');
        renderForumHome();
      });
    }

    async function pinPost(postId) {
      await runApi('forum.togglePin', {
        postId
      }, () => {
        renderForumHome();
      });
    }

    async function deletePost(postId) {
      if (!confirm('確定刪除此貼文？')) return;

      await runApi('forum.deletePost', {
        postId
      }, () => {
        toast('貼文已刪除', 's');
        renderForumHome();
      });
    }

    // =======================================================
    // 19. 溫馨提示 / LIFF
    // =======================================================

    function nextTip() {
      currentTipIndex = (currentTipIndex + 1) % WARM_TIPS.length;

      const el = $('warmTipText');

      if (el) {
        el.textContent = WARM_TIPS[currentTipIndex];
      }
    }

    function speakTip() {
      const text = WARM_TIPS[currentTipIndex] || '';

      if (!('speechSynthesis' in window)) {
        toast('此裝置不支援語音朗讀', 'w');
        return;
      }

      if (isSpeakingTip) {
        window.speechSynthesis.cancel();
        isSpeakingTip = false;

        if ($('speakTipBtn')) {
          $('speakTipBtn').textContent = '朗讀';
        }

        return;
      }

      const utterance = new SpeechSynthesisUtterance(
        text.replace(/[☀️🌸💧🎈❤️🗣️]/g, '')
      );

      utterance.lang = 'zh-TW';
      utterance.rate = 0.85;

      isSpeakingTip = true;

      if ($('speakTipBtn')) {
        $('speakTipBtn').textContent = '停止';
      }

      utterance.onend = function() {
        isSpeakingTip = false;

        if ($('speakTipBtn')) {
          $('speakTipBtn').textContent = '朗讀';
        }
      };

      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utterance);
    }

    async function initLiff() {
      if (!LIFF_ID) return;

      if (typeof liff === 'undefined') {
        console.warn('尚未載入 LIFF SDK');
        return;
      }

      try {
        await liff.init({
          liffId: LIFF_ID
        });

      } catch(e) {
        console.warn('LIFF 初始化失敗', e);
      }
    }

    async function loginWithLine() {
      if (!LIFF_ID || typeof liff === 'undefined') {
        toast('尚未設定 LINE 登入', 'w');
        return;
      }

      try {
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const accessToken = liff.getAccessToken();

        await runApi('auth.loginByLine', {
          accessToken
        }, (res) => {
          if (res.needCompleteProfile) {
            toast('請完成會員資料綁定', 'w');
            go('register');
            return;
          }

          APP.user = res.user;
          localStorage.setItem('parkUser', JSON.stringify(res.user));

          if (res.sessionToken) {
            localStorage.setItem('parkSessionToken', res.sessionToken);
          }

          updateLoginButton();
          toast('LINE 登入成功', 's');
          go('memberCenter');
        });

      } catch(e) {
        toast('LINE 登入失敗：' + e.message, 'e');
      }
    }

    // =======================================================
    // 20. 初始化
    // =======================================================

    window.addEventListener('error', function(e) {
      console.error('全域錯誤:', e.error || e.message);
      toast('系統發生錯誤：' + (e.message || '未知錯誤'), 'e');
    });

    window.addEventListener('unhandledrejection', function(e) {
      console.error('Promise 錯誤:', e.reason);

      const msg = e.reason && e.reason.message
        ? e.reason.message
        : '連線或系統錯誤，請稍後再試';

      toast(msg, 'e');
    });

    document.addEventListener('DOMContentLoaded', function() {
      const savedUser = localStorage.getItem('parkUser');

      if (savedUser) {
        try {
          APP.user = JSON.parse(savedUser);
        } catch(e) {
          APP.user = null;
          localStorage.removeItem('parkUser');
          localStorage.removeItem('parkSessionToken');
        }
      }

      updateLoginButton();

      try {
        initLiff();
      } catch(e) {
        console.warn('LIFF 初始化流程失敗', e);
      }

      routeStack = [];
      go('home', {}, true);
    });
  </script>
