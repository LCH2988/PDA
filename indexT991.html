    </div>
    <p class="font-bold mt-4 mb-2">目前藥效階段？</p>

      <button onclick="pick('medState','🟢 ON')" class="flex-1 p-3 rounded-xl bg-green-100">🟢 ON 順暢</button>
      <button onclick="pick('medState','🔴 OFF')" class="flex-1 p-3 rounded-xl bg-red-100">🔴 OFF 僵硬</button>

    <p class="font-bold mt-4 mb-2">服藥打卡</p>
    <div class="flex gap-2 flex-wrap" id="medTimeRow">

    </div>

<div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-xl hidden z-50"></div>

<script>
/* ============ 全域設定 ============ */
const API_URL = "https://script.google.com/macros/s/AKfycbykJAenReYqrnIA1lIjnx0nhln_1cw_5WxQks5guOM8A-A233WzGLNLyspNmN6d3N96/exec";
let currentUser = null;
let checkin = { mood:'', medState:'', medTimes:[], exerciseHrs:0.5, symptoms:[], memo:'' };
let forumCat = '全部';
const CATS = ['全部','用藥與復健','經驗分享','照護心得','門診諮詢'];
const SYMPTOMS = ['顫抖','步態凍結','便秘','睡眠障礙','吞嚥困難','頭暈'];

/* ============ API 通信 ============ */
async function api(action, data = {}) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: {'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ action, data, token: currentUser?.token || '' })
  });
  return res.json();
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.remove('hidden');
  setTimeout(()=>t.classList.add('hidden'), 2500);
}
function showPage(id) {
  document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  window.scrollTo(0,0);
  if (id==='page-forum') loadForum();
  if (id==='page-fee') loadFeeHistory();
  if (id==='page-donate') loadDonateHistory();
  if (id==='page-report') loadCharts();
}
function setFont(cls){ document.body.classList.remove('font-large','font-xlarge'); document.body.classList.add(cls); }
function toggleTremor(){ document.body.classList.toggle('tremor-mode'); }

/* ============ 語音 ============ */
function speak(text){
  const u = new SpeechSynthesisUtterance(text); u.lang='zh-TW'; speechSynthesis.speak(u);
}
function startSTT(targetId){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert('此瀏覽器不支援語音輸入，請使用 Chrome'); return; }
  const r = new SR(); r.lang='zh-TW'; r.interimResults=false;
  r.onresult = e => {
    const el = document.getElementById(targetId);
    el.value = (el.value ? el.value + ' ' : '') + e.results[0][0].transcript;
  };
  r.start(); toast('🎤 請開始說話...');
}

/* ============ 登入 ============ */
async function doLogin(){
  const name = document.getElementById('loginName').value.trim();
  const phone = document.getElementById('loginPhone').value.trim();
  if(!name || !phone) return toast('請填寫姓名與手機');
  const r = await api('member.login', {name, phone});
  if(r.ok){
    currentUser = r.member;
    localStorage.setItem('pdp_token', r.token);
    enterMain();
  } else toast(r.msg || '驗證失敗，請確認姓名與手機');
}
async function applyMember(){
  const r = await api('member.apply', {
    name: document.getElementById('applyName').value.trim(),
    phone: document.getElementById('applyPhone').value.trim()
  });
  toast(r.ok ? '申請已送出，請等候秘書處審核！' : (r.msg||'申請失敗'));
  if(r.ok) showPage('page-login');
}
function enterMain(){
  document.getElementById('welcomeMsg').textContent = `您好，${currentUser.name}！`;
  document.getElementById('dailyTip').textContent = currentUser.dailyTip || '記得按時服藥、保持運動，今天也要加油！';
  document.getElementById('adminNavBtn').classList.toggle('hidden', !currentUser.isAdmin);
  showPage('page-main');
}

/* ============ 健康打卡 ============ */
function pick(field, val){
  checkin[field] = val;
  toast(`已選擇：${val}`);
}
function toggleBtn(btn, arrKey, val){
  const arr = checkin[arrKey];
  const i = arr.indexOf(val);
  if(i>=0){ arr.splice(i,1); btn.classList.remove('bg-blue-300'); }
  else { arr.push(val); btn.classList.add('bg-blue-300'); }
}
(function initSymptoms(){
  document.getElementById('symptomRow').innerHTML = SYMPTOMS.map(s=>
    `<button onclick="toggleBtn(this,'symptoms','${s}')" class="p-3 rounded-xl bg-gray-100">${s}</button>`).join('');
})();
async function saveCheckin(){

/* ============ 復健工具 ============ */
let metroTimer=null, beatOn=false;
function toggleMetronome(){
  if(metroTimer){ clearInterval(metroTimer); metroTimer=null;
    document.getElementById('metronomeBtn').textContent='▶️ 啟動節拍器';
    document.getElementById('beatDot').className='w-24 h-24 mx-auto mt-3 rounded-full bg-gray-200'; return; }
  const bpm = +document.getElementById('bpmSlider').value;
  const ctx = new (window.AudioContext||window.webkitAudioContext)();
  let hi = true;
  const beep = freq => { const o=ctx.createOscillator(), g=ctx.createGain();
    o.frequency.value=freq; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.3, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.15);
    o.start(); o.stop(ctx.currentTime+0.15); };
  metroTimer = setInterval(()=>{
    beep(hi?880:440);
    const dot = document.getElementById('beatDot');
    dot.className = `w-24 h-24 mx-auto mt-3 rounded-full ${hi?'bg-blue-500 blink-dot':'bg-blue-200'}`;
    hi = !hi;
  }, 60000/bpm);
  document.getElementById('metronomeBtn').textContent='⏹️ 停止節拍器';
}

async function startVoicePractice(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const ctx = new AudioContext(); const src = ctx.createMediaStreamSource(stream);
    const an = ctx.createAnalyser(); an.fftSize=256; src.connect(an);
    const data = new Uint8Array(an.frequencyBinCount);
    let maxVol=0, elapsed=0;
    const iv = setInterval(()=>{
      an.getByteFrequencyData(data);
      const vol = data.reduce((a,b)=>a+b,0)/data.length;
      maxVol = Math.max(maxVol, vol);
      document.getElementById('volBar').style.width = Math.min(100, vol*2)+'%';
      if(++elapsed>=50){ clearInterval(iv); stream.getTracks().forEach(t=>t.stop());
        const score = Math.round(Math.min(100, maxVol*2.5));
        document.getElementById('voiceScore').textContent=`發聲強度評分：${score} 分`;
        api('health.saveVoiceScore',{score});
      }
    },100);
  }catch(e){ alert('請允許麥克風權限'); }
}

/* ============ 交流區 ============ */
function renderCats(){
  document.getElementById('forumCats').innerHTML = CATS.map(c=>
    `<button onclick="forumCat='${c}';renderCats();loadForum()"
      class="px-4 py-2 rounded-full whitespace-nowrap ${forumCat===c?'bg-blue-600 text-white':'bg-white'}">${c}</button>`).join('');
}
async function loadForum(){
  renderCats();
  const r = await api('forum.list', {category: forumCat});
  if(!r.ok) return;
  const favs = JSON.parse(localStorage.getItem('pdp_favs')||'[]');
  document.getElementById('forumList').innerHTML = r.posts.map(p=>`
    <div class="bg-white rounded-2xl p-4 shadow">
      <div class="flex justify-between items-start">
        <span class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded">${p.category}</span>
        <div>
          <button onclick="toggleFav('${p.id}')" class="mr-2">${favs.includes(p.id)?'🔖':'📑'}</button>
          ${currentUser?.isAdmin?`<button onclick="adminTogglePin('${p.id}')" class="mr-2">📌</button>
          <button onclick="adminDeletePost('${p.id}')" class="text-red-500">🗑️</button>`:''}
        </div>
      </div>
      <h3 class="font-bold text-lg mt-2">${p.pinned?'📌 ':''}${p.title}</h3>
      <p class="text-gray-600 mt-1 whitespace-pre-wrap">${p.body}</p>
      ${p.link?`<a href="${p.link}" target="_blank" class="text-blue-600 underline mt-1 block">🔗 附加連結</a>`:''}
      ${p.images?.length?`<div class="flex gap-2 mt-2">${p.images.map(u=>`<img src="${u}" class="w-24 h-24 object-cover rounded-lg cursor-pointer" onclick="window.open('${u}')">`).join('')}</div>`:''}
      <div class="flex items-center gap-4 mt-3 text-sm text-gray-500">
        <button onclick="likePost('${p.id}')" class="${p.likedByMe?'text-red-500':''}">❤️ ${p.likes}</button>
        <span>💬 ${p.commentCount||0}</span>
        <span>${p.author} · ${p.date}</span>
      </div>
    </div>`).join('') || '<p class="text-center text-gray-400 py-8">目前沒有貼文</p>';
}
function toggleFav(id){
  let favs = JSON.parse(localStorage.getItem('pdp_favs')||'[]');
  favs = favs.includes(id) ? favs.filter(f=>f!==id) : [...favs, id];
  localStorage.setItem('pdp_favs', JSON.stringify(favs));
  toast(favs.includes(id)?'已加入收藏':'已取消收藏'); loadForum();
}
async function likePost(id){
  const r = await api('forum.like', {postId:id});
  if(r.ok) loadForum();
}
async function submitPost(){
  const title = document.getElementById('postTitle').value.trim();
  const body = document.getElementById('postBody').value.trim();
  if(!title) return toast('請輸入標題');
  const files = document.getElementById('postImgs').files;
  const toB64 = f => new Promise(res=>{ const rd=new FileReader();
    rd.onload=()=>res(rd.result.split(',')[1]); rd.readAsDataURL(f); });
  const images = [];
  for(let i=0;i<Math.min(3,files.length);i++) images.push(await toB64(files[i]));
  const r = await api('forum.post', {
    category: document.getElementById('postCat').value, title, body,
    link: document.getElementById('postLink').value, images
  });
  toast(r.ok?'✅ 貼文已發布！':'發布失敗');
  if(r.ok){ showPage('page-forum'); }
}

/* ============ 幹部後台 ============ */
async function adminLoad(tab){
  const panel = document.getElementById('adminPanel');
  panel.innerHTML = '<p class="text-center py-4">載入中...</p>';
  const r = await api('admin.list', {tab});
  if(!r.ok){ panel.innerHTML='載入失敗'; return; }
  if(tab==='fee' || tab==='donate'){
    panel.innerHTML = r.records.map(x=>`
      <div class="bg-white rounded-xl p-4 shadow mb-2">
        <div class="font-bold">${x.memberName} - ${tab==='fee'?x.year+' 會費':'NT$'+x.amount+' 捐款'}</div>
        <div class="text-sm text-gray-500">後五碼：${x.last5||'-'} · ${x.date} · ${x.status}</div>
        ${x.status==='待審核'?`<button onclick="adminApprove('${tab}','${x.id}')"
          class="mt-2 bg-green-600 text-white rounded-lg px-4 py-2">✅ 確認入帳並開收據</button>`:''}
      </div>`).join('') || '<p class="text-center text-gray-400">無待審資料</p>';
  } else if(tab==='members'){
    panel.innerHTML = `<input class="w-full border rounded-xl p-3 mb-2" placeholder="搜尋會員..."
        oninput="adminSearchMembers(this.value)">
      <div id="memberList">${r.members.map(m=>`
        <div class="bg-white rounded-xl p-4 shadow mb-2">
          <b>${m.name}</b> · ${m.phone} · <span class="${m.status==='有效會員'?'text-green-600':'text-gray-500'}">${m.status}</span>
          <div class="text-sm text-gray-500">到期：${m.expiry||'-'}</div>
        </div>`).join('')}</div>`;
  } else if(tab==='voucher'){
    panel.innerHTML = r.vouchers.map(v=>`
      <div class="bg-white rounded-xl p-4 shadow mb-2 text-sm">
        <b>${v.voucherNo}</b> · ${v.date}<br>
        借：${v.debitAccount} NT$${v.amount} ／ 貸：${v.creditAccount}
        <div class="text-gray-500">${v.summary}</div>
      </div>`).join('');
  } else {
    panel.innerHTML = `<div class="bg-white rounded-xl p-4 shadow"><pre class="text-sm whitespace-pre-wrap">${JSON.stringify(r.data,null,2)}</pre></div>`;
  }
}
async function adminApprove(tab, id){
  if(!confirm('確認款項已入帳？將自動開立收據並產生會計傳票。')) return;
  const r = await api('admin.approve', {tab, id});
  toast(r.ok?'✅ 已審核通過，收據與傳票已自動產生！':(r.msg||'失敗'));
  adminLoad(tab);
}
async function adminSearchMembers(kw){
  const r = await api('admin.list', {tab:'members', keyword:kw});
  if(r.ok) document.getElementById('memberList').innerHTML = r.members.map(m=>
    `<div class="bg-white rounded-xl p-4 shadow mb-2"><b>${m.name}</b> · ${m.status}</div>`).join('');
}

(async function init(){
  initYears();
  const token = localStorage.getItem('pdp_token');
  if(token){
    const r = await api('member.tokenLogin', {token});
    if(r.ok){ currentUser = r.member; enterMain(); return; }
  }
  showPage('page-login');
})();
</script>
