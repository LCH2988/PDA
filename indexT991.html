<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台灣帕金森病友權益促進會</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root { --bg:#f6f8fb; --fg:#1b2733; --card:#fff; --pri:#1a6fb5; --pri-fg:#fff; --bd:#c9d3de; --warn:#b3261e; --ok:#1e7a3c; --fs:18px; }
  html[data-font="large"]  { --fs:22px; }
  html[data-font="xlarge"] { --fs:26px; }
  html[data-contrast="high"] { --bg:#000; --fg:#ffeb3b; --card:#111; --pri:#ffeb3b; --pri-fg:#000; --bd:#ffeb3b; --warn:#ff8a80; --ok:#a5ff9e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-size:var(--fs); line-height:1.6;
         font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif; padding-bottom:84px; }
  header { position:sticky; top:0; z-index:5; background:var(--card); border-bottom:2px solid var(--bd); padding:8px 12px; }
  header h1 { font-size:1em; margin:0 0 6px; }
  .tools { display:flex; gap:8px; flex-wrap:wrap; }
  button, .btn { min-height:64px; padding:0 18px; font-size:1em; border-radius:12px; border:2px solid var(--pri);
         background:var(--pri); color:var(--pri-fg); cursor:pointer; font-family:inherit; }
  button.sec { background:var(--card); color:var(--fg); border-color:var(--bd); }
  button.tool { min-height:48px; padding:0 12px; font-size:.85em; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline:4px solid #ff9800; outline-offset:2px; }
  main { padding:12px; max-width:760px; margin:0 auto; }
  .card { background:var(--card); border:2px solid var(--bd); border-radius:14px; padding:14px; margin:12px 0; }
  .card h2, .card h3 { margin:0 0 8px; font-size:1.1em; }
  label { display:block; margin:12px 0 4px; font-weight:bold; }
  input, select, textarea { width:100%; min-height:56px; font-size:1em; padding:8px 10px; border:2px solid var(--bd);
         border-radius:10px; background:var(--card); color:var(--fg); font-family:inherit; }
  textarea { min-height:100px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; } .row > * { flex:1 1 140px; }
  .msg { padding:12px; border-radius:10px; margin:10px 0; border:2px solid var(--bd); }
  .msg.err { border-color:var(--warn); color:var(--warn); } .msg.ok { border-color:var(--ok); color:var(--ok); }
  .tag { display:inline-block; padding:2px 10px; border-radius:99px; border:2px solid var(--warn); color:var(--warn); font-size:.8em; margin-right:6px; }
  .muted { opacity:.75; font-size:.85em; }
  nav.tabs { position:fixed; bottom:0; left:0; right:0; display:flex; background:var(--card); border-top:2px solid var(--bd); z-index:5; }
  nav.tabs button { flex:1; border-radius:0; border:0; background:var(--card); color:var(--fg); min-height:72px; }
  nav.tabs button[aria-current="page"] { background:var(--pri); color:var(--pri-fg); }
  iframe.doc { width:100%; height:520px; border:2px solid var(--bd); background:#fff; border-radius:10px; }
  .hidden { display:none !important; }
  .spinner { text-align:center; padding:40px 0; }
  .scale { display:flex; gap:6px; } .scale button { flex:1; min-height:56px; } .scale button[aria-pressed="true"] { background:var(--pri); color:var(--pri-fg); }
</style>
</head>
<body>
<header>
  <h1>台灣帕金森病友權益促進會</h1>
  <div class="tools" role="toolbar" aria-label="閱讀輔助">
    <button class="tool sec" id="btnFont" type="button">字體:標準</button>
    <button class="tool sec" id="btnContrast" type="button">高對比:關</button>
    <button class="tool sec" id="btnSpeak" type="button">🔊 朗讀</button>
  </div>
</header>
<main id="main" aria-live="polite"></main>
<nav class="tabs hidden" id="tabs" aria-label="主選單"></nav>

<script>
'use strict';
/* ========== 設定(部署時填入) ========== */
const CONFIG = {
  GAS_URL: 'https://script.google.com/macros/s/AKfycbyexYN2KY9fSNdfwHRqDldCSTBY3PwOb_zYRgox7-9bqvZ4mAl__CsbEfCwu6aF9zDghw/exec',
  LIFF_ID: '2009456572-588gzru4',
  SESSION_KEY: 'pd_session',
  PREF_KEY: 'pd_pref'
};

/* ========== DOM 小工具(一律用 textContent,避免 XSS) ========== */
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    const v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  kids.flat().forEach(c => { if (c !== null && c !== undefined && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return e;
}
const $main = document.getElementById('main');
function render(...nodes) { $main.replaceChildren(...nodes.flat()); window.scrollTo(0, 0); }
function msg(text, kind) { return h('div', { class: 'msg ' + (kind || ''), role: kind === 'err' ? 'alert' : 'status' }, text); }
function loading(t) { return h('div', { class: 'spinner' }, t || '載入中…'); }
function field(label, input, id) { return h('div', null, h('label', { for: id }, label), input); }
function fmtDate(s) { return String(s || '').slice(0, 10); }

/* ========== 偏好設定:字體、對比、朗讀 ========== */
const pref = (function () {
  let p = { font: 'normal', contrast: 'normal' };
  try { p = Object.assign(p, JSON.parse(localStorage.getItem(CONFIG.PREF_KEY) || '{}')); } catch (e) {}
  return p;
})();
function applyPref() {
  document.documentElement.dataset.font = pref.font;
  document.documentElement.dataset.contrast = pref.contrast;
  document.getElementById('btnFont').textContent = '字體:' + ({ normal: '標準', large: '大', xlarge: '特大' })[pref.font];
  document.getElementById('btnContrast').textContent = '高對比:' + (pref.contrast === 'high' ? '開' : '關');
  try { localStorage.setItem(CONFIG.PREF_KEY, JSON.stringify(pref)); } catch (e) {}
}
document.getElementById('btnFont').onclick = () => {
  pref.font = ({ normal: 'large', large: 'xlarge', xlarge: 'normal' })[pref.font] || 'normal'; applyPref();
};
document.getElementById('btnContrast').onclick = () => { pref.contrast = pref.contrast === 'high' ? 'normal' : 'high'; applyPref(); };
document.getElementById('btnSpeak').onclick = () => {
  if (!('speechSynthesis' in window)) { alert('此裝置不支援語音朗讀'); return; }
  if (speechSynthesis.speaking) { speechSynthesis.cancel(); return; }
  const u = new SpeechSynthesisUtterance($main.innerText.slice(0, 3000));
  u.lang = 'zh-TW'; u.rate = 0.9; speechSynthesis.speak(u);
};
applyPref();

/* ========== Session ========== */
const Session = {
  get() {
    try {
      const s = JSON.parse(localStorage.getItem(CONFIG.SESSION_KEY) || 'null');
      if (s && new Date(s.expiresAt).getTime() > Date.now()) return s;
    } catch (e) {}
    this.clear(); return null;
  },
  set(token, expiresAt, profile) { localStorage.setItem(CONFIG.SESSION_KEY, JSON.stringify({ token, expiresAt, profile })); },
  clear() { localStorage.removeItem(CONFIG.SESSION_KEY); }
};

/* ========== API 呼叫層 ========== */
class ApiFail extends Error { constructor(code, message, extra) { super(message); this.code = code; this.extra = extra || {}; } }
const sleep = ms => new Promise(r => setTimeout(r, ms));
function newRequestId() {
  return (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(16).slice(2)).replace(/[^A-Za-z0-9_-]/g, '');
}
/**
 * opts.write=true:自動加 requestId(重試時沿用同一個,伺服器不會重複執行)
 * 讀取類遇到網路錯誤自動重試 2 次;寫入類也重試,但靠 requestId 保證不重複。
 */
async function api(action, params, opts) {
  opts = opts || {};
  params = Object.assign({}, params || {});
  if (opts.write && !params.requestId) params.requestId = newRequestId();
  const s = Session.get();
  const body = JSON.stringify({ action, token: opts.token || (s && s.token) || '', params, userAgent: navigator.userAgent.slice(0, 150) });
  let lastErr;
  for (let i = 0; i < 3; i++) {
    try {
      const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 60000);
      const resp = await fetch(CONFIG.GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body, signal: ctl.signal });
      clearTimeout(timer);
      const j = await resp.json();
      if (j.ok) return j.data;
      const err = new ApiFail(j.code, j.message, j.extra);
      if (j.code === 'BUSY' && i < 2) { lastErr = err; await sleep(1500 * (i + 1)); continue; }
      throw err;
    } catch (e) {
      if (e instanceof ApiFail) {
        if (e.code === 'AUTH' && s) { Session.clear(); }
        throw e;
      }
      lastErr = new ApiFail('NETWORK', '網路不穩,請確認連線後再試');
      await sleep(1200 * (i + 1));
    }
  }
  throw lastErr;
}
function errText(e) {
  if (e && e.code === 'LOCKED' && e.extra && e.extra.retryAfterSec) return e.message + '(約 ' + Math.ceil(e.extra.retryAfterSec / 60) + ' 分鐘後再試)';
  return (e && e.message) || '發生錯誤';
}
/** 送出按鈕包裝:處理中停用、完成後還原 */
async function guarded(btn, fn, box) {
  const old = btn.textContent; btn.disabled = true; btn.textContent = '處理中…';
  try { await fn(); }
  catch (e) {
    if (e.code === 'AUTH') { start(); return; }
    (box || $main).prepend(msg(errText(e), 'err'));
  } finally { btn.disabled = false; btn.textContent = old; }
}

/* ========== 圖片壓縮(8-2 的憑證與論壇會用) ========== */
async function fileToBase64(file) {
  if (file.type === 'application/pdf') {
    if (file.size > 5 * 1024 * 1024) throw new ApiFail('VALIDATION', 'PDF 不可超過 5MB');
    return readAsDataUrl(file);
  }
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) throw new ApiFail('VALIDATION', '只接受 JPG、PNG、WebP 或 PDF');
  const bmp = await createImageBitmap(file);
  const r = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * r); cv.height = Math.round(bmp.height * r);
  cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
  let q = 0.85, url = cv.toDataURL('image/jpeg', q);
  while (url.length * 0.75 > 2.8 * 1024 * 1024 && q > 0.4) { q -= 0.1; url = cv.toDataURL('image/jpeg', q); }
  return url;
}
function readAsDataUrl(f) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); }); }

/* ========== 啟動與登入 ========== */
async function start() {
  document.getElementById('tabs').classList.add('hidden');
  render(loading('正在確認身分…'));
  try {
    await liff.init({ liffId: CONFIG.LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    const idToken = liff.getIDToken();
    if (!idToken) { liff.logout(); liff.login(); return; }
    const r = await api('lineLogin', { idToken }, { token: '' });
    handleAuthResult(r);
  } catch (e) {
    render(msg(errText(e), 'err'), h('button', { onclick: start }, '重新嘗試'));
  }
}

function handleAuthResult(r) {
  if (r.state === 'OK') { Session.set(r.sessionToken, r.expiresAt, r.profile); showApp(); }
  else if (r.state === 'NEED_BIND') showBindChoice(r.bindToken);
  else if (r.state === 'PENDING') render(h('div', { class: 'card' }, h('h2', null, '審核中'), h('p', null, (r.name || '') + ' 您好,資料已送出,協會審核通過後即可使用。')),
                                         h('button', { class: 'sec', onclick: start }, '重新檢查'));
  else if (r.state === 'DISABLED') render(msg('此帳號已停用,請聯絡協會。', 'err'));
}

function showBindChoice(bindToken) {
  render(h('div', { class: 'card' }, h('h2', null, '歡迎使用'), h('p', null, '請選擇您的身分:')),
    h('button', { style: 'width:100%;margin:8px 0', onclick: () => showBindExisting(bindToken) }, '我已是會員'),
    h('button', { class: 'sec', style: 'width:100%;margin:8px 0', onclick: () => showApply(bindToken) }, '我要加入會員'));
}

function showBindExisting(bindToken) {
  const name = h('input', { id: 'bn', autocomplete: 'name' });
  const phone = h('input', { id: 'bp', type: 'tel', inputmode: 'numeric', autocomplete: 'tel' });
  const last4 = h('input', { id: 'bl', maxlength: '4', autocomplete: 'off' });
  const btn = h('button', { style: 'width:100%;margin-top:16px' }, '確認綁定');
  btn.onclick = () => guarded(btn, async () => {
    const r = await api('bindExisting', { bindToken, name: name.value, phone: phone.value, idLast4: last4.value }, { token: '' });
    handleAuthResult(r);
  });
  render(h('div', { class: 'card' }, h('h2', null, '會員核對'),
    field('姓名', name, 'bn'), field('手機號碼', phone, 'bp'), field('身分證字號後四碼', last4, 'bl'), btn,
    h('p', { class: 'muted' }, '連續輸入錯誤 5 次會暫時鎖定 30 分鐘。')),
    h('button', { class: 'sec', onclick: () => showBindChoice(bindToken) }, '返回'));
}

function showApply(bindToken) {
  const f = {
    name: h('input', { id: 'an' }), phone: h('input', { id: 'ap', type: 'tel', inputmode: 'numeric' }),
    identityId: h('input', { id: 'ai', autocomplete: 'off' }), email: h('input', { id: 'ae', type: 'email' }),
    address: h('input', { id: 'aa' }),
    memberType: h('select', { id: 'at' }, h('option', { value: '病友' }, '病友'), h('option', { value: '家屬' }, '家屬'))
  };
  const btn = h('button', { style: 'width:100%;margin-top:16px' }, '送出申請');
  btn.onclick = () => guarded(btn, async () => {
    const p = { bindToken }; Object.keys(f).forEach(k => p[k] = f[k].value);
    handleAuthResult(await api('applyNew', p, { token: '' }));
  });
  render(h('div', { class: 'card' }, h('h2', null, '加入會員'),
    field('姓名(必填)', f.name, 'an'), field('手機號碼(必填)', f.phone, 'ap'),
    field('身分證或居留證號(必填)', f.identityId, 'ai'), field('身分', f.memberType, 'at'),
    field('Email', f.email, 'ae'), field('通訊地址', f.address, 'aa'), btn,
    h('p', { class: 'muted' }, '資料僅供會員管理使用。')),
    h('button', { class: 'sec', onclick: () => showBindChoice(bindToken) }, '返回'));
}

/* ========== 主畫面與分頁 ========== */
const TABS = [
  { id: 'home', label: '公告', view: viewHome },
  { id: 'health', label: '健康', view: viewHealth },
  { id: 'more', label: '更多', view: viewMore }   // 8-2 會在這裡加入財務、論壇、管理
];
function showApp(tabId) {
  const s = Session.get(); if (!s) { start(); return; }
  const nav = document.getElementById('tabs'); nav.classList.remove('hidden');
  nav.replaceChildren(...TABS.map(t => h('button', { type: 'button', 'aria-current': t.id === (tabId || 'home') ? 'page' : null, onclick: () => showApp(t.id) }, t.label)));
  (TABS.find(t => t.id === (tabId || 'home')) || TABS[0]).view(s.profile);
}

/* ----- 公告 ----- */
async function viewHome(profile) {
  render(h('div', { class: 'card' }, h('h2', null, (profile.name || '') + ' 您好'),
    h('p', { class: 'muted' }, '會員編號:' + profile.memberId + '　到期日:' + (fmtDate(profile.expiryDate) || '尚未設定'))), loading());
  try {
    const list = await api('listAnnouncements');
    const box = list.length ? list.map(a => h('div', { class: 'card' },
      h('h3', null, a.isPinned ? '📌 ' : '', a.isImportant ? h('span', { class: 'tag' }, '重要') : null, a.title),
      h('div', { class: 'muted' }, fmtDate(a.publishedAt) + '　' + a.category + (a.audience === 'MEMBER' ? '　會員限定' : '')),
      h('p', { style: 'white-space:pre-wrap' }, a.content),
      a.linkUrl ? h('a', { href: a.linkUrl, target: '_blank', rel: 'noopener noreferrer' }, '相關連結') : null))
      : [h('p', null, '目前沒有公告')];
    render(h('div', { class: 'card' }, h('h2', null, (profile.name || '') + ' 您好'),
      h('p', { class: 'muted' }, '會員編號:' + profile.memberId + '　到期日:' + (fmtDate(profile.expiryDate) || '尚未設定'))), box);
  } catch (e) { $main.append(msg(errText(e), 'err')); }
}

/* ----- 更多(暫放登出與健康資料同意;8-2 擴充) ----- */
function viewMore(profile) {
  const consent = h('input', { type: 'checkbox', id: 'hc', style: 'width:28px;min-height:28px;margin-right:8px' });
  consent.checked = !!profile.healthConsent;
  const save = h('button', { class: 'sec', style: 'width:100%' }, '儲存設定');
  save.onclick = () => guarded(save, async () => {
    await api('updateMyProfile', { healthConsent: consent.checked }, { write: true });
    const s = Session.get(); s.profile.healthConsent = consent.checked; Session.set(s.token, s.expiresAt, s.profile);
    $main.prepend(msg('已儲存', 'ok'));
  });
  const out = h('button', { class: 'sec', style: 'width:100%;margin-top:12px' }, '登出');
  out.onclick = async () => { try { await api('logout'); } catch (e) {} Session.clear(); try { liff.logout(); } catch (e) {} location.reload(); };
  render(h('div', { class: 'card' }, h('h2', null, '個人設定'),
    h('label', { for: 'hc', style: 'font-weight:normal' }, consent, '同意協會授權人員(理事長、總幹事、行政秘書長)在必要時查看我的健康記錄'),
    save),
    h('div', { id: 'moreSlot' }, h('p', { class: 'muted' }, '財務、論壇、管理功能將於 8-2 加入。')), out);
}

/* ----- 健康記錄 ----- */
function viewHealth() {
  const st = { mood: '', state: '' };
  const choice = (key, items) => {
    const wrap = h('div', { class: 'scale', role: 'group' });
    items.forEach(([v, t]) => {
      const b = h('button', { type: 'button', class: 'sec', 'aria-pressed': 'false' }, t);
      b.onclick = () => { st[key] = st[key] === v ? '' : v; [...wrap.children].forEach(c => c.setAttribute('aria-pressed', 'false')); if (st[key] !== '') b.setAttribute('aria-pressed', 'true'); };
      wrap.append(b);
    });
    return wrap;
  };
  const f = {
    exerciseMin: h('input', { id: 'hx', type: 'number', inputmode: 'numeric', min: '0', max: '600' }),
    sleepHours: h('input', { id: 'hs', type: 'number', inputmode: 'decimal', min: '0', max: '24', step: '0.5' }),
    tapScore: h('input', { id: 'ht', type: 'number', inputmode: 'numeric', min: '0', max: '1000' }),
    vocalScore: h('input', { id: 'hv', type: 'number', inputmode: 'numeric', min: '0', max: '1000' }),
    medication: h('textarea', { id: 'hm', maxlength: '300', placeholder: '例:早上 8 點、中午 12 點、晚上 6 點都有吃' }),
    symptoms: h('textarea', { id: 'hy', maxlength: '500' }),
    doctorQuestion: h('textarea', { id: 'hq', maxlength: '500', placeholder: '想問醫師的問題' }),
    note: h('textarea', { id: 'hn', maxlength: '1000' })
  };
  const save = h('button', { style: 'width:100%;margin-top:16px' }, '儲存今天的記錄');
  save.onclick = () => guarded(save, async () => {
    const p = { mood: st.mood, state: st.state }; Object.keys(f).forEach(k => p[k] = f[k].value);
    const r = await api('saveHealthLog', p, { write: true });
    loadList(); $main.prepend(msg(r.updated ? '已更新今天的記錄' : '已儲存', 'ok'));
  });
  const listBox = h('div', null, loading());
  const aiBox = h('div');
  const ai = h('button', { class: 'sec', style: 'width:100%;margin-top:8px' }, '✨ AI 整理回診備忘');
  ai.onclick = () => guarded(ai, async () => {
    const r = await api('aiSummarize', { days: 14 });
    aiBox.replaceChildren(h('div', { class: 'card' }, h('h3', null, '回診備忘'), h('p', { style: 'white-space:pre-wrap' }, r.summary), h('p', { class: 'muted' }, r.disclaimer)));
    loadList();
  }, aiBox);
  const vs = h('button', { class: 'sec', style: 'width:100%;margin-top:8px' }, '📄 產生看診摘要(可列印)');
  vs.onclick = () => guarded(vs, async () => {
    const r = await api('visitSummaryHtml', { days: 30 });
    const fr = h('iframe', { class: 'doc', sandbox: 'allow-same-origin allow-modals', title: '看診摘要' }); fr.srcdoc = r.html;
    const pr = h('button', { style: 'width:100%;margin-top:8px', onclick: () => fr.contentWindow.print() }, '列印');
    aiBox.replaceChildren(fr, pr);
  }, aiBox);

  async function loadList() {
    try {
      const list = await api('listHealthLogs', { days: 14 });
      listBox.replaceChildren(...(list.length ? list.map(r => h('div', { class: 'card' },
        h('b', null, fmtDate(r.logDate)), h('div', null, '心情 ' + (r.mood || '-') + '　藥效 ' + (r.state || '-') + '　運動 ' + (r.exerciseMin === '' ? '-' : r.exerciseMin) + ' 分　睡眠 ' + (r.sleepHours === '' ? '-' : r.sleepHours) + ' 時'),

function postCard(p) {
  const likeBtn = h('button', { class: 'sec tool' }, (p.liked ? '❤️ ' : '🤍 ') + p.likeCount);
  likeBtn.onclick = () => guarded(likeBtn, async () => {
    const r = await api('forumToggleLike', { postId: p.postId }); p.liked = r.liked; p.likeCount = r.likeCount;
    likeBtn.textContent = (r.liked ? '❤️ ' : '🤍 ') + r.likeCount;
  }, card);
  const cBox = h('div');
  const cBtn = h('button', { class: 'sec tool' }, '💬 留言 ' + p.commentCount);
  cBtn.onclick = () => toggleComments(p, cBox);
  const imgs = p.imageUrls.filter(u => /^https:\/\//.test(u)).map(u => h('img', { src: u, alt: '文章圖片', loading: 'lazy', referrerpolicy: 'no-referrer', style: 'max-width:100%;border-radius:10px;margin:6px 0' }));
  const del = p.mine ? h('button', { class: 'sec tool', onclick: async ev => {
    if (!confirm('確定刪除這篇文章?')) return;
    await guarded(ev.currentTarget, async () => { await api('forumRemovePost', { postId: p.postId }); card.remove(); }, card);
  } }, '刪除') : null;
  const card = h('div', { class: 'card' },
    h('h3', null, p.isPinned ? '📌 ' : '', p.title),
    h('div', { class: 'muted' }, p.authorName + '　' + fmtDate(p.createdAt) + '　' + p.category),
    h('p', { style: 'white-space:pre-wrap' }, p.content), imgs,
    p.linkUrl ? h('div', null, h('a', { href: p.linkUrl, target: '_blank', rel: 'noopener noreferrer' }, '相關連結')) : null,
    h('div', { class: 'row', style: 'margin-top:8px' }, likeBtn, cBtn, del), cBox);
  return card;
}
async function toggleComments(p, box) {
  if (box.childNodes.length) { box.replaceChildren(); return; }
  box.replaceChildren(loading());
  try {
    const cs = await api('forumListComments', { postId: p.postId });
    const input = h('input', { maxlength: '1000', placeholder: '寫下留言…', 'aria-label': '留言內容' });
    const send = h('button', { style: 'margin-top:6px;width:100%' }, '送出留言');

    send.onclick = () => guarded(send, async () => {
      await api('forumAddComment', { postId: p.postId, content: input.value }, { write: true });
      box.replaceChildren(); toggleComments(p, box);
    }, box);
    box.replaceChildren(listEl, input, send);
  } catch (e) { box.replaceChildren(msg(errText(e), 'err')); }
}

/* ----- 憑證檢視(財務審核用) ----- */
async function showProof(kind, id, box) {
  try {
    const r = await api('readProof', { kind, id });
    if (r.mime === 'application/pdf') {
      const bytes = Uint8Array.from(atob(r.base64), c => c.charCodeAt(0));
      window.open(URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' })), '_blank');
    } else box.replaceChildren(h('img', { src: 'data:' + r.mime + ';base64,' + r.base64, alt: '憑證', style: 'max-width:100%' }));
  } catch (e) { box.replaceChildren(msg(errText(e), 'err')); }
}

/* ----- 財務審核 ----- */
async function viewFinanceReview() {
  const box = h('div', null, loading());
  render(h('h2', null, '財務審核'), box, back());
  try {
    const [meta, pend] = await Promise.all([api('financeMeta'), api('financeListPending')]);
    const accSel = h('select', { id: 'acc', 'aria-label': '入帳或付款帳戶' },
      meta.accounts.filter(a => a.status === 'ACTIVE').map(a => h('option', { value: a.accountId }, a.accountName + '(餘額 ' + money(a.balance) + ')')));
    const act = (btn, name, params, after) => btn.onclick = () => guarded(btn, async () => {
      await api(name, Object.assign({ accountId: accSel.value }, params), { write: true }); after();
    }, box);
    const reasonBtn = (text, name, id) => {
      const b = h('button', { class: 'sec' }, text);
      b.onclick = () => { const reason = prompt('請輸入原因'); if (!reason) return;
        guarded(b, async () => { await api(name, { id, reason }, { write: true }); viewFinanceReview(); }, box); };
      return b;
    };
    const item = (title, r, kind, okName, rejName) => {
      const pv = h('div'); const ok = h('button', null, '核准入帳');
      act(ok, okName, { id: r.id }, viewFinanceReview);
      return h('div', { class: 'card' }, h('b', null, title + ' NT$ ' + money(r.amount)),
        h('div', { class: 'muted' }, r.id + '　' + r.memberId + '　' + fmtDate(r.payDate) + '　' + (r.method || '')),
        r.note ? h('div', null, '備註:' + r.note) : null, pv,
        h('div', { class: 'row', style: 'margin-top:8px' },
          h('button', { class: 'sec', onclick: () => showProof(kind, r.id, pv) }, '看憑證'), ok, reasonBtn('退回', rejName, r.id)));
    };
    const expItem = e => {
      const pv = h('div'); const main = h('button', null, e.status === 'PENDING' ? '核准' : '付款');
      if (e.status === 'PENDING') act(main, 'approveExpense', { id: e.id }, viewFinanceReview);
      else act(main, 'payExpense', { id: e.id }, viewFinanceReview);
      return h('div', { class: 'card' }, h('b', null, '支出 NT$ ' + money(e.amount) + ' → ' + e.payee),
        h('div', { class: 'muted' }, e.id + '　' + e.subjectCode + '　' + statusText(e.status)), h('div', null, e.description), pv,
        h('div', { class: 'row', style: 'margin-top:8px' },
          h('button', { class: 'sec', onclick: () => showProof('EXPENSE', e.id, pv) }, '看單據'), main, reasonBtn('退回', 'rejectExpense', e.id)));
    };
    box.replaceChildren(
      h('div', { class: 'card' }, field('入帳 / 付款帳戶', accSel, 'acc'), h('p', { class: 'muted' }, '不能審核自己的申報,系統會擋下。')),
      h('h3', null, '會費(' + pend.payments.length + ')'), ...pend.payments.map(r => item(r.year + ' 年會費', r, 'PAYMENT', 'approvePayment', 'rejectPayment')),
      h('h3', null, '捐款(' + pend.donations.length + ')'), ...pend.donations.map(r => item('捐款 ' + (r.donorName || ''), r, 'DONATION', 'approveDonation', 'rejectDonation')),
      h('h3', null, '支出(' + pend.expenses.length + ')'), ...pend.expenses.map(expItem));
  } catch (e) { box.replaceChildren(msg(errText(e), 'err')); }
}

  const year = h('input', { id: 'ry', type: 'number', value: String(y) });
  const wAcc = field('帳戶', acc, 'ra'), wSubj = field('科目', subj, 'rj'), wYear = field('年度', year, 'ry');
  const wRange = h('div', { class: 'row' }, field('起日', start, 'rs'), field('迄日', end, 'rs'));
  const wEnd = field('截止日', end.cloneNode(true), 're2');

  function sync() {
    const t = type.value;
    wAcc.classList.toggle('hidden', t !== 'reportCashBook');
    wSubj.classList.toggle('hidden', t !== 'reportLedger');
    wYear.classList.toggle('hidden', t !== 'reportBudget');
    wRange.classList.toggle('hidden', t === 'reportBudget' || t === 'reportTrialBalance');
    wEnd.classList.toggle('hidden', t !== 'reportTrialBalance');
  }
  type.onchange = sync;

  const go = h('button', { style: 'width:100%;margin-top:12px' }, '產生報表');
  go.onclick = () => guarded(go, async () => {
    const p = { start: start.value, end: end.value };
    if (type.value === 'reportCashBook') p.accountId = acc.value;
    if (type.value === 'reportLedger') p.subjectCode = subj.value;
    if (type.value === 'reportBudget') p.year = year.value;
    if (type.value === 'reportTrialBalance') p.end = wEnd.querySelector('input').value;
    const r = await api(type.value, p);
    out.replaceChildren(
      type.value === 'reportTrialBalance' && !r.balanced ? msg('⚠ 借貸不平衡,請至「對帳與修復」檢查', 'err') : null,
      docFrame(r.html));
  }, out);

  render(h('h2', null, '財務報表'),
    h('div', { class: 'card' }, field('報表種類', type, 'rt'), wAcc, wSubj, wYear, wRange, wEnd, go),
    out, back());
  sync();
}

/* ----- 作廢收據 / 支出 ----- */
function viewVoid() {
  const rno = h('input', { id: 'vr', placeholder: '例:R-2026-000001', maxlength: '30' });
  const rReason = h('input', { id: 'vrr', maxlength: '200' });
  const rBtn = h('button', { style: 'width:100%;margin-top:12px' }, '作廢收據');
  rBtn.onclick = () => {
    if (!rno.value || !rReason.value) { $main.prepend(msg('請填寫收據編號與原因', 'err')); return; }
    if (!confirm('確定作廢收據 ' + rno.value + '?系統會產生沖銷傳票,此動作無法復原。')) return;
    guarded(rBtn, async () => {
      const r = await api('voidReceipt', { receiptNo: rno.value.trim(), reason: rReason.value }, { write: true });
      $main.prepend(msg('已作廢。' + (r.note || ''), 'ok'));
    });
  };
  const eid = h('input', { id: 've', maxlength: '30' });
  const eReason = h('input', { id: 'ver', maxlength: '200' });
  const eBtn = h('button', { style: 'width:100%;margin-top:12px' }, '作廢已付款支出');
  eBtn.onclick = () => {
    if (!eid.value || !eReason.value) { $main.prepend(msg('請填寫支出編號與原因', 'err')); return; }
    if (!confirm('確定作廢支出 ' + eid.value + '?帳戶餘額會回補。')) return;
    guarded(eBtn, async () => {
      await api('voidExpense', { id: eid.value.trim(), reason: eReason.value }, { write: true });
      $main.prepend(msg('已作廢', 'ok'));
    });
  };
  render(
    h('div', { class: 'card' }, h('h2', null, '作廢收據'), field('收據編號', rno, 'vr'), field('原因', rReason, 'vrr'), rBtn,
      h('p', { class: 'muted' }, '會費收據作廢後,請另行確認該會員的會籍到期日。')),
    h('div', { class: 'card' }, h('h2', null, '作廢支出'), field('支出編號', eid, 've'), field('原因', eReason, 'ver'), eBtn),
    back());
}

/* ----- 支出核銷申請 ----- */
async function viewExpenseForm() {
  render(h('h2', null, '支出核銷申請'), loading(), back());
  let meta;
  try { meta = await api('financeMeta'); }
  catch (e) { render(msg('此功能的下拉資料需財務權限讀取:' + errText(e), 'err'), back()); return; }
  const subj = simpleSelect('es', meta.subjects.filter(s => s.category === '支出' && s.status !== 'INACTIVE'), 'subjectCode', s => s.subjectCode + ' ' + s.subjectName);
  const proj = h('select', { id: 'ep' }, h('option', { value: '' }, '(無專案)'),
    meta.projects.filter(p => p.status === 'ACTIVE').map(p => h('option', { value: p.projectName }, p.projectName)));
  const payee = h('input', { id: 'epy', maxlength: '100' });
  const amount = h('input', { id: 'ea', type: 'number', inputmode: 'numeric' });
  const desc = h('textarea', { id: 'ed', maxlength: '300' });
  const pf = proofPicker();
  const btn = h('button', { style: 'width:100%;margin-top:16px' }, '送出申請');
  btn.onclick = () => guarded(btn, async () => {
    if (!pf.input.files[0]) throw new ApiFail('VALIDATION', '請選擇單據檔案');
    const proof = await fileToBase64(pf.input.files[0]);
    await api('submitExpense', { subjectCode: subj.value, projectName: proj.value, payee: payee.value, amount: amount.value, description: desc.value, proof }, { write: true });
    render(msg('已送出,待其他財務人員核准。', 'ok'), back());
  });
  render(h('div', { class: 'card' }, h('h2', null, '支出核銷申請'),
    field('會計科目', subj, 'es'), field('專案', proj, 'ep'), field('收款對象', payee, 'epy'),
    field('金額(元)', amount, 'ea'), field('說明', desc, 'ed'), pf.node, btn), back());
}

/* ----- 帳戶、專案、預算維護 ----- */
async function viewFinanceSetup() {
  const box = h('div', null, loading());
  render(h('h2', null, '帳戶 / 專案 / 預算'), box, back());
  let meta;
  try { meta = await api('financeMeta'); }
  catch (e) { box.replaceChildren(msg(errText(e), 'err')); return; }

  // 帳戶
  const aName = h('input', { id: 'sa', maxlength: '50' });
  const aType = h('select', { id: 'st' }, h('option', { value: '銀行' }, '銀行'), h('option', { value: '現金' }, '現金'));
  const aBtn = h('button', { style: 'width:100%;margin-top:12px' }, '新增帳戶');
  aBtn.onclick = () => guarded(aBtn, async () => { await api('saveAccount', { accountName: aName.value, accountType: aType.value }, { write: true }); viewFinanceSetup(); }, box);
  const accList = meta.accounts.map(a => {
    const t = h('button', { class: 'sec tool' }, a.status === 'ACTIVE' ? '停用' : '啟用');
    t.onclick = () => guarded(t, async () => {
      await api('saveAccount', { accountId: a.accountId, accountName: a.accountName, accountType: a.accountType, status: a.status === 'ACTIVE' ? 'INACTIVE' : 'ACTIVE' }, { write: true });
      viewFinanceSetup();
    }, box);
    return h('div', { style: 'border-top:1px solid var(--bd);padding:8px 0' }, h('b', null, a.accountName), '(' + a.accountType + ') 餘額 ' + money(a.balance), ' ', h('span', { class: 'tag' }, a.status), t);
  });

  // 專案
  const pName = h('input', { id: 'sp', maxlength: '100' });
  const pBud = h('input', { id: 'sb', type: 'number', inputmode: 'numeric', value: '0' });
  const pBtn = h('button', { style: 'width:100%;margin-top:12px' }, '新增 / 更新專案');
  pBtn.onclick = () => guarded(pBtn, async () => { await api('saveProject', { projectName: pName.value, budget: pBud.value }, { write: true }); viewFinanceSetup(); }, box);
  const projList = meta.projects.map(p => h('div', { style: 'border-top:1px solid var(--bd);padding:8px 0' }, h('b', null, p.projectName), ' 預算 ' + money(p.budget) + ' ', h('span', { class: 'tag' }, p.status)));

  // 年度預算
  const bYear = h('input', { id: 'by', type: 'number', value: String(new Date().getFullYear()) });
  const bSubj = simpleSelect('bs', meta.subjects.filter(s => s.category === '支出'), 'subjectCode', s => s.subjectCode + ' ' + s.subjectName);
  const bAmt = h('input', { id: 'bm', type: 'number', inputmode: 'numeric' });
  const bBtn = h('button', { style: 'width:100%;margin-top:12px' }, '儲存預算');
  bBtn.onclick = () => guarded(bBtn, async () => {
    await api('saveBudget', { year: bYear.value, subjectCode: bSubj.value, budgetAmount: bAmt.value }, { write: true });
    box.prepend(msg('預算已儲存', 'ok'));
  }, box);

  box.replaceChildren(
    h('div', { class: 'card' }, h('h3', null, '資金帳戶'), ...accList, field('新帳戶名稱', aName, 'sa'), field('類型', aType, 'st'), aBtn,
      h('p', { class: 'muted' }, '餘額無法直接修改,只會隨傳票變動。')),
    h('div', { class: 'card' }, h('h3', null, '專案'), ...projList, field('專案名稱', pName, 'sp'), field('預算(元)', pBud, 'sb'), pBtn),
    h('div', { class: 'card' }, h('h3', null, '年度預算'), field('年度', bYear, 'by'), field('科目', bSubj, 'bs'), field('預算金額', bAmt, 'bm'), bBtn));
}

/* ----- 對帳與修復 ----- */
function viewReconcile() {
  const out = h('div');
  const showIssues = (issues) => issues.length
    ? h('div', null, ...issues.map(i => h('div', { class: 'card' }, h('b', null, i.type + ':' + i.id), h('div', null, '應為 ' + money(i.expected) + ',實際 ' + money(i.actual)))))
    : msg('帳務一致,沒有差異', 'ok');

  const check = h('button', { style: 'width:100%' }, '執行對帳');
  check.onclick = () => guarded(check, async () => {
    const r = await api('financeReconcile');
    out.replaceChildren(h('p', { class: 'muted' }, '檢查時間:' + r.checkedAt), showIssues(r.issues));
  }, out);

  const prev = h('button', { class: 'sec', style: 'width:100%;margin-top:8px' }, '預覽修復內容(不會寫入)');
  prev.onclick = () => guarded(prev, async () => {
    const r = await api('financeRepair', { confirm: false });
    const run = h('button', { style: 'width:100%;margin-top:8px' }, '確認執行修復');
    run.onclick = () => {
      if (!confirm('確定依傳票重算並覆蓋帳戶餘額、專案、預算與會員累計?')) return;
      guarded(run, async () => {
        const x = await api('financeRepair', { confirm: true });
        out.replaceChildren(msg('已修復 ' + x.fixed + ' 筆', 'ok'), x.remaining.length ? h('div', null, h('h3', null, '仍有差異(需人工處理)'), showIssues(x.remaining)) : null);
      }, out);
    };
    out.replaceChildren(h('h3', null, '預覽:共 ' + r.issues.length + ' 項'), showIssues(r.issues), r.issues.length ? run : null);
  }, out);

  render(h('div', { class: 'card' }, h('h2', null, '對帳與修復'),
    h('p', { class: 'muted' }, '以傳票為準,比對帳戶餘額、專案累計、預算執行數、會員累計。修復僅限理事長或會計,「傳票借貸不平衡」無法自動修復。'),
    check, prev), out, back());
}



start();
</script>
