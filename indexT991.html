<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >
  <title>台灣帕金森病友權益促進會</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #115e59;
      --background: #f8fafc;
      --text: #0f172a;
      --muted: #475569;
      --border: #cbd5e1;
      --danger: #991b1b;
      --success: #166534;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font: 18px/1.65 system-ui, "Noto Sans TC", sans-serif;
      padding-bottom: 88px;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    .wrap {
      max-width: 820px;
      margin: auto;
      padding: 14px;
    }

    .hero,
    .card {
      border-radius: 20px;
      margin-bottom: 16px;
    }

    .hero {
      padding: 26px 18px;
      text-align: center;
      color: #fff;
      background: linear-gradient(
        135deg,
        var(--primary),
        var(--primary-dark)
      );
    }

    .hero h1 {
      font-size: 28px;
      margin: 0;
    }

    .card {
      background: #fff;
      border: 2px solid var(--border);
      padding: 20px;
      box-shadow: 0 8px 25px #0000000c;
    }

    .title {
      font-size: 24px;
      font-weight: 900;
      border-left: 6px solid var(--primary);
      padding-left: 10px;
      margin-bottom: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .btn {
      width: 100%;
      min-height: 58px;
      border: 0;
      border-radius: 14px;
      padding: 10px 15px;
      margin: 6px 0;
      background: #e2e8f0;
      color: var(--text);
      font-weight: 900;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-danger {
      background: #b91c1c;
      color: #fff;
    }

    .btn-line {
      background: #06c755;
      color: #fff;
    }

    .fc {
      width: 100%;
      min-height: 58px;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 10px 13px;
      margin: 5px 0 13px;
      background: #fff;
    }

    textarea.fc {
      min-height: 120px;
      resize: vertical;
    }

    .label {
      display: block;
      font-weight: 900;
    }

    .item {
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin: 10px 0;
    }

    .muted {
      color: var(--muted);
      font-size: 15px;
    }

    .badge {
      display: inline-block;
      border: 1px solid;
      border-radius: 99px;
      padding: 2px 9px;
      font-weight: 800;
      font-size: 14px;
    }

    .badge-success {
      color: var(--success);
      background: #f0fdf4;
    }

    .badge-warning {
      color: #92400e;
      background: #fffbeb;
    }

    .badge-danger {
      color: var(--danger);
      background: #fef2f2;
    }

    .nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      background: #fff;
      border-top: 2px solid var(--border);
      padding: 8px max(8px, env(safe-area-inset-right))
        calc(8px + env(safe-area-inset-bottom));
      z-index: 10;
    }

    .nav button {
      flex: 1;
      border: 0;
      background: #fff;
      color: var(--primary);
      font-weight: 900;
      min-height: 56px;
    }

    .modal,
    .loader {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 30;
    }

    .modal.show,
    .loader.show {
      display: flex;
    }

    .modal {
      background: #0f172aaa;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .modal-box {
      background: #fff;
      border-radius: 18px;
      padding: 20px;
      max-width: 580px;
      width: 100%;
      max-height: 90vh;
      overflow: auto;
    }

    .loader {
      background: #ffffffcc;
      align-items: center;
      justify-content: center;
      font-weight: 900;
    }

    .toast {
      display: none;
      position: fixed;
      left: 50%;
      bottom: 95px;
      transform: translateX(-50%);
      background: #0f172a;
      color: #fff;
      padding: 12px 20px;
      border-radius: 99px;
      z-index: 40;
      max-width: 90%;
      text-align: center;
    }

    .toast.show {
      display: block;
    }

    @media (max-width: 560px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .hero h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>
  <main id="main" class="wrap"></main>

  <nav class="nav" aria-label="主要導覽">
    <button type="button" onclick="go('home')">🏠 首頁</button>
    <button type="button" onclick="go('health')">♿ 健康</button>
    <button type="button" onclick="go('forum')">🍵 交流</button>
    <button type="button" id="authBtn" onclick="openLogin()">🔑 登入</button>
  </nav>

  <div
    id="modal"
    class="modal"
    role="dialog"
    aria-modal="true"
    onclick="if(event.target===this) closeModal()"
  >
    <div id="modalBox" class="modal-box"></div>
  </div>

  <div id="loader" class="loader">資料處理中……</div>
  <div id="toast" class="toast" aria-live="polite"></div>

  <script>
    // =====================================================
    // 部署設定
    // =====================================================
    const API_BASE = "https://script.google.com/macros/s/AKfycbw_XqLVQQnil6gVqsMThLAGQ0uPt9x4yaIeF8QcPI_xh8fwtPDGVLxOmqcR2rYwaKHf/exec";
    const LIFF_ID = "2009456572-588gzru4";

    const STATE = {
      user: null,
      token: localStorage.getItem("tpdaToken") || "",
      liffReady: false,
      lineProfile: null
    };

    function $(id) {
      return document.getElementById(id);
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function showToast(message) {
      const element = $("toast");
      element.textContent = message;
      element.classList.add("show");

      window.setTimeout(() => {
        element.classList.remove("show");
      }, 3000);
    }

    function showLoader(show) {
      $("loader").classList.toggle("show", show);
    }

    function openModal(html) {
      $("modalBox").innerHTML = html;
      $("modal").classList.add("show");
    }

    function closeModal() {
      $("modal").classList.remove("show");
    }

    function today() {
      return new Date().toLocaleDateString("sv-SE", {
        timeZone: "Asia/Taipei"
      });
    }

    function formatMoney(value) {
      return "NT$" + Number(value || 0).toLocaleString("zh-TW");
    }

    // =====================================================
    // API
    // =====================================================
    async function api(action, data = {}) {
      const controller = new AbortController();
      const timer = window.setTimeout(() => controller.abort(), 30000);

      try {
        const response = await fetch(API_BASE, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            action,
            data: {
              ...data,
              sessionToken: STATE.token
            }
          }),
          signal: controller.signal
        });

        const result = await response.json();

        if (result.code === "SESSION_EXPIRED") {
          logout(false);
        }

        return result;
      } finally {
        window.clearTimeout(timer);
      }
    }

    async function runApi(action, data = {}) {
      showLoader(true);

      try {
        const result = await api(action, data);

        if (!result.success) {
          throw new Error(result.message || "操作失敗");
        }

        return result;
      } catch (error) {
        showToast(
          error.name === "AbortError"
            ? "連線逾時，請稍後重試"
            : error.message
        );

        return null;
      } finally {
        showLoader(false);
      }
    }

    // =====================================================
    // 使用者及 LIFF
    // =====================================================
    function setUser(user, token = "") {
      STATE.user = user;

      if (token) {
        STATE.token = token;
        localStorage.setItem("tpdaToken", token);
      }

      const authButton = $("authBtn");

      if (user) {
        authButton.textContent = "🚪 登出";
        authButton.onclick = () => logout();
      } else {
        authButton.textContent = "🔑 登入";
        authButton.onclick = () => openLogin();
      }
    }

    async function initializeApp() {
      try {
        if (LIFF_ID && !LIFF_ID.startsWith("請填入")) {
          await liff.init({ liffId: LIFF_ID });
          STATE.liffReady = true;

          if (liff.isLoggedIn()) {
            STATE.lineProfile = await liff.getProfile();
          }
        }
      } catch (error) {
        console.error("LIFF 初始化失敗", error);
      }

      if (STATE.token) {
        try {
          const result = await api("auth.me");

          if (result.success) {
            setUser(result.user);
          } else {
            localStorage.removeItem("tpdaToken");
            STATE.token = "";
          }
        } catch (error) {
          console.error(error);
        }
      }

      go("home");
    }

    function go(page) {
      if (page !== "home" && !STATE.user) {
        openLogin();
        return;
      }

      const routes = {
        home: renderHome,
        health: renderHealth,
        forum: renderForum,
        admin: renderAdmin
      };

      (routes[page] || renderHome)();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // =====================================================
    // 首頁與登入
    // =====================================================
    function renderHome() {
      const user = STATE.user;

      $("main").innerHTML = `
        <div class="hero">
          <h1>社團法人台灣帕金森病友權益促進會</h1>
          <div>陪伴病友・守護權益・共創希望</div>
        </div>

        ${
          user
            ? `
              <div class="card">
                <div class="title">您好，${escapeHtml(user.name)}</div>

                <div>
                  會員編號：${escapeHtml(user.memberId)}
                  <span class="badge ${
                    user.isActive
                      ? "badge-success"
                      : "badge-warning"
                  }">
                    ${escapeHtml(user.status)}
                  </span>
                </div>

                <div class="grid">
                  <button class="btn btn-primary" onclick="renderPayments()">
                    💳 會費
                  </button>

                  <button class="btn btn-primary" onclick="renderDonations()">
                    ❤️ 捐款
                  </button>

                  <button class="btn" onclick="openProfile()">
                    👤 個人資料
                  </button>

                  ${
                    user.permissions?.includes("ADMIN_HOME")
                      ? `
                        <button
                          class="btn btn-danger"
                          onclick="go('admin')"
                        >
                          ⚙️ 管理後台
                        </button>
                      `
                      : ""
                  }
                </div>
              </div>
            `
            : `
              <div class="card">
                <div class="title">會員登入</div>

                <button class="btn btn-primary" onclick="openLogin()">
                  姓名、手機與密碼登入
                </button>

                <button class="btn btn-line" onclick="lineLogin()">
                  LINE 快速登入
                </button>
              </div>
            `
        }

        <div class="card">
          <div class="title">隱私與安全提醒</div>
          <p>
            本平台健康資料僅供自主紀錄，不作為醫療診斷。
            請勿在論壇公開身分證、電話、地址及完整病歷。
          </p>
        </div>
      `;
    }

    function openLogin() {
      openModal(`
        <div class="title">會員登入</div>

        <label class="label" for="loginName">姓名</label>
        <input id="loginName" class="fc" autocomplete="name">

        <label class="label" for="loginPhone">手機</label>
        <input
          id="loginPhone"
          class="fc"
          inputmode="tel"
          autocomplete="tel"
        >

        <label class="label" for="loginPassword">密碼</label>
        <input
          id="loginPassword"
          class="fc"
          type="password"
          autocomplete="current-password"
        >

        <button class="btn btn-primary" onclick="login()">
          登入
        </button>

        <button class="btn" onclick="setupPassword()">
          首次登入／設定密碼
        </button>

        <button class="btn btn-line" onclick="lineLogin()">
          LINE 登入
        </button>

        <button class="btn" onclick="closeModal()">
          取消
        </button>
      `);
    }

    async function login() {
      const result = await runApi("auth.login", {
        name: $("loginName").value,
        phone: $("loginPhone").value,
        password: $("loginPassword").value
      });

      if (!result) return;

      setUser(result.user, result.sessionToken);
      closeModal();
      renderHome();
    }

    async function setupPassword() {
      const password = $("loginPassword").value;

      if (password.length < 10) {
        showToast("密碼至少需要 10 個字元");
        return;
      }

      const result = await runApi("auth.setupPassword", {
        name: $("loginName").value,
        phone: $("loginPhone").value,
        password
      });

      if (!result) return;

      setUser(result.user, result.sessionToken);
      closeModal();
      renderHome();
    }

    async function lineLogin() {
      if (!STATE.liffReady) {
        showToast("LIFF 尚未完成設定");
        return;
      }

      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }

      const result = await runApi("auth.lineLogin", {
        lineAccessToken: liff.getAccessToken()
      });

      if (!result) {
        showToast("LINE 尚未綁定，請先使用密碼登入");
        return;
      }

      setUser(result.user, result.sessionToken);
      closeModal();
      renderHome();
    }

    async function bindLine() {
      if (!STATE.liffReady) {
        showToast("LIFF 尚未設定");
        return;
      }

      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }

      const result = await runApi("auth.bindLine", {
        lineAccessToken: liff.getAccessToken()
      });

      if (result) {
        showToast("LINE 綁定成功");
      }
    }

    async function logout(ask = true) {
      if (ask && !window.confirm("確定登出？")) return;

      try {
        if (STATE.token) {
          await api("auth.logout");
        }
      } catch (error) {
        console.error(error);
      }

      STATE.token = "";
      STATE.user = null;
      localStorage.removeItem("tpdaToken");
      setUser(null);
      renderHome();
    }

    // =====================================================
    // 個人資料
    // =====================================================
    async function openProfile() {
      const result = await runApi("member.detail");
      if (!result) return;

      const user = result.member;

      openModal(`
        <div class="title">個人資料</div>

        <label class="label">姓名</label>
        <input
          id="profileName"
          class="fc"
          value="${escapeHtml(user.name)}"
        >

        <label class="label">手機</label>
        <input
          id="profilePhone"
          class="fc"
          value="${escapeHtml(user.phone)}"
        >

        <label class="label">就診醫院</label>
        <input
          id="profileHospital"
          class="fc"
          value="${escapeHtml(user.hospital)}"
        >

        <label class="label">主治醫師</label>
        <input
          id="profileDoctor"
          class="fc"
          value="${escapeHtml(user.doctor)}"
        >

        <label class="label">服用藥物</label>
        <textarea id="profileMedication" class="fc">${
          escapeHtml(user.medication)
        }</textarea>

        <p>
          身分證／統編：
          <strong>${escapeHtml(user.identityMasked || "未設定")}</strong>
        </p>

        <button class="btn btn-primary" onclick="saveProfile()">
          儲存資料
        </button>

        <button class="btn btn-line" onclick="bindLine()">
          綁定 LINE 通知
        </button>

        <button class="btn" onclick="closeModal()">
          關閉
        </button>
      `);
    }

    async function saveProfile() {
      const result = await runApi("member.update", {
        name: $("profileName").value,
        phone: $("profilePhone").value,
        hospital: $("profileHospital").value,
        doctor: $("profileDoctor").value,
        medication: $("profileMedication").value
      });

      if (!result) return;

      STATE.user = result.user;
      closeModal();
      showToast("個人資料已更新");
      renderHome();
    }

    // =====================================================
    // 會費
    // =====================================================
    function renderPayments() {
      $("main").innerHTML = `
        <div class="card">
          <div class="title">會費申報</div>

          <label class="label">年度</label>
          <input
            id="paymentYear"
            class="fc"
            type="number"
            value="${new Date().getFullYear()}"
          >

          <label class="label">金額</label>
          <input
            id="paymentAmount"
            class="fc"
            type="number"
            value="1500"
            min="1"
          >

          <label class="label">付款方式</label>
          <select id="paymentMethod" class="fc">
            <option value="銀行轉帳">銀行轉帳</option>
            <option value="郵局劃撥">郵局劃撥</option>
            <option value="現金">現金</option>
          </select>

          <label class="label">付款日期</label>
          <input
            id="paymentDate"
            class="fc"
            type="date"
            value="${today()}"
          >

          <label class="label">備註</label>
          <input
            id="paymentNote"
            class="fc"
            placeholder="例如：匯款帳號後五碼"
          >

          <button class="btn btn-primary" onclick="applyPayment()">
            送出申報
          </button>
        </div>

        <div class="card">
          <div class="title">我的會費紀錄</div>
          <div id="paymentList">載入中……</div>
        </div>
      `;

      loadPayments();
    }

    async function applyPayment() {
      const result = await runApi("payment.apply", {
        year: $("paymentYear").value,
        amount: Number($("paymentAmount").value),
        method: $("paymentMethod").value,
        date: $("paymentDate").value,
        note: $("paymentNote").value
      });

      if (result) {
        showToast("會費申報成功");
        loadPayments();
      }
    }

    async function loadPayments() {
      const result = await api("payment.myList");
      const area = $("paymentList");

      if (!result.success || !result.items.length) {
        area.innerHTML = "尚無會費紀錄";
        return;
      }

      area.innerHTML = result.items.map(item => `
        <div class="item">
          <strong>
            ${escapeHtml(item.year)} 年會費　
            ${formatMoney(item.amount)}
          </strong>

          <div class="muted">
            ${escapeHtml(item.date)}｜
            ${escapeHtml(item.method)}
          </div>

          <span class="badge ${
            item.status === "已確認"
              ? "badge-success"
              : item.status === "已退回"
                ? "badge-danger"
                : "badge-warning"
          }">
            ${escapeHtml(item.status)}
          </span>

          ${
            item.receiptNo
              ? `<div>收據：${escapeHtml(item.receiptNo)}</div>`
              : ""
          }

          ${
            item.rejectReason
              ? `<div class="badge-danger">
                   退回原因：${escapeHtml(item.rejectReason)}
                 </div>`
              : ""
          }
        </div>
      `).join("");
    }

    // =====================================================
    // 捐款
    // =====================================================
    function renderDonations() {
      $("main").innerHTML = `
        <div class="card">
          <div class="title">愛心捐款申報</div>

          <label class="label">捐款金額</label>
          <input
            id="donationAmount"
            class="fc"
            type="number"
            value="1000"
            min="1"
          >

          <label class="label">身分證／統編</label>
          <input
            id="donationIdentity"
            class="fc"
            placeholder="資料將於後端加密保存"
          >

          <label class="label">捐款用途</label>
          <select id="donationPurpose" class="fc">
            <option value="一般捐款">一般捐款</option>
            <option value="急難救助">急難救助</option>
            <option value="復健課程">復健課程</option>
            <option value="衛教推廣">衛教推廣</option>
          </select>

          <label class="label">付款日期</label>
          <input
            id="donationDate"
            class="fc"
            type="date"
            value="${today()}"
          >

          <button class="btn btn-primary" onclick="applyDonation()">
            送出捐款申報
          </button>
        </div>

        <div class="card">
          <div class="title">我的捐款紀錄</div>
          <div id="donationList">載入中……</div>
        </div>
      `;

      loadDonations();
    }

    async function applyDonation() {
      const result = await runApi("donation.apply", {
        amount: Number($("donationAmount").value),
        identityId: $("donationIdentity").value,
        purpose: $("donationPurpose").value,
        date: $("donationDate").value,
        method: "銀行轉帳"
      });

      if (result) {
        showToast("捐款申報成功");
        loadDonations();
      }
    }

    async function loadDonations() {
      const result = await api("donation.myList");
      const area = $("donationList");

      if (!result.success || !result.items.length) {
        area.innerHTML = "尚無捐款紀錄";
        return;
      }

      area.innerHTML = result.items.map(item => `
        <div class="item">
          <strong>
            ${escapeHtml(item.purpose)}　
            ${formatMoney(item.amount)}
          </strong>

          <div class="muted">${escapeHtml(item.date)}</div>

          <span class="badge ${
            item.status === "已確認"
              ? "badge-success"
              : item.status === "已退回"
                ? "badge-danger"
                : "badge-warning"
          }">
            ${escapeHtml(item.status)}
          </span>

          ${
            item.receiptNo
              ? `<div>收據：${escapeHtml(item.receiptNo)}</div>`
              : ""
          }
        </div>
      `).join("");
    }

    // =====================================================
    // 健康紀錄
    // =====================================================
    function renderHealth() {
      $("main").innerHTML = `
        <div class="hero">
          <h1>健康自主紀錄</h1>
          <div>僅供日常追蹤，不作為醫療診斷</div>
        </div>

        <div class="card">
          <div class="title">今日紀錄</div>

          <label class="label">心情</label>
          <select id="healthMood" class="fc">
            <option value="😊">😊 很好</option>
            <option value="🙂">🙂 尚可</option>
            <option value="😐">😐 普通</option>
            <option value="😔">😔 不佳</option>
          </select>

          <label class="label">藥效狀態</label>
          <select id="healthState" class="fc">
            <option value="ON">ON</option>
            <option value="OFF">OFF</option>
            <option value="Dyskinesia">異動現象</option>
          </select>

          <label class="label">運動分鐘</label>
          <input
            id="healthExercise"
            class="fc"
            type="number"
            value="30"
            min="0"
          >

          <label class="label">身體狀況與回診備忘</label>
          <textarea id="healthNote" class="fc"></textarea>

          <button class="btn btn-primary" onclick="saveHealth()">
            儲存紀錄
          </button>
        </div>

        <div class="card">
          <div class="title">最近 14 筆紀錄</div>
          <div id="healthList">載入中……</div>
        </div>
      `;

      loadHealth();
    }

    async function saveHealth() {
      const result = await runApi("health.save", {
        date: today(),
        mood: $("healthMood").value,
        state: $("healthState").value,
        exerciseMins: Number($("healthExercise").value),
        note: $("healthNote").value
      });

      if (result) {
        showToast("健康紀錄已儲存");
        loadHealth();
      }
    }

    async function loadHealth() {
      const result = await api("health.list");
      const area = $("healthList");

      if (!result.success || !result.items.length) {
        area.innerHTML = "尚無健康紀錄";
        return;
      }

      area.innerHTML = result.items.map(item => `
        <div class="item">
          <strong>
            ${escapeHtml(item.date)}　
            ${escapeHtml(item.mood)}　
            ${escapeHtml(item.state)}
          </strong>

          <div>
            運動 ${escapeHtml(item.exerciseMins)} 分鐘
          </div>

          <div>${escapeHtml(item.note)}</div>
        </div>
      `).join("");
    }

    // =====================================================
    // 論壇
    // =====================================================
    function renderForum() {
      $("main").innerHTML = `
        <div class="hero">
          <h1>溫馨交流區</h1>
          <div>請勿張貼電話、地址、身分證及完整病歷</div>
        </div>

        <div class="card">
          <label class="label">標題</label>
          <input id="forumTitle" class="fc">

          <label class="label">分享內容</label>
          <textarea id="forumContent" class="fc"></textarea>

          <button class="btn btn-primary" onclick="addForumPost()">
            發布分享
          </button>
        </div>

        <div id="forumList"></div>
      `;

      loadForum();
    }

    async function addForumPost() {
      const result = await runApi("forum.addPost", {
        title: $("forumTitle").value,
        content: $("forumContent").value,
        category: "心情與生活"
      });

      if (result) {
        showToast("貼文已發布");
        loadForum();
      }
    }

    async function loadForum() {
      const result = await api("forum.list");
      const area = $("forumList");

      if (!result.success || !result.items.length) {
        area.innerHTML = `
          <div class="card">目前尚無交流貼文</div>
        `;
        return;
      }

      area.innerHTML = result.items.map(item => `
        <div class="card">
          <strong>${escapeHtml(item.title)}</strong>

          <div class="muted">
            ${escapeHtml(item.authorName)}｜
            ${escapeHtml(item.createdAt)}
          </div>

          <p>${escapeHtml(item.content)}</p>

          <button
            class="btn"
            onclick="toggleForumLike('${escapeHtml(item.postId)}')"
          >
            ❤️ ${Number(item.likeCount || 0)}
          </button>
        </div>
      `).join("");
    }

    async function toggleForumLike(postId) {
      const result = await runApi("forum.toggleLike", { postId });

      if (result) {
        loadForum();
      }
    }

    // =====================================================
    // 管理後台
    // =====================================================
    function renderAdmin() {
      if (!STATE.user?.permissions?.includes("ADMIN_HOME")) {
        showToast("權限不足");
        renderHome();
        return;
      }

      $("main").innerHTML = `
        <div class="hero">
          <h1>管理後台</h1>
          <div>
            ${escapeHtml(STATE.user.name)}｜
            ${escapeHtml(STATE.user.type)}
          </div>
        </div>

        <div class="grid">
          <button
            class="btn btn-primary"
            onclick="loadPending('payment')"
          >
            會費審核
          </button>

          <button
            class="btn btn-primary"
            onclick="loadPending('donation')"
          >
            捐款審核
          </button>

          <button class="btn" onclick="loadMembers()">
            會員名冊
          </button>

          <button class="btn" onclick="loadAuditLogs()">
            稽核紀錄
          </button>
        </div>

        <div id="adminArea" class="card"></div>
      `;

      loadPending("payment");
    }

    async function loadPending(kind) {
      const result = await runApi(`${kind}.pendingList`);
      const area = $("adminArea");

      if (!result) return;

      area.innerHTML = `
        <div class="title">
          ${kind === "payment" ? "會費" : "捐款"}待審核
        </div>

        ${
          result.items.length
            ? result.items.map(item => `
                <div class="item">
                  <strong>
                    ${escapeHtml(item.name)}　
                    ${formatMoney(item.amount)}
                  </strong>

                  <div>
                    ${escapeHtml(item.date)}｜
                    ${escapeHtml(item.method || item.purpose)}
                  </div>

                  ${
                    item.identityMasked
                      ? `<div>
                           身分證／統編：
                           ${escapeHtml(item.identityMasked)}
                         </div>`
                      : ""
                  }

                  <button
                    class="btn btn-primary"
                    onclick="confirmItem(
                      '${kind}',
                      '${escapeHtml(item.id)}'
                    )"
                  >
                    確認款項入帳
                  </button>

                  <button
                    class="btn btn-danger"
                    onclick="rejectItem(
                      '${kind}',
                      '${escapeHtml(item.id)}'
                    )"
                  >
                    退回
                  </button>
                </div>
              `).join("")
            : "目前沒有待審核資料"
        }
      `;
    }

    async function confirmItem(kind, id) {
      if (!window.confirm("確認款項已實際入帳？")) return;

      const result = await runApi(`${kind}.confirm`, { id });

      if (result) {
        showToast("已入帳並建立收據及傳票");
        loadPending(kind);
      }
    }

    async function rejectItem(kind, id) {
      const reason = window.prompt("請輸入退回原因");

      if (!reason) return;

      const result = await runApi(`${kind}.reject`, {
        id,
        reason
      });

      if (result) {
        showToast("已退回");
        loadPending(kind);
      }
    }

    async function loadMembers() {
      const result = await runApi("member.list");
      const area = $("adminArea");

      if (!result) return;

      area.innerHTML = `
        <div class="title">會員名冊</div>

        ${result.items.map(item => `
          <div class="item">
            <strong>
              ${escapeHtml(item.name)}
              （${escapeHtml(item.memberId)}）
            </strong>

            <div>
              ${escapeHtml(item.phone)}｜
              ${escapeHtml(item.type)}｜
              ${escapeHtml(item.status)}
            </div>
          </div>
        `).join("")}
      `;
    }

    async function loadAuditLogs() {
      const result = await runApi("audit.list");
      const area = $("adminArea");

      if (!result) return;

      area.innerHTML = `
        <div class="title">最近稽核紀錄</div>

        ${result.items.map(item => `
          <div class="item">
            <strong>${escapeHtml(item.action)}</strong>

            <div class="muted">
              ${escapeHtml(item.time)}｜
              ${escapeHtml(item.actorName)}
            </div>

            <div>${escapeHtml(item.detail)}</div>
          </div>
        `).join("")}
      `;
    }

    initializeApp();
  </script>
</body>
</html>
