<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1.0,user-scalable=no"/>
  <title>台灣帕金森病友權益促進會 - 會員與財務管理系統</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;900&display=swap');
    :root {
      --fs-base: 20px;
      --fs-sm: 17px;
      --fs-lg: 24px;
      --fs-xl: 28px;
      --btn-h: 68px;
      --primary: #0f766e;
      --primary-dark: #115e59;
      --bg: #f8fafc;
      --text: #0f172a;
    }
    body.tremor-mode .btn,
    body.tremor-mode .fc,
    body.tremor-mode .nitem {
      padding-top: 22px !important;
      padding-bottom: 22px !important;
      min-height: 84px !important;
      margin-top: 8px !important;
      margin-bottom: 8px !important;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: var(--fs-base);
      line-height: 1.6;
      padding-bottom: 100px;
    }
    .wrap { max-width: 860px; margin: 0 auto; padding: 14px; }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 22px;
      border: 2px solid #cbd5e1;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }
    .card-title {
      font-size: var(--fs-lg);
      font-weight: 900;
      color: var(--primary);
      border-left: 6px solid var(--primary);
      padding-left: 12px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn {
      width: 100%;
      min-height: var(--btn-h);
      border-radius: 16px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 18px;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-success { background: #15803d; color: #fff; }
    .btn-warn { background: #c2410c; color: #fff; }
    .btn-outline { background: #fff; color: var(--primary); border: 2.5px solid var(--primary); }
    .btn-ghost { background: #f1f5f9; color: #334155; }
    .btn-sm { min-height: 48px; font-size: var(--fs-sm); width: auto; padding: 8px 16px; border-radius: 12px; }
    .btn-xs { min-height: 40px; font-size: 15px; width: auto; padding: 6px 12px; border-radius: 10px; }
    
    .fc {
      width: 100%;
      border: 2px solid #cbd5e1;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: var(--fs-base);
      min-height: 60px;
      margin-top: 6px;
      outline: none;
    }
    .fc:focus { border-color: var(--primary); }
    .flabel { font-weight: 900; color: #334155; font-size: var(--fs-sm); }
    .fg { margin-bottom: 16px; }

    .bottom-nav {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      height: 80px;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(8px);
      border-top: 2px solid #cbd5e1;
      display: flex;
      justify-content: center;
      z-index: 50;
    }
    .nav-inner {
      width: 100%; max-width: 600px;
      display: grid; grid-template-columns: repeat(4, 1fr);
      padding: 6px; gap: 4px;
    }
    .nitem {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #64748b; font-size: 13px; font-weight: 900; border-radius: 12px; cursor: pointer;
    }
    .nitem i { font-size: 20px; margin-bottom: 2px; }
    .nitem.active { background: #f0fdfa; color: var(--primary); }

    .modal-mask {
      position: fixed; inset: 0; background: rgba(15,23,42,0.6);
      display: none; align-items: flex-end; justify-content: center; z-index: 100; padding: 10px;
    }
    .modal-mask.show { display: flex; }
    .modal {
      width: 100%; max-width: 640px; max-height: 85vh; overflow-y: auto;
      background: #fff; border-radius: 24px 24px 0 0; padding: 24px;
    }
    .badge { padding: 4px 10px; border-radius: 999px; font-size: 14px; font-weight: 900; }
    .badge-ok { background: #dcfce7; color: #166534; }
    .badge-wait { background: #fef9c3; color: #854d0e; }
    .badge-err { background: #fee2e2; color: #991b1b; }
    .loader {
      position: fixed; inset: 0; background: rgba(255,255,255,0.8);
      display: none; align-items: center; justify-content: center; z-index: 120;
    }
    .spinner {
      width: 48px; height: 48px; border: 5px solid #cbd5e1;
      border-top-color: var(--primary); border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (min-width: 600px) {
      .modal { border-radius: 20px; margin-bottom: 40px; }
      .modal-mask { align-items: center; }
    }
  </style>
</head>
<body>

  <div class="wrap">
    <!-- 頂部列 -->
    <header class="flex justify-between items-center mb-4">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-hand-holding-heart text-teal-700 text-3xl"></i>
        <h1 class="font-black text-xl text-slate-800">台灣帕金森病友權益促進會</h1>
      </div>
      <button onclick="toggleTremorMode()" class="btn btn-xs btn-outline" id="tremorBtn">
        <i class="fa-solid fa-hand"></i> 防手震模式
      </button>
    </header>

    <!-- 動態主畫面 -->
    <main id="appMain"></main>
  </div>

  <!-- 底部固定導覽 -->
  <nav class="bottom-nav">
    <div class="nav-inner">
      <div class="nitem active" id="navHome" onclick="navigate('home')">
        <i class="fa-solid fa-house"></i><span>首頁</span>
      </div>
      <div class="nitem" id="navMember" onclick="navigate('member')">
        <i class="fa-solid fa-user"></i><span>會員中心</span>
      </div>
      <div class="nitem" id="navFinance" onclick="navigate('finance')">
        <i class="fa-solid fa-receipt"></i><span>繳費/捐款</span>
      </div>
      <div class="nitem hidden" id="navAdmin" onclick="navigate('admin')">
        <i class="fa-solid fa-screwdriver-wrench"></i><span>管理後台</span>
      </div>
      <div class="nitem" id="navAuth" onclick="toggleAuth()">
        <i class="fa-solid fa-right-to-bracket" id="authIco"></i><span id="authText">登入</span>
      </div>
    </div>
  </nav>

  <!-- 通用 Modal 彈窗 -->
  <div id="modalMask" class="modal-mask" onclick="if(event.target.id==='modalMask') closeModal()">
    <div class="modal" id="modalBody"></div>
  </div>

  <div id="loader" class="loader"><div class="spinner"></div></div>

  <script>
    // ==========================================
    // 系統全域變數與部署設定
    // ==========================================
    // 請替換為您在 Google Apps Script 發布的 Web App URL
    const API_BASE = "https://script.google.com/macros/s/AKfycbwez8LC6MoKuRpYnhD1YISaI_lzR3rIp-qQCKCi1OWJA-eHdmmLfGx0BC8fM8I2qTB9/exec";

    let CURRENT_USER = JSON.parse(localStorage.getItem('PARK_USER') || 'null');
    let CURRENT_PAGE = 'home';
    let IS_TREMOR_MODE = false;

    function $(id) { return document.getElementById(id); }

    function showLoader() { $('loader').style.display = 'flex'; }
    function hideLoader() { $('loader').style.display = 'none'; }

    async function api(action, data = {}) {
      showLoader();
      try {
        const res = await fetch(API_BASE, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action, data })
        });
        const json = await res.json();
        hideLoader();
        return json;
      } catch (e) {
        hideLoader();
        alert("連線失敗：" + e.message);
        return { success: false, message: e.message };
      }
    }

    function toggleTremorMode() {
      IS_TREMOR_MODE = !IS_TREMOR_MODE;
      document.body.classList.toggle('tremor-mode', IS_TREMOR_MODE);
      $('tremorBtn').classList.toggle('bg-teal-700', IS_TREMOR_MODE);
      $('tremorBtn').classList.toggle('text-white', IS_TREMOR_MODE);
      alert(IS_TREMOR_MODE ? "已開啟防手震模式：按鈕區域已放大以防手抖誤觸。" : "已關閉防手震模式。");
    }

    function openModal(html) {
      $('modalBody').innerHTML = html;
      $('modalMask').classList.add('show');
    }
    function closeModal() {
      $('modalMask').classList.remove('show');
    }

    // ==========================================
    // 路由與頁面分發
    // ==========================================
    function navigate(page) {
      CURRENT_PAGE = page;
      document.querySelectorAll('.nitem').forEach(el => el.classList.remove('active'));

      if (page === 'home') { $('navHome').classList.add('active'); renderHome(); }
      else if (page === 'member') { $('navMember').classList.add('active'); renderMemberCenter(); }
      else if (page === 'finance') { $('navFinance').classList.add('active'); renderFinancePortal(); }
      else if (page === 'admin') { $('navAdmin').classList.add('active'); renderAdminPortal(); }

      updateAuthUI();
    }

    function updateAuthUI() {
      if (CURRENT_USER) {
        $('authText').innerText = "登出";
        $('authIco').className = "fa-solid fa-door-open";
        if (CURRENT_USER.isAdmin) {
          $('navAdmin').classList.remove('hidden');
        } else {
          $('navAdmin').classList.add('hidden');
        }
      } else {
        $('authText').innerText = "登入";
        $('authIco').className = "fa-solid fa-right-to-bracket";
        $('navAdmin').classList.add('hidden');
      }
    }

    function toggleAuth() {
      if (CURRENT_USER) {
        if (confirm("確定要登出嗎？")) {
          CURRENT_USER = null;
          localStorage.removeItem('PARK_USER');
          updateAuthUI();
          navigate('home');
        }
      } else {
        openLoginModal();
      }
    }

    // ==========================================
    // 1. 首頁展示
    // ==========================================
    function renderHome() {
      const main = $('appMain');
      if (!CURRENT_USER) {
        main.innerHTML = `
          <div class="card bg-gradient-to-br from-teal-800 to-teal-950 text-white border-none p-8 text-center">
            <h2 class="text-2xl font-black mb-2">陪伴病友・守護權益・共創希望</h2>
            <p class="text-teal-100 text-lg mb-6">歡迎使用台灣帕金森病友權益促進會管理系統</p>
            <div class="flex flex-col gap-3 max-w-sm mx-auto">
              <button onclick="openLoginModal()" class="btn btn-primary bg-teal-500 hover:bg-teal-600 text-slate-900 font-black">
                <i class="fa-solid fa-mobile-screen"></i> 會員快速登入 (免密碼)
              </button>
              <button onclick="openRegisterModal()" class="btn btn-outline border-white text-white">
                <i class="fa-solid fa-user-plus"></i> 申請加入協會
              </button>
            </div>
          </div>
        `;
      } else {
        main.innerHTML = `
          <div class="card bg-teal-50 border-teal-200">
            <div class="flex justify-between items-start">
              <div>
                <h2 class="text-2xl font-black text-teal-900">早安，${CURRENT_USER.name}</h2>
                <p class="text-teal-700 text-sm mt-1">會員編號：${CURRENT_USER.memberId} ｜ 類別：${CURRENT_USER.type}</p>
              </div>
              <span class="badge ${CURRENT_USER.isActive ? 'badge-ok' : 'badge-wait'}">
                ${CURRENT_USER.isActive ? '有效會員' : '會籍待展延'}
              </span>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3 mb-4">
            <button onclick="navigate('member')" class="btn btn-outline flex-col gap-2 p-6">
              <i class="fa-solid fa-address-card text-3xl"></i>
              <span>個人病歷資料</span>
            </button>
            <button onclick="navigate('finance')" class="btn btn-outline flex-col gap-2 p-6">
              <i class="fa-solid fa-credit-card text-3xl text-emerald-700"></i>
              <span>常年會費/捐款</span>
            </button>
          </div>

          ${CURRENT_USER.isAdmin ? `
            <div class="card border-teal-600 bg-teal-900 text-white">
              <h3 class="font-black text-lg mb-2"><i class="fa-solid fa-lock"></i> 幹部權限提示</h3>
              <p class="text-teal-200 text-sm mb-4">您具備行政管理與財務會計權限，可直接進入後台審核會費、支出與產生報表。</p>
              <button onclick="navigate('admin')" class="btn btn-primary bg-teal-500 text-slate-900">
                進入行政與財務後台
              </button>
            </div>
          ` : ''}
        `;
      }
    }

    // ==========================================
    // 2. 認證登入與註冊
    // ==========================================
    function openLoginModal() {
      openModal(`
        <h3 class="card-title"><i class="fa-solid fa-key"></i> 手機號碼免密登入</h3>
        <p class="text-sm text-slate-500 mb-4">請輸入您在協會登記的姓名與手機號碼即可完成登入。</p>
        <div class="fg">
          <label class="flabel">真實姓名</label>
          <input type="text" id="logName" class="fc" placeholder="例如：王小明">
        </div>
        <div class="fg">
          <label class="flabel">手機號碼</label>
          <input type="tel" id="logPhone" class="fc" placeholder="例如：0912345678">
        </div>
        <button onclick="submitLogin()" class="btn btn-primary mt-2">確認登入</button>
      `);
    }

    async function submitLogin() {
      const name = $('logName').value.trim();
      const phone = $('logPhone').value.trim();
      if (!name || !phone) return alert("請完整填寫姓名與手機號碼");

      const res = await api('auth.login', { name, phone });
      if (res.success) {
        CURRENT_USER = res.member;
        localStorage.setItem('PARK_USER', JSON.stringify(CURRENT_USER));
        closeModal();
        alert("登入成功！歡迎回來，" + CURRENT_USER.name);
        navigate('home');
      } else {
        alert(res.message);
      }
    }

    function openRegisterModal() {
      openModal(`
        <h3 class="card-title"><i class="fa-solid fa-user-plus"></i> 申請加入協會</h3>
        <div class="fg">
          <label class="flabel">真實姓名</label>
          <input type="text" id="regName" class="fc">
        </div>
        <div class="fg">
          <label class="flabel">手機號碼</label>
          <input type="tel" id="regPhone" class="fc">
        </div>
        <div class="fg">
          <label class="flabel">身分證字號 (報稅抵扣用)</label>
          <input type="text" id="regId" class="fc">
        </div>
        <button onclick="submitRegister()" class="btn btn-success mt-2">送出入會申請</button>
      `);
    }

    async function submitRegister() {
      const name = $('regName').value.trim();
      const phone = $('regPhone').value.trim();
      const identityId = $('regId').value.trim().toUpperCase();
      if (!name || !phone) return alert("姓名與手機為必填欄位");

      const res = await api('auth.register', { name, phone, identityId });
      alert(res.message);
      if (res.success) closeModal();
    }

    // ==========================================
    // 3. 會員中心與病歷紀錄
    // ==========================================
    async function renderMemberCenter() {
      if (!CURRENT_USER) return openLoginModal();
      const res = await api('member.getDetail', { memberId: CURRENT_USER.memberId });
      if (!res.success) return alert("無法讀取會員資料");
      const m = res.member;

      $('appMain').innerHTML = `
        <div class="card">
          <h3 class="card-title"><i class="fa-solid fa-id-card"></i> 會員基本資料與病歷</h3>
          
          <div class="grid grid-cols-2 gap-3 mb-4">
            <div class="fg">
              <label class="flabel">會員編號</label>
              <input type="text" class="fc bg-slate-100" value="${m.memberId}" disabled>
            </div>
            <div class="fg">
              <label class="flabel">姓名</label>
              <input type="text" class="fc bg-slate-100" value="${m.name}" disabled>
            </div>
          </div>

          <div class="fg">
            <label class="flabel">聯絡手機</label>
            <input type="tel" id="memMobile" class="fc" value="${m.mobile || ''}">
          </div>

          <div class="fg">
            <label class="flabel">身分證字號（申報抵稅收據使用）</label>
            <input type="text" id="memIdentity" class="fc" value="${m.identityId || ''}">
          </div>

          <div class="fg">
            <label class="flabel">通訊地址</label>
            <input type="text" id="memAddress" class="fc" value="${m.address || ''}">
          </div>

          <hr class="my-6 border-slate-200">

          <h4 class="font-black text-teal-800 text-lg mb-3">
            <i class="fa-solid fa-heart-pulse"></i> 帕金森氏症專屬病歷追蹤
          </h4>

          <div class="grid grid-cols-2 gap-3">
            <div class="fg">
              <label class="flabel">確診年份（西元）</label>
              <input type="number" id="memDiagYear" class="fc" value="${m.diagnosisYear || ''}" placeholder="例如: 2021">
            </div>
            <div class="fg">
              <label class="flabel">就診醫院</label>
              <input type="text" id="memHospital" class="fc" value="${m.hospital || ''}" placeholder="例如: 台大醫院">
            </div>
          </div>

          <div class="fg">
            <label class="flabel">主治醫師姓名</label>
            <input type="text" id="memDoctor" class="fc" value="${m.doctor || ''}" placeholder="例如: 林醫師">
          </div>

          <div class="fg">
            <label class="flabel">目前服用藥物與劑量</label>
            <textarea id="memMeds" class="fc" style="min-height:90px;" placeholder="例如: 美多芭 (Madopar) 每日三次，每次半顆">${m.medication || ''}</textarea>
          </div>

          <button onclick="saveMemberProfile()" class="btn btn-primary mt-4">
            <i class="fa-solid fa-floppy-disk"></i> 儲存個人資料與病歷
          </button>
        </div>
      `;
    }

    async function saveMemberProfile() {
      const payload = {
        memberId: CURRENT_USER.memberId,
        mobile: $('memMobile').value.trim(),
        identityId: $('memIdentity').value.trim().toUpperCase(),
        address: $('memAddress').value.trim(),
        diagnosisYear: $('memDiagYear').value.trim(),
        hospital: $('memHospital').value.trim(),
        doctor: $('memDoctor').value.trim(),
        medication: $('memMeds').value.trim()
      };

      const res = await api('member.update', payload);
      alert(res.message);
      if (res.success) {
        CURRENT_USER = { ...CURRENT_USER, ...payload };
        localStorage.setItem('PARK_USER', JSON.stringify(CURRENT_USER));
      }
    }

    // ==========================================
    // 4. 會員繳費與捐款專區
    // ==========================================
    async function renderFinancePortal() {
      if (!CURRENT_USER) return openLoginModal();

      const [payRes, donRes] = await Promise.all([
        api('payment.list', { memberId: CURRENT_USER.memberId }),
        api('donation.list', { memberId: CURRENT_USER.memberId })
      ]);

      const pays = payRes.items || [];
      const dons = donRes.items || [];

      $('appMain').innerHTML = `
        <div class="card bg-teal-50 border-teal-200">
          <h3 class="card-title text-teal-900"><i class="fa-solid fa-wallet"></i> 常年會費與愛心捐款</h3>
          <p class="text-sm text-teal-800 mb-4">
            本會常年會費為每年 <strong>NT$ 1,500</strong> 元。匯款後請點選下方申報，秘書處核對入帳後將立即開立電子收據。
          </p>
          <div class="grid grid-cols-2 gap-3">
            <button onclick="openApplyPaymentModal()" class="btn btn-primary">
              <i class="fa-solid fa-file-invoice-dollar"></i> 申報常年會費
            </button>
            <button onclick="openApplyDonationModal()" class="btn btn-success">
              <i class="fa-solid fa-hand-holding-heart"></i> 申報愛心捐款
            </button>
          </div>
        </div>

        <div class="card">
          <h4 class="font-black text-slate-800 mb-3"><i class="fa-solid fa-clock-rotate-left"></i> 會費繳納申報紀錄</h4>
          ${pays.length === 0 ? '<p class="text-sm text-slate-400 py-3 text-center">尚無申報紀錄</p>' : `
            <div class="flex flex-col gap-3">
              ${pays.map(p => `
                <div class="p-3 border-2 border-slate-200 rounded-xl flex justify-between items-center">
                  <div>
                    <div class="font-black text-slate-800">${p.year} 年度常年會費</div>
                    <div class="text-xs text-slate-500 mt-1">金額：NT$ ${Number(p.amount).toLocaleString()} ｜ 匯款日：${p.date}</div>
                    ${p.note ? `<div class="text-xs text-slate-500">後五碼/備註：${p.note}</div>` : ''}
                    ${p.receiptNo ? `<div class="text-xs text-teal-700 font-bold mt-1">收據編號：${p.receiptNo}</div>` : ''}
                  </div>
                  <span class="badge ${p.status === '已確認' ? 'badge-ok' : (p.status === '已退回' ? 'badge-err' : 'badge-wait')}">
                    ${p.status}
                  </span>
                </div>
              `).join('')}
            </div>
          `}
        </div>

        <div class="card">
          <h4 class="font-black text-slate-800 mb-3"><i class="fa-solid fa-heart text-red-600"></i> 愛心捐款申報紀錄</h4>

      `;
    }

    async function voidReceiptRecord(receiptNo) {
      const reason = prompt("確定作廢該收據？此操作將自動沖銷對應傳票並更正帳戶餘額。請輸入作廢原因：", "重複開立");
      if (!reason) return;
      const res = await api('receipt.void', { receiptNo, reason });
      alert(res.message);
      if (res.success) renderReceiptList();
    }

    // 後台：產出法定財務報表
    function openReportModal() {
      const year = new Date().getFullYear();
      openModal(`
        <h3 class="card-title"><i class="fa-solid fa-file-export"></i> 產生法定財務報表</h3>
        <div class="fg">
          <label class="flabel">年度</label>
          <select id="repYear" class="fc">
            <option value="${year}">${year} 年</option>
            <option value="${year-1}">${year-1} 年</option>
          </select>
        </div>
        <div class="fg">
          <label class="flabel">報表種類</label>
          <select id="repType" class="fc">
            <option value="1">收支決算表 (法定第一表)</option>
            <option value="7">預算執行控制表 (法定第七表)</option>
          </select>
        </div>
        <button onclick="generateReport()" class="btn btn-primary mt-2">即時產生報表</button>
      `);
    }

    async function generateReport() {
      const year = $('repYear').value;
      const type = $('repType').value;
      const res = await api('report.generate', { year, type });
      if (res.success) {
        openModal(`
          <div class="flex justify-between items-center mb-2">
            <span class="font-black text-teal-800">報表預覽</span>
            <button onclick="window.print()" class="btn btn-xs btn-outline">列印 / 另存 PDF</button>
          </div>
          <div class="bg-white p-2 border border-slate-300 rounded-lg overflow-x-auto text-xs">
            ${res.html}
          </div>
        `);
      } else {
        alert(res.message);
      }
    }

    // ==========================================
    // 6. 初始化載入
    // ==========================================
    document.addEventListener('DOMContentLoaded', () => {
      navigate('home');
    });
  </script>
</body>
</html>
