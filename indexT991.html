<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#14532d"
  >

  <meta
    name="color-scheme"
    content="light"
  >

  <title>台灣帕金森病友權益促進會</title>

  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root {
      --green-950: #052e16;
      --green-900: #14532d;
      --green-800: #166534;
      --green-700: #15803d;
      --green-600: #16a34a;
      --green-100: #dcfce7;
      --green-50: #f0fdf4;

      --blue-700: #1d4ed8;
      --blue-100: #dbeafe;
      --blue-50: #eff6ff;

      --orange-700: #c2410c;
      --orange-100: #ffedd5;
      --orange-50: #fff7ed;

      --red-700: #b91c1c;
      --red-100: #fee2e2;
      --red-50: #fef2f2;

      --yellow-700: #a16207;
      --yellow-100: #fef3c7;
      --yellow-50: #fffbeb;

      --purple-700: #7e22ce;
      --purple-100: #f3e8ff;
      --purple-50: #faf5ff;

      --slate-950: #020617;
      --slate-900: #0f172a;
      --slate-800: #1e293b;
      --slate-700: #334155;
      --slate-600: #475569;
      --slate-500: #64748b;
      --slate-400: #94a3b8;
      --slate-300: #cbd5e1;
      --slate-200: #e2e8f0;
      --slate-100: #f1f5f9;
      --slate-50: #f8fafc;

      --surface: #ffffff;
      --background: #f8fafc;
      --text: #0f172a;
      --muted: #475569;
      --border: #cbd5e1;

      --fs-xs: 14px;
      --fs-sm: 16px;
      --fs-base: 18px;
      --fs-lg: 22px;
      --fs-xl: 28px;
      --fs-xxl: 36px;
      --fs-title: 30px;

      --button-height: 54px;
      --input-height: 54px;

      --radius-sm: 8px;
      --radius: 14px;
      --radius-lg: 22px;

      --shadow:
        0 8px 24px rgba(15, 23, 42, 0.10);

      --header-height: 68px;
      --content-width: 1120px;
    }


    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }


    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }


    body {
      min-height: 100%;
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft JhengHei",
        "Noto Sans TC",
        sans-serif;
      font-size: var(--fs-base);
      line-height: 1.7;
      -webkit-text-size-adjust: 100%;
    }


    body.large-text {
      --fs-xs: 20px;
      --fs-sm: 22px;
      --fs-base: 25px;
      --fs-lg: 29px;
      --fs-xl: 35px;
      --fs-xxl: 44px;
      --fs-title: 38px;

      --button-height: 72px;
      --input-height: 70px;
    }


    body.high-contrast {
      --background: #000000;
      --surface: #000000;
      --text: #ffffff;
      --muted: #ffffff;
      --border: #ffffff;
      --green-900: #004d1a;
      --green-800: #006622;
      --green-100: #002d10;
      --green-50: #001a09;
      --slate-50: #000000;
      --slate-100: #111111;
      --slate-200: #333333;
      --slate-300: #ffffff;
    }


    button,
    input,
    select,
    textarea {
      font: inherit;
    }


    button,
    a,
    input,
    select,
    textarea {
      -webkit-tap-highlight-color: transparent;
    }


    button {
      cursor: pointer;
    }


    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }


    :focus-visible {
      outline: 4px solid #f59e0b;
      outline-offset: 3px;
    }


    .skip-link {
      position: fixed;
      top: -100px;
      left: 16px;
      z-index: 5000;
      padding: 12px 18px;
      border-radius: var(--radius-sm);
      background: #ffffff;
      color: #000000;
      font-weight: 900;
    }


    .skip-link:focus {
      top: 12px;
    }


    .app-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      min-height: var(--header-height);
      background: var(--green-900);
      color: #ffffff;
      box-shadow:
        0 4px 16px rgba(0, 0, 0, 0.20);
    }


    .header-inner {
      width: min(
        100% - 24px,
        var(--content-width)
      );
      min-height: var(--header-height);
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }


    .brand-button {
      flex: 1;
      min-width: 0;
      padding: 8px 4px;
      border: 0;
      background: transparent;
      color: #ffffff;
      text-align: left;
    }


    .brand-title {
      display: block;
      overflow: hidden;
      font-size: var(--fs-lg);
      font-weight: 900;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }


    .brand-subtitle {
      display: block;
      overflow: hidden;
      margin-top: 2px;
      font-size: var(--fs-xs);
      font-weight: 700;
      opacity: 0.90;
      text-overflow: ellipsis;
      white-space: nowrap;
    }


    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }


    .header-button {
      min-width: 48px;
      min-height: 48px;
      padding: 7px 12px;
      border: 2px solid rgba(255, 255, 255, 0.80);
      border-radius: 12px;
      background: transparent;
      color: #ffffff;
      font-weight: 900;
    }


    .header-button:hover {
      background: rgba(255, 255, 255, 0.15);
    }


    .desktop-only {
      display: inline-flex;
    }


    .app-layout {
      width: min(
        100% - 24px,
        var(--content-width)
      );
      margin: 0 auto;
      padding: 24px 0 60px;
    }


    .page {
      min-height: 60vh;
    }


    .page-header {
      margin-bottom: 22px;
    }


    .page-title {
      margin: 0;
      color: var(--text);
      font-size: var(--fs-title);
      font-weight: 900;
      line-height: 1.3;
    }


    .page-description {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: var(--fs-sm);
    }


    .hero {
      overflow: hidden;
      position: relative;
      padding: 34px;
      border-radius: var(--radius-lg);
      background:
        linear-gradient(
          135deg,
          var(--green-900),
          var(--green-700)
        );
      color: #ffffff;
      box-shadow: var(--shadow);
    }


    .hero h1 {
      margin: 0;
      max-width: 760px;
      font-size: var(--fs-xxl);
      line-height: 1.25;
    }


    .hero p {
      max-width: 760px;
      margin: 14px 0 0;
      font-size: var(--fs-lg);
    }


    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }


    .grid {
      display: grid;
      gap: 18px;
    }


    .grid-2 {
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
    }


    .grid-3 {
      grid-template-columns:
        repeat(3, minmax(0, 1fr));
    }


    .grid-4 {
      grid-template-columns:
        repeat(4, minmax(0, 1fr));
    }


    .card {
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow:
        0 4px 15px rgba(15, 23, 42, 0.06);
    }


    .card-title {
      margin: 0 0 12px;
      color: var(--text);
      font-size: var(--fs-lg);
      font-weight: 900;
    }


    .card-description {
      margin: 0;
      color: var(--muted);
    }


    .stat-card {
      text-align: center;
    }


    .stat-value {
      margin-top: 6px;
      color: var(--green-800);
      font-size: var(--fs-xxl);
      font-weight: 900;
      line-height: 1.2;
    }


    .stat-label {
      color: var(--muted);
      font-weight: 800;
    }


    .section {
      margin-top: 28px;
    }


    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }


    .section-title {
      margin: 0;
      font-size: var(--fs-xl);
      font-weight: 900;
    }


    .button {
      display: inline-flex;
      min-height: var(--button-height);
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 20px;
      border: 2px solid transparent;
      border-radius: 12px;
      font-weight: 900;
      line-height: 1.3;
      text-decoration: none;
    }


    .button-primary {
      background: var(--green-800);
      color: #ffffff;
    }


    .button-primary:hover {
      background: var(--green-700);
    }


    .button-secondary {
      border-color: var(--green-800);
      background: var(--surface);
      color: var(--green-800);
    }


    .button-secondary:hover {
      background: var(--green-50);
    }


    .button-line {
      background: #06c755;
      color: #ffffff;
    }


    .button-line:hover {
      background: #05ad49;
    }


    .button-danger {
      background: var(--red-700);
      color: #ffffff;
    }


    .button-warning {
      background: var(--orange-700);
      color: #ffffff;
    }


    .button-light {
      border-color: #ffffff;
      background: #ffffff;
      color: var(--green-900);
    }


    .button-ghost {
      border-color: var(--border);
      background: transparent;
      color: var(--text);
    }


    .button-small {
      min-height: 42px;
      padding: 7px 13px;
      font-size: var(--fs-sm);
    }


    .button-block {
      width: 100%;
    }


    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }


    .form-group {
      margin-bottom: 18px;
    }


    .form-label {
      display: block;
      margin-bottom: 7px;
      color: var(--text);
      font-weight: 900;
    }


    .form-control {
      width: 100%;
      min-height: var(--input-height);
      padding: 10px 13px;
      border: 2px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
    }


    textarea.form-control {
      min-height: 130px;
      resize: vertical;
    }


    .form-control:focus {
      border-color: var(--green-700);
    }


    .form-help {
      margin-top: 6px;
      color: var(--muted);
      font-size: var(--fs-xs);
    }


    .required-mark {
      color: var(--red-700);
    }


    .notice {
      margin: 14px 0;
      padding: 14px 16px;
      border: 1px solid;
      border-radius: 12px;
    }


    .notice-info {
      border-color: #60a5fa;
      background: var(--blue-50);
      color: var(--blue-700);
    }


    .notice-success {
      border-color: #4ade80;
      background: var(--green-50);
      color: var(--green-800);
    }


    .notice-warning {
      border-color: #f59e0b;
      background: var(--yellow-50);
      color: var(--yellow-700);
    }


    .notice-danger {
      border-color: #f87171;
      background: var(--red-50);
      color: var(--red-700);
    }


    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--slate-100);
      color: var(--slate-700);
      font-size: var(--fs-xs);
      font-weight: 900;
    }


    .badge-success {
      background: var(--green-100);
      color: var(--green-800);
    }


    .badge-warning {
      background: var(--yellow-100);
      color: var(--yellow-700);
    }


    .badge-danger {
      background: var(--red-100);
      color: var(--red-700);
    }


    .announcement-list {
      display: grid;
      gap: 14px;
    }


    .announcement-card {
      padding: 18px;
      border: 1px solid var(--border);
      border-left: 7px solid var(--green-700);
      border-radius: 12px;
      background: var(--surface);
    }


    .announcement-title {
      margin: 0;
      font-size: var(--fs-lg);
      font-weight: 900;
    }


    .announcement-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
      color: var(--muted);
      font-size: var(--fs-sm);
    }


    .announcement-content {
      margin-top: 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }


    .empty-state {
      padding: 36px 20px;
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      color: var(--muted);
      text-align: center;
    }


    .skeleton {
      min-height: 110px;
      border-radius: var(--radius);
      background:
        linear-gradient(
          90deg,
          var(--slate-100) 25%,
          var(--slate-200) 50%,
          var(--slate-100) 75%
        );
      background-size: 200% 100%;
      animation:
        skeleton-shimmer 1.4s infinite;
    }


    @keyframes skeleton-shimmer {
      0% {
        background-position: 200% 0;
      }

      100% {
        background-position: -200% 0;
      }
    }


    .drawer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 1990;
      display: none;
      background: rgba(2, 6, 23, 0.65);
    }


    .drawer-backdrop.open {
      display: block;
    }


    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 2000;
      width: min(90vw, 380px);
      height: 100dvh;
      padding: 18px;
      overflow-y: auto;
      background: var(--surface);
      color: var(--text);
      box-shadow:
        -10px 0 30px rgba(0, 0, 0, 0.25);
      transform: translateX(110%);
      transition: transform 0.25s ease;
    }


    .drawer.open {
      transform: translateX(0);
    }


    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }


    .drawer-title {
      margin: 0;
      font-size: var(--fs-xl);
    }


    .drawer-user {
      margin: 14px 0;
      padding: 14px;
      border-radius: 12px;
      background: var(--green-50);
    }


    .drawer-nav {
      display: grid;
      gap: 8px;
    }


    .nav-button {
      width: 100%;
      min-height: 52px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      font-weight: 900;
      text-align: left;
    }


    .nav-button:hover,
    .nav-button.active {
      border-color: var(--green-700);
      background: var(--green-50);
      color: var(--green-800);
    }


    .nav-separator {
      height: 1px;
      margin: 8px 0;
      background: var(--border);
    }


    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 3000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(2, 6, 23, 0.72);
    }


    .modal-backdrop.open {
      display: flex;
    }


    .modal {
      width: min(100%, 680px);
      max-height: 90dvh;
      overflow-y: auto;
      border-radius: var(--radius-lg);
      background: var(--surface);
      color: var(--text);
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.35);
    }


    .modal-header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }


    .modal-title {
      margin: 0;
      font-size: var(--fs-xl);
      font-weight: 900;
    }


    .modal-close {
      min-width: 48px;
      min-height: 48px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      font-size: 26px;
    }


    .modal-body {
      padding: 20px;
    }


    .loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 4000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(2, 6, 23, 0.70);
    }


    .loading-overlay.open {
      display: flex;
    }


    .loading-card {
      min-width: 220px;
      padding: 24px;
      border-radius: 18px;
      background: var(--surface);
      color: var(--text);
      text-align: center;
      box-shadow: var(--shadow);
    }


    .spinner {
      width: 52px;
      height: 52px;
      margin: 0 auto 14px;
      border: 6px solid var(--slate-200);
      border-top-color: var(--green-700);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }


    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }


    .toast-region {
      position: fixed;
      top: calc(var(--header-height) + 12px);
      left: 50%;
      z-index: 5000;
      width: min(92vw, 560px);
      pointer-events: none;
      transform: translateX(-50%);
    }


    .toast {
      margin-bottom: 10px;
      padding: 14px 18px;
      border: 2px solid;
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow);
      font-weight: 900;
      pointer-events: auto;
    }


    .toast-success {
      border-color: var(--green-600);
    }


    .toast-error {
      border-color: #ef4444;
    }


    .toast-warning {
      border-color: #f59e0b;
    }


    .toast-info {
      border-color: #3b82f6;
    }


    .app-footer {
      padding: 30px 16px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      text-align: center;
      font-size: var(--fs-sm);
    }


    .visually-hidden {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }


    .hidden {
      display: none !important;
    }


    .text-center {
      text-align: center;
    }


    .text-muted {
      color: var(--muted);
    }


    .pre-wrap {
      white-space: pre-wrap;
    }


    .mt-0 {
      margin-top: 0;
    }


    .mt-1 {
      margin-top: 8px;
    }


    .mt-2 {
      margin-top: 16px;
    }


    .mt-3 {
      margin-top: 24px;
    }


    .mb-0 {
      margin-bottom: 0;
    }


    @media (max-width: 900px) {
      .grid-4,
      .grid-3 {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }
    }


    @media (max-width: 680px) {
      .desktop-only {
        display: none;
      }

      .header-inner {
        width: min(100% - 16px, var(--content-width));
      }

      .app-layout {
        width: min(100% - 16px, var(--content-width));
        padding-top: 16px;
      }

      .hero {
        padding: 24px 20px;
      }

      .grid-4,
      .grid-3,
      .grid-2 {
        grid-template-columns: 1fr;
      }

      .button-row,
      .hero-actions {
        display: grid;
        grid-template-columns: 1fr;
      }

      .button-row .button,
      .hero-actions .button {
        width: 100%;
      }
    }


    @media print {
      .app-header,
      .app-footer,
      .drawer,
      .drawer-backdrop,
      .toast-region,
      .modal-backdrop,
      .loading-overlay,
      .no-print {
        display: none !important;
      }

      body {
        background: #ffffff;
        color: #000000;
      }

      .app-layout {
        width: 100%;
        margin: 0;
        padding: 0;
      }

      .card {
        box-shadow: none;
      }
    }


    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <a
    class="skip-link"
    href="#appMain"
  >
    跳到主要內容
  </a>

  <header class="app-header">
    <div class="header-inner">
      <button
        id="brandButton"
        class="brand-button"
        type="button"
        aria-label="回到首頁"
      >
        <span class="brand-title">
          台灣帕金森病友權益促進會
        </span>

        <span class="brand-subtitle">
          會員與健康管理平台
        </span>
      </button>

      <div class="header-actions">
        <button
          id="fontSizeButton"
          class="header-button desktop-only"
          type="button"
          aria-pressed="false"
        >
          大字
        </button>

        <button
          id="contrastButton"
          class="header-button desktop-only"
          type="button"
          aria-pressed="false"
        >
          對比
        </button>

        <button
          id="loginButton"
          class="header-button"
          type="button"
        >
          登入
        </button>

        <button
          id="menuButton"
          class="header-button"
          type="button"
          aria-controls="appDrawer"

  <div

  <script>
    "use strict";


    // ======================================================
    // 1. 正式部署設定
    // ======================================================

    const CONFIG = Object.freeze({
      /*
       * 請換成 Apps Script 正式 Web App 執行網址。
       *
       * 範例：
       * https://script.google.com/macros/s/部署ID/exec
       */
      API_BASE:
        "https://script.google.com/macros/s/AKfycbzn9_TWK7Q7UC65EdzIl4PB4Vdku9CHwGkM8krdUMx02yFe13DpFifCqT4fr14hFE8brQ/exec",

      /*
       * 請換成正式 LIFF ID。
       */
      LIFF_ID:
        "2009456572-588gzru4",

      API_TIMEOUT_MS: 25000,

      SESSION_TOKEN_KEY:
        "parkSessionToken",

      SESSION_USER_KEY:
        "parkSessionUser",

      UI_PREFERENCE_KEY:
        "parkUiPreferences"
    });


    // ======================================================
    // 2. 全域應用狀態
    // ======================================================

    const APP = {
      user: null,
      sessionToken: "",

      route: "home",
      routeParams: {},

      liffReady: false,
      liffInitializing: false,

      modalPreviousFocus: null,

      loadingCount: 0,

      objectUrls: new Set(),

      cleanupHandlers: new Set(),

      routes: new Map(),

      extensionNavItems: []
    };


    // ======================================================
    // 3. DOM 工具
    // ======================================================

    function byId(id) {
      return document.getElementById(id);
    }


    function createElement(
      tagName,
      options = {}
    ) {
      const element =
        document.createElement(tagName);

      if (options.className) {
        element.className =
          options.className;
      }

      if (
        options.text !== undefined
      ) {
        element.textContent =
          String(options.text);
      }

      if (options.attrs) {
        Object.entries(
          options.attrs
        ).forEach(
          ([name, value]) => {
            if (
              value !== undefined &&
              value !== null
            ) {
              element.setAttribute(
                name,
                String(value)
              );
            }
          }
        );
      }

      if (options.dataset) {
        Object.entries(
          options.dataset
        ).forEach(
          ([name, value]) => {
            element.dataset[name] =
              String(value);
          }
        );
      }

      return element;
    }


    function clearElement(element) {
      if (!element) {
        return;
      }

      while (element.firstChild) {
        element.removeChild(
          element.firstChild
        );
      }
    }


    function appendChildren(
      parent,
      children
    ) {
      children
        .filter(Boolean)
        .forEach(
          child => {
            parent.appendChild(child);
          }
        );

      return parent;
    }


    function safeText(value) {
      return String(
        value === undefined ||
        value === null
          ? ""
          : value
      );
    }


    function normalizeHttpsUrl(value) {
      try {
        const url = new URL(
          String(value || "")
        );

        return url.protocol === "https:"
          ? url.toString()
          : "";
      } catch (error) {
        return "";
      }
    }


    function formatMoney(value) {
      const number = Number(value || 0);

      return Number.isFinite(number)
        ? number.toLocaleString(
            "zh-TW",
            {
              maximumFractionDigits: 2
            }
          )
        : "0";
    }


    function formatDate(value) {
      const text = String(
        value || ""
      );

      return text
        ? text.substring(0, 10)
        : "";
    }


    function formatDateTime(value) {
      const text = String(
        value || ""
      );

      return text
        ? text.substring(0, 16)
        : "";
    }


    function todayString() {
      const now = new Date();

      const year =
        now.getFullYear();

      const month =
        String(
          now.getMonth() + 1
        ).padStart(2, "0");

      const day =
        String(
          now.getDate()
        ).padStart(2, "0");

      return [
        year,
        month,
        day
      ].join("-");
    }


    function currentYear() {
      return new Date()
        .getFullYear();
    }


    // ======================================================
    // 4. 共用頁面元件
    // ======================================================

    function createPageHeader(
      title,
      description
    ) {
      const header =
        createElement(
          "div",
          {
            className: "page-header"
          }
        );

      const heading =
        createElement(
          "h1",
          {
            className: "page-title",
            text: title
          }
        );

      header.appendChild(heading);

      if (description) {
        header.appendChild(
          createElement(
            "p",
            {
              className:
                "page-description",
              text: description
            }
          )
        );
      }

      return header;
    }


    function createButton(
      label,
      options = {}
    ) {
      const button =
        createElement(
          "button",
          {
            className:
              "button " +
              (
                options.className ||
                "button-primary"
              ),
            text: label,
            attrs: {
              type:
                options.type ||
                "button",
              disabled:
                options.disabled
                  ? "disabled"
                  : null
            }
          }
        );

      if (options.onClick) {
        button.addEventListener(
          "click",
          options.onClick
        );
      }

      return button;
    }


    function createEmptyState(
      message
    ) {
      return createElement(
        "div",
        {
          className:
            "empty-state",
          text:
            message ||
            "目前沒有資料"
        }
      );
    }


    function createNotice(
      message,
      type = "info"
    ) {
      return createElement(
        "div",
        {
          className:
            "notice notice-" +
            type,
          text: message
        }
      );
    }


    function createBadge(
      text,
      type = ""
    ) {
      return createElement(
        "span",
        {
          className:
            "badge" +
            (
              type
                ? " badge-" + type
                : ""
            ),
          text: text
        }
      );
    }


    function createFormGroup(
      options
    ) {
      const group =
        createElement(
          "div",
          {
            className:
              "form-group"
          }
        );

      const label =
        createElement(
          "label",
          {
            className:
              "form-label",
            attrs: {
              for: options.id
            }
          }
        );

      label.appendChild(
        document.createTextNode(
          options.label
        )
      );

      if (options.required) {
        label.appendChild(
          createElement(
            "span",
            {
              className:
                "required-mark",
              text: " *"
            }
          )
        );
      }

      let control;

      if (
        options.type === "textarea"
      ) {
        control =
          createElement(
            "textarea",
            {
              className:
                "form-control",
              attrs: {
                id: options.id,
                name: options.id,
                maxlength:
                  options.maxLength,
                placeholder:
                  options.placeholder || "",
                required:
                  options.required
                    ? "required"
                    : null
              }
            }
          );
      } else if (
        options.type === "select"
      ) {
        control =
          createElement(
            "select",
            {
              className:
                "form-control",
              attrs: {
                id: options.id,
                name: options.id,
                required:
                  options.required
                    ? "required"
                    : null
              }
            }
          );

        (
          options.options || []
        ).forEach(option => {
          const optionElement =
            createElement(
              "option",
              {
                text:
                  option.label,
                attrs: {
                  value:
                    option.value
                }
              }
            );

          if (
            String(option.value) ===
            String(
              options.value || ""
            )
          ) {
            optionElement.selected =
              true;
          }

          control.appendChild(
            optionElement
          );
        });
      } else {
        control =
          createElement(
            "input",
            {
              className:
                "form-control",
              attrs: {
                id: options.id,
                name: options.id,
                type:
                  options.type ||
                  "text",
                maxlength:
                  options.maxLength,
                placeholder:
                  options.placeholder || "",
                autocomplete:
                  options.autocomplete || "off",
                inputmode:
                  options.inputMode,
                min:
                  options.min,
                max:
                  options.max,
                step:
                  options.step,
                required:
                  options.required
                    ? "required"
                    : null
              }
            }
          );

        if (
          options.value !== undefined
        ) {
          control.value =
            String(options.value);
        }
      }

      group.appendChild(label);
      group.appendChild(control);

      if (options.help) {
        group.appendChild(
          createElement(
            "div",
            {
              className:
                "form-help",
              text: options.help
            }
          )
        );
      }

      return {
        group,
        control
      };
    }


    // ======================================================
    // 5. Toast、Loading 與 Modal
    // ======================================================

    function showToast(
      message,
      type = "info",
      duration = 4200
    ) {
      const region =
        byId("toastRegion");

      const toast =
        createElement(
          "div",
          {
            className:
              "toast toast-" +
              type,
            text: message,
            attrs: {
              role:
                type === "error"
                  ? "alert"
                  : "status"
            }
          }
        );

      region.appendChild(toast);

      window.setTimeout(
        () => {
          toast.remove();
        },
        duration
      );
    }


    function showLoading(
      message =
        "處理中，請稍候"
    ) {
      APP.loadingCount++;

      byId("loadingText")
        .textContent = message;

      byId("loadingOverlay")
        .classList.add("open");

      byId("loadingOverlay")
        .setAttribute(
          "aria-hidden",
          "false"
        );
    }


    function hideLoading() {
      APP.loadingCount =
        Math.max(
          APP.loadingCount - 1,
          0
        );

      if (APP.loadingCount === 0) {
        byId("loadingOverlay")
          .classList.remove("open");

        byId("loadingOverlay")
          .setAttribute(
            "aria-hidden",
            "true"
          );
      }
    }


    function openModal(
      title,
      content
    ) {
      APP.modalPreviousFocus =
        document.activeElement;

      byId("modalTitle")
        .textContent = title;

      const body =
        byId("modalBody");

      clearElement(body);

      if (
        content instanceof Node
      ) {
        body.appendChild(content);
      } else {
        body.textContent =
          String(content || "");
      }

      const backdrop =
        byId("modalBackdrop");

      backdrop.classList.add(
        "open"
      );

      backdrop.setAttribute(
        "aria-hidden",
        "false"
      );

      document.body.style.overflow =
        "hidden";

      window.setTimeout(
        () => {
          const focusTarget =
            body.querySelector(
              "input,select,textarea,button"
            ) ||
            byId(
              "modalCloseButton"
            );

          focusTarget.focus();
        },
        0
      );
    }


    function closeModal() {
      const backdrop =
        byId("modalBackdrop");

      backdrop.classList.remove(
        "open"
      );

      backdrop.setAttribute(
        "aria-hidden",
        "true"
      );

      document.body.style.overflow =
        "";

      clearElement(
        byId("modalBody")
      );

      if (
        APP.modalPreviousFocus &&
        typeof APP.modalPreviousFocus
          .focus === "function"
      ) {
        APP.modalPreviousFocus
          .focus();
      }

      APP.modalPreviousFocus =
        null;
    }


    function confirmDialog(
      title,
      message,
      confirmLabel = "確定"
    ) {
      return new Promise(resolve => {
        const content =
          createElement("div");

        content.appendChild(
          createNotice(
            message,
            "warning"
          )
        );

        const row =
          createElement(
            "div",
            {
              className:
                "button-row mt-2"
            }
          );

        row.appendChild(
          createButton(
            "取消",
            {
              className:
                "button-secondary",
              onClick: () => {
                closeModal();
                resolve(false);
              }
            }
          )
        );

        row.appendChild(
          createButton(
            confirmLabel,
            {
              className:
                "button-danger",
              onClick: () => {
                closeModal();
                resolve(true);
              }
            }
          )
        );

        content.appendChild(row);

        openModal(
          title,
          content
        );
      });
    }


    // ======================================================
    // 6. Session 管理
    // ======================================================

    function loadStoredSession() {
      try {
        APP.sessionToken =
          sessionStorage.getItem(
            CONFIG.SESSION_TOKEN_KEY
          ) || "";

        const rawUser =
          sessionStorage.getItem(
            CONFIG.SESSION_USER_KEY
          );

        APP.user =
          rawUser
            ? JSON.parse(rawUser)
            : null;

        if (
          !APP.sessionToken ||
          !APP.user
        ) {
          clearSession();
        }
      } catch (error) {
        clearSession();
      }

      /*
       * 移除舊版可被竄改的登入資料。
       */
      localStorage.removeItem(
        "parkUser"
      );
    }


    function saveSession(result) {
      if (
        !result ||
        !result.sessionToken ||
        !result.member
      ) {
        throw new Error(
          "登入回應資料不完整"
        );
      }

      APP.sessionToken =
        result.sessionToken;

      APP.user =
        result.member;

      sessionStorage.setItem(
        CONFIG.SESSION_TOKEN_KEY,
        APP.sessionToken
      );

      sessionStorage.setItem(
        CONFIG.SESSION_USER_KEY,
        JSON.stringify(
          APP.user
        )
      );

      refreshNavigation();
    }


    function clearSession() {
      APP.sessionToken = "";
      APP.user = null;

      sessionStorage.removeItem(
        CONFIG.SESSION_TOKEN_KEY
      );

      sessionStorage.removeItem(
        CONFIG.SESSION_USER_KEY
      );

      refreshNavigation();
    }


    function isAuthenticated() {
      return Boolean(
        APP.user &&
        APP.sessionToken
      );
    }


    function isAdmin() {
      return Boolean(
        APP.user &&
        APP.user.isAdmin
      );
    }


    function isFinanceAdmin() {
      return Boolean(
        APP.user &&
        APP.user.isFinanceAdmin
      );
    }


    function requireLogin() {
      if (isAuthenticated()) {
        return true;
      }

      showToast(
        "請先登入會員帳號",
        "warning"
      );

      openLoginModal();

      return false;
    }


    function requireAdmin() {
      if (
        isAuthenticated() &&
        isAdmin()
      ) {
        return true;
      }

      showToast(
        "此功能僅限管理人員",
        "error"
      );

      return false;
    }


    function requireFinanceAdmin() {
      if (
        isAuthenticated() &&
        isFinanceAdmin()
      ) {
        return true;
      }

      showToast(
        "此功能僅限財務人員",
        "error"
      );

      return false;
    }


    // ======================================================
    // 7. 安全 API 呼叫
    // ======================================================

    async function api(
      action,
      data = {},
      options = {}
    ) {
      if (
        !CONFIG.API_BASE ||
        CONFIG.API_BASE.includes(
          "請換成"
        )
      ) {
        throw new Error(
          "尚未設定正式 API_BASE"
        );
      }

      const controller =
        new AbortController();

      const timeoutId =
        window.setTimeout(
          () => {
            controller.abort();
          },
          Number(
            options.timeout ||
            CONFIG.API_TIMEOUT_MS
          )
        );

      const payloadData =
        Object.assign(
          {},
          data
        );

      if (
        action.startsWith("auth.")
      ) {
        payloadData.deviceInfo =
          [
            navigator.platform || "",
            navigator.userAgent || ""
          ]
            .join(" / ")
            .substring(0, 500);
      }

      try {
        const response =
          await fetch(
            CONFIG.API_BASE,
            {
              method: "POST",

              /*
               * text/plain 可避免部分 GAS 跨來源請求
               * 觸發額外預檢。
               */
              headers: {
                "Content-Type":
                  "text/plain;charset=utf-8"
              },

              redirect: "follow",

              body: JSON.stringify({
                action,
                sessionToken:
                  APP.sessionToken,
                data:
                  payloadData
              }),

              signal:
                controller.signal
            }
          );

        if (!response.ok) {
          throw new Error(
            "伺服器回應錯誤：" +
            response.status
          );
        }

        const responseText =
          await response.text();

        let result;

        try {
          result =
            JSON.parse(
              responseText
            );
        } catch (error) {
          throw new Error(
            "伺服器回應格式不正確"
          );
        }

        if (
          result.errorCode ===
          "AUTH_REQUIRED"
        ) {
          clearSession();

          if (
            options.silentAuth !== true
          ) {
            showToast(
              "登入已失效，請重新登入",
              "warning"
            );
          }
        }

        return result;
      } catch (error) {
        if (
          error.name ===
          "AbortError"
        ) {
          throw new Error(
            "連線逾時，請檢查網路後再試"
          );
        }

        throw error;
      } finally {
        window.clearTimeout(
          timeoutId
        );
      }
    }


    async function validateStoredSession() {
      if (
        !APP.sessionToken
      ) {
        return false;
      }

      try {
        const result =
          await api(
            "auth.me",
            {},
            {
              silentAuth: true,
              timeout: 12000
            }
          );

        if (
          result.success &&
          result.member
        ) {
          APP.user =
            result.member;

          sessionStorage.setItem(
            CONFIG.SESSION_USER_KEY,
            JSON.stringify(
              APP.user
            )
          );

          refreshNavigation();

          return true;
        }

        clearSession();

        return false;
      } catch (error) {
        /*
         * 短暫離線時保留 Session，
         * 後續敏感操作仍會由後端驗證。
         */
        console.warn(
          "Session 驗證暫時失敗",
          error
        );

        return false;
      }
    }


    // ======================================================
    // 8. LIFF 安全登入
    // ======================================================

    async function initializeLiff() {
      if (
        APP.liffReady ||
        APP.liffInitializing
      ) {
        return APP.liffReady;
      }

      if (
        typeof window.liff ===
        "undefined"
      ) {
        return false;
      }

      if (
        !CONFIG.LIFF_ID ||
        CONFIG.LIFF_ID.includes(
          "請換成"
        )
      ) {
        console.warn(
          "LIFF_ID 尚未設定"
        );

        return false;
      }

      APP.liffInitializing = true;

      try {
        await window.liff.init({
          liffId:
            CONFIG.LIFF_ID
        });

        APP.liffReady = true;

        return true;
      } catch (error) {
        console.error(
          "LIFF 初始化失敗",
          error
        );

        APP.liffReady = false;

        return false;
      } finally {
        APP.liffInitializing =
          false;
      }
    }


    async function startLineLogin() {
      showLoading(
        "正在連接 LINE"
      );

      try {
        const ready =
          await initializeLiff();

        if (!ready) {
          throw new Error(
            "LINE 登入模組無法初始化"
          );
        }

        if (
          !window.liff.isLoggedIn()
        ) {
          window.liff.login({
            redirectUri:
              window.location.href
          });

          return;
        }

        const idToken =
          window.liff.getIDToken();

        if (!idToken) {
          throw new Error(
            "無法取得 LINE 登入憑證"
          );
        }

        const result =
          await api(
            "auth.loginByLineToken",
            {
              idToken
            }
          );

        if (!result.success) {
          throw new Error(
            result.message ||
            "LINE 登入失敗"
          );
        }

        if (
          result.requiresBinding
        ) {
          closeModal();

          openLineBindingModal(
            result.lineBindingToken
          );

          return;
        }

        saveSession(result);
        closeModal();

        showToast(
          "登入成功，歡迎回來",
          "success"
        );

        navigate("home");
      } catch (error) {
        showToast(
          error.message ||

    function registerRoute(

      APP.routes.set(

    function routeFromLocation() {
      const hash =
        window.location.hash
          .replace(/^#\/?/, "");

      if (!hash) {
        return {
          route: "home",
          params: {}
        };
      }

      const [
        routeName,
        queryString
      ] = hash.split("?");

      const params = {};

      if (queryString) {
        const search =
          new URLSearchParams(
            queryString
          );

        search.forEach(
          (value, key) => {
            params[key] = value;
          }
        );
      }

      return {
        route:
          routeName || "home",
        params
      };
    }


    function navigate(
      routeName,
      params = {},
      replace = false
    ) {
      const query =
        new URLSearchParams();

      Object.entries(
        params || {}
      ).forEach(
        ([key, value]) => {
          if (
            value !== undefined &&
            value !== null &&
            value !== ""
          ) {
            query.set(
              key,
              String(value)
            );
          }
        }
      );

      const hash =
        "#/" +
        routeName +
        (
          query.toString()
            ? "?" +
              query.toString()
            : ""
        );

      if (replace) {
        history.replaceState(
          null,
          "",
          hash
        );

        renderCurrentRoute();
      } else if (
        window.location.hash ===
        hash
      ) {
        renderCurrentRoute();
      } else {
        window.location.hash =
          hash;
      }
    }


    async function renderCurrentRoute() {
      closeDrawer();
      cleanupPageResources();

      const location =
        routeFromLocation();

      const definition =
        APP.routes.get(
          location.route
        );

      if (!definition) {
        APP.route = "notFound";
        APP.routeParams = {};

        renderNotFoundPage();
        refreshNavigation();

        return;
      }

      if (
        definition.requiresLogin &&
        !isAuthenticated()
      ) {
        showToast(
          "請先登入會員帳號",
          "warning"
        );

        openLoginModal();
        navigate(
          "home",
          {},
          true
        );

        return;
      }

      if (
        definition.requiresAdmin &&
        !isAdmin()
      ) {
        showToast(
          "權限不足",
          "error"
        );

        navigate(
          "home",
          {},
          true
        );

        return;
      }

      if (
        definition.requiresFinance &&
        !isFinanceAdmin()
      ) {
        showToast(
          "此功能僅限財務人員",
          "error"
        );

        navigate(
          "home",
          {},
          true
        );

        return;
      }

      APP.route =
        location.route;

      APP.routeParams =
        location.params;

      const main =
        byId("appMain");

      clearElement(main);

      main.appendChild(
        createElement(
          "div",
          {
            className: "skeleton"
          }
        )
      );

      try {
        const content =
          await definition.renderer(
            location.params
          );

        clearElement(main);

        if (
          content instanceof Node
        ) {
          main.appendChild(
            content
          );
        }

        main.focus({
          preventScroll: true
        });

        window.scrollTo({
          top: 0,
          behavior: "auto"
        });
      } catch (error) {
        console.error(error);

        clearElement(main);

        const page =
          createElement(
            "section",
            {
              className: "page"
            }
          );

        page.appendChild(
          createPageHeader(
            "載入失敗",
            "無法顯示此頁面"
          )
        );

        page.appendChild(
          createNotice(
            error.message ||
            "系統發生錯誤，請稍後再試。",
            "danger"
          )
        );

        page.appendChild(
          createButton(
            "重新載入",
            {
              onClick:
                renderCurrentRoute
            }
          )
        );

        main.appendChild(page);
      }

      refreshNavigation();
    }


    function addPageCleanup(
      handler
    ) {
      if (
        typeof handler ===
        "function"
      ) {
        APP.cleanupHandlers.add(
          handler
        );
      }
    }


    function cleanupPageResources() {
      APP.cleanupHandlers.forEach(
        handler => {
          try {
            handler();
          } catch (error) {
            console.warn(error);
          }
        }
      );

      APP.cleanupHandlers.clear();

      APP.objectUrls.forEach(
        url => {
          try {
            URL.revokeObjectURL(
              url
            );
          } catch (error) {
            console.warn(error);
          }
        }
      );

      APP.objectUrls.clear();

      if (
        "speechSynthesis" in
        window
      ) {
        window.speechSynthesis
          .cancel();
      }
    }

    function openDrawer() {
      const drawer =
        byId("appDrawer");

      const backdrop =
        byId("drawerBackdrop");

      const menuButton =
        byId("menuButton");

      drawer.classList.add(
        "open"
      );

      backdrop.classList.add(
        "open"
      );

      drawer.setAttribute(
        "aria-hidden",
        "false"
      );

      backdrop.setAttribute(
        "aria-hidden",
        "false"
      );

      menuButton.setAttribute(
        "aria-expanded",
        "true"
      );

      document.body.style.overflow =
        "hidden";

      const firstButton =
        drawer.querySelector(
          "button"
        );

      if (firstButton) {
        firstButton.focus();
      }
    }


    function closeDrawer() {
      const drawer =
        byId("appDrawer");

      const backdrop =
        byId("drawerBackdrop");

      const menuButton =
        byId("menuButton");

      if (
        !drawer ||
        !backdrop ||
        !menuButton
      ) {
        return;
      }

      drawer.classList.remove(
        "open"
      );

      backdrop.classList.remove(
        "open"
      );

      drawer.setAttribute(
        "aria-hidden",
        "true"
      );

      backdrop.setAttribute(
        "aria-hidden",
        "true"
      );

      menuButton.setAttribute(
        "aria-expanded",
        "false"
      );

      if (
        !byId("modalBackdrop")
          .classList.contains("open")
      ) {
        document.body.style.overflow =
          "";
      }
    }

    async function loadAnnouncementsInto(
      container,
      options = {}
    ) {
      clearElement(container);

      container.appendChild(
        createElement(
          "div",
          {
            className: "skeleton"
          }
        )
      );

      try {
        const result =
          await api(
            "announcement.list",
            {
              keyword:
                options.keyword ||
                "",

              category:
                options.category ||
                "",

              limit:
                options.limit ||
                50
            }
          );

        if (!result.success) {
          throw new Error(
            result.message ||
            "公告載入失敗"
          );
        }

        const items =
          Array.isArray(
            result.items
          )
            ? result.items
            : [];

        clearElement(container);

        if (!items.length) {
          container.appendChild(
            createEmptyState(
              "目前沒有符合條件的公告"
            )
          );

          return;
        }

        items.forEach(item => {
          container.appendChild(
            createAnnouncementCard(
              item
            )
          );
        });
      } catch (error) {
        clearElement(container);

        container.appendChild(
          createNotice(
            error.message ||
            "公告載入失敗",
            "danger"
          )
        );

        if (!options.silent) {
          showToast(
            error.message ||
            "公告載入失敗",
            "error"
          );
        }
      }
    }

    function base64ToBlob(
      base64,
      mimeType
    ) {
      const binary =
        window.atob(
          String(base64 || "")
        );

      const chunkSize = 8192;
      const chunks = [];

      for (
        let offset = 0;
        offset < binary.length;
        offset += chunkSize
      ) {
        const slice =
          binary.slice(
            offset,
            offset + chunkSize
          );

        const bytes =
          new Uint8Array(
            slice.length
          );

        for (
          let index = 0;
          index < slice.length;
          index++
        ) {
          bytes[index] =
            slice.charCodeAt(
              index
            );
        }

        chunks.push(bytes);
      }

      return new Blob(
        chunks,
        {
          type:
            mimeType ||
            "application/octet-stream"
        }
      );
    }


    function createTrackedObjectUrl(

    async function previewPrivateFile(
      fileId
    ) {
      if (!requireFinanceAdmin()) {
        return;
      }

      if (!fileId) {
        showToast(
          "找不到憑證檔案",
          "warning"
        );

        return;
      }

      showLoading(
        "正在讀取私密憑證"
      );

      try {
        const result =
          await api(
            "file.getPrivate",
            {
              fileId
            },
            {
              timeout: 45000
            }
          );

        if (
          !result.success ||
          !result.file
        ) {
          throw new Error(
            result.message ||
            "檔案讀取失敗"
          );
        }

        const blob =
          base64ToBlob(
            result.file.base64,
            result.file.mimeType
          );

        const url =
          createTrackedObjectUrl(
            blob
          );

        const popup =
          window.open(
            url,
            "_blank",
            "noopener,noreferrer"
          );

        if (!popup) {
          const content =
            createElement("div");

          content.appendChild(
            createNotice(
              "瀏覽器已阻擋新視窗，請按下方按鈕開啟檔案。",
              "warning"
            )
          );

          const link =
            createElement(
              "a",
              {
                className:
                  "button button-primary button-block",
                text:
                  "開啟 " +
                  safeText(
                    result.file.name
                  ),
                attrs: {
                  href: url,
                  target: "_blank",
                  rel:
                    "noopener noreferrer"
                }
              }
            );

          content.appendChild(
            link
          );

          openModal(
            "私密憑證",
            content
          );
        }
      } catch (error) {
        showToast(
          error.message ||
          "檔案讀取失敗",
          "error",
          6500
        );
      } finally {
        hideLoading();
      }
    }


    function openSafeHtmlDocument(
      html,
      title =
        "文件預覽"
    ) {
      /*
       * 後端產出的財務 HTML 必須先將所有動態值
       * 使用 escapeHtml() 處理。
       *
       * 此處使用 sandbox iframe，禁止文件內的腳本、
       * 表單、導覽及同源權限。
       */
      const wrapper =
        createElement("div");

      const iframe =
        createElement(
          "iframe",
          {
            attrs: {
              title: title,
              sandbox: "",
              referrerpolicy:
                "no-referrer"
            }
          }
        );

      iframe.style.width =
        "100%";

      iframe.style.minHeight =
        "70vh";

      iframe.style.border =
        "1px solid var(--border)";

      iframe.style.background =
        "#ffffff";

      iframe.srcdoc =
        String(html || "");

      wrapper.appendChild(
        iframe
      );

      const actions =
        createElement(
          "div",
          {
            className:
              "button-row mt-2 no-print"
          }
        );

      actions.appendChild(
        createButton(
          "列印文件",
          {
            className:
              "button-secondary",
            onClick: () => {
              try {
                iframe.contentWindow
                  .focus();

                iframe.contentWindow
                  .print();
              } catch (error) {
                showToast(
                  "瀏覽器無法直接列印此文件",
                  "warning"
                );
              }
            }
          }
        )
      );

      wrapper.appendChild(
        actions
      );

      openModal(
        title,
        wrapper
      );
    }

    function readFileAsPayload(
      file,
      options = {}
    ) {
      return new Promise(
        (resolve, reject) => {
          if (!file) {
            resolve(null);
            return;
          }

          const maxBytes =
            Number(
              options.maxBytes ||
              8 * 1024 * 1024
            );

          const allowedTypes =
            options.allowedTypes || [
              "image/jpeg",
              "image/png",
              "image/webp",
              "application/pdf"
            ];

          if (
            file.size >
            maxBytes
          ) {
            reject(
              new Error(
                "檔案不可超過 " +
                Math.ceil(
                  maxBytes /
                  1024 /
                  1024
                ) +
                " MB"
              )
            );

            return;
          }

          if (
            allowedTypes.length &&
            allowedTypes.indexOf(
              file.type
            ) === -1
          ) {
            reject(
              new Error(
                "不支援此檔案格式"
              )
            );

            return;
          }

          const reader =
            new FileReader();

          reader.onerror =
            () => {
              reject(
                new Error(
                  "檔案讀取失敗"
                )
              );
            };

          reader.onload =
            () => {
              const result =
                String(
                  reader.result || ""
                );

              const separatorIndex =
                result.indexOf(",");

              if (
                separatorIndex < 0
              ) {
                reject(
                  new Error(
                    "檔案內容格式不正確"
                  )
                );

                return;
              }

              resolve({
                name:
                  file.name ||
                  "upload",

                mimeType:
                  file.type ||
                  "application/octet-stream",

                base64:
                  result.substring(
                    separatorIndex + 1
                  )
              });
            };

          reader.readAsDataURL(
            file
          );
        }
      );
    }


    // ======================================================
    // 16. 無障礙顯示偏好
    // ======================================================

    function loadUiPreferences() {
      let preferences = {};

      try {
        preferences =
          JSON.parse(
            localStorage.getItem(
              CONFIG.UI_PREFERENCE_KEY
            ) || "{}"
          );
      } catch (error) {
        preferences = {};
      }

      document.body.classList.toggle(
        "large-text",
        Boolean(
          preferences.largeText
        )
      );

      document.body.classList.toggle(
        "high-contrast",
        Boolean(
          preferences.highContrast
        )
      );

      updatePreferenceButtons();
    }


    function saveUiPreferences() {
      localStorage.setItem(
        CONFIG.UI_PREFERENCE_KEY,
        JSON.stringify({
          largeText:
            document.body
              .classList
              .contains(
                "large-text"
              ),

          highContrast:
            document.body
              .classList
              .contains(
                "high-contrast"
              )
        })
      );

      updatePreferenceButtons();
    }


    function updatePreferenceButtons() {
      const fontButton =
        byId("fontSizeButton");

      const contrastButton =
        byId("contrastButton");

      if (fontButton) {
        const enabled =
          document.body
            .classList
            .contains(
              "large-text"
            );

        fontButton.setAttribute(
          "aria-pressed",
          String(enabled)
        );

        fontButton.textContent =
          enabled
            ? "標準字"
            : "大字";
      }

      if (contrastButton) {
        const enabled =
          document.body
            .classList
            .contains(
              "high-contrast"
            );

        contrastButton.setAttribute(
          "aria-pressed",
          String(enabled)
        );

        contrastButton.textContent =
          enabled
            ? "一般色"
            : "對比";
      }
    }


    function toggleLargeText() {
      document.body
        .classList
        .toggle(
          "large-text"
        );

      saveUiPreferences();

      showToast(
        document.body
          .classList
          .contains(
            "large-text"
          )
          ? "已開啟大字模式"
          : "已恢復標準字體",
        "success"
      );
    }


    function toggleHighContrast() {
      document.body
        .classList
        .toggle(
          "high-contrast"
        );

      saveUiPreferences();

      showToast(
        document.body
          .classList
          .contains(
            "high-contrast"
          )
          ? "已開啟高對比模式"
          : "已恢復一般色彩",
        "success"
      );
    }


    // ======================================================
    // 17. 鍵盤及全域事件
    // ======================================================

    function handleGlobalKeydown(
      event
    ) {
      if (
        event.key !== "Escape"
      ) {
        return;
      }

      if (
        byId("modalBackdrop")
          .classList.contains("open")
      ) {
        closeModal();
        return;
      }

      if (
        byId("appDrawer")
          .classList.contains("open")
      ) {
        closeDrawer();

        byId("menuButton")
          .focus();
      }
    }


    function bindCoreEvents() {
      byId("brandButton")
        .addEventListener(
          "click",
          () => {
            navigate("home");
          }
        );

      byId("menuButton")
        .addEventListener(
          "click",
          () => {
            const open =
              byId("appDrawer")
                .classList
                .contains(
                  "open"
                );

            if (open) {
              closeDrawer();
            } else {
              openDrawer();
            }
          }
        );

      byId("drawerCloseButton")
        .addEventListener(
          "click",
          closeDrawer
        );

      byId("drawerBackdrop")
        .addEventListener(
          "click",
          closeDrawer
        );

      byId("loginButton")
        .addEventListener(
          "click",
          () => {
            if (
              isAuthenticated()
            ) {
              openUserModal();
            } else {
              openLoginModal();
            }
          }
        );

      byId("fontSizeButton")
        .addEventListener(
          "click",
          toggleLargeText
        );

      byId("contrastButton")
        .addEventListener(
          "click",
          toggleHighContrast
        );

      byId("modalCloseButton")
        .addEventListener(
          "click",
          closeModal
        );

      byId("modalBackdrop")
        .addEventListener(
          "click",
          event => {
            if (
              event.target ===
              byId(
                "modalBackdrop"
              )
            ) {
              closeModal();
            }
          }
        );

      document.addEventListener(
        "keydown",
        handleGlobalKeydown
      );

      window.addEventListener(
        "hashchange",
        renderCurrentRoute
      );

      window.addEventListener(
        "beforeunload",
        cleanupPageResources
      );
    }


    // ======================================================
    // 18. 初始化
    // ======================================================

    function registerCoreRoutes() {
      registerRoute(
        "home",
        renderHomePage
      );

      registerRoute(
        "announcements",
        renderAnnouncementsPage
      );

      registerPlaceholderRoutes();
    }


    async function attemptAutomaticLineLogin() {
      if (
        isAuthenticated()
      ) {
        return false;
      }

      const ready =
        await initializeLiff();

      if (!ready) {
        return false;
      }

      if (
        !window.liff.isLoggedIn()
      ) {
        return false;
      }

      const idToken =
        window.liff.getIDToken();

      if (!idToken) {
        return false;
      }

      try {
        const result =
          await api(
            "auth.loginByLineToken",
            {
              idToken
            },
            {
              silentAuth: true,
              timeout: 15000
            }
          );

        if (
          result.success &&
          result.sessionToken &&
          result.member
        ) {
          saveSession(result);

          showToast(
            "已使用 LINE 安全登入",
            "success"
          );

          return true;
        }

        if (
          result.success &&
          result.requiresBinding &&
          result.lineBindingToken
        ) {
          openLineBindingModal(
            result.lineBindingToken
          );
        }

        return false;
      } catch (error) {
        console.warn(
          "LINE 自動登入失敗",
          error
        );

        return false;
      }
    }


    async function initializeApplication() {
      loadUiPreferences();
      loadStoredSession();

      registerCoreRoutes();
      bindCoreEvents();
      refreshNavigation();

      /*
       * 第 8 部分可在 DOMContentLoaded 前後覆寫
       * registerPart08Routes()，加入完整功能畫面。
       */
      if (
        typeof window
          .registerPart08Routes ===
        "function"
      ) {
        try {
          window
            .registerPart08Routes();
        } catch (error) {
          console.error(
            "第 8 部分路由註冊失敗",
            error
          );
        }
      }

      const route =
        routeFromLocation();

      if (
        !window.location.hash
      ) {
        navigate(
          "home",
          {},
          true
        );
      } else {
        await renderCurrentRoute();
      }

      /*
       * 優先驗證現有 Session；
       * 無 Session 時才嘗試使用 LIFF 自動登入。
       */
      if (APP.sessionToken) {
        await validateStoredSession();

        /*
         * Session 驗證後重新渲染，
         * 使權限及會員摘要保持最新。
         */
        await renderCurrentRoute();
      } else {
        const loggedIn =
          await attemptAutomaticLineLogin();

        if (loggedIn) {
          await renderCurrentRoute();
        }
      }
    }


    window.ParkinsonApp =
      Object.freeze({
        config: CONFIG,
        state: APP,

        api,
        navigate,
        registerRoute,
        registerExtensionNavItem,

        byId,
        createElement,
        clearElement,
        appendChildren,

        safeText,
        formatMoney,
        formatDate,
        formatDateTime,
        todayString,
        currentYear,

        createPageHeader,
        createButton,
        createEmptyState,
        createNotice,
        createBadge,
        createFormGroup,

        showToast,
        showLoading,
        hideLoading,

        openModal,
        closeModal,
        confirmDialog,

        isAuthenticated,
        isAdmin,
        isFinanceAdmin,
        requireLogin,
        requireAdmin,
        requireFinanceAdmin,

        saveSession,
        clearSession,
        refreshNavigation,

        addPageCleanup,
        cleanupPageResources,

        previewPrivateFile,
        previewReceipt,
        previewExpenseSlip,
        openSafeHtmlDocument,

        readFileAsPayload,
        base64ToBlob,
        createTrackedObjectUrl
      });


    document.addEventListener(
      "DOMContentLoaded",
      () => {
        initializeApplication()
          .catch(error => {
            console.error(
              "系統初始化失敗",
              error
            );

            const main =
              byId("appMain");

            clearElement(main);

            const page =
              createElement(
                "section",
                {
                  className:
                    "page"
                }
              );

            page.appendChild(
              createPageHeader(
                "系統無法啟動",
                "初始化過程發生錯誤"
              )
            );

            page.appendChild(
              createNotice(
                error.message ||
                "請重新整理頁面，或稍後再試。",
                "danger"
              )
            );

            page.appendChild(
              createButton(
                "重新整理",
                {
                  onClick: () => {
                    window.location
                      .reload();
                  }
                }
              )
            );

            main.appendChild(page);
          });
      }
    );
  </script>
</body>
