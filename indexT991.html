<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <title>台灣帕金森病友權益促進會</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #115e59;
      --background: #f8fafc;
      --text: #0f172a;
      --muted: #475569;
      --border: #cbd5e1;
      --danger: #991b1b;
      --success: #166534;
      --warning: #92400e;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 100%;
      margin: 0;
      padding-bottom:
        calc(88px + env(safe-area-inset-bottom));
      background: var(--background);
      color: var(--text);
      font:
        18px/1.65
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    .wrap {
      width: 100%;
      max-width: 820px;
      margin: auto;
      padding: 14px;
    }

    .hero,
    .card {
      margin-bottom: 16px;
      border-radius: 20px;
    }

    .hero {
      padding: 26px 18px;
      text-align: center;
      color: #fff;
      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--primary-dark)
        );
    }

    .hero h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.4;
    }

    .card {
      padding: 20px;
      border: 2px solid var(--border);
      background: #fff;
      box-shadow: 0 8px 25px #0000000c;
    }

    .title {
      margin-bottom: 14px;
      padding-left: 10px;
      border-left: 6px solid var(--primary);
      font-size: 24px;
      font-weight: 900;
    }

    .grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .btn {
      width: 100%;
      min-height: 58px;
      margin: 6px 0;
      padding: 10px 15px;
      border: 0;
      border-radius: 14px;
      background: #e2e8f0;
      color: var(--text);
      font-weight: 900;
      cursor: pointer;
      touch-action: manipulation;
    }

    .btn:hover {
      filter: brightness(0.98);
    }

    .btn:focus-visible,
    .fc:focus-visible,
    .nav button:focus-visible {
      outline: 4px solid #38bdf8;
      outline-offset: 2px;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-danger {
      background: #b91c1c;
      color: #fff;
    }

    .btn-line {
      background: #06c755;
      color: #fff;
    }

    .fc {
      width: 100%;
      min-height: 58px;
      margin: 5px 0 13px;
      padding: 10px 13px;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: #fff;
      color: var(--text);
    }

    textarea.fc {
      min-height: 120px;
      resize: vertical;
    }

    .label {
      display: block;
      font-weight: 900;
    }

    .item {
      margin: 10px 0;
      padding: 14px;
      border: 2px solid var(--border);
      border-radius: 14px;
      overflow-wrap: anywhere;
    }

    .muted {
      color: var(--muted);
      font-size: 15px;
    }

    .danger-text {
      color: var(--danger);
      font-weight: 800;
    }

    .success-text {
      color: var(--success);
      font-weight: 800;
    }

    .badge {
      display: inline-block;
      margin: 3px 0;
      padding: 2px 9px;
      border: 1px solid;
      border-radius: 99px;
      font-size: 14px;
      font-weight: 800;
    }

    .badge-success {
      color: var(--success);
      background: #f0fdf4;
    }

    .badge-warning {
      color: var(--warning);
      background: #fffbeb;
    }

    .badge-danger {
      color: var(--danger);
      background: #fef2f2;
    }

    .nav {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 10;
      display: flex;
      padding:
        8px
        max(8px, env(safe-area-inset-right))
        calc(8px + env(safe-area-inset-bottom))
        max(8px, env(safe-area-inset-left));
      border-top: 2px solid var(--border);
      background: #fff;
    }

    .nav button {
      flex: 1;
      min-width: 0;
      min-height: 56px;
      padding: 5px;
      border: 0;
      background: #fff;
      color: var(--primary);
      font-weight: 900;
      cursor: pointer;
    }

    .modal,
    .loader {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 30;
    }

    .modal.show,
    .loader.show {
      display: flex;
    }

    .modal {
      align-items: center;
      justify-content: center;
      padding: 12px;
      background: #0f172aaa;
    }

    .modal-box {
      width: 100%;
      max-width: 580px;
      max-height: 90vh;
      padding: 20px;
      overflow: auto;
      border-radius: 18px;
      background: #fff;
      overscroll-behavior: contain;
    }

    .loader {
      z-index: 50;
      align-items: center;
      justify-content: center;
      background: #ffffffdd;
      font-weight: 900;
    }

    .toast {
      display: none;
      position: fixed;
      bottom:
        calc(
          95px +
          env(safe-area-inset-bottom)
        );
      left: 50%;
      z-index: 60;
      max-width: 90%;
      padding: 12px 20px;
      transform: translateX(-50%);
      border-radius: 99px;
      background: #0f172a;
      color: #fff;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .toast.show {
      display: block;
    }

    @media (max-width: 560px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .hero h1 {
        font-size: 24px;
      }

      .card {
        padding: 16px;
      }

      .nav button {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>
  <main
    id="main"
    class="wrap"
  ></main>

  <nav
    class="nav"
    aria-label="主要導覽"
  >
    <button
      type="button"
      onclick="go('home')"
    >
      🏠 首頁
    </button>

    <button
      type="button"
      onclick="go('health')"
    >
      ♿ 健康
    </button>

    <button
      type="button"
      onclick="go('forum')"
    >
      🍵 交流
    </button>

    <button
      type="button"
      id="authBtn"
      onclick="openLogin()"
    >
      🔑 登入
    </button>
  </nav>

  <div
    id="modal"
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-label="操作視窗"
    onclick="
      if (event.target === this) {
        closeModal();
      }
    "
  >
    <div
      id="modalBox"
      class="modal-box"
    ></div>
  </div>

  <div
    id="loader"
    class="loader"
    aria-live="polite"
  >
    資料處理中……
  </div>

  <div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
  ></div>

  <script>
    "use strict";

    // =====================================================
    // 部署設定
    // =====================================================

    const API_BASE =
      "https://script.google.com/macros/s/AKfycbznpzdBMD3FQwXR4EXcT43SSFZ5zwvP57GbMgfGv5CiVg5iiNdomf5sTXcM6Tx5aXUA/exec";

    const LIFF_ID =
      "2009456572-588gzru4";

    const STATE = {
      user: null,

      token:
        localStorage.getItem(
          "tpdaToken"
        ) || "",

      liffReady: false,
      lineProfile: null,

      /*
       * 防止 Session 失效時，
       * 同一頁面重複進行狀態清除。
       */
      sessionExpiredHandled: false
    };

    let toastTimer = 0;
    let loaderCount = 0;

    // =====================================================
    // 共用工具
    // =====================================================

    function $(id) {
      return document.getElementById(id);
    }

    function escapeHtml(value) {
      return String(
        value == null ? "" : value
      ).replace(
        /[&<>"']/g,
        character => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        })[character]
      );
    }

    function escapeAttribute(value) {
      return escapeHtml(value);
    }

    function showToast(message) {
      const element = $("toast");

      if (!element) return;

      window.clearTimeout(toastTimer);

      element.textContent =
        String(message || "操作失敗");

      element.classList.add("show");

      toastTimer = window.setTimeout(
        () => {
          element.classList.remove(
            "show"
          );
        },
        3500
      );
    }

    function showLoader(show) {
      if (show) {
        loaderCount++;
      } else {
        loaderCount = Math.max(
          0,
          loaderCount - 1
        );
      }

      const element = $("loader");

      if (element) {
        element.classList.toggle(
          "show",
          loaderCount > 0
        );
      }
    }

    function openModal(html) {
      const box = $("modalBox");
      const modal = $("modal");

      if (!box || !modal) return;

      box.innerHTML = html;
      modal.classList.add("show");

      document.body.style.overflow =
        "hidden";
    }

    function closeModal() {
      const modal = $("modal");

      if (modal) {
        modal.classList.remove("show");
      }

      document.body.style.overflow = "";
    }

    function today() {
      return new Date().toLocaleDateString(
        "sv-SE",
        {
          timeZone: "Asia/Taipei"
        }
      );
    }

    function currentYear() {
      return new Date().toLocaleDateString(
        "zh-TW",
        {
          timeZone: "Asia/Taipei",
          year: "numeric"
        }
      ).replace(/\D/g, "");
    }

    function formatMoney(value) {
      const amount = Number(value || 0);

      return (
        "NT$" +
        (
          Number.isFinite(amount)
            ? amount
            : 0
        ).toLocaleString("zh-TW")
      );
    }

    function normalizePhone(value) {
      let phone = String(
        value == null ? "" : value
      ).trim();

      phone = phone
        .replace(/^'+/, "")
        .replace(/[\s\-()]/g, "")
        .replace(/^\+886/, "0")
        .replace(/^886/, "0")
        .replace(/\D/g, "");

      if (/^9\d{8}$/.test(phone)) {
        phone = "0" + phone;
      }

      return phone;
    }

    function statusBadgeClass(status) {
      if (
        status === "已確認" ||
        status === "有效會員"
      ) {
        return "badge-success";
      }

      if (
        status === "已退回" ||
        status === "停權" ||
        status === "失效"
      ) {
        return "badge-danger";
      }

      return "badge-warning";
    }

    function safeItems(result) {
      return Array.isArray(
        result?.items
      )
        ? result.items
        : [];
    }

    // =====================================================
    // 本機 Session
    // =====================================================

    function clearLocalSession() {
      STATE.token = "";
      STATE.user = null;
      STATE.sessionExpiredHandled = true;

      localStorage.removeItem(
        "tpdaToken"
      );

      const authButton =
        $("authBtn");

      if (authButton) {
        authButton.textContent =
          "🔑 登入";

        authButton.onclick =
          openLogin;
      }
    }

    function setUser(
      user,
      token = ""
    ) {
      STATE.user = user || null;
      STATE.sessionExpiredHandled = false;

      if (token) {
        STATE.token = token;

        localStorage.setItem(
          "tpdaToken",
          token
        );
      }

      const authButton =
        $("authBtn");

      if (!authButton) return;

      if (STATE.user) {
        authButton.textContent =
          "🚪 登出";

        authButton.onclick =
          () => logout();
      } else {
        authButton.textContent =
          "🔑 登入";

        authButton.onclick =
          openLogin;
      }
    }

    // =====================================================
    // API
    // =====================================================

    async function api(
      action,
      data = {}
    ) {
      const controller =
        new AbortController();

      const timer =
        window.setTimeout(
          () => controller.abort(),
          30000
        );

      try {
        const response =
          await fetch(API_BASE, {
            method: "POST",

            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

            body: JSON.stringify({
              action,

              data: {
                ...data,

                sessionToken:
                  STATE.token
              }
            }),

            signal:
              controller.signal
          });

        const responseText =
          await response.text();

        let result;

        try {
          result =
            JSON.parse(responseText);
        } catch (error) {
          throw new Error(
            "伺服器未回傳有效 JSON。" +
            "HTTP " +
            response.status +
            "，內容：" +
            responseText.slice(0, 200)
          );
        }

        if (!response.ok) {
          throw new Error(
            result.message ||
            (
              "HTTP 錯誤：" +
              response.status
            )
          );
        }

        if (
          result.code ===
          "SESSION_EXPIRED"
        ) {
          const shouldNotify =
            !STATE.sessionExpiredHandled;

          clearLocalSession();

          if (shouldNotify) {
            showToast(
              "登入狀態已失效，請重新登入"
            );
          }
        }

        return result;
      } finally {
        window.clearTimeout(timer);
      }
    }

    async function runApi(
      action,
      data = {}
    ) {
      showLoader(true);

      try {
        const result =
          await api(action, data);

        if (
          !result ||
          !result.success
        ) {
          throw new Error(
            result?.message ||
            "操作失敗"
          );
        }

        return result;
      } catch (error) {
        console.error(
          "API 執行失敗：",
          action,
          error
        );

        showToast(
          error.name === "AbortError"
            ? "連線逾時，請稍後重試"
            : error.message ||
              "連線失敗"
        );

        return null;
      } finally {
        showLoader(false);
      }
    }

    // =====================================================
    // 初始化及 LIFF
    // =====================================================

    async function initializeApp() {
      try {
        if (
          typeof liff !== "undefined" &&
          LIFF_ID &&
          !LIFF_ID.startsWith(
            "請填入"
          )
        ) {
          await liff.init({
            liffId: LIFF_ID
          });

          STATE.liffReady = true;

          if (liff.isLoggedIn()) {
            try {
              STATE.lineProfile =
                await liff.getProfile();
            } catch (error) {
              console.warn(
                "無法取得 LINE 個人資料",
                error
              );
            }
          }
        }
      } catch (error) {
        console.error(
          "LIFF 初始化失敗",
          error
        );
      }

      if (STATE.token) {
        try {
          const result =
            await api("auth.me");

          if (result?.success) {
            setUser(result.user);
          } else if (
            result?.code !==
            "SESSION_EXPIRED"
          ) {
            console.warn(
              "登入狀態檢查失敗",
              result
            );
          }
        } catch (error) {
          /*
           * 如果只是網路暫時失敗，
           * 不刪除現有 Token。
           */
          console.error(
            "登入狀態檢查失敗",
            error
          );
        }
      }

      go("home");
    }

    function go(page) {
      if (
        page !== "home" &&
        !STATE.user
      ) {
        openLogin();
        return;
      }

      const routes = {
        home: renderHome,
        health: renderHealth,
        forum: renderForum,
        admin: renderAdmin
      };

      const renderer =
        routes[page] ||
        renderHome;

      renderer();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    // =====================================================
    // 首頁
    // =====================================================

    function renderHome() {
      const user = STATE.user;

      $("main").innerHTML = `
        <div class="hero">
          <h1>
            社團法人台灣帕金森病友權益促進會
          </h1>

          <div>
            陪伴病友・守護權益・共創希望
          </div>
        </div>

        ${
          user
            ? `
              <div class="card">
                <div class="title">
                  您好，${escapeHtml(user.name)}
                </div>

                <div>
                  會員編號：
                  ${escapeHtml(user.memberId)}

                  <span class="badge ${
                    statusBadgeClass(
                      user.status
                    )
                  }">
                    ${escapeHtml(user.status)}
                  </span>
                </div>

                <div class="grid">
                  <button
                    class="btn btn-primary"
                    type="button"
                    onclick="renderPayments()"
                  >
                    💳 會費
                  </button>

                  <button
                    class="btn btn-primary"
                    type="button"
                    onclick="renderDonations()"
                  >
                    ❤️ 捐款
                  </button>

                  <button
                    class="btn"
                    type="button"
                    onclick="openProfile()"
                  >
                    👤 個人資料
                  </button>

                  ${
                    user.permissions?.includes(
                      "ADMIN_HOME"
                    )
                      ? `
                        <button
                          class="btn btn-danger"
                          type="button"
                          onclick="go('admin')"
                        >
                          ⚙️ 管理後台
                        </button>
                      `
                      : ""
                  }
                </div>
              </div>
            `
            : `
              <div class="card">
                <div class="title">
                  會員登入
                </div>

                <button
                  class="btn btn-primary"
                  type="button"
                  onclick="openLogin()"
                >
                  姓名、手機與密碼登入
                </button>

                <button
                  class="btn btn-line"
                  type="button"
                  onclick="lineLogin()"
                >
                  LINE 快速登入
                </button>
              </div>
            `
        }

        <div class="card">
          <div class="title">
            隱私與安全提醒
          </div>

          <p>
            本平台健康資料僅供自主紀錄，
            不作為醫療診斷。
            請勿在論壇公開身分證、電話、
            地址及完整病歷。
          </p>
        </div>
      `;
    }

    // =====================================================
    // 登入及登出
    // =====================================================

    function openLogin() {
      openModal(`
        <div class="title">
          會員登入
        </div>

        <label
          class="label"
          for="loginName"
        >
          姓名
        </label>

        <input
          id="loginName"
          class="fc"
          autocomplete="name"
          maxlength="60"
        >

        <label
          class="label"
          for="loginPhone"
        >
          手機
        </label>

        <input
          id="loginPhone"
          class="fc"
          inputmode="tel"
          autocomplete="tel"
          maxlength="20"
          placeholder="09 開頭共 10 碼"
        >

        <label
          class="label"
          for="loginPassword"
        >
          密碼
        </label>

        <input
          id="loginPassword"
          class="fc"
          type="password"
          autocomplete="current-password"
          maxlength="128"
        >

        <label
          class="label"
          for="loginPasswordConfirm"
        >
          確認密碼

          <span class="muted">
            （僅首次設定需要）
          </span>
        </label>

        <input
          id="loginPasswordConfirm"
          class="fc"
          type="password"
          autocomplete="new-password"
          maxlength="128"
          placeholder="首次設定時再輸入一次密碼"
        >

        <button
          class="btn btn-primary"
          type="button"
          onclick="login()"
        >
          登入
        </button>

        <button
          class="btn"
          type="button"
          onclick="setupPassword()"
        >
          首次登入／設定密碼
        </button>

        <button
          class="btn btn-line"
          type="button"
          onclick="lineLogin()"
        >
          LINE 登入
        </button>

        <button
          class="btn"
          type="button"
          onclick="closeModal()"
        >
          取消
        </button>
      `);

      window.setTimeout(
        () => {
          $("loginName")?.focus();
        },
        50
      );
    }

    async function login() {
      const name =
        $("loginName").value.trim();

      const phone =
        $("loginPhone").value.trim();

      const password =
        $("loginPassword").value;

      if (!name) {
        showToast("請輸入姓名");
        return;
      }

      if (!phone) {
        showToast("請輸入手機號碼");
        return;
      }

      if (!password) {
        showToast("請輸入密碼");
        return;
      }

      const result =
        await runApi(
          "auth.login",
          {
            name,
            phone,
            password
          }
        );

      if (!result) return;

      setUser(
        result.user,
        result.sessionToken
      );

      closeModal();
      renderHome();
      showToast("登入成功");
    }

    async function setupPassword() {
      const name =
        $("loginName").value.trim();

      const phone =
        normalizePhone(
          $("loginPhone").value
        );

      const password =
        $("loginPassword").value;

      const passwordConfirm =
        $("loginPasswordConfirm").value;

      if (!name) {
        showToast("請輸入姓名");
        return;
      }

      if (!/^09\d{8}$/.test(phone)) {
        showToast(
          "手機格式不正確，請輸入 09 開頭共 10 碼"
        );

        return;
      }

      if (password.length < 10) {
        showToast(
          "密碼至少需要 10 個字元"
        );

        return;
      }

      if (password.length > 128) {
        showToast(
          "密碼不可超過 128 個字元"
        );

        return;
      }

      if (
        password !==
        passwordConfirm
      ) {
        showToast(
          "兩次輸入的密碼不一致"
        );

        return;
      }

      const result =
        await runApi(
          "auth.setupPassword",
          {
            name,
            phone,
            password,
            passwordConfirm
          }
        );

      if (!result) return;

      setUser(
        result.user,
        result.sessionToken
      );

      closeModal();
      renderHome();

      showToast(
        "密碼設定完成"
      );
    }

    async function logout(
      ask = true
    ) {
      if (
        ask &&
        !window.confirm("確定登出？")
      ) {
        return;
      }

      const token = STATE.token;

      /*
       * 先清除本機狀態，
       * 避免過期 Session 形成重複呼叫。
       */
      clearLocalSession();
      closeModal();
      renderHome();

      if (!token) return;

      try {
        await fetch(API_BASE, {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body: JSON.stringify({
            action: "auth.logout",

            data: {
              sessionToken: token
            }
          })
        });
      } catch (error) {
        console.warn(
          "伺服器 Session 撤銷失敗，" +
          "但本機已完成登出",
          error
        );
      }
    }

        !["payment", "donation"]
          .includes(kind)
      ) {
        return;
      }

      const result =
        await runApi(
          `${kind}.pendingList`
        );

      const area =
        $("adminArea");

      if (!area || !result) return;

      const items =
        safeItems(result);

      area.innerHTML = `
        <div class="title">
          ${
            kind === "payment"
              ? "會費"
              : "捐款"
          }
          待審核
        </div>

        ${
          items.length
            ? items.map(item => `
                <div class="item">
                  <strong>
                    ${
                      escapeHtml(
                        item.name
                      )
                    }　
                    ${
                      formatMoney(
                        item.amount
                      )
                    }
                  </strong>

                  <div>
                    ${
                      escapeHtml(
                        item.date
                      )
                    }｜
                    ${
                      escapeHtml(
                        item.method ||
                        item.purpose
                      )
                    }
                  </div>

                  ${
                    item.identityMasked
                      ? `
                        <div>
                          身分證／統編：
                          ${
                            escapeHtml(
                              item
                                .identityMasked
                            )
                          }
                        </div>
                      `
                      : ""
                  }

                  <button
                    class="btn btn-primary"
                    type="button"
                    data-kind="${
                      escapeAttribute(kind)
                    }"
                    data-id="${
                      escapeAttribute(
                        item.id
                      )
                    }"
                    onclick="
                      confirmItem(
                        this.dataset.kind,
                        this.dataset.id
                      )
                    "
                  >
                    確認款項入帳
                  </button>

                  <button
                    class="btn btn-danger"
                    type="button"
                    data-kind="${
                      escapeAttribute(kind)
                    }"
                    data-id="${
                      escapeAttribute(
                        item.id
                      )
                    }"
                    onclick="
                      rejectItem(
                        this.dataset.kind,
                        this.dataset.id
                      )
                    "
                  >
                    退回
                  </button>
                </div>
              `).join("")
            : "目前沒有待審核資料"
        }
      `;
    }

    async function confirmItem(
      kind,
      id
    ) {
      if (
        !window.confirm(
          "確認款項已實際入帳？"
        )
      ) {
        return;
      }

      const result =
        await runApi(
          `${kind}.confirm`,
          { id }
        );

      if (result) {
        showToast(
          "已入帳並建立收據及傳票"
        );

        loadPending(kind);
      }
    }

    async function rejectItem(
      kind,
      id
    ) {
      const reason =
        window.prompt(
          "請輸入退回原因"
        );

      if (!reason?.trim()) return;

      const result =
        await runApi(
          `${kind}.reject`,
          {
            id,
            reason:
              reason.trim()
          }
        );

      if (result) {
        showToast("已退回");
        loadPending(kind);
      }
    }

    async function loadMembers() {
      const result =
        await runApi(
          "member.list"
        );

      const area =
        $("adminArea");

      if (!area || !result) return;

      const items =
        safeItems(result);

      area.innerHTML = `
        <div class="title">
          會員名冊
        </div>

        ${
          items.length
            ? items.map(item => `
                <div class="item">
                  <strong>
                    ${
                      escapeHtml(
                        item.name
                      )
                    }
                    （${
                      escapeHtml(
                        item.memberId
                      )
                    }）
                  </strong>

                  <div>
                    ${
                      escapeHtml(
                        item.phone
                      )
                    }｜
                    ${
                      escapeHtml(
                        item.type
                      )
                    }｜
                    ${
                      escapeHtml(
                        item.status
                      )
                    }
                  </div>
                </div>
              `).join("")
            : "目前沒有會員資料"
        }
      `;
    }

    async function loadAuditLogs() {
      const result =
        await runApi(
          "audit.list"
        );

      const area =
        $("adminArea");

      if (!area || !result) return;

      const items =
        safeItems(result);

      area.innerHTML = `
        <div class="title">
          最近稽核紀錄
        </div>

        ${
          items.length
            ? items.map(item => `
                <div class="item">
                  <strong>
                    ${
                      escapeHtml(
                        item.action
                      )
                    }
                  </strong>

                  <div class="muted">
                    ${
                      escapeHtml(
                        item.time
                      )
                    }｜
                    ${
                      escapeHtml(
                        item.actorName
                      )
                    }
                  </div>

                  <div>
                    ${
                      escapeHtml(
                        item.detail
                      )
                    }
                  </div>
                </div>
              `).join("")
            : "目前沒有稽核紀錄"
        }
      `;
    }

    // =====================================================
    // 全域錯誤診斷
    // =====================================================

    window.addEventListener(
      "error",
      event => {
        const source =
          String(
            event.filename || ""
          );

        if (
          source.startsWith(
            "chrome-extension://"
          )
        ) {
          console.warn(
            "瀏覽器擴充功能錯誤：",
            event.message
          );

          return;
        }

        console.error(
          "前端程式錯誤：",
          {
            message:
              event.message,

            source,

            line:
              event.lineno,

            column:
              event.colno,

            error:
              event.error
          }
        );
      }
    );

    window.addEventListener(
      "unhandledrejection",
      event => {
        const message =
          String(
            event.reason?.message ||
            event.reason ||
            ""
          );

        /*
         * Chrome 擴充功能訊息通道錯誤，
         * 不屬於本系統 API 錯誤。
         */
        if (
          message.includes(
            "message channel closed"
          ) ||
          message.includes(
            "asynchronous response"
          )
        ) {
          console.warn(
            "瀏覽器擴充功能通道錯誤：",
            message
          );

          event.preventDefault();
          return;
        }

        console.error(
          "未處理的非同步錯誤：",
          event.reason
        );
      }
    );

    // =====================================================
    // 啟動
    // =====================================================

    initializeApp();
  </script>
</body>
</html>
