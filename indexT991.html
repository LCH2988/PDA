<script>
// =======================================================
// 基礎工具與 UI 核心控制函式
// =======================================================
function $(id){
return document.getElementById(id);
}

function setMain(html) {
const main = $('main');
if (main) {
  main.innerHTML = html;
  window.scrollTo({ top: 0, behavior: 'smooth' });
  main.focus();
}
}

function showBack(show) {
const btn = $('navBack');
if (!btn) return;
if (show) {
  btn.classList.remove('disabled');
} else {
  btn.classList.add('disabled');
}
}

function toast(msg, type = 'info') {
const t = $('toast');
if (!t) return;
t.className = 'toast show ' + (type === 's' ? 's' : type === 'e' ? 'e' : type === 'w' ? 'w' : '');
t.textContent = msg;
setTimeout(() => {
  t.className = 'toast';
}, 3500);
}

function showLoad() {
const loader = $('loader');
if (loader) loader.classList.add('show');
}

function hideLoad() {
const loader = $('loader');
if (loader) loader.classList.remove('show');
}

function openModal(html) {
const mask = $('modalMask');
const modal = $('modal');
if (!mask || !modal) return;
modal.innerHTML = '<div class="modal-handle"></div>' + html;
mask.classList.add('show');
}

function closeModal() {
const mask = $('modalMask');
if (mask) mask.classList.remove('show');
}

function maskClose(e) {
if (e.target.id === 'modalMask') {
  closeModal();
}
}

function esc(s){
return String(s==null?'':s)
  .replace(/&/g,'&amp;')
  .replace(/</g,'&lt;')
  .replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;')
  .replace(/'/g,'&#39;');
}

function fmtMoney(n){
const val=Math.round(Number(n||0));
if(val<0)return'-NT$'+Math.abs(val).toLocaleString('zh-TW');
return 'NT$'+val.toLocaleString('zh-TW');
}

function fmtDate(d){
if(!d)return'--';
try{
  const dt=new Date(d);
  if(isNaN(dt.getTime()))return String(d);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}catch(e){
  return String(d);
}
}

function today(){
const d=new Date();
return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function yearOptions(sel){
const y=new Date().getFullYear();
const s=Number(sel||y);
return [y+1,y,y-1,y-2].map(v=>{
  return `<option value="${v}"${v===s?' selected':''}>${v} 年</option>`;
}).join('');
}

function monthOptions(sel){
const s=sel?Number(sel):'';
return `<option value="">全年</option>${
  Array.from({length:12}).map((_,i)=>{
    const v=i+1;
    return `<option value="${v}"${v===s?' selected':''}>${v} 月</option>`;
  }).join('')
}`;
}

// =======================================================
// 年長者輔助 UI
// =======================================================
const ElderUI = {
settings: {
  largeText: localStorage.getItem('elder_largeText') === 'Y',
  highContrast: localStorage.getItem('elder_highContrast') === 'Y',
  reduceMotion: localStorage.getItem('elder_reduceMotion') === 'Y',
  voiceHint: localStorage.getItem('elder_voiceHint') === 'Y'
},
init() { this.apply(); },
toggleLargeText() {
  this.settings.largeText = !this.settings.largeText;
  localStorage.setItem('elder_largeText', this.settings.largeText ? 'Y' : 'N');
  this.apply();
  this.speak(this.settings.largeText ? '已開啟大字模式' : '已關閉大字模式');
},
toggleHighContrast() {
  this.settings.highContrast = !this.settings.highContrast;
  localStorage.setItem('elder_highContrast', this.settings.highContrast ? 'Y' : 'N');
  this.apply();
  this.speak(this.settings.highContrast ? '已開啟高對比模式' : '已關閉高對比模式');
},
toggleReduceMotion() {
  this.settings.reduceMotion = !this.settings.reduceMotion;
  localStorage.setItem('elder_reduceMotion', this.settings.reduceMotion ? 'Y' : 'N');
  this.apply();
  this.speak(this.settings.reduceMotion ? '已減少動畫效果' : '已恢復動畫效果');
},
toggleVoiceHint() {
  this.settings.voiceHint = !this.settings.voiceHint;
  localStorage.setItem('elder_voiceHint', this.settings.voiceHint ? 'Y' : 'N');
  this.apply();
  this.speak(this.settings.voiceHint ? '已開啟語音提示' : '已關閉語音提示');
},
apply() {
  document.body.classList.toggle('elder-large-text', this.settings.largeText);
  document.body.classList.toggle('elder-high-contrast', this.settings.highContrast);
  document.body.classList.toggle('elder-reduce-motion', this.settings.reduceMotion);
},
speak(text) {
  if (!this.settings.voiceHint || !('speechSynthesis' in window)) return;
  try {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'zh-TW';
    utterance.rate = 0.85;
    window.speechSynthesis.speak(utterance);
  } catch (e) {}
}
};

// API 核心
// =======================================================
const ACTION_ALIAS = {
'auth.login': 'auth.loginByPhone',
'auth.lineLogin': 'auth.loginByLine',
'member.register': 'auth.registerByPhone',
'member.list': 'member.listAll',
'member.detail': 'member.getDetail'
};

function getSessionToken() {
return localStorage.getItem('parkSessionToken') || '';
}

async function api(action, data = {}) {
action = ACTION_ALIAS[action] || action;
let lineAccessToken = '';
try {
  if (APP.liffReady && typeof liff !== 'undefined' && liff.isLoggedIn()) {
    lineAccessToken = liff.getAccessToken() || '';
  }
} catch(e) {}

const payload = {
  action,
  data: {
    ...data,
    operatorLineId: APP.user?.lineId || APP.liffProfile?.userId || '',
    operator: APP.user?.name || '',
    operatorId: APP.user?.memberId || '',
    sessionToken: getSessionToken(),
    lineAccessToken
  }
};

const res = await fetch(API_BASE, {
  method: 'POST',
  headers: { 'Content-Type': 'text/plain;charset=utf-8' },
  body: JSON.stringify(payload)
});

const text = await res.text();
if (!res.ok) throw new Error('API 錯誤 ' + res.status + '：' + text.substring(0, 120));
try {
  return JSON.parse(text);
} catch(e) {
  throw new Error('API 回傳不是 JSON：' + text.substring(0, 120));
}
}

async function runApi(action, data = {}, onSuccess) {
showLoad();
try {
  const res = await api(action, data);
  hideLoad();
  if (res.success) {
    if (onSuccess) onSuccess(res);
  } else {
    toast(res.message || '操作失敗', 'e');
  }
  return res;
} catch(e) {
  hideLoad();
  toast('連線失敗：' + e.message, 'e');
  return { success: false, message: e.message };
}
}

async function getFileData(fileInputId){
const input = document.getElementById(fileInputId);
if(!input||!input.files||input.files.length===0) return null;
const file = input.files[0];
return new Promise((resolve)=>{
  const reader = new FileReader();
  reader.onload = function(e){
    resolve({
      base64: e.target.result.split(',')[1],
      filename: file.name,
      mimeType: file.type
    });
  };
  reader.readAsDataURL(file);
});
}

function updateNavActive(page) {
document.querySelectorAll('.nitem').forEach(el => el.classList.remove('active'));
if(page === 'home') {
  $('navHome')?.classList.add('active');
} else if(isAdminUser(APP.user)) {
  $('navAdmin')?.classList.remove('hide');
  $('navAdmin')?.classList.add('active');
}
}

function go(page, params = {}, push = true){
if(push && APP.page && APP.page !== page){
  APP.history.push({ page: APP.page, params: APP._params || {} });
}
APP.page = page;
APP._params = params || {};

updateNavActive(page);
showBack(APP.history.length > 0);

const fn = ROUTES[page] || ROUTES['home'];
fn(params || {});
}

function goBack(){
if(!APP.history.length) return;
const prev = APP.history.pop();
APP.page = prev.page;
APP._params = prev.params || {};

updateNavActive(prev.page);
showBack(APP.history.length > 0);

const fn = ROUTES[prev.page] || ROUTES['home'];
fn(prev.params || {});
}

// 節拍器實作
let audioCtx = null;
function getAudioContext() {
if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
return audioCtx;
}

function playBeep(high = false) {
try {
  const ctx = getAudioContext();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.value = high ? 880 : 440;
  gain.gain.setValueAtTime(0.3, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + 0.08);
} catch(e) {}
}

function openMetronomeModal() {
openModal(`
  <div class="modal-title">🎵 解凍跨步節拍器</div>
  <div class="notice info">發生步伐凍結時，跟隨規律節拍聲踏出步伐，有助於突破僵硬卡頓。</div>
  <div style="text-align:center;padding:16px 0;">
    <div id="metroBeatVisual" style="width:70px;height:70px;border-radius:50%;background:var(--primary);margin:0 auto 16px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:900;">1</div>
    <div style="font-size:var(--fs-xxl);font-weight:950;margin-bottom:8px;"><span id="bpmDisplay">${bpm}</span> <span style="font-size:var(--fs-sm);color:var(--muted);">BPM</span></div>
    <div style="display:flex;align-items:center;justify-content:center;gap:16px;">
      <button class="btn btn-sm btn-outline" onclick="changeBpm(-5)">- 5</button>
      <button class="btn btn-sm btn-outline" onclick="changeBpm(5)">+ 5</button>
    </div>
  </div>
  <button id="metroToggleBtn" class="btn btn-primary" onclick="toggleMetronome()">${metronomeActive ? '⏹️ 停止節拍器' : '▶️ 啟動節拍器'}</button>
  <button class="btn btn-ghost" onclick="stopMetronome();closeModal();">關閉</button>
`);
}

function changeBpm(delta) {
bpm = Math.max(40, Math.min(180, bpm + delta));
const el = $('bpmDisplay');
if(el) el.textContent = bpm;
if(metronomeActive) {
  stopMetronome();
  startMetronome();
}
}

function toggleMetronome() {
if (metronomeActive) {
  stopMetronome();
  $('metroToggleBtn').textContent = '▶️ 啟動節拍器';
} else {
  startMetronome();
  $('metroToggleBtn').textContent = '⏹️ 停止節拍器';
}
}

function startMetronome() {
metronomeActive = true;
metronomeBeat = 1;
const intervalMs = (60 / bpm) * 1000;
metronomeInterval = setInterval(() => {
  playBeep(metronomeBeat === 1);
  const visual = $('metroBeatVisual');
  if(visual) {
    visual.textContent = metronomeBeat;
    visual.style.transform = 'scale(1.25)';
    setTimeout(() => visual.style.transform = 'scale(1)', 100);
  }
  metronomeBeat = (metronomeBeat % 2) + 1;
}, intervalMs);
}

function stopMetronome() {
metronomeActive = false;
if(metronomeInterval) clearInterval(metronomeInterval);
}

  <div class="notice info">深吸一口氣，點擊開始後對著麥克風穩定且響亮地發出「啊——」5 秒鐘。</div>
  <div style="text-align:center;padding:16px 0;">

    <div style="width:100%;height:22px;background:#e2e8f0;border-radius:12px;overflow:hidden;margin-bottom:16px;">
      <div id="vocalVolBar" style="width:0%;height:100%;background:linear-gradient(90deg,#22c55e,#eab308,#ef4444);transition:width 0.1s;"></div>
    </div>
    <button id="vocalStartBtn" class="btn btn-primary" onclick="startVocalTest()">🎙️ 開始發聲測驗</button>
  </div>
  <button class="btn btn-ghost" onclick="closeModal()">關閉</button>
`);
}

async function startVocalTest() {
try {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  const audioContext = new (window.AudioContext || window.webkitAudioContext)();
  const analyser = audioContext.createAnalyser();
  const microphone = audioContext.createMediaStreamSource(stream);
  microphone.connect(analyser);
  analyser.fftSize = 256;
  const bufferLength = analyser.frequencyBinCount;
  const dataArray = new Uint8Array(bufferLength);

  $('vocalStartBtn').disabled = true;
  let remain = 50;
  let totalScore = 0;

  const interval = setInterval(() => {
    analyser.getByteFrequencyData(dataArray);
    let sum = 0;
    for (let i = 0; i < bufferLength; i++) sum += dataArray[i];
    let volume = Math.min(100, Math.round((sum / bufferLength) * 1.5));
    totalScore += volume;
    const bar = $('vocalVolBar');
    if (bar) bar.style.width = volume + '%';

    remain--;
    const t = $('vocalTimerDisplay');
    if (t) t.textContent = (remain / 10).toFixed(1) + ' 秒';

    if (remain <= 0) {
      clearInterval(interval);
      stream.getTracks().forEach(track => track.stop());
      vocalScore = Math.round(totalScore / 50);
      toast(`發聲測驗完成！得分：${vocalScore} 分`, 's');
      if (t) t.textContent = `得分：${vocalScore} 分`;
      $('vocalStartBtn').disabled = false;
      $('vocalStartBtn').textContent = '🔄 重新測驗';
    }
  }, 100);
} catch(e) {
  toast('無法存取麥克風，請檢查瀏覽器授權', 'e');
}
}

let _allMembers = [];

if(!requireAdmin()) return;
setMain(`

`);

async function loadAdminMemberList() {
const res = await runApi('member.listAll');
if (res && res.success) {
  _allMembers = res.items || [];
  renderMemberListTable(_allMembers);
}
}

function filterMemberList() {
const q = ($('memberSearchKey')?.value || '').trim().toLowerCase();
const filtered = _allMembers.filter(m => 
  (m.name && m.name.toLowerCase().includes(q)) || 
  (m.phone && m.phone.includes(q)) ||
  (m.memberId && m.memberId.toLowerCase().includes(q))
);
renderMemberListTable(filtered);
}

function renderMemberListTable(list) {
const area = $('memberListArea');
if(!area) return;
if(!list.length) {
  area.innerHTML = `<div class="empty">查無符合的會員資料</div>`;
  return;
}
area.innerHTML = `<div class="list">` + list.map(m => `
  <div class="item">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <div>
        <div style="font-weight:900;font-size:var(--fs-base);">${esc(m.name)} <span style="font-size:var(--fs-xs);color:var(--muted);">(${esc(m.memberId)})</span></div>
        <div style="font-size:var(--fs-xs);color:var(--muted);margin-top:4px;">電話：${esc(m.phone)} ｜ 類別：${esc(m.type)}</div>
        <div style="font-size:var(--fs-xs);color:var(--muted);">到期日：${esc(m.expiryDate || '未設定')}</div>
      </div>
      <span class="badge ${m.status==='有效會員'?'bs':m.status==='待審核'?'bw':'bd'}">${esc(m.status)}</span>
    </div>
    <div class="item-actions">
      <button class="btn btn-sm btn-outline" onclick="openAdminEditMember('${esc(m.memberId)}')">維護會籍與權限</button>
    </div>
  </div>
`).join('') + `</div>`;
}

openModal(`

      <span class="money">NT$ ${Number(a.balance||0).toLocaleString('zh-TW')}</span>
    </div>
    <div style="font-size:var(--fs-xs);color:var(--muted);margin-top:4px;">
      ${esc(a.type)} ｜ ${esc(a.bank || '無')} ｜ 帳號：${esc(a.accountNo || '無')}
    </div>
  </div>
`).join('') + `</div>`;
}

async function submitAccountAction() {
const name = $('accName')?.value.trim() || '';
const type = $('accType')?.value || '銀行帳戶';
const bank = $('accBank')?.value.trim() || '';
const accountNo = $('accNo')?.value.trim() || '';
const balance = Number($('accInitBal')?.value || 0);
if(!name) return toast('請輸入帳戶名稱', 'w');

await runApi('account.add', { name, type, bank, accountNo, balance }, () => {
  toast('帳戶新增成功！', 's');
  loadAccountList();
});
}

// 14. 幹部名冊管理
function renderStaffManage() {
if(!requireAdmin()) return;
setMain(`
  <div class="card">
    <div class="card-title">👔 理監事與幹部名冊</div>
    <div id="staffListArea"><div class="empty">載入幹部名冊中...</div></div>
    <button class="btn btn-ghost" onclick="go('adminHome')">返回管理後台</button>
  </div>
`);
loadStaffList();
}

async function loadStaffList() {
const res = await runApi('staff.list');
const area = $('staffListArea');
if(!area) return;
if(!res.success || !res.items || !res.items.length) {
  area.innerHTML = `<div class="empty">尚無幹部資料</div>`;
  return;
}
area.innerHTML = `<div class="list">` + res.items.map(s => `
  <div class="item" style="display:flex;justify-content:space-between;align-items:center;">
    <div>
      <div style="font-weight:900;">${esc(s.name)} <span style="font-size:var(--fs-xs);color:var(--muted);">(${esc(s.memberId)})</span></div>
      <div style="font-size:var(--fs-xs);color:var(--muted);margin-top:4px;">電話：${esc(s.phone)}</div>
    </div>
    <span class="badge bb">${esc(s.title || s.type)}</span>
  </div>
`).join('') + `</div>`;
}

// 15. 公告發布與管理
function renderAnnounceManage() {
if(!requireAdmin()) return;
setMain(`
  <div class="card">
    <div class="card-title">📢 公告發布與維護</div>
    <div class="fg"><label class="flabel">公告標題<span class="req">*</span></label><input type="text" id="annTitle" class="fc" placeholder="輸入公告標題"></div>
    <div class="fg">
      <label class="flabel">分類</label>
      <select id="annCategory" class="fc">
        <option value="會務通知">會務通知</option>
        <option value="活動快訊">活動快訊</option>
        <option value="衛教專區">衛教專區</option>
        <option value="權益倡導">權益倡導</option>
      </select>
    </div>
    <div class="fg">
      <label class="flabel">對象</label>
      <select id="annTarget" class="fc">
        <option value="全部">全部人員</option>
        <option value="有效會員">僅有效會員</option>
        <option value="理監事">僅理監事</option>
      </select>
    </div>
    <div class="fg">
      <label class="flabel">是否置頂</label>
      <select id="annPinned" class="fc">
        <option value="N">一般順序</option>
        <option value="Y">置頂顯示 📌</option>
      </select>
    </div>
    <div class="fg"><label class="flabel">內容<span class="req">*</span></label><textarea id="annContent" class="fc" placeholder="輸入公告內容..."></textarea></div>
    <button class="btn btn-primary" onclick="submitAnnounceAction()">🚀 發布公告</button>
    <div id="adminAnnListArea" style="margin-top:20px;"><div class="empty">載入歷史公告中...</div></div>
    <button class="btn btn-ghost" onclick="go('adminHome')">返回管理後台</button>
  </div>
`);
loadAdminAnnouncements();
}

async function loadAdminAnnouncements() {
const res = await runApi('announcement.list', { target: '全部' });
const area = $('adminAnnListArea');
if(!area) return;
if(!res.success || !res.items || !res.items.length) {
  area.innerHTML = `<div class="empty">尚無公告</div>`;
  return;
}
area.innerHTML = `<div class="list">` + res.items.map(a => `
  <div class="item">
    <div style="display:flex;justify-content:space-between;">
      <strong>${a.pinned==='Y'?'📌 ':''}${esc(a.title)}</strong>
      <span class="badge bb">${esc(a.category)}</span>
    </div>
    <div style="font-size:var(--fs-xs);color:var(--muted);margin-top:4px;">發布日：${esc(fmtDate(a.date))} ｜ 對象：${esc(a.target)}</div>
    <div class="item-actions">
      <button class="btn btn-sm btn-danger" onclick="deleteAnnounceAction('${esc(a.id)}')">刪除公告</button>
    </div>
  </div>
`).join('') + `</div>`;
}

async function submitAnnounceAction() {
const title = $('annTitle')?.value.trim() || '';
const content = $('annContent')?.value.trim() || '';
const category = $('annCategory')?.value || '會務通知';
const target = $('annTarget')?.value || '全部';
const pinned = $('annPinned')?.value || 'N';
if(!title || !content) return toast('請填寫標題與內容', 'w');

await runApi('announcement.add', { title, content, category, target, pinned, date: today() }, () => {
  toast('公告已成功發布！', 's');
  $('annTitle').value = '';
  $('annContent').value = '';
  loadAdminAnnouncements();
});
}

async function deleteAnnounceAction(id) {
if(!confirm('確定要刪除這則公告？')) return;
await runApi('announcement.delete', { id }, () => {
  toast('公告已刪除', 's');
  loadAdminAnnouncements();
});
}

// 16. 系統設定
function renderSystemSetting() {
if(!requireAdmin()) return;
setMain(`
  <div class="card">
    <div class="card-title">⚙️ 組織與系統參數設定</div>
    <div id="systemSettingForm"><div class="empty">載入系統參數中...</div></div>
    <button class="btn btn-ghost" onclick="go('adminHome')">返回管理後台</button>
  </div>
`);
loadSystemSettings();
}

async function loadSystemSettings() {
const res = await runApi('settings.getAll');
const area = $('systemSettingForm');
if(!area) return;
const s = res.settings || {};
area.innerHTML = `
  <div class="fg"><label class="flabel">組織全銜</label><input type="text" id="setOrgName" class="fc" value="${esc(s.org_name || ORG_NAME)}"></div>
  <div class="fg"><label class="flabel">統一編號</label><input type="text" id="setTaxId" class="fc" value="${esc(s.tax_id || '')}"></div>
  <div class="fg"><label class="flabel">電子圖章/印信 URL</label><input type="text" id="setSealUrl" class="fc" value="${esc(s.seal_url || '')}"></div>
  <div class="fg"><label class="flabel">常年會費標準金額 NT$</label><input type="number" id="setAnnualFee" class="fc" value="${esc(s.annual_fee || '1500')}"></div>
  <div class="fg"><label class="flabel">聯絡電話</label><input type="text" id="setPhone" class="fc" value="${esc(s.phone || '')}"></div>
  <div class="fg"><label class="flabel">會址</label><input type="text" id="setAddress" class="fc" value="${esc(s.address || '')}"></div>
  <button class="btn btn-primary" onclick="saveSystemSettingsAction()">💾 儲存所有系統設定</button>
`;
}

async function saveSystemSettingsAction() {
const settings = {
  org_name: $('setOrgName')?.value.trim() || '',
  tax_id: $('setTaxId')?.value.trim() || '',
  seal_url: $('setSealUrl')?.value.trim() || '',
  annual_fee: $('setAnnualFee')?.value.trim() || '1500',
  phone: $('setPhone')?.value.trim() || '',
  address: $('setAddress')?.value.trim() || ''
};

await runApi('settings.saveAll', { settings }, () => {
  toast('系統參數已成功保存！', 's');
});
}

    APP.user = JSON.parse(savedUser);
    updateLoginButton();
  } catch(e) {}
}

initLiff();
go('home', {}, false);
});
</script>
