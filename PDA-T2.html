<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>帕金森溫馨交流園地 - 手機無障礙版</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            parkinson: {
              darkBg: '#0b1f13', // 極高對比深綠背景
              primary: '#143e24', // 深綠色
              secondary: '#1b5e35', // 中綠色
              accent: '#facc15', // 亮黃色（高對比提示）
              btn: '#1e7a44', // 易讀綠色按鈕
              btnHover: '#145a2d',
              textDark: '#0f172a',
              textLight: '#f8fafc'
            }
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --base-font-size: 22px; /* 長者友善預設大字體 */
    }
    body {
      font-size: var(--base-font-size);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f1f5f9;
      /* 防止雙擊縮放延遲，提升觸控反應速度 */
      touch-action: manipulation;
    }
    /* 針對手部震顫病友設計的超大點擊區域 */
    .accessible-touch-target {
      min-height: 60px;
      padding: 12px 20px;
    }
    /* 顯眼的聚焦外框，方便確認目前選取位置 */
    .accessible-focus:focus {
      outline: 5px solid #facc15 !important;
      outline-offset: 3px;
    }
    /* 隱藏滾動條但保持功能 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="text-slate-900 pb-32">

  <!-- 頂部高對比標頭 -->
  <header class="bg-parkinson-primary text-white shadow-lg sticky top-0 z-40 border-b-4 border-parkinson-accent">
    <div class="px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-heart-pulse text-4xl text-parkinson-accent"></i>
        <div>
          <h1 class="text-2xl font-black tracking-wide">帕金森溫馨園地</h1>
          <p class="text-emerald-300 text-sm font-bold">專為病友與照護者設計</p>
        </div>
      </div>
      <!-- 快速設定按鈕 -->
      <button onclick="switchTab('settings-tab')" class="accessible-touch-target bg-parkinson-secondary hover:bg-emerald-800 text-white rounded-2xl border-2 border-emerald-500 flex items-center justify-center accessible-focus" title="設定">
        <i class="fa-solid fa-gear text-2xl"></i>
      </button>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="max-w-md mx-auto px-3 py-4 space-y-4">

    <!-- 1. 動態牆分頁 -->
    <section id="wall-tab" class="tab-content space-y-4">
      <!-- 簡易大按鈕分類篩選器（平鋪式，非下拉選單，防誤觸） -->
      <div class="bg-white p-3 rounded-3xl shadow-md border-2 border-slate-200">
        <p class="font-black text-slate-700 mb-2 text-center"><i class="fa-solid fa-filter text-parkinson-secondary mr-1"></i>請選擇想看的內容：</p>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="filterCategory('全部')" class="cat-btn active accessible-touch-target rounded-2xl font-black text-lg transition bg-parkinson-primary text-white border-2 border-parkinson-primary" data-cat="全部">全部文章</button>
          <button onclick="filterCategory('用藥與復健')" class="cat-btn accessible-touch-target rounded-2xl font-black text-lg transition bg-slate-100 text-slate-800 border-2 border-slate-300" data-cat="用藥與復健">💊 用藥復健</button>
          <button onclick="filterCategory('經驗分享')" class="cat-btn accessible-touch-target rounded-2xl font-black text-lg transition bg-slate-100 text-slate-800 border-2 border-slate-300" data-cat="經驗分享">💡 經驗分享</button>
          <button onclick="filterCategory('我的收藏')" class="cat-btn accessible-touch-target rounded-2xl font-black text-lg transition bg-amber-100 text-amber-900 border-2 border-amber-400" data-cat="我的收藏">⭐ 我的收藏</button>
        </div>
      </div>

      <!-- 搜尋欄 -->
      <div class="bg-white p-3 rounded-3xl shadow-md border-2 border-slate-200 flex gap-2">
        <input type="text" id="searchInput" oninput="handleSearch()" placeholder="🔍 輸入關鍵字搜尋..." class="accessible-touch-target flex-1 border-2 border-slate-300 rounded-2xl px-4 text-lg font-bold accessible-focus">
        <button onclick="loadPostsFromApi()" class="accessible-touch-target px-4 bg-emerald-100 text-parkinson-primary font-black rounded-2xl border-2 border-emerald-300" title="重新整理">
          <i class="fa-solid fa-rotate-right text-xl"></i>
        </button>
      </div>

      <!-- 文章列表 -->
      <div id="postsList" class="space-y-4">
        <!-- 動態載入 -->
      </div>
    </section>

    <!-- 2. 我要發文分頁 -->
    <section id="post-tab" class="tab-content hidden space-y-4">
      <div class="bg-white p-5 rounded-3xl shadow-md border-2 border-emerald-600 space-y-4">
        <h2 class="text-2xl font-black text-parkinson-primary border-b-2 border-slate-100 pb-2 flex items-center gap-2">
          <i class="fa-solid fa-pen-to-square"></i>
          <span>發表新貼文</span>
        </h2>

        <div>
          <label class="block font-black mb-1 text-slate-800">1. 選擇主題分類</label>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" onclick="selectFormCategory('經驗分享', this)" class="form-cat-btn active accessible-touch-target rounded-2xl font-black text-base border-2 border-parkinson-primary bg-parkinson-primary text-white">💡 經驗分享</button>
            <button type="button" onclick="selectFormCategory('用藥與復健', this)" class="form-cat-btn accessible-touch-target rounded-2xl font-black text-base border-2 border-slate-300 bg-slate-50 text-slate-800">💊 用藥復健</button>
            <button type="button" onclick="selectFormCategory('照護心得', this)" class="form-cat-btn accessible-touch-target rounded-2xl font-black text-base border-2 border-slate-300 bg-slate-50 text-slate-800">🤝 照護心得</button>
            <button type="button" onclick="selectFormCategory('門診諮詢', this)" class="form-cat-btn accessible-touch-target rounded-2xl font-black text-base border-2 border-slate-300 bg-slate-50 text-slate-800">🩺 門診備忘</button>
          </div>
          <input type="hidden" id="postCategory" value="經驗分享">
        </div>

        <!-- 標題 + 語音輸入 -->
        <div class="space-y-1">
          <label class="block font-black text-slate-800" for="postTitle">2. 填寫標題</label>
          <div class="flex flex-col gap-2">
            <input type="text" id="postTitle" placeholder="例如：今天散步走了20分鐘" class="accessible-touch-target w-full border-2 border-slate-300 rounded-2xl px-4 text-lg font-bold accessible-focus">
            <button type="button" onclick="startSpeechRecognition('postTitle', this)" class="accessible-touch-target w-full bg-red-100 hover:bg-red-200 text-red-700 font-black rounded-2xl border-2 border-red-400 flex items-center justify-center gap-2">
              <i class="fa-solid fa-microphone text-2xl"></i>
              <span>按我用語音輸入標題</span>
            </button>
          </div>
        </div>

        <!-- 內容 + 語音輸入 -->
        <div class="space-y-1">
          <label class="block font-black text-slate-800" for="postContent">3. 填寫詳細內容</label>
          <div class="flex flex-col gap-2">
            <textarea id="postContent" rows="4" placeholder="可以寫下今天的身體狀況、用藥後的反應..." class="w-full border-2 border-slate-300 rounded-2xl p-4 text-lg font-bold accessible-focus"></textarea>
            <button type="button" onclick="startSpeechRecognition('postContent', this)" class="accessible-touch-target w-full bg-red-100 hover:bg-red-200 text-red-700 font-black rounded-2xl border-2 border-red-400 flex items-center justify-center gap-2">
              <i class="fa-solid fa-microphone text-2xl"></i>
              <span>按我用語音輸入內容</span>
            </button>
          </div>
        </div>

        <!-- 圖片上傳（簡化版） -->
        <div class="space-y-1">
          <label class="block font-black text-slate-800">4. 附上照片 (選填)</label>
          <input type="file" id="postImageFile" accept="image/*" onchange="handleImageUpload(event)" class="hidden">
          <button type="button" onclick="document.getElementById('postImageFile').click()" class="accessible-touch-target w-full bg-slate-100 hover:bg-slate-200 text-slate-800 font-black rounded-2xl border-2 border-slate-400 flex items-center justify-center gap-2">
            <i class="fa-solid fa-camera text-2xl text-emerald-700"></i>
            <span>點此拍照或選取照片</span>
          </button>
          <div id="imagePreviewContainer" class="hidden relative mt-2 text-center">
            <img id="imagePreview" src="" alt="照片預覽" class="max-h-48 mx-auto rounded-2xl object-cover border-2 border-emerald-500">
            <button type="button" onclick="removeSelectedImage()" class="absolute -top-2 right-2 bg-red-600 text-white rounded-full w-10 h-10 flex items-center justify-center shadow-lg font-black text-xl">✕</button>
          </div>
        </div>

        <!-- 送出按鈕 -->
        <button onclick="handleCreatePost()" class="accessible-touch-target w-full bg-parkinson-btn hover:bg-parkinson-btnHover text-white text-xl font-black rounded-2xl shadow-lg border-2 border-emerald-700 flex items-center justify-center gap-2">
          <i class="fa-solid fa-paper-plane"></i>
          <span>確認送出貼文</span>
        </button>
      </div>
    </section>

    <!-- 3. 門診諮詢卡分頁 -->
    <section id="doctor-tab" class="tab-content hidden space-y-4">
      <div class="bg-white p-5 rounded-3xl shadow-md border-2 border-sky-600 space-y-4">
        <h2 class="text-2xl font-black text-sky-900 border-b-2 border-slate-100 pb-2 flex items-center gap-2">
          <i class="fa-solid fa-notes-medical text-sky-600"></i>
          <span>門診復健諮詢卡</span>
        </h2>
        <p class="text-base text-slate-600 font-bold leading-relaxed">
          系統會自動整理您發表的紀錄，看診時直接展示給醫生看，溝通更輕鬆！
        </p>

        <div id="doctorReportContent" class="space-y-3">
          <!-- 動態產生 -->
        </div>

        <button onclick="window.print()" class="accessible-touch-target w-full bg-sky-700 hover:bg-sky-800 text-white font-black rounded-2xl shadow-lg flex items-center justify-center gap-2">
          <i class="fa-solid fa-print text-xl"></i>
          <span>列印或儲存諮詢卡</span>
        </button>
      </div>
    </section>

    <!-- 4. 設定與角色分頁 -->
    <section id="settings-tab" class="tab-content hidden space-y-4">
      <!-- 字體調整 -->
      <div class="bg-white p-5 rounded-3xl shadow-md border-2 border-slate-200 space-y-3">
        <h3 class="text-xl font-black text-slate-800"><i class="fa-solid fa-font text-parkinson-secondary mr-1"></i>調整字體大小</h3>
        <div class="grid grid-cols-3 gap-2">
          <button onclick="setFontSize(20)" class="font-btn accessible-touch-target rounded-2xl font-black text-lg bg-slate-100 border-2 border-slate-300" data-size="20">標準 (20)</button>
          <button onclick="setFontSize(24)" class="font-btn accessible-touch-target rounded-2xl font-black text-xl bg-slate-100 border-2 border-slate-300" data-size="24">放大 (24)</button>
          <button onclick="setFontSize(28)" class="font-btn accessible-touch-target rounded-2xl font-black text-2xl bg-slate-100 border-2 border-slate-300" data-size="28">特大 (28)</button>
        </div>
      </div>

      <!-- 角色切換 -->
      <div class="bg-white p-5 rounded-3xl shadow-md border-2 border-slate-200 space-y-3">
        <h3 class="text-xl font-black text-slate-800"><i class="fa-solid fa-user-gear text-parkinson-secondary mr-1"></i>切換使用者身分</h3>
        <div class="space-y-2">
          <button onclick="changeCurrentUser('u1')" class="user-btn w-full accessible-touch-target rounded-2xl font-black text-left flex items-center justify-between border-2 border-parkinson-primary bg-emerald-50 text-slate-900" id="user-btn-u1">
            <span>👴 台中老王 (一般病友)</span>
            <i class="fa-solid fa-circle-check text-parkinson-primary"></i>
          </button>
          <button onclick="changeCurrentUser('u2')" class="user-btn w-full accessible-touch-target rounded-2xl font-black text-left flex items-center justify-between border-2 border-slate-300 bg-white text-slate-800" id="user-btn-u2">
            <span>👩 照護者阿美 (照護會員)</span>
            <i class="fa-solid fa-circle-check text-slate-200"></i>
          </button>
          <button onclick="changeCurrentUser('admin1')" class="user-btn w-full accessible-touch-target rounded-2xl font-black text-left flex items-center justify-between border-2 border-slate-300 bg-white text-slate-800" id="user-btn-admin1">
            <span>👑 站長小林 (系統管理員)</span>
            <i class="fa-solid fa-circle-check text-slate-200"></i>
          </button>
        </div>
      </div>

      <!-- API 連線 -->
      <div class="bg-white p-5 rounded-3xl shadow-md border-2 border-slate-200 space-y-3">
        <h3 class="text-xl font-black text-slate-800"><i class="fa-solid fa-link text-parkinson-secondary mr-1"></i>雲端同步設定</h3>
        <input type="text" id="gasApiUrl" placeholder="請貼上 GAS API 網址..." class="accessible-touch-target w-full border-2 border-slate-300 rounded-2xl px-4 text-base font-bold accessible-focus">
        <div class="grid grid-cols-2 gap-2">
          <button onclick="saveApiUrl()" class="accessible-touch-target bg-parkinson-primary text-white font-black rounded-2xl border-2 border-parkinson-primary">儲存並連線</button>
          <button onclick="useMockDataMode()" class="accessible-touch-target bg-slate-200 text-slate-800 font-black rounded-2xl border-2 border-slate-300">模擬模式</button>
        </div>
      </div>
    </section>

  </main>

  <!-- ♿ 超大手機底部導航欄 (LINE 風格，單手輕鬆操作) -->
  <nav class="fixed bottom-0 left-0 right-0 bg-parkinson-primary border-t-4 border-parkinson-accent shadow-2xl z-50">
    <div class="max-w-md mx-auto grid grid-cols-4 text-center">
      <button onclick="switchTab('wall-tab')" id="nav-wall-tab" class="nav-btn py-3 text-white flex flex-col items-center justify-center gap-1 border-r border-emerald-900 bg-parkinson-secondary">
        <i class="fa-solid fa-comments text-2xl"></i>
        <span class="text-xs font-black">交流動態</span>
      </button>
      <button onclick="switchTab('post-tab')" id="nav-post-tab" class="nav-btn py-3 text-white flex flex-col items-center justify-center gap-1 border-r border-emerald-900">
        <i class="fa-solid fa-pen-to-square text-2xl"></i>
        <span class="text-xs font-black">我要發文</span>
      </button>
      <button onclick="switchTab('doctor-tab')" id="nav-doctor-tab" class="nav-btn py-3 text-white flex flex-col items-center justify-center gap-1 border-r border-emerald-900">
        <i class="fa-solid fa-notes-medical text-2xl"></i>
        <span class="text-xs font-black">門診卡</span>
      </button>
      <button onclick="switchTab('settings-tab')" id="nav-settings-tab" class="nav-btn py-3 text-white flex flex-col items-center justify-center gap-1">
        <i class="fa-solid fa-gear text-2xl"></i>
        <span class="text-xs font-black">設定</span>
      </button>
    </div>
  </nav>

  <!-- 自訂刪除確認 Modal (超大按鈕版) -->
  <div id="confirmModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white max-w-sm w-full rounded-3xl p-6 shadow-2xl space-y-4 text-center border-4 border-red-500">
      <div class="w-20 h-20 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto text-4xl font-black">
        ⚠️
      </div>
      <h3 class="text-2xl font-black text-slate-900" id="confirmTitle">確定要刪除嗎？</h3>
      <p class="text-slate-600 text-lg font-bold" id="confirmMessage">刪除後將無法恢復此紀錄。</p>
      
      <div class="flex flex-col gap-2 pt-2">
        <button id="confirmYesBtn" class="accessible-touch-target w-full bg-red-600 hover:bg-red-700 text-white font-black rounded-2xl shadow text-lg">
          確定刪除
        </button>
        <button onclick="closeConfirmModal()" class="accessible-touch-target w-full bg-slate-200 hover:bg-slate-300 text-slate-800 font-black rounded-2xl text-lg">
          取消
        </button>
      </div>
    </div>
  </div>

  <!-- Toast 提示訊息 -->
  <div id="toastModal" class="fixed bottom-24 left-4 right-4 z-50 transform translate-y-32 transition-transform duration-300 pointer-events-none">
    <div id="toastContent" class="bg-slate-900 text-white px-6 py-4 rounded-2xl shadow-2xl flex items-center justify-center gap-3 font-black text-lg border-2 border-slate-700">
      <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400 text-2xl"></i>
      <span id="toastMessage">訊息已更新</span>
    </div>
  </div>

  <script>
    // 全域使用者
    const USERS = {
      'u1': { id: 'u1', name: '台中老王', role: 'member', roleLabel: '一般病友' },
      'u2': { id: 'u2', name: '照護者阿美', role: 'member', roleLabel: '照護會員' },
      'admin1': { id: 'admin1', name: '站長小林', role: 'admin', roleLabel: '系統管理員' }
    };

    let currentUser = USERS['u1'];
    const DEFAULT_GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxJr3h7dZTOpKi_hMrJoB_AaI2THqdofMCOze1OWC5DldFbEPwnP6ZpkOGBhr2svFll/exec';

    let GAS_API_URL = localStorage.getItem('PARKINSON_FORUM_API') || DEFAULT_GAS_API_URL;
    let isMockMode = !GAS_API_URL || GAS_API_URL.includes('YOUR_DEPLOYMENT_ID_HERE');
    let currentCategory = '全部';
    let searchQuery = '';
    let selectedBase64Image = '';
    let bookmarkedPostIds = JSON.parse(localStorage.getItem('PARKINSON_BOOKMARKS') || '[]');

    // 本地預設模擬資料
    let mockPosts = [
      {
        postId: 'P_1001',
        category: '門診諮詢',
        title: '📌 站長提醒：如何為回診準備症狀備忘？',
        content: '各位病友大家好的，建議平時可在論壇記錄每日用藥後的肢體反應，並點選「產生門診諮詢卡」列印出來，回診時能幫助醫師更準確調整藥物劑量！',
        author: '站長小林',
        authorId: 'admin1',
        authorRole: 'admin',
        imageUrl: 'https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?w=800&auto=format&fit=crop&q=80',
        isPinned: true,
        likes: ['u1', 'u2'],
        createdAt: '2026-08-03 09:00',
        replies: [
          { replyId: 'R_1', author: '台中老王', authorId: 'u1', content: '謝謝站長提醒！這功能對我們帶去給醫生看非常方便。', createdAt: '2026-08-03 09:30', likes: ['admin1'] }
        ]
      },
      {
        postId: 'P_1002',
        category: '用藥與復健',
        title: '每日定時超慢跑與防震餐具體驗分享',
        content: '確診第三年，每天在家嘗試 20 分鐘超慢跑，發現肢體僵硬顯著改善。另外最近換了加重防震湯匙，吃稀飯不再弄髒衣服了！',
        author: '台中老王',
        authorId: 'u1',
        authorRole: 'member',
        imageUrl: 'https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?w=800&auto=format&fit=crop&q=80',
        isPinned: false,
        likes: ['u2'],
        createdAt: '2026-08-02 14:15',
        replies: []
      }
    ];

    window.onload = function() {
      if (GAS_API_URL && !GAS_API_URL.includes('YOUR_DEPLOYMENT_ID_HERE')) {
        document.getElementById('gasApiUrl').value = GAS_API_URL;
      } else {
        document.getElementById('gasApiUrl').value = '';
      }
      const savedFontSize = localStorage.getItem('PARKINSON_FONT_SIZE') || 22;
      setFontSize(parseInt(savedFontSize));
      updateUserUI();
      loadPostsFromApi();
    };

    // 手機分頁切換
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(tabId).classList.remove('hidden');

      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('bg-parkinson-secondary'));
      document.getElementById('nav-' + tabId).classList.add('bg-parkinson-secondary');

      if (tabId === 'doctor-tab') {
        generateDoctorReport();
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 字體大小控制
    function setFontSize(size) {
      document.documentElement.style.setProperty('--base-font-size', size + 'px');
      localStorage.setItem('PARKINSON_FONT_SIZE', size);
      
      document.querySelectorAll('.font-btn').forEach(btn => {
        if (parseInt(btn.dataset.size) === size) {
          btn.className = 'font-btn accessible-touch-target rounded-2xl font-black text-lg bg-parkinson-primary text-white border-2 border-parkinson-primary shadow';
        } else {
          btn.className = 'font-btn accessible-touch-target rounded-2xl font-black text-lg bg-slate-100 text-slate-800 border-2 border-slate-300';
        }
      });
    }

    function changeCurrentUser(userId) {
      if (USERS[userId]) {
        currentUser = USERS[userId];
        updateUserUI();
        renderPosts(mockPosts);
        showToast(`已切換為：${currentUser.name}`, 'info');
      }
    }

    function updateUserUI() {
      // 更新設定頁面的勾選狀態
      document.querySelectorAll('.user-btn').forEach(btn => {
        btn.className = 'user-btn w-full accessible-touch-target rounded-2xl font-black text-left flex items-center justify-between border-2 border-slate-300 bg-white text-slate-800';
        const icon = btn.querySelector('i');
        icon.className = 'fa-solid fa-circle-check text-slate-200';
      });

      const activeBtn = document.getElementById(`user-btn-${currentUser.id}`);
      if (activeBtn) {
        activeBtn.className = 'user-btn w-full accessible-touch-target rounded-2xl font-black text-left flex items-center justify-between border-2 border-parkinson-primary bg-emerald-50 text-slate-900';
        activeBtn.querySelector('i').className = 'fa-solid fa-circle-check text-parkinson-primary';
      }
    }

    // 發表文章分類選擇（平鋪按鈕）
    function selectFormCategory(cat, btn) {
      document.getElementById('postCategory').value = cat;
      document.querySelectorAll('.form-cat-btn').forEach(b => {
        b.className = 'form-cat-btn accessible-touch-target rounded-2xl font-black text-base border-2 border-slate-300 bg-slate-50 text-slate-800';
      });
      btn.className = 'form-cat-btn active accessible-touch-target rounded-2xl font-black text-base border-2 border-parkinson-primary bg-parkinson-primary text-white';
    }

    // 圖片上傳
    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      if (file.size > 3 * 1024 * 1024) {
        showToast('圖片檔案請小於 3MB', 'warning');
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        selectedBase64Image = e.target.result;
        document.getElementById('imagePreview').src = selectedBase64Image;
        document.getElementById('imagePreviewContainer').classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    }

    function removeSelectedImage() {
      selectedBase64Image = '';
      document.getElementById('postImageFile').value = '';
      document.getElementById('imagePreviewContainer').classList.add('hidden');
    }

    // 語音辨識輸入
    function startSpeechRecognition(inputId, btnElement) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        showToast('您的手機不支援語音辨識，建議使用 Chrome 瀏覽器', 'warning');
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = 'zh-TW';
      recognition.interimResults = false;

      const originalHtml = btnElement.innerHTML;
      btnElement.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-2xl mr-2"></i><span>正在聆聽中，請說話...</span>`;

      recognition.start();

      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        const targetInput = document.getElementById(inputId);
        if (targetInput) {
          targetInput.value = targetInput.value ? (targetInput.value + ' ' + transcript) : transcript;
        }
        showToast('語音辨識成功！', 'success');
      };

      recognition.onerror = function() {
        showToast('沒聽清楚，請再試一次', 'warning');
      };

      recognition.onend = function() {
        btnElement.innerHTML = originalHtml;
      };
    }

    async function loadPostsFromApi() {
      const container = document.getElementById('postsList');
      container.innerHTML = `
        <div class="bg-white p-8 rounded-3xl text-center text-slate-500 shadow-sm border-2 border-slate-200">
          <i class="fa-solid fa-circle-notch fa-spin text-4xl text-parkinson-primary mb-3"></i>
          <p class="font-black">最新資料讀取中...</p>
        </div>
      `;

      if (isMockMode) {
        setTimeout(() => renderPosts(mockPosts), 200);
        return;
      }

      try {
        const res = await fetch(`${GAS_API_URL}?action=getPosts`);
        const json = await res.json();
        if (json.status === 'success') {
          mockPosts = json.data;
          renderPosts(mockPosts);
        } else {
          showToast('無法讀取雲端資料，切換為模擬資料', 'warning');
          renderPosts(mockPosts);
        }
      } catch (err) {
        showToast('API 連線失敗，已啟用模擬模式', 'warning');
        renderPosts(mockPosts);
      }
    }

    function renderPosts(posts) {
      const container = document.getElementById('postsList');
      
      let filtered = posts.filter(p => {
        let matchCat = (currentCategory === '全部') || (p.category === currentCategory);
        if (currentCategory === '我的收藏') {
          matchCat = bookmarkedPostIds.includes(p.postId);
        }
        const matchSearch = !searchQuery || 
          p.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
          p.content.toLowerCase().includes(searchQuery.toLowerCase()) ||
          p.author.toLowerCase().includes(searchQuery.toLowerCase());
        return matchCat && matchSearch;
      });

      filtered.sort((a, b) => {
        if (a.isPinned && !b.isPinned) return -1;
        if (!a.isPinned && b.isPinned) return 1;
        return new Date(b.createdAt.replace(' ', 'T')) - new Date(a.createdAt.replace(' ', 'T'));
      });

      document.getElementById('postCountDisplay').innerText = `共 ${filtered.length} 篇貼文`;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="bg-white p-12 rounded-3xl text-center text-slate-500 shadow-md border-2 border-slate-200 space-y-2">
            <i class="fa-regular fa-comments text-6xl text-slate-300"></i>
            <p class="text-xl font-black">目前沒有符合條件的文章</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(post => {
        const isAuthor = (currentUser.id === post.authorId);
        const isAdmin = (currentUser.role === 'admin');
        const canManage = isAuthor || isAdmin;
        const hasLiked = (post.likes || []).includes(currentUser.id);
        const isBookmarked = bookmarkedPostIds.includes(post.postId);
        const imgUrl = post.imageUrl || '';

        return `
          <article class="bg-white p-5 rounded-3xl shadow-md border-2 ${post.isPinned ? 'border-amber-400 bg-amber-50/30' : 'border-slate-200'} space-y-3 relative">
            
            <!-- 頂部資訊列 -->
            <div class="flex flex-wrap justify-between items-center gap-2 border-b-2 border-slate-100 pb-2">
              <div class="flex items-center gap-2 flex-wrap">
                ${post.isPinned ? `<span class="bg-amber-500 text-white text-xs font-black px-2.5 py-1 rounded-full"><i class="fa-solid fa-thumbtack"></i> 置頂</span>` : ''}
                <span class="bg-emerald-100 text-parkinson-primary text-sm font-black px-2.5 py-1 rounded-full">${post.category}</span>
                <span class="font-black text-slate-800 text-base"><i class="fa-regular fa-user text-parkinson-secondary mr-1"></i>${post.author}</span>
              </div>
              <span class="text-xs text-slate-400 font-bold">${post.createdAt}</span>
            </div>

            <!-- 文章內容 -->
            <div class="space-y-2">
              <h3 class="text-xl font-black text-slate-900 leading-snug">${post.title}</h3>
              <p class="text-slate-800 text-lg leading-relaxed whitespace-pre-line">${post.content}</p>
              ${imgUrl ? `<img src="${imgUrl}" alt="照片" class="max-h-60 w-full rounded-2xl object-cover border-2 border-slate-100 mt-2">` : ''}
            </div>

            <!-- 互動工具列（超大按鈕，防手震） -->
            <div class="grid grid-cols-3 gap-2 pt-2 border-t-2 border-slate-100">
              <button onclick="handleToggleLike('${post.postId}')" class="accessible-touch-target rounded-2xl font-black text-base flex items-center justify-center gap-1 border-2 ${hasLiked ? 'bg-red-100 text-red-600 border-red-300' : 'bg-slate-50 text-slate-600 border-slate-300'}">
                <i class="${hasLiked ? 'fa-solid text-red-500' : 'fa-regular'} fa-heart text-xl"></i>
                <span>讚 (${(post.likes || []).length})</span>
              </button>
              <button onclick="toggleBookmark('${post.postId}')" class="accessible-touch-target rounded-2xl font-black text-base flex items-center justify-center gap-1 border-2 ${isBookmarked ? 'bg-amber-100 text-amber-800 border-amber-300' : 'bg-slate-50 text-slate-600 border-slate-300'}">
                <i class="${isBookmarked ? 'fa-solid text-amber-600' : 'fa-regular'} fa-bookmark text-xl"></i>
                <span>收藏</span>
              </button>
              ${canManage ? `
                <button onclick="promptDeletePost('${post.postId}')" class="accessible-touch-target rounded-2xl font-black text-base bg-red-50 text-red-600 border-2 border-red-200 flex items-center justify-center gap-1">
                  <i class="fa-solid fa-trash"></i>
                  <span>刪除</span>
                </button>
              ` : `<div class="bg-transparent"></div>`}
            </div>

            <!-- 留言區 -->
            <div class="bg-slate-50 p-3 rounded-2xl space-y-2 border-2 border-slate-100">
              <div class="space-y-2">
                ${(post.replies && post.replies.length > 0) ? post.replies.map(r => `
                  <div class="bg-white p-3 rounded-xl border-2 border-slate-100 text-sm space-y-1">
                    <div class="flex justify-between items-center font-black text-slate-700">
                      <span>👴 ${r.author}</span>
                      <span class="text-xs text-slate-400 font-normal">${r.createdAt}</span>
                    </div>
                    <p class="text-slate-800 text-base font-bold">${r.content}</p>
                  </div>
                `).join('') : '<p class="text-xs text-slate-400 italic py-1 text-center">歡迎留言給予鼓勵！</p>'}
              </div>
              <!-- 快速留言輸入 -->
              <div class="flex gap-2 pt-1">
                <input type="text" id="replyText-${post.postId}" placeholder="寫下溫馨回覆..." class="accessible-touch-target flex-1 border-2 border-slate-300 rounded-2xl px-3 text-base font-bold accessible-focus">
                <button onclick="handleCreateReply('${post.postId}')" class="accessible-touch-target px-4 bg-parkinson-secondary text-white font-black rounded-2xl border-2 border-emerald-700">留言</button>
              </div>
            </div>

          </article>
        `;
      }).join('');
    }

    function getFormattedDateTime() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const MM = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const HH = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      return `${yyyy}-${MM}-${dd} ${HH}:${mm}`;
    }

    async function handleCreatePost() {
      const category = document.getElementById('postCategory').value;
      const title = document.getElementById('postTitle').value.trim();
      const content = document.getElementById('postContent').value.trim();
      const imageUrl = selectedBase64Image;

      if (!title || !content) {
        showToast('請填寫標題與內容喔！', 'warning');
        return;
      }

      const newPostData = {
        postId: 'P_' + Date.now(),
        category,
        title,
        content,
        author: currentUser.name,
        authorId: currentUser.id,
        authorRole: currentUser.role,
        imageUrl,
        isPinned: false,
        likes: [],
        createdAt: getFormattedDateTime()
      };

      if (isMockMode) {
        mockPosts.unshift(newPostData);
        renderPosts(mockPosts);
        resetPostForm();
        showToast('發表成功 (模擬模式)', 'success');
        switchTab('wall-tab');
        return;
      }

      try {
        const res = await fetch(GAS_API_URL, {
          method: 'POST',
          redirect: 'follow',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'addPost', data: newPostData })
        });
        const json = await res.json();
        if (json.status === 'success') {
          showToast('發表成功！已同步至雲端', 'success');
          resetPostForm();
          loadPostsFromApi();
          switchTab('wall-tab');
        }
      } catch (err) {
        mockPosts.unshift(newPostData);
        renderPosts(mockPosts);
        resetPostForm();
        showToast('已存入本地記憶體', 'info');
        switchTab('wall-tab');
      }
    }

    function toggleBookmark(postId) {
      const idx = bookmarkedPostIds.indexOf(postId);
      if (idx > -1) {
        bookmarkedPostIds.splice(idx, 1);
        showToast('已移出收藏', 'info');
      } else {
        bookmarkedPostIds.push(postId);
        showToast('已加入我的收藏！', 'success');
      }
      localStorage.setItem('PARKINSON_BOOKMARKS', JSON.stringify(bookmarkedPostIds));
      renderPosts(mockPosts);
    }

    async function handleToggleLike(postId) {
      const post = mockPosts.find(p => p.postId === postId);
      if (!post) return;

      if (!post.likes) post.likes = [];
      const index = post.likes.indexOf(currentUser.id);

      if (index > -1) {
        post.likes.splice(index, 1);
      } else {
        post.likes.push(currentUser.id);
        showToast('感謝您的按讚鼓勵！', 'success');
      }

      renderPosts(mockPosts);

      if (!isMockMode) {
        try {
          const res = await fetch(GAS_API_URL, {
            method: 'POST',
            redirect: 'follow',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'toggleLike', data: { postId, userId: currentUser.id } })
          });
          const json = await res.json();
          if (json.status === 'success') {
            post.likes = json.likes;
            renderPosts(mockPosts);
          }
        } catch (err) {
          console.error(err);
        }
      }
    }

    let pendingDeleteAction = null;

    function promptDeletePost(postId) {
      document.getElementById('confirmTitle').innerText = '確定要刪除嗎？';
      document.getElementById('confirmMessage').innerText = '刪除後該文章與其留言將會一併移除。';
      pendingDeleteAction = () => executeDeletePost(postId);
      document.getElementById('confirmModal').classList.remove('hidden');
    }

    document.getElementById('confirmYesBtn').onclick = function() {
      if (pendingDeleteAction) pendingDeleteAction();
      closeConfirmModal();
    };

    function closeConfirmModal() {
      document.getElementById('confirmModal').classList.add('hidden');
      pendingDeleteAction = null;
    }

    async function executeDeletePost(postId) {
      mockPosts = mockPosts.filter(p => p.postId !== postId);
      renderPosts(mockPosts);
      showToast('文章已刪除', 'success');

      if (!isMockMode) {
        try {
          await fetch(GAS_API_URL, {
            method: 'POST',
            redirect: 'follow',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'deletePost', data: { postId } })
          });
          loadPostsFromApi();
        } catch (err) {
          console.error(err);
        }
      }
    }

    async function handleCreateReply(postId) {
      const input = document.getElementById(`replyText-${postId}`);
      const content = input.value.trim();
      if (!content) return;

      const post = mockPosts.find(p => p.postId === postId);
      if (post) {
        if (!post.replies) post.replies = [];
        const replyObj = {
          replyId: 'R_' + Date.now(),
          postId,
          author: currentUser.name,
          authorId: currentUser.id,
          content,
          likes: [],
          createdAt: getFormattedDateTime()
        };
        post.replies.push(replyObj);
        input.value = '';
        renderPosts(mockPosts);
        showToast('留言發布成功', 'success');

        if (!isMockMode) {
          try {
            await fetch(GAS_API_URL, {
              method: 'POST',
              redirect: 'follow',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action: 'addReply', data: replyObj })
            });
            loadPostsFromApi();
          } catch (err) {
            console.error(err);
          }
        }
      }
    }

    function generateDoctorReport() {
      const container = document.getElementById('doctorReportContent');
      const userPosts = mockPosts.filter(p => p.authorId === currentUser.id);

      if (userPosts.length === 0) {
        container.innerHTML = `
          <div class="bg-slate-50 p-6 rounded-2xl text-center text-slate-500 border-2 border-dashed border-slate-300">
            您目前尚無發表貼文。建議您可以在發表貼文時選擇「門診諮詢」分類，記錄每日用藥與肢體狀態！
          </div>
        `;
      } else {
        container.innerHTML = `
          <div class="border-b-2 pb-2 mb-2 font-black text-slate-800 text-lg">
            患者/照護者：${currentUser.name} ｜ 匯出時間：${new Date().toLocaleDateString('zh-TW')}
          </div>
        ` + userPosts.map((p, idx) => `
          <div class="bg-emerald-50/50 p-4 rounded-2xl border-2 border-emerald-200 space-y-1">
            <div class="font-black text-lg text-parkinson-primary">${idx + 1}. [${p.category}] ${p.title}</div>
            <div class="text-xs text-slate-400 font-bold">紀錄時間：${p.createdAt}</div>
            <p class="text-slate-800 text-base leading-relaxed whitespace-pre-line font-bold">${p.content}</p>
          </div>
        `).join('');
      }
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        if (btn.dataset.cat === cat) {
          btn.className = 'cat-btn active accessible-touch-target rounded-2xl font-black text-lg transition bg-parkinson-primary text-white border-2 border-parkinson-primary';
        } else if (btn.dataset.cat === '我的收藏') {
          btn.className = 'cat-btn accessible-touch-target rounded-2xl font-black text-lg transition bg-amber-100 text-amber-900 border-2 border-amber-400';
        } else {
          btn.className = 'cat-btn accessible-touch-target rounded-2xl font-black text-lg transition bg-slate-100 text-slate-800 border-2 border-slate-300';
        }
      });
      renderPosts(mockPosts);
    }

    function handleSearch() {
      searchQuery = document.getElementById('searchInput').value.trim();
      renderPosts(mockPosts);
    }

    function resetPostForm() {
      document.getElementById('postTitle').value = '';
      document.getElementById('postContent').value = '';
      removeSelectedImage();
    }

    function saveApiUrl() {
      const url = document.getElementById('gasApiUrl').value.trim();
      if (url && !url.includes('YOUR_DEPLOYMENT_ID_HERE')) {
        GAS_API_URL = url;
        localStorage.setItem('PARKINSON_FORUM_API', url);
        isMockMode = false;
        showToast('API 已成功儲存！', 'success');
      } else {
        useMockDataMode();
      }
      loadPostsFromApi();
    }

    function useMockDataMode() {
      GAS_API_URL = DEFAULT_GAS_API_URL;
      localStorage.removeItem('PARKINSON_FORUM_API');
      isMockMode = true;
      showToast('已切換為模擬模式', 'success');
      loadPostsFromApi();
    }

    function showToast(message, type = 'success') {
      const toast = document.getElementById('toastModal');
      const toastMsg = document.getElementById('toastMessage');
      const toastIcon = document.getElementById('toastIcon');

      toastMsg.innerText = message;
      if (type === 'warning') {
        toastIcon.className = 'fa-solid fa-triangle-exclamation text-amber-400 text-2xl';
      } else if (type === 'info') {
        toastIcon.className = 'fa-solid fa-circle-info text-sky-400 text-2xl';
      } else {
        toastIcon.className = 'fa-solid fa-circle-check text-emerald-400 text-2xl';
      }

      toast.classList.remove('translate-y-32');
      setTimeout(() => {
        toast.classList.add('translate-y-32');
      }, 2500);
    }
  </script>
</body>
</html>
