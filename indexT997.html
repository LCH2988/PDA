<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>協會數位治理行動工作台</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen p-4 text-gray-800">

  <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6 space-y-6">

    <!-- 標頭 -->
    <div class="border-b pb-4">
      <h1 class="text-xl font-bold text-gray-900">人民團體治理系統</h1>
      <p id="user-info" class="text-sm text-gray-500 mt-1">連線 LINE 服務中...</p>
    </div>

    <!-- 切換頁籤 -->
    <div class="flex border-b text-sm font-medium text-center">
      <button
        id="tab-apply"
        class="flex-1 pb-2 border-b-2 border-blue-600 text-blue-600 font-bold"
        onclick="switchTab('apply')"
      >
        入會申請
      </button>

      <button
        id="tab-claim"
        class="flex-1 pb-2 text-gray-500"
        onclick="switchTab('claim')"
      >
        報銷送審
      </button>

      <button
        id="tab-audit"
        class="flex-1 pb-2 text-gray-500"
        onclick="switchTab('audit')"
      >
        預算監控
      </button>
    </div>

    <!-- 頁籤一：會員申請 -->
    <div id="panel-apply" class="space-y-4">
      <h2 class="text-md font-semibold text-gray-700">新會員資格登錄</h2>

      <div>
        <label class="block text-xs text-gray-600 mb-1">姓名</label>
        <input
          type="text"
          id="apply-name"
          class="w-full border rounded p-2 text-sm"
          placeholder="王大明"
        />
      </div>

      <div>
        <label class="block text-xs text-gray-600 mb-1">身分證字號</label>
        <input
          type="text"
          id="apply-id"
          class="w-full border rounded p-2 text-sm uppercase"
          placeholder="A123456789"
          maxlength="10"
        />
      </div>

      <div>
        <label class="block text-xs text-gray-600 mb-1">聯絡電話</label>
        <input
          type="tel"
          id="apply-phone"
          class="w-full border rounded p-2 text-sm"
          placeholder="0912-345-678"
        />
      </div>

      <div>
        <label class="block text-xs text-gray-600 mb-1">Email</label>
        <input
          type="email"
          id="apply-email"
          class="w-full border rounded p-2 text-sm"
          placeholder="user@example.com"
        />
      </div>

      <label class="flex items-start gap-2 text-xs text-gray-600">
        <input type="checkbox" id="privacy-consent" class="mt-1" />
        <span>
          我已閱讀並同意本會蒐集、處理及利用本人資料，用於入會審查、會籍管理、會費通知、會員名冊與法定會務作業。
        </span>
      </label>

      <button
        id="btn-apply"
        onclick="submitApply()"
        class="w-full bg-blue-600 text-white font-semibold py-2 rounded text-sm hover:bg-blue-700"
      >
        提交理事會審查
      </button>
    </div>

    <!-- 頁籤二：報銷申請 -->
    <div id="panel-claim" class="space-y-4 hidden">
      <h2 class="text-md font-semibold text-gray-700">專案支出報銷</h2>

      <div>
        <label class="block text-xs text-gray-600 mb-1">預算科目 ID</label>
        <input
          type="text"
          id="claim-budget-id"
          class="w-full border rounded p-2 text-sm"
          placeholder="例如：B-5101"
        />
      </div>

      <div>
        <label class="block text-xs text-gray-600 mb-1">支出事由說明</label>
        <input
          type="text"
          id="claim-title"
          class="w-full border rounded p-2 text-sm"
          placeholder="場地租借或專家出席費"
        />
      </div>

      <div>
        <label class="block text-xs text-gray-600 mb-1">報銷金額 NTD</label>
        <input
          type="number"
          id="claim-amount"
          class="w-full border rounded p-2 text-sm"
          placeholder="5000"
          min="1"
        />
      </div>

      <div>
        <label class="block text-xs text-gray-600 mb-1">拍攝憑證 / 發票</label>
        <input
          type="file"
          id="claim-receipt"
          accept="image/jpeg,image/png,image/webp"
          capture="environment"
          class="w-full text-xs"
        />
        <p class="text-xs text-gray-400 mt-1">圖片限制 5MB 以內。</p>
      </div>

      <button
        id="btn-expense"
        onclick="submitExpense()"
        class="w-full bg-emerald-600 text-white font-semibold py-2 rounded text-sm hover:bg-emerald-700"
      >
        上傳憑證並送審
      </button>
    </div>

    <!-- 頁籤三：預算與審計看板 -->
    <div id="panel-audit" class="space-y-4 hidden">
      <div class="flex items-center justify-between">
        <h2 class="text-md font-semibold text-gray-700">即時預算執行率</h2>
        <button onclick="fetchBudgets()" class="text-xs text-blue-600 underline">
          重新整理
        </button>
      </div>

      <div id="budget-list" class="space-y-2 text-xs">
        請點擊重新整理。
      </div>
    </div>

    <!-- 回饋狀態訊息 -->
    <div id="status-box" class="hidden p-3 rounded text-sm whitespace-pre-line"></div>

  </div>

  <script>
    /**
     * 請替換為正式部署值
     */
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwvLcbAu3sSMMcyaD8IfrzV-v490yaICJ3vGblwoKPrGxWD4gBJI1NpO7DKzC4nmCJdlw/exec";
    const MY_LIFF_ID = "2009456572-ZNpC8066";

    let currentProfile = null; 
    let currentIdToken = null;

    async function main() {
      try {
        await liff.init({ liffId: MY_LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        currentProfile = await liff.getProfile();
        currentIdToken = liff.getIDToken();

        if (!currentIdToken) {
          showStatus("無法取得 LINE 驗證憑證，請重新登入。", false);
          return;
        }

        document.getElementById("user-info").innerText =
          `已登入 LINE：${currentProfile.displayName}`;

      } catch (err) {
        console.error(err);
        showStatus("LIFF 初始化失敗：" + err.message, false);
      }
    }

    main();

    function switchTab(tab) {
      ["apply", "claim", "audit"].forEach(t => {
        document.getElementById(`panel-${t}`).classList.add("hidden");
        document.getElementById(`tab-${t}`).className = "flex-1 pb-2 text-gray-500";
      });

      document.getElementById(`panel-${tab}`).classList.remove("hidden");
      document.getElementById(`tab-${tab}`).className =
        "flex-1 pb-2 border-b-2 border-blue-600 text-blue-600 font-bold";

      if (tab === "audit") {
        fetchBudgets();
      }
    }

    function showStatus(msg, isSuccess) {
      const box = document.getElementById("status-box");

      box.classList.remove(
        "hidden",
        "bg-green-100",
        "text-green-800",
        "bg-red-100",
        "text-red-800",
        "bg-yellow-100",
        "text-yellow-800"
      );

      box.classList.add(
        isSuccess ? "bg-green-100" : "bg-red-100",
        isSuccess ? "text-green-800" : "text-red-800"
      );

      box.innerText = msg;
    }

    function setButtonLoading(buttonId, loadingText, isLoading) {
      const btn = document.getElementById(buttonId);

      if (isLoading) {
        btn.dataset.originalText = btn.innerText;
        btn.innerText = loadingText;
        btn.disabled = true;
        btn.classList.add("opacity-60", "cursor-not-allowed");
      } else {
        btn.innerText = btn.dataset.originalText || btn.innerText;
        btn.disabled = false;
        btn.classList.remove("opacity-60", "cursor-not-allowed");
      }
    }

    function validateTaiwanId(id) {
      return /^[A-Z][12]\d{8}$/.test(String(id).trim().toUpperCase());
    }

    function validateEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email).trim());
    }

    function validatePhone(phone) {
      return /^[0-9+\-\s()]{8,20}$/.test(String(phone).trim());
    }

    async function apiPost(action, payload) {
      try {
        if (!currentIdToken) {
          throw new Error("尚未取得 LINE 登入憑證，請重新整理或重新登入。");
        }

        const res = await fetch(GAS_WEB_APP_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            action,
            idToken: currentIdToken,
            payload
          })
        });

        const text = await res.text();

        let ret;
        try {
          ret = JSON.parse(text);
        } catch (e) {
          throw new Error("後端回傳格式錯誤：" + text.substring(0, 200));
        }

        return ret;

      } catch (err) {
        return {
          status: "error",
          message: err.message || "連線失敗"
        };
      }
    }

    async function apiGet(params) {
      try {
        const url = new URL(GAS_WEB_APP_URL);

        Object.keys(params).forEach(key => {
          url.searchParams.set(key, params[key]);
        });

        if (currentIdToken) {
          url.searchParams.set("idToken", currentIdToken);
        }

        const res = await fetch(url.toString(), {
          method: "GET"
        });

        const text = await res.text();

        let ret;
        try {
          ret = JSON.parse(text);
        } catch (e) {
          throw new Error("後端回傳格式錯誤：" + text.substring(0, 200));
        }

        return ret;

      } catch (err) {
        return {
          status: "error",
          message: err.message || "連線失敗"
        };
      }
    }

    async function submitApply() {
      const name = document.getElementById("apply-name").value.trim();
      const idCard = document.getElementById("apply-id").value.trim().toUpperCase();
      const phone = document.getElementById("apply-phone").value.trim();
      const email = document.getElementById("apply-email").value.trim();
      const consent = document.getElementById("privacy-consent").checked;

      if (!name) {
        showStatus("請輸入姓名。", false);
        return;
      }

      if (!validateTaiwanId(idCard)) {
        showStatus("請輸入正確的身分證字號格式。", false);
        return;
      }

      if (!validatePhone(phone)) {
        showStatus("請輸入正確的聯絡電話。", false);
        return;
      }

      if (!validateEmail(email)) {
        showStatus("請輸入正確的 Email。", false);
        return;
      }

      if (!consent) {
        showStatus("請先勾選個資蒐集、處理及利用同意聲明。", false);
        return;
      }

      const payload = {
        name,
        idCard,
        phone,
        email,
        privacyConsent: true
      };

      setButtonLoading("btn-apply", "送出中...", true);

      const ret = await apiPost("applyMembership", payload);

      setButtonLoading("btn-apply", "", false);

      if (ret.status === "success") {
        showStatus(ret.data.message, true);
      } else {
        showStatus(ret.message, false);
      }
    }

    async function submitExpense() {
      const budgetId = document.getElementById("claim-budget-id").value.trim();
      const title = document.getElementById("claim-title").value.trim();
      const amount = Number(document.getElementById("claim-amount").value);
      const fileInput = document.getElementById("claim-receipt");

      if (!budgetId) {
        showStatus("請輸入預算科目 ID。", false);
        return;
      }

      if (!title) {
        showStatus("請輸入支出事由。", false);
        return;
      }

      if (!Number.isFinite(amount) || amount <= 0) {
        showStatus("請輸入有效的報銷金額。", false);
        return;
      }

      let base64Image = null;
      let fileName = null;
      let mimeType = null;

      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];

        if (file.size > 5 * 1024 * 1024) {
          showStatus("圖片不可超過 5MB，請重新拍攝或壓縮後上傳。", false);
          return;
        }

        if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
          showStatus("僅支援 JPG、PNG、WEBP 圖片格式。", false);
          return;
        }

        fileName = file.name;
        mimeType = file.type;

        base64Image = await new Promise((resolve, reject) => {
          const reader = new FileReader();

          reader.onload = e => resolve(e.target.result);
          reader.onerror = () => reject(new Error("圖片讀取失敗"));

          reader.readAsDataURL(file);
        });
      }

      const payload = {
        budgetId,
        applicantName: currentProfile ? currentProfile.displayName : "LINE 使用者",
        title,
        amount,
        base64Image,
        fileName,
        mimeType
      };

      setButtonLoading("btn-expense", "送審中...", true);

      const ret = await apiPost("submitExpense", payload);

      setButtonLoading("btn-expense", "", false);

      if (ret.status === "success") {
        let msg = `報銷送審成功\n單號：${ret.data.expenseId}`;

        if (ret.data.warning) {
          msg += `\n${ret.data.warning}`;
        }

        showStatus(msg, true);
      } else {
        showStatus(ret.message, false);
      }
    }

    async function fetchBudgets() {
      const list = document.getElementById("budget-list");
      list.innerHTML = "載入中...";

      const ret = await apiGet({
        action: "getBudgetStatus"
      });

      if (ret.status !== "success") {
        list.innerHTML = `<div class="p-2 bg-red-50 text-red-700 rounded">${ret.message}</div>`;
        return;
      }

      if (!ret.data || ret.data.length === 0) {
        list.innerHTML = `<div class="p-2 bg-gray-50 rounded">目前沒有預算資料。</div>`;
        return;
      }

      list.innerHTML = ret.data.map(b => {
        const rate = b.netBudget > 0 ? ((b.approvedSpent + b.pendingReserved) / b.netBudget * 100).toFixed(1) : "0.0";
        const isOverWarning = Number(rate) >= 85;

        return `
          <div class="p-3 border rounded bg-gray-50 space-y-1">
            <div class="font-bold">${escapeHtml(b.subject)} (${escapeHtml(b.id)})</div>
            <div>工作計畫：${escapeHtml(b.plan)}</div>
            <div>法定預算：NT$ ${formatNumber(b.netBudget)}</div>
            <div>已核准使用：NT$ ${formatNumber(b.approvedSpent)}</div>
            <div>待審占用：NT$ ${formatNumber(b.pendingReserved)}</div>
            <div>
              可用餘額：
              <span class="${b.availableBalance < 0 ? "text-red-600 font-bold" : "text-emerald-700 font-bold"}">
                NT$ ${formatNumber(b.availableBalance)}
              </span>
            </div>
            <div class="${isOverWarning ? "text-red-600 font-bold" : "text-gray-500"}">
              使用率含待審：${rate}%
            </div>
          </div>
        `;
      }).join("");
    }

    function formatNumber(n) {
      return Number(n || 0).toLocaleString("zh-TW");
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
