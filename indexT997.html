<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>協會數位治理行動工作台</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 text-gray-800">

  <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6 space-y-6">
    
    <!-- 標頭 -->
    <div class="border-b pb-4">
      <h1 class="text-xl font-bold text-gray-900">人民團體治理系統</h1>
      <p id="user-info" class="text-sm text-gray-500 mt-1">連線 LINE 服務中...</p>
    </div>

    <!-- 切換頁籤 -->
    <div class="flex border-b text-sm font-medium text-center">
      <button id="tab-apply" class="flex-1 pb-2 border-b-2 border-blue-600 text-blue-600" onclick="switchTab('apply')">入會申請</button>
      <button id="tab-claim" class="flex-1 pb-2 text-gray-500" onclick="switchTab('claim')">報銷送審(拍照)</button>
      <button id="tab-audit" class="flex-1 pb-2 text-gray-500" onclick="switchTab('audit')">預算監控</button>
    </div>

    <!-- 頁籤一：會員申請 -->
    <div id="panel-apply" class="space-y-4">
      <h2 class="text-md font-semibold text-gray-700">新會員資格登錄</h2>
      <div>
        <label class="block text-xs text-gray-600 mb-1">姓名</label>
        <input type="text" id="apply-name" class="w-full border rounded p-2 text-sm" placeholder="王大明">
      </div>
      <div>
        <label class="block text-xs text-gray-600 mb-1">身分證字號</label>
        <input type="text" id="apply-id" class="w-full border rounded p-2 text-sm" placeholder="A123456789">
      </div>
      <div>
        <label class="block text-xs text-gray-600 mb-1">聯絡電話</label>
        <input type="tel" id="apply-phone" class="w-full border rounded p-2 text-sm" placeholder="0912-345-678">
      </div>
      <div>
        <label class="block text-xs text-gray-600 mb-1">Email</label>
        <input type="email" id="apply-email" class="w-full border rounded p-2 text-sm" placeholder="user@ngo.tw">
      </div>
      <button onclick="submitApply()" class="w-full bg-blue-600 text-white font-semibold py-2 rounded text-sm hover:bg-blue-700">提交理事會審查</button>
    </div>

    <!-- 頁籤二：報銷申請與發票拍照 -->
    <div id="panel-claim" class="space-y-4 hidden">
      <h2 class="text-md font-semibold text-gray-700">專案支出報銷 (綁定預算防爆)</h2>
      <div>
        <label class="block text-xs text-gray-600 mb-1">預算科目 ID</label>
        <input type="text" id="claim-budget-id" class="w-full border rounded p-2 text-sm" placeholder="例如：B-5101">
      </div>
      <div>
        <label class="block text-xs text-gray-600 mb-1">支出事由說明</label>
        <input type="text" id="claim-title" class="w-full border rounded p-2 text-sm" placeholder="場地租借或專家出席費">
      </div>
      <div>
        <label class="block text-xs text-gray-600 mb-1">報銷金額 (NTD)</label>
        <input type="number" id="claim-amount" class="w-full border rounded p-2 text-sm" placeholder="5000">
      </div>
      <div>
        <label class="block text-xs text-gray-600 mb-1">拍攝憑證/發票載具</label>
        <input type="file" id="claim-receipt" accept="image/*" capture="environment" class="w-full text-xs">
      </div>
      <button onclick="submitExpense()" class="w-full bg-emerald-600 text-white font-semibold py-2 rounded text-sm hover:bg-emerald-700">上傳憑證並送審</button>
    </div>

    <!-- 頁籤三：預算與審計看板 -->
    <div id="panel-audit" class="space-y-4 hidden">
      <h2 class="text-md font-semibold text-gray-700">即時預算執行率 (監事唯讀)</h2>
      <button onclick="fetchBudgets()" class="text-xs text-blue-600 underline">重新整理預算餘額</button>
      <div id="budget-list" class="space-y-2 text-xs">
        載入中...
      </div>
    </div>

    <!-- 回饋狀態訊息 -->
    <div id="status-box" class="hidden p-3 rounded text-sm"></div>

  </div>

  <script>
    // 請替換為您的 GAS 部署 Web App URL 與 LIFF ID
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyw-oH3sREKVJoMCgxt0ap286VIpS2Z_tnN_F10QjCDhYfAr_skFUenUE7nt8jG7XMaXQ/exec";
    const MY_LIFF_ID = "2009456572-ZNpC8066";

    let currentLineUid = "U_DEMO_USER_001"; // 本地測試預設值

    async function main() {
      try {
        await liff.init({ liffId: MY_LIFF_ID });
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          currentLineUid = profile.userId;
          document.getElementById('user-info').innerText = `已登入: ${profile.displayName}`;
        } else {
          document.getElementById('user-info').innerText = "未登入 LINE (使用測試環境)";
        }
      } catch (e) {
        console.warn("LIFF 初始化略過，進入獨立模式", e);
      }
    }
    main();

    function switchTab(tab) {
      ['apply', 'claim', 'audit'].forEach(t => {
        document.getElementById(`panel-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).className = "flex-1 pb-2 text-gray-500";
      });
      document.getElementById(`panel-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).className = "flex-1 pb-2 border-b-2 border-blue-600 text-blue-600 font-bold";
      if(tab === 'audit') fetchBudgets();
    }

    function showStatus(msg, isSuccess) {
      const box = document.getElementById("status-box");
      box.classList.remove("hidden", "bg-green-100", "text-green-800", "bg-red-100", "text-red-800");
      box.classList.add(isSuccess ? "bg-green-100" : "bg-red-100", isSuccess ? "text-green-800" : "text-red-800");
      box.innerText = msg;
    }

    async function submitApply() {
      const payload = {
        lineUid: currentLineUid,
        name: document.getElementById("apply-name").value,
        idCard: document.getElementById("apply-id").value,
        phone: document.getElementById("apply-phone").value,
        email: document.getElementById("apply-email").value
      };
      const res = await fetch(GAS_WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify({ action: "applyMembership", payload })
      });
      const ret = await res.json();
      showStatus(ret.status === "success" ? ret.data.message : ret.message, ret.status === "success");
    }

    async function submitExpense() {
      const fileInput = document.getElementById("claim-receipt");
      let base64 = null;
      if (fileInput.files.length > 0) {
        base64 = await new Promise(resolve => {
          const r = new FileReader();
          r.onload = e => resolve(e.target.result);
          r.readAsDataURL(fileInput.files[0]);
        });
      }

      const payload = {
        operatorLineUid: currentLineUid,
        budgetId: document.getElementById("claim-budget-id").value,
        applicantName: "專案人員",
        title: document.getElementById("claim-title").value,
        amount: document.getElementById("claim-amount").value,
        base64Image: base64
      };

      const res = await fetch(GAS_WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify({ action: "submitExpense", payload })
      });
      const ret = await res.json();
      if (ret.status === "success") {
        let msg = `報銷成功 (單號: ${ret.data.expenseId})`;
        if (ret.data.warning) msg += `\n${ret.data.warning}`;
        showStatus(msg, true);
      } else {
        showStatus(ret.message, false);
      }
    }

    async function fetchBudgets() {
      const res = await fetch(`${GAS_WEB_APP_URL}?action=getBudgetStatus`);
      const ret = await res.json();
      if(ret.status === "success") {
        const list = document.getElementById("budget-list");
        list.innerHTML = ret.data.map(b => `
          <div class="p-2 border rounded bg-gray-50">
            <div class="font-bold">${b.subject} (${b.id})</div>
            <div>總預算: ${b.budget} | 已用: ${b.spent} | 剩餘: <span class="${b.balance < 0 ? 'text-red-600 font-bold':''}">${b.balance}</span></div>
          </div>
        `).join('');
      }
    }
  </script>
</body>
</html>
