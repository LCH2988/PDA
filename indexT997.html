<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣帕金森病友權益促進會 管理系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone for JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto+Sans+TC', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, createElement } = React;

        function App() {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [gasUrl, setGasUrl] = useState(localStorage.getItem('tppa_gas_url') || '');
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [user, setUser] = useState(null);
            const [currentTab, setCurrentTab] = useState('dashboard');
            const [loading, setLoading] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');
            const [successMsg, setSuccessMsg] = useState('');

            // Data states
            const [members, setMembers] = useState([]);
            const [finances, setFinances] = useState([]);
            const [receipts, setReceipts] = useState([]);
            const [reportData, setReportData] = useState(null);

            // Modal states
            const [showMemberModal, setShowMemberModal] = useState(false);
            const [currentMember, setCurrentMember] = useState(null);
            const [showExpenseModal, setShowExpenseModal] = useState(false);
            const [expenseForm, setExpenseForm] = useState({ 類別: '行政費用', 金額: '', 摘要: '', 憑證連結: '' });

            const callGAS = async (action, payload = {}) => {
                if (!gasUrl) {
                    throw new Error('請先設定 Google Apps Script Web App URL');
                }
                setLoading(true);
                setErrorMsg('');
                setSuccessMsg('');
                try {
                    const response = await fetch(gasUrl, {
                        method: 'POST',
                        mode: 'cors',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action, payload })
                    });
                    const resJson = await response.json();
                    if (resJson.status === 'error') {
                        throw new Error(resJson.message);
                    }
                    return resJson;
                } catch (err) {
                    setErrorMsg(err.message);
                    throw err;
                } finally {
                    setLoading(false);
                }
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                localStorage.setItem('tppa_gas_url', gasUrl);
                try {
                    const res = await callGAS('login', { email, password });
                    setUser(res.user);
                    setIsLoggedIn(true);
                    setSuccessMsg('登入成功！');
                    loadAllData();
                } catch (err) {
                    // Handled in callGAS
                }
            };

            const loadAllData = async () => {
                try {
                    const memRes = await callGAS('getMembers');
                    setMembers(memRes.data || []);
                    const finRes = await callGAS('getFinances');
                    setFinances(finRes.data || []);
                    const recRes = await callGAS('getReceipts');
                    setReceipts(recRes.data || []);
                    const repRes = await callGAS('getReports');
                    setReportData(repRes.report || null);
                } catch (err) {
                    console.error('資料載入失敗', err);
                }
            };

            useEffect(() => {
                if (isLoggedIn) {
                    loadAllData();
                }
            }, [isLoggedIn]);

            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-emerald-50 to-teal-100 p-4">
                        <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-emerald-100">
                            <div className="text-center mb-8">
                                <div className="bg-emerald-600 text-white w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold shadow-md">
                                    帕
                                </div>
                                <h1 className="text-2xl font-bold text-slate-800">台灣帕金森病友權益促進會</h1>
                                <p className="text-sm text-slate-500 mt-1">管理系統後台登入</p>
                            </div>

                            {errorMsg && <div className="mb-4 p-3 bg-red-50 text-red-700 text-sm rounded-lg border border-red-200">{errorMsg}</div>}
                            {successMsg && <div className="mb-4 p-3 bg-emerald-50 text-emerald-700 text-sm rounded-lg border border-emerald-200">{successMsg}</div>}

                            <form onSubmit={handleLogin} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1">GAS 網頁應用程式 URL</label>
                                    <input 
                                        type="text" 
                                        required
                                        value={gasUrl}
                                        onChange={(e) => setGasUrl(e.target.value)}
                                        placeholder="https://script.google.com/macros/s/.../exec"
                                        className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1">電子郵件</label>
                                    <input 
                                        type="email" 
                                        required
                                        value={email}
                                        onChange={(e) => setEmail(e.target.value)}
                                        placeholder="admin@tppa.org.tw"
                                        className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1">密碼</label>
                                    <input 
                                        type="password" 
                                        required
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                        placeholder="預設: Admin@2024"
                                        className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                                    />
                                </div>
                                <button 
                                    type="submit" 
                                    disabled={loading}
                                    className="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-lg shadow transition-all disabled:opacity-50"
                                >
                                    {loading ? '登入中...' : '登入系統'}
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col md:flex-row">
                    {/* Sidebar Navigation */}
                    <aside className="w-full md:w-64 bg-slate-900 text-slate-300 flex flex-col justify-between">
                        <div>
                            <div className="p-6 border-b border-slate-800">
                                <h2 className="text-lg font-bold text-white">TPPA 管理系統</h2>
                                <p className="text-xs text-emerald-400 mt-1">身份：{user?.name} ({user?.role})</p>
                            </div>
                            <nav className="p-4 space-y-1">
                                {[
                                    { id: 'dashboard', label: '儀表板總覽' },
                                    { id: 'members', label: '會員與會費管理' },
                                    { id: 'finance', label: '收支與簽核管理' },
                                    { id: 'receipts', label: '電子收據管理' },
                                    { id: 'reports', label: '財務報表專區' },
                                ].map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setCurrentTab(tab.id)}
                                        className={`w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium transition-colors ${currentTab === tab.id ? 'bg-emerald-600 text-white' : 'hover:bg-slate-800 text-slate-400 hover:text-white'}`}
                                    >
                                        {tab.label}
                                    </button>
                                ))}
                            </nav>
                        </div>
                        <div className="p-4 border-t border-slate-800">
                            <button 
                                onClick={() => setIsLoggedIn(false)}
                                className="w-full py-2 bg-slate-800 hover:bg-red-600 hover:text-white text-slate-300 rounded-lg text-sm font-medium transition-all"
                            >
                                登出系統
                            </button>
                        </div>
                    </aside>

                    {/* Main Content Area */}
                    <main className="flex-1 p-6 md:p-10 overflow-y-auto">
                        {loading && <div className="mb-4 text-xs text-emerald-600 font-medium animate-pulse">資料同步處理中...</div>}
                        {errorMsg && <div className="mb-4 p-3 bg-red-50 text-red-700 text-sm rounded-lg border border-red-200">{errorMsg}</div>}
                        {successMsg && <div className="mb-4 p-3 bg-emerald-50 text-emerald-700 text-sm rounded-lg border border-emerald-200">{successMsg}</div>}

                        {}
                        {currentTab === 'dashboard' && (
                            <div className="space-y-6">
                                <h1 className="text-2xl font-bold text-slate-800">儀表板總覽</h1>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                        <p className="text-xs font-semibold text-slate-400 uppercase tracking-wider">總會員人數</p>
                                        <p className="text-3xl font-bold text-slate-800 mt-2">{members.length}</p>
                                    </div>
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                        <p className="text-xs font-semibold text-slate-400 uppercase tracking-wider">總收入金額</p>
                                        <p className="text-3xl font-bold text-emerald-600 mt-2">${reportData?.totalIncome?.toLocaleString() || 0}</p>
                                    </div>
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                        <p className="text-xs font-semibold text-slate-400 uppercase tracking-wider">總支出金額</p>
                                        <p className="text-3xl font-bold text-red-600 mt-2">${reportData?.totalExpense?.toLocaleString() || 0}</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {}
                        {currentTab === 'members' && (
                            <div className="space-y-6">
                                <div className="flex justify-between items-center">
                                    <h1 className="text-2xl font-bold text-slate-800">會員與會費管理</h1>
                                    <button 
                                        onClick={() => { setCurrentMember({ 姓名: '', Email: '', 電話: '', 會籍狀態: '一般有效' }); setShowMemberModal(true); }}
                                        className="px-4 py-2 bg-emerald-600 text-white rounded-lg text-sm font-medium hover:bg-emerald-700 shadow"
                                    >
                                        新增會員
                                    </button>
                                </div>
                                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                    <table className="w-full text-left border-collapse text-sm">
                                        <thead>
                                            <tr className="bg-slate-50 border-b border-slate-200 text-slate-600">
                                                <th className="p-4 font-semibold">編號</th>
                                                <th className="p-4 font-semibold">姓名</th>
                                                <th className="p-4 font-semibold">Email</th>
                                                <th className="p-4 font-semibold">電話</th>
                                                <th className="p-4 font-semibold">會籍狀態</th>
                                                <th className="p-4 font-semibold">有效期限</th>
                                                <th className="p-4 font-semibold">操作</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {members.map((m, idx) => (
                                                <tr key={idx} className="hover:bg-slate-50">
                                                    <td className="p-4 text-slate-600">{m.ID}</td>
                                                    <td className="p-4 font-medium text-slate-800">{m.姓名}</td>
                                                    <td className="p-4 text-slate-600">{m.Email}</td>
                                                    <td className="p-4 text-slate-600">{m.電話}</td>
                                                    <td className="p-4">
                                                        <span className={`px-2.5 py-1 rounded-full text-xs font-semibold ${m.會籍狀態 === '一般有效' ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'}`}>
                                                            {m.會籍狀態}
                                                        </span>
                                                    </td>
                                                    <td className="p-4 text-slate-600">{m.有效期限}</td>
                                                    <td className="p-4 space-x-2">
                                                        <button 
                                                            onClick={async () => {
                                                                await callGAS('payDues', { ID: m.ID, 金額: 1000 });
                                                                setSuccessMsg(`已完成 ${m.姓名} 的會費繳納`);
                                                                loadAllData();
                                                            }}
                                                            className="text-xs text-emerald-600 hover:underline font-medium"
                                                        >
                                                            繳年費
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {}
                        {currentTab === 'finance' && (
                            <div className="space-y-6">
                                <div className="flex justify-between items-center">
                                    <h1 className="text-2xl font-bold text-slate-800">收支與三級簽核管理</h1>
                                    <button 
                                        onClick={() => setShowExpenseModal(true)}
                                        className="px-4 py-2 bg-emerald-600 text-white rounded-lg text-sm font-medium hover:bg-emerald-700 shadow"
                                    >
                                        提交支出申請
                                    </button>
                                </div>
                                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                    <table className="w-full text-left border-collapse text-sm">
                                        <thead>
                                            <tr className="bg-slate-50 border-b border-slate-200 text-slate-600">
                                                <th className="p-4 font-semibold">單號</th>
                                                <th className="p-4 font-semibold">類型</th>
                                                <th className="p-4 font-semibold">類別</th>
                                                <th className="p-4 font-semibold">金額</th>
                                                <th className="p-4 font-semibold">摘要</th>
                                                <th className="p-4 font-semibold">經辦人</th>
                                                <th className="p-4 font-semibold">簽核狀態</th>
                                                <th className="p-4 font-semibold">審核動作</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {finances.map((f, idx) => (
                                                <tr key={idx} className="hover:bg-slate-50">
                                                    <td className="p-4 text-slate-600">{f.單號}</td>
                                                    <td className="p-4">
                                                        <span className={`px-2 py-0.5 rounded text-xs font-semibold ${f.類型 === '收入' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}`}>
                                                            {f.類型}
                                                        </span>
                                                    </td>
                                                    <td className="p-4 text-slate-600">{f.類別}</td>
                                                    <td className="p-4 font-bold text-slate-800">${f.金額?.toLocaleString()}</td>
                                                    <td className="p-4 text-slate-600">{f.摘要}</td>
                                                    <td className="p-4 text-slate-600">{f.經辦人}</td>
                                                    <td className="p-4 text-xs font-semibold text-slate-700">{f.簽核狀態}</td>
                                                    <td className="p-4 space-x-2">
                                                        {f.類型 === '支出' && !f.簽核狀態.includes('已放行') && (
                                                            <>
                                                                <button 
                                                                    onClick={async () => {
                                                                        await callGAS('auditExpense', { 單號: f.單號, 審核動作: 'approve', 角色: user.role, 金額: f.金額 });
                                                                        setSuccessMsg('已核准簽核');
                                                                        loadAllData();
                                                                    }}
                                                                    className="px-2.5 py-1 bg-emerald-600 text-white rounded text-xs"
                                                                >
                                                                    核准
                                                                </button>
                                                            </>
                                                        )}
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {}
                        {currentTab === 'receipts' && (
                            <div className="space-y-6">
                                <h1 className="text-2xl font-bold text-slate-800">電子收據管理</h1>
                                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                    <table className="w-full text-left border-collapse text-sm">
                                        <thead>
                                            <tr className="bg-slate-50 border-b border-slate-200 text-slate-600">
                                                <th className="p-4 font-semibold">收據號碼</th>
                                                <th className="p-4 font-semibold">開立日期</th>
                                                <th className="p-4 font-semibold">買受人</th>
                                                <th className="p-4 font-semibold">金額</th>
                                                <th className="p-4 font-semibold">摘要</th>
                                                <th className="p-4 font-semibold">作廢狀態</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {receipts.map((r, idx) => (
                                                <tr key={idx} className="hover:bg-slate-50">
                                                    <td className="p-4 font-medium text-slate-800">{r.收據號碼}</td>
                                                    <td className="p-4 text-slate-600">{r.開立日期}</td>
                                                    <td className="p-4 text-slate-600">{r.買受人}</td>
                                                    <td className="p-4 font-bold text-slate-800">${r.金額?.toLocaleString()}</td>
                                                    <td className="p-4 text-slate-600">{r.摘要}</td>
                                                    <td className="p-4 text-slate-600">{r.作廢狀態 || '有效'}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {}
                        {currentTab === 'reports' && (
                            <div className="space-y-6">
                                <h1 className="text-2xl font-bold text-slate-800">財務報表專區</h1>
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                                    <h2 className="text-lg font-bold text-slate-800">年度收支決算摘要</h2>
                                    <div className="grid grid-cols-3 gap-4 border-b pb-4">
                                        <div>
                                            <p className="text-xs text-slate-400">總收入</p>
                                            <p className="text-xl font-bold text-emerald-600">${reportData?.totalIncome?.toLocaleString() || 0}</p>
                                        </div>
                                        <div>
                                            <p className="text-xs text-slate-400">總支出</p>
                                            <p className="text-xl font-bold text-red-600">${reportData?.totalExpense?.toLocaleString() || 0}</p>
                                        </div>
                                        <div>
                                            <p className="text-xs text-slate-400">結餘</p>
                                            <p className="text-xl font-bold text-slate-800">${reportData?.balance?.toLocaleString() || 0}</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Expense Submit Modal */}
                        {showExpenseModal && (
                            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4">
                                <div className="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md space-y-4">
                                    <h3 className="text-lg font-bold">提交支出申請</h3>
                                    <form onSubmit={async (e) => {
                                        e.preventDefault();
                                        await callGAS('submitExpense', { ...expenseForm, 經辦人: user.name });
                                        setSuccessMsg('支出申請提交成功');
                                        setShowExpenseModal(false);
                                        loadAllData();
                                    }} className="space-y-3">
                                        <div>
                                            <label className="block text-xs font-semibold mb-1">類別</label>
                                            <input type="text" value={expenseForm.類別} onChange={e=>setExpenseForm({...expenseForm, 類別: e.target.value})} className="w-full p-2 border rounded text-sm" required />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold mb-1">金額</label>
                                            <input type="number" value={expenseForm.金額} onChange={e=>setExpenseForm({...expenseForm, 金額: e.target.value})} className="w-full p-2 border rounded text-sm" required />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold mb-1">摘要</label>
                                            <input type="text" value={expenseForm.摘要} onChange={e=>setExpenseForm({...expenseForm, 摘要: e.target.value})} className="w-full p-2 border rounded text-sm" required />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold mb-1">憑證 Google Drive 連結</label>
                                            <input type="text" value={expenseForm.憑證連結} onChange={e=>setExpenseForm({...expenseForm, 憑證連結: e.target.value})} className="w-full p-2 border rounded text-sm" />
                                        </div>
                                        <div className="flex justify-end space-x-2 pt-2">
                                            <button type="button" onClick={()=>setShowExpenseModal(false)} className="px-4 py-2 border rounded text-sm">取消</button>
                                            <button type="submit" className="px-4 py-2 bg-emerald-600 text-white rounded text-sm font-medium">送出</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
