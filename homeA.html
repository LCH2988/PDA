    function openAdminLogin() {
      $('modal-title').textContent = '工作人員 CMS 登入';
      $('modal-form').innerHTML = `
        <p style="font-size:0.9rem;">請輸入個人帳號與密碼（預設管理者帳號為 <strong>master</strong>，密碼請輸入指令碼屬性設定的 <code>ADMIN_PASS</code>）。</p>

        <button type="submit" class="btn btn-primary">登入維護工作區</button>
      `;
      $('modal-form').onsubmit = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const account = fd.get('account');
        const secret = fd.get('secret');
        if (state.isDemoMode) {
          state.auth = { loggedIn: true, account, secret, name: '示範管理者', role: '系統管理者' };
          closeModal();
          applyGlobalSettingsToChrome();
          showToast('已登入示範維護工作區');
          go('admin');
          return;
        }
        showToast('正在驗證帳號權限...');
        const res = await postGas({ action: 'AUTH_CHECK', account, secret });
        if (res.success) {
          state.auth = { loggedIn: true, account, secret, name: res.user.name, role: res.user.role };
          closeModal();
          await fetchAllData();
          showToast(`歡迎回來，${res.user.name}！`);
          go('admin');
        }
      };
      $('editor-modal').classList.remove('hidden');
    }

                  <option value="events" ${mod==='events'?'selected':''}>活動行事曆</option>
                  <option value="finance" ${mod==='finance'?'selected':''}>財務公開</option>
                  <option value="dreamTour" ${mod==='dreamTour'?'selected':''}>圓夢之旅</option>

              <button type="button" class="btn btn-sm btn-primary" onclick="openItemEditor('${mod}','CREATE')">＋ 新增資料</button>
            </div>
            <div class="grid mt-2">
              ${list.map(x => `
                <div class="between" style="border-bottom:1px solid var(--border); padding-bottom:10px;">
                  <div>
                    <span class="badge">${esc(x.status)}</span>
                    <strong>${esc(x.title || x.name || x.question || x.scenario || x.dayNo)}</strong>

                  <div class="flex-wrap">
                    <button type="button" class="btn btn-sm btn-teal" onclick="openItemEditor('${mod}','UPDATE','${esc(x.id)}')">修改</button>
                    <button type="button" class="btn btn-sm btn-danger" onclick="trashItem('${mod}','${esc(x.id)}')">移至回收桶</button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

      }
      if (state.ui.cmsTab === 'trash') {
        const trashed = [];
        ['news', 'edu', 'faq', 'exercises', 'events'].forEach(m => {
          (state.data[m] || []).filter(x => x.status === '回收桶').forEach(x => trashed.push({ mod: m, item: x }));
        });
        return `
          <div class="card">
            <h2>回收桶（保存期內可復原為「已下架」）</h2>

    function editSetting(key) {
      const s = state.data.settings.find(x => x.key === key);
      if (!s) return;
      $('modal-title').textContent = '修改固定內容：' + s.desc;
      $('modal-form').innerHTML = `
        <div class="notice-box">影響範圍：${esc(s.impactScope)}</div>
        <div><label for="set-val">新設定值</label><textarea id="set-val" name="value" required>${esc(s.value)}</textarea></div>
        <button type="submit" class="btn btn-primary">確認發布並全站同步</button>
      `;
      $('modal-form').onsubmit = async (e) => {
        e.preventDefault();
        const val = new FormData(e.target).get('value');
        if (state.isDemoMode) {
          s.value = val;
        } else {
          const res = await postGas({ action: 'UPDATE_SETTING', item: { key, value: val } });
          if (!res.success) return;
          await fetchAllData();
        }
        closeModal();
        applyGlobalSettingsToChrome();
        showToast('設定已更新並全站同步');
        renderAdminDashboard();
      };
      $('editor-modal').classList.remove('hidden');
    }

    async function toggleMaintMode() {
      const next = getSetting('MAINTENANCE_MODE') === 'ON' ? 'OFF' : 'ON';
      if (state.isDemoMode) {
        const s = state.data.settings.find(x => x.key === 'MAINTENANCE_MODE');
        if (s) s.value = next;
      } else {
        const res = await postGas({ action: 'UPDATE_SETTING', item: { key: 'MAINTENANCE_MODE', value: next } });
        if (!res.success) return;
        await fetchAllData();
      }
      applyGlobalSettingsToChrome();
      showToast(next === 'ON' ? '已開啟「網站維護中」全站遮罩' : '已解除維護模式，網站恢復正常開放');
      renderAdminDashboard();
    }

    function openItemEditor(mod, action, id = '') {
      const existing = action === 'UPDATE' ? (state.data[mod] || []).find(x => x.id === id) || {} : {};
      $('modal-title').textContent = (action === 'CREATE' ? '新增' : '修改') + '內容 (' + mod + ')';
      $('modal-form').innerHTML = `
        <div><label>標題／名稱</label><input type="text" name="title" required value="${esc(existing.title || existing.name || existing.question || '')}"></div>
        <div><label>摘要／說明內容</label><textarea name="summary">${esc(existing.summary || existing.desc || existing.answer || existing.content || existing.locationDesc || '')}</textarea></div>
        ${(mod === 'edu' || mod === 'exercises') ? `
          <div class="notice-box">醫療審閱合規：發布前須填寫審閱醫師與審閱日期</div>
          <div><label>審閱醫師／治療師</label><input type="text" name="reviewer" value="${esc(existing.reviewer || '')}"></div>
          <div><label>審閱日期</label><input type="date" name="reviewDate" value="${esc(existing.reviewDate || '')}"></div>
        ` : ''}
        ${mod === 'stats' ? `
          <div><label>數值（無資料請留空）</label><input type="text" name="value" value="${esc(existing.value || '')}"></div>
          <div><label>資料截至時間</label><input type="date" name="dataAsOf" value="${esc(existing.dataAsOf || '')}"></div>
        ` : ''}
        <div><label>發布狀態</label>
          <select name="status">
            <option ${existing.status==='草稿'?'selected':''}>草稿</option>
            <option ${existing.status==='待審核'?'selected':''}>待審核</option>
            <option ${existing.status==='已發布'?'selected':''}>已發布</option>
            <option ${existing.status==='已下架'?'selected':''}>已下架</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary">儲存</button>
      `;
      $('modal-form').onsubmit = async (e) => {
        e.preventDefault();
        const item = Object.fromEntries(new FormData(e.target).entries());
        if (id) item.id = id;
        if (mod === 'stats') item.name = item.title;
        if (mod === 'faq') { item.question = item.title; item.answer = item.summary; }
        if (mod === 'exercises') item.desc = item.summary;
        if (mod === 'events') item.locationDesc = item.summary;
        if (mod === 'quotes') item.content = item.summary;

        if ((mod === 'edu' || mod === 'exercises') && item.status === '已發布' && (!item.reviewer || !item.reviewDate)) {
          showToast('合規攔截：醫療與運動內容必須填寫「審閱醫師」與「審閱日期」才能發布！');
          return;
        }

        if (state.isDemoMode) {
          if (action === 'CREATE') {
            item.id = mod.toUpperCase() + '_' + Date.now();
            state.data[mod].unshift(item);
          } else {
            const idx = state.data[mod].findIndex(x => x.id === id);
            if (idx > -1) state.data[mod][idx] = { ...state.data[mod][idx], ...item };
          }
        } else {
          const res = await postGas({ action, module: mod, item });
          if (!res.success) return;
          await fetchAllData();
        }
        closeModal();
        showToast('資料已儲存並同步！');
        renderAdminDashboard();
      };
      $('editor-modal').classList.remove('hidden');
    }

    function trashItem(mod, id) {
      openConfirmDialog('移至回收桶確認', '確定要將此筆資料移至回收桶嗎？（移入後前台不再顯示，保存期內可隨時復原）', async () => {
        if (state.isDemoMode) {
          const it = state.data[mod].find(x => x.id === id);
          if (it) it.status = '回收桶';
        } else {
          const res = await postGas({ action: 'TRASH', module: mod, item: { id } });
          if (!res.success) return;
          await fetchAllData();
        }
        showToast('已移至回收桶');
        renderAdminDashboard();
      });
    }

    async function restoreItem(mod, id) {
      if (state.isDemoMode) {
        const it = state.data[mod].find(x => x.id === id);
        if (it) it.status = '已下架';
      } else {
        const res = await postGas({ action: 'RESTORE', module: mod, item: { id } });
        if (!res.success) return;
        await fetchAllData();
      }
      showToast('已從回收桶復原為「已下架」狀態');
      renderAdminDashboard();
    }

    function permDeleteItem(mod, id) {
      openConfirmDialog('永久刪除警告', '此操作將永久移除資料且無法復原！', async () => {
        if (state.isDemoMode) {
          state.data[mod] = state.data[mod].filter(x => x.id !== id);
        } else {
          const res = await postGas({ action: 'PERMANENT_DELETE', module: mod, item: { id } });
          if (!res.success) return;
          await fetchAllData();
        }
        showToast('已永久刪除該筆資料');
        renderAdminDashboard();
      }, 'DELETE');
    }

    function exportBackupJson() {
      const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'tpda_cms_backup_' + new Date().toISOString().slice(0, 10) + '.json';
      a.click();
    }

    function closeModal() { $('editor-modal').classList.add('hidden'); }

    // ==================== API 與無障礙控制 ====================
    async function fetchAllData() {
      if (state.isDemoMode) return;
      try {
        const mode = state.auth.loggedIn ? `&mode=admin&account=${encodeURIComponent(state.auth.account)}&secret=${encodeURIComponent(state.auth.secret)}` : '';
        const res = await fetch(`${GAS_API_URL}?t=${Date.now()}${mode}`);
        const json = await res.json();
        if (json.success && json.data) {
          Object.keys(json.data).forEach(k => {
            if (Array.isArray(json.data[k]) && json.data[k].length > 0) {
              state.data[k] = json.data[k];
            }
          });
          applyGlobalSettingsToChrome();
        }
      } catch (err) {
        console.warn('遠端資料同步異常，維持預設顯示：', err);
      }
    }

    async function postGas(payload) {
      try {
        const res = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ ...payload, account: state.auth.account, secret: state.auth.secret })
        });
        const json = await res.json();
        if (!json.success) showToast('操作失敗：' + json.message);
        return json;
      } catch (err) {
        showToast('網路或伺服器連線異常：' + err.message);
        return { success: false, message: err.message };
      }
    }

    async function submitPublicForm(e, sourceName) {
      e.preventDefault();
      const item = Object.fromEntries(new FormData(e.target).entries());
      item.source = sourceName;
      if (state.isDemoMode) {
        showToast(`【示範模式】您的「${sourceName}」已送出。`);
        e.target.reset();
        return;
      }
      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'SUBMIT_FORM', item })
      });
      const json = await res.json();
      showToast(json.message);
      if (json.success) e.target.reset();
    }

    function setFontSize(size) {
      document.documentElement.style.setProperty('--base-fs', size);
      localStorage.setItem('tpda-fs', size);
    }

    function toggleContrast() {
      const active = document.body.classList.toggle('high-contrast');
      $('contrast-btn').setAttribute('aria-pressed', active);
      localStorage.setItem('tpda-hc', active);
    }

    function toggleSpeech() {
      if (!('speechSynthesis' in window)) {
        showToast('此瀏覽器不支援語音朗讀功能。');
        return;
      }
      if (speechSynthesis.speaking) {
        speechSynthesis.cancel();
        $('speech-btn').textContent = '🔊 朗讀本頁';
        return;
      }
      const utter = new SpeechSynthesisUtterance($('main-content').innerText.slice(0, 1500));
      utter.lang = 'zh-TW';
      utter.rate = 0.92;
      utter.onend = () => { $('speech-btn').textContent = '🔊 朗讀本頁'; };
      $('speech-btn').textContent = '⏹️ 停止朗讀';
      speechSynthesis.speak(utter);
    }

    window.addEventListener('DOMContentLoaded', async () => {
      const fs = localStorage.getItem('tpda-fs');
      if (fs) setFontSize(fs);
      if (localStorage.getItem('tpda-hc') === 'true') toggleContrast();
      loadSeedDemoData();
      if (!state.isDemoMode) await fetchAllData();
      applyGlobalSettingsToChrome();
      go('home');
    });
  </script>
</body>
</html>
