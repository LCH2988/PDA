<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>《與帕共處》活動報名與管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background-color: #f0fdfa; 
            line-height: 1.6;
        }
        select, input, textarea {
            font-size: 1.15rem !important;
            padding: 0.75rem !important;
            border-radius: 1rem !important;
        }
    </style>
</head>
<body class="p-4 max-w-md mx-auto pb-12">

    <!-- 載入中遮罩 -->
    <div id="loading" class="fixed inset-0 bg-white bg-opacity-95 flex flex-col justify-center items-center z-50 p-6">
        <div class="animate-spin rounded-full h-16 w-16 border-b-4 border-teal-600 mb-6"></div>
        <p class="text-teal-900 font-bold text-2xl text-center" id="loadingText">正在載入，請稍候...</p>
    </div>

    <!-- 頁首 -->
    <div class="bg-teal-700 text-white p-6 rounded-3xl shadow-lg mb-6 text-center relative">
        <button onclick="toggleAdminMode()" class="absolute top-3 right-3 bg-teal-800 hover:bg-teal-900 text-white text-xs px-3 py-1.5 rounded-full font-bold">
            ⚙️ 管理
        </button>
        <h1 class="text-3xl font-extrabold mb-2">🌸 《與帕同行》 🌸<br>活動報名與管理</h1>
        <p class="text-base opacity-90 font-medium">台灣帕金森病友權益促進會</p>
        <p id="welcomeUser" class="text-sm mt-3 bg-teal-800 inline-block px-4 py-1.5 rounded-full font-bold">正在載入...</p>
    </div>

    <!-- ================= 頁面一：使用者報名表單 ================= -->
    <div id="userPage" class="space-y-6">
        <form id="regForm" class="space-y-6">
            <!-- 選擇活動 -->
            <div class="bg-white p-6 rounded-3xl shadow-md border-2 border-teal-100">
                <label class="block text-xl font-extrabold text-teal-900 mb-3">一、請選擇您想參加的活動</label>
                <select id="eventSelect" onchange="onEventChange()" class="w-full border-2 border-teal-200 focus:border-teal-500 focus:ring-2 focus:ring-teal-200 outline-none font-bold">
                    <option value="">-- 請選擇活動 --</option>
                </select>
                
                <!-- 活動詳情 -->
                <div id="eventDetails" class="mt-4 p-4 bg-teal-50 rounded-2xl border border-teal-100 hidden text-base">
                    <p class="text-teal-900 font-bold">🕒 時間：<span id="detailTime" class="text-gray-700 font-medium"></span></p>
                    <p class="text-teal-900 font-bold mt-1">📍 地點：<span id="detailLocation" class="text-gray-700 font-medium"></span></p>
                    <p class="text-teal-900 font-bold mt-1">👥 人數上限：<span id="detailLimit" class="text-gray-700 font-medium"></span> 人 <span id="detailFullStatus" class="text-red-600 font-bold ml-2"></span></p>
                </div>
            </div>

            <!-- 動態提問 -->
            <div id="dynamicQuestionsSection" class="bg-white p-6 rounded-3xl shadow-md border-2 border-teal-100 hidden">
                <h2 class="text-xl font-extrabold text-teal-900 mb-4 border-b-2 pb-3 border-teal-100">二、請填寫報名資料</h2>
                <p id="editNotice" class="text-amber-600 font-bold text-sm mb-4 hidden">🔔 您已報名過，送出將會「更新」您的資料！</p>
                <div class="space-y-4">
                    <div class="flex flex-col">
                        <label id="lblQ1" class="text-lg font-bold text-gray-800 mb-2"></label>
                        <input type="text" id="ans1" class="w-full border-2 border-teal-100 focus:border-teal-500 outline-none" placeholder="請輸入回答" required>
                    </div>
                    <div class="flex flex-col">
                        <label id="lblQ2" class="text-lg font-bold text-gray-800 mb-2"></label>
                        <input type="text" id="ans2" class="w-full border-2 border-teal-100 focus:border-teal-500 outline-none" placeholder="請輸入回答" required>
                    </div>
                </div>
            </div>

            <button type="button" id="submitBtn" onclick="submitRegistration()" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-extrabold py-4 px-6 rounded-3xl shadow-xl text-xl border-b-4 border-teal-800 active:translate-y-1 active:border-b-0 hidden">
                確認送出報名 🚀
            </button>
        </form>
    </div>

    <!-- ================= 頁面二：報名成功與接龍清單 ================= -->
    <div id="successPage" class="space-y-6 hidden">
        <div class="bg-white p-6 rounded-3xl shadow-md border-2 border-teal-100 text-center">
            <div class="text-5xl mb-3">🎉</div>
            <h2 class="text-2xl font-extrabold text-teal-900 mb-2">登記成功！</h2>
            <p id="myQueueStatus" class="text-xl font-bold text-teal-700 mb-4"></p>
            <button onclick="backToRegister()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-2 px-6 rounded-full text-sm">
                返回報名頁面
            </button>
        </div>

        <!-- 接龍清單 -->
        <div class="bg-white p-6 rounded-3xl shadow-md border-2 border-teal-100">
            <h3 class="text-xl font-extrabold text-teal-900 mb-4 border-b-2 pb-2 border-teal-100">📋 目前報名接龍清單</h3>
            
            <div id="listContainer" class="space-y-2 text-base">
                <!-- JS 動態渲染接龍名單 -->
            </div>

            <!-- 分頁控制 -->
            <div class="flex justify-between items-center mt-6 pt-4 border-t border-gray-100">
                <button id="prevPageBtn" onclick="changePage(-1)" class="bg-teal-50 hover:bg-teal-100 text-teal-800 font-bold py-2 px-4 rounded-xl text-sm disabled:opacity-50">
                    ◀ 上一頁
                </button>
                <span id="pageIndicator" class="text-gray-600 font-bold text-sm">第 1 / 1 頁</span>
                <button id="nextPageBtn" onclick="changePage(1)" class="bg-teal-50 hover:bg-teal-100 text-teal-800 font-bold py-2 px-4 rounded-xl text-sm disabled:opacity-50">
                    下一頁 ▶
                </button>
            </div>
        </div>
    </div>

    <!-- ================= 頁面三：管理員後台 ================= -->
    <div id="adminPage" class="space-y-6 hidden">
        <div class="bg-white p-6 rounded-3xl shadow-md border-2 border-amber-200">
            <div class="flex justify-between items-center mb-4 border-b-2 pb-2 border-amber-100">
                <h2 class="text-2xl font-extrabold text-amber-900">⚙️ 管理員主控台</h2>
                <button onclick="exitAdminMode()" class="text-gray-500 hover:text-gray-700 font-bold text-sm">退出</button>
            </div>

            <!-- 選擇要修改的活動或建立新活動 -->
            <div class="mb-6">
                <label class="block text-sm font-bold text-gray-700 mb-2">選擇編輯現有活動，或建立新活動：</label>
                <select id="adminEventSelect" onchange="onAdminEventSelect()" class="w-full border-2 border-amber-200 outline-none font-bold text-sm">
                    <option value="new">➕ 建立全新活動</option>
                </select>
            </div>

            <!-- 活動表單 -->
            <form id="eventForm" class="space-y-4 text-sm">
                <input type="hidden" id="adminEventId">
                <div>
                    <label class="block font-bold text-gray-700 mb-1">活動名稱</label>
                    <input type="text" id="adminTitle" class="w-full border border-gray-300 rounded-lg outline-none" placeholder="例如：春季郊遊" required>
                </div>
                <div>
                    <label class="block font-bold text-gray-700 mb-1">活動時間</label>
                    <input type="datetime-local" id="adminTime" class="w-full border border-gray-300 rounded-lg outline-none" required>
                </div>
                <div>
                    <label class="block font-bold text-gray-700 mb-1">活動地點</label>
                    <input type="text" id="adminLocation" class="w-full border border-gray-300 rounded-lg outline-none" placeholder="例如：台北市大安森林公園" required>
                </div>
                <div>
                    <label class="block font-bold text-gray-700 mb-1">人數上限 (超過自動轉候補)</label>
                    <input type="number" id="adminLimit" class="w-full border border-gray-300 rounded-lg outline-none" placeholder="例如：20" required>
                </div>
                <div>
                    <label class="block font-bold text-gray-700 mb-1">自訂提問 1</label>
                    <input type="text" id="adminQ1" class="w-full border border-gray-300 rounded-lg outline-none" placeholder="例如：是否需要素食？" required>
                </div>
                <div>
                    <label class="block font-bold text-gray-700 mb-1">自訂提問 2</label>
                    <input type="text" id="adminQ2" class="w-full border border-gray-300 rounded-lg outline-none" placeholder="例如：是否需要接駁車？" required>
                </div>

                <button type="button" onclick="saveEvent()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 px-4 rounded-2xl shadow-md text-lg">
                    儲存活動設定 💾
                </button>
            </form>
        </div>
    </div>

    <script>
        // ⚠️ 請修改為您的 GAS 與 LIFF 設定
        const GAS_URL = "https://script.google.com/macros/s/AKfycbz3mrfbOIsuZHHno3D7fHix4G0hU5HdmWNlmULt4CHu_WFOotHvEPbKfjYs5Wjlig4w/exec"; 
        const LIFF_ID = "2009456572-VIoH1oY0";
        const ADMIN_PASSWORD = "1234"; // 簡易管理員密碼

        let userLineId = "Anonymous";
        let userDisplayName = "熱心成員";
        let currentGroupId = "Unknown";
        let isInChatContext = false;
        
        let allEvents = [];
        let currentEvent = null;
        let isAdmin = false;

        // 接龍分頁控制變數
        let currentParticipants = [];
        let currentPage = 1;
        const pageSize = 20;

        async function initializeLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }
                
                const profile = await liff.getProfile();
                userLineId = profile.userId;
                userDisplayName = profile.displayName;

                const context = liff.getContext();
                if (context) {
                    currentGroupId = context.groupId || context.roomId || context.utouId || "個人聊天";
                    isInChatContext = (context.type === "group" || context.type === "room" || context.type === "utou");
                }

                document.getElementById("welcomeUser").innerText = `您好，${userDisplayName}！`;
                await fetchEvents();
            } catch (error) {
                console.error("LIFF 初始化失敗", error);
                alert("請在 LINE 內開啟此頁面");
            }
        }

        // 取得活動清單
        async function fetchEvents() {
            showLoading("正在載入活動資訊...");
            try {
                const response = await fetch(`${GAS_URL}?action=getEvents&lineId=${userLineId}`);
                const result = await response.json();
                if (result.status === "success") {
                    allEvents = result.events;
                    renderEventSelects();
                    hideLoading();
                } else {
                    alert("載入失敗：" + result.message);
                }
            } catch (error) {
                alert("網路連線失敗，請稍後再試");
            }
        }

        function renderEventSelects() {
            const select = document.getElementById("eventSelect");
            const adminSelect = document.getElementById("adminEventSelect");
            
            select.innerHTML = '<option value="">-- 請選擇活動 --</option>';
            adminSelect.innerHTML = '<option value="new">➕ 建立全新活動</option>';
            
            allEvents.forEach(evt => {
                const opt = document.createElement("option");
                opt.value = evt.id;
                opt.innerText = evt.title;
                select.appendChild(opt.cloneNode(true));
                adminSelect.appendChild(opt);
            });
        }

        // 使用者切換活動
        function onEventChange() {
            const selectedId = document.getElementById("eventSelect").value;
            currentEvent = allEvents.find(e => e.id === selectedId);

            const detailsDiv = document.getElementById("eventDetails");
            const questionsSection = document.getElementById("dynamicQuestionsSection");
            const submitBtn = document.getElementById("submitBtn");
            const editNotice = document.getElementById("editNotice");

            if (!currentEvent) {
                detailsDiv.classList.add("hidden");
                questionsSection.classList.add("hidden");
                submitBtn.classList.add("hidden");
                return;
            }

            document.getElementById("detailTime").innerText = currentEvent.time;
            document.getElementById("detailLocation").innerText = currentEvent.location;
            document.getElementById("detailLimit").innerText = currentEvent.limit;
            
            const isFull = currentEvent.regCount >= currentEvent.limit;
            document.getElementById("detailFullStatus").innerText = isFull ? "⚠️ 目前額滿，報名將列入候補" : "(尚有名額)";

            detailsDiv.classList.remove("hidden");

            document.getElementById("lblQ1").innerText = `1. ${currentEvent.q1}`;
            document.getElementById("lblQ2").innerText = `2. ${currentEvent.q2}`;
            
            if (currentEvent.hasRegistered) {
                document.getElementById("ans1").value = currentEvent.prevAns1 || "";
                document.getElementById("ans2").value = currentEvent.prevAns2 || "";
                editNotice.classList.remove("hidden");
                submitBtn.innerText = "確認修改報名資料 ✏️";
            } else {
                document.getElementById("ans1").value = "";
                document.getElementById("ans2").value = "";
                editNotice.classList.add("hidden");
                submitBtn.innerText = isFull ? "額滿，確認登記候補 ⏳" : "確認送出報名 🚀";
            }

            questionsSection.classList.remove("hidden");
            submitBtn.classList.remove("hidden");
        }

        // 提交報名
        async function submitRegistration() {
            const ans1 = document.getElementById("ans1").value.trim();
            const ans2 = document.getElementById("ans2").value.trim();

            if (!ans1 || !ans2) {
                alert("請填寫完整的提問內容！");
                return;
            }

            document.getElementById("submitBtn").disabled = true;
            showLoading("正在儲存報名資訊...");

            try {
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({
                        action: "register",
                        eventId: currentEvent.id,
                        lineId: userLineId,
                        displayName: userDisplayName,
                        groupId: currentGroupId,
                        ans1: ans1,
                        ans2: ans2
                    })
                });

                const result = await response.json();
                if (result.status === "success") {
                    // 載入接龍清單並顯示成功頁面
                    await showSuccessPage(result.queueStatus, result.queueIndex);
                    await sendFlexMessage(result.queueStatus, result.queueIndex);
                } else {
                    alert("報名失敗：" + result.message);
                    document.getElementById("submitBtn").disabled = false;
                    hideLoading();
                }
            } catch (error) {
                alert("伺服器連線失敗");
                document.getElementById("submitBtn").disabled = false;
                hideLoading();
            }
        }

        // 顯示成功頁面與接龍清單
        async function showSuccessPage(queueStatus, queueIndex) {
            document.getElementById("userPage").classList.add("hidden");
            document.getElementById("successPage").classList.remove("hidden");
            
            const statusText = queueStatus === "正取" ? `您是【正取】第 ${queueIndex} 位` : `目前額滿，您是【候補】第 ${queueIndex} 位`;
            document.getElementById("myQueueStatus").innerText = statusText;

            // 獲取最新的接龍清單
            showLoading("正在載入接龍名單...");
            try {
                const response = await fetch(`${GAS_URL}?action=getParticipants&eventId=${currentEvent.id}`);
                const result = await response.json();
                if (result.status === "success") {
                    currentParticipants = result.participants;
                    currentPage = 1;
                    renderParticipantsList();
                }
            } catch (e) {
                console.error(e);
            }
            hideLoading();
        }

        // 渲染接龍清單
        function renderParticipantsList() {
            const container = document.getElementById("listContainer");
            container.innerHTML = "";

            const totalPages = Math.ceil(currentParticipants.length / pageSize) || 1;
            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            const pageData = currentParticipants.slice(start, end);

            if (pageData.length === 0) {
                container.innerHTML = `<p class="text-gray-500 text-center py-4">目前尚無人報名</p>`;
            } else {
                pageData.forEach((p, index) => {
                    const globalIndex = start + index + 1;
                    const isBackup = p.status === "候補";
                    const badgeColor = isBackup ? "bg-amber-100 text-amber-800" : "bg-teal-100 text-teal-800";
                    
                    const item = document.createElement("div");
                    item.className = "flex justify-between items-center p-3 bg-gray-50 rounded-xl border border-gray-100";
                    item.innerHTML = `
                        <div class="flex items-center space-x-3">
                            <span class="font-bold text-gray-400">#${globalIndex}</span>
                            <span class="font-bold text-gray-800 text-lg">${p.name}</span>
                        </div>
                        <span class="px-3 py-1 rounded-full text-xs font-bold ${badgeColor}">${p.status}</span>
                    `;
                    container.appendChild(item);
                });
            }

            // 更新分頁按鈕狀態
            document.getElementById("pageIndicator").innerText = `第 ${currentPage} / ${totalPages} 頁`;
            document.getElementById("prevPageBtn").disabled = currentPage === 1;
            document.getElementById("nextPageBtn").disabled = currentPage === totalPages;
        }

        function changePage(direction) {
            currentPage += direction;
            renderParticipantsList();
        }

        function backToRegister() {
            document.getElementById("successPage").classList.add("hidden");
            document.getElementById("userPage").classList.remove("hidden");
            document.getElementById("submitBtn").disabled = false;
            fetchEvents(); // 重新整理
        }

        // ================= 管理員邏輯 =================
        function toggleAdminMode() {
            if (isAdmin) {
                exitAdminMode();
                return;
            }
            const pwd = prompt("請輸入管理員密碼：");
            if (pwd === ADMIN_PASSWORD) {
                isAdmin = true;
                document.getElementById("userPage").classList.add("hidden");
                document.getElementById("successPage").classList.add("hidden");
                document.getElementById("adminPage").classList.remove("hidden");
                onAdminEventSelect();
            } else if (pwd !== null) {
                alert("密碼錯誤！");
            }
        }

        function exitAdminMode() {
            isAdmin = false;
            document.getElementById("adminPage").classList.add("hidden");
            document.getElementById("userPage").classList.remove("hidden");
        }

        function onAdminEventSelect() {
            const selectedVal = document.getElementById("adminEventSelect").value;
            const form = document.getElementById("eventForm");
            
            if (selectedVal === "new") {
                form.reset();
                document.getElementById("adminEventId").value = "";
            } else {
                const evt = allEvents.find(e => e.id === selectedVal);
                if (evt) {
                    document.getElementById("adminEventId").value = evt.id;
                    document.getElementById("adminTitle").value = evt.title;
                    // 轉換時間格式為 datetime-local 格式 (YYYY-MM-DDThh:mm)
                    const dateObj = new Date(evt.time);
                    const formattedDate = dateObj.getFullYear() + '-' + 
                        String(dateObj.getMonth() + 1).padStart(2, '0') + '-' + 
                        String(dateObj.getDate()).padStart(2, '0') + 'T' + 
                        String(dateObj.getHours()).padStart(2, '0') + ':' + 
                        String(dateObj.getMinutes()).padStart(2, '0');
                    document.getElementById("adminTime").value = formattedDate;
                    document.getElementById("adminLocation").value = evt.location;
                    document.getElementById("adminLimit").value = evt.limit;
                    document.getElementById("adminQ1").value = evt.q1;
                    document.getElementById("adminQ2").value = evt.q2;
                }
            }
        }

        async function saveEvent() {
            const id = document.getElementById("adminEventId").value;
            const title = document.getElementById("adminTitle").value.trim();
            const time = document.getElementById("adminTime").value;
            const location = document.getElementById("adminLocation").value.trim();
            const limit = document.getElementById("adminLimit").value;
            const q1 = document.getElementById("adminQ1").value.trim();
            const q2 = document.getElementById("adminQ2").value.trim();

            if (!title || !time || !location || !limit || !q1 || !q2) {
                alert("請完整填寫所有活動設定！");
                return;
            }

            showLoading("正在儲存活動...");
            try {
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({
                        action: "saveEvent",
                        id: id,
                        title: title,
                        time: time,
                        location: location,
                        limit: parseInt(limit),
                        q1: q1,
                        q2: q2
                    })
                });
                const result = await response.json();
                if (result.status === "success") {
                    alert("活動儲存成功！");
                    await fetchEvents();
                    exitAdminMode();
                } else {
                    alert("儲存失敗：" + result.message);
                }
            } catch (e) {
                alert("儲存失敗，請檢查網路連線");
            }
            hideLoading();
        }

        // 發送 Flex Message
        async function sendFlexMessage(queueStatus, queueIndex) {
            const flexPayload = {
                type: "flex",
                altText: `📢 ${userDisplayName} 已登記活動：${currentEvent.title}`,
                contents: {
                    type: "bubble",
                    header: {
                        type: "box",
                        layout: "vertical",
                        backgroundColor: queueStatus === "正取" ? "#0d9488" : "#d97706",
                        contents: [
                            { type: "text", text: `📢 活動登記成功 (${queueStatus})`, color: "#ffffff", weight: "bold", size: "lg" },
                            { type: "text", text: `活動：${currentEvent.title}`, color: "#fef3c7", size: "sm", margin: "xs", weight: "bold", wrap: true }
                        ]
                    },
                    body: {
                        type: "box",
                        layout: "vertical",
                        spacing: "md",
                        contents: [
                            { type: "text", text: `💡 【${userDisplayName}】已成功登記！`, weight: "bold", size: "sm", color: "#0f766e" },
                            { type: "text", text: `📌 狀態：${queueStatus}第 ${queueIndex} 位`, weight: "bold", size: "md", color: queueStatus === "正取" ? "#0d9488" : "#b45309" },
                            { type: "separator", margin: "md" },
                            { type: "text", text: `🕒 時間：${currentEvent.time}`, size: "sm", color: "#4b5563", wrap: true },
                            { type: "text", text: `📍 地點：${currentEvent.location}`, size: "sm", color: "#4b5563", wrap: true }
                        ]
                    },
                    footer: {
                        type: "box",
                        layout: "vertical",
                        contents: [
                            {
                                type: "button",
                                action: {
                                    type: "uri",
                                    label: "我也要報名/看接龍名單",
                                    uri: `https://liff.line.me/${LIFF_ID}`
                                },
                                style: "primary",
                                color: "#0d9488"
                            }
                        ]
                    }
                }
            };

            if (isInChatContext) {
                try {
                    await liff.sendMessages([flexPayload]);
                } catch (e) {
                    await fallbackShare(flexPayload);
                }
            } else {
                await fallbackShare(flexPayload);
            }
        }

        async function fallbackShare(flexPayload) {
            if (liff.isApiAvailable('shareTargetPicker')) {
                try {
                    await liff.shareTargetPicker([flexPayload]);
                } catch (e) {}
            }
        }

        function showLoading(text) {
            document.getElementById("loadingText").innerText = text;
            document.getElementById("loading").classList.remove("hidden");
        }

        function hideLoading() {
            document.getElementById("loading").classList.add("hidden");
        }

        initializeLiff();
    </script>
</body>
</html>
