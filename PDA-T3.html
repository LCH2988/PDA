<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>三鐵飛翔 - 活動與購物登記系統</title>
  <!-- 預連線加速 SDK 載入 -->
  <link rel="preconnect" href="https://static.line-scdn.net" crossorigin>
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js" async></script>
  <style>
    /* ============================================================
       設計系統：年長者友善 × 高對比 × 分類色彩 (升級版)
       ============================================================ */
    :root {
      --brand:        #c2410c;
      --brand-dark:   #9a3412;
      --brand-light:  #fff7ed;
      --bg:           #f1f5f9;
      --surface:      #ffffff;
      --surface-2:    #f8fafc;
      --text:         #0f172a;
      --text-muted:   #334155;
      --text-light:   #64748b;
      --success:      #15803d;
      --danger:       #b91c1c;
      --warning:      #b45309;
      --touch:        64px;   /* 最小觸控高度 */
      --font-base:    18px;
      --font-sm:      16px;
      --font-lg:      20px;
      --font-xl:      22px;
      --font-2xl:     26px;
      --radius:       20px;
      --radius-sm:    14px;
      --gap:          16px;
      /* 分類色盤 */
      --cat-0-bg:#fff7ed; --cat-0-border:#fdba74; --cat-0-text:#9a3412;
      --cat-1-bg:#eff6ff; --cat-1-border:#93c5fd; --cat-1-text:#1e40af;
      --cat-2-bg:#f0fdf4; --cat-2-border:#86efac; --cat-2-text:#166534;
      --cat-3-bg:#fdf4ff; --cat-3-border:#d8b4fe; --cat-3-text:#6b21a8;
      --cat-4-bg:#fff1f2; --cat-4-border:#fda4af; --cat-4-text:#9f1239;
      --cat-5-bg:#f0fdfa; --cat-5-border:#5eead4; --cat-5-text:#0f766e;
      --cat-6-bg:#fefce8; --cat-6-border:#fde047; --cat-6-text:#854d0e;
      --cat-7-bg:#f0f9ff; --cat-7-border:#7dd3fc; --cat-7-text:#075985;
      --cat-8-bg:#fdf2f8; --cat-8-border:#f0abfc; --cat-8-text:#86198f;
      --cat-9-bg:#f7fee7; --cat-9-border:#a3e635; --cat-9-text:#3f6212;
    }

    /* ── 重置 ── */
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    html { font-size: var(--font-base); -webkit-text-size-adjust:100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 80px;
      -webkit-tap-highlight-color: transparent;
      line-height: 1.5;
    }

    /* ── 通用元件 ── */
    button {
      min-height: var(--touch);
      font-weight: 900;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: var(--font-base);
      font-family: inherit;
      transition: opacity .15s, transform .1s;
      -webkit-tap-highlight-color: transparent;
      border: none;
    }
    button:active { transform: scale(.97); opacity: .9; }
    button:disabled { opacity: .45; cursor: not-allowed; transform: none; }

    input, select, textarea {
      min-height: var(--touch);
      font-size: var(--font-base) !important;
      font-family: inherit;
      color: var(--text);
      border: 2.5px solid #94a3b8;
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      width: 100%;
      background: var(--surface);
      outline: none;
      transition: border-color .2s;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--brand); }
    label {
      display: block;
      font-size: var(--font-sm);
      font-weight: 900;
      color: var(--text);
      margin-bottom: 6px;
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: var(--gap);
      box-shadow: 0 4px 16px rgba(15,23,42,.07);
      border: 2px solid rgba(148,163,184,.2);
    }

    .btn-primary { background: var(--brand); color: #fff; border: 2px solid var(--brand-dark); padding: 14px 20px; width: 100%; }
    .btn-secondary { background: var(--surface-2); color: var(--text); border: 2px solid #cbd5e1; padding: 14px 20px; width: 100%; }
    .btn-danger { background: #fef2f2; color: var(--danger); border: 2px solid #fca5a5; padding: 14px 20px; }
    .btn-sm { min-height: 44px; font-size: var(--font-sm); padding: 8px 14px; }
    .btn-icon-close {
      min-width: 48px; min-height: 48px; width: 48px; height: 48px;
      border-radius: 50%; background: rgba(255,255,255,.2); color: #fff;
      font-size: 20px; display: flex; align-items: center; justify-content: center;
      border: 2px solid rgba(255,255,255,.4); flex-shrink: 0;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, var(--brand) 0%, #d97706 100%);
      color: #fff; position: sticky; top: 0; z-index: 40;
      box-shadow: 0 4px 16px rgba(0,0,0,.18);
    }
    .header-inner {
      max-width: 480px; margin: 0 auto; padding: 14px 16px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .header-logo {
      width: 52px; height: 52px; border-radius: 50%; background: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; flex-shrink: 0; box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }
    .header-title { font-size: 1.5rem; font-weight: 900; line-height: 1.1; }
    .header-sub { font-size: 13px; background: rgba(0,0,0,.25); border-radius: 20px; padding: 2px 10px; margin-top: 4px; display: inline-block; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    #adminBtn { min-height: 44px; background: rgba(0,0,0,.35); color: #fff; border: 2px solid rgba(255,255,255,.5); padding: 8px 14px; font-size: 15px; border-radius: 12px; }
    #userAvatar { width: 52px; height: 52px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.2); cursor: pointer; display: none; }

    /* ── Main ── */
    .main { max-width: 480px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }

    /* ── 分類標籤 ── */
    .cat-tabs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .cat-tabs::-webkit-scrollbar { display: none; }
    .cat-tab {
      flex-shrink: 0; min-height: 52px; padding: 10px 20px; border-radius: 14px;
      font-size: var(--font-sm); font-weight: 900; border: 2.5px solid; white-space: nowrap; transition: transform .1s;
    }
    .cat-tab.active-all { background: var(--brand); color: #fff; border-color: var(--brand-dark); }
    .cat-tab.inactive-all { background: var(--surface); color: var(--text); border-color: #cbd5e1; }

    /* 分類標籤動態顏色 */
    .cat-tab.active-cat-0  { background:var(--cat-0-text);  color:#fff; border-color:var(--cat-0-text); }
    .cat-tab.inactive-cat-0{ background:var(--cat-0-bg);    color:var(--cat-0-text); border-color:var(--cat-0-border); }
    .cat-tab.active-cat-1  { background:var(--cat-1-text);  color:#fff; border-color:var(--cat-1-text); }
    .cat-tab.inactive-cat-1{ background:var(--cat-1-bg);    color:var(--cat-1-text); border-color:var(--cat-1-border); }
    .cat-tab.active-cat-2  { background:var(--cat-2-text);  color:#fff; border-color:var(--cat-2-text); }
    .cat-tab.inactive-cat-2{ background:var(--cat-2-bg);    color:var(--cat-2-text); border-color:var(--cat-2-border); }
    .cat-tab.active-cat-3  { background:var(--cat-3-text);  color:#fff; border-color:var(--cat-3-text); }
    .cat-tab.inactive-cat-3{ background:var(--cat-3-bg);    color:var(--cat-3-text); border-color:var(--cat-3-border); }
    .cat-tab.active-cat-4  { background:var(--cat-4-text);  color:#fff; border-color:var(--cat-4-text); }
    .cat-tab.inactive-cat-4{ background:var(--cat-4-bg);    color:var(--cat-4-text); border-color:var(--cat-4-border); }

    .cat-badge { display: inline-block; font-size: 15px; font-weight: 900; padding: 6px 14px; border-radius: 10px; border: 2px solid; }
    .cat-badge-0 { background:var(--cat-0-bg); color:var(--cat-0-text); border-color:var(--cat-0-border); }
    .cat-badge-1 { background:var(--cat-1-bg); color:var(--cat-1-text); border-color:var(--cat-1-border); }
    .cat-badge-2 { background:var(--cat-2-bg); color:var(--cat-2-text); border-color:var(--cat-2-border); }
    .cat-badge-3 { background:var(--cat-3-bg); color:var(--cat-3-text); border-color:var(--cat-3-border); }
    .cat-badge-4 { background:var(--cat-4-bg); color:var(--cat-4-text); border-color:var(--cat-4-border); }

    /* ── 活動卡片 (升級版) ── */
    .event-card { display: flex; flex-direction: column; gap: 14px; }
    .event-card-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .event-title { font-size: var(--font-xl); font-weight: 900; line-height: 1.3; color: var(--text); }
    .event-desc { font-size: var(--font-sm); color: var(--text-muted); line-height: 1.6; }
    
    /* 圖片展示區 (最多 5 張) */
    .event-images-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 4px; }
    .event-img { width: 100%; height: 80px; object-fit: cover; border-radius: 10px; border: 1px solid #cbd5e1; }

    .event-info {
      background: var(--surface-2); border-radius: 14px; padding: 14px;
      border: 2px solid rgba(148,163,184,.2); display: flex; flex-direction: column; gap: 10px;
    }
    .event-info-row { display: flex; align-items: center; gap: 10px; font-size: var(--font-sm); color: var(--text-muted); }
    .event-info-icon { font-size: 20px; flex-shrink: 0; line-height: 1; }
    .event-info-label { font-weight: 900; color: var(--text); }
    
    /* HTML 簡章按鈕 */
    .html-brochure-btn {
      background: #fff7ed; color: #9a3412; border: 2.5px solid #fdba74;
      border-radius: var(--radius-sm); padding: 12px; text-align: center;
      text-decoration: none; font-weight: 900; display: flex; align-items: center; justify-content: center; gap: 8px;
      font-size: var(--font-sm);
    }

    .event-actions { display: grid; grid-template-columns: 1fr 1.2fr; gap: 12px; }
    .status-badge-open { background: #dcfce7; color: #15803d; border: 2px solid #86efac; padding: 6px 14px; border-radius: 10px; font-size: 15px; font-weight: 900; }
    .status-badge-stop { background: #f1f5f9; color: #475569; border: 2px solid #cbd5e1; padding: 6px 14px; border-radius: 10px; font-size: 15px; font-weight: 900; }

    /* ── 骨架屏 ── */
    @keyframes shimmer { 0%{background-position:-400px 0} 100%{background-position:400px 0} }
    .skeleton { background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%); background-size: 800px 100%; animation: shimmer 1.4s infinite; border-radius: 12px; }
    .skeleton-card { height: 200px; border-radius: var(--radius); }

    /* ── 彈窗 ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(15,23,42,.75);
      backdrop-filter: blur(4px); z-index: 50; display: none;
      align-items: flex-end; justify-content: center; padding: 0;
    }
    .modal-overlay.show { display: flex; }
    .modal-sheet {
      background: var(--surface); border-radius: 24px 24px 0 0;
      width: 100%; max-width: 480px; max-height: 92vh; overflow: hidden;
      display: flex; flex-direction: column; box-shadow: 0 -8px 40px rgba(0,0,0,.2);
    }
    .modal-sheet-center { border-radius: 24px; margin: 16px; max-height: calc(100vh - 32px); }
    .modal-header {
      background: linear-gradient(135deg, var(--brand), #d97706); color: #fff;
      padding: 18px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-shrink: 0;
    }
    .modal-title { font-size: var(--font-lg); font-weight: 900; }
    .modal-body { overflow-y: auto; padding: 16px; flex: 1; display: flex; flex-direction: column; gap: 14px; -webkit-overflow-scrolling: touch; }
    .modal-footer { padding: 14px 16px; background: var(--surface-2); border-top: 2px solid rgba(148,163,184,.2); display: grid; grid-template-columns: 1fr 1fr; gap: 12px; flex-shrink: 0; }

    /* ── 管理後台 ── */
    .admin-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.85); backdrop-filter: blur(4px); z-index: 50; display: none; overflow-y: auto; }
    .admin-overlay.show { display: block; }
    .admin-panel { background: var(--bg); max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
    .admin-header { background: #1e293b; color: #fff; padding: 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
    .admin-tabs { display: grid; grid-template-columns: repeat(4,1fr); background: var(--surface); border-bottom: 2px solid rgba(148,163,184,.2); position: sticky; top: 62px; z-index: 9; }
    .admin-tab-btn { min-height: 52px; font-size: 14px; font-weight: 900; color: var(--text-light); background: transparent; border: none; border-bottom: 4px solid transparent; border-radius: 0; padding: 8px 4px; }
    .admin-tab-btn.active { color: var(--brand); border-bottom-color: var(--brand); background: rgba(194,65,12,.05); }
    .admin-content { padding: 16px; display: flex; flex-direction: column; gap: 16px; }

    /* ── 圖片/檔案上傳元件 ── */
    .file-upload-wrapper {
      border: 2.5px solid #cbd5e1; border-radius: var(--radius-sm); padding: 14px;
      background: var(--surface-2); display: flex; align-items: center; justify-content: space-between; cursor: pointer;
    }
    .file-upload-wrapper input[type="file"] { display: none; }
    .success-status-box { display: flex; align-items: center; gap: 6px; color: var(--success); font-size: var(--font-sm); font-weight: bold; margin-top: 6px; }
    
    .admin-image-preview-container { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
    .admin-preview-wrapper { position: relative; width: 80px; height: 80px; }
    .admin-preview-img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; border: 2px solid #cbd5e1; }
    .admin-preview-remove {
      position: absolute; top: -6px; right: -6px; width: 22px; height: 22px;
      background: var(--danger); color: #fff; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; cursor: pointer;
    }

    /* ── 登記表單 ── */
    .attendee-row { background: var(--surface-2); border-radius: 16px; padding: 14px; border: 2px solid rgba(148,163,184,.25); display: flex; flex-direction: column; gap: 12px; }
    .attendee-label { font-size: var(--font-sm); font-weight: 900; color: var(--brand); }

    /* ── 載入遮罩 ── */
    #loading { position: fixed; inset: 0; background: rgba(15,23,42,.6); backdrop-filter: blur(3px); z-index: 100; display: none; align-items: center; justify-content: center; }
    #loading.show { display: flex; }
    .loading-box { background: var(--surface); border-radius: 20px; padding: 28px 32px; display: flex; flex-direction: column; align-items: center; gap: 14px; box-shadow: 0 8px 32px rgba(0,0,0,.2); }
    .spinner { width: 44px; height: 44px; border: 4px solid #e2e8f0; border-top-color: var(--brand); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loadingText { font-size: var(--font-sm); font-weight: 900; color: var(--text); }

    /* ── 快速登入彈窗 ── */
    #loginModal { position: fixed; inset: 0; background: rgba(15,23,42,.92); backdrop-filter: blur(6px); z-index: 60; display: none; align-items: center; justify-content: center; padding: 16px; }
    #loginModal.show { display: flex; }
    .login-box { background: var(--surface); border-radius: 24px; width: 100%; max-width: 360px; overflow: hidden; box-shadow: 0 16px 48px rgba(0,0,0,.3); }
    .login-hero { background: linear-gradient(135deg, var(--brand), #d97706); color: #fff; padding: 28px 20px; text-align: center; }

    /* ── 分頁控制 ── */
    .pagination { display: flex; align-items: center; justify-content: space-between; background: var(--surface-2); border-radius: 14px; padding: 10px 14px; border: 2px solid rgba(148,163,184,.2); }
    .pagination button { min-height: 48px; padding: 8px 18px; font-size: var(--font-sm); background: var(--surface); color: var(--text); border: 2px solid #cbd5e1; }

    /* ── 通知 Toast ── */
    #toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1e293b; color: #fff; padding: 14px 24px; border-radius: 16px; font-size: var(--font-sm); font-weight: 900; z-index: 200; opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none; max-width: calc(100vw - 32px); text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 360px) { :root { --font-base:16px; --font-sm:14px; --font-lg:18px; --font-xl:20px; --font-2xl:22px; } }
    @media (min-width: 480px) { .modal-overlay { align-items: center; padding: 16px; } .modal-sheet { border-radius: 24px; max-height: 90vh; } }
  </style>
</head>
<body>

  <!-- ===== Header ===== -->
  <header class="header">
    <div class="header-inner">
      <div style="display:flex;align-items:center;gap:12px">
        <div class="header-logo">🚴‍♂️</div>
        <div>
          <div class="header-title">三鐵飛翔</div>
          <span class="header-sub">活動與購物登記</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="adminBtn" onclick="enterAdminMode()" style="display:none">⚙️ 後台</button>
        <img id="userAvatar" onclick="openProfileModal()" alt="頭像">
      </div>
    </div>
  </header>

  <!-- ===== 主內容 ===== -->
  <main class="main">
    <!-- 歡迎卡 -->
    <section class="card">
      <div style="margin-bottom:12px">
        <div style="font-size:var(--font-sm);font-weight:800;color:var(--text-light);margin-bottom:6px">歡迎使用 👋</div>
        <div style="font-size: var(--font-2xl); font-weight: 900;"><span id="userName">載入中...</span></div>
      </div>
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
        <button class="btn-secondary" onclick="openProfileModal()">👤 會員資料</button>
        <button class="btn-primary" onclick="openMyRegistrationsModal()">📋 我的登記</button>
      </div>
    </section>

    <!-- 分類標籤 -->
    <div id="categoryTabs" class="cat-tabs"></div>

    <!-- 活動列表 -->
    <div id="eventListContainer" style="display:flex;flex-direction:column;gap:16px">
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
    </div>
  </main>

  <!-- ===== 快速登入彈窗 ===== -->
  <div id="loginModal">
    <div class="login-box">
      <div class="login-hero">
        <div style="font-size:52px;margin-bottom:8px">🚴‍♂️</div>
        <div style="font-size:var(--font-xl);font-weight:900">歡迎使用 三鐵飛翔</div>
        <div style="font-size:var(--font-sm);opacity:.9;margin-top:6px">請快速綁定以開啟完整登記功能</div>
      </div>
      <form onsubmit="handleLoginRegister(event)" style="padding:20px;display:flex;flex-direction:column;gap:14px">
        <div>
          <label>您的姓名 <span style="color:var(--danger)">*</span></label>
          <input type="text" id="loginName" required placeholder="請輸入姓名">
        </div>
        <div>
          <label>手機號碼 <span style="color:var(--danger)">*</span></label>
          <input type="tel" id="loginPhone" required placeholder="例如：0912345678">
        </div>
        <button type="submit" class="btn-primary">快速綁定並登入 ➔</button>
      </form>
    </div>
  </div>

  <!-- ===== 會員資料彈窗 ===== -->
  <div id="profileModal" class="modal-overlay">
    <div class="modal-sheet modal-sheet-center">
      <div class="modal-header">
        <span class="modal-title">👤 完善會員資料</span>
        <button class="btn-icon-close" onclick="closeModal('profileModal')">✕</button>
      </div>
      <form onsubmit="saveProfile(event)" style="display:flex;flex-direction:column;flex:1;overflow:hidden">
        <div class="modal-body">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            <div>
              <label>姓名 <span style="color:var(--danger)">*</span></label>
              <input type="text" id="profileName" required>
            </div>
            <div>
              <label>電話 <span style="color:var(--danger)">*</span></label>
              <input type="tel" id="profilePhone" required>
            </div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            <div>
              <label>性別</label>
              <select id="profileGender">
                <option value="">請選擇</option>
                <option value="男">男</option>
                <option value="女">女</option>
              </select>
            </div>
            <div>
              <label>生日</label>
              <input type="date" id="profileBirthday">
            </div>
          </div>
          <div>
            <label>身分證字號 (保險/核對用) <span style="color:var(--danger)">*</span></label>

  <!-- ===== Toast 通知 ===== -->
  <div id="toast"></div>

  <script>
    // ⚠️ 請替換為您實際的 LIFF_ID 與 GAS 部署網址
    const LIFF_ID  = "2007905012-dQfXClGM";
    const GAS_URL  = "https://script.google.com/macros/s/AKfycbyqcMNZHa8I2ptVWvKbvTfyuNOnT3r015CiC0F7RIWDCV2n-ZL7Hh6csh6Cboxti8Ow/exec";

    // ── 快取設定 ──
    const CACHE_TTL_EVENTS = 60000;     // 活動快取 60 秒
    const CACHE_TTL_CATS   = 300000;    // 分類快取 5 分鐘
    const CACHE_KEY_EVENTS = "cache_events_v6";
    const CACHE_KEY_CATS   = "cache_cats_v6";

    // ── 全域狀態 ──
    let userLineId = "", userDisplayName = "", userProfile = null;
    let allEvents = [], allCategories = [];
    let currentEvent = null, activeEventQuestions = [], tempQuestions = [];
    let currentParticipants = [];
    let currentFilterCategory = "all";
    let isAdmin = false, isInChatContext = false;
    let currentCardPage = 0;
    const CARD_PAGE_SIZE = 20;

    // 儲存上傳的 HTML 簡章與照片 Base64
    let uploadedHtmlBase64 = "";
    let uploadedHtmlName = "";
    let uploadedPhotos = [];

    // ── 分類顏色索引對應 ──
    const catColorMap = {};   // { 分類名稱: 索引 }
    const CAT_COLORS = 10;    // 色盤大小

    function getCatColorIndex(catName) {
      if (catColorMap[catName] === undefined) {
        catColorMap[catName] = Object.keys(catColorMap).length % CAT_COLORS;
      }
      return catColorMap[catName];
    }

    // ============================================================
    // 快取工具
    // ============================================================
    function cacheSet(key, data, ttl) {
      try {
        localStorage.setItem(key, JSON.stringify({ data, exp: Date.now() + ttl }));
      } catch(e) {}
    }
    function cacheGet(key) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return null;
        const obj = JSON.parse(raw);
        if (Date.now() > obj.exp) { localStorage.removeItem(key); return null; }
        return obj.data;
      } catch(e) { return null; }
    }
    function cacheClear(key) {
      try { localStorage.removeItem(key); } catch(e) {}
    }

    // ============================================================
    // LIFF 初始化
    // ============================================================
    async function initializeLiff() {
      showLoading("系統初始化中...");
      try {
        // 等待 SDK 載入
        await waitForLiff();
        await liff.init({ liffId: LIFF_ID });

        const ctx = liff.getContext();
        isInChatContext = liff.isInClient() && ctx &&
          ["utou","room","group"].includes(ctx.type);

        if (!liff.isLoggedIn()) { liff.login(); return; }

        const profile = await liff.getProfile();
        userLineId = profile.userId;
        userDisplayName = profile.displayName;

        const avatarEl = document.getElementById("userAvatar");
        avatarEl.src = profile.pictureUrl;
        avatarEl.style.display = "block";

        // ⚡ 並行執行：會員登入 + 真正連線 GAS 獲取分類與活動
        await Promise.all([
          loginOrRegisterUser(),
          fetchCategories(),
          fetchEvents()
        ]);

        // URL 參數處理
        const params = new URLSearchParams(window.location.search);
        if (params.get("action") === "viewlist" && params.get("eventId")) {
          openParticipantsModal(params.get("eventId"));
        }
      } catch(e) {
        console.error("LIFF 初始化失敗", e);
        showToast("LIFF 初始化失敗，請於 LINE 內開啟！");
      }
      hideLoading();
    }

    function waitForLiff() {
      return new Promise(resolve => {
        if (typeof liff !== "undefined") { resolve(); return; }
        const t = setInterval(() => {
          if (typeof liff !== "undefined") { clearInterval(t); resolve(); }
        }, 50);
      });
    }

    // ============================================================
    // 會員登入 / 快速綁定
    // ============================================================
    async function loginOrRegisterUser() {
      try {
        const res = await postGAS({ action:"loginOrRegister", lineId:userLineId, name:userDisplayName });
        if (res.status === "success") {
          if (res.isBound) {
            userProfile = res.user;
            document.getElementById("userName").textContent = userProfile.name;
            if (res.isAdmin) {
              isAdmin = true;
              const btn = document.getElementById("adminBtn");
              btn.style.display = "block";
            }
          } else {
            document.getElementById("loginName").value = userDisplayName;
            document.getElementById("loginModal").classList.add("show");
          }
        }
      } catch(e) { console.error("會員登入失敗", e); }
    }

    async function handleLoginRegister(e) {
      e.preventDefault();
      const name  = document.getElementById("loginName").value.trim();
      const phone = document.getElementById("loginPhone").value.trim();
      if (!name || !phone) { showToast("請填寫姓名與手機號碼！"); return; }

      showLoading("正在綁定並登入...");
      try {
        const res = await postGAS({ action:"bindUser", lineId:userLineId, name, phone });
        if (res.status === "success") {
          userProfile = res.user;
          document.getElementById("userName").textContent = userProfile.name;
          document.getElementById("loginModal").classList.remove("show");
          if (res.isAdmin) { isAdmin = true; document.getElementById("adminBtn").style.display = "block"; }
          showToast("🎉 LINE 快速登入綁定成功！");
        } else {
          showToast("綁定失敗：" + res.message);
        }
      } catch(e) { showToast("連線失敗，請稍後重試！"); }
      hideLoading();
    }

    function openProfileModal() {
      if (!userProfile) return;
      document.getElementById("profileName").value    = userProfile.name    || "";
      document.getElementById("profilePhone").value   = userProfile.phone   || "";
      document.getElementById("profileGender").value  = userProfile.gender  || "";
      document.getElementById("profileBirthday").value = userProfile.birthday ? userProfile.birthday.split("T")[0] : "";
      document.getElementById("profileIdCard").value  = userProfile.idCard  || "";
      document.getElementById("profileAddress").value = userProfile.address || "";
      document.getElementById("profileModal").classList.add("show");
    }

    async function saveProfile(e) {
      e.preventDefault();
      showLoading("正在儲存會員資料...");
      try {
        const payload = {
          action:"saveProfile", lineId:userLineId,
          name:    document.getElementById("profileName").value.trim(),
          phone:   document.getElementById("profilePhone").value.trim(),
          gender:  document.getElementById("profileGender").value,
          birthday:document.getElementById("profileBirthday").value,
          idCard:  document.getElementById("profileIdCard").value.trim().toUpperCase(),
          address: document.getElementById("profileAddress").value.trim()
        };
        const res = await postGAS(payload);
        if (res.status === "success") {
          userProfile = res.user;
          document.getElementById("userName").textContent = userProfile.name;
          showToast("會員資料更新成功！");
          closeModal("profileModal");
        } else { showToast("儲存失敗：" + res.message); }
      } catch(e) { showToast("連線失敗"); }
      hideLoading();
    }

    // ============================================================
    // 資料讀取連線邏輯
    // ============================================================
    async function fetchCategories() {
      const cached = cacheGet(CACHE_KEY_CATS);
      if (cached) {
        allCategories = cached;
        buildCatColorMap();
        renderCategoryTabs();
        renderAdminCategorySelect();
        return;
      }
      try {
        const res = await getGAS("getCategories");
        if (res.status === "success") {
          allCategories = res.categories;
          cacheSet(CACHE_KEY_CATS, allCategories, CACHE_TTL_CATS);
          buildCatColorMap();
          renderCategoryTabs();
          renderAdminCategorySelect();
        }
      } catch(e) { console.error("載入分類失敗", e); }
    }

    async function fetchEvents() {
      const cached = cacheGet(CACHE_KEY_EVENTS);
      if (cached) {
        allEvents = cached;
        renderEventList();
        renderAdminEventSelects();
        return;
      }
      try {
        const res = await getGAS("getEvents");
        if (res.status === "success") {
          allEvents = res.events;
          cacheSet(CACHE_KEY_EVENTS, allEvents, CACHE_TTL_EVENTS);
          renderEventList();
          renderAdminEventSelects();
        }
      } catch(e) { console.error("載入活動失敗", e); }
    }

    function buildCatColorMap() {
      allCategories.forEach((cat, i) => {
        catColorMap[cat] = i % CAT_COLORS;
      });
    }

    // ============================================================
    // UI 渲染 (修正照片與簡章安全解析)
    // ============================================================
    function renderCategoryTabs() {
      const container = document.getElementById("categoryTabs");
      const frag = document.createDocumentFragment();

      const allBtn = document.createElement("button");
      allBtn.className = "cat-tab " + (currentFilterCategory === "all" ? "active-all" : "inactive-all");
      allBtn.textContent = "全部活動";
      allBtn.onclick = () => filterCategory("all");
      frag.appendChild(allBtn);

      allCategories.forEach(cat => {
        const idx = getCatColorIndex(cat);
        const isActive = currentFilterCategory === cat;
        const btn = document.createElement("button");
        btn.className = "cat-tab " + (isActive ? `active-cat-${idx}` : `inactive-cat-${idx}`);
        btn.textContent = cat;
        btn.onclick = () => filterCategory(cat);
        frag.appendChild(btn);
      });

      container.innerHTML = "";
      container.appendChild(frag);
    }

    function filterCategory(cat) {
      currentFilterCategory = cat;
      renderCategoryTabs();
      renderEventList();
    }

    function renderEventList() {
      const container = document.getElementById("eventListContainer");
      const filtered = allEvents.filter(e =>
        currentFilterCategory === "all" || e.category === currentFilterCategory
      );

      if (filtered.length === 0) {
        container.innerHTML = `<div class="card" style="text-align:center;color:var(--text-light);padding:40px 0;font-weight:900">目前暫無相關項目 🌸</div>`;
        return;
      }

      const frag = document.createDocumentFragment();
      filtered.forEach(ev => {
        const card = buildEventCard(ev);
        frag.appendChild(card);
      });

      container.innerHTML = "";
      container.appendChild(frag);
    }

    function buildEventCard(ev) {
      const isStop = ev.status === "停止";
      const catIdx = getCatColorIndex(ev.category);

      const card = document.createElement("div");
      card.className = "card event-card";

      // 分類與狀態
      const headerRow = document.createElement("div");
      headerRow.className = "event-card-header";
      headerRow.innerHTML = `
        <span class="cat-badge cat-badge-${catIdx}">${ev.category}</span>
        <span class="${isStop ? "status-badge-stop" : "status-badge-open"}">${isStop ? "已截止" : "開放中"}</span>
      `;
      card.appendChild(headerRow);

      // 標題與簡短描述
      const titleEl = document.createElement("div");
      titleEl.innerHTML = `
        <div class="event-title">${ev.title}</div>
        ${ev.description ? `<div class="event-desc" style="margin-top:6px">${ev.description}</div>` : ""}
      `;
      card.appendChild(titleEl);

      // 📷 修正版：安全解析並展示活動照片 (最多 5 張)
      let photoUrls = [];
      try {
        if (ev.photos) {
          photoUrls = Array.isArray(ev.photos) ? ev.photos : JSON.parse(ev.photos);
        }
      } catch (e) {
        console.error("解析活動照片失敗", e);
        photoUrls = [];
      }

      if (Array.isArray(photoUrls) && photoUrls.length > 0) {
        const validPhotos = photoUrls.filter(url => url && url.trim() !== "" && url !== "undefined");
        if (validPhotos.length > 0) {
          const imgGrid = document.createElement("div");
          imgGrid.className = "event-images-grid";
          validPhotos.slice(0, 5).forEach(img => {
            const imgEl = document.createElement("img");
            imgEl.src = img.trim();
            imgEl.className = "event-img";
            imgEl.onerror = function() { this.style.display = 'none'; };
            imgGrid.appendChild(imgEl);
          });
          card.appendChild(imgGrid);
        }
      }

      // 資訊區 (日期、費用)
      const infoDiv = document.createElement("div");
      infoDiv.className = "event-info";
      infoDiv.innerHTML = `
        <div class="event-info-row"><span class="event-info-icon">📅</span><span><span class="event-info-label">日期：</span>${ev.time ? ev.time.split(" ")[0] : "未定"}</span></div>
        <div class="event-info-row"><span class="event-info-icon">💰</span><span><span class="event-info-label">費用：</span>NT$ ${ev.price || 0}</span></div>
      `;
      card.appendChild(infoDiv);

      // 📄 HTML 簡章按鈕 (安全過濾)
      if (ev.htmlFile && ev.htmlFile !== "undefined" && ev.htmlFile.trim() !== "") {
        const htmlBtn = document.createElement("a");
        htmlBtn.href = ev.htmlFile.trim();
        htmlBtn.target = "_blank";
        htmlBtn.className = "html-brochure-btn";
        htmlBtn.innerHTML = `📄 查看詳細 HTML 簡章`;
        card.appendChild(htmlBtn);
      }

      // 操作按鈕
      const actionsDiv = document.createElement("div");
      actionsDiv.className = "event-actions";
      actionsDiv.innerHTML = `
        <button onclick="openParticipantsModal('${ev.id}')" class="btn-secondary">🔍 活動細節</button>
        <button onclick="openRegisterModal('${ev.id}')" ${isStop ? "disabled" : ""}
          class="btn-primary" style="${isStop ? "background:#94a3b8;border-color:#64748b" : ""}">
          ✍️ 立即登記
        </button>
      `;
      card.appendChild(actionsDiv);

      return card;
    }

    function openRegisterModal(eventId) {
      if (!userProfile || !userProfile.phone || !userProfile.idCard) {
        showToast("登記前請先完善您的會員資料！");
        openProfileModal();

    function addAttendeeForm(name = "", phone = "", isSelf = false) {
      const container = document.getElementById("attendeesContainer");
      const index = container.children.length;
      const div = document.createElement("div");
      div.className = "attendee-row";

      let questionsHtml = "";
      (currentEvent.questions || []).forEach(q => {
        if (q.title === "姓名") return;
        const req = q.required ? '<span style="color:var(--danger)">*</span>' : "";
        const reqAttr = q.required ? "required" : "";
        if (q.type === "select") {
          const opts = q.options.split(",").map(o => `<option value="${o.trim()}">${o.trim()}</option>`).join("");
          questionsHtml += `<div>
            <label>${q.title} ${req}</label>
            <select data-qtitle="${q.title}" class="q-input" ${reqAttr}>
              <option value="">請選擇</option>${opts}
            </select>
          </div>`;
        } else {
          questionsHtml += `<div>
            <label>${q.title} ${req}</label>
            <input type="text" data-qtitle="${q.title}" class="q-input" placeholder="請輸入內容" ${reqAttr}>
          </div>`;
        }
      });

      div.innerHTML = `
        ${isSelf ? "" : `<button type="button" onclick="this.closest('.attendee-row').remove()" class="btn-danger btn-sm" style="width:auto;align-self:flex-end">❌ 移除</button>`}
        <div class="attendee-label">${isSelf ? "👤 本人（主要聯絡人）" : `👥 同行人 / 合併登記 #${index + 1}`}</div>
        <div>
          <label>姓名 <span style="color:var(--danger)">*</span></label>
          <input type="text" class="att-name" value="${name}" required ${isSelf ? "readonly" : ""}>
        </div>
        <div>
          <label>電話 ${isSelf ? '<span style="color:var(--danger)">*</span>' : "(選填)"}</label>
          <input type="tel" class="att-phone" value="${phone}" ${isSelf ? "required readonly" : ""}>
        </div>
        ${questionsHtml}
      `;
      container.appendChild(div);
    }

    // 🛡️ 防重複點擊優化
    async function submitMultiRegistration() {
      const { attendees, isValid } = collectAttendees();
      if (!isValid) { showToast("請填寫所有必填欄位！"); return; }

      const submitBtn = document.getElementById("regSubmitBtn");
      submitBtn.disabled = true;

      showLoading("正在提交登記...");
      try {
        const payload = {
          action:"registerMulti", eventId:currentEvent.id,
          lineId:userLineId, leaderName:userProfile.name, leaderPhone:userProfile.phone,
          groupId:(liff.getContext() && liff.getContext().groupId) || "",
          attendees
        };
        const res = await postGAS(payload);
        if (res.status === "success") {
          closeModal("registerModal");
          cacheClear(CACHE_KEY_EVENTS);
          await sendFlexMessage(currentEvent.time, currentEvent.title, res.remainingSpots, res.myRegisteredAttendees, attendees.length, false);
          showToast(`🎉 登記成功！狀態：【${res.queueStatus}】${res.queueStatus === "候補" ? ` (候補 #${res.queueIndex})` : ""}`);
          await fetchEvents();
        } else { showToast("登記失敗：" + res.message); }
      } catch(e) { showToast("連線失敗"); }
      submitBtn.disabled = false;
      hideLoading();
    }

    function collectAttendees() {
      const rows = document.querySelectorAll(".attendee-row");
      const attendees = [];
      let isValid = true;

      rows.forEach(row => {
        const nameInput  = row.querySelector(".att-name");
        const phoneInput = row.querySelector(".att-phone");
        if (!nameInput.value.trim()) {
          isValid = false;
          nameInput.style.borderColor = "var(--danger)";
        } else { nameInput.style.borderColor = ""; }

        const answers = { "姓名": nameInput.value.trim() };
        row.querySelectorAll(".q-input").forEach(qi => {
          const title = qi.getAttribute("data-qtitle");
          if (qi.hasAttribute("required") && !qi.value.trim()) {
            isValid = false;
            qi.style.borderColor = "var(--danger)";
          } else { qi.style.borderColor = ""; }
          answers[title] = qi.value.trim();
        });

        attendees.push({ name:nameInput.value.trim(), phone:phoneInput.value.trim(), answers });
      });

      return { attendees, isValid };
    }

    // ============================================================
    // 接龍名單 (卡片分頁)
    // ============================================================
    async function openParticipantsModal(eventId) {
      currentEvent = allEvents.find(e => e.id === eventId);
      document.getElementById("participantsModal").classList.add("show");
      const container = document.getElementById("participantsCardContainer");
      container.innerHTML = `<p style="color:var(--text-light);font-weight:900">載入接龍名單中...</p>`;

      try {
        const res = await getGAS(`getParticipants&eventId=${eventId}`);
        if (res.status === "success") {
          currentParticipants = res.participants;
          currentCardPage = 0;
          renderParticipantsCards();
        }
      } catch(e) {
        container.innerHTML = `<p style="color:var(--danger);font-weight:900">載入失敗</p>`;
      }
    }

    function renderParticipantsCards() {
      const container = document.getElementById("participantsCardContainer");
      container.innerHTML = "";

      if (currentParticipants.length === 0) {
        container.innerHTML = `<div style="text-align:center;padding:40px 0;color:var(--text-light);font-weight:900">目前尚無人登記，快來搶頭香！🌸</div>`;
        document.getElementById("prevCardBtn").disabled = true;
        document.getElementById("nextCardBtn").disabled = true;
        document.getElementById("cardPageIndicator").textContent = "0 / 0";
        return;
      }

      const total = Math.ceil(currentParticipants.length / CARD_PAGE_SIZE);
      const start = currentCardPage * CARD_PAGE_SIZE;
      const end   = Math.min(start + CARD_PAGE_SIZE, currentParticipants.length);
      const page  = currentParticipants.slice(start, end);

      const card = document.createElement("div");
      card.style.cssText = "background:var(--brand-light);border-radius:16px;border:2px solid #fdba74;padding:14px";

      let html = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;border-bottom:2px solid #fdba74;padding-bottom:10px">
        <span style="font-weight:900;color:var(--brand-dark)">🌸 登記接龍卡 (${start+1}~${end} 號)</span>
        <span style="background:var(--brand);color:#fff;border-radius:10px;padding:4px 12px;font-size:15px;font-weight:900">共 ${currentParticipants.length} 人</span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">`;

      page.forEach((p, i) => {
        const isBackup = p.status === "候補";
        html += `<div style="display:flex;align-items:center;gap:6px;padding-bottom:8px;border-bottom:1px solid rgba(253,186,116,.4)">
          <span style="font-weight:900;color:var(--text)">${start+i+1}. ${p.name}</span>
          ${isBackup ? `<span style="font-size:13px;color:var(--warning);font-weight:900">(候)</span>` : ""}
        </div>`;
      });

      html += `</div>`;
      card.innerHTML = html;
      container.appendChild(card);

      document.getElementById("prevCardBtn").disabled = currentCardPage === 0;
      document.getElementById("nextCardBtn").disabled = currentCardPage >= total - 1;
      document.getElementById("cardPageIndicator").textContent = `${currentCardPage+1} / ${total}`;
    }

    function changeCardPage(dir) {
      const total = Math.ceil(currentParticipants.length / CARD_PAGE_SIZE);
      currentCardPage = Math.max(0, Math.min(currentCardPage + dir, total - 1));
      renderParticipantsCards();
    }

    // 🛡️ 安全修補：傳入 userLineId 進行身份驗證
    async function viewRegistrationDetails(regId) {
      showLoading("載入明細中...");
      try {
        const res = await getGAS(`getRegistrationDetails&regId=${regId}&lineId=${userLineId}`);
        if (res.status === "success") {
          const container = document.getElementById("regDetailsContainer");
          const frag = document.createDocumentFragment();

            for (let k in att.answers) {
              if (k !== "姓名") ansHtml += `<div style="margin-top:4px">• ${k}：<strong>${att.answers[k]}</strong></div>`;
            }
            const div = document.createElement("div");
            div.className = "card";
            div.style.cssText = "display:flex;flex-direction:column;gap:10px;margin-bottom:10px;";

              <div style="display:flex;justify-content:space-between;align-items:center">
                <span style="font-weight:900;font-size:var(--font-lg)">#${i+1} ${att.name}</span>
                <span class="${att.queueStatus === "候補" ? "status-badge-stop" : "status-badge-open"}">${att.queueStatus}</span>
              </div>

    async function openEditRegistration(eventId, regId) {
      currentEvent = allEvents.find(e => e.id === eventId);
      document.getElementById("regEventTitle").textContent = currentEvent.title;
      document.getElementById("attendeesContainer").innerHTML = "";

      showLoading("載入原登記資料中...");
      try {
        const res = await getGAS(`getRegistrationDetails&regId=${regId}&lineId=${userLineId}`);
        if (res.status === "success") {
          closeModal("myRegistrationsModal");
          document.getElementById("registerModal").classList.add("show");

          res.attendees.forEach((att, i) => {
            addAttendeeForm(att.name, att.phone, i === 0);
            const rows = document.querySelectorAll(".attendee-row");
            const row  = rows[rows.length - 1];
            row.querySelectorAll(".q-input").forEach(qi => {
              const t = qi.getAttribute("data-qtitle");
              if (att.answers[t]) qi.value = att.answers[t];
            });
          });

          document.getElementById("regSubmitBtn").setAttribute("onclick", `submitEditRegistration('${regId}')`);
        } else {
          showToast(res.message);
        }
      } catch(e) { showToast("載入失敗"); }
      hideLoading();
    }

    async function submitEditRegistration(regId) {
      const { attendees, isValid } = collectAttendees();
      if (!isValid) { showToast("請填寫所有必填欄位！"); return; }

      const submitBtn = document.getElementById("regSubmitBtn");
      submitBtn.disabled = true;

      showLoading("正在更新登記資料...");
      try {
        const payload = {
          action:"registerMulti", regId, eventId:currentEvent.id,
          lineId:userLineId, leaderName:userProfile.name, leaderPhone:userProfile.phone,
          groupId:(liff.getContext() && liff.getContext().groupId) || "",
          attendees
        };
        const res = await postGAS(payload);
        if (res.status === "success") {
          closeModal("registerModal");
          cacheClear(CACHE_KEY_EVENTS);
          await sendFlexMessage(currentEvent.time, currentEvent.title, res.remainingSpots, res.myRegisteredAttendees, attendees.length, true);
          showToast(`✏️ 登記資料修改成功！狀態：【${res.queueStatus}】`);
          document.getElementById("regSubmitBtn").setAttribute("onclick", "submitMultiRegistration()");
          await fetchEvents();
        } else { showToast("修改失敗：" + res.message); }
      } catch(e) { showToast("連線失敗"); }
      submitBtn.disabled = false;
      hideLoading();
    }

      ["event","reg","announce","cat"].forEach(t => {
        document.getElementById(`adminTab_${t}`).style.display = "none";

    function loadEventToForm(eventId) {
      if (!eventId) { switchToCreateMode(); return; }
      const ev = allEvents.find(e => e.id === eventId);
      if (!ev) return;
      showLoading("正在載入項目設定...");
      document.getElementById("adminEventId").value = ev.id;
      document.getElementById("adminTitle").value = ev.title;
      document.getElementById("adminCategory").value = ev.category;
      document.getElementById("adminLocation").value = ev.location;
      document.getElementById("adminLimit").value = ev.limit;
      document.getElementById("adminStatus").value = ev.status;
      document.getElementById("adminPrice").value = ev.price || 0;
      document.getElementById("adminDescription").value = ev.description || "";
      if (ev.time) document.getElementById("adminTime").value = ev.time.replace(" ","T");

      // 載入 HTML 簡章狀態
      if (ev.htmlFile) {
        document.getElementById("htmlExistName").textContent = "已託管簡章";
        document.getElementById("htmlSuccessBox").style.display = "flex";
      } else {
        document.getElementById("htmlSuccessBox").style.display = "none";
      }

      // 載入照片預覽
      uploadedPhotos = [...(ev.photos || [])];
      renderPhotoPreviews();

      document.getElementById("adminFilesContainer").innerHTML = "";
      (ev.files || []).forEach(f => addAdminFileField(f.name, f.url));

      document.getElementById("adminQuestionsContainer").innerHTML = "";
      if (ev.questions && ev.questions.length > 0) {
        ev.questions.forEach(q => addAdminQuestionField(q.title, q.type, q.options, q.required));

    // ── CSV 匯出 ──
    function exportToCSV() {
      const participants = window.currentAdminParticipants;
      const questions    = window.currentAdminQuestions || [];
      const notesConfig  = window.currentAdminNotesConfig || [];
      if (!participants || participants.length === 0) { showToast("沒有名單資料可供匯出！"); return; }

      const qTitles   = questions.map(q => q.title).filter(t => t !== "姓名");
      const noteTitles = notesConfig.map(n => n.title);
      const headers   = ["編號","登記ID","姓名","電話","錄取狀態",...qTitles,...noteTitles];

      const rows = [headers.join(",")];
      participants.forEach((p, i) => {
        const row = [
          i+1, p.regId,
          `"${p.name.replace(/"/g,'""')}"`,
          `"\t${p.phone}"`,
          p.status,
          ...qTitles.map(t => `"${(p.answers[t]||"").replace(/"/g,'""')}"`),
          ...noteTitles.map(t => `"${((p.adminNotes&&p.adminNotes[t])||"").replace(/"/g,'""')}"`)
        ];
        rows.push(row.join(","));
      });

      const csv  = "\uFEFF" + rows.join("\n");
      const blob = new Blob([csv], { type:"text/csv;charset=utf-8;" });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement("a");
      a.href = url;
      a.download = `${currentEvent.title}_登記報表_${new Date().toISOString().split("T")[0]}.csv`;
      a.style.display = "none";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast("📊 報表已成功匯出！");
    }

      text += `🚴‍♂️ 項目：${currentEvent.title}\n📅 截止：${currentEvent.time.split(" ")[0]}\n`;

    async function fallbackShareTargetPicker(payload, raw) {
      if (liff.isApiAvailable("shareTargetPicker")) {
        try {
          const res = await liff.shareTargetPicker([payload]);
          if (res) showToast("接龍已成功分享！");
        } catch(e) { showCopyDialog(raw); }
      } else { showCopyDialog(raw); }
    }

    function showCopyDialog(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.cssText = "position:fixed;opacity:0;top:0;left:0";
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      try {
        document.execCommand("copy");
        showToast("已複製接龍文字！請到 LINE 群組貼上發送。");
      } catch(e) {
        window.prompt("請複製下方接龍文字並貼到 LINE 群組：", text);
      }
      document.body.removeChild(ta);
    }

      const time = document.getElementById("adminTime").value;
      const location = document.getElementById("adminLocation").value.trim();
      const limit = document.getElementById("adminLimit").value;
      const status = document.getElementById("adminStatus").value;
      const price = document.getElementById("adminPrice").value;
      const description = document.getElementById("adminDescription").value.trim();

      if (!title||!category||!time||!location||!limit||!price) { showToast("請填寫所有必填欄位！"); return; }

      const files = [];
      document.querySelectorAll(".admin-file-row").forEach(row => {
        const inputs = row.querySelectorAll("input");
        if (inputs[0].value && inputs[1].value) files.push({ name:inputs[0].value.trim(), url:inputs[1].value.trim() });
      });

      const questions = [];
      document.querySelectorAll(".admin-q-row").forEach(row => {
        const titleInput = row.querySelector("input[type='text']");
        const typeSelect = row.querySelector(".q-type-select, select");
        const optInput   = row.querySelector(".option-input");
        const reqCb      = row.querySelector(".req-checkbox");
        questions.push({
          title: titleInput.value.trim(),
          type:  typeSelect ? typeSelect.value : "text",
          options: (typeSelect && typeSelect.value === "select") ? (optInput ? optInput.value.trim() : "") : "",
          required: titleInput.value.trim() === "姓名" ? true : (reqCb ? reqCb.checked : false)
        });
      });

      const adminNotesConfig = [];
      document.querySelectorAll(".admin-note-config-row").forEach(row => {
        const titleInput = row.querySelector("input[type='text']");
        const typeSelect = row.querySelector("select");
        const optInput   = row.querySelector(".option-input");
        adminNotesConfig.push({
          title: titleInput.value.trim(),
          type:  typeSelect ? typeSelect.value : "text",
          options: (typeSelect && typeSelect.value === "select") ? (optInput ? optInput.value.trim() : "") : ""
        });
      });

      showLoading("正在儲存項目...");
      try {
        const res = await postGAS({
          action:"saveEvent", id, title, category, time, location,
          limit:parseInt(limit), status, description, files, questions, adminNotesConfig,
          lineId:userLineId,
          price: parseFloat(price),
          htmlBase64: uploadedHtmlBase64,
          htmlFileName: uploadedHtmlName,
          photos: uploadedPhotos
        });
        if (res.status === "success") {
          showToast("項目儲存成功！");
          cacheClear(CACHE_KEY_EVENTS);
          await fetchEvents();
          switchToCreateMode();
        } else { showToast("儲存失敗：" + res.message); }
      } catch(e) { showToast("連線失敗"); }
      hideLoading();
    }

    async function deleteEvent() {
      const id = document.getElementById("adminEventId").value;
      if (!id) return;
      if (!confirm("確定要刪除此項目嗎？這將連同刪除所有相關設定且無法復原！")) return;
      showLoading("正在刪除項目...");
      try {
        const res = await postGAS({ action:"deleteEvent", id, lineId:userLineId });
        if (res.status === "success") {
          showToast("項目已刪除！");
          cacheClear(CACHE_KEY_EVENTS);
          await fetchEvents();
          switchToCreateMode();
        } else { showToast("刪除失敗：" + res.message); }
      } catch(e) { showToast("連線失敗"); }
      hideLoading();
    }

    // ── Flex 訊息 ──
    async function sendFlexMessage(evTime, evTitle, remaining, myAtts, count, isUpdate) {
      const titleText = isUpdate ? "✏️ 登記資料已修改！" : "📢 項目登記成功！";
      const summary   = myAtts.map(a => `${a.name}(${a.status})`).join("、");
      const flex = {
        type:"flex", altText:`📢 ${userDisplayName} 已登記：${evTitle}`,
        contents:{
          type:"bubble",
          header:{ type:"box", layout:"vertical", backgroundColor:"#c2410c", contents:[
            { type:"text", text:titleText, color:"#ffffff", weight:"bold", size:"lg" },
            { type:"text", text:`📅 截止：${evTime.split(" ")[0]}`, color:"#ffedd5", size:"sm", margin:"xs", weight:"bold" }
          ]},
          body:{ type:"box", layout:"vertical", spacing:"md", contents:[
            { type:"text", text:`🚴‍♂️ ${evTitle}`, weight:"bold", size:"md", color:"#c2410c", wrap:true },
            { type:"text", text:`🔥 剩餘名額：${remaining} 人/件`, weight:"bold", size:"sm", color:"#ef4444" },
            { type:"separator", margin:"sm" },
            { type:"box", layout:"vertical", spacing:"xs", contents:[
              { type:"text", text:`👤 本次登記 (${count} 人/件)：`, size:"xs", color:"#6b7280", weight:"bold" },
              { type:"text", text:summary, size:"sm", color:"#111827", weight:"bold", wrap:true }
            ]},
            { type:"separator", margin:"sm" }
          ]},
          footer:{ type:"box", layout:"horizontal", spacing:"sm", contents:[
            { type:"button", action:{ type:"uri", label:"前往登記 📝", uri:`https://liff.line.me/${LIFF_ID}` }, style:"secondary", height:"sm" },
            { type:"button", action:{ type:"uri", label:"登記清單 📋", uri:`https://liff.line.me/${LIFF_ID}?action=viewlist&eventId=${currentEvent?currentEvent.id:""}` }, style:"primary", color:"#c2410c", height:"sm" }
          ]}
        }
      };
      if (isInChatContext) {
        try { await liff.sendMessages([flex]); } catch(e) { await fallbackShare(flex); }
      } else { await fallbackShare(flex); }
    }

    async function fallbackShare(payload) {
      if (liff.isApiAvailable("shareTargetPicker")) {
        try { await liff.shareTargetPicker([payload]); } catch(e) {}
      }
    }

    // ============================================================
    // 工具函式 (標準 Fetch + 自動追蹤重導向，完美解決 CORS 限制)
    // ============================================================
    // ============================================================
    // 工具函式 (標準 Fetch + 自動追蹤重導向，完美解決 CORS 限制)
    // ============================================================
    async function getGAS(actionAndParams) {
      // 💡 修正：直接拼接 action 參數，不再使用會導致拼接錯誤的隨機數
      const url = `${GAS_URL}?action=${actionAndParams}`;
      
      const res = await fetch(url, {
        method: "GET",
        headers: {
          "Accept": "application/json"
        },
        redirect: "follow" // 💡 關鍵：必須允許瀏覽器跟隨 Google 的重導向
      });
      
      if (!res.ok) {
        throw new Error(`HTTP 錯誤！狀態碼: ${res.status}`);
      }
      return res.json();
    }


    async function postGAS(payload) {
      const res = await fetch(GAS_URL, {
        method:"POST",
        headers:{ "Content-Type":"text/plain" },
        body: JSON.stringify(payload),
        redirect: "follow"
      });
      
      if (!res.ok) {
        throw new Error(`HTTP 錯誤！狀態碼: ${res.status}`);
      }
      return res.json();
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove("show");
      if (id === "registerModal") {
        document.getElementById("regSubmitBtn").setAttribute("onclick", "submitMultiRegistration()");
      }
    }

    function showLoading(text) {
      document.getElementById("loadingText").textContent = text || "系統處理中...";
      document.getElementById("loading").classList.add("show");
    }
    function hideLoading() {
      document.getElementById("loading").classList.remove("show");
    }

    let toastTimer;
    function showToast(msg, duration = 3000) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), duration);
    }

    // ============================================================
    // 啟動
    // ============================================================
    if (typeof liff !== "undefined") {
      initializeLiff();
    } else {
      window.addEventListener("load", initializeLiff);
    }
  </script>
</body>
