                return;
            }

            const headers = ["編號", "登記ID", "姓名", "電話", "錄取狀態"];
            const qTitles = questions.map(q => q.title).filter(t => t !== "姓名");
            headers.push(...qTitles);

            const noteTitles = notesConfig.map(n => n.title);
            headers.push(...noteTitles);

            const csvRows = [headers.join(",")];

            participants.forEach((p, idx) => {
                const rowData = [
                    idx + 1,
                    p.regId,
                    `"${p.name.replace(/"/g, '""')}"`,
                    `"\t${p.phone}"`,
                    p.status
                ];

                qTitles.forEach(title => {
                    const ans = p.answers[title] || "";
                    rowData.push(`"${ans.replace(/"/g, '""')}"`);
                });

                noteTitles.forEach(title => {
                    const note = (p.adminNotes && p.adminNotes[title]) || "";
                    rowData.push(`"${note.replace(/"/g, '""')}"`);
                });

                csvRows.push(rowData.join(","));
            });

            const csvString = "\uFEFF" + csvRows.join("\n");
            const blob = new Blob([csvString], { type: "text/csv;charset=utf-8;" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `${currentEvent ? currentEvent.title : '活動'}_登記報表_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
            alert("📊 報表已成功匯出！");
        }

        async function onAnnouncementEventSelect() {
            const eventId = document.getElementById("announceEventSelect").value;
            const panel = document.getElementById("announcementPanel");
            
            if (!eventId) {
                panel.classList.add("hidden");
                return;
            }

            currentEvent = allEvents.find(e => e.id === eventId);
            tempQuestions = []; 
            
            showLoading("正在載入接龍名單...");
            await loadAdminParticipants(eventId);
            panel.classList.remove("hidden");
            hideLoading();
        }

        function addChainItemField(selectedVal = "") {
            const container = document.getElementById("chainItemsContainer");
            const div = document.createElement("div");
            div.className = "flex items-center space-x-2 chain-item-row";
            
            const allOptions = activeEventQuestions.concat(tempQuestions);
            let optionsHtml = allOptions.map(q => {
                const sel = q.title === selectedVal ? "selected" : "";
                return `<option value="${q.title}" ${sel}>${q.title}</option>`;
            }).join('');

            div.innerHTML = `
                <select class="flex-1 border-2 border-slate-300 text-base font-bold py-3 px-3 rounded-xl bg-white chain-select">
                    <option value="">-- 請選擇統計項目 --</option>
                    ${optionsHtml}
                </select>
                <button type="button" onclick="this.parentElement.remove()" class="text-red-600 font-black text-base border-2 border-red-200 bg-white px-4 py-2 rounded-xl">✕</button>
            `;
            container.appendChild(div);
        }

        function showTempQuestionDialog() {
            document.getElementById("tempQTitle").value = "";
            document.getElementById("tempQOptions").value = "";
            document.getElementById("tempQuestionModal").classList.remove("hidden");
        }

        function closeTempQuestionDialog() {
            document.getElementById("tempQuestionModal").classList.add("hidden");
        }

        function addTempQuestion() {
            const title = document.getElementById("tempQTitle").value.trim();
            const optionsStr = document.getElementById("tempQOptions").value.trim();
            
            if (!title) {
                alert("請輸入項目名稱！");
                return;
            }

            if (activeEventQuestions.concat(tempQuestions).some(q => q.title === title)) {
                alert("此項目名稱已存在！");
                return;
            }

            tempQuestions.push({
                title: title,
                type: optionsStr ? "select" : "text",
                options: optionsStr,
                isTemp: true
            });
            closeTempQuestionDialog();
            renderAnnounceParticipantsList();
            addChainItemField(title);
        }

        async function loadAdminParticipants(eventId) {
            const listContainer = document.getElementById("announceParticipantsList");
            listContainer.innerHTML = `<p class="text-slate-500 text-center py-4 font-bold">名單載入中...</p>`;

            try {
                const response = await fetch(`${GAS_URL}?action=getAdminParticipants&eventId=${eventId}`);
                const result = await response.json();
                
                if (result.status === "success") {
                    activeEventQuestions = result.questions.filter(q => q.title !== "姓名");
                    currentParticipants = result.participants;

                    document.getElementById("chainItemsContainer").innerHTML = "";
                    if (activeEventQuestions.length > 0) {
                        addChainItemField(activeEventQuestions[0].title);
                    } else {
                        addChainItemField();
                    }

                    renderAnnounceParticipantsList();
                }
            } catch (e) {
                listContainer.innerHTML = `<p class="text-red-500 text-center py-4 font-bold">名單載入失敗</p>`;
            }
        }

        function renderAnnounceParticipantsList() {
            const listContainer = document.getElementById("announceParticipantsList");
            listContainer.innerHTML = "";

            if (currentParticipants.length === 0) {
                listContainer.innerHTML = `<p class="text-slate-500 text-center py-4 font-bold">目前尚無人登記</p>`;
                return;
            }

            currentParticipants.forEach((p, idx) => {
                const isBackup = p.status === "候補";
                const badgeColor = isBackup ? "bg-amber-100 text-amber-950 border-amber-300" : "bg-emerald-100 text-emerald-950 border-emerald-300";
                
                let ansText = "";
                activeEventQuestions.forEach(q => {
                    const ans = p.answers[q.title] || "無";
                    ansText += `<br>• ${q.title}：<span class="text-slate-950 font-black">${ans}</span>`;
                });

                let tempAnsHtml = "";
                tempQuestions.forEach(q => {
                    if (!p.answers[q.title]) p.answers[q.title] = "";
                    
                    let inputHtml = "";
                    if (q.type === "select") {
                        const opts = q.options.split(',');
                        let optsHtml = opts.map(o => {
                            const sel = o.trim() === p.answers[q.title] ? "selected" : "";
                            return `<option value="${o.trim()}" ${sel}>${o.trim()}</option>`;
                        }).join('');
                        inputHtml = `
                            <select onchange="updateParticipantTempAns(${idx}, '${q.title}', this.value)" class="border-2 border-slate-400 text-sm font-bold py-2 px-3 rounded-xl ml-1 bg-blue-50">
                                <option value="">請選擇</option>
                                ${optsHtml}
                            </select>
                        `;
                    } else {
                        inputHtml = `
                            <input type="text" value="${p.answers[q.title]}" oninput="updateParticipantTempAns(${idx}, '${q.title}', this.value)" class="border-2 border-slate-400 text-sm font-bold py-2 px-3 rounded-xl ml-1 bg-blue-50" placeholder="輸入內容">
                        `;
                    }

                    tempAnsHtml += `
                        <div class="mt-2 text-blue-950 font-black flex items-center text-sm">
                            ⚡ ${q.title}：${inputHtml}
                        </div>
                    `;
                });

                const item = document.createElement("div");
                item.className = "p-4 bg-white rounded-3xl border-2 border-slate-300 text-base space-y-2";
                item.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="font-black text-slate-950 text-lg">#${idx+1} ${p.name}</span>
                        <span class="px-3 py-0.5 rounded-full font-black text-xs border ${badgeColor}">${p.status}</span>
                    </div>
                    <p class="text-slate-700 font-bold">${ansText}</p>
                    ${tempAnsHtml}
                `;
                listContainer.appendChild(item);
            });
        }

        function updateParticipantTempAns(pIdx, qTitle, value) {
            if (currentParticipants[pIdx]) {
                currentParticipants[pIdx].answers[qTitle] = value;
            }
        }

        async function shareCustomChainToGroup() {
            const selectedTitles = [];
            document.querySelectorAll(".chain-select").forEach(sel => {
                if (sel.value) selectedTitles.push(sel.value);
            });

            if (selectedTitles.length === 0) {
                alert("請至少選擇一個統計項目！");
                return;
            }

            if (currentParticipants.length === 0) {
                alert("目前尚無名單可發送接龍！");
                return;
            }

            showLoading("正在發送接龍公告...");
            const customMsg = document.getElementById("announceCustomMsg").value.trim();
            
            let chainText = `📢 【三鐵飛翔 項目接龍公告】\n`;
            chainText += `───────────────────\n`;
            chainText += `🚴‍♂️ 項目：${currentEvent.title}\n`;
            chainText += `📅 截止：${currentEvent.time.split(' ')[0]}\n`;
            if (customMsg) chainText += `💡 備註：${customMsg}\n`;
            chainText += `───────────────────\n\n`;
            chainText += `📝 統計項目：[ ${selectedTitles.join(" | ")} ]\n`;
            chainText += `👇 當前最新接龍名單：\n`;
            chainText += `━━━━━━━━━━━━━━━━━━━\n`;

            currentParticipants.forEach((p, idx) => {
                const ansList = selectedTitles.map(t => p.answers[t] || "無");
                const statusMark = p.status === "候補" ? " ⚠️(候補)" : "";
                const globalIdx = (idx + 1).toString().padStart(2, '0');
                chainText += `🔹 ${globalIdx}. ${p.name}${statusMark}\n    ➔ ${ansList.join(" | ")}\n`;
            });
            
            chainText += `━━━━━━━━━━━━━━━━━━━\n`;
            chainText += `✨ 共 ${currentParticipants.length} 人登記，名額搶購中！`;

            const textPayload = { type: "text", text: chainText };

            if (isInChatContext) {
                try {
                    await liff.sendMessages([textPayload]);
                    alert("接龍公告已發布至群組！");
                } catch (e) {
                    await fallbackShareTargetPicker(textPayload, chainText);
                }
            } else {
                await fallbackShareTargetPicker(textPayload, chainText);
            }
            hideLoading();
        }

        async function fallbackShareTargetPicker(textPayload, rawText) {
            if (liff.isApiAvailable('shareTargetPicker')) {
                try {
                    const res = await liff.shareTargetPicker([textPayload]);
                    if (res) alert("接龍已成功分享至指定聊天室！");
                } catch (e) {
                    copyToClipboard(rawText);
                }
            } else {
                copyToClipboard(rawText);
            }
        }

        function copyToClipboard(text) {
            const t = document.createElement("textarea");
            t.value = text;
            document.body.appendChild(t);
            t.select();
            document.execCommand("copy");
            document.body.removeChild(t);
            alert("已複製接龍文字至剪貼簿，請至 LINE 群組中貼上送出！\n\n" + text);
        }

        function renderAdminCategoryList() {
            const container = document.getElementById("adminCategoryListContainer");
            container.innerHTML = "";

            if (allCategories.length === 0) {
                container.innerHTML = '<p class="text-slate-500 text-center text-base py-4 font-bold">目前尚無分類</p>';
                return;
            }

            allCategories.forEach(cat => {
                const item = document.createElement("div");
                item.className = "flex justify-between items-center p-4 bg-slate-50 rounded-2xl border-2 border-slate-200 text-base";
                item.innerHTML = `
                    <span class="font-black text-slate-800">${cat}</span>
                    <button onclick="deleteCategory('${cat}')" class="text-red-600 font-black border-2 border-red-200 bg-white px-4 py-2 rounded-xl">✕ 刪除</button>
                `;
                container.appendChild(item);
            });
        }

        async function addNewCategory() {
            const catName = document.getElementById("newCategoryInput").value.trim();
            if (!catName) {
                alert("請輸入分類名稱！");
                return;
            }

            showLoading("正在新增分類...");
            try {
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({ 
                        action: "addCategory", 
                        categoryName: catName,
                        lineId: userLineId 
                    })
                });
                const result = await response.json();
                if (result.status === "success") {
                    document.getElementById("newCategoryInput").value = "";
                    await reloadEventsData();
                    renderAdminCategoryList();
                    alert("分類新增成功！");
                }
            } catch (e) {
                alert("連線失敗");
            }
            hideLoading();
        }

        async function deleteCategory(catName) {
            if (!confirm(`確定要刪除分類「${catName}」嗎？`)) return;

            showLoading("正在刪除分類...");
            try {
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({ 
                        action: "deleteCategory", 
                        categoryName: catName,
                        lineId: userLineId 
                    })
                });
                const result = await response.json();
                if (result.status === "success") {
                    await reloadEventsData();
                    renderAdminCategoryList();
                    alert("分類已刪除！");
                }
            } catch (e) {
                alert("連線失敗");
            }
            hideLoading();
        }

        async function saveEvent() {
            const id = document.getElementById("adminEventId").value;
            const title = document.getElementById("adminTitle").value.trim();
            const category = document.getElementById("adminCategory").value;
            const time = document.getElementById("adminTime").value;
            const location = document.getElementById("adminLocation").value.trim();
            const limit = document.getElementById("adminLimit").value;
            const status = document.getElementById("adminStatus").value;
            const description = document.getElementById("adminDescription").value.trim();

            if (!title || !category || !time || !location || !limit) {
                alert("請填寫所有必填欄位！");
                return;
            }

            const files = [];
            document.querySelectorAll(".admin-file-row").forEach(row => {
                const inputs = row.querySelectorAll("input");
                if (inputs[0].value && inputs[1].value) {
                    files.push({ name: inputs[0].value.trim(), url: inputs[1].value.trim() });
                }
            });

            const questions = [];
            document.querySelectorAll(".admin-q-row").forEach(row => {
                const titleInput = row.querySelector("input[type='text']");
                const select = row.querySelector("select");
                const optionInput = row.querySelector(".option-input");
                const reqCheckbox = row.querySelector(".req-checkbox");
                
                questions.push({
                    title: titleInput.value.trim(),
                    type: select ? select.value : "text",
                    options: (select && select.value === "select") ? optionInput.value.trim() : "",
                    required: titleInput.value.trim() === "姓名" ? true : (reqCheckbox ? reqCheckbox.checked : false)
                });
            });

            const adminNotesConfig = [];
            document.querySelectorAll(".admin-note-config-row").forEach(row => {
                const titleInput = row.querySelector("input[type='text']");
                const select = row.querySelector("select");
                const optionInput = row.querySelector(".option-input");
                
                adminNotesConfig.push({
                    title: titleInput.value.trim(),
                    type: select ? select.value : "text",
                    options: (select && select.value === "select") ? optionInput.value.trim() : ""
                });
            });

            showLoading("正在儲存項目...");
            try {
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({
                        action: "saveEvent",
                        id: id,
                        title: title,
                        category: category,
                        time: time,
                        location: location,
                        limit: parseInt(limit),
                        status: status,
                        description: description,
                        files: files,
                        questions: questions,
                        adminNotesConfig: adminNotesConfig,
                        lineId: userLineId 
                    })
                });
                const result = await response.json();
                if (result.status === "success") {
                    alert("項目儲存成功！");
                    await reloadEventsData();
                    switchToCreateMode();
                } else {
                    alert("儲存失敗：" + result.message);
                }
            } catch (e) {
                alert("連線失敗");
            }
            hideLoading();
        }

        async function deleteEvent() {
            const id = document.getElementById("adminEventId").value;
            if (!id || !confirm("確定要刪除此項目嗎？所有相關設定將一併移除！")) return;

            showLoading("正在刪除項目...");
            try {
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({ 
                        action: "deleteEvent", 
                        id: id,
                        lineId: userLineId 
                    })
                });
                const result = await response.json();
                if (result.status === "success") {
                    alert("項目已刪除！");
                    await reloadEventsData();
                    switchToCreateMode();
                } else {
                    alert("刪除失敗：" + result.message);
                }
            } catch (e) {
                alert("連線失敗");
            }
            hideLoading();
        }

        async function reloadEventsData() {
            try {
                const [catRes, evRes] = await Promise.all([
                    fetch(`${GAS_URL}?action=getCategories`),
                    fetch(`${GAS_URL}?action=getEvents`)
                ]);
                const catData = await catRes.json();
                const evData = await evRes.json();
                
                if (catData.status === "success") allCategories = catData.categories;
                if (evData.status === "success") allEvents = evData.events;

                renderCategoryTabs();
                renderEventList();
                renderAdminCategorySelect();
                renderAdminEventSelects();
            } catch (e) {
                console.error("重新載入失敗", e);
            }
        }

        async function sendFlexMessage(eventTime, eventTitle, remainingSpots, myRegisteredAttendees, count, isUpdate) {
            const titleText = isUpdate ? "✏️ 登記資料已修改！" : "📢 項目登記成功！";
            const attendeesSummary = myRegisteredAttendees.map(a => `${a.name}(${a.status})`).join("、");

            const flexPayload = {
                type: "flex",
                altText: `📢 ${userDisplayName} 已登記：${eventTitle}`,
                contents: {
                    type: "bubble",
                    header: {
                        type: "box",
                        layout: "vertical",
                        backgroundColor: "#c2410c",
                        contents: [
                            { type: "text", text: titleText, color: "#ffffff", weight: "bold", size: "lg" },
                            { type: "text", text: `📅 截止日期：${eventTime.split(' ')[0]}`, color: "#ffedd5", size: "sm", margin: "xs", weight: "bold" }
                        ]
                    },
                    body: {
                        type: "box",
                        layout: "vertical",
                        spacing: "md",
                        contents: [
                            { type: "text", text: `🚴‍♂️ 項目名稱：${eventTitle}`, weight: "bold", size: "md", color: "#9a3412", wrap: true },
                            { type: "text", text: `🔥 剩餘名額/數量：${remainingSpots} 人/件`, weight: "bold", size: "sm", color: "#dc2626" },
                            { type: "separator", margin: "sm" },
                            {
                                type: "box",
                                layout: "vertical",
                                spacing: "xs",
                                contents: [
                                    { type: "text", text: `👤 本次登記名單 (${count} 人/件)：`, size: "xs", color: "#6b7280", weight: "bold" },
                                    { type: "text", text: attendeesSummary, size: "sm", color: "#111827", weight: "bold", wrap: true }
                                ]
                            }
                        ]
                    },
                    footer: {
                        type: "box",
                        layout: "horizontal",
                        spacing: "sm",
                        contents: [
                            {
                                type: "button",
                                action: { type: "uri", label: "前往登記 📝", uri: `https://liff.line.me/${LIFF_ID}` },
                                style: "secondary",
                                height: "sm"
                            },
                            {
                                type: "button",
                                action: { type: "uri", label: "登記清單 📋", uri: `https://liff.line.me/${LIFF_ID}?action=viewlist&eventId=${currentEvent ? currentEvent.id : ''}` },
                                style: "primary",
                                color: "#ea580c",
                                height: "sm"
                            }
                        ]
                    }
                }
            };

            if (isInChatContext) {
                try { await liff.sendMessages([flexPayload]); } catch (e) { await fallbackShare(flexPayload); }
            } else {
                await fallbackShare(flexPayload);
            }
        }

        async function fallbackShare(flexPayload) {
            if (liff.isApiAvailable('shareTargetPicker')) {
                try { await liff.shareTargetPicker([flexPayload]); } catch (e) {}
            }
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add("hidden");
        }

        function showLoading(text) {
            document.getElementById("loadingText").innerText = text;
            document.getElementById("loading").classList.remove("hidden");
        }

        function hideLoading() {
            document.getElementById("loading").classList.add("hidden");
        }

        initializeLiff();
    </script>
</body>
