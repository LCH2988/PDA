<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>三鐵飛翔 - 活動與購物登記系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang TC", "Microsoft JhengHei", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        /* 年長者友善：特大輸入框、加粗外框與防誤觸高度 */
        input, select, textarea {
            min-height: 58px !important;
            font-size: 19px !important;
        }
        button {
            min-height: 56px !important;
        }
        .cat-tab-bar::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-950 min-h-screen pb-24 text-lg font-medium selection:bg-amber-200">

    <!-- 頂部導覽列 -->
    <header class="bg-gradient-to-r from-orange-700 via-orange-600 to-amber-600 text-white sticky top-0 z-40 shadow-lg border-b-4 border-orange-900">
        <div class="max-w-md mx-auto px-4 py-3.5 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-white p-2 rounded-2xl shadow">
                    <span class="text-3xl">🚴‍♂️</span>
                </div>
                <div>
                    <h1 class="text-2xl font-black tracking-wide leading-none">三鐵飛翔</h1>
                    <span class="text-xs bg-orange-950 text-orange-100 px-2.5 py-0.5 rounded-full font-black mt-1 inline-block">活動與購物登記</span>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button id="adminBtn" onclick="enterAdminMode()" class="hidden bg-slate-950 hover:bg-black border-2 border-white text-white text-base font-black px-4 py-2 rounded-2xl transition-all active:scale-95 shadow">
                    ⚙️ 後台
                </button>
                <img id="userAvatar" onclick="openProfileModal()" class="w-12 h-12 rounded-full border-2 border-white shadow cursor-pointer hidden object-cover" src="" alt="頭像">
            </div>
        </div>
    </header>

    <!-- 主內容區 -->
    <main class="max-w-md mx-auto px-4 py-4 space-y-4">
        <!-- 會員歡迎與快捷區 -->
        <div class="bg-white rounded-3xl p-5 shadow-sm border-2 border-slate-300 space-y-3.5">
            <div class="flex justify-between items-center">
                <div>
                    <p class="text-sm text-slate-600 font-black">歡迎回來 👋</p>
                    <p class="text-2xl font-black text-slate-950"><span id="userName" class="border-b-4 border-amber-400 pb-0.5">載入中...</span></p>
                </div>
                <button onclick="openProfileModal()" class="text-sm bg-slate-100 hover:bg-slate-200 text-slate-800 font-black px-3.5 py-2 rounded-xl border border-slate-300">
                    ✏️ 修改資料
                </button>
            </div>
            <div class="grid grid-cols-2 gap-3 pt-1">
                <button onclick="openProfileModal()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-900 font-black py-3 rounded-2xl text-base border-2 border-slate-300 active:scale-95 transition-all flex items-center justify-center space-x-1.5 shadow-sm">
                    <span>👤 會員資料</span>
                </button>
                <button onclick="openMyRegistrationsModal()" class="w-full bg-orange-100 hover:bg-orange-200 text-orange-950 font-black py-3 rounded-2xl text-base border-2 border-orange-300 active:scale-95 transition-all flex items-center justify-center space-x-1.5 shadow-sm">
                    <span>📋 我的登記</span>
                </button>
            </div>
        </div>

        <!-- 類別標籤橫向滑動區 -->
        <div>
            <div id="categoryTabs" class="flex space-x-2 overflow-x-auto pb-1.5 cat-tab-bar"></div>
        </div>

        <!-- 活動/商品列表容器 -->
        <div id="eventListContainer" class="space-y-4"></div>
    </main>

    <!-- ================= 管理端後台彈窗 ================= -->
    <div id="adminPanel" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden overflow-y-auto">
        <div class="min-h-screen py-6 px-4">
            <div class="bg-slate-100 rounded-3xl max-w-md mx-auto shadow-2xl border-4 border-slate-400 overflow-hidden">
                <div class="bg-slate-950 text-white p-5 flex justify-between items-center border-b-4 border-slate-800">
                    <h2 class="text-2xl font-black">⚙️ 系統管理後台</h2>
                    <button onclick="exitAdminMode()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-xl text-base font-black shadow">關閉 ✕</button>
                </div>

                <div class="grid grid-cols-4 border-b-2 border-slate-300 bg-white">
                    <button onclick="switchAdminTab('event')" id="tabBtn_event" class="py-4 text-sm font-black text-orange-700 border-b-4 border-orange-700 bg-orange-50/50">活動維護</button>
                    <button onclick="switchAdminTab('reg')" id="tabBtn_reg" class="py-4 text-sm font-black text-slate-700">名單管理</button>
                    <button onclick="switchAdminTab('announce')" id="tabBtn_announce" class="py-4 text-sm font-black text-slate-700">接龍公告</button>
                    <button onclick="switchAdminTab('cat')" id="tabBtn_cat" class="py-4 text-sm font-black text-slate-700">分類設定</button>
                </div>

                <div class="p-4 space-y-5">
                    <!-- Tab 1: 活動維護 -->
                    <div id="adminTab_event" class="space-y-4">
                        <div class="flex justify-between items-center">
                            <span class="text-base font-black text-slate-700">項目維護</span>
                            <button onclick="switchToCreateMode()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-black px-4 py-2 rounded-xl text-sm shadow">➕ 新增項目</button>
                        </div>
                        <div class="bg-white p-4 rounded-2xl border-2 border-slate-300 space-y-2">
                            <label class="block text-sm font-black text-slate-800">選擇現有項目編輯：</label>
                            <select id="adminEventSelect" onchange="loadEventToForm(this.value)" class="w-full border-2 border-slate-400 rounded-xl p-3 text-base font-bold bg-white"></select>
                        </div>
                        <form id="eventForm" onsubmit="event.preventDefault(); saveEvent();" class="space-y-4 bg-white p-4 rounded-2xl border-2 border-slate-300">
                            <input type="hidden" id="adminEventId" value="">
                            <div>
                                <label class="block text-sm font-black text-slate-800 mb-1">活動/商品名稱 *</label>
                                <input type="text" id="adminTitle" class="w-full border-2 border-slate-400 rounded-xl p-3 text-base font-bold" required>
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-sm font-black text-slate-800 mb-1">分類 *</label>
                                    <select id="adminCategory" class="w-full border-2 border-slate-400 rounded-xl p-3 text-base font-bold bg-white" required></select>
                                </div>
                                <div>
                                    <label class="block text-sm font-black text-slate-800 mb-1">登記上限 *</label>
                                    <input type="number" id="adminLimit" class="w-full border-2 border-slate-400 rounded-xl p-3 text-base font-bold" required>
                                </div>
                            </div>
                            <div class="grid grid-cols-1 gap-3">
                                <div>
                                    <label class="block text-sm font-black text-slate-800 mb-1">截止時間 *</label>
                                    <input type="datetime-local" id="adminTime" class="w-full border-2 border-slate-400 rounded-xl p-3 text-base font-bold" required>
                                </div>
                                <div>
                                    <label class="block text-sm font-black text-slate-800 mb-1">地點/配送 *</label>
                                    <input type="text" id="adminLocation" class="w-full border-2 border-slate-400 rounded-xl p-3 text-base font-bold" required>
                                </div>
                            </div>
                            <div class="grid grid-cols-1 gap-3">
                                <div>
                                    <label class="block text-sm font-black text-slate-800 mb-1">狀態 *</label>
                                    <select id="adminStatus" class="w-full border-2 border-slate-400 rounded-xl p-3 text-base font-bold bg-white" required>
                                        <option value="啟動">開放登記 (啟動)</option>
                                        <option value="停止">停止登記 (停止)</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-black text-slate-800 mb-1">詳細說明</label>
                                    <textarea id="adminDescription" class="w-full border-2 border-slate-400 rounded-xl p-3 text-base font-bold h-24" placeholder="請輸入說明..."></textarea>
                                </div>
                            </div>
                            <!-- 附件連結 -->
                            <div class="border-t-2 border-slate-200 pt-3 space-y-2">
                                <div class="flex justify-between items-center">
                                    <span class="text-sm font-black text-slate-800">📎 附件下載：</span>
                                    <button type="button" onclick="addAdminFileField()" class="bg-orange-100 text-orange-950 border border-orange-300 px-3 py-1.5 rounded-xl text-xs font-black">➕ 新增附件</button>
                                </div>
                                <div id="adminFilesContainer" class="space-y-2"></div>
                            </div>
                            <!-- 自訂問題 -->
                            <div class="border-t-2 border-slate-200 pt-3 space-y-2">
                                <div class="flex justify-between items-center">
                                    <span class="text-sm font-black text-slate-800">📋 調查問題：</span>
                                    <button type="button" onclick="addAdminQuestionField()" class="bg-orange-100 text-orange-950 border border-orange-300 px-3 py-1.5 rounded-xl text-xs font-black">➕ 新增問題</button>
                                </div>
                                <div id="adminQuestionsContainer" class="space-y-3"></div>
                            </div>
                            <!-- 後台備註欄設定 -->
                            <div class="border-t-2 border-slate-200 pt-3 space-y-2">
                                <div class="flex justify-between items-center">
                                    <span class="text-sm font-black text-slate-800">⚙️ 後台備註欄（如：付款狀態）：</span>
                                    <button type="button" onclick="addAdminNoteConfigField()" class="bg-orange-100 text-orange-950 border border-orange-300 px-3 py-1.5 rounded-xl text-xs font-black">➕ 新增備註欄</button>
                                </div>
                                <div id="adminNotesConfigContainer" class="space-y-3"></div>
                            </div>
                            <div class="flex space-x-3 pt-3 border-t-2 border-slate-200">
                                <button type="submit" class="flex-1 bg-orange-600 hover:bg-orange-700 text-white font-black py-4 rounded-2xl text-lg shadow">💾 儲存項目</button>
                                <button type="button" id="adminDeleteEventBtn" onclick="deleteEvent()" class="hidden bg-red-600 hover:bg-red-700 text-white font-black px-6 py-4 rounded-2xl text-lg shadow">🗑️ 刪除</button>
                            </div>
                        </form>
                    </div>

                    <!-- Tab 2: 名單管理 -->
                    <div id="adminTab_reg" class="hidden space-y-4">
                        <div class="bg-white p-5 rounded-2xl border-2 border-slate-300 space-y-3">
                            <label class="block text-sm font-black text-slate-800">請選擇活動項目：</label>
                            <select id="regManageEventSelect" onchange="onRegManageEventSelect()" class="w-full border-2 border-slate-400 rounded-xl p-3 text-base font-bold bg-white"></select>
                            <button id="exportReportBtn" onclick="exportToCSV()" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-black py-4 rounded-2xl text-base flex items-center justify-center space-x-2 shadow hidden">
                                <span>📊 匯出 Excel / CSV 報表</span>
                            </button>
                        </div>
                        <div id="regManageListContainer" class="space-y-4">
                            <p class="text-slate-500 text-center text-base py-10 font-bold">請先選擇項目以載入名單</p>
                        </div>
                    </div>

                    <!-- Tab 3: 接龍公告 -->
                    <div id="adminTab_announce" class="hidden space-y-4">
                        <div class="bg-white p-5 rounded-2xl border-2 border-slate-300 space-y-3">
                            <label class="block text-sm font-black text-slate-800">請選擇活動項目：</label>
                            <select id="announceEventSelect" onchange="onAnnouncementEventSelect()" class="w-full border-2 border-slate-400 rounded-xl p-3 text-base font-bold bg-white"></select>
                        </div>
                        <div id="announcementPanel" class="hidden space-y-4">
                            <div class="bg-white p-5 rounded-2xl border-2 border-slate-300 space-y-4">
                                <div class="flex justify-between items-center">
                                    <span class="text-base font-black text-slate-800">1. 選擇統計欄位：</span>
                                    <button onclick="showTempQuestionDialog()" class="bg-blue-100 text-blue-900 border border-blue-300 px-3 py-1.5 rounded-xl text-xs font-black">⚡ 臨時統計</button>
                                </div>
                                <div id="chainItemsContainer" class="space-y-3"></div>
                                <button type="button" onclick="addChainItemField()" class="w-full bg-slate-100 text-slate-800 border-2 border-dashed border-slate-400 py-3.5 rounded-2xl text-sm font-black">➕ 新增統計欄位</button>
                            </div>
                            <div class="bg-white p-5 rounded-2xl border-2 border-slate-300 space-y-2">
                                <span class="text-base font-black text-slate-800">2. 自訂備註說明 (選填)：</span>
                                <textarea id="announceCustomMsg" class="w-full border-2 border-slate-400 rounded-xl p-3 text-base font-bold h-24" placeholder="例如：請大家於本週五前完成轉帳並回報！"></textarea>
                            </div>
                            <button onclick="shareCustomChainToGroup()" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-black py-4.5 rounded-2xl text-lg shadow-lg">
                                📢 發布卡牌式接龍公告 ➔
                            </button>
                            <div id="announceParticipantsList" class="space-y-3"></div>
                        </div>
                    </div>

                    <!-- Tab 4: 分類設定 -->
                    <div id="adminTab_cat" class="hidden space-y-4">
                        <div class="bg-white p-5 rounded-2xl border-2 border-slate-300 space-y-3">
                            <div class="flex space-x-2">
                                <input type="text" id="newCategoryInput" class="flex-1 border-2 border-slate-400 rounded-xl p-3 text-base font-bold" placeholder="輸入新分類名稱">
                                <button onclick="addNewCategory()" class="bg-orange-600 text-white font-black px-5 rounded-xl text-base shadow">新增</button>
                            </div>
                        </div>
                        <div id="adminCategoryListContainer" class="space-y-2.5"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ================= 模態彈窗 ================= -->

    <!-- 會員資料彈窗 -->
    <div id="profileModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-md shadow-2xl border-4 border-slate-300 overflow-hidden">
            <div class="bg-gradient-to-r from-orange-700 to-amber-600 text-white p-5 flex justify-between items-center border-b-4 border-orange-800">
                <h3 class="text-2xl font-black">👤 完善會員資料</h3>
                <button onclick="closeModal('profileModal')" class="text-white font-black text-2xl">✕</button>
            </div>
            <form onsubmit="saveProfile(event)" class="p-5 space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-black text-slate-800 mb-1">姓名 *</label>
                        <input type="text" id="profileName" class="w-full border-2 border-slate-400 rounded-xl p-3 text-base font-bold" required>
                    </div>
                    <div>
                        <label class="block text-sm font-black text-slate-800 mb-1">電話 *</label>
                        <input type="tel" id="profilePhone" class="w-full border-2 border-slate-400 rounded-xl p-3 text-base font-bold" required>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-black text-slate-800 mb-1">性別</label>
                        <select id="profileGender" class="w-full border-2 border-slate-400 rounded-xl p-3 text-base font-bold bg-white">
                            <option value="">請選擇</option>
                            <option value="男">男</option>
                            <option value="女">女</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-black text-slate-800 mb-1">生日</label>
                        <input type="date" id="profileBirthday" class="w-full border-2 border-slate-400 rounded-xl p-3 text-base font-bold">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-black text-slate-800 mb-1">身分證字號 (保險/核對用) *</label>
                    <input type="text" id="profileIdCard" class="w-full border-2 border-slate-400 rounded-xl p-3 text-base font-bold uppercase" placeholder="請輸入身分證字號" required>
                </div>
                <div>
                    <label class="block text-sm font-black text-slate-800 mb-1">通訊地址</label>
                    <input type="text" id="profileAddress" class="w-full border-2 border-slate-400 rounded-xl p-3 text-base font-bold">
                </div>
                <button type="submit" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-black py-4 rounded-2xl text-xl shadow">
                    儲存會員資料 💾
                </button>
            </form>
        </div>
    </div>

    <!-- 登記報名彈窗 -->
    <div id="registerModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white rounded-3xl w-full max-w-md shadow-2xl border-4 border-slate-300 overflow-hidden my-8">
            <div class="bg-gradient-to-r from-orange-700 to-amber-600 text-white p-5 flex justify-between items-center border-b-4 border-orange-800">
                <h3 class="text-xl font-black truncate" id="regEventTitle">活動登記</h3>
                <button onclick="closeModal('registerModal')" class="text-white font-black text-2xl">✕</button>
            </div>
            <div class="p-5 space-y-4 max-h-[60vh] overflow-y-auto">
                <div id="attendeesContainer" class="space-y-4"></div>
                <button type="button" onclick="addAttendeeForm('', '')" class="w-full bg-slate-100 text-slate-900 border-2 border-dashed border-slate-400 py-4 rounded-2xl text-base font-black shadow-inner">
                    ➕ 新增同行人 / 合併登記數量
                </button>
            </div>
            <div class="p-5 bg-slate-100 border-t-2 border-slate-300 flex space-x-3">
                <button onclick="closeModal('registerModal')" class="flex-1 bg-slate-200 text-slate-900 py-4 rounded-2xl text-lg font-black border-2 border-slate-300">取消</button>
                <button id="regSubmitBtn" onclick="submitMultiRegistration()" class="flex-1 bg-orange-600 hover:bg-orange-700 text-white py-4 rounded-2xl text-lg font-black shadow">確認送出 📝</button>
            </div>
        </div>
    </div>

    <!-- 登記接龍名單卡 (分頁彈窗) -->
    <div id="participantsModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-md shadow-2xl border-4 border-slate-300 overflow-hidden">
            <div class="bg-gradient-to-r from-orange-700 to-amber-600 text-white p-5 flex justify-between items-center border-b-4 border-orange-800">
                <h3 class="text-2xl font-black">📋 登記接龍名單</h3>
                <button onclick="closeModal('participantsModal')" class="text-white font-black text-2xl">✕</button>
            </div>
            <div class="p-5 space-y-4">
                <div id="participantsCardContainer" class="max-h-[50vh] overflow-y-auto space-y-3"></div>
                <div class="flex justify-between items-center bg-slate-100 p-3 rounded-2xl border-2 border-slate-300">
                    <button id="prevCardBtn" onclick="changeCardPage(-1)" class="bg-white text-slate-950 border-2 border-slate-400 font-black px-4 py-2.5 rounded-xl text-base disabled:opacity-50 shadow-sm">◀ 上一頁</button>
                    <span id="cardPageIndicator" class="text-base font-black text-slate-800">1 / 1</span>
                    <button id="nextCardBtn" onclick="changeCardPage(1)" class="bg-white text-slate-950 border-2 border-slate-400 font-black px-4 py-2.5 rounded-xl text-base disabled:opacity-50 shadow-sm">下一頁 ▶</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 我的登記紀錄彈窗 -->
    <div id="myRegistrationsModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-md shadow-2xl border-4 border-slate-300 overflow-hidden">
            <div class="bg-gradient-to-r from-orange-700 to-amber-600 text-white p-5 flex justify-between items-center border-b-4 border-orange-800">
                <h3 class="text-2xl font-black">📋 我的登記紀錄</h3>
                <button onclick="closeModal('myRegistrationsModal')" class="text-white font-black text-2xl">✕</button>
            </div>
            <div id="myRegListContainer" class="p-5 space-y-4 max-h-[60vh] overflow-y-auto"></div>
        </div>
    </div>

    <!-- 登記明細彈窗 -->
    <div id="regDetailsModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-md shadow-2xl border-4 border-slate-300 overflow-hidden">
            <div class="bg-gradient-to-r from-orange-700 to-amber-600 text-white p-5 flex justify-between items-center border-b-4 border-orange-800">
                <h3 class="text-2xl font-black">🔍 登記明細</h3>
                <button onclick="closeModal('regDetailsModal')" class="text-white font-black text-2xl">✕</button>
            </div>
            <div id="regDetailsContainer" class="p-5 space-y-4 max-h-[60vh] overflow-y-auto"></div>
        </div>
    </div>

    <!-- 臨時統計項目彈窗 -->
    <div id="tempQuestionModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-xs shadow-2xl border-4 border-slate-300 overflow-hidden">
            <div class="bg-slate-900 text-white p-4 flex justify-between items-center border-b-2 border-slate-950">
                <h4 class="text-lg font-black">⚡ 新增臨時統計</h4>
                <button onclick="closeTempQuestionDialog()" class="text-white font-black text-2xl">✕</button>
            </div>
            <div class="p-4 space-y-4">
                <div>
                    <label class="block text-sm font-black text-slate-800 mb-1">項目名稱</label>
                    <input type="text" id="tempQTitle" class="w-full border-2 border-slate-400 rounded-xl p-3 text-base font-bold" placeholder="例如：車衣尺寸、是否搭車">
                </div>
                <div>
                    <label class="block text-sm font-black text-slate-800 mb-1">選項 (逗號隔開，留空為簡答)</label>
                    <input type="text" id="tempQOptions" class="w-full border-2 border-slate-400 rounded-xl p-3 text-base font-bold" placeholder="例如：S,M,L 或 是,否">
                </div>
                <button onclick="addTempQuestion()" class="w-full bg-orange-600 text-white font-black py-4 rounded-xl text-lg shadow">確認新增</button>
            </div>
        </div>
    </div>

    <!-- 快速綁定登入彈窗 -->
    <div id="loginModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-xs shadow-2xl border-4 border-slate-300 overflow-hidden">
            <div class="bg-gradient-to-r from-orange-700 to-amber-600 text-white p-6 text-center border-b-4 border-orange-900">
                <span class="text-5xl">🚴‍♂️</span>
                <h3 class="text-2xl font-black mt-2">歡迎使用 三鐵飛翔</h3>
                <p class="text-sm text-orange-100 mt-1 font-bold">請快速綁定以開啟登記功能</p>
            </div>
            <form onsubmit="handleLoginRegister(event)" class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-black text-slate-800 mb-1">您的姓名 *</label>
                    <input type="text" id="loginName" class="w-full border-2 border-slate-400 rounded-xl p-3 text-base font-bold" required>
                </div>
                <div>
                    <label class="block text-sm font-black text-slate-800 mb-1">手機號碼 *</label>
                    <input type="tel" id="loginPhone" class="w-full border-2 border-slate-400 rounded-xl p-3 text-base font-bold" placeholder="例如：0912345678" required>
                </div>
                <button type="submit" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-black py-4 rounded-2xl text-lg shadow">
                    快速綁定並登入 ➔
                </button>
            </form>
        </div>
    </div>

    <!-- 全域載入遮罩 -->
    <div id="loading" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 hidden flex flex-col items-center justify-center space-y-3">
        <div class="bg-white p-6 rounded-3xl shadow-2xl flex flex-col items-center space-y-3 border-2 border-slate-300 min-w-[200px]">
            <div class="animate-spin rounded-full h-12 w-12 border-4 border-orange-600 border-t-transparent"></div>
            <p id="loadingText" class="text-base font-black text-slate-900">系統連線中...</p>
        </div>
    </div>

    <!-- ================= JavaScript ================= -->
    <script>
        const LIFF_ID = "2007905012-dQfXClGM"; 
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxjQDOpIxYCSoB66cT_rd7x5LYBeVSmAjFLK99sL_bl221biSrgNqacSuzXUTJvpzH4/exec";

        let userLineId = "";
        let userDisplayName = "";
        let userProfile = null;
        let allEvents = [];
        let allCategories = [];
        let currentEvent = null;
        let activeEventQuestions = [];
        let tempQuestions = []; 
        let currentParticipants = [];
        let currentFilterCategory = "all";
        let isAdmin = false;
        let isInChatContext = false;

        let currentCardPage = 0;
        const CARD_PAGE_SIZE = 20;

        const CATEGORY_COLOR_PALETTES = [
            { bgLight: "bg-emerald-100", textDark: "text-emerald-950", border: "border-emerald-400", bgActive: "bg-emerald-700 text-white border-emerald-800" },
            { bgLight: "bg-sky-100", textDark: "text-sky-950", border: "border-sky-400", bgActive: "bg-sky-700 text-white border-sky-800" },
            { bgLight: "bg-amber-100", textDark: "text-amber-950", border: "border-amber-400", bgActive: "bg-amber-600 text-white border-amber-800" },
            { bgLight: "bg-purple-100", textDark: "text-purple-950", border: "border-purple-400", bgActive: "bg-purple-700 text-white border-purple-800" },
            { bgLight: "bg-rose-100", textDark: "text-rose-950", border: "border-rose-400", bgActive: "bg-rose-700 text-white border-rose-800" },
            { bgLight: "bg-teal-100", textDark: "text-teal-950", border: "border-teal-400", bgActive: "bg-teal-700 text-white border-teal-800" },
            { bgLight: "bg-indigo-100", textDark: "text-indigo-950", border: "border-indigo-400", bgActive: "bg-indigo-700 text-white border-indigo-800" }
        ];

        function maskName(name) {
            if (!name) return "";
            if (name.length <= 2) {
                return name.substring(0, 1) + "*";
            }
            return name.substring(0, 1) + "*".repeat(name.length - 2) + name.substring(name.length - 1);
        }

        function getCategoryStyle(catName, isActive = false) {
            if (catName === "all") {
                return isActive 
                    ? "bg-slate-900 text-white border-slate-950 shadow-md" 
                    : "bg-white text-slate-900 border-slate-300";
            }
            let hash = 0;
            for (let i = 0; i < catName.length; i++) {
                hash = catName.charCodeAt(i) + ((hash << 5) - hash);
            }
            const index = Math.abs(hash) % CATEGORY_COLOR_PALETTES.length;
            const p = CATEGORY_COLOR_PALETTES[index];
            return isActive 
                ? `${p.bgActive} shadow-md` 
                : `${p.bgLight} ${p.textDark} ${p.border}`;
        }

        async function initializeLiff() {
            showLoading("系統極速載入中...");
            try {
                await liff.init({ liffId: LIFF_ID });
                isInChatContext = liff.isInClient() && ["utou", "room", "group"].includes(liff.getContext()?.type);
                
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }

                const profile = await liff.getProfile();
                userLineId = profile.userId;
                userDisplayName = profile.displayName;
                
                const avatarEl = document.getElementById("userAvatar");
                if (profile.pictureUrl) {
                    avatarEl.src = profile.pictureUrl;
                    avatarEl.classList.remove("hidden");
                }

                const response = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({
                        action: "initApp",
                        lineId: userLineId,
                        name: userDisplayName
                    })
                });
                const result = await response.json();

                if (result.status === "success") {
                    allCategories = result.categories || [];
                    allEvents = result.events || [];
                    
                    if (result.isBound) {
                        userProfile = result.user;
                        document.getElementById("userName").innerText = userProfile.name;
                        if (result.isAdmin) {
                            isAdmin = true;
                            document.getElementById("adminBtn").classList.remove("hidden");
                        }
                    } else {
                        document.getElementById("loginName").value = userDisplayName;
                        document.getElementById("loginModal").classList.remove("hidden");
                    }

                    renderCategoryTabs();
                    renderEventList();
                    renderAdminCategorySelect();
                    renderAdminEventSelects();

                    const urlParams = new URLSearchParams(window.location.search);
                    const actionParam = urlParams.get("action");
                    const eventIdParam = urlParams.get("eventId");
                    if (actionParam === "viewlist" && eventIdParam) {
                        openParticipantsModal(eventIdParam);
                    }
                }
            } catch (e) {
                console.error("初始化失敗", e);
                alert("系統初始化失敗，請確認網路或於 LINE 內開啟！");
            }
            hideLoading();
        }

        async function handleLoginRegister(event) {
            event.preventDefault();
            const name = document.getElementById("loginName").value.trim();
            const phone = document.getElementById("loginPhone").value.trim();

            if (!name || !phone) {
                alert("請填寫姓名與手機號碼！");
                return;
            }

            showLoading("正在綁定會員...");
            try {
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({
                        action: "bindUser",
                        lineId: userLineId,
                        name: name,
                        phone: phone
                    })
                });
                const result = await response.json();
                if (result.status === "success") {
                    userProfile = result.user;
                    document.getElementById("userName").innerText = userProfile.name;
                    document.getElementById("loginModal").classList.add("hidden");
                    
                    if (result.isAdmin) {
                        isAdmin = true;
                        document.getElementById("adminBtn").classList.remove("hidden");
                    }
                    alert("🎉 快速綁定成功！");
                } else {
                    alert("綁定失敗：" + result.message);
                }
            } catch (e) {
                alert("連線失敗，請稍後重試！");
            }
            hideLoading();
        }

        function openProfileModal() {
            if (!userProfile) return;
            document.getElementById("profileName").value = userProfile.name || "";
            document.getElementById("profilePhone").value = userProfile.phone || "";
            document.getElementById("profileGender").value = userProfile.gender || "";
            document.getElementById("profileBirthday").value = userProfile.birthday ? userProfile.birthday.split('T')[0] : "";
            document.getElementById("profileIdCard").value = userProfile.idCard || "";
            document.getElementById("profileAddress").value = userProfile.address || "";
            document.getElementById("profileModal").classList.remove("hidden");
        }

        async function saveProfile(event) {
            event.preventDefault();
            const idCard = document.getElementById("profileIdCard").value.trim().toUpperCase();
            const idReg = /^[A-Z][12]\d{8}$/;
            if (!idReg.test(idCard)) {
                alert("請輸入正確的身分證字號格式！");
                return;
            }

            showLoading("正在儲存會員資料...");
            try {
                const payload = {
                    action: "saveProfile",
                    lineId: userLineId,
                    name: document.getElementById("profileName").value.trim(),
                    phone: document.getElementById("profilePhone").value.trim(),
                    gender: document.getElementById("profileGender").value,
                    birthday: document.getElementById("profileBirthday").value,
                    idCard: idCard,
                    address: document.getElementById("profileAddress").value.trim()
                };
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                if (result.status === "success") {
                    userProfile = result.user;
                    document.getElementById("userName").innerText = userProfile.name;
                    alert("會員資料更新成功！");
                    closeModal("profileModal");
                } else {
                    alert("儲存失敗：" + result.message);
                }
            } catch (e) {
                alert("連線失敗");
            }
            hideLoading();
        }

        function renderCategoryTabs() {
            const container = document.getElementById("categoryTabs");
            const allActive = currentFilterCategory === 'all';
            let html = `
                <button onclick="filterCategory('all')" class="cat-tab px-5 py-3 rounded-2xl text-base font-black shrink-0 border-2 transition-all active:scale-95 ${getCategoryStyle('all', allActive)}">
                    全部項目
                </button>
            `;
            allCategories.forEach(cat => {
                const active = currentFilterCategory === cat;
                html += `
                    <button onclick="filterCategory('${cat}')" class="cat-tab px-5 py-3 rounded-2xl text-base font-black shrink-0 border-2 transition-all active:scale-95 ${getCategoryStyle(cat, active)}">
                        ${cat}
                    </button>
                `;
            });
            container.innerHTML = html;
        }

        function filterCategory(cat) {
            currentFilterCategory = cat;
            renderCategoryTabs();
            renderEventList();
        }

        function renderEventList() {
            const container = document.getElementById("eventListContainer");
            container.innerHTML = "";

            const filtered = allEvents.filter(e => currentFilterCategory === "all" || e.category === currentFilterCategory);

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-3xl p-10 text-center border-2 border-slate-300">
                        <p class="text-slate-600 text-lg font-black">目前此分類尚無項目 🌸</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(event => {
                const isStop = event.status === "停止";
                const statusBadge = isStop 
                    ? `<span class="bg-slate-200 text-slate-800 border-2 border-slate-400 px-4 py-1 rounded-full text-sm font-black">已截止</span>`
                    : `<span class="bg-emerald-100 text-emerald-950 border-2 border-emerald-400 px-4 py-1 rounded-full text-sm font-black">開放登記</span>`;

                const catStyle = getCategoryStyle(event.category, false);

                let filesHtml = "";
                if (event.files && event.files.length > 0) {
                    filesHtml = `<div class="pt-1 flex flex-wrap gap-2">`;
                    event.files.forEach(f => {
                        filesHtml += `
                            <a href="${f.url}" target="_blank" class="inline-flex items-center text-sm font-black text-orange-950 bg-orange-100 px-3.5 py-2 rounded-xl border border-orange-300">
                                📎 ${f.name} ➔
                            </a>`;
                    });
                    filesHtml += `</div>`;
                }

                const card = document.createElement("div");
                card.className = "bg-white rounded-3xl p-5 border-2 border-slate-300 shadow-md space-y-3.5";
                
                card.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="text-sm font-black px-3.5 py-1 rounded-xl border ${catStyle}">${event.category}</span>
                        ${statusBadge}
                    </div>
                    <div class="space-y-1">
                        <h3 class="text-xl font-black text-slate-950 leading-snug">${event.title}</h3>
                        <p class="text-base text-slate-700 font-bold leading-relaxed">${event.description || "無詳細說明"}</p>
                    </div>
                    ${filesHtml}
                    <div class="bg-slate-50 p-4 rounded-2xl border-2 border-slate-200 space-y-2 text-base text-slate-900">
                        <p class="flex items-center"><span class="mr-2 text-xl">📅</span><span class="font-black text-slate-950">截止時間：</span>${event.time}</p>
                        <p class="flex items-center"><span class="mr-2 text-xl">📍</span><span class="font-black text-slate-950">地點/配送：</span>${event.location}</p>
                        <p class="flex items-center"><span class="mr-2 text-xl">👥</span><span class="font-black text-slate-950">登記上限：</span>${event.limit} 人/件</p>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-3 pt-1">
                        <button onclick="openRegisterModal('${event.id}')" ${isStop ? 'disabled' : ''} 
                                class="w-full bg-orange-600 hover:bg-orange-700 text-white disabled:bg-slate-300 disabled:text-slate-500 font-black py-3.5 rounded-2xl text-lg flex items-center justify-center space-x-1 transition-all active:scale-95 shadow">
                            <span>我要登記 📝</span>
                        </button>
                        <button onclick="openParticipantsModal('${event.id}')" 
                                class="w-full bg-white hover:bg-slate-50 text-orange-950 border-2 border-orange-400 font-black py-3.5 rounded-2xl text-lg flex items-center justify-center space-x-1 transition-all active:scale-95 shadow">
                            <span>登記清單 📋</span>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openRegisterModal(eventId) {
            if (!userProfile || !userProfile.phone || !userProfile.idCard) {
                alert("為確保活動保險與權益核對，請先完善會員資料（需填寫身分證字號與電話）！");
                openProfileModal();
                return;
            }

            currentEvent = allEvents.find(e => e.id === eventId);
            document.getElementById("regEventTitle").innerText = currentEvent.title;
            document.getElementById("attendeesContainer").innerHTML = "";
            
            const submitBtn = document.getElementById("regSubmitBtn");
            submitBtn.setAttribute("onclick", "submitMultiRegistration()");
            
            addAttendeeForm(userProfile.name, userProfile.phone, true);
            document.getElementById("registerModal").classList.remove("hidden");
        }

        function addAttendeeForm(name = "", phone = "", isSelf = false) {
            const container = document.getElementById("attendeesContainer");
            const index = container.children.length;
            const div = document.createElement("div");
            div.className = "p-4 bg-slate-50 rounded-2xl border-2 border-slate-300 space-y-3 attendee-row";
            
            let questionsHtml = "";
            currentEvent.questions.forEach(q => {
                if (q.title === "姓名") return; 
                
                const reqMark = q.required ? '<span class="text-red-500">*</span>' : '';
                const reqAttr = q.required ? 'required' : '';
                
                if (q.type === "select") {
                    const opts = q.options ? q.options.split(',') : [];
                    let optsHtml = opts.map(o => `<option value="${o.trim()}">${o.trim()}</option>`).join('');
                    questionsHtml += `
                        <div>
                            <label class="block text-sm font-black text-slate-800 mb-1">${q.title} ${reqMark}</label>
                            <select data-qtitle="${q.title}" class="w-full border-2 border-slate-400 rounded-xl p-3 text-base bg-white font-bold q-input" ${reqAttr}>
                                <option value="">請選擇</option>
                                ${optsHtml}
                            </select>
                        </div>
                    `;
                } else {
                    questionsHtml += `
                        <div>
                            <label class="block text-sm font-black text-slate-800 mb-1">${q.title} ${reqMark}</label>
                            <input type="text" data-qtitle="${q.title}" class="w-full border-2 border-slate-400 rounded-xl p-3 text-base bg-white font-bold q-input" placeholder="請輸入內容" ${reqAttr}>
                        </div>
                    `;
                }
            });

            div.innerHTML = `
                ${isSelf ? '' : `<button type="button" onclick="this.parentElement.remove()" class="text-red-700 font-black text-sm float-right border border-red-300 bg-white px-3 py-1 rounded-xl">❌ 移除</button>`}
                <p class="font-black text-orange-950 text-base mb-1">${isSelf ? '👤 本人 (主要聯絡人)' : `👥 同行人/合併登記 #${index + 1}`}</p>
                <div class="grid grid-cols-1 gap-2">
                    <div>
                        <label class="block text-xs font-black text-slate-700 mb-1">姓名 <span class="text-red-500">*</span></label>
                        <input type="text" class="w-full border-2 border-slate-400 rounded-xl p-3 text-base bg-white font-bold att-name" value="${name}" required ${isSelf ? 'readonly' : ''}>
                    </div>
                    <div>
                        <label class="block text-xs font-black text-slate-700 mb-1">電話 ${isSelf ? '<span class="text-red-500">*</span>' : '(選填)'}</label>
                        <input type="tel" class="w-full border-2 border-slate-400 rounded-xl p-3 text-base bg-white font-bold att-phone" value="${phone}" ${isSelf ? 'required readonly' : ''}>
                    </div>
                </div>
                ${questionsHtml}
            `;
            container.appendChild(div);
        }

        async function submitMultiRegistration() {
            const rows = document.querySelectorAll(".attendee-row");
            if (rows.length === 0) {
                alert("至少需要填寫一位登記人員！");
                return;
            }

            const attendees = [];
            let isValid = true;

            rows.forEach(row => {
                const nameInput = row.querySelector(".att-name");
                const phoneInput = row.querySelector(".att-phone");
                
                if (!nameInput.value.trim()) {
                    isValid = false;
                    nameInput.classList.add("border-red-500");
                } else {
                    nameInput.classList.remove("border-red-500");
                }

                const answers = { "姓名": nameInput.value.trim() };
                row.querySelectorAll(".q-input").forEach(qInput => {
                    const title = qInput.getAttribute("data-qtitle");
                    if (qInput.hasAttribute("required") && !qInput.value.trim()) {
                        isValid = false;
                        qInput.classList.add("border-red-500");
                    } else {
                        qInput.classList.remove("border-red-500");
                    }
                    answers[title] = qInput.value.trim();
                });

                attendees.push({
                    name: nameInput.value.trim(),
                    phone: phoneInput.value.trim(),
                    answers: answers
                });
            });

            if (!isValid) {
                alert("請完整填寫所有必填欄位！");
                return;
            }

            showLoading("正在提交登記...");
            try {
                const payload = {
                    action: "registerMulti",
                    eventId: currentEvent.id,
                    lineId: userLineId,
                    leaderName: userProfile.name,
                    leaderPhone: userProfile.phone,
                    groupId: liff.getContext()?.groupId || "",
                    attendees: attendees
                };

                const response = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                if (result.status === "success") {
                    closeModal("registerModal");
                    
                    await sendFlexMessage(
                        currentEvent.time, 
                        currentEvent.title, 
                        result.remainingSpots, 
                        result.myRegisteredAttendees, 
                        attendees.length, 
                        false
                    );
                    
                    alert(`🎉 登記成功！\n錄取狀態：【${result.queueStatus}】${result.queueStatus === '候補' ? ` (候補第 ${result.queueIndex} 位)` : ''}`);
                    await reloadEventsData();
                } else {
                    alert("登記失敗：" + result.message);
                }
            } catch (e) {
                alert("連線失敗");
            }
            hideLoading();
        }

        async function openParticipantsModal(eventId) {
            currentEvent = allEvents.find(e => e.id === eventId);
            document.getElementById("participantsModal").classList.remove("hidden");
            const container = document.getElementById("participantsCardContainer");
            container.innerHTML = `<p class="text-slate-600 text-center py-6 font-bold">載入接龍名單中...</p>`;

            try {
                const response = await fetch(`${GAS_URL}?action=getParticipants&eventId=${eventId}`);
                const result = await response.json();
                if (result.status === "success") {
                    currentParticipants = result.participants;
                    currentCardPage = 0;
                    renderParticipantsCards();
                }
            } catch (e) {
                container.innerHTML = `<p class="text-red-500 text-center py-6 font-bold">載入失敗</p>`;
            }
        }

        function renderParticipantsCards() {
            const container = document.getElementById("participantsCardContainer");
            container.innerHTML = "";

            if (currentParticipants.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8">
                        <p class="text-slate-600 text-lg font-black">目前尚無人登記，搶得頭香！🌸</p>
                    </div>`;
                document.getElementById("prevCardBtn").disabled = true;
                document.getElementById("nextCardBtn").disabled = true;
                document.getElementById("cardPageIndicator").innerText = "0 / 0";
                return;
            }

            const totalPages = Math.ceil(currentParticipants.length / CARD_PAGE_SIZE);
            const start = currentCardPage * CARD_PAGE_SIZE;
            const end = Math.min(start + CARD_PAGE_SIZE, currentParticipants.length);
            const pageList = currentParticipants.slice(start, end);

            const card = document.createElement("div");
            card.className = "w-full bg-orange-50 rounded-2xl border-2 border-orange-200 p-4 space-y-3";
            
            let listHtml = `<div class="grid grid-cols-2 gap-x-4 gap-y-2.5">`;
            pageList.forEach((p, idx) => {
                const globalIdx = start + idx + 1;
                const isBackup = p.status === "候補";
                const badge = isBackup 
                    ? `<span class="bg-amber-200 text-amber-950 font-black text-xs px-2 py-0.5 rounded-full ml-1">候補</span>` 
                    : `<span class="bg-emerald-200 text-emerald-950 font-black text-xs px-2 py-0.5 rounded-full ml-1">正取</span>`;
                
                const masked = maskName(p.name);

                listHtml += `

                            }
                        });
                    });

        async function submitEditRegistration(regId) {
            const rows = document.querySelectorAll(".attendee-row");
            if (rows.length === 0) {
                alert("至少需要有一位登記人員！");
                return;
            }

            const attendees = [];
            let isValid = true;

            rows.forEach(row => {
                const nameInput = row.querySelector(".att-name");
                const phoneInput = row.querySelector(".att-phone");
                
                if (!nameInput.value.trim()) {
                    isValid = false;
                    nameInput.classList.add("border-red-500");
                } else {
                    nameInput.classList.remove("border-red-500");
                }

                const answers = { "姓名": nameInput.value.trim() };
                row.querySelectorAll(".q-input").forEach(qInput => {
                    const title = qInput.getAttribute("data-qtitle");
                    if (qInput.hasAttribute("required") && !qInput.value.trim()) {
                        isValid = false;
                        qInput.classList.add("border-red-500");
                    }
                    answers[title] = qInput.value.trim();
                });

                attendees.push({
                    name: nameInput.value.trim(),
                    phone: phoneInput.value.trim(),
                    answers: answers
                });
            });

            if (!isValid) {
                alert("請完整填寫所有必填欄位！");
                return;
            }

            showLoading("正在更新登記...");
            try {
                const payload = {
                    action: "registerMulti",
                    regId: regId, 
                    eventId: currentEvent.id,
                    lineId: userLineId,
                    leaderName: userProfile.name,
                    leaderPhone: userProfile.phone,
                    groupId: liff.getContext()?.groupId || "",
                    attendees: attendees
                };

                const response = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                if (result.status === "success") {
                    closeModal("registerModal");
                    
                    await sendFlexMessage(
                        currentEvent.time, 
                        currentEvent.title, 
                        result.remainingSpots, 
                        result.myRegisteredAttendees, 
                        attendees.length, 
                        true
                    );

                    alert(`✏️ 資料修改成功！\n錄取狀態：【${result.queueStatus}】`);
                    document.getElementById("regSubmitBtn").setAttribute("onclick", "submitMultiRegistration()");
                    await reloadEventsData();
                } else {
                    alert("修改失敗：" + result.message);
                }
            } catch (e) {
                alert("連線失敗");
            }
            hideLoading();
        }

            const adminNotes = {};

                const title = field.getAttribute("data-title");
                adminNotes[title] = field.value.trim();
            });

            showLoading("正在儲存註記...");
            try {
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({
                        action: "saveAdminNote",
                        regId: regId,
                        name: attendeeName,
                        adminNotes: adminNotes,
                        lineId: userLineId 
                    })

                const result = await response.json();
                if (result.status === "success") {
                    alert("註記事項儲存成功！");

                }
            } catch (e) {

            hideLoading();
        }
