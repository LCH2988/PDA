<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>《與帕同行》活動報名與會員系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background-color: #f0fdfa; 
            line-height: 1.6;
        }
        input, select, textarea {
            font-size: 1.1rem !important;
            padding: 0.65rem !important;
            border-radius: 0.75rem !important;
        }
    </style>
</head>
<body class="p-4 max-w-md mx-auto pb-12">

    <!-- 載入中遮罩 -->
    <div id="loading" class="fixed inset-0 bg-white bg-opacity-95 flex flex-col justify-center items-center z-50 p-6">
        <div class="animate-spin rounded-full h-16 w-16 border-b-4 border-teal-600 mb-6"></div>
        <p class="text-teal-900 font-bold text-xl text-center" id="loadingText">正在載入系統，請稍候...</p>
    </div>

    <!-- 頂部導覽與狀態列 -->
    <div class="bg-teal-700 text-white p-5 rounded-3xl shadow-lg mb-6 text-center relative">
        <button id="adminBtn" onclick="toggleAdminMode()" class="absolute top-3 right-3 bg-teal-800 hover:bg-teal-900 text-white text-xs px-3 py-1.5 rounded-full font-bold">
            ⚙️ 管理
        </button>
        <h1 class="text-2xl font-extrabold mb-1">🌸 《與帕同行》 🌸<br>會員與活動系統</h1>
        <p id="welcomeUser" class="text-xs mt-2 bg-teal-800 inline-block px-4 py-1 rounded-full font-bold">正在載入...</p>
        
        <!-- 會員選單 -->
        <div id="memberMenu" class="flex justify-center space-x-2 mt-3 text-xs hidden">
            <button onclick="showPage('eventListPage')" class="bg-teal-600 hover:bg-teal-500 px-2.5 py-1 rounded-full font-bold">📅 活動列表</button>
            <button onclick="showMyRegistrationsPage()" class="bg-teal-600 hover:bg-teal-500 px-2.5 py-1 rounded-full font-bold">📋 我的報名</button>
            <button onclick="showProfilePage()" class="bg-teal-600 hover:bg-teal-500 px-2.5 py-1 rounded-full font-bold">👤 個人資料</button>
            <button onclick="logout()" class="bg-red-700 hover:bg-red-600 px-2.5 py-1 rounded-full font-bold">登出</button>
        </div>
    </div>

    <!-- ================= 頁面：註冊 / 登入 ================= -->
    <div id="loginPage" class="space-y-6 hidden">
        <div class="bg-white p-6 rounded-3xl shadow-md border-2 border-teal-100">
            <h2 class="text-xl font-extrabold text-teal-900 mb-4 text-center">會員登入 / 註冊</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">真實姓名</label>
                    <input type="text" id="loginName" class="w-full border border-gray-300 outline-none" placeholder="請輸入姓名">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">手機號碼</label>
                    <input type="tel" id="loginPhone" class="w-full border border-gray-300 outline-none" placeholder="例如：0912345678">
                </div>
                <button onclick="handleLoginOrRegister()" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 px-4 rounded-2xl shadow-md text-lg">
                    確認登入 / 註冊 🚀
                </button>
            </div>
        </div>
    </div>

    <!-- ================= 頁面：個人資料維護 ================= -->
    <div id="profilePage" class="space-y-6 hidden">
        <div class="bg-white p-6 rounded-3xl shadow-md border-2 border-teal-100">
            <h2 class="text-xl font-extrabold text-teal-900 mb-4 border-b pb-2">👤 維護個人基本資料</h2>
            <div class="space-y-4 text-sm">
                <div>
                    <label class="block font-bold text-gray-700 mb-1">性別</label>
                    <select id="profGender" class="w-full border border-gray-300 outline-none">
                        <option value="">請選擇</option>
                        <option value="男">男</option>
                        <option value="女">女</option>
                    </select>
                </div>
                <div>
                    <label class="block font-bold text-gray-700 mb-1">生日</label>
                    <input type="date" id="profBirthday" class="w-full border border-gray-300 outline-none">
                </div>
                <div>
                    <label class="block font-bold text-gray-700 mb-1">身分證字號 (保險用)</label>
                    <input type="text" id="profIdCard" class="w-full border border-gray-300 outline-none" placeholder="例如：A123456789">
                </div>
                <div>
                    <label class="block font-bold text-gray-700 mb-1">聯絡地址</label>
                    <input type="text" id="profAddress" class="w-full border border-gray-300 outline-none" placeholder="請輸入完整地址">
                </div>
                <button onclick="saveProfile()" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 px-4 rounded-2xl shadow-md text-lg">
                    儲存個人資料 💾
                </button>
            </div>
        </div>
    </div>

    <!-- ================= 頁面：活動列表 ================= -->
    <div id="eventListPage" class="space-y-6 hidden">
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-teal-100 space-y-3">
            <div class="flex space-x-2">
                <input type="text" id="searchKeyword" oninput="filterEvents()" class="flex-1 border border-gray-300 text-sm" placeholder="🔍 輸入關鍵字搜尋...">
                <select id="filterCategory" onchange="filterEvents()" class="border border-gray-300 text-sm">
                    <option value="">全部分類</option>
                    <option value="醫學講座">醫學講座</option>
                    <option value="戶外活動">戶外活動</option>
                    <option value="復健課程">復健課程</option>
                </select>
            </div>
        </div>
        <div id="eventListContainer" class="space-y-4"></div>
    </div>

    <!-- ================= 頁面：個人活動報名紀錄清單 ================= -->
    <div id="myRegistrationsPage" class="space-y-6 hidden">
        <div class="bg-white p-6 rounded-3xl shadow-md border-2 border-teal-100">
            <h2 class="text-xl font-extrabold text-teal-900 mb-4 border-b pb-2">📋 我的活動報名紀錄</h2>
            <div id="myRegListContainer" class="space-y-4 text-sm"></div>
        </div>
    </div>

    <!-- ================= 頁面：多人報名與修改表單 ================= -->
    <div id="registerPage" class="space-y-6 hidden">
        <div class="bg-white p-6 rounded-3xl shadow-md border-2 border-teal-100">
            <h2 id="regEventTitle" class="text-xl font-extrabold text-teal-900 mb-2"></h2>
            <div id="regEventDetails" class="text-sm text-gray-600 mb-4 pb-3 border-b space-y-1"></div>

            <div id="lockNotice" class="bg-red-50 border border-red-200 text-red-700 p-3 rounded-2xl text-xs font-bold mb-4 hidden">
                ⚠️ 此活動目前為「停止報名」狀態，您僅能查看報名資料，無法進行任何修改與異動。
            </div>

            <div id="eventFilesArea" class="mb-4 hidden">
                <p class="font-bold text-teal-800 text-sm mb-1">📂 相關檔案下載：</p>
                <div id="fileLinksList" class="flex flex-wrap gap-2"></div>
            </div>

            <form id="multiRegForm" class="space-y-6">
                <input type="hidden" id="regFormRegId" value="">
                <div id="attendeesContainer" class="space-y-6"></div>

                <button type="button" id="addAttendeeBtn" onclick="addAttendeeField()" class="w-full bg-teal-50 hover:bg-teal-100 text-teal-800 font-bold py-2.5 px-4 rounded-2xl border border-dashed border-teal-300 text-sm">
                    ➕ 增加同行報名人員
                </button>

                <button type="button" id="submitMultiBtn" onclick="submitMultiRegistration()" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-extrabold py-4 px-6 rounded-3xl shadow-xl text-lg">
                    確認送出報名 🚀
                </button>
            </form>
        </div>
    </div>

    <!-- ================= 頁面：報名成功與接龍清單 ================= -->
    <div id="successPage" class="space-y-6 hidden">
        <div class="bg-white p-6 rounded-3xl shadow-md border-2 border-teal-100 text-center">
            <div class="text-4xl mb-2">🎉</div>
            <h2 class="text-xl font-extrabold text-teal-900 mb-1">報名登記成功！</h2>
            <p id="myQueueStatus" class="text-base font-bold text-teal-700 mb-3"></p>
            <button onclick="showPage('eventListPage')" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-1.5 px-5 rounded-full text-xs">
                返回活動列表
            </button>
        </div>

        <div class="bg-white p-6 rounded-3xl shadow-md border-2 border-teal-100">
            <h3 class="text-lg font-extrabold text-teal-900 mb-3 border-b pb-2">📋 目前報名接龍清單</h3>
            <div id="listContainer" class="space-y-2 text-sm"></div>
            
            <div class="flex justify-between items-center mt-5 pt-3 border-t border-gray-100 text-xs">
                <button id="prevPageBtn" onclick="changePage(-1)" class="bg-teal-50 hover:bg-teal-100 text-teal-800 font-bold py-1.5 px-3 rounded-lg">◀ 上一頁</button>
                <span id="pageIndicator" class="text-gray-600 font-bold">第 1 / 1 頁</span>
                <button id="nextPageBtn" onclick="changePage(1)" class="bg-teal-50 hover:bg-teal-100 text-teal-800 font-bold py-1.5 px-3 rounded-lg">下一頁 ▶</button>
            </div>
        </div>
    </div>

    <!-- ================= 頁面：管理員主控台 ================= -->
    <div id="adminPage" class="space-y-6 hidden">
        <div class="bg-white p-5 rounded-3xl shadow-md border-2 border-amber-200">
            <div class="flex justify-between items-center mb-4 border-b pb-2 border-amber-100">
                <h2 class="text-xl font-extrabold text-amber-900">⚙️ 管理員主控台</h2>
                <button onclick="exitAdminMode()" class="text-gray-500 hover:text-gray-700 font-bold text-xs">退出</button>
            </div>

            <!-- 三大核心功能選單按鈕 -->
            <div class="grid grid-cols-3 gap-2 mb-6">
                <button onclick="switchAdminTab('eventManage')" id="tabBtn_eventManage" class="bg-amber-600 text-white font-bold py-2 px-1 rounded-xl text-xs shadow-sm transition-all">
                    📅 活動管理
                </button>
                <button onclick="switchAdminTab('regManage')" id="tabBtn_regManage" class="bg-amber-100 text-amber-800 font-bold py-2 px-1 rounded-xl text-xs shadow-sm transition-all">
                    👥 報名管理
                </button>
                <button onclick="switchAdminTab('announcement')" id="tabBtn_announcement" class="bg-amber-100 text-amber-800 font-bold py-2 px-1 rounded-xl text-xs shadow-sm transition-all">
                    📢 報名公告
                </button>
            </div>

            <!-- ================= 模組 A：活動管理 ================= -->
            <div id="adminTab_eventManage" class="space-y-4">
                <div class="mb-4">
                    <label class="block font-bold text-gray-700 text-xs mb-1">選擇或建立活動：</label>
                    <select id="adminEventSelect" onchange="onAdminEventSelect()" class="w-full border-2 border-amber-200 font-bold text-sm">
                        <option value="new">➕ 建立全新活動</option>
                    </select>
                </div>

                <form id="eventForm" class="space-y-4 text-xs">
                    <input type="hidden" id="adminEventId">
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block font-bold text-gray-700 mb-1">活動名稱</label>
                            <input type="text" id="adminTitle" class="w-full border border-gray-300 rounded-lg" required>
                        </div>
                        <div>
                            <label class="block font-bold text-gray-700 mb-1">活動分類</label>
                            <select id="adminCategory" class="w-full border border-gray-300 rounded-lg">
                                <option value="醫學講座">醫學講座</option>
                                <option value="戶外活動">戶外活動</option>
                                <option value="復健課程">復健課程</option>
                            </select>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block font-bold text-gray-700 mb-1">活動時間</label>
                            <input type="datetime-local" id="adminTime" class="w-full border border-gray-300 rounded-lg" required>
                        </div>
                        <div>
                            <label class="block font-bold text-gray-700 mb-1">活動地點</label>
                            <input type="text" id="adminLocation" class="w-full border border-gray-300 rounded-lg" required>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block font-bold text-gray-700 mb-1">人數上限</label>
                            <input type="number" id="adminLimit" class="w-full border border-gray-300 rounded-lg" required>
                        </div>
                        <div>
                            <label class="block font-bold text-gray-700 mb-1">活動狀態</label>
                            <select id="adminStatus" class="w-full border border-gray-300 rounded-lg">
                                <option value="啟動">啟動 (開放報名)</option>
                                <option value="停止">停止 (關閉報名)</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block font-bold text-gray-700 mb-1">詳細說明</label>
                        <textarea id="adminDescription" class="w-full border border-gray-300 rounded-lg h-16"></textarea>
                    </div>

                    <div class="border-t pt-2">
                        <p class="font-bold text-amber-800 mb-1">📂 附加檔案連結</p>
                        <div id="adminFilesContainer" class="space-y-1"></div>
                        <button type="button" onclick="addAdminFileField()" class="mt-1 bg-amber-50 text-amber-800 px-2 py-1 rounded border border-amber-200">➕ 增加檔案</button>
                    </div>

                    <div class="border-t pt-2">
                        <p class="font-bold text-amber-800 mb-1">📋 自訂調查項目 (預設問題為姓名)</p>
                        <div id="adminQuestionsContainer" class="space-y-2"></div>
                        <button type="button" onclick="addAdminQuestionField()" class="mt-1 bg-amber-50 text-amber-800 px-2 py-1 rounded border border-amber-200">➕ 增加問題</button>
                    </div>

                    <div class="flex space-x-2 pt-2">
                        <button type="button" id="adminDeleteBtn" onclick="deleteEvent()" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 px-4 rounded-xl text-sm hidden">
                            刪除活動 🗑️
                        </button>
                        <button type="button" onclick="saveEvent()" class="flex-2 bg-amber-600 hover:bg-amber-700 text-white font-bold py-2.5 px-4 rounded-xl text-sm">
                            儲存設定 💾
                        </button>
                    </div>
                </form>
            </div>

            <!-- ================= 模組 B：報名管理 ================= -->
            <div id="adminTab_regManage" class="space-y-4 hidden">
                <div>
                    <label class="block font-bold text-gray-700 text-xs mb-1">選擇活動查看報名名單：</label>
                    <select id="regManageEventSelect" onchange="onRegManageEventSelect()" class="w-full border border-gray-300 text-sm">
                        <option value="">-- 請選擇活動 --</option>
                    </select>
                </div>

                <div id="regManageListContainer" class="space-y-3 max-h-96 overflow-y-auto pt-2">
                    <p class="text-gray-500 text-center text-xs py-8">請先選擇活動以載入報名名單</p>
                </div>
            </div>

            <!-- ================= 模組 C：報名公告 (接龍發布) ================= -->
            <div id="adminTab_announcement" class="space-y-4 hidden">
                <div>
                    <label class="block font-bold text-gray-700 text-xs mb-1">選擇活動發布接龍：</label>
                    <select id="announceEventSelect" onchange="onAnnouncementEventSelect()" class="w-full border border-gray-300 text-sm">
                        <option value="">-- 請選擇活動 --</option>
                    </select>
                </div>

                <div id="announcementPanel" class="space-y-4 hidden">
                    <div class="bg-amber-50 p-3 rounded-xl border border-amber-100 space-y-3">
                        
                        <!-- 新增：自訂簡易活動訊息輸入框 -->
                        <div>
                            <label class="block font-bold text-amber-900 text-xs mb-1">✍️ 自訂簡易活動訊息 (將顯示在接龍頂部)：</label>
                            <textarea id="announceCustomMsg" class="w-full border border-amber-200 rounded-lg text-xs h-16 bg-white p-2" placeholder="例如：請大家準時於早上 8:30 在大門口集合，當天請自備雨具與水壺。"></textarea>
                        </div>

                        <p class="font-bold text-gray-700 text-xs border-t pt-2">⚙️ 設定要發布到群組的接龍項目：</p>
                        
                        <!-- 多項目接龍選取容器 -->
                        <div id="chainItemsContainer" class="space-y-2"></div>

                        <div class="flex space-x-2 pt-1">
                            <button type="button" onclick="addChainItemField()" class="flex-1 bg-amber-100 hover:bg-amber-200 text-amber-800 font-bold py-1.5 rounded-lg text-xs">
                                ➕ 增加接龍項目
                            </button>
                            <button type="button" onclick="showTempQuestionDialog()" class="flex-1 bg-blue-100 hover:bg-blue-200 text-blue-800 font-bold py-1.5 rounded-lg text-xs">
                                ➕ 新增臨時項目
                            </button>
                        </div>

                        <button type="button" onclick="shareCustomChainToGroup()" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-2.5 rounded-xl text-xs shadow-md mt-2">
                            發送自訂接龍名單 🚀
                        </button>
                    </div>

                    <!-- 預覽名單與臨時項目狀態勾選 -->
                    <div class="border-t pt-2">
                        <p class="font-bold text-amber-800 text-xs mb-2">📋 接龍名單即時預覽與統計：</p>
                        <div id="announceParticipantsList" class="space-y-2 max-h-60 overflow-y-auto"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- 臨時自訂問題彈出視窗 -->
    <div id="tempQuestionModal" class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50 p-6 hidden">
        <div class="bg-white p-5 rounded-3xl w-full max-w-xs space-y-4">
            <h3 class="text-base font-extrabold text-teal-900 border-b pb-2">➕ 新增臨時調查項目</h3>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block font-bold text-gray-700 mb-1">項目名稱</label>
                    <input type="text" id="tempQTitle" class="w-full border border-gray-300 rounded-lg" placeholder="例如：中餐(葷/素)">
                </div>
                <div>
                    <label class="block font-bold text-gray-700 mb-1">選項 (用逗號隔開)</label>
                    <input type="text" id="tempQOptions" class="w-full border border-gray-300 rounded-lg" placeholder="例如：葷食,素食">
                </div>
            </div>
            <div class="flex space-x-2">
                <button onclick="closeTempQuestionDialog()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-2 rounded-xl text-xs">取消</button>
                <button onclick="addTempQuestion()" class="flex-1 bg-teal-600 hover:bg-teal-700 text-white font-bold py-2 rounded-xl text-xs">新增項目</button>
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzvt9ALKjGWbeociAO9G2nxn0DANr4DHktOc3iRpzrRyxGWyjTZZ3Tevi4xbdgOZsDr/exec"; 
        const LIFF_ID = "2009456572-VIoH1oY0";
        const ADMIN_PASSWORD = "1234";

        let userLineId = "Anonymous";
        let userDisplayName = "熱心成員";
        let currentGroupId = "Unknown";
        let isInChatContext = false;
        
        let currentUser = null; 
        let allEvents = [];
        let currentEvent = null;
        let isAdmin = false;

        let currentParticipants = [];
        let currentPage = 1;
        const pageSize = 20;

        let tempQuestions = []; 
        let activeEventQuestions = []; 

        async function initializeLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }
                
                const profile = await liff.getProfile();
                userLineId = profile.userId;
                userDisplayName = profile.displayName;

                const context = liff.getContext();
                if (context) {
                    currentGroupId = context.groupId || context.roomId || context.utouId || "個人聊天";
                    isInChatContext = (context.type === "group" || context.type === "room" || context.type === "utou");
                }

                document.getElementById("welcomeUser").innerText = `LINE 連結中：${userDisplayName}`;
                await autoLogin();
            } catch (error) {
                console.error("LIFF 初始化失敗", error);
                alert("請在 LINE 內開啟此頁面");
            }
        }

        function showPage(pageId) {
            const pages = ['loginPage', 'profilePage', 'eventListPage', 'myRegistrationsPage', 'registerPage', 'successPage', 'adminPage'];
            pages.forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(pageId).classList.remove('hidden');
            
            if (currentUser) {
                document.getElementById('memberMenu').classList.remove('hidden');
            } else {
                document.getElementById('memberMenu').classList.add('hidden');
            }
        }

        async function autoLogin() {
            showLoading("正在檢查會員資料...");
            try {
                const response = await fetch(`${GAS_URL}?action=getUser&lineId=${userLineId}`);
                const result = await response.json();
                if (result.status === "success" && result.user) {
                    currentUser = result.user;
                    document.getElementById("welcomeUser").innerText = `歡迎，${currentUser.name}！`;
                    await fetchEvents();
                    showPage("eventListPage");
                } else {
                    showPage("loginPage");
                }
            } catch (e) {
                alert("連線失敗，請重新整理");
            }
            hideLoading();
        }

        async function handleLoginOrRegister() {
            const name = document.getElementById("loginName").value.trim();
            const phone = document.getElementById("loginPhone").value.trim();
            if (!name || !phone) {
                alert("請輸入姓名與電話！");
                return;
            }

            showLoading("正在處理登入/註冊...");
            try {
                const response = await fetch(GAS_URL, {
                    method: "POST",

        function addAttendeeFieldWithData(attData, isSelf = false, isReadOnly = false) {
            const container = document.getElementById("attendeesContainer");
            const index = container.children.length;
            
            const div = document.createElement("div");
            div.className = "p-4 bg-gray-50 rounded-2xl border border-gray-200 relative space-y-3 attendee-block";
            
            let deleteBtnHtml = "";
            if (!isSelf && !isReadOnly) {
                deleteBtnHtml = `<button type="button" onclick="this.parentElement.remove()" class="absolute top-2 right-2 text-red-500 font-bold text-xs">❌ 刪除</button>`;
            }

            let questionsHtml = "";
            const questions = currentEvent.questions || [{ title: "姓名", type: "text", required: true }];

            questions.forEach((q, qIdx) => {
                let inputHtml = "";
                const savedAns = attData.answers[q.title] || "";
                const readOnlyAttr = isReadOnly ? "disabled" : "";
                const reqAttr = q.required ? "required" : "";
                const reqMark = q.required ? `<span class="text-red-500 font-bold ml-1">*</span>` : "";

                if (q.type === "text") {
                    inputHtml = `<input type="text" name="q_${qIdx}" value="${savedAns}" class="w-full border border-gray-300 rounded-lg" placeholder="請輸入回答" ${readOnlyAttr} ${reqAttr}>`;
                } else if (q.type === "select") {
                    const options = q.options ? q.options.split(',') : [];
                    let optionsHtml = options.map(o => {
                        const selected = o.trim() === savedAns.trim() ? "selected" : "";
                        return `<option value="${o.trim()}" ${selected}>${o.trim()}</option>`;
                    }).join('');
                    inputHtml = `
                        <select name="q_${qIdx}" class="w-full border border-gray-300 rounded-lg" ${readOnlyAttr} ${reqAttr}>
                            <option value="">請選擇</option>
                            ${optionsHtml}
                        </select>`;
                }

                questionsHtml += `
                    <div>
                        <label class="block font-bold text-gray-700 text-xs mb-1">${q.title}${reqMark}</label>
                        ${inputHtml}
                    </div>
                `;
            });

            div.innerHTML = `
                <div class="flex justify-between items-center border-b pb-1">
                    <h4 class="font-extrabold text-teal-900 text-sm">👤 人員 #${index + 1} ${isSelf ? '(發起人自己)' : ''}</h4>
                    <span class="text-xs font-bold text-teal-700">狀態：${attData.queueStatus || "正取"}</span>
                </div>
                ${deleteBtnHtml}
                <div class="space-y-3">
                    ${questionsHtml}
                </div>
            `;
            container.appendChild(div);
        }

        async function submitMultiRegistration() {
            const blocks = document.querySelectorAll(".attendee-block");
            const attendees = [];
            const regId = document.getElementById("regFormRegId").value;

            for (let block of blocks) {
                const answers = {};
                const questions = currentEvent.questions || [];
                let nameVal = "";

                for (let qIdx = 0; qIdx < questions.length; qIdx++) {
                    const q = questions[qIdx];
                    const inputEl = block.querySelector(`[name="q_${qIdx}"]`);
                    
                    if (q.required && (!inputEl || !inputEl.value.trim())) {
                        alert(`請填寫完整的必填欄位：${q.title}！`);
                        return;
                    }
                    
                    const val = inputEl ? inputEl.value.trim() : "";
                    answers[q.title] = val;
                    if (q.title === "姓名") nameVal = val;
                }

                attendees.push({
                    name: nameVal || "無名氏",
                    answers: answers
                });
            }

            showLoading("正在提交報名...");
            try {
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({
                        action: "registerMulti",
                        regId: regId,
                        eventId: currentEvent.id,
                        lineId: userLineId,
                        leaderName: currentUser.name,
                        leaderPhone: currentUser.phone,
                        groupId: currentGroupId,
                        attendees: attendees
                    })
                });
                const result = await response.json();
                if (result.status === "success") {
                    await showSuccessPage(result.queueStatus, result.queueIndex);
                    await sendFlexMessage(result.queueStatus, result.queueIndex, attendees.length, !!regId);
                } else {
                    alert("報名失敗：" + result.message);
                }
            } catch (e) {
                alert("連線失敗");
            }
            hideLoading();
        }

        function renderParticipantsList() {
            const container = document.getElementById("listContainer");
            container.innerHTML = "";

            const totalPages = Math.ceil(currentParticipants.length / pageSize) || 1;
            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            const pageData = currentParticipants.slice(start, end);

            pageData.forEach((p, index) => {
                const globalIndex = start + index + 1;
                const isBackup = p.status === "候補";
                const badgeColor = isBackup ? "bg-amber-100 text-amber-800" : "bg-teal-100 text-teal-800";
                
                const item = document.createElement("div");
                item.className = "flex justify-between items-center p-2.5 bg-gray-50 rounded-xl border border-gray-100";
                item.innerHTML = `
                    <span class="font-bold text-gray-800">#${globalIndex} ${p.name}</span>
                    <span class="px-2 py-0.5 rounded-full text-xs font-bold ${badgeColor}">${p.status}</span>
                `;
                container.appendChild(item);
            });

            document.getElementById("pageIndicator").innerText = `第 ${currentPage} / ${totalPages} 頁`;
            document.getElementById("prevPageBtn").disabled = currentPage === 1;
            document.getElementById("nextPageBtn").disabled = currentPage === totalPages;
        }

        function changePage(dir) {
            currentPage += dir;
            renderParticipantsList();
        }

        async function onAdminEventSelect() {

            const delBtn = document.getElementById("adminDeleteBtn");
            
            document.getElementById("adminFilesContainer").innerHTML = "";

                        String(dateObj.getMonth() + 1).padStart(2, '0') + '-' + 
                        String(dateObj.getDate()).padStart(2, '0') + 'T' + 
                        String(dateObj.getHours()).padStart(2, '0') + ':' + 
                        String(dateObj.getMinutes()).padStart(2, '0');

            const reqChecked = required ? "checked" : "";

            div.innerHTML = `
                ${deleteBtn}
                <div class="flex space-x-1">
                    <input type="text" placeholder="問題名稱" value="${title}" class="flex-1 border" ${isCore ? 'readonly' : ''} required>
                    <select onchange="toggleOptionField(this)" class="border text-xs" ${isCore ? 'disabled' : ''}>
                        <option value="text" ${type === 'text' ? 'selected' : ''}>文字輸入</option>
                        <option value="select" ${type === 'select' ? 'selected' : ''}>下拉選單</option>
                    </select>
                </div>
                <input type="text" placeholder="選項 (用逗號隔開，如：葷食,素食)" value="${options}" class="w-full border text-xs ${type === 'select' ? '' : 'hidden'} option-input">
                
                <div class="flex items-center space-x-2 pt-1 ${isCore ? 'hidden' : ''}">
                    <input type="checkbox" class="w-4 h-4 req-checkbox" ${reqChecked}>
                    <span class="text-xs font-bold text-gray-600">設定為必填項目</span>
                </div>
            `;
            container.appendChild(div);
        }

        function toggleOptionField(selectEl) {
            const optionInput = selectEl.parentElement.nextElementSibling;
            if (selectEl.value === "select") {
                optionInput.classList.remove("hidden");
            } else {
                optionInput.classList.add("hidden");
            }
        }

        // ----------------- 模組 B：報名管理子邏輯 (含增加註記維護) -----------------
        async function onRegManageEventSelect() {
            const eventId = document.getElementById("regManageEventSelect").value;
            const container = document.getElementById("regManageListContainer");
            
            if (!eventId) {
                container.innerHTML = '<p class="text-gray-500 text-center text-xs py-8">請先選擇活動以載入報名名單</p>';
                return;
            }

            container.innerHTML = '<p class="text-gray-500 text-center text-xs py-8">正在載入報名資料...</p>';

            try {
                const response = await fetch(`${GAS_URL}?action=getAdminParticipants&eventId=${eventId}`);
                const result = await response.json();
                
                if (result.status === "success") {
                    const list = result.participants;
                    container.innerHTML = "";

                    if (list.length === 0) {
                        container.innerHTML = '<p class="text-gray-500 text-center text-xs py-8">目前尚無人報名此活動</p>';
                        return;
                    }

                    list.forEach((p, idx) => {
                        const isBackup = p.status === "候補";
                        const badgeColor = isBackup ? "bg-amber-100 text-amber-800" : "bg-teal-100 text-teal-800";
                        
                        let ansText = "";
                        for (let key in p.answers) {
                            if (key !== "姓名") {
                                ansText += `<br>• ${key}：<span class="text-gray-800 font-medium">${p.answers[key]}</span>`;
                            }
                        }

                        // 註記欄位預設值
                        const noteTitle = p.noteTitle || "";
                        const noteContent = p.noteContent || "";

                        const card = document.createElement("div");
                        card.className = "p-3 bg-gray-50 rounded-xl border border-gray-200 text-xs space-y-2 relative";
                        card.innerHTML = `
                            <div class="flex justify-between items-center">
                                <span class="font-extrabold text-gray-800">#${idx+1} ${p.name}</span>
                                <span class="px-2 py-0.5 rounded-full font-bold ${badgeColor}">${p.status}</span>
                            </div>
                            <p class="text-gray-500">📞 電話：${p.phone || "無"}${ansText}</p>
                            
                            <!-- 新增：管理員資料維護 - 註記事項區 -->
                            <div class="bg-amber-50/50 p-2.5 rounded-lg border border-amber-100 space-y-1.5 mt-2">
                                <p class="font-bold text-amber-900 text-[10px]">✏️ 管理員備忘註記：</p>
                                <div class="grid grid-cols-2 gap-1.5">
                                    <input type="text" id="noteTitle_${p.regId}_${p.name}" value="${noteTitle}" class="border border-gray-300 rounded px-1.5 py-1 text-[11px] bg-white" placeholder="註記項目 (如: 繳費狀態)">
                                    <input type="text" id="noteContent_${p.regId}_${p.name}" value="${noteContent}" class="border border-gray-300 rounded px-1.5 py-1 text-[11px] bg-white" placeholder="註記內容 (如: 已收500)">
                                </div>
                                <button onclick="saveAdminNote('${p.regId}', '${p.name}')" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-1 rounded text-[10px]">
                                    儲存註記 💾
                                </button>
                            </div>

                            <div class="flex justify-end space-x-2 pt-1 border-t border-gray-100">
                                <button onclick="adminDeleteRegistration('${p.regId}', '${eventId}')" class="text-red-600 font-bold hover:text-red-800">🗑️ 刪除此人</button>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                }
            } catch (e) {
                container.innerHTML = '<p class="text-red-500 text-center text-xs py-8">載入失敗，請重試</p>';
            }
        }

        // 儲存管理員註記
        async function saveAdminNote(regId, attendeeName) {
            const noteTitle = document.getElementById(`noteTitle_${regId}_${attendeeName}`).value.trim();
            const noteContent = document.getElementById(`noteContent_${regId}_${attendeeName}`).value.trim();

            showLoading("正在儲存註記...");
            try {
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({
                        action: "saveAdminNote",
                        regId: regId,
                        name: attendeeName,
                        noteTitle: noteTitle,
                        noteContent: noteContent
                    })
                });
                const result = await response.json();
                if (result.status === "success") {
                    alert("註記事項儲存成功！");
                } else {
                    alert("儲存失敗：" + result.message);
                }
            } catch (e) {
                alert("連線失敗");
            }
            hideLoading();
        }

        // 管理端手動刪除單一報名
        async function adminDeleteRegistration(){
            if (!confirm("確定要刪除此人的報名紀錄嗎？此動作將無法復原！")) return;
            showLoading("正在刪除報名...");
            try {
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({ action: "adminDeleteRegistration", regId: regId })
                });
                const result = await response.json();
                if (result.status === "success") {
                    alert("已成功刪除！");
                    await onRegManageEventSelect(); // 重新整理名單
                } else {
                    alert("刪除失敗：" + result.message);
                }
            } catch (e) {
                alert("連線失敗");
            }
            hideLoading();
        }

        // ----------------- 模組 C：報名公告 (接龍) 子邏輯 -----------------
        async function onAnnouncementEventSelect() {
            const eventId = document.getElementById("announceEventSelect").value;
            const panel = document.getElementById("announcementPanel");
            
            if (!eventId) {
                panel.classList.add("hidden");
                return;
            }

            currentEvent = allEvents.find(e => e.id === eventId);
            tempQuestions = []; // 清空臨時問題
            
            showLoading("正在載入接龍名單...");
            await loadAdminParticipants(eventId);
            panel.classList.remove("hidden");
            hideLoading();
        }

        function addChainItemField(selectedVal = "") {
            const container = document.getElementById("chainItemsContainer");
            const div = document.createElement("div");
            div.className = "flex items-center space-x-2 chain-item-row";
            
            const allOptions = activeEventQuestions.concat(tempQuestions);
            let optionsHtml = allOptions.map(q => {
                const sel = q.title === selectedVal ? "selected" : "";
                return `<option value="${q.title}" ${sel}>${q.title}</option>`;
            }).join('');

            div.innerHTML = `
                <select class="flex-1 border border-gray-300 text-xs py-1.5 rounded-lg chain-select">
                    <option value="">-- 請選擇統計項目 --</option>
                    ${optionsHtml}
                </select>
                <button type="button" onclick="this.parentElement.remove()" class="text-red-500 font-bold text-sm">❌</button>
            `;
            container.appendChild(div);
        }

        function showTempQuestionDialog() {
            document.getElementById("tempQTitle").value = "";
            document.getElementById("tempQOptions").value = "";
            document.getElementById("tempQuestionModal").classList.remove("hidden");
        }

        function closeTempQuestionDialog() {
            document.getElementById("tempQuestionModal").classList.add("hidden");
        }

        function addTempQuestion() {
            const title = document.getElementById("tempQTitle").value.trim();
            const optionsStr = document.getElementById("tempQOptions").value.trim();
            
            if (!title) {
                alert("請輸入項目名稱！");
                return;
            }

            const exists = activeEventQuestions.concat(tempQuestions).some(q => q.title === title);
            if (exists) {
                alert("此項目名稱已存在！");
                return;
            }

            const newQ = {
                title: title,
                type: optionsStr ? "select" : "text",
                options: optionsStr,
                isTemp: true
            };

            tempQuestions.push(newQ);
            closeTempQuestionDialog();

            // 重新渲染名單 (讓名單中出現這個新臨時問題的輸入框)
            renderAnnounceParticipantsList();
            
            // 自動在接龍設定中增加這個新項目
            addChainItemField(title);
        }

        // 載入管理端報名名單 (公告接龍用)
        async function loadAdminParticipants(eventId) {
            const listContainer = document.getElementById("announceParticipantsList");
            listContainer.innerHTML = `<p class="text-gray-500 text-center py-4">名單載入中...</p>`;

            try {
                const response = await fetch(`${GAS_URL}?action=getAdminParticipants&eventId=${eventId}`);
                const result = await response.json();
                
                if (result.status === "success") {
                    activeEventQuestions = result.questions.filter(q => q.title !== "姓名");
                    currentParticipants = result.participants;

                    // 初始化接龍設定區：預設加入第一個正式問題
                    document.getElementById("chainItemsContainer").innerHTML = "";
                    if (activeEventQuestions.length > 0) {
                        addChainItemField(activeEventQuestions[0].title);
                    } else {
                        addChainItemField();
                    }

                    renderAnnounceParticipantsList();
                }
            } catch (e) {
                listContainer.innerHTML = `<p class="text-red-500 text-center py-4">名單載入失敗</p>`;
            }
        }

        // 渲染接龍名單與臨時項目狀態勾選
        function renderAnnounceParticipantsList() {
            const listContainer = document.getElementById("announceParticipantsList");
            listContainer.innerHTML = "";

            if (currentParticipants.length === 0) {
                listContainer.innerHTML = `<p class="text-gray-500 text-center py-4">目前尚無人報名</p>`;
                return;
            }

            currentParticipants.forEach((p, idx) => {
                const isBackup = p.status === "候補";
                const badgeColor = isBackup ? "bg-amber-100 text-amber-800" : "bg-teal-100 text-teal-800";
                
                let ansText = "";
                activeEventQuestions.forEach(q => {
                    const ans = p.answers[q.title] || "無";
                    ansText += `<br>• ${q.title}：<span class="text-gray-800 font-medium">${ans}</span>`;
                });

                let tempAnsHtml = "";
                tempQuestions.forEach(q => {
                    if (!p.answers[q.title]) p.answers[q.title] = "";
                    
                    let inputHtml = "";
                    if (q.type === "select") {
                        const opts = q.options.split(',');
                        let optsHtml = opts.map(o => {
                            const sel = o.trim() === p.answers[q.title] ? "selected" : "";
                            return `<option value="${o.trim()}" ${sel}>${o.trim()}</option>`;
                        }).join('');
                        inputHtml = `
                            <select onchange="updateParticipantTempAns(${idx}, '${q.title}', this.value)" class="border text-xs py-0.5 rounded-lg ml-1 bg-blue-50/50">
                                <option value="">請選擇</option>
                                ${optsHtml}
                            </select>
                        `;
                    } else {
                        inputHtml = `
                            <input type="text" value="${p.answers[q.title]}" oninput="updateParticipantTempAns(${idx}, '${q.title}', this.value)" class="border text-xs py-0.5 px-2 rounded-lg ml-1 bg-blue-50/50" placeholder="輸入回答">
                        `;
                    }

                    tempAnsHtml += `
                        <div class="mt-1 text-blue-800 font-bold flex items-center">
                            ⚡ 臨時統計 - ${q.title}：${inputHtml}
                        </div>
                    `;
                });

                const item = document.createElement("div");
                item.className = "p-3 bg-white rounded-xl border border-gray-200 text-xs space-y-1 shadow-sm";
                item.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="font-extrabold text-gray-800">#${idx+1} ${p.name}</span>
                        <span class="px-2 py-0.5 rounded-full font-bold ${badgeColor}">${p.status}</span>
                    </div>
                    <p class="text-gray-500">${ansText}</p>
                    ${tempAnsHtml}
                `;
                listContainer.appendChild(item);
            });
        }

        function updateParticipantTempAns(pIdx, qTitle, value) {
            if (currentParticipants[pIdx]) {
                currentParticipants[pIdx].answers[qTitle] = value;
            }
        }

        // 產生多項目接龍並發送至群組 (全新格式：包含活動名稱、自訂簡易訊息與接龍清單)
        async function shareCustomChainToGroup() {
            const selectedTitles = [];
            document.querySelectorAll(".chain-select").forEach(sel => {
                if (sel.value) selectedTitles.push(sel.value);
            });

            if (selectedTitles.length === 0) {
                alert("請至少選擇一個要統計的接龍項目！");
                return;
            }

            if (currentParticipants.length === 0) {
                alert("目前尚無人報名，無法發送接龍！");
                return;
            }

            showLoading("正在產生接龍並準備發送...");

            // 1. 頂部：活動名稱與自訂簡易訊息
            const customMsg = document.getElementById("announceCustomMsg").value.trim();
            let chainText = `🌸 【${currentEvent.title}】 接龍公告 🌸\n`;
            if (customMsg) {
                chainText += `📢 活動訊息：${customMsg}\n`;
            }
            chainText += `----------------------------------------\n`;

            // 2. 中間：接龍欄位標題
            const headerItems = ["名單"].concat(selectedTitles);
            chainText += `**${headerItems.join(" _ ")}**\n`;

            // 3. 底部：接龍清單內容
            currentParticipants.forEach((p, idx) => {
                const ansList = [];
                selectedTitles.forEach(title => {
                    const ans = p.answers[title] || "無";
                    ansList.push(ans);
                });
                chainText += `${idx + 1}. ${p.name}  _  ${ansList.join(" _ ")}\n`;
            });

            const textPayload = {
                type: "text",
                text: chainText
            };

            if (isInChatContext) {
                try {
                    await liff.sendMessages([textPayload]);
                    alert("多項目接龍已成功發布至群組！");
                } catch (e) {
                    await fallbackShareTargetPicker(textPayload, chainText);
                }
            } else {
                await fallbackShareTargetPicker(textPayload, chainText);
            }
            hideLoading();
        }

        async function fallbackShareTargetPicker(textPayload, rawText) {
            if (liff.isApiAvailable('shareTargetPicker')) {
                try {
                    const res = await liff.shareTargetPicker([textPayload]);
                    if (res) {
                        alert("接龍已成功分享至指定的群組！");
                    }
                } catch (e) {
                    showCopyDialog(rawText);
                }
            } else {
                showCopyDialog(rawText);
            }
        }

        function showCopyDialog(text) {
            const tempTextArea = document.createElement("textarea");
            tempTextArea.value = text;
            document.body.appendChild(tempTextArea);
            tempTextArea.select();
            tempTextArea.setSelectionRange(0, 99999);
            
            try {
                const successful = document.execCommand("copy");
                if (successful) {
                    alert("【一鍵複製成功！】\n\n系統已自動複製接龍文字，您可以直接到 LINE 群組中「貼上」發送：\n\n" + text);
                } else {
                    window.prompt("請複製下方的接龍文字，並手動貼到 LINE 群組中：", text);
                }
            } catch (err) {
                window.prompt("請複製下方的接龍文字，並手動貼到 LINE 群組中：", text);
            }
            document.body.removeChild(tempTextArea);
        }

        // ----------------- 模組共用活動儲存與刪除邏輯 -----------------
        async function saveEvent() {
            const id = document.getElementById("adminEventId").value;
            const title = document.getElementById("adminTitle").value.trim();
            const category = document.getElementById("adminCategory").value;
            const time = document.getElementById("adminTime").value;
            const location = document.getElementById("adminLocation").value.trim();
            const limit = document.getElementById("adminLimit").value;
            const status = document.getElementById("adminStatus").value;
            const description = document.getElementById("adminDescription").value.trim();

            const files = [];
            document.querySelectorAll(".admin-file-row").forEach(row => {
                const inputs = row.querySelectorAll("input");
                if (inputs[0].value && inputs[1].value) {
                    files.push({ name: inputs[0].value.trim(), url: inputs[1].value.trim() });
                }
            });

            const questions = [];
            document.querySelectorAll(".admin-q-row").forEach(row => {
                const titleInput = row.querySelector("input[type='text']");
                const select = row.querySelector("select");
                const optionInput = row.querySelector(".option-input");
                const reqCheckbox = row.querySelector(".req-checkbox");
                
                questions.push({
                    title: titleInput.value.trim(),
                    type: select ? select.value : "text",
                    options: (select && select.value === "select") ? optionInput.value.trim() : "",
                    required: titleInput.value.trim() === "姓名" ? true : (reqCheckbox ? reqCheckbox.checked : false)
                });
            });

            showLoading("正在儲存活動...");
            try {
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({
                        action: "saveEvent",
                        id: id,
                        title: title,
                        category: category,
                        time: time,
                        location: location,
                        limit: parseInt(limit),
                        status: status,
                        description: description,
                        files: files,
                        questions: questions
                    })
                });
                const result = await response.json();
                if (result.status === "success") {
                    alert("活動儲存成功！");
                    await fetchEvents();
                    exitAdminMode();
                }
            } catch (e) {
                alert("連線失敗");
            }
            hideLoading();
        }

        async function deleteEvent() {
            const id = document.getElementById("adminEventId").value;
            if (!id) return;
            if (!confirm("確定要刪除此活動嗎？這將無法復原！")) return;

            showLoading("正在刪除活動...");
            try {
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({ action: "deleteEvent", id: id })
                });
                const result = await response.json();
                if (result.status === "success") {
                    alert("活動已刪除！");
                    await fetchEvents();
                    exitAdminMode();
                }
            } catch (e) {
                alert("連線失敗");
            }
            hideLoading();
        }

        async function sendFlexMessage(queueStatus, queueIndex, count, isUpdate) {
            const titleText = isUpdate ? "✏️ 報名資料已修改！" : "📢 活動多人報名成功！";
            const flexPayload = {
                type: "flex",
                altText: `📢 ${userDisplayName} 已登記活動：${currentEvent.title}`,
                contents: {
                    type: "bubble",
                    header: {
                        type: "box",
                        layout: "vertical",
                        backgroundColor: "#0d9488",
                        contents: [
                            { type: "text", text: titleText, color: "#ffffff", weight: "bold", size: "lg" },
                            { type: "text", text: `活動：${currentEvent.title}`, color: "#fef3c7", size: "sm", margin: "xs", weight: "bold", wrap: true }
                        ]
                    },
                    body: {
                        type: "box",
                        layout: "vertical",
                        spacing: "sm",
                        contents: [
                            { type: "text", text: `💡 【${userDisplayName}】已成功登記 ${count} 位人員！`, weight: "bold", size: "sm", color: "#0f766e" },
                            { type: "text", text: `📌 狀態：${queueStatus}`, weight: "bold", size: "md", color: "#0d9488" },
                            { type: "separator", margin: "md" },
                            { type: "text", text: `🕒 時間：${currentEvent.time}`, size: "sm", color: "#4b5563", wrap: true },
                            { type: "text", text: `📍 地點：${currentEvent.location}`, size: "sm", color: "#4b5563", wrap: true }
                        ]
                    },
                    footer: {
                        type: "box",
                        layout: "vertical",
                        contents: [
                            {
                                type: "button",
                                action: {
                                    type: "uri",
                                    label: "看最新接龍名單",
                                    uri: `https://liff.line.me/${LIFF_ID}`
                                },
                                style: "primary",
                                color: "#0d9488"
                            }
                        ]
                    }
                }
            };

            if (isInChatContext) {
                try { await liff.sendMessages([flexPayload]); } catch (e) { await fallbackShare(flexPayload); }
            } else {
                await fallbackShare(flexPayload);
            }
        }

        async function fallbackShare(flexPayload) {
            if (liff.isApiAvailable('shareTargetPicker')) {
                try { await liff.shareTargetPicker([flexPayload]); } catch (e) {}
            }
        }

        function showLoading(text) {
            document.getElementById("loadingText").innerText = text;
            document.getElementById("loading").classList.remove("hidden");
        }

        function hideLoading() {
            document.getElementById("loading").classList.add("hidden");
        }

        initializeLiff();
    </script>
</body>
</html>
