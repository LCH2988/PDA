<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>《與帕共處》活動報名系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background-color: #f0fdfa; 
            line-height: 1.6;
        }
        /* 放大輸入框與下拉選單，方便長輩操作 */
        select, input[type="text"], textarea {
            font-size: 1.25rem !important;
            padding: 0.75rem !important;
            border-radius: 1rem !important;
        }
    </style>
</head>
<body class="p-4 max-w-md mx-auto pb-12">

    <!-- 載入中遮罩 -->
    <div id="loading" class="fixed inset-0 bg-white bg-opacity-95 flex flex-col justify-center items-center z-50 p-6">
        <div class="animate-spin rounded-full h-16 w-16 border-b-4 border-teal-600 mb-6"></div>
        <p class="text-teal-900 font-bold text-2xl text-center" id="loadingText">正在載入活動資訊，請稍候...</p>
    </div>

    <!-- 頁首 -->
    <div class="bg-teal-700 text-white p-6 rounded-3xl shadow-lg mb-6 text-center">
        <h1 class="text-3xl font-extrabold mb-3">🌸 《與帕同行》 🌸<br>活動報名與登記</h1>
        <p class="text-lg opacity-90 font-medium">台灣帕金森病友權益促進會</p>
        <p id="welcomeUser" class="text-base mt-3 bg-teal-800 inline-block px-4 py-2 rounded-full font-bold">正在載入您的資料...</p>
    </div>

    <!-- 主表單 -->
    <form id="regForm" class="space-y-6 hidden">
        
        <!-- 步驟一：選擇活動 -->
        <div class="bg-white p-6 rounded-3xl shadow-md border-2 border-teal-100">
            <label class="block text-2xl font-extrabold text-teal-900 mb-3">一、請選擇您想參加的活動</label>
            <select id="eventSelect" onchange="onEventChange()" class="w-full border-2 border-teal-200 focus:border-teal-500 focus:ring-2 focus:ring-teal-200 outline-none transition duration-150 text-gray-800 font-bold">
                <option value="">-- 請選擇活動 --</option>
            </select>
            
            <!-- 活動詳情顯示區 -->
            <div id="eventDetails" class="mt-4 p-4 bg-teal-50 rounded-2xl border border-teal-100 hidden">
                <p class="text-teal-900 font-bold text-lg">🕒 時間：<span id="detailTime" class="text-gray-700 font-medium"></span></p>
                <p class="text-teal-900 font-bold text-lg mt-1">📍 地點：<span id="detailLocation" class="text-gray-700 font-medium"></span></p>
            </div>
        </div>

        <!-- 步驟二：動態提問內容（由 JS 根據選擇的活動生成） -->
        <div id="dynamicQuestionsSection" class="bg-white p-6 rounded-3xl shadow-md border-2 border-teal-100 hidden">
            <h2 class="text-2xl font-extrabold text-teal-900 mb-4 border-b-2 pb-3 border-teal-100">
                二、請填寫報名資料
            </h2>
            <p id="editNotice" class="text-amber-600 font-bold text-lg mb-4 hidden">🔔 偵測到您已報名過此活動，送出將會「更新」您的報名資料！</p>
            
            <div class="space-y-6">
                <!-- 問題 1 -->
                <div class="flex flex-col">
                    <label id="lblQ1" class="text-xl font-bold text-gray-800 mb-2"></label>
                    <input type="text" id="ans1" class="w-full border-2 border-teal-100 focus:border-teal-500 focus:ring-2 focus:ring-teal-200 outline-none font-medium" placeholder="請輸入您的回答" required>
                </div>
                
                <!-- 問題 2 -->
                <div class="flex flex-col">
                    <label id="lblQ2" class="text-xl font-bold text-gray-800 mb-2"></label>
                    <input type="text" id="ans2" class="w-full border-2 border-teal-100 focus:border-teal-500 focus:ring-2 focus:ring-teal-200 outline-none font-medium" placeholder="請輸入您的回答" required>
                </div>
            </div>
        </div>

        <!-- 提交按鈕 -->
        <button type="button" id="submitBtn" onclick="submitRegistration()" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-extrabold py-5 px-6 rounded-3xl shadow-xl transition duration-200 text-2xl border-b-4 border-teal-800 active:translate-y-1 active:border-b-0 hidden">
            確認送出報名 🚀
        </button>
    </form>

    <script>
        // ⚠️ 請修改為您的 GAS 與 LIFF 設定
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxy1Wl6BpFhiqLqTLp4n0SQkwkadER4et3v_qaGbQjs_bVehrnl5eHPony3H7wwNq8/exec"; 
        const LIFF_ID = "2009456572-VIoH1oY0";

        let userLineId = "Anonymous";
        let userDisplayName = "熱心成員";
        let currentGroupId = "Unknown";
        let isInChatContext = false;
        
        let allEvents = []; // 儲存從後端取得的所有活動資料
        let currentEvent = null; // 當前選取的活動

        // 初始化 LIFF
        async function initializeLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }
                
                const profile = await liff.getProfile();
                userLineId = profile.userId;
                userDisplayName = profile.displayName;

                const context = liff.getContext();
                if (context) {
                    currentGroupId = context.groupId || context.roomId || context.utouId || "個人聊天";
                    isInChatContext = (context.type === "group" || context.type === "room" || context.type === "utou");
                }

                document.getElementById("welcomeUser").innerText = `您好，${userDisplayName}！`;
                
                // 載入活動清單
                await fetchEvents();
                
            } catch (error) {
                console.error("LIFF 初始化失敗", error);
                alert("請在 LINE 內開啟此頁面");
            }
        }

        // 向後端請求活動清單
        async function fetchEvents() {
            try {
                const response = await fetch(`${GAS_URL}?action=getEvents&lineId=${userLineId}`);
                const result = await response.json();
                if (result.status === "success") {
                    allEvents = result.events;
                    renderEventSelect();
                    
                    document.getElementById("loading").classList.add("hidden");
                    document.getElementById("regForm").classList.remove("hidden");
                } else {
                    alert("載入活動失敗：" + result.message);
                }
            } catch (error) {
                console.error("無法取得活動清單", error);
                alert("網路連線失敗，請稍後再試");
            }
        }

        // 渲染活動下拉選單
        function renderEventSelect() {
            const select = document.getElementById("eventSelect");
            select.innerHTML = '<option value="">-- 請選擇活動 --</option>';
            allEvents.forEach(evt => {
                const opt = document.createElement("option");
                opt.value = evt.id;
                opt.innerText = evt.title;
                select.appendChild(opt);
            });
        }

        // 當使用者切換活動時
        function onEventChange() {
            const selectedId = document.getElementById("eventSelect").value;
            currentEvent = allEvents.find(e => e.id === selectedId);

            const detailsDiv = document.getElementById("eventDetails");
            const questionsSection = document.getElementById("dynamicQuestionsSection");
            const submitBtn = document.getElementById("submitBtn");
            const editNotice = document.getElementById("editNotice");

            if (!currentEvent) {
                detailsDiv.classList.add("hidden");
                questionsSection.classList.add("hidden");
                submitBtn.classList.add("hidden");
                return;
            }

            // 1. 顯示活動時間與地點
            document.getElementById("detailTime").innerText = currentEvent.time;
            document.getElementById("detailLocation").innerText = currentEvent.location;
            detailsDiv.classList.remove("hidden");

            // 2. 動態渲染自訂提問內容
            document.getElementById("lblQ1").innerText = `1. ${currentEvent.q1}`;
            document.getElementById("lblQ2").innerText = `2. ${currentEvent.q2}`;
            
            // 3. 檢查此用戶是否已經報名過（帶入舊資料，提供修改功能）
            if (currentEvent.hasRegistered) {
                document.getElementById("ans1").value = currentEvent.prevAns1 || "";
                document.getElementById("ans2").value = currentEvent.prevAns2 || "";
                editNotice.classList.remove("hidden");
                submitBtn.innerText = "確認修改報名資料 ✏️";
            } else {
                document.getElementById("ans1").value = "";
                document.getElementById("ans2").value = "";
                editNotice.classList.add("hidden");
                submitBtn.innerText = "確認送出報名 🚀";
            }

            questionsSection.classList.remove("hidden");
            submitBtn.classList.remove("hidden");
        }

        // 提交報名資料
        async function submitRegistration() {
            const ans1 = document.getElementById("ans1").value.trim();
            const ans2 = document.getElementById("ans2").value.trim();

            if (!ans1 || !ans2) {
                alert("請完整填寫所有提問內容喔！");
                return;
            }

            // 停用按鈕防止重複點擊
            const submitBtn = document.getElementById("submitBtn");
            submitBtn.disabled = true;

            document.getElementById("loadingText").innerText = "正在儲存您的報名資訊...";
            document.getElementById("loading").classList.remove("hidden");

            try {
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({
                        action: "register",
                        eventId: currentEvent.id,
                        lineId: userLineId,
                        displayName: userDisplayName,
                        groupId: currentGroupId,
                        ans1: ans1,
                        ans2: ans2
                    })
                });

                const result = await response.json();
                if (result.status === "success") {
                    // 報名成功，發送 Flex Message
                    await sendFlexMessage(result.regCount);
                } else {
                    alert("儲存失敗：" + result.message);
                    submitBtn.disabled = false;
                    document.getElementById("loading").classList.add("hidden");
                }
            } catch (error) {
                console.error("報名 API 錯誤", error);
                alert("伺服器連線失敗，但您的資料可能已記錄，請洽管理員。");
                liff.closeWindow();
            }
        }

        // 發送 Flex Message 報名成功通知
        async function sendFlexMessage(regCount) {
            const isUpdate = currentEvent.hasRegistered;
            const titleText = isUpdate ? "✏️ 報名資料已更新！" : "🎉 報名成功通知！";
            
            const flexPayload = {
                type: "flex",
                altText: `📢 ${userDisplayName} 已登記活動：${currentEvent.title}`,
                contents: {
                    type: "bubble",
                    header: {
                        type: "box",
                        layout: "vertical",
                        backgroundColor: "#0d9488",
                        contents: [
                            { type: "text", text: titleText, color: "#ffffff", weight: "bold", size: "lg" },
                            { type: "text", text: `活動：${currentEvent.title}`, color: "#ccfbf1", size: "sm", margin: "xs", weight: "bold", wrap: true }
                        ]
                    },
                    body: {
                        type: "box",
                        layout: "vertical",
                        spacing: "md",
                        contents: [
                            { type: "text", text: `💡 【${userDisplayName}】已成功登記！`, weight: "bold", size: "sm", color: "#0f766e" },
                            { type: "separator", margin: "md" },
                            { type: "text", text: `🕒 時間：${currentEvent.time}`, size: "sm", color: "#4b5563", wrap: true },
                            { type: "text", text: `📍 地點：${currentEvent.location}`, size: "sm", color: "#4b5563", wrap: true },
                            { type: "separator", margin: "md" },
                            { type: "text", text: `目前該活動已累積 ${regCount} 人報名`, size: "xs", color: "#9ca3af", align: "end" }
                        ]
                    },
                    footer: {
                        type: "box",
                        layout: "vertical",
                        contents: [
                            {
                                type: "button",
                                action: {
                                    type: "uri",
                                    label: "我也要報名/修改登記",
                                    uri: `https://liff.line.me/${LIFF_ID}`
                                },
                                style: "primary",
                                color: "#0d9488"
                            }
                        ]
                    }
                }
            };

            if (isInChatContext) {
                try {
                    await liff.sendMessages([flexPayload]);
                    liff.closeWindow();
                } catch (e) {
                    await fallbackShare(flexPayload);
                }
            } else {
                await fallbackShare(flexPayload);
            }
        }

        async function fallbackShare(flexPayload) {
            if (liff.isApiAvailable('shareTargetPicker')) {
                try {
                    await liff.shareTargetPicker([flexPayload]);
                    liff.closeWindow();
                } catch (e) {
                    liff.closeWindow();
                }
            } else {
                alert("登記成功！感謝您的參與！");
                liff.closeWindow();
            }
        }

        initializeLiff();
    </script>
</body>
</html>
