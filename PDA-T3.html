<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>《與帕同行》活動報名與會員系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background-color: #f0fdfa; 
            line-height: 1.6;
        }
        input, select, textarea {
            font-size: 1.1rem !important;
            padding: 0.65rem !important;
            border-radius: 0.75rem !important;
        }
    </style>
</head>
<body class="p-4 max-w-md mx-auto pb-12">

    <!-- 載入中遮罩 -->
    <div id="loading" class="fixed inset-0 bg-white bg-opacity-95 flex flex-col justify-center items-center z-50 p-6">
        <div class="animate-spin rounded-full h-16 w-16 border-b-4 border-teal-600 mb-6"></div>
        <p class="text-teal-900 font-bold text-xl text-center" id="loadingText">正在載入系統，請稍候...</p>
    </div>

    <!-- 頂部導覽與狀態列 -->
    <div class="bg-teal-700 text-white p-5 rounded-3xl shadow-lg mb-6 text-center relative">
        <button id="adminBtn" onclick="toggleAdminMode()" class="absolute top-3 right-3 bg-teal-800 hover:bg-teal-900 text-white text-xs px-3 py-1.5 rounded-full font-bold">
            ⚙️ 管理
        </button>
        <h1 class="text-2xl font-extrabold mb-1">🌸 《與帕同行》 🌸<br>會員與活動系統</h1>
        <p id="welcomeUser" class="text-xs mt-2 bg-teal-800 inline-block px-4 py-1 rounded-full font-bold">正在載入...</p>
        
        <!-- 會員選單 (登入後顯示) -->
        <div id="memberMenu" class="flex justify-center space-x-3 mt-3 text-xs hidden">
            <button onclick="showPage('eventListPage')" class="bg-teal-600 px-3 py-1 rounded-full font-bold">📅 活動列表</button>
            <button onclick="showProfilePage()" class="bg-teal-600 px-3 py-1 rounded-full font-bold">👤 個人資料</button>
            <button onclick="logout()" class="bg-red-700 px-3 py-1 rounded-full font-bold">登出</button>
        </div>
    </div>

    <!-- ================= 頁面：註冊 / 登入 ================= -->
    <div id="loginPage" class="space-y-6 hidden">
        <div class="bg-white p-6 rounded-3xl shadow-md border-2 border-teal-100">
            <h2 class="text-xl font-extrabold text-teal-900 mb-4 text-center">會員登入 / 註冊</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">真實姓名</label>
                    <input type="text" id="loginName" class="w-full border border-gray-300 outline-none" placeholder="請輸入姓名">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">手機號碼</label>
                    <input type="tel" id="loginPhone" class="w-full border border-gray-300 outline-none" placeholder="例如：0912345678">
                </div>
                <button onclick="handleLoginOrRegister()" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 px-4 rounded-2xl shadow-md text-lg">
                    確認登入 / 註冊 🚀
                </button>
            </div>
        </div>
    </div>

    <!-- ================= 頁面：個人資料維護 ================= -->
    <div id="profilePage" class="space-y-6 hidden">
        <div class="bg-white p-6 rounded-3xl shadow-md border-2 border-teal-100">
            <h2 class="text-xl font-extrabold text-teal-900 mb-4 border-b pb-2">👤 維護個人基本資料</h2>
            <div class="space-y-4 text-sm">
                <div>
                    <label class="block font-bold text-gray-700 mb-1">性別</label>
                    <select id="profGender" class="w-full border border-gray-300 outline-none">
                        <option value="">請選擇</option>
                        <option value="男">男</option>
                        <option value="女">女</option>
                    </select>
                </div>
                <div>
                    <label class="block font-bold text-gray-700 mb-1">生日</label>
                    <input type="date" id="profBirthday" class="w-full border border-gray-300 outline-none">
                </div>
                <div>
                    <label class="block font-bold text-gray-700 mb-1">身分證字號 (保險用)</label>
                    <input type="text" id="profIdCard" class="w-full border border-gray-300 outline-none" placeholder="例如：A123456789">
                </div>
                <div>
                    <label class="block font-bold text-gray-700 mb-1">聯絡地址</label>
                    <input type="text" id="profAddress" class="w-full border border-gray-300 outline-none" placeholder="請輸入完整地址">
                </div>
                <button onclick="saveProfile()" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 px-4 rounded-2xl shadow-md text-lg">
                    儲存個人資料 💾
                </button>
            </div>
        </div>
    </div>

    <!-- ================= 頁面：活動列表 (含搜尋與分類) ================= -->
    <div id="eventListPage" class="space-y-6 hidden">
        <!-- 搜尋與篩選列 -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-teal-100 space-y-3">
            <div class="flex space-x-2">
                <input type="text" id="searchKeyword" oninput="filterEvents()" class="flex-1 border border-gray-300 text-sm" placeholder="🔍 輸入關鍵字搜尋...">
                <select id="filterCategory" onchange="filterEvents()" class="border border-gray-300 text-sm">
                    <option value="">全部分類</option>
                    <option value="醫學講座">醫學講座</option>
                    <option value="戶外活動">戶外活動</option>
                    <option value="復健課程">復健課程</option>
                </select>
            </div>
        </div>

        <!-- 活動列表容器 -->
        <div id="eventListContainer" class="space-y-4"></div>
    </div>

    <!-- ================= 頁面：多人報名表單 ================= -->
    <div id="registerPage" class="space-y-6 hidden">
        <div class="bg-white p-6 rounded-3xl shadow-md border-2 border-teal-100">
            <h2 id="regEventTitle" class="text-xl font-extrabold text-teal-900 mb-2"></h2>
            <div id="regEventDetails" class="text-sm text-gray-600 mb-4 pb-3 border-b space-y-1"></div>

            <!-- 隨附檔案下載區 -->
            <div id="eventFilesArea" class="mb-4 hidden">
                <p class="font-bold text-teal-800 text-sm mb-1">📂 相關檔案下載：</p>
                <div id="fileLinksList" class="flex flex-wrap gap-2"></div>
            </div>

            <!-- 報名名單 (支援多人) -->
            <form id="multiRegForm" class="space-y-6">
                <div id="attendeesContainer" class="space-y-6">
                    <!-- 動態產生報名者區塊 -->
                </div>

                <button type="button" onclick="addAttendeeField()" class="w-full bg-teal-50 hover:bg-teal-100 text-teal-800 font-bold py-2.5 px-4 rounded-2xl border border-dashed border-teal-300 text-sm">
                    ➕ 增加同行報名人員
                </button>

                <button type="button" onclick="submitMultiRegistration()" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-extrabold py-4 px-6 rounded-3xl shadow-xl text-lg">
                    確認送出報名 🚀
                </button>
            </form>
        </div>
    </div>

    <!-- ================= 頁面：報名成功與接龍清單 ================= -->
    <div id="successPage" class="space-y-6 hidden">
        <div class="bg-white p-6 rounded-3xl shadow-md border-2 border-teal-100 text-center">
            <div class="text-4xl mb-2">🎉</div>
            <h2 class="text-xl font-extrabold text-teal-900 mb-1">報名登記成功！</h2>
            <p id="myQueueStatus" class="text-base font-bold text-teal-700 mb-3"></p>
            <button onclick="showPage('eventListPage')" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-1.5 px-5 rounded-full text-xs">
                返回活動列表
            </button>
        </div>

        <!-- 接龍名單 -->
        <div class="bg-white p-6 rounded-3xl shadow-md border-2 border-teal-100">
            <h3 class="text-lg font-extrabold text-teal-900 mb-3 border-b pb-2">📋 目前報名接龍清單</h3>
            <div id="listContainer" class="space-y-2 text-sm"></div>
            
            <!-- 分頁 -->
            <div class="flex justify-between items-center mt-5 pt-3 border-t border-gray-100 text-xs">
                <button id="prevPageBtn" onclick="changePage(-1)" class="bg-teal-50 hover:bg-teal-100 text-teal-800 font-bold py-1.5 px-3 rounded-lg">◀ 上一頁</button>
                <span id="pageIndicator" class="text-gray-600 font-bold">第 1 / 1 頁</span>
                <button id="nextPageBtn" onclick="changePage(1)" class="bg-teal-50 hover:bg-teal-100 text-teal-800 font-bold py-1.5 px-3 rounded-lg">下一頁 ▶</button>
            </div>
        </div>
    </div>

    <!-- ================= 頁面：管理員後台 ================= -->
    <div id="adminPage" class="space-y-6 hidden">
        <div class="bg-white p-5 rounded-3xl shadow-md border-2 border-amber-200">
            <div class="flex justify-between items-center mb-4 border-b pb-2 border-amber-100">
                <h2 class="text-xl font-extrabold text-amber-900">⚙️ 管理員主控台</h2>
                <button onclick="exitAdminMode()" class="text-gray-500 hover:text-gray-700 font-bold text-xs">退出</button>
            </div>

            <div class="mb-4">
                <select id="adminEventSelect" onchange="onAdminEventSelect()" class="w-full border-2 border-amber-200 font-bold text-sm">
                    <option value="new">➕ 建立全新活動</option>
                </select>
            </div>

            <!-- 管理員活動表單 -->
            <form id="eventForm" class="space-y-4 text-xs">
                <input type="hidden" id="adminEventId">
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-bold text-gray-700 mb-1">活動名稱</label>
                        <input type="text" id="adminTitle" class="w-full border border-gray-300 rounded-lg" required>
                    </div>
                    <div>
                        <label class="block font-bold text-gray-700 mb-1">活動分類</label>
                        <select id="adminCategory" class="w-full border border-gray-300 rounded-lg">
                            <option value="醫學講座">醫學講座</option>
                            <option value="戶外活動">戶外活動</option>
                            <option value="復健課程">復健課程</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-bold text-gray-700 mb-1">活動時間</label>
                        <input type="datetime-local" id="adminTime" class="w-full border border-gray-300 rounded-lg" required>
                    </div>
                    <div>
                        <label class="block font-bold text-gray-700 mb-1">活動地點</label>
                        <input type="text" id="adminLocation" class="w-full border border-gray-300 rounded-lg" required>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-bold text-gray-700 mb-1">人數上限</label>
                        <input type="number" id="adminLimit" class="w-full border border-gray-300 rounded-lg" required>
                    </div>
                    <div>
                        <label class="block font-bold text-gray-700 mb-1">活動狀態</label>
                        <select id="adminStatus" class="w-full border border-gray-300 rounded-lg">
                            <option value="啟動">啟動 (開放報名)</option>
                            <option value="停止">停止 (關閉報名)</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block font-bold text-gray-700 mb-1">詳細說明</label>
                    <textarea id="adminDescription" class="w-full border border-gray-300 rounded-lg h-16"></textarea>
                </div>

                <!-- 檔案上傳管理 -->
                <div class="border-t pt-2">
                    <p class="font-bold text-amber-800 mb-1">📂 附加檔案連結</p>
                    <div id="adminFilesContainer" class="space-y-1"></div>
                    <button type="button" onclick="addAdminFileField()" class="mt-1 bg-amber-50 text-amber-800 px-2 py-1 rounded border border-amber-200">➕ 增加檔案</button>
                </div>

                <!-- 自訂調查項目管理 -->
                <div class="border-t pt-2">
                    <p class="font-bold text-amber-800 mb-1">📋 自訂調查項目 (預設前兩題為姓名、備註)</p>
                    <div id="adminQuestionsContainer" class="space-y-2"></div>
                    <button type="button" onclick="addAdminQuestionField()" class="mt-1 bg-amber-50 text-amber-800 px-2 py-1 rounded border border-amber-200">➕ 增加問題</button>
                </div>

                <div class="flex space-x-2 pt-2">
                    <button type="button" id="adminDeleteBtn" onclick="deleteEvent()" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 px-4 rounded-xl text-sm hidden">
                        刪除活動 🗑️
                    </button>
                    <button type="button" onclick="saveEvent()" class="flex-2 bg-amber-600 hover:bg-amber-700 text-white font-bold py-2.5 px-4 rounded-xl text-sm">
                        儲存設定 💾
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxPEpRYBTx35RuZQmL0EuENuflD6D2WzUYkDFDyqO9_0vyBR5V8zFCP3h8Nt-ZIcmfi/exec"; 
        const LIFF_ID = "2009456572-VIoH1oY0";
        const ADMIN_PASSWORD = "1234";

        let userLineId = "Anonymous";
        let userDisplayName = "熱心成員";
        let currentGroupId = "Unknown";
        let isInChatContext = false;
        
        let currentUser = null; // 登入的會員資料
        let allEvents = [];
        let currentEvent = null;
        let isAdmin = false;

        let currentParticipants = [];
        let currentPage = 1;
        const pageSize = 20;

        async function initializeLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }
                
                const profile = await liff.getProfile();
                userLineId = profile.userId;
                userDisplayName = profile.displayName;

                const context = liff.getContext();
                if (context) {
                    currentGroupId = context.groupId || context.roomId || context.utouId || "個人聊天";
                    isInChatContext = (context.type === "group" || context.type === "room" || context.type === "utou");
                }

                document.getElementById("welcomeUser").innerText = `LINE 連結中：${userDisplayName}`;
                
                // 嘗試自動登入
                await autoLogin();
            } catch (error) {
                console.error("LIFF 初始化失敗", error);
                alert("請在 LINE 內開啟此頁面");
            }
        }

        // 頁面切換控制
        function showPage(pageId) {
            const pages = ['loginPage', 'profilePage', 'eventListPage', 'registerPage', 'successPage', 'adminPage'];
            pages.forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(pageId).classList.remove('hidden');
            
            if (currentUser) {
                document.getElementById('memberMenu').classList.remove('hidden');
            } else {
                document.getElementById('memberMenu').classList.add('hidden');
            }
        }

        // 自動登入
        async function autoLogin() {
            showLoading("正在檢查會員資料...");
            try {
                const response = await fetch(`${GAS_URL}?action=getUser&lineId=${userLineId}`);
                const result = await response.json();
                if (result.status === "success" && result.user) {
                    currentUser = result.user;
                    document.getElementById("welcomeUser").innerText = `歡迎，${currentUser.name}！`;
                    await fetchEvents();
                    showPage("eventListPage");
                } else {
                    // 未註冊，顯示註冊/登入頁
                    showPage("loginPage");
                }
            } catch (e) {
                alert("連線失敗，請重新整理");
            }
            hideLoading();
        }

        // 手動登入或註冊
        async function handleLoginOrRegister() {
            const name = document.getElementById("loginName").value.trim();
            const phone = document.getElementById("loginPhone").value.trim();
            if (!name || !phone) {
                alert("請輸入姓名與電話！");
                return;
            }

            showLoading("正在處理登入/註冊...");
            try {
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({
                        action: "loginOrRegister",
                        lineId: userLineId,
                        name: name,
                        phone: phone
                    })
                });
                const result = await response.json();
                if (result.status === "success") {
                    currentUser = result.user;
                    document.getElementById("welcomeUser").innerText = `歡迎，${currentUser.name}！`;
                    await fetchEvents();
                    showPage("eventListPage");
                } else {
                    alert("處理失敗：" + result.message);
                }
            } catch (e) {
                alert("連線失敗");
            }
            hideLoading();
        }

        // 顯示個人資料維護頁
        function showProfilePage() {
            document.getElementById("profGender").value = currentUser.gender || "";
            document.getElementById("profBirthday").value = currentUser.birthday ? currentUser.birthday.split('T')[0] : "";
            document.getElementById("profIdCard").value = currentUser.idCard || "";
            document.getElementById("profAddress").value = currentUser.address || "";
            showPage("profilePage");
        }

        // 儲存個人資料
        async function saveProfile() {
            showLoading("正在儲存個人資料...");
            try {
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({
                        action: "saveProfile",
                        lineId: userLineId,
                        gender: document.getElementById("profGender").value,
                        birthday: document.getElementById("profBirthday").value,
                        idCard: document.getElementById("profIdCard").value.trim(),
                        address: document.getElementById("profAddress").value.trim()
                    })
                });
                const result = await response.json();
                if (result.status === "success") {
                    currentUser = result.user;
                    alert("個人資料儲存成功！");
                    showPage("eventListPage");
                } else {
                    alert("儲存失敗");
                }
            } catch (e) {
                alert("連線失敗");
            }
            hideLoading();
        }

        // 登出
        function logout() {
            currentUser = null;
            document.getElementById("welcomeUser").innerText = "請先登入";
            showPage("loginPage");
        }

        // 取得活動清單
        async function fetchEvents() {
            try {
                const response = await fetch(`${GAS_URL}?action=getEvents`);
                const result = await response.json();
                if (result.status === "success") {
                    allEvents = result.events;
                    renderEventList();
                    renderAdminEventSelect();
                }
            } catch (e) {
                console.error(e);
            }
        }

        // 渲染活動列表 (含關鍵字與分類過濾)
        function renderEventList() {
            const container = document.getElementById("eventListContainer");
            container.innerHTML = "";

            const keyword = document.getElementById("searchKeyword").value.toLowerCase();
            const category = document.getElementById("filterCategory").value;

            const filtered = allEvents.filter(evt => {
                const matchKeyword = evt.title.toLowerCase().includes(keyword) || evt.location.toLowerCase().includes(keyword);
                const matchCategory = !category || evt.category === category;
                const isActive = evt.status === "啟動";
                return matchKeyword && matchCategory && isActive;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<p class="text-gray-500 text-center py-8">目前無符合條件的活動</p>`;
                return;
            }

            filtered.forEach(evt => {
                const card = document.createElement("div");
                card.className = "bg-white p-5 rounded-2xl shadow-md border border-teal-100 flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <span class="bg-teal-100 text-teal-800 text-xs font-bold px-2.5 py-1 rounded-full">${evt.category}</span>
                        <h3 class="text-xl font-extrabold text-teal-900 mt-2">${evt.title}</h3>
                        <p class="text-gray-600 text-sm mt-1">🕒 時間：${evt.time}</p>
                        <p class="text-gray-600 text-sm">📍 地點：${evt.location}</p>
                        <p class="text-gray-600 text-sm">👥 限額：${evt.limit} 人</p>
                    </div>
                    <button onclick="startRegister('${evt.id}')" class="mt-4 w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-2 rounded-xl text-base">
                        我要報名 📝
                    </button>
                `;
                container.appendChild(card);
            });
        }

        function filterEvents() {
            renderEventList();
        }

        // 開始多人報名
        function startRegister(eventId) {
            currentEvent = allEvents.find(e => e.id === eventId);
            if (!currentEvent) return;

            document.getElementById("regEventTitle").innerText = currentEvent.title;
            document.getElementById("regEventDetails").innerHTML = `
                <p>🕒 時間：${currentEvent.time}</p>
                <p>📍 地點：${currentEvent.location}</p>
                <p>📝 說明：${currentEvent.description || "無"}</p>
            `;

            // 渲染檔案下載區
            const filesArea = document.getElementById("eventFilesArea");
            const filesList = document.getElementById("fileLinksList");
            filesList.innerHTML = "";
            if (currentEvent.files && currentEvent.files.length > 0) {
                currentEvent.files.forEach(f => {
                    const a = document.createElement("a");
                    a.href = f.url;
                    a.target = "_blank";
                    a.className = "bg-blue-50 text-blue-700 border border-blue-200 px-3 py-1 rounded-full text-xs font-bold hover:bg-blue-100";
                    a.innerText = `📄 ${f.name}`;
                    filesList.appendChild(a);
                });
                filesArea.classList.remove("hidden");
            } else {
                filesArea.classList.add("hidden");
            }

            // 初始化報名名單，預設帶入自己
            const container = document.getElementById("attendeesContainer");
            container.innerHTML = "";
            addAttendeeField(currentUser.name, currentUser.phone, true);

            showPage("registerPage");
        }

        // 動態增加報名者欄位
        function addAttendeeField(name = "", phone = "", isSelf = false) {
            const container = document.getElementById("attendeesContainer");
            const index = container.children.length;
            
            const div = document.createElement("div");
            div.className = "p-4 bg-gray-50 rounded-2xl border border-gray-200 relative space-y-3 attendee-block";
            
            let deleteBtnHtml = "";
            if (!isSelf) {
                deleteBtnHtml = `<button type="button" onclick="this.parentElement.remove()" class="absolute top-2 right-2 text-red-500 font-bold text-xs">❌ 刪除</button>`;
            }

            // 根據活動自訂問題動態渲染
            let questionsHtml = "";
            const questions = currentEvent.questions || [
                { title: "姓名", type: "text" },
                { title: "備註", type: "text" }
            ];

            questions.forEach((q, qIdx) => {
                let inputHtml = "";
                // 預設問題一與問題二自動帶入
                let defaultVal = "";
                if (isSelf && q.title === "姓名") defaultVal = name;
                if (isSelf && q.title === "電話") defaultVal = phone;

                if (q.type === "text") {
                    inputHtml = `<input type="text" name="q_${qIdx}" value="${defaultVal}" class="w-full border border-gray-300 rounded-lg" placeholder="請輸入回答" required>`;
                } else if (q.type === "select") {
                    const options = q.options ? q.options.split(',') : [];
                    let optionsHtml = options.map(o => `<option value="${o.trim()}">${o.trim()}</option>`).join('');
                    inputHtml = `
                        <select name="q_${qIdx}" class="w-full border border-gray-300 rounded-lg" required>
                            <option value="">請選擇</option>
                            ${optionsHtml}
                        </select>`;
                }

                questionsHtml += `
                    <div>
                        <label class="block font-bold text-gray-700 text-xs mb-1">${q.title}</label>
                        ${inputHtml}
                    </div>
                `;
            });

            div.innerHTML = `
                <h4 class="font-extrabold text-teal-900 text-sm border-b pb-1">👤 人員 #${index + 1} ${isSelf ? '(發起人自己)' : ''}</h4>
                ${deleteBtnHtml}
                <div class="space-y-3">
                    ${questionsHtml}
                </div>
            `;
            container.appendChild(div);
        }

        // 提交多人報名
        async function submitMultiRegistration() {
            const blocks = document.querySelectorAll(".attendee-block");
            const attendees = [];

            for (let block of blocks) {
                const answers = {};
                const questions = currentEvent.questions || [];
                
                // 獲取自訂問題的回答
                let nameVal = "";
                let phoneVal = "";

                for (let qIdx = 0; qIdx < questions.length; qIdx++) {
                    const q = questions[qIdx];
                    const inputEl = block.querySelector(`[name="q_${qIdx}"]`);
                    if (!inputEl || !inputEl.value.trim()) {
                        alert(`請填寫完整的報名資料！`);
                        return;
                    }
                    answers[q.title] = inputEl.value.trim();
                    if (q.title === "姓名") nameVal = inputEl.value.trim();
                    if (q.title === "電話") phoneVal = inputEl.value.trim();
                }

                attendees.push({
                    name: nameVal || "無名氏",
                    phone: phoneVal || "",
                    answers: answers
                });
            }

            showLoading("正在提交報名...");
            try {
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({
                        action: "registerMulti",
                        eventId: currentEvent.id,
                        lineId: userLineId,
                        leaderName: currentUser.name,
                        leaderPhone: currentUser.phone,
                        groupId: currentGroupId,
                        attendees: attendees
                    })
                });
                const result = await response.json();
                if (result.status === "success") {
                    await showSuccessPage(result.queueStatus, result.queueIndex);
                    await sendFlexMessage(result.queueStatus, result.queueIndex, attendees.length);
                } else {
                    alert("報名失敗：" + result.message);
                }
            } catch (e) {
                alert("連線失敗");
            }
            hideLoading();
        }

        // 顯示成功頁面與接龍
        async function showSuccessPage(queueStatus, queueIndex) {
            showPage("successPage");
            document.getElementById("myQueueStatus").innerText = `您已成功報名，狀態為：【${queueStatus}】`;
            
            // 載入接龍
            try {
                const response = await fetch(`${GAS_URL}?action=getParticipants&eventId=${currentEvent.id}`);
                const result = await response.json();
                if (result.status === "success") {
                    currentParticipants = result.participants;
                    currentPage = 1;
                    renderParticipantsList();
                }
            } catch (e) {}
        }

        function renderParticipantsList() {
            const container = document.getElementById("listContainer");
            container.innerHTML = "";

            const totalPages = Math.ceil(currentParticipants.length / pageSize) || 1;
            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            const pageData = currentParticipants.slice(start, end);

            pageData.forEach((p, index) => {
                const globalIndex = start + index + 1;
                const isBackup = p.status === "候補";
                const badgeColor = isBackup ? "bg-amber-100 text-amber-800" : "bg-teal-100 text-teal-800";
                
                const item = document.createElement("div");
                item.className = "flex justify-between items-center p-2.5 bg-gray-50 rounded-xl border border-gray-100";
                item.innerHTML = `
                    <span class="font-bold text-gray-800">#${globalIndex} ${p.name}</span>
                    <span class="px-2 py-0.5 rounded-full text-xs font-bold ${badgeColor}">${p.status}</span>
                `;
                container.appendChild(item);
            });

            document.getElementById("pageIndicator").innerText = `第 ${currentPage} / ${totalPages} 頁`;
            document.getElementById("prevPageBtn").disabled = currentPage === 1;
            document.getElementById("nextPageBtn").disabled = currentPage === totalPages;
        }

        function changePage(dir) {
            currentPage += dir;
            renderParticipantsList();
        }

        // ================= 管理員後台邏輯 =================
        function toggleAdminMode() {
            if (isAdmin) {
                exitAdminMode();
                return;
            }
            const pwd = prompt("請輸入管理員密碼：");
            if (pwd === ADMIN_PASSWORD) {
                isAdmin = true;
                showPage("adminPage");
                onAdminEventSelect();
            } else if (pwd !== null) {
                alert("密碼錯誤！");
            }
        }

        function exitAdminMode() {
            isAdmin = false;
            showPage("eventListPage");
        }

        function renderAdminEventSelect() {
            const select = document.getElementById("adminEventSelect");
            select.innerHTML = '<option value="new">➕ 建立全新活動</option>';
            allEvents.forEach(evt => {
                const opt = document.createElement("option");
                opt.value = evt.id;
                opt.innerText = `[${evt.status}] ${evt.title}`;
                select.appendChild(opt);
            });
        }

        function onAdminEventSelect() {
            const val = document.getElementById("adminEventSelect").value;
            const form = document.getElementById("eventForm");
            const delBtn = document.getElementById("adminDeleteBtn");
            
            document.getElementById("adminFilesContainer").innerHTML = "";
            document.getElementById("adminQuestionsContainer").innerHTML = "";

            if (val === "new") {
                form.reset();
                document.getElementById("adminEventId").value = "";
                delBtn.classList.add("hidden");
                // 預設載入問題一姓名、問題二備註
                addAdminQuestionField("姓名", "text");
                addAdminQuestionField("電話", "text");
                addAdminQuestionField("備註", "text");
            } else {
                const evt = allEvents.find(e => e.id === val);
                if (evt) {
                    document.getElementById("adminEventId").value = evt.id;
                    document.getElementById("adminTitle").value = evt.title;
                    document.getElementById("adminCategory").value = evt.category;
                    
                    const dateObj = new Date(evt.time);
                    const formattedDate = dateObj.getFullYear() + '-' + 
                        String(dateObj.getMonth() + 1).padStart(2, '0') + '-' + 
                        String(dateObj.getDate()).padStart(2, '0') + 'T' + 
                        String(dateObj.getHours()).padStart(2, '0') + ':' + 
                        String(dateObj.getMinutes()).padStart(2, '0');
                    document.getElementById("adminTime").value = formattedDate;
                    
                    document.getElementById("adminLocation").value = evt.location;
                    document.getElementById("adminLimit").value = evt.limit;
                    document.getElementById("adminStatus").value = evt.status;
                    document.getElementById("adminDescription").value = evt.description || "";
                    
                    // 載入檔案
                    if (evt.files) {
                        evt.files.forEach(f => addAdminFileField(f.name, f.url));
                    }
                    
                    // 載入問題
                    if (evt.questions) {
                        evt.questions.forEach(q => addAdminQuestionField(q.title, q.type, q.options));
                    }
                    
                    delBtn.classList.remove("hidden");
                }
            }
        }

        // 管理員：動態增加檔案欄位
        function addAdminFileField(name = "", url = "") {
            const container = document.getElementById("adminFilesContainer");
            const div = document.createElement("div");
            div.className = "flex space-x-1 items-center admin-file-row";
            div.innerHTML = `
                <input type="text" placeholder="檔案名稱" value="${name}" class="flex-1 border" required>
                <input type="url" placeholder="下載網址" value="${url}" class="flex-2 border" required>
                <button type="button" onclick="this.parentElement.remove()" class="text-red-500 font-bold">❌</button>
            `;
            container.appendChild(div);
        }

        // 管理員：動態增加自訂問題欄位
        function addAdminQuestionField(title = "", type = "text", options = "") {
            const container = document.getElementById("adminQuestionsContainer");
            const div = document.createElement("div");
            div.className = "p-2 bg-amber-50/50 rounded-lg border border-amber-100 space-y-1 admin-q-row";
            
            // 姓名與電話為系統核心，不允許刪除
            const isCore = title === "姓名" || title === "電話";
            const deleteBtn = isCore ? "" : `<button type="button" onclick="this.parentElement.remove()" class="text-red-500 font-bold text-xs float-right">❌</button>`;

            div.innerHTML = `
                ${deleteBtn}
                <div class="flex space-x-1">
                    <input type="text" placeholder="問題名稱" value="${title}" class="flex-1 border" ${isCore ? 'readonly' : ''} required>
                    <select onchange="toggleOptionField(this)" class="border" ${isCore ? 'disabled' : ''}>
                        <option value="text" ${type === 'text' ? 'selected' : ''}>文字輸入</option>
                        <option value="select" ${type === 'select' ? 'selected' : ''}>下拉選單</option>
                    </select>
                </div>
                <input type="text" placeholder="選項 (用逗號隔開，如：是,否)" value="${options}" class="w-full border text-xs ${type === 'select' ? '' : 'hidden'} option-input">
            `;
            container.appendChild(div);
        }

        function toggleOptionField(selectEl) {
            const optionInput = selectEl.parentElement.nextElementSibling;
            if (selectEl.value === "select") {
                optionInput.classList.remove("hidden");
            } else {
                optionInput.classList.add("hidden");
            }
        }

        async function saveEvent() {
            const id = document.getElementById("adminEventId").value;
            const title = document.getElementById("adminTitle").value.trim();
            const category = document.getElementById("adminCategory").value;
            const time = document.getElementById("adminTime").value;
            const location = document.getElementById("adminLocation").value.trim();
            const limit = document.getElementById("adminLimit").value;
            const status = document.getElementById("adminStatus").value;
            const description = document.getElementById("adminDescription").value.trim();

            // 收集檔案
            const files = [];
            document.querySelectorAll(".admin-file-row").forEach(row => {
                const inputs = row.querySelectorAll("input");
                if (inputs[0].value && inputs[1].value) {
                    files.push({ name: inputs[0].value.trim(), url: inputs[1].value.trim() });
                }
            });

            // 收集問題
            const questions = [];
            document.querySelectorAll(".admin-q-row").forEach(row => {
                const titleInput = row.querySelector("input[type='text']");
                const select = row.querySelector("select");
                const optionInput = row.querySelector(".option-input");
                questions.push({
                    title: titleInput.value.trim(),
                    type: select ? select.value : "text",
                    options: (select && select.value === "select") ? optionInput.value.trim() : ""
                });
            });

            showLoading("正在儲存活動...");
            try {
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({
                        action: "saveEvent",
                        id: id,
                        title: title,
                        category: category,
                        time: time,
                        location: location,
                        limit: parseInt(limit),
                        status: status,
                        description: description,
                        files: files,
                        questions: questions
                    })
                });
                const result = await response.json();
                if (result.status === "success") {
                    alert("活動儲存成功！");
                    await fetchEvents();
                    exitAdminMode();
                }
            } catch (e) {
                alert("連線失敗");
            }
            hideLoading();
        }

        async function deleteEvent() {
            const id = document.getElementById("adminEventId").value;
            if (!id) return;
            if (!confirm("確定要刪除此活動嗎？這將無法復原！")) return;

            showLoading("正在刪除活動...");
            try {
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({ action: "deleteEvent", id: id })
                });
                const result = await response.json();
                if (result.status === "success") {
                    alert("活動已刪除！");
                    await fetchEvents();
                    exitAdminMode();
                }
            } catch (e) {
                alert("連線失敗");
            }
            hideLoading();
        }

        // 發送 Flex Message
        async function sendFlexMessage(queueStatus, queueIndex, count) {
            const flexPayload = {
                type: "flex",
                altText: `📢 ${userDisplayName} 已幫 ${count} 人報名活動：${currentEvent.title}`,
                contents: {
                    type: "bubble",
                    header: {
                        type: "box",
                        layout: "vertical",
                        backgroundColor: "#0d9488",
                        contents: [
                            { type: "text", text: `📢 活動多人報名成功！`, color: "#ffffff", weight: "bold", size: "lg" },
                            { type: "text", text: `活動：${currentEvent.title}`, color: "#fef3c7", size: "sm", margin: "xs", weight: "bold", wrap: true }
                        ]
                    },
                    body: {
                        type: "box",
                        layout: "vertical",
                        spacing: "sm",
                        contents: [
                            { type: "text", text: `💡 【${userDisplayName}】已成功登記 ${count} 位人員！`, weight: "bold", size: "sm", color: "#0f766e" },
                            { type: "text", text: `📌 狀態：${queueStatus}`, weight: "bold", size: "md", color: "#0d9488" },
                            { type: "separator", margin: "md" },
                            { type: "text", text: `🕒 時間：${currentEvent.time}`, size: "sm", color: "#4b5563", wrap: true },
                            { type: "text", text: `📍 地點：${currentEvent.location}`, size: "sm", color: "#4b5563", wrap: true }
                        ]
                    },
                    footer: {
                        type: "box",
                        layout: "vertical",
                        contents: [
                            {
                                type: "button",
                                action: {
                                    type: "uri",
                                    label: "看最新接龍名單",
                                    uri: `https://liff.line.me/${LIFF_ID}`
                                },
                                style: "primary",
                                color: "#0d9488"
                            }
                        ]
                    }
                }
            };

            if (isInChatContext) {
                try { await liff.sendMessages([flexPayload]); } catch (e) { await fallbackShare(flexPayload); }
            } else {
                await fallbackShare(flexPayload);
            }
        }

        async function fallbackShare(flexPayload) {
            if (liff.isApiAvailable('shareTargetPicker')) {
                try { await liff.shareTargetPicker([flexPayload]); } catch (e) {}
            }
        }

        function showLoading(text) {
            document.getElementById("loadingText").innerText = text;
            document.getElementById("loading").classList.remove("hidden");
        }

        function hideLoading() {
            document.getElementById("loading").classList.add("hidden");
        }

        initializeLiff();
    </script>
</body>
</html>
