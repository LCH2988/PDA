<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>與帕同行 - 活動報名與會員系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col text-gray-800 font-sans">

    <!-- 頂部導覽列 -->
    <header class="bg-teal-700 text-white px-4 py-3.5 shadow-md sticky top-0 z-40 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <span class="text-lg font-extrabold tracking-wider">🌸 與帕同行</span>
            <span class="text-[10px] bg-teal-600 px-1.5 py-0.5 rounded-full font-bold border border-teal-500">V2.1</span>
        </div>
        <div class="flex items-center space-x-2">
            <button id="adminBtn" onclick="enterAdminMode()" class="hidden bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition-all active:scale-95">
                ⚙️ 管理後台
            </button>
            <div id="userInfo" class="flex items-center space-x-1.5">
                <img id="userAvatar" class="w-7 h-7 rounded-full border border-teal-500 hidden" src="" alt="頭像">
                <span id="userName" class="text-xs font-bold">載入中...</span>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-1 p-4 max-w-md mx-auto w-full space-y-4 pb-20">
        
        <!-- 分類篩選滑動區 -->
        <div class="flex space-x-2 overflow-x-auto no-scrollbar py-1" id="categoryTabs">
            <button onclick="filterCategory('all')" class="cat-tab px-4 py-1.5 rounded-full text-xs font-extrabold bg-teal-700 text-white shadow-sm shrink-0">
                全部活動
            </button>
            <!-- 動態分類將插入於此 -->
        </div>

        <!-- 活動列表容器 -->
        <div id="eventListContainer" class="space-y-4">
            <!-- 活動卡片動態載入 -->
        </div>
    </main>

    <!-- 底部導覽列 (使用者端) -->
    <nav class="bg-white border-t border-gray-200 fixed bottom-0 left-0 right-0 py-2 px-6 flex justify-around items-center z-40 max-w-md mx-auto shadow-lg">
        <button onclick="switchTab('home')" class="flex flex-col items-center space-y-0.5 text-teal-700 font-bold">
            <span class="text-xl">🏠</span>
            <span class="text-[10px]">活動首頁</span>
        </button>
        <button onclick="openProfileModal()" class="flex flex-col items-center space-y-0.5 text-gray-400 hover:text-teal-700 font-bold">
            <span class="text-xl">👤</span>
            <span class="text-[10px]">會員資料</span>
        </button>
        <button onclick="openMyRegistrationsModal()" class="flex flex-col items-center space-y-0.5 text-gray-400 hover:text-teal-700 font-bold">
            <span class="text-xl">📋</span>
            <span class="text-[10px]">我的報名</span>
        </button>
    </nav>

    <!-- ========================================== -->
    <!-- ============= 彈窗與模組區 ============= -->
    <!-- ========================================== -->

    <!-- 1. 會員資料彈窗 -->
    <div id="profileModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-xs p-5 space-y-4 relative shadow-2xl animate-fade-in">
            <button onclick="closeModal('profileModal')" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 font-bold text-lg">✕</button>
            <h3 class="text-base font-extrabold text-teal-800 border-b pb-2">👤 完善保險與會員資料</h3>
            <form id="profileForm" onsubmit="saveProfile(event)" class="space-y-3 text-xs">
                <div>
                    <label class="block font-bold text-gray-600 mb-1">真實姓名</label>
                    <input type="text" id="profileName" class="w-full border border-gray-300 rounded-lg p-2 bg-gray-50" readonly>
                </div>
                <div>
                    <label class="block font-bold text-gray-600 mb-1">手機號碼</label>
                    <input type="text" id="profilePhone" class="w-full border border-gray-300 rounded-lg p-2 bg-gray-50" readonly>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-bold text-gray-600 mb-1">性別</label>
                        <select id="profileGender" class="w-full border border-gray-300 rounded-lg p-2" required>
                            <option value="">請選擇</option>
                            <option value="男">男</option>
                            <option value="女">女</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-bold text-gray-600 mb-1">生日</label>
                        <input type="date" id="profileBirthday" class="w-full border border-gray-300 rounded-lg p-2" required>
                    </div>
                </div>
                <div>
                    <label class="block font-bold text-gray-600 mb-1">身分證字號 (保險用)</label>
                    <input type="text" id="profileIdCard" placeholder="請輸入身分證字號" class="w-full border border-gray-300 rounded-lg p-2" required>
                </div>
                <div>
                    <label class="block font-bold text-gray-600 mb-1">聯絡地址</label>
                    <input type="text" id="profileAddress" placeholder="請輸入聯絡地址" class="w-full border border-gray-300 rounded-lg p-2" required>
                </div>
                <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-2.5 rounded-xl transition-all active:scale-95 shadow-md">
                    儲存會員資料 💾
                </button>
            </form>
        </div>
    </div>

    <!-- 2. 我要報名 (多人登記) 彈窗 -->
    <div id="registerModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-sm max-h-[85vh] flex flex-col relative shadow-2xl">
            <button onclick="closeModal('registerModal')" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 font-bold text-lg z-10">✕</button>
            
            <div class="p-4 border-b">
                <h3 class="text-base font-extrabold text-teal-800 flex items-center space-x-1">
                    <span>📝 活動報名登記</span>
                </h3>
                <p id="regEventTitle" class="text-xs text-gray-500 font-bold mt-0.5"></p>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar">
                <!-- 同行人名單區 -->
                <div class="space-y-3">
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-extrabold text-teal-900">👥 報名人員名單 (含本人)：</span>
                        <button type="button" onclick="addAttendeeForm()" class="bg-teal-50 hover:bg-teal-100 text-teal-700 border border-teal-200 px-2.5 py-1 rounded-lg text-[11px] font-bold transition-all active:scale-95">
                            ➕ 新增同行人
                        </button>
                    </div>
                    <div id="attendeesContainer" class="space-y-3">
                        <!-- 動態同行人表單將插入於此 -->
                    </div>
                </div>
            </div>

            <div class="p-4 border-t bg-gray-50 rounded-b-2xl">
                <button onclick="submitMultiRegistration()" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-2.5 rounded-xl text-xs transition-all active:scale-95 shadow-md">
                    確認提交報名 🚀
                </button>
            </div>
        </div>
    </div>

    <!-- 3. 卡片式分頁接龍彈窗 -->
    <div id="participantsModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-xs p-4 space-y-3 relative shadow-2xl">
            <button onclick="closeModal('participantsModal')" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 font-bold text-lg">✕</button>
            <h3 class="text-sm font-extrabold text-teal-800 border-b pb-2 flex items-center space-x-1">
                <span>📋 報名接龍清單</span>
            </h3>
            
            <!-- 卡片滑動區 -->
            <div id="participantsCardContainer" class="min-h-[160px] flex items-center justify-center">
                <!-- 動態卡片將插入於此 -->
            </div>

            <!-- 分頁控制鈕 -->
            <div class="flex justify-between items-center pt-2 border-t text-xs">
                <button id="prevCardBtn" onclick="changeCardPage(-1)" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1 rounded-lg font-bold disabled:opacity-50">◀ 上一頁</button>
                <span id="cardPageIndicator" class="font-extrabold text-gray-600">1 / 1</span>
                <button id="nextCardBtn" onclick="changeCardPage(1)" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1 rounded-lg font-bold disabled:opacity-50">下一頁 ▶</button>
            </div>
        </div>
    </div>

    <!-- 4. 我的報名紀錄彈窗 -->
    <div id="myRegistrationsModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-sm max-h-[80vh] flex flex-col relative shadow-2xl">
            <button onclick="closeModal('myRegistrationsModal')" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 font-bold text-lg z-10">✕</button>
            <div class="p-4 border-b">
                <h3 class="text-base font-extrabold text-teal-800">📋 我的報名紀錄</h3>
            </div>
            <div id="myRegListContainer" class="flex-1 overflow-y-auto p-4 space-y-3 no-scrollbar text-xs">
                <!-- 報名紀錄卡片 -->
            </div>
        </div>
    </div>

    <!-- 5. 我的同行人明細彈窗 -->
    <div id="regDetailsModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-xs p-4 space-y-3 relative shadow-2xl">
            <button onclick="closeModal('regDetailsModal')" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 font-bold text-lg">✕</button>
            <h3 class="text-sm font-extrabold text-teal-800 border-b pb-2">👥 同行人員明細</h3>
            <div id="regDetailsContainer" class="space-y-2 max-h-[60vh] overflow-y-auto no-scrollbar text-xs">
                <!-- 明細內容 -->
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- ============= 管理員專區 (全螢幕) ============= -->
    <!-- ========================================== -->
    <div id="adminPanel" class="fixed inset-0 bg-gray-100 z-50 hidden flex flex-col overflow-y-auto">
        <header class="bg-amber-700 text-white px-4 py-3 shadow-md sticky top-0 z-50 flex justify-between items-center">
            <span class="text-base font-extrabold tracking-wider">⚙️ 系統管理控制台</span>
            <button onclick="exitAdminMode()" class="bg-amber-800 hover:bg-amber-900 text-white text-xs font-bold px-3 py-1.5 rounded-lg">
                返回使用者端
            </button>
        </header>

        <div class="p-4 max-w-md mx-auto w-full space-y-6 pb-12">
            
            <!-- 模組 A：新增/編輯活動 -->
            <section class="bg-white p-4 rounded-2xl border border-amber-200 space-y-3 shadow-sm">
                <h3 class="text-sm font-extrabold text-amber-900 border-b pb-2">📅 活動編輯器</h3>
                <form id="eventForm" onsubmit="event.preventDefault(); saveEvent();" class="space-y-3 text-xs">
                    <input type="hidden" id="adminEventId">
                    <div>
                        <label class="block font-bold text-gray-600 mb-1">活動名稱</label>
                        <input type="text" id="adminTitle" class="w-full border rounded-lg p-2" required>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block font-bold text-gray-600 mb-1">活動分類</label>
                            <select id="adminCategory" class="w-full border rounded-lg p-2" required>
                                <!-- 動態分類 -->
                            </select>
                        </div>
                        <div>
                            <label class="block font-bold text-gray-600 mb-1">人數上限</label>
                            <input type="number" id="adminLimit" class="w-full border rounded-lg p-2" required>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block font-bold text-gray-600 mb-1">活動時間</label>
                            <input type="datetime-local" id="adminTime" class="w-full border rounded-lg p-2" required>
                        </div>
                        <div>
                            <label class="block font-bold text-gray-600 mb-1">活動狀態</label>
                            <select id="adminStatus" class="w-full border rounded-lg p-2" required>
                                <option value="啟動">啟動 (開放報名)</option>
                                <option value="停止">停止 (關閉報名)</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block font-bold text-gray-600 mb-1">活動地點</label>
                        <input type="text" id="adminLocation" class="w-full border rounded-lg p-2" required>
                    </div>
                    <div>
                        <label class="block font-bold text-gray-600 mb-1">詳細說明</label>
                        <textarea id="adminDescription" rows="3" class="w-full border rounded-lg p-2"></textarea>
                    </div>

                    <!-- 附加檔案配置 -->
                    <div class="space-y-1.5">
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-gray-600">📎 附加檔案下載 (選填)：</span>
                            <button type="button" onclick="addAdminFileField()" class="text-amber-700 font-bold text-xs">➕ 新增檔案</button>
                        </div>
                        <div id="adminFilesContainer" class="space-y-1.5"></div>
                    </div>

                    <!-- 自訂調查項目配置 -->
                    <div class="space-y-1.5">
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-gray-600">❓ 報名自訂調查問題：</span>
                            <button type="button" onclick="addAdminQuestionField()" class="text-amber-700 font-bold text-xs">➕ 新增問題</button>
                        </div>
                        <div id="adminQuestionsContainer" class="space-y-1.5"></div>
                    </div>

                    <!-- 自訂備註項目配置 -->
                    <div class="space-y-1.5">
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-amber-900">✏️ 管理端自訂備註欄位：</span>
                            <button type="button" onclick="addAdminNoteConfigField()" class="text-amber-700 font-bold text-xs">➕ 新增備註項目</button>
                        </div>
                        <div id="adminNotesConfigContainer" class="space-y-1.5"></div>
                    </div>

                    <div class="flex space-x-2 pt-2">
                        <button type="submit" class="flex-1 bg-amber-600 hover:bg-amber-700 text-white font-bold py-2.5 rounded-xl shadow-md">
                            儲存活動 💾
                        </button>
                        <button type="button" id="deleteEventBtn" onclick="deleteEvent()" class="hidden bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-4 py-2.5 rounded-xl font-bold">
                            🗑️ 刪除
                        </button>
                    </div>
                </form>
            </section>

            <!-- 模組 B：報名名單管理 (含備註填寫) -->
            <section class="bg-white p-4 rounded-2xl border border-amber-200 space-y-3 shadow-sm">
                <h3 class="text-sm font-extrabold text-amber-900 border-b pb-2">👥 報名名單與備註管理</h3>
                <div class="space-y-2">
                    <select id="regManageEventSelect" onchange="onRegManageEventSelect()" class="w-full border rounded-lg p-2 text-xs font-bold">
                        <option value="">-- 請選擇活動 --</option>
                    </select>
                    <div id="regManageListContainer" class="space-y-3 max-h-[400px] overflow-y-auto no-scrollbar">
                        <p class="text-gray-500 text-center text-xs py-8">請先選擇活動以載入報名名單</p>
                    </div>
                </div>
            </section>

            <!-- 模組 C：報名公告 (卡牌式接龍) -->
            <section class="bg-white p-4 rounded-2xl border border-amber-200 space-y-3 shadow-sm">
                <h3 class="text-sm font-extrabold text-amber-900 border-b pb-2">📢 群組卡牌式接龍發布</h3>
                <div class="space-y-3 text-xs">
                    <select id="announceEventSelect" onchange="onAnnouncementEventSelect()" class="w-full border rounded-lg p-2 font-bold">
                        <option value="">-- 請選擇活動 --</option>
                    </select>
                    
                    <div id="announcementPanel" class="hidden space-y-3">
                        <div>
                            <label class="block font-bold text-gray-600 mb-1">📢 額外公告訊息 (選填)</label>
                            <input type="text" id="announceCustomMsg" placeholder="例如：請大家準時出席喔！" class="w-full border rounded-lg p-2">
                        </div>

                        <!-- 選擇要統計的欄位 -->
                        <div class="space-y-1.5">
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-gray-600">📊 選擇要統計的接龍項目：</span>
                                <button type="button" onclick="addChainItemField()" class="text-amber-700 font-bold text-xs">➕ 增加統計項</button>
                            </div>
                            <div id="chainItemsContainer" class="space-y-1.5"></div>
                        </div>

                        <div class="flex space-x-2">
                            <button type="button" onclick="showTempQuestionDialog()" class="bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 px-3 py-2 rounded-xl font-bold">
                                ⚡ 臨時統計項目
                            </button>
                            <button type="button" onclick="shareCustomChainToGroup()" class="flex-1 bg-amber-600 hover:bg-amber-700 text-white font-bold py-2 rounded-xl shadow-md">
                                發送卡牌式接龍 🎴
                            </button>
                        </div>

                        <!-- 當前接龍預覽 -->
                        <div class="border-t pt-2">
                            <p class="font-bold text-gray-600 mb-1">👀 當前名單預覽 (含臨時統計)：</p>
                            <div id="announceParticipantsList" class="space-y-2 max-h-[250px] overflow-y-auto no-scrollbar bg-gray-50 p-2 rounded-lg border"></div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 模組 D：分類管理 -->
            <section class="bg-white p-4 rounded-2xl border border-amber-200 space-y-3 shadow-sm">
                <h3 class="text-sm font-extrabold text-amber-900 border-b pb-2">🏷️ 活動分類管理</h3>
                <div class="space-y-3 text-xs">
                    <div class="flex space-x-2">
                        <input type="text" id="newCategoryInput" placeholder="請輸入新分類名稱" class="flex-1 border rounded-lg p-2">
                        <button onclick="addNewCategory()" class="bg-amber-600 hover:bg-amber-700 text-white font-bold px-4 py-2 rounded-lg">
                            新增
                        </button>
                    </div>
                    <div id="adminCategoryListContainer" class="space-y-2">
                        <!-- 分類列表 -->
                    </div>
                </div>
            </section>
        </div>
    </div>

    <!-- 臨時統計項目彈窗 -->
    <div id="tempQuestionModal" class="fixed inset-0 bg-black/60 z-[60] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-xs p-4 space-y-3 relative shadow-2xl">
            <button onclick="closeTempQuestionDialog()" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 font-bold text-lg">✕</button>
            <h3 class="text-xs font-extrabold text-blue-900 border-b pb-2">⚡ 新增臨時統計項目</h3>
            <div class="space-y-2 text-xs">
                <div>
                    <label class="block font-bold text-gray-600 mb-1">項目名稱 (如：是否搭接駁車)</label>
                    <input type="text" id="tempQTitle" class="w-full border rounded-lg p-2" required>
                </div>
                <div>
                    <label class="block font-bold text-gray-600 mb-1">預設選項 (選填，用逗號隔開，如：是,否)</label>
                    <input type="text" id="tempQOptions" placeholder="留空則為文字輸入" class="w-full border rounded-lg p-2">
                </div>
                <button onclick="addTempQuestion()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-xl">
                    確認加入 ➕
                </button>
            </div>
        </div>
    </div>

    <!-- 全域 Loading 遮罩 -->
    <div id="loading" class="fixed inset-0 bg-black/50 z-[99] hidden flex flex-col items-center justify-center space-y-3">
        <div class="w-10 h-10 border-4 border-teal-200 border-t-teal-600 rounded-full animate-spin"></div>
        <p id="loadingText" class="text-white text-xs font-bold tracking-wider">正在載入資料...</p>
    </div>

    <!-- ========================================== -->
    <!-- ============= JavaScript 邏輯 ============= -->
    <!-- ========================================== -->
    <script>
        // ⚠️ 請替換為您的實際 LIFF ID 與 Google GAS Web App 網址
        const LIFF_ID = "2009456572-VIoH1oY0"; 
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxsrVQjIZKOMLmxmYR-aAXt58nYh6G1VVvw6DeKCJjHHC2dw6HY_bzzqdGG0iwiCz8W/exec";

        let userLineId = "";
        let userDisplayName = "";
        let userProfile = null;
        let allEvents = [];
        let allCategories = [];
        let currentEvent = null;
        let activeEventQuestions = [];
        let tempQuestions = []; // 臨時統計項目
        let currentParticipants = [];
        let currentFilterCategory = "all";
        let isAdmin = false;
        let isInChatContext = false;

        // 卡片式接龍分頁狀態
        let currentCardPage = 0;
        const CARD_PAGE_SIZE = 20;

        // ----------------- LIFF 初始化 -----------------
        async function initializeLiff() {
            showLoading("系統初始化中...");
            try {
                await liff.init({ liffId: LIFF_ID });
                isInChatContext = liff.isInClient() && (liff.getContext().type === "utou" || liff.getContext().type === "room" || liff.getContext().type === "group");
                
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }

                const profile = await liff.getProfile();
                userLineId = profile.userId;
                userDisplayName = profile.displayName;
                document.getElementById("userAvatar").src = profile.pictureUrl;
                document.getElementById("userAvatar").classList.remove("hidden");

                const urlParams = new URLSearchParams(window.location.search);

                const eventIdParam = urlParams.get("eventId");

                    openParticipantsModal(eventIdParam);

                console.error("LIFF 初始化失敗", e);

            hideLoading();
        }

        function addAttendeeForm(name = "", phone = "", isSelf = false) {
            const container = document.getElementById("attendeesContainer");
            const index = container.children.length;
            const div = document.createElement("div");
            div.className = "p-3 bg-gray-50 rounded-xl border border-gray-200 space-y-2 relative attendee-row";
            
            // 產生自訂調查項目的 HTML
            let questionsHtml = "";
            currentEvent.questions.forEach(q => {
                if (q.title === "姓名") return; // 姓名由主欄位處理
                
                const reqMark = q.required ? '<span class="text-red-500">*</span>' : '';
                const reqAttr = q.required ? 'required' : '';
                
                if (q.type === "select") {
                    const opts = q.options.split(',');
                    let optsHtml = opts.map(o => `<option value="${o.trim()}">${o.trim()}</option>`).join('');
                    questionsHtml += `
                        <div>
                            <label class="block text-[10px] font-bold text-gray-500 mb-0.5">${q.title} ${reqMark}</label>
                            <select data-qtitle="${q.title}" class="w-full border rounded-lg p-1.5 text-xs bg-white q-input" ${reqAttr}>
                                <option value="">請選擇</option>
                                ${optsHtml}
                            </select>
                        </div>
                    `;
                } else {
                    questionsHtml += `
                        <div>
                            <label class="block text-[10px] font-bold text-gray-500 mb-0.5">${q.title} ${reqMark}</label>
                            <input type="text" data-qtitle="${q.title}" class="w-full border rounded-lg p-1.5 text-xs bg-white q-input" placeholder="請輸入內容" ${reqAttr}>
                        </div>
                    `;
                }
            });

            div.innerHTML = `
                ${isSelf ? '' : `<button type="button" onclick="this.parentElement.remove()" class="text-red-500 font-bold text-xs float-right">❌ 移除</button>`}
                <p class="font-extrabold text-teal-800 text-xs mb-1">${isSelf ? '👤 本人 (主要聯絡人)' : `👥 同行人 #${index + 1}`}</p>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 mb-0.5">姓名 <span class="text-red-500">*</span></label>
                        <input type="text" class="w-full border rounded-lg p-1.5 text-xs bg-white att-name" value="${name}" required ${isSelf ? 'readonly' : ''}>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 mb-0.5">電話 ${isSelf ? '<span class="text-red-500">*</span>' : '(選填)'}</label>
                        <input type="tel" class="w-full border rounded-lg p-1.5 text-xs bg-white att-phone" value="${phone}" ${isSelf ? 'required readonly' : ''}>
                    </div>
                </div>
                ${questionsHtml}
            `;
            container.appendChild(div);
        }

        async function submitMultiRegistration() {
            const rows = document.querySelectorAll(".attendee-row");
            const attendees = [];
            let isValid = true;

            rows.forEach(row => {
                const nameInput = row.querySelector(".att-name");
                const phoneInput = row.querySelector(".att-phone");
                
                if (!nameInput.value.trim()) {
                    isValid = false;
                    nameInput.classList.add("border-red-500");
                } else {
                    nameInput.classList.remove("border-red-500");
                }

                const answers = { "姓名": nameInput.value.trim() };
                row.querySelectorAll(".q-input").forEach(qInput => {
                    const title = qInput.getAttribute("data-qtitle");
                    if (qInput.hasAttribute("required") && !qInput.value.trim()) {
                        isValid = false;
                        qInput.classList.add("border-red-500");
                    } else {
                        qInput.classList.remove("border-red-500");
                    }
                    answers[title] = qInput.value.trim();
                });

                attendees.push({
                    name: nameInput.value.trim(),
                    phone: phoneInput.value.trim(),
                    answers: answers
                });
            });

            if (!isValid) {
                alert("請填寫所有必填欄位！");
                return;
            }

            showLoading("正在提交報名登記...");
            try {
                const payload = {
                    action: "registerMulti",
                    eventId: currentEvent.id,
                    lineId: userLineId,
                    leaderName: userProfile.name,
                    leaderPhone: userProfile.phone,
                    groupId: (liff.getContext() && liff.getContext().groupId) || "",
                    attendees: attendees
                };

                const response = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                if (result.status === "success") {
                    closeModal("registerModal");
                    
                    // 發送全新 Flex Message 至群組
                    await sendFlexMessage(
                        currentEvent.time, 
                        currentEvent.title, 
                        result.remainingSpots, 
                        result.myRegisteredAttendees, 
                        attendees.length, 
                        false
                    );
                    
                    alert(`🎉 報名登記成功！\n您的錄取狀態為：【${result.queueStatus}】${result.queueStatus === '候補' ? ` (候補順位: ${result.queueIndex})` : ''}`);
                    await fetchEvents();
                } else {
                    alert("報名失敗：" + result.message);
                }
            } catch (e) {
                alert("連線失敗");
            }
            hideLoading();
        }

            document.getElementById("participantsModal").classList.remove("hidden");

        function renderParticipantsCards() {
            const container = document.getElementById("participantsCardContainer");
            container.innerHTML = "";

            if (currentParticipants.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8">
                        <p class="text-gray-400 text-xs font-bold">目前尚無人報名，快來搶頭香！🌸</p>
                    </div>`;
                document.getElementById("prevCardBtn").disabled = true;
                document.getElementById("nextCardBtn").disabled = true;
                document.getElementById("cardPageIndicator").innerText = "0 / 0";
                return;
            }

            const totalPages = Math.ceil(currentParticipants.length / CARD_PAGE_SIZE);
            const start = currentCardPage * CARD_PAGE_SIZE;
            const end = Math.min(start + CARD_PAGE_SIZE, currentParticipants.length);
            const pageList = currentParticipants.slice(start, end);

            const card = document.createElement("div");
            card.className = "w-full bg-teal-50/50 rounded-xl border border-teal-100 p-3 space-y-2 text-xs";
            
            let listHtml = `<div class="grid grid-cols-2 gap-x-4 gap-y-1.5">`;
            pageList.forEach((p, idx) => {
                const globalIdx = start + idx + 1;
                const isBackup = p.status === "候補";
                const badge = isBackup ? `<span class="text-amber-600 font-bold text-[10px] ml-1">(候)</span>` : '';
                listHtml += `
                    <div class="flex items-center justify-between border-b border-teal-50 pb-1">
                        <span class="font-extrabold text-gray-700">${globalIdx}. ${p.name}${badge}</span>
                    </div>`;
            });
            listHtml += `</div>`;

            card.innerHTML = `
                <div class="flex justify-between items-center border-b border-teal-200 pb-1.5 mb-1.5">
                    <span class="font-extrabold text-teal-900">🌸 報名接龍卡 (${start+1} ~ ${end} 號)</span>
                    <span class="text-[10px] bg-teal-600 text-white px-1.5 py-0.5 rounded font-bold">共 ${currentParticipants.length} 人</span>
                </div>
                ${listHtml}
            `;
            container.appendChild(card);

            // 更新分頁控制按鈕
            document.getElementById("prevCardBtn").disabled = currentCardPage === 0;
            document.getElementById("nextCardBtn").disabled = currentCardPage >= totalPages - 1;
            document.getElementById("cardPageIndicator").innerText = `${currentCardPage + 1} / ${totalPages}`;
        }

        function changeCardPage(dir) {
            const totalPages = Math.ceil(currentParticipants.length / CARD_PAGE_SIZE);
            currentCardPage += dir;
            if (currentCardPage < 0) currentCardPage = 0;
            if (currentCardPage >= totalPages) currentCardPage = totalPages - 1;
            renderParticipantsCards();
        }

                row.querySelectorAll(".q-input").forEach(qInput => {
                    const title = qInput.getAttribute("data-qtitle");
                    if (qInput.hasAttribute("required") && !qInput.value.trim()) {
                        isValid = false;
                        qInput.classList.add("border-red-500");
                    }
                    answers[title] = qInput.value.trim();
                });

                attendees.push({
                    name: nameInput.value.trim(),
                    phone: phoneInput.value.trim(),
                    answers: answers
                });
            });

            if (!isValid) {
                alert("請填寫所有必填欄位！");
                return;
            }

            showLoading("正在更新報名資料...");
            try {
                const payload = {
                    action: "registerMulti",
                    regId: regId, // 傳送原報名 ID 代表修改
                    eventId: currentEvent.id,
                    lineId: userLineId,
                    leaderName: userProfile.name,
                    leaderPhone: userProfile.phone,
                    groupId: (liff.getContext() && liff.getContext().groupId) || "",
                    attendees: attendees
                };

                const response = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                if (result.status === "success") {
                    closeModal("registerModal");
                    
                    // 發送修改成功的 Flex Message
                    await sendFlexMessage(
                        currentEvent.time, 
                        currentEvent.title, 
                        result.remainingSpots, 
                        result.myRegisteredAttendees, 
                        attendees.length, 
                        true
                    );

                    alert(`✏️ 報名資料修改成功！\n您的錄取狀態為：【${result.queueStatus}】`);
                    
                    // 還原提交按鈕的預設事件
                    const submitBtn = document.querySelector("#registerModal button[style*='primary']");
                    if (submitBtn) submitBtn.setAttribute("onclick", "submitMultiRegistration()");
                    
                    await fetchEvents();
                } else {
                    alert("修改失敗：" + result.message);
                }
            } catch (e) {
                alert("連線失敗");
            }
            hideLoading();
        }

        // 產生卡牌式公告內容並發送至群組
        async function shareCustomChainToGroup() {
            const selectedTitles = [];
            document.querySelectorAll(".chain-select").forEach(sel => {
                if (sel.value) selectedTitles.push(sel.value);
            });

            if (selectedTitles.length === 0) {
                alert("請至少選擇一個要統計的接龍項目！");
                return;
            }

            if (currentParticipants.length === 0) {
                alert("目前尚無人報名，無法發送接龍！");
                return;
            }

            showLoading("正在產生接龍並準備發送...");

            const customMsg = document.getElementById("announceCustomMsg").value.trim();
            
            let chainText = `┌────────────────────┐\n`;
            chainText += `│ 📅 活動日期：${currentEvent.time.split(' ')[0]} \n`;
            chainText += `│ 🌸 活動名稱：${currentEvent.title} \n`;
            if (customMsg) {
                chainText += `│ 📢 公告內容：${customMsg}\n`;
            }
            chainText += `├────────────────────┤\n`;

            const headerItems = ["名單"].concat(selectedTitles);
            chainText += `│  ${headerItems.join("  |  ")}\n`;
            chainText += `├────────────────────┤\n`;

            currentParticipants.forEach((p, idx) => {
                const ansList = [];
                selectedTitles.forEach(title => {
                    const ans = p.answers[title] || "無";
                    ansList.push(ans);
                });
                const statusMark = p.status === "候補" ? "(候)" : "";
                chainText += `│ ${idx + 1}. ${p.name}${statusMark} ➔ ${ansList.join(" | ")}\n`;
            });
            chainText += `└────────────────────┘\n`;

            const textPayload = {
                type: "text",
                text: chainText
            };

            if (isInChatContext) {
                try {
                    await liff.sendMessages([textPayload]);
                    alert("卡牌式接龍公告已成功發布至群組！");
                } catch (e) {
                    await fallbackShareTargetPicker(textPayload, chainText);
                }
            } else {
                await fallbackShareTargetPicker(textPayload, chainText);
            }
            hideLoading();
        }

        async function fallbackShareTargetPicker(textPayload, rawText) {
            if (liff.isApiAvailable('shareTargetPicker')) {
                try {
                    const res = await liff.shareTargetPicker([textPayload]);
                    if (res) {
                        alert("接龍已成功分享至指定的群組！");
                    }
                } catch (e) {
                    showCopyDialog(rawText);
                }
            } else {
                showCopyDialog(rawText);
            }
        }

        function showCopyDialog(text) {
            const tempTextArea = document.createElement("textarea");
            tempTextArea.value = text;
            document.body.appendChild(tempTextArea);
            tempTextArea.select();
            tempTextArea.setSelectionRange(0, 99999);
            
            try {
                const successful = document.execCommand("copy");
                if (successful) {
                    alert("【一鍵複製成功！】\n\n系統已自動複製接龍文字，您可以直接到 LINE 群組中「貼上」發送：\n\n" + text);
                } else {
                    window.prompt("請複製下方的接龍文字，並手動貼到 LINE 群組中：", text);
                }
            } catch (err) {
                window.prompt("請複製下方的接龍文字，並手動貼到 LINE 群組中：", text);
            }
            document.body.removeChild(tempTextArea);
        }

                return;
            }

            showLoading("正在新增分類...");
            try {
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({ action: "addCategory", categoryName: catName })
                });
                const result = await response.json();
                if (result.status === "success") {
                    alert("分類新增成功！");
                    document.getElementById("newCategoryInput").value = "";
                    await fetchCategories();
                    renderAdminCategoryList();
                } else {
                    alert("新增失敗：" + result.message);
                }
            } catch (e) {
                alert("連線失敗");
            }
            hideLoading();
        }

        async function deleteCategory(catName) {
            if (!confirm(`確定要刪除分類「${catName}」嗎？`)) return;

            showLoading("正在刪除分類...");
            try {
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({ action: "deleteCategory", categoryName: catName })
                });
                const result = await response.json();
                if (result.status === "success") {
                    alert("分類已刪除！");
                    await fetchCategories();
                    renderAdminCategoryList();
                } else {
                    alert("刪除失敗：" + result.message);
                }
            } catch (e) {
                alert("連線失敗");
            }
            hideLoading();
        }

        // ----------------- 模組共用活動儲存與刪除邏輯 -----------------
        async function saveEvent() {
            const id = document.getElementById("adminEventId").value;
            const title = document.getElementById("adminTitle").value.trim();
            const category = document.getElementById("adminCategory").value;
            const time = document.getElementById("adminTime").value;
            const location = document.getElementById("adminLocation").value.trim();
            const limit = document.getElementById("adminLimit").value;
            const status = document.getElementById("adminStatus").value;
            const description = document.getElementById("adminDescription").value.trim();

            const files = [];
            document.querySelectorAll(".admin-file-row").forEach(row => {
                const inputs = row.querySelectorAll("input");
                if (inputs[0].value && inputs[1].value) {
                    files.push({ name: inputs[0].value.trim(), url: inputs[1].value.trim() });
                }
            });

            const questions = [];
            document.querySelectorAll(".admin-q-row").forEach(row => {
                const titleInput = row.querySelector("input[type='text']");
                const select = row.querySelector("select");
                const optionInput = row.querySelector(".option-input");
                const reqCheckbox = row.querySelector(".req-checkbox");
                
                questions.push({
                    title: titleInput.value.trim(),
                    type: select ? select.value : "text",
                    options: (select && select.value === "select") ? optionInput.value.trim() : "",
                    required: titleInput.value.trim() === "姓名" ? true : (reqCheckbox ? reqCheckbox.checked : false)
                });
            });

            const adminNotesConfig = [];
            document.querySelectorAll(".admin-note-config-row").forEach(row => {
                const titleInput = row.querySelector("input[type='text']");
                const select = row.querySelector("select");
                const optionInput = row.querySelector(".option-input");
                
                adminNotesConfig.push({
                    title: titleInput.value.trim(),
                    type: select ? select.value : "text",
                    options: (select && select.value === "select") ? optionInput.value.trim() : ""
                });
            });

            showLoading("正在儲存活動...");
            try {
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({
                        action: "saveEvent",
                        id: id,
                        title: title,
                        category: category,
                        time: time,
                        location: location,
                        limit: parseInt(limit),
                        status: status,
                        description: description,
                        files: files,
                        questions: questions,
                        adminNotesConfig: adminNotesConfig 
                    })
                });
                const result = await response.json();
                if (result.status === "success") {
                    alert("活動儲存成功！");
                    await fetchEvents();
                    exitAdminMode();
                }
            } catch (e) {
                alert("連線失敗");
            }
            hideLoading();
        }

        async function deleteEvent() {
            const id = document.getElementById("adminEventId").value;
            if (!id) return;
            if (!confirm("確定要刪除此活動嗎？這將無法復原！")) return;

            showLoading("正在刪除活動...");
            try {
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({ action: "deleteEvent", id: id })
                });
                const result = await response.json();
                if (result.status === "success") {
                    alert("活動已刪除！");
                    await fetchEvents();
                    exitAdminMode();
                }
            } catch (e) {
                alert("連線失敗");
            }
            hideLoading();
        }

        // 全新設計：發送群組 Flex Message (雙按鈕：前往報名 + 報名清單)
        async function sendFlexMessage(eventTime, eventTitle, remainingSpots, myRegisteredAttendees, count, isUpdate) {
            const titleText = isUpdate ? "✏️ 報名資料已修改！" : "📢 活動多人報名成功！";
            
            // 動態組裝本次報名人員名單
            const attendeesTextList = myRegisteredAttendees.map(att => `${att.name}(${att.status})`);
            const attendeesSummary = attendeesTextList.join("、");

            const flexPayload = {
                type: "flex",
                altText: `📢 ${userDisplayName} 已登記活動：${eventTitle}`,
                contents: {
                    type: "bubble",
                    header: {
                        type: "box",
                        layout: "vertical",
                        backgroundColor: "#0d9488",
                        contents: [
                            { type: "text", text: titleText, color: "#ffffff", weight: "bold", size: "lg" },
                            { type: "text", text: `📅 活動日期：${eventTime.split(' ')[0]}`, color: "#fef3c7", size: "sm", margin: "xs", weight: "bold" }
                        ]
                    },
                    body: {
                        type: "box",
                        layout: "vertical",
                        spacing: "md",
                        contents: [
                            { type: "text", text: `🌸 活動名稱：${eventTitle}`, weight: "bold", size: "md", color: "#0f766e", wrap: true },
                            { type: "text", text: `🔥 剩餘名額：${remainingSpots} 人`, weight: "bold", size: "sm", color: "#ef4444" },
                            { type: "separator", margin: "sm" },
                            {
                                type: "box",
                                layout: "vertical",
                                spacing: "xs",
                                contents: [
                                    { type: "text", text: `👤 本次登記名單 (${count} 人)：`, size: "xs", color: "#6b7280", weight: "bold" },
                                    { type: "text", text: attendeesSummary, size: "sm", color: "#111827", weight: "bold", wrap: true }
                                ]
                            },
                            { type: "separator", margin: "sm" }
                        ]
                    },
                    footer: {
                        type: "box",
                        layout: "horizontal", 
                        spacing: "sm",
                        contents: [
                            {
                                type: "button",
                                action: {
                                    type: "uri",
                                    label: "前往報名 📝",
                                    uri: `https://liff.line.me/${LIFF_ID}` 
                                },
                                style: "secondary",
                                height: "sm"
                            },
                            {
                                type: "button",
                                action: {
                                    type: "uri",
                                    label: "報名清單 📋",
                                    uri: `https://liff.line.me/${LIFF_ID}?action=viewlist&eventId=${currentEvent ? currentEvent.id : ''}` 
                                },
                                style: "primary",
                                color: "#0d9488",
                                height: "sm"
                            }
                        ]
                    }
                }
            };

            if (isInChatContext) {
                try { await liff.sendMessages([flexPayload]); } catch (e) { await fallbackShare(flexPayload); }
            } else {
                await fallbackShare(flexPayload);
            }
        }

        async function fallbackShare(flexPayload) {
            if (liff.isApiAvailable('shareTargetPicker')) {
                try { await liff.shareTargetPicker([flexPayload]); } catch (e) {}
            }
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add("hidden");
            
            // 如果關閉的是報名彈窗，還原可能被修改的提交按鈕事件
            if (modalId === "registerModal") {
                const submitBtn = document.querySelector("#registerModal button[onclick^='submitEditRegistration']");
                if (submitBtn) {
                    submitBtn.setAttribute("onclick", "submitMultiRegistration()");
                }
            }
        }

        function showLoading(text) {
            document.getElementById("loadingText").innerText = text;
            document.getElementById("loading").classList.remove("hidden");
        }

        function hideLoading() {
            document.getElementById("loading").classList.add("hidden");
        }

        initializeLiff();
    </script>
