<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>三鐵飛翔 - 活動與購物登記系統</title>
  <link rel="preconnect" href="https://static.line-scdn.net" crossorigin>
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js" async></script>
  <style>
    :root {
      --brand:        #c2410c;
      --brand-dark:   #9a3412;
      --brand-light:  #fff7ed;
      --bg:           #f1f5f9;
      --surface:      #ffffff;
      --surface-2:    #f8fafc;
      --text:         #0f172a;
      --text-muted:   #334155;
      --text-light:   #64748b;
      --success:      #15803d;
      --danger:       #b91c1c;
      --warning:      #b45309;
      --touch:        64px;
      --font-base:    18px;
      --font-sm:      16px;
      --font-lg:      20px;
      --font-xl:      22px;
      --font-2xl:     26px;
      --radius:       20px;
      --radius-sm:    14px;
      --gap:          16px;
      
      --cat-0-bg:#fff7ed; --cat-0-border:#fdba74; --cat-0-text:#9a3412;
      --cat-1-bg:#eff6ff; --cat-1-border:#93c5fd; --cat-1-text:#1e40af;
      --cat-2-bg:#f0fdf4; --cat-2-border:#86efac; --cat-2-text:#166534;
      --cat-3-bg:#fdf4ff; --cat-3-border:#d8b4fe; --cat-3-text:#6b21a8;
      --cat-4-bg:#fff1f2; --cat-4-border:#fda4af; --cat-4-text:#9f1239;
    }

    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    html { font-size: var(--font-base); -webkit-text-size-adjust:100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 80px;
      line-height: 1.5;
    }

    /* 按鈕與輸入框 */
    button {
      min-height: var(--touch);
      font-weight: 900;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: var(--font-base);
      transition: opacity .15s, transform .1s;
      border: none;
    }
    button:active { transform: scale(.97); opacity: .9; }
    button:disabled { opacity: .45; cursor: not-allowed; transform: none; }

    input, select, textarea {
      min-height: var(--touch);
      font-size: var(--font-base) !important;
      font-family: inherit;
      color: var(--text);
      border: 2.5px solid #cbd5e1;
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      width: 100%;
      background: var(--surface);
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--brand); }
    label {
      display: block;
      font-size: var(--font-sm);
      font-weight: 900;
      color: var(--text);
      margin-bottom: 6px;
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: var(--gap);
      box-shadow: 0 4px 16px rgba(15,23,42,.07);
      border: 2px solid rgba(148,163,184,.2);
    }

    .btn-primary { background: var(--brand); color: #fff; border: 2px solid var(--brand-dark); width: 100%; }
    .btn-secondary { background: var(--surface-2); color: var(--text); border: 2px solid #cbd5e1; width: 100%; }
    .btn-danger { background: #fef2f2; color: var(--danger); border: 2px solid #fca5a5; }
    .btn-sm { min-height: 44px; font-size: var(--font-sm); padding: 8px 14px; }
    
    .btn-icon-close {
      width: 48px; height: 48px; border-radius: 50%;
      background: rgba(255,255,255,.2); color: #fff; font-size: 20px;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid rgba(255,255,255,.4); flex-shrink: 0;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, var(--brand) 0%, #d97706 100%);
      color: #fff; position: sticky; top: 0; z-index: 40;
      box-shadow: 0 4px 16px rgba(0,0,0,.18);
    }
    .header-inner {
      max-width: 480px; margin: 0 auto; padding: 14px 16px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .header-logo {
      width: 52px; height: 52px; border-radius: 50%; background: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; flex-shrink: 0; box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }
    .header-title { font-size: 1.5rem; font-weight: 900; line-height: 1.1; }
    .header-sub { font-size: 13px; background: rgba(0,0,0,.25); border-radius: 20px; padding: 2px 10px; margin-top: 4px; display: inline-block; }
    #adminBtn { min-height: 44px; background: rgba(0,0,0,.35); color: #fff; border: 2px solid rgba(255,255,255,.5); padding: 8px 14px; font-size: 15px; border-radius: 12px; }
    #userAvatar { width: 52px; height: 52px; border-radius: 50%; border: 3px solid #fff; cursor: pointer; display: none; }

    .main { max-width: 480px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }

    /* 分類標籤 */
    .cat-tabs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .cat-tabs::-webkit-scrollbar { display: none; }
    .cat-tab {
      flex-shrink: 0; min-height: 52px; padding: 10px 20px; border-radius: 14px;
      font-size: var(--font-sm); font-weight: 900; border: 2.5px solid; white-space: nowrap;
    }
    .cat-tab.active-all { background: var(--brand); color: #fff; border-color: var(--brand-dark); }
    .cat-tab.inactive-all { background: var(--surface); color: var(--text); border-color: #cbd5e1; }

    /* 分類配色 */
    .cat-tab.active-cat-0  { background:var(--cat-0-text);  color:#fff; border-color:var(--cat-0-text); }
    .cat-tab.inactive-cat-0{ background:var(--cat-0-bg);    color:var(--cat-0-text); border-color:var(--cat-0-border); }
    .cat-badge { display: inline-block; font-size: 15px; font-weight: 900; padding: 6px 14px; border-radius: 10px; border: 2px solid; }
    .cat-badge-0 { background:var(--cat-0-bg); color:var(--cat-0-text); border-color:var(--cat-0-border); }

    /* 活動卡片 */
    .event-card { display: flex; flex-direction: column; gap: 14px; }
    .event-card-header { display: flex; justify-content: space-between; align-items: center; }
    .event-title { font-size: var(--font-xl); font-weight: 900; line-height: 1.3; color: var(--text); }
    .event-desc { font-size: var(--font-sm); color: var(--text-muted); line-height: 1.6; }
    
    /* 圖片展示區 */
    .event-images-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 4px; }
    .event-img { width: 100%; height: 80px; object-fit: cover; border-radius: 10px; border: 1px solid #cbd5e1; }

    .event-info {
      background: var(--surface-2); border-radius: 14px; padding: 14px;
      border: 2px solid rgba(148,163,184,.2); display: flex; flex-direction: column; gap: 10px;
    }
    .event-info-row { display: flex; align-items: center; gap: 10px; font-size: var(--font-sm); color: var(--text-muted); }
    .event-info-icon { font-size: 20px; flex-shrink: 0; }
    .event-info-label { font-weight: 900; color: var(--text); }
    .event-actions { display: grid; grid-template-columns: 1fr 1.2fr; gap: 12px; }

    .status-badge-open { background: #dcfce7; color: #15803d; border: 2px solid #86efac; padding: 6px 14px; border-radius: 10px; font-size: 15px; font-weight: 900; }
    .status-badge-stop { background: #f1f5f9; color: #475569; border: 2px solid #cbd5e1; padding: 6px 14px; border-radius: 10px; font-size: 15px; font-weight: 900; }
    
    /* HTML 簡章按鈕 */
    .html-brochure-btn {
      background: #fff7ed; color: #9a3412; border: 2.5px solid #fdba74;
      border-radius: var(--radius-sm); padding: 12px; text-align: center;
      text-decoration: none; font-weight: 900; display: flex; align-items: center; justify-content: center; gap: 8px;
    }

    /* 彈窗 */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(15,23,42,.75);
      backdrop-filter: blur(4px); z-index: 50; display: none;
      align-items: flex-end; justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal-sheet {
      background: var(--surface); border-radius: 24px 24px 0 0;
      width: 100%; max-width: 480px; max-height: 92vh; overflow: hidden;
      display: flex; flex-direction: column; box-shadow: 0 -8px 40px rgba(0,0,0,.2);
    }
    .modal-sheet-center { border-radius: 24px; margin: 16px; max-height: calc(100vh - 32px); }
    .modal-header {
      background: linear-gradient(135deg, var(--brand), #d97706); color: #fff;
      padding: 18px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .modal-title { font-size: var(--font-lg); font-weight: 900; }
    .modal-body { overflow-y: auto; padding: 16px; flex: 1; display: flex; flex-direction: column; gap: 14px; }
    .modal-footer { padding: 14px 16px; background: var(--surface-2); border-top: 2px solid rgba(148,163,184,.2); display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* 後台圖片預覽區 */
    .admin-image-preview-container { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
    .admin-preview-wrapper { position: relative; width: 80px; height: 80px; }
    .admin-preview-img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; border: 2px solid #cbd5e1; }
    .admin-preview-remove {
      position: absolute; top: -6px; right: -6px; width: 22px; height: 22px;
      background: var(--danger); color: #fff; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; cursor: pointer;
    }

    /* 檔案上傳控制外觀 */
    .file-upload-wrapper {
      border: 2.5px solid #cbd5e1; border-radius: var(--radius-sm); padding: 14px;
      background: var(--surface-2); display: flex; align-items: center; justify-content: space-between; cursor: pointer;
    }
    .file-upload-wrapper input[type="file"] { display: none; }

    /* 綠色勾選提示 */
    .success-status-box {
      display: flex; align-items: center; gap: 6px; color: var(--success);
      font-size: var(--font-sm); font-weight: bold; margin-top: 6px;
    }

    /* 載入遮罩 */
    #loading { position: fixed; inset: 0; background: rgba(15,23,42,.6); backdrop-filter: blur(3px); z-index: 100; display: none; align-items: center; justify-content: center; }
    #loading.show { display: flex; }
    .loading-box { background: var(--surface); border-radius: 20px; padding: 28px 32px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .spinner { width: 44px; height: 44px; border: 4px solid #e2e8f0; border-top-color: var(--brand); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #toast {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: #1e293b; color: #fff; padding: 14px 24px; border-radius: 16px;
      font-size: var(--font-sm); font-weight: 900; z-index: 200; opacity: 0;
      transition: opacity .3s, transform .3s; pointer-events: none; text-align: center;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (min-width: 480px) {
      .modal-overlay { align-items: center; padding: 16px; }
      .modal-sheet { border-radius: 24px; max-height: 90vh; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <div style="display:flex;align-items:center;gap:12px">
        <div class="header-logo">🚴‍♂️</div>
        <div>
          <div class="header-title">三鐵飛翔</div>
          <span class="header-sub">活動與購物登記</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="adminBtn" onclick="enterAdminMode()" style="display:none">⚙️ 後台</button>
        <img id="userAvatar" onclick="openProfileModal()" alt="頭像">
      </div>
    </div>
  </header>

  <!-- 主內容 -->
  <main class="main">
    <!-- 歡迎卡 -->
    <section class="card" style="display:flex; flex-direction:column; gap:14px;">
      <div>
        <div style="font-size:var(--font-sm);font-weight:800;color:var(--text-light);margin-bottom:6px">歡迎使用 👋</div>
        <div style="font-size: var(--font-2xl); font-weight: 900;"><span id="userName">載入中...</span></div>
      </div>
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
        <button class="btn-secondary" onclick="openProfileModal()">👤 會員資料</button>
        <button class="btn-primary" onclick="openMyRegistrationsModal()">📋 我的登記</button>
      </div>
    </section>

    <!-- 分類標籤 -->
    <div id="categoryTabs" class="cat-tabs"></div>

    <!-- 活動列表 -->
    <div id="eventListContainer" style="display:flex;flex-direction:column;gap:16px"></div>
  </main>

  <!-- 新增/編輯活動彈窗 (管理後台專用) -->
  <div id="adminEventModal" class="modal-overlay">
    <div class="modal-sheet modal-sheet-center">
      <div class="modal-header">
        <span class="modal-title">📝 新增 / 編輯活動</span>
        <button class="btn-icon-close" onclick="closeModal('adminEventModal')">✕</button>
      </div>
      <form id="eventForm" onsubmit="event.preventDefault(); saveEvent();" style="display:flex; flex-direction:column; flex:1; overflow:hidden;">
        <div class="modal-body">
          <input type="hidden" id="adminEventId">
          
          <div>
            <label>活動名稱 *</label>
            <input type="text" id="adminTitle" required placeholder="請輸入活動名稱">
          </div>

          <div>
            <label>分類</label>
            <select id="adminCategory" required></select>
          </div>

          <div style="display:grid; grid-template-columns: 1.2fr 1fr; gap:12px;">
            <div>
              <label>活動日期</label>
              <input type="date" id="adminTime" required>
            </div>
            <div>
              <label>費用 (元)</label>
              <input type="number" id="adminPrice" required placeholder="650">
            </div>
          </div>

          <div>
            <label>簡短描述</label>
            <textarea id="adminDescription" style="min-height:80px;" placeholder="請輸入活動簡短描述..."></textarea>
          </div>

          <!-- HTML 簡章上傳 (Drive 託管) -->
          <div class="card" style="background:var(--surface-2); padding:12px;">
            <label>📄 HTML 活動簡章檔案 (Drive 託管)</label>
            <label class="file-upload-wrapper">
              <span id="htmlFileName">選擇檔案</span>
              <span style="background:#cbd5e1; padding:4px 10px; border-radius:6px; font-size:14px;">選擇檔案</span>
              <input type="file" id="adminHtmlFile" accept=".html" onchange="handleHtmlUpload(this)">
            </label>
            <div id="htmlSuccessBox" class="success-status-box" style="display:none;">
              <span>✅ HTML 簡章已有內容 (<span id="htmlExistName"></span>)</span>
            </div>
          </div>

          <!-- 活動照片上傳 (最多 5 張) -->
          <div class="card" style="background:var(--surface-2); padding:12px;">
            <label>📷 活動照片 (最多 5 張)</label>
            <label class="file-upload-wrapper">
              <span>選擇檔案</span>
              <span style="background:#cbd5e1; padding:4px 10px; border-radius:6px; font-size:14px;">選擇檔案</span>
              <input type="file" id="adminPhotoFile" accept="image/*" multiple onchange="handlePhotoUpload(this)">
            </label>
            <div id="adminImagePreviews" class="admin-image-preview-container"></div>
          </div>

        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary" onclick="closeModal('adminEventModal')">取消</button>
          <button type="submit" class="btn-primary">儲存活動資訊 💾</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 載入遮罩 -->
  <div id="loading">
    <div class="loading-box">
      <div class="spinner"></div>
      <div id="loadingText">系統處理中...</div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast"></div>

  <script>
    const LIFF_ID  = "2007905012-dQfXClGM";
    const GAS_URL  = "https://script.google.com/macros/s/AKfycbwcCeQ_zVQmvh7ku7HyucfRqNyN9Vd1vGq6jRL0JTL48h4VhSMd6g9gr9Kj87UhnCFt/exec";

    let allEvents = [], allCategories = [];
    let currentFilterCategory = "all";
    let uploadedPhotos = []; // 儲存 Base64 格式的圖片陣列
    let uploadedHtmlBase64 = ""; 
    let uploadedHtmlName = "";

    // 初始化 LIFF
    async function initializeLiff() {
      showLoading("系統載入中...");
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) { liff.login(); return; }
        
        // 模擬獲取分類與活動
        await fetchCategories();
        await fetchEvents();
      } catch(e) {
        showToast("初始化失敗");
      }
      hideLoading();
    }

    async function fetchCategories() {
      allCategories = ["單車健行", "裝備團購", "訓練營"];
      renderCategoryTabs();
      const catSel = document.getElementById("adminCategory");
      catSel.innerHTML = allCategories.map(c => `<option value="${c}">${c}</option>`).join("");
    }

    async function fetchEvents() {
      // 模擬從 GAS 讀取的活動數據
      allEvents = [{
        id: "E1",
        title: "9/13 獅山區步道群健行活動",
        category: "單車健行",
        time: "2026-09-13",
        price: 650,
        status: "開放中",
        description: "橫跨小百岳登頂、客家古道、溪谷壺穴與豐富自然生態，適合全家大小及健腳山友！",
        htmlFile: "9_13.html",
        photos: [
          "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=300&q=80",
          "https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=300&q=80",
          "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=300&q=80"
        ]
      }];
      renderEventList();
    }

    function renderCategoryTabs() {
      const container = document.getElementById("categoryTabs");
      let html = `<button class="cat-tab ${currentFilterCategory==='all'?'active-all':'inactive-all'}" onclick="filterCategory('all')">全部活動</button>`;
      allCategories.forEach((cat, i) => {
        const isActive = currentFilterCategory === cat;
        html += `<button class="cat-tab ${isActive?'active-cat-0':'inactive-cat-0'}" onclick="filterCategory('${cat}')">${cat}</button>`;
      });
      container.innerHTML = html;
    }

    function filterCategory(cat) {
      currentFilterCategory = cat;
      renderCategoryTabs();
      renderEventList();
    }

    function renderEventList() {
      const container = document.getElementById("eventListContainer");
      const filtered = allEvents.filter(e => currentFilterCategory === "all" || e.category === currentFilterCategory);
      
      container.innerHTML = filtered.map(ev => `
        <div class="card event-card">
          <div class="event-card-header">
            <span class="cat-badge cat-badge-0">${ev.category}</span>
            <span class="status-badge-open">${ev.status}</span>
          </div>
          <div class="event-title">${ev.title}</div>
          <div class="event-desc">${ev.description}</div>
          
          <!-- 圖片展示區 -->
          ${ev.photos && ev.photos.length > 0 ? `
            <div class="event-images-grid">
              ${ev.photos.map(img => `<img src="${img}" class="event-img" alt="活動照片">`).join('')}
            </div>
          ` : ''}

          <!-- 資訊區 -->
          <div class="event-info">
            <div class="event-info-row">
              <span class="event-info-icon">📅</span>
              <span><span class="event-info-label">日期：</span>${ev.time}</span>
            </div>
            <div class="event-info-row">
              <span class="event-info-icon">💰</span>
              <span><span class="event-info-label">費用：</span>NT$ ${ev.price}</span>
            </div>
          </div>

          <!-- HTML 簡章按鈕 -->
          ${ev.htmlFile ? `
            <a href="#" class="html-brochure-btn">📄 查看詳細 HTML 簡章</a>
          ` : ''}

          <!-- 操作按鈕 -->
          <div class="event-actions">
            <button class="btn-secondary" onclick="openEditModal('${ev.id}')">🔍 活動細節</button>
            <button class="btn-primary">✍️ 立即登記</button>
          </div>
        </div>
      `).join('');
    }

    // 處理 HTML 簡章上傳
    function handleHtmlUpload(input) {
      const file = input.files[0];
      if (!file) return;
      document.getElementById("htmlFileName").textContent = file.name;
      
      const reader = new FileReader();
      reader.onload = function(e) {
        uploadedHtmlBase64 = e.target.result.split(",")[1];
        uploadedHtmlName = file.name;
        document.getElementById("htmlExistName").textContent = file.name;
        document.getElementById("htmlSuccessBox").style.display = "flex";
      };
      reader.readAsDataURL(file);
    }

    // 處理活動照片上傳 (最多 5 張)
    function handlePhotoUpload(input) {
      const files = Array.from(input.files);
      if (uploadedPhotos.length + files.length > 5) {
        showToast("最多只能上傳 5 張照片！");
        return;
      }

      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = function(e) {
          const base64 = e.target.result;
          uploadedPhotos.push(base64);
          renderPhotoPreviews();
        };
        reader.readAsDataURL(file);
      });
    }

    function renderPhotoPreviews() {
      const container = document.getElementById("adminImagePreviews");
      container.innerHTML = uploadedPhotos.map((img, idx) => `
        <div class="admin-preview-wrapper">
          <img src="${img}" class="admin-preview-img">
          <div class="admin-preview-remove" onclick="removeUploadedPhoto(${idx})">✕</div>
        </div>
      `).join('');
    }

    function removeUploadedPhoto(idx) {
      uploadedPhotos.splice(idx, 1);
      renderPhotoPreviews();
    }

    function openEditModal(eventId) {
      const ev = allEvents.find(e => e.id === eventId);
      if (!ev) return;

      document.getElementById("adminEventId").value = ev.id;
      document.getElementById("adminTitle").value = ev.title;
      document.getElementById("adminCategory").value = ev.category;
      document.getElementById("adminTime").value = ev.time;
      document.getElementById("adminPrice").value = ev.price;
      document.getElementById("adminDescription").value = ev.description;
      
      // 帶入已有的 HTML 簡章與照片
      if (ev.htmlFile) {
        document.getElementById("htmlExistName").textContent = ev.htmlFile;
        document.getElementById("htmlSuccessBox").style.display = "flex";
      } else {
        document.getElementById("htmlSuccessBox").style.display = "none";
      }

      uploadedPhotos = [...(ev.photos || [])];
      renderPhotoPreviews();

      document.getElementById("adminEventModal").classList.add("show");
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove("show");
    }

    function showLoading(text) {
      document.getElementById("loadingText").textContent = text;
      document.getElementById("loading").classList.add("show");
    }
    function hideLoading() {
      document.getElementById("loading").classList.remove("show");
    }

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg; el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 3000);
    }

    window.addEventListener("load", initializeLiff);
  </script>
</body>
</html>
