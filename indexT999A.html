/* ================= 工具 ================= */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LV={viewer:1,editor:2,admin:3},ROLE={admin:'管理員',editor:'編輯者',viewer:'檢視者'};
let S=null;try{S=JSON.parse(sessionStorage.getItem('pds')||'null')}catch(e){}
const lv=()=>S&&S.user?LV[S.user.role]||0:0;
let cur='home',editing=false,SAVED={},EV=[];
const NOCFG=GAS_URL.includes('你的部署ID');
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(t._t);t._t=setTimeout(()=>t.hidden=true,3000)}
async function api(action,data={}){
  if(NOCFG)throw new Error('尚未設定 GAS_URL');
  let r,j;
  try{r=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:S&&S.token,...data})});j=await r.json()}
  catch(e){throw new Error('網路連線失敗或伺服器無回應,請稍後再試')}
  if(!j.ok){if(j.error==='UNAUTH'){logout(true);throw new Error('登入已過期,請重新登入')}throw new Error(j.error||'發生錯誤')}
  return j;
}
const getJ=q=>fetch(GAS_URL+'?'+q).then(r=>r.json());
function twice(btn,label,fn){
  if(btn.dataset.arm){clearTimeout(btn._t);btn.textContent=btn.dataset.orig;delete btn.dataset.arm;fn();return}
  btn.dataset.orig=btn.textContent;btn.dataset.arm='1';btn.textContent=label;
  btn._t=setTimeout(()=>{btn.textContent=btn.dataset.orig;delete btn.dataset.arm},3000);
}
const clean_html=h=>window.DOMPurify?DOMPurify.sanitize(h):null;   // 無法清理就不顯示雲端版本,改用預設頁面

/* ================= 頁面範本 ================= */

P.home=()=>`

</div><div class="vis"><div><span class="ico" style="font-size:4rem">🌷</span><p>(此處放真實病友與家屬的活動照片)</p></div></div></div></div>
<section><div class="wrap"><h2>請問您是?</h2><p class="sub">選擇您的身分,我們為您整理最需要的資訊。</p>

<section><div class="wrap"><h1>衛教資訊與常見問題</h1>

</div>
<h2 style="margin-top:1.5rem">常見問題(點選展開)</h2>
<div data-list>
  <div class="qa"><div class="q" tabindex="0" role="button">帕金森病會遺傳嗎?</div><div class="a">多數病例與單一基因無直接關係,少數家族性病例有基因因素。是否需要基因檢測,請與神經內科醫師討論。</div></div>
  <div class="qa"><div class="q" tabindex="0" role="button">帕金森病能治好嗎?</div><div class="a">目前尚無法根治,但藥物、復健與必要時的手術可有效控制症狀,多數人可維持良好的生活品質。</div></div>
  <div class="qa"><div class="q" tabindex="0" role="button">症狀好一點了,可以自己減藥或停藥嗎?</div><div class="a">不可以。突然減藥或停藥可能使症狀惡化,甚至發生嚴重併發症。請務必由醫師調整。</div></div>
  <div class="qa"><div class="q" tabindex="0" role="button">藥物要在飯前還是飯後吃?</div><div class="a">部分藥物(如左多巴)的吸收可能受高蛋白飲食影響,服藥時間依個人處方而異,請依醫師或藥師指示。</div></div>
  <div class="qa"><div class="q" tabindex="0" role="button">一定要做運動嗎?</div><div class="a">強烈建議。規律運動有助於維持肢體功能、平衡與情緒。請依自身狀況,並在安全環境下進行。</div></div>
  <div class="qa"><div class="q" tabindex="0" role="button">什麼情況需要考慮 DBS 手術?</div><div class="a">通常針對藥物反應良好、但出現藥效波動或異動症的特定病友。需由專業團隊評估,並非每個人都適合。</div></div>
  <div class="qa"><div class="q" tabindex="0" role="button">吞嚥有困難怎麼辦?</div><div class="a">請告知醫師,必要時由語言治療師評估。可先採取坐直進食、小口慢嚥、調整食物質地等方式。</div></div>
  <div class="qa"><div class="q" tabindex="0" role="button">怎麼申請重大傷病卡與身心障礙證明?</div><div class="a">請使用「福利查詢精靈」了解流程,並向醫院社工室或戶籍地區公所洽詢最新規定。</div></div>
  <div class="qa"><div class="q" tabindex="0" role="button">照顧者感到很累,可以找誰幫忙?</div><div class="a">可撥打長照專線 1966 詢問喘息服務,也可參加本會的照顧者支持座談,或使用線上諮詢。</div></div>
</div></div></section>`;

P.privacy=()=>`
<section><div class="wrap"><h1>隱私權政策</h1>
<div class="note">【草稿】正式公告前,請交由律師或熟悉《個人資料保護法》的專業人員審閱,並填妥底線處。最後更新日期:____年__月__日</div>
<h2 style="margin-top:1.2rem">一、適用範圍</h2><p>台灣帕金森病友權益促進會(以下稱「本會」)重視您的隱私。本政策適用於本網站的瀏覽、諮詢、活動報名、捐款與電子報等服務。</p>
<h2>二、蒐集的資料與目的</h2>

  <tr><td>線上諮詢</td><td>姓名、電話、Email、諮詢內容</td><td>回覆與提供諮詢服務</td></tr>

  <tr><td>電子報(選填)</td><td>Email</td><td>寄送會訊與活動資訊</td></tr></tbody></table></div>
<h2 style="margin-top:1.2rem">三、特殊需求與健康相關資料</h2><p>若您主動提供病情、身心狀況或所需協助(例如輪椅、陪同),本會僅用於您所參加的服務或活動,並限制存取。您可以選擇不提供,但可能使本會無法安排合適的協助。</p>
<h2>四、利用期間、地區、對象及方式</h2>
<ul data-list><li><b>期間:</b>諮詢紀錄保存 __ 年;活動報名資料於活動結束後 __ 個月;捐款與收據資料依稅務與會計法令保存;期滿後刪除或匿名化。</li>

<li><b>對象:</b>本會、承辦活動的工作人員與志工、本服務所需的委外廠商(金流、寄信、雲端服務)。除法律規定或經您同意外,不會提供給其他第三人。</li>
<li><b>方式:</b>以電子或紙本方式處理、利用及聯繫。</li></ul>

const SEL='h1,h2,h3,p,li,td,th,.q,.a,label,.tag,.num,.sub,.note,a.btn,.mk,b';
const dirty=new Set();let tm;
function updateBar(){
  const on=lv()>=2&&cur!=='admin';

function decorate(){
  $$('#page [data-list],#foot [data-list]').forEach(list=>{
    $$(':scope>*',list).forEach(ch=>{
      const host=ch.tagName==='TR'?ch.lastElementChild:ch,b=document.createElement('button');
      b.type='button';b.className='edtool';b.dataset.del='1';b.textContent='✕ 刪除';host.appendChild(b)});
    const b=document.createElement('button');b.type='button';b.className='edtool add';b.dataset.add='1';b.textContent='＋ 新增一筆(複製最後一筆)';
    (list.tagName==='TBODY'?list.parentElement:list).after(b);b._list=list;
  });
}
function setEdit(on){
  editing=on;document.body.classList.toggle('editing',on);
  $$('.edtool').forEach(x=>x.remove());$$('[contenteditable]').forEach(x=>x.removeAttribute('contenteditable'));
  if(on){decorate();$$(SEL,$('#page')).concat($$(SEL,$('#foot'))).forEach(el=>{
    if(el.closest('.edtool,#evlist,.out,#evsel'))return;
    if(el.parentElement.closest('[contenteditable="true"]'))return;
    el.setAttribute('contenteditable','true')})}
  $('#b-edit').classList.toggle('on',on);$('#b-edit').textContent=on?'✅ 編輯中(點此結束)':'✏️ 開啟編輯模式';
}
function clean(el){
  const c=el.cloneNode(true);
  $$('.edtool',c).forEach(x=>x.remove());$$('[contenteditable]',c).forEach(x=>x.removeAttribute('contenteditable'));
  $$('.hide,.active,.open,.on',c).forEach(x=>x.classList.remove('hide','active','open','on'));
  $$('#evlist,#evsel,.out',c).forEach(x=>x.innerHTML='');
  return c.innerHTML;
}
async function flush(){
  const jobs=[...dirty].map(s=>[s,clean($(s==='_foot'?'#foot':'#page'))]);dirty.clear();
  try{for(const [s,html] of jobs){SAVED[s]=html;await api('savePage',{slug:s,html})}
    $('#st').textContent='✓ 已儲存 '+new Date().toLocaleTimeString('zh-TW',{hour12:false})}
  catch(x){jobs.forEach(j=>dirty.add(j[0]));$('#st').textContent='⚠ 儲存失敗:'+x.message}
}
document.addEventListener('input',e=>{
  if(!editing||!e.target.isContentEditable)return;
  dirty.add(e.target.closest('#foot')?'_foot':cur);$('#st').textContent='編輯中…';clearTimeout(tm);tm=setTimeout(flush,900);
});
document.addEventListener('click',e=>{
  const del=e.target.closest('.edtool[data-del]');
  if(del){twice(del,'再按一次確定刪除',()=>{(del.closest('tr')||del.parentElement).remove();dirty.add(del.closest('#foot')?'_foot':cur);flush()});return}
  const add=e.target.closest('.edtool[data-add]');
  if(add){const list=add._list,last=list.lastElementChild;if(!last)return toast('清單是空的,無法複製範本');
    const c=last.cloneNode(true);$$('.edtool',c).forEach(x=>x.remove());list.appendChild(c);
    dirty.add(add.closest('#foot')?'_foot':cur);setEdit(true);flush();toast('已新增(內容為複製,請直接修改)')}
});

function needChart(){return window.Chart?Promise.resolve():new Promise(r=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/chart.js@4';s.onload=r;s.onerror=r;document.head.appendChild(s)})}

  if(k==='role')return ROLE[v]||esc(v);
  if(k==='amount')return 'NT$ '+Number(v).toLocaleString();
  return esc(v);
}

    if(t==='consults')a.push(`<button class="btn sm" data-a="reply" data-k="${k}">${r.status==='replied'?'再回覆':'回覆'}</button>`);

    <div class="tw"><table><thead></thead><tbody></tbody></table></div>`;
  $('#a-view thead').innerHTML='<tr>'+sp.cols.map(c=>`<th>${c[1]}</th>`).join('')+(hasAct?'<th>操作</th>':'')+'</tr>';

    $('#cnt').textContent=`共 ${rs.length} 筆`+(t==='donations'?`|已收款 NT$ ${rs.filter(r=>r.status==='paid').reduce((s,r)=>s+(+r.amount||0),0).toLocaleString()}`:'')};
  $('#q').oninput=draw;draw();
  $('#rf').onclick=()=>showTab(t);$('#csv').onclick=()=>exportCsv(t);
  if($('#add'))$('#add').onclick=()=>t==='events'?editEvent():editUser();
  if($('#qc'))$('#qc').onkeydown=async e=>{if(e.key!=='Enter')return;const c=e.target.value.trim().toUpperCase();if(!c)return;
    try{const r=await api('checkin',{code:c,value:true});toast('✓ '+r.name+'('+r.headcount+' 人)已簽到');e.target.value='';showTab(t)}catch(x){toast(x.message)}};
}
function exportCsv(t){
  const sp=SPEC[t],q=v=>'"'+String(v??'').replace(/"/g,'""').replace(/^([=+\-@])/,"'$1")+'"';
  const txt='\ufeff'+[sp.cols.map(c=>q(c[1])).join(',')].concat(A.D[t].map(r=>sp.cols.map(c=>q(c[0]==='status'?(STX[r[c[0]]]||r[c[0]]):c[0]==='role'?ROLE[r[c[0]]]:r[c[0]])).join(','))).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv'}));a.download=t+'_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
}
function openForm(title,fields,cb,okText='儲存'){
  $('#mf').innerHTML=`<h2>${esc(title)}</h2>`+fields.map(f=>{
    const id='f_'+f.k;
    if(f.t==='msg')return `<div class="ro">${esc(f.v)}</div>`;
    if(f.t==='check')return `<div class="f chk"><input type="checkbox" id="${id}" ${f.v?'checked':''}><label for="${id}">${f.l}</label></div>`;
    if(f.t==='select')return `<div class="f"><label class="lbl" for="${id}">${f.l}</label><select id="${id}">${f.o.map(o=>`<option value="${o[0]}" ${o[0]===f.v?'selected':''}>${o[1]}</option>`).join('')}</select></div>`;
    if(f.t==='textarea')return `<div class="f"><label class="lbl" for="${id}">${f.l}</label><textarea id="${id}" rows="6">${esc(f.v||'')}</textarea></div>`;
    return `<div class="f"><label class="lbl" for="${id}">${f.l}</label><input id="${id}" type="${f.t||'text'}" value="${esc(f.v||'')}" ${f.ro?'readonly':''} autocomplete="off"></div>`}).join('')+
    `<p class="err" id="merr"></p><button class="btn" id="mok">${okText}</button> <button class="btn line" type="button" id="mx">取消</button>`;
  $('#md').hidden=false;$('#mx').onclick=()=>$('#md').hidden=true;
  $('#mf').onsubmit=async e=>{e.preventDefault();const v={};
    fields.forEach(f=>{const el=$('#f_'+f.k);if(el)v[f.k]=f.t==='check'?el.checked:el.value});
    $('#mok').disabled=true;
    try{await cb(v);$('#md').hidden=true;if(cur==='admin'&&A.tab)showTab(A.tab)}catch(x){$('#merr').textContent=x.message;$('#mok').disabled=false}};
  const first=$('#mf input:not([readonly]),#mf textarea');if(first)first.focus();
}
const ask=(msg,fn)=>openForm('請確認',[{t:'msg',v:msg}],fn,'確定');
const rowOf=(t,k)=>A.D[t].find(r=>String(r[SPEC[t].key])===String(k));
function editEvent(r){
  r=r||{capacity:30,is_open:true};
  openForm(r.id?'編輯活動':'新增活動',[{k:'title',l:'活動名稱',v:r.title},{k:'start_at',l:'活動時間(例:2026-11-08 10:00)',v:r.start_at},{k:'place',l:'地點',v:r.place},{k:'capacity',l:'名額',t:'number',v:r.capacity},{k:'is_open',l:'開放報名',t:'check',v:isT(r.is_open)}],
    async v=>{await api('saveEvent',{event:{id:r.id,...v}});toast('活動已儲存')});
}
function editUser(r){
  const nw=!r;r=r||{role:'viewer',active:true};
  openForm(nw?'新增帳號':'編輯帳號',[{k:'email',l:'信箱',v:r.email,ro:!nw,t:'email'},{k:'name',l:'姓名',v:r.name},
    {k:'role',l:'角色',t:'select',v:r.role,o:[['viewer','檢視者(只能看)'],['editor','編輯者(可回覆、簽到、確認收款、編輯頁面與活動)'],['admin','管理員(全部權限)']]},
    {k:'active',l:'啟用',t:'check',v:isT(r.active)},{k:'password',l:nw?'初始密碼(至少 12 字元)':'重設密碼(不改請留空)',t:'password'}],
    async v=>{if(!v.password)delete v.password;await api('saveUser',{user:v});toast('帳號已儲存')});
}
document.addEventListener('click',e=>{
  const b=e.target.closest('#adm [data-a]');if(!b)return;
  const a=b.dataset.a,k=b.dataset.k,t=A.tab,r=A.D[t]&&rowOf(t,k);
  if(a==='reply')openForm('回覆諮詢 '+k,[{t:'msg',v:`${r.name}(${r.phone})\n${r.msg}`},{k:'reply',l:'回覆內容'+(r.email?'(將寄到 '+r.email+')':'(此人沒留信箱,請改用電話聯絡)'),t:'textarea',v:r.reply}],async v=>{const j=await api('reply',{code:k,reply:v.reply});toast(j.mailed?'已回覆並寄信':'已記錄回覆(未寄信)')},'送出回覆');
  else if(a==='checkin')api('checkin',{code:k,value:b.dataset.v==='1'}).then(()=>{toast(b.dataset.v==='1'?'已簽到':'已取消簽到');showTab(t)}).catch(x=>toast(x.message));
  else if(a==='paid')ask(`確認已收到 ${r.name} 的 NT$ ${Number(r.amount).toLocaleString()}(${k})?系統會寄感謝信。`,async()=>{await api('markPaid',{code:k});toast('已確認收款')});
  else if(a==='editEvent')editEvent(r);
  else if(a==='editUser')editUser(r);
  else if(a==='delUser')ask('確定刪除帳號 '+k+'?',async()=>{await api('deleteUser',{email:k});toast('已刪除')});
  else if(a==='del')ask('確定永久刪除 '+k+'?此動作無法復原(會留下操作紀錄)。',async()=>{await api('deleteRow',{sheet:t,key:k});toast('已刪除')});
});

/* ================= 字級、啟動 ================= */
let fs=+(localStorage.getItem('pdfs')||100);
const setFs=n=>{fs=Math.max(85,Math.min(150,n));document.documentElement.style.fontSize=fs+'%';try{localStorage.setItem('pdfs',fs)}catch(e){}};
$('#fa').onclick=()=>setFs(fs-8);$('#fb').onclick=()=>setFs(fs+8);setFs(fs);

$('#cfg').hidden=!NOCFG;
renderFoot();route();
if(!NOCFG)getJ('action=pages').then(j=>{
  SAVED=j.pages||{};renderFoot();
  if(cur!=='admin'&&!editing&&SAVED[cur])route();         // 有雲端版本才重繪,避免多餘閃爍
}).catch(()=>{});
if(S)api('me').then(j=>{S.user=j.user;updateBar()}).catch(()=>{});
</script>
</body>
</html>
