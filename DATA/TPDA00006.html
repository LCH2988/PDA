<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>閨蜜默契大考驗 BFF Quiz</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gradient-to-br from-pink-50 via-rose-50 to-purple-50 min-h-screen text-slate-800 font-sans pb-12">

  <!-- 全局頂部導覽列 -->
  <header class="bg-white/80 backdrop-blur border-b border-rose-100 sticky top-0 z-40 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="text-2xl">👯‍♀️</span>
      <h1 class="font-bold text-rose-600 text-lg tracking-wide">閨蜜大挑戰</h1>
    </div>
    <div id="userInfo" class="flex items-center gap-2">
      <img id="myAvatar" class="w-8 h-8 rounded-full border border-rose-200 hidden" src="" />
      <span id="myName" class="text-xs font-medium text-slate-600">載入中...</span>
    </div>
  </header>

  <main class="max-w-xl mx-auto p-4 sm:p-6">

    <!-- 讀取狀態 -->
    <div id="loader" class="text-center py-24 space-y-4">
      <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-rose-500 border-t-transparent"></div>
      <p class="text-slate-500 font-medium">連線中，準備好測驗默契了嗎...</p>
    </div>

    <!-- ================= 模式 1: 出題者模式 ================= -->
    <div id="creatorMode" class="hidden space-y-6">
      <!-- 說明橫幅 -->
      <div class="bg-white rounded-2xl p-6 shadow-sm border border-rose-100 text-center">
        <h2 class="text-xl font-bold text-slate-800">製作你的專屬考卷 💌</h2>
        <p class="text-sm text-slate-500 mt-2">
          從 500 道題目中自選 <span class="text-rose-500 font-bold">30 題</span> 並填寫你的真實答案。<br/>完成後分享連結給好友，看看誰才是真閨蜜！
        </p>
        <div class="mt-4 inline-flex items-center gap-2 px-4 py-1.5 bg-rose-50 text-rose-600 rounded-full text-xs font-semibold">
          <span>已挑選並完成：</span>
          <span id="selectedCount" class="text-sm font-bold text-rose-700">0</span> / 30 題
        </div>
      </div>

      <!-- 題庫篩選與列表 -->
      <div class="space-y-4">
        <div class="flex gap-2">
          <input type="text" id="searchInput" placeholder="搜尋題目關鍵字..." class="flex-1 bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-rose-400" />
        </div>

        <div id="questionList" class="space-y-4 max-h-[60vh] overflow-y-auto pr-1">
          <!-- 動態注入題目卡片 -->
        </div>
      </div>

      <!-- 產生連結按鈕 -->
      <div class="sticky bottom-4 z-20">
        <button id="createQuizBtn" disabled class="w-full py-3.5 bg-slate-300 text-white font-bold rounded-xl shadow-lg transition duration-200">
          請先選滿 30 題 (0/30)
        </button>
      </div>
    </div>

    <!-- ================= 模式 2: 好友挑戰模式 ================= -->
    <div id="challengerMode" class="hidden space-y-6">
      <div class="bg-white rounded-2xl p-6 shadow-sm border border-rose-100 text-center">
        <img id="hostAvatar" class="w-16 h-16 rounded-full mx-auto border-2 border-rose-400 mb-2" src="" />
        <h2 class="text-lg font-bold text-slate-800">正在挑戰 <span id="hostName" class="text-rose-600"></span> 的考卷</h2>
        <p class="text-xs text-slate-500 mt-1">共 30 題，猜猜對方的真實選擇！</p>
      </div>

      <!-- 挑戰題目容器 -->
      <div id="challengeQuestions" class="space-y-6">
        <!-- 動態注入 30 道挑戰題 -->
      </div>

      <button id="submitAnswerBtn" class="w-full py-3.5 bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-xl shadow-md transition">
        送出答案看得分 🎯
      </button>
    </div>

    <!-- ================= 模式 3: 得分結算與排行榜 ================= -->
    <div id="resultMode" class="hidden space-y-6">
      <div class="bg-white rounded-3xl p-8 text-center shadow-md border border-rose-100 space-y-4">
        <div class="text-5xl">🏆</div>
        <h2 class="text-2xl font-black text-slate-800">默契度得分</h2>
        <div class="text-6xl font-black text-rose-500" id="finalScore">0</div>
        <p class="text-sm font-medium text-slate-600" id="scoreComment">評語分析中...</p>
      </div>

      <!-- 排行榜清單 -->
      <div class="bg-white rounded-2xl p-6 shadow-sm border border-rose-100">
        <h3 class="font-bold text-slate-800 text-base mb-4 flex items-center gap-2">
          <span>🎖️ 閨蜜排行榜 TOP 20</span>
        </h3>
        <div id="leaderboardList" class="divide-y divide-slate-100 text-sm">
          <!-- 動態排行榜 -->
        </div>
      </div>

      <button onclick="window.location.href = window.location.pathname" class="w-full py-3 bg-slate-800 text-white font-semibold rounded-xl">
        我也要自己出題考朋友 🚀
      </button>
    </div>

  </main>

  <script>
    // ================= 配置設定 =================
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzwOTJbilrwBCMh3TWnWsunenL8JoO8UCC0WeuBAHfBcAIplLGrBguCYihJXgJidvL5/exec"; // 貼上你的 GAS Web App 部署網址
    const LIFF_ID = "2009456572-EflpADae";                         // 貼上你的 LIFF ID

    let currentUser = { id: "guest_" + Math.random().toString(36).substring(7), name: "神秘挑戰者", avatar: "https://via.placeholder.com/100" };
    let allQuestions = [];
    let selectedQuestions = {}; // { questionId: { ...question, correctAnswer: 0 } }
    let targetQuiz = null;
    let challengerAnswers = {};

    // 取得網址 query 參數
    const urlParams = new URLSearchParams(window.location.search);
    const currentQuizId = urlParams.get("quizId");

    async function initApp() {
      try {
        if (LIFF_ID && !LIFF_ID.includes("YOUR_LIFF")) {
          await liff.init({ liffId: LIFF_ID });
          if (liff.isLoggedIn()) {
            const profile = await liff.getProfile();
            currentUser.id = profile.userId;
            currentUser.name = profile.displayName;
            currentUser.avatar = profile.pictureUrl || currentUser.avatar;
          }
        }
      } catch (e) {
        console.warn("LIFF 初始化跳過，進入訪客模式", e);
      }

      // 更新頂部使用者介面
      document.getElementById("myName").textContent = currentUser.name;
      document.getElementById("myAvatar").src = currentUser.avatar;
      document.getElementById("myAvatar").classList.remove("hidden");
      document.getElementById("loader").classList.add("hidden");

      // 判斷當前流程：作答模式 vs 出題模式
      if (currentQuizId) {
        startChallengerMode(currentQuizId);
      } else {
        startCreatorMode();
      }
    }

    // ---------------- 出題者模式 ----------------
    async function startCreatorMode() {
      document.getElementById("creatorMode").classList.remove("hidden");
      try {
        const res = await fetch(`${GAS_API_URL}?action=getAllQuestions`).then(r => r.json());
        if (res.status === "success") {
          allQuestions = res.questions;
          renderQuestionList(allQuestions);
        }
      } catch (e) {
        alert("無法取得題庫，請確認 GAS API 網址設定正確。");
      }
    }

    function renderQuestionList(list) {
      const container = document.getElementById("questionList");
      container.innerHTML = "";
      list.forEach(q => {
        const isSelected = !!selectedQuestions[q.id];
        const div = document.createElement("div");
        div.className = `p-4 rounded-xl border transition-all ${isSelected ? 'bg-rose-50/50 border-rose-300' : 'bg-white border-slate-200'}`;
        div.innerHTML = `
          <div class="flex items-start justify-between gap-2 mb-2">
            <span class="text-xs px-2 py-0.5 rounded-full bg-slate-100 text-slate-500 font-medium">${q.category}</span>
            <span class="text-xs text-slate-400 font-mono">${q.id}</span>
          </div>
          <p class="font-bold text-slate-800 text-sm mb-3">${q.text}</p>
          <div class="grid grid-cols-2 gap-2 text-xs">
            ${q.options.map((opt, idx) => `
              <button type="button" onclick="selectAnswer('${q.id}', ${idx})" 
                class="p-2.5 rounded-lg border text-left transition 
                ${selectedQuestions[q.id]?.correctAnswer === idx 
                  ? 'bg-rose-500 text-white border-rose-500 font-bold' 
                  : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'}">
                ${['A','B','C','D'][idx]}. ${opt}
              </button>
            `).join('')}
          </div>
        `;
        container.appendChild(div);
      });
    }

    window.selectAnswer = function(qId, optionIdx) {
      const question = allQuestions.find(item => item.id === qId);
      if (selectedQuestions[qId]) {
        selectedQuestions[qId].correctAnswer = optionIdx;
      } else {
        if (Object.keys(selectedQuestions).length >= 30) {
          alert("你已經選滿 30 題囉！若要換題目請先點擊其他題取消。");
          return;
        }
        selectedQuestions[qId] = { ...question, correctAnswer: optionIdx };
      }
      updateCreatorUI();
    };

    function updateCreatorUI() {
      const count = Object.keys(selectedQuestions).length;
      document.getElementById("selectedCount").textContent = count;
      const btn = document.getElementById("createQuizBtn");

      if (count === 30) {
        btn.disabled = false;
        btn.className = "w-full py-3.5 bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-xl shadow-lg transition duration-200";
        btn.textContent = "完成 30 題！產生專屬考卷連結 🎁";
      } else {
        btn.disabled = true;
        btn.className = "w-full py-3.5 bg-slate-300 text-white font-bold rounded-xl shadow-lg transition duration-200";
        btn.textContent = `請先選滿 30 題 (${count}/30)`;
      }
      renderQuestionList(allQuestions);
    }

    document.getElementById("createQuizBtn").addEventListener("click", async () => {
      const btn = document.getElementById("createQuizBtn");
      btn.disabled = true;
      btn.textContent = "考卷建立中...";

      const payload = {
        action: "createQuiz",
        userId: currentUser.id,
        userName: currentUser.name,
        userAvatar: currentUser.avatar,
        questionsData: Object.values(selectedQuestions)
      };

      const res = await fetch(GAS_API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload)
      }).then(r => r.json());

      if (res.status === "success") {
        const shareUrl = `${window.location.origin}${window.location.pathname}?quizId=${res.quizId}`;
        // 若在 LINE 環境內可呼叫 shareTargetPicker 或發送訊息
        if (liff.isApiAvailable('shareTargetPicker')) {
          liff.shareTargetPicker([
            {
              type: "text",
              text: `🔥 我製作了「閨蜜默契大挑戰」！\n來看看你到底有多了解我，快點連結來挑戰吧：\n${shareUrl}`
            }
          ]).catch(err => console.log(err));
        } else {
          prompt("請複製你的專屬閨蜜考卷連結分享給好友：", shareUrl);
        }
      } else {
        alert("建立失敗：" + res.message);
        btn.disabled = false;
      }
    });

    // ---------------- 好友挑戰模式 ----------------
    async function startChallengerMode(quizId) {
      document.getElementById("challengerMode").classList.remove("hidden");
      const res = await fetch(`${GAS_API_URL}?action=getQuiz&quizId=${quizId}`).then(r => r.json());
      if (res.status !== "success") {
        alert("考卷不存在或已被移除");
        return;
      }

      targetQuiz = res.quiz;
      document.getElementById("hostName").textContent = targetQuiz.userName;
      document.getElementById("hostAvatar").src = targetQuiz.userAvatar || "https://via.placeholder.com/100";

      // 渲染 30 題給挑戰者作答
      const container = document.getElementById("challengeQuestions");
      container.innerHTML = "";
      targetQuiz.questions.forEach((q, index) => {
        const div = document.createElement("div");
        div.className = "bg-white p-5 rounded-2xl border border-rose-100 shadow-sm space-y-3";
        div.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-rose-500">第 ${index + 1} 題</span>
            <span class="text-xs text-slate-400">${q.category}</span>
          </div>
          <p class="font-bold text-slate-800 text-sm">${q.text}</p>
          <div class="space-y-2">
            ${q.options.map((opt, optIdx) => `
              <label class="flex items-center gap-3 p-3 rounded-xl border border-slate-200 cursor-pointer hover:bg-rose-50/30 transition">
                <input type="radio" name="ans_${q.id}" value="${optIdx}" class="accent-rose-500 w-4 h-4" onchange="challengerAnswers['${q.id}'] = ${optIdx}" />
                <span class="text-xs sm:text-sm text-slate-700">${opt}</span>
              </label>
            `).join('')}
          </div>
        `;
        container.appendChild(div);
      });
    }

    document.getElementById("submitAnswerBtn").addEventListener("click", async () => {
      if (Object.keys(challengerAnswers).length < targetQuiz.questions.length) {
        alert(`還有題目沒寫完喔！（已完成 ${Object.keys(challengerAnswers).length} / ${targetQuiz.questions.length} 題）`);
        return;
      }

      const btn = document.getElementById("submitAnswerBtn");
      btn.disabled = true;
      btn.textContent = "成績計算中...";

      const payload = {
        action: "submitAnswers",
        quizId: currentQuizId,
        challengerName: currentUser.name,
        challengerAvatar: currentUser.avatar,
        answers: challengerAnswers
      };

      const res = await fetch(GAS_API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload)
      }).then(r => r.json());

      if (res.status === "success") {
        showResult(res.score);
      } else {
        alert("送出失敗：" + res.message);
        btn.disabled = false;
      }
    });

    // ---------------- 結果與排行榜 ----------------
    async function showResult(score) {
      document.getElementById("challengerMode").classList.add("hidden");
      document.getElementById("resultMode").classList.remove("hidden");
      document.getElementById("finalScore").textContent = score;

      let comment = "塑料姐妹花，感情有待加強！🤣";
      if (score >= 90) comment = "真・靈魂伴侶！你比本人還了解對方！🔥";
      else if (score >= 70) comment = "超級好閨蜜，默契滿分！💖";
      else if (score >= 50) comment = "一般好友，有些小秘密還沒聊開喔！😜";
      document.getElementById("scoreComment").textContent = comment;

      // 重新抓取排行榜更新名次
      const res = await fetch(`${GAS_API_URL}?action=getQuiz&quizId=${currentQuizId}`).then(r => r.json());
      if (res.status === "success") {
        const lbContainer = document.getElementById("leaderboardList");
        lbContainer.innerHTML = "";
        res.leaderboard.forEach((item, idx) => {
          const row = document.createElement("div");
          row.className = "flex items-center justify-between py-3";
          row.innerHTML = `
            <div class="flex items-center gap-3">
              <span class="w-6 font-bold text-center ${idx < 3 ? 'text-rose-500 font-black' : 'text-slate-400'}">${idx + 1}</span>
              <img class="w-9 h-9 rounded-full border border-slate-200" src="${item.avatar || 'https://via.placeholder.com/80'}" />
              <span class="font-medium text-slate-700">${item.name}</span>
            </div>
            <span class="font-bold text-rose-600">${item.score} 分</span>
          `;
          lbContainer.appendChild(row);
        });
      }
    }

    window.onload = initApp;
  </script>
</body>
</html>
