<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>檔案檢視</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  body{font-size:18px;background:#f3f4f6;color:#1f2937}
  .big-btn{font-size:18px;padding:12px 20px;border-radius:12px;font-weight:bold;box-shadow:0 4px 6px rgba(0,0,0,.1)}
  .inp{width:100%;font-size:18px;padding:10px;border:2px solid #d1d5db;border-radius:12px}
</style>
</head>
<body class="min-h-screen p-3 md:p-6">
<div class="max-w-5xl mx-auto space-y-4">

  <!-- 頂端列 -->
  <header class="bg-blue-900 text-white p-4 rounded-2xl flex flex-wrap justify-between items-center gap-2">
    <div id="brandArea" class="text-2xl font-extrabold">📄 檔案檢視</div>
    <div id="userBar" class="text-base flex items-center gap-2"></div>
  </header>

  <!-- 訊息 / 動作區 -->
  <div id="panel" class="hidden bg-white p-6 rounded-2xl border-2 space-y-4 text-center"></div>

  <!-- 單一檔案內容區 -->
  <div id="viewer" class="hidden bg-white rounded-2xl border-2 overflow-hidden">
    <div class="p-3 border-b flex flex-wrap justify-between items-center gap-2 bg-gray-50">
      <div class="flex items-center gap-2">
        <button id="btnBackToFolder" class="hidden bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded-lg font-bold text-base">⬅️ 返回資料夾</button>
        <h1 id="docTitle" class="text-xl font-bold break-all"></h1>
      </div>
      <div id="docActions" class="flex gap-2"></div>
    </div>
    <div id="docBody"></div>
  </div>

  <!-- 附件區 -->
  <div id="attBox" class="hidden bg-white p-4 rounded-2xl border-2"></div>

  <!-- 清單區 -->
  <div id="listBox" class="hidden bg-white p-5 rounded-2xl border-2 space-y-4">
    <h2 id="listHeading" class="text-2xl font-bold">📂 授權瀏覽的資料夾與檔案</h2>
    <input id="searchInput" class="inp" placeholder="🔍 在此範圍內搜尋標題、檔名...">
    <div id="folderNav" class="space-y-2"></div>
    <div id="listBody" class="space-y-3"></div>
  </div>
</div>

<script>
/* ===== 設定區 (請確認下方參數) ===== */
const GAS_URL = "https://script.google.com/macros/s/AKfycbwPQGjZP9HX_2wva_yEhnj3DnT_g9_jv9szqHyeGYv3wbCzEXPq4cb0-OW5QbvWfY5KsA/exec";
const LINE_CHANNEL_ID = "2009456572"; 

/* ⚠️ 如果你有使用 LIFF，請務必填入完整的 LIFF_ID (例如 "2009456572-AbCdEfGh") 
   若留空 ""，請確認 LINE Developers 後台 -> LINE Login -> Callback URL 有填入本頁完整網址(不含 ? 參數) */
const LIFF_ID = "2009456572-VIoH1oY0"; 

const REDIRECT_URI = location.origin + location.pathname;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtSize = n => { n = +n || 0; const u=["B","KB","MB","GB","TB"]; let i=0; while(n>=1024&&i<4){n/=1024;i++} return n.toFixed(i?1:0)+" "+u[i]; };
const qs = new URLSearchParams(location.search);

/* ===== 優先把網址上的 bind / id / folder 寫入暫存，防止跳轉遺失 ===== */
if (qs.get("bind")) localStorage.setItem("pendingBind", qs.get("bind").trim());
if (qs.get("id")) sessionStorage.setItem("targetDocId", qs.get("id").trim());
if (qs.get("folder")) sessionStorage.setItem("targetFolderId", qs.get("folder").trim());

const INITIAL_DOC_ID = qs.get("id") || sessionStorage.getItem("targetDocId") || "";
const SCOPE_FOLDER_ID = qs.get("folder") || sessionStorage.getItem("targetFolderId") || "";
const SINGLE_FILE_LOCK = !!INITIAL_DOC_ID && !SCOPE_FOLDER_ID;
const USE_LIFF = !!(LIFF_ID && LIFF_ID.includes("-"));

let curFolder = SCOPE_FOLDER_ID || "";
let allFiles = [], allFolders = [];

/* ===== 登入 Session 管理 ===== */
const SESSION_MS = 5 * 3600 * 1000;
function getAuth() {
  try {
    const a = JSON.parse(localStorage.getItem("lineAuth") || "null");
    if (a && a.token && Date.now() < a.exp) return a;
  } catch (e) {}
  localStorage.removeItem("lineAuth");
  return null;
}
function setAuth(token, label, lineName) {
  localStorage.setItem("lineAuth", JSON.stringify({ token, label, lineName, exp: Date.now() + SESSION_MS }));
}
function logout() {
  localStorage.removeItem("lineAuth");
  localStorage.removeItem("pendingBind");
  localStorage.removeItem("oauthRedirectUri");
  try { if (window.liff && USE_LIFF && liff.isLoggedIn()) liff.logout(); } catch (e) {}
  const params = new URLSearchParams();
  if (INITIAL_DOC_ID) params.set("id", INITIAL_DOC_ID);
  if (SCOPE_FOLDER_ID) params.set("folder", SCOPE_FOLDER_ID);
  location.href = location.pathname + (params.toString() ? "?" + params.toString() : "");
}

function renderUserBar() {
  const a = getAuth();
  $("userBar").innerHTML = a
    ? `<span class="bg-blue-800 px-3 py-1 rounded-lg">👤 ${esc(a.label)}${a.lineName ? ` (${esc(a.lineName)})` : ""}</span>
       <button id="btnLogout" class="bg-white/20 hover:bg-white/30 px-3 py-1 rounded-lg text-sm font-bold">登出</button>`
    : `<span class="text-sm text-yellow-200">⏳ 尚未驗證</span>`;
  $("btnLogout")?.addEventListener("click", logout);
}

/* ===== API 呼叫 ===== */
async function api(p) {
  const a = getAuth();
  const r = await fetch(GAS_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ ...p, token: a?.token, scopeFolder: SCOPE_FOLDER_ID || undefined })
  });
  return r.json();
}

function showPanel(html) {
  $("viewer").classList.add("hidden");
  $("attBox").classList.add("hidden");
  $("listBox").classList.add("hidden");
  $("panel").innerHTML = html;
  $("panel").classList.remove("hidden");
}
function hidePanel() { $("panel").classList.add("hidden"); }
const msgBox = (icon, title, text, extra = "") =>
  `<div class="text-5xl">${icon}</div><h2 class="text-2xl font-bold">${esc(title)}</h2>
   <p class="text-gray-600 break-words">${esc(text)}</p>${extra}`;

/* ===== 標準 OAuth 導向 (確保發出與驗證的 redirect_uri 100% 相同) ===== */
function randStr(n = 16) {
  const a = new Uint8Array(n); crypto.getRandomValues(a);
  return [...a].map(b => b.toString(16).padStart(2, "0")).join("");
}

function triggerLineAuth(bindCode = "") {
  if (bindCode) localStorage.setItem("pendingBind", bindCode);
  // 強制固定並記憶此次送出的 redirect_uri，徹底防止 redirect_uri does not match
  const exactRedirectUri = location.origin + location.pathname;
  localStorage.setItem("oauthRedirectUri", exactRedirectUri);
  localStorage.setItem("oauthMode", "manual");

  const state = randStr(), nonce = randStr();
  const u = "https://access.line.me/oauth2/v2.1/authorize?" + new URLSearchParams({
    response_type: "code",
    client_id: LINE_CHANNEL_ID,
    redirect_uri: exactRedirectUri,
    state,
    scope: "profile openid",
    nonce
  });
  location.href = u;
}

/* ===== 處理標準 OAuth 回呼 (?code=...) ===== */
async function handleOAuthCallback() {
  const code = qs.get("code"), error = qs.get("error");
  const pendingBind = localStorage.getItem("pendingBind") || "";
  // 取出當初送給 LINE 的一模一樣的 redirect_uri
  const usedRedirectUri = localStorage.getItem("oauthRedirectUri") || REDIRECT_URI;
  localStorage.removeItem("oauthMode");

  const cleanParams = new URLSearchParams();
  if (INITIAL_DOC_ID) cleanParams.set("id", INITIAL_DOC_ID);
  if (SCOPE_FOLDER_ID) cleanParams.set("folder", SCOPE_FOLDER_ID);
  const cleanUrl = location.pathname + (cleanParams.toString() ? "?" + cleanParams.toString() : "");
  history.replaceState(null, "", cleanUrl);

  if (error) {
    return showPanel(msgBox("⚠️", "LINE 登入已取消", qs.get("error_description") || error,
      `<button onclick="triggerLineAuth('${esc(pendingBind)}')" class="big-btn bg-green-600 text-white mt-2">重新登入</button>`));
  }

  showPanel(msgBox("⏳", "正在驗證 LINE 身分與綁定狀態...", "請稍候"));
  try {
    const r = await api({
      action: "lineLogin",
      code,
      redirectUri: usedRedirectUri,
      bindCode: pendingBind
    });

    if (r.status !== "success") {
      localStorage.removeItem("pendingBind");
      return showPanel(msgBox("🔒", "綁定或驗證失敗", r.message,
        `<button onclick="triggerLineAuth('${esc(pendingBind)}')" class="big-btn bg-blue-600 text-white mt-2">重新操作</button>`));
    }

    const wasBinding = !!pendingBind;
    localStorage.removeItem("pendingBind");
    setAuth(r.token, r.label, r.lineName);
    renderUserBar();

    if (wasBinding) {
      showPanel(msgBox("✅", "LINE 綁定成功！", `歡迎您，${r.label} (${r.lineName})！您的帳號已完成綁定。`,
        `<button id="btnAfterBind" class="big-btn bg-blue-600 text-white mt-2">開始瀏覽檔案</button>`));
      $("btnAfterBind").onclick = () => startAppAfterAuth();
    } else {
      startAppAfterAuth();
    }
  } catch (e) {
    showPanel(msgBox("❌", "連線失敗", "請檢查網路後重試。"));
  }
}

/* ===== LIFF SDK 原生驗證 (由 LIFF 自行處理 code 交換，不經由後端換 code) ===== */
async function handleLiffAuth(bindCode = "") {
  showPanel(msgBox("⏳", "LINE LIFF 安全驗證中...", "正在確認您的 LINE 授權身分"));
  if (bindCode) localStorage.setItem("pendingBind", bindCode);
  try {
    await liff.init({ liffId: LIFF_ID });
  } catch (e) {
    return showPanel(msgBox("❌", "LIFF 初始化失敗", "請檢查 LIFF_ID 設定：" + e.message));
  }

  if (!liff.isLoggedIn()) {
    // 清除網址上的舊 code 參數再交給 LIFF 登入，避免衝突
    const cleanRedirect = location.origin + location.pathname;
    liff.login({ redirectUri: cleanRedirect });
    return false;
  }

  const finalBind = bindCode || localStorage.getItem("pendingBind") || "";
  if (!finalBind && getAuth()) {
    renderUserBar();
    return true;
  }

  const accessToken = liff.getAccessToken() || "";
  const idToken = liff.getIDToken() || "";

  const r = await api({ action: "lineLogin", accessToken, idToken, bindCode: finalBind });
  const wasBinding = !!finalBind;
  localStorage.removeItem("pendingBind");

  // 清除網址列上 LIFF 帶回來的 code 與 liff.state
  const cleanParams = new URLSearchParams();
  if (INITIAL_DOC_ID) cleanParams.set("id", INITIAL_DOC_ID);
  if (SCOPE_FOLDER_ID) cleanParams.set("folder", SCOPE_FOLDER_ID);
  history.replaceState(null, "", location.pathname + (cleanParams.toString() ? "?" + cleanParams.toString() : ""));

  if (r.status !== "success") {
    showPanel(msgBox("🔒", "綁定或驗證失敗", r.message,
      `<button onclick="logout()" class="big-btn bg-blue-600 text-white mt-2">重新驗證</button>`));
    return false;
  }

  setAuth(r.token, r.label, r.lineName);
  renderUserBar();

  if (wasBinding) {
    showPanel(msgBox("✅", "LINE LIFF 綁定成功！", `歡迎您，${r.label} (${r.lineName})！您的帳號已完成授權綁定。`,
      `<button id="btnAfterBindLiff" class="big-btn bg-blue-600 text-white mt-2">開始瀏覽檔案</button>`));
    $("btnAfterBindLiff").onclick = () => startAppAfterAuth();
    return false; // 等待使用者點擊按鈕
  }
  return true;
}

/* ===== 顯示綁定確認畫面 ===== */
function showBindScreen(code) {
  localStorage.setItem("pendingBind", code);
  showPanel(`<div class="text-5xl">🔗</div>
    <h2 class="text-2xl font-bold">LINE 實名授權綁定</h2>
    <p class="text-gray-600">綁定碼：<b class="text-blue-700 font-mono">${esc(code)}</b><br>請點擊下方按鈕使用 LINE 登入，完成後即可瀏覽授權給您的檔案。</p>
    <button id="btnStartBind" class="big-btn bg-green-600 hover:bg-green-700 text-white">🟢 使用 LINE 登入並綁定</button>`);
  $("btnStartBind").onclick = () => {
    if (USE_LIFF) handleLiffAuth(code).then(ok => { if (ok) startAppAfterAuth(); });
    else triggerLineAuth(code);
  };
}

/* ===== 載入單一檔案 ===== */
async function loadDoc(id, password) {
  showPanel(msgBox("⏳", "檔案載入中...", "正在確認權限"));
  let r;
  try { r = await api({ action: "load", id, password: password || "" }); }
  catch (e) { return showPanel(msgBox("❌", "連線失敗", "請檢查網路後重試。")); }

  if (r.status === "success") return renderDoc(id, r);

  switch (r.code) {
    case "NEED_PASSWORD":
      return showPwForm(id, !!password ? r.message : "");
    case "NEED_LOGIN":
      localStorage.removeItem("lineAuth");
      renderUserBar();
      return showLoginPrompt();
    case "FORBIDDEN":
      return showPanel(msgBox("⛔", "沒有權限", r.message));
    case "NOT_FOUND":
      return showPanel(msgBox("🔍", "找不到檔案", "連結可能已失效或檔案已被刪除。"));
    case "LOCKED":
      return showPanel(msgBox("⏱️", "密碼錯誤次數過多", r.message));
    default:
      return showPanel(msgBox("❌", "載入失敗", r.message));
  }
}

function showLoginPrompt() {
  showPanel(msgBox("🔒", "需要 LINE 實名驗證", "此平台受嚴格保護，請先以已綁定的 LINE 帳號登入。",
    `<button id="btnGoLogin" class="big-btn bg-green-600 hover:bg-green-700 text-white mt-2">🟢 使用 LINE 登入</button>`));
  $("btnGoLogin").onclick = () => {
    if (USE_LIFF) handleLiffAuth().then(ok => { if (ok) startAppAfterAuth(); });
    else triggerLineAuth();
  };
}

function showPwForm(id, errMsg) {
  showPanel(`<div class="text-5xl">🔑</div>
    <h2 class="text-2xl font-bold">此檔案需要密碼</h2>
    ${errMsg ? `<p class="text-red-600 font-bold">${esc(errMsg)}</p>` : ""}
    <form id="pwForm" class="max-w-sm mx-auto space-y-3">
      <input type="password" id="pwInput" class="inp" placeholder="請輸入密碼" autocomplete="off" autofocus>
      <button class="big-btn bg-blue-600 hover:bg-blue-700 text-white w-full">確認</button>
    </form>`);
  $("pwForm").onsubmit = e => {
    e.preventDefault();
    const v = $("pwInput").value;
    if (v) loadDoc(id, v);
  };
}

function renderDoc(id, r) {
  hidePanel();
  $("listBox").classList.add("hidden");
  document.title = r.title || "檔案檢視";
  $("docTitle").textContent = (r.type === "file" ? "📎 " : "📄 ") + (r.title || "");
  $("docActions").innerHTML = "";

  const backBtn = $("btnBackToFolder");
  if (SINGLE_FILE_LOCK) {
    backBtn.classList.add("hidden");
  } else {
    backBtn.classList.remove("hidden");
    backBtn.onclick = () => {
      $("viewer").classList.add("hidden");
      $("attBox").classList.add("hidden");
      $("listBox").classList.remove("hidden");
      renderExplorer();
    };
  }

  const body = $("docBody");
  body.replaceChildren();

  if (r.type === "file") {
    const did = encodeURIComponent(r.driveId);
    $("docActions").innerHTML =
      `<a href="https://drive.google.com/uc?export=download&id=${did}" target="_blank" rel="noopener" class="bg-emerald-600 text-white px-4 py-2 rounded-lg font-bold">⬇️ 下載</a>`;
    const info = document.createElement("div");
    info.className = "px-4 py-2 text-sm text-gray-500 break-all";
    info.textContent = `${r.fileName || ""} ・ ${r.mimeType || ""} ・ ${fmtSize(r.size)}`;
    const f = document.createElement("iframe");
    f.src = `https://drive.google.com/file/d/${did}/preview`;
    f.className = "w-full";
    f.style.height = "75vh";
    f.setAttribute("allow", "autoplay; fullscreen");
    body.append(info, f);
  } else {
    const f = document.createElement("iframe");
    f.className = "w-full";
    f.style.height = "80vh";
    f.setAttribute("sandbox", "allow-scripts allow-forms allow-popups allow-modals");
    f.srcdoc = r.code || "";
    body.append(f);
  }
  $("viewer").classList.remove("hidden");
  renderAttachments(r.attachments);
}

function renderAttachments(list) {
  const box = $("attBox");
  if (!list || !list.length) { box.classList.add("hidden"); return; }
  box.innerHTML = `<h3 class="text-xl font-bold mb-2">📎 附件下載 (${list.length})</h3>` + list.map(a => {
    const id = encodeURIComponent(a.driveId);
    return `<div class="py-2 border-t flex flex-wrap items-center justify-between gap-2">
      <div class="break-all"><b>${esc(a.name)}</b> <span class="text-sm text-gray-500">(${fmtSize(a.size)})</span></div>
      <div class="flex gap-2 text-sm font-bold shrink-0">
        <a href="https://drive.google.com/uc?export=download&id=${id}" target="_blank" rel="noopener" class="bg-emerald-600 text-white px-3 py-1.5 rounded-lg">⬇️ 下載</a>
        <a href="https://drive.google.com/file/d/${id}/view" target="_blank" rel="noopener" class="bg-sky-500 text-white px-3 py-1.5 rounded-lg">預覽</a>
      </div></div>`;
  }).join("");
  box.classList.remove("hidden");
}

/* ===== 資料夾與下層檔案階層瀏覽 ===== */
const fById = id => allFolders.find(f => f.id === id);
const byName = (a, b) => a.name.localeCompare(b.name, "zh-Hant");

function getFolderPath(id) {
  const p = [];
  let f = fById(id), n = 0;
  while (f && n++ < 20) {
    p.unshift(f);
    f = f.parent ? fById(f.parent) : null;
  }
  return p;
}

function countInFolderTree(folderId) {
  const subIds = [folderId];
  for (let i = 0; i < subIds.length; i++) {
    allFolders.filter(f => f.parent === subIds[i]).forEach(f => subIds.push(f.id));
  }
  const set = new Set(subIds);
  return allFiles.filter(x => set.has(x.folderId || "")).length;
}

function renderExplorer() {
  const kw = $("searchInput").value.trim().toLowerCase();
  const nav = $("folderNav"), body = $("listBody");

  if (SCOPE_FOLDER_ID) {
    const rootFolder = fById(SCOPE_FOLDER_ID);
    $("listHeading").textContent = "📁 分享專區：" + (rootFolder ? rootFolder.name : "指定資料夾");
  }

  if (kw) {
    nav.innerHTML = `<div class="text-sm text-blue-800 bg-blue-50 p-2 rounded-lg">🔍 搜尋「${esc(kw)}」於授權範圍內的結果：</div>`;
  } else {
    const path = getFolderPath(curFolder);
    const crumbs = [];
    if (!SCOPE_FOLDER_ID) {
      crumbs.push(`<button data-open-folder="" class="underline text-blue-700 font-bold">🏠 根目錄</button>`);
    }
    path.forEach(f => {
      crumbs.push(`<button data-open-folder="${esc(f.id)}" class="underline text-blue-700 font-bold break-all">📁 ${esc(f.name)}</button>`);
    });

    const subFolders = allFolders.filter(f => f.parent === curFolder).sort(byName);
    nav.innerHTML = `
      <div class="flex flex-wrap items-center gap-1 text-base bg-gray-100 p-2.5 rounded-xl">${crumbs.join(" <span>›</span> ")}</div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
        ${subFolders.map(f => `
          <button data-open-folder="${esc(f.id)}" class="p-3 bg-teal-50 hover:bg-teal-100 border-2 border-teal-200 rounded-xl flex justify-between items-center text-left">
            <span class="font-bold break-all">📁 ${esc(f.name)}</span>
            <span class="text-sm text-teal-800 bg-teal-200/60 px-2.5 py-0.5 rounded-full shrink-0">${countInFolderTree(f.id)} 個項目</span>
          </button>
        `).join("")}
      </div>`;
  }

  let items = allFiles;
  if (kw) {
    items = items.filter(f => [f.title, f.fileName, f.category].join("\n").toLowerCase().includes(kw));
  } else {
    items = items.filter(f => (f.folderId || "") === curFolder);
  }

  if (!items.length) {
    body.innerHTML = `<p class="text-center text-gray-500 py-6">此位置沒有檔案</p>`;
    return;
  }

  const groups = new Map();
  items.forEach(f => {
    const k = f.category || "";
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(f);
  });
  const keys = [...groups.keys()].filter(Boolean).sort((a, b) => a.localeCompare(b, "zh-Hant"));
  if (groups.has("")) keys.push("");

  body.innerHTML = keys.map(k => `
    <div class="space-y-2">
      <div class="bg-blue-50 text-blue-900 font-bold px-3 py-1 rounded-lg">${k ? "🏷️ " + esc(k) : "📄 檔案列表"}</div>
      ${groups.get(k).map(f => `
        <button data-open-doc="${esc(f.id)}" class="w-full text-left block p-3.5 bg-gray-50 hover:bg-blue-50 border-2 rounded-xl transition">
          <div class="flex justify-between gap-2">
            <b class="break-all text-lg">${f.type === "file" ? "📎" : "📄"} ${esc(f.title)}</b>
            <span class="shrink-0 flex gap-1 h-fit">
              ${f.hasPassword ? '<span class="bg-red-100 text-red-700 px-2 py-0.5 rounded text-xs font-bold">🔒密碼</span>' : ""}
              ${f.attCount ? `<span class="bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded text-xs font-bold">📎${f.attCount}</span>` : ""}
            </span>
          </div>
          <div class="text-xs text-gray-500 mt-1">${esc(f.updatedAt)}${f.type === "file" ? " ・ " + fmtSize(f.size) : ""}</div>
        </button>`).join("")}
    </div>`).join("");
}

async function loadList() {
  showPanel(msgBox("⏳", "讀取授權資料夾中...", ""));
  try {
    const r = await api({ action: "list" });
    if (r.status !== "success") {
      if (r.code === "NEED_LOGIN") {
        localStorage.removeItem("lineAuth");
        renderUserBar();
        return showLoginPrompt();
      }
      return showPanel(msgBox("❌", "無法讀取清單", r.message));
    }
    allFiles = r.list || [];
    allFolders = r.folders || [];
    if (SCOPE_FOLDER_ID && !fById(curFolder)) curFolder = SCOPE_FOLDER_ID;
    hidePanel();
    $("listBox").classList.remove("hidden");
    renderExplorer();
  } catch (e) {
    showPanel(msgBox("❌", "連線失敗", "請重新整理頁面。"));
  }
}

document.addEventListener("click", e => {
  const fb = e.target.closest("[data-open-folder]");
  if (fb) {
    curFolder = fb.dataset.openFolder || "";
    renderExplorer();
    return;
  }
  const db = e.target.closest("[data-open-doc]");
  if (db) loadDoc(db.dataset.openDoc);
});

$("searchInput").addEventListener("input", renderExplorer);

/* ===== 驗證通過後的主流程 ===== */
async function startAppAfterAuth() {
  if (SINGLE_FILE_LOCK) {
    $("brandArea").innerHTML = `<span>📄 專屬分享檔案</span>`;
    return loadDoc(INITIAL_DOC_ID);
  }
  if (SCOPE_FOLDER_ID) {
    $("brandArea").innerHTML = `<span>📁 專屬分享資料夾</span>`;
  }
  await loadList();
  if (INITIAL_DOC_ID) loadDoc(INITIAL_DOC_ID);
}

/* ===== 程式進入點 ===== */
(async function main() {
  renderUserBar();

  // 情況 1：若啟用了 LIFF_ID，且網址是 LIFF 跳轉回來的 (?code=... 或 ?liff.state=...)，交給 LIFF SDK 自己處理！
  if (USE_LIFF && (qs.get("code") || qs.get("liff.state"))) {
    const ok = await handleLiffAuth();
    if (ok) startAppAfterAuth();
    return;
  }

  // 情況 2：標準 OAuth 模式跳轉回來 (?code=...)
  if (!USE_LIFF && (qs.get("code") || qs.get("error"))) {
    return handleOAuthCallback();
  }

  // 情況 3：使用者點開綁定連結 (?bind=XXXX)
  if (qs.get("bind")) {
    return showBindScreen(qs.get("bind").trim());
  }

  // 情況 4：一般進入，檢查是否已登入
  if (!getAuth()) {
    if (USE_LIFF) {
      const ok = await handleLiffAuth();
      if (!ok) return;
    } else {
      return showLoginPrompt();
    }
  }

  startAppAfterAuth();
})();
</script>
</body>
