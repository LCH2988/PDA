<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>載入中... - 網頁檢視器</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        #appFrame { width: 100%; height: 100%; border: none; display: block; background: #fff; }
    </style>
</head>
<body>

    <!-- 載入中的提示畫面（高齡友善大字體） -->
    <div id="loadingScreen" class="fixed inset-0 bg-blue-900 text-white flex flex-col items-center justify-center space-y-6 z-50">
        <div class="text-3xl font-bold animate-pulse">⏳ 正在從雲端載入網頁，請稍候...</div>
        <div class="text-xl text-blue-200" id="loadingStatus">正在連線至資料庫...</div>
    </div>

    <!-- 密碼輸入對話框（若該網頁設有密碼） -->
    <div id="passwordModal" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white p-8 rounded-3xl max-w-md w-full shadow-2xl space-y-6 text-center">
            <h3 class="text-3xl font-bold text-gray-800">🔑 此網頁受密碼保護</h3>
            <p class="text-gray-600 text-lg">請輸入解鎖密碼以觀看內容：</p>
            
            <input type="password" id="unlockPasswordInput" placeholder="請輸入密碼" 
                   class="w-full text-2xl p-4 border-4 border-blue-400 rounded-2xl text-center focus:border-blue-600 focus:outline-none">

            <div class="flex gap-4 pt-2">
                <button onclick="submitPassword()" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-2xl font-bold py-4 rounded-2xl shadow-lg">
                    確定開啟
                </button>
            </div>
            <p id="errorMsg" class="text-red-500 font-bold text-lg hidden">密碼錯誤，請重新輸入！</p>
        </div>
    </div>

    <!-- 全螢幕網頁呈現框 -->
    <iframe id="appFrame"></iframe>

    <script>
        // *** 請將此處替換為您的 GAS 網頁應用程式網址 ***
        const GAS_URL = "https://script.google.com/macros/s/AKfycbztHGh49wQsli6vyYSjnzq5g6iKc0lx_9I_30a-EeQ0bspRnfEkIdRrSvegWkfkatv-9A/exec";

        // 從網址列取得檔案 ID (例如: view.html?id=WEB_1729000000000)
        const urlParams = new URLSearchParams(window.location.search);
        const fileId = urlParams.get('id');

        window.onload = function() {
            if (!fileId) {
                showError("找不到網頁代號！請確認網址是否正確。");
                return;
            }
            // 初次嘗試載入（不帶密碼）
            loadWebPage("");
        };

        async function loadWebPage(password) {
            try {
                document.getElementById('loadingStatus').innerText = "正在取得網頁內容...";
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        action: "load",
                        id: fileId,
                        password: password
                    })
                });
                const result = await response.json();

                if (result.status === "success") {
                    // 隱藏載入畫面與密碼框
                    document.getElementById('loadingScreen').style.display = 'none';
                    document.getElementById('passwordModal').style.display = 'none';
                    
                    // 設定瀏覽器標題
                    document.title = result.title || "網頁預覽";

                    // 將 HTML 程式碼透過 Blob 渲染至全螢幕 iframe
                    const iframe = document.getElementById('appFrame');
                    const blob = new Blob([result.code], { type: 'text/html;charset=utf-8' });
                    iframe.src = URL.createObjectURL(blob);
                } else {
                    // 判斷是否為密碼錯誤或需要密碼
                    if (result.message.includes("密碼") || result.message.includes("保護")) {
                        document.getElementById('loadingScreen').style.display = 'none';
                        document.getElementById('passwordModal').classList.remove('hidden');
                        if (password !== "") {
                            document.getElementById('errorMsg').classList.remove('hidden');
                        }
                    } else {
                        showError(result.message);
                    }
                }
            } catch (err) {
                showError("連線至伺服器失敗，請檢查網路連線。");
            }
        }

        function submitPassword() {
            const pwd = document.getElementById('unlockPasswordInput').value;
            document.getElementById('errorMsg').classList.add('hidden');
            document.getElementById('passwordModal').classList.add('hidden');
            document.getElementById('loadingScreen').style.display = 'flex';
            document.getElementById('loadingStatus').innerText = "正在驗證密碼...";
            loadWebPage(pwd);
        }

        function showError(message) {
            document.getElementById('loadingScreen').innerHTML = `
                <div class="text-3xl font-bold text-red-300">❌ 開啟失敗</div>
                <div class="text-xl text-white mt-2">${message}</div>
            `;
        }
    </script>
</body>
</html>
