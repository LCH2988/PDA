<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>檔案檢視</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  body{font-size:18px;background:#f3f4f6;color:#1f2937;user-select:none;-webkit-user-select:none}
  .big-btn{font-size:18px;padding:12px 20px;border-radius:12px;font-weight:bold;box-shadow:0 4px 6px rgba(0,0,0,.1)}
  .inp{width:100%;font-size:18px;padding:10px;border:2px solid #d1d5db;border-radius:12px}
</style>
</head>
<body class="min-h-screen p-3 md:p-6" oncontextmenu="return false">

<!-- ===== 免綁定全版面無框架檢視區 (?open=ID 專用) ===== -->
<div id="openOverlay" class="hidden fixed inset-0 w-screen h-[100dvh] bg-white z-40 flex items-center justify-center p-4">
  <div id="openPanel" class="max-w-md w-full bg-white p-6 rounded-2xl border-2 shadow-lg space-y-4 text-center"></div>
</div>
<div id="fullStage" class="hidden fixed inset-0 w-screen h-[100dvh] bg-white z-50 overflow-hidden"></div>
<!-- 免綁定模式若有隨附檔案時的極簡右下角浮動按鈕 -->
<div id="openAttFab" class="hidden fixed bottom-4 right-4 z-50">
  <button id="btnOpenAttDrawer" class="bg-blue-900/90 hover:bg-blue-900 text-white px-4 py-2.5 rounded-full font-bold text-base shadow-xl backdrop-blur">📎 隨附檔案 (<span id="openAttCount">0</span>)</button>
</div>
<div id="openAttModal" class="hidden fixed inset-0 bg-black/60 z-50 p-4 flex items-center justify-center">
  <div class="bg-white p-5 rounded-2xl max-w-lg w-full max-h-[85vh] overflow-y-auto space-y-3">
    <div class="flex justify-between items-center border-b pb-2">
      <h3 class="text-xl font-bold">📎 隨附檔案</h3>
      <button onclick="document.getElementById('openAttModal').classList.add('hidden')" class="bg-gray-200 px-3 py-1 rounded-lg font-bold">✖ 關閉</button>
    </div>
    <div id="openAttList" class="space-y-2"></div>
  </div>
</div>

<!-- ===== 一般 LINE 登入檢視主框架 ===== -->
<div id="appShell" class="max-w-5xl mx-auto space-y-4">

  <!-- 頂端列 -->
  <header class="bg-blue-900 text-white p-4 rounded-2xl flex flex-wrap justify-between items-center gap-2">
    <div id="brandArea" class="text-2xl font-extrabold">📄 檔案檢視</div>
    <div id="userBar" class="text-base flex items-center gap-2"></div>
  </header>

  <!-- 訊息 / 動作區 -->
  <div id="panel" class="hidden bg-white p-6 rounded-2xl border-2 space-y-4 text-center"></div>

  <!-- 單一檔案內容區 -->
  <div id="viewer" class="hidden bg-white rounded-2xl border-2 overflow-hidden">
    <div class="p-3 border-b flex flex-wrap justify-between items-center gap-2 bg-gray-50">
      <div class="flex items-center gap-2">
        <button id="btnBackToFolder" class="hidden bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded-lg font-bold text-base">⬅️ 返回清單</button>
        <h1 id="docTitle" class="text-xl font-bold break-all"></h1>
      </div>
      <div id="docActions" class="flex flex-wrap gap-2"></div>
    </div>
    <div id="docBody"></div>
  </div>

  <!-- 附件區 -->
  <div id="attBox" class="hidden bg-white p-4 rounded-2xl border-2"></div>

  <!-- 清單區 -->
  <div id="listBox" class="hidden bg-white p-5 rounded-2xl border-2 space-y-4">
    <div class="flex flex-wrap justify-between items-center gap-2">
      <h2 id="listHeading" class="text-2xl font-bold">📂 您可閱讀的資料夾與檔案</h2>
      <div id="folderShareBox"></div>
    </div>
    <div id="catFilterBar" class="flex flex-wrap gap-2"></div>
    <input id="searchInput" class="inp" placeholder="🔍 在授權範圍內搜尋標題、檔名...">
    <div id="folderNav" class="space-y-2"></div>
    <div id="listBody" class="space-y-3"></div>
  </div>
</div>

<!-- 使用者分享 Modal -->
<div id="shareModal" class="hidden fixed inset-0 bg-black/60 z-50 p-4 flex items-center justify-center">
  <div class="bg-white p-6 rounded-2xl max-w-lg w-full space-y-3">
    <h3 class="text-2xl font-bold text-center" id="shareModalTitle">🔗 分享連結</h3>
    <p id="shareModalDesc" class="text-sm text-blue-800 bg-blue-50 p-2.5 rounded-lg border border-blue-200">
      🔒 收到此連結的人需以已授權的 LINE 帳號登入，且僅能看見此項目與下層內容。
    </p>
    <div>
      <label class="font-bold">名稱：</label>
      <input id="shareName" readonly class="inp bg-gray-100 text-base">
    </div>
    <div>
      <label class="font-bold">專屬連結：</label>
      <input id="shareLink" readonly class="inp bg-gray-100 text-base font-mono">
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <button id="btnCopyAll" class="big-btn bg-emerald-600 text-white">📋 複製名稱＋連結</button>
      <button id="btnCopyUrl" class="big-btn bg-sky-600 text-white">🔗 只複製連結</button>
    </div>
    <div id="openShareQuickBox" class="hidden pt-2 border-t">
      <button id="btnCopyOpenFullUrl" class="big-btn bg-amber-500 hover:bg-amber-600 text-gray-900 w-full">🌐 複製「免綁定・全版面無框架」連結</button>
    </div>
    <button onclick="document.getElementById('shareModal').classList.add('hidden')" class="big-btn bg-gray-300 w-full">關閉</button>
  </div>
</div>

<script>
/* ===== 設定區 ===== */
const GAS_URL = "https://script.google.com/macros/s/AKfycbxQj-94DRQOV3anjUPgHdKHkQpZfRpHJszakcFesQ-3TZQL4Qc7y3COUUB2zau9vOnF5A/exec";
const LINE_CHANNEL_ID = "2009456572";
const LIFF_ID = "2009456572-VIoH1oY0";
const REDIRECT_URI = location.origin + location.pathname;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtSize = n => { n = +n || 0; const u=["B","KB","MB","GB","TB"]; let i=0; while(n>=1024&&i<4){n/=1024;i++} return n.toFixed(i?1:0)+" "+u[i]; };
const qs = new URLSearchParams(location.search);

if (qs.get("liff.state")) {
  try {
    const innerQs = new URLSearchParams(qs.get("liff.state").replace(/^\?/, ""));
    if (innerQs.get("bind") && !qs.get("bind")) qs.set("bind", innerQs.get("bind"));
    if (innerQs.get("id") && !qs.get("id")) qs.set("id", innerQs.get("id"));
    if (innerQs.get("folder") && !qs.get("folder")) qs.set("folder", innerQs.get("folder"));
    if (innerQs.get("open") && !qs.get("open")) qs.set("open", innerQs.get("open"));
  } catch (e) {}
}

// 免綁定全版面分享 ID (?open=ID 或 ?id=ID&open=1)
const OPEN_DOC_ID = (qs.get("open") || (qs.get("open") === "1" ? qs.get("id") : "") || "").trim();
const IS_OAUTH_RETURN = !!(qs.get("code") || qs.get("error"));

if (qs.get("bind")) localStorage.setItem("pendingBind", qs.get("bind").trim());
if (!OPEN_DOC_ID && qs.get("id")) {
  sessionStorage.setItem("targetDocId", qs.get("id").trim());
} else if (!IS_OAUTH_RETURN) {
  sessionStorage.removeItem("targetDocId");
}

if (!OPEN_DOC_ID && qs.get("folder")) {
  sessionStorage.setItem("targetFolderId", qs.get("folder").trim());
} else if (!IS_OAUTH_RETURN) {
  sessionStorage.removeItem("targetFolderId");
}

const INITIAL_DOC_ID = OPEN_DOC_ID ? "" : (qs.get("id") || (IS_OAUTH_RETURN ? sessionStorage.getItem("targetDocId") : "") || "").trim();
const SCOPE_FOLDER_ID = OPEN_DOC_ID ? "" : (qs.get("folder") || (IS_OAUTH_RETURN ? sessionStorage.getItem("targetFolderId") : "") || "").trim();
const SINGLE_FILE_LOCK = !!INITIAL_DOC_ID && !SCOPE_FOLDER_ID;

let curFolder = SCOPE_FOLDER_ID || "";
let curCat = "";
let allFiles = [], allFolders = [];
let userPerms = { canShare: true, canDownload: false };
let currentOpenShareUrl = "";

/* ===== API 呼叫 ===== */
async function api(p) {
  const a = getAuth();
  const r = await fetch(GAS_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ ...p, token: a?.token, scopeFolder: SCOPE_FOLDER_ID || undefined })
  });
  return r.json();
}

const msgBox = (icon, title, text, extra = "") =>
  `<div class="text-5xl">${icon}</div><h2 class="text-2xl font-bold">${esc(title)}</h2>
   <p class="text-gray-600 break-words">${esc(text)}</p>${extra}`;

/* ===== 免綁定・全版面無框架載入邏輯 ===== */
async function loadOpenDoc(id, password = "") {
  $("openOverlay").classList.remove("hidden");
  $("openPanel").innerHTML = msgBox("⏳", "內容載入中...", "請稍候");
  let r;
  try {
    r = await api({ action: "loadOpen", id, password });
  } catch (e) {
    $("openPanel").innerHTML = msgBox("❌", "連線失敗", "請檢查網路連線後重試。",
      `<button onclick="loadOpenDoc('${esc(id)}')" class="big-btn bg-blue-600 text-white mt-2">重新載入</button>`);
    return;
  }

  if (r.status === "success") {
    renderOpenFullScreen(r);
    return;
  }

  switch (r.code) {
    case "NEED_PASSWORD":
      $("openPanel").innerHTML = `<div class="text-5xl">🔑</div>
        <h2 class="text-2xl font-bold">此內容需要密碼</h2>
        ${password ? `<p class="text-red-600 font-bold">${esc(r.message)}</p>` : ""}
        <form id="openPwForm" class="space-y-3">
          <input type="password" id="openPwInput" class="inp" placeholder="請輸入密碼" autocomplete="off" autofocus>
          <button class="big-btn bg-blue-600 hover:bg-blue-700 text-white w-full">確認開啟</button>
        </form>`;
      $("openPwForm").onsubmit = e => {
        e.preventDefault();
        const v = $("openPwInput").value;
        if (v) loadOpenDoc(id, v);
      };
      break;
    case "NEED_LOGIN":
      $("openPanel").innerHTML = msgBox("🔒", "此檔案未開放免綁定公開", r.message,
        `<a href="${REDIRECT_URI}?id=${encodeURIComponent(id)}" class="inline-block big-btn bg-green-600 text-white mt-2">🟢 改用 LINE 登入開啟</a>`);
      break;
    case "LOCKED":
      $("openPanel").innerHTML = msgBox("⏱️", "密碼錯誤次數過多", r.message);
      break;
    default:
      $("openPanel").innerHTML = msgBox("🔍", "無法開啟內容", r.message || "連結可能已失效或檔案已被移除。");
  }
}

function renderOpenFullScreen(r) {
  document.title = r.title || "檔案檢視";
  $("openOverlay").classList.add("hidden");

  const stage = $("fullStage");
  stage.replaceChildren();

  if (r.type === "file") {
    const did = encodeURIComponent(r.driveId);
    const f = document.createElement("iframe");
    f.src = `https://drive.google.com/file/d/${did}/preview`;
    f.className = "w-full h-full border-0 block";
    f.style.width = "100vw";
    f.style.height = "100dvh";
    f.setAttribute("allow", "autoplay; fullscreen");
    stage.appendChild(f);
  } else {
    const f = document.createElement("iframe");
    f.className = "w-full h-full border-0 block";
    f.style.width = "100vw";
    f.style.height = "100dvh";
    f.setAttribute("sandbox", "allow-scripts allow-forms allow-popups allow-modals");
    f.srcdoc = r.code || "";
    stage.appendChild(f);
  }

  stage.classList.remove("hidden");

  // 若免綁定頁面有隨附檔案，提供右下角浮動按鈕檢視
  if (r.attachments && r.attachments.length > 0) {
    $("openAttCount").textContent = r.attachments.length;
    $("openAttList").innerHTML = r.attachments.map(a => {
      const aid = encodeURIComponent(a.driveId);
      return `<div class="p-3 border rounded-xl flex items-center justify-between gap-2">
        <div class="break-all"><b>${esc(a.name)}</b> <span class="text-sm text-gray-500">(${fmtSize(a.size)})</span></div>
        <a href="https://drive.google.com/file/d/${aid}/preview" target="_blank" rel="noopener" class="bg-sky-600 text-white px-3 py-1.5 rounded-lg text-sm font-bold shrink-0">👁️ 檢視</a>
      </div>`;
    }).join("");
    $("openAttFab").classList.remove("hidden");
    $("btnOpenAttDrawer").onclick = () => $("openAttModal").classList.remove("hidden");
  }
}

/* ===== 登入 Session 管理 ===== */
const SESSION_MS = 5 * 3600 * 1000;
function getAuth() {
  try {
    const a = JSON.parse(localStorage.getItem("lineAuth") || "null");
    if (a && a.token && Date.now() < a.exp) return a;
  } catch (e) {}
  localStorage.removeItem("lineAuth");
  return null;
}
function setAuth(token, label, lineName, perms) {
  localStorage.setItem("lineAuth", JSON.stringify({ token, label, lineName, perms, exp: Date.now() + SESSION_MS }));
  if (perms) userPerms = perms;
}
function logout() {
  localStorage.removeItem("lineAuth");
  localStorage.removeItem("pendingBind");
  sessionStorage.removeItem("lineFlow");
  sessionStorage.removeItem("targetDocId");
  sessionStorage.removeItem("targetFolderId");
  try { if (window.liff && liff.isLoggedIn()) liff.logout(); } catch (e) {}
  const params = new URLSearchParams();
  if (INITIAL_DOC_ID) params.set("id", INITIAL_DOC_ID);
  if (SCOPE_FOLDER_ID) params.set("folder", SCOPE_FOLDER_ID);
  location.href = location.pathname + (params.toString() ? "?" + params.toString() : "");
}

function renderUserBar() {
  const a = getAuth();
  if (a && a.perms) userPerms = a.perms;
  const badge = a ? (userPerms.canDownload ? "🔓 可閱讀/分享/下載" : (userPerms.canShare ? "👁️ 僅限閱讀與分享" : "🔒 僅限純閱讀")) : "";
  $("userBar").innerHTML = a
    ? `<span class="bg-blue-800 px-3 py-1 rounded-lg">👤 ${esc(a.label)} <span class="text-xs text-sky-200 ml-1">${badge}</span></span>
       <button id="btnLogout" class="bg-white/20 hover:bg-white/30 px-3 py-1 rounded-lg text-sm font-bold">登出</button>`
    : `<span class="text-sm text-yellow-200">⏳ 尚未驗證</span>`;
  $("btnLogout")?.addEventListener("click", logout);
}

/* ===== 手機 / LINE 返回鍵防誤關 ===== */
function backToListView() {
  $("viewer").classList.add("hidden");
  $("attBox").classList.add("hidden");
  $("listBox").classList.remove("hidden");
  renderExplorer();
}

window.addEventListener("popstate", e => {
  if (!$("shareModal").classList.contains("hidden")) {
    $("shareModal").classList.add("hidden");
    return;
  }
  if (!$("viewer").classList.contains("hidden") && !SINGLE_FILE_LOCK) {
    backToListView();
    return;
  }
  if (e.state && e.state.view === "folder") {
    curFolder = e.state.folderId || SCOPE_FOLDER_ID || "";
    renderExplorer();
  }
});

/* ===== 分享工具 ===== */
function openUserShare(title, url, openUrl = "") {
  if (!userPerms.canShare) return alert("您的帳號權限設定為「僅限閱讀」，無法分享連結。");
  $("shareName").value = title;
  $("shareLink").value = url;
  currentOpenShareUrl = openUrl;
  if (openUrl) {
    $("openShareQuickBox").classList.remove("hidden");
  } else {
    $("openShareQuickBox").classList.add("hidden");
  }
  $("shareModal").classList.remove("hidden");
}
async function copyText(text, msg) {
  try { await navigator.clipboard.writeText(text); alert(msg); }
  catch { prompt("請手動複製：", text); }
}
$("btnCopyUrl").onclick = () => copyText($("shareLink").value, "📋 已複製分享連結！");
$("btnCopyAll").onclick = () => copyText(`${$("shareName").value}\n${$("shareLink").value}`, "📋 已複製名稱與連結！");
$("btnCopyOpenFullUrl").onclick = () => {
  if (!currentOpenShareUrl) return;
  copyText(`${$("shareName").value}\n${currentOpenShareUrl}`, "🌐 已複製「免綁定・全版面」分享名稱與連結！");
};

function showPanel(html) {
  $("viewer").classList.add("hidden");
  $("attBox").classList.add("hidden");
  $("listBox").classList.add("hidden");
  $("panel").innerHTML = html;
  $("panel").classList.remove("hidden");
}
function hidePanel() { $("panel").classList.add("hidden"); }

/* ===== OAuth 2.1 與 LIFF 雙保險驗證 ===== */
function randStr(n = 16) {
  const a = new Uint8Array(n); crypto.getRandomValues(a);
  return [...a].map(b => b.toString(16).padStart(2, "0")).join("");
}

function startLineOAuth(bindCode = "") {
  const finalBind = bindCode || localStorage.getItem("pendingBind") || "";
  if (finalBind) localStorage.setItem("pendingBind", finalBind);
  if (INITIAL_DOC_ID) sessionStorage.setItem("targetDocId", INITIAL_DOC_ID);
  if (SCOPE_FOLDER_ID) sessionStorage.setItem("targetFolderId", SCOPE_FOLDER_ID);

  const state = randStr(), nonce = randStr();
  const flowData = { state, bindCode: finalBind, redirectUri: REDIRECT_URI };
  sessionStorage.setItem("lineFlow", JSON.stringify(flowData));
  localStorage.setItem("lineFlowBackup", JSON.stringify(flowData));

  const u = "https://access.line.me/oauth2/v2.1/authorize?" + new URLSearchParams({
    response_type: "code",
    client_id: LINE_CHANNEL_ID,
    redirect_uri: REDIRECT_URI,
    state,
    scope: "profile openid",
    nonce
  });
  location.href = u;
}

async function handleOAuthCallback() {
  const code = qs.get("code"), state = qs.get("state"), error = qs.get("error");
  let flow = null;
  try { flow = JSON.parse(sessionStorage.getItem("lineFlow") || localStorage.getItem("lineFlowBackup") || "null"); } catch (e) {}
  sessionStorage.removeItem("lineFlow");
  localStorage.removeItem("lineFlowBackup");

  const bindCode = flow?.bindCode || localStorage.getItem("pendingBind") || "";
  const usedRedirectUri = flow?.redirectUri || REDIRECT_URI;

  const cleanParams = new URLSearchParams();
  if (INITIAL_DOC_ID) cleanParams.set("id", INITIAL_DOC_ID);
  if (SCOPE_FOLDER_ID) cleanParams.set("folder", SCOPE_FOLDER_ID);
  history.replaceState(null, "", location.pathname + (cleanParams.toString() ? "?" + cleanParams.toString() : ""));

  if (error) {
    return showPanel(msgBox("⚠️", "LINE 登入已取消", qs.get("error_description") || error,
      `<button onclick="startLineOAuth('${esc(bindCode)}')" class="big-btn bg-green-600 text-white mt-2">重新登入</button>`));
  }

  if (!flow || !flow.state || state !== flow.state) {
    return showPanel(msgBox("⚠️", "登入狀態驗證逾時或異常", "為確保帳號安全，請重新點擊登入按鈕進行驗證。",
      `<button onclick="startLineOAuth('${esc(bindCode)}')" class="big-btn bg-green-600 text-white mt-2">重新驗證登入</button>`));
  }

  showPanel(msgBox("⏳", "正在驗證 LINE 身分與權限...", "請稍候"));
  try {
    const r = await api({ action: "lineLogin", code, redirectUri: usedRedirectUri, bindCode });
    if (r.status !== "success") {
      return showPanel(msgBox("🔒", "綁定或驗證失敗", r.message,
        `<button onclick="startLineOAuth('${esc(bindCode)}')" class="big-btn bg-blue-600 text-white mt-2">重新驗證</button>`));
    }

    localStorage.removeItem("pendingBind");
    setAuth(r.token, r.label, r.lineName, r.perms);
    renderUserBar();

    if (bindCode) {
      showPanel(msgBox("✅", "LINE 綁定成功！", `歡迎您，${r.label}！您的帳號已完成綁定。`,
        `<button id="btnAfterBind" class="big-btn bg-blue-600 text-white mt-2">開始瀏覽檔案</button>`));
      $("btnAfterBind").onclick = () => startAppAfterAuth();
    } else {
      startAppAfterAuth();
    }
  } catch (e) {
    showPanel(msgBox("❌", "連線失敗", "請檢查網路後重試。"));
  }
}

async function tryLiffAutoAuth(bindCode = "") {
  const finalBind = bindCode || localStorage.getItem("pendingBind") || "";
  if (finalBind) localStorage.setItem("pendingBind", finalBind);
  try {
    await liff.init({ liffId: LIFF_ID });
    if (liff.isInClient() && liff.isLoggedIn()) {
      showPanel(msgBox("⏳", "LINE LIFF 快速驗證中...", ""));
      const accessToken = liff.getAccessToken() || "";
      const idToken = liff.getIDToken() || "";
      const r = await api({ action: "lineLogin", accessToken, idToken, bindCode: finalBind });
      if (r.status === "success") {
        localStorage.removeItem("pendingBind");
        setAuth(r.token, r.label, r.lineName, r.perms);
        renderUserBar();
        if (finalBind) {
          showPanel(msgBox("✅", "LINE LIFF 綁定成功！", `歡迎您，${r.label}！`,
            `<button id="btnAfterLiff" class="big-btn bg-blue-600 text-white mt-2">開始瀏覽檔案</button>`));
          $("btnAfterLiff").onclick = () => startAppAfterAuth();
          return true;
        }
        startAppAfterAuth();
        return true;
      }
      if (r.message && r.message.includes("code")) {
        startLineOAuth(finalBind);
        return true;
      }
    }
  } catch (e) {}
  return false;
}

function showBindScreen(code) {
  localStorage.setItem("pendingBind", code);
  showPanel(`<div class="text-5xl">🔗</div>
    <h2 class="text-2xl font-bold">LINE 實名授權綁定</h2>
    <p class="text-gray-600">綁定碼：<b class="text-blue-700 font-mono">${esc(code)}</b><br>請點擊下方按鈕使用 LINE 登入，完成後即可依您的身分權限瀏覽與分享檔案。</p>
    <button id="btnStartBind" class="big-btn bg-green-600 hover:bg-green-700 text-white">🟢 使用 LINE 登入並綁定</button>`);
  $("btnStartBind").onclick = async () => {
    const handled = await tryLiffAutoAuth(code);
    if (!handled) startLineOAuth(code);
  };
}

/* ===== 載入單一檔案 ===== */
async function loadDoc(id, password, pushHist = true) {
  showPanel(msgBox("⏳", "檔案載入中...", "正在確認閱讀權限"));
  let r;
  try { r = await api({ action: "load", id, password: password || "" }); }
  catch (e) { return showPanel(msgBox("❌", "連線失敗", "請檢查網路後重試。")); }

  if (r.status === "success") {
    if (r.perms) { userPerms = r.perms; renderUserBar(); }
    if (pushHist && !SINGLE_FILE_LOCK) {
      history.pushState({ view: "doc", docId: id, folderId: curFolder }, "", location.href);
    }
    return renderDoc(id, r);
  }

  switch (r.code) {
    case "NEED_PASSWORD": return showPwForm(id, !!password ? r.message : "");
    case "NEED_LOGIN":
      localStorage.removeItem("lineAuth"); renderUserBar();
      return showLoginPrompt();
    case "FORBIDDEN": return showPanel(msgBox("⛔", "沒有閱讀權限", r.message));
    case "NOT_FOUND": return showPanel(msgBox("🔍", "找不到檔案", "連結可能已失效或檔案已被刪除。"));
    case "LOCKED": return showPanel(msgBox("⏱️", "密碼錯誤次數過多", r.message));
    default: return showPanel(msgBox("❌", "載入失敗", r.message));
  }
}

function showLoginPrompt() {
  showPanel(msgBox("🔒", "需要 LINE 實名驗證", "此平台受嚴格保護，請先以已綁定的 LINE 帳號登入。",
    `<button id="btnGoLogin" class="big-btn bg-green-600 hover:bg-green-700 text-white mt-2">🟢 使用 LINE 登入</button>`));
  $("btnGoLogin").onclick = async () => {
    const handled = await tryLiffAutoAuth();
    if (!handled) startLineOAuth();
  };
}

function showPwForm(id, errMsg) {
  showPanel(`<div class="text-5xl">🔑</div>
    <h2 class="text-2xl font-bold">此檔案需要密碼</h2>
    ${errMsg ? `<p class="text-red-600 font-bold">${esc(errMsg)}</p>` : ""}
    <form id="pwForm" class="max-w-sm mx-auto space-y-3">
      <input type="password" id="pwInput" class="inp" placeholder="請輸入密碼" autocomplete="off" autofocus>
      <button class="big-btn bg-blue-600 hover:bg-blue-700 text-white w-full">確認</button>
    </form>`);
  $("pwForm").onsubmit = e => { e.preventDefault(); const v = $("pwInput").value; if (v) loadDoc(id, v, false); };
}

function renderDoc(id, r) {
  hidePanel();
  $("listBox").classList.add("hidden");
  document.title = r.title || "檔案檢視";
  $("docTitle").textContent = (r.type === "file" ? "📎 " : "📄 ") + (r.title || "");

  const actions = [];
  if (userPerms.canShare) {
    actions.push(`<button id="btnShareCurrentDoc" class="bg-amber-500 hover:bg-amber-600 text-gray-900 px-4 py-2 rounded-lg font-bold">🔗 分享此檔案</button>`);
  }
  if (r.type === "file" && userPerms.canDownload) {
    const did = encodeURIComponent(r.driveId);
    actions.push(`<a href="https://drive.google.com/uc?export=download&id=${did}" target="_blank" rel="noopener" class="bg-emerald-600 text-white px-4 py-2 rounded-lg font-bold">⬇️ 下載</a>`);
  }
  $("docActions").innerHTML = actions.join("");
  if ($("btnShareCurrentDoc")) {
    const openUrl = r.isOpen ? `${REDIRECT_URI}?open=${encodeURIComponent(id)}` : "";
    $("btnShareCurrentDoc").onclick = () => openUserShare(r.title || "分享檔案", `${REDIRECT_URI}?id=${encodeURIComponent(id)}`, openUrl);
  }

  const backBtn = $("btnBackToFolder");
  if (SINGLE_FILE_LOCK) {
    backBtn.classList.add("hidden");
  } else {
    backBtn.classList.remove("hidden");
    backBtn.onclick = () => backToListView();
  }

  const body = $("docBody");
  body.replaceChildren();

  if (r.type === "file") {
    const did = encodeURIComponent(r.driveId);
    const info = document.createElement("div");
    info.className = "px-4 py-2 text-sm text-gray-500 break-all";
    info.textContent = `${r.fileName || ""} ・ ${fmtSize(r.size)} ${userPerms.canDownload ? "" : "・ 🔒 僅供線上閱覽（已停用下載）"}`;

    const frameWrap = document.createElement("div");
    frameWrap.className = "relative w-full";
    frameWrap.style.height = "75vh";

    const f = document.createElement("iframe");
    f.src = `https://drive.google.com/file/d/${did}/preview`;
    f.className = "w-full h-full";
    f.setAttribute("allow", "autoplay; fullscreen");
    frameWrap.appendChild(f);

    if (!userPerms.canDownload) {
      const shield = document.createElement("div");
      shield.className = "absolute top-0 right-0 w-20 h-16 z-10";
      shield.title = "僅供線上閱覽，已停用彈出與下載";
      shield.setAttribute("oncontextmenu", "return false");
      shield.onclick = e => e.stopPropagation();
      frameWrap.appendChild(shield);
    }

    body.append(info, frameWrap);
  } else {
    const f = document.createElement("iframe");
    f.className = "w-full";
    f.style.height = "80vh";
    f.setAttribute("sandbox", "allow-scripts allow-forms allow-popups allow-modals");
    f.srcdoc = r.code || "";
    body.append(f);
  }
  $("viewer").classList.remove("hidden");
  renderAttachments(r.attachments);
}

function renderAttachments(list) {
  const box = $("attBox");
  if (!list || !list.length) { box.classList.add("hidden"); return; }
  box.innerHTML = `<h3 class="text-xl font-bold mb-2">📎 隨附檔案 (${list.length})</h3>` + list.map(a => {
    const id = encodeURIComponent(a.driveId);
    return `<div class="py-2 border-t flex flex-wrap items-center justify-between gap-2">
      <div class="break-all"><b>${esc(a.name)}</b> <span class="text-sm text-gray-500">(${fmtSize(a.size)})</span></div>
      <div class="flex gap-2 text-sm font-bold shrink-0">
        <a href="https://drive.google.com/file/d/${id}/preview" target="_blank" rel="noopener" class="bg-sky-600 text-white px-3 py-1.5 rounded-lg">👁️ 線上檢視</a>
        ${userPerms.canDownload ? `<a href="https://drive.google.com/uc?export=download&id=${id}" target="_blank" rel="noopener" class="bg-emerald-600 text-white px-3 py-1.5 rounded-lg">⬇️ 下載</a>` : ""}
      </div></div>`;
  }).join("");
  box.classList.remove("hidden");
}

/* ===== 資料夾與類別瀏覽器 ===== */
const fById = id => allFolders.find(f => f.id === id);
const byName = (a, b) => a.name.localeCompare(b.name, "zh-Hant");

function getFolderPath(id) {
  const p = [];
  let f = fById(id), n = 0;
  while (f && n++ < 20) {
    p.unshift(f);
    f = f.parent ? fById(f.parent) : null;
  }
  return p;
}

function countInFolderTree(folderId) {
  const subIds = [folderId];
  for (let i = 0; i < subIds.length; i++) {
    allFolders.filter(f => f.parent === subIds[i]).forEach(f => subIds.push(f.id));
  }
  const set = new Set(subIds);
  return allFiles.filter(x => set.has(x.folderId || "")).length;
}

function renderCatPills() {
  const cats = [...new Set(allFiles.map(f => f.category).filter(Boolean))].sort((a, b) => a.localeCompare(b, "zh-Hant"));
  if (!cats.length) { $("catFilterBar").innerHTML = ""; return; }
  $("catFilterBar").innerHTML = [
    `<button data-cat-pill="" class="px-3 py-1 rounded-full text-sm font-bold ${!curCat ? 'bg-blue-900 text-white' : 'bg-gray-200 text-gray-700'}">全部類別</button>`,
    ...cats.map(c => `<button data-cat-pill="${esc(c)}" class="px-3 py-1 rounded-full text-sm font-bold ${curCat === c ? 'bg-blue-900 text-white' : 'bg-blue-50 text-blue-900 border border-blue-200'}">🏷️ ${esc(c)}</button>`)
  ].join("");
}

function renderExplorer() {
  renderCatPills();
  const kw = $("searchInput").value.trim().toLowerCase();
  const nav = $("folderNav"), body = $("listBody"), shareBox = $("folderShareBox");

  const activeFolderObj = curFolder ? fById(curFolder) : null;
  if (SCOPE_FOLDER_ID) {
    const rootFolder = fById(SCOPE_FOLDER_ID);
    $("listHeading").textContent = "📁 分享專區：" + (rootFolder ? rootFolder.name : "指定資料夾");
  }

  if (curFolder && userPerms.canShare && activeFolderObj) {
    shareBox.innerHTML = `<button data-share-folder="${esc(curFolder)}" data-share-name="${esc(activeFolderObj.name)}" class="bg-amber-500 hover:bg-amber-600 text-gray-900 px-3 py-1.5 rounded-lg text-sm font-bold">🔗 分享目前資料夾</button>`;
  } else {
    shareBox.innerHTML = "";
  }

  if (kw || curCat) {
    nav.innerHTML = `<div class="text-sm text-blue-800 bg-blue-50 p-2 rounded-lg">🔍 目前顯示${curCat ? `類別「${esc(curCat)}」` : ""}${kw ? ` 關鍵字「${esc(kw)}」` : ""}於所有授權資料夾的結果：</div>`;
  } else {
    const path = getFolderPath(curFolder);
    const crumbs = [];
    if (!SCOPE_FOLDER_ID) {
      crumbs.push(`<button data-open-folder="" class="underline text-blue-700 font-bold">🏠 授權首頁</button>`);
    }
    path.forEach(f => {
      crumbs.push(`<button data-open-folder="${esc(f.id)}" class="underline text-blue-700 font-bold break-all">📁 ${esc(f.name)}</button>`);
    });

    const subFolders = allFolders.filter(f => f.parent === curFolder).sort(byName);
    nav.innerHTML = `
      <div class="flex flex-wrap items-center gap-1 text-base bg-gray-100 p-2.5 rounded-xl">${crumbs.join(" <span>›</span> ")}</div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
        ${subFolders.map(f => `
          <div class="p-3 bg-teal-50 hover:bg-teal-100 border-2 border-teal-200 rounded-xl flex justify-between items-center gap-2">
            <button data-open-folder="${esc(f.id)}" class="font-bold break-all text-left flex-1">
              📁 ${esc(f.name)} <span class="text-xs font-normal text-teal-800 bg-teal-200/60 px-2 py-0.5 rounded-full ml-1">${countInFolderTree(f.id)} 個檔案</span>
            </button>
            ${userPerms.canShare ? `<button data-share-folder="${esc(f.id)}" data-share-name="${esc(f.name)}" class="bg-amber-500 text-gray-900 px-2.5 py-1 rounded-lg text-xs font-bold shrink-0">分享</button>` : ""}
          </div>
        `).join("")}
      </div>`;
  }

  let items = allFiles;
  if (curCat) items = items.filter(f => f.category === curCat);
  if (kw) {
    items = items.filter(f => [f.title, f.fileName, f.category].join("\n").toLowerCase().includes(kw));
  } else if (!curCat) {
    items = items.filter(f => (f.folderId || "") === curFolder || (!curFolder && f.folderId && !fById(f.folderId)));
  }

  if (!items.length) {
    body.innerHTML = `<p class="text-center text-gray-500 py-6">此位置沒有檔案（請點選上方資料夾或類別檢視）</p>`;
    return;
  }

  const groups = new Map();
  items.forEach(f => {
    const k = f.category || "";
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(f);
  });
  const keys = [...groups.keys()].filter(Boolean).sort((a, b) => a.localeCompare(b, "zh-Hant"));
  if (groups.has("")) keys.push("");

  body.innerHTML = keys.map(k => `
    <div class="space-y-2">
      <div class="bg-blue-50 text-blue-900 font-bold px-3 py-1 rounded-lg">${k ? "🏷️ " + esc(k) : "📄 檔案列表"}</div>
      ${groups.get(k).map(f => `
        <div class="p-3.5 bg-gray-50 hover:bg-blue-50 border-2 rounded-xl flex justify-between items-center gap-2 transition">
          <button data-open-doc="${esc(f.id)}" class="text-left flex-1 min-w-0">
            <div class="flex flex-wrap items-center gap-2">
              <b class="break-all text-lg">${f.type === "file" ? "📎" : "📄"} ${esc(f.title)}</b>
              ${f.isPublic === "open" ? '<span class="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded text-xs font-bold">🌐免綁定公開</span>' : ""}
              ${f.hasPassword ? '<span class="bg-red-100 text-red-700 px-2 py-0.5 rounded text-xs font-bold">🔒密碼</span>' : ""}
              ${f.attCount ? `<span class="bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded text-xs font-bold">📎${f.attCount}</span>` : ""}
            </div>
            <div class="text-xs text-gray-500 mt-1">${esc(f.updatedAt)}${f.type === "file" ? " ・ " + fmtSize(f.size) : ""}</div>
          </button>
          <div class="flex gap-1.5 shrink-0">
            <button data-open-doc="${esc(f.id)}" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-sm font-bold">閱讀</button>
            ${userPerms.canShare ? `<button data-share-doc="${esc(f.id)}" data-share-name="${esc(f.title)}" data-share-open="${f.isPublic === 'open' ? '1' : ''}" class="bg-amber-500 text-gray-900 px-3 py-1.5 rounded-lg text-sm font-bold">分享</button>` : ""}
          </div>
        </div>`).join("")}
    </div>`).join("");
}

async function loadList() {
  showPanel(msgBox("⏳", "讀取您的授權檔案與資料夾中...", ""));
  try {
    const r = await api({ action: "list" });
    if (r.status !== "success") {
      if (r.code === "NEED_LOGIN") {
        localStorage.removeItem("lineAuth"); renderUserBar();
        return showLoginPrompt();
      }
      return showPanel(msgBox("❌", "無法讀取清單", r.message));
    }
    allFiles = r.list || [];
    allFolders = r.folders || [];
    if (r.perms) { userPerms = r.perms; renderUserBar(); }
    if (SCOPE_FOLDER_ID && !fById(curFolder)) curFolder = SCOPE_FOLDER_ID;
    hidePanel();
    $("listBox").classList.remove("hidden");
    renderExplorer();
  } catch (e) {
    showPanel(msgBox("❌", "連線失敗", "請重新整理頁面。"));
  }
}

document.addEventListener("click", e => {
  const cp = e.target.closest("[data-cat-pill]");
  if (cp) {
    curCat = cp.dataset.catPill || "";
    renderExplorer();
    return;
  }
  const sf = e.target.closest("[data-share-folder]");
  if (sf) {
    const fid = sf.dataset.shareFolder;
    openUserShare("📁 " + (sf.dataset.shareName || "分享資料夾"), `${REDIRECT_URI}?folder=${encodeURIComponent(fid)}`, "");
    return;
  }
  const sd = e.target.closest("[data-share-doc]");
  if (sd) {
    const did = sd.dataset.shareDoc;
    const openUrl = sd.dataset.shareOpen === "1" ? `${REDIRECT_URI}?open=${encodeURIComponent(did)}` : "";
    openUserShare(sd.dataset.shareName || "分享檔案", `${REDIRECT_URI}?id=${encodeURIComponent(did)}`, openUrl);
    return;
  }
  const fb = e.target.closest("[data-open-folder]");
  if (fb) {
    curFolder = fb.dataset.openFolder || "";
    history.pushState({ view: "folder", folderId: curFolder }, "", location.href);
    renderExplorer();
    return;
  }
  const db = e.target.closest("[data-open-doc]");
  if (db) loadDoc(db.dataset.openDoc, "", true);
});

$("searchInput").addEventListener("input", renderExplorer);

async function startAppAfterAuth() {
  sessionStorage.removeItem("targetDocId");
  sessionStorage.removeItem("targetFolderId");

  if (SINGLE_FILE_LOCK) {
    $("brandArea").innerHTML = `<span>📄 專屬分享檔案</span>`;
    return loadDoc(INITIAL_DOC_ID, "", false);
  }
  if (SCOPE_FOLDER_ID) {
    $("brandArea").innerHTML = `<span>📁 專屬分享資料夾</span>`;
  }
  history.replaceState({ view: "folder", folderId: curFolder }, "", location.href);
  await loadList();
  if (INITIAL_DOC_ID) loadDoc(INITIAL_DOC_ID, "", true);
}

(async function main() {
  // 若網址帶有 ?open=ID，直接進入免綁定・全版面無框架檢視模式
  if (OPEN_DOC_ID) {
    document.body.className = "m-0 p-0 bg-white overflow-hidden";
    $("appShell").classList.add("hidden");
    return loadOpenDoc(OPEN_DOC_ID);
  }

  renderUserBar();
  if (qs.get("code") || qs.get("error")) return handleOAuthCallback();
  if (qs.get("bind")) return showBindScreen(qs.get("bind").trim());
  if (!getAuth()) {
    const handled = await tryLiffAutoAuth();
    if (!handled) showLoginPrompt();
    return;
  }
  startAppAfterAuth();
})();
</script>
