<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>山腳貓 11/1 欣賞埤塘之美團騎活動</title>
    <!-- 引入 Bootstrap 5 CSS 確保排版美觀與響應式 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-size: 18px; /* 針對易讀性設計的大字體 */
            color: #2c3e50;
        }
        .card-header-custom {
            background-color: #2c3e50;
            color: white;
            font-weight: bold;
        }
        .btn-line {
            background-color: #06c755;
            color: white;
            font-size: 20px;
            font-weight: bold;
        }
        .btn-line:hover {
            background-color: #05b34c;
            color: white;
        }
    </style>
</head>
<body>

    <div class="container my-4">
        <div class="card shadow-sm">
            <div class="card-header card-header-custom text-center py-3">
                <h2>🐱 山腳貓首場團騎</h2>
                <p class="mb-0 fs-5">主題：欣賞埤塘之美</p>
            </div>
            <div class="card-body">
                <p><strong>📅 日期：</strong>11/1（週日）｜早餐自理</p>
                <hr>
                <h5>📍 集合點資訊</h5>
                <ul>
                    <li><strong>第一集合點 (07:00)：</strong>中山國小集合出發</li>
                    <li><strong>第二集合點 (07:45)：</strong>中央西路中豐路口長頸鹿旁（機捷老街溪站）</li>
                </ul>
                <hr>
                <h5>🚴‍♂️ 沿途亮點概要</h5>
                <p class="text-muted fs-6">
                    老街溪單車道 ➔ 青禾藝術 (5-5埤塘) ➔ 橫山藝術 (5-8生態埤塘) ➔ 青塘園/永恆之塔 ➔ 圓光佛學院 (補水/洗手間) ➔ 月桃路新埤塘 ➔ 溪海埤塘 (高台賞機) ➔ 華興池生態公園 ➔ 韓湘樓午餐
                </p>
                <hr>
                <p class="text-danger fw-bold">⚠️ 注意事項：遇雨取消（早上五點公告），騎乘請注意安全。</p>
                
                <!-- LINE 分享按鈕 -->
                <div class="d-grid gap-2 mt-4">
                    <button id="shareBtn" class="btn btn-line py-3 shadow" onclick="shareToLine()" disabled>
                        📲 分享行程給車友 / LINE 群組
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 引入 LINE LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
        // 請替換為您在 LINE Developers 建立的 LIFF ID
        const LIFF_ID = "2009456572-mxeoY8wg";

        window.onload = function() {
            initializeLiff(LIFF_ID);
        };

        function initializeLiff(liffId) {
            liff.init({
                liffId: liffId
            }).then(() => {
                // 初始化成功後啟用分享按鈕
                if (liff.isApiAvailable('shareTargetPicker')) {
                    document.getElementById('shareBtn').removeAttribute('disabled');
                } else {
                    alert('此環境暫不支援一鍵分享功能，請在 LINE App 內開啟。');
                }
            }).catch((err) => {
                console.error('LIFF Initialization failed', err);
            });
        }

        function shareToLine() {
            if (!liff.isLoggedIn()) {
                liff.login();
                return;
            }

            // 使用 Flex Message 卡牌分享至聊天室
            liff.shareTargetPicker([
                {
                    "type": "flex",
                    "altText": "【山腳貓團騎】11/1 欣賞埤塘之美活動資訊",
                    "contents": {
                        "type": "bubble",
                        "hero": {
                            "type": "image",
                            "url": "https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?auto=format&fit=crop&w=1200&q=80",
                            "size": "full",
                            "aspectRatio": "20:13",
                            "aspectMode": "cover"
                        },
                        "body": {
                            "type": "box",
                            "layout": "vertical",
                            "contents": [
                                {
                                    "type": "text",
                                    "text": "🐱 山腳貓首場團騎",
                                    "weight": "bold",
                                    "size": "sm",
                                    "color": "#1DB446"
                                },
                                {
                                    "type": "text",
                                    "text": "欣賞埤塘之美 🚴‍♂️",
                                    "weight": "bold",
                                    "size": "xl",
                                    "margin": "md",
                                    "color": "#2C3E50"
                                },
                                {
                                    "type": "box",
                                    "layout": "baseline",
                                    "contents": [
                                        {
                                            "type": "text",
                                            "text": "日期",
                                            "color": "#aaaaaa",
                                            "size": "sm",
                                            "flex": 2
                                        },
                                        {
                                            "type": "text",
                                            "text": "11/1（週日）早餐自理",
                                            "wrap": true,
                                            "color": "#666666",
                                            "size": "sm",
                                            "flex": 5
                                        }
                                    ],
                                    "margin": "lg"
                                },
                                {
                                    "type": "box",
                                    "layout": "baseline",
                                    "contents": [
                                        {
                                            "type": "text",
                                            "text": "集合點",
                                            "color": "#aaaaaa",
                                            "size": "sm",
                                            "flex": 2
                                        },
                                        {
                                            "type": "text",
                                            "text": "07:00 中山國小\n07:45 機捷老街溪站 (長頸鹿旁)",
                                            "wrap": true,
                                            "color": "#666666",
                                            "size": "sm",
                                            "flex": 5
                                        }
                                    ],
                                    "margin": "md"
                                }
                            ]
                        },
                        "footer": {
                            "type": "box",
                            "layout": "vertical",
                            "contents": [
                                {
                                    "type": "button",
                                    "style": "primary",
                                    "height": "sm",
                                    "action": {
                                        "type": "uri",
                                        "label": "查看詳細資訊",
                                        "uri": window.location.href
                                    },
                                    "color": "#2C3E50"
                                }
                            ]
                        }
                    }
                }
            ]).then(function (res) {
                if (res) {
                    alert("行程分享成功！");
                } else {
                    // 使用者取消分享
                    console.log("TargetPicker was closed.");
                }
            }).catch(function (error) {
                alert("分享失敗：" + JSON.stringify(error));
            });
        }
    </script>
</body>
</html>
