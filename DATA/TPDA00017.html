// ===== 工具 =====
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");

function roundsHtml(rs){
  return rs.map(([t,c])=>`<div class="round ${c}">${c==="W"?"✔ ":c==="L"?"✘ ":"－ "}${esc(zh(t))}</div>`).join("");
}
function koCards(list){
  return list.map(([e,p,rs,res,cls])=>`
    <div class="card">
      <span class="badge ${cls}">${res}</span>
      <h3>${esc(e)}</h3>
      <div class="tag">選手：${esc(zh(p))}</div>
      <div style="margin-top:8px">${roundsHtml(rs)}</div>
    </div>`).join("");
}

// 勝負統計
function stat(key){
  let w=0,l=0;
  D.forEach(m=>{
    const inP = m[4].includes(key), inO = m[7].includes(key);
    if(inP) m[5]?w++:l++;
    else if(inO) m[5]?l++:w++;
  });
  return [w,l];
}

// ===== 繪製 =====
function renderMedal(){
  const medals = [...MAIN.filter(x=>x[3].startsWith("🥉")), ...CONS.slice(0,2)];
  $("tab-medal").innerHTML = `<h2>🏅 得獎與亮點</h2>
    <div class="note">圖例：<b class="W">✔ 綠色＝勝</b>　<b class="L">✘ 紅色＝敗</b>　（同時用符號與文字標示，方便辨識）</div>
    <div style="height:14px"></div>` + koCards(medals) +
    `<div class="note">📌 說明：中文姓名以中華台北報名名單為準；外國選手保留英文原名。</div>`;
}
function renderPlayers(){
  $("tab-players").innerHTML = `<h2>👥 選手個人戰績</h2><div class="grid">` +
    PLAYERS.map(([k,evs,best,hl])=>{
      const [w,l]=stat(k);
      return `<div class="card">
        <h3 style="font-size:1.35rem">${esc(zh(k))}</h3>
        <div class="small">${esc(k)}</div>
        <div class="tag">項目：${esc(evs)}</div>
        <div style="margin:8px 0"><span class="badge plain">總戰績 ${w} 勝 ${l} 敗</span></div>
        <div><b>最佳成績：</b>${esc(best)}</div>
        <div style="margin-top:6px">${esc(hl)}</div>
        <button class="btn-pm" data-k="${esc(k)}" style="margin-top:10px;padding:8px 14px;border:3px solid #1e3a8a;background:#fff;color:#1e3a8a;border-radius:10px;font-weight:700;cursor:pointer">看這位選手的所有比賽 →</button>
      </div>`;
    }).join("") + `</div>`;
  document.querySelectorAll(".btn-pm").forEach(b=>b.onclick=()=>{
    $("f-player").value=b.dataset.k; $("f-date").value=""; $("f-stage").value=""; $("f-res").value="";
    renderDaily(); show("daily"); window.scrollTo(0,0);
  });
}
function renderDaily(){
  const p=$("f-player").value, d=$("f-date").value, s=$("f-stage").value, r=$("f-res").value;
  const list = D.filter(m=>
    (!p || m[4].includes(p)) && (!d || m[0]===d) && (!s || m[3]===s) && (r==="" || String(m[5])===r));
  const w=list.filter(m=>m[5]).length;
  $("d-count").textContent = `共 ${list.length} 場（${w} 勝 ${list.length-w} 敗）`;
  const stName={G:"小組賽",C:"安慰賽",M:"主賽淘汰賽"};
  $("d-list").innerHTML = list.length ? list.map(m=>`
    <div class="m ${m[5]?"win":"loss"}">
      <div><span class="res ${m[5]?"w":"l"}">${m[5]?"勝":"敗"} ${m[6]}</span>
        <span class="badge plain" style="margin-left:8px;padding:0 10px">${stName[m[3]]}</span></div>
      <div style="margin-top:6px"><b>${esc(zh(m[4]))}</b></div>
      <div>對手：${esc(zh(m[7]))}</div>
      <div class="small">${m[0]} ${m[1]}・${esc(ev(m[2]))}</div>
      <div class="small">各局比分：${esc(m[8])}</div>
    </div>`).join("") : `<div class="card">找不到符合條件的比賽。</div>`;
}

function show(t){
  ["medal","main","cons","players","daily"].forEach(x=>{
    $("tab-"+x).classList.toggle("hide",x!==t);
  });
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));
}

// ===== 初始化 =====
$("tab-main").innerHTML = `<h2>🏆 主賽淘汰賽成績</h2>` + koCards(MAIN);
$("tab-cons").innerHTML = `<h2>🛡️ 安慰賽淘汰賽成績</h2>` + koCards(CONS);
$("kpi-total").textContent = D.length + " 場";
$("f-player").innerHTML = `<option value="">全部選手</option>` +
  PLAYERS.map(([k])=>`<option value="${esc(k)}">${esc(zh(k))}</option>`).join("");
renderMedal(); renderPlayers(); renderDaily();

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.tab));
["f-player","f-date","f-stage","f-res"].forEach(id=>$(id).onchange=renderDaily);
document.querySelectorAll(".sizebar button").forEach(b=>b.onclick=()=>{
  document.documentElement.style.setProperty("--fs", b.dataset.fs+"px");
  document.querySelectorAll(".sizebar button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");
});
</script>
