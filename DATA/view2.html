<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>長者友善網頁預覽與儲存平台</title>
    <!-- 引入 Tailwind CSS 進行快速美化 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-size: 18px; background-color: #f3f4f6; color: #1f2937; }
        .big-btn { font-size: 20px; padding: 14px 24px; border-radius: 12px; font-weight: bold; transition: all 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .big-btn:active { transform: scale(0.98); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- 頂部標題區 (高對比、大字體) -->
        <header class="bg-blue-800 text-white p-6 rounded-2xl shadow-lg flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-3xl md:text-4xl font-extrabold tracking-wide">👵 輕鬆看網頁平台</h1>
                <p class="text-blue-200 mt-1 text-lg">貼上程式碼，立刻變成漂亮網頁，還能加上密碼安全保存！</p>
            </div>
            <div class="flex gap-3 w-full md:w-auto">
                <button onclick="openCloudList()" class="big-btn bg-emerald-600 hover:bg-emerald-700 text-white w-full md:w-auto">📂 我的雲端檔案</button>
            </div>
        </header>

        <!-- 主要操作區：左右分欄 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            
            <!-- 左側：程式碼輸入區 -->
            <div class="bg-white p-6 rounded-2xl shadow-md flex flex-col space-y-4 border-2 border-gray-200">
                <div class="flex justify-between items-center">
                    <label class="text-2xl font-bold text-gray-800">📝 1. 輸入網頁標題與程式碼</label>
                    <button onclick="loadSample()" class="text-blue-600 hover:underline font-bold text-lg">載入範例</button>
                </div>
                
                <input type="text" id="pageTitle" placeholder="請輸入網頁名稱（例如：我的快樂農場）" 
                       class="w-full text-xl p-4 border-2 border-gray-300 rounded-xl focus:border-blue-500 focus:outline-none">

                <textarea id="codeEditor" placeholder="請在此貼上 HTML / CSS 程式碼..." 
                          class="w-full h-80 font-mono text-base p-4 border-2 border-gray-300 rounded-xl focus:border-blue-500 focus:outline-none leading-relaxed"></textarea>

                <div class="flex flex-col sm:flex-row gap-4 pt-2">
                    <button onclick="updatePreview()" class="big-btn bg-blue-600 hover:bg-blue-700 text-white flex-1">
                        👀 立即預覽網頁
                    </button>
                    <button onclick="openSaveModal()" class="big-btn bg-amber-600 hover:bg-amber-700 text-white flex-1">
                        💾 儲存到雲端
                    </button>
                </div>
            </div>

            <!-- 右側：即時預覽區 -->
            <div class="bg-white p-6 rounded-2xl shadow-md flex flex-col space-y-4 border-2 border-gray-200">
                <div class="flex justify-between items-center">
                    <label class="text-2xl font-bold text-gray-800">📺 2. 網頁顯示畫面</label>
                    <span class="text-sm bg-green-100 text-green-800 px-3 py-1 rounded-full font-semibold">即時更新</span>
                </div>
                
                <div class="w-full h-[400px] border-4 border-gray-300 rounded-xl overflow-hidden bg-white shadow-inner">
                    <iframe id="previewFrame" class="w-full h-full"></iframe>
                </div>
                
                <div class="text-gray-500 text-base text-center bg-gray-50 p-3 rounded-xl border">
                    💡 提示：點擊左側「立即預覽網頁」按鈕，畫面就會在這裡呈現！
                </div>
            </div>

        </div>

    </div>

    <!-- 儲存彈跳視窗（含密碼設定） -->
    <div id="saveModal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white p-8 rounded-2xl max-w-md w-full shadow-2xl space-y-6">
            <h3 class="text-2xl font-bold text-gray-800">🔒 設定檔案密碼（選填）</h3>
            <p class="text-gray-600 text-base">若您希望保護這個檔案不被其他人隨意修改或開啟，請設定密碼；若不需要密碼，直接點選確認即可。</p>
            
            <div>
                <label class="block font-bold text-gray-700 mb-2">檔案解鎖密碼：</label>
                <input type="password" id="savePassword" placeholder="若不設密碼請保持空白" 
                       class="w-full text-xl p-4 border-2 border-gray-300 rounded-xl focus:border-blue-500 focus:outline-none">
            </div>

            <input type="hidden" id="currentFileId" value="">

            <div class="flex gap-4 pt-2">
                <button onclick="closeSaveModal()" class="big-btn bg-gray-300 hover:bg-gray-400 text-gray-800 flex-1">取消</button>
                <button onclick="executeSave()" class="big-btn bg-emerald-600 hover:bg-emerald-700 text-white flex-1">確認儲存</button>
            </div>
        </div>
    </div>

    <!-- 雲端檔案列表彈跳視窗 -->
    <div id="listModal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white p-8 rounded-2xl max-w-2xl w-full shadow-2xl space-y-6 max-h-[80vh] flex flex-col">
            <div class="flex justify-between items-center">
                <h3 class="text-2xl font-bold text-gray-800">📂 您的雲端網頁清單</h3>
                <button onclick="closeCloudList()" class="text-gray-500 hover:text-black font-bold text-2xl">✕</button>
            </div>
            
            <div id="fileListContainer" class="overflow-y-auto flex-1 space-y-3 divide-y divide-gray-100 pr-2">
                <!-- 動態載入檔案列表 -->
                <p class="text-center text-gray-500 py-8">正在載入雲端檔案...</p>
            </div>

            <button onclick="closeCloudList()" class="big-btn bg-gray-200 hover:bg-gray-300 text-gray-800 w-full">關閉視窗</button>
        </div>
    </div>

    <!-- 密碼輸入解鎖視窗 -->
    <div id="passwordModal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white p-8 rounded-2xl max-w-md w-full shadow-2xl space-y-6">
            <h3 class="text-2xl font-bold text-gray-800">🔑 此檔案受密碼保護</h3>
            <p class="text-gray-600 text-base" id="unlockFileName">請輸入密碼以開啟此網頁：</p>
            
            <input type="password" id="unlockPasswordInput" placeholder="請輸入密碼" 
                   class="w-full text-xl p-4 border-2 border-gray-300 rounded-xl focus:border-blue-500 focus:outline-none">

            <div class="flex gap-4 pt-2">
                <button onclick="closePasswordModal()" class="big-btn bg-gray-300 hover:bg-gray-400 text-gray-800 flex-1">取消</button>
                <button onclick="executeUnlock()" class="big-btn bg-blue-600 hover:bg-blue-700 text-white flex-1">解鎖開啟</button>
            </div>
        </div>
    </div>

    <!-- JavaScript 互動邏輯 -->
    <script>
        // *** 請將此處替換為您的 GAS 網頁應用程式網址 ***
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwtzJEstrhaBpXC_zAb3EocQPLHy5wOd1ANIfr9YpiH8ibVR5uFEUH3LhEtOkw5LbLp/exec";

        let targetFileIdToOpen = null;

        // 載入簡易範例
        function loadSample() {
            document.getElementById('pageTitle').value = "歡迎來到我的網頁";
            document.getElementById('codeEditor').value = `<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: sans-serif; text-align: center; padding: 40px; background: #e0f2fe; }
        h1 { color: #0369a1; font-size: 36px; }
        p { font-size: 20px; color: #334155; }
        .box { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="box">
        <h1>🌟 你好！這是範例網頁</h1>
        <p>長者友善平台讓您輕鬆預覽與分享程式碼。</p>
    </div>
</body>
</html>`;
            updatePreview();
        }

        // 更新預覽畫面
        function updatePreview() {
            const code = document.getElementById('codeEditor').value;
            const iframe = document.getElementById('previewFrame');
            const blob = new Blob([code], { type: 'text/html;charset=utf-8' });
            iframe.src = URL.createObjectURL(blob);
        }

        // 開啟儲存對話框
        function openSaveModal() {
            const code = document.getElementById('codeEditor').value.trim();
            if (!code) {
                alert("請先輸入網頁程式碼再儲存！");
                return;
            }
            document.getElementById('savePassword').value = "";
            document.getElementById('saveModal').classList.remove('hidden');
        }

        function closeSaveModal() {
            document.getElementById('saveModal').classList.add('hidden');
        }

        // 執行儲存至 GAS
        async function executeSave() {
            const title = document.getElementById('pageTitle').value.trim() || "未命名網頁";
            const code = document.getElementById('codeEditor').value;
            const password = document.getElementById('savePassword').value;
            const fileId = document.getElementById('currentFileId').value;

            const payload = {
                action: "save",
                id: fileId ? fileId : undefined,
                title: title,
                code: code,
                password: password
            };

            showLoading(true);
            try {
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                if (result.status === "success") {
                    alert("✅ 儲存成功！");
                    document.getElementById('currentFileId').value = result.id;
                    closeSaveModal();
                } else {
                    alert("❌ 儲存失敗：" + result.message);
                }
            } catch (err) {
                alert("連線發生錯誤：" + err);
            } finally {
                showLoading(false);
            }
        }

        // 開啟雲端檔案清單
        async function openCloudList() {
            document.getElementById('listModal').classList.remove('hidden');
            const container = document.getElementById('fileListContainer');
            container.innerHTML = `<p class="text-center text-gray-500 py-8">正在讀取雲端清單...</p>`;

            try {
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "list" })
                });
                const result = await response.json();
                
                if (result.status === "success") {
                    if (result.list.length === 0) {
                        container.innerHTML = `<p class="text-center text-gray-500 py-8">目前沒有儲存任何網頁檔案。</p>`;
                        return;
                    }
                    
                    let html = "";
                    result.list.forEach(file => {
                        let lockBadge = file.hasPassword ? `<span class="bg-red-100 text-red-700 px-2 py-1 rounded text-sm font-bold ml-2">🔒 有密碼</span>` : `<span class="bg-gray-100 text-gray-600 px-2 py-1 rounded text-sm ml-2">公開</span>`;
                        html += `
                            <div class="flex justify-between items-center p-4 hover:bg-gray-50 rounded-xl border border-gray-200">
                                <div>
                                    <h4 class="text-xl font-bold text-gray-800">${file.title} ${lockBadge}</h4>
                                    <p class="text-sm text-gray-500 mt-1">更新時間：${file.updatedAt}</p>
                                </div>
                                <button onclick="requestOpenFile('${file.id}', '${file.title.replace(/'/g, "\\'")}', ${file.hasPassword})" 
                                        class="big-btn bg-blue-600 hover:bg-blue-700 text-white text-base py-2 px-4">
                                    開啟
                                </button>
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                } else {
                    container.innerHTML = `<p class="text-center text-red-500 py-8">讀取失敗</p>`;
                }
            } catch (err) {
                container.innerHTML = `<p class="text-center text-red-500 py-8">網路連線異常</p>`;
            }
        }

        function closeCloudList() {
            document.getElementById('listModal').classList.add('hidden');
        }

        // 點選開啟檔案（檢查是否需要密碼）
        function requestOpenFile(id, title, hasPassword) {
            targetFileIdToOpen = id;
            if (hasPassword) {
                document.getElementById('unlockFileName').innerText = `檔案「${title}」受到密碼保護，請輸入密碼：`;
                document.getElementById('unlockPasswordInput').value = "";
                document.getElementById('passwordModal').classList.remove('hidden');
            } else {
                fetchAndOpenFile(id, "");
            }
        }

        function closePasswordModal() {
            document.getElementById('passwordModal').classList.add('hidden');
        }

        function executeUnlock() {
            const pwd = document.getElementById('unlockPasswordInput').value;
            closePasswordModal();
            fetchAndOpenFile(targetFileIdToOpen, pwd);
        }

        // 從雲端取得檔案內容
        async function fetchAndOpenFile(id, password) {
            showLoading(true);
            try {
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "load", id: id, password: password })
                });
                const result = await response.json();
                
                if (result.status === "success") {
                    document.getElementById('pageTitle').value = result.title;
                    document.getElementById('codeEditor').value = result.code;
                    document.getElementById('currentFileId').value = id;
                    updatePreview();
                    closeCloudList();
                    alert("📂 檔案開啟成功！");
                } else {
                    alert("❌ " + result.message);
                }
            } catch (err) {
                alert("連線錯誤：" + err);
            } finally {
                showLoading(false);
            }
        }

        function showLoading(isLoading) {
            // 可在此加入讀取中的特效或提示
        }

        // 頁面初次載入時自動帶入範例
        window.onload = function() {
            loadSample();
        };
    </script>
</body>
</html>
