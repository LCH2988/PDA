<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網頁程式碼預覽平台</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .code-font {
            font-family: 'Fira Code', monospace;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-full flex flex-col overflow-hidden">

    <!-- Header / Navigation Bar -->
    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex flex-wrap items-center justify-between gap-4 shrink-0 shadow-md">
        <div class="flex items-center space-x-3">
            <div class="bg-gradient-to-tr from-indigo-500 to-violet-500 text-white p-2.5 rounded-xl shadow-lg flex items-center justify-center">
                <i class="fa-solid fa-code text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg tracking-tight bg-gradient-to-r from-white via-slate-200 to-indigo-300 bg-clip-text text-transparent">CodePeek</h1>
                <p class="text-xs text-slate-400 hidden sm:block">即時網頁程式碼預覽平台</p>
            </div>
        </div>

        <!-- Toolbar / Action Buttons -->
        <div class="flex items-center flex-wrap gap-2.5">
            <!-- Sample Selectors -->
            <div class="flex items-center bg-slate-800/80 rounded-lg p-1 border border-slate-700/60 text-xs">
                <span class="text-slate-400 px-2 font-medium hidden md:inline">範例：</span>
                <button onclick="loadSample('hello')" class="px-2.5 py-1.5 rounded-md hover:bg-slate-700 text-slate-300 hover:text-white transition font-medium">Hello World</button>
                <button onclick="loadSample('counter')" class="px-2.5 py-1.5 rounded-md hover:bg-slate-700 text-slate-300 hover:text-white transition font-medium">簡易計數器</button>
                <button onclick="loadSample('card')" class="px-2.5 py-1.5 rounded-md hover:bg-slate-700 text-slate-300 hover:text-white transition font-medium">美觀卡片</button>
            </div>

            <!-- Live Sync Toggle -->
            <label class="flex items-center cursor-pointer bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700/60 select-none">
                <input type="checkbox" id="liveSyncToggle" checked class="sr-only peer" onchange="toggleLiveSync()">
                <div class="w-8 h-4 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-indigo-600 relative mr-2"></div>
                <span class="text-xs font-medium text-slate-300">即時同步</span>
            </label>

            <!-- Run Button -->
            <button id="runBtn" onclick="updatePreview()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow-lg shadow-indigo-600/30 transition flex items-center space-x-2">
                <i class="fa-solid fa-play text-xs"></i>
                <span>執行預覽</span>
            </button>

            <!-- Layout Switcher (Desktop only option or responsive) -->
            <div class="hidden lg:flex bg-slate-800/80 rounded-lg p-1 border border-slate-700/60">
                <button onclick="setLayout('horizontal')" id="layoutHBtn" title="左右分割" class="p-1.5 px-2.5 rounded text-indigo-400 bg-slate-700/80 transition text-xs">
                    <i class="fa-solid fa-columns"></i>
                </button>
                <button onclick="setLayout('vertical')" id="layoutVBtn" title="上下分割" class="p-1.5 px-2.5 rounded text-slate-400 hover:text-white transition text-xs">
                    <i class="fa-solid fa-square-full fa-rotate-90"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Workspace Container -->
    <main id="workspace" class="flex-1 flex flex-col lg:flex-row overflow-hidden relative">

        <!-- Left Pane: Code Editor -->
        <section id="editorPane" class="flex-1 flex flex-col bg-slate-900 border-b lg:border-b-0 lg:border-r border-slate-800 min-h-[250px] lg:min-h-0 relative">
            <div class="bg-slate-900/90 px-4 py-2 border-b border-slate-800/80 flex items-center justify-between shrink-0">
                <div class="flex items-center space-x-2 text-xs font-semibold text-slate-400 uppercase tracking-wider">
                    <i class="fa-regular fa-file-code text-indigo-400"></i>
                    <span>HTML / CSS / JS 程式碼編輯器</span>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="clearEditor()" class="text-xs text-slate-400 hover:text-rose-400 transition flex items-center space-x-1 px-2 py-1 rounded hover:bg-slate-800">
                        <i class="fa-solid fa-trash-can"></i>
                        <span>清除</span>
                    </button>
                    <button onclick="copyCode()" class="text-xs text-slate-400 hover:text-indigo-400 transition flex items-center space-x-1 px-2 py-1 rounded hover:bg-slate-800">
                        <i class="fa-regular fa-copy"></i>
                        <span>複製</span>
                    </button>
                </div>
            </div>
            
            <!-- Textarea container -->
            <div class="flex-1 relative">
                <textarea id="codeEditor" 
                    class="w-full h-full bg-slate-950 text-slate-200 code-font p-4 text-sm resize-none focus:outline-none leading-relaxed" 
                    placeholder="在此貼上您的 HTML、CSS 或 JavaScript 程式碼..."
                    oninput="handleInput()"></textarea>
            </div>
            <div class="bg-slate-900/60 px-4 py-1.5 border-t border-slate-800 text-[11px] text-slate-500 flex justify-between items-center shrink-0">
                <span id="charCount">字元數：0</span>
                <span>支援完整的 HTML5、Tailwind、樣式與腳本</span>
            </div>
        </section>

        <!-- Right Pane: Preview Iframe -->
        <section id="previewPane" class="flex-1 flex flex-col bg-slate-900 min-h-[250px] lg:min-h-0 relative">
            <div class="bg-slate-900/90 px-4 py-2 border-b border-slate-800/80 flex items-center justify-between shrink-0">
                <div class="flex items-center space-x-2 text-xs font-semibold text-slate-400 uppercase tracking-wider">
                    <i class="fa-solid fa-eye text-emerald-400"></i>
                    <span>即時預覽畫布</span>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="refreshPreview()" title="重新整理預覽" class="text-xs text-slate-400 hover:text-emerald-400 transition p-1.5 rounded hover:bg-slate-800">
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>
                    <button onclick="openInNewTab()" title="在新分頁開啟" class="text-xs text-slate-400 hover:text-indigo-400 transition p-1.5 rounded hover:bg-slate-800">
                        <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    </button>
                </div>
            </div>
            
            <!-- Iframe Container -->
            <div class="flex-1 bg-white relative">
                <iframe id="previewFrame" class="w-full h-full border-0" sandbox="allow-scripts allow-modals allow-forms allow-same-origin"></iframe>
            </div>
        </section>

    </main>

    <!-- Custom Notification Toast -->
    <div id="toast" class="fixed bottom-6 right-6 bg-slate-800 text-slate-200 px-4 py-2.5 rounded-xl shadow-2xl border border-slate-700 text-sm transform translate-y-20 opacity-0 transition-all duration-300 flex items-center space-x-2 z-50">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMsg">通知訊息</span>
    </div>

    <!-- Script Logic -->
    <script>
        // Sample templates
        const samples = {
            hello: `<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Hello World 範例</title>
    <script src="https://cdn.tailwindcss.com"><\/script>
</head>
<body class="bg-slate-50 flex items-center justify-center h-screen m-0">
    <div class="text-center p-8 bg-white shadow-xl rounded-2xl border border-slate-100 max-w-md mx-4">
        <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">
            👋
        </div>
        <h1 class="text-2xl font-bold text-slate-800 mb-2">Hello World!</h1>
        <p class="text-slate-600 text-sm mb-6">這是一個使用 Tailwind CSS 的簡單網頁範例。您可以隨意修改左側的程式碼來即時查看效果！</p>
        <button onclick="alertMe()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-5 py-2.5 rounded-xl transition shadow-lg shadow-indigo-600/30">
            點我互動
        </button>
    </div>

    <script>
        function alertMe() {
            alert('太棒了！您的 JavaScript 互動正常運作！');
        }
    <\/script>
</body>
</html>`,
            counter: `<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>簡易計數器</title>
    <script src="https://cdn.tailwindcss.com"><\/script>
</head>
<body class="bg-gradient-to-br from-slate-900 to-indigo-950 text-white flex items-center justify-center h-screen m-0">
    <div class="bg-slate-900/80 backdrop-blur-md p-8 rounded-3xl border border-slate-800 shadow-2xl text-center w-80">
        <h2 class="text-lg font-semibold text-indigo-400 mb-4">互動計數器</h2>
        <div id="count" class="text-6xl font-extrabold mb-6 text-white tracking-tight">0</div>
        <div class="flex justify-center space-x-3">
            <button onclick="adjust(-1)" class="w-12 h-12 bg-slate-800 hover:bg-slate-700 text-xl font-bold rounded-xl transition border border-slate-700">-</button>
            <button onclick="reset()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-sm font-semibold rounded-xl transition border border-slate-700">歸零</button>
            <button onclick="adjust(1)" class="w-12 h-12 bg-indigo-600 hover:bg-indigo-500 text-xl font-bold rounded-xl transition shadow-lg shadow-indigo-600/30">+</button>
        </div>
    </div>

    <script>
        let value = 0;
        function adjust(amount) {
            value += amount;
            document.getElementById('count').innerText = value;
        }
        function reset() {
            value = 0;
            document.getElementById('count').innerText = value;
        }
    <\/script>
</body>
</html>`,
            card: `<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>精美個人名片範例</title>
    <script src="https://cdn.tailwindcss.com"><\/script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 flex items-center justify-center h-screen m-0">
    <div class="bg-white rounded-3xl shadow-xl overflow-hidden max-w-sm w-full mx-4 border border-slate-200">
        <div class="h-32 bg-gradient-to-r from-violet-500 to-indigo-600 relative"></div>
        <div class="px-6 pb-6 pt-0 text-center relative">
            <div class="w-24 h-24 rounded-full border-4 border-white shadow-md mx-auto -mt-12 overflow-hidden bg-slate-200 mb-4">
                <img src="https://placehold.co/150x150/4f46e5/ffffff?text=Avatar" alt="頭像" class="w-full h-full object-cover">
            </div>
            <h2 class="text-xl font-bold text-slate-800">張小明</h2>
            <p class="text-indigo-600 text-sm font-medium mb-3">前端工程師 & UI/UX 設計師</p>
            <p class="text-slate-500 text-xs mb-6 leading-relaxed">熱愛簡潔流暢的網頁介面開發，專注於打造極致的使用者體驗。</p>
            <div class="flex justify-center space-x-3 mb-6">
                <a href="#" class="w-10 h-10 rounded-xl bg-slate-100 hover:bg-indigo-50 text-slate-600 hover:text-indigo-600 flex items-center justify-center transition"><i class="fa-brands fa-github"></i></a>
                <a href="#" class="w-10 h-10 rounded-xl bg-slate-100 hover:bg-indigo-50 text-slate-600 hover:text-indigo-600 flex items-center justify-center transition"><i class="fa-brands fa-twitter"></i></a>
                <a href="#" class="w-10 h-10 rounded-xl bg-slate-100 hover:bg-indigo-50 text-slate-600 hover:text-indigo-600 flex items-center justify-center transition"><i class="fa-brands fa-linkedin-in"></i></a>
            </div>
            <button class="w-full py-3 bg-slate-900 hover:bg-slate-800 text-white rounded-xl font-medium text-sm transition shadow-md">
                與我聯絡
            </button>
        </div>
    </div>
</body>
</html>`
        };

        let isLiveSync = true;
        let debounceTimer = null;

        // Initialize with Hello World sample
        window.addEventListener('DOMContentLoaded', () => {
            loadSample('hello');
        });

        // Load sample into editor
        function loadSample(key) {
            if (samples[key]) {
                const editor = document.getElementById('codeEditor');
                editor.value = samples[key];
                updateCharCount();
                updatePreview();
                showToast(`已載入範例模板`);
            }
        }

        // Handle text area input and live sync debounce
        function handleInput() {
            updateCharCount();
            if (isLiveSync) {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    updatePreview();
                }, 300);
            }
        }

        // Update character count
        function updateCharCount() {
            const code = document.getElementById('codeEditor').value;
            document.getElementById('charCount').innerText = `字元數：${code.length}`;
        }

        // Render preview into iframe
        function updatePreview() {
            const code = document.getElementById('codeEditor').value;
            const iframe = document.getElementById('previewFrame');
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            doc.open();
            doc.write(code);
            doc.close();
        }

        // Manual refresh button
        function refreshPreview() {
            updatePreview();
            showToast('預覽已重新整理');
        }

        // Toggle Live Sync
        function toggleLiveSync() {
            isLiveSync = document.getElementById('liveSyncToggle').checked;
            showToast(isLiveSync ? '已開啟即時同步' : '已關閉即時同步');
        }

        // Clear Editor
        function clearEditor() {
            if (confirm('確定要清除所有程式碼嗎？')) {
                document.getElementById('codeEditor').value = '';
                updateCharCount();
                updatePreview();
                showToast('編輯器已清空');
            }
        }

        // Copy Code
        function copyCode() {
            const code = document.getElementById('codeEditor').value;
            const textarea = document.createElement('textarea');
            textarea.value = code;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('程式碼已複製到剪貼簿');
            } catch (err) {
                showToast('複製失敗', 'error');
            }
            document.body.removeChild(textarea);
        }

        // Open preview in new tab
        function openInNewTab() {
            const code = document.getElementById('codeEditor').value;
            const blob = new Blob([code], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            window.open(url, '_blank');
        }

        // Layout switcher (Horizontal / Vertical)
        function setLayout(mode) {
            const workspace = document.getElementById('workspace');
            const hBtn = document.getElementById('layoutHBtn');
            const vBtn = document.getElementById('layoutVBtn');

            if (mode === 'horizontal') {
                workspace.className = 'flex-1 flex flex-col lg:flex-row overflow-hidden relative';
                hBtn.className = 'p-1.5 px-2.5 rounded text-indigo-400 bg-slate-700/80 transition text-xs';
                vBtn.className = 'p-1.5 px-2.5 rounded text-slate-400 hover:text-white transition text-xs';
            } else {
                workspace.className = 'flex-1 flex flex-col lg:flex-col overflow-hidden relative';
                vBtn.className = 'p-1.5 px-2.5 rounded text-indigo-400 bg-slate-700/80 transition text-xs';
                hBtn.className = 'p-1.5 px-2.5 rounded text-slate-400 hover:text-white transition text-xs';
            }
        }

        // Toast notification system
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.innerText = message;
            if (type === 'error') {
                toastIcon.className = 'fa-solid fa-circle-exclamation text-rose-400';
            } else {
                toastIcon.className = 'fa-solid fa-circle-check text-emerald-400';
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }
    </script>
</body>
</html>
