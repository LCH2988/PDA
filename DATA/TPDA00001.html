<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健康守護與關懷網 - 首頁</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
        }
        /* 針對年長者特別加強聚焦外框 */
        button:focus, a:focus {
            outline: 4px solid #EA580C;
        }
    </style>
</head>
<body class="bg-amber-50/40 text-slate-900 min-h-screen flex flex-col">

    <!-- 頂部輔助工具列：字體放大、語音說明 -->
    <div class="bg-slate-900 text-white py-3 px-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <span class="text-lg md:text-xl font-bold flex items-center">
                <span class="inline-block w-3 h-3 bg-emerald-500 rounded-full mr-2"></span>
                長輩友善專區
            </span>
            <div class="flex space-x-3">
                <!-- 字體放大按鈕 -->
                <button onclick="toggleFontSize()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-2 rounded-xl text-lg md:text-xl shadow-md transition active:scale-95 flex items-center">
                    🔍 <span id="sizeText" class="ml-1">字體放大</span>
                </button>
                <!-- 語音朗讀按鈕 -->
                <button onclick="speakWelcome()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-xl text-lg md:text-xl shadow-md transition active:scale-95 flex items-center">
                    🔊 <span class="ml-1">語音說明</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 主標題區 -->
    <header class="bg-white py-8 px-6 text-center border-b-4 border-blue-600 shadow-sm">
        <div class="max-w-3xl mx-auto">
            <h1 id="main-title" class="text-3xl md:text-5xl font-black text-blue-900 tracking-tight leading-tight">
                台灣帕金森之友協會
            </h1>
            <p id="sub-title" class="text-xl md:text-2xl text-slate-600 mt-3 font-bold">
                歡迎您！請點選下方大按鈕使用服務
            </p>
        </div>
    </header>

    <!-- 主要功能按鈕區（超大、易點擊） -->
    <main class="flex-grow max-w-4xl mx-auto px-4 py-8 w-full">
        
        <div id="content-area" class="grid grid-cols-1 gap-6">
            
            <!-- 功能 1：最新活動（www） -->
            <a href="https://www.pda.org.tw" class="bg-white hover:bg-blue-50 border-4 border-blue-600 rounded-3xl p-6 md:p-8 shadow-lg transition transform hover:-translate-y-1 active:translate-y-0 flex flex-col md:flex-row items-center text-center md:text-left">
                <div class="text-5xl md:text-6xl mb-4 md:mb-0 md:mr-6 bg-blue-100 p-4 rounded-2xl text-blue-700">
                    📅
                </div>
                <div>
                    <h2 class="text-2xl md:text-3xl font-black text-blue-900">1. 看最新活動公告</h2>
                    <p class="text-lg md:text-xl text-slate-600 mt-2 font-bold leading-relaxed">
                        點這裡看協會最近有什麼好玩的活動、健康講座，歡迎一起來參加！
                    </p>
                </div>
            </a>

            <!-- 功能 2：健康追蹤與會員系統（app） -->
            <a href="https://app.pda.org.tw" class="bg-white hover:bg-emerald-50 border-4 border-emerald-600 rounded-3xl p-6 md:p-8 shadow-lg transition transform hover:-translate-y-1 active:translate-y-0 flex flex-col md:flex-row items-center text-center md:text-left">
                <div class="text-5xl md:text-6xl mb-4 md:mb-0 md:mr-6 bg-emerald-100 p-4 rounded-2xl text-emerald-700">
                    💪
                </div>
                <div>
                    <h2 class="text-2xl md:text-3xl font-black text-emerald-900">2. 填寫健康紀錄 / 會員登入</h2>
                    <p class="text-lg md:text-xl text-slate-600 mt-2 font-bold leading-relaxed">
                        點這裡可以記錄您今天的身體狀況，或是查詢您的會員資料與收據。
                    </p>
                </div>
            </a>

            <!-- 功能 3：愛心捐款（愛心碼） -->
            <div class="bg-white border-4 border-orange-500 rounded-3xl p-6 md:p-8 shadow-lg flex flex-col items-center">
                <div class="text-5xl md:text-6xl mb-4 bg-orange-100 p-4 rounded-2xl text-orange-600">
                    ❤️
                </div>
                <div class="text-center w-full">
                    <h2 class="text-2xl md:text-3xl font-black text-orange-900">3. 順手捐發票，愛心好簡單</h2>
                    <p class="text-lg md:text-xl text-slate-600 mt-2 font-bold leading-relaxed max-w-2xl mx-auto">
                        去超商或超市買東西時，跟店員說我要捐發票，並給店員看下方的條碼即可！
                    </p>
                    
                    <!-- 條碼顯示區 -->
                    <div class="mt-6 bg-slate-50 p-6 rounded-2xl border-2 border-dashed border-slate-300 inline-block">
                        <p class="text-xl font-black text-slate-700 mb-2">協會專屬愛心碼：<span class="text-orange-600 text-2xl">52099</span></p>
                        <!-- 模擬條碼 -->
                        <div class="bg-white p-4 rounded border border-slate-200 flex flex-col items-center">
                            <div class="h-16 w-64 bg-[repeating-linear-gradient(90deg,#000,#000_2px,#fff_2px,#fff_8px)]"></div>
                            <span class="font-mono text-xl tracking-widest mt-2 font-bold">5 2 0 9 9</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </main>

    <!-- 頁尾聯絡資訊 -->
    <footer class="bg-slate-900 text-white text-center py-8 px-4 mt-8 border-t-4 border-orange-500">
        <div class="max-w-3xl mx-auto">
            <p class="text-xl font-bold mb-2">📞 撥打電話給協會尋求幫助：</p>
            <a href="tel:02-1234-5678" class="inline-block bg-orange-600 hover:bg-orange-700 text-white text-2xl font-black px-6 py-3 rounded-2xl shadow-md mb-4">
                撥打電話：(02) 1234-5678
            </a>
            <p class="text-slate-400 text-base">地址：台北市中正區幸福路 100 號</p>
        </div>
    </footer>

    <!-- 互動 JavaScript -->
    <script>
        let isLarge = false;
        
        // 字體放大縮小切換
        function toggleFontSize() {
            const contentArea = document.getElementById('content-area');
            const mainTitle = document.getElementById('main-title');
            const subTitle = document.getElementById('sub-title');
            const sizeText = document.getElementById('sizeText');
            
            if (!isLarge) {
                // 放大
                contentArea.classList.add('text-2xl');
                mainTitle.classList.replace('text-3xl', 'text-4xl');
                mainTitle.classList.replace('text-5xl', 'text-6xl');
                subTitle.classList.replace('text-xl', 'text-2xl');
                subTitle.classList.replace('text-2xl', 'text-3xl');
                sizeText.innerText = "還原字體";
                isLarge = true;
            } else {
                // 還原
                contentArea.classList.remove('text-2xl');
                mainTitle.classList.replace('text-4xl', 'text-3xl');
                mainTitle.classList.replace('text-6xl', 'text-5xl');
                subTitle.classList.replace('text-2xl', 'text-xl');
                subTitle.classList.replace('text-3xl', 'text-2xl');
                sizeText.innerText = "字體放大";
                isLarge = false;
            }
        }

        // 語音朗讀功能 (TTS)
        function speakWelcome() {
            if ('speechSynthesis' in window) {
                // 先停止目前正在播放的語音
                window.speechSynthesis.cancel();
                
                const text = "歡迎來到台灣帕金森之友協會。畫面上第一個藍色大按鈕是看最新活動公告，第二個綠色大按鈕是填寫健康紀錄與會員登入，第三個橘色區域是我們的愛心捐贈碼。如果有任何問題，歡迎點擊最下方的橘色按鈕撥打電話給協會，我們很樂意為您服務。";
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-TW';
                utterance.rate = 0.85; // 稍微放慢語速，方便長輩聽懂
                window.speechSynthesis.speak(utterance);
            } else {
                alert("您的瀏覽器不支援語音朗讀功能，建議使用 Chrome 瀏覽器。");
            }
        }
    </script>

</body>
</html>
