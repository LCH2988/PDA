<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者後台 - 網頁建立與分享平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-size: 18px; background-color: #f3f4f6; color: #1f2937; }
        .big-btn { font-size: 20px; padding: 14px 24px; border-radius: 12px; font-weight: bold; transition: all 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .big-btn:active { transform: scale(0.98); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- 頂部標題列 -->
        <header class="bg-blue-900 text-white p-6 rounded-2xl shadow-lg flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-3xl font-extrabold">⚙️ 管理者專用平台</h1>
                <p class="text-blue-200 mt-1">建立網頁、設定密碼、指定權限並取得單一分享連結。</p>
            </div>
            <button onclick="openNewFileForm()" class="big-btn bg-emerald-600 hover:bg-emerald-700 text-white">
                ➕ 建立新網頁
            </button>
        </header>

        <!-- 主體區域：左側清單 / 右側編輯區 -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- 左側：所有檔案清單與分享管理 -->
            <div class="bg-white p-6 rounded-2xl shadow-md lg:col-span-1 space-y-4 border-2 border-gray-200">
                <h2 class="text-2xl font-bold text-gray-800">📂 檔案資料庫</h2>
                <div id="adminFileList" class="space-y-3 max-h-[600px] overflow-y-auto pr-2">
                    <p class="text-gray-500 text-center py-8">正在載入清單...</p>
                </div>
            </div>

            <!-- 右側：編輯與設定區 -->
            <div class="bg-white p-6 rounded-2xl shadow-md lg:col-span-2 space-y-4 border-2 border-gray-200" id="editorSection">
                <div class="flex justify-between items-center">
                    <h2 class="text-2xl font-bold text-gray-800" id="editorTitle">📝 編輯網頁內容</h2>
                    <button onclick="loadSample()" class="text-blue-600 hover:underline font-bold text-lg">載入範例</button>
                </div>

                <input type="hidden" id="fileId" value="">

                <div>
                    <label class="block font-bold text-gray-700 mb-1">網頁標題：</label>
                    <input type="text" id="pageTitle" placeholder="例如：長者健康操指南" 
                           class="w-full text-xl p-3 border-2 border-gray-300 rounded-xl focus:border-blue-500 focus:outline-none">
                </div>

                <div>
                    <label class="block font-bold text-gray-700 mb-1">HTML 程式碼：</label>
                    <textarea id="codeEditor" placeholder="請在此貼上或編寫 HTML 程式碼..." 
                              class="w-full h-64 font-mono text-sm p-4 border-2 border-gray-300 rounded-xl focus:border-blue-500 focus:outline-none leading-relaxed"></textarea>
                </div>

                <!-- 權限與密碼設定區 -->
                <div class="bg-gray-50 p-4 rounded-xl border space-y-4">
                    <h3 class="text-xl font-bold text-gray-800">🔒 安全與分享設定</h3>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block font-bold text-gray-700 mb-1">設定存取密碼（選填）：</label>
                            <input type="password" id="filePassword" placeholder="留空代表無密碼" 
                                   class="w-full text-lg p-3 border-2 border-gray-300 rounded-xl focus:outline-none">
                        </div>
                        <div>
                            <label class="block font-bold text-gray-700 mb-1">公開狀態：</label>
                            <select id="isPublicSelect" class="w-full text-lg p-3 border-2 border-gray-300 rounded-xl bg-white focus:outline-none">
                                <option value="true">🌐 完全公開（所有人可見）</option>
                                <option value="false">🔒 僅限指定授權者可見</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block font-bold text-gray-700 mb-1">指定授權使用者代號/信箱（多個請用逗號隔開）：</label>
                        <input type="text" id="allowedUsersInput" placeholder="例如：user01@gmail.com, user02" 
                               class="w-full text-lg p-3 border-2 border-gray-300 rounded-xl focus:outline-none">
                    </div>
                </div>

                <div class="flex gap-4 pt-2">
                    <button onclick="saveFile()" class="big-btn bg-blue-600 hover:bg-blue-700 text-white flex-1">
                        💾 儲存並更新檔案
                    </button>
                </div>
            </div>

        </div>

    </div>

    <!-- 分享連結彈跳視窗 -->
    <div id="shareModal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white p-8 rounded-2xl max-w-lg w-full shadow-2xl space-y-6 text-center">
            <h3 class="text-2xl font-bold text-gray-800">🔗 單一檔案分享連結</h3>
            <p class="text-gray-600 text-base">您可以將以下專屬連結複製並傳送給使用者：</p>
            
            <input type="text" id="shareLinkInput" readonly 
                   class="w-full text-base p-4 bg-gray-100 border-2 border-gray-300 rounded-xl text-center select-all font-mono">

            <div class="flex gap-4">
                <button onclick="copyShareLink()" class="big-btn bg-emerald-600 hover:bg-emerald-700 text-white flex-1">📋 複製連結</button>
                <button onclick="closeShareModal()" class="big-btn bg-gray-300 hover:bg-gray-400 text-gray-800 flex-1">關閉</button>
            </div>
        </div>
    </div>

    <script>
        // *** 請將此處替換為您的 GAS 網頁應用程式網址 ***
        const GAS_URL = "https://script.google.com/macros/s/AKfycbztHGh49wQsli6vyYSjnzq5g6iKc0lx_9I_30a-EeQ0bspRnfEkIdRrSvegWkfkatv-9A/exec";

        window.onload = function() {
            loadAdminFiles();
        };

        // 載入管理者檔案清單
        async function loadAdminFiles() {
            const container = document.getElementById('adminFileList');
            container.innerHTML = `<p class="text-gray-500 text-center py-8">載入中...</p>`;

            try {
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "list", role: "admin" })
                });
                const result = await response.json();

                if (result.status === "success") {
                    if (result.list.length === 0) {
                        container.innerHTML = `<p class="text-gray-500 text-center py-8">尚未建立任何檔案。</p>`;
                        return;
                    }

                    let html = "";
                    result.list.forEach(file => {
                        let lockBadge = file.hasPassword ? `<span class="bg-red-100 text-red-700 px-2 py-0.5 rounded text-xs font-bold">🔒 密碼</span>` : ``;
                        let publicBadge = file.isPublic ? `<span class="bg-green-100 text-green-700 px-2 py-0.5 rounded text-xs">公開</span>` : `<span class="bg-purple-100 text-purple-700 px-2 py-0.5 rounded text-xs">指定</span>`;
                        
                        html += `
                            <div class="p-3 bg-gray-50 hover:bg-blue-50 rounded-xl border border-gray-200 space-y-2">
                                <div class="flex justify-between items-start">
                                    <h4 class="font-bold text-gray-800 text-lg">${file.title}</h4>
                                    <div class="flex gap-1">${lockBadge} ${publicBadge}</div>
                                </div>
                                <div class="flex gap-2 pt-1">
                                    <button onclick="editFile('${file.id}')" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-sm font-bold flex-1">編輯</button>
                                    <button onclick="showShareLink('${file.id}')" class="bg-amber-500 hover:bg-amber-600 text-black px-3 py-1.5 rounded-lg text-sm font-bold flex-1">分享</button>
                                </div>
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                }
            } catch (err) {
                container.innerHTML = `<p class="text-red-500 text-center py-8">連線失敗</p>`;
            }
        }

        // 開啟新檔案表單
        function openNewFileForm() {
            document.getElementById('fileId').value = "";
            document.getElementById('pageTitle').value = "";
            document.getElementById('codeEditor').value = "";
            document.getElementById('filePassword').value = "";
            document.getElementById('isPublicSelect').value = "true";
            document.getElementById('allowedUsersInput').value = "";
            document.getElementById('editorTitle').innerText = "📝 建立新網頁檔案";
        }

        // 載入特定檔案進行編輯
        async function editFile(id) {
            try {
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "load", id: id, password: "" })
                });
                const result = await response.json();
                
                if (result.status === "success") {
                    document.getElementById('fileId').value = id;
                    document.getElementById('pageTitle').value = result.title;
                    document.getElementById('codeEditor').value = result.code;
                    document.getElementById('filePassword').value = result.hasPassword ? "********" : ""; // 遮罩提示
                    document.getElementById('isPublicSelect').value = result.isPublic !== false ? "true" : "false";
                    document.getElementById('allowedUsersInput').value = result.allowedUsers || "";
                    document.getElementById('editorTitle').innerText = `📝 編輯檔案：${result.title}`;
                } else {
                    alert("載入失敗：" + result.message);
                }
            } catch (err) {
                alert("連線錯誤");
            }
        }

        // 儲存檔案
        async function saveFile() {
            const id = document.getElementById('fileId').value;
            const title = document.getElementById('pageTitle').value.trim() || "未命名網頁";
            const code = document.getElementById('codeEditor').value;
            const password = document.getElementById('filePassword').value;
            const isPublic = document.getElementById('isPublicSelect').value === "true";
            const allowedUsers = document.getElementById('allowedUsersInput').value;

            if (!code) {
                alert("請填入網頁程式碼！");
                return;
            }

            const payload = {
                action: "save",
                id: id ? id : undefined,
                title: title,
                code: code,
                password: password === "********" ? undefined : password, // 若未修改密碼則不覆蓋
                isPublic: isPublic,
                allowedUsers: allowedUsers
            };

            try {
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                if (result.status === "success") {
                    alert("✅ 檔案儲存成功！");
                    document.getElementById('fileId').value = result.id;
                    loadAdminFiles();
                } else {
                    alert("❌ 儲存失敗：" + result.message);
                }
            } catch (err) {
                alert("連線發生錯誤：" + err);
            }
        }

        // 顯示單一檔案分享連結
        function showShareLink(id) {
            // 自動帶入目前網頁所在網域與 view.html 的路徑，並夾帶 id
            const currentBaseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
            const shareUrl = `${currentBaseUrl}view.html?id=${id}`;
            
            document.getElementById('shareLinkInput').value = shareUrl;
            document.getElementById('shareModal').classList.remove('hidden');
        }

        function closeShareModal() {
            document.getElementById('shareModal').classList.add('hidden');
        }

        function copyShareLink() {
            const input = document.getElementById('shareLinkInput');
            input.select();
            input.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(input.value);
            alert("📋 已成功複製分享連結！");
        }

        function loadSample() {
            document.getElementById('pageTitle').value = "活力健康操網頁";
            document.getElementById('codeEditor').value = `<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>body{font-family:sans-serif;text-align:center;padding:50px;background:#f0fdf4;}h1{color:#15803d;font-size:36px;}</style></head>
<body>
    <h1>🌟 每日健康操</h1>
    <p style="font-size:22px;">伸展雙手，深呼吸，迎接美好的一天！</p>
</body>
</html>`;
        }
    </script>
</body>
</html>
