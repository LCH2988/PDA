<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理者後台</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{font-size:18px;background:#f3f4f6;color:#1f2937}
  .big-btn{font-size:18px;padding:12px 20px;border-radius:12px;font-weight:bold;box-shadow:0 4px 6px rgba(0,0,0,.1)}
  .inp{width:100%;font-size:18px;padding:10px;border:2px solid #d1d5db;border-radius:12px}
</style>
</head>
<body class="min-h-screen p-4 md:p-8">
<div class="max-w-7xl mx-auto space-y-6">

  <header class="bg-blue-900 text-white p-6 rounded-2xl flex flex-wrap justify-between items-center gap-3">
    <h1 class="text-3xl font-extrabold">⚙️ 管理者專用平台</h1>
    <div class="flex flex-wrap gap-2 items-center">
      <button data-act="newPage" class="big-btn bg-emerald-600 hover:bg-emerald-700">➕ 建立網頁</button>
      <div class="flex items-center gap-1 bg-indigo-700 rounded-xl pl-3">
        <span class="text-base">上傳到</span>
        <select id="uploadCat" class="text-gray-900 text-base rounded-lg p-2 m-1"></select>
        <button data-act="pickFile" class="big-btn bg-indigo-500 hover:bg-indigo-600">⬆️ 上傳檔案</button>
      </div>
      <button data-act="newFolder" class="big-btn bg-teal-600 hover:bg-teal-700">📁 新增資料夾</button>
      <button data-act="openCats" class="big-btn bg-amber-500 hover:bg-amber-600">🏷️ 管理類別</button>
      <button data-act="openUsers" class="big-btn bg-green-500 hover:bg-green-600">👥 LINE 授權使用者</button>
    </div>
    <input type="file" id="fileInput" class="hidden" multiple>
  </header>

  <div id="uploadBox" class="hidden bg-white p-4 rounded-2xl border-2 space-y-2"></div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <!-- 左:清單 -->
    <div class="bg-white p-5 rounded-2xl border-2 space-y-3">
      <h2 class="text-2xl font-bold">📂 檔案資料庫</h2>
      <select id="catFilter" class="inp bg-white"></select>
      <input id="searchInput" class="inp" placeholder="🔍 搜尋標題、檔名、內容關鍵字">
      <div id="folderBar" class="space-y-2"></div>
      <div id="fileList" class="space-y-3 max-h-[640px] overflow-y-auto pr-1"></div>
    </div>

    <!-- 右:編輯 -->
    <div class="bg-white p-5 rounded-2xl border-2 space-y-4 lg:col-span-2">
      <div class="flex justify-between items-center">
        <h2 class="text-2xl font-bold" id="editorTitle">📝 建立新網頁</h2>
        <button data-act="sample" class="text-blue-600 font-bold hover:underline">載入範例</button>
      </div>
      <input type="hidden" id="fileId">
      <input type="hidden" id="fileType" value="page">

      <div class="grid md:grid-cols-3 gap-4">
        <div class="md:col-span-3">
          <label class="font-bold">標題:</label>
          <input id="pageTitle" class="inp" placeholder="例如:長者健康操指南">
        </div>
        <div class="md:col-span-1">
          <label class="font-bold">類別:</label>
          <select id="fileCategory" class="inp bg-white"></select>
        </div>
        <div class="md:col-span-2">
          <label class="font-bold">所在資料夾:</label>
          <select id="fileFolder" class="inp bg-white"></select>
        </div>
      </div>

      <div id="codeBox" class="space-y-2">
        <div class="bg-sky-50 border-2 border-sky-200 rounded-xl p-3">
          <div class="font-bold mb-1">① 請先選擇內文格式:</div>
          <div class="flex flex-wrap gap-6">
            <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="contentMode" value="html" checked class="w-5 h-5"> 🧩 HTML 程式碼</label>
            <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="contentMode" value="text" class="w-5 h-5"> 📝 純文字(直接貼文字,自動排版)</label>
          </div>
        </div>
        <label class="font-bold" id="codeLabel">HTML 程式碼:</label>
        <textarea id="codeEditor" class="inp h-56 font-mono text-sm"></textarea>
        <div class="text-sm text-gray-500" id="codeCount"></div>
        <button data-act="previewEditor" class="big-btn bg-sky-600 hover:bg-sky-700 text-white">👁️ 預覽目前內容</button>
      </div>
      <div id="fileInfoBox" class="hidden bg-gray-50 p-3 rounded-xl border text-base"></div>

      <!-- 附件 -->
      <div class="bg-gray-50 p-4 rounded-xl border space-y-2">
        <div class="flex justify-between items-center gap-2">
          <h3 class="text-xl font-bold">📎 附件(不限格式與大小)</h3>
          <button data-act="pickAtt" class="big-btn bg-indigo-500 hover:bg-indigo-600 text-white">➕ 新增附件</button>
        </div>
        <input type="file" id="attInput" class="hidden" multiple>
        <div id="attStatus" class="space-y-1"></div>
        <div id="attList" class="space-y-2"></div>
        <p class="text-sm text-gray-500">附件上傳完成後,需按下方「💾 儲存」才會正式綁定;從清單移除並儲存後,Drive 檔案會移到垃圾桶。</p>
      </div>

      <div class="bg-gray-50 p-4 rounded-xl border space-y-3">
        <h3 class="text-xl font-bold">🔒 安全與分享設定</h3>
        <div class="grid md:grid-cols-2 gap-4">
          <div>
            <label class="font-bold">存取密碼:<span id="pwState" class="text-sm text-gray-500"></span></label>
            <input type="password" id="filePassword" class="inp" placeholder="輸入新密碼;留空＝不變更" autocomplete="new-password">
            <label class="text-base flex items-center gap-2 mt-1">
              <input type="checkbox" id="clearPassword" class="w-5 h-5"> 移除密碼(改為無密碼)
            </label>
          </div>
          <div>
            <label class="font-bold">公開狀態:</label>
            <select id="isPublic" class="inp bg-white">
              <option value="true">🌐 完全公開</option>
              <option value="false">🔒 僅限 LINE 綁定且被授權者</option>
            </select>
          </div>
        </div>
        <div>
          <label class="font-bold">授權使用者(代號,逗號分隔):</label>
          <input id="allowedUsers" class="inp" placeholder="點下方標籤加入">
          <div id="userChips" class="flex flex-wrap gap-2 mt-2"></div>
        </div>
      </div>

      <div class="flex gap-3">
        <button data-act="save" class="big-btn bg-blue-600 hover:bg-blue-700 text-white flex-1">💾 儲存</button>
        <button data-act="deleteCurrent" class="big-btn bg-red-600 hover:bg-red-700 text-white">🗑️ 刪除</button>
      </div>
    </div>
  </div>
</div>

<!-- 預覽 Modal -->
<div id="previewModal" class="hidden fixed inset-0 bg-black/70 z-50 p-4 flex items-center justify-center">
  <div class="bg-white rounded-2xl w-full max-w-5xl h-[90vh] flex flex-col">
    <div class="flex justify-between items-center p-3 border-b">
      <b id="previewTitle" class="text-xl"></b>
      <button data-act="closeModal" data-target="previewModal" class="big-btn bg-gray-300">✖ 關閉</button>
    </div>
    <div id="previewBody" class="flex-1 min-h-0"></div>
  </div>
</div>

<!-- 分享 Modal -->
<div id="shareModal" class="hidden fixed inset-0 bg-black/60 z-50 p-4 flex items-center justify-center">
  <div class="bg-white p-6 rounded-2xl max-w-lg w-full space-y-3">
    <h3 class="text-2xl font-bold text-center">🔗 分享連結</h3>
    <div>
      <label class="font-bold">檔名:</label>
      <input id="shareName" readonly class="inp bg-gray-100 text-base">
    </div>
    <div>
      <label class="font-bold">連結:</label>
      <input id="shareLink" readonly class="inp bg-gray-100 text-base font-mono">
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <button data-act="copyShareAll" class="big-btn bg-emerald-600 text-white">📋 複製檔名＋連結</button>
      <button data-act="copyShare" class="big-btn bg-sky-600 text-white">🔗 只複製連結</button>
    </div>
    <button data-act="closeModal" data-target="shareModal" class="big-btn bg-gray-300 w-full">關閉</button>
  </div>
</div>

<!-- 移動 Modal -->
<div id="moveModal" class="hidden fixed inset-0 bg-black/60 z-50 p-4 flex items-center justify-center">
  <div class="bg-white p-6 rounded-2xl max-w-md w-full space-y-3">
    <h3 class="text-2xl font-bold break-all" id="moveWhat">移動到</h3>
    <select id="moveTarget" class="inp bg-white"></select>
    <div class="grid grid-cols-2 gap-3">
      <button data-act="confirmMove" class="big-btn bg-teal-600 text-white">確定移動</button>
      <button data-act="closeModal" data-target="moveModal" class="big-btn bg-gray-300">取消</button>
    </div>
  </div>
</div>

<!-- 類別 Modal -->
<div id="catsModal" class="hidden fixed inset-0 bg-black/60 z-50 p-4 flex items-center justify-center">
  <div class="bg-white p-6 rounded-2xl max-w-xl w-full max-h-[90vh] overflow-y-auto space-y-4">
    <div class="flex justify-between items-center">
      <h3 class="text-2xl font-bold">🏷️ 檔案類別</h3>
      <button data-act="closeModal" data-target="catsModal" class="big-btn bg-gray-300">✖</button>
    </div>
    <div class="flex gap-2">
      <input id="newCatName" class="inp" placeholder="新增類別(例如:健康操、公告)">
      <button data-act="addCat" class="big-btn bg-emerald-600 text-white whitespace-nowrap">新增</button>
    </div>
    <div id="catTable" class="space-y-2"></div>
    <p class="text-sm text-gray-500">刪除類別後,該類別的檔案會移到「未分類」,檔案本身不會被刪除。</p>
  </div>
</div>

<!-- 使用者 Modal -->
<div id="usersModal" class="hidden fixed inset-0 bg-black/60 z-50 p-4 flex items-center justify-center">
  <div class="bg-white p-6 rounded-2xl max-w-3xl w-full max-h-[90vh] overflow-y-auto space-y-4">
    <div class="flex justify-between items-center">
      <h3 class="text-2xl font-bold">👥 LINE 授權使用者</h3>
      <button data-act="closeModal" data-target="usersModal" class="big-btn bg-gray-300">✖</button>
    </div>
    <p class="text-base text-gray-600">① 建立代號 → ② 把「綁定連結」傳給對方 → ③ 對方用 LINE 登入後即綁定完成 → ④ 在檔案的授權名單加入該代號。</p>
    <div class="flex gap-2">
      <input id="newUserLabel" class="inp" placeholder="新增使用者代號(例如:王奶奶)">
      <button data-act="addUser" class="big-btn bg-emerald-600 text-white whitespace-nowrap">新增</button>
    </div>
    <div id="userTable" class="space-y-2"></div>
  </div>
</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbwPQGjZP9HX_2wva_yEhnj3DnT_g9_jv9szqHyeGYv3wbCzEXPq4cb0-OW5QbvWfY5KsA/exec"; // ← 換成新部署的網址
const CHUNK = 8 * 1024 * 1024; // 必須是 256KB 的倍數
const UNCAT = "__none__";
const CODE_CELL = 45000;       // 需與後端一致

let ADMIN_KEY = sessionStorage.getItem("adminKey") || prompt("請輸入管理者金鑰:") || "";
sessionStorage.setItem("adminKey", ADMIN_KEY);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtSize = n => { n = +n || 0; const u=["B","KB","MB","GB","TB"]; let i=0; while(n>=1024&&i<4){n/=1024;i++} return n.toFixed(i?1:0)+" "+u[i]; };
const baseUrl = () => location.href.split("?")[0].replace(/[^/]*$/, "");

async function api(p) {
  const r = await fetch(GAS_URL, { method: "POST", headers: {"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify({ ...p, adminKey: ADMIN_KEY }) });
  const j = await r.json();
  if (j.code === "NO_ADMIN") { sessionStorage.removeItem("adminKey"); alert("管理者金鑰錯誤,請重新整理後再輸入"); }
  return j;
}

let users = [], listCache = [], cats = [], searchTimer, listSeq = 0;
let atts = [], uploading = 0;
let folders = [], curFolder = "", moveCtx = null;

/* ---------- 類別 ---------- */
function catOptions(withAll, withUncat) {
  let h = "";
  if (withAll) h += `<option value="">📂 全部類別</option>`;
  if (withUncat) h += `<option value="${UNCAT}">(未分類)</option>`;
  return h + cats.map(c => `<option value="${esc(c)}">🏷️ ${esc(c)}</option>`).join("");
}
function fillSelect(el, html, fallback) {
  const old = el.value;
  el.innerHTML = html;
  el.value = [...el.options].some(o => o.value === old) ? old : fallback;
}
function refreshCatSelects() {
  const opts = `<option value="">(未分類)</option>` + cats.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join("");
  fillSelect($("catFilter"), catOptions(true, true), "");
  fillSelect($("fileCategory"), opts, "");
  fillSelect($("uploadCat"), opts, "");
}
async function loadCats() {
  const r = await api({ action: "catList" });
  if (r.status === "success") cats = r.cats || [];
  refreshCatSelects();
  renderCatTable();
}
function renderCatTable() {
  const cnt = {};
  listCache.forEach(f => { const k = f.category || ""; cnt[k] = (cnt[k] || 0) + 1; });
  $("catTable").innerHTML = cats.map(c => `
    <div class="p-3 border rounded-xl flex justify-between items-center gap-2" data-cat="${esc(c)}">
      <b class="break-all">🏷️ ${esc(c)}</b>
      <div class="flex items-center gap-2 shrink-0">
        <span class="text-sm text-gray-500">${cnt[c] || 0} 個檔案</span>
        <button data-act="delCat" class="bg-red-600 text-white px-3 py-1.5 rounded-lg text-sm font-bold">刪除</button>
      </div>
    </div>`).join("") || `<p class="text-gray-500 text-center">尚無類別,請先新增</p>`;
}

/* ---------- 雲端資料夾 ---------- */
const fById = id => folders.find(f => f.id === id);
const byName = (a, b) => a.name.localeCompare(b.name, "zh-Hant");
function folderPath(id) {
  const p = []; let f = fById(id), n = 0;
  while (f && n++ < 20) { p.unshift(f); f = fById(f.parent); }
  return p;
}
function descendants(id) {
  const out = [id];
  for (let i = 0; i < out.length; i++) folders.filter(f => f.parent === out[i]).forEach(f => out.push(f.id));
  return out;
}
function folderOptions(exclude = []) {
  const out = [`<option value="">📁 根目錄</option>`];
  (function walk(pid, depth) {
    folders.filter(f => f.parent === pid && !exclude.includes(f.id)).sort(byName).forEach(f => {
      out.push(`<option value="${esc(f.id)}">${"　".repeat(depth)}📁 ${esc(f.name)}</option>`);
      walk(f.id, depth + 1);
    });
  })("", 0);
  return out.join("");
}
function renderFolderBar() {
  const bar = $("folderBar");
  if ($("searchInput").value.trim()) {
    bar.innerHTML = `<div class="text-sm text-gray-500">🔍 搜尋中,顯示所有資料夾的結果</div>`; return;
  }
  const crumbs = [`<button data-act="openFolder" data-fid="" class="underline text-blue-700">🏠 根目錄</button>`]
    .concat(folderPath(curFolder).map(f => `<button data-act="openFolder" data-fid="${esc(f.id)}" class="underline text-blue-700 break-all">${esc(f.name)}</button>`));
  const subs = folders.filter(f => f.parent === curFolder).sort(byName);
  const cnt = id => listCache.filter(x => (x.folderId || "") === id).length;
  bar.innerHTML = `
    <div class="flex flex-wrap items-center gap-1 text-base">${crumbs.join(" <span>›</span> ")}</div>
    ${subs.map(f => `
      <div class="p-2 bg-teal-50 border border-teal-200 rounded-xl flex justify-between items-center gap-2" data-fid="${esc(f.id)}">
        <button data-act="openFolder" class="font-bold text-left break-all flex-1">📁 ${esc(f.name)} <span class="text-sm font-normal text-gray-500">(${cnt(f.id)} 個檔案)</span></button>
        <div class="flex gap-1 shrink-0 text-xs font-bold">
          <button data-act="renameFolder" class="bg-amber-500 px-2 py-1 rounded">改名</button>
          <button data-act="moveFolder" class="bg-teal-600 text-white px-2 py-1 rounded">移動</button>
          <button data-act="delFolder" class="bg-red-600 text-white px-2 py-1 rounded">刪除</button>
        </div>
      </div>`).join("")}`;
}
async function loadFolders() {
  const r = await api({ action: "folderList" });
  if (r.status === "success") folders = r.folders || [];
  if (curFolder && !fById(curFolder)) curFolder = "";
  fillSelect($("fileFolder"), folderOptions(), "");
  renderList();
}
async function folderCall(p) {
  const r = await api(p);
  if (r.status !== "success") { alert(r.message); return false; }
  await loadFolders(); return true;
}
function openMove(ctx, title, exclude) {
  moveCtx = ctx;
  $("moveWhat").textContent = title;
  $("moveTarget").innerHTML = folderOptions(exclude);
  $("moveTarget").value = ctx.current || "";
  $("moveModal").classList.remove("hidden");
}

/* ---------- 清單 ---------- */
function fileCard(f) {
  return `
    <div class="p-3 bg-gray-50 rounded-xl border space-y-2" data-id="${esc(f.id)}">
      <div class="flex justify-between gap-2">
        <h4 class="font-bold break-all">${f.type==="file"?"📎":"📄"} ${esc(f.title)}</h4>
        <div class="flex gap-1 shrink-0 h-fit">
          ${f.hasPassword?'<span class="bg-red-100 text-red-700 px-2 rounded text-xs">🔒密碼</span>':''}
          ${f.attCount ? `<span class="bg-indigo-100 text-indigo-700 px-2 rounded text-xs">📎${f.attCount}</span>` : ''}
          ${f.isPublic?'<span class="bg-green-100 text-green-700 px-2 rounded text-xs">公開</span>':'<span class="bg-purple-100 text-purple-700 px-2 rounded text-xs">指定</span>'}
        </div>
      </div>
      <div class="text-xs text-gray-500">${esc(f.updatedAt)} ${f.type==="file"?"・"+fmtSize(f.size):""}${$("searchInput").value.trim() && f.folderId ? "・📁 " + esc(folderPath(f.folderId).map(x => x.name).join(" / ")) : ""}</div>
      <div class="grid grid-cols-5 gap-1 text-sm font-bold">
        <button data-act="edit" class="bg-blue-600 text-white py-1.5 rounded-lg">編輯</button>
        <button data-act="preview" class="bg-sky-500 text-white py-1.5 rounded-lg">預覽</button>
        <button data-act="share" class="bg-amber-500 py-1.5 rounded-lg">分享</button>
        <button data-act="moveFile" class="bg-teal-600 text-white py-1.5 rounded-lg">移動</button>
        <button data-act="delete" class="bg-red-600 text-white py-1.5 rounded-lg">刪除</button>
      </div>
    </div>`;
}
function renderList() {
  renderFolderBar();
  const box = $("fileList"), flt = $("catFilter").value;
  let items = listCache;
  if (!$("searchInput").value.trim()) items = items.filter(f => (f.folderId || "") === curFolder); // 搜尋時不限資料夾
  if (flt === UNCAT) items = items.filter(f => !f.category);
  else if (flt) items = items.filter(f => f.category === flt);
  if (!items.length) { box.innerHTML = `<p class="text-center text-gray-500 py-6">沒有符合的檔案</p>`; return; }

  const groups = new Map();
  items.forEach(f => { const k = f.category || ""; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(f); });
  const order = [...cats.filter(c => groups.has(c)), ...[...groups.keys()].filter(k => k && !cats.includes(k))];
  if (groups.has("")) order.push("");
  box.innerHTML = order.map(k => `
    <div class="space-y-2">
      <div class="sticky top-0 bg-blue-50 text-blue-900 font-bold px-3 py-1 rounded-lg">
        ${k ? "🏷️ " + esc(k) : "(未分類)"} <span class="text-sm font-normal">· ${groups.get(k).length}</span>
      </div>
      ${groups.get(k).map(fileCard).join("")}
    </div>`).join("");
}
async function loadList() {
  const my = ++listSeq, box = $("fileList");
  box.innerHTML = `<p class="text-center text-gray-500 py-6">載入中...</p>`;
  try {
    const r = await api({ action: "list", role: "admin", keyword: $("searchInput").value.trim() });
    if (my !== listSeq) return;
    if (r.status !== "success") { box.innerHTML = `<p class="text-red-600 text-center">${esc(r.message)}</p>`; return; }
    listCache = r.list;
    renderList(); renderCatTable();
  } catch (e) { if (my === listSeq) box.innerHTML = `<p class="text-red-600 text-center">連線失敗</p>`; }
}

/* ---------- 內文模式 / 附件 ---------- */
const getMode = () => document.querySelector('input[name=contentMode]:checked').value;
function setMode(m) {
  document.querySelector(`input[name=contentMode][value="${m === "text" ? "text" : "html"}"]`).checked = true;
  applyModeUI();
}
function applyModeUI() {
  const t = getMode() === "text";
  $("codeLabel").textContent = t ? "文字內容(換行、網址會自動處理):" : "HTML 程式碼:";
  $("codeEditor").classList.toggle("font-mono", !t);
  $("codeEditor").placeholder = t ? "直接貼上或輸入文字…" : "貼上完整 HTML 程式碼…";
}
function updateCount() {
  const n = $("codeEditor").value.length;
  $("codeCount").textContent = n ? `${n.toLocaleString()} 字元` + (n > CODE_CELL ? `(將自動分成 ${Math.ceil(n / CODE_CELL)} 個儲存格儲存)` : "") : "";
}
function textToHtml(t) {
  const e = String(t || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/(https?:\/\/[^\s<>"]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  return `<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:sans-serif;font-size:20px;line-height:1.8;padding:24px;max-width:800px;margin:auto;white-space:pre-wrap;word-break:break-word;color:#1f2937}a{color:#2563eb}</style></head><body>${e}</body></html>`;
}
const renderCode = (mode, code) => mode === "text" ? textToHtml(code) : code;

function renderAtts() {
  $("attList").innerHTML = atts.map((a, i) => `
    <div class="flex justify-between items-center gap-2 p-2 bg-white border rounded-lg" data-idx="${i}">
      <span class="break-all">📎 ${esc(a.name)} <span class="text-sm text-gray-500">(${fmtSize(a.size)})</span></span>
      <button data-act="rmAtt" class="bg-red-600 text-white px-3 py-1 rounded-lg text-sm font-bold shrink-0">移除</button>
    </div>`).join("") || `<p class="text-gray-500 text-sm">尚無附件</p>`;
}

/* ---------- 編輯器 ---------- */
function resetEditor(type) {
  $("fileId").value = ""; $("fileType").value = type;
  $("pageTitle").value = ""; $("codeEditor").value = "";
  $("filePassword").value = ""; $("clearPassword").checked = false; $("pwState").textContent = "";
  $("isPublic").value = "true"; $("allowedUsers").value = "";
  setMode("html"); atts = []; renderAtts(); $("attStatus").innerHTML = ""; updateCount();
  const f = $("catFilter").value;
  $("fileCategory").value = (f && f !== UNCAT) ? f : "";
  $("fileFolder").value = curFolder;
  $("codeBox").classList.toggle("hidden", type === "file");
  $("fileInfoBox").classList.toggle("hidden", type !== "file");
  $("editorTitle").textContent = "📝 建立新網頁";
}

async function editFile(id) {
  const r = await api({ action: "loadAdmin", id });
  if (r.status !== "success") return alert("載入失敗:" + r.message);
  resetEditor(r.type);
  $("fileId").value = id;
  $("pageTitle").value = r.title;
  $("codeEditor").value = r.code || "";
  setMode(r.mode); atts = r.attachments || []; renderAtts(); updateCount();
  const c = r.category || "";
  if (c && ![...$("fileCategory").options].some(o => o.value === c))
    $("fileCategory").insertAdjacentHTML("beforeend", `<option value="${esc(c)}">${esc(c)}</option>`);
  $("fileCategory").value = c;
  $("fileFolder").value = r.folderId || "";
  $("isPublic").value = r.isPublic ? "true" : "false";
  $("allowedUsers").value = r.allowedUsers || "";
  $("pwState").textContent = r.hasPassword ? "(目前已設定密碼)" : "(目前無密碼)";
  $("editorTitle").textContent = "✏️ 編輯:" + r.title;
  if (r.type === "file") $("fileInfoBox").innerHTML =
    `📎 檔名:<b>${esc(r.fileName)}</b><br>類型:${esc(r.mimeType)}・大小:${fmtSize(r.size)}<br><span class="text-gray-500">(檔案內容無法在此修改,如需更換請上傳新檔後刪除舊檔)</span>`;
  scrollTo({ top: 0, behavior: "smooth" });
}

async function saveFile() {
  if (uploading > 0) return alert("附件仍在上傳中,請等待完成後再儲存");
  const type = $("fileType").value, code = $("codeEditor").value;
  if (type === "page" && !code.trim()) return alert("請填入網頁內容!");
  const pw = $("filePassword").value;
  const payload = {
    action: "save", id: $("fileId").value || undefined,
    title: $("pageTitle").value.trim() || "未命名網頁",
    category: $("fileCategory").value,
    folderId: $("fileFolder").value,
    code, mode: getMode(), attachments: atts,
    isPublic: $("isPublic").value === "true",
    allowedUsers: $("allowedUsers").value.trim(),
    password: pw || undefined, clearPassword: $("clearPassword").checked
  };
  const r = await api(payload);
  if (r.status !== "success") return alert("❌ 儲存失敗:" + r.message);
  alert("✅ 儲存成功!");
  $("fileId").value = r.id; $("filePassword").value = ""; $("clearPassword").checked = false;
  loadList(); editFile(r.id);
}

async function deleteFile(id, title) {
  if (!confirm(`確定要刪除「${title}」嗎?\n此動作無法復原(上傳檔案與附件會一併移到 Drive 垃圾桶)。`)) return;
  const r = await api({ action: "delete", id });
  if (r.status !== "success") return alert("刪除失敗:" + r.message);
  if ($("fileId").value === id) resetEditor("page");
  loadList();
}

/* ---------- 預覽 ---------- */
function openPreview(title, node) {
  $("previewTitle").textContent = title;
  $("previewBody").replaceChildren(node);
  $("previewModal").classList.remove("hidden");
}
function htmlFrame(code) {
  const f = document.createElement("iframe");
  f.className = "w-full h-full rounded-b-2xl";
  f.setAttribute("sandbox", "allow-scripts allow-forms allow-popups");
  f.srcdoc = code;
  return f;
}
async function previewById(id) {
  const r = await api({ action: "loadAdmin", id });
  if (r.status !== "success") return alert(r.message);
  if (r.type === "file") {
    const f = document.createElement("iframe");
    f.className = "w-full h-full"; f.src = `https://drive.google.com/file/d/${encodeURIComponent(r.driveId)}/preview`;
    openPreview(r.title, f);
  } else openPreview(r.title, htmlFrame(renderCode(r.mode, r.code)));
}

/* ---------- 分享 ---------- */
function openShare(id) {
  const f = listCache.find(x => x.id === id) || {};
  $("shareName").value = f.fileName || f.title || "";
  $("shareLink").value = `${baseUrl()}view.html?id=${encodeURIComponent(id)}`;
  $("shareModal").classList.remove("hidden");
}
async function copyText(text, okMsg) {
  try { await navigator.clipboard.writeText(text); alert(okMsg); }
  catch { prompt("請手動複製:", text); }
}

/* ---------- 上傳(分段直傳 Drive) ---------- */
function putChunk(url, blob, start, end, total, onProg) {
  return new Promise((ok, bad) => {
    const x = new XMLHttpRequest();
    x.open("PUT", url);
    x.setRequestHeader("Content-Range", `bytes ${start}-${end - 1}/${total}`);
    x.upload.onprogress = e => onProg(start + e.loaded);
    x.onload = () => (x.status === 308 || x.status === 200 || x.status === 201) ? ok(x) : bad(new Error("HTTP " + x.status));
    x.onerror = () => bad(new Error("網路錯誤"));
    x.send(blob);
  });
}
async function uploadToDrive(file, onProg) {
  const init = await api({ action: "initUpload", name: file.name, mime: file.type || "application/octet-stream",
    size: file.size, origin: location.origin });
  if (init.status !== "success") throw new Error(init.message);
  let last;
  for (let s = 0; s < file.size; s += CHUNK) {
    const e = Math.min(s + CHUNK, file.size);
    last = await putChunk(init.uploadUrl, file.slice(s, e), s, e, file.size, onProg);
  }
  if (last.status !== 200 && last.status !== 201) throw new Error("上傳未完成(HTTP " + last.status + ")");
  return { driveId: JSON.parse(last.responseText).id, autoName: init.autoName };
}
async function uploadOne(file, row, category, folderId) {
  const bar = row.querySelector(".bar"), txt = row.querySelector(".txt");
  const set = (done, msg) => { bar.style.width = (done / file.size * 100) + "%"; txt.textContent = msg; };
  if (file.size === 0) { txt.textContent = "❌ 空檔案無法上傳"; return; }
  try {
    const u = await uploadToDrive(file, d => set(d, `${fmtSize(d)} / ${fmtSize(file.size)}`));
    const fin = await api({ action: "finishUpload", driveId: u.driveId, autoName: u.autoName,
      title: u.autoName, mime: file.type, size: file.size, category, folderId });
    if (fin.status !== "success") throw new Error(fin.message);
    set(file.size, `✅ 完成:${u.autoName}`);
  } catch (e) { txt.textContent = "❌ 失敗:" + e.message; }
}
async function handleFiles(files) {
  const category = $("uploadCat").value, folderId = curFolder;
  const where = folderId ? folderPath(folderId).map(x => x.name).join(" / ") : "根目錄";
  const box = $("uploadBox"); box.classList.remove("hidden");
  for (const f of files) {
    const row = document.createElement("div");
    row.innerHTML = `<div class="text-base break-all">${esc(f.name)}(${fmtSize(f.size)})→ 📁 ${esc(where)}・${category ? "🏷️ " + esc(category) : "未分類"}</div>
      <div class="bg-gray-200 rounded h-3"><div class="bar bg-indigo-500 h-3 rounded" style="width:0"></div></div>
      <div class="txt text-sm text-gray-600">準備中...</div>`;
    box.appendChild(row);
    await uploadOne(f, row, category, folderId);
  }
  loadList();
}
async function handleAtts(files) {
  for (const f of files) {
    const row = document.createElement("div");
    row.className = "text-sm text-gray-700 break-all";
    row.textContent = `⏳ ${f.name} 準備中...`;
    $("attStatus").appendChild(row);
    if (f.size === 0) { row.textContent = `❌ ${f.name}:空檔案無法上傳`; continue; }
    uploading++;
    try {
      const r = await uploadToDrive(f, d => row.textContent = `⏳ ${f.name} ${fmtSize(d)} / ${fmtSize(f.size)}`);
      atts.push({ driveId: r.driveId, name: f.name, mime: f.type || "", size: f.size });
      renderAtts(); row.remove();
    } catch (e) { row.textContent = `❌ ${f.name} 失敗:${e.message}`; }
    finally { uploading--; }
  }
}

/* ---------- LINE 授權使用者 ---------- */
async function loadUsers() {
  const r = await api({ action: "userList" });
  if (r.status !== "success") return;
  users = r.users;
  $("userChips").innerHTML = users.map(u =>
    `<button type="button" data-act="chip" data-label="${esc(u.label)}" class="px-3 py-1 rounded-full text-base ${u.bound?'bg-green-100 text-green-800':'bg-gray-200 text-gray-600'}">${u.bound?'✅':'⏳'} ${esc(u.label)}</button>`).join("")
    || `<span class="text-gray-500 text-base">尚無使用者,請先到「LINE 授權使用者」新增</span>`;
  $("userTable").innerHTML = users.map(u => {
    const link = u.bindCode ? `${baseUrl()}view.html?bind=${u.bindCode}` : "";
    return `<div class="p-3 border rounded-xl space-y-1" data-label="${esc(u.label)}">
      <div class="flex justify-between flex-wrap gap-2">
        <b>${esc(u.label)}</b>
        <span>${u.bound ? `✅ 已綁定:${esc(u.lineName)}(${esc(u.boundAt)})` : "⏳ 尚未綁定"}</span>
      </div>
      ${link ? `<input readonly value="${esc(link)}" class="inp text-sm font-mono" onclick="this.select()">` : ""}
      <div class="flex gap-2 text-sm font-bold">
        ${u.bound ? '<button data-act="unbind" class="bg-amber-500 px-3 py-1.5 rounded-lg">解除綁定</button>' : ''}
        <button data-act="delUser" class="bg-red-600 text-white px-3 py-1.5 rounded-lg">刪除</button>
      </div></div>`;
  }).join("") || `<p class="text-gray-500 text-center">尚無使用者</p>`;
}

/* ---------- 事件委派 ---------- */
document.addEventListener("click", async ev => {
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  const card = b.closest("[data-id]"), id = card?.dataset.id;
  const title = card ? (listCache.find(x => x.id === id)?.title || "") : "";
  const label = b.closest("[data-label]")?.dataset.label;
  const catName = b.closest("[data-cat]")?.dataset.cat;
  const fid = b.closest("[data-fid]")?.dataset.fid;

  switch (act) {
    case "newPage": resetEditor("page"); break;
    case "pickFile": $("fileInput").click(); break;
    case "pickAtt": $("attInput").click(); break;
    case "rmAtt": atts.splice(+b.closest("[data-idx]").dataset.idx, 1); renderAtts(); break;
    case "sample":
      resetEditor("page");
      $("pageTitle").value = "活力健康操網頁";
      $("codeEditor").value = `<!DOCTYPE html>\n<html><head><meta charset="utf-8"><style>body{font-family:sans-serif;text-align:center;padding:50px;background:#f0fdf4}h1{color:#15803d}</style></head>\n<body><h1>🌟 每日健康操</h1><p style="font-size:22px">伸展雙手,深呼吸!</p></body></html>`;
      updateCount();
      break;
    case "previewEditor": openPreview($("pageTitle").value || "預覽", htmlFrame(renderCode(getMode(), $("codeEditor").value))); break;
    case "edit": editFile(id); break;
    case "preview": previewById(id); break;
    case "share": openShare(id); break;
    case "delete": deleteFile(id, title); break;
    case "deleteCurrent":
      if (!$("fileId").value) return alert("尚未選擇檔案");
      deleteFile($("fileId").value, $("pageTitle").value); break;
    case "save": saveFile(); break;
    case "copyShare": copyText($("shareLink").value, "📋 已複製連結"); break;
    case "copyShareAll": copyText(`${$("shareName").value}\n${$("shareLink").value}`, "📋 已複製檔名與連結"); break;
    case "closeModal": $(b.dataset.target).classList.add("hidden"); if (b.dataset.target==="previewModal") $("previewBody").replaceChildren(); break;

    /* 資料夾 */
    case "openFolder": curFolder = fid || ""; renderList(); break;
    case "newFolder": {
      const name = prompt("新資料夾名稱(將建立在目前所在位置):"); if (!name || !name.trim()) return;
      await folderCall({ action: "folderSave", name, parentId: curFolder }); break;
    }
    case "renameFolder": {
      const name = prompt("新名稱:", fById(fid)?.name || ""); if (!name || !name.trim()) return;
      await folderCall({ action: "folderRename", id: fid, name }); break;
    }
    case "moveFolder": {
      const f = fById(fid);
      openMove({ type: "folder", id: fid, current: f.parent }, `移動資料夾「${f.name}」到`, descendants(fid)); break;
    }
    case "delFolder":
      if (confirm(`刪除資料夾「${fById(fid)?.name}」?\n內部的檔案與子資料夾會移到上一層,不會被刪除。`)) {
        if (await folderCall({ action: "folderDelete", id: fid })) loadList();
      }
      break;
    case "moveFile": {
      const f = listCache.find(x => x.id === id);
      openMove({ type: "file", id, current: f?.folderId || "" }, `移動「${f?.title || ""}」到`, []); break;
    }
    case "confirmMove": {
      const target = $("moveTarget").value, c = moveCtx; if (!c) return;
      $("moveModal").classList.add("hidden");
      if (c.type === "folder") await folderCall({ action: "folderMove", id: c.id, parentId: target });
      else {
        const r = await api({ action: "fileMove", ids: [c.id], folderId: target });
        if (r.status !== "success") return alert(r.message);
        await loadList();
      }
      break;
    }

    /* 類別 */
    case "openCats": $("catsModal").classList.remove("hidden"); renderCatTable(); break;
    case "addCat": {
      const v = $("newCatName").value.trim(); if (!v) return;
      if (cats.includes(v)) return alert("此類別已存在");
      const r = await api({ action: "catSave", name: v });
      if (r.status !== "success") return alert(r.message);
      $("newCatName").value = ""; loadCats(); break;
    }
    case "delCat":
      if (confirm(`刪除類別「${catName}」?\n該類別的檔案會移到「未分類」。`)) {
        const r = await api({ action: "catDelete", name: catName });
        if (r.status !== "success") return alert(r.message);
        if ($("catFilter").value === catName) $("catFilter").value = "";
        await loadCats(); loadList();
      }
      break;

    /* 使用者 */
    case "openUsers": $("usersModal").classList.remove("hidden"); loadUsers(); break;
    case "addUser": {
      const v = $("newUserLabel").value.trim(); if (!v) return;
      const r = await api({ action: "userSave", label: v });
      if (r.status !== "success") return alert(r.message);
      $("newUserLabel").value = ""; loadUsers(); break;
    }
    case "unbind": if (confirm(`解除「${label}」的 LINE 綁定?將產生新的綁定連結。`)) { await api({ action: "userUnbind", label }); loadUsers(); } break;
    case "delUser": if (confirm(`刪除使用者「${label}」?`)) { await api({ action: "userDelete", label }); loadUsers(); } break;
    case "chip": {
      const cur = $("allowedUsers").value.split(",").map(s => s.trim()).filter(Boolean);
      const l = b.dataset.label;
      $("allowedUsers").value = (cur.includes(l) ? cur.filter(x => x !== l) : [...cur, l]).join(", ");
      break;
    }
  }
});

$("fileInput").addEventListener("change", e => { handleFiles([...e.target.files]); e.target.value = ""; });
$("attInput").addEventListener("change", e => { handleAtts([...e.target.files]); e.target.value = ""; });
$("searchInput").addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(loadList, 400); });
$("catFilter").addEventListener("change", renderList);
$("codeEditor").addEventListener("input", updateCount);
document.querySelectorAll("input[name=contentMode]").forEach(r => r.addEventListener("change", applyModeUI));

resetEditor("page"); loadCats(); loadUsers(); loadList().then(loadFolders);
</script>
