<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>台灣帕金森病友權益促進會 - 志工服務 LIFF</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
</head>
<body class="bg-slate-50 text-slate-800 p-4 max-w-md mx-auto">
  <header class="bg-teal-700 text-white rounded-2xl p-4 mb-4 shadow">
    <h1 class="text-lg font-bold">台灣帕金森病友權益促進會</h1>
    <p class="text-xs text-teal-100">LINE 志工服務平台 (LIFF)</p>
  </header>

  <main id="app" class="space-y-4">
    <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200">
      <h2 class="font-semibold text-teal-800 mb-2">個資蒐集告知與同意 (v2026.1)</h2>
      <p class="text-xs text-slate-600 leading-relaxed mb-3">
        本會依《個人資料保護法》告知：蒐集目的為志工招募、教育訓練、排班、保險及衛福部時數申報；本系統採最小蒐集原則（病友醫療個資不入志工庫），並揭露 Google Workspace 與 LINE 為受託雲端服務。您得依法申請查詢、更正、停止利用或刪除。
      </p>
      <label class="flex items-center gap-2 text-sm font-medium">
        <input type="checkbox" id="pdpaAgree" class="w-4 h-4 accent-teal-600" />
        我已詳閱並同意個資蒐集告知事項
      </label>
    </div>

    <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 space-y-3">
      <h2 class="font-semibold text-teal-800">志工基本資料與保密切結</h2>
      <input id="vName" type="text" placeholder="姓名（必填）" class="w-full border rounded-lg px-3 py-2 text-sm" />
      <select id="vIdentity" class="w-full border rounded-lg px-3 py-2 text-sm">
        <option value="病友">病友</option>
        <option value="家屬">家屬</option>
        <option value="一般民眾">一般民眾</option>
        <option value="專業人員">專業人員（醫護、物理治療等）</option>
      </select>
      <input id="vPhone" type="tel" placeholder="聯絡電話" class="w-full border rounded-lg px-3 py-2 text-sm" />
      <input id="vEmergency" type="text" placeholder="緊急聯絡人與電話" class="w-full border rounded-lg px-3 py-2 text-sm" />
      <canvas id="sigPad" width="300" height="100" class="w-full border rounded-lg bg-slate-50"></canvas>
      <button onclick="submitRegister()" class="w-full bg-teal-700 text-white py-2.5 rounded-lg font-medium text-sm">送出申請並簽署保密切結書</button>
    </div>
  </main>

  <script>
    const LIFF_ID = '2009456572-HOlrrokl';
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbwEh716EO7Kfd4w-FHlh2YwqtCIYI_cYr0PqJROb7xMK1SjNOgPJaid6aPq3tynOu1G/exec';
    let idToken = '';

    window.onload = async () => {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) liff.login();
        idToken = liff.getIDToken();
      } catch (e) { console.warn('LIFF init preview mode', e); }
    };

    async function submitRegister() {
      if (!document.getElementById('pdpaAgree').checked) {
        alert('請先勾選同意個資蒐集告知事項');
        return;
      }
      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'registerVolunteer',
          idToken: idToken,
          data: {
            name: document.getElementById('vName').value,
            identityType: document.getElementById('vIdentity').value,
            phone: document.getElementById('vPhone').value,
            emergencyContact: document.getElementById('vEmergency').value,
            pdpaVersion: 'v2026.1',
            ndaVersion: 'v2026.1',
            ndaSignatureDataUrl: document.getElementById('sigPad').toDataURL()
          }
        })
      });
      const json = await res.json();
      alert(json.ok ? '申請已送出！志工編號：' + json.volunteerId : '錯誤：' + json.error);
    }
  </script>
</body>
</html>
