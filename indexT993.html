<!DOCTYPE html>
<html lang="zh-TW" id="htmlRoot">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TPDA 病友論壇 - 帕金森溫馨交流社群</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang TC", "Microsoft JhengHei", sans-serif;
      -webkit-tap-highlight-color: transparent;
      scroll-behavior: smooth;
      transition: font-size 0.15s ease-out;
    }
    .border-3 { border-width: 3px; }
    .active-scale:active { transform: scale(0.96); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>

<body id="mainBody" class="bg-stone-100 text-stone-900 min-h-screen pb-28 font-bold selection:bg-emerald-200">

  <!-- Header -->
  <header class="bg-gradient-to-r from-emerald-800 via-emerald-700 to-teal-600 text-white z-40 shadow-xl border-b-4 border-emerald-950">
    <div class="max-w-md mx-auto px-4 py-3 space-y-2">
      <div class="flex justify-between items-center">
        <div class="flex items-center space-x-2">
          <div class="bg-white p-1.5 rounded-2xl shadow-md">
            <span class="text-3xl">💬</span>
          </div>
          <div>
            <h1 class="text-xl font-black tracking-wide leading-none">TPDA 病友論壇</h1>
            <span class="text-xs bg-emerald-950 text-emerald-100 px-2 py-0.5 rounded-full font-black mt-1 inline-block">溫馨交流與經驗分享</span>
          </div>
        </div>

        <div class="flex items-center space-x-1.5">
          <button id="adminBtn" onclick="enterAdminMode()" class="hidden bg-stone-950 hover:bg-black border-2 border-white text-white text-sm font-black px-3 py-1.5 rounded-xl active-scale shadow-md !min-h-0">
            ⚙️ 後台
          </button>
          <button id="loginHeaderBtn" onclick="openAuthModal()" class="bg-emerald-900 hover:bg-emerald-950 text-white text-xs font-black px-3 py-1.5 rounded-xl border-2 border-emerald-300 active-scale shadow-md !min-h-0">
            👤 登入
          </button>
          <div id="userAvatarContainer" class="hidden relative">
            <img id="userAvatar" onclick="handleHeaderLogout()" class="w-11 h-11 rounded-full border-2 border-white shadow-md cursor-pointer object-cover active-scale" src="" alt="頭像" title="點擊登出">
          </div>
        </div>
      </div>

      <!-- 字型調整工具列 -->
      <div class="flex justify-between items-center bg-emerald-950/40 rounded-xl p-1.5 border border-emerald-500/30">
        <span class="text-xs text-emerald-100 font-black flex items-center">🔍 調整文字大小：</span>
        <div class="flex items-center space-x-2">
          <button onclick="adjustFontSize(-2)" class="bg-emerald-900/60 hover:bg-emerald-900 text-white text-sm font-black px-3 py-1 rounded-lg border border-emerald-400/50 active-scale !min-h-0">
            A -
          </button>
          <span id="fontSizeIndicator" class="text-sm text-white font-black px-1 min-w-[45px] text-center">20px</span>
          <button onclick="adjustFontSize(2)" class="bg-emerald-900/60 hover:bg-emerald-900 text-white text-sm font-black px-3 py-1 rounded-lg border border-emerald-400/50 active-scale !min-h-0">
            A +
          </button>
          <button onclick="resetFontSize()" class="bg-emerald-950 hover:bg-black text-white text-xs font-black px-2.5 py-1 rounded-lg border border-stone-500 active-scale !min-h-0">
            重設
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="max-w-md mx-auto px-4 py-4 space-y-5">

    <!-- User Panel -->
    <section class="bg-white rounded-3xl p-6 shadow-md border-3 border-stone-300 space-y-5">
      <div class="flex justify-between items-start">
        <div>
          <p class="text-lg text-stone-600 font-black flex items-center">歡迎來到 TPDA <span class="ml-1 text-2xl">👋</span></p>
          <p class="text-3xl font-black text-stone-950 mt-1">
            <span id="userName" class="border-b-4 border-amber-400 pb-1">訪客 (唯讀模式)</span>
          </p>
        </div>
        <button id="newPostQuickBtn" onclick="checkAuthAndExecute(openNewPostModal)" class="bg-emerald-700 hover:bg-emerald-800 text-white font-black px-5 py-3 rounded-2xl border-3 border-emerald-900 active-scale shadow-sm">
          ✍️ 發文
        </button>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <button id="myFavQuickBtn" onclick="checkAuthAndExecute(toggleMyFavoritesFilter)" class="w-full bg-amber-100 hover:bg-amber-200 text-amber-950 font-black py-4 rounded-2xl text-xl border-3 border-amber-400 active-scale shadow-sm">
          ⭐ 我的收藏
        </button>
        <button id="myPostsQuickBtn" onclick="checkAuthAndExecute(toggleMyPostsFilter)" class="w-full bg-stone-100 hover:bg-stone-200 text-stone-900 font-black py-4 rounded-2xl text-xl border-3 border-stone-400 active-scale shadow-sm">
          📋 我的文章
        </button>
      </div>
    </section>

    <!-- Category Filter & Search -->
    <section class="bg-white rounded-3xl p-5 shadow-md border-3 border-stone-300 space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-xl font-black text-stone-800">📁 依主題分類篩選</h2>
        <button id="clearFilterBtn" onclick="clearCategoryFilter()" class="hidden text-base bg-stone-800 text-white px-4 py-1.5 rounded-full font-black active-scale shadow-sm">
          顯示全部
        </button>
      </div>

      <div>
        <select id="categoryDropdownFilter" onchange="filterByCategory(this.value)" class="w-full border-3 border-stone-400 rounded-2xl p-4 text-xl font-bold bg-white">
          <option value="">📁 顯示所有主題分類</option>
        </select>
      </div>

      <div class="space-y-1">
        <label class="block text-sm font-black text-stone-500">🔍 搜尋文章標題、內容</label>
        <input type="text" id="keywordSearch" oninput="filterByKeyword(this.value)" class="w-full border-3 border-stone-400 rounded-2xl p-4 text-xl font-bold bg-white" placeholder="請輸入關鍵字">
      </div>
    </section>

    <!-- Category Big Buttons -->
    <section class="space-y-3">
      <h2 class="text-xl font-black text-stone-800 px-1">快速切換看板</h2>
      <div id="categoryBigButtonsContainer" class="grid grid-cols-1 gap-3">
        <div class="animate-pulse bg-stone-200 h-20 rounded-3xl"></div>
      </div>
    </section>

    <!-- Articles List -->
    <section id="articleListSection" class="space-y-4 pt-2">
      <div class="bg-white rounded-3xl p-5 border-3 border-stone-300 shadow-sm flex justify-between items-center">
        <h2 class="text-2xl font-black text-stone-950 flex items-center">
          📅 <span id="selectedCategoryTitle" class="ml-2">所有交流文章</span>
        </h2>
        <button onclick="scrollToTop()" class="bg-stone-100 hover:bg-stone-200 border-2 border-stone-300 text-stone-700 text-sm font-black px-3 py-1.5 rounded-xl active-scale !min-h-0 !text-base">
          ▲ 回頂部
        </button>
      </div>
      <div id="articleListContainer" class="space-y-5"></div>
    </section>
  </main>

  <!-- Lightbox (大圖瀏覽器) -->
  <div id="lightboxModal" class="fixed inset-0 bg-black/95 z-50 hidden flex flex-col justify-between p-4 select-none">
    <div class="flex justify-between items-center text-white z-10 py-2">
      <span id="lightboxIndicator" class="text-xl font-black bg-black/40 px-5 py-2 rounded-full">1 / 1</span>
      <button onclick="closeLightbox()" class="bg-white/10 text-white w-14 h-14 rounded-full text-3xl font-black active-scale">✕</button>
    </div>
    <div class="relative flex-1 flex items-center justify-center">
      <button onclick="changeLightboxImage(-1)" class="absolute left-2 bg-black/50 text-white w-16 h-16 rounded-full text-4xl font-black z-10 active-scale">◀</button>
      <img id="lightboxMainImage" class="max-h-[65vh] max-w-full object-contain rounded-xl shadow-2xl" src="" alt="大圖">
      <button onclick="changeLightboxImage(1)" class="absolute right-2 bg-black/50 text-white w-16 h-16 rounded-full text-4xl font-black z-10 active-scale">▶</button>
    </div>
    <div class="py-4 border-t border-white/10">
      <div id="lightboxThumbnails" class="flex justify-center space-x-3 overflow-x-auto no-scrollbar py-2 px-4 max-w-md mx-auto"></div>
    </div>
  </div>

  <!-- New Post Modal (發表新文章燈箱) -->
  <div id="newPostModal" class="fixed inset-0 bg-stone-950/80 backdrop-blur-sm z-50 hidden overflow-y-auto flex justify-center p-4 items-start sm:items-center">
    <div class="bg-white rounded-3xl w-full max-w-md shadow-2xl border-4 border-stone-400 overflow-hidden my-8">
      <div class="bg-gradient-to-r from-emerald-800 to-teal-700 text-white p-5 flex justify-between items-center border-b-4 border-emerald-900">
        <button onclick="closeModal('newPostModal')" class="bg-emerald-950 text-white px-4 py-2 rounded-xl text-base font-black shadow-md">⬅ 返回</button>
        <h3 class="text-2xl font-black">發表新文章</h3>
      </div>
      <form onsubmit="handleCreatePost(event)" class="p-6 space-y-4">
        <div>
          <label class="block text-base font-black text-stone-800 mb-1">選擇主題分類 *</label>
          <select id="postCategory" class="w-full border-3 border-stone-400 rounded-xl p-4 text-lg font-bold bg-white" required></select>
        </div>
        <div>
          <label class="block text-base font-black text-stone-800 mb-1">文章標題 *</label>
          <input type="text" id="postTitle" class="w-full border-3 border-stone-400 rounded-xl p-4 text-lg font-bold" placeholder="請輸入標題" required>
        </div>
        <div>
          <label class="block text-base font-black text-stone-800 mb-1">分享內容 *</label>
          <textarea id="postContent" class="w-full border-3 border-stone-400 rounded-xl p-4 text-lg font-bold h-40" placeholder="寫下您的經驗、問題 or 鼓勵..." required></textarea>
        </div>

        <!-- LINE 發布通知管道選擇 -->
        <div class="border-t-3 border-stone-200 pt-3 space-y-2">
          <label class="block text-base font-black text-stone-800 mb-1">📢 LINE 發布通知方式</label>
          <select id="postPublishMode" class="w-full border-3 border-stone-400 rounded-xl p-4 text-lg font-bold bg-white">
            <option value="group">模式 1：自動發布到預設群組</option>
            <option value="select">模式 2：自選擇發布的名單或群組</option>
            <option value="none" selected>模式 3：不發布，僅存在於論壇</option>
          </select>
        </div>

        <!-- 照片上傳區 -->
        <div class="border-t-3 border-stone-200 pt-3 space-y-2">
          <div class="flex justify-between items-center">
            <span class="text-base font-black text-stone-800">🖼️ 上傳照片 (可多選)</span>
            <button type="button" onclick="triggerImageUpload()" class="bg-emerald-50 text-emerald-950 border border-emerald-300 px-3 py-2 rounded-xl text-sm font-black">選擇照片</button>
            <input type="file" id="imageUploadInput" class="hidden" accept="image/*" multiple onchange="uploadMultipleImages(this)">
          </div>
          <div id="postImagesContainer" class="grid grid-cols-3 gap-2"></div>
        </div>

        <!-- 附件上傳區 -->
        <div class="border-t-3 border-stone-200 pt-3 space-y-2">
          <div class="flex justify-between items-center">
            <span class="text-base font-black text-stone-800">📎 上傳附件 (可多選)</span>
            <button type="button" onclick="triggerFileUpload()" class="bg-emerald-50 text-emerald-950 border border-emerald-300 px-3 py-2 rounded-xl text-sm font-black">選擇檔案</button>
            <input type="file" id="fileUploadInput" class="hidden" multiple onchange="uploadMultipleFiles(this)">
          </div>
          <div id="postFilesContainer" class="space-y-2"></div>
        </div>

        <button type="submit" class="w-full bg-emerald-700 text-white font-black py-5 rounded-2xl text-xl shadow-md active-scale">
          🚀 發布文章
        </button>
      </form>
    </div>
  </div>

  <!-- Article Detail & Reply Modal -->
  <div id="detailModal" class="fixed inset-0 bg-stone-950/80 backdrop-blur-sm z-50 hidden overflow-y-auto flex justify-center p-4 items-start">
    <div class="bg-white rounded-3xl w-full max-w-md shadow-2xl border-4 border-stone-400 overflow-hidden my-8">
      <div class="bg-gradient-to-r from-emerald-800 to-teal-700 text-white p-5 flex justify-between items-center border-b-4 border-emerald-900">
        <button onclick="closeModal('detailModal')" class="bg-emerald-950 text-white px-4 py-2 rounded-xl text-base font-black shadow-md">⬅ 返回</button>
        <h3 class="text-xl font-black truncate max-w-[150px]" id="detailHeaderTitle">文章詳情</h3>
        <button id="deleteOwnPostBtn" onclick="handleDeleteOwnPost()" class="hidden bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-xl text-sm font-black shadow-md !min-h-0">🗑️ 回收文章</button>
      </div>
      
      <div id="detailImagesContainer" class="hidden grid gap-1 p-2 bg-stone-100 border-b-3 border-stone-200"></div>

      <div class="p-6 border-b-3 border-stone-200 space-y-4 bg-emerald-50/30">
        <div class="flex justify-between items-center">
          <span id="detailCategory" class="bg-emerald-100 text-emerald-800 border border-emerald-300 px-3 py-1 rounded-full text-sm"></span>
          <span id="detailTime" class="text-sm text-stone-500"></span>
        </div>
        <h2 id="detailTitle" class="text-2xl font-black text-stone-950 leading-tight"></h2>
        <p id="detailAuthor" class="text-base text-stone-600">作者：訪客</p>
        <div id="detailContent" class="text-lg font-bold text-stone-800 whitespace-pre-line leading-relaxed bg-white p-4 rounded-2xl border-2 border-stone-200"></div>
        
        <div id="detailFilesContainer" class="hidden space-y-2 pt-2"></div>

        <!-- 點讚 / 收藏 / 分享 三欄按鈕 -->
        <div class="grid grid-cols-3 gap-2 pt-2">
          <button id="likeBtn" onclick="checkAuthAndExecute(handleLike)" class="bg-white hover:bg-rose-50 text-rose-600 border-3 border-rose-300 py-3 rounded-xl text-base flex justify-center items-center space-x-1.5 active-scale">
            <span id="likeIcon">❤️</span> <span id="likeCount">0</span>
          </button>
          <button id="favBtn" onclick="checkAuthAndExecute(handleFavorite)" class="bg-white hover:bg-amber-50 text-amber-600 border-3 border-amber-300 py-3 rounded-xl text-base flex justify-center items-center space-x-1.5 active-scale">
            <span id="favIcon">⭐</span> <span>收藏</span>
          </button>
          <button id="shareBtn" onclick="handleShareCurrentPost()" class="bg-white hover:bg-teal-50 text-teal-700 border-3 border-teal-300 py-3 rounded-xl text-base flex justify-center items-center space-x-1.5 active-scale">
            <span>📤</span> <span>分享</span>
          </button>
        </div>
      </div>

      <!-- 回覆區 -->
      <div class="p-6 space-y-4">
        <h4 class="text-lg font-black text-stone-800">💬 所有回覆 (<span id="replyCount">0</span>)</h4>
        <div id="replyListContainer" class="space-y-4 max-h-[40vh] overflow-y-auto pr-1"></div>
      </div>

      <div class="p-6 bg-stone-50 border-t-3 border-stone-200 space-y-3">
        <div class="flex justify-between items-center">
          <span id="replyTargetLabel" class="text-sm text-stone-600">正在發表新回覆：</span>
          <button id="cancelReplyTargetBtn" onclick="resetReplyTarget()" class="hidden text-xs bg-stone-300 text-stone-700 px-2 py-1 rounded-lg">取消對留言回覆</button>
        </div>
        <textarea id="replyInput" class="w-full border-3 border-stone-400 rounded-xl p-3 text-lg font-bold h-24" placeholder="請輸入回覆內容..."></textarea>
        <button onclick="checkAuthAndExecute(handleCreateReply)" class="w-full bg-emerald-700 text-white font-black py-4 rounded-xl text-lg shadow-md active-scale">
          ✍️ 送出回覆
        </button>
      </div>
    </div>
  </div>

  <!-- Auth Modal -->
  <div id="authModal" class="fixed inset-0 bg-stone-950/80 backdrop-blur-sm z-50 hidden overflow-y-auto flex justify-center p-4 items-start">
    <div class="bg-white rounded-3xl w-full max-w-md shadow-2xl border-4 border-stone-400 overflow-hidden my-8">
      <div class="bg-gradient-to-r from-emerald-800 to-teal-700 text-white p-5 flex justify-between items-center border-b-4 border-emerald-900">
        <button onclick="closeModal('authModal')" class="bg-emerald-950 text-white px-4 py-2 rounded-xl text-base font-black shadow-md">⬅ 返回</button>
        <h3 class="text-2xl font-black">登入 / 註冊</h3>
      </div>

      <div class="grid grid-cols-2 border-b-3 border-stone-200 bg-stone-50">
        <button onclick="switchAuthTab('login')" id="authTabBtn_login" class="py-4 text-lg font-black text-emerald-800 border-b-4 border-emerald-800 bg-white">帳號登入</button>
        <button onclick="switchAuthTab('register')" id="authTabBtn_register" class="py-4 text-lg font-black text-stone-500">新用戶註冊</button>
      </div>

      <div class="p-6 space-y-5">
        <button onclick="handleHeaderLogin()" class="w-full bg-[#06C755] hover:bg-[#05B34C] text-white font-black py-5 rounded-2xl text-xl shadow-md active-scale">
          💬 LINE 快速登入 / 綁定
        </button>

        <div class="relative flex py-2 items-center">
          <div class="flex-grow border-t-2 border-stone-300"></div>
          <span class="flex-shrink mx-4 text-stone-400 text-sm font-black">或使用一般帳號</span>
          <div class="flex-grow border-t-2 border-stone-300"></div>
        </div>

        <!-- 登入表單 -->
        <form id="authLoginForm" onsubmit="handleNormalLogin(event)" class="space-y-4">
          <div>
            <label class="block text-base font-black text-stone-800 mb-1">姓名 *</label>
            <input type="text" id="authLoginName" class="w-full border-3 border-stone-400 rounded-xl p-4 text-lg font-bold" required>
          </div>
          <div>
            <label class="block text-base font-black text-stone-800 mb-1">手機 *</label>
            <input type="tel" id="authLoginPhone" class="w-full border-3 border-stone-400 rounded-xl p-4 text-lg font-bold" required>
          </div>
          <button type="submit" class="w-full bg-emerald-700 text-white font-black py-5 rounded-2xl text-xl shadow-md">登入</button>
        </form>

        <!-- 註冊表單 -->
        <form id="authRegisterForm" onsubmit="handleNormalRegister(event)" class="space-y-4 hidden">
          <div id="registerNotice" class="bg-amber-50 p-4 rounded-2xl border-2 border-amber-200 text-sm text-amber-950 font-bold leading-relaxed">
            只需輸入真實姓名與手機即可完成註冊！
          </div>
          <div>
            <label class="block text-base font-black text-stone-800 mb-1">真實姓名 *</label>
            <input type="text" id="regName" class="w-full border-3 border-stone-400 rounded-xl p-4 text-lg font-bold" required>
          </div>
          <div>
            <label class="block text-base font-black text-stone-800 mb-1">手機號碼 *</label>
            <input type="tel" id="regPhone" class="w-full border-3 border-stone-400 rounded-xl p-4 text-lg font-bold" required>
          </div>
          <button type="submit" id="regSubmitBtnMain" class="w-full bg-emerald-700 text-white font-black py-5 rounded-2xl text-xl shadow-md">確認註冊</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Admin Panel -->
  <div id="adminPanel" class="fixed inset-0 bg-stone-950/80 backdrop-blur-sm z-50 hidden overflow-y-auto">
    <div class="min-h-screen py-6 px-4">
      <div class="bg-stone-100 rounded-3xl max-w-md mx-auto shadow-2xl border-4 border-stone-400 overflow-hidden">
        <div class="bg-stone-950 text-white p-5 flex justify-between items-center border-b-4 border-stone-800">
          <button onclick="closeModal('adminPanel')" class="bg-stone-800 text-white px-4 py-2.5 rounded-xl text-lg font-black shadow-md">⬅ 返回</button>
          <h2 class="text-xl font-black">⚙️ 論壇後台管理</h2>
        </div>
        <div class="p-6 space-y-6">
          <!-- 新增分類 -->
          <div class="bg-white p-5 rounded-2xl border-3 border-stone-300 space-y-3">
            <h3 class="text-lg font-black text-stone-800">📁 新增主題分類</h3>
            <div class="flex space-x-2">
              <input type="text" id="newCategoryInput" class="flex-1 border-3 border-stone-400 rounded-xl p-3 text-lg font-bold" placeholder="例如：復健運動">
              <button onclick="addNewCategory()" class="bg-emerald-700 text-white font-black px-5 rounded-xl text-lg shadow-md">新增</button>
            </div>
          </div>
          <!-- 文章管理列表 -->
          <div class="bg-white p-5 rounded-2xl border-3 border-stone-300 space-y-3">
            <h3 class="text-lg font-black text-stone-800">📝 文章管理與置頂</h3>
            <div id="adminPostList" class="space-y-3 max-h-[40vh] overflow-y-auto divide-y divide-stone-200"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Loading -->
  <div id="loading" class="fixed inset-0 bg-stone-950/60 backdrop-blur-sm z-[60] hidden flex flex-col items-center justify-center space-y-3">
    <div class="bg-white p-8 rounded-3xl shadow-2xl flex flex-col items-center space-y-4 border-3 border-stone-300 min-w-[240px]">
      <div class="animate-spin rounded-full h-14 w-14 border-4 border-emerald-700 border-t-transparent"></div>
      <p id="loadingText" class="text-lg font-black text-stone-900">系統連線中...</p>
    </div>
  </div>

  <script>
    const LIFF_ID = "2009456572-ZBfM2edk"; 
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyBMCpX1D6hAtJgcjdWdkXrnbCFdednNMdQ5FGfAjX4O6cTPG-KyT_BZ280bG-e1qHA/exec"; 

    let userLineId = "";
    let userDisplayName = "";
    let userProfile = null;
    let isAdmin = false;

    let allCategories = [];
    let allPosts = [];
    let currentPost = null;
    let currentFilterCategory = "";
    let currentSearchKeyword = "";
    let showOnlyFavorites = false;
    let showOnlyMyPosts = false;

    let lightboxImages = [];
    let currentLightboxIndex = 0;
    let replyTargetParentId = null;

    // 預設根字型像素大小
    const DEFAULT_FONT_SIZE = 20;
    let currentFontSize = DEFAULT_FONT_SIZE;

    const CATEGORY_COLOR_PALETTES = [
      { bgLight: "bg-emerald-100", textDark: "text-emerald-950", border: "border-emerald-400", bgActive: "bg-emerald-700 text-white border-emerald-800", icon: "💚" },
      { bgLight: "bg-amber-100", textDark: "text-amber-950", border: "border-amber-400", bgActive: "bg-amber-600 text-white border-amber-800", icon: "🧡" },
      { bgLight: "bg-teal-100", textDark: "text-teal-950", border: "border-teal-400", bgActive: "bg-teal-700 text-white border-teal-800", icon: "💙" },
      { bgLight: "bg-orange-100", textDark: "text-orange-950", border: "border-orange-400", bgActive: "bg-orange-600 text-white border-orange-800", icon: "🌷" },
      { bgLight: "bg-stone-100", textDark: "text-stone-950", border: "border-stone-400", bgActive: "bg-stone-700 text-white border-stone-800", icon: "🌟" }
    ];

    // ==================== 全域字型大小控制 ====================
    function applyFontSize() {
      document.getElementById("htmlRoot").style.fontSize = `${currentFontSize}px`;
      document.getElementById("fontSizeIndicator").innerText = `${currentFontSize}px`;
      localStorage.setItem("tpda_root_fontsize", currentFontSize);
    }

    function adjustFontSize(delta) {
      currentFontSize += delta;
      if (currentFontSize < 14) currentFontSize = 14;
      if (currentFontSize > 36) currentFontSize = 36;
      applyFontSize();
    }

    function resetFontSize() {
      currentFontSize = DEFAULT_FONT_SIZE;
      applyFontSize();
    }

    function initFontSize() {
      const savedSize = localStorage.getItem("tpda_root_fontsize");
      if (savedSize) {
        currentFontSize = parseInt(savedSize, 10);
      } else {
        currentFontSize = DEFAULT_FONT_SIZE;
      }
      applyFontSize();
    }

    // ==================== 核心工具與 API ====================
    function getCategoryStyle(catName, active = false) {
      let hash = 0;
      catName = String(catName || "");
      for (let i = 0; i < catName.length; i++) {
        hash = catName.charCodeAt(i) + ((hash << 5) - hash);
      }
      const p = CATEGORY_COLOR_PALETTES[Math.abs(hash) % CATEGORY_COLOR_PALETTES.length];
      return {
        style: active ? `${p.bgActive} border-4 shadow-lg` : `${p.bgLight} ${p.textDark} ${p.border} border-3 hover:bg-stone-50`,
        icon: p.icon
      };
    }

    function apiGet(params) {
      return fetch(`${GAS_URL}?${new URLSearchParams(params).toString()}`).then(r => r.json());
    }

    function apiPost(payload) {
      return fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      }).then(r => r.json());
    }

    function sanitizeHTML(v) {
      return String(v ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function showLoading(text = "系統連線中...") {
      document.getElementById("loadingText").innerText = text;
      document.getElementById("loading").classList.remove("hidden");
    }

    function hideLoading() {
      document.getElementById("loading").classList.add("hidden");
    }

    function openModal(id) { document.getElementById(id).classList.remove("hidden"); }
    function closeModal(id) { document.getElementById(id).classList.add("hidden"); }

    function checkAuthAndExecute(callback) {
      if (!userProfile) {
        openAuthModal();
        return;
      }
      callback();
    }

    function switchAuthTab(tab) {
      const loginForm = document.getElementById("authLoginForm");
      const regForm = document.getElementById("authRegisterForm");
      const loginBtn = document.getElementById("authTabBtn_login");
      const regBtn = document.getElementById("authTabBtn_register");

      if (tab === "login") {
        loginForm.classList.remove("hidden");
        regForm.classList.add("hidden");
        loginBtn.className = "py-4 text-lg font-black text-emerald-800 border-b-4 border-emerald-800 bg-white";
        regBtn.className = "py-4 text-lg font-black text-stone-500";
      } else {
        loginForm.classList.add("hidden");
        regForm.classList.remove("hidden");
        loginBtn.className = "py-4 text-lg font-black text-stone-500";
        regBtn.className = "py-4 text-lg font-black text-emerald-800 border-b-4 border-emerald-800 bg-white";
      }
    }

    async function handleNormalRegister(e) {
      e.preventDefault();
      const name = document.getElementById("regName").value.trim();
      const phone = document.getElementById("regPhone").value.trim();

      showLoading("註冊中...");
      try {
        const r = await apiPost({
          action: "bindUser", 
          lineId: "NORMAL_" + phone, 
          name, 
          phone 
        });

        if (r.status === "success") {
          userProfile = r.user;
          userLineId = "NORMAL_" + phone;
          localStorage.setItem("pdpa_user", JSON.stringify({ name, phone }));
          setLoggedInUI(userProfile.name, "");
          closeModal("authModal");
          await loadPublicForumData();
        }
      } finally {
        hideLoading();
      }
    }

    // ==================== 支援 LIFF 轉址與深層連結 (Deep Link) ====================
    function getDirectPostId() {
      const urlParams = new URLSearchParams(window.location.search);
      let postId = urlParams.get("postId");
      if (postId) return postId;

      const liffState = urlParams.get("liff.state");
      if (liffState) {
        try {
          const decodedState = decodeURIComponent(liffState);
          const stateQuery = decodedState.includes("?") ? decodedState.split("?")[1] : decodedState;
          const stateParams = new URLSearchParams(stateQuery);
          postId = stateParams.get("postId");
          if (postId) return postId;
        } catch (e) {
          console.warn("解析 liff.state 失敗", e);
        }
      }

      if (window.location.hash) {
        const hashStr = window.location.hash.substring(1);
        const hashQuery = hashStr.includes("?") ? hashStr.split("?")[1] : hashStr;
        const hashParams = new URLSearchParams(hashQuery);
        postId = hashParams.get("postId");
        if (postId) return postId;
      }

      return null;
    }

    function getShareUrl(postId) {
      const baseUrl = LIFF_ID ? `https://liff.line.me/${LIFF_ID}` : location.href.split("?")[0].split("#")[0];
      return `${baseUrl}?postId=${encodeURIComponent(postId)}`;
    }

    function createPostFlexMessage(postObj, shareUrl) {
      const displayContent = (postObj.content || "").replace(/\n/g, " ").slice(0, 75);
      const postDate = (postObj.createdAt || "").slice(0, 10);

      return {
        type: "flex",
        altText: `💬 TPDA病友論壇：${postObj.title}`,
        contents: {
          type: "bubble",
          size: "mega",
          header: {
            type: "box",
            layout: "vertical",
            backgroundColor: "#047857",
            paddingTop: "14px",
            paddingBottom: "14px",
            paddingStart: "16px",
            paddingEnd: "16px",
            contents: [
              {
                type: "box",
                layout: "horizontal",
                contents: [
                  { type: "text", text: "💬", size: "md", flex: 0 },
                  {
                    type: "text",
                    text: `TPDA 病友論壇 · ${postObj.category}`,
                    weight: "bold",
                    color: "#FFFFFF",
                    size: "sm",
                    margin: "sm",
                    gravity: "center"
                  }
                ]
              }
            ]
          },
          body: {
            type: "box",
            layout: "vertical",
            paddingAll: "18px",
            spacing: "md",
            contents: [
              {
                type: "text",
                text: `📌 ${postObj.title}`,
                weight: "bold",
                size: "lg",
                color: "#1c1917",
                wrap: true
              },
              {
                type: "box",
                layout: "horizontal",
                contents: [
                  { type: "text", text: `作者：${postObj.authorName}`, size: "xs", color: "#78716c", flex: 1 },
                  { type: "text", text: postDate, size: "xs", color: "#a8a29e", align: "end", flex: 1 }
                ]
              },
              {
                type: "text",
                text: displayContent + (postObj.content && postObj.content.length > 75 ? "..." : ""),
                size: "sm",
                color: "#44403c",
                wrap: true,
                maxLines: 4
              },
              {
                type: "button",
                style: "primary",
                color: "#047857",
                height: "md",
                margin: "lg",
                action: {
                  type: "uri",
                  label: "點此閱讀全文與回覆",

                }

    async function sharePost(postId) {
      let post = allPosts.find(p => p.id === postId);
      if (!post && currentPost && currentPost.id === postId) {
        post = currentPost;
      }
      if (!post) return;

      const shareUrl = getShareUrl(post.id);

      if (typeof liff !== "undefined" && liff.isApiAvailable && liff.isApiAvailable("shareTargetPicker")) {
        try {
          const flexMsg = createPostFlexMessage(post, shareUrl);
          await liff.shareTargetPicker([flexMsg]);
        } catch (err) {
          console.error("LINE 分享視窗被關閉或發生錯誤", err);
        }
      } else if (navigator.share) {
        try {
          await navigator.share({
            title: `TPDA 病友論壇 - ${post.title}`,
            text: `【${post.category}】${post.title}\n作者：${post.authorName}`,
            url: shareUrl
          });
        } catch (e) {
          copyToClipboard(shareUrl);
        }
      } else {
        copyToClipboard(shareUrl);
      }
    }

    function copyToClipboard(text) {
      const input = document.createElement("input");
      input.value = text;
      document.body.appendChild(input);
      input.select();
      document.execCommand("copy");
      document.body.removeChild(input);
      showTemporaryToast("文章專屬連結已複製！可貼上分享給好友。");
    }

    function showTemporaryToast(text) {
      const toast = document.createElement("div");
      toast.className = "fixed bottom-8 left-1/2 -translate-x-1/2 bg-stone-900/90 text-white text-base font-black px-6 py-3 rounded-2xl shadow-2xl z-[70] transition-opacity duration-300";
      toast.innerText = text;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = "0";
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }

    function handleShareCurrentPost() {
      if (currentPost) {
        sharePost(currentPost.id);
      }
    }

    // ==================== 初始化系統 ====================
    async function initializeLiff() {
      showLoading("論壇載入中...");
      initFontSize(); 
      try {
        await liff.init({ liffId: LIFF_ID });
        const localUser = localStorage.getItem("pdpa_user");

        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          userLineId = profile.userId;
          userDisplayName = profile.displayName;

          const r = await apiPost({ action: "initForum", lineId: userLineId, name: userDisplayName });
          if (r.status === "success") {
            userProfile = r.user;
            isAdmin = !!r.isAdmin;
            allCategories = r.categories || [];
            allPosts = r.posts || [];
            setLoggedInUI(userProfile.name, profile.pictureUrl || "");
          }
        } else if (localUser) {
          const u = JSON.parse(localUser);
          const r = await apiPost({ action: "verifyNormalUser", name: u.name, phone: u.phone });
          if (r.status === "success") {
            userProfile = r.user;
            userLineId = "NORMAL_" + u.phone;
            setLoggedInUI(userProfile.name, "");
          }
        }
        
        if (!allPosts.length) {
          await loadPublicForumData();
        } else {
          renderAll();
        }

        // 自動定位並展開深層連結文章
        const directPostId = getDirectPostId();
        if (directPostId) {
          setTimeout(() => {
            openArticleDetail(directPostId);
          }, 350);
        }
      } catch (e) {
        console.error(e);
        await loadPublicForumData().catch(() => {});
        const directPostId = getDirectPostId();
        if (directPostId) {
          setTimeout(() => {
            openArticleDetail(directPostId);
          }, 350);
        }
      } finally {
        hideLoading();
      }
    }

    async function loadPublicForumData() {
      const r = await apiGet({ action: "getForumData" });
      allCategories = r.categories || [];
      allPosts = r.posts || [];
      renderAll();
    }

    function setLoggedInUI(name, pic) {
      document.getElementById("userName").innerText = name;
      document.getElementById("loginHeaderBtn").classList.add("hidden");
      document.getElementById("userAvatarContainer").classList.remove("hidden");
      document.getElementById("userAvatar").src = pic || "https://placehold.co/100x100/047857/FFFFFF?text=USER";
      if (isAdmin) document.getElementById("adminBtn").classList.remove("hidden");
    }

    function renderAll() {
      renderCategories();
      renderPostList();
    }

    function renderCategories() {
      const select = document.getElementById("categoryDropdownFilter");
      const bigContainer = document.getElementById("categoryBigButtonsContainer");
      const clearBtn = document.getElementById("clearFilterBtn");

      select.innerHTML = `<option value="">📁 顯示所有主題分類 (${allPosts.length} 篇)</option>`;
      bigContainer.innerHTML = "";
      clearBtn.classList.toggle("hidden", !currentFilterCategory);

      const categoryCounts = {};
      allCategories.forEach(cat => categoryCounts[cat] = 0);
      allPosts.forEach(p => {
        if (categoryCounts[p.category] !== undefined) {
          categoryCounts[p.category]++;
        }
      });

      allCategories.forEach(cat => {
        const count = categoryCounts[cat] || 0;
        const active = currentFilterCategory === cat;
        const st = getCategoryStyle(cat, active);

        const opt = document.createElement("option");
        opt.value = cat;
        opt.innerText = `${cat} (${count} 篇)`;
        opt.selected = active;
        select.appendChild(opt);

        const btn = document.createElement("button");
        btn.className = `w-full p-5 rounded-3xl text-left font-black text-xl active-scale shadow-sm ${st.style}`;
        btn.onclick = () => filterByCategory(cat);
        btn.innerHTML = `
          <div class="flex justify-between items-center">
            <span>${st.icon} ${sanitizeHTML(cat)}</span>
            <span class="text-base px-3 py-1 rounded-full bg-white/70 text-stone-900 border border-stone-300">${count} 篇</span>
          </div>`;
        bigContainer.appendChild(btn);
      });

      const postCatSelect = document.getElementById("postCategory");
      postCatSelect.innerHTML = allCategories.map(cat => `<option value="${sanitizeHTML(cat)}">${sanitizeHTML(cat)}</option>`).join("");
    }

    function filterByCategory(cat) {
      currentFilterCategory = cat;
      showOnlyFavorites = false;
      showOnlyMyPosts = false;
      document.getElementById("categoryDropdownFilter").value = cat;
      renderCategories();
      renderPostList();
      setTimeout(() => {
        const target = document.getElementById("articleListSection");
        if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
      }, 100);
    }

    function clearCategoryFilter() {
      currentFilterCategory = "";
      showOnlyFavorites = false;
      showOnlyMyPosts = false;
      document.getElementById("categoryDropdownFilter").value = "";
      renderCategories();
      renderPostList();
      scrollToTop();
    }

    function scrollToTop() { window.scrollTo({ top: 0, behavior: "smooth" }); }

    function toggleMyFavoritesFilter() {
      showOnlyFavorites = !showOnlyFavorites;
      showOnlyMyPosts = false;
      currentFilterCategory = "";
      document.getElementById("categoryDropdownFilter").value = "";
      renderPostList();
    }

    function toggleMyPostsFilter() {
      showOnlyMyPosts = !showOnlyMyPosts;
      showOnlyFavorites = false;
      currentFilterCategory = "";
      document.getElementById("categoryDropdownFilter").value = "";
      renderPostList();
    }

    function filterByKeyword(v) {
      currentSearchKeyword = String(v || "").trim().toLowerCase();
      renderPostList();
    }

    function renderPostList() {
      const c = document.getElementById("articleListContainer");
      c.innerHTML = "";

      if (showOnlyFavorites) {
        document.getElementById("selectedCategoryTitle").innerText = "⭐ 我收藏的文章";
      } else if (showOnlyMyPosts) {
        document.getElementById("selectedCategoryTitle").innerText = "📋 我發布的文章";
      } else if (currentFilterCategory) {
        document.getElementById("selectedCategoryTitle").innerText = `📁 ${currentFilterCategory} 文章清單`;
      } else {
        document.getElementById("selectedCategoryTitle").innerText = "所有交流文章";
      }

      let list = [...allPosts];

      if (currentFilterCategory) list = list.filter(p => p.category === currentFilterCategory);
      if (showOnlyFavorites && userProfile) {
        const favs = userProfile.favorites || [];
        list = list.filter(p => favs.includes(p.id));
      }
      if (showOnlyMyPosts && userProfile) {
        list = list.filter(p => p.authorLineId === userLineId);
      }
      if (currentSearchKeyword) {
        list = list.filter(p => p.title.toLowerCase().includes(currentSearchKeyword) || p.content.toLowerCase().includes(currentSearchKeyword));
      }

      list.sort((a, b) => {
        if (a.isPinned !== b.isPinned) return b.isPinned - a.isPinned;
        return new Date(b.createdAt) - new Date(a.createdAt);
      });

      if (!list.length) {
        c.innerHTML = `<div class="bg-white p-8 rounded-3xl border-3 border-stone-300 text-center text-stone-500 font-black text-xl">目前沒有相關文章</div>`;
        return;
      }

      list.forEach(p => {
        const imgs = Array.isArray(p.images) ? p.images : [];
        const gridClass = imgs.length === 1 ? "grid-cols-1" : imgs.length === 2 ? "grid-cols-2" : "grid-cols-3";
        
        const imgHtml = imgs.length ? `
          <div class="grid ${gridClass} gap-1 p-2 bg-stone-50 border-b border-stone-200">
            ${imgs.slice(0, 3).map((url) => `<img src="${sanitizeHTML(url)}" class="w-full h-24 object-cover rounded-xl border border-stone-200">`).join("")}
          </div>` : "";

        const div = document.createElement("div");
        div.className = `bg-white rounded-3xl border-3 ${p.isPinned ? 'border-amber-500 bg-amber-50/10' : 'border-stone-300'} shadow-md overflow-hidden cursor-pointer active-scale`;
        
        div.innerHTML = `
          ${imgHtml}
          <div class="p-5 space-y-3">
            <div class="flex justify-between items-center">
              <span class="text-sm bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full border border-emerald-300">📁 ${sanitizeHTML(p.category)}</span>
              <div class="flex items-center space-x-2">
                ${p.isPinned ? '<span class="text-sm bg-amber-500 text-white px-2 py-0.5 rounded-lg">📌 置頂</span>' : ''}
                <span class="text-xs text-stone-400">${p.createdAt.slice(0, 10)}</span>
              </div>
            </div>
            <h3 class="text-2xl font-black text-stone-950 leading-tight">${sanitizeHTML(p.title)}</h3>
            <p class="text-base text-stone-600 line-clamp-2">${sanitizeHTML(p.content)}</p>
            <div class="flex justify-between items-center pt-2 border-t border-stone-100 text-sm text-stone-500 font-bold">
              <span>👤 ${sanitizeHTML(p.authorName)}</span>
              <div class="flex items-center space-x-3">
                <span>👁️ ${p.views || 0}</span>
                <span>❤️ ${p.likes || 0}</span>
                <span>💬 ${p.repliesCount || 0}</span>
                <button type="button" class="list-share-btn bg-teal-50 hover:bg-teal-100 text-teal-800 px-2.5 py-1 rounded-lg border border-teal-200 text-xs font-black" data-post-id="${p.id}">
                  📤 分享
                </button>
              </div>
            </div>
          </div>
        `;

        div.onclick = (e) => {
          if (e.target.closest(".list-share-btn")) {
            e.stopPropagation();
            sharePost(p.id);
            return;
          }
          openArticleDetail(p.id);
        };

        c.appendChild(div);
      });
    }

    async function openArticleDetail(postId) {
      showLoading("讀取文章...");
      try {
        const r = await apiPost({ action: "viewPost", postId, lineId: userLineId });
        if (r.status === "success") {
          currentPost = r.post;
          
          const cached = allPosts.find(x => x.id === postId);
          if (cached) cached.views = currentPost.views;

          document.getElementById("detailHeaderTitle").innerText = currentPost.title;
          document.getElementById("detailCategory").innerText = currentPost.category;
          document.getElementById("detailTime").innerText = currentPost.createdAt;
          document.getElementById("detailTitle").innerText = currentPost.title;
          document.getElementById("detailAuthor").innerText = `作者：${currentPost.authorName}`;
          document.getElementById("detailContent").innerText = currentPost.content;
          document.getElementById("likeCount").innerText = currentPost.likes;
          document.getElementById("replyCount").innerText = currentPost.repliesCount || currentPost.replies.length;

          const deleteOwnPostBtn = document.getElementById("deleteOwnPostBtn");
          if (userProfile && currentPost.authorLineId === userLineId) {
            deleteOwnPostBtn.classList.remove("hidden");
          } else {
            deleteOwnPostBtn.classList.add("hidden");
          }

          const imgContainer = document.getElementById("detailImagesContainer");
          const imgs = Array.isArray(currentPost.images) ? currentPost.images : [];
          if (imgs.length) {
            const gridClass = imgs.length === 1 ? "grid-cols-1" : imgs.length === 2 ? "grid-cols-2" : "grid-cols-3";
            imgContainer.className = `grid ${gridClass} gap-1 p-2 bg-stone-100 border-b-3 border-stone-200`;
            imgContainer.innerHTML = imgs.map((url, i) => `
              <img src="${sanitizeHTML(url)}" onclick='openLightbox(${JSON.stringify(imgs)}, ${i})' class="w-full h-32 object-cover rounded-xl border-2 border-stone-200 cursor-pointer active-scale">
            `).join("");
            imgContainer.classList.remove("hidden");
          } else {
            imgContainer.classList.add("hidden");
          }

          const fileContainer = document.getElementById("detailFilesContainer");
          const files = Array.isArray(currentPost.files) ? currentPost.files : [];
          if (files.length) {
            fileContainer.innerHTML = files.map(f => `
              <a href="${sanitizeHTML(f.url)}" target="_blank" rel="noopener" class="block bg-stone-100 border-2 border-stone-300 rounded-xl p-3 text-base font-black text-stone-800 hover:bg-stone-200">📎 下載附件：${sanitizeHTML(f.name)}</a>
            `).join("");
            fileContainer.classList.remove("hidden");
          } else {
            fileContainer.classList.add("hidden");
          }

          updateLikeFavUI();
          renderReplies(currentPost.replies);
          resetReplyTarget();
          openModal("detailModal");
        }
      } finally {
        hideLoading();
        renderPostList();
      }
    }

    function openLightbox(images, i = 0) {
      lightboxImages = images || [];
      currentLightboxIndex = i;
      updateLightbox();
      openModal("lightboxModal");
    }

    function updateLightbox() {
      if (!lightboxImages.length) return;
      document.getElementById("lightboxMainImage").src = lightboxImages[currentLightboxIndex];
      document.getElementById("lightboxIndicator").innerText = `${currentLightboxIndex + 1} / ${lightboxImages.length}`;
      document.getElementById("lightboxThumbnails").innerHTML = lightboxImages.map((u, i) =>
        `<img src="${sanitizeHTML(u)}" onclick="currentLightboxIndex=${i}; updateLightbox();" class="w-16 h-16 object-cover rounded-xl border-4 ${i === currentLightboxIndex ? "border-emerald-400" : "border-white/20"} cursor-pointer">`
      ).join("");
    }

    function changeLightboxImage(d) {
      if (!lightboxImages.length) return;
      currentLightboxIndex = (currentLightboxIndex + d + lightboxImages.length) % lightboxImages.length;
      updateLightbox();
    }

    const closeLightbox = () => closeModal("lightboxModal");

    function triggerImageUpload() { document.getElementById("imageUploadInput").click(); }
    function triggerFileUpload() { document.getElementById("fileUploadInput").click(); }

    function fileToBase64(file) {
      return new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result);
        r.onerror = rej;
        r.readAsDataURL(file);
      });
    }

    // 前端 Canvas 自動壓縮圖片
    function compressImage(file, maxWidth = 1280, quality = 0.82) {
      return new Promise((resolve, reject) => {
        if (!file.type.startsWith("image/")) {
          return fileToBase64(file).then(resolve).catch(reject);
        }

        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);

            const compressedBase64 = canvas.toDataURL("image/jpeg", quality);
            resolve(compressedBase64);
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function uploadMultipleImages(input) {
      const files = input.files;
      if (!files.length) return;

      showLoading(`正在壓縮並上傳 ${files.length} 張照片...`);
      try {
        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          const base64Data = await compressImage(file);
          const r = await apiPost({ 
            action: "uploadFileToDrive", 
            fileName: file.name.replace(/\.[^/.]+$/, "") + ".jpg", 
            mimeType: "image/jpeg", 
            base64Data, 
            lineId: userLineId 
          });
          if (r.status === "success") {
            addPostImageRow(r.fileUrl);
          }
        }
      } finally {
        input.value = "";
        hideLoading();
      }
    }

    async function uploadMultipleFiles(input) {
      const files = input.files;
      if (!files.length) return;

      showLoading(`正在批次上傳 ${files.length} 個附件...`);
      try {
        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          const base64Data = await fileToBase64(file);
          const r = await apiPost({ 
            action: "uploadFileToDrive", 
            fileName: file.name, 
            mimeType: file.type || "application/octet-stream", 
            base64Data, 
            lineId: userLineId 
          });
          if (r.status === "success") {
            addPostFileRow(r.fileName, r.fileUrl);
          }
        }
      } finally {
        input.value = "";
        hideLoading();
      }
    }

    function addPostImageRow(url) {
      const c = document.getElementById("postImagesContainer");
      const div = document.createElement("div");
      div.className = "post-image-row relative bg-white border-2 border-stone-300 rounded-xl p-1";
      div.innerHTML = `
        <input type="hidden" class="post-image-url" value="${sanitizeHTML(url)}">
        <img src="${sanitizeHTML(url)}" class="w-full h-24 object-cover rounded-lg">
        <button type="button" onclick="this.parentElement.remove()" class="absolute top-1 right-1 bg-red-600 text-white rounded-full w-8 h-8 text-sm">✕</button>
      `;
      c.appendChild(div);
    }

    function addPostFileRow(name, url) {
      const c = document.getElementById("postFilesContainer");
      const div = document.createElement("div");
      div.className = "post-file-row bg-white border-2 border-stone-300 rounded-xl p-3 flex justify-between items-center";
      div.innerHTML = `
        <input type="hidden" class="post-file-name" value="${sanitizeHTML(name)}">
        <input type="hidden" class="post-file-url" value="${sanitizeHTML(url)}">
        <span class="text-sm font-black text-stone-800 truncate max-w-[200px]">📎 ${sanitizeHTML(name)}</span>
        <button type="button" onclick="this.parentElement.remove()" class="bg-red-50 text-red-700 border-2 border-red-300 rounded-lg px-3 py-1 text-sm font-black">刪除</button>
      `;
      c.appendChild(div);
    }

    function openNewPostModal() {
      document.getElementById("postImagesContainer").innerHTML = "";
      document.getElementById("postFilesContainer").innerHTML = "";
      openModal("newPostModal");
    }

    async function handleCreatePost(e) {
      e.preventDefault();
      const category = document.getElementById("postCategory").value;
      const title = document.getElementById("postTitle").value.trim();
      const content = document.getElementById("postContent").value.trim();
      const publishMode = document.getElementById("postPublishMode").value;

      const images = [...document.querySelectorAll(".post-image-url")].map(x => x.value);
      const files = [...document.querySelectorAll(".post-file-row")].map(row => {
        return {
          name: row.querySelector(".post-file-name").value,
          url: row.querySelector(".post-file-url").value
        };
      });

      showLoading("發布文章中...");
      try {
        const r = await apiPost({
          action: "createPost",
          lineId: userLineId,
          authorName: userProfile.name,
          category,
          title,
          content,
          images,
          files
        });
        
        if (r.status === "success") {
          allPosts = r.posts;
          const createdPostId = r.postId || (allPosts.length ? allPosts[0].id : "");
          renderAll();
          closeModal("newPostModal");
          
          if (publishMode === "select") {
            if (typeof liff !== "undefined" && liff.isApiAvailable && liff.isApiAvailable('shareTargetPicker')) {
              const newPostObj = {
                id: createdPostId,
                title,
                content,
                category,
                authorName: userProfile.name,
                createdAt: new Date().toISOString().slice(0, 10)
              };
              const shareUrl = getShareUrl(createdPostId);
              const flexMessage = createPostFlexMessage(newPostObj, shareUrl);
              
              liff.shareTargetPicker([flexMessage]).catch(err => console.error("分享失敗", err));
            }
          }

          document.getElementById("postTitle").value = "";
          document.getElementById("postContent").value = "";
        }
      } finally {
        hideLoading();
      }
    }

    function renderReplies(replies) {
      const c = document.getElementById("replyListContainer");
      c.innerHTML = "";
      if (!replies || !replies.length) {
        c.innerHTML = `<p class="text-stone-400 text-center py-4">尚無回覆，快來沙發發表意見吧！</p>`;
        return;
      }

      replies.forEach((rep, idx) => {
        const isOwnReply = userProfile && rep.authorLineId === userLineId;
        const children = Array.isArray(rep.children) ? rep.children : [];

        const div = document.createElement("div");
        div.className = "bg-stone-50 p-4 rounded-2xl border-2 border-stone-200 space-y-2";
        div.innerHTML = `
          <div class="flex justify-between items-center text-xs text-stone-500">
            <span>#${idx + 1} ${sanitizeHTML(rep.authorName)}</span>
            <span>${rep.createdAt}</span>
          </div>
          <p class="text-base text-stone-800 font-bold whitespace-pre-line">${sanitizeHTML(rep.content)}</p>
          
          <div class="flex justify-end space-x-2 pt-1 border-t border-stone-100">
            <button type="button" class="reply-target-btn text-xs bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1.5 rounded-lg font-black active-scale"
              data-reply-id="${rep.id}" data-author="${sanitizeHTML(rep.authorName)}">
              💬 回覆此留言
            </button>
            ${isOwnReply ? `
              <button type="button" class="delete-reply-btn text-xs bg-red-50 text-red-600 border border-red-200 px-3 py-1.5 rounded-lg font-black active-scale"
                data-reply-id="${rep.id}">
                🗑️ 刪除
              </button>` : ""}
          </div>

          ${children.length ? `
            <div class="ml-6 mt-3 pl-4 border-l-4 border-emerald-200 space-y-3">
              ${children.map(child => {
                const isOwnChild = userProfile && child.authorLineId === userLineId;
                return `
                  <div class="bg-white p-3 rounded-xl border border-stone-200 space-y-1">
                    <div class="flex justify-between items-center text-xs text-stone-400">
                      <span>${sanitizeHTML(child.authorName)} ➜ ${sanitizeHTML(rep.authorName)}</span>
                      <span>${child.createdAt}</span>
                    </div>
                    <p class="text-sm text-stone-800 font-bold whitespace-pre-line">${sanitizeHTML(child.content)}</p>
                    ${isOwnChild ? `
                      <div class="flex justify-end pt-1">
                        <button type="button" class="delete-reply-btn text-xs text-red-500 font-black hover:underline" data-reply-id="${child.id}">
                          🗑️ 刪除回覆
                        </button>
                      </div>` : ""}
                  </div>
                `;
              }).join("")}
            </div>
          ` : ""}
        `;

        div.querySelectorAll(".reply-target-btn").forEach(btn => {
          btn.onclick = () => setReplyTarget(btn.dataset.replyId, btn.dataset.author);
        });
        div.querySelectorAll(".delete-reply-btn").forEach(btn => {
          btn.onclick = () => handleDeleteReply(btn.dataset.replyId);
        });

        c.appendChild(div);
      });
    }

    function setReplyTarget(parentReplyId, authorName) {
      replyTargetParentId = parentReplyId;
      document.getElementById("replyTargetLabel").innerText = `正在回覆 ${authorName} 的留言：`;
      document.getElementById("cancelReplyTargetBtn").classList.remove("hidden");
      document.getElementById("replyInput").focus();
    }

    function resetReplyTarget() {
      replyTargetParentId = null;
      document.getElementById("replyTargetLabel").innerText = "正在發表新回覆：";
      document.getElementById("cancelReplyTargetBtn").classList.add("hidden");
    }

    function updateLikeFavUI() {
      if (!userProfile) return;
      const liked = (userProfile.likes || []).includes(currentPost.id);
      const faved = (userProfile.favorites || []).includes(currentPost.id);

      const likeBtn = document.getElementById("likeBtn");
      const favBtn = document.getElementById("favBtn");

      if (liked) {
        likeBtn.className = "bg-rose-600 text-white border-3 border-rose-800 py-3 rounded-xl text-base flex justify-center items-center space-x-1.5 active-scale";
        document.getElementById("likeIcon").innerText = "❤️";
      } else {
        likeBtn.className = "bg-white text-rose-600 border-3 border-rose-300 py-3 rounded-xl text-base flex justify-center items-center space-x-1.5 active-scale";
        document.getElementById("likeIcon").innerText = "🤍";
      }

      if (faved) {
        favBtn.className = "bg-amber-500 text-white border-3 border-amber-700 py-3 rounded-xl text-base flex justify-center items-center space-x-1.5 active-scale";
        document.getElementById("favIcon").innerText = "★";
      } else {
        favBtn.className = "bg-white text-amber-600 border-3 border-amber-300 py-3 rounded-xl text-base flex justify-center items-center space-x-1.5 active-scale";
        document.getElementById("favIcon").innerText = "☆";
      }
    }

    async function handleLike() {
      showLoading("處理中...");
      try {
        const r = await apiPost({ action: "likePost", postId: currentPost.id, lineId: userLineId });
        if (r.status === "success") {
          userProfile.likes = r.userLikes;
          currentPost.likes = r.postLikes;
          document.getElementById("likeCount").innerText = r.postLikes;
          const cached = allPosts.find(x => x.id === currentPost.id);
          if (cached) cached.likes = r.postLikes;
          updateLikeFavUI();
        }
      } finally {
        hideLoading();
      }
    }

    async function handleFavorite() {
      showLoading("處理中...");
      try {
        const r = await apiPost({ action: "favoritePost", postId: currentPost.id, lineId: userLineId });
        if (r.status === "success") {
          userProfile.favorites = r.userFavorites;
          updateLikeFavUI();
        }
      } finally {
        hideLoading();
      }
    }

    async function handleCreateReply() {
      const content = document.getElementById("replyInput").value.trim();
      if (!content) { return; }

      showLoading("送出回覆...");
      try {
        const r = await apiPost({
          action: "createReply",
          postId: currentPost.id,
          parentReplyId: replyTargetParentId,
          lineId: userLineId,
          authorName: userProfile.name,
          content
        });
        if (r.status === "success") {
          document.getElementById("replyInput").value = "";
          currentPost.replies = r.replies;
          currentPost.repliesCount = r.repliesCount;
          document.getElementById("replyCount").innerText = r.repliesCount;
          const cached = allPosts.find(x => x.id === currentPost.id);
          if (cached) cached.repliesCount = r.repliesCount;
          renderReplies(r.replies);
          resetReplyTarget();
        }
      } finally {
        hideLoading();
      }
    }

    async function handleDeleteReply(replyId) {
      showLoading("刪除中...");
      try {
        const r = await apiPost({
          action: "deleteReply",
          postId: currentPost.id,
          replyId: replyId,
          lineId: userLineId
        });
        if (r.status === "success") {
          currentPost.replies = r.replies;
          currentPost.repliesCount = r.repliesCount;
          document.getElementById("replyCount").innerText = r.repliesCount;
          const cached = allPosts.find(x => x.id === currentPost.id);
          if (cached) cached.repliesCount = r.repliesCount;
          renderReplies(r.replies);
        }
      } finally {
        hideLoading();
      }
    }

    async function handleDeleteOwnPost() {
      showLoading("回收文章中...");
      try {
        const r = await apiPost({
          action: "deletePost",
          postId: currentPost.id,
          lineId: userLineId
        });
        if (r.status === "success") {
          allPosts = r.posts;
          closeModal("detailModal");
          renderAll();
        }
      } finally {
        hideLoading();
      }
    }

    function openAuthModal() { openModal("authModal"); switchAuthTab("login"); }

    function handleHeaderLogin() {
      try {
        if (!liff.isLoggedIn()) {
          liff.login({ redirectUri: location.href.split("#")[0] });
        }
      } catch (e) {
        console.error("LINE 登入錯誤", e);
      }
    }

    async function handleNormalLogin(e) {
      e.preventDefault();
      const name = document.getElementById("authLoginName").value.trim();
      const phone = document.getElementById("authLoginPhone").value.trim();
      showLoading("登入中...");
      try {
        const r = await apiPost({ action: "verifyNormalUser", name, phone });
        if (r.status === "success") {
          userProfile = r.user;
          userLineId = "NORMAL_" + phone;
          localStorage.setItem("pdpa_user", JSON.stringify({ name, phone }));
          setLoggedInUI(userProfile.name, "");
          closeModal("authModal");
          await loadPublicForumData();
        }
      } finally {
        hideLoading();
      }
    }

    function handleHeaderLogout() {
      localStorage.removeItem("pdpa_user");
      if (typeof liff !== "undefined" && liff.isLoggedIn && liff.isLoggedIn()) liff.logout();
      location.reload();
    }

    function enterAdminMode() {
      if (!isAdmin) return;
      openModal("adminPanel");
      renderAdminPostList();
    }

    function renderAdminPostList() {
      const c = document.getElementById("adminPostList");
      c.innerHTML = allPosts.map(p => `
        <div class="py-4 flex flex-col space-y-2 border-b border-stone-200 text-base">
          <div class="flex justify-between items-start">
            <div class="truncate max-w-[220px]">
              <p class="font-black text-stone-950 truncate">${sanitizeHTML(p.title)}</p>
              <span class="text-xs text-stone-500">分類: ${sanitizeHTML(p.category)} | 作者: ${sanitizeHTML(p.authorName)}</span>
            </div>
            <span class="text-xs bg-stone-200 px-2 py-1 rounded-md text-stone-700">
              ${p.authorLineId.startsWith("NORMAL_") ? "一般帳號" : "LINE 綁定"}
            </span>
          </div>
          
          <div class="flex flex-wrap gap-2 pt-1">
            <button onclick="togglePinPost('${p.id}', ${!p.isPinned})" class="flex-1 px-3 py-2 rounded-xl text-sm font-black border-2 ${p.isPinned ? 'bg-amber-500 text-white border-amber-600' : 'bg-white text-stone-700 border-stone-300'}">
              ${p.isPinned ? '📌 取消置頂' : '📌 置頂'}
            </button>
            
            <button onclick="toggleBanUser('${p.authorLineId}')" class="flex-1 bg-white hover:bg-stone-50 text-stone-700 border-2 border-stone-300 px-3 py-2 rounded-xl text-sm font-black">
              🚫 禁言管理
            </button>
            
            <button onclick="deletePost('${p.id}')" class="flex-1 bg-red-50 text-red-600 border-2 border-red-200 px-3 py-2 rounded-xl text-sm font-black">
              🗑️ 刪除
            </button>
          </div>
        </div>
      `).join("");
    }

    async function togglePinPost(postId, pin) {
      showLoading("處理中...");
      try {
        const r = await apiPost({ action: "pinPost", postId, isPinned: pin, lineId: userLineId });
        if (r.status === "success") {
          allPosts = r.posts;
          renderAdminPostList();
          renderAll(); 
        }
      } finally {
        hideLoading();
      }
    }

    async function toggleBanUser(targetLineId) {
      if (targetLineId.startsWith("NORMAL_")) {
        return;
      }
      showLoading("處理中...");
      try {
        const r = await apiPost({ action: "toggleBanUser", targetLineId, lineId: userLineId });
        if (r.status === "success") {
          showTemporaryToast(r.isBanned ? "該使用者已被禁止發言！" : "該使用者已解除禁言。");
        }
      } finally {
        hideLoading();
      }
    }

    async function deletePost(postId) {
      showLoading("刪除中...");
      try {
        const r = await apiPost({ action: "deletePost", postId, lineId: userLineId });
        if (r.status === "success") {
          allPosts = r.posts;
          renderAdminPostList();
          renderAll(); 
        }
      } finally {
        hideLoading();
      }
    }

    async function addNewCategory() {
      const input = document.getElementById("newCategoryInput");
      const categoryName = input.value.trim();
      if (!categoryName) return;
      showLoading("新增中...");
      try {
        const r = await apiPost({ action: "addForumCategory", categoryName, lineId: userLineId });
        if (r.status === "success") {
          input.value = "";
          allCategories = r.categories;
          renderCategories();
        }
      } finally {
        hideLoading();
      }
    }

    document.addEventListener("DOMContentLoaded", initializeLiff);
  </script>
</body>
