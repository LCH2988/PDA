<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>管理後台｜台灣帕金森病友權益促進會</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{--main:#1d5f80;--dark:#0f3d54;--accent:#ffb02e;--bg:#f1f5f8;--line:#c9d6de;--ok:#1b8a4b;--bad:#c0392b}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:16px;background:var(--bg);color:#1a1a1a;display:flex;min-height:100vh}
aside{width:220px;background:var(--dark);color:#fff;padding:12px 8px;position:sticky;top:0;height:100vh;overflow:auto;flex:none}
aside h1{font-size:1rem;margin:4px 8px 12px;line-height:1.4}
aside a{display:flex;justify-content:space-between;align-items:center;color:#fff;text-decoration:none;padding:10px 12px;border-radius:8px;font-weight:700;font-size:.92rem;cursor:pointer}
aside a:hover{background:#fff2}aside a.on{background:var(--main)}
aside .sep{font-size:.75rem;opacity:.6;margin:12px 12px 4px}
.badge{background:var(--bad);color:#fff;border-radius:10px;padding:0 7px;font-size:.75rem}
main{flex:1;padding:18px 20px;min-width:0}
h2{margin:0 0 12px;color:var(--dark)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar input,.bar select{width:auto;min-width:160px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:38px;padding:4px 14px;background:var(--accent);color:#000;border:0;border-radius:8px;font-weight:700;font-size:.9rem;cursor:pointer;font-family:inherit}
.btn.sec{background:var(--main);color:#fff}.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:var(--bad);color:#fff}.btn.gh{background:#fff;border:1px solid var(--main);color:var(--dark)}
.btn.sm{min-height:30px;padding:2px 10px;font-size:.8rem}
.btn:disabled{opacity:.5;cursor:wait}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.stat{background:#fff;border:2px solid var(--line);border-radius:12px;padding:14px;text-align:center;cursor:pointer}

splay:block;font-size:2rem;color:var(--main)}.stat.warn b{color:var(--bad)}
.tw{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 10px;border-bottom:1px solid #e3eaef;text-align:left;vertical-align:top}
th{background:#e8f0f5;position:sticky;top:0;white-space:nowrap}
td.act{white-space:nowrap}
.tag{display:inline-block;border-radius:12px;padding:0 9px;font-size:.78rem;font-weight:700;background:#e3f0f6;color:var(--dark)}
.tag.g{background:#d9f2e3;color:#14663a}.tag.r{background:#fbdcd8;color:#8e2a1f}.tag.y{background:#fff0c9;color:#7a5400}
.clip{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
label{display:block;font-weight:700;margin-top:10px;font-size:.9rem}
input,select,textarea{width:100%;min-height:40px;padding:6px 10px;font-size:.95rem;border:1px solid #8aa;border-radius:8px;font-family:inherit;background:#fff;margin-top:3px}
input[type=checkbox]{width:20px;min-height:20px;vertical-align:middle;margin-right:6px}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:50}
#modal .box{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:680px}
#modal h3{margin:0 0 6px}
.up{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:3px}
.up img{height:54px;border-radius:6px;border:1px solid var(--line)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:10px 22px;border-radius:10px;display:none;z-index:99}
#gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:90}
.muted{color:#667;font-size:.82rem}
@media(max-width:800px){body{flex-direction:column}aside{width:100%;height:auto;position:static;display:flex;flex-wrap:wrap}aside h1,aside .sep{width:100%}}
</style>
</head>
<body>
<div id="gate">載入中…</div>
<aside id="side"></aside>
<main id="app"></main>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwPI9Xw7jsvSRIeTHkRk9yOFzBvW_DtwBMADDGl_AOJRF2zFGPtF665DE41OjpuSEop/exec';   // ← 請改成您最新部署的網址
const LIFF_ID = '2009456572-ZNpC8066';   // ← LIFF ID

let idToken = null, me = null, CNT = {}, CUR = 'dash';
const LIST = {};
let FORM = {};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtD = d => d ? String(d).slice(0, 10) : '';
let tt; function toast(m) { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(tt); tt = setTimeout(() => t.style.display = 'none', 2800); }
async function safe(fn) { try { await fn(); } catch (e) { toast(e.message); } }

async function api(action, params = {}) {
  if (!API_URL) throw new Error('尚未設定 API_URL');
  const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, params, idToken }) });
  const j = await res.json();
  if (!j.ok) {
    if (/過期|請先登入/.test(j.message || '') && LIFF_ID) { toast('登入已過期，重新登入中…'); setTimeout(() => { liff.logout(); liff.login({ redirectUri: location.href }); }, 1200); }
    throw new Error(j.message || '發生錯誤');
  }
  return j.data;
}

/* ========== 資料表設定 ========== */
const STATUS_TAG = { published: ['g', '已發布'], draft: ['y', '草稿'], pending: ['y', '待審'], rejected: ['r', '已退回'], hidden: ['r', '已下架'],
  '已確認': ['g', '已確認'], '待確認': ['y', '待確認'], '已取消': ['r', '已取消'], '啟用': ['g', '啟用'], '待審': ['y', '待審'], '停用': ['r', '停用'],
  '已報名': ['', '已報名'], '已出席': ['g', '已出席'] };
const tag = s => { const t = STATUS_TAG[s] || ['', s || '']; return `<span class="tag ${t[0]}">${esc(t[1])}</span>`; };

const SHEETS = {
  News: { title: '最新消息', key: 'id', edit: true, folder: 'news',
    cols: [['title', '標題', 'clip'], ['category', '分類'], ['publishDate', '日期', 'd'], ['status', '狀態', 's'], ['pinned', '置頂', 'p']],
    fields: [
      { k: 'title', l: '標題', t: 'text' },
      { k: 'category', l: '分類', t: 'select', o: ['公告', '活動', '權益', '衛教', '新聞'] },
      { k: 'publishDate', l: '發布日期', t: 'date' },
      { k: 'status', l: '狀態', t: 'select', o: [['published', '發布'], ['draft', '草稿']] },
      { k: 'pinned', l: '置頂', t: 'check' },
      { k: 'content', l: '內容', t: 'textarea', rows: 10 },
      { k: 'coverId', l: '封面圖片', t: 'upload', accept: 'image/*', store: 'id' },
      { k: 'attachUrl', l: '附件（PDF）', t: 'upload', accept: 'application/pdf', store: 'url' }] },
  Events: { title: '活動管理', key: 'id', edit: true, folder: 'events',
    cols: [['title', '活動', 'clip'], ['date', '日期', 'd'], ['location', '地點'], ['capacity', '名額'], ['deadline', '報名截止', 'd'], ['status', '狀態', 's']],
    fields: [
      { k: 'title', l: '活動名稱', t: 'text' },
      { k: 'date', l: '活動日期', t: 'date' },
      { k: 'location', l: '地點', t: 'text' },
      { k: 'capacity', l: '名額（含同行者的總人數）', t: 'number' },
      { k: 'deadline', l: '報名截止日', t: 'date' },
      { k: 'status', l: '狀態', t: 'select', o: [['published', '發布'], ['draft', '草稿']] },
      { k: 'description', l: '活動說明', t: 'textarea', rows: 8 },
      { k: 'coverId', l: '活動封面', t: 'upload', accept: 'image/*', store: 'id' }] },
  Resources: { title: '衛教資源', key: 'id', edit: true, folder: 'resources',
    cols: [['title', '標題', 'clip'], ['category', '分類'], ['type', '類型'], ['status', '狀態', 's']],
    fields: [
      { k: 'title', l: '標題', t: 'text' },
      { k: 'category', l: '分類', t: 'select', o: ['疾病認識', '運動復健', '權益', '照顧者', '藥物', '飲食'] },
      { k: 'type', l: '類型', t: 'select', o: [['pdf', 'PDF 文件'], ['video', '影片'], ['article', '文章'], ['link', '外部連結']] },
      { k: 'status', l: '狀態', t: 'select', o: [['published', '發布'], ['draft', '草稿']] },
      { k: 'description', l: '簡短說明', t: 'textarea', rows: 3 },
      { k: 'url', l: '連結（影片／網址，或上傳 PDF）', t: 'upload', accept: 'application/pdf', store: 'url', allowText: true }] },
  ForumPosts: { title: '論壇文章', key: 'id',
    cols: [['createdAt', '時間', 'd'], ['board', '討論區'], ['title', '標題', 'clip'], ['authorName', '作者'], ['status', '狀態', 's']],
    acts: [['published', '通過', 'ok'], ['rejected', '退回', 'bad'], ['hidden', '下架', 'gh']], view: ['content'] },
  ForumReplies: { title: '論壇回覆', key: 'id',
    cols: [['createdAt', '時間', 'd'], ['authorName', '作者'], ['content', '內容', 'clip'], ['status', '狀態', 's']],
    acts: [['published', '顯示', 'ok'], ['hidden', '下架', 'bad']] },
  Donations: { title: '捐款管理', key: 'id',
    cols: [['createdAt', '時間', 'd'], ['name', '捐款人'], ['amount', '金額'], ['method', '方式'], ['receiptNeeded', '收據'], ['status', '狀態', 's']],
    acts: [['已確認', '確認收款', 'ok'], ['待確認', '改回待確認', 'gh'], ['已取消', '取消', 'bad']],
    view: ['email', 'receiptTitle', 'taxId', 'address'] },
  Members: { title: '會員管理', key: 'userId',
    cols: [['createdAt', '加入', 'd'], ['displayName', 'LINE 名稱'], ['name', '姓名'], ['phone', '電話'], ['identity', '身分'], ['expireDate', '到期日', 'd'], ['role', '角色', 'r'], ['status', '狀態', 's']],
    acts: [['啟用', '啟用', 'ok'], ['停用', '停用', 'bad']], member: true },
  Registrations: { title: '報名名單', key: 'id',
    cols: [['createdAt', '報名時間', 'd'], ['eventTitle', '活動', 'clip'], ['name', '姓名'], ['phone', '電話'], ['companions', '同行'], ['note', '備註', 'clip'], ['status', '狀態', 's']],
    acts: [['已出席', '出席', 'ok'], ['已報名', '改回已報名', 'gh'], ['已取消', '取消', 'bad']], csv: true }
};
const NAV = [['dash', '📊 總覽'], ['sep', '內容管理'], ['News', '📰 最新消息'], ['Events', '📅 活動管理'], ['Resources', '📚 衛教資源'],
             ['sep', '審核與處理'], ['ForumPosts', '💬 論壇文章', 'pendingPosts'], ['ForumReplies', '↩️ 論壇回覆'],
             ['Donations', '❤️ 捐款', 'pendingDonations'], ['Members', '👤 會員', 'pendingMembers'], ['Registrations', '📝 報名名單']];

function drawSide() {
  $('#side').innerHTML = `<h1>🎗️ 管理後台<br><span style="font-weight:400;font-size:.8rem">${esc(me.displayName || '')}</span></h1>` +
    NAV.map(([k, n, c]) => k === 'sep' ? `<div class="sep">${n}</div>` :
      `<a class="${k === CUR ? 'on' : ''}" onclick="nav('${k}')">${n}${CNT[c] ? `<span class="badge">${CNT[c]}</span>` : ''}</a>`).join('') +
    `<div class="sep">其他</div><a href="checkin.html">📲 簽到頁</a><a href="index.html">🌐 回前台</a>`;
}
window.nav = k => { CUR = k; drawSide(); safe(() => k === 'dash' ? dash() : table(k)); };

/* ========== 總覽 ========== */
async function dash() {
  CNT = await api('admin_dashboard'); drawSide();
  const c = (n, label, go, warn) => `<div class="stat ${warn && n ? 'warn' : ''}" onclick="nav('${go}')"><b>${n ?? 0}</b>${label}</div>`;
  $('#app').innerHTML = `<h2>總覽</h2><div class="cards">
    ${c(CNT.pendingPosts, '待審論壇文章', 'ForumPosts', 1)}${c(CNT.pendingDonations, '待確認捐款', 'Donations', 1)}
    ${c(CNT.pendingMembers, '待審核會員', 'Members', 1)}${c(CNT.upcomingEvents, '即將舉辦活動', 'Events')}${c(CNT.registrations, '有效報名筆數', 'Registrations')}</div>
    <p class="muted" style="margin-top:20px">建議每天固定時間處理待審項目。新文章、新捐款、新會員時，管理員也會收到 LINE 通知。</p>`;
}

/* ========== 清單 ========== */
function cell(c, r) {
  const v = r[c[0]], t = c[2] || '';
  if (t === 's') return tag(v);
  if (t === 'd') return esc(fmtD(v));
  if (t === 'p') return v === 'Y' || v === true || v === 'TRUE' ? '📌' : '';
  if (t === 'r') return v === 'admin' ? '<span class="tag y">管理員</span>' : '會員';
  if (c[0] === 'receiptNeeded') return v === 'Y' ? '需要' : '—';
  if (c[0] === 'amount') return 'NT$ ' + Number(v || 0).toLocaleString();
  return t === 'clip' ? `<div class="clip" title="${esc(v)}">${esc(v)}</div>` : esc(v);
}
async function table(sheet) {
  const cfg = SHEETS[sheet];
  $('#app').innerHTML = `<h2>${cfg.title}</h2><p class="muted">載入中…</p>`;
  LIST[sheet] = await api('admin_list', { sheet });
  window._filter = { sheet, q: '', st: '', ev: '' };
  renderTable();
}
function renderTable() {
  const f = window._filter, sheet = f.sheet, cfg = SHEETS[sheet], all = LIST[sheet];
  const statuses = [...new Set(all.map(r => r.status).filter(Boolean))];
  const events = sheet === 'Registrations' ? [...new Set(all.map(r => r.eventTitle))] : [];
  const rows = all.map((r, i) => [r, i]).filter(([r]) =>
    (!f.q || JSON.stringify(r).toLowerCase().includes(f.q.toLowerCase())) && (!f.st || r.status === f.st) && (!f.ev || r.eventTitle === f.ev));
  $('#app').innerHTML = `<h2>${cfg.title} <span class="muted">（${rows.length} / ${all.length}）</span></h2>
  <div class="bar">
    ${cfg.edit ? `<button class="btn sec" onclick="openEdit('${sheet}',-1)">＋ 新增</button>` : ''}
    <input id="fq" placeholder="🔍 搜尋（姓名、電話、標題…）" value="${esc(f.q)}" oninput="_filter.q=this.value;renderKeep()">
    <select onchange="_filter.st=this.value;renderTable()"><option value="">全部狀態</option>${statuses.map(s => `<option ${s === f.st ? 'selected' : ''} value="${esc(s)}">${esc((STATUS_TAG[s] || [0, s])[1])}</option>`).join('')}</select>
    ${events.length ? `<select onchange="_filter.ev=this.value;renderTable()"><option value="">全部活動</option>${events.map(s => `<option ${s === f.ev ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>` : ''}
    ${cfg.csv ? `<button class="btn gh" onclick="exportCsv()">⬇️ 匯出 CSV</button>` : ''}
    <button class="btn gh" onclick="table('${sheet}')">🔄 重新整理</button></div>
  <div class="tw"><table><tr>${cfg.cols.map(c => `<th>${c[1]}</th>`).join('')}<th>操作</th></tr>
    ${rows.map(([r, i]) => `<tr>${cfg.cols.map(c => `<td>${cell(c, r)}</td>`).join('')}<td class="act">${actions(sheet, i)}</td></tr>`).join('') ||
      `<tr><td colspan="${cfg.cols.length + 1}" class="muted">沒有資料</td></tr>`}</table></div>`;
}
window.renderKeep = () => { const pos = $('#fq').selectionStart; renderTable(); const q = $('#fq'); q.focus(); q.setSelectionRange(pos, pos); };

function actions(sheet, i) {
  const cfg = SHEETS[sheet], r = LIST[sheet][i], cur = r.status;
  let h = '';
  if (cfg.edit) h += `<button class="btn sm sec" onclick="openEdit('${sheet}',${i})">編輯</button> <button class="btn sm bad" onclick="delRow('${sheet}',${i})">刪除</button>`;
  (cfg.acts || []).filter(a => a[0] !== cur).forEach(a => { h += `<button class="btn sm ${a[2]}" onclick="setStatus('${sheet}',${i},'${a[0]}')">${a[1]}</button> `; });
  if (cfg.view) h += `<button class="btn sm gh" onclick="viewRow('${sheet}',${i})">詳情</button> `;
  if (cfg.member) h += `<button class="btn sm gh" onclick="memberEdit(${i})">編輯會員</button>`;
  return h;
}
window.setStatus = (sheet, i, status) => safe(async () => {
  const cfg = SHEETS[sheet], r = LIST[sheet][i];
  const warn = { '已取消': '確定要取消嗎？', rejected: '確定要退回這篇文章嗎？', hidden: '確定要下架嗎？', '停用': '確定要停用這位會員嗎？' }[status];
  if (warn && !confirm(warn)) return;
  await api('admin_patch', { sheet, id: r[cfg.key], patch: { status } });
  toast('✅ 已更新'); await table(sheet); CNT = await api('admin_dashboard'); drawSide();
});
window.delRow = (sheet, i) => safe(async () => {
  const r = LIST[sheet][i];
  if (!confirm('確定要刪除「' + (r.title || '') + '」？\n此動作無法復原。（若只是暫時不顯示，請改成草稿）')) return;
  await api('admin_delete', { sheet, id: r.id }); toast('已刪除'); table(sheet);
});

/* ========== 詳情（含個資，僅管理員可見） ========== */
const LABELS = { content: '內容', email: 'Email', receiptTitle: '收據抬頭', taxId: '身分證／統編', address: '寄送地址' };
window.viewRow = (sheet, i) => {
  const cfg = SHEETS[sheet], r = LIST[sheet][i];
  openModal(`<h3>詳情</h3>${cfg.view.map(k => `<label>${LABELS[k] || k}</label><div style="white-space:pre-wrap;background:#f6f9fb;padding:8px;border-radius:8px">${esc(r[k]) || '—'}</div>`).join('')}
    <p class="muted">此處含個人資料，請勿外流或截圖轉傳。</p><div style="margin-top:14px"><button class="btn gh" onclick="closeModal()">關閉</button></div>`);
};

/* ========== 會員編輯 ========== */
window.memberEdit = i => {
  const r = LIST.Members[i];
  openModal(`<h3>編輯會員：${esc(r.displayName)}</h3>
    <div class="muted">姓名 ${esc(r.name) || '—'}　電話 ${esc(r.phone) || '—'}　Email ${esc(r.email) || '—'}　${esc(r.city) || ''}</div>
    <label>狀態</label><select id="m_st">${['待審', '啟用', '停用'].map(s => `<option ${r.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select>
    <label>會籍到期日</label><input type="date" id="m_ex" value="${esc(fmtD(r.expireDate))}">
    <label>身分</label><select id="m_id">${['病友', '家屬／照顧者', '志工', '醫護人員', '一般民眾'].map(s => `<option ${r.identity === s ? 'selected' : ''}>${s}</option>`).join('')}</select>
    <label>角色</label><select id="m_ro"><option value="member" ${r.role !== 'admin' ? 'selected' : ''}>一般會員</option><option value="admin" ${r.role === 'admin' ? 'selected' : ''}>管理員（可進後台與簽到）</option></select>
    <div style="margin-top:16px;display:flex;gap:8px"><button class="btn sec" onclick="saveMember(${i})">儲存</button><button class="btn gh" onclick="closeModal()">取消</button></div>`);
};
window.saveMember = i => safe(async () => {
  const r = LIST.Members[i];
  const patch = { status: $('#m_st').value, expireDate: $('#m_ex').value, identity: $('#m_id').value, role: $('#m_ro').value };
  if (patch.role === 'admin' && r.role !== 'admin' && !confirm('確定要把「' + r.displayName + '」設為管理員嗎？\n管理員可以查看所有會員、捐款個資。')) return;
  await api('admin_patch', { sheet: 'Members', id: r.userId, patch });
  closeModal(); toast('✅ 已儲存'); table('Members');
});

/* ========== 新增／編輯表單 ========== */
function openModal(html) { $('#mbox').innerHTML = html; $('#modal').style.display = 'flex'; }
window.closeModal = () => { $('#modal').style.display = 'none'; };

window.openEdit = (sheet, i) => {
  const cfg = SHEETS[sheet], r = i >= 0 ? LIST[sheet][i] : {};
  FORM = { _sheet: sheet };
  cfg.fields.forEach(f => { FORM[f.k] = r[f.k] ?? (f.t === 'select' ? (Array.isArray(f.o[0]) ? f.o[0][0] : f.o[0]) : ''); });
  if (r.id) FORM.id = r.id;
  if (i < 0) { if ('status' in FORM) FORM.status = 'draft'; if ('publishDate' in FORM) FORM.publishDate = new Date().toISOString().slice(0, 10); }
  FORM.pinned = FORM.pinned === 'Y' || FORM.pinned === true || FORM.pinned === 'TRUE' ? 'Y' : '';
  openModal(`<h3>${i >= 0 ? '編輯' : '新增'}：${cfg.title}</h3>${cfg.fields.map(fieldHtml).join('')}
    <div style="margin-top:18px;display:flex;gap:8px"><button class="btn sec" id="sbtn" onclick="submitForm()">💾 儲存</button><button class="btn gh" onclick="closeModal()">取消</button></div>`);
};
function fieldHtml(f) {
  const v = FORM[f.k] ?? '', k = f.k;
  if (f.t === 'textarea') return `<label>${f.l}</label><textarea rows="${f.rows || 4}" oninput="FORM.${k}=this.value">${esc(v)}</textarea>`;
  if (f.t === 'select') return `<label>${f.l}</label><select onchange="FORM.${k}=this.value">${f.o.map(o => { const [val, lab] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(val)}" ${val === v ? 'selected' : ''}>${esc(lab)}</option>`; }).join('')}</select>`;
  if (f.t === 'check') return `<label><input type="checkbox" ${v === 'Y' ? 'checked' : ''} onchange="FORM.${k}=this.checked?'Y':''">${f.l}</label>`;
  if (f.t === 'upload') {
    const isImg = f.store === 'id';
    return `<label>${f.l}</label><div class="up" id="up_${k}">
      ${f.allowText ? `<input style="flex:1;min-width:200px" placeholder="貼上網址" value="${esc(v)}" oninput="FORM.${k}=this.value">` : ''}
      <input type="file" accept="${f.accept}" style="flex:1;min-width:200px" onchange="doUpload('${k}',this)">
      <span id="upst_${k}" class="muted">${v ? (isImg ? '' : '已有檔案／連結') : ''}</span>
      ${isImg && v ? `<img src="https://drive.google.com/thumbnail?id=${esc(v)}&sz=w200" alt=""> <button type="button" class="btn sm gh" onclick="FORM.${k}='';document.getElementById('up_${k}').querySelector('img').remove()">移除</button>` : ''}</div>`;
  }
  return `<label>${f.l}</label><input type="${f.t}" value="${esc(v)}" oninput="FORM.${k}=this.value">`;
}

// 圖片壓縮到最長邊 1600px，縮小上傳量
function readFile(file) {
  return new Promise((res, rej) => {
    if (!file.type.startsWith('image/') || file.type === 'image/gif') {
      const fr = new FileReader(); fr.onload = () => res({ b64: fr.result.split(',')[1], mime: file.type, name: file.name }); fr.onerror = rej; return fr.readAsDataURL(file);
    }
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 1600 / Math.max(img.width, img.height)), cv = document.createElement('canvas');
      cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      res({ b64: cv.toDataURL('image/jpeg', .85).split(',')[1], mime: 'image/jpeg', name: file.name.replace(/\.\w+$/, '') + '.jpg' });
    };
    img.onerror = () => rej(new Error('無法讀取圖片')); img.src = url;
  });
}
window.doUpload = (k, input) => safe(async () => {
  const file = input.files[0]; if (!file) return;
  if (file.size > 20 * 1024 * 1024) throw new Error('檔案太大');
  const f = SHEETS[FORM._sheet].fields.find(x => x.k === k), st = $('#upst_' + k);
  st.textContent = '上傳中…';
  try {
    const d = await readFile(file);
    const r = await api('admin_uploadFile', { folder: SHEETS[FORM._sheet].folder, name: d.name, mime: d.mime, base64: d.b64 });
    FORM[k] = f.store === 'id' ? r.id : r.url;
    st.textContent = '✅ 已上傳：' + d.name;
    if (f.store === 'id') { const box = $('#up_' + k); box.querySelector('img')?.remove(); box.insertAdjacentHTML('beforeend', `<img src="https://drive.google.com/thumbnail?id=${r.id}&sz=w200" alt="">`); }
  } catch (e) { st.textContent = '❌ 上傳失敗'; throw e; }
});
window.submitForm = () => safe(async () => {
  const btn = $('#sbtn'); btn.disabled = true;
  try {
    const sheet = FORM._sheet, row = Object.assign({}, FORM); delete row._sheet;
    if (!String(row.title || '').trim()) throw new Error('請填寫標題');
    if (sheet === 'Events') { if (!row.date) throw new Error('請選擇活動日期'); if (!(Number(row.capacity) > 0)) throw new Error('請填寫名額'); }
    await api('admin_save', { sheet, row });
    closeModal(); toast('✅ 已儲存'); table(sheet);
  } finally { btn.disabled = false; }
});

/* ========== 匯出 CSV（報名名單） ========== */
window.exportCsv = () => {
  const f = window._filter, rows = LIST.Registrations.filter(r => (!f.st || r.status === f.st) && (!f.ev || r.eventTitle === f.ev));
  const head = ['報名時間', '活動', '姓名', '電話', '同行人數', '備註', '狀態'];
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const phone = v => v ? '="' + String(v).replace(/"/g, '') + '"' : '';
  const lines = [head.map(q).join(',')].concat(rows.map(r =>
    [q(r.createdAt), q(r.eventTitle), q(r.name), phone(r.phone), q(r.companions), q(r.note), q(r.status)].join(',')));
  const blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = '報名名單_' + new Date().toISOString().slice(0, 10) + '.csv'; a.click();
  toast('已匯出 ' + rows.length + ' 筆。檔案含個資，請妥善保管');
};

addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ========== 啟動與權限檢查 ========== */
(async () => {
  const gate = h => $('#gate').innerHTML = h;
  try {
    if (!LIFF_ID || !API_URL) return gate('<div><h2>尚未設定</h2>請先在檔案中填入 API_URL 與 LIFF_ID。</div>');
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) return gate('<div><h2>管理員登入</h2><p>請使用管理員的 LINE 帳號登入。</p><button class="btn" style="min-height:50px;font-size:1.1rem" onclick="liff.login({redirectUri:location.href})">💚 LINE 登入</button></div>');
    idToken = liff.getIDToken();
    const p = await liff.getProfile();
    me = await api('login', { displayName: p.displayName, pictureUrl: p.pictureUrl });
    if (me.role !== 'admin') return gate('<div><h2>🚫 沒有權限</h2><p>此帳號不是管理員。<br>請聯絡協會，在「會員」工作表把您的「角色」設為 admin。</p><a href="index.html">回前台</a></div>');
    $('#gate').style.display = 'none';
    drawSide(); await dash();
  } catch (e) { $('#gate').innerHTML = '發生錯誤：' + esc(e.message); }
})();
</script>
