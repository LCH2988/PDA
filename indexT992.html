<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>台灣帕金森病友權益促進會 - 活動登記與接龍系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang TC", "Microsoft JhengHei", sans-serif;
      -webkit-tap-highlight-color: transparent;
      font-size: 20px !important;
    }
    input, select, textarea {
      min-height: 64px !important;
      font-size: 22px !important;
      border-width: 3px !important;
    }
    button {
      min-height: 64px !important;
      font-size: 22px !important;
      border-width: 3px !important;
    }
    .border-3 { border-width: 3px; }
    .active-scale:active { transform: scale(0.96); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>

<body class="bg-stone-100 text-stone-900 min-h-screen pb-28 font-bold selection:bg-emerald-200">

  <!-- Header -->
  <header class="bg-gradient-to-r from-emerald-800 via-emerald-700 to-teal-600 text-white sticky top-0 z-40 shadow-xl border-b-4 border-emerald-950">
    <div class="max-w-md mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="bg-white p-2 rounded-2xl shadow-md">
          <span class="text-4xl">🌷</span>
        </div>
        <div>
          <h1 class="text-2xl font-black tracking-wide leading-none">帕金森促進會</h1>
          <span class="text-sm bg-emerald-950 text-emerald-100 px-3 py-1 rounded-full font-black mt-1.5 inline-block">活動登記與接龍</span>
        </div>
      </div>

      <div class="flex items-center space-x-2">
        <button id="adminBtn" onclick="enterAdminMode()" class="hidden bg-stone-950 hover:bg-black border-3 border-white text-white text-lg font-black px-4 py-2 rounded-2xl active-scale shadow-md">
          ⚙️ 後台
        </button>
        <button id="loginHeaderBtn" onclick="openAuthModal()" class="bg-emerald-900 hover:bg-emerald-950 text-white text-base font-black px-4 py-2 rounded-2xl border-3 border-emerald-300 active-scale shadow-md">
          👤 登入
        </button>
        <div id="userAvatarContainer" class="hidden relative">
          <img id="userAvatar" onclick="handleHeaderLogout()" class="w-14 h-14 rounded-full border-3 border-white shadow-md cursor-pointer object-cover active-scale" src="" alt="頭像" title="點擊登出">
          <span id="userRoleBadge" class="absolute -bottom-1 -right-1 text-xs px-2 py-0.5 rounded-full font-black text-white shadow-sm"></span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="max-w-md mx-auto px-4 py-4 space-y-5">

    <!-- User Panel -->
    <section class="bg-white rounded-3xl p-6 shadow-md border-3 border-stone-300 space-y-5">
      <div class="flex justify-between items-start">
        <div>
          <p class="text-lg text-stone-600 font-black flex items-center">歡迎回來 <span class="ml-1 text-2xl">👋</span></p>
          <p class="text-3xl font-black text-stone-950 mt-1">
            <span id="userName" class="border-b-4 border-amber-400 pb-1">訪客</span>
          </p>
          <p id="userRoleText" class="text-base font-black text-stone-500 mt-2">請先登入</p>
        </div>
        <button id="editProfileBtn" onclick="openProfileModal()" class="hidden bg-stone-100 hover:bg-stone-200 text-stone-800 font-black px-5 py-3 rounded-2xl border-3 border-stone-400 active-scale shadow-sm">
          ✏️ 修改
        </button>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <button id="profileQuickBtn" onclick="openProfileModal()" class="hidden w-full bg-stone-100 hover:bg-stone-200 text-stone-900 font-black py-4 rounded-2xl text-xl border-3 border-stone-400 active-scale shadow-sm">
          👤 會員資料
        </button>
        <button id="myRegQuickBtn" onclick="openMyRegistrationsModal()" class="hidden w-full bg-amber-100 hover:bg-amber-200 text-amber-950 font-black py-4 rounded-2xl text-xl border-3 border-amber-400 active-scale shadow-sm">
          📋 我的登記
        </button>
      </div>
    </section>

    <!-- Category -->
    <section class="space-y-3">
      <div class="flex justify-between items-center px-1">
        <h2 class="text-xl font-black text-stone-800">📁 依類別篩選</h2>
        <button id="clearFilterBtn" onclick="clearCategoryFilter()" class="hidden text-base bg-stone-800 text-white px-4 py-1.5 rounded-full font-black active-scale shadow-sm">
          顯示全部
        </button>
      </div>
      <div id="categoryBigButtonsContainer" class="grid grid-cols-1 gap-3">
        <div class="animate-pulse bg-stone-200 h-20 rounded-3xl"></div>
      </div>
    </section>

    <!-- Search -->
    <section class="bg-white rounded-3xl p-5 shadow-md border-3 border-stone-300 space-y-3">
      <label class="block text-base font-black text-stone-700">🔍 搜尋活動名稱、地點</label>
      <input type="text" id="keywordSearch" oninput="filterByKeyword(this.value)" class="w-full border-3 border-stone-400 rounded-2xl p-4 text-xl font-bold bg-white" placeholder="請輸入關鍵字">
    </section>

    <!-- Events -->
    <section id="eventListSection" class="space-y-4">
      <div class="bg-white rounded-3xl p-5 border-3 border-stone-300 shadow-sm">
        <h2 class="text-2xl font-black text-stone-950 flex items-center justify-center">
          📅 <span id="selectedCategoryTitle" class="ml-2">所有活動列表</span>
        </h2>
      </div>
      <div id="eventListContainer" class="space-y-5"></div>
    </section>
  </main>

  <!-- Lightbox -->
  <div id="lightboxModal" class="fixed inset-0 bg-black/95 z-50 hidden flex flex-col justify-between p-4 select-none">
    <div class="flex justify-between items-center text-white z-10 py-2">
      <span id="lightboxIndicator" class="text-xl font-black bg-black/40 px-5 py-2 rounded-full">1 / 1</span>
      <button onclick="closeLightbox()" class="bg-white/10 text-white w-14 h-14 rounded-full text-3xl font-black active-scale">✕</button>
    </div>
    <div class="relative flex-1 flex items-center justify-center">
      <button onclick="changeLightboxImage(-1)" class="absolute left-2 bg-black/50 text-white w-16 h-16 rounded-full text-4xl font-black z-10 active-scale">◀</button>
      <img id="lightboxMainImage" class="max-h-[65vh] max-w-full object-contain rounded-xl shadow-2xl" src="" alt="大圖">
      <button onclick="changeLightboxImage(1)" class="absolute right-2 bg-black/50 text-white w-16 h-16 rounded-full text-4xl font-black z-10 active-scale">▶</button>
    </div>
    <div class="py-4 border-t border-white/10">
      <div id="lightboxThumbnails" class="flex justify-center space-x-3 overflow-x-auto no-scrollbar py-2 px-4 max-w-md mx-auto"></div>
    </div>
  </div>

  <!-- Auth Modal -->
  <div id="authModal" class="fixed inset-0 bg-stone-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-md shadow-2xl border-4 border-stone-400 overflow-hidden">
      <div class="bg-gradient-to-r from-emerald-800 to-teal-700 text-white p-5 flex justify-between items-center border-b-4 border-emerald-900">
        <button onclick="closeModal('authModal')" class="bg-emerald-950 text-white px-4 py-2 rounded-xl text-base font-black shadow-md">⬅ 返回</button>
        <h3 class="text-2xl font-black">登入 / 註冊</h3>
      </div>

      <div class="grid grid-cols-2 border-b-3 border-stone-200 bg-stone-50">
        <button onclick="switchAuthTab('login')" id="authTabBtn_login" class="py-4 text-lg font-black text-emerald-800 border-b-4 border-emerald-800 bg-white">帳號登入</button>
        <button onclick="switchAuthTab('register')" id="authTabBtn_register" class="py-4 text-lg font-black text-stone-500">新用戶註冊</button>
      </div>

      <div class="p-6 space-y-5">
        <button onclick="handleHeaderLogin()" class="w-full bg-[#06C755] hover:bg-[#05B34C] text-white font-black py-5 rounded-2xl text-xl shadow-md active-scale">
          💬 LINE 快速登入 / 綁定
        </button>

        <div class="relative flex py-2 items-center">
          <div class="flex-grow border-t-2 border-stone-300"></div>
          <span class="flex-shrink mx-4 text-stone-400 text-sm font-black">或使用一般帳號</span>
          <div class="flex-grow border-t-2 border-stone-300"></div>
        </div>

        <form id="authLoginForm" onsubmit="handleNormalLogin(event)" class="space-y-4">
          <div>
            <label class="block text-base font-black text-stone-800 mb-1">姓名 *</label>
            <input type="text" id="authLoginName" class="w-full border-3 border-stone-400 rounded-xl p-4 text-lg font-bold" required>
          </div>
          <div>
            <label class="block text-base font-black text-stone-800 mb-1">手機 *</label>
            <input type="tel" id="authLoginPhone" class="w-full border-3 border-stone-400 rounded-xl p-4 text-lg font-bold" required>
          </div>
          <button type="submit" class="w-full bg-emerald-700 text-white font-black py-5 rounded-2xl text-xl shadow-md">登入</button>
        </form>

        <form id="authRegisterForm" onsubmit="handleNormalRegister(event)" class="space-y-4 hidden">
          <div id="registerNotice" class="bg-amber-50 p-4 rounded-2xl border-2 border-amber-200 text-sm text-amber-950 font-bold leading-relaxed">
            免 LINE 註冊者身分為遊客；若需自行報名，請使用 LINE 登入綁定。
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-base font-black text-stone-800 mb-1">真實姓名 *</label>
              <input type="text" id="regName" class="w-full border-3 border-stone-400 rounded-xl p-4 text-lg font-bold" required>
            </div>
            <div>
              <label class="block text-base font-black text-stone-800 mb-1">暱稱</label>
              <input type="text" id="regNickname" class="w-full border-3 border-stone-400 rounded-xl p-4 text-lg font-bold">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-base font-black text-stone-800 mb-1">手機 *</label>
              <input type="tel" id="regPhone" class="w-full border-3 border-stone-400 rounded-xl p-4 text-lg font-bold" required>
            </div>
            <div>
              <label class="block text-base font-black text-stone-800 mb-1">性別 *</label>
              <select id="regGender" class="w-full border-3 border-stone-400 rounded-xl p-4 text-lg font-bold bg-white" required>
                <option value="">請選擇</option>
                <option value="男">男</option>
                <option value="女">女</option>
              </select>
            </div>
          </div>
          <div>
            <label class="block text-base font-black text-stone-800 mb-1">生日，民國格式 *</label>
            <input type="text" id="regBirthday" class="w-full border-3 border-stone-400 rounded-xl p-4 text-lg font-bold" placeholder="75/10/25" required>
          </div>
          <div>
            <label class="block text-base font-black text-stone-800 mb-1">身分證字號 *</label>
            <input type="text" id="regIdCard" class="w-full border-3 border-stone-400 rounded-xl p-4 text-lg font-bold uppercase" required>
          </div>
          <button type="submit" id="regSubmitBtnMain" class="w-full bg-emerald-700 text-white font-black py-5 rounded-2xl text-xl shadow-md">註冊</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Profile Modal -->
  <div id="profileModal" class="fixed inset-0 bg-stone-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-md shadow-2xl border-4 border-stone-400 overflow-hidden">
      <div class="bg-gradient-to-r from-emerald-800 to-teal-700 text-white p-5 flex justify-between items-center border-b-4 border-emerald-900">
        <h3 class="text-2xl font-black">👤 會員資料</h3>
        <button onclick="closeModal('profileModal')" class="text-white font-black text-3xl">✕</button>
      </div>
      <form onsubmit="saveProfile(event)" class="p-5 space-y-4">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-base font-black text-stone-800 mb-1">姓名 *</label>
            <input type="text" id="profileName" class="w-full border-3 border-stone-400 rounded-xl p-4 text-lg font-bold" required>
          </div>
          <div>
            <label class="block text-base font-black text-stone-800 mb-1">暱稱</label>
            <input type="text" id="profileNickname" class="w-full border-3 border-stone-400 rounded-xl p-4 text-lg font-bold">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-base font-black text-stone-800 mb-1">電話 *</label>
            <input type="tel" id="profilePhone" class="w-full border-3 border-stone-400 rounded-xl p-4 text-lg font-bold" required>
          </div>
          <div>
            <label class="block text-base font-black text-stone-800 mb-1">性別 *</label>
            <select id="profileGender" class="w-full border-3 border-stone-400 rounded-xl p-4 text-lg font-bold bg-white" required>
              <option value="">請選擇</option>
              <option value="男">男</option>
              <option value="女">女</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-base font-black text-stone-800 mb-1">生日，民國格式 *</label>
          <input type="text" id="profileBirthday" class="w-full border-3 border-stone-400 rounded-xl p-4 text-lg font-bold" placeholder="75/10/25" required>
        </div>
        <div>
          <label class="block text-base font-black text-stone-800 mb-1">身分證字號 *</label>
          <input type="text" id="profileIdCard" class="w-full border-3 border-stone-400 rounded-xl p-4 text-lg font-bold uppercase" required>
        </div>
        <div>
          <label class="block text-base font-black text-stone-800 mb-1">地址</label>
          <input type="text" id="profileAddress" class="w-full border-3 border-stone-400 rounded-xl p-4 text-lg font-bold">
        </div>
        <button type="submit" class="w-full bg-emerald-700 text-white font-black py-5 rounded-2xl text-2xl shadow-md">儲存</button>
      </form>
    </div>
  </div>

  <!-- Register Modal -->
  <div id="registerModal" class="fixed inset-0 bg-stone-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded-3xl w-full max-w-md shadow-2xl border-4 border-stone-400 overflow-hidden my-8">
      <div class="bg-gradient-to-r from-emerald-800 to-teal-700 text-white p-5 flex justify-between items-center border-b-4 border-emerald-900">
        <button onclick="closeModal('registerModal')" class="bg-emerald-950 text-white px-4 py-2 rounded-xl text-base font-black shadow-md">⬅ 返回</button>
        <h3 class="text-xl font-black truncate max-w-[220px]" id="regEventTitle">活動登記</h3>
      </div>

      <div class="p-4 bg-emerald-50 border-b-3 border-emerald-200 flex flex-col space-y-2.5">
        <button type="button" onclick="openSearchAttendeeDialog()" class="w-full bg-amber-600 text-white font-black py-4 rounded-xl text-lg shadow-md">
          🔍 搜尋帶入已建檔名單
        </button>
        <button type="button" onclick="openCreateUserModal()" class="w-full bg-white border-3 border-emerald-600 text-emerald-950 font-black py-3.5 rounded-xl text-lg shadow-md">
          ➕ 新增未建檔同行人
        </button>
      </div>

      <div class="p-5 space-y-4 max-h-[50vh] overflow-y-auto">
        <div id="attendeesContainer" class="space-y-4"></div>
      </div>

      <div class="p-5 bg-stone-100 border-t-3 border-stone-300 flex space-x-3">
        <button onclick="closeModal('registerModal')" class="flex-1 bg-stone-200 text-stone-900 py-5 rounded-2xl text-xl font-black border-3 border-stone-400">取消</button>
        <button onclick="submitMultiRegistration()" class="flex-1 bg-emerald-700 text-white py-5 rounded-2xl text-xl font-black shadow-md">送出</button>
      </div>
    </div>
  </div>

  <!-- Search Attendee -->
  <div id="searchAttendeeModal" class="fixed inset-0 bg-stone-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-md shadow-2xl border-4 border-stone-400 overflow-hidden">
      <div class="bg-emerald-800 text-white p-4 flex justify-between items-center border-b-3 border-emerald-950">
        <span class="font-black text-lg">🔍 搜尋名單</span>
        <button onclick="closeModal('searchAttendeeModal')" class="text-white text-base font-black">✕ 關閉</button>
      </div>
      <div class="p-4 space-y-3">
        <input type="text" id="globalAttendeeSearchInput" oninput="searchGlobalAttendees(this.value)" class="w-full border-3 border-stone-400 rounded-xl p-4 text-lg font-bold" placeholder="輸入姓名或暱稱">
        <div id="globalAttendeeSearchResults" class="bg-stone-50 border-3 border-stone-200 rounded-xl max-h-60 overflow-y-auto text-base font-bold divide-y divide-stone-200">
          <p class="text-stone-500 text-center py-4">請輸入關鍵字</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Create User -->
  <div id="createUserModal" class="fixed inset-0 bg-stone-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-md shadow-2xl border-4 border-stone-400 overflow-hidden">
      <div class="bg-gradient-to-r from-emerald-800 to-teal-700 text-white p-5 flex justify-between items-center border-b-4 border-emerald-900">
        <h3 class="text-xl font-black">➕ 新增同行人</h3>
        <button onclick="closeModal('createUserModal')" class="text-white font-black text-3xl">✕</button>
      </div>
      <form onsubmit="handleAddNewUserToDatabase(event)" class="p-5 space-y-4">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-black text-stone-800 mb-1">姓名 *</label>
            <input type="text" id="newUserName" class="w-full border-3 border-stone-400 rounded-xl p-3 text-lg font-bold" required>
          </div>
          <div>
            <label class="block text-sm font-black text-stone-800 mb-1">手機 *</label>
            <input type="tel" id="newUserPhone" class="w-full border-3 border-stone-400 rounded-xl p-3 text-lg font-bold" required>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-black text-stone-800 mb-1">性別 *</label>
            <select id="newUserGender" class="w-full border-3 border-stone-400 rounded-xl p-3 text-lg font-bold bg-white" required>
              <option value="">請選擇</option>
              <option value="男">男</option>
              <option value="女">女</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-black text-stone-800 mb-1">關係 *</label>
            <select id="newUserRelation" class="w-full border-3 border-stone-400 rounded-xl p-3 text-lg font-bold bg-white" required>
              <option value="家人">家人</option>
              <option value="朋友">朋友</option>
              <option value="新會員">新會員</option>
              <option value="遊客">遊客</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-sm font-black text-stone-800 mb-1">生日，民國格式 *</label>
          <input type="text" id="newUserBirthday" class="w-full border-3 border-stone-400 rounded-xl p-3 text-lg font-bold" placeholder="75/10/25" required>
        </div>
        <div>
          <label class="block text-sm font-black text-stone-800 mb-1">身分證字號 *</label>
          <input type="text" id="newUserIdCard" class="w-full border-3 border-stone-400 rounded-xl p-3 text-lg font-bold uppercase" required>
        </div>
        <button type="submit" class="w-full bg-emerald-700 text-white font-black py-4 rounded-2xl text-xl shadow-md">儲存並加入</button>
      </form>
    </div>
  </div>

  <!-- Participants -->
  <div id="participantsModal" class="fixed inset-0 bg-stone-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-md shadow-2xl border-4 border-stone-400 overflow-hidden">
      <div class="bg-gradient-to-r from-emerald-800 to-teal-700 text-white p-5 flex justify-between items-center border-b-4 border-emerald-900">
        <button onclick="closeModal('participantsModal')" class="bg-emerald-950 text-white px-4 py-2 rounded-xl text-base font-black shadow-md">⬅ 返回</button>
        <h3 class="text-2xl font-black">📋 登記名單</h3>
      </div>
      <div class="p-5 space-y-4">
        <div id="participantsCardContainer" class="max-h-[50vh] overflow-y-auto space-y-3"></div>
        <div class="flex justify-between items-center bg-stone-100 p-3 rounded-2xl border-3 border-stone-300">
          <button id="prevCardBtn" onclick="changeCardPage(-1)" class="bg-white text-stone-950 border-3 border-stone-400 font-black px-4 py-3 rounded-xl text-lg disabled:opacity-50 shadow-sm">◀ 上頁</button>
          <span id="cardPageIndicator" class="text-lg font-black text-stone-800">1 / 1</span>
          <button id="nextCardBtn" onclick="changeCardPage(1)" class="bg-white text-stone-950 border-3 border-stone-400 font-black px-4 py-3 rounded-xl text-lg disabled:opacity-50 shadow-sm">下頁 ▶</button>
        </div>
      </div>
    </div>
  </div>

  <!-- My Registrations -->
  <div id="myRegistrationsModal" class="fixed inset-0 bg-stone-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-md shadow-2xl border-4 border-stone-400 overflow-hidden">
      <div class="bg-gradient-to-r from-emerald-800 to-teal-700 text-white p-5 flex justify-between items-center border-b-4 border-emerald-900">
        <button onclick="closeModal('myRegistrationsModal')" class="bg-emerald-950 text-white px-4 py-2 rounded-xl text-base font-black shadow-md">⬅ 返回</button>
        <h3 class="text-2xl font-black">📋 我的登記</h3>
      </div>
      <div id="myRegListContainer" class="p-5 space-y-4 max-h-[60vh] overflow-y-auto"></div>
    </div>
  </div>

  <!-- Details -->

<script>

const CATEGORY_COLOR_PALETTES = [
  { bgLight: "bg-emerald-100", textDark: "text-emerald-950", border: "border-emerald-400", bgActive: "bg-emerald-700 text-white border-emerald-800", icon: "💚" },
  { bgLight: "bg-amber-100", textDark: "text-amber-950", border: "border-amber-400", bgActive: "bg-amber-600 text-white border-amber-800", icon: "🧡" },

];

function apiGet(params) {

function apiPost(payload) {
  return fetch(GAS_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)

}

function sanitizeHTML(v) {
  return String(v ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")

}

function formatStandardDate(input) {
  if (!input) return "";
  const d = new Date(input);
  if (isNaN(d.getTime())) return String(input).slice(0, 10);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function formatStandardTime(input) {
  if (!input) return "";
  const d = new Date(input);
  if (isNaN(d.getTime())) return String(input).replace("T", " ");
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}

function gregToRoc(greg) {
  if (!greg) return "";
  const p = String(greg).slice(0, 10).split("-");
  if (p.length !== 3) return greg;
  return `${parseInt(p[0], 10) - 1911}/${parseInt(p[1], 10)}/${parseInt(p[2], 10)}`;
}

function rocToGreg(roc) {
  if (!roc) return "";
  let clean = String(roc).trim().replace(/[.\-\s]/g, "/");

  if (/^\d{6,7}$/.test(clean)) {
    const len = clean.length;
    clean = `${clean.substring(0, len - 4)}/${clean.substring(len - 4, len - 2)}/${clean.substring(len - 2)}`;
  }

  const p = clean.split("/");
  if (p.length !== 3) return null;

  const y = parseInt(p[0], 10);
  const m = parseInt(p[1], 10);
  const d = parseInt(p[2], 10);

  if (!Number.isInteger(y) || !Number.isInteger(m) || !Number.isInteger(d)) return null;
  if (y < 1 || y > 200) return null;

  const gy = y + 1911;
  const date = new Date(gy, m - 1, d);

  if (
    date.getFullYear() !== gy ||
    date.getMonth() !== m - 1 ||
    date.getDate() !== d
  ) {
    return null;
  }

  return `${gy}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
}

function normalizePhone(phone) {
  return String(phone || "").trim().replace(/[^\d]/g, "").replace(/^886/, "0");
}

function isValidPhone(phone) {
  const p = normalizePhone(phone);
  return /^09\d{8}$/.test(p);
}

function isValidTaiwanId(id) {
  id = String(id || "").trim().toUpperCase();
  if (!/^[A-Z][12]\d{8}$/.test(id)) return false;

  const letters = {
    A:10,B:11,C:12,D:13,E:14,F:15,G:16,H:17,I:34,J:18,
    K:19,L:20,M:21,N:22,O:35,P:23,Q:24,R:25,S:26,T:27,
    U:28,V:29,W:32,X:30,Y:31,Z:33
  };

  const code = letters[id[0]];
  if (!code) return false;

  const n1 = Math.floor(code / 10);
  const n2 = code % 10;
  const nums = id.slice(1).split("").map(Number);

  const sum =
    n1 +
    n2 * 9 +
    nums[0] * 8 +
    nums[1] * 7 +
    nums[2] * 6 +
    nums[3] * 5 +
    nums[4] * 4 +
    nums[5] * 3 +
    nums[6] * 2 +
    nums[7] * 1 +
    nums[8];

  return sum % 10 === 0;
}

function maskName(name) {
  name = String(name || "");
  if (name.length <= 1) return name;
  if (name.length === 2) return name[0] + "*";
  return name[0] + "*".repeat(name.length - 2) + name[name.length - 1];
}

function sanitizeCSVCell(v) {
  return `"${String(v ?? "").replace(/"/g, '""')}"`;
}

function getCategoryStyle(catName, active = false) {
  let hash = 0;
  catName = String(catName || "");
  for (let i = 0; i < catName.length; i++) {
    hash = catName.charCodeAt(i) + ((hash << 5) - hash);
  }
  const p = CATEGORY_COLOR_PALETTES[Math.abs(hash) % CATEGORY_COLOR_PALETTES.length];
  return {
    style: active ? `${p.bgActive} border-4 shadow-lg` : `${p.bgLight} ${p.textDark} ${p.border} border-3 hover:bg-stone-50`,
    icon: p.icon
  };
}

async function initializeLiff() {
  showLoading("系統載入中...");

  try {
    await liff.init({ liffId: LIFF_ID });

    const ctx = liff.getContext ? liff.getContext() : null;
    isInChatContext = liff.isInClient() && ctx && ["utou", "room", "group"].includes(ctx.type);

    const localUser = localStorage.getItem("pdpa_user");

    if (liff.isLoggedIn()) {
      const profile = await liff.getProfile();
      userLineId = profile.userId;
      userDisplayName = profile.displayName;

      const result = await apiPost({
        action: "initApp",
        lineId: userLineId,
        name: userDisplayName
      });

      if (result.status !== "success") throw new Error(result.message || "初始化失敗");

      allCategories = result.categories || [];
      allEvents = result.events || [];

      if (result.isBound) {
        userProfile = result.user;
        isAdmin = !!result.isAdmin;
        userRole = isAdmin ? "admin" : "member";
        setLoggedInUI(userProfile.name, profile.pictureUrl || "", userRole);
      } else {
        setGuestUI();
        openAuthModal();
        switchAuthTab("register");
        document.getElementById("regNickname").value = userDisplayName;
        document.getElementById("registerNotice").innerHTML =
          `<span class="text-emerald-800 text-base">💬 LINE 綁定註冊：</span><br>請填寫基本資料，完成後即可成為正式會員。`;
        document.getElementById("regSubmitBtnMain").innerText = "確認綁定並註冊";
      }

      renderAll();
    } else if (localUser) {
      const u = JSON.parse(localUser);
      await handleSilentNormalLogin(u.name, u.phone);
    } else {
      setGuestUI();
      await loadPublicData();
    }

    const urlParams = new URLSearchParams(location.search);
    if (urlParams.get("action") === "viewlist" && urlParams.get("eventId")) {
      await openParticipantsModal(urlParams.get("eventId"));
    }

  } catch (e) {
    console.error(e);
    alert("系統初始化失敗：" + e.message);
    setGuestUI();
    await loadPublicData().catch(() => {});
  } finally {
    hideLoading();
  }
}

async function handleNormalRegister(e) {

function renderCategoryBigButtons() {

  }

  allCategories.forEach(cat => {

function filterByCategory(cat) {
  currentFilterCategory = cat;
  renderCategoryBigButtons();
  renderEventList();
}

function clearCategoryFilter() {
  currentFilterCategory = "";
  renderCategoryBigButtons();

function filterByKeyword(v) {
  currentSearchKeyword = String(v || "").trim().toLowerCase();
  renderEventList();
}

function isEventExpired(ev) {
  if (!ev.time) return false;
  const d = new Date(ev.time.replace(" ", "T"));
  if (isNaN(d.getTime())) return false;
  return new Date().getTime() > d.getTime();
}

function renderEventList() {
  const c = document.getElementById("eventListContainer");
  document.getElementById("selectedCategoryTitle").innerText = currentFilterCategory ? `${currentFilterCategory} 活動列表` : "所有活動列表";

  let list = [...allEvents];

  if (currentFilterCategory) list = list.filter(e => e.category === currentFilterCategory);
  if (currentSearchKeyword) {
    list = list.filter(e =>
      String(e.title || "").toLowerCase().includes(currentSearchKeyword) ||
      String(e.location || "").toLowerCase().includes(currentSearchKeyword)
    );
  }

  list.sort((a, b) => new Date(a.time) - new Date(b.time));
  c.innerHTML = "";

  if (!list.length) {
    c.innerHTML = `<div class="bg-white p-8 rounded-3xl border-3 border-stone-300 text-center text-stone-500 font-black text-xl">目前沒有活動</div>`;
    return;
  }

  list.forEach(ev => {
    const stopped = ev.status !== "啟動" || isEventExpired(ev);
    const imgs = Array.isArray(ev.images) ? ev.images : [];
    const files = Array.isArray(ev.files) ? ev.files : [];
    const gridClass = imgs.length === 1 ? "grid-cols-1" : imgs.length === 2 ? "grid-cols-2" : "grid-cols-3";

    const imgHtml = imgs.length ? `
      <div class="grid ${gridClass} gap-1 p-2 bg-stone-50">
        ${imgs.slice(0, 3).map((url, i) => `<img src="${sanitizeHTML(url)}" onclick='openLightbox(${JSON.stringify(imgs)}, ${i})' class="w-full h-32 object-cover rounded-xl border-2 border-stone-200 cursor-pointer">`).join("")}
      </div>` : "";

    const filesHtml = files.length ? `
      <div class="space-y-2 pt-3">
        ${files.map(f => `<a href="${sanitizeHTML(f.url)}" target="_blank" rel="noopener" class="block bg-stone-100 border-2 border-stone-300 rounded-xl p-3 text-base font-black text-stone-800">📎 ${sanitizeHTML(f.name)}</a>`).join("")}
      </div>` : "";

    const remainHtml = typeof ev.remainingSpots !== "undefined" ? `
      <p>✅ 正取：${ev.approvedCount || 0} / ${ev.limit || 0}</p>
      <p>🕒 候補：${ev.waitingCount || 0} 人</p>
      <p>🎫 剩餘：${ev.remainingSpots || 0} 人</p>
    ` : `<p>👥 上限：${ev.limit || 0} 人</p>`;

    const div = document.createElement("div");
    div.className = "bg-white rounded-3xl border-3 border-stone-300 shadow-md overflow-hidden";
    div.innerHTML = `
      ${imgHtml}
      <div class="p-5 space-y-4">
        <div class="flex justify-between items-start gap-3">
          <div>
            <div class="text-sm font-black text-emerald-800 mb-1">📁 ${sanitizeHTML(ev.category || "未分類")}</div>
            <h3 class="text-2xl font-black text-stone-950 leading-tight">${sanitizeHTML(ev.title)}</h3>
          </div>
          <span class="shrink-0 px-3 py-1 rounded-full text-base font-black ${stopped ? "bg-red-100 text-red-700 border-2 border-red-300" : "bg-emerald-100 text-emerald-800 border-2 border-emerald-300"}">${stopped ? "停止" : "開放"}</span>
        </div>
        <div class="text-lg font-bold text-stone-700 space-y-1">
          <p>📅 截止：${formatStandardTime(ev.time)}</p>
          <p>📍 地點：${sanitizeHTML(ev.location)}</p>
          ${remainHtml}
        </div>
        ${ev.description ? `<div class="bg-stone-50 border-2 border-stone-200 rounded-2xl p-4 text-base leading-relaxed font-bold text-stone-700 whitespace-pre-line">${sanitizeHTML(ev.description)}</div>` : ""}
        ${filesHtml}
        <div class="grid grid-cols-2 gap-3 pt-2">
          <button onclick='openParticipantsModal(${JSON.stringify(ev.id)})' class="bg-stone-100 text-stone-900 border-3 border-stone-400 py-4 rounded-2xl font-black active-scale">📋 名單</button>
          <button onclick='openRegisterModal(${JSON.stringify(ev.id)})' ${stopped ? "disabled" : ""} class="${stopped ? "bg-stone-300 text-stone-500 border-stone-400" : "bg-emerald-700 text-white border-emerald-900"} border-3 py-4 rounded-2xl font-black active-scale">📝 登記</button>
        </div>
      </div>`;
    c.appendChild(div);
  });
}

function openLightbox(images, i = 0) {

function updateLightbox() {
  if (!lightboxImages.length) return;
  document.getElementById("lightboxMainImage").src = lightboxImages[currentLightboxIndex];
  document.getElementById("lightboxIndicator").innerText = `${currentLightboxIndex + 1} / ${lightboxImages.length}`;
  document.getElementById("lightboxThumbnails").innerHTML = lightboxImages.map((u, i) =>
    `<img src="${sanitizeHTML(u)}" onclick="currentLightboxIndex=${i}; updateLightbox();" class="w-16 h-16 object-cover rounded-xl border-4 ${i === currentLightboxIndex ? "border-emerald-400" : "border-white/20"} cursor-pointer">`
  ).join("");
}

function changeLightboxImage(d) {
  if (!lightboxImages.length) return;
  currentLightboxIndex = (currentLightboxIndex + d + lightboxImages.length) % lightboxImages.length;
  updateLightbox();
}

function openRegisterModal(eventId) {
  if (!userProfile || userRole === "guest" || !userLineId) {
    alert("請先使用 LINE 登入並完成會員綁定，才能自行報名。");
    openAuthModal();
    return;
  }

  currentEvent = allEvents.find(e => e.id === eventId);
  if (!currentEvent) return;

  if (currentEvent.status !== "啟動" || isEventExpired(currentEvent)) {
    alert("此活動已停止或超過報名截止時間。");
    return;
  }

  currentAttendees = [];
  addAttendeeFromUser({
    name: userProfile.name,
    phone: userProfile.phone,
    relation: "本人",
    gender: userProfile.gender,
    birthday: userProfile.birthday,
    idCard: userProfile.idCard,
    answers: {}
  });

  document.getElementById("regEventTitle").innerText = currentEvent.title;
  renderAttendees();
  openModal("registerModal");
}

function addAttendeeFromUser(u) {
  currentAttendees.push({
    name: u.name || "",
    phone: normalizePhone(u.phone || ""),
    relation: u.relation || "同行人",
    gender: u.gender || "",
    birthday: u.birthday || "",
    idCard: String(u.idCard || "").toUpperCase(),
    answers: u.answers || {}
  });
}

function renderAttendees() {
  const c = document.getElementById("attendeesContainer");
  const qs = currentEvent && Array.isArray(currentEvent.questions) ? currentEvent.questions : [];
  c.innerHTML = "";

  currentAttendees.forEach((a, idx) => {
    const qHtml = qs.filter(q => !["姓名", "電話", "性別", "生日", "身分證字號", "關係"].includes(q.title)).map(q => {
      const val = a.answers[q.title] || "";
      const qKey = JSON.stringify(q.title);

      if (q.type === "select") {
        const opts = String(q.options || "").split(",").map(x => x.trim()).filter(Boolean);
        return `
          <div>
            <label class="block text-base font-black text-stone-800 mb-1">${sanitizeHTML(q.title)} ${q.required ? "*" : ""}</label>
            <select onchange='currentAttendees[${idx}].answers[${qKey}]=this.value' class="w-full border-3 border-stone-400 rounded-xl p-3 text-lg font-bold bg-white" ${q.required ? "required" : ""}>
              <option value="">請選擇</option>
              ${opts.map(o => `<option value="${sanitizeHTML(o)}" ${o === val ? "selected" : ""}>${sanitizeHTML(o)}</option>`).join("")}
            </select>
          </div>`;
      }

      return `
        <div>
          <label class="block text-base font-black text-stone-800 mb-1">${sanitizeHTML(q.title)} ${q.required ? "*" : ""}</label>
          <input type="text" value="${sanitizeHTML(val)}" oninput='currentAttendees[${idx}].answers[${qKey}]=this.value' class="w-full border-3 border-stone-400 rounded-xl p-3 text-lg font-bold" ${q.required ? "required" : ""}>
        </div>`;
    }).join("");

    const div = document.createElement("div");
    div.className = "bg-stone-50 border-3 border-stone-300 rounded-3xl p-4 space-y-3";
    div.innerHTML = `
      <div class="flex justify-between items-center">
        <h4 class="text-xl font-black text-stone-950">#${idx + 1} ${sanitizeHTML(a.name)} (${sanitizeHTML(a.relation)})</h4>
        ${idx === 0 ? "" : `<button onclick="currentAttendees.splice(${idx},1); renderAttendees();" class="bg-red-50 text-red-700 border-3 border-red-300 px-3 py-1 rounded-xl font-black">刪除</button>`}
      </div>
      <p class="text-base font-bold text-stone-700">📞 ${sanitizeHTML(a.phone)} ｜ ${sanitizeHTML(a.gender)} ｜ ${a.birthday ? gregToRoc(formatStandardDate(a.birthday)) : ""}</p>
      ${qHtml}`;
    c.appendChild(div);
  });
}

let searchTimer = null;

function searchGlobalAttendees(k) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => searchGlobalAttendeesRemote(k), 350);
}

async function searchGlobalAttendeesRemote(k) {
  const c = document.getElementById("globalAttendeeSearchResults");
  k = String(k || "").trim();

  if (!k || k.length < 1) {
    c.innerHTML = `<p class="text-stone-500 text-center py-4">請輸入關鍵字</p>`;
    return;
  }

  c.innerHTML = `<p class="text-stone-500 text-center py-4">搜尋中...</p>`;

  const r = await apiGet({
    action: "searchUsersForRegistration",
    lineId: userLineId,
    keyword: k
  });

  if (r.status !== "success") {
    c.innerHTML = `<p class="text-red-500 text-center py-4">${sanitizeHTML(r.message)}</p>`;
    return;
  }

  const found = r.users || [];
  window.__foundUsers = found;

  if (!found.length) {
    c.innerHTML = `<p class="text-stone-500 text-center py-4">查無資料</p>`;
    return;
  }

  c.innerHTML = found.map((u, i) => `
    <button onclick="selectGlobalAttendee(${i})" class="w-full text-left p-4 hover:bg-emerald-50 font-black">
      👤 ${sanitizeHTML(u.name)} ${u.nickname ? `(${sanitizeHTML(u.nickname)})` : ""}<br>
      <span class="text-sm text-stone-500">📞 ${sanitizeHTML(u.phoneMasked || "")}</span>
    </button>
  `).join("");
}

function selectGlobalAttendee(i) {
  const u = window.__foundUsers[i];
  if (!u) return;

  if (currentAttendees.some(a => a.name === u.name && String(a.phone) === String(u.phone))) {
    alert("此人已在清單中");
    return;
  }

  addAttendeeFromUser({
    name: u.name,
    phone: u.phone,
    relation: "同行人",
    gender: u.gender,
    birthday: u.birthday,
    idCard: u.idCard,
    answers: {}
  });

  renderAttendees();
  closeModal("searchAttendeeModal");
}

async function submitMultiRegistration() {

  if (!userLineId || userRole === "guest") {

    return;

  showLoading("送出報名...");
  try {
    const r = await apiPost({
      action: "registerMulti",
      eventId: currentEvent.id,
      lineId: userLineId,
      leaderName: userProfile.name,
      leaderPhone: userProfile.phone,
      attendees: currentAttendees
    });

    if (r.status === "success") {
      closeModal("registerModal");

function renderParticipantsCardPage() {

  currentCardPage = Math.max(0, Math.min(currentCardPage, total - 1));
  const start = currentCardPage * CARD_PAGE_SIZE;
  const list = currentParticipants.slice(start, start + CARD_PAGE_SIZE);

  c.innerHTML = list.length ? list.map((p, i) => `
    <div class="bg-stone-50 border-3 border-stone-300 rounded-2xl p-4 flex justify-between items-center">
      <span class="text-xl font-black">#${start + i + 1} ${sanitizeHTML(maskName(p.name))}</span>

  `).join("") : `<p class="text-stone-500 text-center py-8 font-black">目前尚無登記</p>`;

  document.getElementById("cardPageIndicator").innerText = `${currentCardPage + 1} / ${total}`;
  document.getElementById("prevCardBtn").disabled = currentCardPage <= 0;
  document.getElementById("nextCardBtn").disabled = currentCardPage >= total - 1;
}

function changeCardPage(d) {

function fileToBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

async function uploadImageToDrive(input) {
  const file = input.files[0];
  if (!file) return;

  if (!isAdmin) {
    alert("無管理員權限");
    input.value = "";
    return;
  }

  if (document.querySelectorAll(".admin-image-row").length >= 5) {
    alert("最多 5 張圖片");
    input.value = "";
    return;
  }

  if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
    alert("只允許 JPG、PNG、WEBP 圖片。");
    input.value = "";
    return;
  }

  if (file.size > 5 * 1024 * 1024) {
    alert("圖片大小不可超過 5MB。");
    input.value = "";
    return;
  }

  showLoading("上傳圖片...");
  try {
    const base64Data = await fileToBase64(file);
    const r = await apiPost({ action: "uploadFileToDrive", fileName: file.name, mimeType: file.type, base64Data, lineId: userLineId });
    if (r.status === "success") addAdminImageRow(r.fileUrl);
    else alert("上傳失敗：" + r.message);
  } finally {
    input.value = "";
    hideLoading();
  }
}

async function saveEvent() {
  const id = document.getElementById("adminEventId").value;
  const title = document.getElementById("adminTitle").value.trim();
  const category = document.getElementById("adminCategory").value;
  const time = document.getElementById("adminTime").value;
  const location = document.getElementById("adminLocation").value.trim();
  const limit = parseInt(document.getElementById("adminLimit").value, 10);
  const status = document.getElementById("adminStatus").value;
  const description = document.getElementById("adminDescription").value.trim();

  if (!title || !category || !time || !location || !limit || limit < 1) {
    alert("請填寫正確的必填欄位");
    return;
  }

  const images = [...document.querySelectorAll(".admin-image-row input[type='hidden']")].map(x => x.value.trim()).filter(Boolean);

  const files = [...document.querySelectorAll(".admin-file-row")].map(row => {
    const i = row.querySelectorAll("input");
    return { name: i[0].value.trim(), url: i[1].value.trim() };
  }).filter(f => f.name && f.url);

  const questions = [...document.querySelectorAll(".admin-q-row")].map(row => {
    const titleInput = row.querySelector("input[type='text']");
    const select = row.querySelector("select");
    const opt = row.querySelector(".option-input");
    const req = row.querySelector(".req-checkbox");
    return {
      title: titleInput.value.trim(),
      type: select ? select.value : "text",
      options: select && select.value === "select" ? opt.value.trim() : "",
      required: ["姓名", "電話"].includes(titleInput.value.trim()) ? true : !!(req && req.checked)
    };
  }).filter(q => q.title);

  const adminNotesConfig = [...document.querySelectorAll(".admin-note-config-row")].map(row => {
    const titleInput = row.querySelector("input[type='text']");
    const select = row.querySelector("select");
    const opt = row.querySelector(".option-input");
    return {
      title: titleInput.value.trim(),
      type: select ? select.value : "text",
      options: select && select.value === "select" ? opt.value.trim() : ""
    };
  }).filter(n => n.title);

  showLoading("儲存活動...");
  try {
    const r = await apiPost({ action: "saveEvent", id, title, category, time, location, limit, status, description, images, files, questions, adminNotesConfig, lineId: userLineId });
    if (r.status === "success") {
      alert("活動已儲存");
      await reloadEventsData();
      switchToCreateMode();
    } else {
      alert("儲存失敗：" + r.message);
    }
  } finally {
    hideLoading();
  }
}

function exportToCSV() {
  const ps = window.currentAdminParticipants || [];
  const qs = window.currentAdminQuestions || [];
  const ns = window.currentAdminNotesConfig || [];

  if (!ps.length) {
    alert("沒有資料可匯出");
    return;
  }

  const headers = ["編號", "登記ID", "姓名", "電話", "關係", "性別", "生日", "身分證字號", "狀態"];
  const qTitles = qs.map(q => q.title).filter(t => !["姓名", "電話", "性別", "生日", "身分證字號", "關係"].includes(t));
  const nTitles = ns.map(n => n.title);
  headers.push(...qTitles, ...nTitles);

  const rows = [headers.map(sanitizeCSVCell).join(",")];

  ps.forEach((p, i) => {
    const row = [
      i + 1,
      p.regId,
      p.name,
      "\t" + (p.phone || ""),
      p.relation || "",
      p.gender || "",
      p.birthday ? formatStandardDate(p.birthday) : "",
      p.idCard || "",
      p.status || ""
    ].map(sanitizeCSVCell);

    qTitles.forEach(t => row.push(sanitizeCSVCell((p.answers || {})[t] || "")));
    nTitles.forEach(t => row.push(sanitizeCSVCell((p.adminNotes || {})[t] || "")));

    rows.push(row.join(","));
  });

  const blob = new Blob(["\uFEFF" + rows.join("\n")], { type: "text/csv;charset=utf-8;" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${currentEvent ? currentEvent.title : "活動"}_登記報表_${formatStandardDate(new Date())}.csv`;
  a.click();
}

    return;
  }

  currentEvent = allEvents.find(e => e.id === eventId);
  showLoading("載入公告名單...");

  try {
    const r = await apiGet({ action: "getAdminParticipants", eventId, lineId: userLineId });
    if (r.status === "success") {
      currentParticipants = r.participants || [];
      c.innerHTML = currentParticipants.map((p, i) => `
        <div class="p-4 bg-white rounded-2xl border-3 border-stone-300">
          <span class="font-black">#${i + 1} ${sanitizeHTML(p.name)}</span>
          <span class="ml-2 text-sm px-2 py-1 rounded-full ${p.status === "候補" ? "bg-amber-100 text-amber-800" : "bg-emerald-100 text-emerald-800"}">${sanitizeHTML(p.status)}</span>
        </div>
      `).join("");
    } else {
      c.innerHTML = `<p class="text-red-500 text-center py-4">${sanitizeHTML(r.message)}</p>`;
    }
  } finally {
    hideLoading();
  }
}

async function shareCustomChainToGroup() {
  if (!currentEvent) {
    alert("請先選擇活動");
    return;
  }

  if (!currentParticipants.length) {
    alert("目前無名單");
    return;
  }

  const msg = document.getElementById("announceCustomMsg").value.trim();

  let text = `📢【台灣帕金森病友權益促進會 活動接龍公告】\n`;
  text += `活動：${currentEvent.title}\n`;
  text += `截止：${formatStandardTime(currentEvent.time)}\n`;
  if (msg) text += `備註：${msg}\n`;
  text += `────────────────\n`;

  currentParticipants.forEach((p, i) => {
    text += `${i + 1}. ${p.name}${p.status === "候補" ? "（候補）" : ""}\n`;
  });

  text += `\n查看或登記：\nhttps://liff.line.me/${LIFF_ID}`;

  const payload = { type: "text", text };

  try {
    if (isInChatContext) {
      await liff.sendMessages([payload]);
      alert("公告已發送");
    } else if (liff.isApiAvailable("shareTargetPicker")) {
      await liff.shareTargetPicker([payload]);
    } else {
      alert(text);
    }
  } catch {
    alert("分享取消或失敗");
  }
}

async function sendFlexMessage(eventId, eventTime, title, remaining, attendees) {
  const text = `✅ 活動登記成功\n活動：${title}\n名單：${attendees.map(a => `${a.name}(${a.status})`).join("、")}\n剩餘名額：${remaining}\n查看名單：https://liff.line.me/${LIFF_ID}?action=viewlist&eventId=${eventId}`;

  try {
    if (isInChatContext) {
      await liff.sendMessages([{ type: "text", text }]);
    } else if (liff.isApiAvailable("shareTargetPicker")) {
      await liff.shareTargetPicker([{ type: "text", text }]);
    }
  } catch {}
}

document.addEventListener("DOMContentLoaded", initializeLiff);
</script>
