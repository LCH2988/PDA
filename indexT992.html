<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover">

  <meta
    name="description"
    content="帕友同行－友善活動搜尋、報名與候補服務">

  <meta name="theme-color" content="#176b67">

  <title>帕友同行</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root {
      --primary: #176b67;
      --primary-dark: #0b4d49;
      --accent: #d85b35;
      --accent-dark: #a94023;
      --background: #faf8f2;
      --surface: #ffffff;
      --text: #202624;
      --muted: #5c6763;
      --border: #ccd4d1;
      --success: #23753d;
      --warning: #875b00;
      --danger: #b3261e;
      --radius: 18px;
      --shadow: 0 10px 28px rgba(15, 70, 65, 0.1);
      --page-width: 1120px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      font-size: 18px;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background: var(--background);
      font-family:
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        system-ui,
        sans-serif;
      line-height: 1.65;
    }

    body.modal-open {
      overflow: hidden;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible,
    a:focus-visible {
      outline: 4px solid #ffb000;
      outline-offset: 3px;
    }

    h1,
    h2,
    h3 {
      line-height: 1.3;
    }

    .skip-link {
      position: fixed;
      top: -100px;
      left: 16px;
      z-index: 1000;
      padding: 10px 16px;
      color: white;
      border-radius: 10px;
      background: var(--primary-dark);
    }

    .skip-link:focus {
      top: 16px;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 20;
      color: white;
      background: linear-gradient(
        135deg,
        var(--primary-dark),
        var(--primary)
      );
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.16);
    }

    .header-inner {
      width: min(var(--page-width), calc(100% - 24px));
      min-height: 70px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand {
      padding: 8px;
      color: white;
      border: 0;
      background: transparent;
      font-size: 1.25rem;
      font-weight: 900;
    }

    .nav {
      margin-left: auto;
      display: flex;
      gap: 7px;
    }

    .nav button {
      min-height: 46px;
      padding: 8px 13px;
      color: white;
      border: 0;
      border-radius: 11px;
      background: transparent;
      font-weight: 800;
    }

    .nav button:hover,
    .nav button.active {
      background: rgba(255, 255, 255, 0.2);
    }

    .nav .login {
      color: var(--primary-dark);
      background: white;
    }

    .main {
      width: min(var(--page-width), calc(100% - 24px));
      min-height: calc(100vh - 150px);
      margin: auto;
      padding: 28px 0 80px;
    }

    .hero {
      padding: clamp(25px, 6vw, 55px);
      border-radius: 25px;
      background:
        radial-gradient(
          circle at top right,
          rgba(255, 255, 255, 0.8),
          transparent 40%
        ),
        linear-gradient(135deg, #d9f0ed, #fff0d5);
      box-shadow: var(--shadow);
    }

    .hero h1 {
      max-width: 760px;
      margin: 0 0 15px;
      font-size: clamp(2rem, 6vw, 3.2rem);
    }

    .hero p {
      max-width: 720px;
      color: var(--muted);
      font-size: 1.1rem;
    }

    .section {
      margin-top: 36px;
    }

    .section-header {
      margin-bottom: 17px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .panel {
      padding: 24px;
    }

    .filters {
      padding: 18px;
      display: grid;
      grid-template-columns: 2fr 1fr 1fr auto;
      gap: 12px;
      align-items: end;
    }

    .field {
      margin-bottom: 16px;
    }

    .filters .field {
      margin-bottom: 0;
    }

    .field label {
      margin-bottom: 5px;
      display: block;
      font-weight: 900;
    }

    .input,
    .select,
    .textarea {
      width: 100%;
      min-height: 52px;
      padding: 10px 13px;
      color: var(--text);
      border: 2px solid var(--border);
      border-radius: 12px;
      background: white;
    }

    .textarea {
      min-height: 110px;
      resize: vertical;
    }

    .button {
      min-height: 51px;
      padding: 10px 18px;
      border: 0;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
    }

    .button-primary {
      color: white;
      background: var(--primary);
    }

    .button-primary:hover {
      background: var(--primary-dark);
    }

    .button-accent {
      color: white;
      background: var(--accent);
    }

    .button-accent:hover {
      background: var(--accent-dark);
    }

    .button-secondary {
      color: var(--primary-dark);
      border: 2px solid var(--primary);
      background: white;
    }

    .button-danger {
      color: white;
      background: var(--danger);
    }

    .button-full {
      width: 100%;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 19px;
    }

    .event-card {
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .event-head {
      min-height: 98px;
      padding: 18px;
      color: white;
      background: linear-gradient(
        135deg,
        var(--primary-dark),
        var(--primary)
      );
    }

    .event-body {
      flex: 1;
      padding: 19px;
      display: flex;
      flex-direction: column;
    }

    .event-body h3 {
      margin: 10px 0;
    }

    .event-body .button {
      margin-top: auto;
    }

    .meta {
      padding: 0;
      list-style: none;
    }

    .meta li {
      margin: 7px 0;
    }

    .tag,
    .status {
      padding: 4px 10px;
      border-radius: 999px;
      display: inline-block;
      color: var(--primary-dark);
      background: #e1f1ef;
      font-size: 0.88rem;
      font-weight: 900;
    }

    .status-confirmed {
      color: var(--success);
      background: #e4f5e9;
    }

    .status-waitlist {
      color: var(--warning);
      background: #fff1ce;
    }

    .status-cancelled {
      color: var(--danger);
      background: #fdebea;
    }

    .notice {
      margin: 16px 0;
      padding: 14px;
      border-left: 6px solid var(--primary);
      border-radius: 10px;
      background: #e8f2fc;
    }

    .notice-success {
      border-color: var(--success);
      background: #e4f5e9;
    }

    .notice-warning {
      border-color: var(--warning);
      background: #fff1ce;
    }

    .notice-danger {
      border-color: var(--danger);
      background: #fdebea;
    }

    .detail {
      display: grid;
      grid-template-columns:
        minmax(0, 1.4fr)
        minmax(280px, 0.6fr);
      gap: 22px;
      align-items: start;
    }

    .sticky {
      position: sticky;
      top: 92px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 11px;
    }

    .info {
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .info strong {
      display: block;
    }

    .registration {
      margin-bottom: 16px;
      padding: 21px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      padding: 16px;
      background: rgba(0, 0, 0, 0.62);
      display: none;
      place-items: center;
    }

    .modal-backdrop.open {
      display: grid;
    }

    .modal {
      width: min(620px, 100%);
      max-height: 92vh;
      overflow: auto;
      padding: 25px;
      border-radius: 18px;
      background: white;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      gap: 15px;
    }

    .close {
      width: 46px;
      min-width: 46px;
      height: 46px;
      border: 2px solid var(--border);
      border-radius: 50%;
      background: white;
      font-size: 1.4rem;
    }

    .checkbox {
      margin: 10px 0;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .checkbox input {
      width: 22px;
      height: 22px;
      flex: 0 0 auto;
      margin-top: 3px;
    }

    .loading,
    .empty {
      min-height: 220px;
      padding: 35px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: white;
      display: grid;
      place-items: center;
      text-align: center;
    }

    .spinner {
      width: 50px;
      height: 50px;
      margin: auto;
      border: 6px solid #dcecea;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .toast {
      position: fixed;
      z-index: 200;
      top: 84px;
      right: 16px;
      width: min(390px, calc(100% - 32px));
      padding: 14px 17px;
      color: white;
      border-radius: 11px;
      background: var(--primary-dark);
      box-shadow: var(--shadow);
      display: none;
    }

    .toast.open {
      display: block;
    }

    .toast.error {
      background: var(--danger);
    }

    .footer {
      padding: 30px;
      color: white;
      background: var(--primary-dark);
      text-align: center;
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .filters {
        grid-template-columns: 1fr 1fr;
      }

      .detail {
        grid-template-columns: 1fr;
      }

      .sticky {
        position: static;
      }
    }

    @media (max-width: 650px) {
      html {
        font-size: 17px;
      }

      .header-inner {
        flex-wrap: wrap;
        padding: 8px 0;
      }

      .nav {
        width: 100%;
        margin-left: 0;
        overflow-x: auto;
      }

      .nav button {
        flex: 1 0 auto;
      }

      .grid,
      .filters,
      .info-grid {
        grid-template-columns: 1fr;
      }

      .section-header {
        align-items: stretch;
        flex-direction: column;
      }

      .button {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <a class="skip-link" href="#main">
    跳到主要內容
  </a>

  <header class="header">
    <div class="header-inner">
      <button
        class="brand"
        type="button"
        onclick="App.go('home')">
        🤝 帕友同行
      </button>

      <nav class="nav" aria-label="主要導覽">
        <button
          type="button"
          data-page="home"
          onclick="App.go('home')">
          首頁
        </button>

        <button
          type="button"
          data-page="events"
          onclick="App.go('events')">
          找活動
        </button>

        <button
          type="button"
          data-page="my"
          onclick="App.go('my')">
          我的活動
        </button>

        <a
        id="admin-link"
        href="indexT992A.html"
        hidden
        style="
          min-height:46px;
          padding:8px 13px;
          color:white;
          border-radius:11px;
          display:none;
          align-items:center;
          text-decoration:none;
          font-weight:800;
        ">
        活動管理
        </a>


        <button

          type="button"

          LINE 登入
        </button>

  <main
    id="main"
    class="main"
    tabindex="-1"
    aria-live="polite">
    <div class="loading" role="status">
      <div>
        <div class="spinner" aria-hidden="true"></div>
        <p>正在載入……</p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <strong>帕友同行</strong>
    <p>活動資訊不取代專業醫療建議。</p>
  </footer>

  <div
    id="modal-backdrop"
    class="modal-backdrop"
    onclick="App.closeFromBackdrop(event)">

    <section
      id="modal"
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title">
    </section>
  </div>

  <div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite">
  </div>

  <script>
    "use strict";

    /*
     * 請替換以下兩個設定。
     */
    const CONFIG = Object.freeze({
      LIFF_ID: "2009456572-ZBfM2edk",

      GAS_API_URL:
        "https://script.google.com/macros/s/AKfycbx2SF9bCvWcKkhgJ-g7Ip5-S4lrnZvPWam06rEQ-SHaetdRvI0ZasXfrwl4ORDdagy_qw/exec",

      TIME_ZONE: "Asia/Taipei"
    });

    const API = (() => {
      const TOKEN_KEY = "paryo-session-token";
      const EXPIRY_KEY = "paryo-session-expiry";

      function createId(prefix = "") {
        if (window.crypto?.randomUUID) {
          return prefix + window.crypto.randomUUID();
        }

        return (
          prefix +
          Date.now() +
          "-" +
          Math.random().toString(16).slice(2)
        );
      }

      function token() {
        const value = sessionStorage.getItem(TOKEN_KEY);
        const expiry = sessionStorage.getItem(EXPIRY_KEY);

        if (
          !value ||
          !expiry ||
          new Date(expiry).getTime() <= Date.now()
        ) {
          clear();
          return "";
        }

        return value;
      }

      function save(sessionToken, expiresAt) {
        sessionStorage.setItem(TOKEN_KEY, sessionToken);
        sessionStorage.setItem(EXPIRY_KEY, expiresAt);
      }

      function clear() {
        sessionStorage.removeItem(TOKEN_KEY);
        sessionStorage.removeItem(EXPIRY_KEY);
      }

      async function call(action, payload = {}, auth = true) {
        let response;

        try {
          response = await fetch(CONFIG.GAS_API_URL, {
            method: "POST",
            redirect: "follow",
            headers: {
              "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify({
              action,
              payload,
              requestId: createId("REQ-"),
              sessionToken: auth ? token() : ""
            })
          });
        } catch {
          throw new Error(
            "無法連線至伺服器，請檢查網路後再試。"
          );
        }

        const text = await response.text();
        let result;

        try {
          result = JSON.parse(text);
        } catch {
          throw new Error("伺服器回應格式不正確。");
        }

        if (!result.ok) {
          const error = new Error(
            result.error?.message || "操作失敗。"
          );

          error.code =
            result.error?.code || "API_ERROR";

          error.requestId = result.requestId || "";

          if (
            error.code === "AUTH_REQUIRED" ||
            error.code === "SESSION_EXPIRED"
          ) {
            clear();
          }

          throw error;
        }

        return result.data;
      }

      return {
        token,
        save,
        clear,
        createId,

        login(idToken) {
          return call(
            "auth.login",
            { idToken },
            false
          );
        },

        events(filters = {}) {
          return call(
            "events.list",
            filters,
            false
          );
        },

        event(sessionId) {
          return call(
            "events.get",
            { sessionId },
            false
          );
        },

        me() {
          return call("users.me");
        },

        registrations() {
          return call("registrations.mine");
        },

        register(payload) {
          return call(
            "registrations.create",
            payload
          );
        },

        cancel(registrationId) {
          return call(
            "registrations.cancel",
            { registrationId }
          );
        }
      };
    })();

    const Auth = (() => {
      let initialized = false;
      let user = null;
      let loginPromise = null;

      async function initialize() {
        if (initialized) return;

        if (!window.liff) {
          throw new Error("LIFF SDK 載入失敗。");
        }

        if (
          !CONFIG.LIFF_ID ||
          CONFIG.LIFF_ID.includes("請替換")
        ) {
          throw new Error("請先設定 LIFF_ID。");
        }

        await liff.init({
          liffId: CONFIG.LIFF_ID
        });

        initialized = true;
      }

      async function restore() {
        if (!API.token()) {
          user = null;
          return null;
        }

        try {
          user = await API.me();
          return user;
        } catch {
          API.clear();
          user = null;
          return null;
        }
      }

      async function performLogin() {
        await initialize();

        const restored = await restore();

        if (restored) {
          return restored;
        }

        if (!liff.isLoggedIn()) {
          liff.login({
            redirectUri: location.href
          });

          return new Promise(() => {});
        }

        const idToken = liff.getIDToken();

        if (!idToken) {
          liff.logout();

          throw new Error(
            "無法取得 LINE 登入憑證，請重新登入。"
          );
        }

        const result = await API.login(idToken);

        API.save(
          result.sessionToken,
          result.expiresAt
        );

        user = result.user;

        return user;
      }

      async function login() {
        if (loginPromise) {
          return loginPromise;
        }

        loginPromise = performLogin();

        try {
          return await loginPromise;
        } finally {
          loginPromise = null;
        }
      }

      async function logout() {
        API.clear();
        user = null;

        await initialize();

        if (liff.isLoggedIn()) {
          liff.logout();
        }

        location.replace(
          location.origin + location.pathname
        );
      }

      return {
        initialize,
        restore,
        login,
        logout,

        getUser() {
          return user;
        }
      };
    })();

    const App = (() => {
      const state = {
        page: "home",
        user: null,
        events: [],
        registrations: [],
        current: null,
        filters: {},
        registrationKey: "",
        modalLastFocus: null
      };

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function formatDate(value) {
        if (!value) return "日期未定";

        return new Intl.DateTimeFormat("zh-TW", {
          month: "long",
          day: "numeric",
          weekday: "short",
          timeZone: CONFIG.TIME_ZONE
        }).format(new Date(value));
      }

      function formatTime(value) {
        if (!value) return "--:--";

        return new Intl.DateTimeFormat("zh-TW", {
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
          timeZone: CONFIG.TIME_ZONE
        }).format(new Date(value));
      }

      function formatMoney(value) {
        return Number(value) === 0
          ? "免費"
          : `NT$${Number(value).toLocaleString("zh-TW")}`;
      }

      function accessibility(value) {
        return {
          yes: "有／可以",
          no: "沒有／不可以",
          unknown: "尚未確認"
        }[value] || "尚未確認";
      }

      function canRegister(item) {
        if (!item) return false;

        const now = Date.now();

        const start = new Date(
          item.registrationStartAt
        ).getTime();

        const end = new Date(
          item.registrationEndAt
        ).getTime();

        return (
          item.status === "open" &&
          Number.isFinite(start) &&
          Number.isFinite(end) &&
          start <= now &&
          end >= now
        );
      }

      function showLoading() {
        document.getElementById("main").innerHTML = `
          <div class="loading" role="status">
            <div>
              <div class="spinner" aria-hidden="true"></div>
              <p>正在載入……</p>
            </div>
          </div>
        `;
      }

      function validateConfig() {
        if (
          !CONFIG.GAS_API_URL ||
          CONFIG.GAS_API_URL.includes("請替換")
        ) {
          throw new Error("請先設定 GAS_API_URL。");
        }

        if (
          !CONFIG.LIFF_ID ||
          CONFIG.LIFF_ID.includes("請替換")
        ) {
          throw new Error("請先設定 LIFF_ID。");
        }
      }

      async function initialize() {
        try {
          validateConfig();

          await Auth.initialize();

          const results = await Promise.allSettled([
            API.events(),
            Auth.restore()
          ]);

          if (results[0].status === "fulfilled") {
            state.events =
              results[0].value.items || [];
          } else {
            toast(results[0].reason.message, true);
          }

          if (
            results[1].status === "fulfilled" &&
            results[1].value
          ) {
            state.user = results[1].value;
            await loadRegistrations();
          }

          await restoreRoute();
        } catch (error) {
          document.getElementById("main").innerHTML = `
            <div class="notice notice-danger">
              <h1>系統無法啟動</h1>
              <p>${escapeHtml(error.message)}</p>
            </div>
          `;
        }
      }

      async function restoreRoute() {
        const params = new URLSearchParams(
          location.search
        );

        const sessionId = params.get("session");
        const page = params.get("page");

        if (sessionId) {
          await openEvent(sessionId, false);
          return;
        }

        if (page === "events") {
          state.page = "events";
        } else if (page === "my" && state.user) {
          state.page = "my";
        } else {
          state.page = "home";
        }

        state.current = null;
        render();
      }

      // function updateHeader() {
      //   document.getElementById(
      //     "login-button"
      //   ).textContent = state.user
      //     ? state.user.displayName
      //     : "LINE 登入";

      //   document
      //     .querySelectorAll("[data-page]")
      //     .forEach(button => {
      //       button.classList.toggle(
      //         "active",
      //         button.dataset.page === state.page
      //       );
      //     });
      // }

      function updateHeader() {
        document.getElementById(
          "login-button"
        ).textContent = state.user
          ? state.user.displayName
          : "LINE 登入";

        const adminLink =
          document.getElementById(
            "admin-link"
          );

        const isAdmin =
          state.user &&
          [
            "admin",
            "superadmin"
          ].includes(
            state.user.role
          );

        if (adminLink) {
          adminLink.hidden = !isAdmin;

          adminLink.style.display =
            isAdmin
              ? "inline-flex"
              : "none";
        }

        document
          .querySelectorAll("[data-page]")
          .forEach(button => {
            button.classList.toggle(
              "active",
              button.dataset.page ===
                state.page
            );
          });
      }


      function render() {
        updateHeader();

        if (state.page === "home") {
          renderHome();
        } else if (state.page === "events") {
          renderEvents();
        } else if (state.page === "detail") {
          renderDetail();
        } else if (state.page === "my") {
          renderMy();
        }
      }

      function renderHome() {
        document.getElementById("main").innerHTML = `
          <section class="hero">
            <h1>找到適合的活動，也找到同行的人</h1>

            <p>
              清楚查看體力、交通、休息與無障礙資訊，
              再決定是否參加。
            </p>

            <button
              class="button button-accent"
              type="button"
              onclick="App.go('events')">
              尋找活動
            </button>
          </section>

          <section class="section">
            <div class="section-header">
              <div>
                <h2>近期活動</h2>
                <p>名額與候補狀態即時更新</p>
              </div>

              <button
                class="button button-secondary"
                type="button"
                onclick="App.go('events')">
                查看全部
              </button>
            </div>

            ${eventGrid(state.events.slice(0, 3))}
          </section>
        `;
      }

      function renderEvents() {
        document.getElementById("main").innerHTML = `
          <h1>尋找活動</h1>

          <form
            class="card filters"
            onsubmit="App.search(event)">

            <div class="field">
              <label for="keyword">關鍵字</label>

              <input
                id="keyword"
                class="input"
                name="keyword"
                type="search"
                value="${escapeHtml(
                  state.filters.keyword || ""
                )}"
                placeholder="活動或場地">
            </div>

            <div class="field">
              <label for="city">縣市</label>

              <input
                id="city"
                class="input"
                name="city"
                value="${escapeHtml(
                  state.filters.city || ""
                )}"
                placeholder="例如：新北市">
            </div>

            <div class="field">
              <label for="intensity">體力</label>

              <select
                id="intensity"
                class="select"
                name="intensity">
                ${option(
                  "",
                  "全部",
                  state.filters.intensity
                )}
                ${option(
                  "低體力",
                  "低體力",
                  state.filters.intensity
                )}
                ${option(
                  "中體力",
                  "中體力",
                  state.filters.intensity
                )}
                ${option(
                  "高體力",
                  "高體力",
                  state.filters.intensity
                )}
              </select>
            </div>

            <button
              class="button button-primary"
              type="submit">
              搜尋
            </button>
          </form>

          <section class="section">
            <h2>共 ${state.events.length} 場活動</h2>
            ${eventGrid(state.events)}
          </section>
        `;
      }

      function option(value, label, selected) {
        return `
          <option
            value="${escapeHtml(value)}"
            ${value === selected ? "selected" : ""}>
            ${escapeHtml(label)}
          </option>
        `;
      }

      function eventGrid(items) {
        if (!items.length) {
          return `
            <div class="empty">
              <div>
                <h2>目前沒有活動</h2>
                <p>請稍後再回來查看。</p>
              </div>
            </div>
          `;
        }

        return `
          <div class="grid">
            ${items.map(eventCard).join("")}
          </div>
        `;
      }

      function eventCard(item) {
        return `
          <article class="card event-card">
            <div class="event-head">
              <strong>
                ${formatDate(item.startAt)}
              </strong><br>

              ${formatTime(item.startAt)}–
              ${formatTime(item.endAt)}
            </div>

            <div class="event-body">
              <div>
                <span class="tag">
                  ${escapeHtml(item.category)}
                </span>

                <span class="tag">
                  ${escapeHtml(item.intensity)}
                </span>
              </div>

              <h3>${escapeHtml(item.title)}</h3>

              <ul class="meta">
                <li>
                  📍 ${escapeHtml(item.city)}
                  ${escapeHtml(item.district)}
                </li>

                <li>
                  🎟 ${
                    item.remainingCapacity > 0
                      ? `剩 ${item.remainingCapacity} 名`
                      : item.waitlistRemaining > 0
                        ? "額滿，可候補"
                        : "名額已滿"
                  }
                </li>

                <li>
                  💰 ${formatMoney(item.fee)}
                </li>
              </ul>

              <button
                class="button button-primary button-full"
                type="button"
                onclick="App.openEvent('${escapeHtml(
                  item.sessionId
                )}')">
                查看活動
              </button>
            </div>
          </article>
        `;
      }

      async function search(event) {
        event.preventDefault();

        const data = new FormData(event.target);

        state.filters = {
          keyword: String(data.get("keyword") || ""),
          city: String(data.get("city") || ""),
          intensity: String(
            data.get("intensity") || ""
          )
        };

        showLoading();

        try {
          const result = await API.events(
            state.filters
          );

          state.events = result.items || [];
        } catch (error) {
          toast(error.message, true);
        }

        render();
      }

      async function openEvent(
        sessionId,
        updateHistory = true
      ) {
        showLoading();

        try {
          state.current = await API.event(sessionId);
          state.page = "detail";

          if (updateHistory) {
            const url = new URL(location.href);

            url.search = "";
            url.searchParams.set("session", sessionId);

            history.pushState(
              {
                page: "detail",
                sessionId
              },
              "",
              url
            );
          }

          render();
          window.scrollTo({ top: 0 });
        } catch (error) {
          toast(error.message, true);
          state.page = "events";
          render();
        }
      }

      function renderDetail() {
        const item = state.current;

        if (!item) {
          state.page = "events";
          render();
          return;
        }

        const registration =
          state.registrations.find(record => {
            return (
              record.sessionId === item.sessionId &&
              record.status !== "cancelled"
            );
          });

        let registrationControl = "";

        if (registration) {
          registrationControl = `
            <button
              class="button button-secondary button-full"
              type="button"
              onclick="App.go('my')">
              查看我的報名
            </button>
          `;
        } else if (!canRegister(item)) {
          registrationControl = `
            <div class="notice notice-warning">
              此活動目前未開放報名。
            </div>
          `;
        } else if (
          item.remainingCapacity <= 0 &&
          item.waitlistRemaining <= 0
        ) {
          registrationControl = `
            <div class="notice notice-warning">
              正式名額及候補名額皆已額滿。
            </div>
          `;
        } else {
          registrationControl = `
            <button
              class="button button-accent button-full"
              type="button"
              onclick="App.openRegistration()">
              ${
                item.remainingCapacity > 0
                  ? "我要參加"
                  : "加入候補"
              }
            </button>
          `;
        }

        document.getElementById("main").innerHTML = `
          <button
            class="button button-secondary"
            type="button"
            onclick="App.go('events')">
            ← 返回活動列表
          </button>

          <div class="detail section">
            <article class="card panel">
              <span class="tag">
                ${escapeHtml(item.category)}
              </span>

              <span class="tag">
                ${escapeHtml(item.intensity)}
              </span>

              <h1>${escapeHtml(item.title)}</h1>

              ${
                registration
                  ? `
                    <div class="notice notice-success">
                      ${
                        registration.status === "confirmed"
                          ? "您已完成報名。"
                          : `您目前是候補第 ${
                              registration.waitlistPosition ||
                              registration.waitlistSequence
                            } 順位。`
                      }
                    </div>
                  `
                  : ""
              }

              <h2>活動介紹</h2>
              <p>${escapeHtml(item.description)}</p>

              <h2>活動條件</h2>

              <div class="info-grid">
                ${info("體力程度", item.intensity)}
                ${info(
                  "步行需求",
                  item.walkingDescription
                )}
                ${info(
                  "休息安排",
                  item.restDescription
                )}
                ${info("活動語言", item.language)}
              </div>

              <h2>無障礙資訊</h2>

              <div class="info-grid">
                ${info(
                  "輪椅進入",
                  accessibility(item.wheelchair)
                )}
                ${info(
                  "電梯或一樓",
                  accessibility(item.elevator)
                )}
                ${info(
                  "無障礙廁所",
                  accessibility(item.accessibleToilet)
                )}
                ${info(
                  "家屬陪同",
                  accessibility(item.companionAllowed)
                )}
                ${info(
                  "志工協助",
                  accessibility(item.volunteerAvailable)
                )}
              </div>

              <h2>地點與交通</h2>

              <p>
                <strong>
                  ${escapeHtml(item.venueName)}
                </strong><br>

                ${escapeHtml(item.address)}<br>
                ${escapeHtml(item.transit)}
              </p>
            </article>

            <aside class="card panel sticky">
              <h2>報名資訊</h2>

              <ul class="meta">
                <li>📅 ${formatDate(item.startAt)}</li>

                <li>
                  🕒 ${formatTime(item.startAt)}–
                  ${formatTime(item.endAt)}
                </li>

                <li>💰 ${formatMoney(item.fee)}</li>

                <li>
                  🎟 ${
                    item.remainingCapacity > 0
                      ? `剩餘 ${item.remainingCapacity} 名`
                      : item.waitlistRemaining > 0
                        ? `正式名額已滿，候補剩餘 ${
                            item.waitlistRemaining
                          } 名`
                        : "正式及候補名額皆已滿"
                  }
                </li>
              </ul>

              ${registrationControl}
            </aside>
          </div>
        `;
      }

      function info(label, value) {
        return `
          <div class="info">
            <strong>${escapeHtml(label)}</strong>
            ${escapeHtml(value || "尚未提供")}
          </div>
        `;
      }

      async function openRegistration() {
        if (!state.current) return;

        try {
          state.user = await Auth.login();
          updateHeader();

          state.registrationKey =
            API.createId("REGREQ-");

          const item = state.current;

          const companionAllowed =
            item.companionAllowed === "yes";

          openModal(`
            <div class="modal-header">
              <div>
                <h2 id="modal-title">活動報名</h2>
                <p>${escapeHtml(item.title)}</p>
              </div>

              <button
                class="close"
                type="button"
                aria-label="關閉"
                onclick="App.closeModal()">
                ×
              </button>
            </div>

            <form onsubmit="App.register(event)">
              <div class="field">
                <label for="participantName">
                  參加者名稱
                </label>

                <input
                  id="participantName"
                  class="input"
                  name="participantName"
                  maxlength="30"
                  value="${escapeHtml(
                    state.user.displayName
                  )}"
                  required>
              </div>

              <div class="field">
                <label for="companionCount">
                  陪同者人數
                </label>

                <select
                  id="companionCount"
                  class="select"
                  name="companionCount"
                  ${companionAllowed ? "" : "disabled"}>

                  <option value="0">沒有陪同者</option>

                  ${
                    companionAllowed
                      ? `
                        <option value="1">1 位</option>
                        <option value="2">2 位</option>
                      `
                      : ""
                  }
                </select>
              </div>

              <label class="checkbox">
                <input
                  name="seatRequired"
                  type="checkbox">

                <span>需要座位休息</span>
              </label>

              <label class="checkbox">
                <input
                  name="wheelchair"
                  type="checkbox">

                <span>使用輪椅</span>
              </label>

              <label class="checkbox">
                <input
                  name="volunteerGuide"
                  type="checkbox">

                <span>需要志工引導</span>
              </label>

              <div class="field">
                <label for="note">備註</label>

                <textarea
                  id="note"
                  class="textarea"
                  name="note"
                  maxlength="300"
                  placeholder="請勿填寫完整病歷或身分證字號"></textarea>
              </div>

              <label class="checkbox">
                <input type="checkbox" required>

                <span>
                  我已閱讀活動內容並確認活動條件。
                </span>
              </label>

              <button
                id="register-submit"
                class="button button-accent button-full"
                type="submit">
                確認送出
              </button>
            </form>
          `);
        } catch (error) {
          toast(error.message, true);
        }
      }

      async function register(event) {
        event.preventDefault();

        const form = event.target;
        const data = new FormData(form);

        const button = document.getElementById(
          "register-submit"
        );

        button.disabled = true;
        button.textContent = "正在處理……";

        try {
          const result = await API.register({
            sessionId: state.current.sessionId,
            idempotencyKey: state.registrationKey,
            participantName:
              data.get("participantName"),
            companionCount: Number(
              data.get("companionCount") || 0
            ),
            seatRequired:
              data.has("seatRequired"),
            wheelchair:
              data.has("wheelchair"),
            volunteerGuide:
              data.has("volunteerGuide"),
            note: data.get("note")
          });

          await Promise.all([
            loadRegistrations(),
            refreshCurrent()
          ]);

          state.registrationKey = "";

          closeModal();
          render();
          toast(result.message);
        } catch (error) {
          toast(error.message, true);

          button.disabled = false;
          button.textContent = "重新送出";
        }
      }

      async function loadRegistrations() {
        if (!API.token()) {
          state.registrations = [];
          return;
        }

        const result = await API.registrations();

        state.registrations =
          result.items || [];
      }

      async function refreshCurrent() {
        if (!state.current) return;

        state.current = await API.event(
          state.current.sessionId
        );
      }

      async function go(
        page,
        updateHistory = true
      ) {
        if (page === "my") {
          showLoading();

          try {
            state.user = await Auth.login();
            await loadRegistrations();
          } catch (error) {
            toast(error.message, true);
            render();
            return;
          }
        }

        if (page === "events") {
          showLoading();

          try {
            const result = await API.events(
              state.filters
            );

            state.events = result.items || [];
          } catch (error) {
            toast(error.message, true);
          }
        }

        state.page = page;
        state.current = null;

        if (updateHistory) {
          const url = new URL(location.href);

          url.search = "";

          if (page !== "home") {
            url.searchParams.set("page", page);
          }

          history.pushState(
            { page },
            "",
            url
          );
        }

        render();
        window.scrollTo({ top: 0 });
      }

      function renderMy() {
        document.getElementById("main").innerHTML = `
          <h1>我的活動</h1>

          ${
            state.registrations.length
              ? state.registrations
                  .map(registrationCard)
                  .join("")
              : `
                <div class="empty">
                  <div>
                    <h2>目前沒有活動紀錄</h2>

                    <button
                      class="button button-primary"
                      type="button"
                      onclick="App.go('events')">
                      前往找活動
                    </button>
                  </div>
                </div>
              `
          }
        `;
      }

      function registrationCard(record) {
        const names = {
          confirmed: "已報名",
          waitlist: `候補中${
            record.waitlistPosition
              ? `｜第 ${record.waitlistPosition} 順位`
              : ""
          }`,
          cancelled: "已取消"
        };

        return `
          <article class="card registration">
            <span
              class="status status-${escapeHtml(
                record.status
              )}">
              ${escapeHtml(
                names[record.status] ||
                record.status
              )}
            </span>

            <h2>${escapeHtml(record.title)}</h2>

            <p>
              ${formatDate(record.startAt)}
              ${formatTime(record.startAt)}–
              ${formatTime(record.endAt)}<br>

              ${escapeHtml(record.venueName)}<br>

              參加者：
              ${escapeHtml(record.participantName)}
            </p>

            <div class="actions">
              <button
                class="button button-secondary"
                type="button"
                onclick="App.openEvent('${escapeHtml(
                  record.sessionId
                )}')">
                活動詳情
              </button>

              ${
                record.status !== "cancelled"
                  ? `
                    <button
                      class="button button-danger"
                      type="button"
                      onclick="App.cancelRegistration('${escapeHtml(
                        record.registrationId
                      )}')">
                      ${
                        record.status === "waitlist"
                          ? "退出候補"
                          : "取消報名"
                      }
                    </button>
                  `
                  : ""
              }
            </div>
          </article>
        `;
      }

      async function cancelRegistration(
        registrationId
      ) {
        if (!confirm("確定要取消這筆報名嗎？")) {
          return;
        }

        try {
          const result = await API.cancel(
            registrationId
          );

          await loadRegistrations();
          render();
          toast(result.message);
        } catch (error) {
          toast(error.message, true);
        }
      }

      async function account() {
        if (!state.user) {
          try {
            state.user = await Auth.login();
            await loadRegistrations();

            render();

            toast(
              `歡迎，${state.user.displayName}。`
            );
          } catch (error) {
            toast(error.message, true);
          }

          return;
        }

        openModal(`
          <div class="modal-header">
            <div>
              <h2 id="modal-title">
                ${escapeHtml(state.user.displayName)}
              </h2>
              <p>LINE 會員</p>
            </div>

            <button
              class="close"
              type="button"
              aria-label="關閉"
              onclick="App.closeModal()">
              ×
            </button>
          </div>

          <button
            class="button button-primary button-full"
            type="button"
            onclick="App.closeModal();App.go('my')">
            我的活動
          </button>

          <br><br>

          <button
            class="button button-danger button-full"
            type="button"
            onclick="Auth.logout()">
            登出
          </button>
        `);
      }

      function openModal(content) {
        state.modalLastFocus =
          document.activeElement;

        document.getElementById(
          "modal"
        ).innerHTML = content;

        document.getElementById(
          "modal-backdrop"
        ).classList.add("open");

        document.body.classList.add(
          "modal-open"
        );

        setTimeout(() => {
          document
            .querySelector(
              "#modal button, #modal input, #modal select"
            )
            ?.focus();
        }, 0);
      }

      function closeModal() {
        document.getElementById(
          "modal-backdrop"
        ).classList.remove("open");

        document.body.classList.remove(
          "modal-open"
        );

        state.modalLastFocus?.focus?.();
      }

      function closeFromBackdrop(event) {
        if (event.target.id === "modal-backdrop") {
          closeModal();
        }
      }

      function toast(message, isError = false) {
        const element =
          document.getElementById("toast");

        element.textContent = message;

        element.className =
          "toast open" +
          (isError ? " error" : "");

        clearTimeout(toast.timeoutId);

        toast.timeoutId = setTimeout(() => {
          element.classList.remove("open");
        }, 4500);
      }

      document.addEventListener(
        "keydown",
        event => {
          if (
            event.key === "Escape" &&
            document
              .getElementById("modal-backdrop")
              .classList.contains("open")
          ) {
            closeModal();
          }
        }
      );

      window.addEventListener(
        "popstate",
        restoreRoute
      );

      return {
        initialize,
        go,
        search,
        openEvent,
        openRegistration,
        register,
        cancelRegistration,
        account,
        closeModal,
        closeFromBackdrop
      };
    })();

    window.API = API;
    window.Auth = Auth;
    window.App = App;

    window.addEventListener(
      "DOMContentLoaded",
      App.initialize
    );
  </script>
</body>
</html>
