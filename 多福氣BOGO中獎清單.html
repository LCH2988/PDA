<!DOCTYPE html>
<html lang="zh-TW">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>團隊中獎清單總覽</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Font: Inter & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans TC"', 'Inter', 'sans-serif'],
          },
          colors: {
            teamYiwen: '#0d9488',   // Teal
            teamXiaoyan: '#2563eb',  // Blue
            teamJiajia: '#d97706',   // Amber
            teamHuaxuan: '#db2777',  // Pink
            teamTaizhen: '#7c3aed',  // Purple
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Noto Sans TC', 'Inter', sans-serif;
      background-color: #f8fafc;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; color: black !important; }
      .print-shadow-none { box-shadow: none !important; }
    }

</head>
<body class="text-slate-800 min-h-screen flex flex-col antialiased">

  <!-- Main Header -->
  <header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-30 shadow-md no-print">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-white shadow-lg shadow-teal-500/30">
          <i class="fa-solid fa-trophy text-xl"></i>
        </div>
        <div>
          <h1 class="text-xl sm:text-2xl font-bold tracking-tight bg-gradient-to-r from-white via-slate-100 to-slate-300 bg-clip-text text-transparent">
            團隊幸運中獎名單
          </h1>
          <p class="text-xs text-slate-400">完整抽獎名單 (共 100 筆資料)</p>
        </div>
      </div>

      <!-- Quick Action Buttons -->
      <div class="flex items-center space-x-2 w-full sm:w-auto justify-end">
        <button id="lookupBtn" onclick="openLookupModal()" class="px-3 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-sm font-medium transition flex items-center gap-2 shadow-sm">
          <i class="fa-solid fa-magnifying-glass"></i>
          <span>個人中獎快速查詢</span>
        </button>
        <button onclick="exportCSV()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 rounded-lg text-sm font-medium transition flex items-center gap-1.5">
          <i class="fa-solid fa-file-csv"></i>
          <span class="hidden md:inline">匯出</span> CSV
        </button>
        <button onclick="window.print()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 rounded-lg text-sm font-medium transition flex items-center gap-1.5">
          <i class="fa-solid fa-print"></i>
          <span class="hidden md:inline">列印</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full">

    <!-- Statistics Overview Cards -->
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3 mb-6 no-print">
      <!-- Total Card -->
      <div onclick="filterByTeam('all')" class="cursor-pointer bg-white p-4 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition group">
        <div class="flex items-center justify-between text-slate-500 mb-1">
          <span class="text-xs font-semibold uppercase tracking-wider">總中獎數</span>
          <i class="fa-solid fa-gift text-slate-400 group-hover:scale-110 transition"></i>
        </div>
        <div class="text-2xl font-bold text-slate-900" id="stat-total">100</div>
        <div class="text-[11px] text-slate-400 mt-1">全隊伍合計</div>
      </div>

      <!-- 怡文 Team -->
      <div onclick="filterByTeam('怡文')" class="cursor-pointer bg-white p-4 rounded-xl border-l-4 border-l-teal-600 border border-slate-200 shadow-sm hover:shadow-md transition group">
        <div class="flex items-center justify-between text-teal-700 mb-1">
          <span class="text-xs font-bold">怡文團隊</span>
          <span class="text-[10px] bg-teal-50 text-teal-700 px-1.5 py-0.5 rounded-full font-medium">40%</span>
        </div>
        <div class="text-2xl font-bold text-slate-900" id="stat-yiwen">40</div>
        <div class="text-[11px] text-slate-400 mt-1">人次中獎</div>
      </div>

      <!-- 小顏 Team -->
      <div onclick="filterByTeam('小顏')" class="cursor-pointer bg-white p-4 rounded-xl border-l-4 border-l-blue-600 border border-slate-200 shadow-sm hover:shadow-md transition group">
        <div class="flex items-center justify-between text-blue-700 mb-1">
          <span class="text-xs font-bold">小顏團隊</span>
          <span class="text-[10px] bg-blue-50 text-blue-700 px-1.5 py-0.5 rounded-full font-medium">18%</span>
        </div>
        <div class="text-2xl font-bold text-slate-900" id="stat-xiaoyan">18</div>
        <div class="text-[11px] text-slate-400 mt-1">人次中獎</div>
      </div>

      <!-- 家嘉 Team -->
      <div onclick="filterByTeam('家嘉')" class="cursor-pointer bg-white p-4 rounded-xl border-l-4 border-l-amber-500 border border-slate-200 shadow-sm hover:shadow-md transition group">
        <div class="flex items-center justify-between text-amber-700 mb-1">
          <span class="text-xs font-bold">家嘉團隊</span>
          <span class="text-[10px] bg-amber-50 text-amber-700 px-1.5 py-0.5 rounded-full font-medium">15%</span>
        </div>
        <div class="text-2xl font-bold text-slate-900" id="stat-jiajia">15</div>
        <div class="text-[11px] text-slate-400 mt-1">人次中獎</div>
      </div>

      <!-- 華萱 Team -->
      <div onclick="filterByTeam('華萱')" class="cursor-pointer bg-white p-4 rounded-xl border-l-4 border-l-pink-500 border border-slate-200 shadow-sm hover:shadow-md transition group">
        <div class="flex items-center justify-between text-pink-700 mb-1">
          <span class="text-xs font-bold">華萱團隊</span>
          <span class="text-[10px] bg-pink-50 text-pink-700 px-1.5 py-0.5 rounded-full font-medium">14%</span>
        </div>
        <div class="text-2xl font-bold text-slate-900" id="stat-huaxuan">14</div>
        <div class="text-[11px] text-slate-400 mt-1">人次中獎</div>
      </div>

      <!-- 苔珍 Team -->
      <div onclick="filterByTeam('苔珍')" class="cursor-pointer bg-white p-4 rounded-xl border-l-4 border-l-purple-600 border border-slate-200 shadow-sm hover:shadow-md transition group">
        <div class="flex items-center justify-between text-purple-700 mb-1">
          <span class="text-xs font-bold">苔珍團隊</span>
          <span class="text-[10px] bg-purple-50 text-purple-700 px-1.5 py-0.5 rounded-full font-medium">13%</span>
        </div>
        <div class="text-2xl font-bold text-slate-900" id="stat-taizhen">13</div>
        <div class="text-[11px] text-slate-400 mt-1">人次中獎</div>
      </div>
    </div>

    <!-- Filter Toolbar -->
    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-6 no-print flex flex-col md:flex-row gap-4 items-center justify-between">
      
      <!-- Search Input -->
      <div class="relative w-full md:w-80">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
          <i class="fa-solid fa-magnifying-glass"></i>
        </div>
        <input 
          type="text" 
          id="searchInput"
          oninput="handleSearch()"
          placeholder="搜尋姓名、編號或獎品名稱..." 
          class="w-full pl-9 pr-8 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition"
        />
        <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
          <i class="fa-solid fa-circle-xmark"></i>
        </button>
      </div>

      <!-- Team Filter Chips -->
      <div class="flex flex-wrap items-center gap-1.5 w-full md:w-auto overflow-x-auto pb-1 md:pb-0">
        <button onclick="filterByTeam('all')" id="btn-team-all" class="team-chip active px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-900 text-white transition">
          全部 (100)
        </button>
        <button onclick="filterByTeam('怡文')" id="btn-team-怡文" class="team-chip px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 text-slate-700 hover:bg-teal-50 hover:text-teal-700 transition">
          怡文 (40)
        </button>
        <button onclick="filterByTeam('小顏')" id="btn-team-小顏" class="team-chip px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 text-slate-700 hover:bg-blue-50 hover:text-blue-700 transition">
          小顏 (18)
        </button>
        <button onclick="filterByTeam('家嘉')" id="btn-team-家嘉" class="team-chip px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 text-slate-700 hover:bg-amber-50 hover:text-amber-700 transition">
          家嘉 (15)
        </button>
        <button onclick="filterByTeam('華萱')" id="btn-team-華萱" class="team-chip px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 text-slate-700 hover:bg-pink-50 hover:text-pink-700 transition">
          華萱 (14)
        </button>
        <button onclick="filterByTeam('苔珍')" id="btn-team-苔珍" class="team-chip px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 text-slate-700 hover:bg-purple-50 hover:text-purple-700 transition">
          苔珍 (13)
        </button>
      </div>

      <!-- View Toggle Buttons -->
      <div class="flex items-center space-x-1 border border-slate-200 bg-slate-50 p-1 rounded-lg w-full md:w-auto justify-center">
        <button onclick="switchView('table')" id="view-btn-table" class="px-3 py-1 rounded text-xs font-medium bg-white shadow-sm text-slate-800 flex items-center gap-1">
          <i class="fa-solid fa-table-list"></i>

        <i class="fa-solid fa-circle-info"></i>
        <span>已篩選：<strong id="filterText"></strong> (共 <span id="filteredCount">0</span> 筆結果)</span>
      </div>
      <button onclick="resetFilters()" class="text-indigo-600 font-semibold hover:underline">重設篩選</button>
    </div>

      <div class="overflow-x-auto custom-scrollbar">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-900 text-slate-200 text-xs uppercase tracking-wider font-semibold">
              <th class="py-3.5 px-4 text-center w-24 cursor-pointer hover:bg-slate-800 transition" onclick="sortTable('drawOrder')">
                抽獎順序 <i class="fa-solid fa-sort text-slate-500 ml-1"></i>
              </th>
              <th class="py-3.5 px-4 text-center w-28 cursor-pointer hover:bg-slate-800 transition" onclick="sortTable('team')">
                團隊 <i class="fa-solid fa-sort text-slate-500 ml-1"></i>
              </th>
              <th class="py-3.5 px-4 text-center w-28 cursor-pointer hover:bg-slate-800 transition" onclick="sortTable('winnerId')">
                編號 <i class="fa-solid fa-sort text-slate-500 ml-1"></i>
              </th>
              <th class="py-3.5 px-4">中獎人姓名</th>
              <th class="py-3.5 px-4">獲得獎品</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-100 text-sm font-normal">
            <!-- Table rows populated dynamically -->
          </tbody>
        </table>
      </div>

      <!-- Table Footer Status -->
      <div class="bg-slate-50 px-4 py-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500 no-print">
        <span id="showingCountText">顯示 100 中的 100 筆資料</span>
        <span class="text-slate-400">點擊欄位標題可進行排序</span>
      </div>
    </div>

    <!-- VIEW 2: GROUPED VIEW -->
    <div id="groupedView" class="hidden space-y-6">
      <!-- Group sections will be dynamically injected here -->
    </div>

  </main>

  <!-- Personal Lookup Modal -->
  <div id="lookupModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden no-print">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 relative animate-in fade-in zoom-in duration-200">
      
      <!-- Close button -->
      <button onclick="closeLookupModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-1">
        <i class="fa-solid fa-xmark text-xl"></i>
      </button>

      <div class="flex items-center space-x-3 mb-4">
        <div class="w-10 h-10 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center text-lg">
          <i class="fa-solid fa-user-check"></i>
        </div>
        <div>
          <h3 class="text-lg font-bold text-slate-900">個人中獎快速查詢</h3>
          <p class="text-xs text-slate-500">輸入姓名或編號快速查對獎品</p>
        </div>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">關鍵字查詢</label>
          <div class="relative">
            <input 
              type="text" 
              id="modalSearchInput"
              onkeyup="performModalLookup()"
              placeholder="例如: 332, 怡文, 晴, 保溫杯..." 
              class="w-full pl-3 pr-10 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />
            <button onclick="performModalLookup()" class="absolute right-2 top-2 px-2 py-1 bg-indigo-600 text-white rounded-lg text-xs hover:bg-indigo-500">
              查詢
            </button>
          </div>
        </div>

        <!-- Result Container -->
        <div id="modalResultContainer" class="max-h-60 overflow-y-auto custom-scrollbar space-y-2 pr-1">
          <div class="text-center py-8 text-slate-400 text-xs">
            <i class="fa-solid fa-search text-3xl mb-2 text-slate-300"></i>
            <p>請輸入中獎人姓名、編號或團隊名稱</p>
          </div>
        </div>
      </div>

      <div class="mt-6 pt-4 border-t border-slate-100 flex justify-end">
        <button onclick="closeLookupModal()" class="px-4 py-2 bg-slate-100 text-slate-700 text-xs font-semibold rounded-lg hover:bg-slate-200">
          關閉視窗
        </button>
      </div>

    </div>
  </div>

    <i class="fa-solid fa-circle-check text-emerald-400"></i>
    <span id="toastText">訊息發送成功</span>

    // State Variables
    let currentTeamFilter = 'all';
    let searchQuery = '';
    let currentView = 'table';
    let sortColumn = 'drawOrder';
    let sortAscending = true;

    // Team Styling Meta
    const TEAM_STYLING = {
      '怡文': { bg: 'bg-teal-50', text: 'text-teal-700', border: 'border-teal-200', badge: 'bg-teal-100 text-teal-800' },
      '小顏': { bg: 'bg-blue-50', text: 'text-blue-700', border: 'border-blue-200', badge: 'bg-blue-100 text-blue-800' },
      '家嘉': { bg: 'bg-amber-50', text: 'text-amber-700', border: 'border-amber-200', badge: 'bg-amber-100 text-amber-800' },
      '華萱': { bg: 'bg-pink-50', text: 'text-pink-700', border: 'border-pink-200', badge: 'bg-pink-100 text-pink-800' },
      '苔珍': { bg: 'bg-purple-50', text: 'text-purple-700', border: 'border-purple-200', badge: 'bg-purple-100 text-purple-800' }
    };

    // Initializer
    window.onload = function() {
      renderApp();
    };

    function renderApp() {
      const filtered = getFilteredData();
      renderTable(filtered);
      renderGroupedView(filtered);
      updateFilterBanner(filtered.length);
      updateChipStyles();
    }

    function getFilteredData() {
      return RAW_DATA.filter(item => {
        const matchesTeam = (currentTeamFilter === 'all') || (item.team === currentTeamFilter);
        const q = searchQuery.toLowerCase().trim();
        const matchesQuery = !q || 
          item.name.toLowerCase().includes(q) || 
          item.prize.toLowerCase().includes(q) || 
          item.winnerId.toString().includes(q) ||
          item.drawOrder.toString().includes(q) ||
          item.team.toLowerCase().includes(q);
        
        return matchesTeam && matchesQuery;
      }).sort((a, b) => {
        let valA = a[sortColumn];
        let valB = b[sortColumn];
        if (typeof valA === 'string') {
          return sortAscending ? valA.localeCompare(valB) : valB.localeCompare(valA);
        }
        return sortAscending ? valA - valB : valB - valA;
      });
    }

    // Render Table
    function renderTable(data) {
      const tbody = document.getElementById('tableBody');
      const countText = document.getElementById('showingCountText');

      if (data.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" class="py-12 text-center text-slate-400">
              <i class="fa-regular fa-folder-open text-4xl mb-3 block text-slate-300"></i>
              沒有找到符合條件的中獎資料
            </td>
          </tr>
        `;
        countText.innerText = `顯示 0 筆資料`;
        return;
      }

      tbody.innerHTML = data.map((row, idx) => {
        const teamStyle = TEAM_STYLING[row.team] || { badge: 'bg-slate-100 text-slate-800' };
        const isEven = idx % 2 === 0;

        return `
          <tr class="${isEven ? 'bg-white' : 'bg-slate-50/50'} hover:bg-slate-100/70 transition">
            <td class="py-3 px-4 text-center font-semibold text-slate-600">
              <span class="inline-block px-2 py-0.5 bg-slate-100 rounded text-xs font-mono">
                第 ${row.drawOrder} 抽
              </span>
            </td>
            <td class="py-3 px-4 text-center">
              <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold ${teamStyle.badge}">
                ${row.team}
              </span>
            </td>
            <td class="py-3 px-4 text-center font-mono text-slate-500 font-medium">
              #${row.winnerId}
            </td>
            <td class="py-3 px-4 font-medium text-slate-900">
              ${highlightSearchText(row.name)}
            </td>
            <td class="py-3 px-4 text-slate-800">
              <div class="flex items-center space-x-2">
                <i class="fa-solid fa-gift text-indigo-500 text-xs"></i>
                <span>${highlightSearchText(row.prize)}</span>
              </div>
            </td>
          </tr>
        `;
      }).join('');

      countText.innerText = `顯示 ${data.length} 中的 ${RAW_DATA.length} 筆資料`;
    }

    // Render Grouped View
    function renderGroupedView(data) {
      const groupedContainer = document.getElementById('groupedView');
      const teams = ['怡文', '小顏', '家嘉', '華萱', '苔珍'];

      groupedContainer.innerHTML = teams.map(teamName => {
        const teamItems = data.filter(d => d.team === teamName);
        if (teamItems.length === 0 && currentTeamFilter !== 'all' && currentTeamFilter !== teamName) {
          return '';
        }

        const teamStyle = TEAM_STYLING[teamName];

        return `
          <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
            <div class="${teamStyle.bg} px-5 py-3 border-b ${teamStyle.border} flex items-center justify-between">
              <div class="flex items-center space-x-3">
                <span class="font-bold text-lg ${teamStyle.text}">${teamName}團隊</span>
                <span class="px-2.5 py-0.5 bg-white text-slate-700 rounded-full text-xs font-semibold shadow-xs">
                  ${teamItems.length} 人中獎
                </span>
              </div>
            </div>

            ${teamItems.length === 0 ? `
              <div class="p-6 text-center text-slate-400 text-xs">
                無此條件下的中獎資料
              </div>
            ` : `
              <div class="p-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                ${teamItems.map(item => `
                  <div class="p-3 rounded-lg border border-slate-100 bg-slate-50/60 hover:bg-white hover:border-slate-300 hover:shadow-xs transition">
                    <div class="flex items-center justify-between mb-1.5 text-xs text-slate-500">
                      <span class="font-mono bg-white px-2 py-0.5 rounded border border-slate-200">第 ${item.drawOrder} 抽</span>
                      <span class="font-mono">編號 #${item.winnerId}</span>
                    </div>
                    <div class="font-semibold text-slate-900 text-sm truncate mb-1" title="${item.name}">
                      ${highlightSearchText(item.name)}
                    </div>
                    <div class="text-xs text-indigo-700 bg-indigo-50/80 px-2 py-1 rounded flex items-center gap-1.5 font-medium">
                      <i class="fa-solid fa-gift text-indigo-500"></i>
                      <span class="truncate">${highlightSearchText(item.prize)}</span>
                    </div>
                  </div>
                `).join('')}
              </div>
            `}
          </div>
        `;
      }).join('');
    }

    // Highlight search match
    function highlightSearchText(text) {
      if (!searchQuery) return text;
      const regex = new RegExp(`(${escapeRegExp(searchQuery)})`, 'gi');
      return text.replace(regex, '<mark class="bg-amber-200 text-slate-900 rounded px-0.5">$1</mark>');
    }

    function escapeRegExp(string) {
      return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    // Handle Search
    function handleSearch() {
      const input = document.getElementById('searchInput');
      searchQuery = input.value;
      
      const clearBtn = document.getElementById('clearSearchBtn');
      if (searchQuery) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }

      renderApp();
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      searchQuery = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      renderApp();
    }

    // Filter Team
    function filterByTeam(team) {
      currentTeamFilter = team;
      renderApp();
    }

    function resetFilters() {
      currentTeamFilter = 'all';
      clearSearch();
    }

    function updateFilterBanner(count) {
      const banner = document.getElementById('filterInfoBanner');
      const text = document.getElementById('filterText');
      const countSpan = document.getElementById('filteredCount');

      let filterParts = [];
      if (currentTeamFilter !== 'all') filterParts.push(`團隊: ${currentTeamFilter}`);
      if (searchQuery) filterParts.push(`關鍵字: "${searchQuery}"`);

      if (filterParts.length > 0) {
        text.innerText = filterParts.join(' | ');
        countSpan.innerText = count;
        banner.classList.remove('hidden');
      } else {
        banner.classList.add('hidden');
      }
    }

    function updateChipStyles() {
      const chips = document.querySelectorAll('.team-chip');
      chips.forEach(chip => {
        const isTarget = chip.id === `btn-team-${currentTeamFilter}`;
        if (isTarget) {
          chip.className = 'team-chip active px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-900 text-white transition shadow-sm';
        } else {
          chip.className = 'team-chip px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200 transition';
        }
      });
    }

    // Sort Table
    function sortTable(column) {
      if (sortColumn === column) {
        sortAscending = !sortAscending;
      } else {
        sortColumn = column;
        sortAscending = true;
      }
      renderApp();
    }

    // Switch View
    function switchView(view) {
      currentView = view;
      const tableView = document.getElementById('tableView');
      const groupedView = document.getElementById('groupedView');
      const btnTable = document.getElementById('view-btn-table');
      const btnGrouped = document.getElementById('view-btn-grouped');

      if (view === 'table') {
        tableView.classList.remove('hidden');
        groupedView.classList.add('hidden');
        btnTable.className = 'px-3 py-1 rounded text-xs font-medium bg-white shadow-sm text-slate-800 flex items-center gap-1';
        btnGrouped.className = 'px-3 py-1 rounded text-xs font-medium text-slate-600 hover:text-slate-900 flex items-center gap-1';
      } else {
        tableView.classList.add('hidden');
        groupedView.classList.remove('hidden');
        btnGrouped.className = 'px-3 py-1 rounded text-xs font-medium bg-white shadow-sm text-slate-800 flex items-center gap-1';
        btnTable.className = 'px-3 py-1 rounded text-xs font-medium text-slate-600 hover:text-slate-900 flex items-center gap-1';
      }
    }

    // Modal Operations
    function openLookupModal() {
      document.getElementById('lookupModal').classList.remove('hidden');
      document.getElementById('modalSearchInput').focus();

      document.getElementById('lookupModal').classList.add('hidden');

          <div>
            <div class="flex items-center space-x-2">
              <span class="text-xs font-bold text-slate-900">${item.name}</span>
              <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-200 text-slate-700 font-mono">#${item.winnerId}</span>
            </div>
            <div class="text-xs text-indigo-600 font-medium mt-1">
              🎉 ${item.prize}
            </div>
          </div>
          <div class="text-right">
            <span class="text-xs font-semibold text-slate-500 block">第 ${item.drawOrder} 抽</span>
            <span class="text-[10px] text-slate-400">${item.team}團隊</span>
          </div>
        </div>
      `).join('');
    }

    // Export CSV Functionality
    function exportCSV() {
      const headers = ["抽獎順序", "團隊", "中獎人編號", "中獎人姓名", "獲得獎品"];
      const rows = RAW_DATA.map(d => [
        `第 ${d.drawOrder} 抽`,
        d.team,
        d.winnerId,
        `"${d.name.replace(/"/g, '""')}"`,
        `"${d.prize.replace(/"/g, '""')}"`
      ]);

      let csvContent = "\uFEFF" + headers.join(",") + "\n" + rows.map(e => e.join(",")).join("\n");
      
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `團隊中獎清單_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      showToast("CSV 檔案匯出成功！");
    }

    // Toast Notification
    function showToast(message) {
      const toast = document.getElementById('toast');
      const toastText = document.getElementById('toastText');
      toastText.innerText = message;

      toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');

      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-2');
      }, 2500);
    }
  </script>
</body>
