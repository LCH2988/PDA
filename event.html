<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>活動報名系統｜社團法人台灣帕金森病友權益促進會</title>
<meta name="description" content="社團法人台灣帕金森病友權益促進會活動管理系統：共用官網會員名冊、LIFF 動態活動調查表單、自訂問題與統計項目、報名自動回覆與推播活動至 LINE 群組。">
<script>
  try {
    var p = JSON.parse(localStorage.getItem("tpda_prefs") || "{}");
    if (p.size) document.documentElement.style.fontSize = p.size + "px";
    if (p.hc) document.documentElement.classList.add("hc");
  } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js" defer></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: { navy:'#1B365D', navy2:'#2B4C7E', sun:'#D97706', sundeep:'#B45309', sundark:'#92400E', cream:'#FAF8F5', ink:'#1A202C', pine:'#2F6F5E', lav:'#5B4B7A', line:'#06C755' },
    fontFamily: { sans: ['"Noto Sans TC"','"Microsoft JhengHei"','sans-serif'] }
  } } }
</script>
<style>
  html { font-size:18px; scroll-behavior:smooth; }
  body { font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif; background:#FAF8F5; color:#1A202C; line-height:1.8; letter-spacing:.04em; overflow-x:hidden; }
  #topBar { position:sticky; top:0; z-index:50; transition:transform .25s ease; }
  @media (max-width:767px) { #topBar.nav-hidden { transform:translateY(-100%); } }
  .btn{ min-height:56px; padding:.5rem 1.3rem; border-radius:14px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; gap:.5rem; border:2px solid transparent; cursor:pointer; text-decoration:none; font-size:1rem; line-height:1.4; text-align:center; transition:transform .1s, background-color .15s; }
  .btn:active, .btn-step:active, .tab:active, .fab-btn:active{ transform:scale(.98); }
  .btn:disabled, .btn-step:disabled{ opacity:.65 !important; cursor:wait !important; pointer-events:none; }
  .btn-sun{ background:#B45309; color:#fff; } .btn-sun:hover{ background:#92400E; }
  .btn-navy{ background:#1B365D; color:#fff; } .btn-navy:hover{ background:#2B4C7E; }
  .btn-pine{ background:#2F6F5E; color:#fff; } .btn-pine:hover{ background:#225446; }
  .btn-line{ background:#06C755; color:#1A202C; border-color:#1A202C; } .btn-line:hover{ background:#05A847; }
  .btn-light{ background:#fff; color:#1B365D; border-color:#1B365D; } .btn-light:hover{ background:#EEF3FA; }
  .btn-danger{ background:#fff; color:#9B2C2C; border-color:#9B2C2C; }
  .btn-step{ min-height:44px; padding:.25rem .75rem; background:#fff; color:#1B365D; border:2px solid #CBD5E1; border-radius:10px; font-weight:800; cursor:pointer; white-space:nowrap; font-size:.92rem; }
  .btn-step[aria-pressed="true"]{ background:#B45309; color:#fff; border-color:#fff; }
  .tab{ min-height:52px; padding:.45rem 1.1rem; border-radius:14px; border:2px solid #1B365D; background:#fff; color:#1B365D; font-weight:700; cursor:pointer; font-size:.95rem; white-space:nowrap; flex-shrink:0; }
  .tab[aria-selected="true"]{ background:#1B365D; color:#fff; }
  :focus-visible{ outline:4px solid #D97706 !important; outline-offset:3px; }
  .eyebrow{ text-transform:uppercase; letter-spacing:.2em; font-size:.85rem; font-weight:800; color:#2F6F5E; }
  .card{ background:#fff; border:2px solid #CBD5E1; border-left:8px solid var(--c,#2F6F5E); border-radius:1.5rem; box-shadow:0 6px 18px rgba(27,54,93,.07); }
  .pill{ display:inline-block; padding:.15rem .85rem; border-radius:999px; font-size:.85rem; font-weight:700; background:var(--pbg,#E6EDF7); color:var(--pfg,#1B365D); }
  .fld{ min-height:54px; width:100%; border:2px solid #2F6F5E; border-radius:14px; padding:.35rem .85rem; background:#fff; color:#1A202C; font-size:1rem; }
  dialog{ border:3px solid #1B365D; border-radius:1.5rem; padding:1.5rem; max-width:44rem; width:calc(100% - 1.5rem); color:#1A202C; background:#fff; }
  dialog::backdrop{ background:rgba(26,32,44,.7); }
  #toast{ transition:opacity .25s, transform .25s; }
  #toast.show{ opacity:1; transform:translate(-50%,0); }

  .fab-stack { position:fixed; right:.9rem; bottom:1.1rem; z-index:80; display:flex; flex-direction:column; gap:.55rem; }
  @media (min-width:768px) { .fab-stack { display:none; } }
  .fab-btn { width:56px; height:56px; border-radius:999px; background:#1B365D; color:#fff; border:3px solid #FBBF24; box-shadow:0 8px 20px rgba(27,54,93,.4); display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:900; font-size:.72rem; cursor:pointer; }
  .fab-btn.sub { background:#fff; color:#1B365D; border-color:#1B365D; width:48px; height:48px; margin-left:auto; }

  .hc body{ background:#000 !important; }
  .hc *, .hc *::before, .hc *::after{ background-color:#000 !important; background-image:none !important; color:#FFEB00 !important; border-color:#FFEB00 !important; box-shadow:none !important; }
  .hc .btn, .hc .btn-step, .hc .fld, .hc .tab, .hc .fab-btn{ border:3px solid #FFEB00 !important; }
</style>
</head>
<body>
<header id="topBar" class="bg-navy text-white shadow-lg border-b-4 border-sun" aria-label="無障礙與系統工具列">
  <div class="max-w-7xl mx-auto px-4 py-2 flex flex-wrap items-center justify-between gap-2">
    <div class="flex items-center gap-2.5">
      <span class="text-2xl" aria-hidden="true">📅</span>
      <div>
        <h1 class="font-black text-base sm:text-xl leading-tight">台灣帕金森病友權益促進會｜活動報名系統</h1>
        <p class="text-xs text-amber-300 font-bold hidden sm:block">LIFF 活動調查表單・即時統計分析・自動回覆與 LINE 群組推播</p>
      </div>
    </div>
    <div class="flex flex-wrap items-center gap-1.5">
      <div class="flex items-center gap-1 bg-white/10 p-1 rounded-xl border border-white/25" role="group" aria-label="字體大小調整">
        <button type="button" class="btn-step" style="min-height:36px;padding:.15rem .55rem" onclick="adjustFontSize(-2)" aria-label="縮小字體">A-</button>
        <span class="fontSizeBadge text-xs font-black px-1 text-amber-300">18px</span>
        <button type="button" class="btn-step" style="min-height:36px;padding:.15rem .55rem" onclick="adjustFontSize(2)" aria-label="放大字體">A+</button>
      </div>
      <button type="button" id="btnContrast" class="btn-step" aria-pressed="false">🌓 高對比</button>
      <button type="button" id="btnBackHome" class="btn-step" style="border-color:#FBBF24">🏠 回官網</button>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-6 pb-24">
  <section class="rounded-3xl p-6 text-white shadow-xl border-2 border-pine" style="background:linear-gradient(135deg,#1B365D 0%,#2F6F5E 100%)">
    <div class="flex flex-wrap items-center justify-between gap-4">
      <div>
        <p class="eyebrow" style="color:#FBBF24">共用會員名冊與活動報名</p>
        <h2 id="evtBannerUser" class="text-2xl md:text-3xl font-black mt-1">請使用 LINE 驗證會員身分</h2>
        <p id="evtBannerSub" class="text-white/90 mt-1">報名時系統自動帶入您在官網共用會員名冊的姓名、會員編號、縣市與聯絡電話。</p>
      </div>
      <div class="flex flex-wrap gap-3">
        <button type="button" id="btnLineLogin" class="btn btn-line">🟢 使用 LINE 帳號驗證登入</button>
        <button type="button" id="btnReloadEvents" class="btn btn-light">🔄 重新整理活動資料</button>
      </div>
    </div>
  </section>

  <div role="tablist" aria-label="活動系統功能分頁" class="mt-7 flex gap-2.5 overflow-x-auto pb-2">
    <button type="button" role="tab" class="tab" data-eview="LIST" aria-selected="true">🏃 活動報名與調查表</button>
    <button type="button" role="tab" class="tab" data-eview="STATS" aria-selected="false">📊 活動統計看板與名冊</button>
    <button type="button" role="tab" id="tabBuilder" class="tab hidden" data-eview="BUILDER" aria-selected="false">➕ 建立 LIFF 活動表單</button>
  </div>

  <section id="eview-LIST" class="mt-5 space-y-6">
    <div id="eventCardsBox" class="space-y-6"></div>
  </section>

  <section id="eview-STATS" class="hidden mt-5 space-y-6">
    <div class="card p-6" style="--c:#1B365D">
      <div class="flex flex-wrap items-center justify-between gap-4">
        <div>
          <p class="eyebrow">活動調查即時統計分析</p>
          <h3 class="text-2xl font-black text-navy">活動調查即時統計看板</h3>
        </div>
        <label class="font-bold text-navy">選擇檢視活動：<select id="statEventSelect" class="fld mt-1 min-w-[16rem]"></select></label>
      </div>
      <div class="mt-4 p-4 rounded-2xl bg-cream border-2 border-slate-300">
        <p class="font-black text-navy">☑️ 勾選要顯示與統計的內容：</p>
        <div id="statFieldToggles" class="mt-3 flex flex-wrap gap-2.5"></div>
      </div>
      <div id="statSummaryBox" class="mt-5"></div>
      <div id="statRegTableBox" class="mt-6"></div>
    </div>
  </section>

  <section id="eview-BUILDER" class="hidden mt-5 space-y-6">
    <div class="card p-6" style="--c:#B45309">
      <p class="eyebrow" style="color:#B45309">動態活動調查表單建立器</p>
      <h3 class="text-2xl font-black text-navy">建立活動調查表單（自訂問題＆選擇統計項目）</h3>
      <form id="builderForm" class="mt-5 space-y-5">
        <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
          <label class="block font-bold sm:col-span-2">活動名稱（必填）<input id="bTitle" type="text" class="fld mt-1" required></label>
          <label class="block font-bold">活動日期與時間（必填）<input id="bDate" type="text" class="fld mt-1" placeholder="YYYY-MM-DD HH:mm" required></label>
          <label class="block font-bold sm:col-span-2">集合／活動地點（必填）<input id="bLocation" type="text" class="fld mt-1" required></label>
          <div class="grid grid-cols-2 gap-3">
            <label class="block font-bold">名額上限<input id="bQuota" type="number" min="1" class="fld mt-1" value="60" required></label>
            <label class="block font-bold">報名截止日<input id="bDeadline" type="date" class="fld mt-1" required></label>
          </div>
        </div>
        <label class="block font-bold">活動內容與注意事項<textarea id="bDesc" rows="3" class="fld mt-1" required></textarea></label>
        <div class="p-4 rounded-2xl bg-cream border-2 border-slate-300 flex flex-wrap gap-4">
          <label class="flex items-center gap-2 font-bold"><input id="bStatCity" type="checkbox" class="w-5 h-5" checked> 納入「所在縣市」統計</label>
          <label class="flex items-center gap-2 font-bold"><input id="bStatRole" type="checkbox" class="w-5 h-5" checked> 納入「身分別」統計</label>
        </div>
        <div class="p-4 rounded-2xl bg-emerald-50/50 border-2 border-pine">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <h4 class="text-lg font-black text-navy">📋 自訂活動調查問題</h4>
            <div class="flex flex-wrap gap-2">
              <button type="button" id="btnAddQuestion" class="btn btn-pine text-sm" style="min-height:44px">➕ 新增問題</button>
              <button type="button" id="btnLoadPresetWalk" class="btn btn-light text-sm" style="min-height:44px">健走常用題組</button>
              <button type="button" id="btnLoadPresetLecture" class="btn btn-light text-sm" style="min-height:44px">講座常用題組</button>
            </div>
          </div>
          <div id="builderQuestionsList" class="mt-4 space-y-3"></div>
        </div>
        <div class="p-4 rounded-2xl bg-green-50 border-2 border-green-600 space-y-2">
          <label class="flex items-center gap-2 font-black text-navy"><input id="bAutoPush" type="checkbox" class="w-5 h-5" checked> 📢 建立表單後立即推播至 LINE 群組</label>
          <label class="block text-sm font-bold text-slate-700">指定 LINE 群組 ID（選填）<input id="bGroupId" type="text" class="fld mt-1"></label>
        </div>
        <button type="submit" id="btnSaveEvent" class="btn btn-sun w-full md:w-auto">🚀 儲存發布活動表單</button>
      </form>
    </div>
  </section>
</main>

<div class="fab-stack">
  <button type="button" class="fab-btn sub" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="回到頂部">↑</button>
  <button type="button" class="fab-btn" onclick="navigateSystem(CONFIG.HOME_URL)" aria-label="返回協會官網"><span>🏠</span><span>官網</span></button>
</div>

<dialog id="lineDlg" aria-labelledby="lineDlgTitle">
  <div id="lineDlgBody"></div>
  <div class="mt-5 flex flex-wrap justify-end gap-3 border-t-2 border-slate-200 pt-3">
    <button type="button" id="btnCopyLineText" class="btn btn-navy">📋 複製訊息</button>
    <button type="button" id="btnShareLinePicker" class="btn btn-line">🟢 開啟 LINE 群組推播</button>
    <button type="button" id="btnCloseLineDlg" class="btn btn-light">關閉</button>
  </div>
</dialog>

<div id="toast" role="status" aria-live="polite" class="fixed bottom-6 left-1/2 -translate-x-1/2 translate-y-4 opacity-0 z-[100] bg-ink text-white px-6 py-4 rounded-2xl font-bold shadow-2xl max-w-[92vw] border-2 border-sun pointer-events-none">
  <span id="toastMsg"></span>
</div>

<script>
const CONFIG = {
  GAS_URL: "https://script.google.com/macros/s/AKfycbwdjdwYZCyl8Enr1tiIKq1H2oxrpbVUTBef9l6AKOEx7Axzv7GiEsk5KzSn1-ChtfKK8w/exec",
  LIFF_ID: "2009456572-EflpADae",
  HOME_URL: "https://tpda.org.tw/home.html",
  LIFF_EVENT_URL: "https://liff.line.me/2009456572-EflpADae/event.html"
};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"'`]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[m]));
const taipeiDate = () => new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Taipei" }).format(new Date());
function toast(msg) { const t = $("#toast"); $("#toastMsg").textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 4000); }
function navigateSystem(url) { if (!url) return; const inLine = window.liff && typeof liff.isInClient === "function" && liff.isInClient(); if (inLine) window.location.href = url; else window.open(url, "_blank", "noopener,noreferrer"); }
async function withBusy(btn, busyText, asyncFn) {
  if (!btn) return await asyncFn(); if (btn.dataset.busy === "1") return;
  btn.dataset.busy = "1"; const orig = btn.innerHTML; btn.disabled = true; btn.innerHTML = `⏳ ${busyText || "處理中…"}`;
  try { return await asyncFn(); } finally { btn.dataset.busy = ""; btn.disabled = false; btn.innerHTML = orig; }
}

let lineToken = "", currentUser = null, isEvtAdmin = false, activeClipText = "", deepLinkHandled = false;
const EVT_STATE = { events: [] };
let builderQuestions = [
  { id:"q_1", label:"餐點選擇", type:"single", options:["葷食便當","素食便當","不需備餐"], required:true, isStat:true },
  { id:"q_2", label:"交通與接駁調查", type:"single", options:["自行前往","搭乘接駁車","大眾運輸"], required:true, isStat:true },
  { id:"q_3", label:"無障礙輔具與協助需求（可複選）", type:"multi", options:["無特殊需求","輪椅使用者","助行器／手杖","需志工協助"], required:false, isStat:true },
  { id:"q_4", label:"備註或提問", type:"text", options:[], required:false, isStat:false }
];

async function api(payload) {
  const r = await fetch(CONFIG.GAS_URL, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
  return await r.json();
}
function normalizeEvents(raw) {
  return (raw || []).map(ev => {
    let qs = ev.questions || [], sf = ev.statsFields || [];
    if (!qs.length && ev.questionsJson) { try { qs = JSON.parse(ev.questionsJson); } catch(e){} }
    if (!sf.length && ev.statsFieldsJson) { try { sf = JSON.parse(ev.statsFieldsJson); } catch(e){} }
    const regs = (ev.registrations || []).map(r => { let a = r.answers || {}; if (r.answersJson && !r.answers) { try { a = JSON.parse(r.answersJson); } catch(e){} } return { ...r, answers: a }; });
    let myReg = ev.myReg || null; if (myReg && myReg.answersJson && !myReg.answers) { try { myReg.answers = JSON.parse(myReg.answersJson); } catch(e){} }
    return { ...ev, questions: qs, statsFields: sf, registrations: regs, myReg };
  });
}
function focusDeepLinkEvent() {
  if (deepLinkHandled) return;
  const tid = new URLSearchParams(location.search).get("event"); if (!tid) return;
  const card = document.getElementById("ev-card-" + tid);
  if (card) { deepLinkHandled = true; card.scrollIntoView({ behavior:"smooth" }); card.style.outline = "4px solid #D97706"; setTimeout(() => { card.style.outline = ""; }, 4000); }
}
async function loadEventsData() {
  try {
    if (lineToken) {
      const r = await api({ action:"eventInit", accessToken:lineToken });
      if (r && r.ok) { currentUser = r.me; isEvtAdmin = !!r.isEvtAdmin; EVT_STATE.events = normalizeEvents(r.events); $("#btnLineLogin").classList.add("hidden"); renderHeaderBanner(); renderEventList(); focusDeepLinkEvent(); return; }
    }
    const pub = await fetch(CONFIG.GAS_URL + "?action=publicEvents").then(r => r.json());
    if (pub && pub.ok) EVT_STATE.events = normalizeEvents(pub.events);
  } catch (e) {}
  renderHeaderBanner(); renderEventList(); focusDeepLinkEvent();
}

function calcStatsForEvent(ev) {
  if (ev.stats && (!ev.registrations || !ev.registrations.length) && ev.stats.totalRegistered > 0) return ev.stats;
  const regs = (ev.registrations || []).filter(r => r.status !== "已取消"), breakdowns = [], sf = ev.statsFields || [];
  if (sf.includes("city")) { const c = {}; regs.forEach(r => { const k = r.city || "未填"; c[k] = (c[k] || 0) + 1; }); breakdowns.push({ fieldId:"city", label:"所在縣市分布", counts:c, total:regs.length }); }
  if (sf.includes("roleGroup")) { const c = {}; regs.forEach(r => { const k = r.roleGroup || "一般會員"; c[k] = (c[k] || 0) + 1; }); breakdowns.push({ fieldId:"roleGroup", label:"身分別分布", counts:c, total:regs.length }); }
  (ev.questions || []).forEach(q => {
    if (!q.isStat && !sf.includes(q.id)) return;
    const c = {}; (q.options || []).forEach(o => { c[o] = 0; });
    regs.forEach(r => { const v = (r.answers || {})[q.id]; if (Array.isArray(v)) v.forEach(x => { if (x) c[x] = (c[x] || 0) + 1; }); else if (v != null && String(v).trim()) { const k = String(v).trim(); c[k] = (c[k] || 0) + 1; } });
    breakdowns.push({ fieldId:q.id, label:q.label, counts:c, total:regs.length });
  });
  return { totalRegistered:regs.length, quota:Number(ev.quota)||0, remaining:Math.max(0,(Number(ev.quota)||0)-regs.length), breakdowns };
}

function renderHeaderBanner() {
  $("#tabBuilder").classList.toggle("hidden", !isEvtAdmin);
  if (!currentUser) { $("#evtBannerUser").textContent = "請先使用 LINE 帳號驗證登入"; return; }
  $("#evtBannerUser").textContent = `${currentUser.name}（${currentUser.memberNo}・${currentUser.city}・${currentUser.group}）`;
  $("#evtBannerSub").textContent = isEvtAdmin ? "您具備活動管理權限：可建立活動表單、檢視完整報名名冊與推播 LINE 群組。" : "系統已帶入您的會員資料，可直接於下方填寫活動報名表。";
}

function renderEventList() {
  const box = $("#eventCardsBox");
  if (!EVT_STATE.events.length) { box.innerHTML = `<p class="p-6 rounded-2xl bg-white border-2 text-center font-bold text-slate-700">目前尚無開放報名之活動。</p>`; return; }
  const today = taipeiDate();
  box.innerHTML = EVT_STATE.events.map(ev => {
    const st = calcStatsForEvent(ev), myReg = ev.myReg || (currentUser ? (ev.registrations || []).find(r => r.memberNo === currentUser.memberNo && r.status !== "已取消") : null);
    const isFull = !myReg && st.quota > 0 && st.totalRegistered >= st.quota, isExp = ev.deadline && /^\d{4}-\d{2}-\d{2}$/.test(ev.deadline) && today > ev.deadline;
    return `<article id="ev-card-${esc(ev.id)}" class="card p-6" style="--c:#2F6F5E">
      <div class="flex flex-wrap justify-between gap-2">
        <div class="flex flex-wrap gap-2"><span class="pill" style="--pbg:#DCFCE7;--pfg:#166534">${esc(ev.status)}</span><span class="pill">${esc(ev.id)}</span>${myReg ? `<span class="pill" style="--pbg:#FEF3C7;--pfg:#92400E">✅ 已報名（${esc(myReg.id)}）</span>` : ""}</div>
        <div class="flex flex-wrap gap-2">
          <button type="button" class="btn btn-line text-sm" style="min-height:44px;padding:.2rem .8rem" data-push-line="${esc(ev.id)}">📢 推播群組</button>
          <button type="button" class="btn btn-light text-sm" style="min-height:44px;padding:.2rem .8rem" data-jump-stat="${esc(ev.id)}">📊 統計（${st.totalRegistered}/${st.quota}）</button>
        </div>
      </div>
      <h3 class="mt-3 text-2xl font-black text-navy">${esc(ev.title)}</h3>
      <p class="mt-1.5 text-sm font-bold text-slate-700">📅 ${esc(ev.date)} ｜ 📍 ${esc(ev.location)} ｜ 👥 已報 ${st.totalRegistered}/${st.quota} 人（截止：${esc(ev.deadline)}）</p>
      <p class="mt-2 text-slate-700">${esc(ev.description)}</p>
      <form class="mt-5 rounded-2xl border-2 border-emerald-800/30 bg-emerald-50/40 p-5 space-y-4" data-reg-form="${esc(ev.id)}">
        <div class="flex flex-wrap justify-between gap-2 border-b pb-2"><h4 class="text-lg font-black text-navy">📝 活動報名與需求調查表</h4><span class="text-xs font-bold text-emerald-800">${currentUser ? `${esc(currentUser.name)}（${esc(currentUser.memberNo)}）` : "請先登入 LINE"}</span></div>
        <div class="grid md:grid-cols-2 gap-4">${(ev.questions || []).map(q => renderQuestionInput(q, myReg ? (myReg.answers || {})[q.id] : null)).join("")}</div>
        <button type="submit" class="btn btn-navy" ${(isFull || isExp) ? "disabled" : ""}>${isExp ? "已截止報名" : isFull ? "名額已滿" : (myReg ? "💾 更新報名回覆" : "✅ 送出活動報名")}</button>
      </form>
    </article>`;
  }).join("");
}

function renderQuestionInput(q, val) {
  if (q.type === "single") return `<div class="bg-white p-3.5 rounded-xl border"><label class="block font-bold text-navy text-sm">${esc(q.label)}<select class="fld mt-1.5" data-qid="${esc(q.id)}" ${q.required ? "required" : ""}>${(q.options || []).map(o => `<option value="${esc(o)}" ${val === o ? "selected" : ""}>${esc(o)}</option>`).join("")}</select></label></div>`;
  if (q.type === "multi") { const arr = Array.isArray(val) ? val : []; return `<div class="bg-white p-3.5 rounded-xl border md:col-span-2"><p class="font-bold text-navy text-sm">${esc(q.label)}</p><div class="mt-2 grid sm:grid-cols-2 gap-2">${(q.options || []).map(o => `<label class="flex items-center gap-2 p-2.5 rounded-xl border font-bold text-sm cursor-pointer"><input type="checkbox" class="w-5 h-5" data-qmulti="${esc(q.id)}" value="${esc(o)}" ${arr.includes(o) ? "checked" : ""}><span>${esc(o)}</span></label>`).join("")}</div></div>`; }
  return `<div class="bg-white p-3.5 rounded-xl border md:col-span-2"><label class="block font-bold text-navy text-sm">${esc(q.label)}<input type="${q.type === 'number' ? 'number' : 'text'}" class="fld mt-1.5" data-qid="${esc(q.id)}" value="${esc(val || '')}" ${q.required ? "required" : ""}></label></div>`;
}

function renderStatsView(selId) {
  const sel = $("#statEventSelect");
  if (!EVT_STATE.events.length) { sel.innerHTML = `<option>尚無活動</option>`; return; }
  sel.innerHTML = EVT_STATE.events.map(ev => `<option value="${esc(ev.id)}" ${ev.id === selId ? "selected" : ""}>${esc(ev.title)}</option>`).join("");
  const ev = EVT_STATE.events.find(x => x.id === (selId || sel.value)) || EVT_STATE.events[0]; if (!ev) return;
  const cands = [{ id:"city", label:"所在縣市" }, { id:"roleGroup", label:"身分別" }, ...(ev.questions || []).map(q => ({ id:q.id, label:q.label }))];
  ev.statsFields = ev.statsFields || ["city","roleGroup"];
  $("#statFieldToggles").innerHTML = cands.map(c => { const q = (ev.questions || []).find(x => x.id === c.id); const chk = ev.statsFields.includes(c.id) || (q && q.isStat); return `<label class="flex items-center gap-2 px-3 py-1.5 rounded-xl border-2 ${chk ? 'border-navy bg-navy text-white' : 'border-slate-300 bg-white'} font-bold text-sm cursor-pointer"><input type="checkbox" class="w-4 h-4" data-toggle-stat="${esc(c.id)}" data-evid="${esc(ev.id)}" ${chk ? "checked" : ""}>${esc(c.label)}</label>`; }).join("");
  const st = calcStatsForEvent(ev);
  $("#statSummaryBox").innerHTML = `<div class="grid sm:grid-cols-3 gap-3 mb-5"><div class="p-4 rounded-2xl bg-navy text-white text-center"><p class="text-xs text-amber-300">已報名</p><p class="text-2xl font-black">${st.totalRegistered} 人</p></div><div class="p-4 rounded-2xl bg-pine text-white text-center"><p class="text-xs text-amber-300">名額上限</p><p class="text-2xl font-black">${st.quota} 人</p></div><div class="p-4 rounded-2xl bg-amber-700 text-white text-center"><p class="text-xs text-amber-200">剩餘名額</p><p class="text-2xl font-black">${st.remaining} 人</p></div></div><div class="grid md:grid-cols-2 gap-4">${st.breakdowns.map(b => `<div class="card p-4" style="--c:#0369A1"><h4 class="font-black text-navy">📊 ${esc(b.label)}</h4><div class="mt-2 space-y-2">${Object.entries(b.counts || {}).map(([k, cnt]) => { const pct = b.total > 0 ? Math.round((cnt / b.total) * 100) : 0; return `<div><div class="flex justify-between text-xs font-bold"><span>${esc(k)}</span><span>${cnt} 人（${pct}%）</span></div><div class="w-full h-3 bg-slate-200 rounded-full overflow-hidden mt-1"><div class="h-full bg-navy" style="width:${pct}%"></div></div></div>`; }).join("")}</div></div>`).join("")}</div>`;
  $("#statRegTableBox").innerHTML = isEvtAdmin ? `<h4 class="text-lg font-black text-navy">📋 報名名冊（共 ${(ev.registrations || []).length} 筆）</h4><div class="mt-2 overflow-x-auto border-2 rounded-2xl bg-white"><table class="w-full text-left text-sm"><thead class="bg-slate-100"><tr><th class="p-2.5">序號</th><th class="p-2.5">姓名（編號）</th><th class="p-2.5">身分別／縣市</th>${(ev.questions || []).map(q => `<th class="p-2.5">${esc(q.label)}</th>`).join("")}</tr></thead><tbody>${(ev.registrations || []).map(r => `<tr class="border-t"><td class="p-2.5">${esc(r.id)}</td><td class="p-2.5 font-bold">${esc(r.name)}（${esc(r.memberNo)}）</td><td class="p-2.5">${esc(r.roleGroup)}・${esc(r.city)}</td>${(ev.questions || []).map(q => { const v = (r.answers || {})[q.id]; return `<td class="p-2.5">${esc(Array.isArray(v) ? v.join("、") : (v || "—"))}</td>`; }).join("")}</tr>`).join("")}</tbody></table></div>` : "";
}

function renderBuilderQuestions() {
  $("#builderQuestionsList").innerHTML = builderQuestions.map((q, i) => `<div class="p-4 rounded-xl bg-white border-2 space-y-2"><div class="flex flex-wrap justify-between gap-2"><span class="pill">第 ${i + 1} 題</span><div class="flex gap-3 items-center"><label class="flex items-center gap-1 font-bold text-sm"><input type="checkbox" class="w-4 h-4" data-bq-stat="${i}" ${q.isStat ? "checked" : ""}> 納入統計</label><label class="flex items-center gap-1 font-bold text-sm"><input type="checkbox" class="w-4 h-4" data-bq-req="${i}" ${q.required ? "checked" : ""}> 必填</label><button type="button" class="btn btn-danger text-xs" style="min-height:36px;padding:.15rem .6rem" data-bq-del="${i}">刪題</button></div></div><div class="grid sm:grid-cols-3 gap-2"><input class="fld sm:col-span-2" data-bq-label="${i}" value="${esc(q.label)}"><select class="fld" data-bq-type="${i}"><option value="single" ${q.type==="single"?"selected":""}>單選</option><option value="multi" ${q.type==="multi"?"selected":""}>多選</option><option value="text" ${q.type==="text"?"selected":""}>簡答</option><option value="number" ${q.type==="number"?"selected":""}>數字</option></select></div>${(q.type==="single"||q.type==="multi")?`<input class="fld text-sm" data-bq-opts="${i}" value="${esc((q.options||[]).join('、'))}" placeholder="選項以頓號分隔">`:""}</div>`).join("");
}

function openLineModal(title, sub, msg) { activeClipText = msg; $("#lineDlgBody").innerHTML = `<h2 id="lineDlgTitle" class="text-xl font-black text-navy">${esc(title)}</h2><p class="text-sm text-slate-600 mt-1">${esc(sub)}</p><pre class="mt-3 p-4 rounded-2xl bg-cream border text-sm whitespace-pre-line">${esc(msg)}</pre>`; $("#lineDlg").showModal(); }

document.querySelectorAll("[data-eview]").forEach(btn => btn.addEventListener("click", () => {
  const v = btn.dataset.eview;
  document.querySelectorAll("[data-eview]").forEach(b => b.setAttribute("aria-selected", String(b === btn)));
  ["LIST","STATS","BUILDER"].forEach(k => $("#eview-" + k).classList.toggle("hidden", k !== v));
  if (v === "STATS") renderStatsView(); if (v === "BUILDER") renderBuilderQuestions();
}));
$("#statEventSelect").addEventListener("change", e => renderStatsView(e.target.value));
document.addEventListener("change", e => {
  const ts = e.target.closest("[data-toggle-stat]"); if (ts) { const ev = EVT_STATE.events.find(x => x.id === ts.dataset.evid); if (!ev) return; const f = ts.dataset.toggleStat; if (ts.checked) { if (!ev.statsFields.includes(f)) ev.statsFields.push(f); } else { ev.statsFields = ev.statsFields.filter(x => x !== f); const q = (ev.questions||[]).find(x => x.id === f); if (q) q.isStat = false; } renderStatsView(ev.id); }
  const bt = e.target.closest("[data-bq-type]"); if (bt) { builderQuestions[+bt.dataset.bqType].type = bt.value; renderBuilderQuestions(); }
  const bs = e.target.closest("[data-bq-stat]"); if (bs) builderQuestions[+bs.dataset.bqStat].isStat = bs.checked;
  const br = e.target.closest("[data-bq-req]"); if (br) builderQuestions[+br.dataset.bqReq].required = br.checked;
});
document.addEventListener("input", e => {
  const bl = e.target.closest("[data-bq-label]"); if (bl) builderQuestions[+bl.dataset.bqLabel].label = bl.value;
  const bo = e.target.closest("[data-bq-opts]"); if (bo) builderQuestions[+bo.dataset.bqOpts].options = bo.value.split(/[、,，]/).map(s => s.trim()).filter(Boolean);
});
document.addEventListener("click", async e => {
  const dq = e.target.closest("[data-bq-del]"); if (dq) { builderQuestions.splice(+dq.dataset.bqDel, 1); renderBuilderQuestions(); return; }
  const js = e.target.closest("[data-jump-stat]"); if (js) { document.querySelector('[data-eview="STATS"]').click(); renderStatsView(js.dataset.jumpStat); return; }
  const pb = e.target.closest("[data-push-line]"); if (pb) {
    const ev = EVT_STATE.events.find(x => x.id === pb.dataset.pushLine); if (!ev) return;
    const msg = `📢【活動報名通知】${ev.title}\n📅 時間：${ev.date}\n📍 地點：${ev.location}\n👉 報名連結：${CONFIG.LIFF_EVENT_URL}?event=${encodeURIComponent(ev.id)}`;
    return withBusy(pb, "推播中…", async () => { if (lineToken && isEvtAdmin) await api({ action:"pushEventGroup", accessToken:lineToken, eventId:ev.id, eventPageUrl:CONFIG.LIFF_EVENT_URL }).catch(()=>{}); openLineModal("推播活動至 LINE 群組", "可點擊下方按鈕喚起 LINE 群組選擇器：", msg); });
  }
});
document.addEventListener("submit", async e => {
  const rf = e.target.closest("[data-reg-form]"); if (!rf) return;
  e.preventDefault(); if (!currentUser || !lineToken) return toast("請先登入 LINE 會員帳號");
  const ev = EVT_STATE.events.find(x => x.id === rf.dataset.regForm), answers = {};
  (ev.questions || []).forEach(q => { answers[q.id] = q.type === "multi" ? [...rf.querySelectorAll(`[data-qmulti="${q.id}"]:checked`)].map(c => c.value) : (rf.querySelector(`[data-qid="${q.id}"]`)?.value.trim() || ""); });
  await withBusy(rf.querySelector('button[type="submit"]'), "送出報名…", async () => {
    const r = await api({ action:"submitEventReg", accessToken:lineToken, eventId:ev.id, answers });
    if (!r || !r.ok) return toast((r && r.message) || "報名失敗");
    await loadEventsData(); openLineModal("報名已完成", "系統已產生確認通知：", r.autoReplyText || "已完成報名");
  });
});
$("#btnAddQuestion").onclick = () => { builderQuestions.push({ id:"q_" + Date.now().toString().slice(-4), label:"新調查問題", type:"single", options:["選項一","選項二"], required:false, isStat:true }); renderBuilderQuestions(); };
$("#btnLoadPresetWalk").onclick = () => { builderQuestions = [{ id:"q_diet", label:"便當選擇", type:"single", options:["葷食","素食","不需用餐"], required:true, isStat:true }, { id:"q_bus", label:"接駁車", type:"single", options:["自行前往","火車站接駁"], required:true, isStat:true }, { id:"q_aid", label:"輔具需求", type:"multi", options:["無","輪椅","助行器","需志工協助"], required:false, isStat:true }]; renderBuilderQuestions(); };
$("#btnLoadPresetLecture").onclick = () => { builderQuestions = [{ id:"q_topic", label:"關心主題", type:"multi", options:["用藥與開關現象","DBS評估","居家防跌","長照補助"], required:true, isStat:true }, { id:"q_seat", label:"座位需求", type:"single", options:["一般座位","輪椅席","前排友善席"], required:true, isStat:true }]; renderBuilderQuestions(); };
$("#builderForm").onsubmit = async e => {
  e.preventDefault(); const sf = []; if ($("#bStatCity").checked) sf.push("city"); if ($("#bStatRole").checked) sf.push("roleGroup"); builderQuestions.forEach(q => { if (q.isStat) sf.push(q.id); });
  await withBusy($("#btnSaveEvent"), "發布中…", async () => {
    const r = await api({ action:"saveEvent", accessToken:lineToken, title:$("#bTitle").value.trim(), date:$("#bDate").value.trim(), location:$("#bLocation").value.trim(), quota:Number($("#bQuota").value)||50, deadline:$("#bDeadline").value, description:$("#bDesc").value.trim(), questions:builderQuestions, statsFields:sf, autoPushGroup:$("#bAutoPush").checked, targetGroupId:$("#bGroupId").value.trim(), eventPageUrl:CONFIG.LIFF_EVENT_URL });
    toast((r && r.message) || "已儲存"); if (r && r.ok) { await loadEventsData(); document.querySelector('[data-eview="LIST"]').click(); }
  });
};
$("#btnLineLogin").onclick = () => { if (window.liff && CONFIG.LIFF_ID) liff.login({ redirectUri: location.href }); };
$("#btnReloadEvents").onclick = async function () { await withBusy(this, "同步中…", async () => { await loadEventsData(); toast("已重新同步"); }); };
$("#btnCopyLineText").onclick = async () => { try { await navigator.clipboard.writeText(activeClipText); } catch (e) {} toast("已複製文字"); };
$("#btnShareLinePicker").onclick = async () => { try { if (window.liff && liff.isApiAvailable("shareTargetPicker")) { await liff.shareTargetPicker([{ type:"text", text:activeClipText }]); return toast("已完成群組推播"); } } catch (e) {} toast("請於 LINE 內開啟或直接複製貼上"); };
$("#btnCloseLineDlg").onclick = () => $("#lineDlg").close();
$("#btnBackHome").onclick = () => navigateSystem(CONFIG.HOME_URL);

const prefs = (() => { try { return JSON.parse(localStorage.getItem("tpda_prefs") || "{}"); } catch(e) { return {}; } })();
function savePrefs() { try { localStorage.setItem("tpda_prefs", JSON.stringify(prefs)); } catch(e){} }
function applyFontSize(px) { const c = Math.max(16, Math.min(30, Number(px) || 18)); document.documentElement.style.fontSize = c + "px"; prefs.size = c; savePrefs(); document.querySelectorAll(".fontSizeBadge").forEach(el => { el.textContent = c + "px"; }); }
function adjustFontSize(d) { applyFontSize((Number(prefs.size) || 18) + d); toast("字體大小已調整為 " + prefs.size + "px"); }
$("#btnContrast").onclick = () => { const on = !document.documentElement.classList.contains("hc"); document.documentElement.classList.toggle("hc", on); $("#btnContrast").setAttribute("aria-pressed", String(on)); prefs.hc = on; savePrefs(); toast(on ? "已開啟高對比模式" : "已關閉高對比模式"); };
let lastSY = window.scrollY;
window.addEventListener("scroll", () => { const bar = $("#topBar"); const cy = window.scrollY; if (cy > 90 && cy > lastSY + 10) bar.classList.add("nav-hidden"); else if (cy < lastSY - 6 || cy <= 50) bar.classList.remove("nav-hidden"); lastSY = cy; }, { passive: true });

applyFontSize(prefs.size || 18);
if (prefs.hc) { document.documentElement.classList.add("hc"); $("#btnContrast").setAttribute("aria-pressed", "true"); }
$("#bDeadline").value = taipeiDate();
renderHeaderBanner(); renderBuilderQuestions(); loadEventsData();

window.addEventListener("load", async () => {
  if (!window.liff || !CONFIG.LIFF_ID) return;
  try { await liff.init({ liffId: CONFIG.LIFF_ID }); if (liff.isLoggedIn()) { lineToken = liff.getAccessToken(); await loadEventsData(); } } catch (e) {}
});
</script>
</body>
</html>
