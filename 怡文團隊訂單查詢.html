<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOGO多福氣 怡文團隊個人訂購清單搜尋系統</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  
  body {
    font-family: 'Microsoft JhengHei', 'Arial', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    padding: 20px 10px;
    min-height: 100vh;
    color: #333;
  }
  
  .container {
    max-width: 800px;
    margin: 0 auto;
  }
  
  .header {
    background: white;
    padding: 25px 20px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    margin-bottom: 20px;
    text-align: center;
  }
  
  .header h1 {
    color: #667eea;
    font-size: 1.8em;
    margin-bottom: 8px;
  }
  
  .header p {
    color: #666;
    font-size: 0.95em;
  }
  
  .sync-status {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.8em;
    margin-top: 8px;
    background: #d1fae5;
    color: #065f46;
    font-weight: bold;
  }

  .sync-status.loading-status {
    background: #fef3c7;
    color: #b45309;
  }
  
  .search-card {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    margin-bottom: 20px;
  }

  .search-label {
    display: block;
    font-size: 1.1em;
    font-weight: bold;
    color: #4a5568;
    margin-bottom: 10px;
  }
  
  .search-box {
    position: relative;
  }

  .search-input {
    width: 100%;
    padding: 14px 15px;
    border: 2px solid #e2e8f0;
    border-radius: 10px;
    font-size: 1.1em;
    transition: all 0.3s;
  }
  
  .search-input:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.25);
  }
  
  .search-results {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    max-height: 250px;
    overflow-y: auto;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    background: white;
    z-index: 10;
    box-shadow: 0 10px 15px rgba(0,0,0,0.1);
    margin-top: 5px;
  }
  
  .search-result-item {
    padding: 12px 15px;
    border-bottom: 1px solid #edf2f7;
    cursor: pointer;
    transition: background 0.2s;
    font-weight: 500;
  }
  
  .search-result-item:hover {
    background: #ebf8ff;
    color: #2b6cb0;
  }
  
  .search-result-item:last-child {
    border-bottom: none;
  }

  .btn-print {
    display: block;
    width: 100%;
    padding: 12px;
    background: #10b981;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 1em;
    font-weight: bold;
    cursor: pointer;
    margin-top: 15px;
    transition: background 0.2s;
    text-align: center;
  }

  .btn-print:hover {
    background: #059669;
  }
  
  .detail-container {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    animation: fadeIn 0.4s ease-out;
  }

  .detail-header {
    background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
    color: white;
    padding: 15px 20px;
    border-radius: 10px;
    font-size: 1.3em;
    font-weight: bold;
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .team-badge {
    background: rgba(255, 255, 255, 0.2);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.8em;
    border: 1px solid rgba(255, 255, 255, 0.4);
  }
  
  .section-title {
    background: #f3e8ff;
    color: #6b21a8;
    padding: 10px 15px;
    border-radius: 8px;
    font-size: 1.1em;
    font-weight: bold;
    margin: 20px 0 12px 0;
    border-left: 5px solid #8b5cf6;
  }

  .section-title.report-title {
    background: #ecfdf5;
    color: #065f46;
    border-left-color: #10b981;
  }
  
  .person-table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    font-size: 0.95em;
    margin-bottom: 15px;
  }
  
  .person-table th {
    background: #f8fafc;
    padding: 12px 10px;
    text-align: left;
    font-weight: 600;
    border-bottom: 2px solid #e2e8f0;
    color: #475569;
  }
  
  .person-table td {
    padding: 10px;
    border-bottom: 1px solid #f1f5f9;
    color: #334155;
  }
  
  .person-table tbody tr:hover {
    background: #f8fafc;
  }

  .person-table .total-row {
    background: #fef3c7;
    font-weight: bold;
  }
  
  .person-table .total-row td {
    padding: 12px 10px;
    border-top: 2px solid #f59e0b;
    border-bottom: 2px solid #f59e0b;
    color: #92400e;
  }
  
  .loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    flex-direction: column;
  }
  
  .loading-overlay.show {
    display: flex;
  }
  
  .spinner {
    border: 5px solid #f3f3f3;
    border-top: 5px solid #667eea;
    border-radius: 50%;
    width: 50px;
    height: 50px;
    animation: spin 1s linear infinite;
    margin-bottom: 15px;
  }
  
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  @media print {
    body {
      background: white;
      padding: 0;
    }
    .header, .search-card, .btn-print {
      display: none;
    }
    .container {
      max-width: 100%;
    }
    .detail-container {
      box-shadow: none;
      padding: 0;
    }
  }
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div style="color: white; font-size: 1.1em;">同步雲端資料中...</div>
</div>

<div class="container">
  <div class="header">
    <h1>🔍 BOGO多福氣 怡文團隊個人訂購查詢</h1>
    <p>輸入姓名即可快速查詢個人訂購與搶購明細</p>
    <span class="sync-status loading-status" id="syncStatus">● 資料載入中...</span>
  </div>
  
  
  <div class="search-card">
    <label class="search-label" for="searchInput">請輸入姓名關鍵字：</label>
    <!-- <div class="search-sublabel">⚠️ 本系統僅限查詢以下團隊成員：華萱、怡文、小顏、家嘉、苔珍</div> -->
    <div class="search-box">
      <input type="text" class="search-input" id="searchInput" 
             placeholder="例如：華萱、怡文、小顏..." 
             oninput="performSearch()" autocomplete="off">
      <div class="search-results" id="searchResults" style="display: none;"></div>
    </div>
    <button class="btn-print" onclick="window.print()">🖨️ 列印此查詢結果</button>
  </div>
  
  <div id="searchDetailContent"></div>
</div>

<script>
  const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwC9VRQpFQBl0D-awe9_C8FFWPp_Zy4-ngVrO_cw06TigEeL0oqhK_Nq_SwcEQp1pO0OQ/exec';
  
  // 嚴格限制的團隊範圍
  const ALLOWED_TEAMS = ['怡文'];
  
  let allOrders = [];
  let allReports = [];
  let maintenanceData = [];
  let productNameMap = {};
  
  // 用於儲存「僅屬於指定五個團隊」的人員名單與其所屬團隊
  let allowedPeopleMap = {}; // 格式: { "張三": "華萱", "李四": "怡文" }
  let teamAnalysisData = {};

  function showLoading(show) {
    document.getElementById('loadingOverlay').classList.toggle('show', show);
  }
  
  function updateSyncStatus(statusText, isLoading = false) {
    const syncStatus = document.getElementById('syncStatus');
    syncStatus.textContent = statusText;
    if (isLoading) {
      syncStatus.className = "sync-status loading-status";
    } else {
      syncStatus.className = "sync-status";
    }
  }

  function sortGroupCode(a, b) {
    const order = ['1A', '1B', '2A', '2B', '3A', '3B', '4A', '4B', '5A', '5B'];
    const indexA = order.indexOf(a);
    const indexB = order.indexOf(b);
    
    if (indexA !== -1 && indexB !== -1) return indexA - indexB;
    if (indexA !== -1) return -1;
    if (indexB !== -1) return 1;
    return a.localeCompare(b);
  }

  // 核心數據載入與初始化
  async function initData(silent = false) {
    if (!silent) showLoading(true);
    try {
      const [ordersRes, reportsRes, maintenanceRes] = await Promise.all([
        fetch(WEB_APP_URL + '?action=getOrders'),
        fetch(WEB_APP_URL + '?action=getReports'),
        fetch(WEB_APP_URL + '?action=getMaintenance')
      ]);
      
      const ordersResult = await ordersRes.json();
      const reportsResult = await reportsRes.json();
      const maintenanceResult = await maintenanceRes.json();
      
      if (!ordersResult.success || !reportsResult.success) {
        throw new Error('雲端資料讀取失敗');
      }
      
      allOrders = ordersResult.data;
      allReports = reportsResult.data;
      maintenanceData = maintenanceResult.success ? maintenanceResult.data : [];
      
      // 建立產品對照表
      allOrders.forEach(order => {
        const groupCode = order.組別代號 || order.組別;
        const productName = order['產品名稱( BOGO專用 )'] || groupCode;
        if (groupCode && !productNameMap[groupCode]) {
          productNameMap[groupCode] = productName;
        }
      });
      
      analyzeData();
      
      const now = new Date();
      updateSyncStatus(`● 已同步 ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`, false);
      
    } catch (error) {
      console.error(error);
      updateSyncStatus(`● 同步失敗，請重新整理`, true);
    } finally {
      if (!silent) showLoading(false);
    }
  }

  // 分析與歸戶邏輯 (加入嚴格團隊過濾)
  function analyzeData() {
    teamAnalysisData = {};
    allowedPeopleMap = {}; // 清空並重新計算
    
    // 建立原始姓名對團隊的對照表
    const rawNameToTeamMap = {};
    maintenanceData.forEach(item => {
      if (item.訂購名單 && item.團隊) {
        rawNameToTeamMap[item.訂購名單] = item.團隊;
      }
    });
    
    allReports.forEach(report => {
      if (report.搶購者 && report.團隊) {
        rawNameToTeamMap[report.搶購者] = report.團隊;
      }
    });

    // 輔助函式：檢查並回傳是否屬於允許的團隊
    function getMatchedAllowedTeam(personName, recordTeam) {
      let team = recordTeam || rawNameToTeamMap[personName] || '未分配';
      team = team.replace(/請維護\s*-*>\s*/g, '').trim();
      
      // 檢查是否包含在允許的五個團隊名稱內
      const matched = ALLOWED_TEAMS.find(t => team.includes(t));
      return matched || null; // 如果不在範圍內，回傳 null
    }

    // 1. 處理訂購單
    allOrders.forEach(order => {
      const name = order.LINE名稱.split('(代)')[0].trim();
      const matchedTeam = getMatchedAllowedTeam(name, order.團隊);
      
      // ❌ 如果不屬於指定團隊，直接跳過不處理
      if (!matchedTeam) return;

      allowedPeopleMap[name] = matchedTeam;

      const groupCode = order.組別代號 || order.組別 || '未分組';
      const productName = order['產品名稱( BOGO專用 )'] || groupCode;
      
      if (!teamAnalysisData[matchedTeam]) {
        teamAnalysisData[matchedTeam] = { orders: {}, reports: {} };
      }
      
      if (!teamAnalysisData[matchedTeam].orders[name]) {
        teamAnalysisData[matchedTeam].orders[name] = {};
      }
      
      if (!teamAnalysisData[matchedTeam].orders[name][groupCode]) {
        teamAnalysisData[matchedTeam].orders[name][groupCode] = {
          productName: productName,
          qty: 0,
          amount: 0,
          price: 0
        };
      }
      
      const qty = parseInt(order.訂購數量) || 0;
      const price = parseInt(order.單價) || 0;
      const amount = parseInt(order.合計) || (qty * price);
      
      teamAnalysisData[matchedTeam].orders[name][groupCode].qty += qty;
      teamAnalysisData[matchedTeam].orders[name][groupCode].amount += amount;
      teamAnalysisData[matchedTeam].orders[name][groupCode].price = price;
    });
    
    // 2. 處理搶購單
    allReports.forEach(report => {
      const buyer = report.搶購者;
      const matchedTeam = getMatchedAllowedTeam(buyer, report.團隊);
      
      // ❌ 如果不屬於指定團隊，直接跳過不處理
      if (!matchedTeam) return;

      allowedPeopleMap[buyer] = matchedTeam;
      
      const groupCode = report.組別代號 || '未分組';
      
      if (!teamAnalysisData[matchedTeam]) {
        teamAnalysisData[matchedTeam] = { orders: {}, reports: {} };
      }
      
      if (!teamAnalysisData[matchedTeam].reports[buyer]) {
        teamAnalysisData[matchedTeam].reports[buyer] = {};
      }
      
      if (!teamAnalysisData[matchedTeam].reports[buyer][groupCode]) {
        teamAnalysisData[matchedTeam].reports[buyer][groupCode] = {
          qty: 0,
          amount: 0,
          price: 0,
          buySend: report['買/送'] || ''
        };
      }
      
      const qty = parseInt(report.搶購組數) || 0;
      const price = parseInt(report.單價) || 0;
      const amount = qty * price;
      
      teamAnalysisData[matchedTeam].reports[buyer][groupCode].qty += qty;
      teamAnalysisData[matchedTeam].reports[buyer][groupCode].amount += amount;
      teamAnalysisData[matchedTeam].reports[buyer][groupCode].price = price;
    });
  }

  // 模糊搜尋 (僅針對過濾後的 allowedPeopleMap 進行搜尋)
  function performSearch() {
    const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
    const resultsDiv = document.getElementById('searchResults');
    const detailDiv = document.getElementById('searchDetailContent');
    
    if (keyword.length === 0) {
      resultsDiv.style.display = 'none';
      detailDiv.innerHTML = '';
      return;
    }
    
    // 只從允許的團隊名單中過濾符合的人
    const matchedPeople = Object.keys(allowedPeopleMap).filter(name => 
      name.toLowerCase().includes(keyword)
    );
    
    if (matchedPeople.length === 0) {
      resultsDiv.innerHTML = '<div class="search-result-item">找不到符合指定團隊的人員</div>';
      resultsDiv.style.display = 'block';
      detailDiv.innerHTML = '';
      return;
    }
    
    let html = '';
    matchedPeople.forEach(person => {
      const team = allowedPeopleMap[person];
      html += `
        <div class="search-result-item" onclick="showPersonDetail('${person}')">
          <span>${person}</span>
          <span class="result-team">${team}</span>
        </div>
      `;
    });
    
    resultsDiv.innerHTML = html;
    resultsDiv.style.display = 'block';
  }

  // 顯示個人明細
  function showPersonDetail(personName) {
    const detailDiv = document.getElementById('searchDetailContent');
    document.getElementById('searchResults').style.display = 'none';
    document.getElementById('searchInput').value = personName;
    
    // 獲取該人被分配的指定團隊
    const userTeam = allowedPeopleMap[personName];
    
    if (!userTeam) {
      detailDiv.innerHTML = '<div class="detail-container"><p style="text-align: center; color: #999; padding: 30px 0;">此人員不屬於指定團隊範圍，無法查詢。</p></div>';
      return;
    }
    
    let html = `<div class="detail-container">`;
    html += `
      <div class="detail-header">
        <span>👤 ${personName}</span>
        <span class="team-badge">所屬團隊：${userTeam}</span>
      </div>
    `;
    
    const data = teamAnalysisData[userTeam];
    let foundOrders = false;
    let foundReports = false;
    
    if (data) {
      // 1. 訂購清單
      if (data.orders[personName]) {
        foundOrders = true;
        const groups = data.orders[personName];
        
        html += `
          <div class="section-title">📦 訂購明細清單</div>
          <table class="person-table">
            <thead>
              <tr>
                <th>組別</th>
                <th>產品名稱</th>
                <th style="text-align: center;">數量</th>
                <th style="text-align: right;">單價</th>
                <th style="text-align: right;">金額</th>
              </tr>
            </thead>
            <tbody>
        `;
        
        let personTotal = { qty: 0, amount: 0 };
        const sortedGroupCodes = Object.keys(groups).sort(sortGroupCode);
        
        for (const groupCode of sortedGroupCodes) {
          const groupData = groups[groupCode];
          html += `
            <tr>
              <td><strong>${groupCode}</strong></td>
              <td>${groupData.productName}</td>
              <td style="text-align: center;">${groupData.qty}</td>
              <td style="text-align: right;">$${groupData.price.toLocaleString()}</td>
              <td style="text-align: right;">$${groupData.amount.toLocaleString()}</td>
            </tr>
          `;
          personTotal.qty += groupData.qty;
          personTotal.amount += groupData.amount;
        }
        
        html += `
            <tr class="total-row">
              <td colspan="2">訂購總計</td>
              <td style="text-align: center;">${personTotal.qty}</td>
              <td></td>
              <td style="text-align: right;">$${personTotal.amount.toLocaleString()}</td>
            </tr>
          </tbody>
        </table>
        `;
      }
      
      // 2. 搶購清單
      if (data.reports[personName]) {
        foundReports = true;
        const groups = data.reports[personName];
        
        html += `
          <div class="section-title report-title">🎯 搶購明細清單</div>
          <table class="person-table">
            <thead>
              <tr>
                <th>組別</th>
                <th>買/送</th>
                <th style="text-align: center;">數量</th>
                <th style="text-align: right;">單價</th>
                <th style="text-align: right;">金額</th>
              </tr>
            </thead>
            <tbody>
        `;
        
        let buyerTotal = { qty: 0, amount: 0 };
        const sortedGroupCodes = Object.keys(groups).sort(sortGroupCode);
        
        for (const groupCode of sortedGroupCodes) {
          const groupData = groups[groupCode];
          html += `
            <tr>
              <td><strong>${groupCode}</strong></td>
              <td>${groupData.buySend}</td>
              <td style="text-align: center;">${groupData.qty}</td>
              <td style="text-align: right;">$${groupData.price.toLocaleString()}</td>
              <td style="text-align: right;">$${groupData.amount.toLocaleString()}</td>
            </tr>
          `;
          buyerTotal.qty += groupData.qty;
          buyerTotal.amount += groupData.amount;
        }
        
        html += `
            <tr class="total-row">
              <td colspan="2">搶購總計</td>
              <td style="text-align: center;">${buyerTotal.qty}</td>
              <td></td>
              <td style="text-align: right;">$${buyerTotal.amount.toLocaleString()}</td>
            </tr>
          </tbody>
        </table>
        `;
      }
    }
    
    if (!foundOrders && !foundReports) {
      html += '<p style="text-align: center; color: #999; padding: 30px 0;">查無此人員的訂購或搶購資料</p>';
    }
    
    html += `</div>`;
    detailDiv.innerHTML = html;
  }
  
  // 初始化
  window.addEventListener('DOMContentLoaded', () => {
    initData();
    // 每 30 秒自動靜默同步一次最新雲端資料
    setInterval(() => initData(true), 30000);
  });
</script>
</body>
</html>
