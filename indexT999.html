<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>台灣帕金森病友權益促進會</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    :root{--main:#1d5f80;--dark:#0f3d54;--accent:#ffb02e;--bg:#f4f8fa;--line:#c9d6de;--ok:#167543;--bad:#b93227;--dock:120px}
    *{box-sizing:border-box}
    html{font-size:20px;scroll-padding-top:90px}
    body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:#18232b;line-height:1.75}
    a{color:var(--main)}
    button,input,select,textarea{font:inherit}
    button,a,input,select,textarea,summary{touch-action:manipulation}
    button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #e48400;outline-offset:3px}
    button{cursor:pointer}
    button:disabled{opacity:.55;cursor:wait}
    [hidden]{display:none!important}
    h1,h2,h3{line-height:1.4}
    h2{color:var(--dark);font-size:1.5rem;margin:4px 0 16px}
    h3{color:var(--dark);font-size:1.15rem;margin:24px 0 12px}
    .muted{color:#566975;font-size:.88rem}
    .pre{white-space:pre-wrap;overflow-wrap:anywhere}
    .card{background:#fff;border:2px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;min-width:0;overflow-wrap:anywhere}
    .card.feat{border:4px solid var(--accent)}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px;margin-bottom:14px}
    .cards .card{height:100%;margin:0}
    .cover{display:block;width:100%;height:180px;object-fit:cover;border-radius:10px;margin-bottom:12px}
    .detail-cover{width:100%;max-height:420px;object-fit:contain;border-radius:10px}
    .link{display:block;text-decoration:none;color:inherit;min-width:0}
    .link:hover .card{border-color:var(--main)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:8px 18px;border:0;border-radius:10px;background:var(--accent);color:#151515;font-weight:800;text-decoration:none;margin:6px 6px 6px 0}
    .btn.sec{background:var(--main);color:#fff}
    .btn.gh{background:#fff;border:2px solid var(--main);color:var(--dark)}
    .btn.ok{background:var(--ok);color:#fff}
    .btn.bad{background:var(--bad);color:#fff}
    .btn.red{background:#b3122d;color:#fff}
    .btn.sm{min-height:38px;padding:5px 12px;font-size:.86rem}
    .big-btn{min-height:68px;font-size:1.2rem;width:100%;margin:6px 0}
    label{display:block;font-weight:700;margin-top:12px}
    label.chk{font-weight:400;display:flex;gap:8px;align-items:flex-start;margin-top:12px;cursor:pointer;font-size:.92rem}
    label.chk input{margin-top:3px;flex:none}
    input,select,textarea{width:100%;min-height:46px;padding:9px 12px;border:2px solid #6b8fa3;border-radius:9px;background:#fff;color:#18232b;margin-top:4px}
    textarea{resize:vertical}
    input[type=checkbox]{width:24px;min-height:24px;margin:0 8px 0 0;vertical-align:middle;accent-color:var(--main)}
    .two{display:grid;grid-template-columns:1fr;gap:0 16px}
    .split{display:grid;grid-template-columns:1fr;gap:20px;align-items:start}
    .form{max-width:680px}
    .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
    .tag{display:inline-block;background:#e3eef5;color:var(--dark);padding:2px 10px;border-radius:12px;font-size:.8rem;font-weight:700}
    .tag.g{background:#d9f2e3;color:#125631}
    .tag.r{background:#fbdcd8;color:#83251c}
    .tag.y{background:#fff0c9;color:#705000}
    .notice{background:#fff7df;border:2px solid #e7bc4b;padding:12px 16px;border-radius:12px;margin-bottom:16px}
    .warn{background:#fdecea;border:2px solid #c0392b;padding:12px 16px;border-radius:12px;margin:14px 0}
    .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
    .chips a{border:2px solid var(--main);border-radius:24px;padding:6px 16px;text-decoration:none;background:#fff;font-weight:700}
    .chips a.on{background:var(--main);color:#fff}
    .hero{background:linear-gradient(135deg,var(--main),var(--dark));color:#fff;padding:22px 16px;border-radius:18px;text-align:center;margin-bottom:18px}
    .hero h1{font-size:1.5rem;margin:0}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
    .stat{background:#fff;border:2px solid var(--line);padding:14px 8px;border-radius:12px;text-align:center;font-size:.85rem}
    .stat b{display:block;font-size:1.65rem;color:var(--main)}
    .hd{display:flex;gap:8px;align-items:center;max-width:1180px;margin:auto;padding:10px 14px;flex-wrap:wrap}
    #pub header{background:var(--dark);color:#fff;position:sticky;top:0;z-index:20}
    .logo{color:#fff;text-decoration:none;font-weight:800;flex:1;line-height:1.4;min-width:150px}
    .tools{display:flex;gap:6px}
    .tools button{min-width:42px;min-height:42px;border:0;border-radius:8px;background:#ffffff24;color:#fff;font-weight:700}
    #meBtn{max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #nav{display:none;gap:4px;flex-wrap:wrap;width:100%}
    #nav a{color:#fff;text-decoration:none;font-weight:700;padding:6px 12px;border-radius:8px}
    #nav a.on{background:var(--main)}
    #drawer{padding:8px 14px;background:#fff}
    #drawer a{display:block;padding:10px 4px;border-bottom:1px solid var(--line);text-decoration:none;font-weight:700}
    #view{max-width:1120px;min-height:65vh;margin:auto;padding:20px 14px 24px;outline:none}
    #foot{background:var(--dark);color:#eef5fa;text-align:center;padding:24px 14px calc(var(--dock) + 24px);font-size:.86rem}
    #foot p{margin:.35em 0}
    #foot a{color:#fff}
    #foot .muted{color:#cfe0ea}
    #dock{position:fixed;left:0;right:0;bottom:0;z-index:30}
    #giveBar{background:#b3122d;color:#fff;display:flex;gap:8px;align-items:center;justify-content:center;padding:6px 10px;flex-wrap:wrap;font-weight:800}
    #giveBar a{background:#fff;color:#b3122d;border-radius:22px;padding:2px 16px;text-decoration:none;min-height:42px;display:inline-flex;align-items:center;font-size:1rem}
    #giveBar a.j{background:var(--accent);color:#151515}
    #giveBar a.m{background:transparent;color:#fff;border:2px solid #fff}
    #tabbar{background:#fff;border-top:2px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
    #tabbar a{flex:1;text-align:center;text-decoration:none;padding:4px 2px;font-size:.74rem;line-height:1.3;font-weight:700;min-height:48px}
    #tabbar a span{display:block;font-size:1.15rem}
    #tabbar a.on{background:#e3f0f6}
    #toast{position:fixed;bottom:calc(var(--dock) + 12px);left:50%;transform:translateX(-50%);background:#18232b;color:#fff;padding:12px 20px;border-radius:12px;z-index:250;width:max-content;max-width:92vw;font-size:.94rem;overflow-wrap:anywhere}
    #adm{display:flex;min-height:100vh;align-items:flex-start}
    #aside{width:220px;flex:none;background:var(--dark);color:#fff;padding:14px 10px;min-height:100vh;position:sticky;top:0}
    #aside h1{font-size:1rem;margin:4px 8px 18px}
    #aside a{display:flex;justify-content:space-between;color:#fff;text-decoration:none;padding:10px;border-radius:8px;font-weight:700}
    #aside a.on{background:var(--main)}
    #aapp{flex:1;min-width:0;padding:22px 18px;font-size:.94rem}
    .badge{background:var(--bad);color:#fff;font-size:.75rem;border-radius:12px;padding:0 8px}
    .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
    .bar input,.bar select{width:auto;flex:1;min-width:160px;margin:0}
    .bar .btn{margin:0}
    .tw{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
    table{border-collapse:collapse;width:100%;font-size:.84rem}
    th,td{padding:9px 10px;text-align:left;border-bottom:1px solid #e3eaef;vertical-align:top}
    th{background:#e8f0f5;white-space:nowrap}
    table.plain{font-size:1rem}
    table.plain th{white-space:normal;width:28%}
    td.act{min-width:180px}
    .clip{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .acards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
    .gate{text-align:center;padding:50px 14px}
    .overlay{position:fixed;inset:0;background:#0009;z-index:150;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:30px 12px}
    .modal{background:#fff;border-radius:16px;padding:22px;width:100%;max-width:700px;margin:auto 0}
    .modal h3{margin:0 0 12px}
    .modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
    .up-preview{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
    .up-preview img{height:70px;max-width:160px;object-fit:contain}
    #qrDialog .modal{text-align:center;max-width:350px}
    #qc{display:inline-block;padding:16px;background:#fff;margin:12px 0;max-width:100%}
    #qc img,#qc canvas{max-width:100%}
    #ck header{background:var(--dark);color:#fff;padding:14px;display:flex;justify-content:space-between;gap:14px}
    #ck header a{color:#fff}
    #ck main{max-width:580px;margin:auto;padding:18px 14px}
    #ck .wide{display:flex;width:100%;min-height:56px}
    .prog{display:flex;justify-content:space-around;text-align:center}
    .prog b{display:block;font-size:2rem;color:var(--main)}
    #ckResult{padding:20px;text-align:center;border-radius:14px;color:#fff}
    #ckResult.ok{background:var(--ok)}
    #ckResult.dup{background:#9a650a}
    #ckResult.err{background:var(--bad)}
    #ckResult strong{display:block;font-size:1.7rem}
    #ckHistory div{border-bottom:1px solid var(--line);padding:8px 4px}
    .skip{position:absolute;top:-80px;left:10px;background:#fff;padding:10px;z-index:300}
    .skip:focus{top:10px}
    details.card summary{font-weight:800;cursor:pointer;min-height:44px;display:flex;align-items:center}
    .big{font-size:1.5rem;letter-spacing:.06em;font-weight:800;overflow-wrap:anywhere}
    .love{font-size:2.4rem;font-weight:800;letter-spacing:.3em;color:#b3122d}
    .lovecard{background:linear-gradient(135deg,#d81e3f,#a8480f);color:#fff;border-radius:16px;padding:16px;max-width:380px;text-align:center;margin:10px 0}
    .lovecard .in{background:#fff;color:#222;border-radius:10px;padding:8px;margin:8px 0}
    .lovecard .love{font-size:1.9rem}
    .pbar{background:var(--line);border-radius:20px;height:16px;overflow:hidden}
    .pbar div{background:var(--accent);height:100%;width:0;transition:width .3s}
    .week h3{margin-top:0}
    .letter p,.letter li{font-size:1.05rem}
    .tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:#fff;border:3px solid var(--main);border-radius:16px;padding:16px 8px;min-height:130px;font-size:1.2rem;font-weight:800;text-decoration:none;text-align:center;color:var(--dark)}
    .tile span{font-size:2.6rem;line-height:1}
    .tile small{font-size:.8rem;font-weight:400;color:#566975;line-height:1.5}
    .tile:hover{background:#e3f0f6}
    .picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px;margin:14px 0}
    .pick{display:flex;align-items:center;gap:14px;text-align:left;background:#fff;border:3px solid var(--main);border-radius:16px;padding:14px 16px;min-height:88px;color:var(--dark);width:100%}
    .pick:hover{background:#e3f0f6}
    .pick .pi{font-size:2.6rem;line-height:1;flex:none}
    .pick b{display:block;font-size:1.25rem}
    .pick small{display:block;font-size:.84rem;font-weight:400;color:#566975;line-height:1.5}
    .pick.on{background:#e3f0f6;border-color:var(--accent)}
    .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;list-style:none;padding:0;margin:12px 0}
    .steps li{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center;font-weight:700}
    .steps li b{background:var(--main);color:#fff;border-radius:50%;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center}
    .steps li span{display:block;font-size:2.3rem;margin:4px 0}
    .give{background:linear-gradient(135deg,#fff3f4,#fff);border:4px solid #b3122d;text-align:center}
    .give h2{color:#b3122d;margin-top:0}
    body.hc{background:#000;color:#fff}
    body.hc a{color:#ffd400}
    body.hc h2,body.hc h3{color:#ffd400}
    body.hc .card,body.hc .stat,body.hc .modal,body.hc #drawer,body.hc #tabbar,body.hc .tw,body.hc .chips a{background:#111;color:#fff;border-color:#ffd400}
    body.hc .chips a.on{background:#ffd400;color:#000}
    body.hc .muted,body.hc .tile small,body.hc .pick small{color:#ddd}
    body.hc .btn,body.hc .btn.sec,body.hc .btn.red{background:#ffd400;color:#000}
    body.hc .btn.gh{background:#000;color:#ffd400;border:2px solid #ffd400}
    body.hc .btn.ok{background:#7CFC9A;color:#000}
    body.hc .btn.bad{background:#ff8a80;color:#000}
    body.hc input,body.hc select,body.hc textarea{background:#000;color:#fff;border-color:#ffd400}
    body.hc .notice,body.hc .warn{background:#222;color:#fff;border-color:#ffd400}
    body.hc .tag,body.hc .tag.g,body.hc .tag.r,body.hc .tag.y{background:#333;color:#ffd400;border:1px solid #ffd400}
    body.hc .hero{background:#111;border:3px solid #ffd400}
    body.hc #pub header,body.hc #foot,body.hc #ck header{background:#000;border-bottom:3px solid #ffd400}
    body.hc .logo,body.hc #nav a,body.hc #foot a{color:#ffd400}
    body.hc .tools button{background:#222;color:#ffd400;border:1px solid #ffd400}
    body.hc #nav a.on,body.hc #aside a.on,body.hc #tabbar a.on{background:#333}
    body.hc #aside{background:#000;border-right:2px solid #ffd400}
    body.hc th{background:#222;color:#ffd400}
    body.hc td,body.hc th{border-color:#555}
    body.hc .love{color:#ffd400}
    body.hc .lovecard{background:#111;border:2px solid #ffd400}
    body.hc .lovecard .in{background:#000;color:#fff}
    body.hc #giveBar{background:#000;color:#ffd400;border-top:3px solid #ffd400}
    body.hc #giveBar a{background:#ffd400;color:#000}
    body.hc #giveBar a.m{background:#000;color:#ffd400;border-color:#ffd400}
    body.hc .tile,body.hc .steps li,body.hc .pick{background:#111;color:#ffd400;border-color:#ffd400}
    body.hc .give{background:#111;border-color:#ffd400}
    body.hc .give h2{color:#ffd400}
    @media(min-width:900px){
      #nav{display:flex}
      #menuBtn{display:none}
      #drawer{display:none!important}
      #tabbar{display:none}
      #view{padding:28px 20px 24px}
      .two{grid-template-columns:1fr 1fr}
      .split{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
    }
    @media(max-width:899px){
      #pub header{position:static}
      .hd{padding:6px 10px;gap:6px}
      .tools button{min-width:40px;min-height:40px;padding:0 8px}
    }
    @media(max-width:800px){
      #adm{flex-direction:column}
      #aside{width:100%;min-height:0;position:static}
      #aside .side-links{display:flex;flex-wrap:wrap}
      #aside a{font-size:.86rem}
      #aapp{width:100%}
    }
    /* ===== 認識帕金森指南（.pk 命名空間，避免與主站樣式衝突）===== */
    .pk{--pg:#1b7a43;--po:#c04a00;--ps:#e8f5e9}
    .pk h2{font-size:1.5rem;margin:4px 0 8px}
    .pk h3{color:var(--pg);font-size:1.25rem;margin:4px 0 10px}
    .pk .pk-sub{font-size:.85rem;color:#555;margin:0 0 8px}
    .pk .pk-card{background:#fff;border:2px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px}
    .pk .pk-btn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-height:72px;margin:10px 0;padding:12px 18px;background:var(--ps);border:3px solid var(--pg);border-radius:14px;color:#18232b;font-weight:700}
    .pk .pk-btn:hover{background:var(--pg);color:#fff}
    .pk .pk-btn .ic{font-size:1.7em}
    .pk .pk-btn small{display:block;font-weight:400;font-size:.75em;opacity:.85}
    .pk .pk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}
    .pk .pk-grid .pk-btn{margin:0}
    .pk .pk-search{display:flex;gap:10px;flex-wrap:wrap}
    .pk .pk-search input{flex:1;min-width:200px;min-height:56px;margin:0}
    .pk .pk-search button{min-height:56px;padding:0 24px;background:var(--dark);color:#fff;border:0;border-radius:12px;font-weight:700}
    .pk .pk-result{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 16px;margin:10px 0;color:#18232b}
    .pk .pk-result:hover{border-color:var(--pg);background:var(--ps)}
    .pk .pk-result b{color:var(--pg)}
    .pk mark{background:#ffe082;padding:0 2px}
    .pk .tel{display:flex;gap:12px;align-items:center;padding:12px 16px;border:2px solid var(--line);border-radius:12px;margin:8px 0;background:#fffaf0}
    .pk .tel .n{font-size:1.5em;font-weight:700;color:var(--po);min-width:90px}
    .pk .pk-nav{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}
    .pk .pk-nav button{flex:1;min-width:140px;min-height:60px;border-radius:14px;font-weight:700;border:3px solid var(--pg);background:#fff;color:var(--pg)}
    .pk .pk-nav button.primary{background:var(--pg);color:#fff}
    .pk .pk-nav button:disabled{opacity:.35;cursor:not-allowed}
    .pk .crumb{font-size:.8rem;color:#555;margin-bottom:8px}
    .pk .pk-prog{height:16px;background:#dfe8e3;border-radius:10px;overflow:hidden;margin:8px 0}
    .pk .pk-prog div{height:100%;background:var(--pg);transition:width .3s}
    .pk .pk-steps{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
    .pk .pk-steps button{min-height:48px;padding:0 14px;border:2px solid var(--pg);background:#fff;color:var(--pg);border-radius:10px;font-weight:700;font-size:.8rem}
    .pk .pk-steps button.on{background:var(--pg);color:#fff}
    .pk ul.icons{list-style:none;padding:0;margin:12px 0}
    .pk ul.icons li{display:flex;gap:14px;align-items:flex-start;background:#fafafa;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
    .pk ul.icons .i{font-size:1.5em;line-height:1.4}
    .pk .box{border-radius:14px;padding:14px 18px;margin:18px 0}
    .pk .box .t{font-weight:700;margin-bottom:4px}
    .pk .note{background:var(--ps);border:3px solid var(--pg)}
    .pk .warn{background:#fff3cd;border:3px solid #d99a00;border-radius:14px;margin:18px 0}
    .pk .tip{background:#e3f2fd;border:3px solid #1976d2}
    .pk .quote{background:#fffaf0;border-left:8px solid var(--po);padding:10px 16px;border-radius:0 10px 10px 0}
    .pk table{margin:14px 0;font-size:.95rem}
    .pk th,.pk td{border:2px solid var(--line);padding:10px 12px}
    .pk th{background:#e0ece8}
    .pk .pk-tw{overflow-x:auto}
    .pk .pill{display:inline-block;background:var(--po);color:#fff;border-radius:30px;padding:0 14px;font-weight:700;margin:2px}
    .pk .part{font-weight:700;margin:18px 0 4px;color:var(--dark)}
    body.hc .pk .pk-card,body.hc .pk .pk-result,body.hc .pk ul.icons li,body.hc .pk .tel,body.hc .pk .pk-nav button,body.hc .pk .pk-steps button,body.hc .pk .pk-btn,body.hc .pk .quote{background:#111;color:#fff;border-color:#ffd400}
    body.hc .pk .note,body.hc .pk .warn,body.hc .pk .tip{background:#222;color:#fff;border-color:#ffd400}
    body.hc .pk .pk-steps button.on,body.hc .pk .pk-nav button.primary,body.hc .pk .pk-search button{background:#ffd400;color:#000}
    body.hc .pk h3,body.hc .pk .part,body.hc .pk .tel .n,body.hc .pk .pk-result b{color:#ffd400}
    body.hc .pk th{background:#222;color:#ffd400}
    body.hc .pk .crumb,body.hc .pk .pk-sub{color:#ddd}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
    @media print{
      #pub header,#dock,#foot,.noprint,#toast{display:none!important}
      body{background:#fff;color:#000}
      .card{border:1px solid #888}
    }
  </style>
</head>
<body>
  <a class="skip" href="#view">跳至主要內容</a>
  <div id="pub">
    <header>
      <div class="hd">

async function api(action,params={}) {
  if (!/^https:\/\//.test(API_URL)) throw new Error('請設定正確的 API_URL');
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(),90000);
  try {
    const response = await fetch(API_URL,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action,params,idToken}),
      signal:controller.signal
    });
    if (!response.ok) throw new Error('後端 HTTP 錯誤：' + response.status);
    let result;
    try { result = JSON.parse(await response.text()); }
    catch { throw new Error('後端未回傳 JSON，請確認 /exec 部署允許所有人存取'); }
    if (!result || typeof result.ok !== 'boolean') throw new Error('後端回應格式不正確');
    if (!result.ok) {
      if (result.code === 'AUTH_INVALID') {
        ME = null; idToken = null; drawNavigation();
        throw new Error('登入已過期，請再按一次「使用 LINE 登入」');
      }
      throw new Error(result.message || '後端處理失敗');
    }
    return result.data;
  } catch(e) {
    if (e.name === 'AbortError') throw new Error('請求逾時。寫入可能已成功，請先更新紀錄確認，不要立即重複送出');
    if (e instanceof TypeError) throw new Error('無法連線。若剛才正在送出資料，請先更新紀錄確認是否成功');
    throw e;
  } finally { clearTimeout(timer); }
}
async function initLiff() {

    ME = await api('login');
  } catch(e) {
    ME = null; idToken = null;
    console.error(e); toast(e.message);
  }
}

/* 後台文字寫法:空一行=新段落;「- 」開頭=項目符號;「## 」開頭=小標題 (逐行解析) */
function rich(t) {
  const out = []; let p = [], l = [];
  const fp = () => { if (p.length) { out.push('<p>' + p.map(esc).join('<br>') + '</p>'); p = []; } };
  const fl = () => { if (l.length) { out.push('<ul>' + l.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>'); l = []; } };
  String(t || '').split(/\r?\n/).forEach(line => {
    if (!line.trim()) { fp(); fl(); return; }
    if (/^## /.test(line)) { fp(); fl(); out.push('<h3>' + esc(line.slice(3)) + '</h3>'); return; }
    if (/^- /.test(line)) { fp(); l.push(line.slice(2)); return; }
    fl(); p.push(line);
  });
  fp(); fl();
  return out.join('');
}

}

function chkState() { try { return JSON.parse(localStorage.getItem('pd_chk')||'{}')||{}; } catch { return {}; } }
function applyChecklist(init) {
  const boxes = document.querySelectorAll('[data-chk]');
  if (!boxes.length) return;
  const st = chkState();
  let n = 0;
  boxes.forEach(b => { if (init) b.checked = !!st[b.dataset.chk]; if (b.checked) n++; });
  const bar = $('#pbarIn'), txt = $('#pbarTxt');
  if (bar) bar.style.width = (n/boxes.length*100)+'%';
  if (txt) txt.textContent = `已完成 ${n} / ${boxes.length} 項`;
}
function chkChanged(el) {
  const st = chkState();
  st[el.dataset.chk] = el.checked;
  try { localStorage.setItem('pd_chk',JSON.stringify(st)); } catch {}
  applyChecklist(false);
}

  {id:6,part:1,ic:'⏰',title:'用藥實戰智慧',sub:'時間、飲食與副作用管理',secs:[
   {h:'蛋白質會搶走藥效',b:'<p>左旋多巴和食物中的蛋白質，在腸道與血腦屏障要走同一條「胺基酸通道」。蛋白質太多，藥就吸收不好。</p>'+L([['🌙','<strong>建議：</strong>白天少量蛋白質、晚餐再補足。'],['🍚','服藥盡量與正餐間隔 30-60 分鐘。'],['⚠️','若需要特別限制蛋白質，請與醫師或營養師討論，避免營養不良。']])},
   {h:'「開關現象」與「藥效減退」',b:L([['🎚️','<strong>開關現象（On-Off）：</strong>藥效突然消失或突然恢復，症狀忽好忽壞。'],['📉','<strong>藥效減退（Wearing-off）：</strong>下一顆藥還沒到時間，症狀就提早出現。']])+'<p>這兩種情形在中、長期使用藥物時很常見，<strong>不是您做錯了什麼</strong>，醫師可以調整藥物來改善。</p>'},
   {h:'做好「開關日誌」',b:BOX('tip','💡','怎麼記錄？','<p>每天記下：<strong>吃藥時間、症狀好的時段、症狀差的時段、特別事件</strong>（如跌倒、吃了什麼）。</p><p>回診時給醫師看，是精準調藥的重要依據。</p>')+L([['⏰','設定手機鬧鐘或使用藥盒，避免漏藥。'],['📒','用紙本表格也可以，簡單最重要。']])+'<p><a href="#/newcomer/diary">👉 前往「症狀日誌」列印表格</a></p>'}
  ],notes:['蛋白質會與左旋多巴競爭吸收。','白天低蛋白、晚餐補足，並與服藥錯開。','「開關日誌」是回診最有用的工具。']},
  {id:7,part:2,ic:'🏃',title:'動起來',sub:'運動處方全解析',secs:[
   {h:'運動是良藥',b:'<p>規律運動，是帕金森病治療中「良藥」等級的方法。就算再忙、再累，也請每天動一動。</p>'+L([['🥋','<strong>太極拳：</strong>改善平衡與姿勢穩定，降低跌倒風險。'],['🔠','<strong>LSVT-BIG（大動作訓練）：</strong>刻意放大動作幅度，讓日常動作更流暢。'],['📢','<strong>LSVT-LOUD（大聲說話訓練）：</strong>改善聲音太小、口齒不清。'],['🚶','<strong>雙杖健走：</strong>提供視覺與節奏提示，自然放大步伐。']])},
   {h:'運動小提醒',b:L([['👫','盡量有人陪伴，或在安全的環境下進行。'],['🪑','平衡不好時，扶著穩固的桌椅練習。'],['⏱️','從每天 10-15 分鐘開始，慢慢增加。'],['💊','最好在藥效較好的時段運動。']])},
   {h:'凍結步態怎麼辦？',b:'<p>「凍結步態」是走到一半或剛要起步時，腳像黏在地上。以下「提示技巧」很有用：</p>'+L([['👀','<strong>視覺提示：</strong>在地上貼橫向膠帶，當成要跨越的線。'],['🎵','<strong>聽覺提示：</strong>跟著口令「1、2、1、2」或固定節拍的音樂走。'],['⚖️','先把重心移到一腳，再大步跨出。'],['🛑','不要急著拉扯或催促，給對方幾秒鐘。']])},
   {h:'居家防跌',b:L([['💡','走道與廁所裝夜燈。'],['🚿','浴室鋪防滑墊，並裝扶手。'],['🧶','移除地毯、電線等絆腳物。'],['👟','穿防滑、合腳的鞋子，不穿拖鞋。']])+NOTE(['每天規律運動。','善用視覺、聽覺提示對抗凍結步態。','居家環境整理是最便宜的防跌方法。'])}
  ],notes:['規律運動是治療的重要一環。','提示技巧可改善凍結步態。']},
  {id:8,part:2,ic:'⚡',title:'手術治療選項',sub:'當藥物不再夠用',secs:[
   {h:'DBS 是什麼？',b:'<p>「深腦刺激術（DBS）」是在大腦特定位置植入細小電極，以電流訊號調節異常的神經迴路，改善顫抖、僵硬等症狀。</p><p>它<strong>不是根治</strong>，也不會停止疾病進展，但可以讓藥量減少、症狀波動減輕。</p>'},
   {h:'誰適合？',b:L([['✅','藥物效果有限，或副作用難以忍受。'],['✅','對左旋多巴仍有良好反應。'],['✅','沒有嚴重失智或精神問題。'],['🩺','是否適合，需由神經內科與神經外科團隊評估。']])},
   {h:'健保給付',b:'<p>台灣健保自<strong>民國 111 年 6 月</strong>起，已將 DBS 整套醫材（含立體定位套組）完整納入給付範圍，大幅減輕經濟負擔。</p><p>詳細條件請向醫院的個案管理師詢問。</p>'}
  ],notes:['DBS 適合藥物效果受限或副作用大的病友。','健保自 111 年 6 月起完整給付。','是否適合由醫療團隊評估。']},
  {id:9,part:2,ic:'🥗',title:'吃出穩定',sub:'營養與飲食管理指南',secs:[
   {h:'便秘管理三大原則',b:L([['🥦','<strong>多吃纖維：</strong>每天 5 份以上蔬菜水果。'],['💧','<strong>多喝水：</strong>每天 1500-2000cc（腎臟或心臟疾病者請先問醫師）。'],['🥛','<strong>吃發酵食品：</strong>如優格、味噌，補充益生菌。']])},
   {h:'吞嚥與進食安全',b:L([['🪑','坐直吃飯，頭微微向前低。'],['🥄','小口慢慢吃，吃完再吃下一口。'],['🍲','食物切小、煮軟，必要時使用增稠劑。'],['⚠️','常嗆咳、吃飯很久，請告訴醫師，安排吞嚥評估。']])},
   {h:'飲食與用藥配合',b:'<p>飲食不要和服藥分開計畫。建議與醫師、營養師一起安排「何時吃藥、何時吃蛋白質、何時補水」。</p>'+NOTE(['便秘要靠水分、纖維與運動一起處理。','吞嚥困難要及早評估。','飲食與服藥時間要互相配合。'])}
  ],notes:['便秘是常見的自律神經症狀。','吞嚥困難不要拖。']},
  {id:10,part:3,ic:'💙',title:'走過診斷後的哀傷期',sub:'情緒是需要被照顧的',secs:[
   {h:'哀傷的五個階段',b:'<p>確診後，很多人會經歷：</p><p><span class="pill">1 否認</span><span class="pill">2 憤怒</span><span class="pill">3 討價還價</span><span class="pill">4 憂鬱</span><span class="pill">5 接受</span></p><p>順序不一定，也可能來回。<strong>允許自己悲傷，是療癒的第一步。</strong></p>'},
   {h:'憂鬱是疾病的一部分',b:'<p>帕金森病的憂鬱有神經生理的基礎，確診前後約 2 年是高風險期。這<strong>不是意志力薄弱</strong>。</p>'+L([['💬','常用且與帕金森藥物交互作用較低的抗憂鬱藥有 SSRI、Mirtazapine、Bupropion 等，實際用藥請由醫師評估。'],['🧘','運動、曬太陽、固定作息、與朋友往來，都有幫助。']])},
   {h:'需要立刻求助的情況',b:BOX('warn','🆘','請馬上告訴醫師或家人','<p>若持續情緒低落、失眠、不想吃東西，或有<strong>傷害自己的念頭</strong>，請立即求助。</p><p>安心專線：<strong>1925</strong>（24 小時免付費）。</p>')}
  ],notes:['憂鬱是疾病常見的一部分，可以治療。','不要獨自承受，勇敢求助。']},
  {id:11,part:3,ic:'👨‍👩‍👧',title:'與家人重新對話',sub:'好好說話，就是最好的支持',secs:[
   {h:'用「我訊息」說話',b:L([['✅','<strong>我訊息：</strong>「我需要感覺自己還能做一些事。」'],['❌','<strong>你訊息：</strong>「你每次都不讓我做事！」']])+'<p>「我訊息」說的是自己的感受與需要，比較不會讓對方感到被指責。</p>'},
   {h:'溝通小技巧',b:L([['🐢','放慢速度，給病友多一點回應時間。'],['📌','一次只講一件事，指令簡單明確。'],['👀','面對面、看著眼睛說話。'],['🔊','病友聲音小時，請溫和地請對方再說一次，不要不耐煩。']])},
   {h:'家庭會議',b:'<p>每週或每月開一次家庭會議，一起討論照顧分工、下次回診、遇到的困難。</p>'+L([['📅','固定時間，例如每週日晚餐後。'],['🗒️','輪流發言、記錄決議。'],['💬','先說感謝，再說困難。']])}
  ],notes:['說話放慢、簡化、面對面。','定期家庭會議可分散照顧責任、預防衝突。']},
  {id:12,part:4,ic:'🌸',title:'照顧者的自我照顧',sub:'照顧別人，也要照顧自己',secs:[
   {h:'照顧是一場馬拉松',b:'<p>照顧帕金森病友是長期的路，累了就要休息。您照顧好自己，才有力氣照顧家人。</p>'+L([['😮‍💨','覺得累、煩、生氣，都是正常的，不是不愛對方。'],['😴','維持自己的睡眠、飲食與健康檢查。'],['☕','每天為自己留一點屬於自己的時間。']])},
   {h:'申請喘息服務',b:'<p>撥打長照專線 <span class="pill">1966</span>，可申請居家或機構的「喘息服務」，讓您暫時休息。</p>'},
   {h:'給自己「足夠好」的許可',b:'<p>不需要完美。「足夠好」的照顧者，就是最好的照顧者。</p>'+NOTE(['長照專線 1966 是喘息服務的入口。','允許自己「足夠好」而不是「完美」。'])}
  ],notes:['照顧者的健康同樣重要。','善用喘息服務與各種資源。']},
  {id:13,part:4,ic:'🕊️',title:'放手的藝術',sub:'尊重、尊嚴與自主',secs:[
   {h:'照顧不等於代勞',b:'<p>在安全的前提下，鼓勵病友自己完成力所能及的事，能保有尊嚴與自信，也減輕照顧者的負擔。</p>'},
   {h:'實際做法',b:L([['⏱️','多給一點時間，讓病友自己慢慢穿衣、吃飯。'],['🛠️','善用輔具：防滑墊、扶手、加粗握把餐具、穿鞋輔助器。'],['🙋','主動請家人、朋友與專業人員幫忙，不必獨自承擔。']])},
   {h:'平衡安全與自主',b:NOTE(['「適度放手」是尊重，不是不關心。','在安全與自主之間取得平衡，是長期照顧的核心。','遇到不確定的情況，請與醫療團隊討論。'])}
  ],notes:['適度放手是一種愛。']},
  {id:14,part:5,ic:'📍',title:'台灣在地資源總整理',sub:'需要時，知道可以找誰',secs:[
   {h:'常用電話',b:'<div class="tel"><span class="n">1966</span>長照專線：居家照顧、日間照顧、喘息服務、輔具</div><div class="tel"><span class="n">1925</span>安心專線：24 小時心理支持</div><div class="tel"><span class="n">119</span>緊急救護：跌倒受傷、嚴重嗆咳、意識不清</div>'},
   {h:'醫療與病友資源',b:L([['🏥','<strong>動作障礙門診：</strong>建議到有神經內科動作障礙專科的醫學中心或區域醫院。'],['👫','<strong>病友團體：</strong>各地醫院與病友協會常舉辦聯誼、運動與衛教活動，可向就診醫院洽詢。'],['🧑‍⚕️','<strong>個案管理師：</strong>可協助 DBS、衛教與資源轉介。']])+'<p><a href="#/events">👉 看本會近期活動</a>　<a href="#/forum">👉 病友論壇</a></p>'},
   {h:'溫馨聲明',b:BOX('warn','⚠️','請注意','<p>本指南僅供衛教參考，<strong>不能取代醫師的診斷與治療</strong>。用藥或飲食調整前，請先與您的醫療團隊討論。</p>')}
  ],notes:['長照 1966、安心 1925、緊急 119。','本指南不能取代醫師建議。']}
  ];
  var GUIDE={
   'new':{t:'我剛確診',ic:'🌱',d:'先從基礎開始',p:[1,2,3,5,10]},
   pat:{t:'我是病友',ic:'🧓',d:'日常生活怎麼過',p:[6,7,9,10,11]},
   fam:{t:'我是家屬／照顧者',ic:'👨‍👩‍👧',d:'怎麼幫忙、怎麼休息',p:[4,11,12,13,14]}
  };
  var PROBLEMS=[['🤲','手抖、走路不穩、容易跌倒',7],['🚽','便秘、吞嚥不順',9],['⏰','吃藥時間、藥效忽好忽壞',6],['😔','心情不好、不想做事',10],['😮‍💨','照顧得好累',12],['💊','想知道藥物與副作用',5],['⚡','聽說可以開刀（DBS）',8],['📞','需要電話與資源',14]];

  var rx=function(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')};
  var txt=function(h){var d=document.createElement('div');d.innerHTML=h;return d.textContent};
  var cname=function(c){return '第'+c.id+'章 '+c.title};
  var homeBtn='<div class="pk-nav"><button type="button" onclick="pkGo(\'home\')">🏠 回指南首頁</button></div>';

  function home(){
    var h='<div class="pk"><div class="pk-card"><h2>🧠 認識帕金森：病友與家屬的實用生活指南</h2><p class="pk-sub">不用從頭讀到尾，請依您的需要，點選下面的按鈕。</p></div>';
    h+='<div class="notice">本指南僅供衛教參考，不能取代醫師的診斷與治療。用藥或飲食調整前，請先與您的醫療團隊討論。<div class="muted">'+esc(org().review||'醫療審閱資訊將於顧問醫師確認後標示。')+'</div></div>';
    h+='<div class="pk-card"><h3>🔎 第一步：想找什麼？直接搜尋</h3><div class="pk-search"><input id="pkq" type="search" aria-label="搜尋指南" placeholder="例如：便秘、跌倒、藥、1966" onkeydown="if(event.key===\'Enter\')pkSearch()"><button type="button" onclick="pkSearch()">搜尋</button></div></div>';
    h+='<div class="pk-card"><h3>👤 第二步：請問您是？</h3><div class="pk-grid">';
    Object.keys(GUIDE).forEach(function(k){var g=GUIDE[k];h+='<button type="button" class="pk-btn" onclick="pkGo(\'path/'+k+'\')"><span class="ic">'+g.ic+'</span><span>'+g.t+'<small>'+g.d+'</small></span></button>'});
    h+='</div></div><div class="pk-card"><h3>❓ 我現在遇到…</h3><div class="pk-grid">';
    PROBLEMS.forEach(function(p){h+='<button type="button" class="pk-btn" onclick="pkGo(\'c'+p[2]+'/0\')"><span class="ic">'+p[0]+'</span><span>'+p[1]+'</span></button>'});
    h+='</div></div><div class="pk-card"><h3>📞 常用電話</h3><div class="tel"><span class="n">1966</span>長照專線（喘息、居家照顧）</div><div class="tel"><span class="n">1925</span>安心專線（24 小時心理支持）</div><div class="tel"><span class="n">119</span>緊急救護</div></div>';
    h+='<div class="pk-card"><h3>📚 全部章節</h3>';
    PARTS.forEach(function(p,i){h+='<div class="part">'+p+'</div>';C.filter(function(c){return c.part===i}).forEach(function(c){h+='<button type="button" class="pk-btn" onclick="pkGo(\'c'+c.id+'/0\')"><span class="ic">'+c.ic+'</span><span>'+cname(c)+'<small>'+c.sub+'</small></span></button>'})});
    return h+'</div></div>';
  }
  function path(k){
    var g=GUIDE[k];if(!g)return home();
    var h='<div class="pk"><div class="pk-card"><div class="crumb"><a href="#/learn">認識帕金森</a> › 閱讀建議</div><h2>'+g.ic+' '+g.t+'</h2><p>建議您依照順序閱讀，每章只要幾分鐘。</p>';
    g.p.forEach(function(id,i){var c=C[id-1];h+='<button type="button" class="pk-btn" onclick="pkGo(\'c'+id+'/0\')"><span class="ic">'+(i+1)+'</span><span>'+cname(c)+'<small>'+c.sub+'</small></span></button>'});
    return h+homeBtn+'</div></div>';
  }
  function chapter(id,i){
    var c=C[id-1];if(!c)return home();
    var n=c.secs.length+1;
    i=Math.max(0,Math.min(n-1,i||0));
    var h='<div class="pk"><div class="pk-card"><div class="crumb"><a href="#/learn">認識帕金森</a> › '+PARTS[c.part]+' › 第'+c.id+'章</div>';
    h+='<h2>'+c.ic+' '+cname(c)+'</h2><p class="pk-sub">'+c.sub+'</p>';
    h+='<p><strong>第 '+(i+1)+' 段／共 '+n+' 段</strong></p><div class="pk-prog" aria-hidden="true"><div style="width:'+((i+1)/n*100)+'%"></div></div><div class="pk-steps">';
    c.secs.forEach(function(s,j){h+='<button type="button" class="'+(j===i?'on':'')+'" onclick="pkGo(\'c'+id+'/'+j+'\')">'+(j+1)+'. '+s.h+'</button>'});
    h+='<button type="button" class="'+(i===n-1?'on':'')+'" onclick="pkGo(\'c'+id+'/'+(n-1)+'\')">📝 重點整理</button></div></div><div class="pk-card">';
    if(i<c.secs.length)h+='<h3>'+(i+1)+'. '+c.secs[i].h+'</h3>'+c.secs[i].b;
    else h+='<h3>📝 本章重點整理</h3>'+NOTE(c.notes)+'<p>讀完了！您可以繼續看下一章，或回指南首頁選其他主題。</p>';
    h+='<div class="pk-nav"><button type="button" '+(i===0?'disabled':'')+' onclick="pkGo(\'c'+id+'/'+(i-1)+'\')">⬅️ 上一段</button>';
    if(i<n-1)h+='<button type="button" class="primary" onclick="pkGo(\'c'+id+'/'+(i+1)+'\')">下一段 ➡️</button>';
    else if(id<C.length)h+='<button type="button" class="primary" onclick="pkGo(\'c'+(id+1)+'/0\')">下一章 ➡️</button>';
    else h+='<button type="button" class="primary" onclick="pkGo(\'home\')">🏠 回指南首頁</button>';
    return h+'</div><div class="pk-nav"><button type="button" onclick="pkGo(\'home\')">🏠 指南首頁</button><button type="button" onclick="pkGo(\'c'+id+'/0\')">↩️ 本章重頭看</button></div></div></div>';
  }
  function search(q){
    q=String(q||'').trim();
    if(!q)return home();
    var re=new RegExp(rx(q),'gi'),res=[];
    C.forEach(function(c){c.secs.forEach(function(s,j){
      var all=s.h+' '+txt(s.b),m=all.search(re);
      if(m>=0){
        var st=Math.max(0,m-25),sn=esc(all.substr(st,90)).replace(new RegExp(rx(esc(q)),'gi'),function(x){return '<mark>'+x+'</mark>'});
        res.push('<button type="button" class="pk-result" onclick="pkGo(\'c'+c.id+'/'+j+'\')"><b>'+c.ic+' '+cname(c)+' › '+s.h+'</b><br>'+(st>0?'…':'')+sn+'…</button>');
      }
    })});
    return '<div class="pk"><div class="pk-card"><div class="crumb"><a href="#/learn">認識帕金森</a> › 搜尋</div><h2>🔎 搜尋結果</h2><div class="pk-search"><input id="pkq" type="search" aria-label="搜尋指南" value="'+esc(q)+'" onkeydown="if(event.key===\'Enter\')pkSearch()"><button type="button" onclick="pkSearch()">搜尋</button></div><p>找到 <strong>'+res.length+'</strong> 個與「'+esc(q)+'」相關的段落：</p>'+(res.join('')||'<p>找不到相關內容，請換個說法，例如「藥」「運動」「便秘」。</p>')+homeBtn+'</div></div>';
  }
  return function(a,b){
    if(!a)return home();
    var m=a.match(/^c(\d+)$/);
    if(m)return chapter(+m[1],parseInt(b,10)||0);
    if(a==='path')return path(b);
    if(a==='s')return search(b);
    return home();
  };
})();

function editFieldHtml(f,row) {
  const id='edit_'+f.key,v=row[f.key]??'';
  if(f.type==='textarea')return `<label for="${id}">${esc(f.label)}</label><textarea id="${id}" data-field="${f.key}" rows="${f.key==='content'?10:5}" maxlength="20000">${esc(v)}</textarea>`;
  if(f.type==='select')return `<label for="${id}">${esc(f.label)}</label><select id="${id}" data-field="${f.key}">${options(f.choices,v)}</select>`;
  if(f.type==='checkbox')return `<label><input id="${id}" data-field="${f.key}" type="checkbox" ${yes(v)?'checked':''}>${esc(f.label)}</label>`;
  if(['image','pdf','urlpdf'].includes(f.type)){
    const accept=f.type==='image'?'image/jpeg,image/png,image/webp':'application/pdf';
    return `<label for="${id}">${esc(f.label)}</label>${
      f.type==='urlpdf'?`<input id="${id}" data-field="${f.key}" type="url" value="${esc(v)}" placeholder="https://…">`:''
    }<input id="file_${f.key}" type="file" accept="${accept}" data-upload="${f.key}">
    <div class="muted" id="uploadStatus_${f.key}">${v?'已有檔案／連結':''}</div>
    <div class="up-preview" id="preview_${f.key}">${f.type==='image'&&v?`<img src="${esc(imageUrl(v))}" alt="封面預覽">`:''}
    ${v?btn('remove-upload','移除','btn gh sm',{field:f.key}):''}</div>`;
  }
  const extra=f.key===cfgFirstKey()?'required maxlength="200"':f.type==='number'?'min="1" step="1"':'';
  return `<label for="${id}">${esc(f.label)}</label><input id="${id}" data-field="${f.key}" type="${f.type}" value="${esc(f.type==='date'?fmtD(v):v)}" ${extra}>`;
}

  if(!isImage)return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve({base64:String(r.result).split(',')[1],mime:'application/pdf',name:file.name});
    r.onerror=()=>reject(new Error('無法讀取檔案'));
    r.readAsDataURL(file);
  });
  const url=URL.createObjectURL(file);
  try {
    const im=await new Promise((resolve,reject)=>{
      const x=new Image();x.onload=()=>resolve(x);x.onerror=()=>reject(new Error('無法讀取圖片'));x.src=url;
    });
    if(!im.width||!im.height||im.width*im.height>60000000)throw new Error('圖片尺寸過大或無效');
    const scale=Math.min(1,1600/Math.max(im.width,im.height));
    const cv=document.createElement('canvas');
    cv.width=Math.max(1,Math.round(im.width*scale));cv.height=Math.max(1,Math.round(im.height*scale));
    const ctx=cv.getContext('2d');
    ctx.fillStyle='#ffffff';ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(im,0,0,cv.width,cv.height);
    return {base64:cv.toDataURL('image/jpeg',.85).split(',')[1],mime:'image/jpeg',name:file.name.replace(/\.[^.]+$/,'')+'.jpg'};
  } finally {URL.revokeObjectURL(url);}
}
async function uploadFile(el) {
  const state=modalState,file=el.files?.[0];
  if(!state||!file)return;
  if(state.uploading||state.saving)throw new Error('請等待目前操作完成');
  const cfg=ADMIN_CONFIG[state.sheet],f=cfg.fields.find(x=>x.key===el.dataset.upload);
  if(!f)throw new Error('上傳欄位不正確');
  const isImage=f.type==='image',allowed=isImage?['image/jpeg','image/png','image/webp']:['application/pdf'];
  if(!allowed.includes(file.type))throw new Error(isImage?'只支援 JPG／PNG／WebP':'只支援 PDF');
  if(file.size>(isImage?20:8)*1024*1024)throw new Error(isImage?'原圖不可超過 20MB':'PDF 不可超過 8MB');
  state.uploading=true;
  $('#modalSave').disabled=true;
  $('#modalContent').querySelectorAll('[data-upload]').forEach(x=>x.disabled=true);
  const status=$('#uploadStatus_'+f.key);
  status.textContent='上傳中…';
  try {
    const data=await readFile(file,isImage);
    const result=await api('admin_uploadFile',{folder:cfg.folder,...data});
    state.row[f.key]=isImage?result.id:result.url;
    if(modalState!==state)return;
    status.textContent='✅ 已上傳：'+data.name;
    if(f.type==='urlpdf')$('#edit_'+f.key).value=result.url;
    $('#preview_'+f.key).innerHTML=(isImage?`<img src="${esc(imageUrl(result.id))}" alt="封面預覽">`:'')+
      btn('remove-upload','移除','btn gh sm',{field:f.key});
  } catch(e) {if(status.isConnected)status.textContent='❌ 上傳失敗';throw e;}
  finally {
    state.uploading=false;
    if(modalState===state){
      $('#modalSave').disabled=false;
      $('#modalContent').querySelectorAll('[data-upload]').forEach(x=>x.disabled=false);
    }
    el.value='';
  }
}
function exportCsv() {
  const rows=filteredRows().map(x=>x.r);
  const cell=(v,text=false)=>{
    let s=String(v??'');
    if(text||/^[\s\u0000-\u001f]*[=+\-@]/.test(s))s="'"+s;
    return '"'+s.replace(/"/g,'""')+'"';
  };
  const head=['報名時間','活動','姓名','電話','同行人數','備註','狀態'];
  const lines=[head.map(x=>cell(x)).join(','),...rows.map(r=>[
    cell(r.createdAt),cell(r.eventTitle),cell(r.name),cell(r.phone,true),cell(r.companions),cell(r.note),cell(r.status)
  ].join(','))];
  const url=URL.createObjectURL(new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a');a.href=url;a.download='報名名單_'+todayTW()+'.csv';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast(`已匯出 ${rows.length} 筆；請妥善保管個資。電話匯入時請指定文字格式`);
}

/* ===== QR 與相機 ===== */
async function showQR(id) {
  const d=await api('getCheckinCode',{id});
  if(typeof window.QRCode!=='function')throw new Error('QR 元件載入失敗，請重新整理');
  $('#qrTitle').textContent=d.title||'活動簽到';
  $('#qrInfo').textContent=`${d.name}　共 ${d.people} 人${d.status==='已出席'?'（已出席）':''}`;
  $('#qc').replaceChildren();
  new window.QRCode($('#qc'),{text:d.code,width:230,height:230,correctLevel:QRCode.CorrectLevel.M});
  $('#qrDialog').hidden=false;
  $('#qrDialog button').focus();
}
let ckEvent='',scanner=null,scannerRunning=false,cameraQueue=Promise.resolve(),qrLibPromise=null;
let ckBusy=false,ckSeq=0,lastCode='',lastAt=0,audioContext=null;
function queueCamera(fn) {
  cameraQueue=cameraQueue.catch(()=>{}).then(fn);
  return cameraQueue;
}
function loadScannerLib() {
  if(window.Html5Qrcode)return Promise.resolve();
  if(qrLibPromise)return qrLibPromise;
  qrLibPromise=new Promise((resolve,reject)=>{
    const script=document.createElement('script');
    script.src='https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
    script.crossOrigin='anonymous';
    script.onload=()=>window.Html5Qrcode?resolve():reject(new Error('掃描元件無法初始化'));
    script.onerror=()=>reject(new Error('掃描元件載入失敗'));
    document.head.appendChild(script);
  }).catch(e=>{qrLibPromise=null;throw e;});
  return qrLibPromise;
}
async function stopCameraNow() {
  const current=scanner;scanner=null;
  if(current){
    try {if(scannerRunning)await current.stop();}
    catch(e){console.warn(e);}
    finally {try {current.clear();} catch {}}
  }
  scannerRunning=false;
  $('#cameraBtn').textContent='📷 開啟相機掃描';
}
function stopCamera(){return queueCamera(stopCameraNow);}
function toggleCamera() {
  return queueCamera(async()=>{
    if(scanner)return stopCameraNow();
    if($('#ck').hidden||!ckEvent)throw new Error('請先選擇活動');
    if(!window.isSecureContext)throw new Error('相機需要 HTTPS');
    await loadScannerLib();
    if($('#ck').hidden)return;
    const current=new Html5Qrcode('ckReader');
    scanner=current;
    try {
      await current.start({facingMode:'environment'},{
        fps:8,qrbox:(w,h)=>({width:Math.min(230,w-30,h-30),height:Math.min(230,w-30,h-30)})
      },code=>safely(()=>submitCheckin(code)));
      scannerRunning=true;
      if($('#ck').hidden){await stopCameraNow();return;}
      $('#cameraBtn').textContent='⏹ 關閉相機';
    } catch(e) {
      await stopCameraNow();
      throw new Error('無法開啟相機，請確認瀏覽器相機權限；也可使用手動報到碼');
    }
  });
}
function beep(ok) {
  try {
    const C=window.AudioContext||window.webkitAudioContext;
    if(!C)return;
    audioContext ||= new C();
    const o=audioContext.createOscillator(),g=audioContext.createGain();
    g.gain.value=.06;o.frequency.value=ok?880:220;
    o.connect(g);g.connect(audioContext.destination);o.start();
    o.stop(audioContext.currentTime+(ok?.12:.28));
    o.onended=()=>{o.disconnect();g.disconnect();};
    audioContext.resume().catch(()=>{});
  } catch {}
  try {navigator.vibrate?.(ok?80:[160,80,160]);}catch{}
}
async function refreshCheckin() {
  const seq=++ckSeq,list=await api('admin_checkinEvents');
  if(seq!==ckSeq||$('#ck').hidden)return;
  if(!list.some(e=>e.id===ckEvent))ckEvent=list[0]?.id||'';
  const sel=$('#ckEvent');sel.replaceChildren();
  if(!list.length)sel.add(new Option('目前沒有可簽到活動（活動日前後 1 天內才可簽到）',''));
  list.forEach(e=>sel.add(new Option(fmtD(e.date)+'　'+e.title,e.id)));
  sel.value=ckEvent;sel.disabled=!list.length||ckBusy;
  const e=list.find(x=>x.id===ckEvent);
  $('#ckArrived').textContent=e?.arrived??0;$('#ckTotal').textContent=e?.total??0;
  $('#cameraBtn').disabled=!list.length||busy.has('camera');
}
async function submitCheckin(raw) {
  const code=String(raw||'').trim();
  if(!code||ckBusy||$('#ck').hidden)return;
  if(!ckEvent)throw new Error('請先選擇活動');
  if(code===lastCode&&Date.now()-lastAt<4000)return;
  const eventId=ckEvent;
  ckBusy=true;$('#ckEvent').disabled=true;lastCode=code;lastAt=Date.now();
  try {
    const d=await api('admin_checkin',{code,eventId});
    if($('#ck').hidden)return;
    beep(!d.already);
    const box=$('#ckResult');box.hidden=false;box.className=d.already?'dup':'ok';
    box.innerHTML=`<div>${d.already?'⚠️ 已經簽到':'✅ 簽到成功'}</div><strong>${esc(d.name)}</strong><div>共 ${num(d.people)} 人</div>${d.note?'<div class="pre">'+esc(d.note)+'</div>':''}`;
    if(!d.already){
      const history=$('#ckHistory');if(history.textContent==='尚無')history.replaceChildren();
      const row=document.createElement('div');
      row.textContent=new Intl.DateTimeFormat('zh-TW',{hour:'2-digit',minute:'2-digit'}).format(new Date())+'　'+d.name+'（'+d.people+' 人）';
      history.prepend(row);
      while(history.children.length>30)history.lastElementChild.remove();
    }
    await refreshCheckin();
  } catch(e) {
    lastCode='';beep(false);
    if(!$('#ck').hidden){
      $('#ckResult').hidden=false;$('#ckResult').className='err';$('#ckResult').textContent='❌ '+e.message;
    }
  } finally {
    ckBusy=false;
    $('#ckEvent').disabled=!ckEvent;
  }
}

/* ===== 表單送出 ===== */
document.addEventListener('submit',event=>{
  const form=event.target;
  if(!(form instanceof HTMLFormElement))return;
  event.preventDefault();
  if(!form.reportValidity())return;
  const button=form.querySelector('button[type=submit]');
  safely(()=>once(form.id,button,async()=>{
    if(form.id==='registerForm'){
      if(!requireLogin())return;
      const companions=Number(value('rComp'));
      if(!Number.isInteger(companions)||companions<0||companions>10)throw new Error('同行人數需為 0 到 10 的整數');
      if(!checked('rConsent'))throw new Error('請勾選同意蒐集個人資料');
      await api('registerEvent',{eventId:form.dataset.id,name:value('rName'),phone:value('rPhone'),companions,note:value('rNote'),consent:true});
      toast('✅ 報名成功');location.hash='#/me';
    } else if(form.id==='profileForm'){
      ME=await api('updateProfile',{name:value('pName'),nickname:value('pNick'),phone:value('pPhone'),email:value('pEmail'),city:value('pCity'),identity:value('pIdentity')});
      drawNavigation();toast('✅ 已儲存');
    } else if(form.id==='postForm'){
      if(!checked('fConsent'))throw new Error('請勾選確認事項');
      await api('createPost',{board:value('fBoard'),title:value('fTitle'),content:value('fContent'),consent:true});
      toast('已送出，等待審核');location.hash='#/forum';
    } else if(form.id==='replyForm'){
      await api('createReply',{postId:form.dataset.id,content:value('replyContent')});
      toast('✅ 已送出，審核通過後會顯示');await route();
    } else if(form.id==='adminEditForm'){
      const state=modalState;if(!state)throw new Error('表單已失效');
      if(state.uploading)throw new Error('請等待檔案上傳完成');
      const cfg=ADMIN_CONFIG[state.sheet],row={...state.row};
      cfg.fields.forEach(f=>{
        const el=document.getElementById('edit_'+f.key);
        if(el)row[f.key]=f.type==='checkbox'?(el.checked?'Y':''):el.value.trim();
      });
      if(!row[cfg.fields[0].key])throw new Error('請填寫「'+cfg.fields[0].label+'」');
      state.saving=true;
      try {
        await api('admin_save',{sheet:state.sheet,row});
        if(modalState===state)closeModal(true);
        toast('✅ 已儲存');await route();
      } finally {state.saving=false;}
    } else if(form.id==='memberEditForm'){
      const state=modalState;if(!state)throw new Error('表單已失效');
      const patch={status:value('memberStatus'),role:value('memberRole'),expireDate:value('memberExpiry'),identity:value('memberIdentity')};
      if(patch.role==='admin'&&state.row.role!=='admin'&&!confirm('確定授予管理員權限？管理員可以查看會員與捐款個資。'))return;
      state.saving=true;
      try{
        await api('admin_patch',{sheet:'Members',id:state.row.userId,patch});
        closeModal(true);toast('✅ 已更新');await route();
      }finally{state.saving=false;}
    } else if(form.id==='configForm'){
      const values={};
      form.querySelectorAll('[id^=cfg_]').forEach(el=>values[el.id.slice(4)]=el.value.trim());
      await api('admin_setConfig',{values});
      try{CFG=await api('getConfig');}catch(e){console.error(e);}
      drawFooter();drawGive();toast('✅ 已儲存，請到前台核對');
    } else if(form.id==='pageForm'){
      await api('admin_savePage',{key:value('pgKey'),title:value('pgTitle'),content:value('pgContent')});
      toast('✅ 已儲存');
    }
  }));
});

/* ===== 事件委派 ===== */
document.addEventListener('click',event=>{
  /* 在 LINE App 內,外部連結改用外部瀏覽器開啟 */
  const ext=event.target.closest('a[data-ext]');
  if(ext&&window.liff&&liffReady&&liff.isInClient()){
    event.preventDefault();
    try{liff.openWindow({url:ext.href,external:true});}catch{window.open(ext.href,'_blank','noopener');}
    return;
  }
  const el=event.target.closest('[data-action]');
  if(!el)return;
  const action=el.dataset.action;
  safely(async()=>{
    if(action==='font-down')return changeFont(-1);
    if(action==='font-up')return changeFont(1);
    if(action==='contrast')return setContrast(!document.body.classList.contains('hc'));
    if(action==='print')return window.print();
    if(action==='speak')return speak();
    if(action==='copy'){
      const text=el.dataset.text||'';
      try {
        await navigator.clipboard.writeText(text);
        toast('已複製'+el.dataset.label+':'+text);
      } catch { toast('無法自動複製，請手動選取:'+text); }
      return;
    }
    if(action==='my-page'){location.hash='#/me';return;}
    if(action==='drawer'){
      $('#drawer').hidden=!$('#drawer').hidden;
      $('#menuBtn').setAttribute('aria-expanded',String(!$('#drawer').hidden));return;
    }
    if(action==='persona'){
      if(!PERSONAS[el.dataset.k])return;
      setPersona(el.dataset.k);
      const target='#/for/'+el.dataset.k;
      if(location.hash===target)return route();
      location.hash=target;return;
    }
    if(action==='persona-reset'){
      setPersona('');
      if(location.hash===''||location.hash==='#/'||location.hash==='#')return route();
      location.hash='#/';return;
    }
    if(action==='fav-toggle'){
      const f=getFavs(),i=f.findIndex(x=>x.h===location.hash);
      if(i>=0)f.splice(i,1);
      else{
        const t=($('#view h2')?.textContent||'頁面').replace(/^[^\w\u4e00-\u9fff]+/,'').trim().slice(0,20)||'頁面';
        f.unshift({h:location.hash,t});
      }
      saveFavs(f);toast(i>=0?'已移除捷徑':'✅ 已加入我的捷徑');return route();
    }
    if(action==='fav-del'){const f=getFavs();f.splice(Number(el.dataset.i),1);saveFavs(f);return route();}
    if(action==='login'){requireLogin();return;}
    if(action==='logout'){
      await stopCamera();
      if(liffReady&&liff.isLoggedIn())liff.logout();
      ME=null;idToken=null;location.reload();return;
    }
    if(action==='modal-close')return closeModal();
    if(action==='qr-close'){$('#qrDialog').hidden=true;return;}
    if(action==='route-refresh')return route();
    if(action==='admin-refresh')return openAdmin(adminPage);
    if(action==='admin-new')return openEdit();
    if(action==='admin-edit')return openEdit(Number(el.dataset.index));
    if(action==='member-edit')return openMember(Number(el.dataset.index));
    if(action==='export-csv')return exportCsv();
    if(action==='remove-upload'){
      if(!modalState||modalState.uploading||modalState.saving)throw new Error('請等待目前操作完成');
      const k=el.dataset.field;modalState.row[k]='';
      const text=document.getElementById('edit_'+k);if(text)text.value='';
      $('#preview_'+k).replaceChildren();$('#uploadStatus_'+k).textContent='已移除，儲存後生效';return;
    }
    return once(action+':'+(el.dataset.id||el.dataset.index||''),el,async()=>{
      if(action==='admin-detail')return openDetail(Number(el.dataset.index));
      if(action==='show-qr')return showQR(el.dataset.id);
      if(action==='cancel-registration'){
        if(!confirm('確定取消報名？'))return;
        await api('cancelRegistration',{id:el.dataset.id});toast('已取消');return route();
      }
      if(action==='admin-status'){
        const sheet=adminPage,r=tableData[Number(el.dataset.index)],cfg=ADMIN_CONFIG[sheet];
        if(!r)throw new Error('資料已變更，請重新整理');
        if(!confirm('確定更新為「'+el.dataset.status+'」？'))return;
        await api('admin_patch',{sheet,id:r[cfg.key],patch:{status:el.dataset.status}});
        toast('✅ 已更新');return route();
      }
      if(action==='admin-delete'){
        const sheet=adminPage,r=tableData[Number(el.dataset.index)];
        if(!r||!confirm('確定永久刪除「'+(r.title||r.name||r.question)+'」？已有報名的活動不能刪除，請改為草稿。'))return;
        await api('admin_delete',{sheet,id:r.id});toast('已刪除');return route();
      }
      if(action==='camera')return toggleCamera();
      if(action==='checkin-refresh')return refreshCheckin();
      if(action==='checkin-manual'){
        const code=value('ckManual');if(!code)throw new Error('請輸入報到碼');
        $('#ckManual').value='';return submitCheckin(code);
      }
    });
  });
});
document.addEventListener('input',event=>{
  if(event.target.id==='adminSearch'){filter.q=event.target.value;renderRows();}
});
document.addEventListener('change',event=>{
  const el=event.target;
  if(el.dataset.chk!==undefined)chkChanged(el);
  if(el.id==='adminStatus'){filter.status=el.value;renderRows();}

document.addEventListener('keydown',event=>{
  const overlay=!$('#qrDialog').hidden?$('#qrDialog'):!$('#adminDialog').hidden?$('#adminDialog'):null;
  if(event.key==='Escape'){
    if(!$('#qrDialog').hidden)$('#qrDialog').hidden=true;
    else closeModal();
  }
  if(event.key==='Tab'&&overlay){
    const items=[...overlay.querySelectorAll('button,input,select,textarea,a[href]')].filter(x=>!x.disabled&&x.getClientRects().length);
    if(!items.length)return;
    const first=items[0],last=items[items.length-1];
    if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
    else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
  }
});

/* ===== 路由 ===== */
async function route() {
  const seq=++routeSeq;++adminSeq;++ckSeq;
  try{window.speechSynthesis&&speechSynthesis.cancel();}catch{}
  const segments=location.hash.replace(/^#\/?/,'').split('/').map(v=>{try{return decodeURIComponent(v);}catch{return v;}});
  const page=segments[0]||'home';
  $('#drawer').hidden=true;$('#menuBtn').setAttribute('aria-expanded','false');
  $('#qrDialog').hidden=true;closeModal(true);
  $('#pub').hidden=['admin','checkin'].includes(page);
  $('#adm').hidden=page!=='admin';$('#ck').hidden=page!=='checkin';
  if(page!=='checkin')safely(stopCamera);
  window.scrollTo(0,0);
  if(page==='admin')return openAdmin(segments[1]||'dash');
  if(page==='checkin'){
    if(!isAdmin()){
      $('#ck').hidden=true;$('#pub').hidden=false;
      $('#view').innerHTML='<h2>簽到權限不足</h2>'+(ME?'<p>此功能僅限啟用中的管理員。</p><a href="#/">回首頁</a>':loginCard());
      measureDock();
      return;
    }
    return safely(refreshCheckin);
  }
  curPage=page==='for'?'start':page;markNav();measureDock();
  $('#view').innerHTML='<p class="muted">載入中…</p>';
  try {
    let html;
    if(page==='forum')html=await PAGES.forum(segments[1],segments[1]==='b'?segments[2]:null);
    else if(Object.hasOwn(PAGES,page))html=await PAGES[page](segments[1],segments[2]);
    else html='<h2>找不到頁面</h2><a href="#/">回首頁</a>';
    if(seq!==routeSeq)return;
    $('#view').innerHTML=toolBar(page)+html;
    applyChecklist(true);
    const h=$('#view h2,#view h1');
    document.title=(h&&page!=='home'?h.textContent.trim()+'｜':'')+'台灣帕金森病友權益促進會';
    $('#view').focus({preventScroll:true});
  }catch(e){
    if(seq!==routeSeq)return;
    $('#view').innerHTML=`<div class="card"><h2>載入失敗</h2><p>${esc(e.message)}</p>${btn('route-refresh','重新載入','btn gh')}</div>`;
  }
}

document.addEventListener('visibilitychange',()=>{

  drawFooter();drawGive();
  await route();
})().catch(e=>{console.error(e);toast(e.message);});
