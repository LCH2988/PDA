<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>社團法人台灣帕金森病友權益促進會 (TPDA)</title>
  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root {
      --primary: #0D3B66;
      --accent: #F4A261;
      --bg: #F8F9FA;
      --card-bg: #FFFFFF;
      --text: #212529;
      --border: #CED4DA;
      --font-size: 19px;
    }
    /* 高對比模式 (黑底黃字) */
    body.high-contrast {
      --primary: #FFD166;
      --accent: #FFD166;
      --bg: #121212;
      --card-bg: #1E1E1E;
      --text: #FFFF00;
      --border: #FFFF00;
    }
    /* 字級放大模式 */
    body.font-large { --font-size: 24px; }
    body.font-xlarge { --font-size: 28px; }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      font-size: var(--font-size);
      line-height: 1.8;
      transition: background 0.3s, color 0.3s;
    }
    /* 無障礙懸浮列 */
    .a11y-toolbar {
      background: #000000;
      color: #FFFFFF;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .a11y-btn {
      background: #333;
      color: #fff;
      border: 1px solid #777;
      padding: 6px 12px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      margin-left: 6px;
      min-height: 44px;
    }
    /* 容器架構 */
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
    }
    .hero {
      text-align: center;
      padding: 24px 0 16px;
    }
    .hero h1 {
      margin: 0 0 10px;
      font-size: 1.5em;
      color: var(--primary);
    }
    body.high-contrast .hero h1 { color: var(--text); }
    .hero p { margin: 0; color: inherit; opacity: 0.9; }

    /* 儀表板卡片 */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 20px 0;
      text-align: center;
    }
    .stat-item {
      background: var(--card-bg);
      border: 2px solid var(--border);
      padding: 12px 6px;
      border-radius: 8px;
    }
    .stat-num {
      font-size: 1.3em;
      font-weight: bold;
      color: var(--primary);
    }
    body.high-contrast .stat-num { color: var(--text); }
    .stat-label { font-size: 0.8em; }

    /* 區塊卡片 */
    .card {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.06);
    }
    .card h2 {
      margin-top: 0;
      font-size: 1.25em;
      border-bottom: 3px solid var(--primary);
      padding-bottom: 8px;
    }
    body.high-contrast .card h2 { border-bottom-color: var(--text); }

    /* 56px 防手震按鈕規範 */
    .btn {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      min-height: 56px;
      font-size: 1.1em;
      font-weight: bold;
      border-radius: 10px;
      border: 2px solid transparent;
      cursor: pointer;
      text-decoration: none;
      margin: 12px 0;
      padding: 8px 16px;
      box-sizing: border-box;
    }
    .btn-primary { background: var(--primary); color: #FFFFFF; }
    .btn-accent { background: var(--accent); color: #000000; border-color: #D47B33; }
    body.high-contrast .btn-primary { background: #FFFF00; color: #000000; }

    /* 表單元件 */
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 8px; font-weight: bold; }
    input, select, textarea {
      width: 100%;
      min-height: 54px;
      font-size: 1em;
      padding: 10px 14px;
      border: 2px solid var(--border);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text);
    }

    /* 提示訊息方塊 */
    .alert {
      padding: 16px;
      border-radius: 8px;
      margin-top: 16px;
      display: none;
      font-weight: bold;
    }
    .alert-success { background: #D4EDDA; color: #155724; border: 2px solid #C3E6CB; }
    .alert-error { background: #F8D7DA; color: #721C24; border: 2px solid #F5C6CB; }
    
    /* 導覽頁籤 */
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab-btn {
      flex: 1;
      min-height: 50px;
      font-size: 0.95em;
      font-weight: bold;
      background: #E9ECEF;
      border: 2px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--primary);
      color: #FFF;
      border-color: var(--primary);
    }
    body.high-contrast .tab-btn.active { background: #FFFF00; color: #000; }
  </style>
</head>
<body>

  <!-- 無障礙友善工具列 -->
  <div class="a11y-toolbar">
    <span>無障礙工具</span>
    <div>
      <button class="a11y-btn" onclick="toggleContrast()">◐ 對比切換</button>
      <button class="a11y-btn" onclick="cycleFontSize()">A+ 字級</button>
    </div>
  </div>

  <div class="container">
    <div class="hero">
      <h1>台灣帕金森病友權益促進會</h1>
      <p>走慢一點，我們陪你走得更穩、更有尊嚴</p>
    </div>

    <!-- 首頁數據儀表板 -->
    <div class="stats-grid">
      <div class="stat-item">
        <div class="stat-num" id="stat_families">42,000+</div>
        <div class="stat-label">陪伴家庭</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="stat_drugs">3 項</div>
        <div class="stat-label">納入健保新藥</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="stat_workshops">120+ 場</div>
        <div class="stat-label">全台支持活動</div>
      </div>
    </div>

    <!-- 功能頁籤切換 -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('tab-aid')">新手村急救</button>
      <button class="tab-btn" onclick="switchTab('tab-donate')">線上捐款</button>
      <button class="tab-btn" onclick="switchTab('tab-event')">活動報名</button>
      <button class="tab-btn" onclick="switchTab('tab-credit')">徵信公開</button>
    </div>

    <!-- 1. 新手村 / 急救指南 -->
    <div id="tab-aid" class="card">
      <h2>剛確診不慌張：黃金資源</h2>
      <p>如果您或家人剛確診帕金森氏症，請不要害怕，本會提供完整就醫與社福支持。</p>
      <a href="tel:0800000000" class="btn btn-accent">📞 撥打諮詢專線 (0800-000-000)</a>
      <button class="btn btn-primary" onclick="alert('衛教手冊已傳送至雲端下載區！')">📘 點此下載《新病友照護全指南》PDF</button>
      <div style="margin-top: 16px; font-size: 0.9em; opacity: 0.8;">
        ※ 醫療聲明：本會衛教資料經神經專科醫師與物理治療顧問審閱，不可取代專業臨床醫囑。
      </div>
    </div>

    <!-- 2. 線上捐款 (CRO 轉化優化) -->
    <div id="tab-donate" class="card" style="display:none;">
      <h2>線上支持病友生活重建</h2>
      <form id="donateForm" onsubmit="handleDonateSubmit(event)">
        <div class="form-group">
          <label>捐款方式</label>
          <select id="donateMode">
            <option value="定期定額 (每月)">❤️ 定期定額每月護持 (最穩定力量)</option>
            <option value="單筆捐款">單筆即時捐款</option>
          </select>
        </div>

        <div class="form-group">
          <label>選擇支持金額</label>
          <select id="donateAmount">
            <option value="300">NT$ 300 / 月 (贊助一位新病友全套衛教教材)</option>
            <option value="500" selected>NT$ 500 / 月 (補貼弱勢病友一場家屬喘息工作坊)</option>
            <option value="1000">NT$ 1,000 / 月 (支持偏鄉居家防跌指導到府服務)</option>
            <option value="3000">NT$ 3,000 / 月 (全力挹注健保藥物權益倡議推廣)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="d_name">捐款人姓名</label>
          <input type="text" id="d_name" required placeholder="例如：王小明">
        </div>

        <div class="form-group">
          <label for="d_phone">聯絡電話</label>
          <input type="tel" id="d_phone" required placeholder="0912345678">
        </div>

        <div class="form-group">
          <label for="d_email">電子信箱 (寄送收據)</label>
          <input type="email" id="d_email" required placeholder="name@example.com">
        </div>

        <div class="form-group">
          <label for="d_idno">身分證字號 (個人申報所得稅自動扣抵用)</label>
          <input type="text" id="d_idno" placeholder="不申報免填">
        </div>

        <div class="form-group">
          <label>
            <input type="checkbox" id="d_public" checked style="width: auto; min-height: 24px;"> 同意姓名公開於捐款徵信名冊 (不同意將顯示善心人士)
          </label>
        </div>

        <button type="submit" id="donateSubmitBtn" class="btn btn-primary">立即前往安全結帳</button>
      </form>
      <div id="donateAlert" class="alert"></div>
      <div style="font-size: 0.85em; margin-top: 12px; color: #666;">
        核准勸募許可字號：衛部救字第1150000000號 ｜ 傳輸全面採 SSL 256-bit 加密
      </div>
    </div>

    <!-- 3. 活動線上報名 -->
    <div id="tab-event" class="card" style="display:none;">
      <h2>近期病友與家屬喘息活動報名</h2>
      <form id="eventForm" onsubmit="handleEventSubmit(event)">
        <div class="form-group">
          <label>選擇活動</label>
          <select id="eventSelect">
            <option value="EV-2026-01">2026 全台病友步態平衡復健線上講座</option>
            <option value="EV-2026-02">台北場：照顧者心靈紓壓與深呼吸互助會</option>
          </select>
        </div>

        <div class="form-group">
          <label for="e_name">參加者姓名</label>
          <input type="text" id="e_name" required>
        </div>

        <div class="form-group">
          <label for="e_phone">聯絡電話</label>
          <input type="tel" id="e_phone" required>
        </div>

        <div class="form-group">
          <label for="e_identity">身分別</label>
          <select id="e_identity">
            <option value="病友本人">病友本人</option>
            <option value="家屬照顧者">家屬照顧者</option>
            <option value="專業人員/社會大眾">專業人員 / 社會大眾</option>
          </select>
        </div>

        <div class="form-group">
          <label>
            <input type="checkbox" id="e_wheelchair" style="width: auto; min-height: 24px;"> 現場需要輪椅出入斜坡協助
          </label>
        </div>

        <button type="submit" id="eventSubmitBtn" class="btn btn-primary">確認送出報名</button>
      </form>
      <div id="eventAlert" class="alert"></div>
    </div>

    <!-- 4. 捐款徵信透明公開查詢 -->
    <div id="tab-credit" class="card" style="display:none;">
      <h2>合法公益徵信即時查詢</h2>
      <div class="form-group">
        <input type="text" id="creditKeyword" placeholder="輸入姓名或收據號搜尋 (如：王*明)">
        <button class="btn btn-primary" onclick="loadCredits()" style="margin-top: 8px;">即刻查詢徵信</button>
      </div>
      <div id="creditList" style="margin-top: 16px;">
        載入中...
      </div>
    </div>

  </div>

  <script>
    // 自動取得當前 GAS Web App 部署網址
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyBgc2RGxe0ppcoiPEinYgtaF0NvIgNqcNbNIO1i2lZq74_zLavGJXcU_Lq2bjWL1W4Ow/exec";
    let isSubmitting = false; // 防連擊防抖動 Flag

    // 初始化載入
    window.addEventListener("load", () => {
      // 嘗試初始化 LINE LIFF
      if (typeof liff !== "undefined") {
        liff.init({ liffId: "2009456572-EflpADae" }).then(() => {
          if (liff.isLoggedIn()) {
            liff.getProfile().then(p => {
              if (document.getElementById("d_name")) document.getElementById("d_name").value = p.displayName;
              if (document.getElementById("e_name")) document.getElementById("e_name").value = p.displayName;
            });
          }
        }).catch(err => console.log("LIFF Init Pass:", err));
      }
      loadCredits();
    });

    // 頁籤切換邏輯
    function switchTab(tabId) {
      document.querySelectorAll(".card").forEach(c => c.style.display = "none");
      document.getElementById(tabId).style.display = "block";
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      event.target.classList.add("active");
    }

    // 無障礙：高對比切換
    function toggleContrast() {
      document.body.classList.toggle("high-contrast");
    }

    // 無障礙：三段字級切換
    function cycleFontSize() {
      const b = document.body;
      if (!b.classList.contains("font-large") && !b.classList.contains("font-xlarge")) {
        b.classList.add("font-large");
      } else if (b.classList.contains("font-large")) {
        b.classList.remove("font-large");
        b.classList.add("font-xlarge");
      } else {
        b.classList.remove("font-xlarge");
      }
    }

    // 表單處理：捐款送出 (含 300ms 防抖動)
    async function handleDonateSubmit(e) {
      e.preventDefault();
      if (isSubmitting) return;

      const btn = document.getElementById("donateSubmitBtn");
      const alertBox = document.getElementById("donateAlert");
      isSubmitting = true;
      btn.disabled = true;
      btn.innerText = "授權處理中，請稍候...";

      const payload = {
        action: "createDonation",
        mode: document.getElementById("donateMode").value,
        amount: document.getElementById("donateAmount").value,
        name: document.getElementById("d_name").value,
        phone: document.getElementById("d_phone").value,
        email: document.getElementById("d_email").value,
        idNumber: document.getElementById("d_idno").value,
        isPublic: document.getElementById("d_public").checked,
        paymentMethod: "線上安全支付"
      };

      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        const ret = await res.json();
        
        if (ret.status === "success") {
          alertBox.className = "alert alert-success";
          alertBox.style.display = "block";
          alertBox.innerText = "✓ " + ret.message + " (收據編號: " + ret.orderId + ")";
          document.getElementById("donateForm").reset();
        } else {
          throw new Error(ret.message);
        }
      } catch (err) {
        alertBox.className = "alert alert-error";
        alertBox.style.display = "block";
        alertBox.innerText = "✕ 送出失敗：" + err.message;
      } finally {
        setTimeout(() => {
          isSubmitting = false;
          btn.disabled = false;
          btn.innerText = "立即前往安全結帳";
        }, 800);
      }
    }

    // 表單處理：活動報名送出
    async function handleEventSubmit(e) {
      e.preventDefault();
      if (isSubmitting) return;

      const btn = document.getElementById("eventSubmitBtn");
      const alertBox = document.getElementById("eventAlert");
      isSubmitting = true;
      btn.disabled = true;
      btn.innerText = "登記中...";

      const payload = {
        action: "registerEvent",
        eventId: document.getElementById("eventSelect").value,
        name: document.getElementById("e_name").value,
        phone: document.getElementById("e_phone").value,
        identity: document.getElementById("e_identity").value,
        needWheelchair: document.getElementById("e_wheelchair").checked
      };

      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        const ret = await res.json();
        alertBox.className = "alert alert-success";
        alertBox.style.display = "block";
        alertBox.innerText = "✓ " + ret.message;
        document.getElementById("eventForm").reset();
      } catch (err) {
        alertBox.className = "alert alert-error";
        alertBox.style.display = "block";
        alertBox.innerText = "✕ 報名失敗，請稍後再試";
      } finally {
        setTimeout(() => {
          isSubmitting = false;
          btn.disabled = false;
          btn.innerText = "確認送出報名";
        }, 800);
      }
    }

    // 載入公開徵信名單
    async function loadCredits() {
      const box = document.getElementById("creditList");
      const kw = encodeURIComponent(document.getElementById("creditKeyword").value || "");
      box.innerHTML = "<p>資料讀取中...</p>";

      try {
        const res = await fetch(GAS_URL + "?action=searchCredit&keyword=" + kw);
        const ret = await res.json();
        if (ret.status === "success" && ret.data.length > 0) {
          let html = "<table style='width:100%; border-collapse:collapse; font-size:0.9em;'>";
          html += "<tr style='border-bottom:2px solid #ccc; text-align:left;'><th>日期</th><th>善心芳名</th><th>金額</th></tr>";
          ret.data.forEach(d => {
            html += `<tr style='border-bottom:1px solid #eee; height:44px;'>
              <td>${d.date}</td>
              <td>${d.name}</td>
              <td>NT$ ${Number(d.amount).toLocaleString()}</td>
            </tr>`;
          });
          html += "</table>";
          box.innerHTML = html;
        } else {
          box.innerHTML = "<p>目前查無相關徵信紀錄。</p>";
        }
      } catch (e) {
        box.innerHTML = "<p>無法取得徵信資訊，請確認網路狀態。</p>";
      }
    }
  </script>
</body>
</html>
