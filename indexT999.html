<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>台灣帕金森病友權益促進會｜官方網站暨會員財務服務系統</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    /* ===== 1. 全域變數與無障礙基礎 ===== */
    :root{
      --main:#1d5f80; --dark:#0f3d54; --accent:#ffb02e; --bg:#f4f8fa; --line:#c9d6de;
      --ok:#167543; --ok-l:#dcfce7;
      --bad:#b93227; --danger:#b91c1c; --danger-l:#fee2e2;
      --warn:#92400e; --warn-l:#fef3c7;
      --info:#1e40af; --info-l:#dbeafe;
      --primary:#0f766e; --primary-d:#0b5a54; --primary-l:#e6f4f2;
      --purple:#6d28d9; --purple-d:#5b21b6;
      --card:#ffffff; --ink:#18232b; --muted:#566975;
      --radius:14px; --shadow:0 2px 10px rgba(15,23,42,.08);
      --tap:50px; --dock:116px;
    }
    *{box-sizing:border-box}
    html{font-size:20px;scroll-padding-top:90px;-webkit-text-size-adjust:100%}
    body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.75;padding-bottom:env(safe-area-inset-bottom)}
    a{color:var(--main)}
    img{max-width:100%}
    button,input,select,textarea{font:inherit}
    button,a,input,select,textarea,summary{touch-action:manipulation}
    button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,:focus-visible{outline:3px solid #e48400;outline-offset:3px;border-radius:6px}
    button{cursor:pointer}
    button:disabled,.btn:disabled,.btn[aria-busy="true"]{opacity:.55;cursor:not-allowed}
    [hidden]{display:none!important}
    .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
    h1,h2,h3{line-height:1.38}
    h1{color:var(--dark);font-size:1.55rem;margin:4px 0 14px}
    h2{color:var(--dark);font-size:1.4rem;margin:4px 0 14px}
    h3{color:var(--dark);font-size:1.15rem;margin:20px 0 10px}
    p{margin:0 0 .8rem}
    .muted{color:var(--muted);font-size:.88rem}
    .small{font-size:.9rem}
    .bold{font-weight:900}
    .center{text-align:center}
    .right{text-align:right}
    .pre{white-space:pre-wrap;overflow-wrap:anywhere}

    /* ===== 2. 卡片、格線與排版元件 ===== */
    .card{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;min-width:0;overflow-wrap:anywhere;box-shadow:var(--shadow)}
    .card.feat{border:4px solid var(--accent)}
    .card.pad-0{padding:0;overflow:hidden}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:14px;margin-bottom:14px}
    .cards .card{height:100%;margin:0;display:flex;flex-direction:column}
    .cards .card .card-grow{flex:1}
    .grid{display:grid;gap:12px}
    .grid.c2{grid-template-columns:repeat(2,1fr)}
    .grid.c3{grid-template-columns:repeat(3,1fr)}
    @media(max-width:620px){.grid.c2,.grid.c3{grid-template-columns:1fr}}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .row-between{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
    .spacer{flex:1}
    .cover{display:block;width:100%;height:190px;object-fit:cover;border-radius:10px;margin-bottom:12px;background:#e2e8f0}
    .detail-cover{width:100%;max-height:440px;object-fit:contain;border-radius:10px;margin-bottom:12px}
    .link{display:block;text-decoration:none;color:inherit;min-width:0}
    .link:hover .card{border-color:var(--main)}

    /* ===== 3. 按鈕與互動控制項 ===== */
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);padding:8px 18px;border:2px solid transparent;border-radius:12px;background:var(--main);color:#fff;font-weight:800;text-decoration:none;margin:4px 4px 4px 0;transition:background .15s}
    .btn:hover{background:var(--dark)}
    .btn.acc{background:var(--accent);color:#151515}
    .btn.sec{background:var(--main);color:#fff}
    .btn.gh,.btn-outline{background:#fff;border:2px solid var(--main);color:var(--dark)}
    .btn.gh:hover,.btn-outline:hover{background:#e3f0f6}
    .btn.ok{background:var(--ok);color:#fff}
    .btn.bad,.btn-danger{background:var(--danger);color:#fff}
    .btn.bad:hover,.btn-danger:hover{background:#991b1b}
    .btn.red{background:#b3122d;color:#fff}
    .btn-purple{background:var(--purple);color:#fff}
    .btn-purple:hover{background:var(--purple-d)}
    .btn-gray{background:#e2e8f0;color:var(--ink)}
    .btn-gray:hover{background:#cbd5e1}
    .btn-line{background:#06c755;color:#fff}
    .btn-line:hover{background:#05a647}
    .btn.sm,.btn-sm{min-height:40px;padding:4px 12px;font-size:.86rem}
    .btn-block{display:flex;width:100%;margin:6px 0}
    .big-btn{min-height:64px;font-size:1.15rem;width:100%;margin:6px 0}
    .cms-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}

    /* ===== 4. 表單與多媒體上傳器 ===== */
    label{display:block;font-weight:700;margin-top:12px}
    label.chk{font-weight:400;display:flex;gap:8px;align-items:flex-start;margin-top:12px;cursor:pointer;font-size:.92rem}
    label.chk input{margin-top:3px;flex:none}
    input,select,textarea,.input,select.input,textarea.input{width:100%;min-height:var(--tap);padding:10px 14px;border:2px solid #6b8fa3;border-radius:11px;background:#fff;color:var(--ink);font-size:max(16px,1rem);margin-top:4px}
    textarea,textarea.input{min-height:110px;resize:vertical}
    input[type=checkbox]{width:24px;min-height:24px;margin:0 8px 0 0;vertical-align:middle;accent-color:var(--main)}
    .field{margin-bottom:14px}
    .field label{margin-top:0;margin-bottom:6px;font-weight:900}
    .field .req{color:var(--danger)}
    .field .hint{font-size:.86rem;color:var(--muted);margin-top:4px}
    .input[aria-invalid="true"]{border-color:var(--danger);background:#fff7f7}
    .field-error{color:var(--danger);font-weight:700;font-size:.9rem;margin-top:4px}
    .check{display:flex;gap:12px;align-items:flex-start;padding:12px;border:2px solid var(--line);border-radius:12px;cursor:pointer;font-weight:500}
    .check input{width:26px;height:26px;margin-top:2px;flex:none}
    .two{display:grid;grid-template-columns:1fr;gap:0 16px}
    .split{display:grid;grid-template-columns:1fr;gap:20px;align-items:start}
    .form{max-width:740px}

    /* 萬用多媒體附件上傳與展示樣式 */
    .media-box{border:2px dashed #6b8fa3;border-radius:14px;padding:14px;background:#f8fbfd;margin:14px 0}
    .media-box h4{margin:0 0 8px;color:var(--dark);font-size:1rem}
    .photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:10px;margin-top:10px}
    .photo-item{position:relative;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
    .photo-item img{width:100%;height:120px;object-fit:cover;display:block;cursor:pointer}
    .photo-item .rm{position:absolute;top:4px;right:4px;background:rgba(185,28,28,.9);color:#fff;border:0;border-radius:999px;width:30px;height:30px;font-weight:900;font-size:.85rem;line-height:1}
    .att-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
    .att-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;flex-wrap:wrap}
    .gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin:12px 0}
    .gallery-img{width:100%;height:160px;object-fit:cover;border-radius:10px;border:2px solid var(--line);cursor:pointer;transition:transform .15s}
    .gallery-img:hover{transform:scale(1.02);border-color:var(--main)}

    /* ===== 5. 標籤、狀態徽章與提示框 ===== */
    .tag,.badge{display:inline-block;background:#e3eef5;color:var(--dark);padding:2px 10px;border-radius:999px;font-size:.82rem;font-weight:800;border:1px solid transparent}
    .tag.g,.b-ok{background:var(--ok-l);color:var(--ok);border-color:#86efac}
    .tag.r,.b-bad{background:var(--danger-l);color:var(--danger);border-color:#fca5a5}
    .tag.y,.b-warn{background:var(--warn-l);color:var(--warn);border-color:#fcd34d}
    .b-info{background:var(--info-l);color:var(--info);border-color:#93c5fd}
    .b-gray{background:#e2e8f0;color:#334155;border-color:#cbd5e1}
    .badge.dot::before{content:"● ";font-size:.7em}

    .notice,.alert{padding:12px 16px;border-radius:12px;border:2px solid;margin-bottom:14px;font-weight:600}
    .notice,.alert.warn{background:var(--warn-l);border-color:#e7bc4b;color:var(--warn)}
    .warn,.alert.err{background:var(--danger-l);border-color:#fca5a5;color:var(--danger);padding:12px 16px;border-radius:12px;margin:12px 0}
    .alert.ok{background:var(--ok-l);border-color:#86efac;color:var(--ok)}
    .alert.info{background:var(--info-l);border-color:#93c5fd;color:var(--info)}

    /* ===== 6. 分類膠囊、分頁鈕與統計卡 ===== */
    .chips,.seg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
    .chips a,.seg button{border:2px solid var(--main);border-radius:999px;padding:6px 16px;min-height:44px;text-decoration:none;background:#fff;color:var(--dark);font-weight:700;display:inline-flex;align-items:center}
    .chips a.on,.seg button[aria-pressed="true"]{background:var(--main);color:#fff;border-color:var(--main)}
    .hero{background:linear-gradient(135deg,var(--main),var(--dark));color:#fff;padding:22px 16px;border-radius:18px;text-align:center;margin-bottom:18px;position:relative}
    .hero h1{color:#fff;font-size:1.5rem;margin:0}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px;margin-bottom:16px}
    .stat{background:#fff;border:2px solid var(--line);padding:14px 12px;border-radius:12px;font-size:.88rem}
    .stats .stat{text-align:center}
    .stat b{display:block;font-size:1.6rem;color:var(--main)}
    .stat .k{font-size:.88rem;color:var(--muted);font-weight:700}
    .stat .v{font-size:1.5rem;font-weight:900;color:var(--dark);font-variant-numeric:tabular-nums}
    .item{border:2px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;background:#fff}
    .item .title{font-weight:900;font-size:1.05rem}

    /* ===== 7. 頂部導覽列（精簡清晰版）、頁尾與底部快捷列 ===== */
    .hd{display:flex;gap:8px;align-items:center;max-width:1180px;margin:auto;padding:10px 14px;flex-wrap:wrap}
    #pub header{background:var(--dark);color:#fff;position:sticky;top:0;z-index:40;box-shadow:var(--shadow)}
    .logo{color:#fff;text-decoration:none;font-weight:900;flex:1;line-height:1.35;min-width:160px}
    .tools{display:flex;gap:6px;flex-wrap:wrap}
    .tools button{min-width:42px;min-height:42px;border:1px solid #ffffff40;border-radius:8px;background:#ffffff20;color:#fff;font-weight:800;padding:0 10px}
    .tools button.edit-on{background:var(--accent);color:#151515;border-color:#fff}
    #meBtn{max-width:10em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #nav{display:none;gap:6px;flex-wrap:wrap;width:100%;padding-top:4px}
    #nav a{color:#fff;text-decoration:none;font-weight:800;padding:6px 13px;border-radius:9px;font-size:.94rem}
    #nav a:hover{background:#ffffff1f}
    #nav a.on{background:var(--accent);color:#151515}
    #drawer{padding:8px 14px;background:#fff;border-bottom:2px solid var(--line);max-height:78vh;overflow:auto}
    #drawer a{display:block;padding:11px 6px;border-bottom:1px solid var(--line);text-decoration:none;font-weight:800;color:var(--dark)}
    #view{max-width:1120px;min-height:65vh;margin:auto;padding:20px 14px 28px;outline:none}
    #foot{background:var(--dark);color:#eef5fa;text-align:center;padding:24px 14px calc(var(--dock) + 24px);font-size:.86rem}
    #foot p{margin:.35em 0}
    #foot a{color:#fff}
    #foot .muted{color:#cfe0ea}
    #dock{position:fixed;left:0;right:0;bottom:0;z-index:30}
    #giveBar{background:#b3122d;color:#fff;display:flex;gap:8px;align-items:center;justify-content:center;padding:6px 10px;flex-wrap:wrap;font-weight:800}
    #giveBar a{background:#fff;color:#b3122d;border-radius:22px;padding:2px 16px;text-decoration:none;min-height:40px;display:inline-flex;align-items:center;font-size:.95rem}
    #giveBar a.j{background:var(--accent);color:#151515}
    #giveBar a.m{background:transparent;color:#fff;border:2px solid #fff}
    #tabbar{background:#fff;border-top:2px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
    #tabbar a{flex:1;text-align:center;text-decoration:none;padding:4px 2px;font-size:.75rem;line-height:1.3;font-weight:800;min-height:50px;color:var(--dark)}
    #tabbar a span{display:block;font-size:1.2rem}
    #tabbar a.on{background:#e3f0f6;color:var(--main)}

    /* ===== 8. 專區頂部切換列（子導覽）===== */
    .mem-subnav{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 10px;margin-bottom:16px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
    .mem-subnav a{text-decoration:none;padding:7px 14px;border-radius:10px;font-weight:800;color:var(--dark);border:2px solid transparent;display:inline-flex;align-items:center;gap:6px;min-height:42px;font-size:.94rem}
    .mem-subnav a:hover{background:#e3f0f6}
    .mem-subnav a.on{background:var(--main);color:#fff}

    /* ===== 9. 管理後台版面 ===== */
    #adm{display:flex;min-height:100vh;align-items:flex-start}
    #aside{width:250px;flex:none;background:var(--dark);color:#fff;padding:14px 10px;min-height:100vh;position:sticky;top:0;max-height:100vh;overflow-y:auto}
    #aside h1{color:#fff;font-size:1.05rem;margin:4px 8px 10px}
    #aside .grp{font-size:.78rem;font-weight:900;color:#9cc2d8;margin:14px 8px 4px;letter-spacing:.05em}
    #aside a,#aside .nav-btn{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;color:#fff;background:transparent;border:0;text-decoration:none;padding:9px 12px;border-radius:10px;font-weight:700;font-size:.9rem;text-align:left;cursor:pointer;min-height:44px}
    #aside a:hover,#aside .nav-btn:hover{background:#ffffff18}
    #aside a.on,#aside .nav-btn[aria-current="page"]{background:var(--main);color:#fff}
    #aapp{flex:1;min-width:0;padding:22px 18px;max-width:1080px;margin:0 auto;width:100%}
    .side-close{display:none}
    .menu-fab{display:none}
    .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
    .bar input,.bar select{width:auto;flex:1;min-width:160px;margin:0}
    .bar .btn{margin:0}
    .acards{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}
    .gate{text-align:center;padding:50px 14px}

    /* ===== 10. 表格 ===== */
    .tw,.table-wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
    table,table.tbl{border-collapse:collapse;width:100%;font-size:.9rem}
    th,td,.tbl th,.tbl td{padding:9px 10px;text-align:left;border-bottom:1px solid #e3eaef;vertical-align:top}
    th,.tbl th{background:#e8f0f5;white-space:nowrap;font-weight:800}
    .tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
    .tbl tfoot td{font-weight:900;background:#f8fafc}
    table.plain{font-size:1rem}
    table.plain th{white-space:normal;width:28%}
    td.act{min-width:180px}
    .clip{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    @media(max-width:620px){
      .tbl.stack thead{display:none}
      .tbl.stack tr{display:block;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:6px;background:#fff}
      .tbl.stack td{display:flex;justify-content:space-between;gap:12px;border:0;padding:6px 8px}
      .tbl.stack td::before{content:attr(data-label);font-weight:900;color:var(--muted);flex:none}
    }

    /* ===== 11. Modal、Toast、Loading 與登入區 ===== */
    .overlay{position:fixed;inset:0;background:rgba(15,23,42,.65);z-index:500;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:20px 12px}
    .modal{background:#fff;border-radius:18px;padding:22px;width:100%;max-width:720px;margin:auto 0;max-height:92vh;overflow:auto}
    .modal.wide{max-width:860px}
    .modal h3{margin:0 0 12px}
    .modal-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
    .modal-head h2{flex:1;margin:0}
    .modal-close{min-width:48px;min-height:48px;border:0;border-radius:12px;background:#e2e8f0;font-size:1.25rem;font-weight:900}
    .modal-foot,.modal-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
    .up-preview{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
    .up-preview img{height:70px;max-width:160px;object-fit:contain}
    #qrDialog .modal{text-align:center;max-width:360px}
    #qc{display:inline-block;padding:16px;background:#fff;margin:12px 0;max-width:100%}
    #qc img,#qc canvas{max-width:100%}

    #toast{position:fixed;bottom:calc(var(--dock) + 12px);left:50%;transform:translateX(-50%);background:#18232b;color:#fff;padding:12px 20px;border-radius:12px;z-index:900;width:max-content;max-width:92vw;font-size:.94rem;overflow-wrap:anywhere}
    #toastBox{position:fixed;left:12px;right:12px;bottom:calc(var(--dock) + 14px);z-index:910;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
    .toast{pointer-events:auto;max-width:520px;width:100%;padding:14px 16px;border-radius:12px;color:#fff;font-weight:700;box-shadow:var(--shadow);background:#0f172a}
    .toast.ok{background:#166534}
    .toast.err{background:#991b1b}
    .toast.info{background:#1e3a8a}

    .spinner{width:28px;height:28px;border:4px solid #cbd5e1;border-top-color:var(--main);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading{padding:40px 0;text-align:center;color:var(--muted)}
    .empty{padding:36px 12px;text-align:center;color:var(--muted)}
    .empty .ic{font-size:2.4rem;display:block;margin-bottom:6px}
    #busy{position:fixed;inset:0;z-index:950;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center}

    .login-wrap{max-width:500px;margin:0 auto;padding:8px 0 24px}
    .login-hero{text-align:center;padding:14px 8px 10px}
    .login-hero .logo-circle{width:72px;height:72px;border-radius:50%;background:var(--main);color:#fff;display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 10px}
    .divider{display:flex;align-items:center;gap:10px;color:var(--muted);margin:16px 0;font-weight:700}
    .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

    /* ===== 12. 公告、收據、報表與簽到頁 ===== */
    .ann-pin{border-left:6px solid #f59e0b}
    .ann-content{white-space:pre-wrap;word-break:break-word}
    .report-head{text-align:center;margin-bottom:12px}
    .report-head h2{margin-bottom:2px}
    .report-note{font-size:.85rem;color:var(--muted);border-top:1px dashed var(--line);margin-top:12px;padding-top:8px}
    .receipt-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
    .receipt-actions .btn{flex:1;min-width:150px}
    .receipt-print-fallback{font-size:.9rem;min-height:46px;background:transparent;color:var(--muted);border:2px dashed var(--line)}
    .receipt-print-fallback:hover{background:#f1f5f9}
    .receipt-note{margin-top:14px;padding:10px 14px;border:1px dashed #64748b;background:#fafafa;font-size:.95rem;line-height:1.75}
    .receipt-sheet{position:relative}

    #ck header{background:var(--dark);color:#fff;padding:14px;display:flex;justify-content:space-between;gap:14px}
    #ck header a{color:#fff}
    #ck main{max-width:580px;margin:auto;padding:18px 14px}
    #ck .wide{display:flex;width:100%;min-height:56px}

const enc = v => encodeURIComponent(String(v ?? ''));

function fmtMoney(n) {
  const v = Math.round(Number(n) || 0);
  return (v < 0 ? '-' : '') + 'NT$' + String(Math.abs(v)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}
function fmtBytes(bytes) {
  const b = Number(bytes) || 0;
  if (!b) return '';
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
  return (b / 1048576).toFixed(1) + ' MB';
}

}

/* ---------- 提示與忙碌狀態 ---------- */
function toast(message, type) {
  if (type) {
    const box = $('#toastBox'), t = document.createElement('div');
    t.className = 'toast ' + type; t.textContent = String(message || ''); box.appendChild(t);
    setTimeout(function () { t.remove(); }, type === 'err' ? 7000 : 4000);
    return;
  }
  $('#toast').textContent = String(message || '發生錯誤');
  $('#toast').hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('#toast').hidden = true, 5000);
}
let busyCount = 0;
function busy(on) {
  busyCount = Math.max(0, busyCount + (on ? 1 : -1));
  $('#busy').hidden = busyCount === 0;
}
async function safely(fn) {
  try { await fn(); } catch(e) { console.error(e); toast(e.message, 'err'); }
}
async function once(key,element,fn) {
  if (busySet.has(key)) return;
  busySet.add(key);
  if (element) element.disabled = true;
  try { return await fn(); }
  finally {
    busySet.delete(key);
    if (element?.isConnected) element.disabled = false;
  }
}
async function run(btnEl, fn) {
  if (btnEl && btnEl.getAttribute('aria-busy') === 'true') return;
  if (btnEl) { btnEl.setAttribute('aria-busy', 'true'); btnEl.disabled = true; }
  try { return await fn(); }
  catch (e) { if (!(e instanceof ApiError && e.code === 'AUTH')) toast(e.message || '發生錯誤', 'err'); }
  finally { if (btnEl && btnEl.isConnected) { btnEl.removeAttribute('aria-busy'); btnEl.disabled = false; } }
}

/* =========================================================================
   三、統一 API 呼叫
   ========================================================================= */
class ApiError extends Error { constructor(msg, code) { super(msg); this.code = code || ''; } }

async function api(action, dataOrParams, opts) {
  opts = opts || {};
  const isFinAction = String(action).indexOf('.') !== -1;
  if (isFinAction && !opts.silent) busy(true);
  const ctrl = new AbortController();
  const timer = setTimeout(function () { ctrl.abort(); }, opts.timeout || 120000);
  try {
    if (isFinAction) {
      let res, j;
      try {
        res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: action, token: S.token, idToken: idToken, data: dataOrParams || {} }),
          signal: ctrl.signal
        });
        j = await res.json();
      } catch (e) {
        throw new ApiError(e && e.name === 'AbortError' ? '連線逾時，請稍後再試' : '網路連線失敗，請檢查網路後再試');
      }
      if (j && j.code === 'AUTH') {
        if (S.token) forceLogout('登入已逾期，請重新登入');
        throw new ApiError(j.message || '請重新登入', 'AUTH');
      }
      if (!j || !j.success) throw new ApiError((j && j.message) || '操作失敗', j && j.code);
      return j;
    } else {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: action, params: dataOrParams || {}, idToken: idToken, token: S.token }),
        signal: ctrl.signal
      });
      if (!response.ok) throw new Error('後端 HTTP 錯誤：' + response.status);
      let result;
      try { result = JSON.parse(await response.text()); }
      catch { throw new Error('後端未回傳 JSON，請確認 /exec 部署允許所有人存取'); }
      if (!result || typeof result.ok !== 'boolean') throw new Error('後端回應格式不正確');
      if (!result.ok) {
        if (result.code === 'AUTH_INVALID') {
          ME = null; idToken = null; drawNavigation();
          throw new Error('登入已過期，請重新登入');
        }
        throw new Error(result.message || '後端處理失敗');
      }
      return result.data;
    }
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('請求逾時。寫入可能已成功，請先更新紀錄確認，不要立即重複送出');
    throw e;
  } finally {
    clearTimeout(timer);
    if (isFinAction && !opts.silent) busy(false);
  }
}

/* =========================================================================
   四、萬用多媒體附件系統（支援無限張照片、不限格式大小檔案、無限組外部連結）
   ========================================================================= */
function normalizeAttachments(raw) {
  if (!raw) return { photos: [], files: [], links: [] };
  if (typeof raw === 'string') {
    try { raw = JSON.parse(raw); } catch (e) { return { photos: [], files: [], links: [] }; }
  }
  return {
    photos: Array.isArray(raw && raw.photos) ? raw.photos.map(p => ({ ...p })) : [],
    files: Array.isArray(raw && raw.files) ? raw.files.map(f => ({ ...f })) : [],
    links: Array.isArray(raw && raw.links) ? raw.links.map(l => ({ ...l })) : []
  };
}

async function prepareImageForUpload(file) {
  return new Promise(function (resolve) {
    if (!/^image\/(jpeg|png|webp|bmp)$/i.test(file.type)) {
      resolve(file);
      return;
    }
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = function () {
      const max = 1920, k = Math.min(1, max / Math.max(img.width || 1, img.height || 1));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * k));
      c.height = Math.max(1, Math.round(img.height * k));
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function (b) { resolve(b || file); }, 'image/jpeg', 0.86);
    };
    img.onerror = function () { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}

function bindMediaEditor(root, prefix, initialAtt, folderName) {
  const p = prefix || 'md';
  const state = normalizeAttachments(initialAtt);
  let uploadingCount = 0;

  const statusEl = $('#' + p + '_status', root);
  const photosEl = $('#' + p + '_photos', root);
  const filesEl  = $('#' + p + '_files', root);
  const linksEl  = $('#' + p + '_links', root);
  const photoIn  = $('#' + p + '_photoIn', root);
  const fileIn   = $('#' + p + '_fileIn', root);
  const linkTitle = $('#' + p + '_linkTitle', root);
  const linkUrl   = $('#' + p + '_linkUrl', root);
  const linkAdd   = $('#' + p + '_linkAdd', root);

  function render() {
    if (photosEl) {
      photosEl.innerHTML = state.photos.map(function (ph, idx) {
        const src = ph.thumbUrl || imageUrl(ph.id) || ph.url || '';
        return '<div class="photo-item">' +
          '<img src="' + esc(src) + '" alt="' + esc(ph.name || '照片') + '" data-lightbox-src="' + esc(src) + '">' +
          '<button type="button" class="rm" data-rm-photo="' + idx + '" aria-label="移除照片">✕</button>' +
        '</div>';
      }).join('');
    }
    if (filesEl) {
      filesEl.innerHTML = state.files.map(function (fl, idx) {
        return '<div class="att-row">' +
          '<span>📎 <b>' + esc(fl.name || '檔案') + '</b>' + (fl.size ? ' <span class="small muted">(' + esc(fmtBytes(fl.size)) + ')</span>' : '') + '</span>' +
          '<button type="button" class="btn btn-sm btn-danger" data-rm-file="' + idx + '">✕ 移除</button>' +
        '</div>';
      }).join('');
    }
    if (linksEl) {
      linksEl.innerHTML = state.links.map(function (lk, idx) {
        return '<div class="att-row">' +
          '<span>🔗 <b>' + esc(lk.title || lk.url) + '</b> <span class="small muted">' + esc(lk.url) + '</span></span>' +
          '<button type="button" class="btn btn-sm btn-danger" data-rm-link="' + idx + '">✕ 移除</button>' +
        '</div>';
      }).join('');
    }
  }

  async function handleFiles(fileList, asPhoto) {
    const arr = Array.prototype.slice.call(fileList || []);
    if (!arr.length) return;
    uploadingCount += arr.length;
    for (let i = 0; i < arr.length; i++) {
      const f = arr[i];
      if (statusEl) statusEl.textContent = '⏳ 正在上傳 (' + (i + 1) + '/' + arr.length + ')：' + f.name + '…';
      try {
        let blob = f, mime = f.type || (asPhoto ? 'image/jpeg' : 'application/octet-stream'), name = f.name || (asPhoto ? 'photo.jpg' : 'file');
        if (asPhoto || /^image\//i.test(mime)) {
          blob = await prepareImageForUpload(f);
          if (blob !== f) { mime = 'image/jpeg'; name = name.replace(/\.[^.]+$/, '') + '.jpg'; }
        }
        const dataUrl = await readAsDataURL(blob);
        const base64 = String(dataUrl).split(',')[1];
        const res = await api('uploadMediaFile', { folder: folderName || 'attachments', name: name, mime: mime, base64: base64 });
        if (asPhoto || res.isImage) {
          state.photos.push({ id: res.id, name: res.name, url: res.url, thumbUrl: res.thumbUrl || imageUrl(res.id) });
        } else {
          state.files.push({ id: res.id, name: res.name, mime: res.mime, size: res.size || blob.size, url: res.url, downloadUrl: res.downloadUrl });
        }
        render();
      } catch (e) {
        toast('上傳失敗（' + f.name + '）：' + e.message, 'err');
      } finally {
        uploadingCount = Math.max(0, uploadingCount - 1);
      }
    }
    if (statusEl) statusEl.textContent = '✅ 上傳完成！可繼續追加照片或檔案。';
  }

  if (photoIn) photoIn.addEventListener('change', function () { handleFiles(photoIn.files, true); photoIn.value = ''; });
  if (fileIn)  fileIn.addEventListener('change', function () { handleFiles(fileIn.files, false); fileIn.value = ''; });
  if (linkAdd) {
    linkAdd.addEventListener('click', function () {
      let u = (linkUrl && linkUrl.value.trim()) || '';
      const t = (linkTitle && linkTitle.value.trim()) || '';
      if (!u) { toast('請輸入連結網址', 'err'); linkUrl && linkUrl.focus(); return; }
      if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
      if (!validUrl(u)) { toast('網址格式不正確', 'err'); return; }
      state.links.push({ title: t || u, url: u });
      if (linkTitle) linkTitle.value = '';
      if (linkUrl) linkUrl.value = '';
      render();
    });
  }

  const box = $('#' + p + '_box', root);
  if (box) {
    box.addEventListener('click', function (ev) {
      const rp = ev.target.closest('[data-rm-photo]');
      if (rp) { state.photos.splice(Number(rp.getAttribute('data-rm-photo')), 1); render(); return; }
      const rf = ev.target.closest('[data-rm-file]');
      if (rf) { state.files.splice(Number(rf.getAttribute('data-rm-file')), 1); render(); return; }
      const rl = ev.target.closest('[data-rm-link]');
      if (rl) { state.links.splice(Number(rl.getAttribute('data-rm-link')), 1); render(); return; }
    });
  }

  render();
  return {
    getValue: function () {
      // 若使用者在連結欄填了網址但忘了按「＋ 加入連結」，自動幫他收錄
      if (linkUrl && linkUrl.value.trim()) {
        let u = linkUrl.value.trim();
        if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
        if (validUrl(u)) {
          state.links.push({ title: (linkTitle && linkTitle.value.trim()) || u, url: u });
          linkUrl.value = '';
          if (linkTitle) linkTitle.value = '';
        }
      }
      return state;
    },
    isUploading: function () { return uploadingCount > 0; }
  };
}

function renderAttachmentsHtml(rawAtt, legacyUrl) {
  const att = normalizeAttachments(rawAtt);
  if (legacyUrl && validUrl(legacyUrl)) {
    const exists = att.files.some(f => f.url === legacyUrl || f.downloadUrl === legacyUrl) || att.links.some(l => l.url === legacyUrl);
    if (!exists) att.links.push({ title: '📎 查看／下載附件', url: legacyUrl });
  }
  let html = '';
  if (att.photos.length) {
    html += '<div class="gallery-grid">' + att.photos.map(function (ph) {
      const src = ph.thumbUrl || imageUrl(ph.id) || ph.url || '';
      return '<img class="gallery-img" src="' + esc(src) + '" alt="' + esc(ph.name || '活動與文章照片') + '" loading="lazy" data-lightbox-src="' + esc(src) + '">';
    }).join('') + '</div>';
  }

const modalStack = [];
function openModal(o) {
  const prev = document.activeElement, ov = document.createElement('div');
  const id = 'm' + Date.now() + Math.random().toString(36).slice(2, 5);
  ov.className = 'overlay';
  ov.innerHTML = '<div class="modal' + (o.wide ? ' wide' : '') + '" role="dialog" aria-modal="true" aria-labelledby="' + id + 't">' +
    '<div class="modal-head"><h2 id="' + id + 't">' + esc(o.title || '') + '</h2>' +
    '<button type="button" class="modal-close" aria-label="關閉視窗" data-close>✕</button></div>' +
    '<div class="modal-body">' + (o.body || '') + '</div>' +
    (o.footer ? '<div class="modal-foot">' + o.footer + '</div>' : '') + '</div>';
  $('#modalRoot').appendChild(ov);
  document.body.style.overflow = 'hidden';
  const api_ = {
    el: ov.firstChild, root: ov,
    $: function (s) { return $(s, ov); },
    close: function (result) {
      const i = modalStack.indexOf(api_); if (i === -1) return;
      modalStack.splice(i, 1); ov.remove();
      if (!modalStack.length) document.body.style.overflow = '';
      if (prev && prev.focus && prev.isConnected) try { prev.focus(); } catch (e) {}
      if (o.onClose) o.onClose(result);
    }
  };
  ov.addEventListener('click', function (ev) {
    if (ev.target.closest('[data-close]')) api_.close(false);
    else if (ev.target === ov && !o.static) api_.close(false);
  });
  modalStack.push(api_);
  const first = $('[autofocus],input:not([type=hidden]),select,textarea', ov.firstChild) || $('.modal-close', ov);
  setTimeout(function () { if (first) first.focus(); }, 30);
  return api_;
}

      onClose: function (r) { resolve(r === true); }

}

function printHtml(html) {

  pa.innerHTML = html; pa.setAttribute('aria-hidden', 'false');

  };

}
function showPrintable(title, html) {

function b64ToBlob(b64, mime) {
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime || 'application/octet-stream' });
}
function saveFile(r) {
  const url = URL.createObjectURL(b64ToBlob(r.base64, r.mimeType));
  const inLine = (typeof liff !== 'undefined' && liffReady && liff.isInClient && liff.isInClient());
  if (inLine) {
    window.open(url, '_blank');

    const a = document.createElement('a');
    a.href = url; a.download = r.filename || 'download'; document.body.appendChild(a); a.click(); a.remove();
  }
  setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
}

function readAsDataURL(file) {
  return new Promise(function (res, rej) { const r = new FileReader(); r.onload = function () { res(r.result); }; r.onerror = rej; r.readAsDataURL(file); });
}
async function filePayload(inputEl) {
  const f = inputEl && inputEl.files && inputEl.files[0];
  if (!f) return null;
  let blob = f, mime = f.type || 'application/octet-stream', name = f.name || 'file';
  if (mime.indexOf('image/') === 0 && mime !== 'image/heic' && f.size > 1.2 * 1024 * 1024) {
    blob = await prepareImageForUpload(f); mime = blob.type || 'image/jpeg'; name = name.replace(/\.\w+$/, '') + '.jpg';
  }
  const dataUrl = await readAsDataURL(blob);
  return { filename: name, mimeType: mime, base64: String(dataUrl).split(',')[1] };
}
async function viewFile(url) {
  if (!url) { toast('沒有附件', 'info'); return; }
  const r = await api('file.get', { url: url });
  const href = URL.createObjectURL(b64ToBlob(r.base64, r.mimeType));
  const isImg = String(r.mimeType).indexOf('image/') === 0;
  openModal({
    title: '附件：' + r.filename, wide: true,

}

   六、雙軌登入驗證（LINE 登入 ＋ 姓名與手機號碼登入 ＋ 註冊與綁定）
   ========================================================================= */
function storeToken(tok, persist) {
  try { (persist ? localStorage : sessionStorage).setItem(TOKEN_KEY, tok); (persist ? sessionStorage : localStorage).removeItem(TOKEN_KEY); } catch (e) {}
}
function loadToken() { try { return localStorage.getItem(TOKEN_KEY) || sessionStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } }
function clearToken() { try { localStorage.removeItem(TOKEN_KEY); sessionStorage.removeItem(TOKEN_KEY); } catch (e) {} }

function setMember(m, webProf) {
  if (m) {
    S.member = m;
    S.role = m.type || '一般會員';
    S.isAdmin = ADMIN_TYPES.indexOf(S.role) !== -1;
    ME = webProf || {
      userId: m.lineId || m.memberId,
      memberId: m.memberId,
      displayName: m.lineName || m.name,
      name: m.name,
      nickname: m.nickname || '',
      phone: m.phone || m.mobile || '',
      email: m.email || '',
      city: m.city || (ME && ME.city) || '',
      identity: m.identity || (ME && ME.identity) || '',
      expireDate: m.expiryDate || '',
      role: S.isAdmin ? 'admin' : 'member',
      financeRole: S.role,
      status: m.isActive || S.isAdmin ? '啟用' : '待審'
    };
  }
}

function onLoginSuccess(res, persist) {
  if (res.token) {
    S.token = res.token;
    storeToken(res.token, persist !== false);
  }
  S.pendingBind = null;
  setMember(res.member, res.webProfile);
  drawNavigation();
  route();
}

function forceLogout(msg) {
  S.token = ''; S.member = null; S.role = ''; S.isAdmin = false; S.pendingBind = null;
  ME = null; idToken = null;
  clearToken();
  modalStack.slice().forEach(function (m) { m.close(false); });
  drawNavigation();
  if (msg) toast(msg, 'info');
  route();
}

async function doLogout() {
  if (!(await confirmDialog('確定要登出嗎？', { okText: '登出' }))) return;
  await stopCamera();
  if (S.token) {
    try { await api('auth.logout', {}, { silent: true }); } catch (e) {}
  }
  try { sessionStorage.setItem(NOAUTO_KEY, '1'); } catch (e) {}
  if (liffReady && window.liff && liff.isLoggedIn()) {
    try { liff.logout(); } catch (e) {}
  }
  forceLogout('已登出');
}

async function initLiff() {
  if (!LIFF_ID) return;
  try {
    if (!window.liff) return;
    await liff.init({ liffId: LIFF_ID });
    liffReady = true;
  } catch (e) {
    liffReady = false;
  }
}

async function lineLogin() {
  try { sessionStorage.removeItem(NOAUTO_KEY); } catch (e) {}
  if (!liffReady || !window.liff) throw new Error('LINE 登入目前無法使用，請改用下方「姓名與手機號碼」登入');
  if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
  idToken = liff.getIDToken();
  if (!idToken) { liff.logout(); liff.login({ redirectUri: location.href }); return; }
  let res;
  try { res = await api('auth.loginByLine', { idToken: idToken }); }
  catch (e) { if (e.message.indexOf('LINE') !== -1) { try { liff.logout(); } catch (x) {} } throw e; }
  if (res.isFirstLogin) {
    S.pendingBind = { ticket: res.ticket, lineName: res.lineName };
    openLineBindModal(res.ticket, res.lineName);
  } else {
    onLoginSuccess(res, true);
    toast('已成功登入', 'ok');
  }
}

function rich(t) {
  const out = []; let p = [], l = [];
  const fp = () => { if (p.length) { out.push('<p>' + p.map(esc).join('<br>') + '</p>'); p = []; } };
  const fl = () => { if (l.length) { out.push('<ul>' + l.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>'); l = []; } };
  String(t || '').split(/\r?\n/).forEach(line => {
    if (!line.trim()) { fp(); fl(); return; }
    if (/^## /.test(line)) { fp(); fl(); out.push('<h3>' + esc(line.slice(3)) + '</h3>'); return; }
    if (/^- /.test(line)) { fp(); l.push(line.slice(2)); return; }
    fl(); p.push(line);
  });
  fp(); fl();
  return out.join('');
}

function chkState() { try { return JSON.parse(localStorage.getItem('pd_chk')||'{}')||{}; } catch { return {}; } }
function applyChecklist(init) {
  const boxes = document.querySelectorAll('[data-chk]');
  if (!boxes.length) return;
  const st = chkState();
  let n = 0;
  boxes.forEach(b => { if (init) b.checked = !!st[b.dataset.chk]; if (b.checked) n++; });
  const bar = $('#pbarIn'), txt = $('#pbarTxt');
  if (bar) bar.style.width = (n/boxes.length*100)+'%';
  if (txt) txt.textContent = `已完成 ${n} / ${boxes.length} 項`;
}
function chkChanged(el) {
  const st = chkState();
  st[el.dataset.chk] = el.checked;
  try { localStorage.setItem('pd_chk',JSON.stringify(st)); } catch {}
  applyChecklist(false);
}

   {h:'居家安全警告',b:BOX('warn','⚠️','嗅覺退化的致命危機','<p>許多病友確診前就失去嗅覺，聞不到瓦斯外洩或電線走火的焦味。</p><p>家中有帕金森患者，<strong>廚房與臥室務必安裝瓦斯外洩警報器與煙霧偵測器（住警器）</strong>。</p>')},

   {h:'運動小提醒',b:L([['👫','盡量有人陪伴，或在安全的環境下進行。'],['🪑','平衡不好時，扶著穩固的桌椅練習。'],['⏱️','從每天 10-15 分鐘開始，慢慢增加。'],['💊','最好在藥效較好的時段運動。']])},
   {h:'凍結步態怎麼辦？',b:'<p>「凍結步態」是走到一半或剛要起步時，腳像黏在地上。以下「提示技巧」很有用：</p>'+L([['👀','<strong>視覺提示：</strong>在地上貼橫向膠帶，當成要跨越的線。'],['🎵','<strong>聽覺提示：</strong>跟著口令「1、2、1、2」或固定節拍的音樂走。'],['⚖️','先把重心移到一腳，再大步跨出。'],['🛑','不要急著拉扯或催促，給對方幾秒鐘。']])},
   {h:'居家防跌',b:L([['💡','走道與廁所裝夜燈。'],['🚿','浴室鋪防滑墊，並裝扶手。'],['🧶','移除地毯、電線等絆腳物。'],['👟','穿防滑、合腳的鞋子，不穿拖鞋。']])+NOTE(['每天規律運動。','善用視覺、聽覺提示對抗凍結步態。','居家環境整理是最便宜的防跌方法。'])}
  ],notes:['規律運動是治療的重要一環。','提示技巧可改善凍結步態。']},
  {id:8,part:2,ic:'⚡',title:'手術治療選項',sub:'當藥物不再夠用',secs:[
   {h:'DBS 是什麼？',b:'<p>「深腦刺激術（DBS）」是在大腦特定位置植入細小電極，以電流訊號調節異常的神經迴路，改善顫抖、僵硬等症狀。</p><p>它<strong>不是根治</strong>，也不會停止疾病進展，但可以讓藥量減少、症狀波動減輕。</p>'},
   {h:'誰適合？',b:L([['✅','藥物效果有限，或副作用難以忍受。'],['✅','對左旋多巴仍有良好反應。'],['✅','沒有嚴重失智或精神問題。'],['🩺','是否適合，需由神經內科與神經外科團隊評估。']])},
   {h:'健保給付',b:'<p>台灣健保自<strong>民國 111 年 6 月</strong>起，已將 DBS 整套醫材（含立體定位套組）完整納入給付範圍，大幅減輕經濟負擔。</p><p>詳細條件請向醫院的個案管理師詢問。</p>'}
  ],notes:['DBS 適合藥物效果受限或副作用大的病友。','健保自 111 年 6 月起完整給付。','是否適合由醫療團隊評估。']},
  {id:9,part:2,ic:'🥗',title:'吃出穩定',sub:'營養與飲食管理指南',secs:[
   {h:'便秘管理三大原則',b:L([['🥦','<strong>多吃纖維：</strong>每天 5 份以上蔬菜水果。'],['💧','<strong>多喝水：</strong>每天 1500-2000cc（腎臟或心臟疾病者請先問醫師）。'],['🥛','<strong>吃發酵食品：</strong>如優格、味噌，補充益生菌。']])},
   {h:'吞嚥與進食安全',b:L([['🪑','坐直吃飯，頭微微向前低。'],['🥄','小口慢慢吃，吃完再吃下一口。'],['🍲','食物切小、煮軟，必要時使用增稠劑。'],['⚠️','常嗆咳、吃飯很久，請告訴醫師，安排吞嚥評估。']])},
   {h:'飲食與用藥配合',b:'<p>飲食不要和服藥分開計畫。建議與醫師、營養師一起安排「何時吃藥、何時吃蛋白質、何時補水」。</p>'+NOTE(['便秘要靠水分、纖維與運動一起處理。','吞嚥困難要及早評估。','飲食與服藥時間要互相配合。'])}
  ],notes:['便秘是常見的自律神經症狀。','吞嚥困難不要拖。']},
  {id:10,part:3,ic:'💙',title:'走過診斷後的哀傷期',sub:'情緒是需要被照顧的',secs:[
   {h:'哀傷的五個階段',b:'<p>確診後，很多人會經歷：</p><p><span class="pill">1 否認</span><span class="pill">2 憤怒</span><span class="pill">3 討價還價</span><span class="pill">4 憂鬱</span><span class="pill">5 接受</span></p><p>順序不一定，也可能來回。<strong>允許自己悲傷，是療癒的第一步。</strong></p>'},
   {h:'憂鬱是疾病的一部分',b:'<p>帕金森病的憂鬱有神經生理的基礎，確診前後約 2 年是高風險期。這<strong>不是意志力薄弱</strong>。</p>'+L([['💬','常用且與帕金森藥物交互作用較低的抗憂鬱藥有 SSRI、Mirtazapine、Bupropion 等，實際用藥請由醫師評估。'],['🧘','運動、曬太陽、固定作息、與朋友往來，都有幫助。']])},
   {h:'需要立刻求助的情況',b:BOX('warn','🆘','請馬上告訴醫師或家人','<p>若持續情緒低落、失眠、不想吃東西，或有<strong>傷害自己的念頭</strong>，請立即求助。</p><p>安心專線：<strong>1925</strong>（24 小時免付費）。</p>')}
  ],notes:['憂鬱是疾病常見的一部分，可以治療。','不要獨自承受，勇敢求助。']},
  {id:11,part:3,ic:'👨‍👩‍👧',title:'與家人重新對話',sub:'好好說話，就是最好的支持',secs:[
   {h:'用「我訊息」說話',b:L([['✅','<strong>我訊息：</strong>「我需要感覺自己還能做一些事。」'],['❌','<strong>你訊息：</strong>「你每次都不讓我做事！」']])+'<p>「我訊息」說的是自己的感受與需要，比較不會讓對方感到被指責。</p>'},
   {h:'溝通小技巧',b:L([['🐢','放慢速度，給病友多一點回應時間。'],['📌','一次只講一件事，指令簡單明確。'],['👀','面對面、看著眼睛說話。'],['🔊','病友聲音小時，請溫和地請對方再說一次，不要不耐煩。']])},
   {h:'家庭會議',b:'<p>每週或每月開一次家庭會議，一起討論照顧分工、下次回診、遇到的困難。</p>'+L([['📅','固定時間，例如每週日晚餐後。'],['🗒️','輪流發言、記錄決議。'],['💬','先說感謝，再說困難。']])}
  ],notes:['說話放慢、簡化、面對面。','定期家庭會議可分散照顧責任、預防衝突。']},
  {id:12,part:4,ic:'🌸',title:'照顧者的自我照顧',sub:'照顧別人，也要照顧自己',secs:[
   {h:'照顧是一場馬拉松',b:'<p>照顧帕金森病友是長期的路，累了就要休息。您照顧好自己，才有力氣照顧家人。</p>'+L([['😮‍💨','覺得累、煩、生氣，都是正常的，不是不愛對方。'],['😴','維持自己的睡眠、飲食與健康檢查。'],['☕','每天為自己留一點屬於自己的時間。']])},
   {h:'申請喘息服務',b:'<p>撥打長照專線 <span class="pill">1966</span>，可申請居家或機構的「喘息服務」，讓您暫時休息。</p>'},
   {h:'給自己「足夠好」的許可',b:'<p>不需要完美。「足夠好」的照顧者，就是最好的照顧者。</p>'+NOTE(['長照專線 1966 是喘息服務的入口。','允許自己「足夠好」而不是「完美」。'])}
  ],notes:['照顧者的健康同樣重要。','善用喘息服務與各種資源。']},
  {id:13,part:4,ic:'🕊️',title:'放手的藝術',sub:'尊重、尊嚴與自主',secs:[
   {h:'照顧不等於代勞',b:'<p>在安全的前提下，鼓勵病友自己完成力所能及的事，能保有尊嚴與自信，也減輕照顧者的負擔。</p>'},
   {h:'實際做法',b:L([['⏱️','多給一點時間，讓病友自己慢慢穿衣、吃飯。'],['🛠️','善用輔具：防滑墊、扶手、加粗握把餐具、穿鞋輔助器。'],['🙋','主動請家人、朋友與專業人員幫忙，不必獨自承擔。']])},
   {h:'平衡安全與自主',b:NOTE(['「適度放手」是尊重，不是不關心。','在安全與自主之間取得平衡，是長期照顧的核心。','遇到不確定的情況，請與醫療團隊討論。'])}
  ],notes:['適度放手是一種愛。']},
  {id:14,part:5,ic:'📍',title:'台灣在地資源總整理',sub:'需要時，知道可以找誰',secs:[
   {h:'常用電話',b:'<div class="tel"><span class="n">1966</span>長照專線：居家照顧、日間照顧、喘息服務、輔具</div><div class="tel"><span class="n">1925</span>安心專線：24 小時心理支持</div><div class="tel"><span class="n">119</span>緊急救護：跌倒受傷、嚴重嗆咳、意識不清</div>'},
   {h:'醫療與病友資源',b:L([['🏥','<strong>動作障礙門診：</strong>建議到有神經內科動作障礙專科的醫學中心或區域醫院。'],['👫','<strong>病友團體：</strong>各地醫院與病友協會常舉辦聯誼、運動與衛教活動，可向就診醫院洽詢。'],['🧑‍⚕️','<strong>個案管理師：</strong>可協助 DBS、衛教與資源轉介。']])+'<p><a href="#/events">👉 看本會近期活動</a>　<a href="#/forum">👉 病友論壇</a></p>'},
   {h:'溫馨聲明',b:BOX('warn','⚠️','請注意','<p>本指南僅供衛教參考，<strong>不能取代醫師的診斷與治療</strong>。用藥或飲食調整前，請先與您的醫療團隊討論。</p>')}
  ],notes:['長照 1966、安心 1925、緊急 119。','本指南不能取代醫師建議。']}
  ];
  var GUIDE={
   'new':{t:'我剛確診',ic:'🌱',d:'先從基礎開始',p:[1,2,3,5,10]},
   pat:{t:'我是病友',ic:'🧓',d:'日常生活怎麼過',p:[6,7,9,10,11]},
   fam:{t:'我是家屬／照顧者',ic:'👨‍👩‍👧',d:'怎麼幫忙、怎麼休息',p:[4,11,12,13,14]}
  };
  var PROBLEMS=[['🤲','手抖、走路不穩、容易跌倒',7],['🚽','便秘、吞嚥不順',9],['⏰','吃藥時間、藥效忽好忽壞',6],['😔','心情不好、不想做事',10],['😮‍💨','照顧得好累',12],['💊','想知道藥物與副作用',5],['⚡','聽說可以開刀（DBS）',8],['📞','需要電話與資源',14]];

  var rx=function(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')};
  var txt=function(h){var d=document.createElement('div');d.innerHTML=h;return d.textContent};
  var cname=function(c){return '第'+c.id+'章 '+c.title};
  var homeBtn='<div class="pk-nav"><button type="button" onclick="pkGo(\'home\')">🏠 回指南首頁</button></div>';

  function home(){
    var h='<div class="pk"><div class="pk-card"><h2>🧠 認識帕金森：病友與家屬的實用生活指南</h2><p class="pk-sub">不用從頭讀到尾，請依您的需要，點選下面的按鈕。</p></div>';
    h+='<div class="notice">本指南僅供衛教參考，不能取代醫師的診斷與治療。用藥或飲食調整前，請先與您的醫療團隊討論。<div class="muted">'+esc(org().review||'醫療審閱資訊將於顧問醫師確認後標示。')+'</div></div>';
    h+='<div class="pk-card"><h3>🔎 第一步：想找什麼？直接搜尋</h3><div class="pk-search"><input id="pkq" type="search" aria-label="搜尋指南" placeholder="例如：便秘、跌倒、藥、1966" onkeydown="if(event.key===\'Enter\')pkSearch()"><button type="button" onclick="pkSearch()">搜尋</button></div></div>';
    h+='<div class="pk-card"><h3>👤 第二步：請問您是？</h3><div class="pk-grid">';
    Object.keys(GUIDE).forEach(function(k){var g=GUIDE[k];h+='<button type="button" class="pk-btn" onclick="pkGo(\'path/'+k+'\')"><span class="ic">'+g.ic+'</span><span>'+g.t+'<small>'+g.d+'</small></span></button>'});
    h+='</div></div><div class="pk-card"><h3>❓ 我現在遇到…</h3><div class="pk-grid">';
    PROBLEMS.forEach(function(p){h+='<button type="button" class="pk-btn" onclick="pkGo(\'c'+p[2]+'/0\')"><span class="ic">'+p[0]+'</span><span>'+p[1]+'</span></button>'});
    h+='</div></div><div class="pk-card"><h3>📞 常用電話</h3><div class="tel"><span class="n">1966</span>長照專線（喘息、居家照顧）</div><div class="tel"><span class="n">1925</span>安心專線（24 小時心理支持）</div><div class="tel"><span class="n">119</span>緊急救護</div></div>';
    h+='<div class="pk-card"><h3>📚 全部章節</h3>';
    PARTS.forEach(function(p,i){h+='<div class="part">'+p+'</div>';C.filter(function(c){return c.part===i}).forEach(function(c){h+='<button type="button" class="pk-btn" onclick="pkGo(\'c'+c.id+'/0\')"><span class="ic">'+c.ic+'</span><span>'+cname(c)+'<small>'+c.sub+'</small></span></button>'})});
    return h+'</div></div>';
  }
  function path(k){
    var g=GUIDE[k];if(!g)return home();
    var h='<div class="pk"><div class="pk-card"><div class="crumb"><a href="#/learn">認識帕金森</a> › 閱讀建議</div><h2>'+g.ic+' '+g.t+'</h2><p>建議您依照順序閱讀，每章只要幾分鐘。</p>';
    g.p.forEach(function(id,i){var c=C[id-1];h+='<button type="button" class="pk-btn" onclick="pkGo(\'c'+id+'/0\')"><span class="ic">'+(i+1)+'</span><span>'+cname(c)+'<small>'+c.sub+'</small></span></button>'});
    return h+homeBtn+'</div></div>';
  }
  function chapter(id,i){
    var c=C[id-1];if(!c)return home();
    var n=c.secs.length+1;
    i=Math.max(0,Math.min(n-1,i||0));
    var h='<div class="pk"><div class="pk-card"><div class="crumb"><a href="#/learn">認識帕金森</a> › '+PARTS[c.part]+' › 第'+c.id+'章</div>';
    h+='<h2>'+c.ic+' '+cname(c)+'</h2><p class="pk-sub">'+c.sub+'</p>';
    h+='<p><strong>第 '+(i+1)+' 段／共 '+n+' 段</strong></p><div class="pk-prog" aria-hidden="true"><div style="width:'+((i+1)/n*100)+'%"></div></div><div class="pk-steps">';
    c.secs.forEach(function(s,j){h+='<button type="button" class="'+(j===i?'on':'')+'" onclick="pkGo(\'c'+id+'/'+j+'\')">'+(j+1)+'. '+s.h+'</button>'});
    h+='<button type="button" class="'+(i===n-1?'on':'')+'" onclick="pkGo(\'c'+id+'/'+(n-1)+'\')">📝 重點整理</button></div></div><div class="pk-card">';
    if(i<c.secs.length)h+='<h3>'+(i+1)+'. '+c.secs[i].h+'</h3>'+c.secs[i].b;
    else h+='<h3>📝 本章重點整理</h3>'+NOTE(c.notes)+'<p>讀完了！您可以繼續看下一章，或回指南首頁選其他主題。</p>';
    h+='<div class="pk-nav"><button type="button" '+(i===0?'disabled':'')+' onclick="pkGo(\'c'+id+'/'+(i-1)+'\')">⬅️ 上一段</button>';
    if(i<n-1)h+='<button type="button" class="primary" onclick="pkGo(\'c'+id+'/'+(i+1)+'\')">下一段 ➡️</button>';
    else if(id<C.length)h+='<button type="button" class="primary" onclick="pkGo(\'c'+(id+1)+'/0\')">下一章 ➡️</button>';
    else h+='<button type="button" class="primary" onclick="pkGo(\'home\')">🏠 回指南首頁</button>';
    return h+'</div><div class="pk-nav"><button type="button" onclick="pkGo(\'home\')">🏠 指南首頁</button><button type="button" onclick="pkGo(\'c'+id+'/0\')">↩️ 本章重頭看</button></div></div></div>';
  }
  function search(q){
    q=String(q||'').trim();
    if(!q)return home();
    var re=new RegExp(rx(q),'gi'),res=[];
    C.forEach(function(c){c.secs.forEach(function(s,j){
      var all=s.h+' '+txt(s.b),m=all.search(re);
      if(m>=0){
        var st=Math.max(0,m-25),sn=esc(all.substr(st,90)).replace(new RegExp(rx(esc(q)),'gi'),function(x){return '<mark>'+x+'</mark>'});
        res.push('<button type="button" class="pk-result" onclick="pkGo(\'c'+c.id+'/'+j+'\')"><b>'+c.ic+' '+cname(c)+' › '+s.h+'</b><br>'+(st>0?'…':'')+sn+'…</button>');
      }
    })});
    return '<div class="pk"><div class="pk-card"><div class="crumb"><a href="#/learn">認識帕金森</a> › 搜尋</div><h2>🔎 搜尋結果</h2><div class="pk-search"><input id="pkq" type="search" aria-label="搜尋指南" value="'+esc(q)+'" onkeydown="if(event.key===\'Enter\')pkSearch()"><button type="button" onclick="pkSearch()">搜尋</button></div><p>找到 <strong>'+res.length+'</strong> 個與「'+esc(q)+'」相關的段落：</p>'+(res.join('')||'<p>找不到相關內容，請換個說法，例如「藥」「運動」「便秘」。</p>')+homeBtn+'</div></div>';
  }
  return function(a,b){
    if(!a)return home();
    var m=a.match(/^c(\d+)$/);
    if(m)return chapter(+m[1],parseInt(b,10)||0);
    if(a==='path')return path(b);
    if(a==='s')return search(b);
    return home();
  };
})();
window.pkGo=function(h){location.hash=h==='home'?'#/learn':'#/learn/'+h;};
window.pkSearch=function(){var q=(document.getElementById('pkq')||{}).value;q=String(q||'').trim();if(q)location.hash='#/learn/s/'+encodeURIComponent(q);};

const MEMBER_FEE = 1500;   // 僅供畫面顯示；實際金額由後端固定

function bankInfoHtml() {
  const o = org();
  return '<div class="alert info"><div class="bold">🏦 協會匯款資訊</div>' +
    '<div>銀行：' + esc(o.bankName) + '</div>' +

/** 歷史紀錄的單筆卡片；kind: 'fee' | 'don' */
function historyItemHtml(r, kind) {
  const title = kind === 'fee' ? (esc(r.year) + ' 年度常年會費') : esc(r.purpose);
  const hasReceipt = r.receiptNo && r.receiptNo !== '尚未開立';
  return '<div class="item">' +
    '<div class="row"><span class="title">' + title + '</span><span class="spacer"></span>' + statusBadge(r.status) + '</div>' +
    '<div class="row small muted" style="margin-top:4px"><span>' + fmtMoney(r.amount) + '</span><span>' + esc(fmtDate(r.date)) +
      '</span><span>' + esc(r.method) + '</span></div>' +
    (r.note ? '<div class="small muted">備註：' + esc(r.note) + '</div>' : '') +
    (r.status === '已退回' && r.rejectReason ? '<div class="alert err" style="margin:8px 0 0">退回原因：' + esc(r.rejectReason) + '</div>' : '') +
    (r.status === '已作廢' && r.rejectReason ? '<div class="small muted" style="margin-top:6px">' + esc(r.rejectReason) + '</div>' : '') +
    '<div class="row" style="margin-top:8px">' +
      (hasReceipt ? '<button type="button" class="btn btn-sm btn-purple" data-receipt="' + esc(r.receiptNo) + '">🧾 電子收據</button>' : '') +
      (r.fileUrl ? '<button type="button" class="btn btn-sm btn-outline" data-viewfile="' + esc(r.fileUrl) + '">📎 查看憑證</button>' : '') +
    '</div></div>';
}

function daysUntil(dateStr) {
  if (!dateStr) return null;
  return Math.round((new Date(dateStr + 'T00:00:00') - new Date(todayStr() + 'T00:00:00')) / 86400000);
}

registerMemberPage('news', {
  render: async function (el) {
    const all = (await api('announcement.publicList', {})).items;
    let cat = '全部', kw = '';
    el.innerHTML =
      '<div class="row"><h1 style="margin:0">📢 會務公告</h1><span class="spacer"></span>' +

        return '<button type="button" data-cat="' + c + '" aria-pressed="' + (c === cat) + '">' + c + '</button>';
      }).join('');
      const items = all.filter(function (a) {
        return (cat === '全部' || a.category === cat) &&
          (!kw || (a.title + a.content).toLowerCase().indexOf(kw) !== -1);
      });
      $('#nwList', el).innerHTML = items.length ? items.map(annCardHtml).join('') : emptyHtml('沒有符合的公告', '🔍');
    }

      const ed = e.target.closest('[data-ann-edit]'), dl = e.target.closest('[data-ann-del]');
      if (ed) {
        const a = all.find(function (x) { return x.id === ed.getAttribute('data-ann-edit'); });
        if (a) openAnnForm(a, function () { route(); });
      }
      if (dl) run(dl, async function () {
        const a = all.find(function (x) { return x.id === dl.getAttribute('data-ann-del'); });
        if (!a || !(await confirmDialog('確定刪除公告「' + a.title + '」？', { danger: true, okText: '刪除' }))) return;

        route();
      });

    $('#nwSeg', el).addEventListener('click', function (e) { const b = e.target.closest('[data-cat]'); if (b) { cat = b.getAttribute('data-cat'); draw(); } });
    $('#nwKw', el).addEventListener('input', function (e) { kw = e.target.value.trim().toLowerCase(); draw(); });
    draw();
  }
});

registerMemberPage('fee', {

        '<div id="feErr"></div>' +

        toast('已送出，請等候秘書處確認', 'ok'); goMember('fee');
      });
    });
  }
});

    box.addEventListener('change', async function () {
      if (box.checked) { $('#pfHealth', el).hidden = false; return; }
      if (consent || $('#pfDx', el).value || $('#pfMed', el).value) {
        const ok = await confirmDialog('取消同意後，儲存時會清除您已填寫的健康資料，確定嗎？', { danger: true, okText: '確定取消同意' });
        if (!ok) { box.checked = true; return; }
      }
      $('#pfHealth', el).hidden = true;
    });

    $('#frmProf', el).addEventListener('submit', function (e) {
      e.preventDefault();
      run($('button[type=submit]', e.currentTarget), async function () {
        const err = $('#pfErr', el); err.innerHTML = '';
        const phone = val('pfPhone', el).replace(/\D/g, '');
        if (!val('pfName', el)) { err.innerHTML = alertHtml('請填寫姓名'); $('#pfName', el).focus(); return; }
        if (!/^09\d{8}$/.test(phone)) { err.innerHTML = alertHtml('請輸入正確的手機號碼（例如 0912345678）'); $('#pfPhone', el).focus(); return; }
        const mail = val('pfEmail', el);
        if (mail && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)) { err.innerHTML = alertHtml('Email 格式不正確'); $('#pfEmail', el).focus(); return; }
        const idn = val('pfId', el).toUpperCase();
        if (idn && !/^[A-Z][12]\d{8}$/.test(idn)) { err.innerHTML = alertHtml('身分證字號格式不正確'); $('#pfId', el).focus(); return; }
        const withHealth = box.checked;
        const payload = {
          name: val('pfName', el), nickname: val('pfNick', el), phone: phone, email: mail,
          birthday: val('pfBirth', el), city: val('pfCity', el), address: val('pfAddr', el),
          identity: val('pfIdentity', el), idNumber: idn,
          healthConsent: withHealth ? '同意' : '不同意'
        };
        if (withHealth) Object.assign(payload, {
          diagnosisYear: val('pfDx', el), doctor: val('pfDoc', el), hospital: val('pfHos', el),
          medication: val('pfMed', el), surgery: val('pfSur', el), specialNeeds: val('pfNeed', el)
        });
        try {
          const r = await api('member.updateProfile', payload);
          setMember(r.member, r.webProfile);
        } catch (x) { err.innerHTML = alertHtml(x.message); return; }
        drawNavigation();
        toast('資料已儲存', 'ok'); goMember('profile');
      });
    });
  }
});

    fieldHtml({ id: 'mfPhone', label: '手機號碼', required: true, value: m.phone, inputmode: 'numeric', maxlength: 12, placeholder: '0912345678' }) +
    fieldHtml({ id: 'mfEmail', label: 'Email', type: 'email', value: m.email, maxlength: 100 }) +
    fieldHtml({ id: 'mfAddr', label: '通訊地址', value: m.address, maxlength: 200 }) +
    fieldHtml({ id: 'mfType', label: '會員類型', type: 'select', required: true, options: assignableTypes(), value: m.type || '一般會員',
      hint: isSuper() ? '管理角色決定系統權限，請謹慎指派。' : '只有「管理員」可以指派管理角色。' }) +

function readMemberForm(m, isNew) {
  const phone = val('mfPhone', m.el).replace(/\D/g, '');
  if (!val('mfName', m.el)) throw new Error('請填寫姓名');
  if (!/^09\d{8}$/.test(phone)) throw new Error('請輸入正確的手機號碼（例如 0912345678）');
  const o = { name: val('mfName', m.el), phone: phone, email: val('mfEmail', m.el), address: val('mfAddr', m.el), type: val('mfType', m.el) };
  if (!isNew) o.expiryDate = val('mfExp', m.el);
  return o;
}

async function openMemberDetail(id, canEdit) {

  const hasHealth = m.diagnosisYear !== undefined;
  const row = function (k, v) { return '<tr><th scope="row" style="text-align:left;width:34%">' + esc(k) + '</th><td>' + esc(v || '—') + '</td></tr>'; };

  if (hasHealth) health = '<h3>🩺 健康資料</h3><div class="table-wrap"><table class="tbl"><tbody>' +
    row('確診年份', m.diagnosisYear) + row('主治醫師', m.doctor) + row('就診醫院', m.hospital) +
    row('用藥狀況', m.medication) + row('手術記錄', m.surgery) + row('特殊需求', m.specialNeeds) + '</tbody></table></div>' +
    '<p class="small muted">此為敏感個資，查閱紀錄會寫入系統日誌，請勿外流。</p>';
  else if (m.healthConsent !== '同意') health = '<div class="alert info">此會員未同意提供健康資料。</div>';
  else health = '<div class="alert info">此會員已同意提供健康資料，但您的角色（' + esc(S.role) + '）沒有查閱權限。</div>';

  const md = openModal({
    title: m.name, wide: true,
    body: '<div class="row" style="margin-bottom:8px">' + (m.isActive ? '<span class="badge dot b-ok">會籍有效</span>' : '<span class="badge dot b-gray">會籍未生效</span>') +
      '<span class="badge b-info">' + esc(m.type) + '</span></div>' +
      '<div class="table-wrap"><table class="tbl"><tbody>' +
        row('會員編號', m.memberId) + row('暱稱', m.nickname) + row('手機', m.phone) + row('Email', m.email) + row('生日', fmtDate(m.birthday) === '—' ? '' : fmtDate(m.birthday)) +
        row('地址', m.address) + row('入會日期', fmtDate(m.joinDate)) + row('會籍到期日', m.type === '永久會員' ? '永久' : fmtDate(m.expiryDate)) +
        row('累計會費', fmtMoney(m.totalFee)) + row('累計捐款', fmtMoney(m.totalDonation)) +
        row('LINE', m.lineId ? ('已綁定（' + (m.lineName || '') + '）') : '未綁定') + '</tbody></table></div>' + health,
    footer: '<button type="button" class="btn btn-gray" data-close>關閉</button>' +
      (can('FIN_CLERK') ? '<button type="button" class="btn btn-outline" data-payadd>臨櫃登錄會費</button>' : '') +
      (canEdit ? '<button type="button" class="btn" data-edit>編輯</button>' : '')
  });
  const pa = md.$('[data-payadd]'); if (pa) pa.addEventListener('click', function () { md.close(); openPaymentAdd(m); });
  const ed = md.$('[data-edit]'); if (ed) ed.addEventListener('click', function () { md.close(); openMemberEdit(m); });
}

function openMemberEdit(m0) {
  const typeChanged = function () { return val('mfType', m.el) !== m0.type; };

function reviewPage(o) {
  return async function (el) {
    const items = (await api(o.listAction, {})).items;
    el.innerHTML =
      '<div class="row"><h1 style="margin:0">' + o.title + '</h1><span class="spacer"></span>' +
      '<button type="button" class="btn btn-outline" id="rvAdd">＋ 臨櫃登錄</button></div>' +
      '<div class="alert info" style="margin-top:12px">確認入帳後，系統會自動開立電子收據、記入流水帳並更新帳戶餘額。<br>請先核對憑證與銀行入帳，再按「確認入帳」。</div>' +
      '<p class="muted small" aria-live="polite">待處理：' + items.length + ' 件</p>' +
      (items.length ? items.map(function (r) { return reviewCardHtml(r, o.kind); }).join('') : emptyHtml('目前沒有待處理的申請', '✅'));

    $('#rvAdd', el).addEventListener('click', function () { o.kind === 'fee' ? openPaymentAdd(null) : openDonationAdd(); });
    el.addEventListener('click', function (e) {
      const c = e.target.closest('[data-confirm]'), j = e.target.closest('[data-reject]');
      if (c) run(c, async function () {
        const id = c.getAttribute('data-confirm'), r = items.filter(function (x) { return x.id === id; })[0];
        if (!(await confirmDialog('確認收到 ' + r.name + ' 的 ' + fmtMoney(r.amount) + '？\n按下後會立即入帳並開立收據。', { okText: '確認入帳' }))) return;
        const res = await api(o.confirmAction, { id: id });
        toast('已入帳，收據編號 ' + res.receiptNo, 'ok'); reloadAdmin();
      });
      if (j) run(j, async function () {
        const reason = await askReason('退回申請', '退回原因（會顯示給會員）', '確定退回');
        if (!reason) return;
        await api(o.rejectAction, { id: j.getAttribute('data-reject'), reason: reason });
        toast('已退回', 'ok'); reloadAdmin();
      });
    });
  };
}

/* ---------- 共用 ---------- */
async function loadRefs() {
  const r = await Promise.all([
    api('subject.list', {}, { silent: true }), api('account.list', {}, { silent: true }), api('project.list', {}, { silent: true })
  ]);
  return { subjects: r[0].items, accounts: r[1].items, projects: r[2].items };
}
function subjectOptions(subjects, type) {
  return subjects.filter(function (s) { return !type || s.type === type; })
    .map(function (s) { return { value: s.code, label: s.code + ' ' + s.name }; });
}
function accountOptions(accounts) {
  return accounts.map(function (a) { return { value: a.name, label: a.name + '（餘額 ' + fmtMoney(a.balance) + '）' }; });
}
function projectOptions(projects, blankLabel) {
  return [{ value: '', label: blankLabel || '（無專案）' }].concat(projects.map(function (p) { return { value: p.name, label: p.name }; }));
}
function intAmount(txt) {
  const t = String(txt).replace(/,/g, '').trim();
  if (!/^\d+$/.test(t) || Number(t) <= 0) throw new Error('請輸入大於 0 的整數金額');
  return Number(t);
}
function simpleTable(cols, rows, foot) {
  return '<div class="table-wrap"><table class="tbl"><thead><tr>' +
    cols.map(function (c) { return '<th' + (c.num ? ' class="num"' : '') + '>' + esc(c.h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
    (rows.length ? rows.map(function (r) {
      return '<tr>' + cols.map(function (c) {
        const v = c.f ? c.f(r) : r[c.k];
        return '<td' + (c.num ? ' class="num"' : '') + '>' + (c.raw ? v : esc(v == null ? '' : v)) + '</td>';
      }).join('') + '</tr>';
    }).join('') : '<tr><td colspan="' + cols.length + '" class="muted center">沒有資料</td></tr>') +
    '</tbody>' + (foot ? '<tfoot>' + foot + '</tfoot>' : '') + '</table></div>';
}
function openForm(o) {   // o: {title, body, okText, onSubmit:async(m)=>void, wide}
  const m = openModal({
    title: o.title, static: true, wide: o.wide, body: '<form novalidate>' + o.body + '<div id="fmErr" style="margin-top:10px"></div></form>',
    footer: '<button type="button" class="btn btn-gray" data-close>取消</button><button type="button" class="btn" data-ok>' + esc(o.okText || '儲存') + '</button>'
  });
  m.$('[data-ok]').addEventListener('click', function (e) {
    run(e.currentTarget, async function () {
      try { await o.onSubmit(m); } catch (x) { m.$('#fmErr').innerHTML = alertHtml(x.message); return; }
      m.close(true);
    });
  });
  return m;
}

registerAdminPage({

  badge: function (d) { return d.pending.expenses + d.pending.toPay; },
  render: async function (el) {
    const items = (await api('expense.list', {})).items;
    let flt = '待處理';
    const canApply = can('EXP_APPLY');
    const filters = ['待處理', '待核准', '已核准', '已撥款', '已退回', '全部'];

    el.innerHTML =
      '<div class="row"><h1 style="margin:0">支出管理</h1><span class="spacer"></span>' +
      (canApply ? '<button type="button" class="btn" id="exAdd">＋ 申請支出</button>' : '') + '</div>' +
      '<div class="alert info" style="margin-top:12px">流程：<b>申請 → 核准 → 撥款</b>。' +
        (ADMIN_BYPASS_SOD && isSuper() ? '您是管理員，可自行完成整個流程。' : '內部控制：三個步驟必須由不同人執行。') + '<br>' +
        '每筆支出都可列印「支出憑證單」，黏貼發票後交會計歸檔。</div>' +
      '<div class="seg" id="exSeg" role="group" aria-label="支出狀態篩選"></div>' +
      '<div id="exList" aria-live="polite"></div>';

    function card(e) {
      const me = S.member.memberId;
      const showApprove = e.status === '待核准' && can('EXP_APPROVE') && sodOk(e.applicantId === me);
      const showPay = e.status === '已核准' && can('EXP_PAY') && sodOk(e.applicantId === me || e.approvedById === me);
      const showReject = (e.status === '待核准' || e.status === '已核准') && can('EXP_REJECT_UI');
      return '<div class="item"><div class="row"><span class="title">' + esc(e.payee) + '</span>' + statusBadge(e.status) +
        '<span class="spacer"></span><span class="bold" style="font-size:1.15rem">' + fmtMoney(e.amount) + '</span></div>' +
        '<div class="small">' + esc(e.description) + '</div>' +
        '<div class="small muted">' + esc(e.id) + '｜' + esc(fmtDate(e.date)) + '｜' + esc(e.subjectCode + ' ' + e.subjectName) +
          (e.projectName ? '｜專案：' + esc(e.projectName) : '') + '</div>' +
        '<div class="small muted">付款帳戶：' + esc(e.account) + '｜受款帳號：' + esc(e.payeeAccount) + '</div>' +
        '<div class="small muted">申請：' + esc(e.applicant) + (e.approvedBy ? '｜核准：' + esc(e.approvedBy) : '') +
          (e.paidBy ? '｜撥款：' + esc(e.paidBy) : '') + (e.voucherNo !== '--' ? '｜傳票：' + esc(e.voucherNo) : '') + '</div>' +
        (e.rejectReason ? '<div class="alert err" style="margin:8px 0 0">退回原因：' + esc(e.rejectReason) + '</div>' : '') +
        '<div class="row" style="margin-top:10px">' +
          '<button type="button" class="btn btn-sm btn-purple" data-vdoc="' + esc(e.id) + '">🖨️ 支出憑證單</button>' +
          (e.fileUrl ? '<button type="button" class="btn btn-sm btn-outline" data-viewfile="' + esc(e.fileUrl) + '">📎 附件</button>' : '') +
          '<span class="spacer"></span>' +
          (showReject ? '<button type="button" class="btn btn-sm btn-danger" data-rej="' + esc(e.id) + '">退回</button>' : '') +
          (showApprove ? '<button type="button" class="btn btn-sm" data-app="' + esc(e.id) + '">核准</button>' : '') +
          (showPay ? '<button type="button" class="btn btn-sm" data-pay="' + esc(e.id) + '">確認撥款</button>' : '') +
        '</div></div>';
    }
    function draw() {
      $('#exSeg', el).innerHTML = filters.map(function (f) { return '<button type="button" data-f="' + f + '" aria-pressed="' + (f === flt) + '">' + f + '</button>'; }).join('');
      const list = items.filter(function (e) {
        return flt === '全部' || (flt === '待處理' ? (e.status === '待核准' || e.status === '已核准') : e.status === flt);
      });
      $('#exList', el).innerHTML = list.length ? list.map(card).join('') : emptyHtml('沒有符合的支出', '🧾');
    }
    draw();
    $('#exSeg', el).addEventListener('click', function (e) { const b = e.target.closest('[data-f]'); if (b) { flt = b.getAttribute('data-f'); draw(); } });
    if (canApply) $('#exAdd', el).addEventListener('click', openExpenseApply);

    el.addEventListener('click', function (e) {
      const v = e.target.closest('[data-vdoc]'), a = e.target.closest('[data-app]'), r = e.target.closest('[data-rej]'), p = e.target.closest('[data-pay]');
      const find = function (id) { return items.filter(function (x) { return x.id === id; })[0]; };
      if (v) run(v, function () { return showExpenseVoucher(v.getAttribute('data-vdoc')); });
      if (a) run(a, async function () {
        const x = find(a.getAttribute('data-app'));
        if (!(await confirmDialog('核准 ' + x.payee + ' 的支出 ' + fmtMoney(x.amount) + '？\n' + x.description, { okText: '核准' }))) return;
        await api('expense.approve', { id: x.id }); toast('已核准', 'ok'); reloadAdmin();
      });
      if (r) run(r, async function () {
        const reason = await askReason('退回支出申請', '退回原因', '確定退回'); if (!reason) return;
        await api('expense.reject', { id: r.getAttribute('data-rej'), reason: reason }); toast('已退回', 'ok'); reloadAdmin();
      });
      if (p) run(p, async function () {
        const x = find(p.getAttribute('data-pay'));
        if (!(await confirmDialog('確認從「' + x.account + '」撥款 ' + fmtMoney(x.amount) + ' 給 ' + x.payee + '？\n撥款後會扣除帳戶餘額並產生傳票，無法復原。', { okText: '確認撥款', danger: true }))) return;
        const res = await api('expense.confirmPaid', { id: x.id });
        toast('已撥款，傳票 ' + res.voucherNo, 'ok'); await reloadAdmin();
        if (await confirmDialog('是否現在列印支出憑證單？', { okText: '列印' })) showExpenseVoucher(x.id);
      });
    });
  }
});

      fieldHtml({ id: 'exAcc', label: '付款帳戶', type: 'select', required: true, options: accountOptions(ref.accounts) }) +
      fieldHtml({ id: 'exPayee', label: '受款人／單位', required: true, maxlength: 80 }) +
      fieldHtml({ id: 'exPAcc', label: '受款銀行與帳號', required: true, maxlength: 120, hint: '現金請寫「現金」。' }) +
      '</div>' + fieldHtml({ id: 'exDesc', label: '用途說明', type: 'textarea', required: true, maxlength: 200 }) +
      fieldHtml({ id: 'exProj', label: '專案（選填）', type: 'select', options: projectOptions(ref.projects) }) +
      fieldHtml({ id: 'exFile', label: '發票或單據（選填，支援任意圖片或檔案格式）', type: 'file', accept: '*/*' }),
    onSubmit: async function (m) {
      const amt = intAmount(val('exAmt', m.el));

      const file = await filePayload($('#exFile', m.el));

      toast('已送出申請 ' + r.id, 'ok');
      if (r.budgetWarning) toast('⚠️ ' + r.budgetWarning, 'info');
      reloadAdmin();
    }
  });

    el.innerHTML = '<h1>收據管理</h1>' +
      '<div class="alert info">收據以<b>電子收據</b>為主。點「電子收據」可寄送 Email 或下載 PDF；列印紙本僅作備用。</div>' +

    function draw() {

      const list = all.filter(function (r) { return (st === '全部' || r.status === st) && (!kw || (r.receiptNo + r.name + r.item).toLowerCase().indexOf(kw) !== -1); }).slice(0, 200);

        { h: '金額', num: true, f: function (r) { return fmtMoney(r.amount); } }, { h: '狀態', raw: true, f: function (r) { return statusBadge(r.status); } },
        { h: '操作', raw: true, f: function (r) {
          return '<button type="button" class="btn btn-sm btn-purple" data-receipt="' + esc(r.receiptNo) + '">電子收據</button>' +
            (r.status === '有效' && can('RECEIPT_VOID') ? ' <button type="button" class="btn btn-sm btn-danger" data-void="' + esc(r.receiptNo) + '">作廢</button>' : '') +

/* =========================================================================
   九大財務報表
   ========================================================================= */
const REPORTS = [
  ['incomeExpenseStatement', '收支餘絀表'], ['ledger', '分類帳'], ['journal', '日記簿'], ['budgetComparison', '預算與決算比較表'],
  ['fundraising', '勸募活動收支報告'], ['bankReconciliation', '銀行存款調節表'], ['balanceSheet', '資產負債表（現金基礎）'],
  ['netAssetChanges', '淨資產變動表'], ['cashFlow', '現金流量表']
];
function periodText(y, m) { return '中華民國 ' + (y - 1911) + ' 年' + (m ? ' ' + m + ' 月' : '度'); }
function rptTbl(cols, rows, foot) {
  return '<table style="width:100%;border-collapse:collapse;font-size:.92rem"><thead><tr>' + cols.map(function (c) {
    return '<th style="background:#f1f5f9;border:1px solid #94a3b8;padding:6px 8px;text-align:' + (c.num ? 'right' : 'left') + '">' + esc(c.h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
    (rows.length ? rows.map(function (r) { return '<tr>' + cols.map(function (c) {
      const v = c.f(r); return '<td style="border:1px solid #cbd5e1;padding:6px 8px;text-align:' + (c.num ? 'right' : 'left') + (c.bold ? ';font-weight:900' : '') + '">' + esc(v) + '</td>'; }).join('') + '</tr>'; }).join('')
      : '<tr><td colspan="' + cols.length + '" style="border:1px solid #cbd5e1;padding:8px;text-align:center;color:#64748b">本期無資料</td></tr>') +
    '</tbody>' + (foot || '') + '</table>';
}
function rptFoot(cells) { return '<tfoot><tr>' + cells.map(function (c, i) { return '<td style="border:1px solid #94a3b8;padding:6px 8px;font-weight:900;background:#f8fafc;text-align:' + (i ? 'right' : 'left') + '">' + esc(c) + '</td>'; }).join('') + '</tr></tfoot>'; }
const M = fmtMoney;

function buildReportHtml(type, r, meta) {
  const name = REPORTS.filter(function (x) { return x[0] === type; })[0][1];
  let body = '';
  if (type === 'incomeExpenseStatement') {
    const cs = [{ h: '科目', f: function (x) { return x.subjectCode + ' ' + x.subjectName; } }, { h: '金額', num: true, f: function (x) { return M(x.amount); } }];
    body = '<h3>收入</h3>' + rptTbl(cs, r.income, rptFoot(['收入合計', M(r.totalIncome)])) + '<h3 style="margin-top:14px">支出</h3>' + rptTbl(cs, r.expense, rptFoot(['支出合計', M(r.totalExpense)])) +
      '<h3 style="margin-top:14px">本期' + (r.surplus >= 0 ? '賸餘' : '短絀') + '：' + esc(M(r.surplus)) + '</h3>';
  } else if (type === 'ledger') {
    body = '<p>期初餘額：<b>' + esc(M(r.openingBalance)) + '</b></p>' + rptTbl([{ h: '日期', f: function (x) { return x.date; } }, { h: '科目', f: function (x) { return x.subjectCode + ' ' + x.subjectName; } },
      { h: '摘要', f: function (x) { return x.description; } }, { h: '收入', num: true, f: function (x) { return x.debit ? M(x.debit) : ''; } }, { h: '支出', num: true, f: function (x) { return x.credit ? M(x.credit) : ''; } },
      { h: '餘額', num: true, f: function (x) { return M(x.balance); } }], r.items, rptFoot(['期末餘額', '', '', '', '', M(r.endingBalance)]));
  } else if (type === 'journal') {
    body = rptTbl([{ h: '日期', f: function (x) { return x.date; } }, { h: '單號', f: function (x) { return x.refNo; } }, { h: '科目', f: function (x) { return x.subjectCode + ' ' + x.subjectName; } },
      { h: '摘要', f: function (x) { return x.description; } }, { h: '借方', num: true, f: function (x) { return x.debit ? M(x.debit) : ''; } }, { h: '貸方', num: true, f: function (x) { return x.credit ? M(x.credit) : ''; } }], r.items);
  } else if (type === 'budgetComparison') {
    body = rptTbl([{ h: '科目', f: function (x) { return x.subjectName; } }, { h: '預算', num: true, f: function (x) { return M(x.budgetAmt); } }, { h: '決算（年度累計）', num: true, f: function (x) { return M(x.usedAmt); } },
      { h: '執行率', num: true, f: function (x) { return x.rate + '%'; } }, { h: '差異', num: true, f: function (x) { return M(x.remainAmt); } }], r.items);
  } else if (type === 'fundraising') {
    body = rptTbl([{ h: '日期', f: function (x) { return x.date; } }, { h: '捐款人', f: function (x) { return x.name; } }, { h: '用途', f: function (x) { return x.purpose; } },
      { h: '收據編號', f: function (x) { return x.receiptNo; } }, { h: '金額', num: true, f: function (x) { return M(x.amount); } }], r.items, rptFoot(['合計', '', '', '', M(r.totalAmount)]));
  } else if (type === 'bankReconciliation') {
    const line = function (k, v) { return '<tr><td style="border:1px solid #cbd5e1;padding:7px 8px">' + esc(k) + '</td><td style="border:1px solid #cbd5e1;padding:7px 8px;text-align:right">' + esc(v) + '</td></tr>'; };
    body = r.provided
      ? '<table style="width:100%;border-collapse:collapse"><tbody>' + line('銀行對帳單餘額', M(r.bankBalance)) + line('加：在途存款', M(r.depositsInTransit)) + line('減：未兌現支票／在途付款', M(r.outstandingChecks)) +
        line('調整後銀行餘額', M(r.adjustedBank)) + line('帳面餘額（系統流水帳）', M(r.bookBalance)) + line('差異（應為 0）', M(r.diff)) + '</tbody></table>' +
        (r.diff === 0 ? '<div class="alert ok" style="margin-top:10px">✅ 調節後相符。</div>' : '<div class="alert err" style="margin-top:10px">⚠️ 尚有差異 ' + esc(M(r.diff)) + '，請檢查未記錄的收支或手續費。</div>')
      : '<div class="alert warn">請在上方輸入「銀行對帳單餘額」後再查詢，才能進行調節。</div>' + rptTbl([{ h: '帳面餘額（系統）', f: function () { return M(r.bookBalance); } }], [1]);
    body += '<h3 style="margin-top:14px">各帳戶帳面餘額</h3>' + rptTbl([{ h: '帳戶', f: function (x) { return x.name; } }, { h: '帳面餘額', num: true, f: function (x) { return M(x.bookBalance); } }], r.accounts) +
      (r.systemConsistent === false ? '<div class="alert err" style="margin-top:10px">⚠️ 「資金帳戶」記錄的目前餘額（' + esc(M(r.systemBalance)) + '）與流水帳計算不一致，請管理員檢查。</div>' : '');
  } else if (type === 'balanceSheet') {
    const cs = [{ h: '項目', f: function (x) { return x.name; } }, { h: '金額', num: true, f: function (x) { return M(x.amount); } }];
    body = '<h3>資產</h3>' + rptTbl(cs, r.assets, rptFoot(['資產總計', M(r.totalAssets)])) + '<h3 style="margin-top:14px">負債</h3>' + rptTbl(cs, r.liabilities, rptFoot(['負債總計', M(r.totalLiabilities)])) +
      '<h3 style="margin-top:14px">淨資產</h3>' + rptTbl(cs, r.netAssets, rptFoot(['淨資產總計', M(r.totalNetAssets)])) + '<div class="report-note">' + esc(r.note) + '</div>';
  } else if (type === 'netAssetChanges') {
    body = rptTbl([{ h: '項目', f: function (x) { return x.name; } }, { h: '期初', num: true, f: function (x) { return M(x.initAmt); } }, { h: '本期增加', num: true, f: function (x) { return M(x.addAmt); } },
      { h: '本期減少', num: true, f: function (x) { return M(x.decAmt); } }, { h: '期末', num: true, f: function (x) { return M(x.endAmt); } }], r.items) +
      '<div class="report-note">現金基礎：期初含帳戶初始餘額與之前累計收支。</div>';
  } else if (type === 'cashFlow') {
    body = rptTbl([{ h: '項目', f: function (x) { return (x.level ? '　　' : '') + x.name; } }, { h: '金額', num: true, f: function (x) { return x.amount === undefined ? '' : M(x.amount); } }], r.items);
  }
  return '<div class="report-print" style="background:#fff;padding:14px;color:#14202b">' +
    '<div class="report-head"><h2>' + esc(ORG_TITLE) + '</h2><h2>' + esc(name) + '</h2><div class="small">' + esc(periodText(meta.year, meta.month)) +
      (meta.project ? '｜專案：' + esc(meta.project) : '') + '</div></div>' + body +
    '<div class="report-note">列印時間：' + esc(todayStr()) + '　製表：' + esc(S.member.name) + '。本表為系統依流水帳自動產生，供內部參考；正式申報請經會計人員核對。</div></div>';
}

          p.bankBalance = num('rpBal'); p.depositsInTransit = num('rpDep') || 0; p.outstandingChecks = num('rpChk') || 0;
