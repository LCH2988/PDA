async function api(action,params={}) {
  if (!/^https:\/\//.test(API_URL)) throw new Error('請設定正確的 API_URL');
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(),90000);
  try {
    const response = await fetch(API_URL,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action,params,idToken}),
      signal:controller.signal
    });
    if (!response.ok) throw new Error('後端 HTTP 錯誤：' + response.status);
    let result;
    try { result = JSON.parse(await response.text()); }
    catch { throw new Error('後端未回傳 JSON，請確認 /exec 部署允許所有人存取'); }
    if (!result || typeof result.ok !== 'boolean') throw new Error('後端回應格式不正確');
    if (!result.ok) {
      if (result.code === 'AUTH_INVALID') {
        ME = null; idToken = null; drawNavigation();
        throw new Error('登入已過期，請再按一次「使用 LINE 登入」');
      }
      throw new Error(result.message || '後端處理失敗');
    }
    return result.data;
  } catch(e) {
    if (e.name === 'AbortError') throw new Error('請求逾時。寫入可能已成功，請先更新紀錄確認，不要立即重複送出');
    if (e instanceof TypeError) throw new Error('無法連線。若剛才正在送出資料，請先更新紀錄確認是否成功');
    throw e;
  } finally { clearTimeout(timer); }
}
async function initLiff() {
  if (!LIFF_ID) return;
  try {
    if (!window.liff) throw new Error('LINE LIFF 元件載入失敗');
    await liff.init({liffId:LIFF_ID});
    liffReady = true;
    if (!liff.isLoggedIn()) return;
    idToken = liff.getIDToken();
    if (!idToken) throw new Error('無法取得 ID Token，請啟用 LIFF openid scope');
    ME = await api('login');
  } catch(e) {
    ME = null; idToken = null;
    console.error(e); toast(e.message);
  }
}

const tiles = list => '<div class="cards">' + list.map(([i,l,h,d]) => {
  const href = h === 'EXT' ? extUrl() : h, ext = /^https?:/.test(href);
  return `<a class="tile" href="${esc(href)}"${ext?' target="_blank" rel="noopener noreferrer" data-ext':''}><span>${i}</span>${esc(l)}${d?`<small>${esc(d)}</small>`:''}</a>`;

/* 後台文字寫法:空一行=新段落;「- 」開頭=項目符號;「## 」開頭=小標題 (逐行解析) */
function rich(t) {
  const out = []; let p = [], l = [];
  const fp = () => { if (p.length) { out.push('<p>' + p.map(esc).join('<br>') + '</p>'); p = []; } };
  const fl = () => { if (l.length) { out.push('<ul>' + l.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>'); l = []; } };
  String(t || '').split(/\r?\n/).forEach(line => {
    if (!line.trim()) { fp(); fl(); return; }
    if (/^## /.test(line)) { fp(); fl(); out.push('<h3>' + esc(line.slice(3)) + '</h3>'); return; }
    if (/^- /.test(line)) { fp(); l.push(line.slice(2)); return; }
    fl(); p.push(line);
  });
  fp(); fl();
  return out.join('');
}

function editFieldHtml(f,row) {
  const id='edit_'+f.key,v=row[f.key]??'';
  if(f.type==='textarea')return `<label for="${id}">${esc(f.label)}</label><textarea id="${id}" data-field="${f.key}" rows="${f.key==='content'?10:5}" maxlength="20000">${esc(v)}</textarea>`;
  if(f.type==='select')return `<label for="${id}">${esc(f.label)}</label><select id="${id}" data-field="${f.key}">${options(f.choices,v)}</select>`;
  if(f.type==='checkbox')return `<label><input id="${id}" data-field="${f.key}" type="checkbox" ${yes(v)?'checked':''}>${esc(f.label)}</label>`;
  if(['image','pdf','urlpdf'].includes(f.type)){
    const accept=f.type==='image'?'image/jpeg,image/png,image/webp':'application/pdf';
    return `<label for="${id}">${esc(f.label)}</label>${
      f.type==='urlpdf'?`<input id="${id}" data-field="${f.key}" type="url" value="${esc(v)}" placeholder="https://…">`:''
    }<input id="file_${f.key}" type="file" accept="${accept}" data-upload="${f.key}">
    <div class="muted" id="uploadStatus_${f.key}">${v?'已有檔案／連結':''}</div>
    <div class="up-preview" id="preview_${f.key}">${f.type==='image'&&v?`<img src="${esc(imageUrl(v))}" alt="封面預覽">`:''}
    ${v?btn('remove-upload','移除','btn gh sm',{field:f.key}):''}</div>`;
  }
  const extra=f.key===cfgFirstKey()?'required maxlength="200"':f.type==='number'?'min="1" step="1"':'';
  return `<label for="${id}">${esc(f.label)}</label><input id="${id}" data-field="${f.key}" type="${f.type}" value="${esc(f.type==='date'?fmtD(v):v)}" ${extra}>`;
}

async function readFile(file,isImage) {
  if(!isImage)return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve({base64:String(r.result).split(',')[1],mime:'application/pdf',name:file.name});
    r.onerror=()=>reject(new Error('無法讀取檔案'));
    r.readAsDataURL(file);
  });
  const url=URL.createObjectURL(file);
  try {
    const im=await new Promise((resolve,reject)=>{
      const x=new Image();x.onload=()=>resolve(x);x.onerror=()=>reject(new Error('無法讀取圖片'));x.src=url;
    });
    if(!im.width||!im.height||im.width*im.height>60000000)throw new Error('圖片尺寸過大或無效');
    const scale=Math.min(1,1600/Math.max(im.width,im.height));
    const cv=document.createElement('canvas');
    cv.width=Math.max(1,Math.round(im.width*scale));cv.height=Math.max(1,Math.round(im.height*scale));
    const ctx=cv.getContext('2d');
    ctx.fillStyle='#ffffff';ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(im,0,0,cv.width,cv.height);
    return {base64:cv.toDataURL('image/jpeg',.85).split(',')[1],mime:'image/jpeg',name:file.name.replace(/\.[^.]+$/,'')+'.jpg'};
  } finally {URL.revokeObjectURL(url);}
}
async function uploadFile(el) {
  const state=modalState,file=el.files?.[0];
  if(!state||!file)return;
  if(state.uploading||state.saving)throw new Error('請等待目前操作完成');
  const cfg=ADMIN_CONFIG[state.sheet],f=cfg.fields.find(x=>x.key===el.dataset.upload);
  if(!f)throw new Error('上傳欄位不正確');
  const isImage=f.type==='image',allowed=isImage?['image/jpeg','image/png','image/webp']:['application/pdf'];
  if(!allowed.includes(file.type))throw new Error(isImage?'只支援 JPG／PNG／WebP':'只支援 PDF');
  if(file.size>(isImage?20:8)*1024*1024)throw new Error(isImage?'原圖不可超過 20MB':'PDF 不可超過 8MB');
  state.uploading=true;
  $('#modalSave').disabled=true;
  $('#modalContent').querySelectorAll('[data-upload]').forEach(x=>x.disabled=true);
  const status=$('#uploadStatus_'+f.key);
  status.textContent='上傳中…';
  try {
    const data=await readFile(file,isImage);
    const result=await api('admin_uploadFile',{folder:cfg.folder,...data});
    state.row[f.key]=isImage?result.id:result.url;
    if(modalState!==state)return;
    status.textContent='✅ 已上傳：'+data.name;
    if(f.type==='urlpdf')$('#edit_'+f.key).value=result.url;
    $('#preview_'+f.key).innerHTML=(isImage?`<img src="${esc(imageUrl(result.id))}" alt="封面預覽">`:'')+
      btn('remove-upload','移除','btn gh sm',{field:f.key});
  } catch(e) {if(status.isConnected)status.textContent='❌ 上傳失敗';throw e;}
  finally {
    state.uploading=false;
    if(modalState===state){
      $('#modalSave').disabled=false;
      $('#modalContent').querySelectorAll('[data-upload]').forEach(x=>x.disabled=false);
    }
    el.value='';
  }
}
function exportCsv() {
  const rows=filteredRows().map(x=>x.r);
  const cell=(v,text=false)=>{
    let s=String(v??'');
    if(text||/^[\s\u0000-\u001f]*[=+\-@]/.test(s))s="'"+s;
    return '"'+s.replace(/"/g,'""')+'"';
  };
  const head=['報名時間','活動','姓名','電話','同行人數','備註','狀態'];
  const lines=[head.map(x=>cell(x)).join(','),...rows.map(r=>[
    cell(r.createdAt),cell(r.eventTitle),cell(r.name),cell(r.phone,true),cell(r.companions),cell(r.note),cell(r.status)
  ].join(','))];
  const url=URL.createObjectURL(new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a');a.href=url;a.download='報名名單_'+todayTW()+'.csv';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast(`已匯出 ${rows.length} 筆；請妥善保管個資。電話匯入時請指定文字格式`);
}

let ckEvent='',scanner=null,scannerRunning=false,cameraQueue=Promise.resolve(),qrLibPromise=null;
let ckBusy=false,ckSeq=0,lastCode='',lastAt=0,audioContext=null;
function queueCamera(fn) {
  cameraQueue=cameraQueue.catch(()=>{}).then(fn);
  return cameraQueue;
}
function loadScannerLib() {
  if(window.Html5Qrcode)return Promise.resolve();
  if(qrLibPromise)return qrLibPromise;
  qrLibPromise=new Promise((resolve,reject)=>{
    const script=document.createElement('script');
    script.src='https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
    script.crossOrigin='anonymous';
    script.onload=()=>window.Html5Qrcode?resolve():reject(new Error('掃描元件無法初始化'));
    script.onerror=()=>reject(new Error('掃描元件載入失敗'));
    document.head.appendChild(script);
  }).catch(e=>{qrLibPromise=null;throw e;});
  return qrLibPromise;
}
async function stopCameraNow() {
  const current=scanner;scanner=null;
  if(current){
    try {if(scannerRunning)await current.stop();}
    catch(e){console.warn(e);}
    finally {try {current.clear();} catch {}}
  }
  scannerRunning=false;
  $('#cameraBtn').textContent='📷 開啟相機掃描';
}
function stopCamera(){return queueCamera(stopCameraNow);}
function toggleCamera() {
  return queueCamera(async()=>{
    if(scanner)return stopCameraNow();
    if($('#ck').hidden||!ckEvent)throw new Error('請先選擇活動');
    if(!window.isSecureContext)throw new Error('相機需要 HTTPS');
    await loadScannerLib();
    if($('#ck').hidden)return;
    const current=new Html5Qrcode('ckReader');
    scanner=current;
    try {
      await current.start({facingMode:'environment'},{
        fps:8,qrbox:(w,h)=>({width:Math.min(230,w-30,h-30),height:Math.min(230,w-30,h-30)})
      },code=>safely(()=>submitCheckin(code)));
      scannerRunning=true;
      if($('#ck').hidden){await stopCameraNow();return;}
      $('#cameraBtn').textContent='⏹ 關閉相機';
    } catch(e) {
      await stopCameraNow();
      throw new Error('無法開啟相機，請確認瀏覽器相機權限；也可使用手動報到碼');
    }
  });
}
function beep(ok) {
  try {
    const C=window.AudioContext||window.webkitAudioContext;
    if(!C)return;
    audioContext ||= new C();
    const o=audioContext.createOscillator(),g=audioContext.createGain();
    g.gain.value=.06;o.frequency.value=ok?880:220;
    o.connect(g);g.connect(audioContext.destination);o.start();
    o.stop(audioContext.currentTime+(ok?.12:.28));
    o.onended=()=>{o.disconnect();g.disconnect();};
    audioContext.resume().catch(()=>{});
  } catch {}
  try {navigator.vibrate?.(ok?80:[160,80,160]);}catch{}
}
async function refreshCheckin() {
  const seq=++ckSeq,list=await api('admin_checkinEvents');
  if(seq!==ckSeq||$('#ck').hidden)return;
  if(!list.some(e=>e.id===ckEvent))ckEvent=list[0]?.id||'';
  const sel=$('#ckEvent');sel.replaceChildren();
  if(!list.length)sel.add(new Option('目前沒有可簽到活動（活動日前後 1 天內才可簽到）',''));
  list.forEach(e=>sel.add(new Option(fmtD(e.date)+'　'+e.title,e.id)));
  sel.value=ckEvent;sel.disabled=!list.length||ckBusy;
  const e=list.find(x=>x.id===ckEvent);
  $('#ckArrived').textContent=e?.arrived??0;$('#ckTotal').textContent=e?.total??0;
  $('#cameraBtn').disabled=!list.length||busy.has('camera');
}
async function submitCheckin(raw) {
  const code=String(raw||'').trim();
  if(!code||ckBusy||$('#ck').hidden)return;
  if(!ckEvent)throw new Error('請先選擇活動');
  if(code===lastCode&&Date.now()-lastAt<4000)return;
  const eventId=ckEvent;
  ckBusy=true;$('#ckEvent').disabled=true;lastCode=code;lastAt=Date.now();
  try {
    const d=await api('admin_checkin',{code,eventId});
    if($('#ck').hidden)return;
    beep(!d.already);
    const box=$('#ckResult');box.hidden=false;box.className=d.already?'dup':'ok';
    box.innerHTML=`<div>${d.already?'⚠️ 已經簽到':'✅ 簽到成功'}</div><strong>${esc(d.name)}</strong><div>共 ${num(d.people)} 人</div>${d.note?'<div class="pre">'+esc(d.note)+'</div>':''}`;
    if(!d.already){
      const history=$('#ckHistory');if(history.textContent==='尚無')history.replaceChildren();
      const row=document.createElement('div');
      row.textContent=new Intl.DateTimeFormat('zh-TW',{hour:'2-digit',minute:'2-digit'}).format(new Date())+'　'+d.name+'（'+d.people+' 人）';
      history.prepend(row);
      while(history.children.length>30)history.lastElementChild.remove();
    }
    await refreshCheckin();
  } catch(e) {
    lastCode='';beep(false);
    if(!$('#ck').hidden){
      $('#ckResult').hidden=false;$('#ckResult').className='err';$('#ckResult').textContent='❌ '+e.message;
    }
  } finally {
    ckBusy=false;
    $('#ckEvent').disabled=!ckEvent;
  }
}

  try{window.speechSynthesis&&speechSynthesis.cancel();}catch{}
  const segments=location.hash.replace(/^#\/?/,'').split('/').map(v=>{try{return decodeURIComponent(v);}catch{return v;}});
  const page=segments[0]||'home';
  $('#drawer').hidden=true;$('#menuBtn').setAttribute('aria-expanded','false');
  $('#qrDialog').hidden=true;closeModal(true);
  $('#pub').hidden=['admin','checkin'].includes(page);
  $('#adm').hidden=page!=='admin';$('#ck').hidden=page!=='checkin';
  if(page!=='checkin')safely(stopCamera);
  window.scrollTo(0,0);
  if(page==='admin')return openAdmin(segments[1]||'dash');
  if(page==='checkin'){
    if(!isAdmin()){
      $('#ck').hidden=true;$('#pub').hidden=false;
      $('#view').innerHTML='<h2>簽到權限不足</h2>'+(ME?'<p>此功能僅限啟用中的管理員。</p><a href="#/">回首頁</a>':loginCard());
      measureDock();
      return;
    }
    return safely(refreshCheckin);
  }
  curPage=page==='for'?'start':page;markNav();measureDock();
  $('#view').innerHTML='<p class="muted">載入中…</p>';
  try {
    let html;
    if(page==='forum')html=await PAGES.forum(segments[1],segments[1]==='b'?segments[2]:null);
    else if(Object.hasOwn(PAGES,page))html=await PAGES[page](segments[1]);
    else html='<h2>找不到頁面</h2><a href="#/">回首頁</a>';
    if(seq!==routeSeq)return;
    $('#view').innerHTML=toolBar(page)+html;
    applyChecklist(true);
    const h=$('#view h2,#view h1');
    document.title=(h&&page!=='home'?h.textContent.trim()+'｜':'')+'台灣帕金森病友權益促進會';
    $('#view').focus({preventScroll:true});
  }catch(e){
    if(seq!==routeSeq)return;
    $('#view').innerHTML=`<div class="card"><h2>載入失敗</h2><p>${esc(e.message)}</p>${btn('route-refresh','重新載入','btn gh')}</div>`;
  }
}
window.addEventListener('hashchange',()=>safely(route));
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)safely(stopCamera);
});
window.addEventListener('pagehide',()=>{safely(stopCamera);});
(async()=>{
  drawFooter();drawGive();
  await initLiff();
  drawNavigation();
  try{ CFG=await api('getConfig'); }catch(e){console.error(e);}
  drawFooter();drawGive();
  await route();
})().catch(e=>{console.error(e);toast(e.message);});
</script>
</body>
</html>
