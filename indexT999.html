<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>台灣帕金森病友權益促進會</title>
<script>
// 電腦瀏覽器自動導向電腦版（網址加 ?m=1 可強制看手機版）
if (matchMedia('(min-width:1000px) and (pointer:fine)').matches && !/[?&]m=1/.test(location.search))
  location.replace('desktop.html' + location.search + location.hash);
</script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
:root{--main:#1d5f80;--dark:#0f3d54;--accent:#ffb02e;--bg:#f4f8fa;--line:#c9d6de;--ok:#1b8a4b;--bad:#c0392b}
*{box-sizing:border-box}
html{font-size:18px}
body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:#1a1a1a;line-height:1.7;padding-bottom:76px}
header{background:var(--dark);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:20}
header .t{flex:1;font-weight:800;font-size:1rem;line-height:1.3}
header button{background:#ffffff22;color:#fff;border:0;border-radius:8px;min-width:44px;min-height:44px;font-size:1rem;font-weight:700;cursor:pointer}
#menu{display:none;background:#fff;border-bottom:3px solid var(--main);position:sticky;top:64px;z-index:19}
#menu a{display:block;padding:14px 18px;border-bottom:1px solid #e3eaef;color:var(--dark);font-weight:700;text-decoration:none}
main{max-width:640px;margin:auto;padding:14px}
h2{color:var(--dark);margin:6px 0 12px;font-size:1.35rem}
h3{color:var(--dark);margin:18px 0 8px}
.card{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card img.cv{width:100%;border-radius:10px;margin-bottom:8px;display:block}
.hero{background:linear-gradient(135deg,var(--main),var(--dark));color:#fff;border-radius:16px;padding:22px 16px;text-align:center;margin-bottom:14px}
.hero h1{margin:0 0 6px;font-size:1.4rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:1.7rem;color:var(--main)}
.quick a{display:flex;align-items:center;justify-content:center;gap:6px;min-height:60px;background:#fff;border:2px solid var(--main);border-radius:14px;color:var(--dark);font-weight:800;text-decoration:none;text-align:center}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;border:0;border-radius:14px;background:var(--accent);color:#000;font-size:1rem;font-weight:800;margin:10px 0;cursor:pointer;font-family:inherit;text-decoration:none}
.btn.sec{background:var(--main);color:#fff}.btn.gh{background:#fff;border:2px solid var(--main);color:var(--dark)}.btn.bad{background:var(--bad);color:#fff}
.btn.sm{min-height:44px;width:auto;padding:0 16px;display:inline-flex;margin:4px 4px 4px 0;font-size:.9rem}
.btn:disabled{opacity:.5}
label{display:block;font-weight:800;margin-top:12px}
input,select,textarea{width:100%;min-height:52px;font-size:1rem;padding:8px 12px;border:2px solid var(--main);border-radius:12px;font-family:inherit;background:#fff;margin-top:4px}
input[type=checkbox]{width:26px;min-height:26px;vertical-align:middle;margin-right:8px}
.tag{display:inline-block;border-radius:12px;padding:0 10px;font-size:.8rem;font-weight:700;background:#e3f0f6;color:var(--dark)}
.tag.g{background:#d9f2e3;color:#14663a}.tag.r{background:#fbdcd8;color:#8e2a1f}.tag.y{background:#fff0c9;color:#7a5400}
.muted{color:#5b6b75;font-size:.85rem}
.pre{white-space:pre-wrap;word-break:break-word}
.chips{display:flex;gap:8px;overflow:auto;padding-bottom:6px;margin-bottom:8px}
.chips button{flex:none;min-height:44px;padding:0 16px;border-radius:22px;border:2px solid var(--main);background:#fff;font-weight:700;font-family:inherit;font-size:.95rem;color:var(--dark)}
.chips button.on{background:var(--main);color:#fff}
.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.notice{background:#fff7e0;border:2px solid #f0c75a;border-radius:12px;padding:10px 12px;font-size:.9rem;margin-bottom:12px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid var(--line);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:8px 0;min-height:60px;color:#445;text-decoration:none;font-size:.8rem;font-weight:700}
nav a span{display:block;font-size:1.4rem;line-height:1.2}nav a.on{color:var(--main)}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:12px 22px;border-radius:12px;display:none;z-index:99;max-width:90%;text-align:center}
#qrbox{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
#qrbox .in{background:#fff;border-radius:16px;padding:18px;text-align:center;max-width:340px;width:100%}
footer{text-align:center;color:#667;font-size:.8rem;padding:10px}
</style>
</head>
<body>
<header>
  <div class="t">🎗️ 台灣帕金森病友<br>權益促進會</div>
  <button onclick="fs(-1)" aria-label="縮小字體">A-</button>
  <button onclick="fs(1)" aria-label="放大字體">A+</button>
  <button onclick="toggleMenu()" aria-label="更多選單">☰</button>
</header>
<div id="menu">
  <a href="#/resources">📚 衛教資源</a><a href="#/learn">🧠 認識帕金森氏症</a><a href="#/family">🤝 給家屬與照顧者</a>
  <a href="#/donate">❤️ 愛心捐款</a><a href="#/about">🏛️ 關於協會</a><a href="#/privacy">🔒 隱私權政策</a>
</div>
<main id="view">載入中…</main>
<footer id="foot"></footer>
<nav id="nav">
  <a href="#/" data-k="home"><span>🏠</span>首頁</a><a href="#/news" data-k="news"><span>📰</span>消息</a>
  <a href="#/events" data-k="events"><span>📅</span>活動</a><a href="#/forum" data-k="forum"><span>💬</span>論壇</a>
  <a href="#/me" data-k="me"><span>👤</span>我的</a>
</nav>
<div id="toast"></div>
<div id="qrbox" onclick="this.style.display='none'"><div class="in" onclick="event.stopPropagation()">
  <h3 id="qt" style="margin:0 0 4px"></h3><div id="qi" class="muted"></div>
  <canvas id="qc" style="margin:10px 0"></canvas>
  <div class="muted">請在活動現場出示給工作人員掃描</div>
  <button class="btn gh" onclick="$('#qrbox').style.display='none'">關閉</button></div></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwPI9Xw7jsvSRIeTHkRk9yOFzBvW_DtwBMADDGl_AOJRF2zFGPtF665DE41OjpuSEop/exec';   // ← 請改成 Apps Script 部署網址（/exec 結尾）
const LIFF_ID = '2009456572-EflpADae';   // ← LINE Login 的 LIFF ID
const OA_ID   = '@115hyiab';   // ← 官方帳號 Basic ID，例如 @123abcde

let idToken = null, ME = null, CFG = {};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtD = d => d ? String(d).slice(0, 10) : '';
const num = n => Number(n || 0).toLocaleString();
const img = id => id ? `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w800` : '';
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '#';
let tt; function toast(m) { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(tt); tt = setTimeout(() => t.style.display = 'none', 3000); }
async function safe(fn) { try { await fn(); } catch (e) { toast(e.message); } }

/* 字體大小 */
let FS = Number(localStorage.fs || 18);
function fs(d) { FS = Math.min(26, Math.max(16, FS + d * 2)); localStorage.fs = FS; document.documentElement.style.fontSize = FS + 'px'; }
fs(0);
function toggleMenu() { const m = $('#menu'); m.style.display = m.style.display === 'block' ? 'none' : 'block'; }

/* API */
async function api(action, params = {}) {
  if (!API_URL) throw new Error('尚未設定 API_URL');
  const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, params, idToken }) });
  const j = await res.json();
  if (!j.ok) {
    if (/過期|請先登入/.test(j.message || '') && LIFF_ID && typeof liff !== 'undefined') setTimeout(() => { liff.logout(); liff.login({ redirectUri: location.href }); }, 1200);
    throw new Error(j.message || '發生錯誤');
  }
  return j.data;
}

/* LINE 登入 */
async function initLiff() {
  if (!LIFF_ID) return;
  try {
    await liff.init({ liffId: LIFF_ID });
    if (liff.isLoggedIn()) {
      idToken = liff.getIDToken();
      const p = await liff.getProfile();
      ME = await api('login', { displayName: p.displayName, pictureUrl: p.pictureUrl });
    }
  } catch (e) { console.warn(e); }
}
function needLogin() {
  if (ME) return true;
  if (!LIFF_ID) { toast('尚未設定 LIFF_ID'); return false; }
  liff.login({ redirectUri: location.href }); return false;
}
const loginCard = () => `<div class="card" style="text-align:center"><p>此功能需要先用 LINE 登入。</p><button class="btn" onclick="needLogin()">💚 使用 LINE 登入</button></div>`;

/* 狀態標籤 */
const ST = { '已報名': ['', '已報名'], '已出席': ['g', '已出席'], '已取消': ['r', '已取消'], '待確認': ['y', '待確認'], '已確認': ['g', '已確認'], '待審': ['y', '審核中'], '啟用': ['g', '啟用'], '停用': ['r', '停用'] };
const tag = s => { const t = ST[s] || ['', s || '']; return `<span class="tag ${t[0]}">${esc(t[1])}</span>`; };

/* ========== 頁面 ========== */
const PAGES = {
  async home() {
    const h = await api('getHome'), s = h.stats;
    const stat = (n, l) => `<div class="stat"><b>${num(n)}</b>${l}</div>`;
    return `<div class="hero"><h1>${esc(CFG.slogan || '陪伴每一位帕友')}</h1><div>讓病友與家屬不孤單</div></div>
      <div class="grid quick" style="margin-bottom:14px"><a href="#/events">📅<br>活動報名</a><a href="#/resources">📚<br>衛教資源</a><a href="#/forum">💬<br>病友論壇</a><a href="#/donate">❤️<br>愛心捐款</a></div>
      <div class="grid">${stat(s.members, '位會員')}${stat(s.events, '場活動')}${stat(s.participants, '人次參與')}${stat(s.groups, '個據點')}${stat(s.volunteers, '位志工')}${stat(s.resources, '份衛教資源')}</div>
      <h3>最新消息</h3>${h.news.map(newsCard).join('') || '<p class="muted">尚無消息</p>'}<a class="btn gh" href="#/news">看全部消息</a>
      <h3>近期活動</h3>${h.events.map(eventCard).join('') || '<p class="muted">近期沒有活動</p>'}<a class="btn gh" href="#/events">看全部活動</a>`;
  },
  async news() { const l = await api('getNews'); return `<h2>📰 最新消息</h2>${l.map(newsCard).join('') || '<p class="muted">尚無消息</p>'}`; },
  async newsDetail(id) {
    const n = await api('getNewsDetail', { id });
    return `<a href="#/news">← 回消息列表</a><div class="card" style="margin-top:8px">${n.coverId ? `<img class="cv" src="${img(n.coverId)}" alt="">` : ''}
      <span class="tag">${esc(n.category)}</span> <span class="muted">${fmtD(n.publishDate)}</span><h2>${esc(n.title)}</h2>
      <div class="pre">${esc(n.content)}</div>${n.attachUrl ? `<a class="btn sec" target="_blank" rel="noopener" href="${safeUrl(n.attachUrl)}">📎 下載附件</a>` : ''}</div>`;
  },
  async events() { const l = await api('getEvents'); return `<h2>📅 活動報名</h2>${l.map(eventCard).join('') || '<p class="muted">目前沒有活動</p>'}`; },
  async eventDetail(id) {
    const e = await api('getEventDetail', { id });
    const closed = e.deadline && fmtD(e.deadline) < new Date().toISOString().slice(0, 10);
    let form = '';
    if (closed) form = '<div class="notice">報名已截止</div>';
    else if (e.remaining < 1) form = '<div class="notice">名額已滿，下次請早</div>';
    else if (!ME) form = loginCard();
    else {
      const pf = (await api('getMyData')).profile || {};
      form = `<h3>我要報名</h3><label>姓名</label><input id="r_name" value="${esc(pf.name)}"><label>電話</label><input id="r_phone" type="tel" value="${esc(pf.phone)}">
        <label>同行人數（不含本人，最多 10）</label><input id="r_comp" type="number" min="0" max="10" value="0" inputmode="numeric">
        <label>備註（輪椅位、素食等）</label><textarea id="r_note" rows="2"></textarea>
        <button class="btn" id="rbtn" onclick="doRegister('${esc(e.id)}')">✅ 確定報名</button>`;
    }
    return `<a href="#/events">← 回活動列表</a><div class="card" style="margin-top:8px">${e.coverId ? `<img class="cv" src="${img(e.coverId)}" alt="">` : ''}
      <h2>${esc(e.title)}</h2><div>📅 ${fmtD(e.date)}<br>📍 ${esc(e.location)}<br>👥 剩餘名額：<b>${e.remaining}</b> / ${esc(e.capacity)}（含同行者）
      ${e.deadline ? `<br>⏰ 報名截止：${fmtD(e.deadline)}` : ''}</div><div class="pre" style="margin-top:10px">${esc(e.description)}</div></div>${form}`;
  },
  async resources(cat) {
    const l = await api('getResources'), cats = [...new Set(l.map(r => r.category).filter(Boolean))];
    const show = cat ? l.filter(r => r.category === cat) : l;
    const icon = { pdf: '📄', video: '🎬', article: '📰', link: '🔗' };
    return `<h2>📚 衛教資源</h2><div class="notice">資訊僅供參考，不能取代醫師的診斷與治療建議。用藥或治療請諮詢您的醫師。</div>
      <div class="chips"><button class="${!cat ? 'on' : ''}" onclick="go('#/resources')">全部</button>${cats.map(c => `<button class="${c === cat ? 'on' : ''}" onclick="go('#/resources/${encodeURIComponent(c)}')">${esc(c)}</button>`).join('')}</div>
      ${show.map(r => `<div class="card"><div class="row"><b>${icon[r.type] || '📄'} ${esc(r.title)}</b><span class="tag">${esc(r.category)}</span></div>
        <div class="muted">${esc(r.description)}</div>${r.url ? `<a class="btn sec" target="_blank" rel="noopener" href="${safeUrl(r.url)}">開啟</a>` : ''}</div>`).join('') || '<p class="muted">尚無資源</p>'}`;
  },
  async forum(board) {
    const l = await api('getForumPosts'), boards = ['新病友提問', '藥物與治療', '運動復健', '照顧者交流', '生活分享'];
    const show = board ? l.filter(p => p.board === board) : l;
    return `<h2>💬 病友論壇</h2><div class="notice">請勿張貼個人資料或醫療建議。新文章需經管理員審核後才會顯示。內容僅為經驗分享，不能取代醫師意見。</div>
      <div class="chips"><button class="${!board ? 'on' : ''}" onclick="go('#/forum')">全部</button>${boards.map(b => `<button class="${b === board ? 'on' : ''}" onclick="go('#/forum/b/${encodeURIComponent(b)}')">${b}</button>`).join('')}</div>
      <a class="btn" href="#/forum/new">✏️ 發表新文章</a>
      ${show.map(p => `<a href="#/forum/${esc(p.id)}" style="text-decoration:none;color:inherit"><div class="card"><span class="tag">${esc(p.board)}</span><div><b>${esc(p.title)}</b></div>
        <div class="muted">${esc(p.authorName)}　${fmtD(p.createdAt)}　💬 ${p.replyCount}</div></div></a>`).join('') || '<p class="muted">還沒有文章</p>'}`;
  },
  async forumNew() {
    if (!ME) return `<a href="#/forum">← 回論壇</a><h2>發表新文章</h2>${loginCard()}`;
    return `<a href="#/forum">← 回論壇</a><h2>發表新文章</h2><label>討論區</label><select id="f_b">${['新病友提問', '藥物與治療', '運動復健', '照顧者交流', '生活分享'].map(b => `<option>${b}</option>`).join('')}</select>
      <label>標題</label><input id="f_t" maxlength="100"><label>內容</label><textarea id="f_c" rows="8" maxlength="5000"></textarea>
      <button class="btn" id="fbtn" onclick="doPost()">送出（待管理員審核）</button>`;
  },
  async forumDetail(id) {
    const { post, replies } = await api('getForumPost', { id });
    return `<a href="#/forum">← 回論壇</a><div class="card" style="margin-top:8px"><span class="tag">${esc(post.board)}</span><h2>${esc(post.title)}</h2>
      <div class="muted">${esc(post.authorName)}　${fmtD(post.createdAt)}</div><div class="pre" style="margin-top:8px">${esc(post.content)}</div></div>
      <h3>回覆（${replies.length}）</h3>${replies.map(r => `<div class="card"><div class="muted">${esc(r.authorName)}　${fmtD(r.createdAt)}</div><div class="pre">${esc(r.content)}</div></div>`).join('')}
      ${ME ? `<label>我要回覆</label><textarea id="rp_c" rows="4" maxlength="2000"></textarea><button class="btn" onclick="doReply('${esc(id)}')">送出回覆</button>` : loginCard()}`;
  },
  async me() {
    if (!ME) return `<h2>👤 會員中心</h2>${loginCard()}`;
    const d = await api('getMyData'), p = d.profile || ME;
    const oa = OA_ID ? `<a class="btn gh" target="_blank" rel="noopener" href="https://line.me/R/ti/p/${encodeURIComponent(OA_ID)}">🔔 加入官方帳號（才收得到報名與活動通知）</a>` : '';
    return `<h2>👤 會員中心</h2>
      <div class="card"><div class="row"><b>${esc(p.displayName)}</b>${tag(p.status)}</div>${p.status === '待審' ? '<div class="muted">協會審核中，通過後會用 LINE 通知您。</div>' : ''}
      ${p.expireDate ? `<div class="muted">會籍到期日：${fmtD(p.expireDate)}</div>` : ''}</div>${oa}
      <h3>我的活動報名</h3>${d.registrations.map(r => `<div class="card"><div class="row"><b>${esc(r.eventTitle || '（活動已移除）')}</b>${tag(r.status)}</div>
        <div class="muted">📅 ${fmtD(r.eventDate)}　👥 ${1 + Number(r.companions || 0)} 人</div>
        ${r.status === '已報名' || r.status === '已出席' ? `<button class="btn sm sec" onclick="showQR('${esc(r.id)}')">📲 簽到 QR Code</button>` : ''}
        ${r.status === '已報名' ? `<button class="btn sm gh" onclick="cancelReg('${esc(r.id)}')">取消報名</button>` : ''}</div>`).join('') || '<p class="muted">尚未報名任何活動</p>'}
      <h3>我的捐款紀錄</h3>${d.donations.map(x => `<div class="card"><div class="row"><b>NT$ ${num(x.amount)}</b>${tag(x.status)}</div><div class="muted">${fmtD(x.createdAt)}　編號 ${esc(x.id)}</div></div>`).join('') || '<p class="muted">尚無紀錄</p>'}
      <h3>個人資料</h3>
      <label>姓名</label><input id="p_name" value="${esc(p.name)}"><label>電話</label><input id="p_phone" type="tel" value="${esc(p.phone)}">
      <label>Email</label><input id="p_email" type="email" value="${esc(p.email)}"><label>居住縣市</label><input id="p_city" value="${esc(p.city)}">
      <label>身分</label><select id="p_id">${['', '病友', '家屬／照顧者', '志工', '醫護人員', '一般民眾'].map(s => `<option ${p.identity === s ? 'selected' : ''}>${s}</option>`).join('')}</select>
      <button class="btn" onclick="saveProfile()">💾 儲存資料</button>
      <button class="btn gh" onclick="liff.logout();location.reload()">登出</button>`;
  },
  async donate() {
    const c = await api('getConfig');
    return `<h2>❤️ 愛心捐款</h2><div class="card"><b>匯款資訊</b><div class="pre">${esc(c.bankInfo || '請洽協會')}</div>
      <div class="muted" style="margin-top:6px">匯款後請在下方登記，協會核對收款後會用 LINE 通知您。</div></div>
      ${ME ? `<label>捐款人姓名</label><input id="d_name"><label>Email</label><input id="d_email" type="email"><label>金額（元）</label><input id="d_amt" type="number" inputmode="numeric" min="1">
      <label>捐款方式</label><select id="d_m"><option>銀行匯款</option><option>ATM 轉帳</option><option>現金</option></select>
      <label><input type="checkbox" id="d_rc" onchange="$('#rcbox').style.display=this.checked?'block':'none'">需要收據</label>
      <div id="rcbox" style="display:none"><label>收據抬頭</label><input id="d_rt"><label>身分證字號／統編</label><input id="d_tax"><label>收據寄送地址</label><input id="d_addr"></div>
      <div class="muted" style="margin-top:8px">您的個人資料僅用於捐款核對與開立收據，不會對外公開。</div>
      <button class="btn" id="dbtn" onclick="doDonate()">登記捐款</button>` : loginCard()}`;
  },
  async about() {
    const [a, c] = await Promise.all([api('getAbout'), api('getConfig')]);
    return `<h2>🏛️ 關於協會</h2><div class="card pre">${esc(a.intro)}</div><h3>宗旨與願景</h3><div class="card pre">${esc(a.mission)}</div>
      ${a.board.length ? `<h3>理監事</h3><div class="card">${a.board.map(b => `<div class="row"><b>${esc(b.name)}</b><span>${esc(b.title)}</span></div>`).join('')}</div>` : ''}
      ${a.docs.length ? `<h3>文件下載</h3>${a.docs.map(d => `<a class="btn gh" target="_blank" rel="noopener" href="${safeUrl(d.url)}">📄 ${esc(d.title)}</a>`).join('')}` : ''}
      <h3>聯絡我們</h3><div class="card">📞 ${esc(c.phone)}<br>✉️ ${esc(c.email)}<br>📍 ${esc(c.address)}</div>`;
  },
  async learn() {
    return `<h2>🧠 認識帕金森氏症</h2><div class="notice">本頁為一般性衛教資訊，不能取代醫師的診斷與治療。有任何疑問，請諮詢您的神經科醫師。</div>
      <div class="card"><h3 style="margin-top:0">什麼是帕金森氏症？</h3>帕金森氏症是一種慢性的神經退化疾病，與腦中製造多巴胺的神經細胞逐漸減少有關。</div>
      <div class="card"><h3 style="margin-top:0">常見的症狀</h3>・動作變慢、起步困難<br>・肢體僵硬<br>・靜止時顫抖<br>・平衡變差、容易跌倒<br>・也可能有睡眠、情緒、便秘等非動作症狀</div>
      <div class="card"><h3 style="margin-top:0">日常照顧小提醒</h3>・依醫囑規律服藥，不要自行增減<br>・規律運動與復健有助維持活動能力<br>・居家空間移除障礙物，預防跌倒<br>・與醫師、家人、病友保持聯繫</div>
      <a class="btn" href="#/resources">📚 查看更多衛教資源</a>
      <div class="muted">內容請由協會顧問醫師審閱後再正式發布。</div>`;
  },
  async family() {
    return `<h2>🤝 給家屬與照顧者</h2><div class="notice">本頁為一般性建議，不能取代專業醫療意見。</div>
      <div class="card"><h3 style="margin-top:0">照顧者也需要被照顧</h3>長期照顧很辛苦，請記得休息、尋求協助，也歡迎加入協會的照顧者交流。</div>
      <div class="card"><h3 style="margin-top:0">溝通小技巧</h3>・給對方多一點時間回應<br>・鼓勵他自己完成能做的事<br>・多肯定、少催促</div>
      <div class="card"><h3 style="margin-top:0">安全提醒</h3>・地面保持乾燥、整潔，浴室加裝扶手<br>・夜間設置小夜燈<br>・留意吞嚥狀況，進食時請坐正</div>
      <a class="btn" href="#/forum/b/${encodeURIComponent('照顧者交流')}">💬 前往照顧者交流區</a>`;
  },
  async privacy() {
    return `<h2>🔒 隱私權政策</h2><div class="card pre">【此頁內容請由協會或法律顧問提供正式版本後填入】

本網站蒐集的資料：LINE 名稱、頭像、姓名、電話、Email、居住縣市、身分、活動報名與捐款登記資料。

使用目的：會員管理、活動報名與簽到、捐款核對與收據開立、協會聯絡與通知。

您可以隨時聯絡協會，查詢、更正或刪除您的個人資料。

聯絡方式請見「關於協會」頁面。</div>`;
  }
};

const newsCard = n => `<a href="#/news/${esc(n.id)}" style="text-decoration:none;color:inherit"><div class="card">${n.coverId ? `<img class="cv" src="${img(n.coverId)}" alt="" loading="lazy">` : ''}
  <div>${n.pinned === 'Y' || n.pinned === true ? '📌 ' : ''}<span class="tag">${esc(n.category)}</span> <span class="muted">${fmtD(n.publishDate)}</span></div><b>${esc(n.title)}</b></div></a>`;
const eventCard = e => `<a href="#/events/${esc(e.id)}" style="text-decoration:none;color:inherit"><div class="card">${e.coverId ? `<img class="cv" src="${img(e.coverId)}" alt="" loading="lazy">` : ''}
  <b>${esc(e.title)}</b><div class="muted">📅 ${fmtD(e.date)}　📍 ${esc(e.location)}</div>
  ${e.remaining !== undefined ? (e.remaining < 1 ? '<span class="tag r">額滿</span>' : `<span class="tag g">剩 ${e.remaining} 名額</span>`) : ''}</div></a>`;

/* ========== 動作 ========== */
const go = h => { location.hash = h; };
window.doRegister = id => safe(async () => {
  const b = $('#rbtn'); b.disabled = true;
  try {
    await api('registerEvent', { eventId: id, name: $('#r_name').value, phone: $('#r_phone').value, companions: $('#r_comp').value, note: $('#r_note').value });
    toast('✅ 報名成功！'); go('#/me');
  } finally { b.disabled = false; }
});
window.cancelReg = id => safe(async () => { if (!confirm('確定要取消報名嗎？')) return; await api('cancelRegistration', { id }); toast('已取消'); route(); });
window.showQR = id => safe(async () => {
  const r = await api('getCheckinCode', { id });
  $('#qt').textContent = r.title || '活動簽到';
  $('#qi').textContent = `${r.name}　共 ${r.people} 人${r.status === '已出席' ? '（已簽到）' : ''}`;
  await QRCode.toCanvas($('#qc'), r.code, { width: 260, margin: 2 });
  $('#qrbox').style.display = 'flex';
});
window.saveProfile = () => safe(async () => {
  ME = await api('updateProfile', { name: $('#p_name').value, phone: $('#p_phone').value, email: $('#p_email').value, city: $('#p_city').value, identity: $('#p_id').value });
  toast('✅ 已儲存');
});
window.doPost = () => safe(async () => {
  const b = $('#fbtn'); b.disabled = true;
  try {
    await api('createPost', { board: $('#f_b').value, title: $('#f_t').value, content: $('#f_c').value });
    toast('已送出，審核通過後會顯示'); go('#/forum');
  } finally { b.disabled = false; }
});
window.doReply = id => safe(async () => { await api('createReply', { postId: id, content: $('#rp_c').value }); toast('✅ 已回覆'); route(); });
window.doDonate = () => safe(async () => {
  const b = $('#dbtn'); b.disabled = true;
  try {
    const rc = $('#d_rc').checked;
    if (rc && !$('#d_rt').value.trim()) throw new Error('請填寫收據抬頭');
    await api('createDonation', { name: $('#d_name').value, email: $('#d_email').value, amount: $('#d_amt').value, method: $('#d_m').value,
      receiptNeeded: rc, receiptTitle: $('#d_rt').value, taxId: $('#d_tax').value, address: $('#d_addr').value });
    toast('✅ 已登記，感謝您的愛心'); go('#/me');
  } finally { b.disabled = false; }
});

/* ========== 路由 ========== */
async function route() {
  const hash = location.hash.replace(/^#\/?/, ''), seg = hash.split('/').map(decodeURIComponent), v = $('#view');
  $('#menu').style.display = 'none';
  const k = seg[0] || 'home';
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.k === (k === 'learn' || k === 'family' || k === 'donate' || k === 'about' || k === 'resources' ? '' : k)));
  v.innerHTML = '<p class="muted">載入中…</p>'; scrollTo(0, 0);
  try {
    let html;
    if (k === 'home') html = await PAGES.home();
    else if (k === 'news') html = seg[1] ? await PAGES.newsDetail(seg[1]) : await PAGES.news();
    else if (k === 'events') html = seg[1] ? await PAGES.eventDetail(seg[1]) : await PAGES.events();
    else if (k === 'resources') html = await PAGES.resources(seg[1]);
    else if (k === 'forum') html = seg[1] === 'new' ? await PAGES.forumNew() : seg[1] === 'b' ? await PAGES.forum(seg[2]) : seg[1] ? await PAGES.forumDetail(seg[1]) : await PAGES.forum();
    else if (PAGES[k]) html = await PAGES[k]();
    else html = '<p>找不到頁面</p>';
    v.innerHTML = html;
  } catch (e) { v.innerHTML = `<div class="card"><b>載入失敗</b><div class="muted">${esc(e.message)}</div><button class="btn gh" onclick="route()">重新載入</button></div>`; }
}
addEventListener('hashchange', route);

(async () => {
  await initLiff();
  try { CFG = await api('getConfig'); $('#foot').innerHTML = `${esc(CFG.phone || '')}　${esc(CFG.email || '')}`; } catch (e) {}
  route();
})();
</script>
</body>
</html>
