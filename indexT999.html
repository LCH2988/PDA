<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>財團法人 RBI 瑞金抗齡照護研究教育基金會</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    .editable-focus {
      outline: 2px dashed #d97706 !important;
      background-color: rgba(254, 243, 199, 0.45) !important;
      cursor: text;
      border-radius: 4px;
      padding: 2px 4px;
    }
  </style>
</head>
<body class="bg-stone-50 text-stone-800 font-sans pb-16">

  <div id="admin-bar" class="bg-amber-900 text-amber-100 text-xs px-4 py-2 sticky top-0 z-50 flex justify-between items-center shadow-md">
    <div class="flex items-center space-x-2">
      <i class="fas fa-shield-alt text-amber-300"></i>
      <span id="admin-status">訪客檢視模式</span>
    </div>
    <div class="flex items-center space-x-3">
      <span id="save-indicator" class="text-green-300 hidden"><i class="fas fa-check-circle"></i> 已儲存至試算表</span>
      <button id="btn-toggle-admin" onclick="toggleAdminMode()" class="bg-amber-700 hover:bg-amber-600 px-3 py-1 rounded text-white font-medium transition">
        進入管理員模式
      </button>
    </div>
  </div>

  <header class="bg-white border-b border-stone-200 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <img src="https://drive.google.com/uc?export=view&id=YOUR_DRIVE_LOGO_ID" alt="RBI Logo" class="h-12 w-12 rounded-full border border-amber-400 p-0.5 object-cover">
        <div>
          <h1 class="font-bold text-lg md:text-xl text-amber-900">RBI 瑞金抗齡照護研究教育基金會</h1>
          <p class="text-xs text-stone-500">THE RBI FOUNDATION OF GERIATRIC CARE RESEARCH & EDUCATION</p>
        </div>
      </div>
      <nav class="hidden md:flex space-x-6 text-sm font-medium text-stone-600">
        <a href="#about" class="hover:text-amber-800 transition">關於基金會</a>
        <a href="#news" class="hover:text-amber-800 transition">專題動態</a>
        <a href="#contact" class="hover:text-amber-800 transition">聯絡諮詢</a>
      </nav>
    </div>
  </header>

  <section class="bg-gradient-to-b from-amber-100/70 via-amber-50/30 to-stone-50 py-14 px-4 text-center">
    <div class="max-w-3xl mx-auto">
      <h2 id="cfg-hero_title" data-key="hero_title" class="text-2xl md:text-4xl font-extrabold text-amber-950 mb-4 transition">
        載入中...
      </h2>
      <p id="cfg-hero_sub" data-key="hero_sub" class="text-stone-600 text-sm md:text-base leading-relaxed">
        載入中...
      </p>
    </div>
  </section>

  <section id="about" class="max-w-5xl mx-auto px-4 py-8">
    <div class="bg-white rounded-2xl p-6 md:p-8 shadow-sm border border-stone-200">
      <h3 class="text-xl font-bold text-amber-900 border-l-4 border-amber-600 pl-3 mb-4">成立宗旨與願景</h3>
      <div id="cfg-about_text" data-key="about_text" class="text-stone-700 leading-relaxed text-sm md:text-base">
        載入中...
      </div>
    </div>
  </section>

  <section id="news" class="max-w-5xl mx-auto px-4 py-8">
    <div class="flex justify-between items-center mb-6">
      <h3 class="text-xl font-bold text-amber-900 border-l-4 border-amber-600 pl-3">專家專訪與最新消息</h3>
      <button id="btn-add-art" onclick="openArticleModal()" class="hidden bg-amber-600 hover:bg-amber-700 text-white text-sm px-3 py-1.5 rounded-lg shadow transition">
        <i class="fas fa-plus mr-1"></i> 新增專題報導
      </button>
    </div>
    
    <div id="articles-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <p class="text-stone-400 text-sm">動態載入中...</p>
    </div>
  </section>

  <section id="contact" class="max-w-5xl mx-auto px-4 py-8">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-stone-200">
        <h3 class="text-lg font-bold text-amber-900 border-l-4 border-amber-600 pl-3 mb-4">聯絡資訊</h3>
        <div class="space-y-4 text-sm text-stone-700">
          <div>
            <span class="font-bold block text-stone-900">臺中通訊處：</span>
            <span id="cfg-address_tc" data-key="address_tc">載入中...</span><br>
            電話：<span id="cfg-phone_tc" data-key="phone_tc">載入中...</span>
          </div>
          <div>
            <span class="font-bold block text-stone-900">高雄通訊處：</span>
            <span id="cfg-address_kh" data-key="address_kh">載入中...</span><br>
            電話：<span id="cfg-phone_kh" data-key="phone_kh">載入中...</span>
          </div>
          <div>
            <span class="font-bold block text-stone-900">官方信箱：</span>
            <span id="cfg-email" data-key="email">載入中...</span>
          </div>
        </div>
      </div>

      <div class="bg-white p-6 rounded-2xl shadow-sm border border-stone-200">
        <h3 class="text-lg font-bold text-amber-900 border-l-4 border-amber-600 pl-3 mb-4">線上諮詢</h3>
        <form id="contact-form" class="space-y-3 text-sm">
          <input type="text" id="name" placeholder="您的姓名" required class="w-full border rounded-lg p-2.5 bg-stone-50 focus:bg-white">
          <input type="tel" id="phone" placeholder="聯絡電話" required class="w-full border rounded-lg p-2.5 bg-stone-50 focus:bg-white">
          <textarea id="message" rows="3" placeholder="請填寫您的問題或需求..." required class="w-full border rounded-lg p-2.5 bg-stone-50 focus:bg-white"></textarea>
          <button type="submit" class="w-full bg-amber-700 hover:bg-amber-800 text-white font-medium py-2.5 rounded-lg transition">送出諮詢</button>
        </form>
      </div>
    </div>
  </section>

  <div id="art-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl max-w-md w-full p-6 space-y-4">
      <h4 id="modal-title" class="text-lg font-bold text-stone-800">新增文章</h4>
      <input type="hidden" id="art-id">
      <div>
        <label class="block text-xs font-semibold text-stone-600 mb-1">分類標籤</label>
        <input type="text" id="art-category" placeholder="例：專家專訪、最新消息、活動報導" class="w-full border rounded p-2 text-sm">
      </div>
      <div>
        <label class="block text-xs font-semibold text-stone-600 mb-1">文章標題</label>
        <input type="text" id="art-title" placeholder="請輸入標題" class="w-full border rounded p-2 text-sm">
      </div>
      <div>
        <label class="block text-xs font-semibold text-stone-600 mb-1">發布日期</label>
        <input type="date" id="art-date" class="w-full border rounded p-2 text-sm">
      </div>
      <div>
        <label class="block text-xs font-semibold text-stone-600 mb-1">內容簡介</label>
        <textarea id="art-summary" rows="3" placeholder="請輸入摘要" class="w-full border rounded p-2 text-sm"></textarea>
      </div>
      <div class="flex justify-end space-x-2 pt-2">
        <button onclick="closeArticleModal()" class="px-4 py-2 border rounded text-stone-600 text-sm">取消</button>
        <button onclick="submitArticleModal()" class="px-4 py-2 bg-amber-600 text-white rounded text-sm hover:bg-amber-700">儲存</button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. 設定你的 GAS API URL 與 LIFF ID
    // ==========================================
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxdZy3UWpnpvPJj08DAt2DktQwBAYuWQUW6CzFaHojLoCYm3KZ6d1Y4jnCwiqIYfquWuw/exec";
    const LIFF_ID = "2009456572-EflpADae";

    let isAdmin = false;
    let currentAdminPwd = '';
    let siteArticles = [];
    let lineProfile = { userId: '' };

    window.onload = function() {
      initLiff();
      fetchSiteData();
    };

    // LIFF 驗證
    async function initLiff() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (liff.isLoggedIn()) {
          lineProfile = await liff.getProfile();
          document.getElementById('name').value = lineProfile.displayName;
        }
      } catch (e) {
        console.warn("外部瀏覽器載入或未配置 LIFF ID");
      }
    }

    // 透過 GAS_API_URL 取得全站設定與文章
    async function fetchSiteData() {
      try {
        const res = await fetch(`${GAS_API_URL}?action=getFullSiteData`);
        const data = await res.json();
        
        // 渲染 Config 文字
        for (const [key, val] of Object.entries(data.config)) {
          const el = document.getElementById('cfg-' + key);
          if (el) el.innerText = val;
        }

        // 渲染文章列表
        siteArticles = data.articles || [];
        renderArticles();
      } catch (err) {
        console.error("API 連線失敗：", err);
      }
    }

    // 渲染文章
    function renderArticles() {
      const container = document.getElementById('articles-container');
      if (siteArticles.length === 0) {
        container.innerHTML = '<p class="text-stone-400 text-sm">尚無資料</p>';
        return;
      }

      container.innerHTML = siteArticles.map(art => `
        <div class="bg-white p-5 rounded-xl border border-stone-200 shadow-sm hover:border-amber-300 transition">
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-medium">${art.category}</span>
            <span class="text-xs text-stone-400">${art.date}</span>
          </div>
          <h4 class="font-bold text-stone-800 mb-2 text-base">${art.title}</h4>
          <p class="text-stone-600 text-sm leading-relaxed">${art.summary}</p>
          
          <div class="admin-only ${isAdmin ? '' : 'hidden'} mt-4 pt-3 border-t border-stone-100 flex justify-end space-x-2">
            <button onclick="editArticle('${art.id}')" class="text-xs text-amber-700 bg-amber-50 px-2.5 py-1 rounded hover:bg-amber-100">
              <i class="fas fa-edit"></i> 編輯
            </button>
            <button onclick="removeArticle('${art.id}')" class="text-xs text-red-600 bg-red-50 px-2.5 py-1 rounded hover:bg-red-100">
              <i class="fas fa-trash"></i> 刪除
            </button>
          </div>
        </div>
      `).join('');
    }

    // 切換管理員模式
    async function toggleAdminMode() {
      if (!isAdmin) {
        const pwd = prompt("請輸入管理員密碼：");
        if (!pwd) return;

        const res = await fetch(GAS_API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "verifyAdmin", password: pwd })
        });
        const result = await res.json();

        if (result.success) {
          isAdmin = true;
          currentAdminPwd = pwd;
          activateAdminMode();
        } else {
          alert("密碼不正確！");
        }
      } else {
        isAdmin = false;
        currentAdminPwd = '';
        deactivateAdminMode();
      }
    }

    function activateAdminMode() {
      document.getElementById('admin-status').innerText = "管理員模式（點擊任意文字即可直接修改，失焦後自動儲存）";
      document.getElementById('admin-status').className = "text-amber-300 font-bold";
      document.getElementById('btn-toggle-admin').innerText = "退出管理員模式";
      document.getElementById('btn-add-art').classList.remove('hidden');

      // 啟用所見即所得編輯
      document.querySelectorAll('[data-key]').forEach(el => {
        el.setAttribute('contenteditable', 'true');
        el.classList.add('editable-focus');
        
        // 失焦即呼叫 API 寫入試算表 (即改即存)
        el.onblur = async function() {
          const key = this.getAttribute('data-key');
          const value = this.innerText.trim();
          showToast("儲存中...");

          await fetch(GAS_API_URL, {
            method: "POST",
            body: JSON.stringify({
              action: "updateConfigItem",
              password: currentAdminPwd,
              key: key,
              value: value
            })
          });

          showToast("已同步至試算表！", 2000);
        };
      });

      renderArticles();
    }

    function deactivateAdminMode() {
      document.getElementById('admin-status').innerText = "訪客檢視模式";
      document.getElementById('admin-status').className = "";
      document.getElementById('btn-toggle-admin').innerText = "進入管理員模式";
      document.getElementById('btn-add-art').classList.add('hidden');

      document.querySelectorAll('[data-key]').forEach(el => {
        el.removeAttribute('contenteditable');
        el.classList.remove('editable-focus');
        el.onblur = null;
      });

      renderArticles();
    }

    function showToast(text, duration = 0) {
      const toast = document.getElementById('save-indicator');
      toast.innerHTML = `<i class="fas fa-info-circle"></i> ${text}`;
      toast.classList.remove('hidden');
      if (duration > 0) {
        setTimeout(() => toast.classList.add('hidden'), duration);
      }
    }

    // 新增 / 編輯 Modal 控制
    function openArticleModal() {
      document.getElementById('modal-title').innerText = "新增專題報導";
      document.getElementById('art-id').value = "";
      document.getElementById('art-category').value = "專家專訪";
      document.getElementById('art-title').value = "";
      document.getElementById('art-date').value = new Date().toISOString().split('T')[0];
      document.getElementById('art-summary').value = "";
      document.getElementById('art-modal').classList.remove('hidden');
    }

    function editArticle(id) {
      const art = siteArticles.find(a => a.id === id);
      if (!art) return;
      document.getElementById('modal-title').innerText = "編輯專題報導";
      document.getElementById('art-id').value = art.id;
      document.getElementById('art-category').value = art.category;
      document.getElementById('art-title').value = art.title;
      document.getElementById('art-date').value = art.date;
      document.getElementById('art-summary').value = art.summary;
      document.getElementById('art-modal').classList.remove('hidden');
    }

    function closeArticleModal() {
      document.getElementById('art-modal').classList.add('hidden');
    }

    // 儲存文章 (即增、即改)
    async function submitArticleModal() {
      const article = {
        id: document.getElementById('art-id').value,
        category: document.getElementById('art-category').value,
        title: document.getElementById('art-title').value,
        date: document.getElementById('art-date').value,
        summary: document.getElementById('art-summary').value
      };

      showToast("儲存文章中...");
      const res = await fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "saveArticle",
          password: currentAdminPwd,
          article: article
        })
      });
      const data = await res.json();

      closeArticleModal();
      showToast("文章已更新！", 2000);

      // 即時前端更新
      if (data.mode === 'update') {
        const idx = siteArticles.findIndex(a => a.id === article.id);
        if (idx !== -1) siteArticles[idx] = article;
      } else {
        article.id = data.id;
        siteArticles.unshift(article);
      }
      renderArticles();
    }

    // 刪除文章 (即減)
    async function removeArticle(id) {
      if (!confirm("確定要刪除這筆報導嗎？")) return;
      showToast("刪除中...");

      await fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "deleteArticle",
          password: currentAdminPwd,
          id: id
        })
      });

      siteArticles = siteArticles.filter(a => a.id !== id);
      renderArticles();
      showToast("文章已刪除！", 2000);
    }

    // 諮詢表單提交
    document.getElementById('contact-form').onsubmit = async function(e) {
      e.preventDefault();
      const payload = {
        userId: lineProfile.userId || 'Web-Guest',
        name: document.getElementById('name').value,
        phone: document.getElementById('phone').value,
        message: document.getElementById('message').value
      };

      await fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "submitContact",
          data: payload
        })
      });

      alert("您的諮詢已送出，我們將盡快與您聯絡！");
      document.getElementById('contact-form').reset();
    };
  </script>
</body>
</html>
