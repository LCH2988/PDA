<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>台灣帕金森病友權益促進會</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
:root{--main:#1d5f80;--dark:#0f3d54;--accent:#ffb02e;--bg:#f4f8fa;--line:#c9d6de;--ok:#1b8a4b;--bad:#c0392b}
*{box-sizing:border-box}
html{font-size:17px}
body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:#1a1a1a;line-height:1.75}
a{color:var(--main)}
.muted{color:#5b6b75;font-size:.88rem}.pre{white-space:pre-wrap;word-break:break-word}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:12px 24px;border-radius:12px;display:none;z-index:200;max-width:90vw}

/* ===== 前台 ===== */
#pub{display:block}
#pub header{background:var(--dark);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 6px #0003}
.hd{max-width:1100px;margin:auto;padding:8px 14px;display:flex;align-items:center;gap:14px}
.logo{font-weight:800;font-size:1rem;line-height:1.3;color:#fff;text-decoration:none;flex:1}
#nav{display:none;gap:2px;flex:1;flex-wrap:wrap}
#nav a{color:#fff;text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:700;font-size:.95rem}
#nav a:hover{background:#ffffff22}#nav a.on{background:var(--main)}
.tools{display:flex;gap:6px;align-items:center}
.tools button{background:#ffffff22;color:#fff;border:0;border-radius:8px;min-width:40px;min-height:40px;font-weight:700;cursor:pointer;font-size:.95rem;font-family:inherit}
.tools button.me{background:var(--accent);color:#000;padding:0 12px;display:none}
#menuBtn{font-size:1.2rem}
#drawer{display:none;background:#fff;border-bottom:3px solid var(--main);padding:8px 14px}
#drawer a{display:block;padding:12px 6px;border-bottom:1px solid #e3eaef;text-decoration:none;font-weight:700;color:var(--dark)}
main#view{max-width:1100px;margin:auto;padding:16px 14px 90px;min-height:70vh}
h2{color:var(--dark);margin:6px 0 14px;font-size:1.5rem}
h3{color:var(--dark);margin:24px 0 10px;font-size:1.2rem}
.card{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card img.cv{width:100%;height:170px;object-fit:cover;border-radius:10px;margin-bottom:10px;display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.cards .card{margin:0}
.cards2{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.hero{background:linear-gradient(135deg,var(--main),var(--dark));color:#fff;border-radius:18px;padding:34px 20px;text-align:center;margin-bottom:18px}
.hero h1{margin:0 0 8px;font-size:1.7rem}
.hero .go{display:inline-block;margin:14px 4px 0;padding:11px 20px;border-radius:12px;background:var(--accent);color:#000;font-weight:800;text-decoration:none}
.hero .go.w{background:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px;text-align:center;font-size:.9rem}
.stat b{display:block;font-size:1.6rem;color:var(--main)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 22px;border:0;border-radius:12px;background:var(--accent);color:#000;font-size:1rem;font-weight:800;margin:8px 8px 8px 0;cursor:pointer;font-family:inherit;text-decoration:none}
.btn.sec{background:var(--main);color:#fff}.btn.gh{background:#fff;border:2px solid var(--main);color:var(--dark)}.btn.sm{min-height:38px;padding:0 14px;font-size:.9rem}
.btn:disabled{opacity:.5}
label{display:block;font-weight:800;margin-top:12px}
input,select,textarea{width:100%;min-height:46px;font-size:1rem;padding:8px 12px;border:2px solid var(--main);border-radius:10px;font-family:inherit;background:#fff;margin-top:4px}
input[type=checkbox]{width:22px;min-height:22px;vertical-align:middle;margin-right:8px}
.form{max-width:640px}
.two{display:grid;grid-template-columns:1fr;gap:0 16px}
.tag{display:inline-block;border-radius:12px;padding:0 10px;font-size:.8rem;font-weight:700;background:#e3f0f6;color:var(--dark)}
.tag.g{background:#d9f2e3;color:#14663a}.tag.r{background:#fbdcd8;color:#8e2a1f}.tag.y{background:#fff0c9;color:#7a5400}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chips button{min-height:40px;padding:0 16px;border-radius:20px;border:2px solid var(--main);background:#fff;font-weight:700;font-family:inherit;color:var(--dark);cursor:pointer}
.chips button.on{background:var(--main);color:#fff}
.notice{background:#fff7e0;border:2px solid #f0c75a;border-radius:12px;padding:10px 14px;font-size:.92rem;margin-bottom:14px}
.split{display:grid;grid-template-columns:1fr;gap:18px;align-items:start}
.link{text-decoration:none;color:inherit;display:block}
.link .card:hover{border-color:var(--main)}
footer#foot{background:var(--dark);color:#dce;text-align:center;padding:20px 14px 90px;font-size:.9rem}
#tabbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
#tabbar a{flex:1;text-align:center;padding:8px 2px;text-decoration:none;color:#445;font-size:.78rem;font-weight:700;line-height:1.3}
#tabbar a span{display:block;font-size:1.4rem}#tabbar a.on{color:var(--main);background:#e8f2f7}
#qrbox{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:150}
#qrbox .in{background:#fff;border-radius:16px;padding:20px;text-align:center;width:340px;max-width:92vw}
@media(min-width:900px){
  #nav{display:flex}.logo{flex:none;font-size:1.1rem}#menuBtn{display:none}.tools button.me{display:inline-block}
  #tabbar{display:none}footer#foot{padding-bottom:20px}main#view{padding:24px 20px}#drawer{display:none!important}
  .stats{grid-template-columns:repeat(6,1fr)}.two{grid-template-columns:1fr 1fr}
  .split{grid-template-columns:2fr 1fr;gap:24px}.hero{padding:48px 30px}.hero h1{font-size:2.1rem}
  #toast{bottom:30px}
}

/* ===== 管理後台（#adm） ===== */
#adm{display:none;min-height:100vh;background:#f1f5f8;font-size:16px;line-height:1.5}
#adm aside{width:220px;background:var(--dark);color:#fff;padding:12px 8px;position:sticky;top:0;height:100vh;overflow:auto;flex:none}
#adm aside h1{font-size:1rem;margin:4px 8px 12px;line-height:1.4}
#adm aside a{display:flex;justify-content:space-between;align-items:center;color:#fff;text-decoration:none;padding:10px 12px;border-radius:8px;font-weight:700;font-size:.92rem;cursor:pointer}
#adm aside a:hover{background:#fff2}#adm aside a.on{background:var(--main)}
#adm aside .sep{font-size:.75rem;opacity:.6;margin:12px 12px 4px}
#adm .badge{background:var(--bad);color:#fff;border-radius:10px;padding:0 7px;font-size:.75rem}
#adm main{flex:1;padding:18px 20px;min-width:0}
#adm h2{margin:0 0 12px}
#adm .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
#adm .bar input,#adm .bar select{width:auto;min-width:160px}
#adm .btn{min-height:38px;padding:4px 14px;font-size:.9rem;margin:0;border-radius:8px;gap:4px}
#adm .btn.ok{background:var(--ok);color:#fff}#adm .btn.bad{background:var(--bad);color:#fff}
#adm .btn.sm{min-height:30px;padding:2px 10px;font-size:.8rem}
#adm .btn:disabled{cursor:wait}
#adm .acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
#adm .stat{cursor:pointer;font-size:1rem}
#adm .stat b{font-size:2rem}#adm .stat.warn b{color:var(--bad)}
#adm .tw{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:auto}
#adm table{border-collapse:collapse;width:100%;font-size:.88rem}
#adm th,#adm td{padding:8px 10px;border-bottom:1px solid #e3eaef;text-align:left;vertical-align:top}
#adm th{background:#e8f0f5;position:sticky;top:0;white-space:nowrap}
#adm td.act{white-space:nowrap}
#adm .tag{font-size:.78rem;padding:0 9px}
#adm .clip{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#adm label{font-weight:700;margin-top:10px;font-size:.9rem}
#adm input,#adm select,#adm textarea{min-height:40px;padding:6px 10px;font-size:.95rem;border:1px solid #8aa;border-radius:8px;margin-top:3px}
#adm input[type=checkbox]{width:20px;min-height:20px;margin-right:6px}
#amodal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:120}
#amodal .box{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:680px;font-size:16px;line-height:1.5}
#amodal h3{margin:0 0 6px}
#amodal label{font-weight:700;margin-top:10px;font-size:.9rem}
#amodal input,#amodal select,#amodal textarea{min-height:40px;padding:6px 10px;font-size:.95rem;border:1px solid #8aa;border-radius:8px;margin-top:3px}
#amodal input[type=checkbox]{width:20px;min-height:20px;margin-right:6px}
#amodal .btn{min-height:38px;padding:4px 14px;font-size:.9rem;margin:0;border-radius:8px}
#amodal .up{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:3px}
#amodal .up img{height:54px;border-radius:6px;border:1px solid var(--line)}
.agate{padding:40px 20px;text-align:center;width:100%}
@media(max-width:800px){#adm{flex-direction:column}#adm aside{width:100%;height:auto;position:static;display:flex;flex-wrap:wrap}#adm aside h1,#adm aside .sep{width:100%}}

/* ===== 簽到頁（#ck） ===== */
#ck{display:none;min-height:100vh;font-size:18px;padding-bottom:30px;line-height:1.5}
#ck header{background:var(--dark);color:#fff;padding:12px 14px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
#ck header a{color:#fff;font-size:.85rem;font-weight:400}
#ck main{max-width:560px;margin:auto;padding:12px}
#ck .btn{display:flex;width:100%;min-height:56px;margin:8px 0}
#ck .prog{display:flex;justify-content:space-around;text-align:center}#ck .prog b{display:block;font-size:2rem;color:var(--main)}
#ck .card{padding:12px;margin-bottom:10px}
#ck_reader{border-radius:14px;overflow:hidden}
#ck_res{display:none;border-radius:16px;padding:18px;text-align:center;color:#fff;margin:10px 0}
#ck_res.ok{background:var(--ok)}#ck_res.dup{background:#b9770e}#ck_res.err{background:var(--bad)}
#ck_res .n{font-size:2rem;font-weight:800}
#ck_hist div{padding:8px 4px;border-bottom:1px solid #dde}
</style>
</head>
<body>

<!-- ================= 前台 ================= -->
<div id="pub">
  <header><div class="hd">
    <a class="logo" href="#/">🎗️ 台灣帕金森病友權益促進會</a>
    <nav id="nav">
      <a href="#/" data-k="home">首頁</a><a href="#/news" data-k="news">最新消息</a><a href="#/events" data-k="events">活動報名</a>
      <a href="#/resources" data-k="resources">衛教資源</a><a href="#/learn" data-k="learn">認識帕金森</a><a href="#/family" data-k="family">家屬專區</a>
      <a href="#/forum" data-k="forum">病友論壇</a><a href="#/donate" data-k="donate">愛心捐款</a><a href="#/about" data-k="about">關於協會</a>
    </nav>
    <div class="tools"><button onclick="fs(-1)" aria-label="縮小字體">A-</button><button onclick="fs(1)" aria-label="放大字體">A+</button>
      <button class="me" onclick="go('#/me')" id="meBtn">👤 會員中心</button>
      <button id="menuBtn" onclick="toggleDrawer()" aria-label="選單">☰</button></div>
  </div>
  <div id="drawer"></div></header>
  <main id="view">載入中…</main>
  <footer id="foot"></footer>
  <nav id="tabbar">
    <a href="#/" data-k="home"><span>🏠</span>首頁</a><a href="#/news" data-k="news"><span>📰</span>消息</a>
    <a href="#/events" data-k="events"><span>📅</span>活動</a><a href="#/forum" data-k="forum"><span>💬</span>論壇</a>
    <a href="#/me" data-k="me"><span>👤</span>我的</a>
  </nav>
</div>

<!-- ================= 管理後台 ================= -->
<div id="adm"><aside id="aside"></aside><main id="aapp"></main><div id="amodal"><div class="box" id="mbox"></div></div></div>

<!-- ================= 簽到頁 ================= -->
<div id="ck">
  <header><span>📲 活動簽到</span><a href="#/admin">回後台</a></header>
  <main>
    <label style="font-weight:800">選擇活動</label>
    <select id="ck_ev" onchange="ckEV=this.value;ckRefresh()"></select>
    <div class="card prog" style="margin-top:10px"><div><b id="ck_arr">0</b>已到人數</div><div><b id="ck_tot">0</b>報名人數</div></div>
    <div id="ck_res"></div>
    <button class="btn sec" id="ck_scanBtn" onclick="ckToggle()">📷 開啟相機掃描</button>
    <div id="ck_reader"></div>
    <details class="card"><summary style="font-weight:800;min-height:44px">手動輸入報到碼</summary>
      <input id="ck_manual" placeholder="貼上或輸入報到碼">
      <button class="btn gh" onclick="ckManual()">送出</button>
      <p class="muted">找不到 QR 時，請到「管理後台 → 報名名單」直接標記出席。</p></details>
    <h3>最近簽到</h3><div class="card" id="ck_hist">尚無</div>
  </main>
</div>

<div id="toast"></div>
<div id="qrbox" onclick="this.style.display='none'"><div class="in" onclick="event.stopPropagation()">
  <h3 id="qt" style="margin:0 0 4px"></h3><div id="qi" class="muted"></div>
  <canvas id="qc" style="margin:10px 0"></canvas>
  <div class="muted">請在活動現場出示給工作人員掃描</div>
  <button class="btn gh" onclick="$('#qrbox').style.display='none'">關閉</button></div></div>

<script>
/* ================= 設定（只需填這三個） ================= */
const API_URL = 'https://script.google.com/macros/s/AKfycbyVTWb2yxqaDeTmZ9Q0zdeR7l1EP7H5YmGYG5jRidjvuuUO-qgKrOgCS9ZzSk_Deb-J/exec';   // ← Apps Script 部署網址（/exec 結尾）
const LIFF_ID = '2009456572-mxeoY8wg';   // ← LIFF ID
const OA_ID   = '@115hyiab';   // ← 官方帳號 Basic ID，例如 @123abcde

/* ================= 共用 ================= */
let idToken = null, ME = null, CFG = {};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtD = d => d ? String(d).slice(0, 10) : '';
const num = n => Number(n || 0).toLocaleString();
const img = id => id ? `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w800` : '';
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '#';
let tt; function toast(m) { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(tt); tt = setTimeout(() => t.style.display = 'none', 3000); }
async function safe(fn) { try { await fn(); } catch (e) { toast(e.message); } }

let FS = Number(localStorage.fsm || 17);
function fs(d) { FS = Math.min(24, Math.max(15, FS + d)); localStorage.fsm = FS; document.documentElement.style.fontSize = FS + 'px'; }
fs(0);

async function api(action, params = {}) {
  if (!API_URL) throw new Error('尚未設定 API_URL');
  const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, params, idToken }) });
  const j = await res.json();
  if (!j.ok) {
    if (/過期|請先登入/.test(j.message || '') && LIFF_ID && typeof liff !== 'undefined') setTimeout(() => { liff.logout(); liff.login({ redirectUri: location.href }); }, 1200);
    throw new Error(j.message || '發生錯誤');
  }
  return j.data;
}
async function initLiff() {
  if (!LIFF_ID) return;
  try {
    await liff.init({ liffId: LIFF_ID });
    if (liff.isLoggedIn()) {
      idToken = liff.getIDToken();
      const p = await liff.getProfile();
      ME = await api('login', { displayName: p.displayName, pictureUrl: p.pictureUrl });
      $('#meBtn').textContent = '👤 ' + (ME.displayName || '會員中心');
    }
  } catch (e) { console.warn(e); }
}
function needLogin() {
  if (ME) return true;
  if (!LIFF_ID) { toast('尚未設定 LIFF_ID'); return false; }
  liff.login({ redirectUri: location.href }); return false;
}
const loginCard = () => `<div class="card form" style="text-align:center"><p>此功能需要先用 LINE 登入。</p><button class="btn" onclick="needLogin()">💚 使用 LINE 登入</button></div>`;
const isAdmin = () => ME && ME.role === 'admin';

const ST = { '已報名': ['', '已報名'], '已出席': ['g', '已出席'], '已取消': ['r', '已取消'], '待確認': ['y', '待確認'], '已確認': ['g', '已確認'], '待審': ['y', '審核中'], '啟用': ['g', '啟用'], '停用': ['r', '停用'] };
const tag = s => { const t = ST[s] || ['', s || '']; return `<span class="tag ${t[0]}">${esc(t[1])}</span>`; };
const BOARDS = ['新病友提問', '藥物與治療', '運動復健', '照顧者交流', '生活分享'];

const newsCard = n => `<a class="link" href="#/news/${esc(n.id)}"><div class="card">${n.coverId ? `<img class="cv" src="${img(n.coverId)}" alt="" loading="lazy">` : ''}
  <div>${n.pinned === 'Y' || n.pinned === true ? '📌 ' : ''}<span class="tag">${esc(n.category)}</span> <span class="muted">${fmtD(n.publishDate)}</span></div><b>${esc(n.title)}</b></div></a>`;
const eventCard = e => `<a class="link" href="#/events/${esc(e.id)}"><div class="card">${e.coverId ? `<img class="cv" src="${img(e.coverId)}" alt="" loading="lazy">` : ''}
  <b>${esc(e.title)}</b><div class="muted">📅 ${fmtD(e.date)}　📍 ${esc(e.location)}</div>
  ${e.remaining !== undefined ? (e.remaining < 1 ? '<span class="tag r">額滿</span>' : `<span class="tag g">剩 ${e.remaining} 名額</span>`) : ''}</div></a>`;

/* ================= 前台頁面 ================= */
const PAGES = {
  async home() {
    const h = await api('getHome'), s = h.stats;
    const stat = (n, l) => `<div class="stat"><b>${num(n)}</b>${l}</div>`;
    return `<div class="hero"><h1>${esc(CFG.slogan || '陪伴每一位帕友')}</h1><div>讓病友與家屬不孤單</div>
        <a class="go" href="#/events">📅 活動報名</a><a class="go w" href="#/resources">📚 衛教資源</a><a class="go w" href="#/donate">❤️ 愛心捐款</a></div>
      <div class="stats">${stat(s.members, '位會員')}${stat(s.events, '場活動')}${stat(s.participants, '人次參與')}${stat(s.groups, '個據點')}${stat(s.volunteers, '位志工')}${stat(s.resources, '份衛教資源')}</div>
      <div class="split"><div><h3>最新消息</h3><div class="cards2">${h.news.map(newsCard).join('') || '<p class="muted">尚無消息</p>'}</div>
        <a class="btn gh" href="#/news">看全部消息</a></div>
      <div><h3>近期活動</h3>${h.events.map(eventCard).join('') || '<p class="muted">近期沒有活動</p>'}<a class="btn gh" href="#/events">看全部活動</a></div></div>`;
  },
  async news() { const l = await api('getNews'); return `<h2>📰 最新消息</h2><div class="cards">${l.map(newsCard).join('') || '<p class="muted">尚無消息</p>'}</div>`; },
  async newsDetail(id) {
    const n = await api('getNewsDetail', { id });
    return `<a href="#/news">← 回消息列表</a><div class="card" style="margin-top:10px;max-width:820px">${n.coverId ? `<img class="cv" style="height:auto;max-height:380px" src="${img(n.coverId)}" alt="">` : ''}
      <span class="tag">${esc(n.category)}</span> <span class="muted">${fmtD(n.publishDate)}</span><h2>${esc(n.title)}</h2>
      <div class="pre">${esc(n.content)}</div>${n.attachUrl ? `<a class="btn sec" target="_blank" rel="noopener" href="${safeUrl(n.attachUrl)}">📎 下載附件</a>` : ''}</div>`;
  },
  async events() { const l = await api('getEvents'); return `<h2>📅 活動報名</h2><div class="cards">${l.map(eventCard).join('') || '<p class="muted">目前沒有活動</p>'}</div>`; },
  async eventDetail(id) {
    const e = await api('getEventDetail', { id });
    const closed = e.deadline && fmtD(e.deadline) < new Date().toISOString().slice(0, 10);

const go = h => { location.hash = h; };
window.toggleDrawer = () => { const d = $('#drawer'); d.style.display = d.style.display === 'block' ? 'none' : 'block'; };
function drawDrawer() {
  const L = [['#/', '🏠 首頁'], ['#/news', '📰 最新消息'], ['#/events', '📅 活動報名'], ['#/resources', '📚 衛教資源'], ['#/learn', '🧠 認識帕金森'], ['#/family', '🤝 家屬專區'],
    ['#/forum', '💬 病友論壇'], ['#/donate', '❤️ 愛心捐款'], ['#/about', '🏛️ 關於協會'], ['#/me', '👤 會員中心']];
  if (isAdmin()) L.push(['#/admin', '⚙️ 管理後台'], ['#/checkin', '📲 活動簽到']);
  $('#drawer').innerHTML = L.map(([h, n]) => `<a href="${h}" onclick="$('#drawer').style.display='none'">${n}</a>`).join('');
}
window.doRegister = id => safe(async () => {
  const b = $('#rbtn'); b.disabled = true;
  try {
    await api('registerEvent', { eventId: id, name: $('#r_name').value, phone: $('#r_phone').value, companions: $('#r_comp').value, note: $('#r_note').value });
    toast('✅ 報名成功！'); go('#/me');
  } finally { b.disabled = false; }
});
window.cancelReg = id => safe(async () => { if (!confirm('確定要取消報名嗎？')) return; await api('cancelRegistration', { id }); toast('已取消'); route(); });
window.showQR = id => safe(async () => {
  const r = await api('getCheckinCode', { id });
  $('#qt').textContent = r.title || '活動簽到';
  $('#qi').textContent = `${r.name}　共 ${r.people} 人${r.status === '已出席' ? '（已簽到）' : ''}`;
  await QRCode.toCanvas($('#qc'), r.code, { width: 260, margin: 2 });
  $('#qrbox').style.display = 'flex';
});
window.saveProfile = () => safe(async () => {
  const keep = ME.role;
  ME = await api('updateProfile', { name: $('#p_name').value, phone: $('#p_phone').value, email: $('#p_email').value, city: $('#p_city').value, identity: $('#p_id').value });
  if (!ME.role) ME.role = keep;
  toast('✅ 已儲存');
});
window.doPost = () => safe(async () => {
  const b = $('#fbtn'); b.disabled = true;
  try {
    await api('createPost', { board: $('#f_b').value, title: $('#f_t').value, content: $('#f_c').value });
    toast('已送出，審核通過後會顯示'); go('#/forum');
  } finally { b.disabled = false; }
});
window.doReply = id => safe(async () => { await api('createReply', { postId: id, content: $('#rp_c').value }); toast('✅ 已回覆'); route(); });
window.doDonate = () => safe(async () => {
  const b = $('#dbtn'); b.disabled = true;
  try {
    const rc = $('#d_rc').checked;
    if (rc && !$('#d_rt').value.trim()) throw new Error('請填寫收據抬頭');
    await api('createDonation', { name: $('#d_name').value, email: $('#d_email').value, amount: $('#d_amt').value, method: $('#d_m').value,
      receiptNeeded: rc, receiptTitle: $('#d_rt').value, taxId: $('#d_tax').value, address: $('#d_addr').value });
    toast('✅ 已登記，感謝您的愛心'); go('#/me');
  } finally { b.disabled = false; }
});

function readFile(file) {
  return new Promise((res, rej) => {
    if (!file.type.startsWith('image/') || file.type === 'image/gif') {
      const fr = new FileReader(); fr.onload = () => res({ b64: fr.result.split(',')[1], mime: file.type, name: file.name }); fr.onerror = rej; return fr.readAsDataURL(file);
    }
    const im = new Image(), url = URL.createObjectURL(file);
    im.onload = () => {
      const s = Math.min(1, 1600 / Math.max(im.width, im.height)), cv = document.createElement('canvas');
      cv.width = Math.round(im.width * s); cv.height = Math.round(im.height * s);
      cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      res({ b64: cv.toDataURL('image/jpeg', .85).split(',')[1], mime: 'image/jpeg', name: file.name.replace(/\.\w+$/, '') + '.jpg' });
    };
    im.onerror = () => rej(new Error('無法讀取圖片')); im.src = url;
  });
}

function beep(ok) {

    o.connect(c.destination); o.start(); setTimeout(() => o.stop(), ok ? 150 : 400); } catch (e) {}
  if (navigator.vibrate) navigator.vibrate(ok ? 80 : [200, 80, 200]);
}

async function ckSubmit(code) {

  if (code === lastCode && Date.now() - lastAt < 4000) return;
  ckBusy = true; lastCode = code; lastAt = Date.now();
  try {
    const r = await api('admin_checkin', { code, eventId: ckEV });
    beep(!r.already);
    ckShow(r.already ? 'dup' : 'ok', `<div>${r.already ? '⚠️ 已經簽到過了' : '✅ 簽到成功'}</div><div class="n">${esc(r.name)}</div><div>共 ${r.people} 人${r.note ? '<br>📝 ' + esc(r.note) : ''}</div>`);

    }

  } catch (e) { beep(false); lastCode = ''; ckShow('err', `<div class="n">❌</div>${esc(e.message)}`); }
  setTimeout(() => ckBusy = false, 800);
}

  if (adm) return openAdmin();
  if (ck) return openCk();
  document.querySelectorAll('#nav a,#tabbar a').forEach(a => a.classList.toggle('on', a.dataset.k === k));
  v.innerHTML = '<p class="muted">載入中…</p>';
  try {
    let html;
    if (k === 'home') html = await PAGES.home();
    else if (k === 'news') html = seg[1] ? await PAGES.newsDetail(seg[1]) : await PAGES.news();
    else if (k === 'events') html = seg[1] ? await PAGES.eventDetail(seg[1]) : await PAGES.events();
    else if (k === 'resources') html = await PAGES.resources(seg[1]);
    else if (k === 'forum') html = seg[1] === 'new' ? await PAGES.forumNew() : seg[1] === 'b' ? await PAGES.forum(seg[2]) : seg[1] ? await PAGES.forumDetail(seg[1]) : await PAGES.forum();
    else if (PAGES[k]) html = await PAGES[k]();
    else html = '<p>找不到頁面</p>';
    v.innerHTML = html;
  } catch (e) { v.innerHTML = `<div class="card"><b>載入失敗</b><div class="muted">${esc(e.message)}</div><button class="btn gh" onclick="route()">重新載入</button></div>`; }
}
addEventListener('hashchange', route);

(async () => {
  await initLiff();
  drawDrawer();
  try { CFG = await api('getConfig'); $('#foot').innerHTML = `${esc(CFG.phone || '')}　${esc(CFG.email || '')}　${esc(CFG.address || '')}<br><a href="#/privacy" style="color:#dce">隱私權政策</a>`; } catch (e) {}
  route();
})();
</script>
